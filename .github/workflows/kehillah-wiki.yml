name: Build and publish the player wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - 'docs/images/**'
      - 'scripts/kehillah_build_wiki.py'
      - 'scripts/kehillah_library_catalog.json'
      - 'localization/english/**'
      - 'common/domiciles/buildings/kehillah_domicile_buildings.txt'
      - '.github/workflows/kehillah-wiki.yml'
  pull_request:
    paths:
      - 'docs/wiki/**'
      - 'docs/images/**'
      - 'scripts/kehillah_build_wiki.py'
      - 'scripts/kehillah_library_catalog.json'
      - 'localization/english/**'
      - 'common/domiciles/buildings/kehillah_domicile_buildings.txt'
      - '.github/workflows/kehillah-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check every local link
        run: python scripts/kehillah_build_wiki.py --output _wiki_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _wiki_site
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy wiki to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
