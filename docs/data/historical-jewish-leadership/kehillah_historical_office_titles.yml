# STAGED DATA ONLY. This title-history map is deliberately outside both
# common/landed_titles and history/titles. Its holders are undated source-map
# records, so loading it would recreate the no-birth errors documented in
# docs/testing/2026-10-18-historical-leadership-roster-live-boot.md.
#
# The keys below are proposed institutional title IDs, not existing playable
# community titles. This distinction is load-bearing:
# - d_kehillah_baghdad is the 1066 community led by the Exilarch, but the
#   historical Exilarchate is older than Baghdad and is not identical to one
#   city's Kehillah.
# - d_kehillah_sura is a deliberately revived 1066 community/academy model,
#   while the historical academy had ended before 1066.
# - d_kehillah_jerusalem is the 1066 community led by the Palestinian Gaon,
#   while the academy later moved to Tyre and Fustat.
# - Pumbedita's gaon is a Rosh Yeshiva court position under Baghdad's Exilarch
#   in the current 1066 model, not the holder of d_kehillah_baghdad.
#
# Holder order follows the researched roster. Approximate terms remain beside
# the character records in the companion .txt files; this map does not turn
# circa dates or office years into exact CK3 dates.

