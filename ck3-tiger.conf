# ck3-tiger config for this mod. See docs/testing/automation-shim-guide.md
# for how this is used in the testing workflow.

filter = {
	show_vanilla = no
	show_loaded_mods = no

	trigger = {
		# common/laws/00_succession_laws.txt is a full verbatim copy of
		# vanilla's file with exactly one law block appended at the end
		# (see that file's own header comment for why -- CK3 law groups
		# are keyed top-level objects, so a partial override would
		# delete every other succession law in the game). These three
		# findings are all inside the untouched vanilla portion, not
		# anything this mod added -- confirmed by diffing against the
		# installed game's copy of the file, 2026-09-08. Fixing them
		# would mean the file is no longer a verbatim vanilla copy,
		# breaking the "nothing above this comment has been modified"
		# invariant that makes re-syncing against future game patches
		# tractable. Scoped narrowly (key + file + message text) so a
		# real future problem in this mod's own appended law block would
		# still be reported.
		NOT = {
			OR = {
				AND = {
					key = field-missing
					file = common/laws/00_succession_laws.txt
					text = "required field"
				}
				AND = {
					key = unknown-field
					file = common/laws/00_succession_laws.txt
					text = "custom_tooltip"
				}
			}
		}
	}
}
