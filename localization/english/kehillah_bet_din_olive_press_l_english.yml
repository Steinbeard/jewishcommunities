l_english:
 kehillah_bet_din.0401.t:0 "The Broken Olive Press"
 kehillah_bet_din.0401.desc:0 "[kbd_litigant_a.GetFirstName] owns an olive press lent for the harvest. [kbd_litigant_b.GetFirstName] rented it, and the axle broke before half the olives were pressed. The owner blames rough handling; the renter says the wood was already split. Waiting for judgment spoils fruit on both sides."
 kehillah_bet_din.0401.a:0 "Charge the renter for a new axle."
 kehillah_bet_din.0401.a.tt:0 "Work resumes quickly, but an old flaw would make the renter pay for someone else's wear."
 kehillah_bet_din.0401.b:0 "Repair the press now and inspect the broken wood."
 kehillah_bet_din.0401.b.tt:0 "An immediate repair saves fruit while the cause is examined at shared expense."
 kehillah_bet_din.0401.c:0 "Make the owner bear the repair alone."
 kehillah_bet_din.0401.c.tt:0 "The renter is relieved, but proof of misuse would leave the owner unfairly burdened."
 kehillah_din_source_40:0 "Cite a mastered Nezikin work and inspect the hired press."
 kehillah_din_source_40_tt:0 "Mishnah Bava Metzia 8:9 concerns obligations in a hire. It does not reveal what broke this axle."
 kehillah_din_combo_40:0 "Have a scholar and steward inspect the press before assigning costs."
 kehillah_din_combo_40_tt:0 "The judges save the harvest while determining ordinary wear or misuse."
 kehillah_bet_din.0404.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0404.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0404.outcome_1:0 "The court charges the renter and orders a replacement axle."
 kehillah_bet_din.0404.outcome_2:0 "The court advances a repair and asks woodworkers to inspect the split."
 kehillah_bet_din.0404.outcome_3:0 "The court makes the owner pay for the damage."
 kehillah_bet_din.0404.fact_true:0 "The axle had an old internal crack. Charging the renter treated ordinary wear as misuse."
 kehillah_bet_din.0404.fact_false:0 "Tool marks show the renter forced the press beyond its agreed load. The owner should not bear the whole repair."
 kehillah_bet_din.0404.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0404.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0404.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case40_one_tt:0 "A quick replacement costs substantial Prosperity."
 kehillah_din_case40_two_tt:0 "Repair and inspection cost some Prosperity."
 kehillah_din_case40_three_tt:0 "Owner payment costs less court money but may misplace liability."
 kehillah_bet_din_case40_great_log_title:0 "The Broken Olive Press: a well-supported ruling"
 kehillah_bet_din_case40_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s broken press."
 kehillah_bet_din_case40_good_log_title:0 "The Broken Olive Press: a workable ruling"
 kehillah_bet_din_case40_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s broken press."
