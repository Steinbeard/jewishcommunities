l_english:
 kehillah_bet_din.0421.t:0 "The Smoke From the Bakery"
 kehillah_bet_din.0421.desc:0 "[kbd_litigant_a.GetFirstName] runs a bakery newly fitted with a larger oven. [kbd_litigant_b.GetFirstName] speaks for neighbors whose rooms now fill with soot. The bakers have worked here for years, but the old oven smoked less. A mason proposes a flue; no one knows whether it will clear the rooms."
 kehillah_bet_din.0421.a:0 "Keep the new oven running without a change."
 kehillah_bet_din.0421.a.tt:0 "Bread and wages continue, but a failed vent could leave neighbors bearing the soot."
 kehillah_bet_din.0421.b:0 "Trial the flue and inspect nearby rooms."
 kehillah_bet_din.0421.b.tt:0 "A trial costs money and a few baking days, yet tests a workable repair."
 kehillah_bet_din.0421.c:0 "Close the enlarged oven and return to the old hearth."
 kehillah_bet_din.0421.c.tt:0 "Neighbors get relief, but a sound flue could save the bakery without closure."
 kehillah_din_source_42:0 "Cite a mastered Nezikin work and inspect the smoke."
 kehillah_din_source_42_tt:0 "Mishnah Bava Batra 2:3 discusses neighbor use and nuisance. The court must test this oven's smoke in its actual rooms."
 kehillah_din_combo_42:0 "Have a scholar and steward inspect the oven during baking."
 kehillah_din_combo_42_tt:0 "The judges compare the bakery's livelihood with the neighbors' rooms."
 kehillah_bet_din.0424.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0424.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0424.outcome_1:0 "The court lets the larger oven run without altering its flue."
 kehillah_bet_din.0424.outcome_2:0 "The court funds a flue trial and checks the neighboring rooms after baking."
 kehillah_bet_din.0424.outcome_3:0 "The court shuts the new oven and limits work to the old hearth."
 kehillah_bet_din.0424.fact_true:0 "The trial flue cannot carry the smoke away. Leaving the enlarged oven untouched prolonged the harm."
 kehillah_bet_din.0424.fact_false:0 "The mason's flue clears the rooms. Closing the new oven would have sacrificed a workable bakery."
 kehillah_bet_din.0424.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0424.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0424.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case42_one_tt:0 "Unchanged smoke costs substantial Stability."
 kehillah_din_case42_two_tt:0 "A flue trial and inspection cost some Stability."
 kehillah_din_case42_three_tt:0 "Closure costs less now but may waste a practical repair."
 kehillah_bet_din_case42_great_log_title:0 "The Smoke From the Bakery: a well-supported ruling"
 kehillah_bet_din_case42_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s bakery-smoke complaint."
 kehillah_bet_din_case42_good_log_title:0 "The Smoke From the Bakery: a workable ruling"
 kehillah_bet_din_case42_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s bakery-smoke complaint."
 kehillah_bet_din_case42_poor_log_title:0 "The Smoke From the Bakery: a disputed ruling"
 kehillah_bet_din_case42_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s bakery-smoke complaint."
