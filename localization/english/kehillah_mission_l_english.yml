l_english:
 kehillah_mission.0001.t:0 "The Disputation"
 kehillah_mission.0001.desc_friar:0 "[kehillah_friar.GetFirstName] was born a Jew and studied in our houses of learning. Now he wears a friar's habit, and he has asked [kehillah_mission_host.GetTitledFirstName] to summon the Jews of [kehillah_mission_town.GetName] to a disputation. He will prove from our own books, he says, that the Messiah has come, and that the Talmud blasphemes Christ."
 kehillah_mission.0001.desc_monk:0 "[kehillah_friar.GetFirstName] was born a Jew and studied in our houses of learning. Now he has taken the cowl, and he has asked [kehillah_mission_host.GetTitledFirstName] to summon the Jews of [kehillah_mission_town.GetName] to a disputation. He will prove from our own books, he says, that the Messiah has come."
 kehillah_mission.0001.desc_champion:0 "\n\nThe community has chosen [kehillah_disputant.GetTitledFirstName] to answer him. Whatever is said in that hall will be repeated from every pulpit in the realm, and the lord will be the judge."
 kehillah_mission.0001.a:0 "Answer him point by point, and do not spare him."
 kehillah_mission.0001.b:0 "Answer carefully, and give him nothing to seize on."
 kehillah_mission.0001.c:0 "Pay [kehillah_mission_host.GetFirstName] to excuse us from it."
 kehillah_mission_disputation_won:0 "He is confounded before the court"
 kehillah_mission_disputation_held:0 "Nothing is conceded"
 kehillah_mission_disputation_lost:0 "He carries the day"
 kehillah_mission_bold_won_tt:0 "[kehillah_mission_host.GetTitledFirstName] is impressed despite [kehillah_mission_host.GetHerHim]self, and the faith's anger at the Jews cools a little."
 kehillah_mission_bold_lost_tt:0 "[kehillah_mission_host.GetTitledFirstName] thinks worse of the Jews, and the faith hardens against them. Under a Christian charter, our books will be censored more strictly."
 kehillah_mission_cautious_lost_tt:0 "[kehillah_mission_host.GetTitledFirstName] thinks a little worse of the Jews."
 kehillah_mission_excused_tt:0 "[kehillah_mission_host.GetTitledFirstName] takes the silver, but is sorry to lose the spectacle."
 kehillah_mission.0002.t:0 "After the Disputation"
 kehillah_mission.0002.won:0 "Before the lord and his court, the convert's proofs fell apart one by one. The community's champion is spoken of in every Jewish quarter of the region, and some of the court went home thinking."
 kehillah_mission.0002.held:0 "The disputation ended without a victor. Nothing was conceded, and nothing was lost. Some in the community wish more had been said."
 kehillah_mission.0002.lost:0 "The court declared for the convert. There is talk of burning the community's books."
 kehillah_mission.0002.a:0 "We endure."
 kehillah_mission.0010.t:0 "Friars in the Synagogue"
 kehillah_mission.0010.t_priests:0 "A Sermon in the Synagogue"
 kehillah_mission.0010.desc:0 "By order of [kehillah_mission_host.GetTitledFirstName], the Jews of [kehillah_mission_town.GetName] must gather in the synagogue on the Sabbath to hear the friars preach. They have climbed onto the bimah, beside the open Torah, and they are calling on the congregation to be baptized."
 kehillah_mission.0010.desc_priests:0 "By order of [kehillah_mission_host.GetTitledFirstName], the Jews of [kehillah_mission_town.GetName] must gather in the synagogue on the Sabbath to hear [kehillah_mission_host.GetHerHis] priests. One has climbed onto the bimah, beside the open Torah, and is calling on the congregation to be baptized."
 kehillah_mission.0010.a:0 "Sit in silence until they are gone."
 kehillah_mission.0010.b:0 "Answer them from the Torah."
 kehillah_mission.0010.c:0 "Pay them to preach elsewhere."
 kehillah_mission_silence_held:0 "The congregation holds"
 kehillah_mission_silence_convert:0 "Someone listens too well"
 kehillah_mission_convert_tt:0 "One of the household goes over to the Church."
 kehillah_mission_sermon_answered:0 "The preachers leave, outargued"
 kehillah_mission_sermon_offended:0 "The preachers complain to the lord"
 kehillah_mission_offended_tt:0 "[kehillah_mission_host.GetTitledFirstName] thinks worse of the Jews, and the faith hardens against them."
 kehillah_mission_bribed_tt:0 "[kehillah_mission_host.GetTitledFirstName] hears of it, and thinks a little worse of the Jews."
