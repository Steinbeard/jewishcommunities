l_english:
 kehillah_mission.0001.t:0 "The Disputation"
 kehillah_mission.0001.desc:0 "[kehillah_friar.GetFirstName], a convert who now wears a friar's habit, has asked [kehillah_mission_host.GetTitledFirstName] to summon the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] to a disputation: he will prove from their own books that the Messiah has come, and that the Talmud blasphemes. \n\nThe community has chosen [kehillah_disputant.GetTitledFirstName] (learning [kehillah_disputant.GetSkill( 'learning' )]) to answer him; the friar's learning is [kehillah_friar.GetSkill( 'learning' )]. A bold defence could win the lord's respect, or put the Talmud itself on trial."
 kehillah_mission.0001.a:0 "Answer him boldly, point by point."
 kehillah_mission.0001.b:0 "Answer carefully, and give him nothing to seize on."
 kehillah_mission.0001.c:0 "Pay the lord to excuse us from it."
 kehillah_mission_disputation_won:0 "The friar is confounded"
 kehillah_mission_disputation_held:0 "Nothing is conceded"
 kehillah_mission_disputation_lost:0 "The friar carries the day"
 kehillah_mission_bold_won_tt:0 "Greatness #P +60#!; the lord's outlook on the Jews #P +5#!; the faith's pressure against the Jews eases"
 kehillah_mission_bold_lost_tt:0 "Greatness #N -30#!, Stability #N -40#!; the lord's outlook #N -5#!; the faith hardens; under a Christian charter, the Talmud is put on trial (the text term #N one step stricter#!)"
 kehillah_mission_cautious_held_tt:0 "Greatness #P +20#!"
 kehillah_mission_cautious_lost_tt:0 "Stability #N -20#!; the lord's outlook #N -2#!"
 kehillah_mission_excused_tt:0 "Greatness #N -10#!; the lord, denied his spectacle: outlook #N -2#!"
 kehillah_mission.0002.t:0 "After the Disputation"
 kehillah_mission.0002.won:0 "Before the lord and his court, the friar's proofs fell apart one by one. The community's champion is spoken of in every Jewish quarter of the region."
 kehillah_mission.0002.held:0 "The disputation ended without a victor. Nothing was conceded, and nothing was lost."
 kehillah_mission.0002.lost:0 "The court declared for the friar. There is talk of burning the community's books."
 kehillah_mission.0002.a:0 "We endure."
 kehillah_mission.0010.t:0 "Friars in the Synagogue"
 kehillah_mission.0010.desc:0 "By order of [kehillah_mission_host.GetTitledFirstName], the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] must assemble on the Sabbath to hear the friars preach. They mount the bimah and call on the congregation to accept baptism."
 kehillah_mission.0010.a:0 "Sit in silence until they are gone."
 kehillah_mission.0010.b:0 "Answer them from the Torah."
 kehillah_mission.0010.c:0 "Pay the friars to preach elsewhere."
 kehillah_mission_silence_tt:0 "Stability #N -20#!; someone may listen too well, and convert"
 kehillah_mission_sermon_answered:0 "The friars leave, outargued"
 kehillah_mission_sermon_offended:0 "The friars complain to the lord"
 kehillah_mission_answered_tt:0 "Greatness #P +20#!"
 kehillah_mission_offended_tt:0 "Stability #N -30#!; the lord's outlook #N -5#!; the faith hardens"
 kehillah_mission_bribed_tt:0 "The lord hears of it: outlook #N -1#!"
