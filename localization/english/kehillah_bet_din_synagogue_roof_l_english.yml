l_english:
 kehillah_bet_din.0221.t:0 "The Synagogue Roof and the Sacred Fund"
 kehillah_bet_din.0221.desc:0 "[kbd_litigant_a.GetFirstName] speaks for worshippers who want the leaking synagogue roof repaired before the rains. [kbd_litigant_b.GetFirstName] keeps a charitable fund whose donor may have reserved it for the poor. The deed is stored elsewhere. A dry room matters, but so does the promise under which the money was given."
 kehillah_bet_din.0221.a:0 "Repair the roof from the sacred fund now."
 kehillah_bet_din.0221.a.tt:0 "Work begins at once. If the donor reserved the money for relief, the court spends it against that purpose."
 kehillah_bet_din.0221.b:0 "Patch the roof and inspect the donor's deed."
 kehillah_bet_din.0221.b.tt:0 "A temporary covering protects services while the court learns which funds may pay for permanent work."
 kehillah_bet_din.0221.c:0 "Leave the fund untouched and seek new subscriptions."
 kehillah_bet_din.0221.c.tt:0 "The donor's money is safe, but the roof keeps leaking while the community raises another fund."
 kehillah_din_source_22:0 "Cite a mastered Moed work and examine the fund's purpose."
 kehillah_din_source_22_tt:0 "Mishnah Megillah discusses communal property and its proceeds. It cannot reveal this donor's terms; the court must read the deed."
 kehillah_din_combo_22:0 "Ask a scholar and steward to inspect the deed and roof together."
 kehillah_din_combo_22_tt:0 "The judges protect services with a temporary patch while checking the gift's permitted uses."
 kehillah_bet_din.0224.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0224.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0224.outcome_1:0 "The court releases money for a permanent roof. Workers arrive quickly, while the treasurer waits for the missing deed."
 kehillah_bet_din.0224.outcome_2:0 "The court orders a temporary covering and sends for the deed before committing the charitable fund."
 kehillah_bet_din.0224.outcome_3:0 "The court leaves the fund closed and asks households to subscribe for the repair. Rain still enters the synagogue."
 kehillah_bet_din.0224.fact_true:0 "The deed reserves the fund for poor relief. Spending it on the roof would break the donor's direction."
 kehillah_bet_din.0224.fact_false:0 "The deed permits repairs. The long subscription drive delayed work the fund could have paid for."
 kehillah_bet_din.0224.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0224.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0224.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case22_one_tt:0 "The fund pays for construction at a high Prosperity cost."
 kehillah_din_case22_two_tt:0 "A temporary patch and deed search cost some Prosperity."
 kehillah_din_case22_three_tt:0 "Subscriptions cost less now, while the roof continues to leak."
 kehillah_bet_din_case22_great_log_title:0 "The Synagogue Roof and the Sacred Fund: a well-supported ruling"
 kehillah_bet_din_case22_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s synagogue roof petition."
 kehillah_bet_din_case22_good_log_title:0 "The Synagogue Roof and the Sacred Fund: a workable ruling"
 kehillah_bet_din_case22_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s synagogue roof petition."
 kehillah_bet_din_case22_poor_log_title:0 "The Synagogue Roof and the Sacred Fund: a disputed ruling"
 kehillah_bet_din_case22_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s synagogue roof petition."
