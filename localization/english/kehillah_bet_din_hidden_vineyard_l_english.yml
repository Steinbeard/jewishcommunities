l_english:
 kehillah_bet_din.0351.t:0 "The Estate's Hidden Vineyard"
 kehillah_bet_din.0351.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a son who says his father gave him a vineyard beyond the town wall. [kbd_litigant_b.GetFirstName] speaks for siblings who found it missing from the estate inventory. The son has a key and has paid its workers; no signed gift has appeared. Harvest is near, and the court must decide who may use the land while title is examined."
 kehillah_bet_din.0351.a:0 "Give the son the vineyard before harvest."
 kehillah_bet_din.0351.a.tt:0 "The work continues, but an unproved gift could deny the siblings their share."
 kehillah_bet_din.0351.b:0 "Hold the fruit and seek the gift witnesses."
 kehillah_bet_din.0351.b.tt:0 "The court spends money to preserve the crop while it checks title."
 kehillah_bet_din.0351.c:0 "Divide the vineyard among the heirs now."
 kehillah_bet_din.0351.c.tt:0 "The siblings gain a share, but a real gift could be undone by a premature division."
 kehillah_din_source_35:0 "Cite a mastered Nezikin work and examine the gift claim."
 kehillah_din_source_35_tt:0 "Mishnah Bava Batra 3:1 addresses claims to land and possession. The son's key is not, by itself, proof of this gift."
 kehillah_din_combo_35:0 "Have a scholar and steward preserve the crop while checking title."
 kehillah_din_combo_35_tt:0 "The judges record the harvest and hear witnesses before changing ownership."
 kehillah_bet_din.0354.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0354.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0354.outcome_1:0 "The court gives the son the keys and the coming harvest."
 kehillah_bet_din.0354.outcome_2:0 "The court holds the harvest for the estate and asks the named witnesses to appear."
 kehillah_bet_din.0354.outcome_3:0 "The court divides title among the heirs before the vines are picked."
 kehillah_bet_din.0354.fact_true:0 "The alleged gift has no witness or deed. Awarding the vineyard alone would have taken estate property from the siblings."
 kehillah_bet_din.0354.fact_false:0 "Two witnesses confirm the father's gift. Dividing the vineyard ignored his valid direction."
 kehillah_bet_din.0354.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0354.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0354.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case35_one_tt:0 "Immediate possession costs substantial Prosperity."
 kehillah_din_case35_two_tt:0 "Preserving the crop and examining title cost some Prosperity."
 kehillah_din_case35_three_tt:0 "Division costs less now but may undo a real gift."
 kehillah_bet_din_case35_great_log_title:0 "The Estate's Hidden Vineyard: a well-supported ruling"
 kehillah_bet_din_case35_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s vineyard claim."
 kehillah_bet_din_case35_good_log_title:0 "The Estate's Hidden Vineyard: a workable ruling"
 kehillah_bet_din_case35_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s vineyard claim."
 kehillah_bet_din_case35_poor_log_title:0 "The Estate's Hidden Vineyard: a disputed ruling"
 kehillah_bet_din_case35_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s vineyard claim."
