l_english:
 # Kashrut (2026-11-23). docs/spec/2026-11-23-kashrut.md.
 doctrine_diet_kashrut_name:0 "Kashrut"
 doctrine_diet_kashrut_descriptive_name:0 "$doctrine_diet_kashrut_name$"
 doctrine_diet_kashrut_desc:0 "The Torah sets apart what may be eaten: beasts that chew the cud and part the hoof, slaughtered by a trained hand and salted of their blood; fish with fins and scales; and never meat cooked with milk."
 doctrine_parameter_kehillah_kashrut:0 "A Jewish quarter buys [GetTradeGoodType('trade_good_cattle').GetName] for its shochet and [GetTradeGoodType('trade_good_salt').GetName] for koshering, rather than meat; its slaughterhouse sells the meat Jews may not eat to the town"
 kehillah_kashrut_jewish_only:0 "Only a Jewish faith keeps Kashrut"
 kehillah_bd_kosher_table_neg:0 "\n  The market lacks beasts for the shochet or salt for koshering: #N [ROOT.Char.MakeScope.ScriptValue('kehillah_bd_kosher_table_value')|0]#!"
 kehillah_bd_kosher_table_pos:0 "\n  Our butchers keep a kosher table: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_kosher_table_value')|0]#!"
