l_english:
 kehillah_bet_din.0541.t:0 "The Appointment by Hereditary Claim"
 kehillah_bet_din.0541.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a former leader's son, who says the office passed with his father's name. [kbd_litigant_b.GetFirstName] speaks for elders who chose another candidate. The son knows the work; the chosen candidate has supporters. The old charter has not been read since the founder's day."
 kehillah_bet_din.0541.a:0 "Seat the son in his father's office now."
 kehillah_bet_din.0541.a.tt:0 "A familiar hand takes charge, but an elective charter would make the appointment improper."
 kehillah_bet_din.0541.b:0 "Keep a temporary officer and read the founding charter."
 kehillah_bet_din.0541.b.tt:0 "The office keeps working while the court checks its founding terms."
 kehillah_bet_din.0541.c:0 "Confirm the elders' candidate and dismiss the family claim."
 kehillah_bet_din.0541.c.tt:0 "The elders' choice stands, but a hereditary charter could be broken."
 kehillah_din_source_54:0 "Cite a mastered Nezikin work and inspect the office's charter."
 kehillah_din_source_54_tt:0 "Mishnah Sanhedrin 3:1 offers an analogy for selecting judges. It cannot set this office's succession rule."
 kehillah_din_combo_54:0 "Have a scholar and steward preserve the seal while checking the charter."
 kehillah_din_combo_54_tt:0 "The judges keep collections orderly while testing both claims."
 kehillah_bet_din.0544.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0544.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0544.outcome_1:0 "The court seats the son and gives him the communal seal."
 kehillah_bet_din.0544.outcome_2:0 "The court appoints a temporary keeper of the seal while the charter is read."
 kehillah_bet_din.0544.outcome_3:0 "The court confirms the elders' candidate."
 kehillah_bet_din.0544.fact_true:0 "The charter requires election by elders. Seating the son ignored that term."
 kehillah_bet_din.0544.fact_false:0 "The charter names the founder's heirs. Dismissing the son disregarded its grant."
 kehillah_bet_din.0544.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0544.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0544.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case54_one_tt:0 "Immediate installation costs substantial Stability."
 kehillah_din_case54_two_tt:0 "A temporary office costs some Stability."
 kehillah_din_case54_three_tt:0 "Confirmation costs less now but may violate the charter."
 kehillah_bet_din_case54_great_log_title:0 "The Appointment by Hereditary Claim: a well-supported ruling"
 kehillah_bet_din_case54_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s office claim."
