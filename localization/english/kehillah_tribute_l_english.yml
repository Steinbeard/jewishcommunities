l_english:
 # The tribute a Kehillah pays its host (v31 §8.2), 2026-10-30.
 # Charter term (kehillah_host_charter_tribute_contracts.txt).
 kehillah_charter_tribute:0 "Tribute"
 kehillah_tribute_none:0 "No Tribute"
 kehillah_tribute_none_short:0 "None"
 kehillah_tribute_none_desc:0 "#emphasis #bold Community Privileges:#!#!\n$EFFECT_LIST_BULLET$ The community pays the host no tribute\n\n#flavor The host asks nothing of what the community earns.#!"
 kehillah_tribute_customary:0 "Customary Tribute"
 kehillah_tribute_customary_short:0 "Customary"
 kehillah_tribute_customary_desc:0 "#emphasis #bold Community Obligations:#!#!\n$EFFECT_LIST_BULLET$ Each quarter the community pays the host #high [EmptyScope.ScriptValue('kehillah_tribute_customary_percent')|0]%#! of its income\n$EFFECT_LIST_BULLET$ The share is higher while a Nagid sits at the realm's court\n\n#flavor The community pays the customary due, a share of what it earns, into the host's treasury.#!"
 kehillah_tribute_heavy:0 "Heavy Tribute"
 kehillah_tribute_heavy_short:0 "Heavy"
 kehillah_tribute_heavy_desc:0 "#emphasis #bold Community Obligations:#!#!\n$EFFECT_LIST_BULLET$ Each quarter the community pays the host #high [EmptyScope.ScriptValue('kehillah_tribute_heavy_percent')|0]%#! of its income\n$EFFECT_LIST_BULLET$ The share is higher while a Nagid sits at the realm's court\n\n#flavor The host presses the community for a heavier share of its earnings.#!"

 # My Realm > Domain, Monthly Income, gold tile.
 # 2026-11-11: back to the quarterly scripted transfer (the engine tax
 # charged nothing), so the line shows the rate and the monthly share,
 # and the tooltip says the top-bar total does not include it.
 KEHILLAH_DOMAIN_INCOME_GOLD_HOST:0 "#weak Tribute [Character.MakeScope.ScriptValue('kehillah_tribute_rate_percent_value')|0]%#! [Character.MakeScope.ScriptValue('kehillah_tribute_monthly_shown_value')|=+2]"
 KEHILLAH_DOMAIN_INCOME_GOLD_HOST_TOOLTIP:0 "#T Tribute#!\nThe host takes [Character.MakeScope.ScriptValue('kehillah_tribute_rate_percent_value')|0]% of the community's income, by the Tribute term of the Host Charter: about [Character.MakeScope.ScriptValue('kehillah_tribute_monthly_value')|2] gold a month.\n\n#weak It is paid in one sum each quarter, so the monthly totals above and in the top bar do not include it.#!"
 kehillah_government_tax_contribution_mult:0 "Jewish community [tax|E] [modifier_contribution|E]"
 kehillah_nagid_tribute_modifier:0 "Nagid's Tribute"
 kehillah_nagid_tribute_modifier_desc:0 "A Nagid sits at this court as the crown's fiscal agent, and the realm's Jewish communities pay a larger tribute."
