l_english:
 # Jewish Settlement Policy as a realm law, 2026-10-28.
 # docs/spec/2026-10-28-jewish-settlement-law.md
 kehillah_jewish_settlement:0 "Jewish Settlement"

 kehillah_jewish_settlement_banned:0 "Jewish Settlement Banned"
 kehillah_jewish_settlement_banned_effects:0 "$EFFECT_LIST_BULLET$ No Jewish community may be founded in the realm\n$EFFECT_LIST_BULLET$ Every community in the realm receives an #N edict of expulsion#!, with a year's grace to answer it\n$EFFECT_LIST_BULLET$ $kehillah_jewish_settlement_rung_rules$"

 kehillah_jewish_settlement_discouraged:0 "Jewish Settlement Discouraged"
 kehillah_jewish_settlement_discouraged_effects:0 "$EFFECT_LIST_BULLET$ No new Jewish community may be founded in the realm\n$EFFECT_LIST_BULLET$ Charters offer only limited rights\n$EFFECT_LIST_BULLET$ Leaving #N Banned#! for this withdraws every pending edict of expulsion\n$EFFECT_LIST_BULLET$ $kehillah_jewish_settlement_rung_rules$"

 kehillah_jewish_settlement_allowed:0 "Jewish Settlement Allowed"
 kehillah_jewish_settlement_allowed_effects:0 "$EFFECT_LIST_BULLET$ Jewish adventurers may found communities in the realm\n$EFFECT_LIST_BULLET$ Charters offer ordinary rights\n$EFFECT_LIST_BULLET$ $kehillah_jewish_settlement_rung_rules$"

 kehillah_jewish_settlement_encouraged:0 "Jewish Settlement Encouraged"
 kehillah_jewish_settlement_encouraged_effects:0 "$EFFECT_LIST_BULLET$ Jewish adventurers are keener to found communities in the realm\n$EFFECT_LIST_BULLET$ Charters offer their most generous terms\n$EFFECT_LIST_BULLET$ An #P invitation#! goes out to Jewish communities within reach, drawing settlers for years to come\n$EFFECT_LIST_BULLET$ $kehillah_jewish_settlement_rung_rules$"

 kehillah_jewish_settlement_rung_rules:0 "Changes one step at a time, at most once every five years. Raising it costs piety and displeases your court chaplain; lowering it earns piety. The realm's communities hear of every change, and their Charters are revised to match."
