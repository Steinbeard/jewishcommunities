 # What the town is saying (KehillahCrisisCauseDesc)
 kehillah_crisis_cause_blood_libel_desc:0 "A Christian child is dead, and the town says the Jews killed the child for their rites."
 kehillah_crisis_cause_mockery_desc:0 "The town says the Jews mocked an image of the crucified Christ."
 kehillah_crisis_cause_desecration_desc:0 "The town says the Jews stabbed a consecrated Host until it bled."
 kehillah_crisis_cause_blasphemy_desc:0 "The street says a Jew cursed the Prophet."
 kehillah_crisis_cause_accusation_desc:0 "A charge against the community has been repeated in the market until rumor sounds like testimony."
 kehillah_crisis_cause_crusade_desc:0 "Men who have taken the cross are turning their zeal on the Jews before they march."
 kehillah_crisis_cause_holy_week_desc:0 "Holy Week sermons on the Passion have turned the town's anger toward the Jews."
 kehillah_crisis_cause_debts_desc:0 "After hard times, those in debt to Jewish lenders would rather be rid of the lenders than the debts."
 kehillah_crisis_cause_vizier_desc:0 "Resentment of a Jew's power at court has passed from the palace into the streets."
 kehillah_crisis_cause_preacher_desc:0 "A preacher is rallying the town against the Jewish quarter."
 kehillah_crisis_cause_generic_desc:0 "Words against the quarter have found an audience in the town."

 # Who is behind it
