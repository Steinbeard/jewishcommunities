 kehillah_host_mood_warmer_t:0 "The Lord Grows Warmer"
 kehillah_host_mood_warmer_d:0 "[kehillah_mood_host.GetTitledFirstName] has grown warmer toward the Jews. [kehillah_mood_host.GetHerHis|U] outlook on them is now [kehillah_mood_host.Custom('KehillahOutlookBand')] ([kehillah_mood_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0]).[kehillah_mood_host.Custom('KehillahOutlookBdTeaching')][kehillah_mood_host.Custom('KehillahOutlookBdZeal')][kehillah_mood_host.Custom('KehillahOutlookBdCharacter')][kehillah_mood_host.Custom('KehillahOutlookBdLearning')][kehillah_mood_host.Custom('KehillahOutlookBdCourt')][kehillah_mood_host.Custom('KehillahOutlookBdDebts')][kehillah_mood_host.Custom('KehillahOutlookBdRelations')][kehillah_mood_host.Custom('KehillahOutlookBdCrusade')][kehillah_mood_host.Custom('KehillahOutlookBdHistory')] \n\n#weak A lord's outlook moves with his faith's teaching, his chaplain's sermons, the Jews he counts as friends or rivals, Jews in his service, his debts, and crusades.#!"
 kehillah_host_mood_colder_t:0 "The Lord Grows Colder"
 kehillah_host_mood_colder_d:0 "[kehillah_mood_host.GetTitledFirstName] has grown colder toward the Jews. [kehillah_mood_host.GetHerHis|U] outlook on them is now [kehillah_mood_host.Custom('KehillahOutlookBand')] ([kehillah_mood_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0]).[kehillah_mood_host.Custom('KehillahOutlookBdTeaching')][kehillah_mood_host.Custom('KehillahOutlookBdZeal')][kehillah_mood_host.Custom('KehillahOutlookBdCharacter')][kehillah_mood_host.Custom('KehillahOutlookBdLearning')][kehillah_mood_host.Custom('KehillahOutlookBdCourt')][kehillah_mood_host.Custom('KehillahOutlookBdDebts')][kehillah_mood_host.Custom('KehillahOutlookBdRelations')][kehillah_mood_host.Custom('KehillahOutlookBdCrusade')][kehillah_mood_host.Custom('KehillahOutlookBdHistory')] \n\n#weak A lord's outlook moves with his faith's teaching, his chaplain's sermons, the Jews he counts as friends or rivals, Jews in his service, his debts, and crusades.#!"
 kehillah_invitation.0001.t:0 "An Invitation to Settle"
 kehillah_invitation.0001.desc:0 "A letter under the seal of [kehillah_policy_host.GetTitledFirstName] is read aloud in the synagogue. [kehillah_policy_host.GetSheHe|U] invites Jewish families to settle in [kehillah_policy_realm.GetNameNoTooltip], promising [kehillah_policy_host.GetHerHis] protection and the right to trade. \n\nWhoever answers within twenty years will find privileges waiting. [kehillah_policy_host.GetHerHis|U] outlook on the Jews: [kehillah_policy_host.Custom('KehillahOutlookBand')] ([kehillah_policy_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0])."
 kehillah_invitation.0001.a:0 "Let the families consider it."
 kehillah_invitation_settlers_open_tt:0 "While the invitation stands, #EMP Send Out Settlers#! is open to you even if the quarter has room, and a community founded there starts with #P +60 Prosperity#! and #P +30 Stability#!."
 kehillah_yeshiva_lord_outlook_tt:0 "[kehillah_local_lord.GetTitledFirstName]'s outlook on the Jews warms (#P +10#!)."
 kehillah_outlook_protective_modifier:0 "Outlook on the Jews: Protective"
 kehillah_outlook_protective_modifier_desc:0 "Holds the Jews under his protection: a lord who grants charters, invites settlers and defends communities.\n\n#weak A lord's outlook on the Jews moves with his faith's teaching on them, his zeal, his character, his learning, Jews in his service, Jews he counts as friends or rivals, his debts to Jewish lenders, his chaplain's sermons, crusades, and what Jewish communities have done for or against him.#!"
 kehillah_outlook_well_disposed_modifier:0 "Outlook on the Jews: Well-disposed"
 kehillah_outlook_well_disposed_modifier_desc:0 "Regards the Jews favourably: likely to keep their privileges and open to inviting settlers.\n\n#weak A lord's outlook on the Jews moves with his faith's teaching on them, his zeal, his character, his learning, Jews in his service, Jews he counts as friends or rivals, his debts to Jewish lenders, his chaplain's sermons, crusades, and what Jewish communities have done for or against him.#!"
 kehillah_outlook_indifferent_modifier:0 "Outlook on the Jews: Indifferent"
 kehillah_outlook_indifferent_modifier_desc:0 "Has no strong view of the Jews either way.\n\n#weak A lord's outlook on the Jews moves with his faith's teaching on them, his zeal, his character, his learning, Jews in his service, Jews he counts as friends or rivals, his debts to Jewish lenders, his chaplain's sermons, crusades, and what Jewish communities have done for or against him.#!"
 kehillah_outlook_cold_modifier:0 "Outlook on the Jews: Cold"
 kehillah_outlook_cold_modifier_desc:0 "Regards the Jews with suspicion: inclined to restrict their settlement and privileges.\n\n#weak A lord's outlook on the Jews moves with his faith's teaching on them, his zeal, his character, his learning, Jews in his service, Jews he counts as friends or rivals, his debts to Jewish lenders, his chaplain's sermons, crusades, and what Jewish communities have done for or against him.#!"
 kehillah_outlook_hostile_modifier:0 "Outlook on the Jews: Hostile"
 kehillah_outlook_hostile_modifier_desc:0 "Regards the Jews with hostility: a danger to any community in his lands, and a likely author of restrictions or expulsion.\n\n#weak A lord's outlook on the Jews moves with his faith's teaching on them, his zeal, his character, his learning, Jews in his service, Jews he counts as friends or rivals, his debts to Jewish lenders, his chaplain's sermons, crusades, and what Jewish communities have done for or against him.#!"
 KEHILLAH_HUD_HOST_LABEL:0 "Your Host"
 KEHILLAH_HUD_HOST_NAME:0 "[GetPlayer.MakeScope.Var('kehillah_host_ref').Char.GetShortUIName]"
 KEHILLAH_HUD_HOST_OUTLOOK:0 "[GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBand')] ([GetPlayer.MakeScope.Var('kehillah_host_ref').Char.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0])[GetPlayer.Custom('KehillahHudInvitationMark')]"
 KEHILLAH_HUD_HOST_TOOLTIP:0 "#T Your host: [GetPlayer.MakeScope.Var('kehillah_host_ref').Char.GetTitledFirstName]#!\nOutlook on the Jews: [GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBand')] ([GetPlayer.MakeScope.Var('kehillah_host_ref').Char.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0])[GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdTeaching')][GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdZeal')][GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdCharacter')][GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdLearning')][GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdCourt')][GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdDebts')][GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdRelations')][GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdCrusade')][GetPlayer.MakeScope.Var('kehillah_host_ref').Char.Custom('KehillahOutlookBdHistory')]\nJewish settlement policy: [GetPlayer.MakeScope.Var('kehillah_host_ref').Char.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]\n[GetPlayer.Custom('KehillahHudInvitationLine')]\n\n#weak The host's outlook weighs on your Stability and on how he reviews his realm's Jewish settlement policy. A lord's outlook on the Jews moves with his faith's teaching on them, his zeal, his character, his learning, Jews in his service, Jews he counts as friends or rivals, his debts to Jewish lenders, his chaplain's sermons, crusades, and what Jewish communities have done for or against him. Every ruler's character window shows their \"Outlook on the Jews\" among their modifiers.#!"
