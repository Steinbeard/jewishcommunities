 kehillah_host_mood_warmer_t:0 "The Lord Grows Warmer"
 kehillah_host_mood_warmer_d:0 "[kehillah_mood_host.GetTitledFirstName] has grown warmer toward the Jews. [kehillah_mood_host.GetHerHis|U] outlook on them is now [kehillah_mood_host.Custom('KehillahOutlookBand')] ([kehillah_mood_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0]). \n\n#weak A lord's outlook moves with his faith's teaching, his chaplain's sermons, the Jews he counts as friends or rivals, Jews in his service, his debts, and crusades.#!"
 kehillah_host_mood_colder_t:0 "The Lord Grows Colder"
 kehillah_host_mood_colder_d:0 "[kehillah_mood_host.GetTitledFirstName] has grown colder toward the Jews. [kehillah_mood_host.GetHerHis|U] outlook on them is now [kehillah_mood_host.Custom('KehillahOutlookBand')] ([kehillah_mood_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0]). \n\n#weak A lord's outlook moves with his faith's teaching, his chaplain's sermons, the Jews he counts as friends or rivals, Jews in his service, his debts, and crusades.#!"
 kehillah_invitation.0001.t:0 "An Invitation to Settle"
 kehillah_invitation.0001.desc:0 "A letter under the seal of [kehillah_policy_host.GetTitledFirstName] is read aloud in the synagogue. [kehillah_policy_host.GetSheHe|U] invites Jewish families to settle in [kehillah_policy_realm.GetNameNoTooltip], promising [kehillah_policy_host.GetHerHis] protection and the right to trade. \n\nWhoever answers within twenty years will find privileges waiting. [kehillah_policy_host.GetHerHis|U] outlook on the Jews: [kehillah_policy_host.Custom('KehillahOutlookBand')] ([kehillah_policy_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0])."
 kehillah_invitation.0001.a:0 "Let the families consider it."
 kehillah_invitation_settlers_open_tt:0 "While the invitation stands, #EMP Send Out Settlers#! is open to you even if the quarter has room, and a community founded there starts with #P +60 Prosperity#! and #P +30 Stability#!."
 kehillah_yeshiva_lord_outlook_tt:0 "[kehillah_local_lord.GetTitledFirstName]'s outlook on the Jews warms (#P +10#!)."
