 kehillah_news_preaching_t:0 "A Preacher at Court"
 kehillah_news_preaching_d:0 "[kehillah_preacher.GetTitledFirstName] has been preaching against the Jews at the court of [kehillah_preached_lord.GetTitledFirstName], and [kehillah_preached_lord.GetSheHe] has listened. [kehillah_preached_lord.GetHerHis|U] outlook on the Jews cools."
