 kehillah_crisis_spike.10.desc:0 "A wandering preacher has set up on the steps by the cloth hall. He tells the crowd that the Jews of the quarter mock their Lord, and the crowd listens. Some of them are men who owe us money.\n\nOur people have stopped going to market."
