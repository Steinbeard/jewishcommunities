 kehillah_haymanot_rite_desc:0 "The Jewish tradition of Ethiopia's Beta Israel. The Ge'ez $haymanot_religious_text$—a sacred collection centered on the Torah—guides a life of Sabbath, festivals, ritual purity, and covenantal obligation. Qesoch (kahenim), monks, and learned elders preserve its teaching and communal practice, which developed apart from the rabbinic Mishnah and Talmud."
