l_english:
 kehillah_leadership_header:0 "Communal leadership"
 kehillah_leadership_current:0 "[GetPlayer.GetPrimaryTitle.Custom('KehillahLeadershipStyleName')] leadership"
 kehillah_leadership_ready:0 "May be changed · ten-year mandate"
 kehillah_leadership_locked:0 "Mandate ends in [ROOT.Title.MakeScope.Var('kehillah_leadership_style_until').GetValue|0]"
 kehillah_leadership_available_tt:0 "You must be an adult, free and capable communal leader with no ten-year mandate in force."
 kehillah_leadership_different_tt:0 "Choose an initial leadership style or change your existing style."
 kehillah_leadership_active:0 "Current"
 kehillah_leadership_select:0 "Choose"
 kehillah_leadership_scholarly_name:0 "Scholarly"
 kehillah_leadership_scholarly_button:0 "Follow the Scholars"
 kehillah_leadership_scholarly_selected:0 "We Are Scholars!"
 kehillah_leadership_scholarly_summary:0 "+60 Greatness baseline"
 kehillah_leadership_scholarly_tt:0 "#T Scholarly leadership#!\nScholars guide communal priorities. Learning weighs most heavily when choosing the next leader. The higher Greatness baseline supports the community's existing scholarly institutions.\n\n#high Candidate skill weights:#! Learning ×3; Stewardship ×2; Diplomacy ×0.5. Other candidate qualifications still apply.\n#high Community:#! +60 Greatness baseline; the pillar moves toward this gradually.\n\nChanging style commits the community for ten years, including after succession. It does not remove the present leader."
 kehillah_leadership_political_name:0 "Political"
 kehillah_leadership_political_button:0 "Follow the Parnasim"
 kehillah_leadership_political_selected:0 "We Are Parnasim!"
 kehillah_leadership_political_summary:0 "+60 Stability baseline"
 kehillah_leadership_political_tt:0 "#T Political leadership#!\nParnasim emphasize mediation and representation. Diplomacy weighs most heavily when choosing the next leader. The higher Stability baseline supports cohesion and helps reduce incident risk through the existing safety system.\n\n#high Candidate skill weights:#! Learning ×1; Stewardship ×1; Diplomacy ×3. Other candidate qualifications still apply.\n#high Community:#! +60 Stability baseline; the pillar moves toward this gradually.\n\nChanging style commits the community for ten years, including after succession. It does not remove the present leader."
 kehillah_leadership_commercial_name:0 "Commercial"
 kehillah_leadership_commercial_button:0 "Follow the Merchants"
 kehillah_leadership_commercial_selected:0 "We Are Merchants!"
 kehillah_leadership_commercial_summary:0 "+60 Prosperity baseline"
 kehillah_leadership_commercial_tt:0 "#T Commercial leadership#!\nMerchants emphasize household livelihoods and communal resources. Stewardship weighs most heavily when choosing the next leader. The higher Prosperity baseline supports the community's existing economic progression.\n\n#high Candidate skill weights:#! Learning ×1; Stewardship ×3; Diplomacy ×1. Other candidate qualifications still apply.\n#high Community:#! +60 Prosperity baseline; the pillar moves toward this gradually.\n\nChanging style commits the community for ten years, including after succession. It does not remove the present leader."
 kehillah_leadership_greatness_breakdown:0 "\n  Scholarly leadership: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_leadership_greatness_bonus')|0]#!"
 kehillah_leadership_stability_breakdown:0 "\n  Political leadership: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_leadership_stability_bonus')|0]#!"
 kehillah_leadership_prosperity_breakdown:0 "\n  Commercial leadership: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_leadership_prosperity_bonus')|0]#!"
 kehillah_leadership_unselected_status:0 "No leadership style chosen"
 kehillah_leadership_reminder:0 "Choose how your community should be led."
 kehillah_leadership_fallback_effects:0 "Until you choose, scholarly rules apply:\n$kehillah_leadership_scholarly_effects$"
 action_kehillah_choose_leadership_style:0 "Choose a leadership style"
 action_kehillah_choose_leadership_style_label:0 "Choose a leadership style"
 action_kehillah_choose_leadership_style_desc:0 "Your community has not chosen a leadership style. Favor scholarship, political representation or commerce to shape communal priorities and the next succession."
 action_kehillah_choose_leadership_style_click:0 "#I Click to choose a leadership style in the Domain tab#!"
 kehillah_leadership_scholarly_effects:0 "#P +60 Greatness baseline#!\nSuccession: Learning x3 / Stewardship x2 / Diplomacy x0.5\n#weak Pillar benefits develop gradually; other succession qualifications still apply.#!"
 kehillah_leadership_political_effects:0 "#P +60 Stability baseline#!\nSuccession: Learning x1 / Stewardship x1 / Diplomacy x3\n#weak Pillar benefits develop gradually; other succession qualifications still apply.#!"
 kehillah_leadership_commercial_effects:0 "#P +60 Prosperity baseline#!\nSuccession: Learning x1 / Stewardship x3 / Diplomacy x1\n#weak Pillar benefits develop gradually; other succession qualifications still apply.#!"

 # 2026-11-20 (pillars spec R2): the style modifiers.
 kehillah_style_scholarly_modifier:0 "Scholarly Leadership"
 kehillah_style_scholarly_modifier_desc:0 "This leader governs as a scholar. The community's learned reputation draws scholars and families to it, and every gain in its Greatness from the leader's own deeds counts a fifth more."
 kehillah_style_political_modifier:0 "Political Leadership"
 kehillah_style_political_modifier_desc:0 "This leader governs through dealings with the powerful. The community is safer for it, and every gain in its Stability from the leader's own deeds counts a fifth more."
 kehillah_style_commercial_modifier:0 "Commercial Leadership"
 kehillah_style_commercial_modifier_desc:0 "This leader governs as a merchant. The Quarter builds faster, and every gain in the community's Prosperity from the leader's own deeds counts a fifth more."
 kehillah_safety_factor_political_leadership:0 "Political leadership"

