l_english:
 kehillah_bet_din.0471.t:0 "The Unauthorized Synagogue Sale"
 kehillah_bet_din.0471.desc:0 "[kbd_litigant_a.GetFirstName] speaks for trustees who sold a small prayer house to pay old debts. [kbd_litigant_b.GetFirstName] speaks for donors who say they were never asked. The buyer has begun repairs; reversing the sale now will cost more than it did last month. The court must weigh a useful payment against the authority to make it."
 kehillah_bet_din.0471.a:0 "Confirm the sale and pay the debts."
 kehillah_bet_din.0471.a.tt:0 "The debts are settled, but a sale without authority may dispossess the community."
 kehillah_bet_din.0471.b:0 "Hold the proceeds and examine the trustees' mandate."
 kehillah_bet_din.0471.b.tt:0 "The court pays for delay while checking notice, donor terms and the buyer's work."
 kehillah_bet_din.0471.c:0 "Undo the sale and restore the prayer house."
 kehillah_bet_din.0471.c.tt:0 "Worship space returns, but an authorized sale could be undone at great cost."
 kehillah_din_source_47:0 "Cite a mastered Moed work and inspect the sale authority."
 kehillah_din_source_47_tt:0 "Mishnah Megillah 3:1 discusses selling communal sacred property. It cannot supply this deed's missing approval."
 kehillah_din_combo_47:0 "Have a scholar and steward compare the deed, vote and buyer's costs."
 kehillah_din_combo_47_tt:0 "The judges preserve proceeds and worship access while checking authority."
 kehillah_bet_din.0474.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0474.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0474.outcome_1:0 "The court confirms the transfer and releases the price to creditors."
 kehillah_bet_din.0474.outcome_2:0 "The court holds the price while donors and trustees show the terms under which they acted."
 kehillah_bet_din.0474.outcome_3:0 "The court rescinds the sale and returns the house to communal use."
 kehillah_bet_din.0474.fact_true:0 "The trustees lacked the approval promised in the founding deed. Confirmation would ratify an unauthorized sale."
 kehillah_bet_din.0474.fact_false:0 "The deed and meeting record authorize the sale. Rescission would break a valid bargain."
 kehillah_bet_din.0474.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0474.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0474.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case47_one_tt:0 "Confirmation spends substantial Stability."
 kehillah_din_case47_two_tt:0 "Holding proceeds and inquiry cost some Stability."
 kehillah_din_case47_three_tt:0 "Rescission costs less now but may unsettle a lawful buyer."
