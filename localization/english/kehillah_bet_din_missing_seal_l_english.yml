l_english:
 kehillah_bet_din.0841.t:0 "The Missing Court Seal"
 kehillah_bet_din.0841.desc:0 "[kbd_litigant_a.GetFirstName] produces a deed for a house; [kbd_litigant_b.GetFirstName] produces another. The first has witnesses but no court seal. Both parties say the seller chose them. The local clerk can compare the forms, but the house is already being repaired by one claimant."
 kehillah_bet_din.0841.a:0 "Accept the unsealed deed and settle possession."
 kehillah_bet_din.0841.a.tt:0 "Repairs can continue, but a required missing seal may invalidate the claim."
 kehillah_bet_din.0841.b:0 "Hold the house and examine witnesses and district forms."
 kehillah_bet_din.0841.b.tt:0 "Inquiry costs money while protecting the house."
 kehillah_bet_din.0841.c:0 "Reject the unsealed deed outright."
 kehillah_bet_din.0841.c.tt:0 "A seal-free deed may still be valid under the district's rules."
 kehillah_din_source_84:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_84_tt:0 "Mishnah Bava Batra 10:1 gives the judges a textual point of reference. It cannot establish the district's seal practice and these witnesses."
 kehillah_din_combo_84:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_84_tt:0 "The judges preserve both parties' interests while checking the district's seal practice and these witnesses."
 kehillah_bet_din.0844.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0844.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0844.outcome_1:0 "The court accepts the unsealed deed."
 kehillah_bet_din.0844.outcome_2:0 "The court preserves the house while a clerk checks both deeds and witnesses."
 kehillah_bet_din.0844.outcome_3:0 "The court rejects the unsealed deed."
 kehillah_bet_din.0844.fact_true:0 "District practice required that seal for this transfer. Immediate acceptance overlooked a decisive omission."
 kehillah_bet_din.0844.fact_false:0 "The seller's witnesses confirm a valid unsealed transfer. Automatic rejection ignored their proof."
 kehillah_bet_din.0844.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0844.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0844.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case84_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case84_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case84_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case84_great_log_title:0 "The Missing Court Seal: a well-supported ruling"
 kehillah_bet_din_case84_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the missing court seal dispute."
 kehillah_bet_din_case84_good_log_title:0 "The Missing Court Seal: a workable ruling"
 kehillah_bet_din_case84_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the missing court seal dispute."
 kehillah_bet_din_case84_poor_log_title:0 "The Missing Court Seal: a disputed ruling"
 kehillah_bet_din_case84_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the missing court seal dispute."
