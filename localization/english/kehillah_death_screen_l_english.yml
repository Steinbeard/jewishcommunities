l_english:

 # Conditional replacements for selected vanilla death-screen lines.
 # The custom loc returns the exact vanilla wording for everyone who has
 # never led a Kehillah.

 SUCCESSION_EVENT_WINDOW_HEIR_DESC:0 "[CHARACTER.GetTitledFirstNameNoTooltip] [CHARACTER.Custom('KehillahSuccessionHeirMotion')]. [CHARACTER.Custom('HeirMessageInterface')]"
 kehillah_succession_heir_motion:0 "takes office as the community's appointed leader"
 kehillah_vanilla_succession_heir_motion:0 "[ROOT.Char.Custom('GetSuccessionHeirMotion')]"

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_CHILD:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_CHILD')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_CHILD:0 "The community will never know what kind of leader [ROOT.Char.GetSheHe] might have become."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_CHILD:0 "With [ROOT.Char.GetHerHis] life cut short so early, it is hard to say what kind of ruler [ROOT.Char.GetSheHe] would have become."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_LUNATIC:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_LUNATIC')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_LUNATIC:0 "Those who met [ROOT.Char.GetHerHim] in the quarter saw how heavily [ROOT.Char.GetHerHis] troubled mind weighed on [ROOT.Char.GetHerHim]."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_LUNATIC:0 "Cursed with a disturbed mind, [ROOT.Char.GetSheHe] was known throughout [ROOT.Char.GetHerHis] lands as a raving lunatic."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ADMINISTRATOR:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ADMINISTRATOR')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ADMINISTRATOR:0 "The community's accounts and institutions still bear the mark of [ROOT.Char.GetHerHis] careful stewardship."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ADMINISTRATOR:0 "A conscientious [ROOT.Char.GetWomanMan], [ROOT.Char.GetSheHe] was renowned for [ROOT.Char.GetHerHis] excellent skills as a steward and a ruler."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_BENEVOLENT:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_BENEVOLENT')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_BENEVOLENT:0 "The poor and the stranger will remember [ROOT.Char.GetHerHis] kindness."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_BENEVOLENT:0 "A [ROOT.Char.GetWomanMan] of pleasant disposition, [ROOT.Char.GetSheHe] will be remembered for [ROOT.Char.GetHerHis] benevolent rule."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_DOMINANT:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_DOMINANT')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_DOMINANT:0 "Firm in council, [ROOT.Char.GetSheHe] held the kehillah together even when its elders disagreed."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_DOMINANT:0 "A [ROOT.Char.GetWomanMan] not to be trifled with, [ROOT.Char.GetSheHe] embodied the dignity and power of [ROOT.Char.GetHerHis] title like few rulers can."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_SUBMISSIVE:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_SUBMISSIVE')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_SUBMISSIVE:0 "Often yielding to stronger voices, [ROOT.Char.GetSheHe] left much of the community's work to its elders."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_SUBMISSIVE:0 "A meek and bashful [ROOT.Char.GetWomanMan], [ROOT.Char.GetSheHe] will be remembered by many as a submissive, sometimes flustered ruler."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_ARROGANT:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_ARROGANT')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_ARROGANT:0 "Certain of [ROOT.Char.GetHerHis] own judgment, [ROOT.Char.GetSheHe] did not always heed the elders who served beside [ROOT.Char.GetHerHim]."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_ARROGANT:0 "Always full of [ROOT.Char.GetHerselfHimself] and ready to exercise [ROOT.Char.GetHerHis] authority over [ROOT.Char.GetHerHis] [ROOT.Char.Custom('GetSubjectPlural')], [ROOT.Char.GetSheHe] was a [ROOT.Char.GetWomanMan] thoroughly in love with the sound of [ROOT.Char.GetHerHis] voice."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_CHASTE:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_CHASTE')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_CHASTE:0 "In private life, [ROOT.Char.GetSheHe] remained faithful to the vows [ROOT.Char.GetSheHe] had made."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_CHASTE:0 "[ROOT.Char.GetSheHe|U] will be long remembered as a [ROOT.Char.GetWomanMan] for whom fealty was an uncompromising value."

 SUCCESSION_EVENT_WINDOW_HEIR_USELESS:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_USELESS')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_USELESS:0 "The elders will have to guide [ROOT.Char.GetHerHim] through the duties of communal leadership."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_USELESS:0 "Having no skills with which to keep the [ROOT.Char.Custom('GetRealmOrDomicile')|l] together, [ROOT.Char.GetHerHis] rule may be doomed to fail."

 SUCCESSION_EVENT_WINDOW_HEIR_MILITARY:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_MILITARY')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_MILITARY:0 "Experience guarding the quarter may help [ROOT.Char.GetHerHim] protect the community in troubled times."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_MILITARY:0 "Being a talented military tactician, many expect [ROOT.Char.GetHerHim] to lead the [ROOT.Char.Custom('GetRealmOrDomicile')|l] to many victories on the field of battle."

 SUCCESSION_EVENT_WINDOW_HEIR_LEARNING:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_LEARNING')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_LEARNING:0 "The scholars hope [ROOT.Char.GetHerHis] learning will deepen the community's life of study."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_LEARNING:0 "A wise and learned [ROOT.Char.GetWomanMan], progress and innovation is expected under [ROOT.Char.GetHerHis] rule."

 SUCCESSION_EVENT_WINDOW_HEIR_STEWARDSHIP:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_STEWARDSHIP')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_STEWARDSHIP:0 "Careful with money, [ROOT.Char.GetSheHe] may put the communal treasury on firmer ground."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_STEWARDSHIP:0 "Being both thrifty and frugal, the [ROOT.Char.Custom('GetRealmOrDomicile')|l] will surely prosper under [ROOT.Char.GetHerHis] rule."

 SUCCESSION_EVENT_WINDOW_HEIR_DIPLOMACY:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_DIPLOMACY')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_DIPLOMACY:0 "The elders hope [ROOT.Char.GetSheHe] can speak persuasively for the community before its neighbors and host."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_DIPLOMACY:0 "An accomplished diplomat, vassals and foreign rulers alike are sure to respect [ROOT.Char.GetHerHim]."

 SUCCESSION_EVENT_WINDOW_HEIR_STRONG_AND_SMART:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_STRONG_AND_SMART')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_STRONG_AND_SMART:0 "Strength and good judgment may serve [ROOT.Char.GetHerHim] well when the council turns to [ROOT.Char.GetHerHim] for direction."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_STRONG_AND_SMART:0 "Possessing a mighty physique and an exceptionally astute mind, [ROOT.Char.GetHerHis] rule is sure to spawn both song and tale."

 SUCCESSION_EVENT_WINDOW_HEIR_WEAK_AND_DUMB:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_WEAK_AND_DUMB')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_WEAK_AND_DUMB:0 "With few skills to draw upon, [ROOT.Char.GetSheHe] will need wise counsellors close at hand."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_WEAK_AND_DUMB:0 "Blessed with neither a sharp mind nor a warrior's physique, [ROOT.Char.GetHerHis] rule will surely be arduous."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GLUTTON_GREEDY:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GLUTTON_GREEDY')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GLUTTON_GREEDY:0 "The elders wonder whether [ROOT.Char.GetHerHis] appetite for wealth will leave enough for the community's needs."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GLUTTON_GREEDY:0 "A greedy and covetous [ROOT.Char.GetWomanMan], [ROOT.Char.GetSheHe] is unlikely to be popular amongst the peasantry of the [ROOT.Char.Custom('GetRealmOrDomicile')|l]."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT_ARBITRARY:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT_ARBITRARY')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT_ARBITRARY:0 "The elders fear that [ROOT.Char.GetHerHis] judgments may favor whim over communal custom."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT_ARBITRARY:0 "A corrupt and unjust [ROOT.Char.GetWomanMan], many do not expect [ROOT.Char.GetHerHis] vassals to sit idly by as [ROOT.Char.GetSheHe] squanders the legacy of [ROOT.Char.GetHerHis] predecessor."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_COMPASSIONATE:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_COMPASSIONATE')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_COMPASSIONATE:0 "The poor and vulnerable may find an attentive leader in [ROOT.Char.GetHerHim]."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_COMPASSIONATE:0 "A gentle and compassionate soul, the vassals will surely thrive under [ROOT.Char.GetFirstNamePossessiveNoTooltip] reign."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARROGANT:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARROGANT')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARROGANT:0 "The council will soon learn whether [ROOT.Char.GetHerHis] confidence leaves room for other voices."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARROGANT:0 "Ever confident in [ROOT.Char.GetHerselfHimself], [ROOT.Char.GetFirstNamePossessiveNoTooltip] rule may bring glory or shame to the House [ROOT.Char.GetHouse.GetName] — only time will tell."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_HUMBLE:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_HUMBLE')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_HUMBLE:0 "[ROOT.Char.GetHerHis|U] modesty has earned respect among the elders; now [ROOT.Char.GetSheHe] must lead them."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_HUMBLE:0 "A pious and humble [ROOT.Char.GetWomanMan], many fear that [ROOT.Char.GetFirstNameNoTooltip] may have been better suited for a [ROOT.Char.GetFaith.HouseOfWorship] rather than the throne."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARBITRARY:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARBITRARY')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARBITRARY:0 "The elders worry that [ROOT.Char.GetHerHis] decisions will owe little to law or communal custom."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARBITRARY:0 "A corrupt and unjust [ROOT.Char.GetWomanMan], many do not expect [ROOT.Char.GetHerHis] vassals to sit idly by if the [ROOT.Char.Custom('GetRealmOrDomicile')|l] starts crumbling under [ROOT.Char.GetHerHis] watch."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_LUSTFUL:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_LUSTFUL')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_LUSTFUL:0 "Private entanglements may distract [ROOT.Char.GetHerHim] from the obligations of the kehillah."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_LUSTFUL:0 "[ROOT.Char.GetHerHis|U] eyes always set upon the next target, the vassals of the [ROOT.Char.Custom('GetRealmOrDomicile')|l] do well in locking up their spouses as [ROOT.Char.GetFirstNameNoTooltip] takes the throne."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT:0 "Content with things as they are, [ROOT.Char.GetSheHe] may be slow to answer calls for change."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT:0 "Content with [ROOT.Char.GetHerHis] lot, [ROOT.Char.GetFirstNamePossessiveNoTooltip] vassals may ridicule [ROOT.Char.GetHerHim] for [ROOT.Char.GetHerHis] passive nature."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CALLOUS:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CALLOUS')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CALLOUS:0 "Those bringing petitions before [ROOT.Char.GetHerHim] may find little sympathy."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CALLOUS:0 "Being a cold and unfeeling [ROOT.Char.GetWomanMan], the vassals of the [ROOT.Char.Custom('GetRealmOrDomicile')|l] will have a hard time gaining [ROOT.Char.GetHerHis] trust."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_WRATHFUL:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_WRATHFUL')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_WRATHFUL:0 "The council fears that [ROOT.Char.GetHerHis] temper will turn ordinary disputes into lasting divisions."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_WRATHFUL:0 "Prone to rage, [ROOT.Char.GetFirstNamePossessiveNoTooltip] enemies and vassals alike are likely to live in fear of [ROOT.Char.GetHerHim]."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GENEROUS:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GENEROUS')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GENEROUS:0 "[ROOT.Char.GetHerHis|U] generosity could strengthen charity, if [ROOT.Char.GetSheHe] also guards the communal treasury."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GENEROUS:0 "A generous [ROOT.Char.GetWomanMan], many hope that [ROOT.Char.GetHerHis] good heart will not lead [ROOT.Char.GetHerHim] to empty the [ROOT.Char.Custom('GetRealmOrDomicile')|l]'s coffers on futile causes."

 SUCCESSION_EVENT_WINDOW_HEIR_GENDER:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_GENDER')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_GENDER:0 "The community has entrusted its leadership to [ROOT.Char.GetHerHim]; [ROOT.Char.GetHerHis] deeds will answer any doubts."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_GENDER:0 "Some fear that the ascension of a [ROOT.Char.GetWomanMan] to the throne might be a symptom of uncertain times to come."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ADMINISTRATOR:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ADMINISTRATOR')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ADMINISTRATOR:0 "An able administrator, [ROOT.Char.GetSheHe] knows how much depends on sound accounts and dependable officers."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ADMINISTRATOR:0 "A learned administrator, [ROOT.Char.GetSheHe] is recognized as one of the most qualified people to ascend to the throne."

 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ERUDITE:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ERUDITE')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ERUDITE:0 "A scholar at heart, [ROOT.Char.GetSheHe] must now balance study with the daily needs of the community."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ERUDITE:0 "Renowned for [ROOT.Char.GetHerHis] interests in metaphysical matters, [ROOT.Char.GetSheHe] might be ill-equipped to deal with the everyday problems of secular rule."

 SUCCESSION_EVENT_WINDOW_HEIR_UNIMPRESSIVE:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_UNIMPRESSIVE')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_UNIMPRESSIVE:0 "[ROOT.Char.GetHerHis|U] service to the community has yet to be tested."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_UNIMPRESSIVE:0 "Without many accomplishments to [ROOT.Char.GetHerHis] name, it is hard to tell what kind of ruler [ROOT.Char.GetSheHe] will become yet."

 SUCCESSION_EVENT_WINDOW_HEIR_FRIENDS:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_FRIENDS')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_FRIENDS:0 "Friends among the elders and householders may help [ROOT.Char.GetHerHim] begin [ROOT.Char.GetHerHis] term."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_FRIENDS:0 "Blessed with an abundance of friends, [ROOT.Char.GetFirstNameNoTooltip] is likely to find strong support for [ROOT.Char.GetHerHis] rule."

 SUCCESSION_EVENT_WINDOW_HEIR_TYRANT:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_TYRANT')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TYRANT:0 "The elders know [ROOT.Char.GetHerHis] harsh ways and fear what [ROOT.Char.GetSheHe] may demand of them."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_TYRANT:0 "Already a hated tyrant, the [ROOT.Char.Custom('GetRealmOrDomicile')|l] trembles before [ROOT.Char.GetHerHis] rule."

 SUCCESSION_EVENT_WINDOW_HEIR_RICH:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_RICH')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_RICH:0 "[ROOT.Char.GetHerHis|U] private wealth could aid the community, if [ROOT.Char.GetSheHe] chooses to put it to use."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_RICH:0 "In possession of fabulous riches, only time will tell if [ROOT.Char.GetSheHe] will make the [ROOT.Char.Custom('GetRealmOrDomicile')|l] thrive or roost on the gold like a dragon."

 SUCCESSION_EVENT_WINDOW_HEIR_CHILDREN:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_CHILDREN')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_CHILDREN:0 "[ROOT.Char.GetSheHe|U] has a large family, though leadership of the kehillah passes by appointment rather than birth."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_CHILDREN:0 "A prolific [ROOT.Char.GetWomanMan], [ROOT.Char.GetSheHe] has already produced numerous potential heirs for the [ROOT.Char.Custom('GetRealmOrDomicile')|l]."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ERUDITE:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ERUDITE')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ERUDITE:0 "A respected scholar, [ROOT.Char.GetSheHe] left learning that will outlive [ROOT.Char.GetHerHim] in the community's study halls."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ERUDITE:0 "Known to be a respected scholar, [ROOT.Char.GetSheHe] spent most of [ROOT.Char.GetHerHis] days studying in [ROOT.Char.GetHerHis] library, rarely leaving [ROOT.Char.GetHerHis] [ROOT.Char.Custom('ResidenceBuilding')]."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_FAMILY_FIRST:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_FAMILY_FIRST')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_FAMILY_FIRST:0 "[ROOT.Char.GetSheHe|U] cared deeply for [ROOT.Char.GetHerHis] family and for the community entrusted to [ROOT.Char.GetHerHim]."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_FAMILY_FIRST:0 "A [ROOT.Char.GetWomanMan] to always put the good of [ROOT.Char.GetHerHis] family above all else, [ROOT.Char.GetSheHe] spent [ROOT.Char.GetHerHis] life trying to ensure a glorious future for all [ROOT.Char.GetHerHis] descendants."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GENERAL:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GENERAL')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GENERAL:0 "[ROOT.Char.GetHerHis|U] knowledge of defense helped the quarter weather dangerous times."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GENERAL:0 "Known to be an exceptional strategist, [ROOT.Char.GetSheHe] spent many of [ROOT.Char.GetHerHis] days examining fields and drilling [ROOT.Char.GetHerHis] troops."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_REVELER:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_REVELER')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_REVELER:0 "[ROOT.Char.GetSheHe|U] brought neighbors together around a generous table."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_REVELER:0 "A charming [ROOT.Char.GetWomanMan], [ROOT.Char.GetSheHe] became famous for [ROOT.Char.GetHerHis] elaborate feasts and grandiose balls."

 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_WRATHFUL:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_WRATHFUL')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_WRATHFUL:0 "Those who crossed [ROOT.Char.GetHerHim] in council seldom forgot [ROOT.Char.GetHerHis] anger."
 kehillah_vanilla_succession_text_SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_WRATHFUL:0 "Quick to anger, [ROOT.Char.GetHerHis] [ROOT.Char.Custom('ResidenceBuilding')] often resonated with the thunderous echo of [ROOT.Char.GetHerHis] screams."

 SUCCESSION_EVENT_WINDOW_HEIR_UNDERAGE:0 "[ROOT.Char.Custom('KehillahSuccessionText_SUCCESSION_EVENT_WINDOW_HEIR_UNDERAGE')]"
 kehillah_succession_text_SUCCESSION_EVENT_WINDOW_HEIR_UNDERAGE:0 "Still only [ROOT.Char.GetAge], [ROOT.Char.GetSheHe] will need the elders' guidance while learning to lead the community."
