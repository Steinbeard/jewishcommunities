l_english:
 KEHILLAH_LEDGER_SORT_RANK:0 "Rank"
 KEHILLAH_LEDGER_SORT_RANK_TT:0 "#T Sort by rank#!\nHighest rank first, in the selected rite. Equal ranks keep their date order."
 KEHILLAH_LEDGER_CURRENT_RANK:0 "Rank: "
 KEHILLAH_LEDGER_HIGHEST_RANK:0 "Highest attainable rank: "
 KEHILLAH_LEDGER_FIXED_RANK:0 "Rank fixed by doctrine"
 KEHILLAH_LEDGER_COMPARE:0 "Other traditions"
 KEHILLAH_LEDGER_COMPARE_TT:0 "#T Other traditions#!\nLiving Jewish rites, with their faiths, and their current assessment of this book. These are summaries of the existing ranks, not additional standings.\n\n#N Rejected#!: Anathema, Banned or Rejected.\nAmbivalent: Contested.\nUnknown: Obscure; no established reception, even if a copy exists.\n#P Important#!: Popular through Authoritative.\n#P Holy#!: Foundational, Prophetic or Divine.\n\nUse the rite selector for its exact rank and the reasons behind it."
 KEHILLAH_LEDGER_ASSESSMENT_INTRO:0 "#T Why this rank?#!\nEach rite assesses this work separately. Its current rank reflects its inherited standing and subsequent reception, within its doctrinal limits."
 KEHILLAH_LEDGER_DOCTRINAL:0 "This work belongs to a scriptural or canonical corpus. The rite's doctrine determines whether it receives that corpus; copying and scholarly praise cannot make an ordinary work holy."
 KEHILLAH_LEDGER_BASELINE:0 "Starting standing in this tradition:"
 KEHILLAH_LEDGER_SUPPORTS:0 "Supports"
 KEHILLAH_LEDGER_OPPOSES:0 "Argues against"
 KEHILLAH_LEDGER_AUTHORED:0 "This is a work composed in play. Its chosen tenets and, for a vernacular work, its language's court prestige determine its limit. See Work details for its arguments."
 KEHILLAH_LEDGER_LIMIT_RULES:0 "#EMP Highest attainable rank#! is a limit, not a promotion or target score. The strictest limit among the supported tenets applies; opposing a core tenet lowers it by two further ranks, to a minimum of Banned. Vernacular works composed in play can also be limited by language prestige."
 KEHILLAH_LEDGER_RECEPTION_RULES:0 "Copying, mastery, approbations, teaching and scholarly reliance improve reception; condemnations lower it. Advancement normally takes at least a year per rank and requires the displayed score and scholarly conditions. A high score cannot overcome the limit. Age and core tenets may protect a minimum rank."
