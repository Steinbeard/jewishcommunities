l_english:
 kehillah_bet_din.0671.t:0 "The Shofar With a Crack"
 kehillah_bet_din.0671.desc:0 "[kbd_litigant_a.GetFirstName] defended the shofar used at the last service. [kbd_litigant_b.GetFirstName] says a crack crossed the horn before the first blast and that a warning was ignored. The horn is still in its case. The court can examine it, but a public verdict will also judge the appointed blower's care."
 kehillah_bet_din.0671.a:0 "Confirm the service without examining the horn."
 kehillah_bet_din.0671.a.tt:0 "Reassurance comes quickly, but a decisive crack would be missed."
 kehillah_bet_din.0671.b:0 "Inspect the crack and hear those who warned the blower."
 kehillah_bet_din.0671.b.tt:0 "An examination costs time and public patience."
 kehillah_bet_din.0671.c:0 "Declare the instrument unfit and censure the blower."
 kehillah_bet_din.0671.c.tt:0 "A harmless surface line could become an unjust public rebuke."
 kehillah_din_source_67:0 "Cite a mastered Moed work and examine the evidence."
 kehillah_din_source_67_tt:0 "Mishnah Rosh Hashanah 3:6 gives the judges a textual point of reference. It cannot establish the crack's extent."
 kehillah_din_combo_67:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_67_tt:0 "The judges preserve both parties' interests while checking the crack's extent."
 kehillah_bet_din.0674.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0674.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0674.outcome_1:0 "The court confirms the service and dismisses the complaint."
 kehillah_bet_din.0674.outcome_2:0 "The court examines the horn and hears when the crack was seen."
 kehillah_bet_din.0674.outcome_3:0 "The court censures the blower and rejects the instrument."
 kehillah_bet_din.0674.fact_true:0 "The crack runs through the sounding part. A ruling without inspection overlooked it."
 kehillah_bet_din.0674.fact_false:0 "The line is superficial and does not affect the sounding part. Censure was premature."
 kehillah_bet_din.0674.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0674.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0674.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case67_one_tt:0 "The immediate ruling costs 8 Greatness and carries the larger fact risk."
 kehillah_din_case67_two_tt:0 "Inquiry costs 4 Greatness while the court keeps the issue open."
 kehillah_din_case67_three_tt:0 "The quick final settlement costs 2 Greatness but may be overbroad."
 kehillah_bet_din_case67_great_log_title:0 "The Shofar With a Crack: a well-supported ruling"
 kehillah_bet_din_case67_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the shofar with a crack dispute."
 kehillah_bet_din_case67_good_log_title:0 "The Shofar With a Crack: a workable ruling"
 kehillah_bet_din_case67_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the shofar with a crack dispute."
 kehillah_bet_din_case67_poor_log_title:0 "The Shofar With a Crack: a disputed ruling"
 kehillah_bet_din_case67_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the shofar with a crack dispute."
