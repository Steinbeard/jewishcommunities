l_english:
 # Top-bar alerts, one per crisis action that can be taken now
 # (common/important_actions/kehillah_crisis_action_alerts.txt).

 # Agitation.
 action_kehillah_crisis_prepare:0 "The elders wait for your word"
 action_kehillah_crisis_prepare_label:0 "Steady the Kehillah"
 action_kehillah_crisis_prepare_desc:0 "Frightened households are talking of the road. A watch, full cellars, a known way out or a fast would steady them, and that is ours to do whatever the town decides."
 action_kehillah_crisis_prepare_click:0 "#I Click to decide what the community will do for itself#!"
 action_kehillah_crisis_protect:0 "No one has yet spoken against the agitator"
 action_kehillah_crisis_protect_label:0 "Call for Restraint"
 action_kehillah_crisis_protect_desc:0 "The lord, his overlord, the men of religion and the town council could each condemn the incitement before a host forms. None will do it unasked."
 action_kehillah_crisis_protect_click:0 "#I Click to decide whom to ask for protection#!"
 action_kehillah_crisis_case:0 "The charges go unanswered"
 action_kehillah_crisis_case_label:0 "Make Our Case"
 action_kehillah_crisis_case_desc:0 "Every day the charges are repeated in the market, and every day more people believe them. Someone must answer them."
 action_kehillah_crisis_case_click:0 "#I Click to decide how to answer the charges#!"

 # Armed Host.
 action_kehillah_crisis_armed_protect:0 "The host is on the road"
 action_kehillah_crisis_armed_protect_label:0 "Seek Protection"
 action_kehillah_crisis_armed_protect_desc:0 "Only soldiers, a refuge or a safe road can stand between the quarter and the host now. Ask while there is still time to send them."
 action_kehillah_crisis_armed_protect_click:0 "#I Click to decide whom to ask for help#!"
 action_kehillah_crisis_armed_defend:0 "The quarter is not ready"
 action_kehillah_crisis_armed_defend_label:0 "Defend the Quarter"
 action_kehillah_crisis_armed_defend_desc:0 "The families need shelter, the street ends need chains, and those who cannot fight need a way out before the host arrives."
 action_kehillah_crisis_armed_defend_click:0 "#I Click to decide how to defend the quarter#!"
 action_kehillah_crisis_armed_parley:0 "The host's leaders can still be reached"
 action_kehillah_crisis_armed_parley_label:0 "Parley with the Host"
 action_kehillah_crisis_armed_parley_desc:0 "Men who march for plunder can sometimes be talked into terms, or paid to march more slowly."
 action_kehillah_crisis_armed_parley_click:0 "#I Click to decide how to approach the host#!"

 # Recovery.
 action_kehillah_crisis_recovery_relief:0 "The survivors need care"
 action_kehillah_crisis_recovery_relief_label:0 "Seek Relief"
 action_kehillah_crisis_recovery_relief_desc:0 "The injured need tending and the bereaved need bread. The community must decide how to find the means."
 action_kehillah_crisis_recovery_relief_click:0 "#I Click to decide how to help the survivors#!"
 action_kehillah_crisis_recovery_reckoning:0 "The families are divided"
 action_kehillah_crisis_recovery_reckoning_label:0 "Settle the Reckoning"
 action_kehillah_crisis_recovery_reckoning_desc:0 "Some want the attack remembered one way and some another, and some wonder whether they can afford to stay. They are waiting for you to bring them together."
 action_kehillah_crisis_recovery_reckoning_click:0 "#I Click to decide how to settle the reckoning#!"
 action_kehillah_crisis_recovery_books:0 "Our books are lost"
 action_kehillah_crisis_recovery_books_label:0 "Ask Another Kehillah for Books"
 action_kehillah_crisis_recovery_books_desc:0 "Another community could send copies and lend us its scribes, if we ask."
 action_kehillah_crisis_recovery_books_click:0 "#I Click to decide whom to ask for books#!"
 action_kehillah_crisis_recovery_justice:0 "The agitator goes unpunished"
 action_kehillah_crisis_recovery_justice_label:0 "Demand Justice"
 action_kehillah_crisis_recovery_justice_desc:0 "The ruler let the man who raised the host go free. He might yet be asked to reconsider."
 action_kehillah_crisis_recovery_justice_click:0 "#I Click to decide how to petition the ruler#!"
 action_kehillah_crisis_recovery_captives:0 "Our people are held captive"
 action_kehillah_crisis_recovery_captives_label:0 "Redeem the Captives"
 action_kehillah_crisis_recovery_captives_desc:0 "Members of the community are still held by those who attacked us. They may be ransomed while there is time."
 action_kehillah_crisis_recovery_captives_click:0 "#I Click to decide how to redeem them#!"
 action_kehillah_crisis_recovery_returnees:0 "The forced converts may wish to return"
 action_kehillah_crisis_recovery_returnees_label:0 "Speak for the Forced Converts"
 action_kehillah_crisis_recovery_returnees_desc:0 "Some of those baptized under threat are asking whether they may come home to the community."
 action_kehillah_crisis_recovery_returnees_click:0 "#I Click to decide how to receive them#!"

 # The Talmud trial.
 action_kehillah_trial_defence:0 "The disputation needs a defence"
 action_kehillah_trial_defence_label:0 "Prepare the Defence"
 action_kehillah_trial_defence_desc:0 "Our books stand accused. Someone must be ready to answer for them before the judges."
 action_kehillah_trial_defence_click:0 "#I Click to decide how to prepare the defence#!"
 action_kehillah_trial_protect:0 "The books have no protector"
 action_kehillah_trial_protect_label:0 "Seek Protection"
 action_kehillah_trial_protect_desc:0 "A powerful patron could still speak for the community before the verdict is given."
 action_kehillah_trial_protect_click:0 "#I Click to decide whom to ask#!"
 action_kehillah_trial_books:0 "The books are at risk"
 action_kehillah_trial_books_label:0 "Save the Books"
 action_kehillah_trial_books_desc:0 "If the verdict goes against us, the books will be seized. Some could still be hidden or sent away."
 action_kehillah_trial_books_click:0 "#I Click to decide what to do with the books#!"

 # The decree.
 action_kehillah_decree_answer:0 "The decree awaits an answer"
 action_kehillah_decree_answer_label:0 "Answer the Decree"
 action_kehillah_decree_answer_desc:0 "The decree has been proclaimed against the community. The elders are waiting to hear how we will answer it."
 action_kehillah_decree_answer_click:0 "#I Click to decide how to answer the decree#!"
