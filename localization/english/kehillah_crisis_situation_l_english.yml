 kehillah_crisis_watch_decision:0 "Post a Watch"
 kehillah_crisis_watch_decision_desc:0 "Our own men will walk the quarter at night."
 kehillah_crisis_watch_decision_tooltip:0 "Post a watch over the quarter."
 kehillah_crisis_watch_decision_confirm:0 "Post the watch"
 kehillah_crisis_watch_decision_effect_tt:0 "In fourteen days, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_watch_points')|0]#! toward Spared, and the quarter is better defended if a host comes."
 kehillah_crisis_supplies_decision:0 "Lay In Provisions"
 kehillah_crisis_supplies_decision_desc:0 "Grain, oil and water, so the quarter can hold out."
 kehillah_crisis_supplies_decision_tooltip:0 "Lay in provisions for a siege."
 kehillah_crisis_supplies_decision_confirm:0 "Buy the provisions"
 kehillah_crisis_supplies_decision_effect_tt:0 "In fourteen days, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_supplies_points')|0]#! toward Spared, and a siege does less harm."
 kehillah_crisis_routes_decision:0 "Prepare a Way Out"
 kehillah_crisis_routes_decision_desc:0 "The families will know which gate to take, and where to go."
 kehillah_crisis_routes_decision_tooltip:0 "Prepare the families' escape."
 kehillah_crisis_routes_decision_confirm:0 "Prepare the way"
 kehillah_crisis_routes_decision_effect_tt:0 "In fourteen days, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_routes_points')|0]#! toward Spared, and families can escape if a host comes."
 kehillah_crisis_advocacy_decision:0 "Answer the Accusations"
 kehillah_crisis_advocacy_decision_desc:0 "Our answer to the charges will be spoken in the market and at the lord's hall."
 kehillah_crisis_advocacy_decision_tooltip:0 "Answer the charges in the town."
 kehillah_crisis_advocacy_decision_confirm:0 "Answer them"
 kehillah_crisis_advocacy_decision_effect_tt:0 "In fourteen days, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_advocacy_points')|0]#! toward Spared, and the agitation falls."
 kehillah_crisis_council_decision:0 "Gather the Elders"
 kehillah_crisis_council_decision_desc:0 "The elders will decide whom to ask for protection: the lord, the Church, or the agitator himself."
 kehillah_crisis_council_decision_tooltip:0 "Gather the elders to seek protection."
 kehillah_crisis_council_decision_confirm:0 "Gather them"
 kehillah_crisis_council_decision_effect_tt:0 "The elders gather. Protection won from the lord or the Church adds to Spared each month."
