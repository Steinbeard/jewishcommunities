l_english:
 situation_type_kehillah_community_crisis:0 "Danger to a Jewish Community"
 situation_kehillah_community_crisis:0 "Danger to the [Situation.MakeScope.Var('kehillah_crisis_title').Title.GetNameNoTooltip]"
 situation_type_kehillah_community_crisis_desc:0 "A Jewish community is threatened. The danger grows each month toward an armed host; the community and its friends work to see it pass."
 situation_kehillah_community_crisis_desc:0 "$situation_type_kehillah_community_crisis_desc$"
 kehillah_community_crisis_sub_region_kehillah_crisis_area:0 "Threatened community"
 kehillah_community_crisis_participant_group_kehillah_crisis_community:0 "The community"
 kehillah_community_crisis_participant_group_kehillah_crisis_community_desc:0 "The leader of the threatened Kehillah."
 kehillah_community_crisis_participant_group_kehillah_crisis_sovereign:0 "Sovereign"
 kehillah_community_crisis_participant_group_kehillah_crisis_sovereign_desc:0 "The ruler who can answer the community's petitions."
 kehillah_community_crisis_participant_group_kehillah_crisis_agitator:0 "Agitator"
 kehillah_community_crisis_participant_group_kehillah_crisis_agitator_desc:0 "The preacher or host leader behind the threat, and whoever swore to the charge."
 kehillah_community_crisis_kehillah_crisis_warning_situation_phase:0 "Agitation"
 kehillah_community_crisis_kehillah_crisis_armed_situation_phase:0 "Armed host"
 kehillah_community_crisis_kehillah_crisis_spared_situation_phase:0 "Spared"
 kehillah_community_crisis_kehillah_crisis_judgement_situation_phase:0 "Awaiting judgment"
 kehillah_community_crisis_kehillah_crisis_recovery_situation_phase:0 "Recovery"
 kehillah_crisis_warning:0 "Agitation"
 kehillah_crisis_warning_desc:0 "The agitator stirs the town against us. If the Armed host fills first, a host rises; if Spared fills first, the danger passes. Prepare, and seek protection, before the crowd is ready."
 kehillah_crisis_armed:0 "Armed host"
 kehillah_crisis_armed_desc:0 "An armed host threatens the quarter. Its march and its siege decide what follows."
 kehillah_crisis_spared:0 "Spared"
 kehillah_crisis_spared_desc:0 "The danger has passed. We wait for the sovereign's answer: protection, a price, or worse."
 kehillah_crisis_judgement:0 "Awaiting judgment"
 kehillah_crisis_judgement_desc:0 "The immediate danger has passed. We wait for the sovereign's answer."
 kehillah_crisis_recovery:0 "Recovery"
 kehillah_crisis_recovery_desc:0 "The sovereign has answered. The community faces the consequences and begins to recover."
 kehillah_crisis_armed_catalyst:0 "A host rises"
 kehillah_crisis_armed_catalyst_desc:0 "A host has formed against the community."
 kehillah_crisis_judgement_catalyst:0 "The danger is ended"
 kehillah_crisis_judgement_catalyst_desc:0 "The threat was dispersed, bought off or defeated."
 kehillah_crisis_recovery_catalyst:0 "The sovereign answers"
 kehillah_crisis_recovery_catalyst_desc:0 "The sovereign has answered and recovery begins."
 kehillah_crisis_opening_catalyst:0 "The crowd is stirred"
 kehillah_crisis_opening_catalyst_desc:0 "The town was already roused when the agitation began."
 kehillah_crisis_preaching_catalyst:0 "The preaching continues"
 kehillah_crisis_preaching_catalyst_desc:0 "Each month the agitator works the crowd, and it grows angrier."
 kehillah_crisis_cold_lord_catalyst:0 "A cold sovereign"
 kehillah_crisis_cold_lord_catalyst_desc:0 "The sovereign is known to care little for the Jews, and the crowd knows it."
 kehillah_crisis_holy_war_catalyst:0 "A holy war is preached"
 kehillah_crisis_holy_war_catalyst_desc:0 "Men are taking vows for a holy war, and some ask why they should march abroad while unbelievers live at home."
 kehillah_crisis_protection_catalyst:0 "Protection secured"
 kehillah_crisis_protection_catalyst_desc:0 "Each month, the protection we have won from the lord or the Church holds the crowd back."
 kehillah_crisis_goodwill_catalyst:0 "A friendly sovereign"
 kehillah_crisis_goodwill_catalyst_desc:0 "The sovereign is known to favor the Jews, and the crowd knows it."
 kehillah_crisis_watch_catalyst:0 "The watch is posted"
 kehillah_crisis_watch_catalyst_desc:0 "Our own men walk the quarter at night."
 kehillah_crisis_supplies_catalyst:0 "Provisions are laid in"
 kehillah_crisis_supplies_catalyst_desc:0 "The quarter can hold out if it must."
 kehillah_crisis_routes_catalyst:0 "A way out is ready"
 kehillah_crisis_routes_catalyst_desc:0 "The families know where to go."
 kehillah_crisis_advocacy_catalyst:0 "The accusations are answered"
 kehillah_crisis_advocacy_catalyst_desc:0 "Our answer to the charges is spoken in the town."
 kehillah_crisis_phase_pressure:0 "Preaching next month: #N +[Situation.MakeScope.ScriptValue('kehillah_crisis_next_push_value')|0]#! toward the Armed host"
 kehillah_crisis_situation_actions_header:0 "Actions"
 kehillah_crisis_open_situation:0 "Open the crisis"
 kehillah_crisis_show_military_actions:0 "Show preparations here"
 kehillah_crisis_hide_military_actions:0 "Hide preparations"
 kehillah_crisis_watch_decision:0 "Post a Watch"
 kehillah_crisis_watch_decision_desc:0 "Our own men will walk the quarter at night."
 kehillah_crisis_watch_decision_tooltip:0 "Post a watch over the quarter."
 kehillah_crisis_watch_decision_confirm:0 "Post the watch"
 kehillah_crisis_watch_decision_effect_tt:0 "In fourteen days, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_watch_points')|0]#! toward Spared, and the quarter is better defended if a host comes."
 kehillah_crisis_supplies_decision:0 "Lay In Provisions"
 kehillah_crisis_supplies_decision_desc:0 "Grain, oil and water, so the quarter can hold out."
 kehillah_crisis_supplies_decision_tooltip:0 "Lay in provisions for a siege."
 kehillah_crisis_supplies_decision_confirm:0 "Buy the provisions"
 kehillah_crisis_supplies_decision_effect_tt:0 "In fourteen days, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_supplies_points')|0]#! toward Spared, and a siege does less harm."
 kehillah_crisis_routes_decision:0 "Prepare a Way Out"
 kehillah_crisis_routes_decision_desc:0 "The families will know which gate to take, and where to go."
 kehillah_crisis_routes_decision_tooltip:0 "Prepare the families' escape."
 kehillah_crisis_routes_decision_confirm:0 "Prepare the way"
 kehillah_crisis_routes_decision_effect_tt:0 "In fourteen days, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_routes_points')|0]#! toward Spared, and families can escape if a host comes."
 kehillah_crisis_advocacy_decision:0 "Answer the Accusations"
 kehillah_crisis_advocacy_decision_desc:0 "Our answer to the charges will be spoken in the market and at the lord's hall."
 kehillah_crisis_advocacy_decision_tooltip:0 "Answer the charges in the town."
 kehillah_crisis_advocacy_decision_confirm:0 "Answer them"
 kehillah_crisis_advocacy_decision_effect_tt:0 "In fourteen days, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_advocacy_points')|0]#! toward Spared, and the agitation falls."
 kehillah_crisis_council_decision:0 "Gather the Elders"
 kehillah_crisis_council_decision_desc:0 "The elders will decide whom to ask for protection: the lord, the Church, or the agitator himself."
 kehillah_crisis_council_decision_tooltip:0 "Gather the elders to seek protection."
 kehillah_crisis_council_decision_confirm:0 "Gather them"
 kehillah_crisis_council_decision_effect_tt:0 "The elders gather. Protection won from the lord or the Church adds to Spared each month."
