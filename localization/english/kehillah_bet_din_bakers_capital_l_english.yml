l_english:
 kehillah_bet_din.0191.t:0 "The Baker's Missing Capital"
 kehillah_bet_din.0191.desc:0 "[kbd_litigant_a.GetFirstName] says the bakery's grain supplier has not been paid. [kbd_litigant_b.GetFirstName], the other partner, says a season of poor sales consumed the capital. The account book stops before the last delivery. The judges must decide who carries the debt while the supplier waits."
 kehillah_bet_din.0191.a:0 "Pay the supplier from communal reserves and charge the second partner."
 kehillah_bet_din.0191.a.tt:0 "The supplier is paid at once, but incomplete books may make the accusation unjust. Prosperity bears a large cost."
 kehillah_bet_din.0191.b:0 "Audit the deliveries before dividing the loss."
 kehillah_bet_din.0191.b.tt:0 "Both partners open their books to an independent accountant. The supplier receives a smaller advance while the court establishes what was taken in."
 kehillah_bet_din.0191.c:0 "Split the loss evenly and close the partnership."
 kehillah_bet_din.0191.c.tt:0 "The supplier gets a settlement quickly, but an equal split may hide a clear debt in the complete accounts."
 kehillah_din_source_19:0 "Cite a mastered Nezikin work and audit the partnership."
 kehillah_din_source_19_tt:0 "A Nezikin work can guide the court on entrusted property and trade obligations. It cannot supply the missing entries in these bakers' books."
 kehillah_din_combo_19:0 "Pair a careful scholar with a steward to reconstruct the ledger."
 kehillah_din_combo_19_tt:0 "The judges compare deliveries, withdrawals and receipts before allocating the loss."
 kehillah_bet_din.0194.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0194.desc:0 "[kbd_litigant_a.GetFirstName] says the bakery's grain supplier has not been paid. [kbd_litigant_b.GetFirstName], the other partner, says a season of poor sales consumed the capital. The account book stops before the last delivery. The judges must decide who carries the debt while the supplier waits."
 kehillah_bet_din.0194.outcome_1:0 "The court pays the supplier from its reserves and charges the second partner. The bakery can keep buying grain, but the books remain incomplete."
 kehillah_bet_din.0194.outcome_2:0 "The court advances part of the debt and orders an independent accounting of deliveries and withdrawals."
 kehillah_bet_din.0194.outcome_3:0 "The partners divide the loss and dissolve their venture. The supplier accepts payment, though neither partner thinks the division was proved."
 kehillah_bet_din.0194.fact_true:0 "The missing pages conceal a withdrawal by the first partner. Charging the second partner alone was unjust."
 kehillah_bet_din.0194.fact_false:0 "The books reconcile with the supplier's receipts. Equal division ignored a traceable obligation."
 kehillah_bet_din.0194.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0194.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0194.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case19_one_tt:0 "The supplier is paid from communal reserves. Prosperity pays the larger cost."
 kehillah_din_case19_two_tt:0 "An audit and advance cost some Prosperity."
 kehillah_din_case19_three_tt:0 "The settlement costs less Prosperity but may misallocate the debt."
 kehillah_bet_din_case19_great_log_title:0 "The Baker's Missing Capital: a well-supported ruling"
 kehillah_bet_din_case19_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s bakery debt claim."
