l_english:
 # On Whose Authority? (2026-11-11). events/kehillah_din_cite_events.txt;
 # docs/spec/2026-11-11-rulings-sermons-and-gates.md section 2.
 kehillah_din_cite.0001.t:0 "On Whose Authority?"
 kehillah_din_cite.0001.desc:0 "The ruling will rest on the sources. A court that names its authority is heard with respect, and the work it names is remembered with the ruling. Which shall it be?"
 kehillah_din_cite.0001.grounded:0 "#EMP [GetPlayer.Custom('KehillahDinCiteGrounded')]#!, the surest ground. [GetPlayer.Custom('KehillahDinCiteGroundedRisk')]"
 kehillah_din_cite.0001.innovative:0 "#EMP [GetPlayer.Custom('KehillahDinCiteInnovative')]#!: a newer voice, and a bolder ruling. [GetPlayer.Custom('KehillahDinCiteInnovativeRisk')]"
 kehillah_din_cite.0001.conviction:0 "#EMP [GetPlayer.Custom('KehillahDinCiteConviction')]#!, whose teaching we hold. [GetPlayer.Custom('KehillahDinCiteConvictionRisk')]"
 # 2026-11-23: strength and reliability (kehillah_din_cite_roll_effect).
 kehillah_din_cite_rare_tt:0 "Few scholars have studied this work: the parties will not have weighed its view."
 kehillah_din_cite_known_tt:0 "Some scholars have studied this work."
 kehillah_din_cite_common_tt:0 "Every scholar knows this work: it offers the parties little they have not heard."
 kehillah_din_cite_holds_decisive_tt:0 "The argument holds: the ruling is #P decisively#! strengthened."
 kehillah_din_cite_holds_strong_tt:0 "The argument holds: the ruling is #P greatly#! strengthened."
 kehillah_din_cite_holds_solid_tt:0 "The argument holds: the ruling is #P strengthened#!."
 kehillah_din_cite_holds_modest_tt:0 "The argument holds: the ruling is #P a little#! strengthened."
 kehillah_din_cite_fails_tt:0 "The argument does not hold: the ruling is #N weakened#!, and no work is named."
 kehillah_din_no_source_tt:0 "A judge must have mastered a work on this order of the law to cite it"

 kehillah_din_cite_banned_risk_tt:0 "@warning_icon! #N The host's rite bans this book. Citing it adds 5 Cherem experience to the citing judge, even if the argument fails (unless already in full Cherem).#!"
 kehillah_din_cite_anathema_risk_tt:0 "@warning_icon! #N The host's rite places this book under anathema. Citing it adds 15 Cherem experience to the citing judge, even if the argument fails (unless already in full Cherem).#!"
 kehillah_din_cite_risk_mark:0 "@warning_icon!"
 kehillah_din_cite_risk_none:0 ""
