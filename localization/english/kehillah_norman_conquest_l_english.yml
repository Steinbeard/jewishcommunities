l_english:
 # Localization for common/scripted_effects/kehillah_norman_conquest_effects.txt
 # and events/kehillah_norman_conquest_events.txt (v18 spec, 2026-09-25).

 # Fixed title names for the four dynamically-founded Anglia communities --
 # unlike kehillah_found_community_title_name, these do not need to read a
 # dynamic [kehillah_founding_county...] link, since each founding effect
 # already knows exactly which city it is naming.
 kehillah_norman_london_title_name:0 "Kehillah of London"
 kehillah_norman_york_title_name:0 "Kehillah of York"
 kehillah_norman_lincoln_title_name:0 "Kehillah of Lincoln"
 kehillah_norman_norwich_title_name:0 "Kehillah of Norwich"

 kehillah_norman_conquest.0001.t:0 "Settlers From Across the Sea"
 kehillah_norman_conquest.0001.william.desc:0 "Word reaches your court of a small but notable consequence of the Conquest: Jewish families, many by way of Rouen in your own Normandy, have begun settling in London, York, Lincoln, and Norwich, drawn by the promise of a stable and profitable peace under your rule. Among the newcomers to London are said to be kin of the renowned scholar Shlomo Yitzhaki of Troyes -- household ties reaching back across the Channel to the heart of Ashkenaz. Your stewards advise that such settlers bring coin, trade connections, and no shortage of goodwill toward the crown that welcomes them. You have granted them a favorable charter."
 kehillah_norman_conquest.0001.harald.desc:0 "Word reaches your court of a small but notable consequence of your new reign: Jewish families have begun settling in London, York, Lincoln, and Norwich, drawn across the northern seas by the promise of a stable and profitable peace. Your stewards advise that such settlers bring coin and trade connections reaching back into the Rhineland. You have granted them a favorable charter."
 kehillah_norman_conquest.0001.other.desc:0 "Word reaches your court of a small but notable consequence of the crown settling onto your own head: Jewish families have begun settling in London, York, Lincoln, and Norwich, drawn by the promise of a stable and profitable peace under your rule. Your stewards advise that such settlers bring coin and trade connections of their own. You have granted them a favorable charter."
 kehillah_norman_conquest.0001.a:0 "So be it."

 # ROADMAP S8, 2026-09-29 -- the player's road to London.
 kehillah_norman_london_title_name_adj:0 "London"
 kehillah_norman_conquest.0010.t:0 "An Invitation From the King"
 kehillah_norman_conquest.0010.desc:0 "A royal messenger finds your camp. [kehillah_norman_king.GetShortUIName], master now of England, means to rule it with coin as well as steel, and his stewards have been asking in Rouen after Jews who understand money.\n\nHe offers a place in London, the protection of the crown, and a charter as generous as any in Christendom, if you will cross the Channel and settle there."
 kehillah_norman_conquest.0010.a:0 "We cross to London."
 kehillah_norman_conquest.0010.a.tt:0 "You and your followers cross to #high London#! and found a Jewish community there under the king's protection, with Jewish settlement #P Encouraged#! in his realm"
 kehillah_norman_conquest.0010.b:0 "Let others go."
 kehillah_norman_conquest.0010.b.tt:0 "Other Jewish families take up the offer and found the Kehillah of London without you"
