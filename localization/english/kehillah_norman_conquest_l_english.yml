l_english:
 # Localization for common/scripted_effects/kehillah_norman_conquest_effects.txt
 # and events/kehillah_norman_conquest_events.txt (v18 spec, 2026-09-25).

 # Fixed title names for the four dynamically-founded Anglia communities --
 # unlike kehillah_found_community_title_name, these do not need to read a
 # dynamic [kehillah_founding_county...] link, since each founding effect
 # already knows exactly which city it is naming.
 kehillah_norman_london_title_name:0 "Kehillah of London"
 kehillah_norman_york_title_name:0 "Kehillah of York"
 kehillah_norman_lincoln_title_name:0 "Kehillah of Lincoln"
 kehillah_norman_norwich_title_name:0 "Kehillah of Norwich"

 kehillah_norman_conquest.0001.t:0 "Letters Across the Sea"
 kehillah_norman_conquest.0001.william.desc:0 "Your seal now travels to Jewish households across the Channel. You offer them protection and leave the towns of England open to those willing to cross. Your stewards will report on the response in a year's time."
 kehillah_norman_conquest.0001.harald.desc:0 "Your seal travels to Jewish households across the northern seas. You offer protection to those willing to settle in England. Your stewards will report on the response in a year's time."
 kehillah_norman_conquest.0001.other.desc:0 "Your invitation goes to Jewish households abroad, offering protection to those willing to settle in England. Your stewards will report on the response in a year's time."
 kehillah_norman_conquest.0001.a:0 "So be it."
 kehillah_invite_jews_to_england_decision:0 "Invite Jewish Settlers to England"
 kehillah_invite_jews_to_england_decision_desc:0 "Send letters to Jewish households abroad, offering protection and a place in England's towns. Those who answer may found their own communities. After a year, the crown will help establish enough settlements to reach three communities if fewer have arrived."
 kehillah_invite_jews_to_england_decision_tooltip:0 "Invite Jewish settlers, with the Jews Favored"
 kehillah_invite_jews_to_england_decision_confirm:0 "Send the letters"
 kehillah_invite_jews_to_england_decision_effect_tt:0 "The Jews become Favored and an invitation is sent. After one year, vacant English sites can be founded to make up a shortfall to three communities."
 kehillah_invite_jews_to_england_decision_eligible_tt:0 "You are an independent ruler who can set the Status of the Jews"

 # ROADMAP S8, 2026-09-29 -- the player's road to London.
 kehillah_norman_london_title_name_adj:0 "London"
 kehillah_norman_conquest.0010.t:0 "An Invitation From England"
 kehillah_norman_conquest.0010.desc:0 "A messenger from [kehillah_norman_king.GetShortUIName] finds your camp. The crown's stewards seek traders and lenders for London.\n\nThe messenger offers your followers a place there under the crown's protection, with a favorable charter if you settle."
 kehillah_norman_conquest.0010.a:0 "We cross to London."
 kehillah_norman_conquest.0010.a.tt:0 "You and your followers travel to #high London#! and found a Jewish community there under the crown's protection, with the Jews #P Favored#! in England"
 kehillah_norman_conquest.0010.b:0 "Let others go."
 kehillah_norman_conquest.0010.b.tt:0 "Other Jewish families take up the offer and found the Kehillah of London without you"
