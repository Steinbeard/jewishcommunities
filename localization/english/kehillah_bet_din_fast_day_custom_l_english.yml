l_english:
 kehillah_bet_din.0761.t:0 "The Conflicting Fast-Day Customs"
 kehillah_bet_din.0761.desc:0 "[kbd_litigant_a.GetFirstName] speaks for local elders who announce one practice for the coming fast. [kbd_litigant_b.GetFirstName] speaks for refugees whose former community observed another. Both groups will gather in the same synagogue. The elders have an old minute book, but its final page is missing."
 kehillah_bet_din.0761.a:0 "Impose the elders' practice on everyone."
 kehillah_bet_din.0761.a.tt:0 "One service is simple, but a binding accommodation may be ignored."
 kehillah_bet_din.0761.b:0 "Keep separate services while checking the communal minute."
 kehillah_bet_din.0761.b.tt:0 "Parallel services cost effort while the community checks its record."
 kehillah_bet_din.0761.c:0 "Replace the local practice with the refugees' version."
 kehillah_bet_din.0761.c.tt:0 "A valid local rule may be overturned for newcomers without consent."
 kehillah_din_source_76:0 "Cite a mastered Moed work and examine the evidence."
 kehillah_din_source_76_tt:0 "Mishnah Ta'anit 3:1 gives the judges a textual point of reference. It cannot establish the community's agreement about this fast."
 kehillah_din_combo_76:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_76_tt:0 "The judges preserve both parties' interests while checking the community's agreement about this fast."
 kehillah_bet_din.0764.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0764.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0764.outcome_1:0 "The court orders one service under the elders' custom."
 kehillah_bet_din.0764.outcome_2:0 "The court arranges separate services and seeks the missing minute."
 kehillah_bet_din.0764.outcome_3:0 "The court adopts the refugees' practice for all."
 kehillah_bet_din.0764.fact_true:0 "The missing minute grants newcomers their own observance. Forced uniformity broke that agreement."
 kehillah_bet_din.0764.fact_false:0 "The minute confirms the established local practice as binding for shared services. Replacing it ignored the pact."
 kehillah_bet_din.0764.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0764.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0764.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case76_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case76_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case76_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
