l_english:
 # The three standing actions (2026-11-01, docs/spec/2026-11-01-three-standing-actions.md).
 kehillah_crisis_prepare_decision:0 "Prepare the Quarter"
 kehillah_crisis_prepare_decision_desc:0 "The watch, the stores, a way out, and prayer: what the community can do for itself."
 kehillah_crisis_prepare_decision_tooltip:0 "Decide what the community will do for itself."
 kehillah_crisis_prepare_decision_confirm:0 "Call the elders"
 kehillah_crisis_prepare_decision_effect_tt:0 "Opens a scene with the community's own preparations."
 kehillah_crisis_protect_decision:0 "Seek Protection"
 kehillah_crisis_protect_decision_desc:0 "The lord, his overlord, the men of religion, the town: whoever might shield the quarter."
 kehillah_crisis_protect_decision_tooltip:0 "Decide whom to ask for protection."
 kehillah_crisis_protect_decision_confirm:0 "Consider it"
 kehillah_crisis_protect_decision_effect_tt:0 "Opens a scene with those who might protect the quarter."
 kehillah_crisis_case_decision:0 "Make Our Case"
 kehillah_crisis_case_decision_desc:0 "Answer the charges, expose the accuser, and win back the town."
 kehillah_crisis_case_decision_tooltip:0 "Decide how to answer the charges."
 kehillah_crisis_case_decision_confirm:0 "Consider it"
 kehillah_crisis_case_decision_effect_tt:0 "Opens a scene with the ways to answer the charges."
 kehillah_crisis_find_window_tt:0 "The danger to the community is in your #V Situations#! list. Act from there."

 kehillah_crisis_act.not_now:0 "Not now."

 kehillah_crisis_act.0001.t:0 "Prepare the Quarter"
 kehillah_crisis_act.0001.desc:0 "The elders meet in the synagogue's upper room. Whatever the lord or the town decides, some things are ours to do: men at the gates at night, grain in the cellars, a road out that every family knows, and a fast to ask for Heaven's mercy.\n\nWhat shall the community do for itself?"
 kehillah_crisis_act.0001.desc_vizier:0 "In the palace you are the vizier of Granada. In the quarter you are the head of its families, and the families are frightened. Abu Ishaq's verses are recited in the souk, and the Sanhaja guards no longer lower their eyes when a Jew passes.\n\nAt home your wife has begun putting clothes aside for the road to Lucena, where scholars who knew her father would take her and the boy in.\n\nWhat shall the community do for itself?"
 kehillah_crisis_act.0001.desc_armed:0 "The host is on the road, and the quarter has days, not weeks. The stone houses at its heart could hold the families, and chains across the street ends could hold the doors.\n\nWhat can still be done?"
 kehillah_crisis_act.0001.watch:0 "Post a watch: our own men will walk the quarter at night."
 kehillah_crisis_act.0001.supplies:0 "Lay in grain, oil and water, so the quarter can hold out."
 kehillah_crisis_act.0001.routes:0 "Prepare a way out: every family will know which gate to take."
 kehillah_crisis_act.0001.almeria:0 "Seek a discreet promise of refuge in [GetTitleByKey('c_almeria').GetNameNoTier]."
 kehillah_crisis_act.0001.fast:0 "Proclaim a fast, and fill the synagogue with prayer."
 kehillah_crisis_act.0001.shelter:0 "Move the families into the stone houses at the heart of the quarter."
 kehillah_crisis_act.0001.bar:0 "Chains across the street ends, and a man at every door."
 kehillah_crisis_act.almeria_secret:0 "The letter stays secret"
 kehillah_crisis_act.almeria_secret_tt:0 "No one at the palace learns of it."
 kehillah_crisis_act.almeria_found:0 "The letter is found"

 kehillah_crisis_act.0002.t:0 "Seek Protection"
 kehillah_crisis_act.0002.desc:0 "A community without arms has always had to borrow them. The lord who holds the town, his overlord, the men of religion, the council that keeps the streets: each could shield the quarter, and each will want something for it.\n\nTo whom shall we turn?"
 kehillah_crisis_act.0001.desc_accusation:0 "The crowd went home that night, but the charge did not. It is repeated at the well and in the market, and [kehillah_crisis_agitator.GetFirstName] repeats it louder than anyone. The quarter's gates are shut early now, and no one walks alone after dark.\n\nWhat shall the community do for itself?"
 kehillah_crisis_act.0002.desc_accusation:0 "A charge like this is settled by whoever has the power to settle it. The lord can silence it or let it run; the men of religion can call it a lie or say nothing. Every week it runs, it is harder to stop.\n\nTo whom shall we turn?"
 kehillah_crisis_act.0003.desc_accusation:0 "Every charge has a teller, and every teller has a story that can be picked apart: who saw what, and when, and who has been telling him what to remember.\n\nHow shall we make our case?"
 kehillah_crisis_act.0001.desc_debts:0 "The debtors have stopped meeting in secret. The account books are in the countinghouse, and everyone in town knows it: so do the men who would like to see them burn.\n\nWhat shall the community do for itself?"
 kehillah_crisis_act.0002.desc_debts:0 "Debts are the lord's business as much as ours. He taxes what we lend, and a town that burns its debts burns his revenue with them. He may protect the books for his own sake, if someone reminds him.\n\nTo whom shall we turn?"
 kehillah_crisis_act.0003.desc_debts:0 "The debtors say the interest is theft and the loans were forced on them. Some of it is lies, and some of it is hunger talking. Answering it means opening the books, or forgiving what can be forgiven.\n\nHow shall we make our case?"
 kehillah_crisis_act.0001.desc_holy_week:0 "Good Friday is coming. Every year the quarter closes its shutters and keeps its people indoors until the Easter bells; every year someone throws stones anyway. This year the sermons have been harder.\n\nWhat shall the community do for itself?"
 kehillah_crisis_act.0002.desc_holy_week:0 "In some towns the bishop keeps order in Holy Week himself, and in some the lord's sergeants stand at the end of the street. In others no one comes at all.\n\nTo whom shall we turn?"
 kehillah_crisis_act.0003.desc_holy_week:0 "The preachers of Holy Week speak of the Passion, and of those they blame for it. A sermon cannot be answered in the square, but the men who give it have superiors who can tell them to stop.\n\nHow shall we make our case?"
 kehillah_crisis_act.0001.desc_crusade:0 "The vow-takers drill in the fields outside the walls and drink in the town at night. When they leave for the holy war they will pass the quarter, and some of them have said what they mean to do on the way.\n\nWhat shall the community do for itself?"
 kehillah_crisis_act.0002.desc_crusade:0 "Bishops have hidden Jews in their palaces before, and lords have taken silver to stand between the crusaders and the quarter. Some have taken the silver and stood aside.\n\nTo whom shall we turn?"
 kehillah_crisis_act.0003.desc_crusade:0 "The vow-takers were told that the enemies of their faith are abroad. Someone has told them they are also here. Whoever told them can be answered, and so, perhaps, can the men who lead them.\n\nHow shall we make our case?"
 kehillah_crisis_act.0002.desc_vizier:0 "Your father served the emirs of Granada for thirty years, and you have served them since. Whatever protection the Jews of Granada have comes from the emir's hand, and from the notables who still owe your house favours.\n\nTo whom shall we turn?"
 kehillah_crisis_act.0002.desc_armed:0 "The host is on the road. Letters and gifts are too slow now: only the lord's soldiers can stand between the quarter and what is coming.\n\nWill he send them?"
 kehillah_crisis_act.0002.powerful:0 "Go to the powerful: the lord, his overlord, or the men of religion."
 kehillah_crisis_act.0002.powerful_vizier:0 "Go to the emir, his court, or the qadi."
 kehillah_crisis_act.0002.town:0 "Send gifts to the town council and the guild masters."
 kehillah_crisis_act.0002.town_vizier:0 "Send gifts to the city's notables and the Sanhaja chiefs."
 kehillah_crisis_act.0002.appeal:0 "Write to the ruler or the head of the faith, asking for a condemnation."
 kehillah_crisis_act.0002.appeal_vizier:0 "Ask the qadi and the jurists of Granada to rule against the verses."
 kehillah_crisis_act.0002.plead:0 "Go to the lord, and beg him to send his men."

 kehillah_crisis_act.0003.t:0 "Make Our Case"
 kehillah_crisis_act.0003.desc:0 "The charges are spoken in the market every day, and every day more people repeat them. Someone must answer them: in the square, in the lord's hall, or in the agitator's own camp.\n\nHow shall we make our case?"
 kehillah_crisis_act.0003.desc_vizier:0 "They say the vizier poisoned the emir's son, that he plots with Almería, that the Jews of Granada have climbed too high. Abu Ishaq's verses say it better than any accuser could.\n\nHow shall we make our case?"
 kehillah_crisis_act.0003.desc_armed:0 "The time for answering the charges is past. The host's leaders can still be reached, and men who march for plunder can sometimes be paid to march more slowly.\n\nWhat can still be said?"
 kehillah_crisis_act.0003.answer:0 "Answer him in public, before the town."
 kehillah_crisis_act.0003.answer_vizier:0 "Answer the poet, verse for verse."
 kehillah_crisis_act.0003.advocacy:0 "Have our answer spoken in the market and at the lord's hall."
 kehillah_crisis_act.0003.advocacy_vizier:0 "Let our friends at court speak for us."
 kehillah_crisis_act.0003.discredit:0 "Find what he hides, and make it known."
 kehillah_crisis_act.0003.camp:0 "Go out to his camp, and see whether he can be reasoned with."
 kehillah_crisis_act.0003.neighbours:0 "Ask the neighbours who offered to speak before the council."
 kehillah_crisis_act.0003.forgive:0 "Forgive what the townsmen owe us."
 kehillah_crisis_act.0003.silver:0 "Send silver to the host's leaders."
 kehillah_crisis_silver_muster_tt:0 "The host is still gathering: it stays in camp longer."

 # Granada's reactions.
 kehillah_granada.0002.d:0 "Remind [kehillah_granada_emir.GetTitledFirstName] of all that Samuel did for his house."
 kehillah_crisis_ev_almeria_plot_catalyst:0 "The Almería letter found"
 kehillah_crisis_ev_almeria_plot_catalyst_desc:0 "A letter meant for al-Mu'tasim's people reached the palace instead. It is the very plot they accuse the vizier of."
 kehillah_crisis_ev_emir_trusts_catalyst:0 "The emir's confidence"
 kehillah_crisis_ev_emir_trusts_catalyst_desc:0 "The emir heard the vizier out, and believed him."
 kehillah_crisis_ev_emir_doubts_catalyst:0 "The emir's doubt"
 kehillah_crisis_ev_emir_doubts_catalyst_desc:0 "The emir heard the vizier out, and did not believe him."
 kehillah_crisis_ev_samuel_remembered_catalyst:0 "Samuel's service remembered"
 kehillah_crisis_ev_samuel_remembered_catalyst_desc:0 "The emir was reminded of thirty years of Samuel ha-Nagid's service to his house."
 kehillah_crisis_ev_vizier_pride_catalyst:0 "The vizier's pride"
 kehillah_crisis_ev_vizier_pride_catalyst_desc:0 "The vizier would not stoop to defend himself, and his enemies took note."

 # The gate scene during the host's race.
 kehillah_crisis_held_gate_catalyst:0 "The leader stood at the gate"
 kehillah_crisis_held_gate_catalyst_desc:0 "The leader stood at the gate with the young men, and the host's first rush broke against it."
 kehillah_crisis_held_plead_catalyst:0 "Mercy at the gates"
 kehillah_crisis_held_plead_catalyst_desc:0 "The gates were opened and the elders pleaded, and some in the host were ashamed."
 kehillah_crisis_held_prayer_catalyst:0 "Prayer behind barred doors"
 kehillah_crisis_held_prayer_catalyst_desc:0 "The community barred the synagogue doors and prayed through the night."
 kehillah_crisis_struck_gate_catalyst:0 "Beaten at the gate"
 kehillah_crisis_struck_gate_catalyst_desc:0 "The leader stood at the gate and was beaten back."
 kehillah_crisis_struck_plead_catalyst:0 "Mercy scorned"
 kehillah_crisis_struck_plead_catalyst_desc:0 "The gates were opened and the elders pleaded, and the host laughed at them."

 # Granada: the road to Lucena, as Prepare the Quarter options (2026-11-01).
 kehillah_crisis_act.0001.lucena_family:0 "Send [kehillah_granada_wife.GetFirstName] and [kehillah_granada_son.GetFirstName] to Lucena before the winter."
 kehillah_crisis_act.0001.lucena_son:0 "Send [kehillah_granada_son.GetFirstName] to Lucena with his tutor. His mother stays with you."
 kehillah_crisis_ev_household_leaves_catalyst:0 "The vizier's household leaves"
 kehillah_crisis_ev_household_leaves_catalyst_desc:0 "The city saw the vizier's wife and son ride out for Lucena, and drew its own conclusions."

 # Granada's opening scene, "A Copy of the Verses".
 kehillah_crisis_ev_elders_warned_catalyst:0 "The elders warned early"
 kehillah_crisis_ev_elders_warned_catalyst_desc:0 "The elders read the poem the day it reached the vizier, and the quarter began to prepare."
 kehillah_crisis_ev_verses_unanswered_catalyst:0 "The verses go unanswered"
 kehillah_crisis_ev_verses_unanswered_catalyst_desc:0 "The vizier burned the poem and said nothing, and the souk took his silence for an answer."
 kehillah_crisis_ev_recitations_forbidden_catalyst:0 "The recitations forbidden"
 kehillah_crisis_ev_recitations_forbidden_catalyst_desc:0 "The emir forbade the poem to be recited in the souk."
 kehillah_crisis_ev_emir_shrugs_catalyst:0 "The emir shrugs"
 kehillah_crisis_ev_emir_shrugs_catalyst_desc:0 "The emir read the poem, and said that poets rail."


 # Abu Ishaq leads the host himself.
 kehillah_preacher_noun_poet:0 "poet"
 kehillah_preacher_cap_poet:0 "Poet"

 # A danger begins (kehillah_crisis_announce_effect): one toast, worded by how the crisis began.
 kehillah_crisis_begins_preacher_t:0 "A Preacher Comes to [kehillah_crisis_announce_county.GetNameNoTier]"
 kehillah_crisis_begins_preacher_d:0 "A wandering preacher has come to [kehillah_crisis_announce_county.GetNameNoTier], and the crowds that gather in the square go home angry. Every sermon ends with the Jews, and every sermon brings more men to his side.\n\n#bold The danger has begun.#! If his following becomes a host before the community is spared, it will march on the quarter. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_begins_accusation_t:0 "A Charge Against the Jews of [kehillah_crisis_announce_county.GetNameNoTier]"
 kehillah_crisis_begins_accusation_d:0 "Something is being said against the Jews in the taverns and the market of [kehillah_crisis_announce_county.GetNameNoTier], and every telling adds to it. A man has made himself its voice, and people are listening.\n\n#bold The danger has begun.#! If the talk becomes a crowd before the community is spared, the crowd will come to the quarter. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_begins_crusade_t:0 "Vows Are Sworn in [kehillah_crisis_announce_county.GetNameNoTier]"
 kehillah_crisis_begins_crusade_d:0 "Men in [kehillah_crisis_announce_county.GetNameNoTier] are swearing vows for the holy war, and they talk of the enemies of the faith at home before those abroad. The Jews of the town remember what such vows have meant before.\n\n#bold The danger has begun.#! If the vow-takers gather into a host before the community is spared, they will begin their war at our doors. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_begins_debts_t:0 "A Dear Year in [kehillah_crisis_announce_county.GetNameNoTier]"
 kehillah_crisis_begins_debts_d:0 "Bread is dear in [kehillah_crisis_announce_county.GetNameNoTier], and the loans the townsmen took from the Jews are falling due. Men who cannot pay have begun to say that they should not have to.\n\n#bold The danger has begun.#! If their anger finds a leader before the community is spared, they will try to settle the debts with fire. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_begins_holy_week_t:0 "Holy Week in [kehillah_crisis_announce_county.GetNameNoTier]"
 kehillah_crisis_begins_holy_week_d:0 "The sermons of Holy Week in [kehillah_crisis_announce_county.GetNameNoTier] have turned to the Passion, and to those who are blamed for it. Every year the Jews keep their shutters closed on Good Friday. This year that may not be enough.\n\n#bold The danger has begun.#! If the sermons send a crowd into the streets before the community is spared, it will not stop at the shutters. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_begins_rising_t:0 "Rebels Turn on the Jews of [kehillah_crisis_announce_county.GetNameNoTier]"
 kehillah_crisis_begins_rising_d:0 "A rising in the countryside has turned on the Jews. A band out of the rebels' camp, under [kehillah_crisis_announce_agitator.GetFirstName], is marching on [kehillah_crisis_announce_county.GetNameNoTier], and there was no warning.\n\n#bold The host is already armed.#! The quarter has as long as its march takes. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_begins_crusade_host_t:0 "Crusaders March on [kehillah_crisis_announce_county.GetNameNoTier]"
 kehillah_crisis_begins_crusade_host_d:0 "A band of men who took the cross has turned aside from the road to the holy war. Under [kehillah_crisis_announce_agitator.GetFirstName] they are marching on [kehillah_crisis_announce_county.GetNameNoTier], to begin their war with its Jews.\n\n#bold The host is already armed.#! The quarter has as long as its march takes. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_begins_host_t:0 "A Host Marches on [kehillah_crisis_announce_county.GetNameNoTier]"
 kehillah_crisis_begins_host_d:0 "[kehillah_crisis_announce_agitator.GetFirstName] has raised armed men against the Jews of [kehillah_crisis_announce_county.GetNameNoTier], and they are already on the road. There was no warning.\n\n#bold The host is already armed.#! The quarter has as long as its march takes. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_begins_vizier_t:0 "Verses Against the Vizier"
 kehillah_crisis_begins_vizier_d:0 "[kehillah_crisis_announce_agitator.GetFirstName]'s poem against the Jewish vizier is recited in the souks of [kehillah_crisis_announce_county.GetNameNoTier]. It calls for his death, and the Sanhaja chiefs have heard it.\n\n#bold The danger has begun.#! If they take up the call before the community is spared, they will come for the palace and the quarter. Act from #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 message_filter_kehillah_crisis_begins:0 "A Danger to the Community Begins"
 message_filter_kehillah_crisis_begins_desc:0 "When a danger to your Jewish community begins, and how"

 # Granada: riders from Almeria (kehillah_granada.0020).
 kehillah_crisis_ev_almeria_riders_catalyst:0 "Riders from Almería"
 kehillah_crisis_ev_almeria_riders_catalyst_desc:0 "Al-Mu'tasim's horsemen were seen on the eastern road, and the Sanhaja said the vizier had sent for them."
 kehillah_granada.0020.t:0 "Riders from Almería"
 kehillah_granada.0020.desc:0 "A rider comes in from the eastern road with his horse half-dead under him. Al-Mu'tasim's horsemen have been seen in the hills toward Almería, more of them than any border raid needs.\n\nBy evening the news has reached the barracks, and the Sanhaja have their own account of it: the Jewish vizier sent for them, as Abu Ishaq has been saying all along. Men who laughed at the poem a month ago are reciting it now."
 kehillah_granada.0020.a:0 "They will say I sent for them, whatever I do."

 # What drives the host, month by month (kehillah_crisis_pressure_toast_effect).
 kehillah_crisis_pressure_preacher_t:0 "The Preacher's Following Grows"
 kehillah_crisis_pressure_preacher_d:0 "He preached again in [kehillah_crisis_announce_county.GetNameNoTier], and more men stayed to hear him out.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward the #N Armed host#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_accusation_t:0 "The Charge Is Repeated"
 kehillah_crisis_pressure_accusation_d:0 "In [kehillah_crisis_announce_county.GetNameNoTier] the charge was told again in the market this month, to a larger crowd, and with more added to it.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward the #N Armed host#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_crusade_t:0 "More Vows Are Sworn"
 kehillah_crisis_pressure_crusade_d:0 "More men in [kehillah_crisis_announce_county.GetNameNoTier] have sworn the vow, and their talk keeps turning from the war abroad to the Jews at home.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward the #N Armed host#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_debts_t:0 "The Debtors Grow Bolder"
 kehillah_crisis_pressure_debts_d:0 "The debtors of [kehillah_crisis_announce_county.GetNameNoTier] meet openly now, and speak of what they owe as a wrong done to them.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward the #N Armed host#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_holy_week_t:0 "The Sermons Grow Harsher"
 kehillah_crisis_pressure_holy_week_d:0 "Each sermon in [kehillah_crisis_announce_county.GetNameNoTier] is harsher than the last, and the crowds leaving the churches walk past the quarter more slowly.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward the #N Armed host#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_armed_muster_t:0 "The Host Gathers"
 kehillah_crisis_pressure_armed_muster_d:0 "More men came to [kehillah_crisis_announce_agitator.GetFirstName]'s host this month, and more weapons with them. They have not marched yet.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward #N Quarter struck#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_armed_muster_vizier_t:0 "The Sanhaja Gather"
 kehillah_crisis_pressure_armed_muster_vizier_d:0 "In the barracks of [kehillah_crisis_announce_county.GetNameNoTier] the Sanhaja sharpen their blades, and men come in from the villages of the Vega to join them. They have not marched yet.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward #N Quarter struck#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_armed_march_t:0 "The Host Marches"
 kehillah_crisis_pressure_armed_march_d:0 "[kehillah_crisis_announce_agitator.GetFirstName]'s host is on the road to [kehillah_crisis_announce_county.GetNameNoTier], and stragglers join it as it comes.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward #N Quarter struck#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_armed_siege_t:0 "The Host at the Gates"
 kehillah_crisis_pressure_armed_siege_d:0 "[kehillah_crisis_announce_agitator.GetFirstName]'s host has spent the month before [kehillah_crisis_announce_county.GetNameNoTier], and each day it presses harder at the quarter.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward #N Quarter struck#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_crisis_pressure_vizier_t:0 "The Verses Spread"
 kehillah_crisis_pressure_vizier_d:0 "[kehillah_crisis_announce_agitator.GetFirstName]'s verses were recited in more of the souks of [kehillah_crisis_announce_county.GetNameNoTier] this month, and the Sanhaja were listening.\n\nThis month: #N +[kehillah_crisis_announce_leader.MakeScope.Var('kehillah_crisis_month_push').GetValue|0]#! toward the #N Armed host#!. See #V Danger to the [kehillah_crisis_announce_title.GetNameNoTooltip]#! in your Situations list."

 # The first month a special driver pushes the host (kehillah_crisis_driver_notice_effect).
 kehillah_crisis_driver_cold_lord_t:0 "The Lord Looks Away"
 kehillah_crisis_driver_cold_lord_d:0 "[kehillah_crisis_announce_lord.GetTitledFirstName] has let it be known that he will not trouble himself over the Jews of [kehillah_crisis_announce_county.GetNameNoTier]. Every month he looks away, the crowd grows bolder, and the #N Armed host#! gains ground."
 kehillah_crisis_driver_holy_war_t:0 "A Holy War Is Preached"
 kehillah_crisis_driver_holy_war_d:0 "A great holy war is being preached, and in [kehillah_crisis_announce_county.GetNameNoTier] every sermon for it makes the Jews a nearer enemy than the one abroad. While it lasts, the #N Armed host#! gains ground each month."
 kehillah_crisis_driver_holy_week_t:0 "Holy Week Comes"
 kehillah_crisis_driver_holy_week_d:0 "Holy Week has come to [kehillah_crisis_announce_county.GetNameNoTier], and the sermons turn to the Passion and to those blamed for it. Until it is past, the #N Armed host#! gains ground each month."
 message_filter_kehillah_crisis_pressure:0 "What Drives a Danger"
 message_filter_kehillah_crisis_pressure_desc:0 "Each month of a danger to your Jewish community: what pushed it toward the Armed host"

