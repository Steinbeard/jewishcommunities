 # Granada: riders from Almeria (kehillah_granada.0020).
 kehillah_granada.0020.t:0 "Riders from Almería"
 kehillah_granada.0020.desc:0 "A rider comes in from the eastern road with his horse half-dead under him. Al-Mu'tasim's horsemen have been seen in the hills toward Almería, more of them than any border raid needs.\n\nBy evening the news has reached the barracks, and the Sanhaja have their own account of it: the Jewish vizier sent for them, as Abu Ishaq has been saying all along. Men who laughed at the poem a month ago are reciting it now."
 kehillah_granada.0020.a:0 "They will say I sent for them, whatever I do."

 # What drives the host, month by month (kehillah_crisis_pressure_toast_effect).

 # The first month a special driver pushes the host (kehillah_crisis_driver_notice_effect).
 kehillah_crisis_driver_cold_lord_t:0 "The Lord Looks Away"
 kehillah_crisis_driver_cold_lord_d:0 "[kehillah_crisis_announce_lord.GetTitledFirstName] has let it be known that he will not trouble himself over the Jews of [kehillah_crisis_announce_county.GetNameNoTier]. Every month he looks away, the crowd grows bolder."
 kehillah_crisis_driver_holy_war_t:0 "A Holy War Is Preached"
 kehillah_crisis_driver_holy_war_d:0 "A great holy war is being preached, and in [kehillah_crisis_announce_county.GetNameNoTier] every sermon for it makes the Jews a nearer enemy than the one abroad. While it lasts, the quarter will have no peace."
 kehillah_crisis_driver_holy_week_t:0 "Holy Week Comes"
 kehillah_crisis_driver_holy_week_d:0 "Holy Week has come to [kehillah_crisis_announce_county.GetNameNoTier], and the sermons turn to the Passion and to those blamed for it. Until it is past, no one in the quarter will sleep well."
 message_filter_kehillah_crisis_pressure:0 "What Drives a Danger"
 message_filter_kehillah_crisis_pressure_desc:0 "Each month of a danger to your Jewish community: what pushed it toward the Armed host"
 kehillah_crisis_act.0003.desc_accusation_witness:0 "[kehillah_crisis_act_witness.GetFirstName] tells the charge to anyone who will listen, and every telling has a little more in it. A story told that often can be picked apart: who saw what, and when, and who has been telling [kehillah_crisis_act_witness.GetHerHim] what to remember.\n\nHow shall we make our case?"

 # The aftermath (2026-11-01).
 kehillah_crisis_aftermath_decision:0 "After the Danger"
 kehillah_crisis_aftermath_decision_desc:0 "The quarter has come through. Decide how this deliverance will be remembered, and who will be thanked for it."
 kehillah_crisis_aftermath_decision_tooltip:0 "Remember the deliverance, and thank those who stood by us."
 kehillah_crisis_aftermath_decision_confirm:0 "Call the elders"
 kehillah_crisis_aftermath_decision_effect_tt:0 "The elders meet to decide how this will be remembered."
 kehillah_crisis_act.0010.t:0 "After the Danger"
 kehillah_crisis_act.0010.desc:0 "The elders meet in the synagogue's upper room. For once they are not planning a defence. The quarter has come through, and they want to decide how it will be remembered, and who should be thanked."
 kehillah_crisis_act.0010.purim:0 "Proclaim a Purim of [kehillah_crisis_aftermath_town.GetName]: a day each year to remember how we were spared."
 kehillah_crisis_act.0010.lord:0 "Send gifts to [kehillah_crisis_aftermath_lord.GetTitledFirstName], who stood by us."
 kehillah_crisis_act.0010.neighbours:0 "Bread and wine for the neighbours who stood with us."
 kehillah_crisis_purim_tt:0 "Every year on this day, the quarter will read the story of its deliverance and give thanks."
 kehillah_crisis_deliverance_set:0 "Deliverance"
 kehillah_crisis_deliverance_set_concept:0 "Deliverance"
 kehillah_crisis_mourning_set:0 "Mourning"
 kehillah_crisis_mourning_set_concept:0 "Mourning"
 kehillah_crisis_rebuilding_set:0 "Picking Up the Pieces"
 kehillah_crisis_rebuilding_set_concept:0 "Picking Up the Pieces"
 kehillah_community_crisis_kehillah_crisis_ordinary_situation_phase:0 "Ordinary life returns"
 kehillah_crisis_ordinary:0 "Ordinary life returns"
 kehillah_crisis_ordinary_desc:0 "The crisis is over."

 kehillah_crisis_act.0010.witness:0 "Ask [kehillah_crisis_aftermath_local_lord.GetTitledFirstName] to punish [kehillah_crisis_aftermath_witness.GetFirstName] for swearing falsely."
 kehillah_crisis_act.0010.witness_punished:0 "The lord has the witness taken"
 kehillah_crisis_act.0010.witness_spared:0 "The lord will not touch one of his own"
 kehillah_crisis_act.0010.debtors:0 "Ease the terms of the poorest debtors, so the next dear year finds them less angry."
 kehillah_crisis_act.0010.alms:0 "Give alms to the departing army, so it remembers us kindly."
