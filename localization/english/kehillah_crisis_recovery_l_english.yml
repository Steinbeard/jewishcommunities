l_english:
 kehillah_mob.0010.defer:0 "Keep them alive. We will gather a ransom."
 kehillah_crisis_recovery_captives_decision:0 "Redeem the Captives"
 kehillah_crisis_recovery_returnees_decision:0 "Speak for the Forced Converts"
 kehillah_crisis_recovery_returnees_decision_desc:0 "Those baptized under coercion may wish to return. Their path depends on the ruler's leave and how we receive them."
 kehillah_crisis_recovery_returnees_decision_tooltip:0 "Seek a path home for people converted during the attack."
 kehillah_crisis_recovery_returnees_decision_confirm:0 "Hear their wishes"
 kehillah_crisis_recovery_captives_decision_desc:0 "The host still holds members of our community. We may ransom them while there is time."
 kehillah_crisis_recovery_captives_decision_tooltip:0 "Pay the captor to free the prisoners."
 kehillah_crisis_recovery_captives_decision_confirm:0 "Seek their release"
 kehillah_crisis_recovery.0003.t:0 "Those Still in Captivity"
 kehillah_crisis_recovery.0003.desc:0 "The attackers have gone, but some of our people remain in their leader's custody. Their families ask us to bring them home."
 kehillah_crisis_recovery.0003.a:0 "Pay the ransom and bring them home."
 kehillah_crisis_recovery.0003.b:0 "We cannot pay yet."
 kehillah_crisis_recovery_tzedakah_decision:0 "Ask Another Kehillah for Tzedakah"
 kehillah_crisis_recovery_tzedakah_decision_desc:0 "A sister community may help support households bereaved by the attack. Its leader will decide whether to send aid."
 kehillah_crisis_recovery_tzedakah_decision_confirm:0 "Send request"
 kehillah_crisis_recovery_tzedakah_decision_tooltip:0 "Ask another community's leader for help."
 kehillah_crisis_recovery_books_decision:0 "Ask Another Kehillah for Books"
 kehillah_crisis_recovery_books_decision_desc:0 "Ask another community for copies and scribal help after the loss of our books. Its leader will decide what to send."
 kehillah_crisis_recovery_books_decision_confirm:0 "Send request"
 kehillah_crisis_recovery_books_decision_tooltip:0 "Ask another community's leader for books."
 kehillah_crisis_recovery.0110.t:0 "A Plea from Another Kehillah"
 kehillah_crisis_recovery.0110.books:0 "An attacked community has lost books. Its leader asks whether our scribes can help replace what was burned or taken."
 kehillah_crisis_recovery.0110.tzedakah:0 "Another kehillah asks for tzedakah for households bereaved by an attack. Any money we send will leave our treasury."
 kehillah_crisis_recovery.0110.a:0 "Send meaningful help."
 kehillah_crisis_recovery.0110.b:0 "We cannot help them now."
 kehillah_crisis_recovery_relief_decision:0 "Seek Relief"
 kehillah_crisis_recovery_relief_decision_desc:0 "Care for the injured and ask for resources to help the survivors."
 kehillah_crisis_recovery_relief_decision_confirm:0 "Seek relief"
 kehillah_crisis_recovery_relief_decision_tooltip:0 "Choose how to secure relief for survivors."
 kehillah_crisis_recovery_reckoning_decision:0 "Settle the Reckoning"
 kehillah_crisis_recovery_reckoning_decision_desc:0 "Families are divided over how to remember the attack and who can afford to remain. Bring them together or provide direct support."
 kehillah_crisis_recovery_reckoning_decision_confirm:0 "Gather the survivors"
 kehillah_crisis_recovery_reckoning_decision_tooltip:0 "A communal hearing may restore confidence if it succeeds; household support costs gold and reliably helps the community Endure."
 kehillah_crisis_recovery.0001.t:0 "The Survivors' Needs"
 kehillah_crisis_recovery.0001.desc:0 "The wounded and displaced need food and shelter. Our own treasury can provide immediate care, while the ruler may be asked to help the quarter rebuild."
 kehillah_crisis_recovery.0001.a:0 "Fund care from our treasury."
 kehillah_crisis_recovery.0001.b:0 "Petition the ruler for rebuilding aid."
 kehillah_crisis_recovery.0001.b.tt:0 "The ruler will decide whether to send income-scaled aid from their own treasury. Their opinion of you, outlook toward Jews, and traits influence an AI ruler's decision. A player ruler chooses directly. Sending the request uses Seek Relief whether or not aid arrives."
 kehillah_crisis_recovery.0100.t:0 "A Request from the Struck Quarter"
 kehillah_crisis_recovery.0100.desc:0 "The Jewish community asks for money to care for the survivors and begin rebuilding. The aid would come from your treasury."
 kehillah_crisis_recovery.0100.a:0 "Send what aid we can afford."
 kehillah_crisis_recovery.0100.b:0 "Give them no money."
 kehillah_crisis_recovery.0002.t:0 "What Binds Us Now"
 kehillah_crisis_recovery.0002.desc:0 "In the bet din's courtyard, two families who carried their wounded through the same gate can scarcely speak to one another. One accuses the watch of abandoning their street; another says there were too few hands to guard every door. Those with means talk of leaving, while their poorer neighbors ask how they will eat next week. A public hearing could give the survivors a shared account and a reason to remain. If it turns into recrimination, the division will deepen. We could instead spend from the treasury to support the households in immediate need."
 kehillah_crisis_recovery.0002.a:0 "Hold a hearing and ask them to remain together."
 kehillah_crisis_recovery.0002.a.tt:0 "Turns on your Diplomacy and your $kehillah_council_dayyan$'s Learning. Compassion helps; low Stability hurts."
 kehillah_crisis_recovery.0002.b:0 "Pay for the households most likely to leave."
 kehillah_crisis_recovery.0200.t:0 "The Kehillah Comes Apart"
 kehillah_crisis_recovery.0200.desc:0 "Too many households have left or lost the means to stay. The community's institutions can no longer hold its people together."
 kehillah_crisis_recovery.0200.a:0 "Remember those who lived here."
