l_english:
 kehillah_bet_din.0691.t:0 "The Cantor's Prior Ban"
 kehillah_bet_din.0691.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a visiting cantor invited to lead services. [kbd_litigant_b.GetFirstName] says another city placed him under a ban that was never lifted. The letter offered as proof bears no date of release. The community needs a voice for the coming festival, but a rumor can stain a person for years."
 kehillah_bet_din.0691.a:0 "Seat the cantor and dismiss the allegation."
 kehillah_bet_din.0691.a.tt:0 "The festival has a leader, but an active ban could be ignored."
 kehillah_bet_din.0691.b:0 "Use a substitute and ask the issuing court for its record."
 kehillah_bet_din.0691.b.tt:0 "A substitute and inquiry cost money and patience."
 kehillah_bet_din.0691.c:0 "Bar the cantor permanently from the lectern."
 kehillah_bet_din.0691.c.tt:0 "A lifted ban would make permanent exclusion unjust."
 kehillah_din_source_69:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_69_tt:0 "Mishnah Sanhedrin 3:3 gives the judges a textual point of reference. It cannot establish whether the prior ban remains in force."
 kehillah_din_combo_69:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_69_tt:0 "The judges preserve both parties' interests while checking whether the prior ban remains in force."
 kehillah_bet_din.0694.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0694.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0694.outcome_1:0 "The court confirms the cantor's appointment."
 kehillah_bet_din.0694.outcome_2:0 "The court arranges a substitute and sends for the other city's record."
 kehillah_bet_din.0694.outcome_3:0 "The court bars the cantor from future service."
 kehillah_bet_din.0694.fact_true:0 "The issuing court says its ban remains active. Immediate confirmation ignored a live sanction."
 kehillah_bet_din.0694.fact_false:0 "The issuing court records a formal release. Permanent exclusion prolonged a spent penalty."
 kehillah_bet_din.0694.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0694.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0694.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case69_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case69_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case69_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case69_great_log_title:0 "The Cantor's Prior Ban: a well-supported ruling"
 kehillah_bet_din_case69_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the cantor's prior ban dispute."
 kehillah_bet_din_case69_good_log_title:0 "The Cantor's Prior Ban: a workable ruling"
 kehillah_bet_din_case69_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the cantor's prior ban dispute."
 kehillah_bet_din_case69_poor_log_title:0 "The Cantor's Prior Ban: a disputed ruling"
 kehillah_bet_din_case69_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the cantor's prior ban dispute."
