l_english:
 # The cherem track for people (2026-11-11). docs/spec/2026-11-11-reviews-and-cherem.md section 3.

 # Stages.
 kehillah_nezifah_modifier:0 "Nezifah"
 kehillah_nezifah_modifier_desc:0 "Rebuked. The sages have spoken against this person, and the pious keep a little distance. Let it pass, and it fades; let it grow, and it becomes Niddui."
 kehillah_niddui_modifier:0 "Niddui"
 kehillah_niddui_modifier_desc:0 "Shunned. Few will sit within four cubits of this person, and the ban stays until teshuvah. One step more is the full Cherem."

 # The cherem trait (2026-11-11 rework: one lifestyle trait, four levels).
 trait_kehillah_cherem_trait:0 "Cherem"
 trait_kehillah_cherem_trait_desc:0 "The ladder of bans: a warning, then rebuke, then shunning, then the full herem. Bans on one's books, and forbidden books read, drive a person down it. Below Niddui it fades with time; above, only teshuvah lifts it, one degree at a time."
 trait_kehillah_cherem_trait_reproved:0 "Reproved"
 trait_kehillah_cherem_trait_reproved_desc:0 "Tokhachah: the sages have spoken a word of warning. Nothing more, yet."
 trait_kehillah_cherem_trait_nezifah:0 "Nezifah"
 trait_kehillah_cherem_trait_nezifah_desc:0 "Rebuked. The sages have spoken against this person, and the pious keep a little distance. Let it pass, and it fades; let it grow, and it becomes Niddui."
 trait_kehillah_cherem_trait_niddui:0 "Niddui"
 trait_kehillah_cherem_trait_niddui_desc:0 "Shunned. Few will sit within four cubits of this person, and the ban stays until teshuvah. One step more is the full herem."
 trait_kehillah_cherem_trait_cherem:0 "In Herem"
 trait_kehillah_cherem_trait_cherem_desc:0 "The full ban. No Jew may count this person in a minyan, trade with them or sit at their table."
 kehillah_cherem_by_court_tt:0 "Is placed in herem"
 trait_track_kehillah_cherem_trait:0 "The Ban"
 trait_track_kehillah_cherem_trait_desc:0 "How far down the ladder of bans this person has fallen: Nezifah, then Niddui, then the full herem."
 kehillah_doing_teshuvah_modifier:0 "Doing Teshuvah"
 kehillah_doing_teshuvah_modifier_desc:0 "A year of fasting, confession and penance, in the hope that the ban will be eased at its end."

 kehillah_cherem_nezifah_toast_t:0 "Rebuked: Nezifah"
 kehillah_cherem_nezifah_toast_d:0 "The sages speak against you. The pious keep their distance."
 kehillah_cherem_niddui_toast_t:0 "Shunned: Niddui"
 kehillah_cherem_niddui_toast_d:0 "You are under the lesser ban. Only teshuvah will ease it."
 kehillah_cherem_new_rite_toast_t:0 "Beyond the Ban"
 kehillah_cherem_new_rite_toast_d:0 "The rite that cast you out has no authority over the rite you founded. Your cherem is gone."
 kehillah_cherem_full_toast_t:0 "In Herem"
 kehillah_cherem_full_toast_d:0 "The full ban is pronounced on you. No Jew may pray with you, trade with you or bury your dead."

 # The Ban Is Read.
 kehillah_cherem.0010.t:0 "The Ban Is Read"
 kehillah_cherem.0010.desc:0 "The shofar sounds, the candles are put out, and the ban is read aloud in the synagogue: [ROOT.Char.GetFirstName] is in herem. No Jew may count [ROOT.Char.GetHerHim] in a minyan, buy from [ROOT.Char.GetHerHim] or sit at [ROOT.Char.GetHerHis] table.\n\nThe elders ask how I intend to answer. I may seek reconciliation through a year of teshuvah and remain in office while my penance is judged. Otherwise I must yield the seat, or insist on ruling under the ban and bear the divisions it brings."
 kehillah_cherem.0010.a:0 "I will step down for the community's sake."
 kehillah_cherem.0010.a.tt:0 "You step down. The community passes to your heir and keeps its Stability\nYou forfeit any realm Jewish headship and its associated court service\nYou remain in herem"
 kehillah_cherem.0010.b:0 "I am still the leader of this community."
 kehillah_cherem.0010.b.tt:0 "The community's Stability drains every season you rule under the ban"
 kehillah_cherem.0010.desc.other:0 "The shofar sounds, the candles are put out, and the ban is read aloud in the synagogue: [ROOT.Char.GetFirstName] is in herem. No Jew may count [ROOT.Char.GetHerHim] in a minyan, buy from [ROOT.Char.GetHerHim] or sit at [ROOT.Char.GetHerHis] table.\n\nThe doors of every Jewish house are shut to me. I may begin a year of teshuvah and hope to be received again, or I may bear it."
 kehillah_cherem.0010.d:0 "Let them shun me."
 kehillah_cherem.0010.c:0 "Let me do teshuvah and seek reconciliation."
 kehillah_cherem.0010.c.tt:0 "You remain communal leader during your penance, without the immediate penalty for defiance\nCommunity Stability: [SCOPE.ScriptValue('kehillah_cherem_penitence_quarterly_stability')|+=0] each quarter while judgment is pending\nIf your penance is refused, you must decide again whether to step down or defy the ban"

 # Teshuvah judged by a player head of rite.
 kehillah_cherem.0021.t:0 "A Penitent at the Door"
 kehillah_cherem.0021.desc:0 "[kehillah_teshuvah_penitent.GetFullName] has spent a year in sackcloth: fasting on Mondays and Thursdays, confessing before the congregation, giving charity beyond [kehillah_teshuvah_penitent.GetHerHis] means. Now [kehillah_teshuvah_penitent.GetSheHe] stands before me and asks that the ban be eased.\n\n“Great is teshuvah,” the sages say, “for it reaches the Throne of Glory.” They also say that one who sins and repents, and sins again, has not repented."
 kehillah_cherem.0021.a:0 "Let the ban be eased."
 kehillah_cherem.0021.a.tt:0 "[kehillah_teshuvah_penitent.GetFirstName]'s ban falls one degree"
 kehillah_cherem.0021.b:0 "Not yet."

 # The verdict.
 kehillah_cherem.0022.t:0 "The End of Teshuvah"
 kehillah_cherem.0022.desc.accepted_head:0 "My year of penance is over, and [kehillah_teshuvah_judge.GetFullName] has accepted it. The ban on me is eased by one degree."
 kehillah_cherem.0022.desc.accepted_court:0 "My year of penance is over. A court of three rabbis heard my confession and accepted it. The ban on me is eased by one degree."
 kehillah_cherem.0022.desc.refused_head:0 "My year of penance is over, but [kehillah_teshuvah_judge.GetFullName] is not satisfied. The ban stands."
 kehillah_cherem.0022.desc.refused_court:0 "My year of penance is over, but the court of three is not satisfied. The ban stands."
 kehillah_cherem.0022.a:0 "So be it."

 # Teshuvah.
 kehillah_teshuvah_decision:0 "Do Teshuvah"
 kehillah_teshuvah_decision_desc:0 "I am under a ban. The way back is teshuvah: to renounce what I did, to give up the forbidden books I keep, to do a year of penance, and to ask those who can ease the ban to accept it."
 kehillah_teshuvah_decision_tooltip:0 "Repent, and ask for the ban on you to be eased."
 kehillah_teshuvah_decision_confirm:0 "I will return"
 kehillah_teshuvah_decision_tt:0 "After a year, the head of your rite judges your teshuvah, or a court of three rabbis when there is none. If they accept it, your ban falls one degree"
 kehillah_teshuvah_renounce_tt:0 "You renounce the book that brought the ban on you. Its reception falls in your rite"
 kehillah_teshuvah_surrender_tt:0 "You give up every book in your library that your rite has Banned or put under Anathema"
 kehillah_teshuvah_not_already_tt:0 "You are not already doing teshuvah or awaiting its judgment"
 kehillah_teshuvah_cooldown_tt:0 "Five years have passed since you last began teshuvah"

 # 2026-11-11: the court, and its grounds (a refusal always has a reason).
 kehillah_teshuvah_tt_head:0 "Judged by [kehillah_teshuvah_judge.GetFullName], the head of your rite:"
 kehillah_teshuvah_tt_court:0 "Judged by a court of three; a majority must find grounds to refuse:"
 kehillah_teshuvah_tt_no_court:0 "No court can be seated to judge it: it will be accepted"
 kehillah_teshuvah_tt_relapse:0 "#N Your last teshuvah was accepted less than ten years ago: it will be refused#!"
 kehillah_teshuvah_tt_rule:0 "Without grounds against you, your teshuvah is accepted. Giving new cause for the ban during the year is grounds"
 kehillah_teshuvah_tt_judge_head_fair:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge.GetFullName]: #P no grounds against you#!"
 kehillah_teshuvah_tt_judge_head_enmity:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge.GetFullName]: #N would refuse: there is enmity between you#!"
 kehillah_teshuvah_tt_judge_head_zeal:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge.GetFullName]: #N would refuse: zealous against the book that brought the ban#!"
 kehillah_cherem.0022.why_head_enmity:0 "\n\n[kehillah_teshuvah_judge.GetFullName] spoke against me. There is too much bad blood between us for [kehillah_teshuvah_judge.GetHerHim] to hear me fairly."
 kehillah_cherem.0022.why_head_zeal:0 "\n\n[kehillah_teshuvah_judge.GetFullName] spoke against me. [kehillah_teshuvah_judge.GetSheHe|U] is zealous, and holds the book that brought the ban on me to be false teaching."
 kehillah_teshuvah_tt_judge_1_fair:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_1.GetFullName]: #P no grounds against you#!"
 kehillah_teshuvah_tt_judge_1_enmity:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_1.GetFullName]: #N would refuse: there is enmity between you#!"
 kehillah_teshuvah_tt_judge_1_zeal:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_1.GetFullName]: #N would refuse: zealous against the book that brought the ban#!"
 kehillah_cherem.0022.why_1_enmity:0 "\n\n[kehillah_teshuvah_judge_1.GetFullName] spoke against me. There is too much bad blood between us for [kehillah_teshuvah_judge_1.GetHerHim] to hear me fairly."
 kehillah_cherem.0022.why_1_zeal:0 "\n\n[kehillah_teshuvah_judge_1.GetFullName] spoke against me. [kehillah_teshuvah_judge_1.GetSheHe|U] is zealous, and holds the book that brought the ban on me to be false teaching."
 kehillah_teshuvah_tt_judge_2_fair:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_2.GetFullName]: #P no grounds against you#!"
 kehillah_teshuvah_tt_judge_2_enmity:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_2.GetFullName]: #N would refuse: there is enmity between you#!"
 kehillah_teshuvah_tt_judge_2_zeal:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_2.GetFullName]: #N would refuse: zealous against the book that brought the ban#!"
 kehillah_cherem.0022.why_2_enmity:0 "\n\n[kehillah_teshuvah_judge_2.GetFullName] spoke against me. There is too much bad blood between us for [kehillah_teshuvah_judge_2.GetHerHim] to hear me fairly."
 kehillah_cherem.0022.why_2_zeal:0 "\n\n[kehillah_teshuvah_judge_2.GetFullName] spoke against me. [kehillah_teshuvah_judge_2.GetSheHe|U] is zealous, and holds the book that brought the ban on me to be false teaching."
 kehillah_teshuvah_tt_judge_3_fair:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_3.GetFullName]: #P no grounds against you#!"
 kehillah_teshuvah_tt_judge_3_enmity:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_3.GetFullName]: #N would refuse: there is enmity between you#!"
 kehillah_teshuvah_tt_judge_3_zeal:0 "$EFFECT_LIST_BULLET$ [kehillah_teshuvah_judge_3.GetFullName]: #N would refuse: zealous against the book that brought the ban#!"
 kehillah_cherem.0022.why_3_enmity:0 "\n\n[kehillah_teshuvah_judge_3.GetFullName] spoke against me. There is too much bad blood between us for [kehillah_teshuvah_judge_3.GetHerHim] to hear me fairly."
 kehillah_cherem.0022.why_3_zeal:0 "\n\n[kehillah_teshuvah_judge_3.GetFullName] spoke against me. [kehillah_teshuvah_judge_3.GetSheHe|U] is zealous, and holds the book that brought the ban on me to be false teaching."
 kehillah_cherem.0022.why_relapse:0 "\n\nMy last teshuvah was accepted only a few years ago. “One who says, I will sin and repent, and sin again and repent, is not given the means to repent.”"
 kehillah_cherem.0022.why_sinned:0 "\n\nEven in my year of penance I gave new cause for the ban. Teshuvah that does not change one's deeds is no teshuvah."

 # Pronounce a Cherem.
 kehillah_pronounce_cherem_interaction:0 "Pronounce a Cherem"
 kehillah_pronounce_cherem_interaction_desc:0 "Place [recipient.GetFirstName] under the full ban, as the head of [recipient.GetHerHis] faith may. Even a community's leader is not beyond your reach."
 kehillah_pronounce_cherem_interaction_notification:0 "[actor.GetFullName] has pronounced a cherem on you."
 kehillah_pronounce_cherem_cost_desc:0 "Pronouncing a ban"
 kehillah_pronounce_cherem_grounds_tt:0 "[recipient.GetFirstName] has given grounds for a ban: Nezifah or worse"
 kehillah_pronounce_cherem_effect_tt:0 "[recipient.GetFirstName] is placed in herem"

 # The synod's herem on a leader.
 kehillah_synod_option_herem_person:0 "A Herem on a Leader"
 kehillah_synod_option_herem_person_desc:0 "$EFFECT_LIST_BULLET$ A community leader under Niddui is placed in herem\n#weak The synod takes up the one deepest in the ban.#!"
 kehillah_synod_motion_herem_person:0 "The motion is to place [kehillah_synod_herem_target.GetFullName] in herem."
 kehillah_synod_herem_person_tt:0 "[kehillah_synod_herem_target.GetFullName] is placed in herem"
