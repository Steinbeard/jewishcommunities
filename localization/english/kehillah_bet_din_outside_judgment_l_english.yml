l_english:
 kehillah_bet_din.01131.t:0 "The Christian Court's Property Judgment"
 kehillah_bet_din.01131.desc:0 "[kbd_litigant_a.GetFirstName] holds a Christian court's judgment over a disputed shop. [kbd_litigant_b.GetFirstName] says that court heard only one deed and never summoned the other owner. The judges must decide what weight the outside ruling deserves here."
 kehillah_bet_din.01131.a:0 "Enforce the outside judgment at once."
 kehillah_bet_din.01131.a.tt:0 "An unheard owner's property may be taken."
 kehillah_bet_din.01131.b:0 "Read the record and hear the missing deed."
 kehillah_bet_din.01131.b.tt:0 "A record review delays transfer but clarifies both claims."
 kehillah_bet_din.01131.c:0 "Reject all outside judgments on principle."
 kehillah_bet_din.01131.c.tt:0 "A complete and fair ruling may be needlessly reopened."
 kehillah_din_source_113:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_113_tt:0 "Mishnah Sanhedrin 3:1 gives the judges a textual point of reference. It cannot establish whether both deeds and parties were heard."
 kehillah_din_combo_113:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_113_tt:0 "The judges preserve both parties' interests while checking whether both deeds and parties were heard."
 kehillah_bet_din.01134.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01134.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01134.outcome_1:0 "The outside judgment decides possession."
 kehillah_bet_din.01134.outcome_2:0 "The court examines the summons, deeds, and reasons before acting."
 kehillah_bet_din.01134.outcome_3:0 "The court disregards the judgment entirely."
 kehillah_bet_din.01134.fact_true:0 "The record omits the other owner's deed and summons. Automatic enforcement compounds that omission."
 kehillah_bet_din.01134.fact_false:0 "Both parties were heard and the deeds compared. Blanket rejection needlessly reopens the claim."
 kehillah_bet_din.01134.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01134.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01134.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case113_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case113_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case113_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_din_proposed_113_1:0 "The ruling proposed so far: $kehillah_bet_din.01131.a$"
 kehillah_din_proposed_113_2:0 "The ruling proposed so far: $kehillah_bet_din.01131.b$"
