l_english:
 kehillah_bet_din.0581.t:0 "The Outsider's Appeal"
 kehillah_bet_din.0581.desc:0 "[kbd_litigant_a.GetFirstName] lost a property claim in the local court and asks to send the case to a distant scholar. [kbd_litigant_b.GetFirstName] says the award is final and another hearing will consume the property's value. The written judgment names witnesses, but one page of the hearing record is missing."
 kehillah_bet_din.0581.a:0 "Refuse the appeal and enforce the local award."
 kehillah_bet_din.0581.a.tt:0 "The dispute ends, but a serious error could become permanent."
 kehillah_bet_din.0581.b:0 "Hold enforcement and inspect the hearing record."
 kehillah_bet_din.0581.b.tt:0 "The property is preserved while the court checks procedure at some cost."
 kehillah_bet_din.0581.c:0 "Reopen the whole case before a new panel."
 kehillah_bet_din.0581.c.tt:0 "A full rehearing offers another chance, but a sound award would be needlessly unsettled."
 kehillah_din_source_58:0 "Cite a mastered Nezikin work and inspect the hearing."
 kehillah_din_source_58_tt:0 "Mishnah Sanhedrin 3:1 concerns selection of judges. It does not prove that this panel omitted testimony."
 kehillah_din_combo_58:0 "Have a scholar and steward preserve the property and recover the record."
 kehillah_din_combo_58_tt:0 "The judges test a specific procedural concern before reopening everything."
 kehillah_bet_din.0584.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0584.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0584.outcome_1:0 "The court enforces the original award."
 kehillah_bet_din.0584.outcome_2:0 "The court pauses enforcement and reconstructs the missing hearing page."
 kehillah_bet_din.0584.outcome_3:0 "The court orders a new hearing before another panel."
 kehillah_bet_din.0584.fact_true:0 "The missing page shows a decisive witness was never heard. Immediate enforcement entrenched a flawed award."
 kehillah_bet_din.0584.fact_false:0 "The original panel heard both sides and recorded its reasons. A full rehearing repeated a sound case."
 kehillah_bet_din.0584.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0584.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0584.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case58_one_tt:0 "Immediate enforcement risks substantial Stability."
 kehillah_din_case58_two_tt:0 "Record review costs some Stability."
 kehillah_din_case58_three_tt:0 "A full rehearing costs less now but may prolong the quarrel."
 kehillah_bet_din_case58_great_log_title:0 "The Outsider's Appeal: a well-supported ruling"
 kehillah_bet_din_case58_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s appeal request."
 kehillah_bet_din_case58_good_log_title:0 "The Outsider's Appeal: a workable ruling"
 kehillah_bet_din_case58_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s appeal request."
 kehillah_bet_din_case58_poor_log_title:0 "The Outsider's Appeal: a disputed ruling"
 kehillah_bet_din_case58_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s appeal request."
