l_english:
 # V47 heads of rite (docs/spec/v47-gaon-and-the-seat-of-the-sanhedrin.md)

 d_kehillah_gaonate:0 "The Gaonate"
 d_kehillah_gaonate_adj:0 "Geonic"

 kehillah_seek_head_of_rite_decision:0 "Be Recognized as Head of Your Rite"
 kehillah_seek_head_of_rite_decision_tooltip:0 "Become the recognized authority of your rite"
 kehillah_seek_head_of_rite_decision_confirm:0 "The communities will turn to you"
 kehillah_seek_head_of_rite_decision_desc:0 "No sage now leads the communities of your rite. Questions go out to many teachers, and no answer settles them. A rabbi whose academy draws students from every land, who has mastered the law and lives it, might become the one they all turn to, for as long as he lives."
 kehillah_seek_head_of_rite_effect_gaon_tt:0 "You become #EMP Gaon#!, recognized head of your rite, for the rest of your life. When you die, the rite will have no head until another sage earns it."
 kehillah_seek_head_of_rite_effect_rabbenu_tt:0 "You become #EMP Rabbenu#!, recognized head of Minhag Ashkenaz, for the rest of your life. When you die, the rite will have no head until another sage earns it."
 kehillah_head_of_rite_requires_yeshiva_tt:0 "Your community's yeshiva is #EMP Illustrious#!"
 kehillah_head_of_rite_requires_rosh_yeshiva_tt:0 "You are learned enough to head a yeshiva"
 kehillah_head_of_rite_requires_tracks_tt:0 "You have mastered two of the three fields of the Rabbi's learning"

 kehillah_establish_gaon_office_decision:0 "Establish the Office of the Gaon"
 kehillah_establish_gaon_office_decision_tooltip:0 "Make the headship of the rite an office of your academy"
 kehillah_establish_gaon_office_decision_confirm:0 "The academy will keep its Gaon"
 kehillah_establish_gaon_office_decision_desc:0 "The Geonim of Sura and Pumbedita once headed their academies by office, and the whole Jewish world sent them its questions. Your own recognition will end with you. Bound to the academy, it could pass to each of its heads in turn."
 kehillah_establish_gaon_office_effect_tt:0 "The headship of your rite becomes an office of your academy. It passes to each leader of your community in turn. If the academy loses its standing, the office lapses back to a recognition that ends with its holder."
 kehillah_gaon_office_requires_academy_tt:0 "You lead the academy of Sura, or the Exilarch's community at Baghdad"

 kehillah_news_head_of_rite_t:0 "A Head of the Rite"
 kehillah_news_head_of_rite_d:0 "[kehillah_new_gaon.GetTitledFirstName] is now recognized as the head of his rite. Questions are already being addressed to him from far away."
 kehillah_news_gaon_office_t:0 "The Office of the Gaon"
 kehillah_news_gaon_office_d:0 "[kehillah_gaon_founder.GetTitledFirstName] has bound the headship of the rite to the academy. It will pass from Gaon to Gaon."
