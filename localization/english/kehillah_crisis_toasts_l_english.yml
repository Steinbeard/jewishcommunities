l_english:
 # Notification pools (2026-11-01, Daniel: "drawing from a pool of different possibilities and incorporating
 # dynamic details like specific characters, places"). Sent by kehillah_flavor_toast_effect: 1-2 are scenes,
 # 3 names someone of the local lord's household, 4 someone of our own. Flavor only, no numbers.

 kehillah_crisis_pressure_preacher_t1:0 "The Following Grows"
 kehillah_crisis_pressure_preacher_d1:0 "[kehillah_crisis_announce_agitator.GetFirstName] preached again in [kehillah_crisis_announce_county.GetNameNoTier] this month, and more men stayed to hear him out. Some of them come to the sermons carrying staves now."
 kehillah_crisis_pressure_preacher_t2:0 "A Sermon by the Well"
 kehillah_crisis_pressure_preacher_d2:0 "[kehillah_crisis_announce_agitator.GetFirstName] preached by the well where the women of the quarter draw water. They finished filling their jars in silence and walked home the long way."
 kehillah_crisis_pressure_preacher_t3:0 "Heard in the Lord's Hall"
 kehillah_crisis_pressure_preacher_d3:0 "[kehillah_toast_townsman.GetFirstName], of the lord's household, was seen at [kehillah_crisis_announce_agitator.GetFirstName]'s sermon in [kehillah_crisis_announce_county.GetNameNoTier], and stayed to the end. The quarter wonders who else in the hall is listening."
 kehillah_crisis_pressure_preacher_t4:0 "Counting the Streets"
 kehillah_crisis_pressure_preacher_d4:0 "[kehillah_toast_elder.GetFirstName] came back from the market shaken. [kehillah_crisis_announce_agitator.GetFirstName] had named the quarter's streets one by one, as if counting them, and the crowd counted with him."

 kehillah_crisis_pressure_accusation_t1:0 "The Charge Is Repeated"
 kehillah_crisis_pressure_accusation_d1:0 "In [kehillah_crisis_announce_county.GetNameNoTier] the charge was told again in the market this month, to a larger crowd, and with more added to it. Mothers in the quarter have started calling their children indoors before dark."
 kehillah_crisis_pressure_accusation_t2:0 "A New Telling"
 kehillah_crisis_pressure_accusation_d2:0 "The story has grown a new detail: a light seen in a Jewish window on the night it happened. No one can say who saw it first, and everyone in [kehillah_crisis_announce_county.GetNameNoTier] has heard it."
 kehillah_crisis_pressure_accusation_t3:0 "A Neighbour Turns Away"
 kehillah_crisis_pressure_accusation_d3:0 "[kehillah_toast_townsman.GetFirstName], who has bought wine from the quarter for years, crossed the street rather than greet one of ours. In [kehillah_crisis_announce_county.GetNameNoTier], people notice who greets whom."
 kehillah_crisis_pressure_accusation_t4:0 "Stones in the Night"
 kehillah_crisis_pressure_accusation_d4:0 "Someone threw stones at [kehillah_toast_elder.GetFirstName]'s shutters in the night. In the morning there was a word chalked on the door that no one in the quarter will repeat."

 kehillah_crisis_pressure_crusade_t1:0 "More Vows Are Sworn"
 kehillah_crisis_pressure_crusade_d1:0 "More men in [kehillah_crisis_announce_county.GetNameNoTier] have sworn the vow, and their talk keeps turning from the war abroad to the Jews at home. Someone has chalked a cross on the quarter's gate."
 kehillah_crisis_pressure_crusade_t2:0 "Crosses on the Cloaks"
 kehillah_crisis_pressure_crusade_d2:0 "Every week more men in [kehillah_crisis_announce_county.GetNameNoTier] walk the streets with crosses sewn to their cloaks, and every week they walk a little closer to the quarter's gate."
 kehillah_crisis_pressure_crusade_t3:0 "Drinks in the Tavern"
 kehillah_crisis_pressure_crusade_d3:0 "[kehillah_toast_townsman.GetFirstName] has been buying drinks for the vow-takers in [kehillah_crisis_announce_county.GetNameNoTier], and telling them the holy war could begin closer to home, and pay better."
 kehillah_crisis_pressure_crusade_t4:0 "A Sermon Overheard"
 kehillah_crisis_pressure_crusade_d4:0 "[kehillah_toast_elder.GetFirstName] stood at the back of the crowd when [kehillah_crisis_announce_agitator.GetFirstName] preached the cross in [kehillah_crisis_announce_county.GetNameNoTier]. The Jews were named three times; Jerusalem only once."

 kehillah_crisis_pressure_debts_t1:0 "The Debtors Grow Bolder"
 kehillah_crisis_pressure_debts_d1:0 "The debtors of [kehillah_crisis_announce_county.GetNameNoTier] meet openly now, and speak of what they owe as a wrong done to them. One of them was heard asking where the bonds are kept."
 kehillah_crisis_pressure_debts_t2:0 "A Bond Torn Up"
 kehillah_crisis_pressure_debts_d2:0 "A debtor tore up his copy of a bond in the square at [kehillah_crisis_announce_county.GetNameNoTier] and threw the pieces at the quarter's gate. The crowd cheered as if he had paid it."
 kehillah_crisis_pressure_debts_t3:0 "The Bailiff Stays Home"
 kehillah_crisis_pressure_debts_d3:0 "[kehillah_toast_townsman.GetFirstName], who serves the lord's bailiff, has stopped coming to collect for us. The debtors of [kehillah_crisis_announce_county.GetNameNoTier] have noticed, and so has the quarter."
 kehillah_crisis_pressure_debts_t4:0 "Watching the Countinghouse"
 kehillah_crisis_pressure_debts_d4:0 "[kehillah_toast_elder.GetFirstName] says the same three men stand outside the countinghouse every evening now, watching who goes in and who comes out."

 kehillah_crisis_pressure_holy_week_t1:0 "The Sermons Grow Harsher"
 kehillah_crisis_pressure_holy_week_d1:0 "Each sermon in [kehillah_crisis_announce_county.GetNameNoTier] is harsher than the last, and the crowds leaving the churches walk past the quarter more slowly, looking at the doors."
 kehillah_crisis_pressure_holy_week_t2:0 "The Procession Pauses"
 kehillah_crisis_pressure_holy_week_d2:0 "The procession in [kehillah_crisis_announce_county.GetNameNoTier] passed the end of the Jews' street, and the singing stopped there for a long moment before it went on."
 kehillah_crisis_pressure_holy_week_t3:0 "The Parish Boys"
 kehillah_crisis_pressure_holy_week_d3:0 "[kehillah_toast_townsman.GetFirstName] has been seen with the parish boys of [kehillah_crisis_announce_county.GetNameNoTier], the ones who gather stones every year in Holy Week. This year there are more of them."
 kehillah_crisis_pressure_holy_week_t4:0 "Bolts and Shutters"
 kehillah_crisis_pressure_holy_week_d4:0 "[kehillah_toast_elder.GetFirstName] has been going from house to house in the quarter, checking every shutter and every bolt before Good Friday."

 kehillah_crisis_pressure_vizier_t1:0 "The Verses Spread"
 kehillah_crisis_pressure_vizier_d1:0 "The verses have reached the markets. This morning a guard recited them to the vizier at the palace gate."
 kehillah_crisis_pressure_vizier_t2:0 "Recited in the Barracks"
 kehillah_crisis_pressure_vizier_d2:0 "The cooks hear the Sanhaja soldiers reciting Abu Ishaq's verses at their meals. Some know them by heart."
 kehillah_crisis_pressure_vizier_t3:0 "The Poem Reaches the Court"
 kehillah_crisis_pressure_vizier_d3:0 "[kehillah_toast_townsman.GetFirstName] quotes the poem within earshot of the vizier. Another courtier supplies the next line."
 kehillah_crisis_pressure_vizier_t4:0 "A Threat at the Study Hall"
 kehillah_crisis_pressure_vizier_d4:0 "A copy of Abu Ishaq's poem has been slipped beneath the study hall door. The passage calling for the Jews to be killed is underlined."

 kehillah_crisis_pressure_armed_muster_t1:0 "The Host Gathers"
 kehillah_crisis_pressure_armed_muster_d1:0 "More men came to [kehillah_crisis_announce_agitator.GetFirstName]'s host this week, and more weapons with them. They have not marched yet, but they no longer pretend they will not."
 kehillah_crisis_pressure_armed_muster_t2:0 "Blades for Sharpening"
 kehillah_crisis_pressure_armed_muster_d2:0 "The smiths of [kehillah_crisis_announce_county.GetNameNoTier] have more blades to sharpen than they can manage, and they are not asking who the blades are for."
 kehillah_crisis_pressure_armed_muster_t3:0 "Carts from the Villages"
 kehillah_crisis_pressure_armed_muster_d3:0 "[kehillah_toast_townsman.GetFirstName] saw carts come in from the villages around [kehillah_crisis_announce_county.GetNameNoTier], full of men with tools that are not meant for farming."
 kehillah_crisis_pressure_armed_muster_t4:0 "Days of Bread"
 kehillah_crisis_pressure_armed_muster_d4:0 "[kehillah_toast_elder.GetFirstName] has started counting how many days of bread are left in the quarter's cellars, and saying the number aloud."

 kehillah_crisis_pressure_armed_muster_vizier_t1:0 "The Sanhaja Gather"
 kehillah_crisis_pressure_armed_muster_vizier_d1:0 "In the barracks of [kehillah_crisis_announce_county.GetNameNoTier] the Sanhaja sharpen their blades, and men come in from the villages of the Vega to join them. The quarter can hear them singing at night."
 kehillah_crisis_pressure_armed_muster_vizier_t2:0 "Horses Shod by Lamplight"
 kehillah_crisis_pressure_armed_muster_vizier_d2:0 "The farriers of [kehillah_crisis_announce_county.GetNameNoTier] are shoeing horses for the Sanhaja by lamplight. No one has said what the horses are for."
 kehillah_crisis_pressure_armed_muster_vizier_t3:0 "A Warning from the Palace"
 kehillah_crisis_pressure_armed_muster_vizier_d3:0 "[kehillah_toast_townsman.GetFirstName], at the emir's court, sent word by a servant: the barracks are emptying of their idle men, and filling with angry ones."
 kehillah_crisis_pressure_armed_muster_vizier_t4:0 "Palace or Quarter"
 kehillah_crisis_pressure_armed_muster_vizier_d4:0 "[kehillah_toast_elder.GetFirstName] asks whether the vizier's household should sleep in the quarter tonight, or the quarter in the palace. Neither seems safe."

 kehillah_crisis_pressure_armed_march_t1:0 "The Host Marches"
 kehillah_crisis_pressure_armed_march_d1:0 "[kehillah_crisis_announce_agitator.GetFirstName]'s host is on the road to [kehillah_crisis_announce_county.GetNameNoTier], and stragglers join it as it comes. Farmers along the way have locked their barns."
 kehillah_crisis_pressure_armed_march_t2:0 "Dust on the Road"
 kehillah_crisis_pressure_armed_march_d2:0 "From the walls of [kehillah_crisis_announce_county.GetNameNoTier] the host's dust can be seen on the road, and it is closer each morning."
 kehillah_crisis_pressure_armed_march_t3:0 "News from the Road"
 kehillah_crisis_pressure_armed_march_d3:0 "[kehillah_toast_townsman.GetFirstName] rode in ahead of [kehillah_crisis_announce_agitator.GetFirstName]'s host and told the market what the villages along the road had seen: torches, and too little food for so many men."
 kehillah_crisis_pressure_armed_march_t4:0 "Every Rider Counted"
 kehillah_crisis_pressure_armed_march_d4:0 "[kehillah_toast_elder.GetFirstName] has not left the quarter's gate since the news came. Every rider on the road is counted twice."

 kehillah_crisis_pressure_armed_siege_t1:0 "The Host at the Gates"
 kehillah_crisis_pressure_armed_siege_d1:0 "[kehillah_crisis_announce_agitator.GetFirstName]'s host has spent another week before [kehillah_crisis_announce_county.GetNameNoTier], and each day it presses harder at the quarter. The bread in the cellars will not last for ever."
 kehillah_crisis_pressure_armed_siege_t2:0 "Smoke over the Quarter"
 kehillah_crisis_pressure_armed_siege_d2:0 "Smoke rose over [kehillah_crisis_announce_county.GetNameNoTier] again today, from the houses at the edge of the quarter. The families from those streets sleep in the synagogue now."
 kehillah_crisis_pressure_armed_siege_t3:0 "Faces at the Barricade"
 kehillah_crisis_pressure_armed_siege_d3:0 "[kehillah_toast_townsman.GetFirstName] was seen among the men shouting at the quarter's barricades. Some of those men bought from our shops a month ago."
 kehillah_crisis_pressure_armed_siege_t4:0 "The Night Watch"
 kehillah_crisis_pressure_armed_siege_d4:0 "[kehillah_toast_elder.GetFirstName] kept the watch at the barricade through the night, and came back grey in the face. The host does not sleep, and neither does the quarter."

 kehillah_trial_pressure_accuser_t1:0 "The Articles Are Read Again"
 kehillah_trial_pressure_accuser_d1:0 "[kehillah_trial_toast_accuser.GetFirstName] read his articles again this month, to [kehillah_trial_toast_judge.GetTitledFirstName] and to anyone else who would listen. Each time he reads them, there is a passage more."
 kehillah_trial_pressure_accuser_t2:0 "A New Article"
 kehillah_trial_pressure_accuser_d2:0 "[kehillah_trial_toast_accuser.GetFirstName] has added a passage to his list from a tractate this community never owned. Someone is helping him."
 kehillah_trial_pressure_accuser_t3:0 "At the Lord's Table"
 kehillah_trial_pressure_accuser_d3:0 "[kehillah_toast_townsman.GetFirstName], of [kehillah_trial_toast_judge.GetTitledFirstName]'s household, says [kehillah_trial_toast_accuser.GetFirstName] dines at the lord's table now, and tells the story of his baptism to anyone who asks."
 kehillah_trial_pressure_accuser_t4:0 "The Students Ask"
 kehillah_trial_pressure_accuser_d4:0 "[kehillah_toast_elder.GetFirstName] says the students of the house of study ask every day whether they should hide their own notes. No one knows what to tell them."

 kehillah_trial_pressure_judges_condemnation_t1:0 "A Hostile Bench"
 kehillah_trial_pressure_judges_condemnation_d1:0 "[kehillah_trial_toast_judge.GetTitledFirstName] does not hide what he thinks of the Jews, or of their books, and his clergy take their cue from him."
 kehillah_trial_pressure_judges_condemnation_t2:0 "Behind Closed Doors"
 kehillah_trial_pressure_judges_condemnation_d2:0 "[kehillah_trial_toast_judge.GetTitledFirstName]'s clergy met behind closed doors this month. When they came out, none of them would look at our disputant."
 kehillah_trial_pressure_judges_condemnation_t3:0 "Where the Fire Should Be"
 kehillah_trial_pressure_judges_condemnation_d3:0 "[kehillah_toast_townsman.GetFirstName] says [kehillah_trial_toast_judge.GetTitledFirstName] has already asked where the burning should take place, should it come to that."
 kehillah_trial_pressure_judges_condemnation_t4:0 "Copied from Memory"
 kehillah_trial_pressure_judges_condemnation_d4:0 "[kehillah_toast_elder.GetFirstName] has started copying passages from memory onto scraps of parchment, in case nothing else survives."

 kehillah_trial_pressure_judges_acquittal_t1:0 "A Fair Hearing"
 kehillah_trial_pressure_judges_acquittal_d1:0 "[kehillah_trial_toast_judge.GetTitledFirstName] listens to our answers as closely as to the accuser's, and his clergy have noticed."
 kehillah_trial_pressure_judges_acquittal_t2:0 "The Accuser Stumbles"
 kehillah_trial_pressure_judges_acquittal_d2:0 "[kehillah_trial_toast_judge.GetTitledFirstName] asked [kehillah_trial_toast_accuser.GetFirstName] this month to read a passage in the original, and he stumbled over it. The hall noticed."
 kehillah_trial_pressure_judges_acquittal_t3:0 "A Kind Word"
 kehillah_trial_pressure_judges_acquittal_d3:0 "[kehillah_toast_townsman.GetFirstName], of [kehillah_trial_toast_judge.GetTitledFirstName]'s household, told the quarter's messenger that the lord thinks the matter has gone on long enough."
 kehillah_trial_pressure_judges_acquittal_t4:0 "Hope Spoken Aloud"
 kehillah_trial_pressure_judges_acquittal_d4:0 "[kehillah_toast_elder.GetFirstName] has begun to say aloud what no one dared to: that the books may come home."

 kehillah_trial_pressure_judges_expurgation_t1:0 "A Bench That Wants It Over"
 kehillah_trial_pressure_judges_expurgation_d1:0 "[kehillah_trial_toast_judge.GetTitledFirstName] has said he is tired of the matter. A few passages struck out, and everyone could go home."
 kehillah_trial_pressure_judges_expurgation_t2:0 "A Clerk with a Pen"
 kehillah_trial_pressure_judges_expurgation_d2:0 "A clerk has been seen in [kehillah_trial_toast_judge.GetTitledFirstName]'s hall with our books and a pot of ink, marking passages, though no verdict has been given."
 kehillah_trial_pressure_judges_expurgation_t3:0 "A Bargain Hinted"
 kehillah_trial_pressure_judges_expurgation_d3:0 "[kehillah_toast_townsman.GetFirstName] hinted to our messenger that a few passages struck out might end the whole affair."
 kehillah_trial_pressure_judges_expurgation_t4:0 "A Book with Holes"
 kehillah_trial_pressure_judges_expurgation_d4:0 "[kehillah_toast_elder.GetFirstName] and the scholars argued late into the night: is a book with passages struck out still a book worth saving?"

 kehillah_decree_pressure_badge_t1:0 "The Clerks Go House to House"
 kehillah_decree_pressure_badge_d1:0 "[kehillah_decree_toast_lord.GetTitledFirstName]'s clerks went further down the list of Jewish houses this month, and the tailors have more orders for the cloth."
 kehillah_decree_pressure_badge_t2:0 "Cloth in the Market"
 kehillah_decree_pressure_badge_d2:0 "The town's cloth merchants have bought more of the colour than in any year before. They say they expect a great many orders."
 kehillah_decree_pressure_badge_t3:0 "A List of Names"
 kehillah_decree_pressure_badge_d3:0 "[kehillah_toast_townsman.GetFirstName] has been copying out a list of every Jew in the lord's lands over the age of twelve. The quarter's names are on it, one by one."
 kehillah_decree_pressure_badge_t4:0 "An Old Coat"
 kehillah_decree_pressure_badge_d4:0 "[kehillah_toast_elder.GetFirstName] has taken out an old coat and is studying where the mark could be sewn so that a cloak would cover it."

 kehillah_decree_pressure_servants_t1:0 "The Reeve Counts the Servants"
 kehillah_decree_pressure_servants_d1:0 "[kehillah_decree_toast_lord.GetTitledFirstName]'s reeve went from house to house this month, asking who cooks, who nurses, and who keeps the toll-house."
 kehillah_decree_pressure_servants_t2:0 "The Nurses Still Come"
 kehillah_decree_pressure_servants_d2:0 "The village women who nurse our infants still come every morning, but they look over their shoulders at the door."
 kehillah_decree_pressure_servants_t3:0 "At the Toll-House"
 kehillah_decree_pressure_servants_d3:0 "[kehillah_toast_townsman.GetFirstName] has been seen at the toll-house by the bridge, asking the keeper how long his family has held it."
 kehillah_decree_pressure_servants_t4:0 "Who Will Keep the Fires"
 kehillah_decree_pressure_servants_d4:0 "[kehillah_toast_elder.GetFirstName] is teaching the girls of the household to keep the Sabbath fires, in case the women from the villages are sent away."
