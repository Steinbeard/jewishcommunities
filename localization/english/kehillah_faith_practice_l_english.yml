l_english:
 tenet_kehillah_scholarly_study_name:0 "Scholarly Study"
 tenet_kehillah_scholarly_study_rabbinic_name:0 "Iyyun ha-Talmud"
 tenet_kehillah_scholarly_study_desc:0 "Sacred teaching rewards patient comparison and rigorous argument. Teachers and students honor their inheritance by understanding the reasons behind its judgments."
 tenet_kehillah_sacred_liturgy_name:0 "Sacred Liturgy"
 tenet_kehillah_sacred_liturgy_jewish_name:0 "Piyyut"
 tenet_kehillah_sacred_liturgy_desc:0 "Beauty in prayer gives the faithful a common voice. Those who fashion and perform sacred verse offer their skill to the congregation's worship, rather than to their own acclaim."
 doctrine_parameter_kehillah_sacred_study:0 "Improves mastery when studying traditional sources"
 doctrine_parameter_kehillah_sacred_study_personal:0 "Talmudics or Parshanut mastery, according to religious authority: #P +6 percentage points#! instead of +3"
 doctrine_parameter_kehillah_sacred_liturgy:0 "Unlocks #V Compose or Perform Sacred Verse#!"
 doctrine_parameter_kehillah_sacred_liturgy_personal:0 "Sacred verse: #P +10 percentage points#! Composition Success Chance"
 doctrine_parameter_kehillah_legal_adjudication:0 "Rabbinic Bet Din judgments: #P +2#! Effective Learning"
 doctrine_parameter_kehillah_legal_adjudication_personal:0 "Rabbinic Bet Din judgments: #P +3#! Effective Learning instead of +2"
 kehillah_institutional_headship_name:0 "Institutional Headship"
 kehillah_institutional_headship_desc:0 "Religious leadership rests on a recognized office and its qualifications. A scholarly head, a restored council, and a Temple priesthood derive their authority from different institutions."
 kehillah_esotericism_general_glossary:0 "[Glossary('Esoteric Traditions','kehillah_esotericism_general_glossary_text')]"
 kehillah_esotericism_general_glossary_text:0 "Esoteric traditions seek meanings beyond the public teaching of sacred texts. Their methods and lineages differ between communities."
 KEHILLAH_LIB_CHANCE_SCHOLARLY_STUDY:0 "Scholarly study of the relevant sources"
 KEHILLAH_LIB_CHANCE_LITERAL_STUDY:0 "Scriptural interpretation"
 kehillah_sacred_study_decision:0 "Pursue Sacred Study"
 kehillah_sacred_study_decision_desc:0 "Set aside time to compare the texts received by my tradition, or share a difficult passage with other readers."
 kehillah_sacred_study_decision_tooltip:0 "Gain learning through study or teaching"
 kehillah_sacred_study_decision_confirm:0 "Bring out the texts"
 kehillah_sacred_liturgy_decision:0 "Compose or Perform Sacred Verse"
 kehillah_sacred_liturgy_decision_desc:0 "The words of prayer deserve careful attention. I could compose a new devotional poem, or lend my voice to the prayers my congregation already knows."
 kehillah_sacred_liturgy_decision_tooltip:0 "Compose devotional verse or lead familiar prayers"
 kehillah_sacred_liturgy_decision_confirm:0 "Let devotion find its words"
 kehillah_commemorate_faith_decision:0 "Remember Those Who Endured"
 kehillah_commemorate_faith_decision_desc:0 "Remember those who held to their convictions under persecution, and consider what I owe to those who survived."
 kehillah_commemorate_faith_decision_tooltip:0 "Seek consolation in remembrance or give aid"
 kehillah_commemorate_faith_decision_confirm:0 "Their lives will be remembered"
 kehillah_reasoned_debate_interaction:0 "Discuss a Religious Teaching"
 kehillah_reasoned_debate_interaction_desc:0 "Discuss a known teaching with [recipient.GetShortUINameNoTooltip]. Learning and Diplomacy determine whose argument proves more persuasive."
 kehillah_reasoned_exchange_opinion:0 "A Persuasive Discussion"
 kehillah_faith_practice.0001.t:0 "An Argument Worth Hearing"
 kehillah_faith_practice.0001.desc:0 "[kehillah_debate_partner.GetFirstName] has agreed to discuss a question of religious teaching. We know many of the same sources, yet a familiar passage can sustain more than one argument.\n\nWhich teaching should I defend?"
 kehillah_faith_practice.0001.study:0 "Patient study is the surest guide."
 kehillah_faith_practice.0001.law:0 "Judgment needs recognized authority."
 kehillah_faith_practice.0001.reason:0 "Faith has nothing to fear from reasoned inquiry."
 kehillah_reasoned_debate_won_toast:0 "Your argument carried"
 kehillah_reasoned_debate_lost_toast:0 "Your argument did not carry"
 kehillah_faith_practice.0001.exchange:0 "Let us exchange questions without seeking a victor."
 kehillah_faith_practice.0002.t:0 "A Difficult Passage"
 kehillah_faith_practice.0002.desc:0 "One passage seems plain until I compare it with another. An inherited explanation answers part of the difficulty, but leaves me with another question.\n\nI have set aside this time for study. How should I use it?"
 kehillah_faith_practice.0002.sources:0 "Follow the argument through the sources."
 kehillah_faith_practice.0002.teach:0 "Explain the difficulty to other readers."
 kehillah_faith_practice.0003.t:0 "Words for the Congregation"
 kehillah_faith_practice.0003.desc:0 "A line of prayer stays with me after the congregation has dispersed. I try it with another rhythm, then change a word. Perhaps it could become something others would wish to sing.\n\nThere is also much to be found in the prayers we already share."
 kehillah_faith_practice.0003.compose:0 "Compose a devotional poem."
 kehillah_faith_practice.0003.perform:0 "Lead familiar prayers with care."
 kehillah_faith_practice.0004.t:0 "What We Owe the Living"
 kehillah_faith_practice.0004.desc:0 "The names remembered in prayer belonged to people with households, neighbors, and unfinished work. To honor their endurance is also to consider those who must rebuild their lives.\n\nI could give time to remembrance, or offer something more tangible."
 kehillah_faith_practice.0004.remember:0 "Remember their names in prayer."
 kehillah_faith_practice.0004.aid:0 "Set aside aid for those in need."
 kehillah_faith_practice.0005.t:0 "An Offering for a Sacred Place"
 kehillah_faith_practice.0005.desc:0 "The sacred site at [kehillah_alms_site.GetName] belongs to the religious life of my faith even when I cannot travel there. An offering could support its faithful custodians or the community living nearby.\n\nHow should I mark that attachment?"
 kehillah_faith_practice.0005.give:0 "Send alms for its people and upkeep."
 kehillah_faith_practice.0005.pray:0 "Remember the place in prayer."
 kehillah_faith_practice.0006.t:0 "Faith After Persecution"
 kehillah_faith_practice.0006.desc:0 "The attack has left deaths or coerced conversions in its wake. Among the survivors, some speak of remaining faithful under compulsion and sustaining those who endured it.\n\nTheir words have become part of our religious life. Will I make this teaching my own?"
 kehillah_faith_practice.0006.witness:0 "I will bear witness through faithful living."
 kehillah_faith_practice.0006.remain:0 "I will support the survivors in my own way."
 kehillah_witness_conversion_resistance:0 "Sanctification of the Name"
 kehillah_witness_personal_conversion_resistance:0 "Personal commitment to enduring in faith"
 kehillah_witness_remembrance_tt:0 "The community's remembrance grants a small, fixed measure of Greatness, at most once in three years. The number of deaths does not increase it."
 doctrine_parameter_kehillah_kiddush_hashem_rite:0 "Demand Conversion Acceptance: #P -20#!\nUnlocks #V Remember Those Who Endured#!"
 doctrine_parameter_kehillah_kiddush_hashem_personal:0 "Demand Conversion Acceptance: #P -30#! instead of -20\nGreater rewards from remembrance and relief"
 kehillah_religious_legal_pronouncements_rabbinic_name:0 "Religious Legal Pronouncements"
 kehillah_sefer.0200.tt_13:0 "Piyyut: devotion through sacred verse."
 kehillah_literalism_jewish_name:0 "Peshuto shel Miqra"
 kehillah_literalism_jewish_desc:0 "Scripture rewards close attention to its language and context. Comparing passages and debating their meaning gives religious teaching a firm foundation in the words received by the congregation."
 doctrine_parameter_kehillah_scriptural_reading:0 "Parshanut works: #P +4 percentage points#! Mastery Chance"
 doctrine_parameter_kehillah_scriptural_reading_personal:0 "Parshanut works: #P +6 percentage points#! Mastery Chance instead of +4"
