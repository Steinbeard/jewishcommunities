l_english:
 minhag_yerushalmi:0 "Minhag Yerushalmi"
 minhag_yerushalmi_adj:0 "Minhag Yerushalmi"
 minhag_yerushalmi_adherent:0 "Yerushalmi Jew"
 minhag_yerushalmi_adherent_plural:0 "Yerushalmi Jews"
 minhag_yerushalmi_desc:0 "The Rabbinic custom of the Land of Israel preserves the Jerusalem Talmud and distinctive forms of prayer and festival observance. Its congregations maintain their own scholarly leadership and an attachment to the holy places that extends beyond those who live nearby."

 minhag_sepharad:0 "Minhag Sepharad"
 minhag_sepharad_adj:0 "Minhag Sepharad"
 minhag_sepharad_adherent:0 "Sephardi Jew"
 minhag_sepharad_adherent_plural:0 "Sephardi Jews"
 minhag_sepharad_desc:0 "The Rabbinic custom of Iberian Jewish congregations brings legal scholarship, liturgical poetry, and philosophical inquiry into a shared religious life. Its sages receive the Babylonian Talmud and Geonic teaching while cultivating their own interpretations and local usages."
