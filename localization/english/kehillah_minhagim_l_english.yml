l_english:
 minhag_yerushalmi:0 "Minhag Yerushalmi"
 minhag_yerushalmi_adj:0 "Yerushalmi"
 minhag_yerushalmi_adherent:0 "Palestinian Rabbinic Jew"
 minhag_yerushalmi_adherent_plural:0 "Palestinian Rabbinic Jews"
 minhag_yerushalmi_desc:0 "A Palestinian-rooted Rabbinic custom of prayer, learning, and local practice, carried also into early Italian and Byzantine communities. Its scholars preserve the Talmud Yerushalmi while remaining part of wider Rabbinic learning."

 minhag_sepharad:0 "Minhag Sepharad"
 minhag_sepharad_adj:0 "Sephardi"
 minhag_sepharad_adherent:0 "Sephardi Jew"
 minhag_sepharad_adherent_plural:0 "Sephardi Jews"
 minhag_sepharad_desc:0 "The Rabbinic custom of Sepharad, shaped by the prayer, poetry, and scholarship of Iberian Jewish communities. Its sages draw on the Babylonian Talmud and Geonic teaching while keeping their own local usages."
