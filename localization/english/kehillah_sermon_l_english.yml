l_english:

 kehillah_deliver_sermon_decision:0 "Deliver a Sermon"
 kehillah_deliver_sermon_decision_desc:0 "Address your community after the weekly reading. Choose whether to teach the text or speak to the obligations neighbors owe one another. Your Parshanut determines how much the sermon accomplishes."
 kehillah_deliver_sermon_decision_tooltip:0 "Address the congregation and choose a subject."
 kehillah_deliver_sermon_decision_confirm:0 "Prepare the sermon"

 kehillah_sermon.0001.t:0 "Before the Congregation"
 kehillah_sermon.0001.desc:0 "The reading is finished, and the congregation waits for you to speak. You have prepared a passage to explain, but the quarrels of the past week are on many minds."
 kehillah_sermon.0001.a:0 "Teach the passage."
 kehillah_sermon.0001.b:0 "Speak of what neighbors owe one another."
