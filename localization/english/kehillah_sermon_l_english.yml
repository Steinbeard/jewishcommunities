l_english:
 # Sermons. 2026-11-02 first version; 2026-11-11 rebuilt (Daniel):
 # docs/spec/2026-11-11-rulings-sermons-and-gates.md section 3.

 kehillah_deliver_sermon_decision:0 "Deliver a Sermon"
 kehillah_deliver_sermon_decision_desc:0 "Address the congregation after the reading, on what the community most needs to hear, with the texts you know best behind you. If you are not one to preach, your Dayyan speaks in your place."
 kehillah_deliver_sermon_decision_tooltip:0 "Address the congregation: choose a subject, and the texts to preach from."
 kehillah_deliver_sermon_decision_confirm:0 "Prepare the sermon"
 kehillah_deliver_sermon_decision_effect_tt:0 "You choose the sermon's subject, then up to two texts to preach from"
 kehillah_sermon_preacher_available_tt:0 "You or your Dayyan may preach: a rabbi who knows the Torah, or, outside Rabbinism, a learned scholar who has mastered it"
 kehillah_sermon_may_preach_tt:0 "You may preach: a rabbi who knows the Torah, or, outside Rabbinism, a learned scholar who has mastered it"
 kehillah_maggid_place_tt:0 "A Jewish community lives where you are"

 kehillah_maggid_sermon_decision:0 "Preach as a Maggid"
 kehillah_maggid_sermon_decision_desc:0 "A wandering preacher is welcome in any synagogue. Speak to the community here, for the name it will give you or for alms for the road."
 kehillah_maggid_sermon_decision_tooltip:0 "Preach to the Jewish community where you are."
 kehillah_maggid_sermon_decision_confirm:0 "Ask to speak"
 kehillah_maggid_sermon_decision_effect_tt:0 "You choose the sermon's purpose, then up to two texts to preach from"

 kehillah_sermon.0001.t:0 "Before the Congregation"
 kehillah_sermon.0001.desc:0 "The reading is finished, and the congregation waits for you to speak. What does the community most need to hear?"
 kehillah_sermon.0001.desc_dayyan:0 "The reading is finished, and you have asked your Dayyan to speak. What does the community most need to hear from him?"
 kehillah_sermon.0001.portion:0 "Teach the week's portion."
 kehillah_sermon.0001.neighbours:0 "Speak of what neighbours owe one another."
 kehillah_sermon.0001.tzedakah:0 "Call for tzedakah, for the hekdesh and the poor."
 kehillah_sermon.0001.peace:0 "Seek the peace of the city where we dwell."
 kehillah_sermon.0001.trouble:0 "Comfort them, and steady them, in this time of trouble."

 kehillah_sermon.0002.t:0 "A Text to Preach From"
 kehillah_sermon.0002.desc_first:0 "A sermon stands on its texts. Which shall carry this one?"
 kehillah_sermon.0002.desc_second:0 "One more text could carry the sermon further, if one comes to mind."
 kehillah_sermon.0002.grounded:0 "#EMP [GetPlayer.Custom('KehillahSermonCandGrounded')]#!, which all respect."
 kehillah_sermon.0002.newer:0 "#EMP [GetPlayer.Custom('KehillahSermonCandNewer')]#!, which deserves to be better known."
 kehillah_sermon.0002.none:0 "Let the words stand on their own."

 kehillah_sermon.0010.t:0 "The Maggid"
 kehillah_sermon.0010.desc:0 "The community here has heard that a learned traveller is among them, and the elders have made room for you after the reading. What will you ask of them?"
 kehillah_sermon.0010.guest:0 "Only a hearing: teach them the week's portion."
 kehillah_sermon.0010.appeal:0 "Their help: speak of charity, and of the road."

 kehillah_sermon_delivered_toast:0 "The Sermon Is Given"
 kehillah_sermon_shunned_toast:0 "The Benches Stand Empty"
 kehillah_sermon_flat_toast:0 "The Sermon Falls Flat"

 # 2026-11-11: who preaches, and the delivery.
 kehillah_sermon.0003.t:0 "Who Will Preach?"
 kehillah_sermon.0003.desc:0 "The Sabbath is coming, and the congregation expects a word of Torah. I could go up to the bimah myself, or I could ask [kehillah_sermon_dayyan.GetFirstName], my Dayyan, to speak in my place."
 kehillah_sermon.0003.self:0 "I will preach myself."
 kehillah_sermon.0003.self.tt:0 "You choose the texts you preach from"
 kehillah_sermon.0003.dayyan:0 "Let [kehillah_sermon_dayyan.GetFirstName] preach."
 kehillah_sermon.0003.dayyan.tt:0 "Your Dayyan chooses the texts he preaches from"
 kehillah_sermon.0004.t:0 "From the Bimah"
 kehillah_sermon.0004.desc_self:0 "The ark is closed, the benches creak, and every face turns toward me."
 kehillah_sermon.0004.desc_other:0 "The ark is closed, and [kehillah_sermon_preacher.GetFirstName] goes up to the bimah."
 kehillah_sermon.0004.desc_two:0 "\n\nThe sermon will stand on #EMP [GetPlayer.Custom('KehillahSermonCandCited1')]#! and #EMP [GetPlayer.Custom('KehillahSermonCandCited2')]#!."
 kehillah_sermon.0004.desc_one:0 "\n\nThe sermon will stand on #EMP [GetPlayer.Custom('KehillahSermonCandCited1')]#!."
 kehillah_sermon.0004.desc_one_second:0 "\n\nThe sermon will stand on #EMP [GetPlayer.Custom('KehillahSermonCandCited2')]#!."
 kehillah_sermon.0004.desc_none:0 "\n\nNo text carries it: the words must stand on their own."
 kehillah_sermon.0004.a:0 "Let the words be heard."
 kehillah_sermon_roll_success:0 "The congregation is moved"
 kehillah_sermon_roll_failure:0 "The sermon falls flat"
 kehillah_sermon_roll_texts:0 "The texts cited"
 kehillah_sermon_roll_gregarious:0 "[GetTrait('gregarious').GetName( GetNullCharacter )]"
 kehillah_sermon_roll_zealous:0 "[GetTrait('zealous').GetName( GetNullCharacter )]"
 kehillah_sermon_roll_theologian:0 "[GetTrait('theologian').GetName( GetNullCharacter )]"
 kehillah_sermon_roll_compassionate:0 "[GetTrait('compassionate').GetName( GetNullCharacter )]"
