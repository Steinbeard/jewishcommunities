 kehillah_sermon_roll_arrogant:0 "[GetTrait('arrogant').GetName( GetNullCharacter )]"
 kehillah_sermon_roll_niddui_desc:0 "Preaching under Niddui"
 kehillah_sermon_roll_herem_desc:0 "Preaching in herem"
