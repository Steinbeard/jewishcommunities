 # ---- Decisions -----------------------------------------------------
 kehillah_seek_approbation_decision:0 "Seek an Approbation"
 kehillah_seek_approbation_decision_desc:0 "A book is read for the names at its front as much as for its pages. A few lines from a scholar of standing would open doors for mine."
 kehillah_seek_approbation_decision_confirm:0 "Send the book"
 kehillah_seek_approbation_decision_tooltip:0 "Ask the most learned rabbi of your faith to endorse your latest book."
 kehillah_seek_approbation_decision_tt:0 "The most learned rabbi of your faith reads your latest book. If he approves, its standing rises in his rite."
 kehillah_seek_approbation_approver_tt:0 "A rabbi of standing ([learning|E] 16 or more) could read it"
 kehillah_judge_a_book_decision:0 "Judge a Book"
 kehillah_judge_a_book_decision_desc:0 "The rite looks to us for guidance on what its scholars should read."
 kehillah_judge_a_book_decision_confirm:0 "Take up the books"
 kehillah_judge_a_book_decision_tooltip:0 "Endorse or condemn a book read in your rite."
 kehillah_judge_a_book_decision_tt:0 "Choose a book and endorse or condemn it for the rite."
 kehillah_redeem_seized_books_decision:0 "Redeem Seized Books"
 kehillah_redeem_seized_books_decision_desc:0 "Books taken from Jewish shelves are for sale. To ransom them is a mitzvah."
 kehillah_redeem_seized_books_decision_confirm:0 "Pay the ransom"
 kehillah_redeem_seized_books_decision_tooltip:0 "Buy back a seized book your library lacks."
 kehillah_redeem_seized_books_decision_tt:0 "A seized book your library lacks comes home, a Bavli order first."
 kehillah_redeem_seized_books_pool_tt:0 "A seized book your library lacks is for sale"
 kehillah_endow_beit_midrash_decision:0 "Endow a Beit Midrash"
 kehillah_endow_beit_midrash_decision_desc:0 "A ruler who loves the Torah gives it a house. A temple holding of my realm could keep a library and a hall of study."
 kehillah_endow_beit_midrash_decision_confirm:0 "Endow it"
 kehillah_endow_beit_midrash_decision_tooltip:0 "Found a Beit Midrash and its library on a temple holding of your realm."
 kehillah_endow_beit_midrash_decision_tt:0 "A Beit Midrash is built on a temple holding of your realm, nearest your capital, and its library is founded with the Tanakh and a few volumes."
 kehillah_endow_beit_midrash_temple_tt:0 "A temple holding of your realm, held by a Jew, has no Beit Midrash"
 kehillah_found_landed_yeshiva_decision:0 "Found a Yeshiva"
 kehillah_found_landed_yeshiva_decision_desc:0 "Our house of study has a complete Shas and a teacher who has learned it. It could become an academy."
 kehillah_found_landed_yeshiva_decision_confirm:0 "Found the yeshiva"
 kehillah_found_landed_yeshiva_decision_tooltip:0 "Found a yeshiva at your library."
 kehillah_found_landed_yeshiva_decision_tt:0 "The most learned qualified scholar of your court heads a new yeshiva at your library."
 kehillah_found_landed_yeshiva_hall_tt:0 "Your library's Beit Midrash is at least a #EMP House of Study#!"
 kehillah_found_landed_yeshiva_control_tt:0 "The county of your library is under firm control (80 or more)"
 kehillah_found_yeshiva_shas_tt:0 "The library holds a #EMP complete Shas#! (for a Karaite academy, the Tanakh and the founding Karaite works)"
 kehillah_found_yeshiva_head_shas_tt:0 "Its head has mastered every order of the Talmud (a Karaite head, the Karaite curriculum)"
 kehillah_invite_great_teacher_decision:0 "Invite a Great Teacher"
 kehillah_invite_great_teacher_decision_desc:0 "An academy is founded around a teacher worth travelling to. If none has grown up in my lands, I can bring one."
 kehillah_invite_great_teacher_decision_confirm:0 "Send the invitation"
 kehillah_invite_great_teacher_decision_tooltip:0 "Invite the most learned scholar of your faith to head a yeshiva at your library."
 kehillah_invite_great_teacher_decision_tt:0 "The most learned scholar of your faith who has mastered the whole Shas is invited. If he accepts, he joins your court and a yeshiva is founded at your library."
 kehillah_invite_great_teacher_candidate_tt:0 "A scholar of your faith who has mastered the whole Shas, and holds no land, could be invited"

 # ---- Library panel: the Tanakh corpus, rounds, standing ------------
 KEHILLAH_LIB_CORPUS_TANAKH_TITLE:0 "Tanakh"
 KEHILLAH_LIB_CORPUS_TANAKH_RANK:0 "[Localize( Concatenate( 'KEHILLAH_STANDING_', IntToString( FixedPointToInt( GetPlayer.MakeScope.ScriptValue( 'kehillah_lib_standing_work_tanakh_torah' ) ) ) ) )]"
 KEHILLAH_LIB_CORPUS_TANAKH_PROGRESS:0 "[GetPlayer.MakeScope.ScriptValue('kehillah_lib_tanakh_mastered_count_value')|0]/3 mastered  •  [Title.MakeScope.ScriptValue('kehillah_lib_tanakh_held_count_value')|0]/3 held"
 KEHILLAH_LIB_CORPUS_TANAKH_DETAIL:0 "The Torah, the Prophets and the Writings. Every Jewish library keeps them, and if they are ever lost a neighbouring community lends or writes another within the year. Scripture is never finished: each full reading ends in a siyum and opens a deeper way of reading the next time."
 KEHILLAH_LIB_CORPUS_TANAKH_TT:0 "#T Tanakh#!\n#E Scripture#!  •  Parshanut\nThe Torah, Nevi'im and Ketuvim. Above every book on the ladder; each full reading ends in a siyum."
 KEHILLAH_LIB_CORPUS_ROUNDS:0 "Your rounds: Tanakh [GetPlayer.MakeScope.ScriptValue('kehillah_lib_tanakh_rounds_value')|0]  •  Bavli [GetPlayer.MakeScope.ScriptValue('kehillah_lib_bavli_rounds_value')|0]  •  Yerushalmi [GetPlayer.MakeScope.ScriptValue('kehillah_lib_yerushalmi_rounds_value')|0]"
 KEHILLAH_LIB_CORPUS_ROUNDS_TT:0 "#T Never finished#!\nRead every division of a corpus and it ends in a #EMP siyum#!; read them all again and the next siyum opens a deeper layer. The Tanakh moves from the plain sense to allusion, homily and the hidden meaning; the Talmud from the Gemara to Rashi, the Tosafot and your own novellae."
 KEHILLAH_LIB_CEILING_PREFIX:0 "#weak Its tenets let it rise no higher than#! "

