 # ---- Greatness row (Daniel's follow-up) ------------------------------
 kehillah_bd_foundations_shas_complete:0 "\n  A complete Shas: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_foundational_works_value')|0]#!"
