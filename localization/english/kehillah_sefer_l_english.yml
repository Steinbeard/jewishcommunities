 # ---- Standing (section 3) -------------------------------------------
 KEHILLAH_STANDING_0:0 "Rejected"
 KEHILLAH_STANDING_1:0 "Banned"
 KEHILLAH_STANDING_2:0 "Suspect"
 KEHILLAH_STANDING_3:0 "Contested"
 KEHILLAH_STANDING_4:0 "Obscure"
 KEHILLAH_STANDING_5:0 "Circulating"
 KEHILLAH_STANDING_6:0 "Respected"
 KEHILLAH_STANDING_7:0 "Esteemed"
 KEHILLAH_STANDING_8:0 "Classic"
 KEHILLAH_STANDING_9:0 "Authoritative"
 KEHILLAH_STANDING_10:0 "Venerated"
 KEHILLAH_STANDING_11:0 "Oral Torah"
 KEHILLAH_STANDING_12:0 "Prophets and Writings"
 KEHILLAH_STANDING_13:0 "Torah"
 KEHILLAH_STANDING_0_DESC:0 "Outside this rite's canon. It may be read to answer it, never accepted."
 KEHILLAH_STANDING_1_DESC:0 "Under a ban. Owning it is a scandal, and studying it is an offence."
 KEHILLAH_STANDING_2_DESC:0 "Rejected by leading authorities. It is read with caution, if at all."
 KEHILLAH_STANDING_3_DESC:0 "In open dispute. Some communities shun it."
 KEHILLAH_STANDING_4_DESC:0 "Little known. Most new books begin here."
 KEHILLAH_STANDING_5_DESC:0 "Copied and read in several places."
 KEHILLAH_STANDING_6_DESC:0 "Widely read, and it may be cited in court."
 KEHILLAH_STANDING_7_DESC:0 "Cited by leading rabbis."
 KEHILLAH_STANDING_8_DESC:0 "On the shelf of every serious beit midrash, and taught in the yeshivot."
 KEHILLAH_STANDING_9_DESC:0 "Rulings follow it unless shown otherwise."
 KEHILLAH_STANDING_10_DESC:0 "Studied beside the Talmud itself. No book can rise higher."
 KEHILLAH_STANDING_11_DESC:0 "The Mishnah and the Talmuds: canon by doctrine, beyond any book's reach."
 KEHILLAH_STANDING_12_DESC:0 "Scripture, beyond any book's reach."
 KEHILLAH_STANDING_13_DESC:0 "Scripture's heart, above all else."
 KEHILLAH_LIB_STANDING_HEADER:0 "Standing in your rite"
 KEHILLAH_LIB_STANDING_CANON_NOTE:0 "#weak Canon is fixed by doctrine. No book, ban or synod can move it.#!"
 KEHILLAH_LIB_LADDER_TT:0 "#T Standing#!\nEach rite places every book on a ladder from #EMP Banned#! to #EMP Venerated#!. Above it sit the #EMP Oral Torah#!, the #EMP Prophets and Writings#! and the #EMP Torah#!, which no book can reach.\n\nA book climbs as libraries copy it, scholars master it, rabbis give it their approbation, yeshivot teach it and courts cite it. Each tier above #EMP Obscure#! also needs something only people and time can give. The tenets a book argues for set how high it can go in a rite: a tenet the rite prohibits holds it at #EMP Contested#!."

 # ---- Books written in play (section 6) ------------------------------
 KEHILLAH_AUTHORED_KIND_NONE:0 "Book"
 KEHILLAH_AUTHORED_KIND_1:0 "Commentary on the Torah"
 KEHILLAH_AUTHORED_KIND_2:0 "Commentary on the Talmud"
 KEHILLAH_AUTHORED_KIND_3:0 "Book of Responsa"
 KEHILLAH_AUTHORED_KIND_4:0 "Code of Law"
 KEHILLAH_AUTHORED_KIND_5:0 "Treatise of Thought"
 KEHILLAH_AUTHORED_KIND_6:0 "Book of Piyyutim"
 KEHILLAH_AUTHORED_KIND_7:0 "Book of Glosses"
 KEHILLAH_AUTHORED_KIND_8:0 "Critique"

 # ---- Tenets (section 4.2) -------------------------------------------
 tenet_kehillah_hokhmah_name:0 "Hokhmah"
 tenet_kehillah_hokhmah_desc:0 "Torah and wisdom are one. The commandment to know God is fulfilled by reasoning toward Him, and philosophy, rightly understood, serves the Torah rather than threatening it."
 tenet_kehillah_emunah_temimah_name:0 "Emunah Temimah"
 tenet_kehillah_emunah_temimah_desc:0 "The faith of the fathers needs no proof from the Greeks. What was received at Sinai and handed down is surer than any argument, and speculation leads more often away from God than toward Him."
 tenet_kehillah_pesak_name:0 "Pesak"
 tenet_kehillah_pesak_desc:0 "The law must be known to be kept. A ruling set down plainly, with the debate behind it put aside, serves the people better than an argument they cannot follow."
 tenet_kehillah_pilpul_name:0 "Pilpul"
 tenet_kehillah_pilpul_desc:0 "The law lives in the argument. A student who learns only the ruling has learned nothing; he must follow the Talmud's reasoning from passage to passage until it becomes his own."
 tenet_kehillah_geonut_name:0 "Ge'onut"
 tenet_kehillah_geonut_desc:0 "The great academies of Babylonia hold the chain of the tradition unbroken. Their heads answer the questions of the whole diaspora, and their answers bind it."
 tenet_kehillah_minhag_avoteinu_name:0 "Minhag Avoteinu"
 tenet_kehillah_minhag_avoteinu_desc:0 "The custom of our fathers is Torah. What a community has long practised has the force of law there, and no distant authority may set it aside."
 tenet_kehillah_avelei_tziyon_name:0 "Avelei Tziyon"
 tenet_kehillah_avelei_tziyon_desc:0 "Jerusalem lies in ruins and should be mourned. The Mourners of Zion fast and pray for it, and the most devoted go up to live among its ruins."
 tenet_kehillah_hasidut_name:0 "Hasidut"
 tenet_kehillah_hasidut_desc:0 "Piety asks more than the law requires. The hasid restrains his appetites, examines his deeds and repents, so that his whole life becomes service of God."
 tenet_kehillah_hasidut_historical_glossary:0 "The pietists of Germany (Hasidei Ashkenaz) taught penitence and a strictness beyond the letter of the law, and wrote their teachings down in Sefer Hasidim."
 kehillah_tenet_reason_exclusivity_desc:0 "Cannot be chosen alongside both Hokhmah and Emunah Temimah."
 kehillah_tenet_authority_exclusivity_desc:0 "Cannot be chosen alongside both Ge'onut and Minhag Avoteinu."
 kehillah_tenet_oral_torah_exclusivity_desc:0 "Cannot be chosen alongside both Talmud Torah and Ba'alei ha-Miqra."
 doctrine_parameter_kehillah_sefer_hokhmah:0 "Books that argue for Hokhmah can rise high in this rite"
 doctrine_parameter_kehillah_sefer_hokhmah_personal:0 "Learns more from books that argue for Hokhmah"
 doctrine_parameter_kehillah_sefer_emunah_temimah:0 "Books that argue for Emunah Temimah can rise high in this rite"
 doctrine_parameter_kehillah_sefer_emunah_temimah_personal:0 "Learns more from books that argue for Emunah Temimah"
 doctrine_parameter_kehillah_sefer_pesak:0 "Books that argue for Pesak can rise high in this rite"
 doctrine_parameter_kehillah_sefer_pesak_personal:0 "Learns more from books that argue for Pesak"
 doctrine_parameter_kehillah_sefer_pilpul:0 "Books that argue for Pilpul can rise high in this rite"
 doctrine_parameter_kehillah_sefer_pilpul_personal:0 "Learns more from books that argue for Pilpul"
 doctrine_parameter_kehillah_sefer_geonut:0 "Books that argue for Ge'onut can rise high in this rite"
 doctrine_parameter_kehillah_sefer_geonut_personal:0 "Learns more from books that argue for Ge'onut"
 doctrine_parameter_kehillah_sefer_minhag_avoteinu:0 "Books that argue for Minhag Avoteinu can rise high in this rite"
 doctrine_parameter_kehillah_sefer_minhag_avoteinu_personal:0 "Learns more from books that argue for Minhag Avoteinu"
 doctrine_parameter_kehillah_sefer_avelei_tziyon:0 "Books that argue for Avelei Tziyon can rise high in this rite"
 doctrine_parameter_kehillah_sefer_avelei_tziyon_personal:0 "Learns more from books that argue for Avelei Tziyon"
 doctrine_parameter_kehillah_talmud_torah_personal:0 "A reread of the Tanakh or the Talmud is never wasted"
 doctrine_parameter_kehillah_baalei_hamiqra_personal:0 "Learns more from Karaite books"

 # ---- Temple Beit Midrash (Daniel's decision 1) ----------------------
 building_type_kehillah_temple_beit_midrash_01:0 "Beit Midrash"
 building_type_kehillah_temple_beit_midrash_01_desc:0 "A house of study beside the temple, with a library that belongs to this holding. Every Jewish ruler of the realm may read there."
 building_kehillah_temple_beit_midrash_01:0 "Beit Midrash"
 building_kehillah_temple_beit_midrash_01_desc:0 "Benches, a reader's lectern and a cupboard of books: a house of study for the scholars of the holding."
 building_kehillah_temple_beit_midrash_02:0 "House of Study"
 building_kehillah_temple_beit_midrash_02_desc:0 "A hall large enough for a teacher and his students, with room for a yeshiva."
 building_kehillah_temple_beit_midrash_03:0 "Great House of Study"
 building_kehillah_temple_beit_midrash_03_desc:0 "A great hall with its own copyists, known to scholars far beyond the realm."
 kehillah_temple_beit_midrash_jewish_holder_tt:0 "The holder of this temple holding is Jewish"

