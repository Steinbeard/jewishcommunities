 # ---- Standing (section 3) -------------------------------------------
 # 2026-11-11: one scale, twelve tiers (docs/spec/2026-11-11-standing-one-scale.md).
 KEHILLAH_STANDING_0:0 "Anathema"
 KEHILLAH_STANDING_1:0 "Banned"
 KEHILLAH_STANDING_2:0 "Rejected"
 KEHILLAH_STANDING_3:0 "Contested"
 KEHILLAH_STANDING_4:0 "Obscure"
 KEHILLAH_STANDING_5:0 "Popular"
 KEHILLAH_STANDING_6:0 "Celebrated"
 KEHILLAH_STANDING_7:0 "Esteemed"
 KEHILLAH_STANDING_8:0 "Authoritative"
 KEHILLAH_STANDING_9:0 "Foundational"
 KEHILLAH_STANDING_10:0 "Prophetic"
 KEHILLAH_STANDING_11:0 "Divine"
 KEHILLAH_STANDING_0_DESC:0 "A danger to the faith, cut off by a formal ban. Whoever keeps to it risks being cut off as well."
 KEHILLAH_STANDING_1_DESC:0 "Its ideas are deeply troubling. Reading it openly draws raised eyebrows and suspicion."
 KEHILLAH_STANDING_2_DESC:0 "Judged too full of errors to be of value, though reading it is not forbidden."
 KEHILLAH_STANDING_3_DESC:0 "Some find parts of it troubling or offensive, and communities differ over it."
 KEHILLAH_STANDING_4_DESC:0 "Little known and little studied. Most new books begin here."
 KEHILLAH_STANDING_5_DESC:0 "Copied and read in many places, though few scholars yet praise it."
 KEHILLAH_STANDING_6_DESC:0 "Praised by scholars and perhaps authoritative, but the consensus is still out."
 KEHILLAH_STANDING_7_DESC:0 "Respected everywhere and taught in the yeshivot, though parts of it may be disputed."
 KEHILLAH_STANDING_8_DESC:0 "A serious authority owed deference. No book rises higher by acclaim alone."
 KEHILLAH_STANDING_9_DESC:0 "Canonical and essential to the faith's practice. Fixed by doctrine; no book can reach it."
 KEHILLAH_STANDING_10_DESC:0 "The words of the prophets. Fixed by doctrine; no book can reach it."
 KEHILLAH_STANDING_11_DESC:0 "The word of God, above all else. Fixed by doctrine."
 KEHILLAH_LIB_STANDING_HEADER:0 "Standing in your rite"
 KEHILLAH_LIB_STANDING_CANON_NOTE:0 "#weak Canon is fixed by doctrine. No book, ban or synod can move it.#!"
 # 2026-11-11 (Daniel: "a separate tooltip under Standing ... that explains all the tiers"):
 # every tier with its meaning, on the Canonicity label and column head.
 KEHILLAH_LIB_LADDER_TT:0 "#T Canonicity#!\nHow far a rite accepts a book, on one scale; each rite keeps its own. The top three are fixed by doctrine, and no book can reach them.\n\n#weak $KEHILLAH_STANDING_NUM_11$#!  $KEHILLAH_STANDING_FMT_11$#weak  — God's own words#!\n#weak $KEHILLAH_STANDING_NUM_10$#!  $KEHILLAH_STANDING_FMT_10$#weak  — the words of the prophets#!\n#weak $KEHILLAH_STANDING_NUM_9$#!  $KEHILLAH_STANDING_FMT_9$#weak  — canonical, essential to the faith's practice#!\n#weak $KEHILLAH_STANDING_NUM_8$#!  $KEHILLAH_STANDING_FMT_8$#weak  — a serious authority owed deference#!\n#weak $KEHILLAH_STANDING_NUM_7$#!  $KEHILLAH_STANDING_FMT_7$#weak  — respected everywhere and taught#!\n#weak $KEHILLAH_STANDING_NUM_6$#!  $KEHILLAH_STANDING_FMT_6$#weak  — praised; the consensus is still out#!\n#weak $KEHILLAH_STANDING_NUM_5$#!  $KEHILLAH_STANDING_FMT_5$#weak  — read and known, without the praise#!\n#weak $KEHILLAH_STANDING_NUM_4$#!  $KEHILLAH_STANDING_FMT_4$#weak  — little known; most new books begin here#!\n#weak Below Obscure, the tiers of censure:#!\n#weak $KEHILLAH_STANDING_NUM_3$#!  $KEHILLAH_STANDING_FMT_3$#weak  — parts are found troubling or offensive#!\n#weak $KEHILLAH_STANDING_NUM_2$#!  $KEHILLAH_STANDING_FMT_2$#weak  — too full of errors to be of value#!\n#weak $KEHILLAH_STANDING_NUM_1$#!  $KEHILLAH_STANDING_FMT_1$#weak  — deeply troubling; its readers fall under suspicion#!\n#weak $KEHILLAH_STANDING_NUM_0$#!  $KEHILLAH_STANDING_FMT_0$#weak  — cut off by a formal ban#!\n\nA book climbs as libraries copy it, scholars master it, rabbis give it their approbation, yeshivot teach it and courts cite it. #EMP $KEHILLAH_STANDING_7$#! also needs enough scholars who have mastered it, and #EMP $KEHILLAH_STANDING_8$#! needs a generation of reliance: rulings that cite it, sermons preached from it, or minds it has changed. The tenets a book argues for set how high it can go in a rite: a tenet the rite prohibits holds it at #EMP $KEHILLAH_STANDING_3$#!. An #EMP $KEHILLAH_STANDING_0$#! is pronounced, never drifted into."
 # ---- Books written in play (section 6) ------------------------------
 KEHILLAH_AUTHORED_KIND_NONE:0 "Book"
 KEHILLAH_AUTHORED_KIND_1:0 "Commentary on the Torah"
 KEHILLAH_AUTHORED_KIND_2:0 "Commentary on the Talmud"
 KEHILLAH_AUTHORED_KIND_3:0 "Book of Responsa"
 KEHILLAH_AUTHORED_KIND_4:0 "Code of Law"
 KEHILLAH_AUTHORED_KIND_5:0 "Treatise of Thought"
 KEHILLAH_AUTHORED_KIND_6:0 "Book of Piyyutim"
 KEHILLAH_AUTHORED_KIND_7:0 "Book of Glosses"
 KEHILLAH_AUTHORED_KIND_8:0 "Critique"

 # ---- Tenets (section 4.2) -------------------------------------------
 tenet_kehillah_hokhmah_name:0 "Hokhmah"
 tenet_kehillah_hokhmah_desc:0 "Torah and wisdom are one. The commandment to know God is fulfilled by reasoning toward Him, and philosophy, rightly understood, serves the Torah rather than threatening it."
 tenet_kehillah_emunah_temimah_name:0 "Emunah Temimah"
 tenet_kehillah_emunah_temimah_desc:0 "The faith of the fathers needs no proof from the Greeks. What was received at Sinai and handed down is surer than any argument, and speculation leads more often away from God than toward Him."
 tenet_kehillah_pesak_name:0 "Pesak"
 tenet_kehillah_pesak_desc:0 "The law must be known to be kept. A ruling set down plainly, with the debate behind it put aside, serves the people better than an argument they cannot follow."
 tenet_kehillah_pilpul_name:0 "Pilpul"
 tenet_kehillah_pilpul_desc:0 "The law lives in the argument. A student who learns only the ruling has learned nothing; he must follow the Talmud's reasoning from passage to passage until it becomes his own."
 tenet_kehillah_geonut_name:0 "Ge'onut"
 tenet_kehillah_geonut_desc:0 "The great academies of Babylonia hold the chain of the tradition unbroken. Their heads answer the questions of the whole diaspora, and their answers bind it."
 tenet_kehillah_minhag_avoteinu_name:0 "Minhag Avoteinu"
 tenet_kehillah_minhag_avoteinu_desc:0 "The custom of our fathers is Torah. What a community has long practised has the force of law there, and no distant authority may set it aside."
 tenet_kehillah_avelei_tziyon_name:0 "Avelei Tziyon"
 tenet_kehillah_avelei_tziyon_desc:0 "Jerusalem lies in ruins and should be mourned. The Mourners of Zion fast and pray for it, and the most devoted go up to live among its ruins."
 tenet_kehillah_hasidut_name:0 "Hasidut"
 tenet_kehillah_hasidut_desc:0 "Piety asks more than the law requires. The hasid restrains his appetites, examines his deeds and repents, so that his whole life becomes service of God."
 tenet_kehillah_hasidut_historical_glossary:0 "The pietists of Germany (Hasidei Ashkenaz) taught penitence and a strictness beyond the letter of the law, and wrote their teachings down in Sefer Hasidim."
 kehillah_tenet_reason_exclusivity_desc:0 "Cannot be chosen alongside both Hokhmah and Emunah Temimah."
 kehillah_tenet_authority_exclusivity_desc:0 "Cannot be chosen alongside both Ge'onut and Minhag Avoteinu."
 kehillah_tenet_oral_torah_exclusivity_desc:0 "Cannot be chosen alongside both Talmud Torah and Ba'alei ha-Miqra."
 doctrine_parameter_kehillah_sefer_hokhmah:0 "Books that argue for Hokhmah can rise high in this rite"
 doctrine_parameter_kehillah_sefer_hokhmah_personal:0 "Learns more from books that argue for Hokhmah"
 doctrine_parameter_kehillah_sefer_emunah_temimah:0 "Books that argue for Emunah Temimah can rise high in this rite"
 doctrine_parameter_kehillah_sefer_emunah_temimah_personal:0 "Learns more from books that argue for Emunah Temimah"
 doctrine_parameter_kehillah_sefer_pesak:0 "Books that argue for Pesak can rise high in this rite"
 doctrine_parameter_kehillah_sefer_pesak_personal:0 "Learns more from books that argue for Pesak"
 doctrine_parameter_kehillah_sefer_pilpul:0 "Books that argue for Pilpul can rise high in this rite"
 doctrine_parameter_kehillah_sefer_pilpul_personal:0 "Learns more from books that argue for Pilpul"
 doctrine_parameter_kehillah_sefer_geonut:0 "Books that argue for Ge'onut can rise high in this rite"
 doctrine_parameter_kehillah_sefer_geonut_personal:0 "Learns more from books that argue for Ge'onut"
 doctrine_parameter_kehillah_sefer_minhag_avoteinu:0 "Books that argue for Minhag Avoteinu can rise high in this rite"
 doctrine_parameter_kehillah_sefer_minhag_avoteinu_personal:0 "Learns more from books that argue for Minhag Avoteinu"
 doctrine_parameter_kehillah_sefer_avelei_tziyon:0 "Books that argue for Avelei Tziyon can rise high in this rite"
 doctrine_parameter_kehillah_sefer_avelei_tziyon_personal:0 "Learns more from books that argue for Avelei Tziyon"
 doctrine_parameter_kehillah_talmud_torah_personal:0 "A reread of the Tanakh or the Talmud is never wasted"
 doctrine_parameter_kehillah_baalei_hamiqra_personal:0 "Learns more from Karaite books"

 # ---- Temple Beit Midrash (Daniel's decision 1) ----------------------
 building_type_kehillah_temple_beit_midrash_01:0 "Beit Midrash"
 building_type_kehillah_temple_beit_midrash_01_desc:0 "A house of study beside the temple, with a library that belongs to this holding. Every Jewish ruler of the realm may read there."
 building_kehillah_temple_beit_midrash_01:0 "Beit Midrash"
 building_kehillah_temple_beit_midrash_01_desc:0 "Benches, a reader's lectern and a cupboard of books: a house of study for the scholars of the holding."
 building_kehillah_temple_beit_midrash_02:0 "House of Study"
 building_kehillah_temple_beit_midrash_02_desc:0 "A hall large enough for a teacher and his students, with room for a yeshiva."
 building_kehillah_temple_beit_midrash_03:0 "Great House of Study"
 building_kehillah_temple_beit_midrash_03_desc:0 "A great hall with its own copyists, known to scholars far beyond the realm."
 kehillah_temple_beit_midrash_jewish_holder_tt:0 "The holder of this temple holding is Jewish"

 # ---- Modifiers ------------------------------------------------------
 kehillah_banned_books_1_modifier:0 "A Banned Book on the Shelf"
 kehillah_banned_books_1_modifier_desc:0 "This library keeps a book under a ban."
 kehillah_banned_books_2_modifier:0 "Banned Books on the Shelf"
 kehillah_banned_books_2_modifier_desc:0 "This library keeps two books under a ban."
 kehillah_banned_books_3_modifier:0 "A Shelf of Banned Books"
 kehillah_banned_books_3_modifier_desc:0 "This library keeps many books under a ban, and people talk."
 kehillah_heterodox_reader_modifier:0 "Read Against the Rite"
 kehillah_heterodox_reader_modifier_desc:0 "This scholar has mastered a book that argues for what his own rite forbids."
 kehillah_complete_shas_modifier:0 "A Complete Shas"
 kehillah_complete_shas_modifier_desc:0 "This library holds all six orders of the Babylonian Talmud."
 kehillah_landed_yeshiva_patron_modifier:0 "Patron of a Yeshiva"
 kehillah_landed_yeshiva_patron_modifier_desc:0 "A yeshiva studies under this ruler's protection."

 # ---- Messages ------------------------------------------------------
 message_filter_kehillah_sefer_news:0 "Sefer News"
 message_filter_kehillah_sefer_news_desc:0 "Books: a book's standing rises or falls, a controversy, a burning"
 kehillah_sefer_msg_standing_rise_t:0 "A Book Rises"
 kehillah_sefer_msg_standing_rise_d:0 "#EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! is held in higher regard in your rite."
 kehillah_sefer_msg_standing_fall_t:0 "A Book Falls"
 kehillah_sefer_msg_standing_fall_d:0 "#EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! is held in lower regard in your rite."
 kehillah_sefer_msg_burned_t:0 "A Book Burned"
 kehillah_sefer_msg_burned_d:0 "Denounced to the Church, the copies of #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! in our lands were seized and burned."
 kehillah_sefer_approbation_granted_t:0 "An Approbation Granted"
 kehillah_sefer_teacher_arrives_t:0 "A Great Teacher Arrives"

 # ---- Greatness row (Daniel's follow-up) ------------------------------
 kehillah_bd_foundations_shas_complete:0 "\n  A complete Shas: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_foundational_works_value')|0]#!"
 kehillah_bd_foundations_karaite_complete:0 "\n  The founding Karaite works on the shelf: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_foundational_works_value')|0]#!"
 kehillah_bd_foundations_shas_missing:0 "\n  Bavli orders missing from the library: #N [ROOT.Char.MakeScope.ScriptValue('kehillah_bd_foundational_works_value')|0]#!"
 kehillah_bd_foundations_karaite_missing:0 "\n  Founding Karaite works missing from the library: #N [ROOT.Char.MakeScope.ScriptValue('kehillah_bd_foundational_works_value')|0]#!"
 # 2026-11-11 (Daniel): every book on the shelf, by its standing in your rite.
 kehillah_bd_library_works_positive:0 "\n  The library's books, by their standing: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_library_works_value')|0]#!"
 kehillah_bd_library_works_negative:0 "\n  Banned books on the library's shelves: #N [ROOT.Char.MakeScope.ScriptValue('kehillah_bd_library_works_value')|0]#!"

 # ---- Events: the siyum ---------------------------------------------
 kehillah_sefer.0010.t:0 "A Siyum"
 kehillah_sefer.0010.desc.tanakh_1:0 "The last verse of Chronicles is read, and the scroll of the Torah, the Prophets and the Writings is complete in your mind once again. You have read it for its plain sense, word by word. The community gathers to celebrate the end, and to begin again."
 kehillah_sefer.0010.desc.tanakh_2:0 "Reading the whole of Scripture again, you heard what the plain words only hint at: a verse in Isaiah answering one in Genesis, a word repeated across books. The community gathers for the siyum."
 kehillah_sefer.0010.desc.tanakh_3:0 "This time you read Scripture with the midrash open beside it, and every verse became a sermon. The community gathers for the siyum, and asks you to speak."
 kehillah_sefer.0010.desc.tanakh_4:0 "On this round the text opened onto what is hidden in it. You keep most of what you saw to yourself. The community gathers for the siyum and sees only that you are moved."
 kehillah_sefer.0010.desc.talmud_1:0 "The last page of the last tractate is turned. You have been through the whole of it, order by order, and the community gathers to mark the end of a Shas, and its new beginning."
 kehillah_sefer.0010.desc.talmud_2:0 "You have gone through the Talmud again with the running commentary at your elbow, and passages that were closed are open now. The community gathers for the siyum."
 kehillah_sefer.0010.desc.talmud_3:0 "With the Tosafot beside you, every page of this round reached into others: a contradiction here, its answer three tractates away. The community gathers for the siyum."
 kehillah_sefer.0010.desc.talmud_4:0 "On this round the questions were your own. Your margins are full of them, and some of the answers too. The community gathers for the siyum and asks what you found."
 kehillah_sefer.0010.a:0 "And now, from the beginning."

 # ---- Events: a sealed library --------------------------------------
 kehillah_sefer.0020.t:0 "The Jews' Books"
 kehillah_sefer.0020.desc:0 "Among the holdings now ours is a Jewish house of study, its cupboards full of books in Hebrew. The Jews who used it ask that it be left alone. Others have offered to buy the books, and a cleric of my household says some of them are worth reading."
 kehillah_sefer.0020.a:0 "Lock the doors and leave it be."
 kehillah_sefer.0020.b:0 "Sell the books to the Jews."
 kehillah_sefer.0020.b.tt:0 "The books are carried off. Any Jewish library may buy them back."
 kehillah_sefer.0020.c:0 "Give them to a learned cleric."
 kehillah_sefer.0020.c.tt:0 "The books leave Jewish hands for good."
 kehillah_sefer.0020.d:0 "Burn them."
 kehillah_sefer.0020.d.tt:0 "The books are destroyed, and the Church will hear of it."

 # ---- Events: Machloket ----------------------------------------------
 kehillah_sefer.0101.t:0 "Glosses Against a Book"
 kehillah_sefer.0101.desc:0 "Letters are passing between the communities of our rite. Scholars have written glosses against #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#!, and its admirers are answering them. A controversy is beginning.\n\n[ROOT.Char.Custom('KehillahMachloketContext')]\n\n[ROOT.Char.Custom('KehillahMachloketCriticText')]"
 kehillah_sefer.0101.critic:0 "[kehillah_machloket_critic.GetTitledFirstName] has circulated the opening gloss, arguing that the book reaches beyond what our rite ought to receive."
 kehillah_sefer.0101.no_critic:0 "No single critic has yet emerged; the first objections are passing from one study house to another."
 kehillah_sefer.0101.context_generic:0 "The book is widely read, but it has reached the limit of what our rite's present teachings permit. The dispute concerns whether its ideas should be received more fully."
 kehillah_sefer.0101.context_emunot_vedeot:0 "#EMP Emunot ve-Deot#!—the #EMP Book of Beliefs and Opinions#!—was written in Judeo-Arabic around 933 by Saadia ben Joseph, Gaon of Sura. It defends inherited revelation through reasoned argument. The present dispute concerns #EMP Hokhmah#!, the place of philosophical inquiry within Torah learning, and the authority of transmitted teaching."
 kehillah_sefer.0101.a:0 "This will not end quietly."
 kehillah_sefer.0102.t:0 "The Letters"
 kehillah_sefer.0102.desc:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! has reached our door. [ROOT.Char.Custom('KehillahMachloketLettersDossier')]\n\n[ROOT.Char.Custom('KehillahMachloketLettersScholars')]\n\n#EMP Your judgment#!\n[ROOT.Char.Custom('KehillahMachloketLettersPersonalStance')]\n\n#EMP Our rite#!\n[ROOT.Char.Custom('KehillahMachloketLettersRiteStance')]\n\nBoth letters ask for our seal. Whatever we decide, our name will be read in every community of the rite."
 kehillah_sefer.0102.dossier_emunot_vedeot:0 "Written in Judeo-Arabic around 933 by #EMP Saadia ben Joseph, Gaon of Sura#!, the book argues that reasoned inquiry can defend the revelation received at Sinai. It supports #EMP Hokhmah#! and #EMP Torah study#! as partners in understanding faith, while rejecting the claim that Scripture alone can settle every question."
 kehillah_sefer.0102.dossier_generic:0 "The disputed work has reached the limit of what our rite presently receives. Its defenders ask us to accept its arguments more fully; its critics ask us to set them aside."
 kehillah_sefer.0102.scholars_both:0 "#EMP [kehillah_machloket_champion.GetTitledFirstName]#!, who has mastered the book, asks us to defend it. #EMP [kehillah_machloket_critic.GetTitledFirstName]#! has circulated the reply, warning that the book reaches beyond the rite's inherited teaching."
 kehillah_sefer.0102.scholars_critic:0 "#EMP [kehillah_machloket_critic.GetTitledFirstName]#! has circulated the critical letter, warning that the book reaches beyond the rite's inherited teaching. Its defenders ask us to answer."
 kehillah_sefer.0102.scholars_generic:0 "The letters bear the seals of learned communities across the rite; no single scholar yet speaks for either side."
 kehillah_sefer.0102.personal_baalei_hamiqra:0 "Your own commitment to #EMP Scripture Alone#! directly conflicts with the book's defence of transmitted teaching and philosophical inquiry."
 kehillah_sefer.0102.personal_favourable:0 "Your own tenets favor the book's project: Torah is strengthened by sustained study and, where fitting, disciplined inquiry."
 kehillah_sefer.0102.personal_neutral:0 "You hold no personal tenet that decides the question for you; its authority must be weighed on the merits of its arguments."
 kehillah_sefer.0102.personal_generic:0 "Your own commitments do not settle this question; its authority must be weighed on the merits of its arguments."
 kehillah_sefer.0102.rite_baalei_hamiqra:0 "The rite holds #EMP Scripture Alone#!. This directly conflicts with the book's defence of received rabbinic teaching, and keeps it from full acceptance."
 kehillah_sefer.0102.rite_hokhmah_prohibited:0 "The rite prohibits #EMP Hokhmah#!. The book's appeal to reasoned inquiry therefore remains unacceptable, however esteemed its author may be."
 kehillah_sefer.0102.rite_hokhmah_not_core:0 "The rite allows some philosophical inquiry, but does not make #EMP Hokhmah#! a core commitment. The book presses the question further."
 kehillah_sefer.0102.rite_talmud_torah_not_core:0 "The rite values learning, but has not made #EMP Torah study#! a core commitment. The book's defenders ask it to do so."
 kehillah_sefer.0102.rite_generic:0 "The rite recognizes the book, yet has not granted every claim it makes full authority. That gap is the question before the communities."
 kehillah_sefer.0102.a:0 "We stand with the book."
 kehillah_sefer.0102.a.tt:0 "Your community's scholarly weight is added to the defence of #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#!."
 kehillah_sefer.0102.b:0 "We condemn it."
 kehillah_sefer.0102.b.tt:0 "Your community's scholarly weight is added to the condemnation of #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#!."
 kehillah_sefer.0102.c:0 "We sign nothing."
 kehillah_sefer.0102.c.tt:0 "We stay out of it."
 kehillah_sefer.0103.t:0 "The Controversy Ends"
 kehillah_sefer.0103.desc.defended:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! is over. Its defenders carried the rite with them, and the book is read more widely than before."
 kehillah_sefer.0103.desc.condemned:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! is over. Its critics carried the rite, and the book has fallen in esteem."
 kehillah_sefer.0103.desc.banned:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! is over. Its critics overwhelmed its defenders, and the book has been pronounced #EMP $KEHILLAH_STANDING_0$#!."
 kehillah_sefer.0103.desc.synthesis:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! has ended without a victor. A scholar wrote a reconciling commentary that both sides could accept, and the dispute has left the rite richer than it found it."
 kehillah_sefer.0103.a:0 "So it ends."
 kehillah_sefer.0104.t:0 "Our Own Way"
 kehillah_sefer.0104.desc:0 "The rite has turned against #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#!, yet many stood with me in its defence. They look to me now. We could submit, or we could set down our own rite, in which the truth this book teaches is held as a pillar of faith."
 kehillah_sefer.0104.a:0 "We will found our own rite."
 kehillah_sefer.0104.a.tt:0 "A new rite is founded, holding as a core tenet what the book argues."
 kehillah_sefer.0104.b:0 "We submit, for the sake of peace."

 # ---- Events: what a book argues ------------------------------------
 kehillah_sefer.0200.t:0 "What the Book Argues"
 kehillah_sefer.0200.desc:0 "A book that says nothing new is soon forgotten. One that argues something is remembered, praised or attacked. What will yours stand for?"
 kehillah_sefer.0200.tt_1:0 "The authority of the Oral Torah."
 kehillah_sefer.0200.tt_2:0 "Scripture alone, read by reason."
 kehillah_sefer.0200.tt_3:0 "Torah and philosophy as one wisdom."
 kehillah_sefer.0200.tt_4:0 "The faith of the fathers, above speculation."
 kehillah_sefer.0200.tt_5:0 "The law set down plainly, as rulings."
 kehillah_sefer.0200.tt_6:0 "The law learned through argument."
 kehillah_sefer.0200.tt_7:0 "The authority of the great academies."
 kehillah_sefer.0200.tt_8:0 "The custom of our fathers."
 kehillah_sefer.0200.tt_9:0 "The mourning for Zion."
 kehillah_sefer.0200.tt_10:0 "The hidden Torah."
 kehillah_sefer.0200.tt_11:0 "Piety beyond the letter of the law."
 kehillah_sefer.0200.tt_12:0 "The sanctification of the Name."
 kehillah_sefer.0200.none:0 "It will take no side."
 kehillah_sefer.0200.none.tt:0 "A book that argues for no tenet can rise to $KEHILLAH_STANDING_8$ in any rite."
 kehillah_sefer.0202.t:0 "A Gloss, or a Work of My Own?"
 kehillah_sefer.0202.desc:0 "The greatest books are those others write about. I could set down my glosses on a work I have mastered, and raise it with my own; or I could write something wholly mine."
 kehillah_sefer.0202.own:0 "A work of my own."
 kehillah_sefer.0202.gloss_halakhot_gedolot:0 "Glosses on $kehillah_lib_name_work_halakhot_gedolot$."
 kehillah_sefer.0202.gloss_emunot_vedeot:0 "Glosses on $kehillah_lib_name_work_emunot_vedeot$."
 kehillah_sefer.0202.gloss_kuzari:0 "Glosses on $kehillah_lib_name_work_kuzari$."
 kehillah_sefer.0202.gloss_sefer_yetzirah:0 "Glosses on $kehillah_lib_name_work_sefer_yetzirah$."
 kehillah_sefer.0202.gloss_rashi_talmud:0 "Glosses on $kehillah_lib_name_work_rashi_talmud$."
 kehillah_sefer.0202.gloss_hilkhot_harif:0 "Glosses on $kehillah_lib_name_work_hilkhot_harif$."
 kehillah_sefer.0202.gloss_mishneh_torah:0 "Glosses on $kehillah_lib_name_work_mishneh_torah$."
 kehillah_sefer.0202.gloss_moreh_nevukhim:0 "Glosses on $kehillah_lib_name_work_moreh_nevukhim$."
 kehillah_sefer.0202.gloss_sefer_habahir:0 "Glosses on $kehillah_lib_name_work_sefer_habahir$."
 kehillah_sefer.0202.gloss_tosafot:0 "Glosses on $kehillah_lib_name_work_tosafot$."
 kehillah_sefer.0202.gloss_zohar:0 "Glosses on $kehillah_lib_name_work_zohar$."
 kehillah_sefer.0202.gloss_latest:0 "Glosses on a new book I have read."

 # ---- Events: approbation, judgement --------------------------------
 kehillah_sefer.0301.t:0 "A Request for an Approbation"
 kehillah_sefer.0301.desc:0 "[kehillah_appr_asker.GetTitledFirstName] has sent me #EMP [kehillah_appr_asker.Custom('KehillahSeferLatestWorkName')]#! and asks for my approbation, a few lines in my hand to stand at the front of every copy."
 kehillah_sefer.0301.a:0 "It deserves it. I will write."
 kehillah_sefer.0301.a.tt:0 "My approbation raises the book's standing in my rite."
 kehillah_sefer.0301.b:0 "I cannot put my name to this."
 kehillah_sefer.0400.t:0 "Books Before the Rite"
 kehillah_sefer.0400.desc:0 "As one whose word the rite heeds, I am asked to pronounce on the books our scholars read. Which shall I judge?"
 kehillah_sefer.0400.a:0 "$KEHILLAH_SEFER_CAND_1$"
 kehillah_sefer.0400.b:0 "$KEHILLAH_SEFER_CAND_2$"
 kehillah_sefer.0400.c:0 "$KEHILLAH_SEFER_CAND_3$"
 KEHILLAH_SEFER_CAND_1:0 "[ROOT.Char.Custom('KehillahSeferCand1Name')]"
 KEHILLAH_SEFER_CAND_2:0 "[ROOT.Char.Custom('KehillahSeferCand2Name')]"
 KEHILLAH_SEFER_CAND_3:0 "[ROOT.Char.Custom('KehillahSeferCand3Name')]"
 kehillah_sefer.0400.none:0 "None of them, today."
 kehillah_sefer.0401.t:0 "Judgement"
 kehillah_sefer.0401.desc:0 "#EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! lies open before me. My judgement will be read in every community of the rite."
 kehillah_sefer.0401.a:0 "I endorse it."
 kehillah_sefer.0401.a.tt:0 "The rite's endorsement opens its way toward Authoritative."
 kehillah_sefer.0401.b:0 "I condemn it."
 kehillah_sefer.0401.b.tt:0 "The book falls in the rite's esteem. If others have praised it, a controversy may follow."
 kehillah_sefer.0401.c:0 "I leave it to the scholars."

 # ---- Events: ransom, the great teacher ----------------------------
 kehillah_sefer.0500.t:0 "Books Redeemed"
 kehillah_sefer.0500.desc:0 "The money has been paid, and a seized book has come home to a Jewish shelf: #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#!. To ransom a book is a mitzvah only a little less than ransoming a captive."
 kehillah_sefer.0500.a:0 "Welcome home."
 kehillah_sefer.0600.t:0 "An Invitation"
 kehillah_sefer.0600.desc:0 "[kehillah_patron.GetTitledFirstName] asks me to come to his lands and head a yeshiva he will found there. He offers a hall, a library and his protection."
 kehillah_sefer.0600.a:0 "I will come."
 kehillah_sefer.0600.a.tt:0 "I join his court and head the new yeshiva."
 kehillah_sefer.0600.b:0 "My place is here."
 kehillah_sefer.0601.t:0 "Invitation Declined"
 kehillah_sefer.0601.desc:0 "The teacher I invited will not leave his students. The hall stands ready for another."
 kehillah_sefer.0601.a:0 "We will find another."

 # ---- Book chain: named works (Daniel's decision 2) ------------------
