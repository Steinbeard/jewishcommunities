 # ---- Events: the siyum ---------------------------------------------
 kehillah_sefer.0010.t:0 "A Siyum"
 kehillah_sefer.0010.desc.tanakh_1:0 "The last verse of Chronicles is read, and the scroll of the Torah, the Prophets and the Writings is complete in your mind once again. You have read it for its plain sense, word by word. The community gathers to celebrate the end, and to begin again."
 kehillah_sefer.0010.desc.tanakh_2:0 "Reading the whole of Scripture again, you heard what the plain words only hint at: a verse in Isaiah answering one in Genesis, a word repeated across books. The community gathers for the siyum."
 kehillah_sefer.0010.desc.tanakh_3:0 "This time you read Scripture with the midrash open beside it, and every verse became a sermon. The community gathers for the siyum, and asks you to speak."
 kehillah_sefer.0010.desc.tanakh_4:0 "On this round the text opened onto what is hidden in it. You keep most of what you saw to yourself. The community gathers for the siyum and sees only that you are moved."
 kehillah_sefer.0010.desc.talmud_1:0 "The last page of the last tractate is turned. You have been through the whole of it, order by order, and the community gathers to mark the end of a Shas, and its new beginning."
 kehillah_sefer.0010.desc.talmud_2:0 "You have gone through the Talmud again with the running commentary at your elbow, and passages that were closed are open now. The community gathers for the siyum."
 kehillah_sefer.0010.desc.talmud_3:0 "With the Tosafot beside you, every page of this round reached into others: a contradiction here, its answer three tractates away. The community gathers for the siyum."
 kehillah_sefer.0010.desc.talmud_4:0 "On this round the questions were your own. Your margins are full of them, and some of the answers too. The community gathers for the siyum and asks what you found."
 kehillah_sefer.0010.a:0 "And now, from the beginning."

 # ---- Events: a sealed library --------------------------------------
 kehillah_sefer.0020.t:0 "The Jews' Books"
 kehillah_sefer.0020.desc:0 "Among the holdings now ours is a Jewish house of study, its cupboards full of books in Hebrew. The Jews who used it ask that it be left alone. Others have offered to buy the books, and a cleric of my household says some of them are worth reading."
 kehillah_sefer.0020.a:0 "Lock the doors and leave it be."
 kehillah_sefer.0020.b:0 "Sell the books to the Jews."
 kehillah_sefer.0020.b.tt:0 "The books are carried off. Any Jewish library may buy them back."
 kehillah_sefer.0020.c:0 "Give them to a learned cleric."
 kehillah_sefer.0020.c.tt:0 "The books leave Jewish hands for good."
 kehillah_sefer.0020.d:0 "Burn them."
 kehillah_sefer.0020.d.tt:0 "The books are destroyed, and the Church will hear of it."

 # ---- Events: Machloket ----------------------------------------------
 kehillah_sefer.0101.t:0 "Glosses Against a Book"
 kehillah_sefer.0101.desc:0 "Letters are passing between the communities of our rite. Scholars have written glosses against #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#!, and its admirers are answering them. A controversy is beginning."
 kehillah_sefer.0101.a:0 "This will not end quietly."
 kehillah_sefer.0102.t:0 "The Letters"
 kehillah_sefer.0102.desc:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! has reached our door. Both sides have written asking us to sign their letters. Whatever we decide, our name will be read in every community of the rite."
 kehillah_sefer.0102.a:0 "We stand with the book."
 kehillah_sefer.0102.a.tt:0 "Our name and our scholars' weight are added to its defence."
 kehillah_sefer.0102.b:0 "We condemn it."
 kehillah_sefer.0102.b.tt:0 "Our name and our scholars' weight are added to its condemnation."
 kehillah_sefer.0102.c:0 "We sign nothing."
 kehillah_sefer.0102.c.tt:0 "We stay out of it."
 kehillah_sefer.0103.t:0 "The Controversy Ends"
 kehillah_sefer.0103.desc.defended:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! is over. Its defenders carried the rite with them, and the book is read more widely than before."
 kehillah_sefer.0103.desc.condemned:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! is over. Its critics carried the rite, and the book has fallen in esteem."
 kehillah_sefer.0103.desc.banned:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! is over. Its critics overwhelmed its defenders, and the book has been placed under a ban."
 kehillah_sefer.0103.desc.synthesis:0 "The quarrel over #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! has ended without a victor. A scholar wrote a reconciling commentary that both sides could accept, and the dispute has left the rite richer than it found it."
 kehillah_sefer.0103.a:0 "So it ends."
 kehillah_sefer.0104.t:0 "Our Own Way"
 kehillah_sefer.0104.desc:0 "The rite has turned against #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#!, yet many stood with me in its defence. They look to me now. We could submit, or we could set down our own rite, in which the truth this book teaches is held as a pillar of faith."
 kehillah_sefer.0104.a:0 "We will found our own rite."
 kehillah_sefer.0104.a.tt:0 "A new rite is founded, holding as a core tenet what the book argues."
 kehillah_sefer.0104.b:0 "We submit, for the sake of peace."

 # ---- Events: what a book argues ------------------------------------
 kehillah_sefer.0200.t:0 "What the Book Argues"
 kehillah_sefer.0200.desc:0 "A book that says nothing new is soon forgotten. One that argues something is remembered, praised or attacked. What will yours stand for?"
 kehillah_sefer.0200.tt_1:0 "The authority of the Oral Torah."
 kehillah_sefer.0200.tt_2:0 "Scripture alone, read by reason."
 kehillah_sefer.0200.tt_3:0 "Torah and philosophy as one wisdom."
 kehillah_sefer.0200.tt_4:0 "The faith of the fathers, above speculation."
 kehillah_sefer.0200.tt_5:0 "The law set down plainly, as rulings."
 kehillah_sefer.0200.tt_6:0 "The law learned through argument."
 kehillah_sefer.0200.tt_7:0 "The authority of the great academies."
 kehillah_sefer.0200.tt_8:0 "The custom of our fathers."
 kehillah_sefer.0200.tt_9:0 "The mourning for Zion."
 kehillah_sefer.0200.tt_10:0 "The hidden Torah."
 kehillah_sefer.0200.tt_11:0 "Piety beyond the letter of the law."
 kehillah_sefer.0200.tt_12:0 "The sanctification of the Name."
 kehillah_sefer.0200.none:0 "It will take no side."
 kehillah_sefer.0200.none.tt:0 "A book that argues for no tenet can rise to Venerated in any rite."
 kehillah_sefer.0202.t:0 "A Gloss, or a Work of My Own?"
 kehillah_sefer.0202.desc:0 "The greatest books are those others write about. I could set down my glosses on a work I have mastered, and raise it with my own; or I could write something wholly mine."
 kehillah_sefer.0202.own:0 "A work of my own."
 kehillah_sefer.0202.gloss_halakhot_gedolot:0 "Glosses on $kehillah_lib_name_work_halakhot_gedolot$."
 kehillah_sefer.0202.gloss_emunot_vedeot:0 "Glosses on $kehillah_lib_name_work_emunot_vedeot$."
 kehillah_sefer.0202.gloss_kuzari:0 "Glosses on $kehillah_lib_name_work_kuzari$."
 kehillah_sefer.0202.gloss_sefer_yetzirah:0 "Glosses on $kehillah_lib_name_work_sefer_yetzirah$."
 kehillah_sefer.0202.gloss_rashi_talmud:0 "Glosses on $kehillah_lib_name_work_rashi_talmud$."
 kehillah_sefer.0202.gloss_hilkhot_harif:0 "Glosses on $kehillah_lib_name_work_hilkhot_harif$."
 kehillah_sefer.0202.gloss_mishneh_torah:0 "Glosses on $kehillah_lib_name_work_mishneh_torah$."
 kehillah_sefer.0202.gloss_moreh_nevukhim:0 "Glosses on $kehillah_lib_name_work_moreh_nevukhim$."
 kehillah_sefer.0202.gloss_sefer_habahir:0 "Glosses on $kehillah_lib_name_work_sefer_habahir$."
 kehillah_sefer.0202.gloss_tosafot:0 "Glosses on $kehillah_lib_name_work_tosafot$."
 kehillah_sefer.0202.gloss_zohar:0 "Glosses on $kehillah_lib_name_work_zohar$."
 kehillah_sefer.0202.gloss_latest:0 "Glosses on a new book I have read."

 # ---- Events: approbation, judgement --------------------------------
 kehillah_sefer.0301.t:0 "A Request for an Approbation"
 kehillah_sefer.0301.desc:0 "[kehillah_appr_asker.GetTitledFirstName] has sent me #EMP [kehillah_appr_asker.Custom('KehillahSeferLatestWorkName')]#! and asks for my approbation, a few lines in my hand to stand at the front of every copy."
 kehillah_sefer.0301.a:0 "It deserves it. I will write."
 kehillah_sefer.0301.a.tt:0 "My approbation raises the book's standing in my rite."
 kehillah_sefer.0301.b:0 "I cannot put my name to this."
 kehillah_sefer.0400.t:0 "Books Before the Rite"
 kehillah_sefer.0400.desc:0 "As one whose word the rite heeds, I am asked to pronounce on the books our scholars read. Which shall I judge?"
 kehillah_sefer.0400.a:0 "$KEHILLAH_SEFER_CAND_1$"
 kehillah_sefer.0400.b:0 "$KEHILLAH_SEFER_CAND_2$"
 kehillah_sefer.0400.c:0 "$KEHILLAH_SEFER_CAND_3$"
 KEHILLAH_SEFER_CAND_1:0 "[ROOT.Char.Custom('KehillahSeferCand1Name')]"
 KEHILLAH_SEFER_CAND_2:0 "[ROOT.Char.Custom('KehillahSeferCand2Name')]"
 KEHILLAH_SEFER_CAND_3:0 "[ROOT.Char.Custom('KehillahSeferCand3Name')]"
 kehillah_sefer.0400.none:0 "None of them, today."
 kehillah_sefer.0401.t:0 "Judgement"
 kehillah_sefer.0401.desc:0 "#EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#! lies open before me. My judgement will be read in every community of the rite."
 kehillah_sefer.0401.a:0 "I endorse it."
 kehillah_sefer.0401.a.tt:0 "The rite's endorsement opens its way toward Authoritative."
 kehillah_sefer.0401.b:0 "I condemn it."
 kehillah_sefer.0401.b.tt:0 "The book falls in the rite's esteem. If others have praised it, a controversy may follow."
 kehillah_sefer.0401.c:0 "I leave it to the scholars."

 # ---- Events: ransom, the great teacher ----------------------------
 kehillah_sefer.0500.t:0 "Books Redeemed"
 kehillah_sefer.0500.desc:0 "The money has been paid, and a seized book has come home to a Jewish shelf: #EMP [ROOT.Char.Custom('KehillahSeferWorkName')]#!. To ransom a book is a mitzvah only a little less than ransoming a captive."
 kehillah_sefer.0500.a:0 "Welcome home."
 kehillah_sefer.0600.t:0 "An Invitation"
 kehillah_sefer.0600.desc:0 "[kehillah_patron.GetTitledFirstName] asks me to come to his lands and head a yeshiva he will found there. He offers a hall, a library and his protection."
 kehillah_sefer.0600.a:0 "I will come."
 kehillah_sefer.0600.a.tt:0 "I join his court and head the new yeshiva."
 kehillah_sefer.0600.b:0 "My place is here."
 kehillah_sefer.0601.t:0 "Invitation Declined"
 kehillah_sefer.0601.desc:0 "The teacher I invited will not leave his students. The hall stands ready for another."
 kehillah_sefer.0601.a:0 "We will find another."

 # ---- Book chain: named works (Daniel's decision 2) ------------------
 kehillah_book.0001.named_rashi_torah:0 "A commentary on the whole Torah, verse by verse."
 kehillah_book.0001.named_rashi_torah.tt:0 "#EMP An ambition:#! this book can enter history as #EMP $kehillah_lib_name_work_rashi_torah$#!."
 kehillah_book.0001.named_rashi_talmud:0 "A running commentary on the whole Talmud."
 kehillah_book.0001.named_rashi_talmud.tt:0 "#EMP An ambition:#! this book can enter history as #EMP $kehillah_lib_name_work_rashi_talmud$#!."
 kehillah_book.0001.named_rif:0 "The Talmud's law, without its debates."
 kehillah_book.0001.named_rif.tt:0 "#EMP An ambition:#! this book can enter history as #EMP $kehillah_lib_name_work_hilkhot_harif$#!."
 kehillah_book.0001.named_tosafot:0 "Glosses that read the Talmud as one argument."
 kehillah_book.0001.named_tosafot.tt:0 "#EMP An ambition:#! this book can enter history as #EMP $kehillah_lib_name_work_tosafot$#!."
 kehillah_book.0001.named_kuzari:0 "A dialogue in defence of the despised faith."
