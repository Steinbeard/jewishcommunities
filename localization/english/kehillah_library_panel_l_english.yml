 ### =====================================================================
 ### DONATING A WORK (events/kehillah_library_events.txt, the panel's
 ### per-row donate button). ADDED 2026-09-18.
 ### =====================================================================
 KEHILLAH_LIB_DONATE_ACTION:0 "Donate a copy..."
 KEHILLAH_LIB_DONATE_TT:0 "#T Propose a donation#!\nOpen a confirmation before a copy leaves the collection. A community that lacks it can receive the work for #high [GetPlayer.MakeScope.ScriptValue( 'kehillah_donate_work_piety' )|0] Piety#!, or it can be sent farther away for #high [GetPlayer.MakeScope.ScriptValue( 'kehillah_donate_work_abroad_piety' )|0] Piety#!. #weak You may keep the work when the confirmation opens.#!"
 kehillah_library.0001.t:0 "A Gift of Learning"
 kehillah_library.0001.desc_intro:0 "A work from the community's Beit Midrash lies before me, and the thought will not leave: there are houses of study where no one has ever read it.\n\n"
 kehillah_library.0001.desc_recipient:0 "\n\nThe [kehillah_donate_recipient.GetNameNoTooltip] holds no copy. A gift there would be read, and remembered."
 kehillah_library.0001.desc_no_recipient:0 "\n\nEvery community I know of already keeps a copy. If it is to go anywhere, it must travel far to a yeshiva beyond the communities I can name."
 kehillah_library.0001.a:0 "Send it to the [kehillah_donate_recipient.GetNameNoTooltip]."
 kehillah_library.0001.a.tt:0 "The work leaves our library and enters theirs."
 kehillah_library.0001.b:0 "Send it to a yeshiva far away."
 kehillah_library.0001.b.tt:0 "The work leaves our library."
 kehillah_library.0001.c:0 "Keep it. Our own students need it."

