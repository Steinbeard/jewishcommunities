 kehillah_lib_tt_work_targum_onkelos:0 "#T $kehillah_lib_name_work_targum_onkelos$#!\n#weak $KEHILLAH_LIB_TRACK_PARSHANUT$#!\n\n$kehillah_lib_desc_work_targum_onkelos$"

