 ### =====================================================================
 ### THE COMMUNITY LIBRARY PANEL (gui/kehillah_domicile_library.gui,
 ### docs/spec/v13-domicile-library-panel.md). Datacontext: the viewed
 ### domicile's owner (Character) and their primary title (Title).
 ###
 ### THE LIST IS DYNAMIC: the panel iterates the title's
 ### kehillah_library_works flags and looks every key up by flag name.
 ### TO ADD A BOOK, add three lines here for its flag --
 ###   kehillah_lib_name_<flag>      the title, as shown in the list
 ###   kehillah_lib_subject_<flag>   its subject, shown in-line ($KEHILLAH_LIB_TRACK_*$)
 ###   kehillah_lib_tt_<flag>        the hover: title, subject, description
 ### -- and add the flag to a community's list in script. Nothing in the
 ### .gui changes. Please keep the $kehillah_lib_desc_<flag>$ pattern so
 ### the description is reusable elsewhere (events, decisions).
 ### =====================================================================
 KEHILLAH_LIB_HEADER:0 "Library of [Title.GetNameNoTooltip]"
 KEHILLAH_LIB_SUBHEADER:0 "The Beit Midrash holds #high [GetDataModelSize( Title.MakeScope.GetList( 'kehillah_library_works' ) )]#! works."
 KEHILLAH_LIB_EMPTY:0 "The Beit Midrash holds no works yet. #weak Commission a copy, or travel to a community that holds what you seek.#!"
 KEHILLAH_LIB_NO_BEIT_MIDRASH:0 "[Title.GetNameNoTooltip] has no Beit Midrash. #weak A community keeps its books in its house of study; without one there is no library to show.#!"
 KEHILLAH_MAP_VIEW_LIBRARY_TOOLTIP:0 "#T Library#!\nWhat this community's Beit Midrash holds -- shown beside this roster. #weak Knowing who holds the work you lack is what the Learn Torah journey is for.#!"
 KEHILLAH_LIB_TT_STUDIED:0 "\n\n#P You have mastered this work.#!"
 KEHILLAH_LIB_TT_UNSTUDIED:0 "\n\n#weak You have not mastered this work.#!"
 KEHILLAH_LIB_STUDIED_LABEL:0 "You have mastered:"
 KEHILLAH_LIB_STUDIED_TT:0 "#T Mastered#!\nWorks you have studied through, here or on your travels. Returning to one teaches far less than the first time."
 ### Shown in the Beit Midrash building tooltip (the parameter line).
 domicile_building_parameter_kehillah_holds_library:0 "Holds the community library, shown beneath this view"
