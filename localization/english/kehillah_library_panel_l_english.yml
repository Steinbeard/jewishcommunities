 ### The selected card shows text distinct from the short work description.
 ### Verified excerpts are introduced per work; other cards retain a catalog
 ### note until an edition and passage are chosen. The short desc keys remain
 ### available to event text.
 kehillah_lib_detail_work_targum_onkelos:0 "This Aramaic rendering follows the Torah's Hebrew closely, yet sometimes interprets where a literal translation would leave a question open. It took shape across the early rabbinic centuries and became a familiar companion to Torah reading."
 kehillah_lib_detail_work_mekhilta:0 "This early school collection follows verses of Exodus and turns the narrative into arguments about commandments and their application. Its teachings preserve a third-century strand of rabbinic interpretation associated with the school of Rabbi Yishmael."
 kehillah_lib_detail_work_genesis_rabbah:0 "This late antique Palestinian midrash follows Genesis from creation through the patriarchs. Its stories and interpretations invite discussion of each passage more often than a single legal ruling."
 kehillah_lib_detail_work_pirkei_derabbi_eliezer:0 "This early medieval narrative midrash retells biblical history with expanded episodes that travel well beyond the biblical verses. Its traditional attribution to Rabbi Eliezer should not be mistaken for a single known author."
 kehillah_lib_detail_work_mishnah:0 "Edited in Roman Palestine around the beginning of the third century, the Mishnah arranges the teachings of the tannaitic sages by subject. Its six orders give later schools a common text for law, argument, and ethical instruction.\n\n#tooltip:KEHILLAH_LIB_REF_AVOT #E Mishnah, Avot 1:1#!#!"
 KEHILLAH_LIB_REF_AVOT:0 "#T Mishnah, Avot 1:1#!\nBe deliberate in judgment, raise many students, and make a fence for the Torah.\n#weak Our translation of the Hebrew text.#!"
 kehillah_lib_detail_work_halakhot_gedolot:0 "This Geonic collection arranges Talmudic law into practical topics, offering a route from extended debate toward organized rulings. It is useful to a judge who needs a decision as well as an argument."
 kehillah_lib_detail_work_sefer_yetzirah:0 "This short, early speculative work links creation to Hebrew letters and numbers. Its terse language leaves later readers to debate both its date and how literally to understand it."
 kehillah_lib_detail_work_emunot_vedeot:0 "Saadia Gaon wrote this tenth-century work to defend Jewish belief through reasoned argument. Its subjects include creation, revelation, human choice, and the relation between inherited teaching and philosophy."
 kehillah_lib_detail_work_chovot_halevavot:0 "Bahya ibn Paquda's Andalusian ethical work asks what intention and trust in God add to outward observance. Written in the later eleventh century, it moves from public duties toward the inward life of the worshipper."
 kehillah_lib_detail_work_kuzari:0 "Judah Halevi's twelfth-century dialogue is framed as a conversation with the king of the Khazars. It tests arguments for Jewish faith against rival religious and philosophical claims."
 kehillah_lib_detail_work_bavli_zeraim:0 "In the Babylonian Talmud, Zeraim survives chiefly through Berakhot, a tractate on blessings and daily prayer. Its opening argument begins with the evening recitation of the Shema and asks why study starts there.\n\n#tooltip:KEHILLAH_LIB_REF_BERAKHOT #E Babylonian Talmud, Berakhot 2a#!#!"
 KEHILLAH_LIB_REF_BERAKHOT:0 "#T Babylonian Talmud, Berakhot 2a#!\nFrom when do we recite the Shema in the evening? Why begin with evening rather than morning?\n#weak Our abridged translation of the Aramaic and Hebrew text.#!"
 kehillah_lib_detail_work_bavli_moed:0 "The Bavli's order Moed debates Sabbath labor, festivals, fasts, and the calendar that structures communal time. Its late antique discussions build on the earlier Mishnah, so the same rule can lead to several competing explanations."
 kehillah_lib_detail_work_bavli_nashim:0 "The Bavli's order Nashim examines marriage contracts, vows, and divorce. These late antique arguments are directly relevant to questions a medieval household might bring before a Bet Din."
 kehillah_lib_detail_work_bavli_nezikin:0 "The Bavli's order Nezikin gathers disputes about damage, property, witnesses, and courts. Its long late antique debates give a judge competing lines of legal reasoning rather than a bare list of verdicts."
 kehillah_lib_detail_work_bavli_kodashim:0 "The Bavli's order Kodashim preserves detailed late antique argument about offerings and sacred service in the absent Temple. Study keeps a legal vocabulary alive even where the rites cannot be performed."
 kehillah_lib_detail_work_bavli_tahorot:0 "The Bavli's surviving discussion of Tahorot is sparse beside other orders; Niddah is its sustained tractate on ritual purity. A scholar studies this late antique argument with the much broader Mishnaic order in view."
 kehillah_lib_detail_work_yerushalmi_zeraim:0 "The Palestinian Talmud gives agricultural obligations in the Land of Israel much fuller discussion than the Bavli does. Its Galilean debates preserve a distinct late antique route through the Mishnah's order Zeraim."
 kehillah_lib_detail_work_yerushalmi_moed:0 "The Palestinian Talmud's order Moed examines Sabbaths and festivals through the academies of late antique Galilee. Its compact arguments offer another line of interpretation beside Babylonian debates on the same Mishnah."
 kehillah_lib_detail_work_yerushalmi_nashim:0 "The Galilean academies examined family law and vows through traditions that do not always match the Bavli's route. Their late antique order Nashim gives a scholar another inherited line of argument about marriage and obligation."
 kehillah_lib_detail_work_yerushalmi_nezikin:0 "The Palestinian Talmud's order Nezikin addresses damages and civil procedure in compact Galilean debates. For a medieval court, it offers a second inherited vocabulary alongside the fuller Bavli discussions."
 kehillah_lib_detail_work_hekhalot_rabbati:0 "This layered visionary tradition describes heavenly palaces, angelic gates, and the dangers of ascent. Its late antique and early medieval materials do not speak in one author's voice."
 kehillah_lib_detail_work_shiur_qomah:0 "This difficult visionary text uses startling imagery to speak about the divine form. In the late antique and early medieval tradition, its language made the limits of human description a subject of argument."
 kehillah_lib_detail_work_sefer_harazim:0 "This unusual late antique cosmological manual orders angelic powers by heaven and their attributed tasks. Its specialized material belongs to a different line of reading from the legal debates of the academies."

