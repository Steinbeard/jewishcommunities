 ### =====================================================================
 ### THE COMMUNITY LIBRARY PANEL (gui/kehillah_domicile_library.gui,
 ### docs/spec/v13-domicile-library-panel.md). Datacontext: the viewed
 ### domicile's owner (Character), their primary title (Title), and the
 ### selected Beit Midrash slot (DomicileBuildingSlot).
 ###
 ### THE LIST IS DYNAMIC: the panel iterates the title's
 ### kehillah_library_works flags and looks every key up by flag name.
 ### TO ADD A BOOK, add three lines here for its flag --
 ###   kehillah_lib_name_<flag>      the title, as shown in the list
 ###   kehillah_lib_subject_<flag>   its subject, shown in-line ($KEHILLAH_LIB_TRACK_*$)
 ###   kehillah_lib_tt_<flag>        the hover: title, subject, description
 ### -- and add the flag to a community's list in script. Nothing in the
 ### .gui changes. Please keep the $kehillah_lib_desc_<flag>$ pattern so
 ### the description is reusable elsewhere (events, decisions).
 ### =====================================================================
 KEHILLAH_LIB_HEADER:0 "The Library of [Title.GetNameNoTooltip]"
 KEHILLAH_LIB_SUBHEADER:0 "The [DomicileBuildingSlot.GetName] holds #high [GetDataModelSize( Title.MakeScope.GetList( 'kehillah_library_works' ) )]#! works. #weak Hover a work for what it is.#!"
 KEHILLAH_LIB_EMPTY:0 "The [DomicileBuildingSlot.GetName] holds no works yet. #weak Commission a copy, or travel to a community that holds what you seek.#!"
 KEHILLAH_LIB_STUDIED_LABEL:0 "You have studied:"
 KEHILLAH_LIB_STUDIED_TT:0 "#T Studied#!\nWorks you have read yourself, here or on your travels. Reading one again teaches far less than the first time."
 ### Shown in the Beit Midrash building tooltip (the parameter line).
 domicile_building_parameter_kehillah_holds_library:0 "Holds the community library -- select the building to see its works"
 KEHILLAH_LIB_TRACK_PARSHANUT:0 "Parshanut"
 KEHILLAH_LIB_TRACK_TALMUDICS:0 "Talmudics"
 KEHILLAH_LIB_TRACK_HASHKAFA:0 "Hashkafa"

 ### The works. Three lines each, keyed by flag name.

