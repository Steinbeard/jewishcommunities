l_english:
 kehillah_bet_din.0661.t:0 "The Holiday Wine Scandal"
 kehillah_bet_din.0661.desc:0 "[kbd_litigant_a.GetFirstName] sold wine for the festival and says every jar remained under proper care. [kbd_litigant_b.GetFirstName] says an unauthorized handler opened several jars at the dock. No one marked which ones. The court must protect the meal without ruining sound stock on rumor."
 kehillah_bet_din.0661.a:0 "Release every jar for festival use."
 kehillah_bet_din.0661.a.tt:0 "Families get wine promptly, but proven handling could make the approval unsound."
 kehillah_bet_din.0661.b:0 "Separate the jars and hear dock witnesses."
 kehillah_bet_din.0661.b.tt:0 "Inspection and substitution cost time and supplies."
 kehillah_bet_din.0661.c:0 "Reject the whole shipment."
 kehillah_bet_din.0661.c.tt:0 "Caution is simple, but sound jars would be wasted."
 kehillah_din_source_66:0 "Cite a mastered Moed work and examine the evidence."
 kehillah_din_source_66_tt:0 "Mishnah Pesachim 2:1 gives the judges a textual point of reference. It cannot establish which jars were opened."
 kehillah_din_combo_66:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_66_tt:0 "The judges preserve both parties' interests while checking which jars were opened."
 kehillah_bet_din.0664.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0664.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0664.outcome_1:0 "The court releases the shipment."
 kehillah_bet_din.0664.outcome_2:0 "The court separates jars by dock record and asks witnesses what they saw."
 kehillah_bet_din.0664.outcome_3:0 "The court rejects every jar in the shipment."
 kehillah_bet_din.0664.fact_true:0 "Dock testimony identifies opened jars. Unqualified approval ignored a real concern."
 kehillah_bet_din.0664.fact_false:0 "The seals and witnesses show the shipment stayed closed. Rejection wasted usable wine."
 kehillah_bet_din.0664.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0664.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0664.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case66_one_tt:0 "The immediate ruling costs 8 Greatness and carries the larger fact risk."
 kehillah_din_case66_two_tt:0 "Inquiry costs 4 Greatness while the court keeps the issue open."
 kehillah_din_case66_three_tt:0 "The quick final settlement costs 2 Greatness but may be overbroad."
 kehillah_bet_din_case66_great_log_title:0 "The Holiday Wine Scandal: a well-supported ruling"
 kehillah_bet_din_case66_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the holiday wine scandal dispute."
