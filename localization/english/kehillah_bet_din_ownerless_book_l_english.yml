l_english:
 kehillah_bet_din.0731.t:0 "The Ownerless Prayer Book"
 kehillah_bet_din.0731.desc:0 "[kbd_litigant_a.GetFirstName] cares for a prayer manuscript recovered from a ruined house and wants it placed in the synagogue. [kbd_litigant_b.GetFirstName] says a displaced family may still own it. A faint mark appears inside the cover; no one has read it. The book should be kept safe while ownership is sought."
 kehillah_bet_din.0731.a:0 "Enter the book into communal property now."
 kehillah_bet_din.0731.a.tt:0 "Worshippers gain a book, but a readable owner mark could make that a taking."
 kehillah_bet_din.0731.b:0 "Preserve it and search for the marked owner."
 kehillah_bet_din.0731.b.tt:0 "The court protects the manuscript while tracing its owner."
 kehillah_bet_din.0731.c:0 "Give it to the claimant without checking the mark."
 kehillah_bet_din.0731.c.tt:0 "A false claimant could receive a valuable book."
 kehillah_din_source_73:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_73_tt:0 "Mishnah Bava Metzia 2:2 gives the judges a textual point of reference. It cannot establish the manuscript's owner mark."
 kehillah_din_combo_73:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_73_tt:0 "The judges preserve both parties' interests while checking the manuscript's owner mark."
 kehillah_bet_din.0734.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0734.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0734.outcome_1:0 "The court catalogs the manuscript as synagogue property."
 kehillah_bet_din.0734.outcome_2:0 "The court protects the book and asks a scribe to read its mark."
 kehillah_bet_din.0734.outcome_3:0 "The court hands the book to the claimant."
 kehillah_bet_din.0734.fact_true:0 "The mark names a displaced family's owner. Immediate communal claim would have erased that right."
 kehillah_bet_din.0734.fact_false:0 "The mark belongs to an unrelated former copyist. Unchecked delivery would give the book to the wrong person."
 kehillah_bet_din.0734.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0734.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0734.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case73_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case73_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case73_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_bet_din_case73_great_log_title:0 "The Ownerless Prayer Book: a well-supported ruling"
 kehillah_bet_din_case73_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the ownerless prayer book dispute."
 kehillah_bet_din_case73_good_log_title:0 "The Ownerless Prayer Book: a workable ruling"
 kehillah_bet_din_case73_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the ownerless prayer book dispute."
 kehillah_bet_din_case73_poor_log_title:0 "The Ownerless Prayer Book: a disputed ruling"
 kehillah_bet_din_case73_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the ownerless prayer book dispute."
