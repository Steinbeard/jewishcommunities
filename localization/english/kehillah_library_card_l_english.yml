 ### The county view's Jewish cards (2026-11-08, Daniel): the community
 ### card's Library button and yeshiva line, and the Beit Midrash card.
 ### docs/implementation/2026-11-08-library-cards.md.

 KEHILLAH_CARD_LIBRARY_SHORT:0 "Library"
