l_english:
 kehillah_minhag_bavel_rite:0 "Minhag Bavli"
 kehillah_minhag_bavel_rite_adj:0 "Minhag Bavli"
 kehillah_minhag_bavel_rite_adherent:0 "Bavli Jew"
 kehillah_minhag_bavel_rite_adherent_plural:0 "Bavli Jews"
 kehillah_minhag_bavel_rite_desc:0 "The Babylonian Rabbinic tradition looks to the Talmud and the learning preserved by the Geonic academies. Its scholars compare inherited judgments, answer questions from distant congregations, and regard disciplined study as a service to the covenant."

 kehillah_minhag_sepharad_rite:0 "Minhag Sepharad"
 kehillah_minhag_sepharad_rite_adj:0 "Minhag Sepharad"
 kehillah_minhag_sepharad_rite_adherent:0 "Sephardi Jew"
 kehillah_minhag_sepharad_rite_adherent_plural:0 "Sephardi Jews"
 kehillah_minhag_sepharad_rite_desc:0 "The Rabbinic custom of Iberian Jewish congregations brings legal scholarship, liturgical poetry, and philosophical inquiry into a shared religious life. Its sages receive the Babylonian Talmud and Geonic teaching while cultivating their own interpretations and local usages."

 kehillah_minhag_yerushalmi_rite:0 "Minhag Yerushalmi"
 kehillah_minhag_yerushalmi_rite_adj:0 "Minhag Yerushalmi"
 kehillah_minhag_yerushalmi_rite_adherent:0 "Yerushalmi Jew"
 kehillah_minhag_yerushalmi_rite_adherent_plural:0 "Yerushalmi Jews"
 kehillah_minhag_yerushalmi_rite_desc:0 "The Rabbinic custom of the Land of Israel preserves the Jerusalem Talmud and distinctive forms of prayer and festival observance. Its congregations maintain their own scholarly leadership and an attachment to the holy places that extends beyond those who live nearby."
