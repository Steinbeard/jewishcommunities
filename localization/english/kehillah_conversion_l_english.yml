l_english:
 kehillah_host_demand_conversion_protected_tt:0 "The realm's law protects its Jews from forced conversion. They may be expelled, but not converted by force until Jewish settlement is #V Banned#!"
 kehillah_conversion.0002.t:0 "Leaving the Kehillah"
 kehillah_conversion.0002.desc.successor:0 "You have left Judaism, and someone outside the faith cannot rule on its law for the congregation. The elders met without you. [kehillah_conversion_successor.GetName] now leads [kehillah_conversion_community.GetNameNoTooltip].\n\nYou leave the Jewish Quarter and take to the road as a wayfarer."
 kehillah_conversion.0002.desc.dissolved:0 "You have left Judaism, and someone outside the faith cannot rule on its law for the congregation. No one is left to take your place, and the community dissolves.\n\nYou leave the Jewish Quarter and take to the road as a wayfarer."
 kehillah_conversion.0002.a:0 "So be it."
