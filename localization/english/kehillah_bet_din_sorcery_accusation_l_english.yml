l_english:
 kehillah_bet_din.01051.t:0 "The Accusation of Sorcery"
 kehillah_bet_din.01051.desc:0 "[kbd_litigant_a.GetFirstName] repeats a charge of sorcery against [kbd_litigant_b.GetFirstName] after a child fell ill. The only witness heard a strange phrase through a wall. Fear is spreading faster than testimony."
 kehillah_bet_din.01051.a:0 "Publicly condemn the accused."
 kehillah_bet_din.01051.a.tt:0 "An uncertain story could ruin an innocent neighbor."
 kehillah_bet_din.01051.b:0 "Protect the accused and examine the witness privately."
 kehillah_bet_din.01051.b.tt:0 "A careful hearing slows the rumor and protects the child."
 kehillah_bet_din.01051.c:0 "Punish the accuser for raising the matter."
 kehillah_bet_din.01051.c.tt:0 "A sincere witness may be silenced before being heard."
 kehillah_din_source_105:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_105_tt:0 "Mishnah Sanhedrin 3:6 gives the judges a textual point of reference. It cannot establish what the witness actually saw."
 kehillah_din_combo_105:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_105_tt:0 "The judges preserve both parties' interests while checking what the witness actually saw."
 kehillah_bet_din.01054.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01054.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01054.outcome_1:0 "The court announces guilt on the witness's report."
 kehillah_bet_din.01054.outcome_2:0 "The court hears the witness, checks the child's care, and bars harassment meanwhile."
 kehillah_bet_din.01054.outcome_3:0 "The accuser is punished without inquiry."
 kehillah_bet_din.01054.fact_true:0 "A rival supplied the witness's words. Public condemnation would turn coaching into judgment."
 kehillah_bet_din.01054.fact_false:0 "The witness describes a real threat, though not proof of sorcery. Punishment would silence useful testimony."
 kehillah_bet_din.01054.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01054.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01054.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case105_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case105_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case105_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_din_proposed_105_1:0 "The ruling proposed so far: $kehillah_bet_din.01051.a$"
 kehillah_din_proposed_105_2:0 "The ruling proposed so far: $kehillah_bet_din.01051.b$"
 kehillah_din_proposed_105_3:0 "The ruling proposed so far: $kehillah_bet_din.01051.c$"
 kehillah_bet_din_case105_great_log_title:0 "The Accusation of Sorcery: a well-supported ruling"
 kehillah_bet_din_case105_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the accusation of sorcery dispute."
 kehillah_bet_din_case105_good_log_title:0 "The Accusation of Sorcery: a workable ruling"
 kehillah_bet_din_case105_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the accusation of sorcery dispute."
