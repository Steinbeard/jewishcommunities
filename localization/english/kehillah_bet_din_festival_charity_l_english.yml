l_english:
 kehillah_bet_din.0751.t:0 "The Festival Charity Meal"
 kehillah_bet_din.0751.desc:0 "[kbd_litigant_a.GetFirstName] keeps a food fund and wants to buy splendid ritual furnishings before the festival. [kbd_litigant_b.GetFirstName] speaks for families expecting a communal meal from that money. The donor's note is short, and the market is already setting prices. Prestige and hunger both have voices in the room."
 kehillah_bet_din.0751.a:0 "Buy the furnishings from the food chest."
 kehillah_bet_din.0751.a.tt:0 "The festival gains splendor, but earmarked food may be lost."
 kehillah_bet_din.0751.b:0 "Feed families now and inspect the donor's note."
 kehillah_bet_din.0751.b.tt:0 "A meal and inquiry cost resources while preserving the donor's intent."
 kehillah_bet_din.0751.c:0 "Cancel all purchases and hoard the fund."
 kehillah_bet_din.0751.c.tt:0 "If the gift was flexible, hoarding it serves neither hunger nor worship."
 kehillah_din_source_75:0 "Cite a mastered Zeraim work and examine the evidence."
 kehillah_din_source_75_tt:0 "Mishnah Peah 8:7 gives the judges a textual point of reference. It cannot establish the donor's actual designation."
 kehillah_din_combo_75:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_75_tt:0 "The judges preserve both parties' interests while checking the donor's actual designation."
 kehillah_bet_din.0754.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0754.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0754.outcome_1:0 "The court authorizes the furnishings."
 kehillah_bet_din.0754.outcome_2:0 "The court provides a modest meal and reads the donor's note."
 kehillah_bet_din.0754.outcome_3:0 "The court closes the fund for the season."
 kehillah_bet_din.0754.fact_true:0 "The note earmarks the money for food. Furnishings would divert the gift."
 kehillah_bet_din.0754.fact_false:0 "The note permits food and furnishings. Closing the chest entirely wasted a useful gift."
 kehillah_bet_din.0754.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0754.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0754.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case75_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case75_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case75_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_bet_din_case75_great_log_title:0 "The Festival Charity Meal: a well-supported ruling"
 kehillah_bet_din_case75_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the festival charity meal dispute."
 kehillah_bet_din_case75_good_log_title:0 "The Festival Charity Meal: a workable ruling"
 kehillah_bet_din_case75_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the festival charity meal dispute."
 kehillah_bet_din_case75_poor_log_title:0 "The Festival Charity Meal: a disputed ruling"
 kehillah_bet_din_case75_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the festival charity meal dispute."
