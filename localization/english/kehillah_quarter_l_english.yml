l_english:
 # The Quarter's tracks (2026-11-20). docs/spec/2026-11-20-kehillah-quarter-building-tracks.md.
 # The renamed families moved here from kehillah_l_english.yml; the
 # Synagogue, Mikvah, Hekdesh and Sofer's Workshop text stays there.

 #####################################################################
 # CORE -- BEIT MIDRASH (school, house of study and yeshiva)
 #####################################################################
 kehillah_beit_midrash_01_domicile_building:0 "Talmud Torah"
 kehillah_beit_midrash_01_domicile_building_desc:0 "A schoolroom where the community's boys learn to read the Torah, and a few benches where their fathers study in the evenings."
 kehillah_beit_midrash_02_domicile_building:0 "Beit Midrash"
 kehillah_beit_midrash_02_domicile_building_desc:0 "A house of study with tables for several teachers and their pupils, and shelves for the community's books."
 kehillah_beit_midrash_03_domicile_building:0 "Yeshiva"
 kehillah_beit_midrash_03_domicile_building_desc:0 "An academy that draws students from distant communities and supports its scholars' teaching and writing."
 kehillah_beit_midrash_04_domicile_building:0 "Great Yeshiva"
 kehillah_beit_midrash_04_domicile_building_desc:0 "Students from across the diaspora crowd its benches. Its head's opinions are copied out and carried home."
 kehillah_beit_midrash_05_domicile_building:0 "Metivta"
 kehillah_beit_midrash_05_domicile_building_desc:0 "An academy of the first rank, in the line of the great academies of Sura and Pumbedita. Communities far away send it their questions."

 #####################################################################
 # CORE -- KAHAL HOUSE (the countinghouse keys)
 #####################################################################
 kehillah_countinghouse_01_domicile_building:0 "Kahal Room"
 kehillah_countinghouse_01_domicile_building_desc:0 "A room where the parnassim meet, the communal chest is kept and the communal tax is assessed.\n\n#N Allows a #EMP Gabbai#! (treasurer) to be appointed.#!"
 kehillah_countinghouse_02_domicile_building:0 "Kahal House"
 kehillah_countinghouse_02_domicile_building_desc:0 "The community's council house, with its own chest, its ledgers and the pinkas in which the council records its decisions."
 kehillah_countinghouse_03_domicile_building:0 "Council Hall"
 kehillah_countinghouse_03_domicile_building_desc:0 "A hall where the whole community can be called together, and where its many enterprises answer to its council."

 #####################################################################
 # SPECIALISATION -- KOSHER MARKET (the market stalls keys)
 #####################################################################
 kehillah_market_stalls_01_domicile_building:0 "Kosher Shambles"
 kehillah_market_stalls_01_domicile_building_desc:0 "Stalls where kosher meat and bread are sold, and the tax on kosher meat is collected for the communal chest."
 kehillah_market_stalls_02_domicile_building:0 "Kosher Market"
 kehillah_market_stalls_02_domicile_building_desc:0 "A permanent market with butchers, bakers and a wine seller, serving the community and, quietly, some of the town."
 kehillah_market_stalls_03_domicile_building:0 "Market Hall"
 kehillah_market_stalls_03_domicile_building_desc:0 "A covered hall that feeds the quarter and does a brisk trade with the town."

 # The Kosher Market's annexes. The Slaughterhouse keys are the butchers.
 kehillah_slaughterhouse_01_domicile_building:0 "Kosher Butchers"
 kehillah_slaughterhouse_01_domicile_building_desc:0 "Meat slaughtered and prepared according to the law by someone trained to do it properly."
 kehillah_slaughterhouse_02_domicile_building:0 "Butchers' Hall"
 kehillah_slaughterhouse_02_domicile_building_desc:0 "Enough capacity to sell kosher meat to travelers and neighboring communities, not merely to feed this one."
 kehillah_winery_01_domicile_building:0 "Wine Press"
 kehillah_winery_01_domicile_building_desc:0 "Kosher wine pressed and kept by Jewish hands, for the community's blessings and for sale."
 kehillah_winery_02_domicile_building:0 "Kosher Winery"
 kehillah_winery_02_domicile_building_desc:0 "Vineyards worked by the community's families and a cellar whose wine is sold in the town market, as Rashi's was in Troyes."

 #####################################################################
 # SPECIALISATION -- CRAFT ROW (the workshops keys) and its trades
 #####################################################################
 kehillah_workshops_01_domicile_building:0 "Workshops"
 kehillah_workshops_01_domicile_building_desc:0 "Workshops along the lane, each with room for a trade."
 kehillah_workshops_02_domicile_building:0 "Craft Row"
 kehillah_workshops_02_domicile_building_desc:0 "A street of craftsmen, with trades passed from father to son and apprentices at the benches."
 kehillah_workshops_03_domicile_building:0 "Guild Hall"
 kehillah_workshops_03_domicile_building_desc:0 "The quarter's craftsmen keep their own hall. Buyers come from other towns for their work."

 kehillah_trade_dyers_01_domicile_building:0 "Dye Vats"
 kehillah_trade_dyers_01_domicile_building_desc:0 "Vats of woad, madder and indigo, and cloth hung to dry over the lane."
 kehillah_trade_dyers_02_domicile_building:0 "Dye Works"
 kehillah_trade_dyers_02_domicile_building_desc:0 "Dyeing was a Jewish trade from Brindisi to Thebes; the quarter's dye works supplies the town's weavers."
 kehillah_trade_silk_weavers_01_domicile_building:0 "Silk Looms"
 kehillah_trade_silk_weavers_01_domicile_building_desc:0 "A few looms weaving silk for the town's rich."
 kehillah_trade_silk_weavers_02_domicile_building:0 "Silk House"
 kehillah_trade_silk_weavers_02_domicile_building_desc:0 "Benjamin of Tudela found the Jews of Thebes the finest silk-makers in Greece. This community's work is known as far."
 kehillah_trade_goldsmiths_01_domicile_building:0 "Goldsmiths' Benches"
 kehillah_trade_goldsmiths_01_domicile_building_desc:0 "Rings, clasps and settings for the town's jewels."
 kehillah_trade_goldsmiths_02_domicile_building:0 "Goldsmiths' Row"
 kehillah_trade_goldsmiths_02_domicile_building_desc:0 "Lords send for the quarter's goldsmiths when they want something fine made."
 kehillah_trade_tanners_01_domicile_building:0 "Tannery"
 kehillah_trade_tanners_01_domicile_building_desc:0 "Hides soaked and scraped by the river, out of the quarter's way."
 kehillah_trade_tanners_02_domicile_building:0 "Tanners' Yard"
 kehillah_trade_tanners_02_domicile_building_desc:0 "Leather for saddlers, binders and the scribes' parchment trade."
 kehillah_trade_glassmakers_01_domicile_building:0 "Glass Furnace"
 kehillah_trade_glassmakers_01_domicile_building_desc:0 "A furnace for cups, lamps and bottles."
 kehillah_trade_glassmakers_02_domicile_building:0 "Glassworks"
 kehillah_trade_glassmakers_02_domicile_building_desc:0 "Glass was a Jewish craft in Tyre, Antioch and Byzantium; this community's is sold along the coast."
 kehillah_trade_clothiers_01_domicile_building:0 "Old-Clothes Stalls"
 kehillah_trade_clothiers_01_domicile_building_desc:0 "Garments bought, mended and sold again: the trade of many a poor Jewish family."
 kehillah_trade_clothiers_02_domicile_building:0 "Clothiers' Hall"
 kehillah_trade_clothiers_02_domicile_building_desc:0 "New cloth and fine garments as well as old, for the town and the fairs."
 kehillah_trade_apothecaries_01_domicile_building:0 "Apothecary"
 kehillah_trade_apothecaries_01_domicile_building_desc:0 "Drugs, syrups and simples, prepared by a family that also keeps the physicians' recipes."
 kehillah_trade_apothecaries_02_domicile_building:0 "Apothecaries' Hall"
 kehillah_trade_apothecaries_02_domicile_building_desc:0 "Medicines prepared for the town and for the physicians who serve its lords."

 #####################################################################
 # SPECIALISATION -- BANKERS' ROW
 #####################################################################
 kehillah_bankers_row_01_domicile_building:0 "Moneychangers' Tables"
 kehillah_bankers_row_01_domicile_building_desc:0 "Coins of every mint weighed and changed, and small sums lent against good security."
 kehillah_bankers_row_02_domicile_building:0 "Bankers' Row"
 kehillah_bankers_row_02_domicile_building_desc:0 "Houses whose families lend to knights, abbots and the lord's own officers."
 kehillah_bankers_row_03_domicile_building:0 "The Exchange"
 kehillah_bankers_row_03_domicile_building_desc:0 "Letters of credit honoured from one community to the next. The quarter's credit reaches far beyond the town."

 #####################################################################
 # SPECIALISATION -- FUNDUQ
 #####################################################################
 kehillah_funduq_01_domicile_building:0 "Factor's House"
 kehillah_funduq_01_domicile_building_desc:0 "A merchant's house with a storeroom, where goods from far away are bought and sold."
 kehillah_funduq_02_domicile_building:0 "Funduq"
 kehillah_funduq_02_domicile_building_desc:0 "A courtyard inn and warehouse for travelling merchants. Letters from the whole diaspora pass through it."
 kehillah_funduq_03_domicile_building:0 "Trading House"
 kehillah_funduq_03_domicile_building_desc:0 "Partners and agents in distant ports, as the merchants of the Cairo Geniza had. The community trades with the whole Jewish world."

 #####################################################################
 # SPECIALISATION -- WALL AND GATES
 #####################################################################
 kehillah_wall_01_domicile_building:0 "Gates and Night Watch"
 kehillah_wall_01_domicile_building_desc:0 "Gates at the ends of the lane, locked at night, and men of the community to watch them."
 kehillah_wall_02_domicile_building:0 "Quarter Wall"
 kehillah_wall_02_domicile_building_desc:0 "A wall around the quarter, by the host's leave, as Bishop Rüdiger walled the Jews of Speyer in 1084."
 kehillah_wall_03_domicile_building:0 "Fortified Quarter"
 kehillah_wall_03_domicile_building_desc:0 "Towers on the wall and an armed watch. Neighbouring communities send their people here when danger comes."

 #####################################################################
 # Construction requirements
 #####################################################################
 kehillah_specialisation_allowance_tt:0 "The Kahal House allows another specialisation (running [GetPlayer.MakeScope.ScriptValue('kehillah_specialisation_count_value')|0] of [GetPlayer.MakeScope.ScriptValue('kehillah_specialisation_allowance_value')|0])"
 kehillah_requires_stability_healthy_tt:0 "Stability is at least #E Healthy#!"
 kehillah_requires_workshops_02_tt:0 "Has a #EMP Craft Row#!"
 kehillah_requires_market_stalls_02_tt:0 "Has a #EMP Kosher Market#!"
 kehillah_wall_licence_tt:0 "The host allows the quarter to be walled (a charter right, or a #EMP Petition for a Wall#!)"
 kehillah_wall_arms_tt:0 "The host charter lets the community keep an armed watch"

 #####################################################################
 # Petition for a Wall
 #####################################################################
 kehillah_petition_for_wall_decision:0 "Petition for a Wall"
 kehillah_petition_for_wall_decision_desc:0 "Gates keep out a drunken crowd; only a wall keeps out a mob. But a wall around the Jews' quarter is a privilege, and only the lord can grant it."
 kehillah_petition_for_wall_decision_tooltip:0 "Ask the host for leave to wall the quarter"
 kehillah_petition_for_wall_decision_confirm:0 "Present the petition"
 kehillah_wall_petition_granted_tt:0 "The host grants the community leave to wall its quarter"
 kehillah_wall_petition_host_tt:0 "The community has a host to petition"
 kehillah_wall_petition_forbidden_tt:0 "The host charter does not forbid new construction"
 kehillah_wall_petition_permit_tt:0 "Where building needs the host's permission, the community holds a permit"
 kehillah_wall_petition_cold_host_tt:0 "The host does not regard the Jews coldly"
 kehillah_wall_petition_cooldown_tt:0 "The community has not petitioned the host recently"

 kehillah_safety_factor_walls:0 "The quarter's gates and walls"

 #####################################################################
 # BANKERS' ROW ANNEXES and Enforce the Bond (slice 4)
 #####################################################################
 kehillah_bond_chest_01_domicile_building:0 "Bond Chest"
 kehillah_bond_chest_01_domicile_building_desc:0 "Every bond the community writes is copied and locked away, as the king of England made his Jews keep their bonds in official chests after York. Burned bonds no longer burn the debt."
 kehillah_pledge_store_01_domicile_building:0 "Pledge Store"
 kehillah_pledge_store_01_domicile_building_desc:0 "Cloaks, cups and swords held against small loans, and returned when the loan is paid."
 kehillah_court_jew_office_01_domicile_building:0 "Court Jew's Office"
 kehillah_court_jew_office_01_domicile_building_desc:0 "A house where the lord's own business is done: his loans, his purchases, his letters of credit."
 kehillah_requires_bankers_row_02_tt:0 "Has a #EMP Bankers' Row#!"

 kehillah_bond_collected_t:0 "A Bond Collected"
 kehillah_bond_collected_d:0 "Holding our registered bond, [kehillah_bond_debtor.GetTitledFirstName] has paid part of what [kehillah_bond_debtor.GetSheHe] owes the community."

 kehillah_enforce_bond_interaction:0 "Enforce the Bond"
 kehillah_enforce_bond_interaction_desc:0 "Our Shtadlan takes [recipient.GetTitledFirstName]'s bond before the host's court, which can compel [recipient.GetHerHim] to pay. The court's help is a favour, and the debtor will not forget it."
 kehillah_enforce_bond_needs_shtadlan_tt:0 "The community has a Shtadlan to plead the case"
 kehillah_enforce_bond_needs_host_tt:0 "The community has a host whose court can hear it"
 kehillah_enforce_bond_subject_tt:0 "The debtor is a subject of the host, and not the host himself"
 kehillah_enforce_bond_has_gold_tt:0 "The debtor has gold to pay with"
 kehillah_enforce_bond.success:0 "The court compels payment"
 kehillah_enforce_bond.success_desc:0 "The host's court has ordered [kehillah_bond_debtor.GetTitledFirstName] to pay part of the debt."
 kehillah_enforce_bond.failure:0 "The court dismisses the case"
 kehillah_enforce_bond.failure_desc:0 "The host's court has sent our Shtadlan away. [kehillah_bond_debtor.GetTitledFirstName] pays nothing."
 kehillah_bond_enforced_opinion:0 "Made to Pay a Jewish Bond"
 kehillah_bond_dismissed_opinion:0 "Taken to Court over a Bond"
 kehillah_bond_court_favour_opinion:0 "Asked to Enforce a Jewish Bond"

