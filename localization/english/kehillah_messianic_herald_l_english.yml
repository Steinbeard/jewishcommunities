l_english:
 kehillah_messianic_herald_decision: "Herald the Messiah"
 kehillah_messianic_herald_decision_desc: "The time of redemption draws near. Let my deeds and my teaching awaken hope among the people, and prepare them for the coming of the Messiah."
 kehillah_messianic_herald_decision_tooltip: "Become a herald and embrace Messianic Hope"
 kehillah_messianic_herald_decision_confirm: "Let the people hear."
 kehillah_messianic_herald_effect_tt: "You become a Herald, learn Messianic Hope, and choose how to proclaim it. If your rite does not hold it, you adopt it as a personal tenet, potentially replacing another personal tenet. You can then pursue a Messianic Mission when its conditions are met."
 kehillah_messianic_herald.0001.t: "A Voice of Redemption"
 kehillah_messianic_herald.0001.desc: "Word has spread of my learning and devotion. Now the people gather to hear what I will say of the promised redemption. The Messiah has not yet come; I can only prepare hearts for that day."
 kehillah_messianic_herald.0001.mercy: "Let compassion prepare the way."
 kehillah_messianic_herald.0001.sword: "Let us prepare to defend our people."
