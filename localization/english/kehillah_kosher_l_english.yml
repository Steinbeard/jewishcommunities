l_english:
 # Jewish Communities: kosher options added to vanilla events.
 # Unfamiliar Rations (ep3_laamps.5020): the cook's local stew
 ep3_laamps.5020.kehillah_kosher:0 "This is not kosher. I will not eat it."
 ep3_laamps.5020.kehillah_kosher.flavor:0 "The road is long, but the laws of #EMP kashrut#! travel with me."

 # Hawking Meat (bp3_journey.1400): a local hunter's game
 bp3_journey.1400.kehillah_kosher:0 "None of this was slaughtered as the law requires."
 bp3_journey.1400.kehillah_kosher.flavor:0 "Game brought down by arrow or snare can never be kosher."

 # Garum! (feast_default.5005): fish brine from the host's kitchen
 feast_default.5005.kehillah_kosher:0 "Fish brine from a gentile kitchen? I set it aside."
 feast_default.5005.kehillah_kosher.flavor:0 "The sages forbade the #EMP muries#! of gentiles, however fine its savor."

 # Under the Table (feast_default.6510): the squirming dish
 feast_default.6510.kehillah_kosher:0 "Whatever this is, it is not kosher."
 feast_default.6510.kehillah_kosher.flavor:0 "The fruit and greens will do. The rest I leave untouched."

 # 'Tis the Season (cultural_festival.2020): the local festival
 cultural_festival.2020.kehillah_kosher:0 "I will celebrate with them, but eat from my own kitchen."
 cultural_festival.2020.kehillah_kosher.flavor:0 "My cook travels with me for a reason."

 # The Contest (host_dinner_events.3020): the host's drinking challenge
 host_dinner_events.3020.kehillah_kosher:0 "I drink only kosher wine, my friend."
 host_dinner_events.3020.kehillah_kosher.flavor:0 "The wine of gentiles is forbidden to me, however good the company."
 host_dinner_events.3020.kehillah_kosher.toast:0 "Declined the wine, not the company"

 # Felling a Beast (hunt.4004): in place of eating the kill on the spot.
 hunt.4004.kehillah_kosher:0 "Send the meat to the poor. It is not for my table."
 hunt.4004.kehillah_kosher.flavor:0 "No beast brought down in the chase was ever slaughtered as the law requires."
