 kehillah_holy_host_christian:0 "Chrysostomianism"
 kehillah_holy_host_christian_desc:0 "Taking its name from John Chrysostom's fierce preaching against Jews and Christians who shared their rites, this movement accuses Jews of deicide and perfidy. Its followers reject the teaching that Jews should remain as witnesses to Christian truth: they demand that Jewish communities be driven out."
 kehillah_holy_host_christian_adj:0 "Chrysostomian"
 kehillah_holy_host_christian_adherent:0 "Chrysostomian"
 kehillah_holy_host_christian_adherent_plural:0 "Chrysostomians"
