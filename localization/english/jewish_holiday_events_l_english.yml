l_english:

 #####################################################################
 # Jewish holiday flavor events.
 # Source: events/jewish_holiday_events.txt. Fires for any Jewish
 # character (see common/scripted_triggers/jewish_holiday_scripted_triggers.txt
 # for which faiths get which holidays).
 #####################################################################


 #####################################################################
 # ROSH HASHANAH
 #####################################################################

 jewish_holidays.0001.t:0 "An Omen in the Honey"
 jewish_holidays.0001.desc:0 "The apple is dipped and the blessing said -- #EMP a good and sweet year#! -- and something small happens at the table that everyone half-notices and nobody quite mentions: a coin turns up in the bread, a candle gutters and steadies, [ROOT.GetFirstName]'s youngest stumbles over the words and gets them right anyway on the second try.\n\nIt means nothing, of course. It is also Rosh Hashanah, the day the year itself is weighed, and it is very hard not to wonder."

 jewish_holidays.0001.a:0 "A good year, then."
 jewish_holidays.0001.a.tt:0 "You choose to believe it, and the belief itself does something -- you go into the year lighter than you came into the evening."

 jewish_holidays.0001.b:0 "Best to be careful this year."
 jewish_holidays.0001.b.tt:0 "You say nothing at the table, but you do not forget it either. Caution costs something, in its quiet way."

 jewish_holidays.0001.c:0 "It is a stumble over bread, nothing more."
 jewish_holidays.0001.c.tt:0 "You are almost certainly right. The year will not consult you either way."


 jewish_holidays.0002.t:0 "The New Year's Reckoning"
 jewish_holidays.0002.desc:0 "Rosh Hashanah is the day of judgement as much as the day of honey and apples -- the ledger of the year past is opened, whether or not anyone else is looking at it. [ROOT.GetFirstName] has a fault in mind. Everyone does, once they start counting."

 jewish_holidays.0002.a:0 "Cast it off, honestly."
 jewish_holidays.0002.a.tt:0 "You name it plainly to yourself, which is the hard part and very nearly the whole of it. It is not gone. It is, at least, seen."

 jewish_holidays.0002.b:0 "Vow charity, loudly enough to be held to it."
 jewish_holidays.0002.b.tt:0 "A vow made in front of witnesses is a vow that costs you something to break. You make sure of the witnesses."

 jewish_holidays.0002.c:0 "Let it wait. The reckoning can keep."
 jewish_holidays.0002.c.tt:0 "There is always next Rosh Hashanah. The fault will still be there, patiently, whenever you are ready for it."


 #####################################################################
 # PASSOVER
 #####################################################################

 jewish_holidays.0003.t:0 "The Four Questions"
 jewish_holidays.0003.desc:0 "The seder table is set, the wine poured four times over, and [ROOT.GetFirstName]'s youngest stands to ask why this night is different from all other nights -- the Mah Nishtana, word-perfect and rehearsed for a week, delivered now in a voice that wavers only slightly under the weight of every eye at the table."

 jewish_holidays.0003.a:0 "Answer patiently, the whole story."
 jewish_holidays.0003.a.tt:0 "You take the question as seriously as it was asked. [holiday_child.GetFirstName] will remember being listened to long after forgetting most of what you actually said."

 jewish_holidays.0003.b:0 "Turn it into a proper lesson."
 jewish_holidays.0003.b.tt:0 "You answer thoroughly -- exhaustively, if it comes to that -- and the meal goes cold while Egypt is explained in full. Learned, if not exactly beloved, by the end of it."

 jewish_holidays.0003.c:0 "Wave it off. The food is getting cold."
 jewish_holidays.0003.c.tt:0 "You give the short version and reach for the plate. [holiday_child.GetFirstName] asked because it mattered, and notices that it did not seem to matter back."


 jewish_holidays.0004.t:0 "Bedikat Chametz"
 jewish_holidays.0004.desc:0 "The night before Passover, the house is searched by candlelight for the last stray crumbs of leavened bread -- a feather to sweep them, a wooden spoon to gather them, a ritual older than anyone at the table can explain properly. Every cupboard, every seam in the floorboards, every pocket left unchecked since autumn."

 jewish_holidays.0004.a:0 "Search it yourself, thoroughly."
 jewish_holidays.0004.a.tt:0 "You do it properly, on your knees with the candle, until you are satisfied there is not a crumb left in the house. It takes half the night and you are certain of every inch of it."

 jewish_holidays.0004.b:0 "Make it a game for the household."
 jewish_holidays.0004.b.tt:0 "Candles are handed out, hiding places are half-heartedly kept secret, and the search becomes something closer to a party than a chore. The house ends up just as clean, and considerably louder."

 jewish_holidays.0004.c:0 "Leave it to the servants."
 jewish_holidays.0004.c.tt:0 "You pay a little extra for the trouble and spend the evening on more comfortable business. Whether they found every crumb is a question you have decided not to ask."


 #####################################################################
 # HANUKKAH
 #####################################################################

 jewish_holidays.0005.t:0 "The Dreidel Game"
 jewish_holidays.0005.desc:0 "The little four-sided top spins on the table -- nun, gimel, hei, shin, #EMP a great miracle happened there#! -- and the stakes are laid out: coin, walnuts, sweets shaped like coins for the children too young to be trusted with the real thing."

 jewish_holidays.0005.a:0 "Play for nuts and sweets. The stakes are nothing."
 jewish_holidays.0005.a.tt:0 "Nobody leaves the table richer or poorer, and everybody leaves it in a better mood than they sat down in. That is more or less the entire design of the game."

 jewish_holidays.0005.b:0 "Wager real coin this time."
 jewish_holidays.0005.b.win.tt:0 "The top favours you, spin after spin. By the end of the evening you have won more than you sat down with, and a reputation for luck you did not have before."
 jewish_holidays.0005.b.lose.tt:0 "The top does not favour you. You lose steadily, cheerfully at first and less so as the evening wears on, and go to bed lighter in the purse and heavier in the head."

 jewish_holidays.0005.c:0 "Decline, and hand out gelt instead."
 jewish_holidays.0005.c.tt:0 "You sit out the game and pay the children in coin directly, which is either the pious choice or the one that ends the evening fastest. Possibly both."


 jewish_holidays.0006.t:0 "Light in the Window"
 jewish_holidays.0006.desc:0 "The hanukkiah is lit, one more candle each night, and there is a small, private question in where exactly it stands: facing the street where anyone passing can see it burn, set back in the window more modestly, or kept to a table further inside altogether. Nobody has asked. [ROOT.GetFirstName]'s household is waiting to see where [ROOT.GetSheHe] put it."

 jewish_holidays.0006.a:0 "Facing the street, proudly."
 jewish_holidays.0006.a.tt:0 "The light sits where anyone walking past can see it burn. It is a small thing to be proud of, and you find you are."

 jewish_holidays.0006.b:0 "In the window, but modestly lit."
 jewish_holidays.0006.b.tt:0 "The light is there to be seen, if someone happens to look. You have not hidden it, and you have not announced it either."

 jewish_holidays.0006.c:0 "Indoors only."
 jewish_holidays.0006.c.tt:0 "The candles burn where only the household sees them. It is no less real a Hanukkah for being a quiet one."


 #####################################################################
 # PURIM
 #####################################################################

 jewish_holidays.0007.t:0 "Ad Lo Yada"
 jewish_holidays.0007.desc:0 "Purim, and the wine is poured with a specific commandment behind it for once: to drink #EMP ad lo yada#!, until one can no longer tell 'cursed be Haman' from 'blessed be Mordecai.' The costumes are absurd, the Megillah has been read amid deliberate noise and stamping, and the night is still young."

 jewish_holidays.0007.a:0 "Drink heartily. It is, after all, the custom."
 jewish_holidays.0007.a.good.tt:0 "It becomes, by general agreement the next morning, one of the finest Purims anyone can remember -- and you are at the centre of most of the stories told about it."
 jewish_holidays.0007.a.bad.tt:0 "You commit to the custom rather too fully, and the next morning arrives with a story attached to your name that will be retold, with embellishments, for years."

 jewish_holidays.0007.b:0 "Drink moderately. Enjoy the feast without losing yourself."
 jewish_holidays.0007.b.tt:0 "A good evening, warmly remembered and entirely free of anything you will have to live down later. There is something to be said for moderation, even at Purim."

 jewish_holidays.0007.c:0 "Abstain, and keep your composure."
 jewish_holidays.0007.c.tt:0 "You watch the evening unfold from a clear head, which is either wisdom or a wasted Purim, depending on who at the table you ask."


 jewish_holidays.0008.t:0 "Mishloach Manot"
 jewish_holidays.0008.desc:0 "Purim's other commandment: baskets of sweets, wine and good things sent between friends and neighbors, and none of it is meant to go to waste sitting in the kitchen. [ROOT.GetFirstName] has one basket prepared and a choice of where it goes."

 jewish_holidays.0008.a:0 "Send it to a rival, as an overture."
 jewish_holidays.0008.a.tt:0 "It costs you nothing but a basket of sweets to extend a hand, and the gesture is not lost on [holiday_gift_target.GetFirstName], whatever [holiday_gift_target.GetHerHis] history with you."

 jewish_holidays.0008.b:0 "Send it to a dear friend."
 jewish_holidays.0008.b.tt:0 "[holiday_gift_target.GetFirstName] receives it warmly, as [holiday_gift_target.GetSheHe] would receive anything from you. Some baskets are simply easier than others."

 jewish_holidays.0008.c:0 "Send it to the community's poor."
 jewish_holidays.0008.c.tt:0 "Matanot la'evyonim -- gifts to the poor -- is the part of the commandment that matters most, whatever the feast-day baskets look like. You see to it properly."
