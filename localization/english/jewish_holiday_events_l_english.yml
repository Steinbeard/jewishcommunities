l_english:

 #####################################################################
 # Jewish holiday flavor events.
 # Source: events/jewish_holiday_events.txt. Fires for any Jewish
 # character (see common/scripted_triggers/jewish_holiday_scripted_triggers.txt
 # for which faiths get which holidays).
 #####################################################################


 #####################################################################
 # GENERAL
 #####################################################################
 jewish_holiday_warm_memory_modifier:0 "Fond Holiday Memories"
 jewish_holiday_awkward_memory_modifier:0 "An Awkward Holiday Memory"

 #####################################################################
 # ROSH HASHANAH
 #####################################################################

 jewish_holidays.0001.t:0 "An Omen in the Honey"
 jewish_holidays.0001.desc:0 "The household gathers for the Rosh Hashanah meal. As the blessing over the apple and honey is said, a candle gutters in a draught, then burns steadily again.\n\nFor a moment, conversation stops. On another evening you might have thought little of it."

 jewish_holidays.0001.a:0 "A good year, then."
 jewish_holidays.0001.a.tt:0 "You take the steady flame as a hopeful sign for the year ahead."

 jewish_holidays.0001.b:0 "Best to be careful this year."
 jewish_holidays.0001.b.tt:0 "You find yourself worrying about what the coming year might bring."

 jewish_holidays.0001.c:0 "It was only a draught."
 jewish_holidays.0001.c.tt:0 "You return to the meal without giving it further thought."


 jewish_holidays.0002.t:0 "The New Year's Reckoning"
 jewish_holidays.0002.desc:0 "The prayers of Rosh Hashanah prompt you to consider the past year. You recall promises you neglected and occasions when anger got the better of you.\n\nThere is time to make amends, if you are willing to begin."

 jewish_holidays.0002.a:0 "I will acknowledge my faults and make amends."
 jewish_holidays.0002.a.tt:0 "You reflect on your conduct and resolve to do better."

 jewish_holidays.0002.b:0 "Make a public pledge of charity."
 jewish_holidays.0002.b.tt:0 "You pledge money for those in need before the assembled household."

 jewish_holidays.0002.c:0 "I am not ready to face this."
 jewish_holidays.0002.c.tt:0 "You put the matter aside."


 #####################################################################
 # PASSOVER
 #####################################################################

 jewish_holidays.0003.t:0 "The Four Questions"
 jewish_holidays.0003.desc:0 "At the seder table, your child stands to recite the Four Questions. The first words come hesitantly, then more confidently: why is this night different from all other nights?\n\nThe household turns to you for the answer."

 jewish_holidays.0003.a:0 "Tell the story, and leave room for questions."
 jewish_holidays.0003.a.tt:0 "[holiday_child.GetFirstName] listens closely and asks several more questions as you explain."

 jewish_holidays.0003.b:0 "Turn it into a proper lesson."
 jewish_holidays.0003.b.tt:0 "You give a detailed account of the Exodus, taking time to explain each part of the story."

 jewish_holidays.0003.c:0 "Wave it off. The food is getting cold."
 jewish_holidays.0003.c.tt:0 "[holiday_child.GetFirstName] falls silent as you hurry through the answer and turn to the meal."


 jewish_holidays.0004.t:0 "Bedikat Chametz"
 jewish_holidays.0004.desc:0 "On the night before Passover, the household prepares to search for remaining chametz. A candle is ready to light the corners and cupboards where crumbs may have escaped the cleaning.\n\nThere is still much to check before morning."

 jewish_holidays.0004.a:0 "Search it yourself, thoroughly."
 jewish_holidays.0004.a.tt:0 "You search every room yourself. The work is tiring, but you are satisfied it has been done thoroughly."

 jewish_holidays.0004.b:0 "Make it a game for the household."
 jewish_holidays.0004.b.tt:0 "The household joins in, calling out each find. The search is soon finished amid laughter."

 jewish_holidays.0004.c:0 "Leave it to the servants."
 jewish_holidays.0004.c.tt:0 "You pay the servants to complete the search."


 #####################################################################
 # HANUKKAH
 #####################################################################

 jewish_holidays.0005.t:0 "The Dreidel Game"
 jewish_holidays.0005.desc:0 "A wooden dreidel spins across the table. The players have set out walnuts, sweets and a few coins for the game.\n\nSomeone pushes a handful towards you and makes room at the table."

 jewish_holidays.0005.a:0 "Join a game for nuts and sweets."
 jewish_holidays.0005.a.tt:0 "You spend a pleasant evening playing with the household."

 jewish_holidays.0005.b:0 "Wager real coin this time."
 jewish_holidays.0005.b.win.tt:0 "A run of good spins leaves you with a tidy pile of winnings."
 jewish_holidays.0005.b.lose.tt:0 "Your coins run out before your luck improves. You leave the table in a sour mood."

 jewish_holidays.0005.c:0 "Decline, and hand out gelt instead."
 jewish_holidays.0005.c.tt:0 "You give coins to the children and watch them return to their game."


 jewish_holidays.0006.t:0 "Light in the Window"
 jewish_holidays.0006.desc:0 "The Hanukkah lights are ready to be kindled. From the front window they would be visible to anyone passing through the street; further inside, only the household would see them.\n\nYour family waits while you choose a place."

 jewish_holidays.0006.a:0 "Facing the street, proudly."
 jewish_holidays.0006.a.tt:0 "Passers-by stop to look at the lights in your window."

 jewish_holidays.0006.b:0 "Set them back from the window."
 jewish_holidays.0006.b.tt:0 "You kindle the lights where they can still be seen from outside."

 jewish_holidays.0006.c:0 "Indoors only."
 jewish_holidays.0006.c.tt:0 "You gather the household around the lights indoors."


 #####################################################################
 # PURIM
 #####################################################################

 jewish_holidays.0007.t:0 "Ad Lo Yada"
 jewish_holidays.0007.desc:0 "The Megillah has been read, and the Purim feast is underway. A neighbour fills your cup and urges you to drink #EMP ad lo yada#!, until you cannot tell 'cursed be Haman' from 'blessed be Mordecai.'\n\nSeveral guests are already singing. Your cup is full again."

 jewish_holidays.0007.a:0 "Drink with the guests."
 jewish_holidays.0007.a.good.tt:0 "Your songs and stories keep the table laughing late into the evening."
 jewish_holidays.0007.a.bad.tt:0 "You drink too much and make a spectacle of yourself before the guests."

 jewish_holidays.0007.b:0 "Enjoy the feast, but drink sparingly."
 jewish_holidays.0007.b.tt:0 "You enjoy the food and company, and leave the feast feeling rested."

 jewish_holidays.0007.c:0 "Decline the wine."
 jewish_holidays.0007.c.tt:0 "You join the feast without drinking."


 jewish_holidays.0008.t:0 "Mishloach Manot"
 jewish_holidays.0008.desc:0 "Gifts of food and wine are being delivered for Purim. Your household has prepared a basket, and the messenger is waiting for a name.\n\nYou could send it to a friend, offer it to a rival, or provide for someone in need."

 jewish_holidays.0008.a:0 "Send it to a rival, as an overture."
 jewish_holidays.0008.a.tt:0 "[holiday_gift_target.GetFirstName] accepts your gift as an offer of reconciliation."

 jewish_holidays.0008.b:0 "Send it to a dear friend."
 jewish_holidays.0008.b.tt:0 "[holiday_gift_target.GetFirstName] receives the basket with thanks."

 jewish_holidays.0008.c:0 "Send it to the community's poor."
 jewish_holidays.0008.c.tt:0 "You set aside food from the basket for neighbours who need it."


 #####################################################################
 # YOM KIPPUR
 #####################################################################

 jewish_holidays.0009.t:0 "Before the Fast"
 jewish_holidays.0009.desc:0 "[holiday_neighbor.GetFirstName] returns your greeting but not your smile. Last month you corrected an error in an account before several others. You were right about the sum; your words were sharper than they needed to be.\n\nThe evening prayers of Yom Kippur will begin soon."

 jewish_holidays.0009.a:0 "Apologize for how I spoke."
 jewish_holidays.0009.a.tt:0 "[holiday_neighbor.GetFirstName] accepts your apology for the public rebuke."

 jewish_holidays.0009.b:0 "Explain again why the account was wrong."
 jewish_holidays.0009.b.tt:0 "The sum is settled, but the conversation leaves you tense."

 jewish_holidays.0009.c:0 "Leave the matter for another day."
 jewish_holidays.0009.c.tt:0 "You go to prayers without raising the account."


 jewish_holidays.0010.t:0 "The Last Hour"
 jewish_holidays.0010.desc:0 "The final Yom Kippur prayers have begun. An older worshipper eases down onto a bench while the congregation stands. The long day has tired you too, and there is room to sit nearby."

 jewish_holidays.0010.a:0 "Stay with the congregation and sing."
 jewish_holidays.0010.a.tt:0 "You remain for the closing prayers and add your voice to the singing."

 jewish_holidays.0010.b:0 "Sit and gather your strength."
 jewish_holidays.0010.b.tt:0 "You rest through part of the service and return to the prayers when you can."

 jewish_holidays.0010.c:0 "Help the older worshipper follow the words."
 jewish_holidays.0010.c.tt:0 "You find the place in the prayer book and share it through the closing prayers."


 #####################################################################
 # SUKKOT
 #####################################################################

 jewish_holidays.0011.t:0 "A Gap in the Roof"
 jewish_holidays.0011.desc:0 "A gust pulls a branch loose from the roof of the sukkah just as the meal is brought out. Rain begins to fall through the gap, spotting the bread and the cloth beneath it."

 jewish_holidays.0011.a:0 "Tie the branch back before we eat."
 jewish_holidays.0011.a.tt:0 "You secure the roof in the rain and return to the table damp and tired."

 jewish_holidays.0011.b:0 "Carry the food inside until the rain passes."
 jewish_holidays.0011.b.tt:0 "The household carries the dishes indoors and shares the meal together."

 jewish_holidays.0011.c:0 "Cover the food and wait for clear skies."
 jewish_holidays.0011.c.tt:0 "You set the bread aside and return to the sukkah when the rain has stopped."


 jewish_holidays.0012.t:0 "Room at the Table"
 jewish_holidays.0012.desc:0 "As the household sets the table in the sukkah, [holiday_guest.GetFirstName] arrives with a bowl of figs. The seats are filling, but there is still room for one more."

 jewish_holidays.0012.a:0 "Make room beside me."
 jewish_holidays.0012.a.tt:0 "You draw [holiday_guest.GetFirstName] into the conversation over supper."

 jewish_holidays.0012.b:0 "Read the festival blessing together."
 jewish_holidays.0012.b.tt:0 "You and [holiday_guest.GetFirstName] read the blessing before the meal."

 jewish_holidays.0012.c:0 "Pass the figs around and begin the meal."
 jewish_holidays.0012.c.tt:0 "The figs are shared, and the household settles to supper."


 #####################################################################
 # SHAVUOT
 #####################################################################

 jewish_holidays.0013.t:0 "The Worn Pages"
 jewish_holidays.0013.desc:0 "After the Shavuot reading, a borrowed book of Torah commentary remains on the bench. Its owner has left word that others may study it before its return. The edges of one passage are worn from many hands."

 jewish_holidays.0013.a:0 "Read the marked passage together."
 jewish_holidays.0013.a.tt:0 "You gather a few readers around the book and discuss the passage."

 jewish_holidays.0013.b:0 "Pay a scribe to copy those leaves."
 jewish_holidays.0013.b.tt:0 "A scribe makes a copy of the worn passage for others to study."

 jewish_holidays.0013.c:0 "Return the book before it wears further."
 jewish_holidays.0013.c.tt:0 "You send the book back to its owner in good order."
