l_english:
 jewish_holiday_feast.0001.t.generic:0 "A Blessing at the Feast"
 jewish_holiday_feast.0001.t.pesach:0 "The Seder Table"
 jewish_holiday_feast.0001.t.sukkot:0 "A Meal for Sukkot"
 jewish_holiday_feast.0001.t.shavuot:0 "A Shavuot Seudah"

 jewish_holiday_feast.0001.desc.generic:0 "As the guests settle, you pause to offer a blessing before the meal. Familiar voices answer yours, and the formal feast begins to feel like a household table."
 jewish_holiday_feast.0001.desc.pesach:0 "The retelling begins before the meal. Questions pass around the table, and the story of the Exodus draws even distant guests into the Seder."
 jewish_holiday_feast.0001.desc.sukkot:0 "Your household has prepared a place for the festival meal beneath the sukkah's roof. Guests pass the dishes from hand to hand, making room for family amid the larger feast."
 jewish_holiday_feast.0001.desc.shavuot:0 "A reading from the Torah opens the Shavuot meal. Conversation soon turns from the text to the people gathered around the table."

 jewish_holiday_feast.0001.a:0 "Welcome them to the table."
