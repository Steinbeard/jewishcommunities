l_english:
 kehillah_bet_din.01031.t:0 "The Refugee's Unfinished Loan"
 kehillah_bet_din.01031.desc:0 "[kbd_litigant_a.GetFirstName] lent money before both parties fled their town. [kbd_litigant_b.GetFirstName] says part was repaid on the road; the old account book was scattered. The court must keep a debt from becoming either a windfall or an excuse."
 kehillah_bet_din.01031.a:0 "Order the full balance paid now."
 kehillah_bet_din.01031.a.tt:0 "The borrower may pay a second time."
 kehillah_bet_din.01031.b:0 "Reconstruct payments from witnesses and surviving notes."
 kehillah_bet_din.01031.b.tt:0 "The inquiry costs a little while preserving a real claim."
 kehillah_bet_din.01031.c:0 "Cancel the loan because the books are gone."
 kehillah_bet_din.01031.c.tt:0 "Loss of records alone may erase an honest lender's due."
 kehillah_din_source_103:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_103_tt:0 "Mishnah Bava Metzia 1:6 gives the judges a textual point of reference. It cannot establish the payments made during flight."
 kehillah_din_combo_103:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_103_tt:0 "The judges preserve both parties' interests while checking the payments made during flight."
 kehillah_bet_din.01034.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01034.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01034.outcome_1:0 "The borrower must pay the full claimed balance."
 kehillah_bet_din.01034.outcome_2:0 "The court records a provisional balance and searches for payment evidence."
 kehillah_bet_din.01034.outcome_3:0 "The loan is canceled."
 kehillah_bet_din.01034.fact_true:0 "A travel note proves a substantial payment. The full award overcharges the borrower."
 kehillah_bet_din.01034.fact_false:0 "Witnesses confirm the principal remains due. Cancellation denies the lender's claim."
 kehillah_bet_din.01034.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01034.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01034.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case103_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case103_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case103_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_bet_din_case103_great_log_title:0 "The Refugee's Unfinished Loan: a well-supported ruling"
 kehillah_bet_din_case103_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the refugee's unfinished loan dispute."
 kehillah_bet_din_case103_good_log_title:0 "The Refugee's Unfinished Loan: a workable ruling"
 kehillah_bet_din_case103_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the refugee's unfinished loan dispute."
