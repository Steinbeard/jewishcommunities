l_english:
 # Jewish Cultures map and native Jewish cultures, 2026-11-08
 # (docs/implementation/2026-11-08-jewish-cultures-map.md).

 kehillah_jewish_cultures_map:0 "Jewish Cultures"
 kehillah_jewish_cultures_map_desc:0 "#T Jewish Cultures#!\nThe Jewish culture native to each land: the culture a Jew born or settled there is raised in. Where Jews are the county's own people, their culture is shown instead.\n #EMP Blue#!: Ashkenazi\n #EMP Pale blue#!: Canaani\n #EMP Lavender#!: Provenci\n #EMP Ochre#!: Italki\n #EMP Teal#!: Romaniote\n #EMP Magenta#!: Sephardi\n #EMP Terracotta#!: Musta'arabi\n #EMP Amber#!: Ma'aravi\n #EMP Wine#!: Teimani\n #EMP Gold#!: Yerushalmi\n #EMP Brown#!: Bavli\n #EMP Olive#!: Juhuri\n #EMP Sand#!: Radhanite\n #EMP Green#!: Kochini\n #EMP Red#!: Beta Israel\n #EMP Pink#!: another Jewish culture\n\n#weak The map changes as cultures spread and new ones arise. Hover a county to see its culture.#!"

 KEHILLAH_JEWISH_CULTURES_MAP_TOOLTIP:0 "#T [ROOT.Province.GetCounty.GetName]#!\n#EMP Jewish culture#!: [ROOT.Province.GetCounty.GetTitle.MakeScope.Var('kehillah_local_jewish_culture').Culture.GetName]"
 KEHILLAH_JEWISH_CULTURES_MAP_TOOLTIP_NONE:0 "#T [ROOT.Province.GetCounty.GetName]#!\n#weak No Jewish culture is native here.#!"
 KEHILLAH_RITES_MAP_TOOLTIP_CULTURE:0 "#T [ROOT.Province.GetCounty.GetName]#!\n#EMP Jewish culture#!: [ROOT.Province.GetCounty.GetTitle.MakeScope.Var('kehillah_local_jewish_culture').Culture.GetName]\n#weak No Kehillah lives here.#!"

