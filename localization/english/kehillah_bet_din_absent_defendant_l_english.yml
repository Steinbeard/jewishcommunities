l_english:
 kehillah_bet_din.0871.t:0 "The Unavailable Defendant"
 kehillah_bet_din.0871.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a trader who left town on the eve of a hearing. [kbd_litigant_b.GetFirstName] is the claimant and fears another delay. A relative offers to answer for the absent trader, but the letter naming that relative is sealed. The court must keep the claim alive without inventing consent."
 kehillah_bet_din.0871.a:0 "Hear the relative as the trader's full agent."
 kehillah_bet_din.0871.a.tt:0 "The case proceeds, but the relative may lack authority to bind the trader."
 kehillah_bet_din.0871.b:0 "Preserve the claim and verify the letter."
 kehillah_bet_din.0871.b.tt:0 "Verification costs a hearing day but protects both parties."
 kehillah_bet_din.0871.c:0 "Judge against the trader for failing to appear."
 kehillah_bet_din.0871.c.tt:0 "A validly appointed agent could make default judgment unfair."
 kehillah_din_source_87:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_87_tt:0 "Mishnah Sanhedrin 3:1 gives the judges a textual point of reference. It cannot establish the relative's actual authority."
 kehillah_din_combo_87:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_87_tt:0 "The judges preserve both parties' interests while checking the relative's actual authority."
 kehillah_bet_din.0874.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0874.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0874.outcome_1:0 "The court lets the relative settle the case."
 kehillah_bet_din.0874.outcome_2:0 "The court secures the claim and checks the trader's appointment letter."
 kehillah_bet_din.0874.outcome_3:0 "The court rules against the absent trader."
 kehillah_bet_din.0874.fact_true:0 "The letter appoints the relative only to carry documents. A full settlement exceeded the mandate."
 kehillah_bet_din.0874.fact_false:0 "The letter clearly authorizes representation. Default judgment ignored a party who had appeared through an agent."
 kehillah_bet_din.0874.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0874.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0874.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case87_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case87_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case87_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_din_proposed_87_1:0 "The ruling proposed so far: $kehillah_bet_din.0871.a$"
 kehillah_din_proposed_87_2:0 "The ruling proposed so far: $kehillah_bet_din.0871.b$"
 kehillah_din_proposed_87_3:0 "The ruling proposed so far: $kehillah_bet_din.0871.c$"
