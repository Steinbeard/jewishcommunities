l_english:
 # V43 slice 4 (2026-10-14): the children.
 kehillah_children.0001.t:0 "The Children"
 kehillah_children.0001.desc:0 "[ROOT.Char.MakeScope.Var('kehillah_children_count_ref').GetValue|0] of our children are in the household of [kehillah_children_keeper.GetTitledFirstName]. They have been given new names. [kehillah_children_keeper.GetSheHe|U] says they belong to [kehillah_children_keeper.GetHerHis] faith now, and will be raised in it.\n\nOn feast days the children are taken to the church, and their mothers stand outside to see them go in."
 kehillah_children.0001.a:0 "Go to [kehillah_children_keeper.GetTitledFirstName] and ask for them."
 kehillah_children.0001.b:0 "Offer silver for them."
 kehillah_children.0001.c:0 "Appeal to [kehillah_children_lord.GetTitledFirstName]."
 kehillah_children.0001.d:0 "We cannot bring them back."
 kehillah_children_given_back:0 "The children come home"
 kehillah_children_kept:0 "The door is closed"
 kehillah_children_kept_silver:0 "The silver is taken, and the door is closed"
 kehillah_children_lord_orders:0 "The lord orders them returned"
 kehillah_children_lord_will_not:0 "The lord will not interfere"
 kehillah_children_returned_tt:0 "The children come back to their families and their faith."
 kehillah_children.0010.t:0 "A Child Is Missing"
 kehillah_children.0010.desc:0 "[kehillah_stolen_one.GetFirstName]'s mother woke to an empty bed. The Christian girl who helped in the house was gone too.\n\nBy evening they knew where. The porter at [kehillah_child_keeper.GetTitledFirstName]'s house says a child was brought to the gate before dawn, and baptized at the morning Mass."
 kehillah_children.0010.a:0 "We will get [kehillah_stolen_one.GetHerHim] back."
 kehillah_children.0010.b:0 "Hold [kehillah_stolen_one.GetHerHis] mother. There is nothing to say."
