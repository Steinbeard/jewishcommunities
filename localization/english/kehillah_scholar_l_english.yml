l_english:
 kehillah_scholar_study.desc: "When I enter the [ROOT.Char.GetFaith.HouseOfWorship], [chaplain.GetFirstName] beckons me over to an open book.\n\n\"The author says we can come to love the Lord by contemplating creation. But what of the person who keeps the commandments faithfully and has never opened a book of philosophy?\" [chaplain.GetSheHe|U] moves a lamp between us and makes room for me on the bench."
 kehillah_scholar_study.a: "Let us read the passage together."
