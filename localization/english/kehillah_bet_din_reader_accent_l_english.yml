l_english:
 kehillah_bet_din.0441.t:0 "The Reader's Disputed Accent"
 kehillah_bet_din.0441.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a new rabbi who teaches a different pronunciation for the public reading. [kbd_litigant_b.GetFirstName] speaks for the inherited reader, whose pupils know the old sounds. Neither side disputes the written text. The judges must decide how the congregation may learn without turning every reading into a contest of authority."
 kehillah_bet_din.0441.a:0 "Require the new pronunciation at the next reading."
 kehillah_bet_din.0441.a.tt:0 "The rabbi's approach is clear, but strong resistance could split the readers."
 kehillah_bet_din.0441.b:0 "Hold teaching sessions and ask the congregation to choose."
 kehillah_bet_din.0441.b.tt:0 "Teaching costs time and coin; it lets both groups hear the difference before a permanent rule."
 kehillah_bet_din.0441.c:0 "Forbid the new teaching in public."
 kehillah_bet_din.0441.c.tt:0 "The old reader keeps the lectern, but a receptive congregation may lose useful learning."
 kehillah_din_source_44:0 "Cite a mastered Zeraim work and hear the readers."
 kehillah_din_source_44_tt:0 "Mishnah Berakhot 2:3 discusses a reader's audible recitation. It does not choose this congregation's pronunciation."
 kehillah_din_combo_44:0 "Have a scholar and steward organize lessons without interrupting worship."
 kehillah_din_combo_44_tt:0 "The judges keep the reading orderly while testing whether the community wants change."
 kehillah_bet_din.0444.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0444.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0444.outcome_1:0 "The court orders the new pronunciation for the next public reading."
 kehillah_bet_din.0444.outcome_2:0 "The court arranges lessons and hears regular readers before changing practice."
 kehillah_bet_din.0444.outcome_3:0 "The court keeps the inherited pronunciation and bars the proposed change."
 kehillah_bet_din.0444.fact_true:0 "Most regular readers oppose immediate change. Imposition would turn a lesson into a factional quarrel."
 kehillah_bet_din.0444.fact_false:0 "The readers welcome instruction and can learn the new sounds. A ban would silence a wanted teaching."
 kehillah_bet_din.0444.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0444.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0444.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case44_one_tt:0 "Immediate imposition costs substantial Stability."
 kehillah_din_case44_two_tt:0 "Lessons and consultation cost some Stability."
 kehillah_din_case44_three_tt:0 "A ban costs less now but may reject desired instruction."
 kehillah_bet_din_case44_great_log_title:0 "The Reader's Disputed Accent: a well-supported ruling"
 kehillah_bet_din_case44_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s reading-practice complaint."
 kehillah_bet_din_case44_good_log_title:0 "The Reader's Disputed Accent: a workable ruling"
 kehillah_bet_din_case44_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s reading-practice complaint."
 kehillah_bet_din_case44_poor_log_title:0 "The Reader's Disputed Accent: a disputed ruling"
 kehillah_bet_din_case44_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s reading-practice complaint."
