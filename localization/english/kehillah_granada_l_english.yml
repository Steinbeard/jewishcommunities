l_english:
 rule_kehillah_popular_crusades:0 "Popular Crusades against the Jews"
 setting_kehillah_popular_crusades_dynamic:0 "#high Dynamic#!"
 setting_kehillah_popular_crusades_dynamic_desc:0 "When a Catholic crusade is called, a preacher may raise a host that goes from one Jewish community to the next."
 setting_kehillah_popular_crusades_off:0 "#high Off#!"
 setting_kehillah_popular_crusades_off_desc:0 "No popular crusade turns on the Jewish communities."
 rule_kehillah_historical_crises:0 "Historical Crises at Game Start"
 setting_kehillah_historical_crises_on:0 "#high On#!"
 setting_kehillah_historical_crises_on_desc:0 "Crises that befell real communities soon after the start date may come, unless the player prevents them: Granada, 30 December 1066."
 setting_kehillah_historical_crises_off:0 "#high Off#!"
 setting_kehillah_historical_crises_off_desc:0 "No scripted historical crisis at game start."
 kehillah_granada.0001.t:0 "The Verses Reach the Street"
 kehillah_granada.0001.desc:0 "Copies of Abu Ishaq's verses are passing through Granada. Their author, a Muslim jurist as well as a poet, argues that the Jews have forfeited their protection by exercising authority over Muslims. The verses call for their killing and the seizure of their wealth.\n\nAt the palace, men who oppose your appointments repeat his complaints about Jewish power. In the quarter, the elders ask whether their shops and homes will answer for your office. They want to know what you intend to do.\n\nThe emir can forbid the recitations. More guards might protect the quarter if words become violence. A discreet approach to the lord of [GetTitleByKey('c_almeria').GetNameNoTier] could secure a refuge. But a letter seeking another lord's protection could be twisted into evidence of disloyalty."
 kehillah_granada.0001.a:0 "Ask [kehillah_granada_emir.GetTitledFirstName] to forbid the recitations."
 kehillah_granada.0001.b:0 "Pay for more guards at the palace and in the quarter."
 kehillah_granada.0001.c:0 "Seek a discreet promise of refuge in [GetTitleByKey('c_almeria').GetNameNoTier]."
 kehillah_granada.0001.d:0 "We will not answer him. The emir knows our service."
 kehillah_granada_silenced:0 "The emir forbids the recitations"
 kehillah_granada_silenced_desc:0 "The emir forbids the recitations."
 kehillah_granada_silenced_tt:0 "The verses can no longer be recited openly. The unrest may subside, although your opponents remain at court."
 kehillah_granada_not_silenced:0 "The emir declines to intervene"
 kehillah_granada_not_silenced_desc:0 "The emir declines to intervene."
 kehillah_granada_not_silenced_tt:0 "The recitations continue without a public rebuke from the emir."
 kehillah_granada_guarded:0 "More guards take their posts"
 kehillah_granada_guarded_tt:0 "The additional guards will reduce the harm if the quarter is attacked."
 kehillah_granada_not_guarded:0 "The promised men do not arrive"
 kehillah_granada_not_guarded_tt:0 "You have paid, but the quarter has gained no reliable protection."
 kehillah_granada_escape_route:0 "A promise of refuge"
 kehillah_granada_escape_route_tt:0 "Contacts in [GetTitleByKey('c_almeria').GetNameNoTier] arrange a way out of Granada if you need to flee."
 kehillah_granada_plot_discovered:0 "Your letter reaches the emir"
 kehillah_granada_plot_discovered_tt:0 "Your opponents present the approach to [GetTitleByKey('c_almeria').GetNameNoTier] as evidence of treason. The emir becomes less well disposed toward the Jews, and the attack will come sooner and cause greater harm."
 kehillah_granada.0002.t:0 "The Emir's Confidence"
 kehillah_granada.0002.desc:0 "A conversation stops as you enter the palace. The men turn to greet you, but one leaves before you can ask what they were discussing.\n\nThe accusation has reached your servants: you are said to have arranged the death of Buluggin, the emir's son. Now your opponents claim that you are bargaining with the lord of [GetTitleByKey('c_almeria').GetNameNoTier] to help him seize Granada. An old charge and a new rumor are being repeated as proof of each other.\n\n[kehillah_granada_emir.GetTitledFirstName] has not dismissed you. You can ask him to hear your defense, or remind him of what your father did for his house. Either will be noticed by the people who depend on you."
 kehillah_granada.0002.a:0 "Ask [kehillah_granada_emir.GetTitledFirstName] to hear your defense."
 kehillah_granada.0002.b:0 "Arrange horses and a guide for the road to Lucena."
 kehillah_granada.0002.c:0 "Remain at your post and continue the work of government."
 kehillah_granada.0002.a.flavor:0 "Stand before him and answer every charge, with his court listening."
 kehillah_granada.0002.d.flavor:0 "Name the debt his house owes yours, and let him feel its weight."
 kehillah_granada.0002.c.flavor:0 "Give the rumors no audience, and let your work answer them."
 kehillah_granada_elders_warned:0 "The elders are warned"
 kehillah_granada_believed:0 "The emir accepts your assurance"
 kehillah_granada_believed_desc:0 "The emir accepts your assurance."
 kehillah_granada_believed_tt:0 "A quarter he trusts suffers less if it is attacked"
 kehillah_granada_disbelieved:0 "The audience ends without an assurance"
 kehillah_granada_disbelieved_desc:0 "The audience ends without an assurance."
 kehillah_granada_flight_ready_tt:0 "Horses, a guide and a hiding place improve your chance of escaping if the quarter is attacked."
 kehillah_granada.0004.t:0 "For the Moment, Peace"
 kehillah_granada.0004.desc:0 "The emir's prohibition has held. The recitations have ceased, and the crowds your servants feared have not gathered. At the palace, you are still given petitions to read and accounts to settle.\n\nYour opponents have not left Granada. For now, however, the quarter is open for business and your household can remain at home."
 kehillah_granada.0004.a:0 "Let us return to the work before us."
 kehillah_granada.0005.t:0 "The Palace and the Quarter"
 kehillah_granada.0005.desc:0 "Before dawn, a servant wakes you with news of soldiers gathering below the palace. They are shouting that the vizier has betrayed the emir. Townspeople join them as they move through the streets.\n\nFrom the Jewish quarter comes another messenger. Shops are being broken open. Families are carrying their children toward the synagogue, looking for somewhere the crowd cannot reach.\n\nThe men outside demand you. The people in the quarter are asking for protection."
 kehillah_granada.0005.a:0 "Send word to the elders. We must act."
 kehillah_granada.0021.t:0 "The Sanhaja Mobilize"
 kehillah_granada.0021.desc:0 "The Sanhaja commanders have begun arming their followers and summoning men from the villages around Granada. Abu Ishaq's call for your death is being recited in the barracks.\n\n[kehillah_granada_emir.GetTitledFirstName] has given no order to attack you, yet [kehillah_granada_emir.GetHerHis] soldiers are preparing to act without [kehillah_granada_emir.GetHerHis] leave. While they muster, you can strengthen the quarter's defenses and seek protection."
 kehillah_granada.0021.a:0 "We must prepare the quarter."
 kehillah_mob.0003.flee:0 "Flee, and hide."
 kehillah_granada_fled:0 "You get away"
 kehillah_granada_fled_tt:0 "You escape Granada. The community must face the attack without you."
 kehillah_granada_found:0 "You are found"
 kehillah_granada_found_tt:0 "Your hiding place is betrayed. The attackers are looking for the vizier."

 # V43 slice 1 (2026-10-14): Joseph ha-Nagid's family, and Granada seen from the rest of Sepharad.
 nick_kehillah_ha_nagid:0 "ha-Nagid"
 nick_kehillah_ha_nagid_desc:0 "The Nagid: the head of the Jews of the realm, appointed by its ruler."

 kehillah_granada.0006.t:0 "The Road to Lucena"
 kehillah_granada.0006.desc:0 "Your wife comes to you while Azariah is at his lessons. She asks whether you have heard from Lucena.\n\nThere are scholars there who knew her father, Nissim of Kairouan. They could receive her and the boy until the trouble in Granada passes. She has begun putting aside clothes for the journey, but has told Azariah nothing.\n\nSending them away would put them beyond the city's unrest. Keeping them beside you would reassure a household already watching every visitor at the gate."
 kehillah_granada.0006.a:0 "Send them both to Lucena."
 kehillah_granada.0006.b:0 "Keep the household together in Granada."
 kehillah_granada.0006.c:0 "Send Azariah with his tutor. His mother stays with me."
 kehillah_granada_son_sent_tt:0 "Azariah goes to Lucena."
 kehillah_granada_family_sent_tt:0 "Your wife and son go to Lucena."

 kehillah_granada.0007.t:0 "The City Gate"
 kehillah_granada.0007.desc:0 "Joseph ibn Naghrilla was found hiding in the palace and killed. His body was displayed at the city gate. Afterwards, the attackers turned upon the Jewish quarter.\n\nHe had succeeded Samuel as vizier and Nagid ten years before. Those who had brought their petitions to his door now come to you."
 kehillah_granada.0007.desc_fled:0 "\n\nSurvivors from his household reached Lucena, where the community has received them."
 kehillah_granada.0007.desc_sent:0 "\n\nAzariah survives his father."
 kehillah_granada.0007.desc_none:0 ""
 kehillah_granada.0007.a:0 "May his memory be a blessing."

 kehillah_granada.0010.t:0 "A Letter from Granada"
 kehillah_granada.0010.desc:0 "Letters from Granada arrive with a merchant traveling north. Some ask for books; others seek an introduction to Joseph ibn Naghrilla.\n\nJoseph is both vizier to the emir Badis and Nagid of the Jews in his realm. His father Samuel commanded the emir's armies and supported scholars across the Jewish world. Joseph inherited his offices and has continued that patronage.\n\nOne correspondent adds a warning. The Sanhaja chiefs, members of the Berber establishment on which the dynasty depends, resent the minister's influence. Badis has kept Joseph in office. The writer hopes he will continue to do so."
 kehillah_granada.0010.a:0 "May God keep him."

 kehillah_granada.0011.t:0 "The Poem Travels"
 kehillah_granada.0011.desc:0 "A correspondent in Granada encloses verses by Abu Ishaq of Elvira, a Muslim jurist and poet. They address the emir Badis and attack his appointment of a Jewish vizier.\n\nAbu Ishaq argues that the Jews have exceeded the protection granted to them by exercising authority over Muslims. He calls for punishment and the seizure of their wealth. Our correspondent says the verses are being copied and recited in the city.\n\nJoseph may already know what is being said. A letter from you would at least show that the other communities are paying attention."
 kehillah_granada.0011.a:0 "Write to Joseph, and tell him to be careful."
 kehillah_granada.0011.b:0 "Burn it."

 kehillah_granada.0012.t:0 "What They Say in Granada"
 kehillah_granada.0012.desc:0 "The latest letter from Granada concerns the palace. Joseph's opponents are repeating the charge that he caused the death of Buluggin, the emir's son. They also accuse him of bargaining with the lord of [GetTitleByKey('c_almeria').GetNameNoTier] to help him seize the city.\n\nOur correspondent cannot establish what has passed between the courts. What worries him is that the accusations against the minister are being repeated as accusations against the Jews. Families without any connection to the palace are asking whether they should leave."
 kehillah_granada.0012.a:0 "God protect the Jews of Granada."

 kehillah_granada.0013.t:0 "News from Granada"
 kehillah_granada.0013.desc_fell:0 "News has arrived from Granada. Attackers entered the palace and killed Joseph ha-Nagid. His body was displayed at the city gate, and the Jewish quarter was attacked.\n\nThe letters name households looking for missing relatives and survivors seeking a place to stay. None gives a reliable count of the dead."
 kehillah_granada.0013.desc_escaped:0 "News has arrived from Granada. A crowd entered the palace looking for Joseph ha-Nagid, but he had escaped. The Jewish quarter was attacked.\n\nThe letters ask where survivors might find shelter. They do not yet say where Joseph has gone."
 kehillah_granada.0013.desc_spared:0 "News has arrived from Granada. The Jewish quarter has been attacked, and Joseph ha-Nagid is reported alive.\n\nThe letters were written in haste. Some seek missing relatives; others ask which roads are safe for people leaving the city."
 kehillah_granada.0013.desc_family:0 "\n\nSurvivors from his household reached Lucena, where the community has received them."
 kehillah_granada.0013.desc_none:0 ""
 kehillah_granada.0013.a:0 "We must find out who needs help."
 Elyasaf:0 "Elyasaf"
 Hannah:0 "Hannah"

 kehillah_granada.0008.t:0 "Your Father's Office"

 KEHILLAH_SANHAJA:0 "#italic A group of Berber tribes from North Africa. Badis’s Zirid dynasty belonged to the Sanhaja and relied on their chiefs and soldiers to rule Granada.#!"
 kehillah_granada.0008.desc:0 "Ten years after your father Samuel's death, you hold both of the offices he held in Granada. As Nagid you lead the Jews of the realm. As vizier you run the emir's government, a rare place for a Jew in a Muslim court, and not everyone here is glad of it.\n\nTwo petitions lie beside your accounts. The elders ask for copies of the Talmud for their students. A village asks the emir to settle a dispute over a canal. The first you can answer as Nagid. The second you carry to the palace, where [kehillah_granada_emir.GetTitledFirstName] expects his vizier to answer it as well.\n\nWhen the emir asks for your ruling on the canal, one of his [Glossary( 'Sanhaja', 'KEHILLAH_SANHAJA' )] chiefs speaks up. “Must every petition in Granada pass through this family?”\n\nThe emir pushes the petition toward you. “This one must.”"

 kehillah_granada.0008.a:0 "The petitions will not answer themselves."

 kehillah_granada.0018.t:0 "Crisis: Sinister Verses"


 kehillah_granada.0018.desc_opening:0 "Many Muslims in the taifa of [GetTitleByKey('d_granada').GetNameNoTier] have long resented a Jew in power, and of late it has grown sharper.\n\n"
 kehillah_granada.0018.desc_poet:0 "A clerk lays a poem before you. He heard it recited in the town square by Abu Ishaq of Elvira, a scholar of Islamic law and a professed enemy of the Jews, who says the Jews have risen above their station."
 kehillah_granada.0018.desc_copy:0 "A clerk lays a poem before you. He heard it recited in the town square. It is the work of Abu Ishaq of Elvira, a scholar of Islamic law and a professed enemy of the Jews, and it says the Jews have risen above their station."
 kehillah_granada.0018.desc_close:0 "\n\n#italic Do not think killing them is treachery;\ntreachery is leaving them to run riot.#!\n\n“People were cheering along,” the clerk says, “and some were prominent men of the [Glossary( 'Sanhaja', 'KEHILLAH_SANHAJA' )].” Handled badly, this could end in violence against the Jews of the realm."

 kehillah_granada.0018.a:0 "The elders must see this."
 kehillah_granada.0018.b:0 "Burn it. Repeating it will only give it a wider hearing."
 kehillah_granada.0018.c:0 "Lay it before [kehillah_granada_emir.GetTitledFirstName]."

 kehillah_granada.0018.a.flavor:0 "Every household hears it from you first, not from the street."
 kehillah_granada.0018.b.flavor:0 "One copy burned, the rest quietly gathered in, and no answer given."
 kehillah_granada.0018.c.flavor:0 "Ask him to forbid the recitations, before the very men who cheered them."
 kehillah_granada.0018.a.tt:0 "A forewarned quarter suffers less if it is attacked"
 kehillah_granada.0018.c.tt:0 "His ban keeps working for you while the crisis lasts"
 kehillah_granada_burned:0 "The talk dies away"
 kehillah_granada_burned_desc:0 "The talk dies away."
 kehillah_granada_not_burned:0 "Copies keep passing from hand to hand"
 kehillah_granada_not_burned_desc:0 "Copies keep passing from hand to hand."

 kehillah_Abu_Ishaq_of_Elvira:0 "Abu Ishaq of Elvira"
