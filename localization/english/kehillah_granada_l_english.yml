l_english:
 rule_kehillah_popular_crusades:0 "Popular Crusades against the Jews"
 setting_kehillah_popular_crusades_dynamic:0 "#high Dynamic#!"
 setting_kehillah_popular_crusades_dynamic_desc:0 "When a Catholic crusade is called, a preacher may raise a host that goes from one Jewish community to the next."
 setting_kehillah_popular_crusades_off:0 "#high Off#!"
 setting_kehillah_popular_crusades_off_desc:0 "No popular crusade turns on the Jewish communities."
 rule_kehillah_historical_crises:0 "Historical Crises at Game Start"
 setting_kehillah_historical_crises_on:0 "#high On#!"
 setting_kehillah_historical_crises_on_desc:0 "Crises that befell real communities soon after the start date may come, unless the player prevents them: Granada, 30 December 1066."
 setting_kehillah_historical_crises_off:0 "#high Off#!"
 setting_kehillah_historical_crises_off_desc:0 "No scripted historical crisis at game start."
 kehillah_granada.0001.t:0 "The Poem of Abu Ishaq"
 kehillah_granada.0001.desc:0 "The faqih Abu Ishaq of Elvira has written a poem, and it is being recited in the mosques and the markets: that the emir has made a Jew the master of the believers, that the Jew sits in a palace of marble while the faithful go hungry, that the land would be cleansed if the Jews were slaughtered.\n\nYour father Samuel served the emir's house for thirty years and was buried with honour. You are not your father, and the Sanhaja chiefs at court have never forgiven you for it."
 kehillah_granada.0001.a:0 "Ask [kehillah_granada_emir.GetTitledFirstName] to silence the poet."
 kehillah_granada.0001.b:0 "Double the guard on the palace and the quarter."
 kehillah_granada.0001.c:0 "Seek a friend in Almeria, in case the worst comes."
 kehillah_granada.0001.d:0 "He is a poet. Poets rail."
 kehillah_granada_silenced:0 "The emir forbids the poem"
 kehillah_granada_silenced_tt:0 "The poem is no longer recited openly. The danger may pass -- or it may only go underground."
 kehillah_granada_not_silenced:0 "The emir shrugs"
 kehillah_granada_not_silenced_tt:0 "The poem goes on being recited."
 kehillah_granada_guarded:0 "The guard is doubled"
 kehillah_granada_guarded_tt:0 "If a mob comes, it will find armed men waiting. The harm it can do is less."
 kehillah_granada_not_guarded:0 "The men cannot be trusted"
 kehillah_granada_not_guarded_tt:0 "The silver is spent, and the guard is no stronger."
 kehillah_granada_escape_route:0 "A friend in Almeria"
 kehillah_granada_escape_route_tt:0 "If the worst comes, there is a road out of the city and a door that will open."
 kehillah_granada_plot_discovered:0 "The letter is found"
 kehillah_granada_plot_discovered_tt:0 "Your enemies say you have plotted with Almeria against the emir. The emir's outlook on the Jews #N -10#!, and the night will come sooner, and worse."
 kehillah_granada.0002.t:0 "Whispers at Court"
 kehillah_granada.0002.desc:0 "The Sanhaja chiefs no longer lower their voices when you pass. It is said in the palace that you mean to betray the emir, or to poison his son; it is said in the markets that the Jews are rich on the blood of believers. Your servants are afraid."
 kehillah_granada.0002.a:0 "Go before [kehillah_granada_emir.GetTitledFirstName] and swear your loyalty."
 kehillah_granada.0002.b:0 "Quietly make ready a flight to Lucena."
 kehillah_granada.0002.c:0 "I am the vizier of Granada. Let them whisper."
 kehillah_granada_believed:0 "The emir believes you"
 kehillah_granada_believed_tt:0 "The emir's favour is renewed. If the worst comes, the harm will be less."
 kehillah_granada_disbelieved:0 "The emir says nothing"
 kehillah_granada_disbelieved_tt:0 "He hears you out, and you cannot tell what he thinks."
 kehillah_granada_flight_ready_tt:0 "Horses, a guide and a hiding place are ready, if they are needed."
 kehillah_granada.0004.t:0 "The Year Ends Quietly"
 kehillah_granada.0004.desc:0 "The year has ended, and the poem is not heard in the markets any more. The Sanhaja chiefs bide their time. For now, Granada is quiet."
 kehillah_granada.0004.a:0 "Blessed is He who has spared us."
 kehillah_granada.0005.t:0 "The Night of the Sanhaja"
 kehillah_granada.0005.desc:0 "It is the thirtieth of December. Before dawn the shouting starts in the streets below the palace: the Sanhaja soldiers and the people of the city, with torches, crying the lines of Abu Ishaq's poem. They are coming for the vizier, and for every Jew in Granada."
 kehillah_granada.0005.a:0 "God of Abraham, help us."
 kehillah_mob.0003.flee:0 "Flee, and hide."
 kehillah_granada_fled:0 "You get away"
 kehillah_granada_fled_tt:0 "You escape the city in the dark. You will live -- the community must face the night without you."
 kehillah_granada_found:0 "You are found"
 kehillah_granada_found_tt:0 "The hiding place is betrayed. The mob is looking for you above all."

 # V43 slice 1 (2026-10-14): Joseph ha-Nagid's family, and Granada seen from the rest of Sepharad.
 nick_kehillah_ha_nagid:0 "ha-Nagid"
 nick_kehillah_ha_nagid_desc:0 "The Nagid: the head of the Jews of the realm, appointed by its ruler."

 kehillah_granada.0006.t:0 "Azariah"
 kehillah_granada.0006.desc:0 "Azariah is still a child. He has his grandfather's habit of reading at the table, and his mother lets him.\n\nShe has heard the poem too. She does not speak of it. Instead she asks whether the road to Lucena is good at this time of year. Lucena is a town of Jews, with a yeshiva and walls of its own, three days' ride from Granada."
 kehillah_granada.0006.a:0 "Send them to Lucena before the winter."
 kehillah_granada.0006.b:0 "They stay. A Naghrilla does not run."
 kehillah_granada.0006.c:0 "Send the boy with his tutor. His mother stays with me."
 kehillah_granada_son_sent_tt:0 "Azariah goes to Lucena."
 kehillah_granada_family_sent_tt:0 "Your wife and son go to Lucena."

 kehillah_granada.0007.t:0 "The City Gate"
 kehillah_granada.0007.desc:0 "They found Joseph in the palace, where he had hidden, and killed him there. In the morning his body hung on the city gate. The crowd that had come to see it went down into the Jewish quarter afterwards.\n\nHe was thirty-one. His father had served the emirs of Granada for thirty years."
 kehillah_granada.0007.desc_fled:0 "\n\nHis widow and Azariah got out of the city in the dark, and reached Lucena."
 kehillah_granada.0007.desc_sent:0 "\n\nAzariah was in Lucena already."
 kehillah_granada.0007.desc_none:0 ""
 kehillah_granada.0007.a:0 "May his memory be a blessing."

 kehillah_granada.0010.t:0 "A Letter from Granada"
 kehillah_granada.0010.desc:0 "A merchant from Granada brings letters, and news with them.\n\nThe Jews of Granada are led by Joseph ibn Naghrillah, whom they call ha-Nagid, as they called his father. Samuel ha-Nagid served the emirs Habbus and Badis for thirty years. He was their vizier, he led their armies in the field, and he wrote Hebrew poems that are copied as far away as Kairouan. When he died, Badis gave his offices to the son.\n\nThe merchant says that Joseph keeps a greater house than his father did, and that the Sanhaja chiefs at court do not like taking orders from a Jew."
 kehillah_granada.0010.a:0 "May God keep him."

 kehillah_granada.0011.t:0 "The Poem Travels"
 kehillah_granada.0011.desc:0 "A poem from Granada has reached us, copied out by a merchant who thought we should see it. It was written by Abu Ishaq of Elvira, a faqih who wanted Joseph's office for himself.\n\nIt says that the emir has made a Jew the master of the believers. It says that the Jews grow rich while the faithful go hungry, and that it would be no sin to kill them. It is said to be recited in the mosques of Granada."
 kehillah_granada.0011.a:0 "Write to Joseph, and tell him to be careful."
 kehillah_granada.0011.b:0 "Burn it."

 kehillah_granada.0012.t:0 "What They Say in Granada"
 kehillah_granada.0012.desc:0 "The emir's son Buluggin died two years ago, and in the palace they still say the vizier poisoned him. Now they say worse: that Joseph has written to al-Mu'tasim of Almeria, the emir's enemy, and means to hand him the city.\n\nNo one who writes to us believes it. They write that it does not matter what is true."
 kehillah_granada.0012.a:0 "God protect the Jews of Granada."

 kehillah_granada.0013.t:0 "News from Granada"
 kehillah_granada.0013.desc_fell:0 "On the thirtieth of December the crowd stormed the palace of Granada and killed the vizier, Joseph ha-Nagid. They hung his body on the city gate. Then they went down into the Jewish quarter.\n\nThe letters do not agree on how many were killed. They agree that few are left."
 kehillah_granada.0013.desc_escaped:0 "On the thirtieth of December the crowd stormed the palace of Granada, looking for the vizier, Joseph ha-Nagid. He was not there; he had left the city in the night. They went down into the Jewish quarter instead."
 kehillah_granada.0013.desc_spared:0 "On the thirtieth of December the crowd of Granada rose against the Jews. The vizier, Joseph ha-Nagid, is alive. The letters say little else yet."
 kehillah_granada.0013.desc_family:0 "\n\nHis widow and their son Azariah reached Lucena. The community there has taken them in."
 kehillah_granada.0013.desc_none:0 ""
 kehillah_granada.0013.a:0 "May their memory be a blessing."
 Elyasaf:0 "Elyasaf"
 Hannah:0 "Hannah"
