l_english:
 kehillah_bet_din.0781.t:0 "The Widow's Public Charity Pledge"
 kehillah_bet_din.0781.desc:0 "[kbd_litigant_a.GetFirstName] speaks for collectors who recorded a widow's large festival pledge. [kbd_litigant_b.GetFirstName] says she misunderstood the amount and cannot pay without selling household tools. The crowd cheered at the time; the written note has no witness to the sum. The court must protect both charity and informed consent."
 kehillah_bet_din.0781.a:0 "Collect the full public pledge now."
 kehillah_bet_din.0781.a.tt:0 "The fund receives money, but an uncomprehended amount could ruin the household."
 kehillah_bet_din.0781.b:0 "Provide interim charity and hear the widow and witnesses privately."
 kehillah_bet_din.0781.b.tt:0 "The poor are served while the court checks what was actually promised."
 kehillah_bet_din.0781.c:0 "Cancel the pledge entirely."
 kehillah_bet_din.0781.c.tt:0 "A clear, affordable pledge could be discarded without cause."
 kehillah_din_source_78:0 "Cite a mastered Nashim work and examine the evidence."
 kehillah_din_source_78_tt:0 "Mishnah Nedarim 1:1 gives the judges a textual point of reference. It cannot establish the widow's understanding and means."
 kehillah_din_combo_78:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_78_tt:0 "The judges preserve both parties' interests while checking the widow's understanding and means."
 kehillah_bet_din.0784.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0784.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0784.outcome_1:0 "The court orders full collection."
 kehillah_bet_din.0784.outcome_2:0 "The court advances relief and hears the widow away from the crowd."
 kehillah_bet_din.0784.outcome_3:0 "The court releases her from the entire pledge."
 kehillah_bet_din.0784.fact_true:0 "Witnesses disagree on the amount, and the widow understood a smaller gift. Full collection exceeded her undertaking."
 kehillah_bet_din.0784.fact_false:0 "Two witnesses confirm the full amount and her clear assent. Total cancellation ignored a deliberate pledge."
 kehillah_bet_din.0784.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0784.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0784.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case78_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case78_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case78_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
