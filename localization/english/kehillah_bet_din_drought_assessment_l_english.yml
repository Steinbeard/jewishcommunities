l_english:
 kehillah_bet_din.0601.t:0 "The Drought Assessment"
 kehillah_bet_din.0601.desc:0 "[kbd_litigant_a.GetFirstName] speaks for irrigated landowners who challenge a levy for neighbors ruined by drought. [kbd_litigant_b.GetFirstName] speaks for farmers whose seed grain is gone. The elders say an old mandate permits emergency relief; the landowners say it required their vote. Planting cannot wait for a season of argument."
 kehillah_bet_din.0601.a:0 "Cancel the levy and return collected coin."
 kehillah_bet_din.0601.a.tt:0 "Landowners are protected, but a valid emergency mandate would leave farms unseeded."
 kehillah_bet_din.0601.b:0 "Provide seed now and read the mandate with taxpayers."
 kehillah_bet_din.0601.b.tt:0 "Seed is supplied while the court checks authority and ability to pay."
 kehillah_bet_din.0601.c:0 "Enforce the full levy without another meeting."
 kehillah_bet_din.0601.c.tt:0 "Farmers receive relief quickly, but an unapproved levy may divide the town."
 kehillah_din_source_60:0 "Cite a mastered Nezikin work and inspect the levy mandate."
 kehillah_din_source_60_tt:0 "Mishnah Bava Batra 1:5 frames common burdens. It does not replace this community's voting rule."
 kehillah_din_combo_60:0 "Have a scholar and steward supply seed while checking consent."
 kehillah_din_combo_60_tt:0 "The judges protect planting and the legitimacy of the levy."
 kehillah_bet_din.0604.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0604.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0604.outcome_1:0 "The court cancels the assessment and returns payments."
 kehillah_bet_din.0604.outcome_2:0 "The court funds seed and calls landowners to examine the mandate."
 kehillah_bet_din.0604.outcome_3:0 "The court enforces the full emergency levy."
 kehillah_bet_din.0604.fact_true:0 "The elders' mandate expressly authorizes drought relief. Cancellation abandoned a valid common duty."
 kehillah_bet_din.0604.fact_false:0 "The mandate requires a taxpayers' vote that never occurred. Full enforcement exceeded the elders' authority."
 kehillah_bet_din.0604.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0604.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0604.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case60_one_tt:0 "Cancellation costs substantial Prosperity."
 kehillah_din_case60_two_tt:0 "Seed and consultation cost some Prosperity."
 kehillah_din_case60_three_tt:0 "Enforcement costs less now but may lack consent."
 kehillah_bet_din_case60_great_log_title:0 "The Drought Assessment: a well-supported ruling"
 kehillah_bet_din_case60_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s drought levy."
 kehillah_bet_din_case60_good_log_title:0 "The Drought Assessment: a workable ruling"
 kehillah_bet_din_case60_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s drought levy."
 kehillah_bet_din_case60_poor_log_title:0 "The Drought Assessment: a disputed ruling"
 kehillah_bet_din_case60_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s drought levy."
