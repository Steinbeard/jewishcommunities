l_english:
 kehillah_bet_din.0931.t:0 "The Witness Who Benefited"
 kehillah_bet_din.0931.desc:0 "[kbd_litigant_a.GetFirstName] relies on a witness to a disputed property transfer. [kbd_litigant_b.GetFirstName] says the witness was promised a share if the claim succeeds. The promise is said to be in a separate note. The court must learn whether the witness is independent before making his words decide ownership."
 kehillah_bet_din.0931.a:0 "Accept the witness and award the property."
 kehillah_bet_din.0931.a.tt:0 "A promised share could color the testimony."
 kehillah_bet_din.0931.b:0 "Inspect the note and seek independent proof."
 kehillah_bet_din.0931.b.tt:0 "The note and corroboration cost time but address the exact risk."
 kehillah_bet_din.0931.c:0 "Exclude the witness and dismiss the claim."
 kehillah_bet_din.0931.c.tt:0 "An independent witness might be discarded on rumor."
 kehillah_din_source_93:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_93_tt:0 "Mishnah Sanhedrin 3:3 gives the judges a textual point of reference. It cannot establish whether the witness was promised a share."
 kehillah_din_combo_93:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_93_tt:0 "The judges preserve both parties' interests while checking whether the witness was promised a share."
 kehillah_bet_din.0934.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0934.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0934.outcome_1:0 "The court awards the claim on the witness's account."
 kehillah_bet_din.0934.outcome_2:0 "The court asks for the alleged promise and other witnesses."
 kehillah_bet_din.0934.outcome_3:0 "The court rejects the witness and closes the property case."
 kehillah_bet_din.0934.fact_true:0 "A signed note promises the witness part of the property. Immediate reliance ignored his interest."
 kehillah_bet_din.0934.fact_false:0 "No promise exists, and other records confirm the transfer. Dismissal threw away sound evidence."
 kehillah_bet_din.0934.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0934.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0934.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case93_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case93_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case93_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case93_great_log_title:0 "The Witness Who Benefited: a well-supported ruling"
 kehillah_bet_din_case93_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the witness who benefited dispute."
 kehillah_bet_din_case93_good_log_title:0 "The Witness Who Benefited: a workable ruling"
