l_english:

 # Court-chaplain seat names for the Jewish faiths that have no rabbis.
 # Selected by common/customizable_localization/kehillah_council_title_override.txt;
 # the Rabbinic names stay in replace/kehillah_jewish_council_names_l_english.yml.

 # Samaritan: priests are Kohanim (the head of the faith is the Kohen Gadol).
 councillor_court_chaplain_samaritan_county:0 "Kohen"
 councillor_court_chaplain_samaritan_county_possessive:0 "Kohen's"
 councillor_court_chaplain_samaritan_duchy:0 "Kohen"
 councillor_court_chaplain_samaritan_duchy_possessive:0 "Kohen's"
 councillor_court_chaplain_samaritan_kingdom:0 "Chief Kohen"
 councillor_court_chaplain_samaritan_kingdom_possessive:0 "Chief Kohen's"
 councillor_court_chaplain_samaritan_empire:0 "Chief Kohen"
 councillor_court_chaplain_samaritan_empire_possessive:0 "Chief Kohen's"

 # Karaite: scholars are Hakhamim.
 councillor_court_chaplain_karaite_county:0 "Court Hakham"
 councillor_court_chaplain_karaite_county_possessive:0 "Court Hakham's"
 councillor_court_chaplain_karaite_duchy:0 "Hakham"
 councillor_court_chaplain_karaite_duchy_possessive:0 "Hakham's"
 councillor_court_chaplain_karaite_kingdom:0 "Chief Hakham"
 councillor_court_chaplain_karaite_kingdom_possessive:0 "Chief Hakham's"
 councillor_court_chaplain_karaite_empire:0 "Chief Hakham"
 councillor_court_chaplain_karaite_empire_possessive:0 "Chief Hakham's"
