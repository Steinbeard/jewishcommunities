l_english:
 kehillah_agobardism:0 "Agobardism"
 kehillah_agobardism_adj:0 "Agobardist"
 kehillah_agobardism_adherent:0 "Agobardist"
 kehillah_agobardism_adherent_plural:0 "Agobardists"
 kehillah_agobardism_desc:0 "Named for Agobard of Lyon, who pressed the Carolingian court to curb Jewish influence. This new rite is hostile to Jews and teaches that Jews should be excluded from Christian society and compelled to accept baptism."
 kehillah_amulonianism:0 "Amulonianism"
 kehillah_amulonianism_adj:0 "Amulonian"
 kehillah_amulonianism_adherent:0 "Amulonian"
 kehillah_amulonianism_adherent_plural:0 "Amulonians"
 kehillah_amulonianism_desc:0 "Named for Amulo of Lyon, whose writings argued for severe restrictions on Jews. This new rite carries that hostility further, seeking to exclude Jews from Christian society and compel their conversion."
 kehillah_sisebutianism:0 "Sisebutianism"
 kehillah_sisebutianism_adj:0 "Sisebutian"
 kehillah_sisebutianism_adherent:0 "Sisebutian"
 kehillah_sisebutianism_adherent_plural:0 "Sisebutians"
 kehillah_sisebutianism_desc:0 "Named for the Visigothic king Sisebut, who ordered the forced baptism of Jews in his realm. This new rite holds that a Christian ruler may compel conversion and exclude those who refuse."
 kehillah_chrysostomianism:0 "Chrysostomianism"
 kehillah_chrysostomianism_adj:0 "Chrysostomian"
 kehillah_chrysostomianism_adherent:0 "Chrysostomian"
 kehillah_chrysostomianism_adherent_plural:0 "Chrysostomians"
 kehillah_ilbirism:0 "Ilbirism"
 kehillah_ilbirism_adj:0 "Ilbiri"
 kehillah_ilbirism_adherent:0 "Ilbiri"
 kehillah_ilbirism_adherent_plural:0 "Ilbiris"
 kehillah_ilbirism_desc:0 "Named for the Elvira jurist and poet Abu Ishaq al-Ilbiri, who wrote against the Jews who held high office in Granada. This new rite is hostile to Jews: it holds that their protected status is forfeit, and that they must convert or leave."
 kehillah_umarism:0 "Umarism"
 kehillah_umarism_adj:0 "Umari"
 kehillah_umarism_adherent:0 "Umari"
 kehillah_umarism_adherent_plural:0 "Umaris"
 kehillah_umarism_desc:0 "Named for the Pact of Umar, the old terms imposed on non-Muslim subjects. This new rite is hostile to Jews: it enforces those terms to the point of ending their protection, and demands that they convert or leave."
 kehillah_mutawakkilism:0 "Mutawakkilism"
 kehillah_mutawakkilism_adj:0 "Mutawakkili"
 kehillah_mutawakkilism_adherent:0 "Mutawakkili"
 kehillah_mutawakkilism_adherent_plural:0 "Mutawakkilis"
 kehillah_mutawakkilism_desc:0 "Named for the Abbasid caliph al-Mutawakkil, who decreed humiliating restrictions on Jews and Christians. This new rite is hostile to Jews: it carries those decrees further, abolishing their protected status and demanding that they convert or leave."
 kehillah_chrysostomianism_desc:0"Named for John Chrysostom, whose sermons condemned Jewish worship and Christians who took part in it. This new rite invokes his words in a harsher teaching of exclusion and forced conversion."
