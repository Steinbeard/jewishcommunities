l_english:
 # Sefer languages (2026-11-10, docs/spec/2026-11-10-sefer-languages.md).
 # Hebrew is vanilla's language_israelite, already named "Hebrew".

 KEHILLAH_LIB_ROW_LANGUAGE:0 "Language"
 # By kehillah_lib_fluency_<work>: 1 known, 0 not (revision 4: no in-between).
 KEHILLAH_LIB_FLUENCY_1:0 " · #P you know it#!"
 KEHILLAH_LIB_FLUENCY_0:0 " · #N unknown to you#!"

 # The chance a reading masters a book (kehillah_lib_mastery_chance_<work>).
 KEHILLAH_LIB_ROW_MASTERY:0 "Mastery"
 KEHILLAH_LIB_CHANCE_SUFFIX:0 "% chance to master it"
 KEHILLAH_LIB_CHANCE_BD_HEADER:0 "Chance to master: #high [ValueBreakdown.GetValue|0]%#!"
 KEHILLAH_LIB_CHANCE_BD_NOTE:0 "The chance that one reading masters this book. A reading that falls short can be tried again."
 KEHILLAH_LIB_CHANCE_TERM_FORMAT:0 "$KEY$"
 KEHILLAH_LIB_CHANCE_BASE:0 "Base"
 KEHILLAH_LIB_CHANCE_LEARNING:0 "Your [learning|E]"
 KEHILLAH_LIB_CHANCE_LITURGICAL:0 "Its language, a liturgical tongue of your [faith|E] you are still learning"
 KEHILLAH_LIB_CHANCE_YESHIVA:0 "You study at a yeshiva"
 KEHILLAH_LIB_CHANCE_DAYYAN:0 "Your Dayyan knows its language and studies it with you"
 KEHILLAH_LIB_CHANCE_FOREIGN:0 "You do not know its language"
 KEHILLAH_LIB_CHANCE_DEPTH_PARSHANUT:0 "Your depth in Parshanut"
 KEHILLAH_LIB_CHANCE_DEPTH_TALMUDICS:0 "Your depth in Talmudics"
 KEHILLAH_LIB_CHANCE_DEPTH_HASHKAFA:0 "Your depth in Hashkafa"
 KEHILLAH_LIB_CHANCE_DEPTH_KARAITE:0 "Your learning in Scripture"
 KEHILLAH_LIB_CHANCE_TALMUD_TORAH:0 "$tenet_talmud_torah_name$"
 KEHILLAH_LIB_CHANCE_TENET_FOR:0 "It argues for your [tenet|E]"
 KEHILLAH_LIB_CHANCE_TENET_AGAINST:0 "It argues against your [tenet|E]"
 KEHILLAH_LIB_CHANCE_REREAD:0 "You have mastered it before"
 KEHILLAH_LIB_CHANCE_GUIDED:0 "A guided course"

 kehillah_language_learned_toast:0 "A Tongue of the Sages"

 kehillah_sefer.0203.t:0 "In What Tongue?"
 kehillah_sefer.0203.desc:0 "The sages wrote in the holy tongue, and the Gemara speaks Aramaic. But the words come quickest in the language of home, the one spoken at the table and in the market."
 kehillah_sefer.0203.hebrew:0 "In Hebrew, the holy tongue."
 kehillah_sefer.0203.hebrew.tt:0 "Any Jewish scholar can read it"
 kehillah_sefer.0203.aramaic:0 "In Aramaic, the tongue of the Gemara."
 kehillah_sefer.0203.aramaic.tt:0 "Any student of the Talmud can read it"
 kehillah_sefer.0203.vernacular:0 "In the tongue of home."
 kehillah_sefer.0203.vernacular.ease.tt:0 "The writing comes easier: a better book"
 kehillah_sefer.0203.vernacular.readers.tt:0 "Only readers of the [GetPlayer.GetCulture.GetName] tongue can read it with ease"
 kehillah_sefer.0203.vernacular.standing.tt:0 "No royal court speaks this tongue: the book starts one step lower among the sefarim, and can rise no higher than #high $KEHILLAH_STANDING_6$#!"
 kehillah_sefer.0203.vernacular.court.tt:0 "A royal court speaks this tongue: the book can rise as high as #high $KEHILLAH_STANDING_7$#!"
 kehillah_sefer.0203.vernacular.great.tt:0 "A great royal court speaks this tongue: the book can rise as high as #high $KEHILLAH_STANDING_8$#!"

 # 2026-11-10, second pass: one row of the chance tooltip, and the language
 # tooltip by fluency (kehillah_lib_fluency_<work>: 1 known, 0 not).
 KEHILLAH_LIB_CHANCE_BD_TERM:0 "[ValueBreakdown.GetValue|=+0]%"
 KEHILLAH_LIB_LANG_TT_1:0 "You know this [language|E]: it is your mother tongue, or one you have learned."
 KEHILLAH_LIB_LANG_TT_0:0 "You do not know this [language|E]. Learn it from someone who speaks it, through the #high $learn_language$#! [scheme|E]. If it is a liturgical tongue of your [faith|E], every book you master in it brings you closer to knowing it."
