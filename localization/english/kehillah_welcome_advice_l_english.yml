l_english:
 action_kehillah_welcome_advice:0 "$open_tutorial_lesson$$kehillah_welcome_advice_community$"
 action_kehillah_welcome_advice_desc:0 "Learn how to lead a Jewish community."
 action_kehillah_welcome_advice_click:0 "$click_to_open_lesson$"
 kehillah_welcome_advice:0 "Advice: Leading a Kehillah"
 kehillah_welcome_advice_community:0 "Leading a Kehillah"
 kehillah_welcome_advice_community_desc:0 "You lead a community, not a land. Your authority rests on the trust of your people and the charter of your host, and your seat is the Jewish Quarter of a city you do not rule."
 kehillah_welcome_advice_pillars:0 "The Three Pillars"
 kehillah_welcome_advice_pillars_desc:0 "Prosperity, Stability and Greatness measure your community's health. Open the Realm tab to see where each one stands and what is moving it.\n\nWatch Stability most closely. A community that stays in deep trouble for long can collapse."
 kehillah_welcome_advice_quarter:0 "The Jewish Quarter"
 kehillah_welcome_advice_quarter_desc:0 "The Quarter is where your community builds: synagogue, beit midrash, countinghouse, mikvah and more. Each building serves the community in its own way, and the finest tiers open only as your pillars grow stronger."
 kehillah_welcome_advice_council:0 "Council and Households"
 kehillah_welcome_advice_council_desc:0 "Five officers carry the community's work, and each seat has its own tasks. Your Dayyan must be a rabbi; if the seat stands empty, use Seek a Rabbi.\n\nJewish families at your court form its households. They arrive when the community has room, and they leave when it is troubled."
 kehillah_welcome_advice_host:0 "Your Host"
 kehillah_welcome_advice_host_desc:0 "Your charter sets what your community may do, and your host's realm has its own policy on Jewish settlement. Either can change, so keep your Shtadlan working on your behalf.\n\nWhen real danger comes, a crisis opens in the Situations list. Its window shows what threatens you and how you can respond."
 kehillah_welcome_advice_succession:0 "After You"
 kehillah_welcome_advice_succession_desc:0 "Leadership passes by appointment, not inheritance. Candidates are judged on their merit and their family's standing, and you can endorse the one you trust.\n\nWhen you die, you continue as the community's new leader, whoever that is."
 kehillah_welcome_advice_first_moves:0 "Your First Moves"
 kehillah_welcome_advice_first_moves_desc:0 "Fill any empty council seats, then open your [decisions|E] and Set the Community's Goal. After that, Distribute Tzedakah when you can spare it, and Convene a Bet Din once your judges are ready."

 action_kehillah_road_advice:0 "$open_tutorial_lesson$$kehillah_road_advice_step$"
 action_kehillah_road_advice_desc:0 "Learn how a Jewish adventurer can found a community."
 action_kehillah_road_advice_click:0 "$click_to_open_lesson$"
 kehillah_road_advice:0 "Advice: A Community of Your Own"
 kehillah_road_advice_step:0 "A Community of Your Own"
 kehillah_road_advice_desc:0 "A learned Jewish leader on the road can settle and found a new community. Look for Found a Jewish Community among your [decisions|E]. It shows what you still need, including a place that will have you and Jewish followers to settle there."
