 kehillah_quarter_line:0 "\nIts quarter stood in [ROOT.Title.MakeScope.Var('kehillah_history_last_barony').Title.GetNameNoTierNoTooltip]."
 kehillah_cause_detail_banu_hilal:0 "\nThe Banu Hilal, Bedouin tribes sent west by the Fatimids, sacked the city. Its scholars and merchants fled to Mahdia and beyond."
 kehillah_cause_detail_almohad:0 "\nThe Almohads gave the Jews a choice of Islam, exile or death. Some converted outwardly; many fled north to Christian Spain or east to Egypt."
 kehillah_cause_detail_crusade:0 "\nCrusaders passing through attacked the community. Many were killed or forcibly baptized."
 kehillah_cause_detail_mob_named:0 "\nA mob led by [ROOT.Title.MakeScope.Var('kehillah_history_last_destroyer').Char.GetTitledFirstName] attacked the quarter, and the community did not recover."
