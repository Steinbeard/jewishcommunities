l_english:
 # Peoplehood doctrine, 2026-11-11 (docs/implementation/2026-11-11-peoplehood-doctrine.md).
 kehillah_peoplehood_name:0 "Peoplehood"
 kehillah_peoplehood_covenantal_name:0 "Covenantal Peoplehood"
 kehillah_peoplehood_covenantal_desc:0 "The covenant binds a people as well as a faith. Those born into Israel keep to its ways, and those who take up its faith are welcomed into its people."
 kehillah_peoplehood_open_name:0 "Open Peoplehood"
 kehillah_peoplehood_open_desc:0 "Faith in the God of Israel does not ask a people to set aside its own name, tongue or customs. Converts remain who they were."
 doctrine_parameter_kehillah_peoplehood_guards_hebrew_culture:0 "Leaving a Jewish culture for a non-Jewish one costs three times the usual prestige, as well as piety and stress, and AI characters will not do it"
 doctrine_parameter_kehillah_peoplehood_invites_hebrew_culture:0 "Followers of a non-Jewish culture may take the decision #V Join the Jewish People#!, and AI characters seek a Jewish culture"

 kehillah_join_hebrew_people_decision:0 "Join the Jewish People"
 kehillah_join_hebrew_people_decision_desc:0 "Our faith is Israel's, but our ways are still those of the nations. It is time we took our place among the Jewish people."
 kehillah_join_hebrew_people_decision_tooltip:0 "Take up the culture of the Jewish people closest to your own"
 kehillah_join_hebrew_people_decision_confirm:0 "We are of Israel"
 kehillah_join_hebrew_people_decision_effect_tt:0 "You and your children under 16 of your faith take up the culture of the Jewish people closest to your own culture's language, or else a Jewish culture native where you live or in your realm"

 KEHILLAH_PEOPLEHOOD_KEEPS_HEBREW_CULTURE:0 "Will not leave the Jewish people"
 KEHILLAH_PEOPLEHOOD_JOINS_HEBREW_CULTURE:0 "Wishes to join a Jewish people"

 kehillah_found_hebrew_people_decision_effect_tt:0 "No Jewish people lives near you or shares your tongue. Your culture is joined with your region's Jewish culture into a new Jewish people of the Israelite heritage, named for your own people; you and your children under 16 of your faith take it up, and your lands with you"
