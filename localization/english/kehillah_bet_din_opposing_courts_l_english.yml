l_english:
 kehillah_bet_din.0911.t:0 "The Two Courts' Opposing Rulings"
 kehillah_bet_din.0911.desc:0 "[kbd_litigant_a.GetFirstName] brings a local award for a shipment. [kbd_litigant_b.GetFirstName] brings an opposite award from another community. Both seals look sound; the dates are smudged. The court must decide which hearing had authority before collectors take the same goods twice."
 kehillah_bet_din.0911.a:0 "Enforce the local award immediately."
 kehillah_bet_din.0911.a.tt:0 "Local pride may outrun an earlier valid hearing elsewhere."
 kehillah_bet_din.0911.b:0 "Hold the goods and compare both court records."
 kehillah_bet_din.0911.b.tt:0 "Preserving goods costs time but avoids double enforcement."
 kehillah_bet_din.0911.c:0 "Enforce the distant award instead."
 kehillah_bet_din.0911.c.tt:0 "The distant court might have ruled after a binding local award."
 kehillah_din_source_91:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_91_tt:0 "Mishnah Sanhedrin 3:1 gives the judges a textual point of reference. It cannot establish the sequence and authority of these hearings."
 kehillah_din_combo_91:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_91_tt:0 "The judges preserve both parties' interests while checking the sequence and authority of these hearings."
 kehillah_bet_din.0914.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0914.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0914.outcome_1:0 "The court enforces its local award."
 kehillah_bet_din.0914.outcome_2:0 "The court holds the shipment while both registers are checked."
 kehillah_bet_din.0914.outcome_3:0 "The court enforces the distant award."
 kehillah_bet_din.0914.fact_true:0 "The distant court heard the claim first with both parties present. Local enforcement ignored that priority."
 kehillah_bet_din.0914.fact_false:0 "The local hearing came first and both parties agreed to it. Distant enforcement displaced a settled award."
 kehillah_bet_din.0914.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0914.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0914.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case91_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case91_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case91_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
