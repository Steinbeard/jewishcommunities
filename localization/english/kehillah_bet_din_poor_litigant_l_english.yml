l_english:
 kehillah_bet_din.0941.t:0 "The Poor Litigant's Hearing"
 kehillah_bet_din.0941.desc:0 "[kbd_litigant_a.GetFirstName] asks for swift judgment on a loan. [kbd_litigant_b.GetFirstName] is a borrower who cannot pay for copies of old account records. A messenger can fetch them, but the creditor says delay invites evasion. The court must give each side a real hearing without letting poverty become a tactic for endless postponement."
 kehillah_bet_din.0941.a:0 "Judge the debt today on the creditor's papers."
 kehillah_bet_din.0941.a.tt:0 "The borrower may have a documented defense no one has seen."
 kehillah_bet_din.0941.b:0 "Grant a fixed delay and pay for the records."
 kehillah_bet_din.0941.b.tt:0 "A bounded delay costs the court but preserves both parties' chance to prove their case."
 kehillah_bet_din.0941.c:0 "Dismiss the creditor's claim for pressing too hard."
 kehillah_bet_din.0941.c.tt:0 "A valid debt could disappear as punishment for impatience."
 kehillah_din_source_94:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_94_tt:0 "Mishnah Sanhedrin 4:1 gives the judges a textual point of reference. It cannot establish what the borrower's records establish."
 kehillah_din_combo_94:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_94_tt:0 "The judges preserve both parties' interests while checking what the borrower's records establish."
 kehillah_bet_din.0944.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0944.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0944.outcome_1:0 "The court awards the creditor's demand at once."
 kehillah_bet_din.0944.outcome_2:0 "The court sets a short deadline and sends for the account copies."
 kehillah_bet_din.0944.outcome_3:0 "The court dismisses the creditor's claim."
 kehillah_bet_din.0944.fact_true:0 "The records include a receipt for part of the debt. Immediate judgment overstated what was owed."
 kehillah_bet_din.0944.fact_false:0 "No repayment appears in the records. Dismissal denied a valid claim."
 kehillah_bet_din.0944.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0944.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0944.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case94_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case94_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case94_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_din_proposed_94_1:0 "The ruling proposed so far: $kehillah_bet_din.0941.a$"
 kehillah_din_proposed_94_2:0 "The ruling proposed so far: $kehillah_bet_din.0941.b$"
