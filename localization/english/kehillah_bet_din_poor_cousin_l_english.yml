l_english:
 kehillah_bet_din.0361.t:0 "The Poor Cousin's Maintenance"
 kehillah_bet_din.0361.desc:0 "[kbd_litigant_a.GetFirstName] represents the children of a deceased householder. [kbd_litigant_b.GetFirstName] speaks for a disabled cousin who says the dead man promised support for life. The children can afford some help, but fear a permanent charge on the estate. The cousin has nowhere else to stay when winter arrives."
 kehillah_bet_din.0361.a:0 "Reject the lifelong charge and offer a single gift."
 kehillah_bet_din.0361.a.tt:0 "The estate remains solvent, but a proved promise would be broken."
 kehillah_bet_din.0361.b:0 "Provide shelter while the court checks the promise."
 kehillah_bet_din.0361.b.tt:0 "Shelter is immediate; the court pays to hear the witnesses and examine the accounts."
 kehillah_bet_din.0361.c:0 "Bind the estate to lifelong support now."
 kehillah_bet_din.0361.c.tt:0 "The cousin gains security, but the children could bear an obligation never made."
 kehillah_din_source_36:0 "Cite a mastered Nezikin work and examine the estate promise."
 kehillah_din_source_36_tt:0 "Mishnah Bava Batra 9:1 concerns resources left to dependents. It cannot establish whether this cousin was promised support."
 kehillah_din_combo_36:0 "Have a scholar and steward fund shelter and check the estate."
 kehillah_din_combo_36_tt:0 "The judges protect the cousin tonight while testing the claimed obligation."
 kehillah_bet_din.0364.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0364.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0364.outcome_1:0 "The court gives the cousin one payment and releases the estate from further support."
 kehillah_bet_din.0364.outcome_2:0 "The court arranges shelter and asks witnesses what the deceased promised."
 kehillah_bet_din.0364.outcome_3:0 "The court orders lifelong maintenance from the estate."
 kehillah_bet_din.0364.fact_true:0 "A witness and account entry confirm a lifelong promise. A single gift did not satisfy it."
 kehillah_bet_din.0364.fact_false:0 "No witness can support the promise, and the estate already carries debts. A permanent charge would be unjust."
 kehillah_bet_din.0364.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0364.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0364.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case36_one_tt:0 "A one-time gift costs substantial Prosperity."
 kehillah_din_case36_two_tt:0 "Shelter and inquiry cost some Prosperity."
 kehillah_din_case36_three_tt:0 "A permanent order costs less now but may burden the estate later."
 kehillah_bet_din_case36_great_log_title:0 "The Poor Cousin's Maintenance: a well-supported ruling"
 kehillah_bet_din_case36_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s maintenance claim."
 kehillah_bet_din_case36_good_log_title:0 "The Poor Cousin's Maintenance: a workable ruling"
 kehillah_bet_din_case36_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s maintenance claim."
 kehillah_bet_din_case36_poor_log_title:0 "The Poor Cousin's Maintenance: a disputed ruling"
 kehillah_bet_din_case36_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s maintenance claim."
