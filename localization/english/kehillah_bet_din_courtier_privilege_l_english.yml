l_english:
 kehillah_bet_din.0571.t:0 "The Courtier's Sealed Privilege"
 kehillah_bet_din.0571.desc:0 "[kbd_litigant_a.GetFirstName] presents a royal seal and says his estate is beyond the local court's reach. [kbd_litigant_b.GetFirstName] speaks for judges who suspect the seal was copied. The courtier's debtor seeks a hearing this week. The court must respect a genuine privilege without letting a forged mark silence its docket."
 kehillah_bet_din.0571.a:0 "Honor the seal and dismiss the local case."
 kehillah_bet_din.0571.a.tt:0 "A courtier is spared public dispute, but a false seal could defeat a valid claim."
 kehillah_bet_din.0571.b:0 "Preserve the claim and compare the seal with royal records."
 kehillah_bet_din.0571.b.tt:0 "The court pays for verification while protecting the debtor's place in the docket."
 kehillah_bet_din.0571.c:0 "Disregard the privilege and hear the case now."
 kehillah_bet_din.0571.c.tt:0 "The hearing proceeds, but a genuine privilege may be violated."
 kehillah_din_source_57:0 "Cite a mastered Nezikin work and verify jurisdiction."
 kehillah_din_source_57_tt:0 "Mishnah Bava Batra 1:5 offers a communal analogy. It cannot authenticate a royal seal."
 kehillah_din_combo_57:0 "Have a scholar and steward preserve the claim while checking the grant."
 kehillah_din_combo_57_tt:0 "The judges avoid both a forged exemption and an unauthorized hearing."
 kehillah_bet_din.0574.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0574.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0574.outcome_1:0 "The court dismisses the case under the presented seal."
 kehillah_bet_din.0574.outcome_2:0 "The court holds the claim open and sends for a comparison of seals."
 kehillah_bet_din.0574.outcome_3:0 "The court ignores the document and proceeds to judgment."
 kehillah_bet_din.0574.fact_true:0 "The seal differs from the royal register. Dismissal would have rewarded a forgery."
 kehillah_bet_din.0574.fact_false:0 "The register confirms the seal and its jurisdictional term. Immediate hearing exceeded the local court's authority."
 kehillah_bet_din.0574.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0574.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0574.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case57_one_tt:0 "Dismissal risks substantial Stability."
 kehillah_din_case57_two_tt:0 "Seal comparison costs some Stability."
 kehillah_din_case57_three_tt:0 "Immediate hearing costs less but may exceed authority."
 kehillah_bet_din_case57_great_log_title:0 "The Courtier's Sealed Privilege: a well-supported ruling"
 kehillah_bet_din_case57_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s sealed privilege."
