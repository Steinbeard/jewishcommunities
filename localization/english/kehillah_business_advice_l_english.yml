l_english:
 kehillah_business_advice_staff:0 "Next: appoint an eligible Ba’al Bayit to a vacant business before building more premises."
 kehillah_business_advice_no_operator:0 "Vacant premises need an eligible household. Check current Baalei Batim and their two-year business commitments before expanding."
 kehillah_business_advice_expand:0 "Spare household and room in Craft Row: consider an unbuilt dyers’, goldsmiths’ or tanners’ workshop. Review its price."
 kehillah_business_advice_develop:0 "Household wealth grows each season toward its outlook. Improve livelihoods, charter privileges and stewardship; keep premises matched to your available households."
 kehillah_business_economy_tt:0 "#T Households and businesses#!\nHousehold assets add [Character.MakeScope.ScriptValue('kehillah_bd_households_prosperity_value')|0] to the Affluence baseline. This is productive family wealth, separate from the leader’s income and personal gold.\n\nBusinesses operating: [Character.GetPrimaryTitle.MakeScope.ScriptValue('kehillah_business_staffed_count_value')|0]/[Character.GetPrimaryTitle.MakeScope.ScriptValue('kehillah_business_built_count_value')|0]\nUnassigned eligible households: [Character.MakeScope.ScriptValue('kehillah_business_unassigned_count_value')|0]\n\nA staffed business improves its household’s livelihood outlook and enables its goods and operating income. Wealth changes seasonally; staffing does not award instant Affluence. The Kahal House soft-limits standing, never earnings.\n\n[Character.Custom('KehillahBusinessNextStep')]"
 kehillah_business_domain_detail:0 "\n\n#high Households and businesses#!\nOperating premises: [ROOT.Char.GetPrimaryTitle.MakeScope.ScriptValue('kehillah_business_staffed_count_value')|0]/[ROOT.Char.GetPrimaryTitle.MakeScope.ScriptValue('kehillah_business_built_count_value')|0]. Unassigned eligible households: [ROOT.Char.MakeScope.ScriptValue('kehillah_business_unassigned_count_value')|0].\nFamily assets contribute to this baseline; business income is not a second Affluence reward. Staffing raises livelihood outlook, with wealth adjusting each season. Assessments split household earnings with the community.\n[ROOT.Char.Custom('KehillahBusinessNextStep')]"
 kehillah_business_domain_button:0 "Manage businesses"
 kehillah_business_domain_tooltip:0 "#T Manage businesses#!\nView operating households, vacant premises and native appointments.\n\n[Character.Custom('KehillahBusinessNextStep')]"
 action_kehillah_staff_business:0 "$action_kehillah_staff_business_label$"
 action_kehillah_staff_business_label:0 "A business has an eligible operator"
 action_kehillah_staff_business_desc:0 "[actor.Custom('KehillahBusinessStaffingOpportunity')]\n\nOne business per household. Appointments are unpaid; existing civic or religious office does not by itself exclude a Ba’al Bayit."
 action_kehillah_staff_business_click:0 "#I Click to open your Jewish Quarter, then select Businesses operating#!"
 action_kehillah_expand_crafts:0 "$action_kehillah_expand_crafts_label$"
 action_kehillah_expand_crafts_label:0 "Consider another craft workshop"
 action_kehillah_expand_crafts_desc:0 "Your existing businesses are staffed, a registered household is available, and Craft Row has a free internal slot. The charter permits construction and you have a planning reserve of [actor.MakeScope.ScriptValue('kehillah_business_craft_reserve_value')|0] [gold_i].\n\nConsider an unbuilt dyers’, goldsmiths’ or tanners’ workshop. The building inspector checks the final price and construction conditions; this suggestion does not start construction or spend gold."
 action_kehillah_expand_crafts_click:0 "#I Click to open the Quarter, then select Craft Row#!"
