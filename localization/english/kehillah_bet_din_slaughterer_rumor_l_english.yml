l_english:
 kehillah_bet_din.0341.t:0 "The Rumor Against the Slaughterer"
 kehillah_bet_din.0341.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a communal slaughterer whose trade has fallen after a butcher spread doubts about his knife. [kbd_litigant_b.GetFirstName] says the concern came from a real cut seen at the market. No one has kept the disputed carcass. The court must protect food and reputation without treating rumor as proof."
 kehillah_bet_din.0341.a:0 "Clear the slaughterer and rebuke the butcher now."
 kehillah_bet_din.0341.a.tt:0 "Reputation is restored quickly, but a real defect could leave unsafe practice unchecked."
 kehillah_bet_din.0341.b:0 "Inspect the knife and hear the market witnesses."
 kehillah_bet_din.0341.b.tt:0 "An inspection costs money and time; it can settle what witnesses actually observed."
 kehillah_bet_din.0341.c:0 "Suspend the slaughterer until confidence returns."
 kehillah_bet_din.0341.c.tt:0 "Public caution is strong, but a sound knife would make the suspension an unfair injury."
 kehillah_din_source_34:0 "Cite a mastered Kodashim work and inspect the knife."
 kehillah_din_source_34_tt:0 "Mishnah Chullin 1:1 introduces rules for slaughter. A mastered text cannot replace an examination of this knife and the witnesses."
 kehillah_din_combo_34:0 "Have a scholar and steward arrange an independent inspection."
 kehillah_din_combo_34_tt:0 "The judges protect the market while a qualified examiner checks the instrument."
 kehillah_bet_din.0344.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0344.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0344.outcome_1:0 "The court clears the slaughterer and orders the butcher to stop repeating the accusation."
 kehillah_bet_din.0344.outcome_2:0 "The court examines the knife and hears those who saw the disputed cut."
 kehillah_bet_din.0344.outcome_3:0 "The court suspends the slaughterer and asks another worker to serve the market."
 kehillah_bet_din.0344.fact_true:0 "A qualified inspection finds a flaw in the knife. Immediate vindication would have missed a real problem."
 kehillah_bet_din.0344.fact_false:0 "The knife passes inspection and witnesses disagree about the cut. Suspension damaged a trade on uncertain testimony."
 kehillah_bet_din.0344.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0344.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0344.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case34_one_tt:0 "Immediate vindication risks substantial Stability."
 kehillah_din_case34_two_tt:0 "Inspection costs some Stability."
 kehillah_din_case34_three_tt:0 "Suspension costs less now but harms a livelihood."
 kehillah_bet_din_case34_great_log_title:0 "The Rumor Against the Slaughterer: a well-supported ruling"
 kehillah_bet_din_case34_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s slaughterer complaint."
 kehillah_bet_din_case34_good_log_title:0 "The Rumor Against the Slaughterer: a workable ruling"
 kehillah_bet_din_case34_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s slaughterer complaint."
 kehillah_bet_din_case34_poor_log_title:0 "The Rumor Against the Slaughterer: a disputed ruling"
 kehillah_bet_din_case34_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s slaughterer complaint."
