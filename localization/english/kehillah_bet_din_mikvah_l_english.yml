l_english:
 kehillah_bet_din.0151.t:0 "The Failing Mikvah"
 kehillah_bet_din.0151.desc:0 "[kbd_litigant_a.GetFirstName], a trustee of the communal mikvah, says the bath is sound and needed every day. [kbd_litigant_b.GetFirstName], whose donation paid for its channel, says the join between its basins may leak. No one has inspected the masonry since the last repair. Closing the bath would burden the community; keeping an invalid bath open would be worse."
 kehillah_bet_din.0151.a:0 "Close the bath and rebuild the channel."
 kehillah_bet_din.0151.a.tt:0 "The argument relies on Stewardship. The bath closes until rebuilt, even if its channel was sound. Prosperity pays for the work."
 kehillah_bet_din.0151.b:0 "Inspect the join; repair it if it fails."
 kehillah_bet_din.0151.b.tt:0 "The argument relies on Learning and Talmudics. Use pauses while a qualified examination determines whether the channel is sound. A defect is repaired before the bath reopens."
 kehillah_bet_din.0151.c:0 "Keep the bath open unless a defect is proved."
 kehillah_bet_din.0151.c.tt:0 "The argument relies on Learning. This avoids unnecessary closure, but a genuine hidden defect makes the ruling unsound."
 kehillah_din_source_15:0 "Cite a mastered work on Tahorot and examine the water channel before reopening."
 kehillah_din_source_15_tt:0 "Available to a judge who has mastered a work covering #EMP Tahorot#!. Mishnah Mikvaot 6:1 says, 'כל המערב למקוה, כמקוה' ('Whatever joins with a mikvah is like the mikvah'). The court still has to establish whether this channel meets the applicable requirements."
 kehillah_din_combo_15:0 "Have a patient scholar and a practical judge inspect the channel together."
 kehillah_din_combo_15_tt:0 "Available to a learned judge who is Patient or experienced in Talmudics, with a judge skilled in Stewardship. The examination costs communal resources but avoids ruling from rumor."
 kehillah_bet_din.0154.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0154.desc:0 "The trustees and donor wait while the judges decide whether the bath may be used."
 kehillah_bet_din.0154.outcome_1:0 "The court closes the bath and orders the channel rebuilt. The work is costly, but no immersion depends on a disputed join while it proceeds."
 kehillah_bet_din.0154.outcome_2:0 "The court suspends use for a qualified inspection. The water and the channel are tested; any defect must be repaired before the bath reopens."
 kehillah_bet_din.0154.outcome_3:0 "The court keeps the bath open. The donor leaves unconvinced, and the channel has not been examined."
 kehillah_bet_din.0154.defect_found:0 "\n\nIn the days that follow, a mason finds a break in the join. The concern was real."
 kehillah_bet_din.0154.channel_sound:0 "\n\nIn the days that follow, the join holds. The donor's fear proves unfounded."
 kehillah_bet_din.0154.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0154.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0154.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case15_one_tt:0 "The bath closes for reconstruction. Prosperity pays the larger cost."
 kehillah_din_case15_two_tt:0 "The court inspects and repairs as needed. Prosperity pays the smaller cost."
 kehillah_din_case15_three_tt:0 "The bath remains open without inspection. A real defect sharply worsens the verdict."
 kehillah_bet_din_case15_great_log_title:0 "The Failing Mikvah: a well-supported ruling"
 kehillah_bet_din_case15_good_log_title:0 "The Failing Mikvah: a workable ruling"
 kehillah_bet_din_case15_poor_log_title:0 "The Failing Mikvah: a disputed ruling"
 kehillah_bet_din_case15_great_log:0 "[CHARACTER.GetTitledFirstName] resolved [TARGET_CHARACTER.GetFirstName]'s complaint about the mikvah after examining the channel."
 kehillah_bet_din_case15_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s mikvah complaint."
 kehillah_bet_din_case15_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling left [TARGET_CHARACTER.GetFirstName]'s mikvah complaint unsettled."
