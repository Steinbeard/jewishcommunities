 game_concept_kehillah_composer_onkelos_desc:0 "Traditionally credited with the Aramaic translation of the Torah, which took its form in layers."
 game_concept_kehillah_composer_palestinian_rabbinic_editors:0 "Palestinian rabbinic editors"
 game_concept_kehillah_composer_palestinian_rabbinic_editors_desc:0 "A collective work of the rabbinic schools of Roman and Byzantine Palestine."
 game_concept_kehillah_composer_rabbi_judah_ha_nasi:0 "Rabbi Judah ha-Nasi"
