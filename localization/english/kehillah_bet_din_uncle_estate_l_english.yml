l_english:
 kehillah_bet_din.0261.t:0 "The Uncle Who Controls the Estate"
 kehillah_bet_din.0261.desc:0 "[kbd_litigant_a.GetFirstName] speaks for an uncle who manages rent and silk profits left to children. [kbd_litigant_b.GetFirstName] speaks for their widowed mother, who says the promised maintenance has not reached them. The uncle presents a tidy account; the tenants remember paying more. The children need food before the books can be settled."
 kehillah_bet_din.0261.a:0 "Accept the uncle's account and close the complaint."
 kehillah_bet_din.0261.a.tt:0 "Administration stays orderly, but missing rent would leave the children unsupported."
 kehillah_bet_din.0261.b:0 "Provide interim support and compare the rents with tenants."
 kehillah_bet_din.0261.b.tt:0 "The children receive help while the court pays for a careful account."
 kehillah_bet_din.0261.c:0 "Remove the uncle and transfer the estate at once."
 kehillah_bet_din.0261.c.tt:0 "The mother's household gains control, but an honest guardian could be displaced without proof."
 kehillah_din_source_26:0 "Cite a mastered Nezikin work and examine the estate account."
 kehillah_din_source_26_tt:0 "Mishnah Bava Batra 9:1 concerns family resources and dependents. It cannot tell this court whether the uncle recorded every rent payment."
 kehillah_din_combo_26:0 "Have a scholar and steward hear the tenants together."
 kehillah_din_combo_26_tt:0 "One judge protects the children's needs while another reconciles rent and silk receipts."
 kehillah_bet_din.0264.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0264.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0264.outcome_1:0 "The court accepts the uncle's books. The mother must wait for the next payment."
 kehillah_bet_din.0264.outcome_2:0 "The court grants interim support and calls tenants to compare their payments with the account."
 kehillah_bet_din.0264.outcome_3:0 "The court replaces the uncle immediately and transfers the estate records."
 kehillah_bet_din.0264.fact_true:0 "Tenant receipts reveal rent omitted from the uncle's account. Dismissing the complaint would have harmed the children."
 kehillah_bet_din.0264.fact_false:0 "The tenants' receipts match the books. Immediate removal would have wronged a careful guardian."
 kehillah_bet_din.0264.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0264.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0264.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case26_one_tt:0 "Keeping the estate in place still costs communal support."
 kehillah_din_case26_two_tt:0 "Interim support and accounting cost some Prosperity."
 kehillah_din_case26_three_tt:0 "A transfer costs less now but may disrupt the children's income."
 kehillah_bet_din_case26_great_log_title:0 "The Uncle Who Controls the Estate: a well-supported ruling"
 kehillah_bet_din_case26_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s estate-maintenance complaint."
 kehillah_bet_din_case26_good_log_title:0 "The Uncle Who Controls the Estate: a workable ruling"
 kehillah_bet_din_case26_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s estate-maintenance complaint."
 kehillah_bet_din_case26_poor_log_title:0 "The Uncle Who Controls the Estate: a disputed ruling"
 kehillah_bet_din_case26_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s estate-maintenance complaint."
