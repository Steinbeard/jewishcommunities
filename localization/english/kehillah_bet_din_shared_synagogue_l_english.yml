l_english:
 kehillah_bet_din.0311.t:0 "Two Congregations, One Synagogue"
 kehillah_bet_din.0311.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a congregation that wants the earlier prayer hour in a jointly endowed synagogue. [kbd_litigant_b.GetFirstName] says a second congregation has used that hour for years. The founding deed is kept with the treasurer. Both groups need the room, and neither wants to be told its rite must disappear."
 kehillah_bet_din.0311.a:0 "Give the first congregation the early hour."
 kehillah_bet_din.0311.a.tt:0 "A clear schedule is quick, but a reserved hour could be taken from its intended users."
 kehillah_bet_din.0311.b:0 "Read the deed and schedule alternating services for now."
 kehillah_bet_din.0311.b.tt:0 "Alternating services are awkward and costly, yet preserve both groups while the deed is read."
 kehillah_bet_din.0311.c:0 "Keep the second congregation's old hours permanently."
 kehillah_bet_din.0311.c.tt:0 "Long usage is respected, but a deed granting shared hours would be ignored."
 kehillah_din_source_31:0 "Cite a mastered Moed work and inspect the endowment deed."
 kehillah_din_source_31_tt:0 "Mishnah Megillah 3:1 concerns communal sacred property. It does not supply the hours promised in this synagogue's deed."
 kehillah_din_combo_31:0 "Have a scholar and steward draw up a temporary shared schedule."
 kehillah_din_combo_31_tt:0 "The judges hear both rites and protect access while the deed is examined."
 kehillah_bet_din.0314.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0314.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0314.outcome_1:0 "The court awards the early hour to the first congregation. The other group must move."
 kehillah_bet_din.0314.outcome_2:0 "The court alternates the hour while the treasurer produces the founding deed."
 kehillah_bet_din.0314.outcome_3:0 "The court protects the second congregation's established hour and closes the schedule."
 kehillah_bet_din.0314.fact_true:0 "The deed reserves the early hour for the second congregation. Reassignment broke the endowment's terms."
 kehillah_bet_din.0314.fact_false:0 "The deed promises equal access. Permanent priority for one congregation denied the other its share."
 kehillah_bet_din.0314.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0314.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0314.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case31_one_tt:0 "Reassigning the hour spends substantial Stability."
 kehillah_din_case31_two_tt:0 "Alternating services cost some Stability."
 kehillah_din_case31_three_tt:0 "Permanent priority costs less now but risks a lasting split."
 kehillah_bet_din_case31_great_log_title:0 "Two Congregations, One Synagogue: a well-supported ruling"
 kehillah_bet_din_case31_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s synagogue-hour claim."
