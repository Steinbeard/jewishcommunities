l_english:
 kehillah_bet_din.0371.t:0 "The Pepper Cargo's Sea Loss"
 kehillah_bet_din.0371.desc:0 "[kbd_litigant_a.GetFirstName] represents an agent whose ship and entrusted pepper were lost at sea. [kbd_litigant_b.GetFirstName] speaks for the investor, who heard that some cargo was insured or unloaded before the storm. A sailor has returned, but the port accounts have not. The court must decide whether the loss belongs to trade risk or to a concealed transaction."
 kehillah_bet_din.0371.a:0 "Release the agent and cover the investor's loss."
 kehillah_bet_din.0371.a.tt:0 "The agent is spared, but hidden insurance could make the release unfair."
 kehillah_bet_din.0371.b:0 "Secure the claim and send for port accounts."
 kehillah_bet_din.0371.b.tt:0 "The court funds a search while the claim remains secured."
 kehillah_bet_din.0371.c:0 "Require the agent to repay the full cargo value."
 kehillah_bet_din.0371.c.tt:0 "The investor is protected, but a true sea loss could ruin an honest agent."
 kehillah_din_source_37:0 "Cite a mastered Nezikin work and check the entrusted cargo."
 kehillah_din_source_37_tt:0 "Mishnah Bava Metzia 3:1 concerns property entrusted to another. It cannot tell whether this ship's pepper was insured."
 kehillah_din_combo_37:0 "Have a scholar and steward trace the cargo and insurance."
 kehillah_din_combo_37_tt:0 "The judges preserve both claims while gathering port records."
 kehillah_bet_din.0374.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0374.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0374.outcome_1:0 "The court releases the agent and advances compensation to the investor."
 kehillah_bet_din.0374.outcome_2:0 "The court secures the claim and asks ports for cargo and insurance records."
 kehillah_bet_din.0374.outcome_3:0 "The court orders the agent to repay the cargo's full value."
 kehillah_bet_din.0374.fact_true:0 "A port record reveals insurance on a share of the pepper. Full release concealed a recovery."
 kehillah_bet_din.0374.fact_false:0 "The manifest and sailors confirm a total loss with no insurance. Full repayment punished a disaster."
 kehillah_bet_din.0374.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0374.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0374.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case37_one_tt:0 "Compensation costs substantial Prosperity."
 kehillah_din_case37_two_tt:0 "Security and inquiry cost some Prosperity."
 kehillah_din_case37_three_tt:0 "Immediate repayment costs less court money but may ruin an innocent trader."
 kehillah_bet_din_case37_great_log_title:0 "The Pepper Cargo's Sea Loss: a well-supported ruling"
 kehillah_bet_din_case37_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s lost pepper cargo."
 kehillah_bet_din_case37_good_log_title:0 "The Pepper Cargo's Sea Loss: a workable ruling"
 kehillah_bet_din_case37_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s lost pepper cargo."
 kehillah_bet_din_case37_poor_log_title:0 "The Pepper Cargo's Sea Loss: a disputed ruling"
 kehillah_bet_din_case37_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s lost pepper cargo."
