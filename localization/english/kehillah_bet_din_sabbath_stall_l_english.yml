l_english:
 kehillah_bet_din.0681.t:0 "The Sabbath Market Stall"
 kehillah_bet_din.0681.desc:0 "[kbd_litigant_a.GetFirstName] owns a stall left with a non-Jewish attendant on Sabbath. [kbd_litigant_b.GetFirstName] speaks for rivals who say the owner still directed sales through a messenger. The stall's agreement names rent, not who sets prices. The court must distinguish a closed owner's business from a disguised open one."
 kehillah_bet_din.0681.a:0 "Accept the attendant's arrangement as sufficient."
 kehillah_bet_din.0681.a.tt:0 "Trade continues, but hidden directions could make the arrangement a fiction."
 kehillah_bet_din.0681.b:0 "Inspect contracts, messages and actual sales."
 kehillah_bet_din.0681.b.tt:0 "The court pays for an inquiry without closing all trade."
 kehillah_bet_din.0681.c:0 "Forbid every such stall arrangement."
 kehillah_bet_din.0681.c.tt:0 "A blanket ban may punish lawful independent leases."
 kehillah_din_source_68:0 "Cite a mastered Moed work and examine the evidence."
 kehillah_din_source_68_tt:0 "Mishnah Shabbat 7:2 gives the judges a textual point of reference. It cannot establish who directed the Sabbath sales."
 kehillah_din_combo_68:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_68_tt:0 "The judges preserve both parties' interests while checking who directed the Sabbath sales."
 kehillah_bet_din.0684.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0684.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0684.outcome_1:0 "The court permits the stall to continue under its current agreement."
 kehillah_bet_din.0684.outcome_2:0 "The court calls the attendant and reads the week's messages and accounts."
 kehillah_bet_din.0684.outcome_3:0 "The court bans all attendant-run stalls on Sabbath."
 kehillah_bet_din.0684.fact_true:0 "Messages show the owner set prices and ordered sales that day. The paper lease concealed continuing business."
 kehillah_bet_din.0684.fact_false:0 "The attendant leased the stall independently and kept its gains. A blanket ban reached beyond this dispute."
 kehillah_bet_din.0684.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0684.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0684.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case68_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case68_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case68_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
