l_english:
 kehillah_bet_din.0881.t:0 "The Unqualified Third Judge"
 kehillah_bet_din.0881.desc:0 "[kbd_litigant_a.GetFirstName] defends a monetary panel's third judge. [kbd_litigant_b.GetFirstName] says that judge has never studied the rules needed for this case. The first two judges are respected; replacing the third will delay a crowded docket. The court must protect both quorum and competence."
 kehillah_bet_din.0881.a:0 "Keep the panel and hear the case today."
 kehillah_bet_din.0881.a.tt:0 "Speed may hide a genuine gap in the third judge's competence."
 kehillah_bet_din.0881.b:0 "Pause to test qualifications and seat a substitute if needed."
 kehillah_bet_din.0881.b.tt:0 "Review costs time but targets the actual concern."
 kehillah_bet_din.0881.c:0 "Dissolve every ruling this panel has made."
 kehillah_bet_din.0881.c.tt:0 "A qualified judge's earlier work could be discarded wholesale."
 kehillah_din_source_88:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_88_tt:0 "Mishnah Sanhedrin 1:1 gives the judges a textual point of reference. It cannot establish this judge's qualifications."
 kehillah_din_combo_88:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_88_tt:0 "The judges preserve both parties' interests while checking this judge's qualifications."
 kehillah_bet_din.0884.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0884.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0884.outcome_1:0 "The panel proceeds unchanged."
 kehillah_bet_din.0884.outcome_2:0 "The court checks the third judge's training before this hearing."
 kehillah_bet_din.0884.outcome_3:0 "The court sets aside the panel's past work."
 kehillah_bet_din.0884.fact_true:0 "The third judge lacks the required competence for monetary disputes. Proceeding ignored a real defect."
 kehillah_bet_din.0884.fact_false:0 "His training and record are sound. A blanket cancellation punished a valid panel."
 kehillah_bet_din.0884.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0884.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0884.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case88_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case88_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case88_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_din_proposed_88_1:0 "The ruling proposed so far: $kehillah_bet_din.0881.a$"
 kehillah_din_proposed_88_2:0 "The ruling proposed so far: $kehillah_bet_din.0881.b$"
