l_english:
 kehillah_crisis_acknowledge_tt:0 "After you respond, the crisis begins."
 kehillah_crisis_intro.0001.t:0 "A Host Against the Community"
 kehillah_crisis_intro.0001.desc:0 "Word reaches the quarter that men are gathering to attack us. There has been no time to win the town to our side; we must prepare for an armed threat.\n\nThe elders look to you for an answer."
 kehillah_crisis_intro.0001.rising:0 "The rebellion has turned against the Jews. Men from the rebel camp are gathering into a host, and our community is their quarry.\n\nWe must prepare for an attack."
 kehillah_crisis_intro.0001.a:0 "Warn the quarter."
 action_kehillah_active_crisis:0 "A crisis threatens your community"
 action_kehillah_active_crisis_label:0 "Community Crisis"
 action_kehillah_active_crisis_desc:0 "Review the danger and your community's response."
 action_kehillah_active_crisis_click:0 "#I Click to view the crisis#!"
 action_kehillah_active_expulsion:0 "Your community faces expulsion"
 action_kehillah_active_expulsion_label:0 "Edict of Expulsion"
 action_kehillah_active_expulsion_desc:0 "The edict is in force. Review your response before the grace period ends."
 action_kehillah_active_expulsion_click:0 "#I Click to answer the edict#!"
