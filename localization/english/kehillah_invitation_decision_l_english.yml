l_english:
 # Invite Jewish Settlers (the Nagid spec section 6, 2026-10-30).
 kehillah_invite_jewish_settlers_decision:0 "Invite Jewish Settlers"
 kehillah_invite_jewish_settlers_decision_desc:0 "Our realm favors its Jews. Let it be known among their communities that settlers will find a welcome here, a place made ready for them, and charters on generous terms."
 kehillah_invite_jewish_settlers_decision_confirm:0 "Send the Invitation"
 kehillah_invite_jewish_settlers_decision_tooltip:0 "Invite Jewish communities within reach to send settlers to your realm"
 kehillah_invite_jewish_settlers_decision_effect_tt:0 "You name the best county of your domain for a Jewish community, and a letter goes to the Jewish communities, adventurers and merchant houses nearest it. The first to answer founds a community there. The call stands for #V 5#! years. Your realm stays open to Jewish settlers and exiles for #V 20#! years."
 kehillah_invite_jewish_settlers_already_open_tt:0 "Your invitation to Jewish settlers is still open"
 kehillah_invite_jewish_settlers_crisis_active_tt:0 "No Jewish community in your realm is facing an active anti-Jewish crisis"
