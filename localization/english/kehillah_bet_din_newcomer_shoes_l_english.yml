l_english:
 kehillah_bet_din.0511.t:0 "The Exclusion of a Newcomer"
 kehillah_bet_din.0511.desc:0 "[kbd_litigant_a.GetFirstName] speaks for established shoemakers who closed a migrant's stall. [kbd_litigant_b.GetFirstName] speaks for the newcomer, who brought tools and needs customers. The older craftsmen cite a settlement privilege. The document may protect apprenticeships, or it may truly reserve local sales."
 kehillah_bet_din.0511.a:0 "Enforce the craftsmen's exclusive market."
 kehillah_bet_din.0511.a.tt:0 "Older shops keep customers, but a narrow privilege would not justify exclusion."
 kehillah_bet_din.0511.b:0 "Let the newcomer sell temporarily while reading the privilege."
 kehillah_bet_din.0511.b.tt:0 "A temporary license costs administration while the text is checked."
 kehillah_bet_din.0511.c:0 "Open all shoe trade and dismiss the old claim."
 kehillah_bet_din.0511.c.tt:0 "The newcomer works freely, but a valid market grant might be broken."
 kehillah_din_source_51:0 "Cite a mastered Nezikin work and inspect the market grant."
 kehillah_din_source_51_tt:0 "Mishnah Bava Batra 1:5 offers an analogy for shared community obligations. It does not define this settlement privilege."
 kehillah_din_combo_51:0 "Have a scholar and steward provide a temporary stall and read the deed."
 kehillah_din_combo_51_tt:0 "The judges protect a livelihood while testing the old claim."
 kehillah_bet_din.0514.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0514.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0514.outcome_1:0 "The court closes the newcomer's stall under the claimed privilege."
 kehillah_bet_din.0514.outcome_2:0 "The court grants a temporary stall and asks for the founding document."
 kehillah_bet_din.0514.outcome_3:0 "The court opens the market to all shoemakers."
 kehillah_bet_din.0514.fact_true:0 "The privilege concerns apprentices, not sales. Exclusion went beyond its words."
 kehillah_bet_din.0514.fact_false:0 "The privilege clearly reserves this market for established members during its term. Unrestricted entry ignored it."
 kehillah_bet_din.0514.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0514.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0514.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case51_one_tt:0 "Exclusion costs substantial Stability."
 kehillah_din_case51_two_tt:0 "Temporary licensing costs some Stability."
 kehillah_din_case51_three_tt:0 "Open trade costs less now but may provoke a valid claim."
 kehillah_bet_din_case51_great_log_title:0 "The Exclusion of a Newcomer: a well-supported ruling"
 kehillah_bet_din_case51_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s market access."
 kehillah_bet_din_case51_good_log_title:0 "The Exclusion of a Newcomer: a workable ruling"
 kehillah_bet_din_case51_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s market access."
