 # --- 1066 ---
 bookmark_kehillah_fez_rif:0 "Yitzhak Alfasi"
 bookmark_kehillah_fez_rif_subheading:0 "The Rif, Kehillah of Fez"
 bookmark_kehillah_fez_rif_desc:0 "Yitzhak Alfasi is fifty-three. Born at Qal'at Hammad and trained at Kairouan under its last great teachers, he has made Fez a place students travel to. His digest of the Talmud's law is the book later generations will simply call 'the Rif'.\n\nFez is held by Zenata princes, and in the south the Almoravids are gathering strength. In the historical record they take the city within a decade. In 1088, denounced to the authorities, Alfasi flees to Spain and ends his life at the head of the academy of Lucena.\n\n#bold Keep the school alive in Fez, or prepare to carry it across the straits.#!"

 bookmark_kehillah_granada_david:0 "David ben Hezekiah"
 bookmark_kehillah_granada_david_subheading:0 "Son of the Exilarch, House of Hezekiah"
 bookmark_kehillah_granada_david_desc:0 "David is a son of Hezekiah, the last man to be both Exilarch and Gaon in Baghdad. When his father fell, David and a brother fled west and found a patron in Joseph ha-Nagid, who keeps them at his court in Granada.\n\nHe has the blood of the House of David and nothing else: no office, no community, no land. The Jews of Spain honor his line; the emir's court does not care. In the historical record a mob storms Granada on 30 December 1066, and at least one of the brothers ends up in the Christian north.\n\n#bold Find a place where a prince of the exile still matters.#!\n\n#N His name is not securely attested; David follows a later family tradition.#!"

 # --- 867 ---
 bookmark_kehillah_sura_amram:0 "Amram Gaon"
 bookmark_kehillah_sura_amram_subheading:0 "Gaon, Kehillah of Sura"
 bookmark_kehillah_sura_amram_desc:0 "Amram ben Sheshna heads the academy of Sura. Questions reach him from Jewish communities across the world, and his answers carry the force of law.\n\nWhen the Jews of Spain asked him how the prayers should be ordered, he sent them a complete prayer book, the Seder Rav Amram, the first of its kind. Every later siddur descends from it. The rival academy at Pumbedita and the Exilarch in Baghdad each claim a share of his authority.\n\n#bold Keep Sura the voice the whole Jewish world obeys.#!"

 bookmark_kehillah_tiberias_moshe:0 "Moshe ben Asher"
 bookmark_kehillah_tiberias_moshe_subheading:0 "The Masorete, Kehillah of Tiberias"
 bookmark_kehillah_tiberias_moshe_desc:0 "Moshe ben Asher belongs to a family of Masoretes in Tiberias, scholars who record how every word of the Bible is spelled, voweled and chanted.\n\nHis son Aharon will finish the work: the Aleppo Codex carries his vowels and accents, and the Ben Asher text becomes the standard for the whole Jewish world. In Bavel, rival Masoretes mark the text differently.\n\n#bold Bring the text to its final form, and see that the world accepts it.#!"

 bookmark_kehillah_oria_shefatiah:0 "Shefatiah ben Amittai"
 bookmark_kehillah_oria_shefatiah_subheading:0 "Poet and Leader, Kehillah of Oria"
 bookmark_kehillah_oria_shefatiah_desc:0 "Shefatiah ben Amittai leads the Jews of Oria, in Apulia. He is a poet of the synagogue and, in the chronicle his descendant Ahimaaz will write, a man who could face an emperor.\n\nBasil has been co-emperor in Constantinople since 866 and will soon rule alone. In the chronicle he summons Shefatiah to debate, and later orders the Jews of his empire baptized. Muslim emirs hold Bari, close by.\n\n#bold Protect Oria's people through the emperor's decree.#!"

 bookmark_kehillah_lucca_kalonymus:0 "Kalonymus of Lucca"
 bookmark_kehillah_lucca_kalonymus_subheading:0 "Kehillah of Lucca"
 bookmark_kehillah_lucca_kalonymus_desc:0 "Kalonymus leads a family of scholars and poets in Lucca, in Tuscany. Later Ashkenazi tradition remembers them as the family that carried Torah north to the Rhine.\n\nWhen they went, and why, is not known. One tradition says a king invited them; others put the move in the early tenth century. In this game the journey has not happened yet.\n\n#bold Build the house that will found Ashkenaz.#!\n\n#N A representative figure: no member of the family is securely known for 867.#!"

 bookmark_kehillah_kairouan_hananel:0 "Hananel of Kairouan"
 bookmark_kehillah_kairouan_hananel_subheading:0 "Kehillah of Kairouan"
 bookmark_kehillah_kairouan_hananel_desc:0 "Kairouan is the capital of Ifriqiya and the leading Jewish community between Egypt and Spain. Its merchants trade across the Mediterranean, and its scholars write to the Geonim of Bavel for rulings.\n\nThe academy that will make Kairouan famous is still generations away. Within a few years a stranger named Eldad will arrive here with stories of the lost tribes, and the community will ask Sura what to make of him.\n\n#bold Make Kairouan a school the East must answer as an equal.#!\n\n#N A representative figure: the community's leader in 867 is not known.#!"

 bookmark_kehillah_eldad:0 "Eldad ha-Dani"
 bookmark_kehillah_eldad_subheading:0 "The Traveller of Dan"
 bookmark_kehillah_eldad_desc:0 "Eldad says he is of the tribe of Dan, from a free Jewish kingdom beyond the rivers of Cush, where four of the lost tribes still live. He is young, and he has a long way to go.\n\nIn the historical record he reaches Kairouan around 880. The community, unsure whether to believe him, writes to the Gaon of Sura, who answers that his strange customs may be genuine. His stories travel further than he does.\n\n#bold Cross the known world, and make it believe you.#!"

 # --- 1178 ---
 bookmark_kehillah_fustat_rambam:0 "Moshe ben Maimon"
 bookmark_kehillah_fustat_rambam_subheading:0 "The Rambam, Kehillah of Fustat"
 bookmark_kehillah_fustat_rambam_desc:0 "Moshe ben Maimon is forty. Driven from Córdoba by the Almohads as a boy, he lived in Fez and the Land of Israel before settling in Fustat. His brother David, the merchant who supported him, has drowned in the Indian Ocean, and Moshe now earns his living as a physician.\n\nHe is finishing the Mishneh Torah, a code of all Jewish law in plain Hebrew. Its admirers will call it a revolution. Its critics, in Baghdad and Provence, will say it lets readers bypass the Talmud.\n\n#bold Finish the code, and defend it.#!"

 bookmark_kehillah_baghdad_samuel:0 "Shmuel ben Eli"
 bookmark_kehillah_baghdad_samuel_subheading:0 "Gaon, Kehillah of Baghdad"
 bookmark_kehillah_baghdad_samuel_desc:0 "Shmuel ben Eli heads the academy of Baghdad, heir to the Geonim. He claims authority over the Jewish communities from Persia to Syria, and he means to keep it.\n\nIn the historical record he clashes with Maimonides over the resurrection of the dead. The quarrel is also about who speaks for Jewish law: a Gaon in Baghdad, or a book anyone can read.\n\n#bold Make Baghdad's voice heard again across the Jewish world.#!"

 bookmark_kehillah_troyes_ri:0 "Yitzhak of Dampierre"
 bookmark_kehillah_troyes_ri_subheading:0 "The Ri, Kehillah of Troyes"
 bookmark_kehillah_troyes_ri_desc:0 "Yitzhak ben Shmuel, called the Ri, is a great-grandson of Rashi and a nephew of Rabbeinu Tam, whose school he now leads from Dampierre, a short ride from Troyes. Tradition says sixty students sat before him, each having mastered a different tractate.\n\nThe Tosafists argue every line of the Talmud anew, setting passage against passage until each contradiction is resolved. Their notes, the Tosafot, will be printed beside the Talmud for centuries.\n\n#bold Lead the Tosafists, and keep Champagne the heart of Talmud study.#!"

 bookmark_kehillah_speyer_judah:0 "Yehuda he-Hasid"
 bookmark_kehillah_speyer_judah_subheading:0 "The Pietist, Kehillah of Speyer"
 bookmark_kehillah_speyer_judah_desc:0 "Yehuda he-Hasid is about twenty-eight, the son of Shmuel he-Hasid and heir to the Kalonymus family's learning in Speyer. Around him the Hasidei Ashkenaz, the Pietists of Germany, are taking shape.\n\nThey ask more than the law asks: strict penitence, humility, hidden meanings in the prayers, and a constant watch for the will of God. Sefer Hasidim, the book of his circle, will guide them. In about 1195 he leaves for Regensburg.\n\n#bold Build a community of the pious that the Rhineland's troubles cannot break.#!"

 bookmark_kehillah_posquieres_raavad:0 "Avraham ben David"
 bookmark_kehillah_posquieres_raavad_subheading:0 "The Raavad, Kehillah of Posquières"
 bookmark_kehillah_posquieres_raavad_desc:0 "Avraham ben David leads the academy of Posquières, which he supports from his own fortune. He is a master of the Talmud, sharp-tongued and independent.\n\nWhen the Mishneh Torah reaches Provence he will answer it with the Hasagot, glosses that challenge Maimonides line by line. In his circle, and in his son Yitzhak the Blind, a new teaching about the hidden life of God is taking shape. It will be called Kabbalah.\n\n#bold Guard the tradition against new codes and new philosophies, while its hidden teaching grows.#!"

 bookmark_kehillah_toledo_shoshan:0 "Yosef ibn Shoshan"
 bookmark_kehillah_toledo_shoshan_subheading:0 "The Nasi, Kehillah of Toledo"
 bookmark_kehillah_toledo_shoshan_desc:0 "Yosef ibn Shoshan is nasi of Toledo, the leading Jew of the Castilian capital and high in the favor of Alfonso VIII's court. Toledo has been Christian for nearly a century, and its Jews have taken in many who fled the Almohads.\n\nThe court's favor has a price. The sources report a riot in Toledo in 1178, tied in later legend to the king's Jewish mistress. Abraham ibn Daud, the city's philosopher and historian, dies about 1180, said to have been killed for his faith.\n\n#bold Keep the court's favor, and keep the community safe from the street.#!"
