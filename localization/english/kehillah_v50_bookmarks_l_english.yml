 # V50 (docs/spec/v50-bookmark-rosters.md), 2026-10-21: the 867 and 1178
 # Kehillah start screens, the new 1066 cards, and their seats.

 bm_867_kehillah:0 "Age of the Geonim"
 bm_867_kehillah_desc:0 "In 867 the Jewish world still looks east. The Geonim of Sura and Pumbedita answer questions sent from Spain to Persia, and in Tiberias the Masoretes are fixing the text of the Bible itself.\n\nAt the edges, change is coming. Kairouan is growing into the West's first great center of learning. In southern Italy the communities of Apulia wait to see what the new co-emperor Basil will do with them, and in Lucca a family of scholars will one day carry Torah north across the Alps. Somewhere in Arabia a young man who calls himself a son of Dan is setting out to tell the world that the lost tribes still live.\n\n#bold Govern your community with wisdom, guide your people to prosperity, and let the light of your tradition illuminate the world.#!"

 bm_1178_kehillah:0 "The Paths of Torah"
 bm_1178_kehillah_desc:0 "By 1178 the sages no longer agree on what the Torah asks. In Fustat, Moses Maimonides is finishing a code of all Jewish law, ordered by reason. In Baghdad the last heirs of the Geonim defend their authority. In Champagne the Tosafists argue every line of the Talmud anew, in the Rhineland the Pietists seek God through penitence and discipline, and in Provence a circle of sages has begun to speak of hidden things.\n\nAround them the ground is moving. The Almohads have ended open Jewish life in Muslim Spain, Christian Toledo has taken in its refugees, and the crusades have taught the Rhineland what a mob can do.\n\n#bold Govern your community with wisdom, guide your people to prosperity, and let the light of your tradition illuminate the world.#!"

 # Character first name not in any name list.
