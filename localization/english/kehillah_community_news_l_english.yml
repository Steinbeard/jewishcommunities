 # Community news -- 2026-10-12 (docs/spec/v30-community-news.md)
 message_filter_kehillah_community_news:0 "Community News"
 message_filter_kehillah_community_news_desc:0 "News of the other Jewish communities in your region, and of your host lord"

 kehillah_news_host_death_t:0 "Your Lord Has Died"
 kehillah_news_host_death_d:0 "[kehillah_dead_lord.GetTitledFirstName], lord over your community, has died. [kehillah_new_lord.GetTitledFirstName] is his heir -- what he will make of the Jews remains to be seen."
 kehillah_news_host_death_noheir_d:0 "[kehillah_dead_lord.GetTitledFirstName], lord over your community, has died, and it is not yet clear who will rule after him."

 kehillah_news_charter_t:0 "A Charter Ends"
 kehillah_news_charter_d:0 "The [kehillah_news_title.GetNameNoTooltip] has passed to a new lord. Its Jews must seek a new charter."

 kehillah_news_leader_t:0 "New Leadership"
 kehillah_news_leader_d:0 "[kehillah_news_leader.GetTitledFirstName] now leads the [kehillah_news_title.GetNameNoTooltip]."

 kehillah_news_crisis_t:0 "A Community in Crisis"
 kehillah_news_crisis_stability_d:0 "The [kehillah_news_title.GetNameNoTooltip] is in crisis: its people are divided and its order is failing."
 kehillah_news_crisis_prosperity_d:0 "The [kehillah_news_title.GetNameNoTooltip] is in crisis: its households are impoverished and its chest is empty."
 kehillah_news_crisis_greatness_d:0 "The [kehillah_news_title.GetNameNoTooltip] is in crisis: its learning and its name have fallen away."

 kehillah_news_yeshiva_founded_t:0 "A New Yeshiva"
 kehillah_news_yeshiva_founded_d:0 "The [kehillah_news_title.GetNameNoTooltip] has founded a yeshiva under [kehillah_news_leader.GetTitledFirstName]."
 kehillah_news_yeshiva_tier_t:0 "A Yeshiva's Name Grows"
 kehillah_news_yeshiva_tier_d:0 "The yeshiva of the [kehillah_news_title.GetNameNoTooltip] is now #EMP [kehillah_news_leader.Custom('KehillahYeshivaFameTier')]#!. Students will come to it from far away."

 kehillah_news_bet_din_t:0 "A Bet Din Concludes"
 kehillah_news_bet_din_landmark_d:0 "The Bet Din convened by [kehillah_news_leader.GetTitledFirstName] of the [kehillah_news_title.GetNameNoTooltip] has concluded. Its rulings are already being copied out and sent to other communities."
 kehillah_news_bet_din_strong_d:0 "The Bet Din convened by [kehillah_news_leader.GetTitledFirstName] of the [kehillah_news_title.GetNameNoTooltip] has concluded. Its rulings were sound, and the parties went home satisfied."
 kehillah_news_bet_din_adequate_d:0 "The Bet Din convened by [kehillah_news_leader.GetTitledFirstName] of the [kehillah_news_title.GetNameNoTooltip] has concluded. Its rulings settled the cases, if not every grievance."
 kehillah_news_bet_din_failed_d:0 "The Bet Din convened by [kehillah_news_leader.GetTitledFirstName] of the [kehillah_news_title.GetNameNoTooltip] has concluded badly. Its rulings satisfied no one."
