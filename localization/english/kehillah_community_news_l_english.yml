 kehillah_book_news_msg_t:0 "A New Work Is Discussed"
 kehillah_book_news_msg_d:0 "[kehillah_book_author.GetTitledFirstName] has completed #italic [kehillah_book_author.Custom('KehillahBookNewsTitle')]#!. [kehillah_book_author.Custom('KehillahBookNewsSynopsis')]\n\n#weak Your rabbis are reading it, and learn a little from it.#!"

 # Natural founding (v34 section 1)
 kehillah_news_founded_t:0 "A New Community"
 kehillah_news_founded_d:0 "Families from the [kehillah_mother_title.GetNameNoTooltip] have settled in [kehillah_founding_county.GetNameNoTierNoTooltip] and founded a new community under [kehillah_natural_founder.GetTitledFirstName]."

 # Send Out Settlers (V34 section 1, amended 2026-10-13)
 kehillah_send_out_settlers_decision:0 "Send Out Settlers"
 kehillah_send_out_settlers_decision_desc:0 "The quarter is bursting. Families sleep three to a room and young men have no place to marry into. Send a man of standing -- a Ba'al Bayit, a learned rabbi, or one of our own house -- with those we have no room for, to found a new community where a lord will take Jewish settlers."
 kehillah_send_out_settlers_decision_confirm:0 "Send them out"
 kehillah_send_out_settlers_decision_tooltip:0 "Found a daughter community."
 kehillah_send_out_settlers_tt:0 "Choose where the settlers go and who leads them. The quarter's #EMP overflow#! goes with him -- his household first, then others -- until it is back within its places. The new community remembers its mother, and your community's #EMP Greatness#! grows."
 kehillah_settlers_crowded_tt:0 "The quarter is full (more people than places), or a lord within reach has invited Jewish settlers"
 kehillah_settlers_prosperity_tt:0 "The community's #EMP Prosperity#! is at least Strained"
 kehillah_settlers_cooldown_tt:0 "No settlers were sent out in the last five years"
 kehillah_settlers_leader_tt:0 "A grown man of the community, not your heir or your wife, could lead them"
 kehillah_settlers_destination_tt:0 "A county within reach would take Jewish settlers: its lord's realm allows Jewish settlement, it is settled enough, at peace, and has no community yet"

 kehillah_settlers.0001.t:0 "Where to Settle"
 kehillah_settlers.0001.desc:0 "Word has come of towns whose lords would welcome Jewish settlers. Where should they go?"
 kehillah_settlers.0001.a:0 "[kehillah_settlers_dest_1.GetNameNoTierNoTooltip][kehillah_settlers_dest_1.Custom('KehillahSettlersDestinationNote')]."
 kehillah_settlers.0001.b:0 "[kehillah_settlers_dest_2.GetNameNoTierNoTooltip][kehillah_settlers_dest_2.Custom('KehillahSettlersDestinationNote')]."
 kehillah_settlers.0001.c:0 "[kehillah_settlers_dest_3.GetNameNoTierNoTooltip][kehillah_settlers_dest_3.Custom('KehillahSettlersDestinationNote')]."
 kehillah_settlers.0001.d:0 "Not yet."
 kehillah_settlers.0002.t:0 "Who Will Lead Them"
 kehillah_settlers.0002.desc:0 "The settlers bound for [kehillah_founding_county.GetNameNoTierNoTooltip] need a man to lead them and to deal with its lord."
 kehillah_settlers.0002.a:0 "[kehillah_settlers_lead_baal.GetTitledFirstName], a Ba'al Bayit of standing and means."
 kehillah_settlers.0002.b:0 "[kehillah_settlers_lead_rabbi.GetTitledFirstName], a learned rabbi."
 kehillah_settlers.0002.c:0 "[kehillah_settlers_lead_kin.GetTitledFirstName], a man of our own house."
 kehillah_settlers.0002.d:0 "Not yet."
 kehillah_settlers_go_tt:0 "He leads the quarter's #EMP overflow#! -- his household first, then others -- to found a new community in [kehillah_founding_county.GetNameNoTierNoTooltip]. Your community's #EMP Greatness#! grows."

 # Exiles (2026-10-13)
 kehillah_exiles_title_name:0 "The Exiles of [kehillah_exiles_county.GetNameNoTierNoTooltip]"
 kehillah_found_community_site_tt:0 "This county would take a Jewish community: its lord's realm allows Jewish settlement, it lies near an existing community or its lord encourages Jews to come, it is settled enough, at peace, and no community is already close by"
 kehillah_exiles_resettle_tt:0 "The exiles settle here at last. Their shared purpose steadies the new community (#P +Stability#!), and the learning they carried gives it a name (#P +Greatness#!)."
 kehillah_news_invitation_t:0 "An Invitation to Settle"
 kehillah_news_invitation_d:0 "[kehillah_policy_host.GetTitledFirstName], [kehillah_policy_host.Custom('KehillahOutlookBand')] toward the Jews, has invited Jewish settlers into [kehillah_policy_realm.GetNameNoTooltip], promising [kehillah_policy_host.GetHerHis] protection to those who come. A community within reach could send settlers there."
 kehillah_news_invitation_answered_t:0 "The Invitation Answered"
 kehillah_news_invitation_answered_d:0 "Jewish settlers under [kehillah_answering_leader.GetTitledFirstName] have come to [kehillah_invited_county.GetNameNoTierNoTooltip] at the invitation of [kehillah_inviter.GetTitledFirstName], and founded a community there with the privileges [kehillah_inviter.GetSheHe] promised."
 kehillah_seek_invitation_sets_out_t:0 "The Shtadlan Sets Out"
 kehillah_seek_invitation_sets_out_d:0 "[kehillah_suitor_shtadlan.GetTitledFirstName] has gone to the court of [kehillah_invitation_suitor.GetTitledFirstName] (outlook on the Jews: [kehillah_invitation_suitor.Custom('KehillahOutlookBand')] ([kehillah_invitation_suitor.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0])) to seek an invitation for Jewish settlers."
 kehillah_seek_invitation_granted_t:0 "An Audience Granted"
 kehillah_seek_invitation_granted_d:0 "[kehillah_invitation_suitor.GetTitledFirstName] has heard [kehillah_suitor_shtadlan.GetTitledFirstName] and raised the Jewish settlement policy of [kehillah_suitor_realm.GetNameNoTooltip]."
 kehillah_seek_invitation_declined_t:0 "An Audience Refused"
 kehillah_seek_invitation_declined_d:0 "[kehillah_invitation_suitor.GetTitledFirstName] heard [kehillah_suitor_shtadlan.GetTitledFirstName] out, and will not change [kehillah_invitation_suitor.GetHerHis] realm's policy for some years. The Shtadlan will try another court."
 kehillah_news_exiles_road_t:0 "Exiles on the Road"
 kehillah_news_exiles_road_d:0 "The Jews of [kehillah_exiles_county.GetNameNoTierNoTooltip] have been driven out. Under [kehillah_news_leader.GetTitledFirstName] they are on the road, looking for a lord who will let them settle."
 kehillah_news_exiles_settled_t:0 "The Exiles Settle"
 kehillah_news_exiles_settled_d:0 "The exiles of [kehillah_exiles_county.GetNameNoTierNoTooltip] have found a new home and founded the [kehillah_news_title.GetNameNoTooltip] under [kehillah_news_leader.GetTitledFirstName]."
 kehillah_audience_won_t:0 "The Lord Is Moved"
 kehillah_audience_won_d:0 "[kehillah_audience_host.GetTitledFirstName] heard [kehillah_audience_shtadlan.GetTitledFirstName] with favour. [kehillah_audience_host.GetSheHe|U] thinks better of the Jews (outlook #P +2#!) and of you."
 kehillah_audience_lost_t:0 "The Lord Is Unmoved"
 kehillah_audience_lost_d:0 "[kehillah_audience_host.GetTitledFirstName] heard [kehillah_audience_shtadlan.GetTitledFirstName] out politely, and was not moved. #weak The higher the lord, the harder [kehillah_audience_host.GetSheHe] is to persuade.#!"
 kehillah_audience_crowded_t:0 "Another Envoy Before Him"
 kehillah_audience_crowded_d:0 "[kehillah_audience_host.GetTitledFirstName] has already given a Jewish envoy an audience this year, from another community. [kehillah_audience_shtadlan.GetTitledFirstName] will try again next year."
 kehillah_exchange_won_t:0 "A Learned Exchange"
 kehillah_exchange_won_d:0 "The [kehillah_exchange_faith.GetAdjective] clergy listened to [kehillah_exchange_dayyan.GetTitledFirstName]. Religious tension in the county is eased for ten years, and their faith's goodwill toward the Jews grows (#P +1#!) as its hostility fades (#P -1#!)."
 kehillah_exchange_won_full_d:0 "The [kehillah_exchange_faith.GetAdjective] clergy listened to [kehillah_exchange_dayyan.GetTitledFirstName], and religious tension in the county is eased for ten years. #weak Their faith has heard enough from the Jews this year to change its mind any further.#!"
 kehillah_exchange_lost_t:0 "The Clergy Unmoved"
 kehillah_exchange_lost_d:0 "The [kehillah_exchange_faith.GetAdjective] clergy heard [kehillah_exchange_dayyan.GetTitledFirstName] and gave nothing. #weak The stricter a faith's teaching on the Jews, the harder it is to reach.#!"
