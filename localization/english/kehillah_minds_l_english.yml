 # Machshavah changes minds (2026-11-11). events/kehillah_minds_events.txt.
 kehillah_minds.0001.t:0 "The Book Persuades"
 kehillah_minds.0001.desc:0 "You close #EMP [GetPlayer.Custom('KehillahMindsWork')]#! and find its argument still with you. It makes the case for #EMP [GetPlayer.Custom('KehillahMindsTenet')]#!, and the case is good."
 kehillah_minds.0001.a:0 "It has changed my mind."
 kehillah_minds.0001.b:0 "A fine argument. I keep my own counsel."
