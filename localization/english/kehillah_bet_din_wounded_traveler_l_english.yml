l_english:
 kehillah_bet_din.01121.t:0 "The Wounded Traveler"
 kehillah_bet_din.01121.desc:0 "[kbd_litigant_a.GetFirstName] says a cart struck a traveler at dusk. [kbd_litigant_b.GetFirstName] drove the cart but says the injury was already present. The healer's notes and road witnesses are nearby; the traveler needs care today."
 kehillah_bet_din.01121.a:0 "Order full damages from the driver now."
 kehillah_bet_din.01121.a.tt:0 "The driver may pay for an older wound."
 kehillah_bet_din.01121.b:0 "Fund care and compare the healer's notes with testimony."
 kehillah_bet_din.01121.b.tt:0 "Immediate care and measured inquiry cost the community something."
 kehillah_bet_din.01121.c:0 "Dismiss the claim because the road was crowded."
 kehillah_bet_din.01121.c.tt:0 "A genuine victim could be left without remedy."
 kehillah_din_source_112:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_112_tt:0 "Mishnah Bava Kamma 8:1 gives the judges a textual point of reference. It cannot establish which injury the cart caused."
 kehillah_din_combo_112:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_112_tt:0 "The judges preserve both parties' interests while checking which injury the cart caused."
 kehillah_bet_din.01124.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01124.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01124.outcome_1:0 "The driver is charged for all claimed injuries."
 kehillah_bet_din.01124.outcome_2:0 "The court funds treatment and assesses which harm the cart caused."
 kehillah_bet_din.01124.outcome_3:0 "The claim is dismissed."
 kehillah_bet_din.01124.fact_true:0 "The healer recorded the main injury before the collision. Full damages overstate the driver's harm."
 kehillah_bet_din.01124.fact_false:0 "Witnesses saw the cart cause the wound. Dismissal denies a real injury."
 kehillah_bet_din.01124.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01124.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01124.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case112_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case112_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case112_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_bet_din_case112_great_log_title:0 "The Wounded Traveler: a well-supported ruling"
 kehillah_bet_din_case112_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the wounded traveler dispute."
 kehillah_bet_din_case112_good_log_title:0 "The Wounded Traveler: a workable ruling"
 kehillah_bet_din_case112_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the wounded traveler dispute."
 kehillah_bet_din_case112_poor_log_title:0 "The Wounded Traveler: a disputed ruling"
 kehillah_bet_din_case112_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the wounded traveler dispute."
