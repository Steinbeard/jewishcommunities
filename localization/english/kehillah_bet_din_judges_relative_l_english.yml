l_english:
 kehillah_bet_din.0801.t:0 "The Judge's Brother-in-Law"
 kehillah_bet_din.0801.desc:0 "[kbd_litigant_a.GetFirstName] asks a judge to remain on a property panel despite a claimed family tie to one party. [kbd_litigant_b.GetFirstName] says the tie is close enough to cast doubt on every ruling. The court has two other qualified judges, but changing the panel delays a hearing already set."
 kehillah_bet_din.0801.a:0 "Keep the judge and hear the case today."
 kehillah_bet_din.0801.a.tt:0 "The hearing proceeds, but a close relationship may taint the judgment."
 kehillah_bet_din.0801.b:0 "Verify kinship and use a temporary substitute."
 kehillah_bet_din.0801.b.tt:0 "A substitute costs time while a specific conflict is checked."
 kehillah_bet_din.0801.c:0 "Dismiss the whole panel and start over."
 kehillah_bet_din.0801.c.tt:0 "If the claimed tie is distant, dissolving the panel wastes sound preparation."
 kehillah_din_source_80:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_80_tt:0 "Mishnah Sanhedrin 3:4 gives the judges a textual point of reference. It cannot establish the actual relationship between judge and party."
 kehillah_din_combo_80:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_80_tt:0 "The judges preserve both parties' interests while checking the actual relationship between judge and party."
 kehillah_bet_din.0804.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0804.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0804.outcome_1:0 "The court keeps the challenged judge."
 kehillah_bet_din.0804.outcome_2:0 "The court checks the family link and seats a temporary substitute."
 kehillah_bet_din.0804.outcome_3:0 "The court dissolves the whole panel."
 kehillah_bet_din.0804.fact_true:0 "The judge is closely related by marriage to a party. Keeping him jeopardized the hearing's fairness."
 kehillah_bet_din.0804.fact_false:0 "The families share only a distant name, not a disqualifying tie. Dissolving the panel was needless."
 kehillah_bet_din.0804.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0804.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0804.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case80_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case80_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case80_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case80_great_log_title:0 "The Judge's Brother-in-Law: a well-supported ruling"
 kehillah_bet_din_case80_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the judge's brother-in-law dispute."
 kehillah_bet_din_case80_good_log_title:0 "The Judge's Brother-in-Law: a workable ruling"
 kehillah_bet_din_case80_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the judge's brother-in-law dispute."
 kehillah_bet_din_case80_poor_log_title:0 "The Judge's Brother-in-Law: a disputed ruling"
 kehillah_bet_din_case80_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the judge's brother-in-law dispute."
