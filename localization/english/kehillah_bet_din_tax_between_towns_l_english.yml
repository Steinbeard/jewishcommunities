l_english:
 kehillah_bet_din.0201.t:0 "The Taxpayer Between Two Communities"
 kehillah_bet_din.0201.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a town that demands a household levy from a newcomer. [kbd_litigant_b.GetFirstName] says the same levy was paid before leaving another community, but the receipt is in a traveling chest. The town's collector needs funds now. The court must avoid charging twice while keeping the common expenses paid."
 kehillah_bet_din.0201.a:0 "Pay the town's claim from communal reserves now."
 kehillah_bet_din.0201.a.tt:0 "The collector gets the money at once. If a receipt exists, the community may have paid a claim that was already settled."
 kehillah_bet_din.0201.b:0 "Advance essential costs and send for the receipt."
 kehillah_bet_din.0201.b.tt:0 "The town is funded while a messenger checks the old community's records. The court pays for the inquiry."
 kehillah_bet_din.0201.c:0 "Settle for a smaller contribution and close the account."
 kehillah_bet_din.0201.c.tt:0 "The newcomer pays less and the town receives something, but this may underfund a valid levy."
 kehillah_din_source_20:0 "Cite a mastered Nezikin work and verify the prior payment."
 kehillah_din_source_20_tt:0 "A Nezikin source can guide the court on proof of payment and communal obligations. The missing receipt still has to be found."
 kehillah_din_combo_20:0 "Send a steward and a scholar to compare both towns' records."
 kehillah_din_combo_20_tt:0 "The court advances urgent costs while two judges check the old and new accounts."
 kehillah_bet_din.0204.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0204.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a town that demands a household levy from a newcomer. [kbd_litigant_b.GetFirstName] says the same levy was paid before leaving another community, but the receipt is in a traveling chest. The town's collector needs funds now. The court must avoid charging twice while keeping the common expenses paid."
 kehillah_bet_din.0204.outcome_1:0 "The court pays the town from communal reserves. The collector is satisfied, but the newcomer's claimed payment remains unverified."
 kehillah_bet_din.0204.outcome_2:0 "The court advances essential costs and asks the former town for a copy of its receipt before assigning the levy."
 kehillah_bet_din.0204.outcome_3:0 "The court orders a smaller contribution as a final compromise. Neither town will revisit the account."
 kehillah_bet_din.0204.fact_true:0 "A receipt arrives from the former town. The full claim would have charged the newcomer twice."
 kehillah_bet_din.0204.fact_false:0 "No earlier payment appears in the old town's books. The reduced contribution leaves a real shortfall."
 kehillah_bet_din.0204.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0204.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0204.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case20_one_tt:0 "Communal reserves pay the full claim, at a large Prosperity cost."
 kehillah_din_case20_two_tt:0 "A messenger and temporary advance cost some Prosperity."
 kehillah_din_case20_three_tt:0 "The compromise costs less now but may leave a shortfall."
 kehillah_bet_din_case20_great_log_title:0 "The Taxpayer Between Two Communities: a well-supported ruling"
 kehillah_bet_din_case20_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s disputed town levy."
 kehillah_bet_din_case20_good_log_title:0 "The Taxpayer Between Two Communities: a workable ruling"
 kehillah_bet_din_case20_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s disputed town levy."
 kehillah_bet_din_case20_poor_log_title:0 "The Taxpayer Between Two Communities: a disputed ruling"
 kehillah_bet_din_case20_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s disputed town levy."
