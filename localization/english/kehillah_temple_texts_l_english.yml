l_english:
 # The Bavli's Seder Kodashim, with and without the Temple's service
 # (common/customizable_localization/kehillah_temple_texts_custom_loc.txt).
 kehillah_kodashim_mastered_absent:0 "You finish Seder Kodashim. The sacrifices of a Temple long destroyed are argued as if it still stood, and you can follow every step of a service no one has performed since it fell."
 kehillah_kodashim_mastered_restored:0 "You finish Seder Kodashim. Its sacrifices are no longer only argument: the service stands again in Jerusalem, and you could tell its priests where they keep the Mishnah and where they stray from it."
 kehillah_kodashim_opening_absent:0 "You open the Bavli's Seder Kodashim, where rites for a Temple that no longer stands are argued with the precision of an institution still present."
 kehillah_kodashim_opening_restored:0 "You open the Bavli's Seder Kodashim. For centuries its readers argued rites they could not perform; now the altar in Jerusalem burns again, and every ruling has a priest waiting on it."
 kehillah_kodashim_study_absent:0 "You take up the Bavli's Seder Kodashim, rites for a Temple that no longer stands argued as if it still did."
 kehillah_kodashim_study_restored:0 "You take up the Bavli's Seder Kodashim, the law of a service restored in Jerusalem."
 kehillah_kodashim_desc_absent:0 "The Babylonian Talmud's Seder Kodashim preserves the Temple's sacrifices and service in law, though the Temple is gone."
 kehillah_kodashim_desc_restored:0 "The Babylonian Talmud's Seder Kodashim: the law of the Temple's sacrifices and service, kept through the long absence and now practised again in Jerusalem."
 kehillah_kodashim_detail_absent:0 "The Bavli's order Kodashim preserves detailed late antique argument about offerings and sacred service in the absent Temple. Study keeps a legal vocabulary alive even where the rites cannot be performed."
 kehillah_kodashim_detail_restored:0 "The Bavli's order Kodashim preserves detailed late antique argument about offerings and sacred service. With the service restored in Jerusalem, its rulings are no longer only study: the priests at the altar answer to them."
