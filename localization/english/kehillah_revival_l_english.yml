l_english:
 tenet_kehillah_messianic_hope_name:0 "Messianic Hope"
 tenet_kehillah_messianic_hope_desc:0 "Redemption demands more than waiting. A voice must call the scattered faithful together, patrons must commit their wealth, and rulers must be persuaded to act. Those who promise restoration must answer when it fails to arrive."
 kehillah_messianic_glossary:0 "[Glossary('Geulah','kehillah_messianic_history')]"
 kehillah_messianic_history:0 "Geulah\n\nJewish hopes for redemption took different forms: renewed sovereignty, the gathering of exiles, restoration of worship, and an age of justice. Such expectations could accompany ordinary communal life or become a program of immediate action.\n\nA claimant's learning, lineage, patronage, and apparent achievements could attract support without settling whether the claim was true. Disappointment could leave both the claimant and those who had pledged their resources exposed. This tenet emphasizes that active, contested expression of messianic hope."
 tenet_kehillah_prophetic_revelation_name:0 "Prophetic Revelation"
 tenet_kehillah_prophetic_revelation_desc:0 "The divine word may interrupt the affairs of rulers and reveal what custom alone cannot teach. Those called to bear it must speak, even when the powerful would rather not listen. Yet a claim to revelation must still find people willing to believe it."
 kehillah_prophetic_glossary:0 "[Glossary('Nevuah','kehillah_prophetic_history')]"
 kehillah_prophetic_history:0 "Nevuah\n\nThe biblical prophets speak of divine calling, visions, warnings, and ethical demands. Their accounts also preserve disputes over who truly spoke with divine authority. A visionary experience alone did not eliminate the problem of false prophecy.\n\nMedieval Jewish traditions could honor the ancient prophets while disagreeing about later claims to revelation. Renewing prophetic authority would therefore be a religious controversy, rather than the automatic consequence of a dream or trance. The Possessed trait represents a game abstraction, not a retrospective medical diagnosis of historical prophets."
 tenet_kehillah_temple_service_name:0 "Temple Service"
 tenet_kehillah_temple_service_desc:0 "Offerings, song, and appointed rites give order to the service of the divine. Priests bear obligations that neither royal favor nor private devotion can replace. The sanctuary is sustained through the participation of the faithful."
 kehillah_temple_service_restored_desc:0 "The Temple service has been restored at Jerusalem"
 kehillah_temple_mount_site_desc:0 "The Temple Mount holds the Dome of the Rock or the Temple in Jerusalem"
 kehillah_prophetic_calling:0 "Prophetic Calling"
 kehillah_prophetic_revival_recognized:0 "Recognized Prophet of the Revival"
 kehillah_temple_glossary:0"[Glossary('Avodah','kehillah_temple_history')]"
 kehillah_temple_history:0 "Avodah\n\nThe service of the sanctuary joins offerings to priestly duties, sacred times, and the maintenance of a recognized place of worship. Remembering that service is distinct from possessing the institutions and officiants necessary to perform it.\n\nFor Rabbinic and Karaite Jews, Jerusalem's service belongs to hopes for restoration. Samaritan worship is centered on Mount Gerizim, where the Passover sacrifice has its own priesthood and calendar. The two traditions do not share a sanctuary or an interchangeable claim to priestly authority."
 doctrine_parameter_kehillah_messianic_mission:0 "Unlocks #V Proclaim a Messianic Mission#! and appeals for supporters and pledges; landed claimants gain #V Recover Holy Site#! for the holy city during the mission"
 doctrine_parameter_kehillah_messianic_personal:0 "Supporters and successful mission sermons grant additional [piety|E]"
 doctrine_parameter_kehillah_prophetic_admonition:0 "Unlocks #V Admonish Ruler#! over arbitrary, callous, or deceitful conduct"
 doctrine_parameter_kehillah_prophetic_personal:0 "Successful communal sermons grant #P +25#! [piety|E]"
 doctrine_parameter_kehillah_offer_sacrifice:0 "Unlocks the #V Offer Sacrifice#! pilgrimage intent at a functioning sanctuary"
 doctrine_parameter_kehillah_offer_sacrifice_personal:0 "Completed sacrifices grant #P +100#! additional [piety|E]"
 kehillah_messianic_claimant_modifier:0 "Messianic Mission"
 kehillah_messianic_claimant_modifier_desc:0 "This claimant has publicly called for the restoration of the holy city."
 kehillah_messianic_disillusion_modifier:0 "Unfulfilled Promises"
 kehillah_messianic_disillusion_modifier_desc:0 "The promised restoration has not arrived, and supporters remember what they were asked to give."
 kehillah_prophetic_claimant_modifier:0 "Claimed Prophetic Calling"
 kehillah_prophetic_claimant_modifier_desc:0 "A claim to revelation has won attention and unsettled established religious authorities."
 kehillah_heeded_admonition_modifier:0 "Heeded Admonition"
 kehillah_heeded_admonition_modifier_desc:0 "This ruler has publicly accepted a religious warning to exercise greater restraint."
 kehillah_sacrifice_completed_modifier:0 "Offered at the Sanctuary"
 kehillah_sacrifice_completed_modifier_desc:0 "This pilgrim has participated in the appointed service at a sanctuary of their faith."
 kehillah_messianic_mission_decision:0 "Proclaim a Messianic Mission"
 kehillah_messianic_mission_decision_desc:0 "I will call for the holy city to be restored to the rule of our faith. Others may lend their voices and their purses. In three years, I must answer for the restoration I have promised."
 kehillah_messianic_mission_decision_tooltip:0 "Begin a public three-year campaign for the holy city; failure brings disillusion and lost reputation"
 kehillah_messianic_mission_decision_confirm:0 "Let the call be heard"
 kehillah_announce_revelation_decision:0 "Announce a Revelation"
 kehillah_announce_revelation_decision_desc:0 "The visions return with a force that study alone cannot explain. I could declare a prophetic calling and embrace Prophetic Revelation as a personal tenet, or submit my experience to learned examination."
 kehillah_announce_revelation_decision_tooltip:0 "Consider publicly claiming a prophetic calling; this may change your personal tenet"
 kehillah_announce_revelation_decision_confirm:0 "Consider the calling"
 kehillah_restore_temple_service_decision:0 "Restore Jerusalem's Temple Service"
 kehillah_restore_temple_service_decision_desc:0 "Possession of the sanctuary is not enough. Its service requires provision, recognition, and an adult Kohen of my faith among my courtiers. I will devote substantial resources to establishing those duties again."
 kehillah_restore_temple_service_decision_tooltip:0 "Endow Jerusalem's service and permit Temple Service for your faith"
 kehillah_restore_temple_service_decision_confirm:0 "Endow the service"
 kehillah_restored_service_tt:0 "Sacrifice at Jerusalem requires continued same-faith control, the sanctuary building, and an available adult Kohen of the pilgrim's faith. This does not create or replace a Head of Faith."
 kehillah_messianic_appeal_interaction:0 "Seek Messianic Support"
 kehillah_messianic_appeal_interaction_desc:0 "Invite [recipient.GetShortUINameNoTooltip] to support the promised restoration. They may pledge money, lend their voice, or refuse."
 kehillah_prophetic_admonition_interaction:0 "Admonish Ruler"
 kehillah_prophetic_admonition_interaction_desc:0 "Challenge [recipient.GetShortUINameNoTooltip] over conduct that contradicts the demands of faith. They may accept a public commitment to restraint, or reject my claimed authority."
 kehillah_offer_sacrifice_intent:0 "Offer Sacrifice"
 kehillah_offer_sacrifice_intent_desc:0 "Participate in service at the sanctuary. Samaritans must reach Gerizim (Nablus) during the April Passover window; other practitioners must reach Jerusalem after service has been restored. A successful offering costs a minor amount of Gold and grants 200 Piety and 20 Stress relief, plus 100 Piety for personal adherents. Rewards are limited to once a year; no charge is taken at an invalid destination."
 kehillah_revival.0001.t:0 "The Time to Act"
 kehillah_revival.0001.desc:0 "The promise of restoration has filled prayers and books. I am proposing something more dangerous: a public call, patrons willing to spend, and a holy city brought under the rule of our faith.\n\nI can gather support, but I cannot command belief. In three years, others will judge what my promises have accomplished."
 kehillah_revival.0001.proclaim:0 "I will carry this mission before the faithful."
 kehillah_revival.0001.wait:0 "I am not ready to make that promise."
 kehillah_revival.0002.t:0 "A Call for Restoration"
 kehillah_revival.0002.desc:0 "[kehillah_messianic_claimant.GetShortUIName] has publicly called for the restoration of the holy city. Now a message asks what I will commit.\n\nA purse would make the campaign stronger. My public support would attach my name to its promises. Refusal would leave me free of obligations, whatever others might say."
 kehillah_revival.0002.gold:0 "I will pledge funds to the mission."
 kehillah_revival.0002.voice:0 "My name and voice will stand beside this cause."
 kehillah_revival.0002.refuse:0 "I will not stake my household on these promises."
 kehillah_revival.0005.t:0 "The Promise Comes Due"
 kehillah_revival.0005.desc:0 "Three years have passed since I called the faithful to action. Letters and pledges are no longer enough: people ask whether the holy city has been restored to the rule of our faith.\n\nThose who stood beside me will share in the answer."
 kehillah_revival.0005.restored:0 "The city is restored; let the faithful see what was achieved."
 kehillah_revival.0005.reckon:0 "I must answer for what I promised."
 kehillah_revival.0020.t:0 "A Voice I Cannot Silence"
 kehillah_revival.0020.desc:0 "The experience returns with a clarity I struggle to describe. Familiar words seem charged with a demand that is addressed to me. Yet conviction alone cannot establish whose voice I have heard.\n\nIf I announce a prophetic calling, the claim will reshape my religious life and invite scrutiny from those charged with guarding the tradition."
 kehillah_revival.0020.announce:0 "I will proclaim the calling and adopt Prophetic Revelation."
 kehillah_revival.0020.consult:0 "I will bring this experience before learned readers."
 kehillah_revival.0021.t:0 "A Warning Before the Ruler"
 kehillah_revival.0021.desc:0 "[kehillah_prophetic_speaker.GetShortUIName] has challenged my conduct in the name of a claimed revelation."
 kehillah_revival.0021.arbitrary:0 "\n\nThe charge concerns my arbitrary judgments: commands that change with favor and leave those subject to them uncertain of justice."
 kehillah_revival.0021.callous:0 "\n\nThe charge concerns my callous treatment of others: suffering dismissed as an inconvenience to those who rule."
 kehillah_revival.0021.deceitful:0 "\n\nThe charge concerns deceit: promises made for advantage, then discarded when they no longer serve me."
 kehillah_revival.0021.heed:0 "I will publicly commit myself to greater restraint."
 kehillah_revival.0021.reject:0 "Your claimed revelation gives you no authority over me."
 kehillah_revival.0040.t:0 "Service at the Sanctuary"
 kehillah_revival.0040.desc:0 "At the appointed place, the officiants attend to the service and receive my offering. The journey has brought me beyond remembrance into participation in the worship of my faith.\n\nI leave with the obligations of that service still in mind."
 kehillah_revival.0041.t:0 "The Offering Cannot Be Made"
 kehillah_revival.0041.desc:0 "The intended offering cannot take place here. The destination must be my tradition's sanctuary, with its service and officiants available; Samaritan offerings also require the Passover season. I must still have the necessary funds and have received no sacrifice reward this year.\n\nNo payment has been taken. My pilgrimage retains its ordinary rewards."
 kehillah_revival.continue:0 "The journey continues."
 kehillah_sefer.0200.tt_15:0 "Messianic Hope: a call to restoration."
 kehillah_sefer.0200.tt_16:0 "Prophetic Revelation: the authority of a divine calling."
 kehillah_sefer.0200.tt_17:0 "Temple Service: the duties of the sanctuary."
 activity_pilgrimage_guest_help_text:0 "Accompany the host on a journey to a sacred place."
 special_type:0 "Type"
 kehillah_revival_reform_lapsed:0 "The proposed core tenet no longer meets its requirements"
 kehillah_revival.0021.general:0 "\n\nThe demand is that I commit myself publicly to greater restraint in government."
 kehillah_messianic_pledge_received:0 "A Pledge to the Mission"
 kehillah_messianic_pledge_received_desc:0 "[kehillah_messianic_supporter.GetShortUIName] has joined the promised restoration."
 kehillah_messianic_supporter_modifier:0 "Pledged to a Messianic Mission"
 kehillah_messianic_supporter_modifier_desc:0 "This character has publicly committed support to a claimant and shares the risks of the promised restoration."
