l_english:
 kehillah_bet_din.0961.t:0 "The Oath in an Unfamiliar Language"
 kehillah_bet_din.0961.desc:0 "[kbd_litigant_a.GetFirstName] demands an oath over a disputed payment. [kbd_litigant_b.GetFirstName] will swear, but only in a language the clerk speaks poorly. The translator has not yet arrived. A solemn formula means little if its speaker and hearers understand different debts."
 kehillah_bet_din.0961.a:0 "Take the oath as the clerk records it."
 kehillah_bet_din.0961.a.tt:0 "The recorded words may say more than the speaker intended."
 kehillah_bet_din.0961.b:0 "Wait for a trusted translator and restate the claim."
 kehillah_bet_din.0961.b.tt:0 "Translation delays collection but gives the oath a clear object."
 kehillah_bet_din.0961.c:0 "Reject the oath and award the claim."
 kehillah_bet_din.0961.c.tt:0 "A valid defense may be lost for a language barrier."
 kehillah_din_source_96:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_96_tt:0 "Mishnah Shevuot 7:1 gives the judges a textual point of reference. It cannot establish what the oath's speaker understood."
 kehillah_din_combo_96:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_96_tt:0 "The judges preserve both parties' interests while checking what the oath's speaker understood."
 kehillah_bet_din.0964.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0964.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0964.outcome_1:0 "The clerk records the oath and the court closes the claim."
 kehillah_bet_din.0964.outcome_2:0 "The court writes the exact claim in both languages before any oath."
 kehillah_bet_din.0964.outcome_3:0 "The claimant wins without an oath."
 kehillah_bet_din.0964.fact_true:0 "The clerk mistook a partial payment for a denial of all debt. The recorded oath answered the wrong claim."
 kehillah_bet_din.0964.fact_false:0 "The speaker understands the claim and can answer it. Refusal denied a meaningful defense."
 kehillah_bet_din.0964.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0964.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0964.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case96_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case96_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case96_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case96_great_log_title:0 "The Oath in an Unfamiliar Language: a well-supported ruling"
 kehillah_bet_din_case96_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the oath in an unfamiliar language dispute."
