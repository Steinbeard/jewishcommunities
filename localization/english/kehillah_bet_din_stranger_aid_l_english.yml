l_english:
 kehillah_bet_din.0181.t:0 "The Aid Refused to a Stranger"
 kehillah_bet_din.0181.desc:0 "[kbd_litigant_a.GetFirstName], a traveler with an empty purse, asks the community for a meal and a place to sleep. [kbd_litigant_b.GetFirstName] keeps a fund that may have been given for local households alone. The donor's terms cannot be found before dusk. The court can spend from the fund, feed the traveler from general stores while the terms are checked, or protect the fund and ask households for private gifts."
 kehillah_bet_din.0181.a:0 "Feed the traveler from the disputed fund now."
 kehillah_bet_din.0181.a.tt:0 "The argument relies on Diplomacy. Aid is immediate, but this may break a donor's restriction. The fund bears the larger cost."
 kehillah_bet_din.0181.b:0 "Serve a meal from general stores and inspect the deed."
 kehillah_bet_din.0181.b.tt:0 "The argument relies on Learning and Talmudics. The traveler eats tonight while the court checks what the donor authorized."
 kehillah_bet_din.0181.c:0 "Preserve the fund; seek voluntary gifts by morning."
 kehillah_bet_din.0181.c.tt:0 "The argument relies on Stewardship. The fund is protected, but the traveler may face a hungry night."
 kehillah_din_source_18:0 "Cite a mastered Zeraim work and provide a meal while checking the deed."
 kehillah_din_source_18_tt:0 "Available to a judge who has mastered a work covering #EMP Zeraim#!. Mishnah Peah 8:7 speaks of a minimum gift to a passing poor person. It does not identify the donor's terms for this particular fund."
 kehillah_din_combo_18:0 "Have a just scholar and a steward find food and inspect the deed."
 kehillah_din_combo_18_tt:0 "Available to a learned judge who is Just or experienced in Talmudics, with a judge skilled in Stewardship. The traveler receives a meal while the court checks the fund."
 kehillah_bet_din.0184.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0184.desc:0 "The traveler and collector wait while the court decides what can be spent before the donor's terms are known."
 kehillah_bet_din.0184.outcome_1:0 "The court opens the disputed fund. The traveler eats, while the collector fears a breach of trust."
 kehillah_bet_din.0184.outcome_2:0 "The court provides a meal from general stores and reads the donor's deed before touching the restricted fund."
 kehillah_bet_din.0184.outcome_3:0 "The court protects the fund and asks households to give privately. The traveler must wait until they respond."
 kehillah_bet_din.0184.restricted:0 "\n\nThe deed limits this fund to local households. Spending it on the traveler would break the donor's direction."
 kehillah_bet_din.0184.unrestricted:0 "\n\nThe deed permits aid to strangers. The collector's caution delayed help that the fund could have given."
 kehillah_bet_din.0184.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0184.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0184.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case18_one_tt:0 "The traveler eats from the disputed fund. Prosperity pays the larger cost."
 kehillah_din_case18_two_tt:0 "General stores feed the traveler while the deed is checked. Prosperity pays a smaller cost."
 kehillah_din_case18_three_tt:0 "The fund stays closed. Prosperity pays for a private appeal, while aid is delayed."
 kehillah_bet_din_case18_great_log_title:0 "The Aid Refused to a Stranger: a well-supported ruling"
 kehillah_bet_din_case18_good_log_title:0 "The Aid Refused to a Stranger: a workable ruling"
 kehillah_bet_din_case18_poor_log_title:0 "The Aid Refused to a Stranger: a disputed ruling"
 kehillah_bet_din_case18_great_log:0 "[CHARACTER.GetTitledFirstName] secured food for [TARGET_CHARACTER.GetFirstName] while respecting the fund's terms."
 kehillah_bet_din_case18_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s request for aid."
 kehillah_bet_din_case18_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling left [TARGET_CHARACTER.GetFirstName]'s request for aid contested."
