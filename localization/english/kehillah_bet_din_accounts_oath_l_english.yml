l_english:
 kehillah_bet_din.0901.t:0 "The Oath to Settle Accounts"
 kehillah_bet_din.0901.desc:0 "[kbd_litigant_a.GetFirstName] asks a partner to swear that their accounts are settled. [kbd_litigant_b.GetFirstName] says a crucial cargo page has gone missing and refuses to swear from memory. The bargain called for an oath, but neither party knows whether the absent page would alter the balance."
 kehillah_bet_din.0901.a:0 "Demand the oath and close the accounts."
 kehillah_bet_din.0901.a.tt:0 "A missing page may make a forced oath unreliable."
 kehillah_bet_din.0901.b:0 "Secure the claim and search for the cargo page."
 kehillah_bet_din.0901.b.tt:0 "A search costs time while preserving both claims."
 kehillah_bet_din.0901.c:0 "Waive the oath and cancel the balance."
 kehillah_bet_din.0901.c.tt:0 "A complete account might support payment the court would erase."
 kehillah_din_source_90:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_90_tt:0 "Mishnah Shevuot 7:1 gives the judges a textual point of reference. It cannot establish what the missing cargo page records."
 kehillah_din_combo_90:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_90_tt:0 "The judges preserve both parties' interests while checking what the missing cargo page records."
 kehillah_bet_din.0904.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0904.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0904.outcome_1:0 "The court insists on the oath now."
 kehillah_bet_din.0904.outcome_2:0 "The court holds the account open and searches the cargo records."
 kehillah_bet_din.0904.outcome_3:0 "The court cancels the unsettled balance."
 kehillah_bet_din.0904.fact_true:0 "The missing page records a disputed shipment. An immediate oath would conceal a material uncertainty."
 kehillah_bet_din.0904.fact_false:0 "The page is found and shows an unpaid balance. Cancellation released a real debt."
 kehillah_bet_din.0904.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0904.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0904.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case90_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case90_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case90_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
