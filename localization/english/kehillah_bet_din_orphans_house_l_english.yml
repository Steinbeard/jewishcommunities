l_english:
 kehillah_bet_din.0171.t:0 "The Rented House of the Orphans"
 kehillah_bet_din.0171.desc:0 "[kbd_litigant_a.GetFirstName] represents the guardians of children who inherited a house. [kbd_litigant_b.GetFirstName] offers to rent it and promises a workshop as security if the rent stops or the house is seized. The guardians want the children paid each month without delay. The court must decide what proof and security the lease needs before anyone relies on it."
 kehillah_bet_din.0171.a:0 "Accept the rent and the offered guarantee."
 kehillah_bet_din.0171.a.tt:0 "The presiding judge relies on Diplomacy. The orphans receive rent promptly, but an unverified pledge could fail when it is needed."
 kehillah_bet_din.0171.b:0 "Verify the pledge and record the lease in duplicate."
 kehillah_bet_din.0171.b.tt:0 "The presiding judge relies on Learning and Talmudics. Check title to the workshop, set monthly payment terms, and give both sides a written record."
 kehillah_bet_din.0171.c:0 "Reject this lease and seek another tenant."
 kehillah_bet_din.0171.c.tt:0 "The presiding judge relies on Stewardship. The house stays free of a disputed pledge, but the orphans lose rent while a new tenant is found."
 kehillah_din_source_17:0 "Cite a mastered Nezikin work and require verified security."
 kehillah_din_source_17_tt:0 "Available to a judge who has mastered a work covering #EMP Nezikin#!. Mishnah Bava Metzia 8:8 concerns a house lease's duration. It is an analogy for lease terms, not a ruling on this guarantor's title or the orphans' security."
 kehillah_din_combo_17:0 "Have a just scholar and a steward examine the pledge."
 kehillah_din_combo_17_tt:0 "Available to a learned judge who is Just or experienced in Talmudics, with a judge skilled in Stewardship. The panel checks the workshop and records the rent before approving the lease."
 kehillah_bet_din.0174.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0174.desc:0 "The guardians and prospective tenant wait while the judges decide how to protect the orphans' rent."
 kehillah_bet_din.0174.outcome_1:0 "The court accepts the promised rent and the workshop pledge without a separate title check. Payments can begin quickly."
 kehillah_bet_din.0174.outcome_2:0 "The court checks the workshop, records the monthly rent and guarantee in two copies, and requires valid security before the lease takes effect."
 kehillah_bet_din.0174.outcome_3:0 "The court rejects the offer and asks the guardians to find another tenant. The house earns nothing in the meantime."
 kehillah_bet_din.0174.security_gap:0 "\n\nThe proposed guarantor cannot show clear title to the workshop. An unchecked pledge would have left the orphans exposed."
 kehillah_bet_din.0174.security_sound:0 "\n\nThe workshop proves to be valid security. A delay for a new tenant was avoidable."
 kehillah_bet_din.0174.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0174.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0174.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case17_one_tt:0 "The lease starts quickly and Prosperity rises, though the security has not been checked."
 kehillah_din_case17_two_tt:0 "The court verifies and records the lease. Prosperity pays the smaller administrative cost."
 kehillah_din_case17_three_tt:0 "The court rejects this tenant. Prosperity falls while the orphans wait for rent."
 kehillah_bet_din_case17_great_log_title:0 "The Rented House of the Orphans: a well-supported ruling"
 kehillah_bet_din_case17_good_log_title:0 "The Rented House of the Orphans: a workable ruling"
 kehillah_bet_din_case17_poor_log_title:0 "The Rented House of the Orphans: a disputed ruling"
 kehillah_bet_din_case17_great_log:0 "[CHARACTER.GetTitledFirstName] protected [TARGET_CHARACTER.GetFirstName]'s orphans' rental claim with a recorded guarantee."
 kehillah_bet_din_case17_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s orphans' rental claim."
 kehillah_bet_din_case17_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling left [TARGET_CHARACTER.GetFirstName]'s orphans' rental claim unsettled."
