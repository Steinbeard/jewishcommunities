l_english:
 # A decree against the Jews as a situation (docs/spec/2026-11-01-decree-situation.md), 2026-11-01.
 situation_type_kehillah_decree:0 "A Decree Against the Jews"
 situation_kehillah_decree:0 "A Decree Against the [Situation.MakeScope.Var('kehillah_decree_title').Title.GetNameNoTooltip]"
 situation_type_kehillah_decree_desc:0 "The lord has decreed against the Jews: a mark on their clothes, or a ban on Christian servants and Jewish officials. Before it is enforced, the community can argue, pay, or threaten to leave; decrees like this were often laid aside, or never enforced at all."
 situation_kehillah_decree_desc:0 "$situation_type_kehillah_decree_desc$"
 kehillah_decree_sub_region_kehillah_decree_area:0 "The community under the decree"
 kehillah_decree_participant_group_kehillah_decree_community:0 "The community"
 kehillah_decree_participant_group_kehillah_decree_community_desc:0 "The leader of the community the decree falls on."
 kehillah_decree_participant_group_kehillah_decree_lords:0 "The lord"
 kehillah_decree_participant_group_kehillah_decree_lords_desc:0 "The ruler who issued the decree."

 kehillah_decree_kehillah_decree_proclaimed_situation_phase:0 "Proclaimed"
 kehillah_decree_kehillah_decree_enforced_situation_phase:0 "Enforced"
 kehillah_decree_kehillah_decree_suspended_situation_phase:0 "Laid aside"
 kehillah_decree_kehillah_decree_withdrawn_situation_phase:0 "Withdrawn"
 kehillah_decree_kehillah_decree_closed_situation_phase:0 "Closed"
 # 2026-11-10: the phase tooltips (SituationPhaseType.GetDesc). The kehillah_decree_<phase>_desc
 # keys below are not read by the game.
 kehillah_decree_kehillah_decree_proclaimed_situation_phase_desc:0 "In the Proclaimed [situation_phase|E], the lord's decree against the Jews has been read in the market, but no one has yet been made to obey it. While the lord's clerks draw up their lists, the community may argue against it, offer silver, or warn that its families will leave."
 kehillah_decree_kehillah_decree_enforced_situation_phase_desc:0 "The decree is now enforced. The lord's officers see that it is obeyed, and the community must learn to live under it."
 kehillah_decree_kehillah_decree_suspended_situation_phase_desc:0 "For a price, the lord has laid the decree aside. It remains written in the rolls, but no officer enforces it, and it is unlikely to be raised again for some years."
 kehillah_decree_kehillah_decree_withdrawn_situation_phase_desc:0 "The lord has withdrawn the decree. The community's arguments have carried the day, though the feeling that produced the decree has not gone away."
 kehillah_decree_kehillah_decree_closed_situation_phase_desc:0 "The matter of the decree is settled, and the community returns to its ordinary affairs."
 kehillah_decree_proclaimed:0 "Proclaimed"
 kehillah_decree_proclaimed_desc:0 "The decree has been read in the market, but not yet enforced. Whichever fills first decides it: the lord's clerks enforce it, a price lays it aside, or a petition has it withdrawn."
 kehillah_decree_enforced:0 "Enforced"
 kehillah_decree_enforced_desc:0 "The decree is enforced."
 kehillah_decree_suspended:0 "Laid aside"
 kehillah_decree_suspended_desc:0 "The decree has been laid aside, for a price. It will not be raised again for some years."
 kehillah_decree_withdrawn:0 "Withdrawn"
 kehillah_decree_withdrawn_desc:0 "The decree has been withdrawn."
 kehillah_decree_closed:0 "Closed"
 kehillah_decree_closed_desc:0 "The matter is over."

 kehillah_decree_opening_catalyst:0 "The decree is read"
 kehillah_decree_opening_catalyst_desc:0 "A crier read the decree in the market."
 kehillah_decree_clerks_catalyst:0 "The lord's clerks"
 kehillah_decree_clerks_catalyst_desc:0 "Each month the lord's clerks go further down the list of Jewish houses."
 kehillah_decree_petition_failed_catalyst:0 "A petition refused"
 kehillah_decree_petition_failed_catalyst_desc:0 "The lord heard our petition and refused it."
 kehillah_decree_leave_failed_catalyst:0 "A bluff called"
 kehillah_decree_leave_failed_catalyst_desc:0 "We threatened to leave the realm, and the lord told us to go."
 kehillah_decree_accepted_catalyst:0 "Accepted"
 kehillah_decree_accepted_catalyst_desc:0 "The community accepted the decree without a fight."
 kehillah_decree_paid_catalyst:0 "A price paid"
 kehillah_decree_paid_catalyst_desc:0 "Silver persuaded the lord to lay the decree aside."
 kehillah_decree_leave_catalyst:0 "A threat to leave"
 kehillah_decree_leave_catalyst_desc:0 "The lord believed we would take our trade and our taxes to another realm."
 kehillah_decree_petition_catalyst:0 "A petition heard"
 kehillah_decree_petition_catalyst_desc:0 "Our petition persuaded the lord that the decree does more harm than good."
 kehillah_decree_common_catalyst:0 "A common petition"
 kehillah_decree_common_catalyst_desc:0 "The communities of the realm petitioned together."

 kehillah_decree_answer_decision:0 "Answer the Decree"
 kehillah_decree_answer_decision_desc:0 "Before the decree is enforced, argue it, pay to have it laid aside, or threaten to leave."
 kehillah_decree_answer_decision_tooltip:0 "Answer the lord's decree."
 kehillah_decree_answer_decision_confirm:0 "Answer it"
 kehillah_decree_answer_decision_effect_tt:0 "You consider how to answer the decree."

 kehillah_decree_begins_badge_t:0 "The Badge Decreed"
 kehillah_decree_begins_badge_d:0 "[kehillah_incident_host.GetTitledFirstName] has decreed that every Jew in [kehillah_incident_host.GetHerHis] lands must wear a badge on the outer garment.\n\n#bold The decree is proclaimed, not yet enforced.#! Act from #V A Decree Against the [kehillah_decree_new_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_decree_begins_ghiyar_t:0 "The Ghiyar Decreed"
 kehillah_decree_begins_ghiyar_d:0 "[kehillah_incident_host.GetTitledFirstName] has ordered the old rules of the ghiyar enforced: the yellow sash, no horses inside the walls, a sign over each Jewish door.\n\n#bold The decree is proclaimed, not yet enforced.#! Act from #V A Decree Against the [kehillah_decree_new_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_decree_begins_servants_t:0 "The Servants' Decree"
 kehillah_decree_begins_servants_d:0 "[kehillah_incident_host.GetTitledFirstName] has decreed that no Jew may keep a Christian servant or hold an office over Christians.\n\n#bold The decree is proclaimed, not yet enforced.#! Act from #V A Decree Against the [kehillah_decree_new_title.GetNameNoTooltip]#! in your Situations list."
 kehillah_decree_phase_clerks:0 "The lord's clerks next month: #N +[Situation.MakeScope.ScriptValue('kehillah_decree_window_clerks_value')|0]#! toward Enforced"
 kehillah_decree_done_already_tt:0 "Already done for this decree"
 kehillah_decree_factor_prosperous:0 "The community is prosperous: the lord has much to lose"

 kehillah_decree.0001.t:0 "Crisis: The Badge"
 kehillah_decree.0001.t_ghiyar:0 "Crisis: The Ghiyar"
 kehillah_decree.0001.t_servants:0 "Crisis: The Servants' Decree"
 kehillah_decree.0001.coda:0 "\n\nNothing has been enforced yet. Decrees like this have been argued down, bought off, and forgotten before."
 kehillah_decree.petition:0 "[kehillah_incident_petitioner.GetFirstName] petitions the lord to withdraw it."
 kehillah_decree.petition_self:0 "I will petition the lord myself."
 kehillah_decree.pay:0 "Offer [kehillah_incident_host.GetFirstName] silver to lay it aside."
 kehillah_decree.leave:0 "Tell [kehillah_incident_host.GetFirstName] we will leave the realm rather than obey."
 kehillah_decree.common:0 "Join the realm's other communities in a common petition."
 kehillah_decree_out_persuaded:0 "The lord is persuaded"
 kehillah_decree_out_refused:0 "The lord refuses"
 kehillah_decree_out_believed:0 "The lord believes us"
 kehillah_decree_out_bluff_called:0 "The lord calls our bluff"

 kehillah_decree.0010.t:0 "Answer the Decree"
 kehillah_decree.0010.desc_badge:0 "The tailors have the cloth, and the lord's clerks have a list. But a decree read in the market is not yet a badge on every coat: lords have been argued out of such things, paid to forget them, and frightened by the thought of their Jews leaving with their trade.\n\nHow shall we answer it?"
 kehillah_decree.0010.desc_servants:0 "The cooks and nurses have not been sent away yet, and the toll-house is still ours. The reeve has a list, but a list is not an order carried out: lords have been argued out of such decrees, and paid to forget them.\n\nHow shall we answer it?"

 kehillah_decree.0060.t_enforced:0 "The Decree Is Enforced"
 kehillah_decree.0060.t_suspended:0 "The Decree Is Laid Aside"
 kehillah_decree.0060.t_withdrawn:0 "The Decree Is Withdrawn"
 kehillah_decree.0060.desc_enforced_badge:0 "The clerks have finished their list. From today no Jew of [kehillah_incident_host.GetTitledFirstName]'s lands walks the streets without the mark.\n\nHow we wear it is still ours to decide."
 kehillah_decree.0060.desc_enforced_servants:0 "The cooks and the nurses have gone home to their villages, and a Christian keeps the toll-house by the bridge. The houses on our street are quieter, and colder."
 kehillah_decree.0060.desc_suspended:0 "[kehillah_incident_host.GetTitledFirstName] has laid the decree aside. Nothing is said of the silver, and nothing needs to be: everyone knows what it cost, and that it may be raised again when the lord next needs money."
 kehillah_decree.0060.desc_withdrawn:0 "The decree has been withdrawn. The crier who read it in the market has read the withdrawal too, more quietly, to fewer people."
 kehillah_decree.0060.a:0 "So be it."
 kehillah_decree_suspended_tt:0 "The decree is laid aside, and will not be raised again for some years."
 kehillah_decree_withdrawn_tt:0 "The decree is withdrawn."
 # 2026-11-01: the decree's rolled details (docs/spec/2026-11-01-crisis-variety-and-consistency.md).
 kehillah_decree_participant_group_kehillah_decree_instigators:0 "Who pressed for it"
 kehillah_decree_participant_group_kehillah_decree_instigators_desc:0 "The one who urged the decree on the lord."
 kehillah_decree.lead:0 "[kehillah_incident_host.GetTitledFirstName] has issued a decree against the Jews of [kehillah_incident_host.GetHerHis] lands, and a crier read it in the market this morning. "
 kehillah_decree.who_cleric:0 "It was [kehillah_decree_instigator.GetTitledFirstName], who keeps the lord's conscience, who pressed for it, and [kehillah_decree_instigator.GetSheHe] has the lord's ear. "
 kehillah_decree.who_preacher:0 "A preacher named [kehillah_decree_instigator.GetFirstName] has been at court all season, and this is what came of it. "
 kehillah_decree.who_council:0 "The bishops of the realm met in council and ruled it; the lord has only made their ruling law. "
 kehillah_decree.who_zeal:0 "No one had to press the lord to it. [kehillah_incident_host.GetSheHe|U] wanted it. "
 kehillah_decree.who_merchants:0 "The town's merchants petitioned for it, and the lord listened: a marked Jew is a Jew whose shop is easy to avoid. "
 kehillah_decree.why_war:0 "It comes while the lord's war goes badly, and someone had to answer for it."
 kehillah_decree.why_harvest:0 "It comes after a poor harvest, when bread is dear and tempers are short."
 kehillah_decree.why_spouse:0 "[kehillah_decree_spouse.GetTitledFirstName], known for [kehillah_decree_spouse.GetHerHis] piety, is said to have urged it."
 kehillah_decree.why_canon:0 "The canons of the last council have been read from every pulpit this year."
 kehillah_decree.why_example:0 "A neighbouring lord did the same last year, and was praised for it from the pulpit."
 kehillah_decree.what_rouelle_yellow:0 "\n\nEvery Jew over the age of twelve is to wear a rouelle, a round patch of yellow cloth, on the breast of the outer garment."
 kehillah_decree.what_rouelle_red:0 "\n\nEvery Jew over the age of twelve is to wear a rouelle, a round patch of red cloth, on the breast of the outer garment."
 kehillah_decree.what_rouelle_saffron:0 "\n\nEvery Jew over the age of twelve is to wear a rouelle, a round patch of saffron cloth, on the breast of the outer garment."
 kehillah_decree.what_patch_yellow:0 "\n\nEvery Jew over the age of twelve is to wear a patch of yellow cloth on the outer garment, where all can see it."
 kehillah_decree.what_patch_red:0 "\n\nEvery Jew over the age of twelve is to wear a patch of red cloth on the outer garment, where all can see it."
 kehillah_decree.what_patch_saffron:0 "\n\nEvery Jew over the age of twelve is to wear a patch of saffron cloth on the outer garment, where all can see it."
 kehillah_decree.what_tablets:0 "\n\nEvery Jew over the age of seven is to wear two strips of white cloth on the breast, cut in the shape of the tablets of the Law."
 kehillah_decree.what_hat:0 "\n\nEvery Jewish man is to wear the pointed hat in the street, so that he can be known at a distance."
 kehillah_decree.what_sash:0 "\n\nThe Jews are to wear the yellow sash of the ghiyar, as the old law requires, and may not ride horses inside the walls."
 kehillah_decree.what_sign:0 "\n\nA wooden sign is to be nailed over every Jewish door, and the Jews may not ride horses inside the walls."
 kehillah_decree.what_servants:0 "\n\nNo Jew may keep a Christian servant or nurse in the house, or hold any office over a Christian. On our street that means the women who cook and nurse, and the toll-house by the bridge."
 kehillah_decree.fines_mark:0 " A Jew found without it is to pay a fine to the lord's treasury."
 kehillah_decree.fines_servants:0 " A Jew found keeping a Christian servant is to pay a fine to the lord's treasury."
 kehillah_decree.years_20:0 " It is to stand for twenty years."
 kehillah_decree.years_30:0 " It is to stand for a generation."
 kehillah_decree.years_40:0 " It is to stand for forty years."
 kehillah_decree.exempt:0 "Buy an exemption for my own household."
 kehillah_decree_exempt_tt:0 "If the decree is enforced, your own household will not have to wear the mark. The rest of the quarter will."
 kehillah_decree_exempt_kept_tt:0 "Your own household is exempt, as was bought."
 kehillah_decree.0060.exempt:0 "\n\nYour own household is exempt, as was bought. The rest of the quarter is not, and knows it."
 kehillah_decree.0060.fines:0 "\n\nThe first fines have already been collected."
 kehillah_decree_factor_cleric:0 "The lord's chaplain pressed for the decree"
 kehillah_decree_factor_zeal:0 "The lord wanted the decree himself"
 kehillah_decree_policy_hardens_tt:0 "The lord takes the decree as a first step: the realm's welcome for Jews grows colder."
 kehillah_decree_fines_modifier:0 "Fines Under the Decree"
 kehillah_decree_fines_modifier_desc:0 "Fines for breaking the lord's decree against the Jews are collected from this community."

 # 2026-11-01: after the verdict.
 kehillah_decree_under_set:0 "Under the Decree"
 kehillah_decree_under_set_concept:0 "Under the Decree"
 kehillah_decree_reprieve_set:0 "A Reprieve"
 kehillah_decree_reprieve_set_concept:0 "A Reprieve"
 kehillah_decree_withdrawn_set:0 "Withdrawn"
 kehillah_decree_withdrawn_set_concept:0 "Withdrawn"
 kehillah_decree_aftermath_decision:0 "After the Decree"
 kehillah_decree_aftermath_decision_desc:0 "Decide how the community will live with the decree's outcome."
 kehillah_decree_aftermath_decision_tooltip:0 "Answer the decree's outcome."
 kehillah_decree_aftermath_decision_confirm:0 "Call the elders"
 kehillah_decree_aftermath_decision_effect_tt:0 "The elders meet to decide what comes next."
 kehillah_decree.0070.t:0 "After the Decree"
 kehillah_decree.0070.desc_mark:0 "The quarter wears the mark now. Some keep their cloaks closed over it in the street; some have started wearing it on the outside, where everyone can see."
 kehillah_decree.0070.desc_servants:0 "The village women have gone home, and the households are learning to do without them. On the Sabbath, the fires are going out."
 kehillah_decree.0070.desc_lifted:0 "The decree is not being enforced. No one in the quarter quite believes it is gone for good."
 kehillah_decree.0070.sermon:0 "The rabbi will preach on wearing it with dignity: our fathers wore their names."
 kehillah_decree.0070.own:0 "Pay our own young people to keep the fires and mind the children."
 kehillah_decree.0070.thanks:0 "A quiet gift for the lord's household."
