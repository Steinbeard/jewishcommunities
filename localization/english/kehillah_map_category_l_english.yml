l_english:

 #####################################################################
 # The Jewish map-mode category and the Community Crises map
 # (2026-11-08, docs/implementation/2026-11-08-jewish-map-category.md).
 # The *_TOOLTIP_* keys are map hover cards, evaluated in PROVINCE scope
 # like the communities map's (kehillah_map_view_l_english.yml). In the
 # kehillah_crisis_map_* keys, ROOT is the community title Custom() was
 # called on (common/customizable_localization/kehillah_map_card_custom_loc.txt).
 #####################################################################

 ### The category button beside Faiths, Cultures and Houses.
 KEHILLAH_JEWISH_MAP_MODES_TOOLTIP:0 "#T Jewish Map Modes#!\nThe Jewish world on the map: its communities, their rites, their crises, each realm's law on its Jews, its libraries, and the Jewish culture native to each land.\n\n#weak Opens Jewish Communities. The strip above the map switches between the six views.#!"

 ### The Community Crises map mode. Name and _desc follow vanilla's own
 ### map-mode convention; the _desc is also its button's tooltip.
 kehillah_community_crises_map:0 "Community Crises"
 kehillah_community_crises_map_desc:0 "#T Community Crises#!\nEach Kehillah's quarter, colored by the trouble it faces:\n #EMP Red#!: an armed host or a mob\n #EMP Orange#!: agitation in the town\n #EMP Purple#!: a decree, a trial of the Talmud or an expulsion\n #EMP Blue#!: the aftermath of an attack\n #EMP Yellow#!: no crisis, but tense or worse\n #EMP Green#!: no crisis, and calm or uneasy\n\n#weak Hover a colored quarter to see its crisis and its danger of violence.#!"

 # The hover card. Laid out like the communities map's: name, place and
 # leader, then the facts this map is about.
 KEHILLAH_CRISES_MAP_TOOLTIP_COMMUNITY:0 "#T [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetNameNoTooltip]#!\n#weak [ROOT.Province.GetCounty.GetName], led by [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetHolder.GetShortUINameNoTooltip]#!\n\n#EMP Crisis#!: [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.Custom('KehillahCrisisMapStatus')][ROOT.Province.MakeScope.Var('kehillah_map_community').Title.Custom('KehillahCrisisMapDetail')]\n#EMP Danger of violence#!: [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetHolder.Custom('KehillahDangerBand')] #weak ([ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetHolder.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]% chance of trouble this year)#![ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetHolder.Custom('KehillahTroubleStatusLine')]"
 KEHILLAH_CRISES_MAP_TOOLTIP_NONE:0 "#T [ROOT.Province.GetCounty.GetName]#!\n#weak No Kehillah lives here.#!"

 kehillah_crisis_map_status_mob:0 "#N A mob against the quarter#!"
 kehillah_crisis_map_status_armed:0 "#N An armed host#!"
 kehillah_crisis_map_status_agitation:0 "#N Agitation#!"
 kehillah_crisis_map_status_expulsion:0 "#N Expulsion#!"
 kehillah_crisis_map_status_decree:0 "#N A decree against the Jews#!"
 kehillah_crisis_map_status_trial:0 "#N The Talmud on trial#!"
 kehillah_crisis_map_status_aftermath:0 "#E Aftermath of an attack#!"
 kehillah_crisis_map_status_none:0 "#P None#!"

 kehillah_crisis_map_detail_attack:0 "\n#weak [ROOT.Title.MakeScope.Var('kehillah_crisis_situation').Situation.GetNameNoTooltip]. Now:#! [ROOT.Title.MakeScope.Var('kehillah_crisis_situation').Situation.GetTopCurrentPhase.GetType.GetNameNoTooltip] #weak $kehillah_crisis_map_grade_tag$#!\n#EMP Cause#!: [ROOT.Title.Custom('KehillahCrisisCause')]"
 kehillah_crisis_map_detail_cause:0 "\n#EMP Cause#!: [ROOT.Title.Custom('KehillahCrisisCause')]"
 kehillah_crisis_map_detail_decree:0 "\n#weak [ROOT.Title.MakeScope.Var('kehillah_decree_situation').Situation.GetNameNoTooltip]. Now:#! [ROOT.Title.MakeScope.Var('kehillah_decree_situation').Situation.GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 kehillah_crisis_map_detail_trial:0 "\n#weak [ROOT.Title.MakeScope.Var('kehillah_trial_situation').Situation.GetNameNoTooltip]. Now:#! [ROOT.Title.MakeScope.Var('kehillah_trial_situation').Situation.GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 kehillah_crisis_map_detail_none:0 ""

 ### The colour titles (common/landed_titles/kehillah_map_color_titles.txt).
 ### Never shown to a player; named so a leaked key never reads raw.
 d_kehillah_mapcolor_crisis_armed:0 "Map color: Armed host"
 d_kehillah_mapcolor_crisis_armed_adj:0 "Armed host"
 d_kehillah_mapcolor_crisis_agitation:0 "Map color: Agitation"
 d_kehillah_mapcolor_crisis_agitation_adj:0 "Agitation"
 d_kehillah_mapcolor_crisis_decree:0 "Map color: Decree, trial or expulsion"
 d_kehillah_mapcolor_crisis_decree_adj:0 "Decree, trial or expulsion"
 d_kehillah_mapcolor_crisis_aftermath:0 "Map color: Aftermath"
 d_kehillah_mapcolor_crisis_aftermath_adj:0 "Aftermath"
 d_kehillah_mapcolor_crisis_tense:0 "Map color: Tense"
 d_kehillah_mapcolor_crisis_tense_adj:0 "Tense"
 d_kehillah_mapcolor_crisis_calm:0 "Map color: Calm"
 d_kehillah_mapcolor_crisis_calm_adj:0 "Calm"

 ### The Jewish Libraries map's hover card (KehillahLibraryMapKind and
 ### KehillahLibraryMapShas; ROOT is the library title).
 kehillah_library_map_kind_sealed:0 "#N Sealed#! #weak under a lord who is not Jewish; no one may study here#!"
 kehillah_library_map_kind_yeshiva:0 "#P Seat of a yeshiva#!"
 kehillah_library_map_kind_karaite:0 "Karaite"
 kehillah_library_map_kind_haymanot:0 "Haymanot"
 kehillah_library_map_kind_rabbanite:0 "Rabbanite"
 kehillah_library_map_shas_complete:0 "#P A complete Shas#! #weak (all six orders)#!"
 kehillah_library_map_shas_partial:0 "[ROOT.Title.MakeScope.ScriptValue('kehillah_lib_bavli_held_count_value')|0] of 6 orders"
