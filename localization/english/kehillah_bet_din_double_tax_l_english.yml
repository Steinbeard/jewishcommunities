l_english:
 kehillah_bet_din.0501.t:0 "The Ruler's Double Tax Demand"
 kehillah_bet_din.0501.desc:0 "[kbd_litigant_a.GetFirstName] represents officers who want to pay a new royal collector before he seizes goods. [kbd_litigant_b.GetFirstName] speaks for households who say the same tax went to his predecessor. The old receipt is said to be with a merchant abroad. Defiance is dangerous; paying twice would drain the community."
 kehillah_bet_din.0501.a:0 "Pay the collector again from communal reserves."
 kehillah_bet_din.0501.a.tt:0 "Goods stay safe today, but a genuine prior payment would make this an unnecessary second tax."
 kehillah_bet_din.0501.b:0 "Offer security and seek the old receipt."
 kehillah_bet_din.0501.b.tt:0 "Security buys time at a cost while proof is gathered."
 kehillah_bet_din.0501.c:0 "Refuse payment and challenge the demand openly."
 kehillah_bet_din.0501.c.tt:0 "The treasury is spared, but a missing first payment could trigger a lawful seizure."
 kehillah_din_source_50:0 "Cite a mastered Nezikin work and verify the earlier payment."
 kehillah_din_source_50_tt:0 "Mishnah Bava Batra 1:5 addresses common expenses, not the contents of this royal receipt."
 kehillah_din_combo_50:0 "Have a scholar and steward secure goods while tracing the tax."
 kehillah_din_combo_50_tt:0 "The judges seek proof without leaving households unprotected."
 kehillah_bet_din.0504.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0504.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0504.outcome_1:0 "The court pays the demand and asks households to replenish reserves."
 kehillah_bet_din.0504.outcome_2:0 "The court offers security while a messenger seeks the predecessor's receipt."
 kehillah_bet_din.0504.outcome_3:0 "The court refuses the new collector and prepares a challenge."
 kehillah_bet_din.0504.fact_true:0 "The old receipt is authentic and covers this levy. Paying again conceded a double demand."
 kehillah_bet_din.0504.fact_false:0 "The old collector took payment for a different year. Refusal exposed the community to collection."
 kehillah_bet_din.0504.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0504.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0504.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case50_one_tt:0 "A second payment costs substantial Prosperity."
 kehillah_din_case50_two_tt:0 "Security and inquiry cost some Prosperity."
 kehillah_din_case50_three_tt:0 "Defiance costs less now but may expose goods."
 kehillah_bet_din_case50_great_log_title:0 "The Ruler's Double Tax Demand: a well-supported ruling"
 kehillah_bet_din_case50_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s royal tax demand."
