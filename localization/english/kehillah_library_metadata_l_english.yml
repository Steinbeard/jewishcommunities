 KEHILLAH_LIB_PANEL_OPEN_TT:0 "#T Beit Midrash library#!\nBrowse the community's sefarim, inspect their history and mastery, begin a study course, or donate a copy. Books belong to the community; mastery belongs to a scholar. Use the Books and Yeshiva tabs to switch between the collection and its school."
 KEHILLAH_LIB_STUDY_TT:0 "#T Begin Learn Torah#!\nAn ordained rabbi can begin a study scheme on this work for 10 Piety. The book must be held by your own community, and you cannot already be studying."
 KEHILLAH_LIB_TIER_TT:0 "#T Rabbinic foundation tier#!\nI: protected Bavli foundation; II: other foundational rabbinic sources; III: major received works; IV: specialized or later works. This is a starting Rabbinic classification, not a universal faith canon or dynamic reputation."
 KEHILLAH_LIB_DATE_NOTE:0 "The January 1 game date is a dating convention, not an attested day of composition."
 KEHILLAH_LIB_READERS_ACTION:0 "Rabbis who mastered it"
 KEHILLAH_LIB_READERS_TT:0 "#T Recorded masters#!\nShow living ordained rabbis whose successful study of this work has been recorded. Older saves can lack some earlier readers."
