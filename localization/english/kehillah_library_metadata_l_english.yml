 KEHILLAH_LIB_CORPUS_BAVLI_DETAIL:0 "Compiled across the Babylonian academies in late antiquity, the Bavli sets the Mishnah beside generations of argument, story, and legal analysis. Rabbinic scholars treat it as a foundation of study and judgment. This collection models six orders as separate volumes and mastery milestones; Zeraim and Tahorot have much less surviving Babylonian Gemara than the other orders."
 KEHILLAH_LIB_CORPUS_YERUSHALMI_DETAIL:0 "The Yerushalmi preserves discussion in the academies of Roman Palestine, chiefly Galilee, before the Bavli reached its later form. Its compact arguments often take a different route through the same Mishnah. This collection currently models four orders as distinct study volumes; the display does not claim to represent every surviving tractate."
 KEHILLAH_LIB_CORPUS_BAVLI_TT:0 "#T Babylonian Talmud#!\n#E Foundational#!  •  Talmudics\n#high Compilers#!: Babylonian academies (collective redaction)\n#high Composition#!: c. 600 (game: 600.1.1)\n#high First mastery reward#!: Rabbi Talmudics XP and Piety; Talmud Torah followers also gain Learning XP and Piety.\n\nThe Mishnah and the Babylonian Gemara are studied together. Open the collection to inspect its six modeled orders."
 KEHILLAH_LIB_CORPUS_YERUSHALMI_TT:0 "#T Jerusalem Talmud#!\n#E Essential#!  •  Talmudics\n#high Compilers#!: Palestinian academies (collective redaction)\n#high Composition#!: c. 425 (game: 425.1.1)\n#high First mastery reward#!: Rabbi Talmudics XP and Piety; Talmud Torah followers also gain Learning XP and Piety.\n\nOpen the collection to inspect its four modeled orders."
 KEHILLAH_LIB_CORPUS_INSTRUCTION:0 "#weak Select an order to inspect its contents, begin study, donate a held volume, or view recorded masters.#!"
