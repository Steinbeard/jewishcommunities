 KEHILLAH_LIB_CORPUS_BAVLI_RANK:0 "Foundational"
 KEHILLAH_LIB_CORPUS_YERUSHALMI_RANK:0 "Essential"
 KEHILLAH_LIB_CORPUS_BAVLI_PROGRESS:0 "[GetPlayer.MakeScope.ScriptValue('kehillah_lib_bavli_mastered_count_value')|0]/6 mastered  •  [Title.MakeScope.ScriptValue('kehillah_lib_bavli_held_count_value')|0]/6 orders held"
