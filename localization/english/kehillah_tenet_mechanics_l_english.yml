 # =====================================================================
 doctrine_parameter_kehillah_tenet_hokhmah_shtadlan:0 "Followers may discuss known religious teachings using Learning and Diplomacy. When serving a Kehillah, the Shtadlan also makes more effective petitions."
 doctrine_parameter_kehillah_tenet_hokhmah_shtadlan_personal:0 "Personal adoption improves reasoned debate and the study of works of thought."
 doctrine_parameter_kehillah_tenet_emunah_sermon:0 "Jewish Kehillah: a sermon also raises community Stability"
 doctrine_parameter_kehillah_tenet_emunah_sermon_personal:0 "Gains more [piety|E] from preaching a sermon"
 doctrine_parameter_kehillah_tenet_pesak_bench:0 "Judges rule better in the Bet Din, in disputes and in responsa"
 doctrine_parameter_kehillah_tenet_pesak_bench_personal:0 "Rules better as a judge in the Bet Din, in disputes and in responsa"
 doctrine_parameter_kehillah_tenet_pilpul_yeshiva:0 "Yeshivot: #P +1#! Quarterly Fame"
 doctrine_parameter_kehillah_tenet_pilpul_yeshiva_personal:0 "A personally committed Rosh Yeshiva supplies the fame bonus when the rite does not"
 doctrine_parameter_kehillah_tenet_geonut_academy:0 "Jewish rites: the head speaks with the academies' authority; a rabbi of lesser [piety|E] may be acclaimed"
 doctrine_parameter_kehillah_tenet_geonut_academy_personal:0 "Jewish head of rite: speaks with the academies' authority"
 doctrine_parameter_kehillah_tenet_minhag_feast:0 "A festival feast held by a Kehillah's leader raises its Stability"
 doctrine_parameter_kehillah_tenet_minhag_feast_personal:0 "As a Kehillah leader, his festival feasts raise the community's Stability"
 doctrine_parameter_kehillah_tenet_zion_alms:0 "Unlocks #V Send Alms to a Sacred Site#!"
 doctrine_parameter_kehillah_tenet_zion_alms_personal:0 "Sacred-site alms grant additional [piety|E] and relieve [stress|E]"
 kehillah_geonut_head_modifier:0 "The Academies' Authority"
 kehillah_geonut_head_modifier_desc:0 "This head of the rite rules as the Geonim of Sura and Pumbedita once ruled the diaspora."

 kehillah_send_zion_alms_decision:0 "Send Alms to a Sacred Site"
 kehillah_send_zion_alms_decision_desc:0 "A sacred place of my faith deserves care, as do the faithful who live nearby. I could send an offering or remember them in prayer."
 kehillah_send_zion_alms_decision_tooltip:0 "Support a sacred site of your own faith"
 kehillah_send_zion_alms_decision_confirm:0 "Consider an offering"
 kehillah_send_zion_alms_decision_tt:0 "The offering supports a sacred site of your faith and its resident community where one is represented."

