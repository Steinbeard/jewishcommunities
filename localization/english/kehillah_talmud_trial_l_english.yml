 # The Talmud on trial as a situation (docs/spec/2026-11-01-talmud-trial-situation.md), 2026-11-01.
 situation_type_kehillah_talmud_trial:0 "The Talmud on Trial"
 situation_kehillah_talmud_trial:0 "The Talmud on Trial in the [Situation.MakeScope.Var('kehillah_trial_title').Title.GetNameNoTooltip]"
 situation_type_kehillah_talmud_trial_desc:0 "A convert has denounced the community's books before its lord. If the denunciation is believed, the books are seized and the community must defend them in the lord's hall; the verdict decides whether they come back whole, cut, or not at all."
 situation_kehillah_talmud_trial_desc:0 "$situation_type_kehillah_talmud_trial_desc$"
 kehillah_talmud_trial_sub_region_kehillah_trial_area:0 "The accused community"
 kehillah_talmud_trial_participant_group_kehillah_trial_defence:0 "The defence"
 kehillah_talmud_trial_participant_group_kehillah_trial_defence_desc:0 "The leader of the community whose books are on trial."
 kehillah_talmud_trial_participant_group_kehillah_trial_accusers:0 "The accuser"
 kehillah_talmud_trial_participant_group_kehillah_trial_accusers_desc:0 "The convert who denounced the books, and whoever stands behind him."
 kehillah_talmud_trial_participant_group_kehillah_trial_judges:0 "The judges"
 kehillah_talmud_trial_participant_group_kehillah_trial_judges_desc:0 "The ruler before whom the books are tried."

 kehillah_talmud_trial_kehillah_trial_denunciation_situation_phase:0 "Denunciation"
 kehillah_talmud_trial_kehillah_trial_seizure_situation_phase:0 "The books are seized"
 kehillah_talmud_trial_kehillah_trial_hearing_situation_phase:0 "The hearing"
 kehillah_talmud_trial_kehillah_trial_quashed_situation_phase:0 "Quashed"
 kehillah_talmud_trial_kehillah_trial_acquittal_situation_phase:0 "Acquittal"
 kehillah_talmud_trial_kehillah_trial_expurgation_situation_phase:0 "Expurgation"
 kehillah_talmud_trial_kehillah_trial_condemnation_situation_phase:0 "Condemnation"
 kehillah_talmud_trial_kehillah_trial_closed_situation_phase:0 "Closed"
 # 2026-11-10: the phase tooltips (SituationPhaseType.GetDesc). The kehillah_trial_<phase>_desc
 # keys below are not read by the game.
 kehillah_talmud_trial_kehillah_trial_denunciation_situation_phase_desc:0 "In the Denunciation [situation_phase|E], a convert has laid articles against the community's books before the lord, claiming that they blaspheme against his new faith. The lord must decide whether the charges deserve a hearing, or whether the matter should be dropped."
 kehillah_talmud_trial_kehillah_trial_seizure_situation_phase_desc:0 "The lord's men have carried the community's books away to be examined. While the volumes lie in the lord's keeping, the community chooses who will speak in their defense and gathers what letters and learning it can."
 kehillah_talmud_trial_kehillah_trial_hearing_situation_phase_desc:0 "The books are tried in the lord's hall. The accuser reads out his passages one by one, and the community's disputant must answer each before judges who are seldom impartial."
 kehillah_talmud_trial_kehillah_trial_quashed_situation_phase_desc:0 "The lord has declined to hear the charges. The books remain in the community's hands, and the accuser leaves with nothing."
 kehillah_talmud_trial_kehillah_trial_acquittal_situation_phase_desc:0 "The judges have found the charges unproven. The books are returned to the community whole."
 kehillah_talmud_trial_kehillah_trial_expurgation_situation_phase_desc:0 "The judges have ordered the offending passages struck out. The books come back to the community, their pages scored through by the censor's pen."
 kehillah_talmud_trial_kehillah_trial_condemnation_situation_phase_desc:0 "The judges have condemned the books. Before a watching crowd, the volumes the community could not save are burned in the public square."
 kehillah_talmud_trial_kehillah_trial_closed_situation_phase_desc:0 "The trial is over, and the community counts what it kept and what it lost."
 kehillah_trial_denunciation:0 "Denunciation"
 kehillah_trial_denunciation_desc:0 "The accuser's articles are before the lord. If the seizure fills first, the lord's men take the books; if Quashed fills first, the lord lets the matter drop."
 kehillah_trial_seizure:0 "The books are seized"
 kehillah_trial_seizure_desc:0 "The books are in the lord's hands. Before the hearing, the community chooses and prepares its disputant, seeks letters, and saves what it can."
 kehillah_trial_hearing:0 "The hearing"
 kehillah_trial_hearing_desc:0 "Three sessions in the lord's hall. Each answer moves the verdict; the judges lean on the scale each month."
 kehillah_trial_quashed:0 "Quashed"
 kehillah_trial_quashed_desc:0 "The lord has let the matter drop. The books stay where they are."
 kehillah_trial_acquittal:0 "Acquittal"
 kehillah_trial_acquittal_desc:0 "The charges have failed. The books come back."
 kehillah_trial_expurgation:0 "Expurgation"
 kehillah_trial_expurgation_desc:0 "The books come back with passages struck out."
 kehillah_trial_condemnation:0 "Condemnation"
 kehillah_trial_condemnation_desc:0 "The books are condemned to the fire."
 kehillah_trial_closed:0 "Closed"
 kehillah_trial_closed_desc:0 "The trial is over."

 kehillah_trial_opening_catalyst:0 "The articles are read"
 kehillah_trial_opening_catalyst_desc:0 "The accuser has read his list of passages before the lord."
 kehillah_trial_accuser_catalyst:0 "The accuser presses his case"
 kehillah_trial_accuser_catalyst_desc:0 "Each month the accuser reads his articles again, to the lord and to anyone who will listen."
 kehillah_trial_quash_answer_catalyst:0 "The articles answered"
 kehillah_trial_quash_answer_catalyst_desc:0 "Our written answer showed the passages to be misread."
 kehillah_trial_quash_plead_catalyst:0 "The lord was persuaded"
 kehillah_trial_quash_plead_catalyst_desc:0 "The lord was persuaded the matter is beneath him."
 kehillah_trial_quash_silver_catalyst:0 "Silver for the lord"
 kehillah_trial_quash_silver_catalyst_desc:0 "Silver reminded the lord what the community is worth to him."
 kehillah_trial_quash_letter_catalyst:0 "A letter from the head of the faith"
 kehillah_trial_quash_letter_catalyst_desc:0 "The head of the faith has written that the matter should not go further."
 kehillah_trial_seize_answer_failed_catalyst:0 "A poor answer"
 kehillah_trial_seize_answer_failed_catalyst_desc:0 "Our written answer was turned against us."
 kehillah_trial_seize_plead_failed_catalyst:0 "The lord unmoved"
 kehillah_trial_seize_plead_failed_catalyst_desc:0 "The lord heard our plea and was not moved."
 kehillah_trial_accuser_gone_catalyst:0 "The accuser is gone"
 kehillah_trial_accuser_gone_catalyst_desc:0 "With no accuser, the case cannot go on."
 kehillah_trial_seed_prepared_catalyst:0 "A disputant prepared"
 kehillah_trial_seed_prepared_catalyst_desc:0 "Our disputant spent the seizure studying the articles."
 kehillah_trial_seed_letter_catalyst:0 "A letter read in the hall"
 kehillah_trial_seed_letter_catalyst_desc:0 "A letter from the head of the faith was read before the judges."
 kehillah_trial_seed_found_catalyst:0 "The hidden books were found"
 kehillah_trial_seed_found_catalyst_desc:0 "The books we hid were found, and the court took it as a confession."
 kehillah_trial_bold_win_catalyst:0 "A bold answer"
 kehillah_trial_bold_win_catalyst_desc:0 "Our disputant answered boldly, and the hall had no reply."
 kehillah_trial_bold_loss_catalyst:0 "A bold answer that failed"
 kehillah_trial_bold_loss_catalyst_desc:0 "Our disputant answered boldly, and the judges took offence."
 kehillah_trial_cautious_win_catalyst:0 "A careful answer"
 kehillah_trial_cautious_win_catalyst_desc:0 "Our disputant answered carefully and carried the point."
 kehillah_trial_cautious_win_expurgation_catalyst:0 "Ground given"
 kehillah_trial_cautious_win_expurgation_catalyst_desc:0 "To carry the point, our disputant allowed that some passages might be read amiss."
 kehillah_trial_cautious_loss_catalyst:0 "A careful answer that failed"
 kehillah_trial_cautious_loss_catalyst_desc:0 "Our disputant answered carefully and still lost the point."
 kehillah_trial_cautious_loss_expurgation_catalyst:0 "Passages conceded"
 kehillah_trial_cautious_loss_expurgation_catalyst_desc:0 "Our disputant conceded passages rather than lose the books."
 kehillah_trial_judges_acquittal_catalyst:0 "A fair judge"
 kehillah_trial_judges_acquittal_catalyst_desc:0 "The judge is well-disposed toward the Jews, and it shows."
 kehillah_trial_judges_expurgation_catalyst:0 "A judge who wants it over"
 kehillah_trial_judges_expurgation_catalyst_desc:0 "The judge cares little either way, and a few struck passages would end the matter."
 kehillah_trial_judges_condemnation_catalyst:0 "A hostile judge"
 kehillah_trial_judges_condemnation_catalyst_desc:0 "The judge has made up his mind about the Jews, and about their books."

 kehillah_trial_defence_decision:0 "Prepare the Defence"
 kehillah_trial_defence_decision_desc:0 "Decide who will answer the accuser, and how."
 kehillah_trial_defence_decision_tooltip:0 "Prepare the defence of the books."
 kehillah_trial_defence_decision_confirm:0 "Call the scholars"
 kehillah_trial_defence_decision_effect_tt:0 "The scholars meet to prepare the defence."
 kehillah_trial_protect_decision:0 "Seek Protection"
 kehillah_trial_protect_decision_desc:0 "Ask the lord, or the head of the faith, to stand between the accuser and the books."
 kehillah_trial_protect_decision_tooltip:0 "Seek protection for the books."
 kehillah_trial_protect_decision_confirm:0 "Seek protection"
 kehillah_trial_protect_decision_effect_tt:0 "You consider whom to ask for protection."
 kehillah_trial_books_decision:0 "Save the Books"
 kehillah_trial_books_decision_desc:0 "Whatever the court decides, save what can be saved."
 kehillah_trial_books_decision_tooltip:0 "Save what books can be saved."
 kehillah_trial_books_decision_confirm:0 "Save the books"
 kehillah_trial_books_decision_effect_tt:0 "You consider how to save the books."

 kehillah_trial_begins_t:0 "The Talmud Denounced"
 kehillah_trial_begins_d:0 "A convert who once studied in our house of study has read a list of passages from the Talmud before [kehillah_incident_host.GetTitledFirstName], and says they blaspheme. If the lord believes him, his men will come for the books.\n\n#bold A trial has begun.#! Act from #V The Talmud on Trial#! in your Situations list."
 kehillah_trial_phase_accuser:0 "The accuser next month: #N +[Situation.MakeScope.ScriptValue('kehillah_trial_window_accuser_value')|0]#! toward the seizure"
 kehillah_trial_phase_judges_acquittal:0 "The judges lean each month: #P +[Situation.MakeScope.ScriptValue('kehillah_trial_window_judges_acquittal_value')|0]#! toward Acquittal"
 kehillah_trial_phase_judges_expurgation:0 "The judges lean each month: +[Situation.MakeScope.ScriptValue('kehillah_trial_window_judges_expurgation_value')|0] toward Expurgation"
 kehillah_trial_phase_judges_condemnation:0 "The judges lean each month: #N +[Situation.MakeScope.ScriptValue('kehillah_trial_window_judges_condemnation_value')|0]#! toward Condemnation"
 kehillah_trial_begins_son_in_law_d:0 "A convert who was once betrothed to a daughter of our community has read a list of passages from the Talmud before [kehillah_incident_host.GetTitledFirstName], and says they blaspheme. If the lord believes him, his men will come for the books.\n\n#bold A trial has begun.#! Act from #V The Talmud on Trial#! in your Situations list."
 kehillah_trial_begins_rival_d:0 "A scholar who left us after a quarrel with the rabbi, and was baptized, has read a list of passages from the Talmud before [kehillah_incident_host.GetTitledFirstName], and says they blaspheme. If the lord believes him, his men will come for the books.\n\n#bold A trial has begun.#! Act from #V The Talmud on Trial#! in your Situations list."
 kehillah_trial_find_window_tt:0 "The trial is in your #V Situations#! list. Act from there."
 kehillah_trial_done_already_tt:0 "Already done in this trial"

 kehillah_talmud_trial.0001.t:0 "Crisis: The Talmud Denounced"
 kehillah_talmud_trial.0001.desc:0 "[kehillah_trial_accuser_scope.GetFirstName] studied in our house of study as a boy. Some years ago he went to the priests and was baptized.\n\nNow he has come back with a list of passages from the Talmud, and he has read them aloud before [kehillah_incident_host.GetTitledFirstName]. He says they insult Christ and his mother. He knows which houses keep the books.\n\nThe lord has not yet decided what to do with the list. If he believes it, his men will come for every volume, and we will be summoned to defend them in his hall."
 kehillah_talmud_trial.0001.a:0 "We will answer his articles in writing, passage by passage."
 kehillah_talmud_trial.0001.b:0 "[kehillah_incident_petitioner.GetFirstName] goes to the castle before the lord makes up his mind."
 kehillah_talmud_trial.0001.b_self:0 "I will go to the castle before the lord makes up his mind."
 kehillah_talmud_trial.0001.c:0 "Hide the books tonight."
 kehillah_talmud_trial.0001.d:0 "We will wait, and pray the lord loses interest."

 kehillah_talmud_trial.0010.t:0 "Prepare the Defence"
 kehillah_talmud_trial.0010.desc_denunciation:0 "The scholars have copied out the accuser's articles and read them through. Most are passages torn from their place; a few are harder to explain to a Christian court.\n\nAn answer in writing, before the lord decides, might end the matter. A poor one would be read as proof."
 kehillah_talmud_trial.0010.desc_seizure:0 "The books are gone, and the hearing is set. Someone must stand in the lord's hall and answer the accuser, passage by passage, from memory if need be.\n\nWho will it be?"
 kehillah_talmud_trial.0010.desc_hearing:0 "The hearing has begun. Whoever was chosen to answer must answer now; there is no more time to prepare."
 kehillah_talmud_trial.0010.answer:0 "Answer the articles in writing."
 kehillah_talmud_trial.0010.dayyan:0 "[kehillah_incident_dayyan.GetFirstName] will prepare the defence and answer him."
 kehillah_talmud_trial.0010.self:0 "I will prepare the defence and answer him myself."

 kehillah_talmud_trial.0020.t:0 "Seek Protection"
 kehillah_talmud_trial.0020.desc_denunciation:0 "[kehillah_incident_host.GetTitledFirstName] has the accuser's list, and has not yet sent his men. A lord who can be persuaded that the matter is beneath him, or paid to think so, may never send them.\n\nTo whom shall we turn?"
 kehillah_talmud_trial.0020.desc_later:0 "The lord has taken the books and will hear the case. He will not drop it now, but a letter from the head of the faith, read in his hall, may still weigh with the judges.\n\nTo whom shall we turn?"
 kehillah_talmud_trial.0020.plead:0 "Send [kehillah_incident_petitioner.GetFirstName] to plead with [kehillah_incident_host.GetTitledFirstName]."
 kehillah_talmud_trial.0020.plead_self:0 "Go to [kehillah_incident_host.GetTitledFirstName] yourself and plead."
 kehillah_talmud_trial.0020.silver:0 "Send silver to [kehillah_incident_host.GetTitledFirstName]."
 kehillah_talmud_trial.0020.letter:0 "Write to [kehillah_trial_hof.GetTitledFirstName], asking for a letter in our defence."

 kehillah_talmud_trial.0030.t:0 "Save the Books"
 kehillah_talmud_trial.0030.desc:0 "Whatever the court decides, the books themselves can still be saved: some carried to houses the accuser does not know, the rarest copied by scribes who will be paid well and say nothing.\n\nWhat shall we save?"
 kehillah_talmud_trial.0030.hide:0 "Hide the books in houses he does not know."
 kehillah_talmud_trial.0030.copy:0 "Pay scribes to copy the rarest volumes."

 kehillah_talmud_trial.0040.t:0 "The Books Are Taken"
 kehillah_talmud_trial.0040.desc:0 "The lord's men came at first light with a list of houses and a cart. They took what they found, volume by volume, and the accuser stood by the cart and counted.\n\nThe hearing is set for two months from now."
 kehillah_talmud_trial.0040.hidden:0 "\n\nThey did not find everything. Some volumes are under floors and in cellars he never knew of."
 kehillah_talmud_trial.0040.found:0 "\n\nThey went straight to the houses where we had hidden the rest. He knew those too."
 kehillah_talmud_trial.0040.all:0 "\n\nThe house of study is empty. The students sit at bare tables and recite from memory."
 kehillah_talmud_trial.0040.a:0 "Then we will prepare the defence."

 kehillah_talmud_trial.0050.t:0 "A Session of the Hearing"
 kehillah_talmud_trial.0050.desc_first:0 "The hall is full. [kehillah_incident_host.GetTitledFirstName] sits with his clergy, and [kehillah_trial_accuser_scope.GetFirstName] reads the first of his articles: a passage, he says, that mocks the faith of everyone in the room.\n\n[kehillah_trial_disputant_scope.GetFirstName] rises to answer."
 kehillah_talmud_trial.0050.desc_second:0 "The second session. The accuser has new passages, and the judges have heard the first answers. They watch [kehillah_trial_disputant_scope.GetFirstName] now the way men watch a wrestler who has already been thrown once."
 kehillah_talmud_trial.0050.desc_third:0 "The last session. Whatever is said today is what the judges will remember when they decide.\n\n[kehillah_trial_disputant_scope.GetFirstName] can try to win the argument outright, or give ground on a few passages to save the rest."
 kehillah_talmud_trial.0050.bold:0 "Answer boldly: the passages mean what our sages say they mean."
 kehillah_talmud_trial.0050.cautious:0 "Answer carefully, and give ground where it costs least."

 kehillah_talmud_trial.0060.t_quashed:0 "The Matter Is Dropped"
 kehillah_talmud_trial.0060.t_acquittal:0 "The Charges Fail"
 kehillah_talmud_trial.0060.t_expurgation:0 "Passages Struck Out"
 kehillah_talmud_trial.0060.t_condemnation:0 "The Books Are Condemned"
 kehillah_talmud_trial.0060.desc_quashed:0 "[kehillah_incident_host.GetTitledFirstName] has let the matter drop. The accuser's list lies on some clerk's table, and the books are still in the house of study.\n\nNo one in the quarter quite believes it is over."
 kehillah_talmud_trial.0060.desc_acquittal:0 "The judges found nothing in the books that deserved the fire. The cart that carried them away has brought them back, and the students have carried them inside in their arms."
 kehillah_talmud_trial.0060.desc_expurgation:0 "The books have come back, but not as they left. A clerk's pen has gone through them, and passage after passage is struck out with a heavy line.\n\nThe scholars say the words are still under the ink. They say it quietly."
 kehillah_talmud_trial.0060.desc_condemnation:0 "The judges condemned the books. They were burned in the square, cartload after cartload, while the town watched.\n\nThe house of study is empty."
 kehillah_talmud_trial.0060.desc_condemnation_saved:0 "The judges condemned the books, and the books they had were burned in the square while the town watched.\n\nThey did not have them all. What was hidden, or copied, is still ours."
 kehillah_talmud_trial.0060.a:0 "We will remember this."

 kehillah_trial_out_answered:0 "The answer holds"
 kehillah_trial_out_answer_failed:0 "The answer is turned against us"
 kehillah_trial_out_lord_listens:0 "The lord listens"
 kehillah_trial_out_lord_unmoved:0 "The lord is unmoved"
 kehillah_trial_out_letter_comes:0 "A letter comes"
 kehillah_trial_out_letter_silent:0 "No answer comes"
 kehillah_trial_out_hidden:0 "The books stay hidden"
 kehillah_trial_out_found:0 "He knows where to look"
 kehillah_trial_out_session_won:0 "The point is ours"
 kehillah_trial_out_session_lost:0 "The point is lost"
 kehillah_trial_letter_kept_tt:0 "The letter will be read in the hall when the hearing opens."
 kehillah_trial_letter_silent_tt:0 "The messenger's journey is wasted."
 kehillah_trial_hidden_tt:0 "Some volumes are safe from the lord's men, whatever the verdict."
 kehillah_trial_found_tt:0 "The accuser will tell the court where we hid them, and the court will take it as a confession."
 kehillah_trial_copied_tt:0 "Whatever is burned, a copy of the rarest volumes remains."
 kehillah_trial_prepared_tt:0 "The disputant studies the articles until the hearing, and will answer the accuser in the hall."
 kehillah_trial_expurgated_tt:0 "The books come back with passages struck out, and the charter is read more strictly."
 kehillah_trial_burned_saved_tt:0 "The books the lord took are burned, but the library keeps what was hidden or copied."
 # 2026-11-01: the accuser's story and patron (docs/spec/2026-11-01-crisis-variety-and-consistency.md).
 kehillah_talmud_trial.0001.story_student:0 "[kehillah_trial_accuser_scope.GetFirstName] studied in our house of study as a boy. Some years ago he went to the priests and was baptized."
 kehillah_talmud_trial.0001.story_son_in_law:0 "[kehillah_trial_accuser_scope.GetFirstName] was once betrothed to a daughter of this community. The match was broken off; a year later he went to the priests and was baptized, and he has not forgotten whose fault he thinks it was."
 kehillah_talmud_trial.0001.story_rival:0 "[kehillah_trial_accuser_scope.GetFirstName] was a scholar among us, and quarrelled bitterly with the rabbi over a ruling. When he lost, he went to the priests and was baptized."
 kehillah_talmud_trial.0001.articles:0 "\n\nNow he has come back with a list of passages from the Talmud, and he has read them aloud before [kehillah_incident_host.GetTitledFirstName]. He says they insult Christ and his mother. He knows which houses keep the books."
 kehillah_talmud_trial.0001.patron_friar:0 " A friar of the preaching orders travels with him; it was the friar who arranged his audience, and the friar who will preach in the square while the lord decides."
 kehillah_talmud_trial.0001.patron_monk:0 " A wandering monk travels with him; it was the monk who arranged his audience, and the monk who will preach in the square while the lord decides."
 kehillah_talmud_trial.0001.patron_bishop:0 " [kehillah_trial_patron_scope.GetTitledFirstName], who keeps the lord's conscience, sat at the lord's side while he read, and nodded at every article."
 kehillah_talmud_trial.0001.patron_official:0 " [kehillah_trial_patron_scope.GetTitledFirstName], the lord's chancellor, has taken an interest, and has been heard asking what the books would fetch."
 kehillah_talmud_trial.0001.close:0 "\n\nThe lord has not yet decided what to do with the list. If he believes it, his men will come for every volume, and we will be summoned to defend them in his hall."
 kehillah_trial_patron_presses_catalyst:0 "The accuser's patron presses"
 kehillah_trial_patron_presses_catalyst_desc:0 "The accuser's patron works on the judges every month: in the hall, or in the square outside it."

 # 2026-11-01: after the verdict.
