 kehillah_trial_relief_set_concept:0 "Relief"
 kehillah_trial_books_home_set:0 "The Books Come Home"
 kehillah_trial_books_home_set_concept:0 "The Books Come Home"
 kehillah_trial_struck_passages_set:0 "Struck Passages"
 kehillah_trial_struck_passages_set_concept:0 "Struck Passages"
 kehillah_trial_burning_set:0 "The Burning"
 kehillah_trial_burning_set_concept:0 "The Burning"
 kehillah_trial_aftermath_decision:0 "After the Verdict"
 kehillah_trial_aftermath_decision_desc:0 "Decide how the community will answer the verdict on its books."
 kehillah_trial_aftermath_decision_tooltip:0 "Answer the verdict on the books."
 kehillah_trial_aftermath_decision_confirm:0 "Call the scholars"
 kehillah_trial_aftermath_decision_effect_tt:0 "The scholars meet to decide how to answer the verdict."
 kehillah_talmud_trial.0070.t:0 "After the Verdict"
 kehillah_talmud_trial.0070.desc_home:0 "The books are back on their shelves. The students handle them the way men handle something they nearly lost."
 kehillah_talmud_trial.0070.desc_struck:0 "The books are back, with passages struck through in a clerk's heavy ink. The students read around the lines, and the old men recite what is under them."
 kehillah_talmud_trial.0070.desc_burned:0 "Where the books stood, the shelves are bare. The students recite from memory, and the old men correct them."
 kehillah_talmud_trial.0070.siyum:0 "Hold a siyum in the house of study, as for finishing a tractate."
 kehillah_talmud_trial.0070.fast:0 "Proclaim a fast for the books, as the Jews of France did for the books burned at Paris."
 kehillah_talmud_trial.0070.copy:0 "Pay a sister community's scribes to copy the orders we study most."
 kehillah_trial_recopy_tt:0 "Copies of the orders Moed and Nezikin come back into our library."
