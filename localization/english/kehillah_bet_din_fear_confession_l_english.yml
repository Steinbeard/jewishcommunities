l_english:
 kehillah_bet_din.0821.t:0 "The Confession Extracted in Fear"
 kehillah_bet_din.0821.desc:0 "[kbd_litigant_a.GetFirstName] asks the court to enforce a thief's signed admission. [kbd_litigant_b.GetFirstName] says officers threatened a harsh sanction before the signature and withdraws the words. Missing goods still need to be found. The court must examine the pressure before treating a confession as proof."
 kehillah_bet_din.0821.a:0 "Enforce the admission immediately."
 kehillah_bet_din.0821.a.tt:0 "The claimant gets a quick answer, but a coerced admission may be worthless."
 kehillah_bet_din.0821.b:0 "Set it aside temporarily and investigate goods and threats."
 kehillah_bet_din.0821.b.tt:0 "An inquiry costs time while preserving independent evidence."
 kehillah_bet_din.0821.c:0 "Dismiss the theft claim entirely."
 kehillah_bet_din.0821.c.tt:0 "A free and accurate admission could be lost by closing the case."
 kehillah_din_source_82:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_82_tt:0 "Mishnah Sanhedrin 4:1 gives the judges a textual point of reference. It cannot establish whether threats preceded the admission."
 kehillah_din_combo_82:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_82_tt:0 "The judges preserve both parties' interests while checking whether threats preceded the admission."
 kehillah_bet_din.0824.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0824.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0824.outcome_1:0 "The court enforces the signed admission."
 kehillah_bet_din.0824.outcome_2:0 "The court checks the officers' conduct and searches for independent proof."
 kehillah_bet_din.0824.outcome_3:0 "The court dismisses the accusation."
 kehillah_bet_din.0824.fact_true:0 "Officers threatened the accused before the signature. Immediate enforcement relied on fear."
 kehillah_bet_din.0824.fact_false:0 "The admission was made freely and the goods match its account. Dismissal ignored sound evidence."
 kehillah_bet_din.0824.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0824.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0824.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case82_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case82_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case82_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
