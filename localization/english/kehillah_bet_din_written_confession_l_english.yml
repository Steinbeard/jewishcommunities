l_english:
 kehillah_bet_din.0891.t:0 "The Written Confession"
 kehillah_bet_din.0891.desc:0 "[kbd_litigant_a.GetFirstName] holds a merchant's signed acknowledgment of debt. [kbd_litigant_b.GetFirstName] admits signing, but says a second repayment clause was added later. The ink differs slightly near the margin. The court can secure the principal while asking the scribe and witnesses about that clause."
 kehillah_bet_din.0891.a:0 "Enforce the entire document now."
 kehillah_bet_din.0891.a.tt:0 "A quick award could enforce words added after signature."
 kehillah_bet_din.0891.b:0 "Secure the principal and examine ink and witnesses."
 kehillah_bet_din.0891.b.tt:0 "Inquiry preserves the undisputed debt while testing the margin."
 kehillah_bet_din.0891.c:0 "Discard the document and release all debt."
 kehillah_bet_din.0891.c.tt:0 "A sound signed clause might be lost with an overbroad dismissal."
 kehillah_din_source_89:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_89_tt:0 "Mishnah Shevuot 6:1 gives the judges a textual point of reference. It cannot establish when the disputed clause was written."
 kehillah_din_combo_89:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_89_tt:0 "The judges preserve both parties' interests while checking when the disputed clause was written."
 kehillah_bet_din.0894.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0894.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0894.outcome_1:0 "The court enforces every written term."
 kehillah_bet_din.0894.outcome_2:0 "The court secures the principal and summons the scribe."
 kehillah_bet_din.0894.outcome_3:0 "The court dismisses the entire written claim."
 kehillah_bet_din.0894.fact_true:0 "The margin was added after the signature. Enforcing it exceeded the merchant's admission."
 kehillah_bet_din.0894.fact_false:0 "Witnesses saw the whole text signed. Total dismissal erased a genuine debt."
 kehillah_bet_din.0894.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0894.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0894.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case89_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case89_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case89_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case89_great_log_title:0 "The Written Confession: a well-supported ruling"
 kehillah_bet_din_case89_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the written confession dispute."
 kehillah_bet_din_case89_good_log_title:0 "The Written Confession: a workable ruling"
 kehillah_bet_din_case89_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the written confession dispute."
 kehillah_bet_din_case89_poor_log_title:0 "The Written Confession: a disputed ruling"
 kehillah_bet_din_case89_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the written confession dispute."
