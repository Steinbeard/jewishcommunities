 # 2026-11-26: pillar ceilings, deeds and founding at baseline
 # (docs/spec/2026-11-26-pillar-ceilings-deeds-and-founding.md).

 # --- Invest in the community's livelihoods ---
 kehillah_invest_in_trades_decision:0 "Invest in the Community's Livelihoods"
 kehillah_invest_in_trades_decision_desc:0 "Communal money can sit in the chest, or it can be put to work: a loan to a dyer who needs a new vat, a share in the wine a vintner is pressing, a cart of cloth bought at the fair for the community's pedlars. Money that works brings more home."
 kehillah_invest_in_trades_decision_tooltip:0 "Put the community's money into its own trades"
 kehillah_invest_in_trades_decision_confirm:0 "Open the books"
 kehillah_invest_in_trades_tt:0 "Choose how much of the communal chest to put into the community's trades"
 kehillah_invest_needs_gold_tt:0 "The chest holds enough for at least a modest stake"

 kehillah_invest.0001.t:0 "Money That Works"
 kehillah_invest.0001.desc:0 "The treasurer has the ledger open on the table. The craftsmen want capital for tools and stock; the traders want a stake for the coming fair. Whatever we lend them will come back, in time, as a busier street and a fuller chest. How much can the community spare this year?"
 kehillah_invest.0001.a:0 "Lend our craftsmen what they need."
 kehillah_invest.0001.b:0 "Buy stock at the fair for our traders."
 kehillah_invest.0001.c:0 "Not this year. The chest stays shut."

 # --- Trade from Affluence ---
 kehillah_trade_routes_1_modifier:0 "Trade of a Healthy Community"
 kehillah_trade_routes_1_modifier_desc:0 "The community's Affluence lets it keep a trade route of its own, smaller than a merchant house's."
 kehillah_trade_routes_2_modifier:0 "Trade of a Flourishing Community"
 kehillah_trade_routes_2_modifier_desc:0 "The community's Affluence lets it keep two trade routes of its own, smaller than a merchant house's."
 kehillah_trade_ventures_1_modifier:0 "Trading Venture"
 kehillah_trade_ventures_1_modifier_desc:0 "The community's Affluence lets its traders send goods to the fairs. Now and then a venture comes home with a profit."
 kehillah_trade_ventures_2_modifier:0 "Trading Ventures"
 kehillah_trade_ventures_2_modifier_desc:0 "The community's Affluence lets its traders send goods to the fairs on two roads. Now and then a venture comes home with a profit."
 kehillah_trade_venture_toast_t:0 "A Venture Comes Home"
 kehillah_trade_venture_toast_d:0 "The carts are back from the fair, and the community's share of the profit is in the chest."
