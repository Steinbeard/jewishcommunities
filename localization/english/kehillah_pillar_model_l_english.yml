l_english:

 # 2026-11-26: pillar ceilings, deeds and founding at baseline
 # (docs/spec/2026-11-26-pillar-ceilings-deeds-and-founding.md).

 # --- Affluence sinks: what a community spends on ---
 kehillah_stock_free_loan_chest_decision:0 "Stock the Free-Loan Chest"
 kehillah_stock_free_loan_chest_decision_desc:0 "#italic Gemilut chasadim#!: money lent without interest to a member who needs it, for a cart, a debt, or a season's stock, and repaid when it can be. A cobbler who would have sold his tools keeps them, and the chest is full again in a year."
 kehillah_stock_free_loan_chest_decision_tooltip:0 "Put communal money into the free-loan chest"
 kehillah_stock_free_loan_chest_decision_confirm:0 "Fill the chest"

 kehillah_take_fair_stalls_decision:0 "Take Stalls at the Fair"
 kehillah_take_fair_stalls_decision_desc:0 "The season's fair is coming. The community can rent stalls in its own name, pay the tolls up front, and let its traders sell cloth, spices and pledged goods under one awning, where the buyers from three counties will pass."
 kehillah_take_fair_stalls_decision_tooltip:0 "Rent stalls at the fair for the community's traders"
 kehillah_take_fair_stalls_decision_confirm:0 "Pay for the stalls"

 kehillah_send_apprentices_decision:0 "Send Apprentices Abroad"
 kehillah_send_apprentices_decision_desc:0 "There is no master dyer here, no goldsmith, no one who knows the glassmaker's furnace. Another community has them. The kahal can pay for a few of its young men to board there and learn a trade, and come home with it."
 kehillah_send_apprentices_decision_tooltip:0 "Pay for young men to learn a trade in another community"
 kehillah_send_apprentices_decision_confirm:0 "Send them"
 kehillah_send_apprentices_tt:0 "They come home in three or four years, to whoever leads the community then"
 kehillah_apprentices_away_tt:0 "The community's apprentices are not still abroad"

 kehillah_lay_in_provisions_decision:0 "Lay In Wheat and Wine"
 kehillah_lay_in_provisions_decision_desc:0 "After the harvest, wheat and wine are cheap. Bought then, in bulk, and sold to the households at cost before Passover, the community's matzah and its wine for the Seder do not cost a poor family a month's earnings."
 kehillah_lay_in_provisions_decision_tooltip:0 "Buy the community's wheat and wine in bulk after the harvest"
 kehillah_lay_in_provisions_decision_confirm:0 "Buy the stores"

 kehillah_pave_the_street_decision:0 "Pave and Drain the Street"
 kehillah_pave_the_street_decision_desc:0 "Every spring the street floods, the cellars fill and the mud reaches the synagogue steps. Stone, a drain and the lord's leave would end it for a generation, and a dry, paved street is one a buyer walks down."
 kehillah_pave_the_street_decision_tooltip:0 "Pave the community's street and dig it a drain"
 kehillah_pave_the_street_decision_confirm:0 "Lay the stones"

 kehillah_invest.0010.t:0 "The Apprentices Come Home"
 kehillah_invest.0010.desc:0 "The young men the community sent abroad are back, older, with calloused hands and a master's word that they know their trade. One has already rented a workshop by the gate; another is courting the baker's daughter."
 kehillah_invest.0010.a:0 "The money was well spent."

 # --- Trade from Affluence ---
 kehillah_trade_routes_1_modifier:0 "Trade of a Healthy Community"
 kehillah_trade_routes_1_modifier_desc:0 "The community's Affluence lets it keep a trade route of its own, smaller than a merchant house's."
 kehillah_trade_routes_2_modifier:0 "Trade of a Flourishing Community"
 kehillah_trade_routes_2_modifier_desc:0 "The community's Affluence lets it keep two trade routes of its own, smaller than a merchant house's."
 kehillah_trade_ventures_1_modifier:0 "Trading Venture"
 kehillah_trade_ventures_1_modifier_desc:0 "The community's Affluence lets its traders send goods to the fairs. Now and then a venture comes home with a profit."
 kehillah_trade_ventures_2_modifier:0 "Trading Ventures"
 kehillah_trade_ventures_2_modifier_desc:0 "The community's Affluence lets its traders send goods to the fairs on two roads. Now and then a venture comes home with a profit."
 kehillah_trade_venture_toast_t:0 "A Venture Comes Home"
 kehillah_trade_venture_toast_d:0 "The carts are back from the fair, and the community's share of the profit is in the chest."
