l_english:
 kehillah_bet_din.0741.t:0 "The Scribe's Incorrect Divine Name"
 kehillah_bet_din.0741.desc:0 "[kbd_litigant_a.GetFirstName] copied a scroll and says several mistaken words can be corrected. [kbd_litigant_b.GetFirstName] represents buyers who found repeated errors, including in a divine name. The scroll is expensive and the festival near. The court must protect the text without treating a scribe's promise as an inspection."
 kehillah_bet_din.0741.a:0 "Accept the scribe's repair plan without examination."
 kehillah_bet_din.0741.a.tt:0 "The scroll stays available, but an uncorrectable error could remain."
 kehillah_bet_din.0741.b:0 "Have qualified readers mark errors before any use."
 kehillah_bet_din.0741.b.tt:0 "Careful review costs money and may delay use."
 kehillah_bet_din.0741.c:0 "Reject the entire scroll and bar the scribe."
 kehillah_bet_din.0741.c.tt:0 "A repairable text could be lost and a craftsperson unjustly punished."
 kehillah_din_source_74:0 "Cite a mastered Moed work and examine the evidence."
 kehillah_din_source_74_tt:0 "Mishnah Megillah 3:1 gives the judges a textual point of reference. It cannot establish which errors this scroll actually contains."
 kehillah_din_combo_74:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_74_tt:0 "The judges preserve both parties' interests while checking which errors this scroll actually contains."
 kehillah_bet_din.0744.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0744.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0744.outcome_1:0 "The court permits the scribe to correct the scroll immediately."
 kehillah_bet_din.0744.outcome_2:0 "The court commissions a full reading and records which errors can be repaired."
 kehillah_bet_din.0744.outcome_3:0 "The court rejects the scroll and suspends the scribe."
 kehillah_bet_din.0744.fact_true:0 "The readers find an error that the proposed repair cannot cure. Unchecked use was unsound."
 kehillah_bet_din.0744.fact_false:0 "The readers find only repairable errors. Blanket rejection was disproportionate."
 kehillah_bet_din.0744.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0744.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0744.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case74_one_tt:0 "The immediate ruling costs 8 Greatness and carries the larger fact risk."
 kehillah_din_case74_two_tt:0 "Inquiry costs 4 Greatness while the court keeps the issue open."
 kehillah_din_case74_three_tt:0 "The quick final settlement costs 2 Greatness but may be overbroad."
 kehillah_bet_din_case74_great_log_title:0 "The Scribe's Incorrect Divine Name: a well-supported ruling"
 kehillah_bet_din_case74_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the scribe's incorrect divine name dispute."
