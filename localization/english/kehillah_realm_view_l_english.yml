l_english:
 # Realm view of Jewish communities (2026-10-28).
 # docs/spec/2026-10-28-realm-jewish-communities-view.md

 # --- The chip in the character window (Character = the viewed ruler)
 KEHILLAH_RV_CHIP_TOOLTIP:0 "#T Jewish communities#!\n[Character.MakeScope.ScriptValue('kehillah_rv_chip_count_value')|0] Jewish communities, [Character.MakeScope.ScriptValue('kehillah_rv_chip_danger_count_value')|0] of them Tense or worse.\n\n#weak Open the overview: the realm's policy toward the Jews, its ruler's outlook, every community, and the last ten years of news.#!"

 # --- Header
 KEHILLAH_RV_HEADER:0 "Jewish Communities in [GetPlayer.MakeScope.Var('kehillah_rv_lord').Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"

 # --- Summary tiles
 KEHILLAH_RV_POLICY_LABEL:0 "Realm Policy"
 KEHILLAH_RV_POLICY_SUB:0 "Set by [GetPlayer.MakeScope.Var('kehillah_rv_top').Char.GetFirstNameNoTooltip]"
 KEHILLAH_RV_POLICY_TOOLTIP:0 "#T Jewish settlement policy#!\n[Title.GetNameNoTooltip]: [Title.Custom('KehillahJewishSettlementPolicy')]\n\n#weak A realm law, set by the realm's ruler for the whole realm. It decides whether new communities may settle and frames every Charter granted here.#!\n\n#weak Click to compare every realm's policy on the map. To change your own, see the laws in My Realm.#!"

 KEHILLAH_RV_TEACHING_LABEL:0 "Faith's Teaching"
 KEHILLAH_RV_TEACHING_TOOLTIP:0 "#T Teaching on the Jews#!\n[Character.GetShortUINameNoTooltip] follows [Character.GetFaith.GetNameNoTooltip]. Its teaching on the Jews: [Character.Custom('KehillahRvTeaching')] ([Character.Custom('KehillahRvTeachingTone')]).[Character.Custom('KehillahOutlookBdTeaching')]\n\n#weak A faith's teaching on the Jews sets how its rulers and preachers regard them, and moves the danger of violence.#!\n\n#weak Click to open the faith.#!"

 KEHILLAH_RV_OUTLOOK_LABEL:0 "Outlook on the Jews"
 KEHILLAH_RV_OUTLOOK_TOOLTIP:0 "#T [Character.GetShortUINameNoTooltip]'s outlook on the Jews#!\n[Character.Custom('KehillahOutlookBand')] ([Character.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0])\nStance:[Character.Custom('KehillahRvStance')][Character.Custom('KehillahRegentOutlookLine')][Character.Custom('KehillahOutlookBdTeaching')][Character.Custom('KehillahOutlookBdZeal')][Character.Custom('KehillahOutlookBdCharacter')][Character.Custom('KehillahOutlookBdLearning')][Character.Custom('KehillahOutlookBdCourt')][Character.Custom('KehillahOutlookBdDebts')][Character.Custom('KehillahOutlookBdRelations')][Character.Custom('KehillahOutlookBdCrusade')][Character.Custom('KehillahOutlookBdHistory')]\n\n#weak Click to open [Character.GetShortUINameNoTooltip].#!"

 KEHILLAH_RV_DANGER_LABEL:0 "Danger"

 # --- Community list
 KEHILLAH_RV_COMMUNITIES_HEADER:0 "The Communities ([GetPlayer.MakeScope.Var('kehillah_rv_count').GetValue|0])"
 KEHILLAH_RV_COL_LORD:0 "Local lord:"
 KEHILLAH_RV_COL_CHARTER:0 "Charter"
 KEHILLAH_RV_ROW_LORD_TOOLTIP:0 "#T Local lord#!\n[Title.MakeScope.Var('kehillah_ui_host_county').Title.GetHolder.GetShortUINameNoTooltip] holds [Title.MakeScope.Var('kehillah_ui_host_county').Title.GetNameNoTooltip].\nOutlook on the Jews: [Title.MakeScope.Var('kehillah_ui_host_county').Title.GetHolder.Custom('KehillahOutlookBand')]\n\n#weak The local lord's outlook moves this community's danger. Its Charter is still granted by the realm's ruler.#!"
 KEHILLAH_RV_ROW_CHARTER_TOOLTIP:0 "#T [Title.GetNameNoTooltip]'s Charter#!\n$KEHILLAH_DOMAIN_CHARTER_TERMS$\n\n#weak The realm's ruler can click to review and change this Charter.#!"
 KEHILLAH_RV_ROW_CHARTER_TOOLTIP_OWN:0 "#T Your Charter#!\n$KEHILLAH_DOMAIN_CHARTER_TERMS$\n\n#weak Click to ask [GetPlayer.MakeScope.Var('kehillah_rv_top').Char.GetShortUINameNoTooltip] to change its terms.#!"

 # --- News
 KEHILLAH_RV_NEWS_TOOLTIP:0 "#T Realm news#!\nWhat has happened to the Jews of [GetPlayer.MakeScope.Var('kehillah_rv_realm').Title.GetNameNoTooltip], newest first: accusations, decrees, riots and worse.\n\n#weak News is recorded as it happens, from this version of the mod onward. Debates and good news will be added later.#!"
 KEHILLAH_RV_NEWS_EMPTY:0 "Nothing has been recorded in the last ten years."

 kehillah_news_kind_talmud_trial:0 "The Talmud was put on trial"
 kehillah_news_kind_badge:0 "The Jews were ordered to wear the badge"
 kehillah_news_kind_holy_week:0 "Holy Week brought trouble to the Jewish quarter"
 kehillah_news_kind_bonds:0 "Debtors rose against the Jews over their bonds"
 kehillah_news_kind_servants_decree:0 "A decree forbade Christians to serve Jews"
 kehillah_news_kind_mob_preaching:0 "A preacher raised a mob against the Jews"
 kehillah_news_kind_pogrom:0 "#N A pogrom struck the community#!"
 kehillah_news_kind_accusation_riot:0 "#N An accusation ended in a riot#!"
 kehillah_news_kind_anusim_discovered:0 "A secret return to Judaism was discovered"
 kehillah_news_kind_popular_rising:0 "#N A popular rising fell on the community#!"

 # --- Lord's view: up to the realm
 KEHILLAH_RV_VIEW_REALM:0 "View All Jewish Communities in [GetPlayer.MakeScope.Var('kehillah_rv_realm').Title.GetNameNoTierNoTooltip]"
 KEHILLAH_RV_VIEW_REALM_TOOLTIP:0 "See every community under [GetPlayer.MakeScope.Var('kehillah_rv_top').Char.GetShortUINameNoTooltip], with the whole realm's news."

