l_english:
 kehillah_bet_din.0721.t:0 "The Paschal Oven"
 kehillah_bet_din.0721.desc:0 "[kbd_litigant_a.GetFirstName] baked festival food in a shared oven and says it was prepared correctly. [kbd_litigant_b.GetFirstName] claims an earlier use made the oven unsuitable and asks for replacement. The baker's fire is out, but the oven and utensils remain. The court must decide before the meal is served."
 kehillah_bet_din.0721.a:0 "Serve the food without checking the oven."
 kehillah_bet_din.0721.a.tt:0 "Families keep their meal, but an unsuitable oven could be overlooked."
 kehillah_bet_din.0721.b:0 "Inspect the oven and prepare a replacement meal if needed."
 kehillah_bet_din.0721.b.tt:0 "Inspection and a backup meal cost scarce time and flour."
 kehillah_bet_din.0721.c:0 "Discard every batch from the oven."
 kehillah_bet_din.0721.c.tt:0 "A sound oven would make blanket disposal wasteful."
 kehillah_din_source_72:0 "Cite a mastered Moed work and examine the evidence."
 kehillah_din_source_72_tt:0 "Mishnah Pesachim 1:1 gives the judges a textual point of reference. It cannot establish the oven's actual preparation."
 kehillah_din_combo_72:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_72_tt:0 "The judges preserve both parties' interests while checking the oven's actual preparation."
 kehillah_bet_din.0724.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0724.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0724.outcome_1:0 "The court releases the baked food."
 kehillah_bet_din.0724.outcome_2:0 "The court examines the oven and arranges a backup meal."
 kehillah_bet_din.0724.outcome_3:0 "The court discards every batch and orders replacements."
 kehillah_bet_din.0724.fact_true:0 "The oven's previous use left a disqualifying condition. Quick release ignored it."
 kehillah_bet_din.0724.fact_false:0 "The oven was prepared properly. Disposal needlessly deprived households of their food."
 kehillah_bet_din.0724.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0724.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0724.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case72_one_tt:0 "The immediate ruling costs 8 Greatness and carries the larger fact risk."
 kehillah_din_case72_two_tt:0 "Inquiry costs 4 Greatness while the court keeps the issue open."
 kehillah_din_case72_three_tt:0 "The quick final settlement costs 2 Greatness but may be overbroad."
 kehillah_bet_din_case72_great_log_title:0 "The Paschal Oven: a well-supported ruling"
 kehillah_bet_din_case72_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the paschal oven dispute."
 kehillah_bet_din_case72_good_log_title:0 "The Paschal Oven: a workable ruling"
 kehillah_bet_din_case72_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the paschal oven dispute."
 kehillah_bet_din_case72_poor_log_title:0 "The Paschal Oven: a disputed ruling"
 kehillah_bet_din_case72_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the paschal oven dispute."
