l_english:
 # V39 slice 1 -- the Mob (docs/spec/v39-pogroms-and-the-popular-crusade.md).
 kehillah_mob_cb:0 "Pogrom"
 kehillah_mob_community_cb:0 "Pogrom"
 kehillah_mob_cb_victory_desc:0 "The host has had its way."
 kehillah_mob_cb_white_peace_desc:0 "The host moves on."
 kehillah_mob_cb_defeat_desc:0 "The host is broken."
 kehillah_mob_army_name:0 "The Preacher's Host"
 kehillah_mob_defenders_name:0 "The Lord's Men"
 KEHILLAH_MOB_TITLE_NAME:0 "Holy Host"
 KEHILLAH_MOB_WAR_NAME:0 "The Holy Host against the Jews"
 kehillah_mob_preacher_male:0 "Preacher"
 kehillah_mob_preacher_female:0 "Preacher"

 kehillah_mob_band_0:0 "at the gates"
 kehillah_mob_band_1:0 "only days away"
 kehillah_mob_band_2:0 "a week or two away"
 kehillah_mob_band_3:0 "within a month's march"
 kehillah_mob_band_4:0 "still far off"

 kehillah_mob.0001.t:0 "A [kehillah_mob_leader.Custom('KehillahPreacherCap')] Raises a Host"
 kehillah_mob.0001.a:0 "Proclaim a fast, and set to work."
 kehillah_mob_refuge_granted:0 "The lord will shelter us"
 kehillah_mob_refuge_granted_tt:0 "The community will take refuge in the lord's castle. The host must take the castle before it can reach us."
 kehillah_mob_refuge_refused:0 "The lord refuses"
 kehillah_mob_refuge_refused_tt:0 "There will be no refuge here."
 kehillah_mob_condemned:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_condemned')]"
 kehillah_mob_condemned_christian:0 "The Church condemns the host"
 kehillah_mob_condemned_islam:0 "The ulama condemn the host"
 kehillah_mob_condemned_tt:0 "Men desert the host, and those who stay are less sure of themselves."
 kehillah_mob_not_condemned:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_not_condemned')]"
 kehillah_mob_not_condemned_christian:0 "The Church is silent"
 kehillah_mob_not_condemned_islam:0 "The ulama are silent"
 kehillah_mob_defended:0 "The quarter is readied"
 kehillah_mob_not_defended:0 "The defence comes to nothing"
 kehillah_mob_fast_tt:0 "Stability #P +20#!"

 kehillah_mob.0002.t:0 "They Are Coming for Us"
 kehillah_mob_bribe_taken:0 "The [kehillah_mob_leader.Custom('KehillahPreacher')] takes the silver"
 kehillah_mob_bribe_taken_tt:0 "The host turns aside and leaves the community in peace."
 kehillah_mob_bribe_kept:0 "They take the silver, and come anyway"
 kehillah_mob_bribe_kept_tt:0 "The silver is gone."
 kehillah_mob_lord_raises_men:0 "The lord calls out his men"
 kehillah_mob_lord_raises_men_tt:0 "[recipient.GetTitledFirstName] joins the war against the host, with men gathered beside the town."
 kehillah_mob_lord_will_not:0 "The lord will not raise a hand"
 kehillah_mob_scattered_tt:0 "The families scatter into the villages. The empty quarter will be plundered, and some of them may be found."

 kehillah_mob.0003.t:0 "At the Gates"
 kehillah_mob.0003.desc:0 "[kehillah_mob_leader.GetTitledFirstName] and [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men stand before [kehillah_mob_town.GetName]."
 kehillah_mob.0003.desc_refuge:0 " The community has taken refuge in [ROOT.Char.MakeScope.Var('kehillah_mob_refuge_lord_ref').Char.GetTitledFirstName]'s castle. The host must take it, which may take [ROOT.Char.MakeScope.Var('kehillah_mob_siege_days_ref').GetValue|0] days -- if the lord holds firm."
 kehillah_mob.0003.desc_open:0 " The burghers have opened the town to them. Nothing stands between the host and the quarter."
 kehillah_mob.0003.a:0 "Stand at the gate yourself."
 kehillah_mob.0003.b:0 "Send the elders out with silver."
 kehillah_mob.0003.c:0 "Open the gates and plead for mercy."
 kehillah_mob.0003.d:0 "Bar the doors of the synagogue and pray."
 kehillah_mob_gate_held:0 "You hold the gate"
 kehillah_mob_gate_held_tt:0 "The harm of the pogrom is less."
 kehillah_mob_gate_lost:0 "You are struck down at the gate"
 kehillah_mob_plead_heard:0 "The [kehillah_mob_leader.Custom('KehillahPreacher')] hears you"
 kehillah_mob_plead_heard_tt:0 "The harm of the pogrom is halved."
 kehillah_mob_plead_scorned:0 "They laugh at you"
 kehillah_mob_plead_scorned_tt:0 "Nothing is gained."

 kehillah_mob.0005.t:0 "Given Up"
 kehillah_mob.0005.desc:0 "The lord who sheltered us has opened his castle to the host. The Jews who took refuge there are in the [kehillah_mob_leader.Custom('KehillahPreacher')]'s hands."
 kehillah_mob.0005.a:0 "God help us."

 kehillah_mob.0010.t:0 "After the Pogrom"
 kehillah_mob.0010.desc:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has done its work in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. [ROOT.Char.MakeScope.Var('kehillah_pogrom_dead').GetValue|0] of our people are dead and [ROOT.Char.MakeScope.Var('kehillah_pogrom_baptized').GetValue|0] were forced to convert; the quarter has lost [ROOT.Char.MakeScope.Var('kehillah_pogrom_buildings').GetValue|0] of its buildings.\n\nProsperity #N [ROOT.Char.MakeScope.Var('kehillah_pogrom_last_prosperity').GetValue|0]#!, Stability #N [ROOT.Char.MakeScope.Var('kehillah_pogrom_last_stability').GetValue|0]#!. For ten years the memory will weigh on the community."
 kehillah_mob.0010.desc_martyrs:0 "\n\n[ROOT.Char.MakeScope.Var('kehillah_pogrom_martyrs').GetValue|0] chose death rather than conversion, sanctifying the Name -- #italic kiddush ha-Shem#!. Their names will be written in the book of remembrance."
 kehillah_mob.0010.desc_no_martyrs:0 ""
 kehillah_mob.0010.desc_hostages:0 "\n\nThe [kehillah_mob_leader.Custom('KehillahPreacher')] holds [ROOT.Char.MakeScope.Var('kehillah_pogrom_hostages').GetValue|0] of ours captive, and asks [ROOT.Char.MakeScope.Var('kehillah_pogrom_ransom_ref').GetValue|0] gold for them."
 kehillah_mob.0010.desc_no_hostages:0 ""
 kehillah_mob.0010.desc_leader_fell:0 "\n\n#N You were wounded in the defence of the synagogue, and you will not survive the day.#!"
 kehillah_mob.0010.desc_end:0 ""
 kehillah_mob.0010.a:0 "Redeem the captives."
 kehillah_mob.0010.b:0 "We cannot pay."
 kehillah_mob.0010.c:0 "We will remember them."
 kehillah_mob_ransomed_tt:0 "The captives are freed."
 kehillah_mob_not_ransomed_tt:0 "The captives are killed, or converted and lost to the community."

 kehillah_mob.0020.t:0 "The Host Is Broken"
 kehillah_mob.0020.desc:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has scattered before it could reach us. Its men have gone home to their fields, or to other lords' gallows. The community breathes again."
 kehillah_mob.0020.a:0 "Blessed is He who has spared us."

 kehillah_mob_nearer_t:0 "The Host Draws Nearer"
 kehillah_mob_nearer_d:0 "[kehillah_mob_leader.GetTitledFirstName]'s host is now [kehillah_mob_victim.Custom('KehillahMobBand')]."
 kehillah_mob_news_forms_t:0 "A Host Forms"
 kehillah_mob_news_forms_d:0 "A [kehillah_mob_leader.Custom('KehillahPreacher')], [kehillah_mob_leader.GetTitledFirstName], has raised a host against the Jews of [kehillah_news_title.GetNameNoTooltip]."
 kehillah_mob_news_gates_t:0 "A Host at the Gates"
 kehillah_mob_news_gates_d:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has reached [kehillah_news_title.GetNameNoTooltip]."
 kehillah_mob_news_pogrom_t:0 "A Pogrom"
 kehillah_mob_news_pogrom_d:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has fallen on the Jews of [kehillah_news_title.GetNameNoTooltip]."

 kehillah_defend_community_interaction:0 "Defend the Jews"
 kehillah_defend_community_interaction_desc:0 "Join the war against the host marching on [recipient.GetPrimaryTitle.GetNameNoTooltip], on the community's side. #weak Your armies may then attack it.#!"
 kehillah_defend_community_tt:0 "You join the war against the host."
 kehillah_defend_community_already_tt:0 "You are already at war with the host"
 kehillah_defend_community_msg_t:0 "A Defender"
 kehillah_defend_community_msg_d:0 "[actor.GetTitledFirstName] has taken up arms against the host marching on us."
 kehillah_mob_how_to_act_tt:0 "The elders will gather. You can go to the lords, to the men of religion, or to the [kehillah_mob_leader.Custom('KehillahPreacher')] himself, or see to the quarter's own defence. Every journey takes days the host spends marching."
 kehillah_mob.0002.a:0 "Call the elders together again."
 kehillah_mob.0100.t:0 "The Elders Gather"
 kehillah_mob.0100.desc:0 "The elders crowd into the synagogue's courtyard. [kehillah_mob_leader.GetTitledFirstName]'s host is [ROOT.Char.Custom('KehillahMobBand')], [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men.\n\n#T Where we stand#!"
 kehillah_mob.0100.a:0 "Seek the protection of the powerful."
 kehillah_mob.0100.b:0 "See to our own defence."
 kehillah_mob.0100.e:0 "Go out to the [kehillah_mob_leader.Custom('KehillahPreacher')]'s camp."
 kehillah_mob.0100.g:0 "Send our families into the villages."
 kehillah_mob.0100.h:0 "We have done what we can, for now."
 kehillah_mob_hub_reopen_tt:0 "The elders gather again if the host draws nearer."
 kehillah_mob.0110.t:0 "An Audience"
 kehillah_mob.0110.desc_warm:0 "[kehillah_mob_patron.GetTitledFirstName] receives you at once, and listens with a grave face. [kehillah_mob_patron.GetSheHe|U] has heard of the [kehillah_mob_leader.Custom('KehillahPreacher')]. "Tell me what you need," he says."
 kehillah_mob.0110.desc_neutral:0 "[kehillah_mob_patron.GetTitledFirstName] keeps you waiting half a day before he will see you. When he does, he hears you out with folded arms."
 kehillah_mob.0110.desc_cold:0 "[kehillah_mob_patron.GetTitledFirstName] receives you standing, and does not ask you to sit. "The people are restless," he says. "Perhaps they have their reasons.""
 kehillah_mob.0110.a:0 "Ask for refuge in the castle."
 kehillah_mob.0110.b:0 "Offer [kehillah_mob_patron.GetHerHim] something first."
 kehillah_mob.0110.c:0 "Beg [kehillah_mob_patron.GetHerHim] to ride out against them."
 kehillah_mob.0110.d:0 "Take your leave."
 kehillah_mob.0130.t:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0130_t')]"
 kehillah_mob.0130.t_christian:0 "Before the Church"
 kehillah_mob.0130.t_islam:0 "Before the Ulama"
 kehillah_mob.0130.desc_chaplain:0 "[kehillah_mob_cleric.GetTitledFirstName] receives you in his study, among his books. He knows what is being preached in the market squares, and he knows the old law of the Church: that the Jews are not to be killed, nor baptized by force."
 kehillah_mob.0130.a:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0130_a')]"
 kehillah_mob.0130.a_christian:0 "Argue from Scripture and the Church's own law."
 kehillah_mob.0130.a_islam:0 "Argue from the Qur'an and the Pact of Umar."
 kehillah_mob.0130.b:0 "Offer a gift for his church."
 kehillah_mob.0130.c:0 "Take your leave."
 kehillah_mob.0140.t:0 "In the [kehillah_mob_leader.Custom('KehillahPreacherCap')]'s Camp"
 kehillah_mob.0140.desc:0 "[kehillah_mob_leader.GetTitledFirstName]'s camp stinks of smoke and wet wool. His men watch you with open hatred as you are led to him. He does not rise. "Speak, Jew," he says."
 kehillah_mob.0140.a:0 "Offer him silver to turn aside."
 kehillah_mob.0140.b:0 "Offer half as much again."
 kehillah_mob.0140.c:0 "Speak to him."
 kehillah_mob.0140.d:0 "Leave, before his men turn on you."
 kehillah_mob_reason_heard:0 "He hears you"
 kehillah_mob_reason_scorned:0 "He laughs, and his men close in"
 kehillah_mob.0150.t:0 "The Watch"
 kehillah_mob.0150.desc:0 "[kehillah_mob_marshal.GetTitledFirstName] has the watch gathered in the courtyard: a few dozen men with staves and old swords. "Tell us what to do," he says."
 kehillah_mob.0150.a:0 "Barricade the streets of the quarter."
 kehillah_mob.0150.b:0 "Arm the young men, and stand at the gates."
 kehillah_mob.0150.c:0 "Not yet."
 kehillah_mob_armed:0 "The young men stand ready"
 kehillah_mob_armed_failed:0 "They are not soldiers"
 kehillah_mob.0001.desc:0 "In [kehillah_mob_place.GetName], a [kehillah_mob_leader.Custom('KehillahPreacher')], [kehillah_mob_leader.GetFirstName], has been crying in the market squares that the Jews are the enemies of God and that their blood will cleanse the land. Hundreds took up his cause, then thousands: [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men, armed with scythes, clubs and torches. They are [ROOT.Char.Custom('KehillahMobBand')], and it is the Jews of [kehillah_mob_town.GetName] they are coming for.\n\nThere is still time, and there are people to ask: [kehillah_mob_lord.GetTitledFirstName], who holds the castle, and the lords above him; the clergy of the [kehillah_mob_leader.GetFaith.GetAdjective] faith; the men of our own watch; and the [kehillah_mob_leader.Custom('KehillahPreacher')] himself, who may take silver."
 kehillah_mob.0002.desc:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has reached [kehillah_mob_place.GetName], [ROOT.Char.Custom('KehillahMobBand')]: [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men. Our people are gathering in the synagogue courtyard to hear what the elders will do. Some are already loading carts."
 kehillah_mob_too_late_t:0 "Too Late"
 kehillah_mob_too_late_d:0 "The host reached the gates before the visit could be made."
 kehillah_crusade_preached_t:0 "The Cross Is Preached"
 kehillah_crusade_preached_d:0 "The Pope has called the faithful to a holy war, and preachers are crying it in every market. Letters come from the communities to the west: in the crowds that gather to take the cross, there are voices that say the enemies of Christ are not only in the East."
 kehillah_mob.0001.t_turned:0 "The Host Turns Toward Us"
 kehillah_mob.0001.desc_turned:0 "The host of [kehillah_mob_leader.GetTitledFirstName], which fell on the Jews of [ROOT.Char.MakeScope.Var('kehillah_mob_last_town_ref').Province.GetName], has turned toward us. It is [ROOT.Char.Custom('KehillahMobBand')]: [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men, swollen with plunder and with those who joined it on the road.\n\nThere is still time, and there are people to ask: [kehillah_mob_lord.GetTitledFirstName], who holds the castle, and the lords above him; the clergy of the [kehillah_mob_leader.GetFaith.GetAdjective] faith; the men of our own watch; and the [kehillah_mob_leader.Custom('KehillahPreacher')] himself, who may take silver."
 kehillah_mob.0001.t_rising:0 "The Rising Turns on Us"
 kehillah_mob.0001.desc_rising:0 "The rising of [kehillah_mob_leader.MakeScope.Var('kehillah_mob_sent_by').Char.GetTitledFirstName] has turned on the Jews. In the rebel camp, a [kehillah_mob_leader.Custom('KehillahPreacher')] named [kehillah_mob_leader.GetFirstName] told the men that the lords grind them for the sake of their Jews. By morning [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] of them had followed him out of the camp with their scythes and clubs. They are [ROOT.Char.Custom('KehillahMobBand')], and it is the Jews of [kehillah_mob_town.GetName] they are coming for.\n\nThere is still time, and there are people to ask: [kehillah_mob_lord.GetTitledFirstName], who holds the castle, and the lords above him; the clergy of the [kehillah_mob_leader.GetFaith.GetAdjective] faith; the men of our own watch; and the [kehillah_mob_leader.Custom('KehillahPreacher')] himself, who may take silver."
 kehillah_mob_news_turns_t:0 "The Host Moves On"
 kehillah_mob_news_turns_d:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has left [kehillah_mob_last_town.GetName] and turned toward the Jews of [kehillah_news_title.GetNameNoTooltip]."
 kehillah_mob_news_east_t:0 "The Host Marches East"
 kehillah_mob_news_east_d:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has turned east, toward the Holy Land. Behind it, the communities it fell upon count their dead."
 tenet_kehillah_kiddush_hashem_name:0 "Kiddush ha-Shem"
 tenet_kehillah_kiddush_hashem_desc:0 "To sanctify the Name: when the choice is death or apostasy, the faithful choose death. The martyrs of the Rhineland, who would not be baptized, are remembered in every lament."
 kehillah_memorbuch_decision:0 "Write the Memorbuch"
 kehillah_memorbuch_decision_desc:0 "Have the names of those who died for the sanctification of the Name written in a book of remembrance, to be read aloud in the synagogue on the Sabbath before Shavuot."
 kehillah_memorbuch_decision_tooltip:0 "Remember the martyrs."
 kehillah_memorbuch_decision_confirm:0 "Write their names"
 kehillah_memorbuch_written_tt:0 "The community has already written its Memorbuch"
 kehillah_memorbuch_effect_tt:0 "Greatness #P +80#!, Stability #P +40#!"
 kehillah_pogrom.0001.t:0 "The River Gate"
 kehillah_pogrom.0001.desc:0 "The first house they break into is Meir the dyer's, by the river gate. From the synagogue roof you can see men carrying out his vats, and a cradle. [kehillah_pogrom_neighbor.GetFirstName], who lives across the lane, is standing at [kehillah_pogrom_neighbor.GetHerHis] own door with [kehillah_pogrom_neighbor.GetHerHis] arms folded.\n\nThe women are already in the synagogue courtyard with the children."
 kehillah_pogrom.0002.t:0 "The Market"
 kehillah_pogrom.0002.desc:0 "It starts in the market. A stall is overturned, then another, then the shouting moves toward the quarter. Someone has daubed a mark on the door of the bathhouse.\n\n[kehillah_pogrom_neighbor.GetFirstName], whose yard backs onto yours, comes to your gate and says nothing. [kehillah_pogrom_neighbor.GetSheHe|U] looks at the children."
 kehillah_pogrom.0001.a:0 "Bring everyone into the synagogue and bar the doors."
 kehillah_pogrom.0001.b:0 "Ask [kehillah_pogrom_neighbor.GetFirstName] to hide the children."
 kehillah_pogrom.0001.c:0 "Send the young men to hold the end of the street."
 kehillah_pogrom_gathered_tt:0 "The community waits together behind the synagogue doors."
 kehillah_pogrom_children_hidden:0 "[kehillah_pogrom_neighbor.GetFirstName] takes them in"
 kehillah_pogrom_children_hidden_tt:0 "The children are hidden in his loft. Whatever happens in the quarter, they will not be there."
 kehillah_pogrom_children_betrayed:0 "[kehillah_pogrom_neighbor.GetFirstName] takes them in"
 kehillah_pogrom_children_betrayed_tt:0 "The children go with him. You cannot see where he takes them."
 kehillah_pogrom_street_held:0 "They hold"
 kehillah_pogrom_street_held_tt:0 "The end of the street is held long enough for some to get away. Fewer will die."
 kehillah_pogrom_street_lost:0 "They are cut down"
 kehillah_pogrom_street_lost_tt:0 "The young men are killed at the barricade, and the crowd comes on angrier. More will die."
 kehillah_pogrom.0010.t:0 "The Castle Gate"
 kehillah_pogrom.0010.desc:0 "In the morning a sergeant unbars the castle gate from the inside. He does not look at you. The crowd comes through it and across the yard to the hall where the community has slept for [ROOT.Char.MakeScope.Var('kehillah_mob_siege_days_ref').GetValue|0] nights.\n\n[kehillah_mob_leader.GetTitledFirstName] stands in the yard and waits for the doors to be opened."
 kehillah_pogrom.0010.a:0 "Go out first, and speak to him."
 kehillah_pogrom.0010.b:0 "Hold the door of the hall."
 kehillah_pogrom.0010.c:0 "Stay in the hall with the others."
 kehillah_pogrom_spoke_heard:0 "He listens"
 kehillah_pogrom_spoke_heard_tt:0 "He lets you finish. Fewer will die, and fewer will be forced to convert."
 kehillah_pogrom_spoke_seized:0 "You are seized"
 kehillah_pogrom_spoke_seized_tt:0 "His men take hold of you before you have said a sentence. You will be held with the captives, if you live."
 kehillah_pogrom_door_held:0 "The door holds"
 kehillah_pogrom_door_held_tt:0 "You hold it for most of an hour. Fewer will die, and you are less exposed."
 kehillah_pogrom_door_broken:0 "The door gives way"
 kehillah_pogrom.0020.t:0 "The Scrolls"
 kehillah_pogrom.0020.desc:0 "Smoke is coming from under the synagogue roof. [kehillah_pogrom_someone.GetFirstName] has the ark open and is lifting out the first of the scrolls, and the back door is still clear.\n\nThere is time to carry out the scrolls, or the people. Not both."
 kehillah_pogrom.0020.a:0 "Carry out the scrolls."
 kehillah_pogrom.0020.b:0 "Get the people out by the back door."
 kehillah_pogrom_scrolls_saved_tt:0 "The scrolls are saved and the community keeps more of its standing. More are caught in the building, and you are among the last out."
 kehillah_pogrom_people_first_tt:0 "More get out alive. The scrolls burn, and the community loses more of its standing."
 kehillah_pogrom.0021.t:0 "The Archive"
 kehillah_pogrom.0021.desc:0 "They have found the house of study. Through the window you can see the cases being pulled down and the books carried out to a fire in the street. [kehillah_pogrom_someone.GetFirstName] is at your elbow. \"The commentaries,\" [kehillah_pogrom_someone.GetSheHe] says. \"There is no other copy of half of them.\""
 kehillah_pogrom.0021.a:0 "Go in for the books."
 kehillah_pogrom.0021.b:0 "Leave them."
 kehillah_pogrom_books_saved_tt:0 "An armful of books is saved and the community keeps more of its standing. More are caught by the crowd while you are inside, and you are exposed."
 kehillah_pogrom.0030.t:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_pogrom_0030_t')]"
 kehillah_pogrom.0030.t_christian:0 "The Font"
 kehillah_pogrom.0030.t_islam:0 "The Square"
 kehillah_pogrom.0030.desc:0 "In the courtyard of the church a basin has been set on a cart. The people of the quarter are being brought to it one at a time. A priest wets their heads and says their new names. Those who refuse are taken behind the cart.\n\n[kehillah_mob_leader.GetTitledFirstName] has been watching for you."
 kehillah_pogrom.0030.desc_children:0 "\n\n[kehillah_pogrom_neighbor.GetFirstName] is standing at the edge of the crowd. The children are with [kehillah_pogrom_neighbor.GetHerHim]."
 kehillah_pogrom.0030.desc_none:0 ""
 kehillah_pogrom.0030.a:0 "Refuse it."
 kehillah_pogrom.0030.b:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_pogrom_0030_b')]"
 kehillah_pogrom.0030.b_christian:0 "Go to the font, so the others will be spared."
 kehillah_pogrom.0030.b_islam:0 "Say the words, so the others will be spared."
 kehillah_pogrom.0030.c:0 "Offer everything the community has for our lives."
 kehillah_pogrom.0031.t:0 "The River"
 kehillah_pogrom.0031.desc:0 "They are driving people down to the river. On the bank a priest stands in the water to his knees. Each one is pushed under and brought up again and called by a Christian name. Some are not brought up.\n\n[kehillah_mob_leader.GetTitledFirstName] points you out to the men beside him."
 kehillah_pogrom.0031.a:0 "Refuse it."
 kehillah_pogrom.0031.b:0 "Go down to the water, so the others will be spared."
 kehillah_pogrom_refuse_tt:0 "You refuse, and many with you. More will die, fewer will convert, and you may be killed or taken."
 kehillah_pogrom_accept_tt:0 "You convert, and others follow you. Fewer will die. You will have to give up the leadership of the community."
 kehillah_pogrom_offer_taken:0 "He takes it"
 kehillah_pogrom_offer_taken_tt:0 "Everything the community has is gone. You are spared, and fewer are killed or converted."
 kehillah_pogrom_offer_pocketed:0 "He takes it, and nothing changes"
 kehillah_pogrom_offer_pocketed_tt:0 "Everything the community has is gone."
 kehillah_mob.0010.desc_leader_baptized:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0010_desc_leader_baptized')]"
 kehillah_mob.0010.desc_leader_baptized_christian:0 "\n\nYou were baptized in front of the others. The water is dry on your face. A Jew baptized cannot lead the community."
 kehillah_mob.0010.desc_leader_baptized_islam:0 "\n\nYou said the words in front of the others. A Jew who has converted cannot lead the community."
 kehillah_mob.0010.desc_leader_taken:0 "\n\nYou are among the [kehillah_mob_leader.Custom('KehillahPreacher')]'s captives."
 kehillah_pogrom_ask_neighbor_tt:0 "[kehillah_pogrom_neighbor.GetFirstName] takes the children. Whether [kehillah_pogrom_neighbor.GetSheHe] can be trusted with them depends on [kehillah_pogrom_neighbor.GetHerHis] character, and on what [kehillah_pogrom_neighbor.GetSheHe] thinks of you."
 kehillah_pogrom_hall_tt:0 "The community waits together in the hall."
 kehillah_mob.0110.debt:0 "Remind [kehillah_mob_patron.GetHerHim] of the money [kehillah_mob_patron.GetSheHe] owes us."
 kehillah_mob.0110.hook:0 "Remind [kehillah_mob_patron.GetHerHim] of what you know about [kehillah_mob_patron.GetHerHim]."
 kehillah_mob.0110.friend:0 "Speak to [kehillah_mob_patron.GetHerHim] as an old friend."
 kehillah_mob.0110.physician:0 "Remind [kehillah_mob_patron.GetHerHim] who sat up with [kehillah_mob_patron.GetHerHis] son through the fever."
 kehillah_mob.0140.scripture:0 "Answer him from Scripture, in front of his men."
 kehillah_mob.0140.lieutenants:0 "Find the men who lead his men, and pay them."
 kehillah_mob_scripture_won:0 "His men hear you out"
 kehillah_mob_scripture_lost:0 "He turns your words on you"
 kehillah_mob_lieutenants_bought:0 "Some of them take it"
 kehillah_mob_lieutenants_betrayed:0 "One of them goes to the [kehillah_mob_leader.Custom('KehillahPreacher')]"
 kehillah_mob.0003.hide:0 "Hide in the cellar under the bathhouse."
 kehillah_mob_hide_tt:0 "They will not find you. The community will know where you were: Stability #N -30#!, and without you the harm of a pogrom is greater."
 kehillah_mob.0003.cemetery:0 "Take the families out by the cemetery gate tonight."
 kehillah_mob_cemetery_out:0 "They get out"
 kehillah_mob_cemetery_out_tt:0 "The families are out of the town before morning, hidden in the villages. Fewer will die or convert; the empty quarter will be plundered."
 kehillah_mob_cemetery_caught:0 "The gate is watched"
 kehillah_mob_cemetery_caught_tt:0 "They are turned back at the gate, and the crowd knows they tried: the harm of a pogrom is greater."
 kehillah_pogrom.0030.hidden:0 "Stay where you are."
 kehillah_pogrom_hidden_tt:0 "You hear it from the cellar. The others choose for themselves."
 kehillah_mob.0004.t:0 "The Preaching"
 kehillah_mob.0004.desc:0 "A merchant back from [kehillah_mob_place.GetName] brings the news. A [kehillah_mob_leader.Custom('KehillahPreacher')], [kehillah_mob_leader.GetFirstName], has been speaking in the square there since the call to the cross. He says the enemies of Christ are nearer than Jerusalem, and he names the Jews of [kehillah_mob_town.GetName]. [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] people have sewn crosses to their coats.\n\nHe has no army yet. He is gathering one."
 kehillah_mob.0004.a:0 "Call the elders together."
 kehillah_mob_preaching_week_t:0 "The Preacher Moves On"
 kehillah_mob_preaching_week_d:0 "[kehillah_mob_leader.GetFirstName] preached in [kehillah_mob_preach_place.GetName] on Sunday. More have taken the cross."
 kehillah_mob_news_preaching_t:0 "A Preacher of the Cross"
 kehillah_mob_news_preaching_d:0 "A preacher, [kehillah_mob_leader.GetFirstName], is preaching the cross near [kehillah_news_title.GetNameNoTooltip], and naming its Jews in his sermons."

 # V42 (2026-10-14): the crisis as a place.
 kehillah_mob.0100.s_refuge:0 "\n#P Refuge:#! [ROOT.Char.MakeScope.Var('kehillah_mob_refuge_lord_ref').Char.GetTitledFirstName] will shelter us in [ROOT.Char.MakeScope.Var('kehillah_mob_refuge_lord_ref').Char.GetHerHis] castle. The host must take the castle first."
 kehillah_mob.0100.s_men:0 "\n#P Soldiers:#! [ROOT.Char.MakeScope.Var('kehillah_mob_men_ref').Char.GetTitledFirstName] has called out [ROOT.Char.MakeScope.Var('kehillah_mob_men_ref').Char.GetHerHis] men against the host."
 kehillah_mob.0100.s_condemned:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0100_s_condemned')]"
 kehillah_mob.0100.s_condemned_christian:0 "\n#P The Church:#! the preaching has been condemned, and men are leaving the host."
 kehillah_mob.0100.s_condemned_islam:0 "\n#P The ulama:#! the preaching has been condemned, and men are leaving the host."
 kehillah_mob.0100.s_thinned:0 "\n#P The host:#! fewer men follow the [kehillah_mob_leader.Custom('KehillahPreacher')] than before."
 kehillah_mob.0100.s_defended:0 "\n#P The quarter:#! the streets are barricaded."
 kehillah_mob.0100.s_armed:0 "\n#P The young men#! are armed and stand at the gates."
 kehillah_mob.0100.s_scattered:0 "\n#P The families#! are hidden in the villages, and the quarter stands empty."
 kehillah_mob.0100.f_refuge:0 "\n#N Refused:#! [ROOT.Char.MakeScope.Var('kehillah_mob_refuge_no_ref').Char.GetTitledFirstName] would not open [ROOT.Char.MakeScope.Var('kehillah_mob_refuge_no_ref').Char.GetHerHis] castle."
 kehillah_mob.0100.f_men:0 "\n#N Refused:#! [ROOT.Char.MakeScope.Var('kehillah_mob_men_no_ref').Char.GetTitledFirstName] would not ride out."
 kehillah_mob.0100.f_condemn:0 "\n#N Refused:#! [ROOT.Char.MakeScope.Var('kehillah_mob_condemn_no_ref').Char.GetTitledFirstName] would not condemn the preaching."
 kehillah_mob.0100.f_bribe:0 "\n#N Refused:#! the [kehillah_mob_leader.Custom('KehillahPreacher')] kept our silver."
 kehillah_mob.0100.f_defence:0 "\n#N Failed:#! the barricades came to nothing."
 kehillah_mob.0100.f_armed:0 "\n#N Failed:#! the young men are not soldiers, and they will only enrage the host."
 kehillah_mob.0100.p_messenger:0 "\n#weak On the road:#! [ROOT.Char.MakeScope.Var('kehillah_mob_messenger_ref').Char.GetFirstName] has gone to [ROOT.Char.MakeScope.Var('kehillah_mob_messenger_to_ref').Char.GetTitledFirstName]."
 kehillah_mob.0100.o_devastating:0 "\n\nIf the host struck today, the harm would be #N devastating#!."
 kehillah_mob.0100.o_grave:0 "\n\nIf the host struck today, the harm would be #N grave#!."
 kehillah_mob.0100.o_light:0 "\n\nIf the host struck today, the harm would be #P light#!."
 kehillah_mob.0101.t:0 "Protection"
 kehillah_mob.0101.desc:0 "Who can stand between the community and the host? The lord who holds the town, the lord above him, and the men of religion. Every journey takes days, and the host is still marching."
 kehillah_mob.0101.a:0 "[kehillah_mob_lord.GetTitledFirstName], who holds [kehillah_mob_town.GetName]."
 kehillah_mob.0101.b:0 "[kehillah_mob_overlord.GetTitledFirstName], [kehillah_mob_lord.GetFirstName]'s liege."
 kehillah_mob.0101.c:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0101_c')]"
 kehillah_mob.0101.c_christian:0 "The Church."
 kehillah_mob.0101.c_islam:0 "The ulama."
 kehillah_mob.0101.d:0 "Back."
 kehillah_mob.0102.t:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0102_t')]"
 kehillah_mob.0102.t_christian:0 "The Church"
 kehillah_mob.0102.t_islam:0 "The Ulama"
 kehillah_mob.0102.desc:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0102_desc')]"
 kehillah_mob.0102.desc_christian:0 "The Church has an old law about the Jews: they are not to be killed, nor baptized by force. Whether its priests will say so now is another matter."
 kehillah_mob.0102.desc_islam:0 "The Pact of Umar protects the Jews: a dhimmi who pays the jizya is not to be harmed, nor forced from his faith. Whether the men of religion will say so now is another matter."
 kehillah_mob.0102.a:0 "Go to [kehillah_mob_chaplain.GetTitledFirstName], [kehillah_mob_lord.GetFirstName]'s chaplain."
 kehillah_mob.0102.b:0 "Send [kehillah_mob_messenger_cand.GetFirstName] to [kehillah_mob_chaplain.GetTitledFirstName]."
 kehillah_mob.0102.c:0 "Write to [kehillah_mob_hof.GetTitledFirstName]."
 kehillah_mob.0102.d:0 "Back."
 kehillah_mob.0104.t:0 "[kehillah_mob_patron.GetTitledFirstName]"
 kehillah_mob.0104.desc:0 "[kehillah_mob_patron.GetTitledFirstName] is [kehillah_mob_patron.Custom('KehillahOutlookBand')] toward the Jews. Do you go to [kehillah_mob_patron.GetHerHim] yourself, or send someone in your place while you see to things here?"
 kehillah_mob.0104.a:0 "I will go myself."
 kehillah_mob.0104.b:0 "Send [kehillah_mob_messenger_cand.GetFirstName]."
 kehillah_mob.0104.c:0 "Back."
 kehillah_mob.0105.t:0 "An Errand"
 kehillah_mob.0105.desc:0 "[kehillah_mob_messenger_cand.GetFirstName] will carry one request to [kehillah_mob_patron.GetTitledFirstName]. What should [kehillah_mob_messenger_cand.GetSheHe] ask for?"
 kehillah_mob.0105.a:0 "Refuge in [kehillah_mob_patron.GetHerHis] castle."
 kehillah_mob.0105.b:0 "That [kehillah_mob_patron.GetSheHe] call out [kehillah_mob_patron.GetHerHis] men against the host."
 kehillah_mob.0105.c:0 "Back."
 kehillah_mob.0112.t:0 "What We Can Offer"
 kehillah_mob.0112.desc:0 "What can you put before [kehillah_mob_patron.GetTitledFirstName]?"
 kehillah_mob.0112.a:0 "Remind [kehillah_mob_patron.GetHerHim] of the protection [kehillah_mob_patron.GetHerHis] charter promised us."
 kehillah_mob.0112.b:0 "Lay silver before [kehillah_mob_patron.GetHerHim]."
 kehillah_mob.0112.c:0 "Remind [kehillah_mob_patron.GetHerHim] of the money [kehillah_mob_patron.GetSheHe] owes us."
 kehillah_mob.0112.d:0 "Something else..."
 kehillah_mob.0113.desc:0 "What else is there?"
 kehillah_mob.0113.d:0 "Back."
 kehillah_mob.0111.t:0 "The Answer"
 kehillah_mob.0111.intro_self:0 "[kehillah_mob_patron.GetTitledFirstName] hears you out to the end.\n\n"
 kehillah_mob.0111.intro_messenger:0 "[kehillah_mob_teller.GetFirstName] comes back from [kehillah_mob_patron.GetTitledFirstName]'s court with the dust of the road still on [kehillah_mob_teller.GetHerHis] clothes.\n\n"
 kehillah_mob.0111.refuge_yes_price:0 ""My castle has room," [kehillah_mob_patron.GetSheHe] says, "and my steward will tell you what the room costs." The gates will be open to the community when the host comes."
 kehillah_mob.0111.refuge_yes_warm:0 ""You will come to the castle," [kehillah_mob_patron.GetSheHe] says. "All of you, with whatever you can carry. No one will touch you behind my walls while I hold them.""
 kehillah_mob.0111.refuge_yes:0 "[kehillah_mob_patron.GetSheHe|U] is silent a long while. Then [kehillah_mob_patron.GetSheHe] nods. "Bring them to the castle when the host is near. Not before.""
 kehillah_mob.0111.refuge_no_hostile:0 ""The people have their grievances," [kehillah_mob_patron.GetSheHe] says. "I will not stand between them and you." [kehillah_mob_patron.GetSheHe|U] turns back to [kehillah_mob_patron.GetHerHis] steward before the door has closed."
 kehillah_mob.0111.refuge_no_warm:0 ""I cannot," [kehillah_mob_patron.GetSheHe] says. "If I shelter you, the town will say I took Jewish silver against the blood of the faithful, and half my men will believe it." [kehillah_mob_patron.GetSheHe|U] does not meet anyone's eyes."
 kehillah_mob.0111.refuge_no:0 ""My castle is small, and my garrison smaller," [kehillah_mob_patron.GetSheHe] says. "I am sorry." [kehillah_mob_patron.GetSheHe|U] does not sound sorry."
 kehillah_mob.0111.men_yes_warm:0 ""I will not have a [kehillah_mob_leader.Custom('KehillahPreacher')] raise an army in my lands," [kehillah_mob_patron.GetSheHe] says. Before evening [kehillah_mob_patron.GetHerHis] marshal is sending riders to the villages for the levy."
 kehillah_mob.0111.men_yes:0 "[kehillah_mob_patron.GetSheHe|U] thinks for a long time. "If they come, they come through my land. I will call out my men." [kehillah_mob_patron.GetSheHe|U] says it as if it costs [kehillah_mob_patron.GetHerHim] a great deal."
 kehillah_mob.0111.men_no_craven:0 ""Fight them? Thousands of them?" [kehillah_mob_patron.GetSheHe|U] laughs without humour. "Lock your doors, and pray.""
 kehillah_mob.0111.men_no_warm:0 ""My men will not march against their own neighbours for the sake of the Jews," [kehillah_mob_patron.GetSheHe] says. "Not with the harvest in the fields. I would lose them.""
 kehillah_mob.0111.men_no:0 ""The [kehillah_mob_leader.Custom('KehillahPreacher')]'s quarrel is not with me," [kehillah_mob_patron.GetSheHe] says. "My men stay home.""
 kehillah_mob.0111.a:0 "Ask [kehillah_mob_patron.GetHerHim] about the rest."
 kehillah_mob.0111.b:0 "Return to the elders."
 kehillah_mob.0131.t:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0131_t')]"
 kehillah_mob.0131.t_christian:0 "The Church's Answer"
 kehillah_mob.0131.t_islam:0 "The Ulama's Answer"
 kehillah_mob.0131.intro_self:0 "[kehillah_mob_cleric.GetTitledFirstName] closes the book on [kehillah_mob_cleric.GetHerHis] desk.\n\n"
 kehillah_mob.0131.intro_messenger:0 "[kehillah_mob_teller.GetFirstName] comes back from [kehillah_mob_cleric.GetTitledFirstName]'s house.\n\n"
 kehillah_mob.0131.intro_letter:0 "A rider brings [kehillah_mob_cleric.GetTitledFirstName]'s answer under a lead seal.\n\n"
 kehillah_mob.0131.yes:0 "[ROOT.Char.Custom('KehillahMobFaith_kehillah_mob_0131_yes')]"
 kehillah_mob.0131.yes_christian:0 "On Sunday the preaching is condemned from the pulpit: the Jews are not to be killed, nor baptized by force, and whoever does it sins. Word of it reaches the preacher's camp within days. Some of his men go home."
 kehillah_mob.0131.yes_islam:0 "On Friday the preacher of the great mosque speaks against the mob: the Jews are people of the Pact, under the protection of God and His Messenger, and whoever harms them breaks it. Word of it reaches the camp within days. Some of the men go home."
 kehillah_mob.0131.no_zealous:0 ""The man preaches the cross," [kehillah_mob_cleric.GetSheHe] says. "I will not silence the cross.""
 kehillah_mob.0131.no:0 "[kehillah_mob_cleric.GetSheHe|U] promises to pray on it. No word comes from [kehillah_mob_cleric.GetHerHis] pulpit on Sunday, or on the Sunday after."
 kehillah_mob.0131.a:0 "Return to the elders."
 kehillah_mob.0140.reason:0 "Reason with him."
 kehillah_mob.0142.desc:0 "His men stand round in a ring, leaning on their scythes. What will you say to him?"
 kehillah_mob.0142.d:0 "Back."
 kehillah_mob.0141.t:0 "The [kehillah_mob_leader.Custom('KehillahPreacherCap')]'s Answer"
 kehillah_mob.0141.bribe_yes:0 "[kehillah_mob_leader.GetFirstName] weighs the bag in his hand and gives it to one of his captains without opening it. In the morning the host breaks camp and takes the other road."
 kehillah_mob.0141.bribe_no:0 "He has the silver counted in front of you. Then he tells his men that the Jews have paid for their bread on the road to [kehillah_mob_town.GetName]."
 kehillah_mob.0141.scripture_yes:0 "You answer him verse for verse, and the men nearest the fire stop laughing. When he tries to shout you down, some of them walk away. More are gone by morning."
 kehillah_mob.0141.scripture_no:0 "He lets you finish. Then he turns your verses on you, word for word, and the camp roars. They will come to [kehillah_mob_town.GetName] angrier than before."
 kehillah_mob.0141.lieutenants_yes:0 "Three of his captains take the silver. In the morning they are gone, and many of the camp with them."
 kehillah_mob.0141.lieutenants_no:0 "One of the captains takes your silver straight to the [kehillah_mob_leader.Custom('KehillahPreacher')]. His men catch you on the road home."
 kehillah_mob.0141.reason_yes:0 "He listens. At the end he says nothing for a long time. Then he tells his men they will march by the other road."
 kehillah_mob.0141.reason_no:0 "He laughs, and his men push you out of the camp. Stones follow you down the road."
 kehillah_mob.0141.a:0 "Return to the elders."
 kehillah_mob.0150.desc_no_watch:0 "The community has no Rosh ha-Shmirah to lead a watch. Whatever is done, the families must do for themselves."
 kehillah_mob.0100.p_letter:0 "\n#weak On the road:#! our letter to [ROOT.Char.MakeScope.Var('kehillah_mob_letter_to_ref').Char.GetTitledFirstName]."
 kehillah_mob_host_thinned_tt:0 "Some of his men leave the host."
 kehillah_mob_host_angered_tt:0 "His men will come angrier."

 # V42: a Muslim mob's versions of lines that name the people in the scene.
 kehillah_mob.0130.desc_chaplain_islam:0 "[kehillah_mob_cleric.GetTitledFirstName] receives you in the courtyard of the mosque. [kehillah_mob_cleric.GetSheHe|U] knows what is being preached in the markets, and [kehillah_mob_cleric.GetSheHe] knows the old law: the dhimmi who pays the jizya is under the protection of God and His Messenger."
 kehillah_mob.0131.no_zealous_islam:0 ""The man calls the faithful to their duty," [kehillah_mob_cleric.GetSheHe] says. "I will not silence him.""
 kehillah_pogrom.0030.desc_islam:0 "In the square before the great mosque, the people of the quarter are being brought before a qadi one at a time. He has them say the words: there is no god but God, and Muhammad is the Messenger of God. Those who will not say them are led away.\n\n[kehillah_mob_leader.GetTitledFirstName] has been watching for you."
 kehillah_mob_waiz_male:0 "Wa'iz"
 kehillah_mob_waiz_female:0 "Wa'iza"
 kehillah_preacher_noun:0 "preacher"
 kehillah_preacher_noun_islam:0 "wa'iz"
 kehillah_preacher_cap:0 "Preacher"
 kehillah_preacher_cap_islam:0 "Wa'iz"
 kehillah_mob_army_name_islam:0 "The Wa'iz's Host"
