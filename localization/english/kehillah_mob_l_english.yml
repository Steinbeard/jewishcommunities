l_english:
 # V39 slice 1 -- the Mob (docs/spec/v39-pogroms-and-the-popular-crusade.md).
 kehillah_mob_cb:0 "Pogrom"
 kehillah_mob_community_cb:0 "Pogrom"
 kehillah_mob_cb_victory_desc:0 "The host has had its way."
 kehillah_mob_cb_white_peace_desc:0 "The host moves on."
 kehillah_mob_cb_defeat_desc:0 "The host is broken."
 kehillah_mob_army_name:0 "The Preacher's Host"
 kehillah_mob_defenders_name:0 "The Lord's Men"
 KEHILLAH_MOB_TITLE_NAME:0 "Holy Host"
 KEHILLAH_MOB_WAR_NAME:0 "The Holy Host against the Jews"
 kehillah_mob_preacher_male:0 "Preacher"
 kehillah_mob_preacher_female:0 "Preacher"

 kehillah_mob_band_0:0 "at the gates"
 kehillah_mob_band_1:0 "only days away"
 kehillah_mob_band_2:0 "a week or two away"
 kehillah_mob_band_3:0 "within a month's march"
 kehillah_mob_band_4:0 "still far off"

 kehillah_mob.0001.t:0 "A Preacher Raises a Host"
 kehillah_mob.0001.a:0 "Proclaim a fast, and set to work."
 kehillah_mob_refuge_granted:0 "The lord will shelter us"
 kehillah_mob_refuge_granted_tt:0 "The community will take refuge in the castle. The host must besiege it (60 days, and 20 more for each level of the fort) -- but each month the lord may give us up, the more likely the colder he is to the Jews."
 kehillah_mob_refuge_refused:0 "The lord refuses"
 kehillah_mob_refuge_refused_tt:0 "There will be no refuge here. His outlook on the Jews #N -3#!"
 kehillah_mob_condemned:0 "The Church condemns the host"
 kehillah_mob_condemned_tt:0 "A quarter of the host's men desert, and the harm it can do is less."
 kehillah_mob_not_condemned:0 "The Church is silent"
 kehillah_mob_not_condemned_tt:0 "No word comes. The silver is spent."
 kehillah_mob_defended:0 "The quarter is readied"
 kehillah_mob_defended_tt:0 "The streets are barricaded and the gates reinforced: the harm of a pogrom is less."
 kehillah_mob_not_defended:0 "The defence comes to nothing"
 kehillah_mob_not_defended_tt:0 "The silver is spent."
 kehillah_mob_fast_tt:0 "Stability #P +20#!"

 kehillah_mob.0002.t:0 "They Are Coming for Us"
 kehillah_mob_bribe_taken:0 "The preacher takes the silver"
 kehillah_mob_bribe_taken_tt:0 "The host turns aside and leaves the community in peace."
 kehillah_mob_bribe_kept:0 "They take the silver, and come anyway"
 kehillah_mob_bribe_kept_tt:0 "The silver is gone."
 kehillah_mob_lord_raises_men:0 "The lord calls out his men"
 kehillah_mob_lord_raises_men_tt:0 "[recipient.GetTitledFirstName] joins the war against the host, with men gathered beside the town. #weak Some may not come: Christian levies are loath to fight for Jews.#!"
 kehillah_mob_lord_will_not:0 "The lord will not raise a hand"
 kehillah_mob_lord_will_not_tt:0 "[recipient.GetTitledFirstName]'s outlook on the Jews #N -5#!"
 kehillah_mob_scattered_tt:0 "The community scatters into the villages: fewer will die or be baptized, but the empty quarter will be plundered (more buildings and Prosperity lost), and some may be found."

 kehillah_mob.0003.t:0 "At the Gates"
 kehillah_mob.0003.desc:0 "[kehillah_mob_leader.GetTitledFirstName] and [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men stand before [kehillah_mob_town.GetName]."
 kehillah_mob.0003.desc_refuge:0 " The community has taken refuge in [ROOT.Char.MakeScope.Var('kehillah_mob_refuge_lord_ref').Char.GetTitledFirstName]'s castle. The host must take it, which may take [ROOT.Char.MakeScope.Var('kehillah_mob_siege_days_ref').GetValue|0] days -- if the lord holds firm."
 kehillah_mob.0003.desc_open:0 " The burghers have opened the town to them. Nothing stands between the host and the quarter."
 kehillah_mob.0003.a:0 "Stand at the gate yourself."
 kehillah_mob.0003.b:0 "Send the elders out with silver."
 kehillah_mob.0003.c:0 "Open the gates and plead for mercy."
 kehillah_mob.0003.d:0 "Bar the doors of the synagogue and pray."
 kehillah_mob_gate_held:0 "You hold the gate"
 kehillah_mob_gate_held_tt:0 "The harm of the pogrom is less."
 kehillah_mob_gate_lost:0 "You are struck down at the gate"
 kehillah_mob_plead_heard:0 "The preacher hears you"
 kehillah_mob_plead_heard_tt:0 "The harm of the pogrom is halved."
 kehillah_mob_plead_scorned:0 "They laugh at you"
 kehillah_mob_plead_scorned_tt:0 "Nothing is gained."

 kehillah_mob.0005.t:0 "Given Up"
 kehillah_mob.0005.desc:0 "The lord who sheltered us has opened his castle to the host. The Jews who took refuge there are in the preacher's hands."
 kehillah_mob.0005.a:0 "God help us."

 kehillah_mob.0010.t:0 "After the Pogrom"
 kehillah_mob.0010.desc:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has done its work in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. [ROOT.Char.MakeScope.Var('kehillah_pogrom_dead').GetValue|0] of our people are dead and [ROOT.Char.MakeScope.Var('kehillah_pogrom_baptized').GetValue|0] were baptized by force; the quarter has lost [ROOT.Char.MakeScope.Var('kehillah_pogrom_buildings').GetValue|0] of its buildings.\n\nProsperity #N [ROOT.Char.MakeScope.Var('kehillah_pogrom_last_prosperity').GetValue|0]#!, Stability #N [ROOT.Char.MakeScope.Var('kehillah_pogrom_last_stability').GetValue|0]#!. For ten years the memory will weigh on the community."
 kehillah_mob.0010.desc_martyrs:0 "\n\n[ROOT.Char.MakeScope.Var('kehillah_pogrom_martyrs').GetValue|0] chose death rather than the font, sanctifying the Name -- #italic kiddush ha-Shem#!. Their names will be written in the book of remembrance."
 kehillah_mob.0010.desc_no_martyrs:0 ""
 kehillah_mob.0010.desc_hostages:0 "\n\nThe preacher holds [ROOT.Char.MakeScope.Var('kehillah_pogrom_hostages').GetValue|0] of ours captive, and asks [ROOT.Char.MakeScope.Var('kehillah_pogrom_ransom_ref').GetValue|0] gold for them."
 kehillah_mob.0010.desc_no_hostages:0 ""
 kehillah_mob.0010.desc_leader_fell:0 "\n\n#N You were wounded in the defence of the synagogue, and you will not survive the day.#!"
 kehillah_mob.0010.desc_end:0 ""
 kehillah_mob.0010.a:0 "Redeem the captives."
 kehillah_mob.0010.b:0 "We cannot pay."
 kehillah_mob.0010.c:0 "We will remember them."
 kehillah_mob_ransomed_tt:0 "The captives are freed."
 kehillah_mob_not_ransomed_tt:0 "The captives are killed, or baptized and lost to the community."

 kehillah_mob.0020.t:0 "The Host Is Broken"
 kehillah_mob.0020.desc:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has scattered before it could reach us. Its men have gone home to their fields, or to other lords' gallows. The community breathes again."
 kehillah_mob.0020.a:0 "Blessed is He who has spared us."

 kehillah_mob_nearer_t:0 "The Host Draws Nearer"
 kehillah_mob_nearer_d:0 "[kehillah_mob_leader.GetTitledFirstName]'s host is now [kehillah_mob_victim.Custom('KehillahMobBand')]."
 kehillah_mob_news_forms_t:0 "A Host Forms"
 kehillah_mob_news_forms_d:0 "A preacher, [kehillah_mob_leader.GetTitledFirstName], has raised a host against the Jews of [kehillah_news_title.GetNameNoTooltip]."
 kehillah_mob_news_gates_t:0 "A Host at the Gates"
 kehillah_mob_news_gates_d:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has reached [kehillah_news_title.GetNameNoTooltip]."
 kehillah_mob_news_pogrom_t:0 "A Pogrom"
 kehillah_mob_news_pogrom_d:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has fallen on the Jews of [kehillah_news_title.GetNameNoTooltip]."

 kehillah_defend_community_interaction:0 "Defend the Jews"
 kehillah_defend_community_interaction_desc:0 "Join the war against the host marching on [recipient.GetPrimaryTitle.GetNameNoTooltip], on the community's side. #weak Your armies may then attack it.#!"
 kehillah_defend_community_tt:0 "You join the war against the host."
 kehillah_defend_community_already_tt:0 "You are already at war with the host"
 kehillah_defend_community_msg_t:0 "A Defender"
 kehillah_defend_community_msg_d:0 "[actor.GetTitledFirstName] has taken up arms against the host marching on us."
 kehillah_mob_how_to_act_tt:0 "The elders will gather. You can ride to the lord or send to the overlord, go to the churchmen, meet the preacher himself, or set the watch to work -- one at a time, and each takes days the host will spend marching. The odds of each approach show before you choose."
 kehillah_mob.0002.a:0 "Call the elders together again."
 kehillah_mob.0100.t:0 "The Elders Gather"
 kehillah_mob.0100.desc:0 "The elders crowd into the synagogue's courtyard. [kehillah_mob_leader.GetTitledFirstName]'s host is [ROOT.Char.Custom('KehillahMobBand')], [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men. Whom do we go to, and what do we offer?"
 kehillah_mob.0100.desc_refuge:0 "\n\n#P We have refuge in [ROOT.Char.MakeScope.Var('kehillah_mob_refuge_lord_ref').Char.GetTitledFirstName]'s castle.#!"
 kehillah_mob.0100.desc_condemned:0 "\n\n#P The Church has condemned the host; men are leaving it.#!"
 kehillah_mob.0100.desc_defended:0 "\n\n#P The streets of the quarter are barricaded.#!"
 kehillah_mob.0100.desc_scattered:0 "\n\nOur families are hidden in the villages."
 kehillah_mob.0100.desc_none:0 ""
 kehillah_mob.0100.a:0 "Ride to [kehillah_mob_lord.GetTitledFirstName]'s castle."
 kehillah_mob.0100.b:0 "Send to [kehillah_mob_overlord.GetTitledFirstName]."
 kehillah_mob.0100.c:0 "Go to [kehillah_mob_chaplain.GetTitledFirstName], [kehillah_mob_lord.GetFirstName]'s chaplain."
 kehillah_mob.0100.d:0 "Write to [kehillah_mob_hof.GetTitledFirstName]."
 kehillah_mob.0100.e:0 "Go out to the preacher's camp."
 kehillah_mob.0100.f:0 "Send for [kehillah_mob_marshal.GetTitledFirstName], the Rosh ha-Shmirah."
 kehillah_mob.0100.g:0 "Send our families into the villages."
 kehillah_mob.0100.h:0 "We have done what we can, for now."
 kehillah_mob_travel_lord_tt:0 "A ride of two to four days."
 kehillah_mob_travel_overlord_tt:0 "A journey of six to twelve days."
 kehillah_mob_travel_chaplain_tt:0 "A ride of two to four days."
 kehillah_mob_travel_hof_tt:0 "A letter, and an answer: ten to twenty days."
 kehillah_mob_travel_preacher_tt:0 "A ride of a day or two -- into his camp."
 kehillah_mob_hub_reopen_tt:0 "The elders gather again if the host draws nearer."
 kehillah_mob.0110.t:0 "An Audience"
 kehillah_mob.0110.desc_warm:0 "[kehillah_mob_patron.GetTitledFirstName] receives you at once, and listens with a grave face. He has heard of the preacher. "Tell me what you need," he says."
 kehillah_mob.0110.desc_neutral:0 "[kehillah_mob_patron.GetTitledFirstName] keeps you waiting half a day before he will see you. When he does, he hears you out with folded arms."
 kehillah_mob.0110.desc_cold:0 "[kehillah_mob_patron.GetTitledFirstName] receives you standing, and does not ask you to sit. "The people are restless," he says. "Perhaps they have their reasons.""
 kehillah_mob.0110.a:0 "Remind him of the protection his charter promised us."
 kehillah_mob.0110.b:0 "Lay silver before him."
 kehillah_mob.0110.c:0 "Beg him to ride out against them."
 kehillah_mob.0110.d:0 "Take your leave."
 kehillah_mob.0130.t:0 "Before the Church"
 kehillah_mob.0130.desc_chaplain:0 "[kehillah_mob_cleric.GetTitledFirstName] receives you in his study, among his books. He knows what is being preached in the market squares, and he knows the old law of the Church: that the Jews are not to be killed, nor baptized by force."
 kehillah_mob.0130.desc_hof:0 "Your envoy has reached [kehillah_mob_cleric.GetTitledFirstName]'s court, and after many days is admitted to his presence. He kneels, and lays the community's letter before him."
 kehillah_mob.0130.a:0 "Argue from Scripture and the Church's own law."
 kehillah_mob.0130.b:0 "Offer a gift for his church."
 kehillah_mob.0130.c:0 "Take your leave."
 kehillah_mob.0140.t:0 "In the Preacher's Camp"
 kehillah_mob.0140.desc:0 "[kehillah_mob_leader.GetTitledFirstName]'s camp stinks of smoke and wet wool. His men watch you with open hatred as you are led to him. He does not rise. "Speak, Jew," he says."
 kehillah_mob.0140.a:0 "Offer him silver to turn aside."
 kehillah_mob.0140.b:0 "Offer half as much again."
 kehillah_mob.0140.c:0 "Reason with him."
 kehillah_mob.0140.d:0 "Leave, before his men turn on you."
 kehillah_mob_reason_heard:0 "He hears you"
 kehillah_mob_reason_heard_tt:0 "Something in your words reaches him. The host turns aside."
 kehillah_mob_reason_scorned:0 "He laughs, and his men close in"
 kehillah_mob_reason_scorned_tt:0 "You may not leave the camp unhurt."
 kehillah_mob.0150.t:0 "The Watch"
 kehillah_mob.0150.desc:0 "[kehillah_mob_marshal.GetTitledFirstName] has the watch gathered in the courtyard: a few dozen men with staves and old swords. "Tell us what to do," he says."
 kehillah_mob.0150.a:0 "Barricade the streets of the quarter."
 kehillah_mob.0150.b:0 "Arm the young men, and stand at the gates."
 kehillah_mob.0150.c:0 "Not yet."
 kehillah_mob_armed:0 "The young men stand ready"
 kehillah_mob_armed_tt:0 "Armed men at the gates: the harm of a pogrom is much less."
 kehillah_mob_armed_failed:0 "They are not soldiers"
 kehillah_mob_armed_failed_tt:0 "Untrained and too few, they will only enrage the host: the harm of a pogrom is greater."
 kehillah_mob.0001.desc:0 "In [kehillah_mob_place.GetName], a preacher, [kehillah_mob_leader.GetFirstName], has been crying in the market squares that the Jews are the enemies of God and that their blood will cleanse the land. Hundreds took up his cause, then thousands: [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men, armed with scythes, clubs and torches. They are [ROOT.Char.Custom('KehillahMobBand')], and it is the Jews of [kehillah_mob_town.GetName] they are coming for.\n\nThere is still time, and there are people to ask: [kehillah_mob_lord.GetTitledFirstName], who holds the castle, and the lords above him; the clergy of the [kehillah_mob_leader.GetFaith.GetAdjective] faith; our own Rosh ha-Shmirah; and the preacher himself, who may take silver. #weak Every request can fail, and most of them cost.#!"
 kehillah_mob.0002.desc:0 "[kehillah_mob_leader.GetTitledFirstName]'s host has reached [kehillah_mob_place.GetName], [ROOT.Char.Custom('KehillahMobBand')]: [ROOT.Char.MakeScope.Var('kehillah_mob_size_ref').GetValue|0] men. Our people are gathering in the synagogue courtyard to hear what the elders will do. Some are already loading carts."
