l_english:
 kehillah_bet_din.0281.t:0 "The Richest Man's Tax Exemption"
 kehillah_bet_din.0281.desc:0 "[kbd_litigant_a.GetFirstName] represents a wealthy courtier who says his ruler exempted him from the communal levy. [kbd_litigant_b.GetFirstName] speaks for households that must cover the shortfall. A seal is shown, but the exemption's scope is hard to read. The court must fund common protection without granting an unproved privilege or ignoring a real one."
 kehillah_bet_din.0281.a:0 "Honor the claimed exemption and cover the gap."
 kehillah_bet_din.0281.a.tt:0 "Peace with the courtier is quick but an invalid exemption shifts his share to poorer neighbors."
 kehillah_bet_din.0281.b:0 "Read the grant with witnesses and fund urgent costs."
 kehillah_bet_din.0281.b.tt:0 "An inquiry protects both the levy and the alleged grant, at a cost."
 kehillah_bet_din.0281.c:0 "Charge the courtier the full levy now."
 kehillah_bet_din.0281.c.tt:0 "The levy is funded, but a valid grant could make collection a breach of promise."
 kehillah_din_source_28:0 "Cite a mastered Nezikin work and inspect the grant's scope."
 kehillah_din_source_28_tt:0 "Mishnah Bava Batra 1:5 offers an analogy for shared communal costs. It does not define the scope of this ruler's grant."
 kehillah_din_combo_28:0 "Have a scholar and steward compare the grant with the levy roll."
 kehillah_din_combo_28_tt:0 "The judges fund urgent protection while checking the seal and each household's assessment."
 kehillah_bet_din.0284.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0284.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0284.outcome_1:0 "The court accepts the exemption and pays the missing share from communal reserves."
 kehillah_bet_din.0284.outcome_2:0 "The court advances urgent expenses while witnesses examine the ruler's grant."
 kehillah_bet_din.0284.outcome_3:0 "The court charges the courtier the full levy and closes the account."
 kehillah_bet_din.0284.fact_true:0 "The seal covers only a royal payment, not this communal levy. The exemption shifted a real burden onto neighbors."
 kehillah_bet_din.0284.fact_false:0 "The grant expressly includes communal levies. Full collection disregarded a valid exemption."
 kehillah_bet_din.0284.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0284.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0284.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case28_one_tt:0 "Communal reserves cover the largest tax gap."
 kehillah_din_case28_two_tt:0 "Witnesses and an advance cost some Prosperity."
 kehillah_din_case28_three_tt:0 "Full collection is cheaper now but may challenge a valid grant."
 kehillah_bet_din_case28_great_log_title:0 "The Richest Man's Tax Exemption: a well-supported ruling"
 kehillah_bet_din_case28_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s tax exemption claim."
 kehillah_bet_din_case28_good_log_title:0 "The Richest Man's Tax Exemption: a workable ruling"
 kehillah_bet_din_case28_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s tax exemption claim."
 kehillah_bet_din_case28_poor_log_title:0 "The Richest Man's Tax Exemption: a disputed ruling"
 kehillah_bet_din_case28_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s tax exemption claim."
