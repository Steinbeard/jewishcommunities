 kehillah_businesses_manage:0 "Manage businesses"
 kehillah_businesses_none:0 "No assignable businesses built. Construct a market, productive trade, scriptorium, Bankers’ Row or Funduq."
 kehillah_business_worker_tt:0 "Must be a current non-leading Ba’al Bayit of this community, free and able to work."
 kehillah_business_family_free_tt:0 "A household can operate only one business. A voluntarily dismissed household must finish its two-year commitment before taking another appointment."
 kehillah_businesses_effect_desc:0 "Operates this business at its built tier: goods and operating income stop while vacant. Household wealth grows through its livelihood; no additional salary is paid. This is economic employment, not a communal office."
 kehillah_businesses_output:0 "Output: [Character.GetPrimaryTitle.MakeScope.ScriptValue(Concatenate('kehillah_business_', Concatenate(Scope.GetFlagName, '_output_cached_value')))|0] · Operating income: [Character.GetPrimaryTitle.MakeScope.ScriptValue(Concatenate('kehillah_business_', Concatenate(Scope.GetFlagName, '_income_cached_value')))|2] [gold_i]/month"
 kehillah_businesses_commitment:0 "An appointment commits the household for two years. It may be dismissed at any time, but voluntary dismissal does not permit immediate reassignment. Death, loss of eligibility or forced vacancy releases the commitment."
