l_english:
 kehillah_business_vacancy_badge_tt:0 "Vacant business — appoint a Ba’al Bayit to enable its production and operating income."
 kehillah_businesses_header:0 "Businesses"
 kehillah_businesses_households:0 "Households"
 kehillah_businesses_summary:0 "Businesses operating: [Character.GetPrimaryTitle.MakeScope.ScriptValue('kehillah_business_staffed_count_value')|0]/[Character.GetPrimaryTitle.MakeScope.ScriptValue('kehillah_business_built_count_value')|0]"
 kehillah_businesses_intro:0 "Buildings provide the premises; a Ba’al Bayit operates the business. Vacant businesses produce no goods or operating income. Appointments have no salary."
 kehillah_businesses_appoint:0 "Appoint"
 kehillah_businesses_replace:0 "Replace"
