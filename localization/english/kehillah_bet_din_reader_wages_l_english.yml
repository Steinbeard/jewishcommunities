l_english:
 kehillah_bet_din.0701.t:0 "The Torah Reader's Wage"
 kehillah_bet_din.0701.desc:0 "[kbd_litigant_a.GetFirstName] speaks for officers who withheld a Torah reader's holiday wage after the synagogue closed for repairs. [kbd_litigant_b.GetFirstName] says the reader stood ready and could not take other work. The contract names a season, not a number of readings. The court must assign the cost of a closure no one planned."
 kehillah_bet_din.0701.a:0 "Withhold all wages for missed readings."
 kehillah_bet_din.0701.a.tt:0 "The treasury is protected, but a reader prevented from working may have earned the wage."
 kehillah_bet_din.0701.b:0 "Pay an advance and examine contract and closure dates."
 kehillah_bet_din.0701.b.tt:0 "The court keeps the reader solvent while checking the promised service."
 kehillah_bet_din.0701.c:0 "Pay the full season without inquiry."
 kehillah_bet_din.0701.c.tt:0 "Full payment may ignore days when the reader was unavailable."
 kehillah_din_source_70:0 "Cite a mastered Moed work and examine the evidence."
 kehillah_din_source_70_tt:0 "Mishnah Megillah 4:4 gives the judges a textual point of reference. It cannot establish the reader's availability and contract."
 kehillah_din_combo_70:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_70_tt:0 "The judges preserve both parties' interests while checking the reader's availability and contract."
 kehillah_bet_din.0704.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0704.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0704.outcome_1:0 "The court denies payment for the closed period."
 kehillah_bet_din.0704.outcome_2:0 "The court advances wages and reads the contract against the repair record."
 kehillah_bet_din.0704.outcome_3:0 "The court pays the whole holiday season."
 kehillah_bet_din.0704.fact_true:0 "The reader was ready each scheduled day; the closure alone prevented service. Full withholding denied contracted pay."
 kehillah_bet_din.0704.fact_false:0 "The reader left town for part of the season. Automatic full payment ignored missed availability."
 kehillah_bet_din.0704.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0704.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0704.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case70_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case70_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case70_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
