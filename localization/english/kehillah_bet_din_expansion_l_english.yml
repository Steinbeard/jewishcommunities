l_english:

 kehillah_din_title_10:0 "The Schoolroom Next Door"
 kehillah_din_question_10:0 "A teacher has opened a room for children beside a shared courtyard. A neighbor says pupils block her door each morning. If the lessons stop, several children have nowhere else to learn.\n\nHear the complaint now, or ask a scholar elsewhere how the court should weigh it."
 kehillah_din_letter_10:0 "[kds_asking_title.GetName] asks your opinion:\n\nA neighbor objects to the noise and traffic from a schoolroom in a shared courtyard. Closing it would leave children without a teacher. May the neighbor require the lessons to move?"
 kehillah_din_answer_10:0 "[kds_author.GetTitledFirstName] replies: The children may be taught in the courtyard. Hear where the neighbor's door is blocked, and require the teacher to keep that passage clear."
 kehillah_din_answer_careful_10:0 "[kds_author.GetTitledFirstName] replies: Bava Batra protects the teaching of children against a neighbor's objection. That does not give the teacher leave to block her doorway. Ask both parties how pupils enter, then set conditions for the room."
 kehillah_din_reply_careful_10:0 "\n\n$kehillah_din_answer_careful_10$"
 kehillah_din_reply_arrived_10:0 "\n\n$kehillah_din_answer_10$"
 kehillah_din_source_10:0 "Cite [Glossary( 'Tinokot shel beit rabban', 'KEHILLAH_DIN_QUOTE_10' )]: keep the lessons open and clear the neighbor's door."
 KEHILLAH_DIN_QUOTE_10:0 "Neighbors cannot prevent a teacher from teaching children Torah in their courtyard. (Bava Batra 21a.)"
 kehillah_din_source_10_tt:0 "Available through mastery of Bavli Nezikin, a responsum on this case or a recorded precedent. The source protects the schoolroom, though the neighbor may still object to a blocked passage."
 kehillah_din_combo_10:0 "Move the room with a judge who can find and fund another place."
 kehillah_din_combo_10_tt:0 "Available to a capable diplomat who is Compassionate or experienced in Talmudics, with a skilled steward among the other judges. The community pays to move the lessons."
 kehillah_bet_din.0101.t:0 "The Schoolroom Next Door"
 kehillah_bet_din.0101.desc:0 "[kbd_litigant_a.GetFirstName] teaches children in a room off the shared courtyard. Each morning pupils wait beside [kbd_litigant_b.GetFirstName]'s door; she says she can scarcely get through. The teacher says several children would lose their lessons if the room closed.\n\nBoth have come to ask where the children may gather."
 kehillah_bet_din.0101.a:0 "Keep the room open, but clear the neighbor's passage."
 kehillah_bet_din.0101.a.tt:0 "The presiding judge relies on Learning and Talmudics. The lessons continue, building Greatness, but the unsettled neighbor costs some Stability."
 kehillah_bet_din.0101.b:0 "Find another room at communal expense."
 kehillah_bet_din.0101.b.tt:0 "The presiding judge relies on Diplomacy. Moving the lessons costs Prosperity but preserves their contribution to Greatness."
 kehillah_bet_din.0101.c:0 "Close the schoolroom in this courtyard."
 kehillah_bet_din.0101.c.tt:0 "The presiding judge relies on Stewardship. The community avoids the cost of moving, but interrupted lessons harm Greatness."
 kehillah_bet_din.0103.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0103.desc:0 "The teacher and neighbor wait while the judges state where the children will learn."
 kehillah_bet_din.0103.outcome_1:0 "The schoolroom remains open. The teacher moves the waiting pupils away from the neighbor's door, though she doubts the crowd will stay there."
 kehillah_bet_din.0103.outcome_2:0 "The community pays for another room. The children keep their lessons, and the neighbor can use her door again."
 kehillah_bet_din.0103.outcome_3:0 "The lessons stop in this courtyard. The neighbor has her passage back; the teacher must send the children home."
 kehillah_din_case10_one_tt:0 "The schoolroom stays open. Greatness rises, while the lingering dispute slightly harms Stability."
 kehillah_din_case10_two_tt:0 "The schoolroom moves. Prosperity pays the cost, and Greatness rises."
 kehillah_din_case10_three_tt:0 "The lessons stop, harming Greatness."

 kehillah_din_title_11:0 "The Butcher's Knife"
 kehillah_din_question_11:0 "A notch has been found in the communal slaughterer's knife after meat was sold. No one can yet say when it appeared. Must every buyer discard the meat, or can the court establish which slaughterings are in doubt?"
 kehillah_din_case11_records_complete:0 "\n\nThe slaughterer has dated entries for each inspection of the knife."
 kehillah_din_case11_records_patchy:0 "\n\nSeveral inspections were never entered in the slaughterer's record."
 kehillah_din_letter_11:0 "[kds_asking_title.GetName] asks your opinion:\n\nA slaughterer's knife now has a notch. Meat from several days has already been sold, and no one knows when the edge was damaged. What should the court inspect before it orders a recall?"
 kehillah_din_answer_11:0 "[kds_author.GetTitledFirstName] replies: Examine the knife and the records of its inspection. Recall meat from the slaughterings whose knife cannot be shown to have been sound."
 kehillah_din_answer_careful_11:0 "[kds_author.GetTitledFirstName] replies: Chullin distinguishes failure to present a sound knife from a knife found flawed. Find who inspected this one and when. The court can then name the meat in doubt instead of condemning every sale without inquiry."
 kehillah_din_reply_careful_11:0 "\n\n$kehillah_din_answer_careful_11$"
 kehillah_din_reply_arrived_11:0 "\n\n$kehillah_din_answer_11$"
 kehillah_din_source_11:0 "Cite [Glossary( 'Sakino yafa', 'KEHILLAH_DIN_QUOTE_11' )]: inspect the knife and identify the affected sales."
 KEHILLAH_DIN_QUOTE_11:0 "If the knife was found sound, the slaughterer is censured; if it was found flawed, his meat is proclaimed unfit. (Chullin 17b.)"
 kehillah_din_source_11_tt:0 "Available through mastery of Bavli Kodashim, a responsum on this case or a recorded precedent. It supports a selective recall, though gaps in the inspection record weaken the argument."
 kehillah_din_combo_11:0 "Trace the sales with a judge skilled at questioning the butcher."
 kehillah_din_combo_11_tt:0 "Available to a learned judge who is Diligent or experienced in Talmudics, with a perceptive investigator among the other judges. Their joint argument strengthens the ruling."
 kehillah_bet_din.0111.t:0 "The Butcher's Knife"
 kehillah_bet_din.0111.desc:0 "[kbd_litigant_a.GetFirstName] brings a complaint against [kbd_litigant_b.GetFirstName], the communal slaughterer. A notch catches on a thread drawn across the butcher's knife. Meat from several days has already been sold. The butcher says the blade was sound when he last used it; the buyer asks the court to warn everyone.\n\nNo one has yet established when the notch appeared."
 kehillah_bet_din.0111.a:0 "Recall all the meat sold with this knife."
 kehillah_bet_din.0111.a.tt:0 "The presiding judge relies on Learning and Talmudics. A broad recall costs substantial Prosperity but restores Stability. Complete records make such a sweeping ruling harder to defend."
 kehillah_bet_din.0111.b:0 "Inspect the knife records and recall the doubtful batches."
 kehillah_bet_din.0111.b.tt:0 "The presiding judge relies on Learning. A selective recall costs some Prosperity and restores more Stability when the records are complete. Gaps also weaken the ruling."
 kehillah_bet_din.0111.c:0 "Accept the butcher's account and clear the sales."
 kehillah_bet_din.0111.c.tt:0 "The presiding judge relies on Stewardship. Keeping sales open aids Prosperity but harms Stability, especially when inspections are missing."
 kehillah_bet_din.0113.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0113.desc:0 "The butcher's customers wait to hear what the judges say about the meat."
 kehillah_bet_din.0113.outcome_1:0 "The court warns every buyer. Meat is returned or discarded, including sales made before anyone saw the notch."
 kehillah_bet_din.0113.outcome_2:0 "The judges examine the inspection record. Buyers of the doubtful batches are warned; the earlier sales remain undisturbed."
 kehillah_bet_din.0113.outcome_3:0 "The butcher continues selling. Some customers keep the meat; others will no longer buy from him."
 kehillah_din_case11_one_tt:0 "All meat sold with the knife is recalled. Prosperity bears a heavy cost, while Stability improves."
 kehillah_din_case11_two_complete_tt:0 "The dated record supports a selective recall. Prosperity bears a modest cost, while Stability improves."
 kehillah_din_case11_two_patchy_tt:0 "Gaps leave some sales in doubt after the selective recall. Prosperity bears the cost, but Stability improves little."
 kehillah_din_case11_three_complete_tt:0 "Sales remain open despite the damaged knife. Prosperity rises, while Stability suffers."
 kehillah_din_case11_three_patchy_tt:0 "Sales remain open despite the damaged knife and missing inspections. Prosperity rises, but Stability suffers badly."
 kehillah_din_case11_broad_complete_reason_tt:0 "The dated record makes a recall of every sale harder to defend."
 kehillah_din_case11_selective_patchy_reason_tt:0 "Missing inspections make a narrow recall harder to defend."

 kehillah_din_title_12:0 "The Shabbat Passage"
 kehillah_din_question_12:0 "Building work has widened the entrance to an alley used on Shabbat. Families who carried there last week now ask whether the entrance must be altered. A neighbor will not let a beam be fixed to his wall. What may the court tell them before the next Shabbat?"
 kehillah_din_letter_12:0 "[kds_asking_title.GetName] asks your opinion:\n\nAn alley entrance has been widened during repairs. Families have carried through it on Shabbat, and a neighbor refuses a fixture on his wall. What form of entrance would permit carrying, and what should they do until it is built?"
 kehillah_din_answer_12:0 "[kds_author.GetTitledFirstName] replies: Measure the opening. If it needs alteration, a proper doorway can answer the width; until then, tell the families to stop carrying through it."
 kehillah_din_answer_careful_12:0 "[kds_author.GetTitledFirstName] replies: Eruvin allows an opening wider than ten cubits if it has the form of a doorway. First measure this entrance. The neighbor's refusal concerns how it will be built, not whether the present opening may simply be assumed valid."
 kehillah_din_reply_careful_12:0 "\n\n$kehillah_din_answer_careful_12$"
 kehillah_din_reply_arrived_12:0 "\n\n$kehillah_din_answer_12$"
 kehillah_din_source_12:0 "Cite [Glossary( 'Tzurat hapetach', 'KEHILLAH_DIN_QUOTE_12' )]: measure the opening and build a proper doorway."
 KEHILLAH_DIN_QUOTE_12:0 "If an alley entrance has the form of a doorway, it need not be narrowed even when wider than ten cubits. (Mishnah Eruvin 1:1.)"
 kehillah_din_source_12_tt:0 "Available through mastery of Bavli Moed, a responsum on this case or a recorded precedent. It supports building a proper doorway at communal expense."
 kehillah_din_combo_12:0 "Arrange another route while a judge negotiates the work."
 kehillah_din_combo_12_tt:0 "Available to a capable diplomat who is Patient or experienced in Talmudics, with a skilled steward among the other judges. Carrying through this entrance stops for now."
 kehillah_bet_din.0121.t:0 "The Shabbat Passage"
 kehillah_bet_din.0121.desc:0 "The repaired alley is wider than it was. [kbd_litigant_a.GetFirstName] says the families have carried food through it on Shabbat for years. [kbd_litigant_b.GetFirstName], whose wall borders the entrance, will not accept a beam fixed to the stone.\n\nAnother Shabbat approaches. The judges must settle what the families can use and who will alter the opening."
 kehillah_bet_din.0121.a:0 "Measure the entrance and pay for a proper doorway."
 kehillah_bet_din.0121.a.tt:0 "The presiding judge relies on Learning and Talmudics. A doorway costs Prosperity and restores Stability."
 kehillah_bet_din.0121.b:0 "Stop carrying there until a new entrance is agreed."
 kehillah_bet_din.0121.b.tt:0 "The presiding judge relies on Diplomacy. The temporary restriction harms Stability but modestly strengthens Greatness."
 kehillah_bet_din.0121.c:0 "Let the families use the alley as before."
 kehillah_bet_din.0121.c.tt:0 "The presiding judge relies on Stewardship. Uninterrupted passage aids Prosperity, but the unresolved objection badly harms Stability."
 kehillah_bet_din.0123.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0123.desc:0 "The households wait at the alley entrance for the judges' instruction."
 kehillah_bet_din.0123.outcome_1:0 "The opening is measured and a doorway is built at communal expense. The families can carry through it again."
 kehillah_bet_din.0123.outcome_2:0 "The families stop carrying through this entrance. The court seeks another route while the neighbor and builders discuss a fixture."
 kehillah_bet_din.0123.outcome_3:0 "The families keep using the alley. The changed entrance and the neighbor's objection remain unresolved."
 kehillah_din_case12_one_tt:0 "A doorway is built. Prosperity pays the cost, while Stability improves."
 kehillah_din_case12_two_tt:0 "Carrying stops here for now. Stability suffers, while Greatness improves slightly."
 kehillah_din_case12_three_tt:0 "The alley is used without alteration. Prosperity rises, but Stability suffers badly."

 kehillah_din_title_13:0 "The Marked Purse"
 kehillah_din_question_13:0 "A merchant found a purse at the market. A traveler names the stitching on its lining, but the merchant says anyone who saw him open it could make that claim. What must the court establish before it gives the purse away?"
 kehillah_din_case13_witness_heard:0 "\n\nA witness says the traveler named the stitching before the finder showed the purse to anyone."
 kehillah_din_case13_witness_uncertain:0 "\n\nNo witness can say whether the traveler named the stitching before or after the purse was shown."
 kehillah_din_letter_13:0 "[kds_asking_title.GetName] asks your opinion:\n\nA merchant found a purse. A traveler describes stitching inside it, which may identify the owner; the merchant says others could have seen the mark. What should the court ask before ordering its return?"
 kehillah_din_answer_13:0 "[kds_author.GetTitledFirstName] replies: Have the traveler describe the mark before the purse is opened in court. The finder should not lose it on a claim anyone could repeat."
 kehillah_din_answer_careful_13:0 "[kds_author.GetTitledFirstName] replies: The Mishnah distinguishes ordinary finds from objects bearing a distinguishing mark. Ask the claimant for details the finder has not disclosed, then inspect the purse before deciding ownership."
 kehillah_din_reply_careful_13:0 "\n\n$kehillah_din_answer_careful_13$"
 kehillah_din_reply_arrived_13:0 "\n\n$kehillah_din_answer_13$"
 kehillah_din_source_13:0 "Cite [Glossary( 'Yesh bo siman', 'KEHILLAH_DIN_QUOTE_13' )]: test the mark before returning the purse."
 KEHILLAH_DIN_QUOTE_13:0 "If a found loaf contains coins placed inside it, the finder must announce the find. (Mishnah Bava Metzia 2:2.)"
 kehillah_din_source_13_tt:0 "Available through mastery of Mishnah, a responsum on this case or a recorded precedent. It supports examining the hidden mark before awarding the purse."
 kehillah_din_combo_13:0 "Examine the traveler's account with a judge who knows the market."
 kehillah_din_combo_13_tt:0 "Available to a perceptive judge who is Just or experienced in Talmudics, with a learned colleague among the other judges. Their joint argument strengthens the ruling."
 kehillah_bet_din.0131.t:0 "The Marked Purse"
 kehillah_bet_din.0131.desc:0 "[kbd_litigant_a.GetFirstName], a traveler, claims a purse [kbd_litigant_b.GetFirstName] found in the market. The traveler describes a line of stitching inside its lining. The finder says the purse was open when people gathered round him.\n\nThe purse lies unopened before the judges. Both ask whose word will settle its ownership."
 kehillah_bet_din.0131.a:0 "Return it on the traveler's description."
 kehillah_bet_din.0131.a.tt:0 "The presiding judge relies on Learning and Talmudics. Returning the purse strengthens Greatness and, with a witness, Stability. Without one, the ruling is harder to defend."
 kehillah_bet_din.0131.b:0 "Test the hidden mark before naming an owner."
 kehillah_bet_din.0131.b.tt:0 "The presiding judge relies on Intrigue. Examining the mark costs some Prosperity but strengthens Stability and Greatness."
 kehillah_bet_din.0131.c:0 "Leave the purse with the finder."
 kehillah_bet_din.0131.c.tt:0 "The presiding judge relies on Stewardship. Without a witness, leaving the purse with its finder slightly aids Stability. With one, it harms Stability and weakens the ruling."
 kehillah_bet_din.0133.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0133.desc:0 "The purse is still closed as the judges deliver their ruling."
 kehillah_bet_din.0133.outcome_1:0 "The finder hands over the purse on the traveler's description. He insists that anyone nearby could have repeated it."
 kehillah_bet_din.0133.outcome_2:0 "The traveler gives the details before the purse is opened. The judges compare the stitching and award the purse after hearing both accounts."
 kehillah_bet_din.0133.outcome_3:0 "The finder keeps the purse. The traveler leaves saying he was never allowed to prove the mark."
 kehillah_din_case13_one_witness_tt:0 "The witness supports the traveler's claim. Stability and Greatness improve."
 kehillah_din_case13_one_uncertain_tt:0 "The court returns the purse without independent testimony. Stability and Greatness improve slightly."
 kehillah_din_case13_two_tt:0 "The mark is tested before the purse is awarded. Prosperity pays a small cost, while Stability and Greatness improve."
 kehillah_din_case13_three_witness_tt:0 "The finder keeps the purse despite a witness's account, harming Stability."
 kehillah_din_case13_three_uncertain_tt:0 "The finder keeps the purse without independent testimony for the claim, slightly aiding Stability."
 kehillah_din_case13_return_uncertain_reason_tt:0 "No witness can establish when the mark was named, weakening the ruling."
 kehillah_din_case13_keep_witness_reason_tt:0 "A witness supports the traveler's claim, weakening a ruling that leaves the purse with its finder."

 kehillah_din_well_reasoned_opinion:0 "Heard a Careful Ruling"
 kehillah_din_workable_hearing_opinion:0 "Heard a Workable Ruling"
 kehillah_din_poor_hearing_opinion:0 "Unpersuaded by the Court"

