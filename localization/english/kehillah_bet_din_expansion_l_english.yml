 kehillah_din_title_14:0 "The Goose on the Driftwood"
 kehillah_din_question_14:0 "A merchant has brought unfamiliar geese from the northern sea. Sailors insist that the birds grow from shells on driftwood; the communal slaughterer refuses to certify them. Are they permitted fowl, forbidden creeping creatures, or must the court first investigate the story?"
 kehillah_din_letter_14:0 "[kds_asking_title.GetName] asks your opinion:\n\nA merchant offers unfamiliar geese from the northern sea. Sailors say the birds grow from shells fixed to driftwood, and the slaughterer therefore doubts whether they are fowl at all. How should the court determine their kashrut?"
 kehillah_din_answer_14:0 "[kds_author.GetTitledFirstName] replies: Judge the creatures by the signs of birds that can be examined. If they are permitted fowl, they still require proper shechita; a sailor's marvel does not make slaughter unnecessary."
 kehillah_din_answer_careful_14:0 "[kds_author.GetTitledFirstName] replies: Chullin gives bodily and behavioral signs for permitted birds. Examine the living creatures and hear witnesses separately. If the birds bear the permitted signs, the strange account of their birth does not excuse them from shechita."
 kehillah_din_reply_careful_14:0 "\n\n$kehillah_din_answer_careful_14$"
 kehillah_din_reply_arrived_14:0 "\n\n$kehillah_din_answer_14$"
 kehillah_din_source_14:0 "Cite [Glossary( 'Simanei ha-of', 'KEHILLAH_DIN_QUOTE_14' )]: treat the creature before the court as fowl, and require shechita."
 KEHILLAH_DIN_QUOTE_14:0 "A bird that claws its prey is impure; one with an extra digit, a crop, and a peelable gizzard is pure. (Mishnah Chullin 3:6.)"
 kehillah_din_source_14_tt:0 "Available through mastery of Bavli Kodashim, a responsum on this case or a recorded precedent. It supports permitting the birds after shechita."
 kehillah_din_combo_14:0 "Keep the birds alive while a patient scholar tests the sailors' story."
 kehillah_din_combo_14_tt:0 "Available to a learned judge who is Patient or experienced in Talmudics, with a perceptive investigator among the other judges. The investigation is costly but strengthens the court."

 kehillah_bet_din.0141.t:0 "The Goose on the Driftwood"
 kehillah_bet_din.0141.desc:0 "[kbd_litigant_a.GetFirstName], a merchant newly returned from the northern sea, has brought two black-and-white geese before the court. He says sailors found them among shells fixed to floating timber and swear that such birds grow there without eggs.\n\n[kbd_litigant_b.GetFirstName], the communal slaughterer, refuses the merchant's order. If the tale is true, the butcher argues, perhaps these are creeping things from the water rather than birds. The living geese hiss from their wicker cage while both demand a ruling."
 kehillah_bet_din.0141.a:0 "Treat them as fowl, and require proper shechita."
 kehillah_bet_din.0141.a.tt:0 "The presiding judge relies on Learning and Talmudics. Selling the birds aids Prosperity, but unfamiliar meat slightly harms Stability."
 kehillah_bet_din.0141.b:0 "Forbid them as creatures grown from shell and timber."
 kehillah_bet_din.0141.b.tt:0 "The presiding judge relies on Learning. Refusing the cargo costs Prosperity but strengthens Stability."
 kehillah_bet_din.0141.c:0 "Keep them alive until witnesses and birds can be examined."
 kehillah_bet_din.0141.c.tt:0 "The presiding judge relies on Intrigue. Investigation costs Prosperity but strengthens Stability and Greatness."
 kehillah_bet_din.0143.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0143.desc:0 "The merchant and slaughterer wait beside the cage as the judges decide what these creatures are for purposes of kashrut."
 kehillah_bet_din.0143.outcome_1:0 "The court classifies the creatures as fowl and requires shechita before any meat is sold. The merchant smiles; the slaughterer accepts the order, though some neighbors still eye the strange geese warily."
 kehillah_bet_din.0143.outcome_2:0 "The court forbids the birds. Whether they came from eggs, shells, or rotting timber, none from this cargo will reach a Jewish table."
 kehillah_bet_din.0143.outcome_3:0 "The birds remain alive under communal care. Scholars inspect their feet, crop, and manner of feeding while the sailors are questioned apart from one another."
