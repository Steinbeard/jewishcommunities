l_english:
 kehillah_survey_sefer_ambitions_decision:0 "Survey Lasting Works"
 kehillah_survey_sefer_ambitions_decision_desc:0 "Look over the unwritten works that your learning might yet bring into the world. Each ambition has a scholarly path; a historical author may have a shorter one."
 kehillah_survey_sefer_ambitions_decision_tooltip:0 "Review the requirements for named works that can enter the Sefarim Ledger."
 kehillah_survey_sefer_ambitions_decision_confirm:0 "Review ambitions"
 kehillah_book_ambition.0001.t:0 "Works Yet Unwritten"
 kehillah_book_ambition.0001.desc:0 "A lasting work begins in study, but no name on these pages is reserved for its historical author. A scholar who meets the requirements may write it. Authors remembered by history sometimes have a shorter path. All these ambitions require a Rabbanite rite and the Rabbi trait. Once a work is written, it leaves this list."
 kehillah_book_ambition.0001.a:0 "Commentary on Scripture"
 kehillah_book_ambition.0001.b:0 "Talmud and Law"
 kehillah_book_ambition.0001.c:0 "Thought and Devotion"
 kehillah_book_ambition.category_desc:0 "These unwritten works are within the reach of a sufficiently learned scholar. Hover over a title to see its requirements and whether you can begin it now. Choose #EMP Write a Sefer#! when you are ready."
 kehillah_book_ambition.0002.t:0 "Commentary on Scripture"
 kehillah_book_ambition.0003.t:0 "Talmud and Law"
 kehillah_book_ambition.0004.t:0 "Thought and Devotion"
 kehillah_book_ambition.close:0 "Return to my studies."
 kehillah_book_ambition.ready:0 "#P Ready:#! this ambition will be offered when you begin writing."
 kehillah_book_ambition.not_ready:0 "#N Not yet ready:#! continue the studies above."
 kehillah_book_ambition.rashi_torah:0 "$kehillah_lib_name_work_rashi_torah$"
 kehillah_book_ambition.rashi_torah.tt:0 "Master the Torah. Rashi needs 30 Parshanut experience; another scholar needs 14 Learning, 60 Parshanut, Targum Onkelos, and either Genesis Rabbah or the Mekhilta mastered."
 kehillah_book_ambition.rashi_talmud:0 "$kehillah_lib_name_work_rashi_talmud$"
 kehillah_book_ambition.rashi_talmud.tt:0 "Rashi needs mastery of two Bavli orders. Another scholar needs 15 Learning, 60 Talmudics experience, and mastery of four Bavli orders."
 kehillah_book_ambition.rif:0 "$kehillah_lib_name_work_hilkhot_harif$"
 kehillah_book_ambition.rif.tt:0 "The Rif needs mastery of three Bavli orders. Another scholar needs 16 Learning, 70 Talmudics experience, the whole Shas mastered, and Halakhot Gedolot mastered."
 kehillah_book_ambition.tosafot:0 "$kehillah_lib_name_work_tosafot$"
 kehillah_book_ambition.tosafot.tt:0 "First, Rashi's Talmud commentary must be written and mastered. Isaac of Dampierre then needs three Bavli orders mastered; another scholar needs 16 Learning, 70 Talmudics experience, and four Bavli orders mastered."
 kehillah_book_ambition.mishneh_torah:0 "$kehillah_lib_name_work_mishneh_torah$"
 kehillah_book_ambition.mishneh_torah.tt:0 "Master the whole Shas. Maimonides can then write it; another scholar needs 18 Learning, 80 Talmudics experience, the Mishnah, and two Yerushalmi orders mastered."
 kehillah_book_ambition.kuzari:0 "$kehillah_lib_name_work_kuzari$"
 kehillah_book_ambition.kuzari.tt:0 "Any qualified scholar, including Judah Halevi if he enters play: 14 Learning, Emunot ve-Deot mastered, 50 Hashkafa experience, and either the Poet trait or 75 Hashkafa experience."
 kehillah_book_ambition.moreh:0 "$kehillah_lib_name_work_moreh_nevukhim$"
 kehillah_book_ambition.moreh.tt:0 "Master Emunot ve-Deot. Maimonides can then write it; another scholar needs 18 Learning, 80 Hashkafa experience, and knowledge of Hokhmah."
 kehillah_book_ambition.bahir:0 "$kehillah_lib_name_work_sefer_habahir$"
 kehillah_book_ambition.bahir.tt:0 "Gain 50 Hashkafa experience, master Sefer Yetzirah and Hekhalot Rabbati, and know Esotericism."
 kehillah_book_ambition.hasidim:0 "$kehillah_lib_name_work_sefer_hasidim$"
 kehillah_book_ambition.hasidim.tt:0 "Gain 50 Hashkafa experience, master Chovot ha-Levavot, and be Ashkenazi or belong to a rite with monogamy."
 kehillah_book_ambition.zohar:0 "$kehillah_lib_name_work_zohar$"
 kehillah_book_ambition.zohar.tt:0 "Reach 16 Learning and 80 Hashkafa experience, and master Sefer ha-Bahir and Sefer Yetzirah."
