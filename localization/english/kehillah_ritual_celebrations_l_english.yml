 tenet_moadim_lesimcha_name:0 "Mo'adim le-Simchah"
 tenet_moadim_lesimcha_historical_glossary:0 "Mo'adim le-Simchah"
 tenet_moadim_lesimcha_desc:0 "The appointed festivals gather households and neighbors to remember, eat, and rejoice together. Their observance brings more Jewish holiday moments during the year; an ordinary feast hosted by a Jewish follower can bring extra Piety and goodwill from attending close family."
