l_english:
 tenet_moadim_lesimcha_name:0 "Mo'adim le-Simchah"
 tenet_moadim_lesimcha_historical_glossary:0 "[Glossary('Mo’adim le-Simchah','tenet_moadim_lesimcha_historical_glossary_text')]"
 tenet_moadim_lesimcha_historical_glossary_text:0 "Mo'adim le-Simchah\n\nThe mo'adim, the appointed times, are days set apart for remembrance, prayer, rest, hospitality, and rejoicing before God. Their meals, blessings, and gatherings draw household and congregation into a common rhythm of sacred time.\n\nFestival joy is not private abundance. It calls for kin, guests, and those with little to share in the table, so that memory of God's gifts becomes care for one's neighbors. Across the year, the festivals renew the covenant and carry it into the life of the community."
 tenet_moadim_lesimcha_desc:0 "The appointed festivals make sacred time part of the life of household and congregation. Through prayer, rest, shared meals, and hospitality, the community recalls God's gifts and rejoices before God."
 tenet_ritual_celebrations_historical_glossary:0 "[Glossary('Ritual Celebrations','tenet_ritual_celebrations_historical_glossary_text')]"
 tenet_ritual_celebrations_historical_glossary_text:0 "Ritual Celebrations\n\nSet-apart days of worship, shared meals, and public rejoicing bind a religious community together. They mark sacred time, renew inherited memory, and make room for hospitality."
