l_english:
 kehillah_bet_din.0551.t:0 "The Rival Charitable Societies"
 kehillah_bet_din.0551.desc:0 "[kbd_litigant_a.GetFirstName] speaks for one burial society claiming an endowed cemetery fund. [kbd_litigant_b.GetFirstName] speaks for a rival society formed after a split. Both have buried members this year. The endowment may belong to one society or to the cemetery itself; graves cannot wait for a quarrel over the chest."
 kehillah_bet_din.0551.a:0 "Give the first society full control."
 kehillah_bet_din.0551.a.tt:0 "One committee can act quickly, but a common deed would deny the rival its share."
 kehillah_bet_din.0551.b:0 "Pay current burials and inspect the endowment deed."
 kehillah_bet_din.0551.b.tt:0 "Burials continue while the court pays for a deed review."
 kehillah_bet_din.0551.c:0 "Give the rival society full control."
 kehillah_bet_din.0551.c.tt:0 "The rival gains control, but a deed naming the first society could be ignored."
 kehillah_din_source_55:0 "Cite a mastered Zeraim work and read the endowment's purpose."
 kehillah_din_source_55_tt:0 "Mishnah Peah 8:8 informs the discussion of charitable eligibility. It does not name this fund's trustee."
 kehillah_din_combo_55:0 "Have a scholar and steward pay burials while examining the deed."
 kehillah_din_combo_55_tt:0 "The judges separate immediate funeral needs from permanent control."
 kehillah_bet_din.0554.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0554.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0554.outcome_1:0 "The court gives the chest to the first society."
 kehillah_bet_din.0554.outcome_2:0 "The court pays current burial costs and seeks the original endowment deed."
 kehillah_bet_din.0554.outcome_3:0 "The court gives the chest to the rival society."
 kehillah_bet_din.0554.fact_true:0 "The deed gives the fund to the cemetery, not either society alone. Sole control divided a common gift."
 kehillah_bet_din.0554.fact_false:0 "The deed names the first society as trustee. Transferring it to the rival ignored that duty."
 kehillah_bet_din.0554.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0554.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0554.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case55_one_tt:0 "Exclusive control risks substantial Stability."
 kehillah_din_case55_two_tt:0 "Burials and inquiry cost some Stability."
 kehillah_din_case55_three_tt:0 "A transfer costs less now but may break a donor's terms."
 kehillah_bet_din_case55_great_log_title:0 "The Rival Charitable Societies: a well-supported ruling"
 kehillah_bet_din_case55_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s cemetery fund."
 kehillah_bet_din_case55_good_log_title:0 "The Rival Charitable Societies: a workable ruling"
 kehillah_bet_din_case55_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s cemetery fund."
 kehillah_bet_din_case55_poor_log_title:0 "The Rival Charitable Societies: a disputed ruling"
 kehillah_bet_din_case55_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s cemetery fund."
