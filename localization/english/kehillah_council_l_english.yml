l_english:

 # Kehillah council (docs/spec/v26-kehillah-council-and-baalei-batim.md).
 # Vanilla seats, renamed for Kehillot via triggered names in
 # common/council_positions/kehillah_vanilla_council_overrides.txt.

 kehillah_council_shtadlan:0 "Shtadlan"
 kehillah_council_shtadlan_possessive:0 "Shtadlan's"
 kehillah_council_shtadlan_tooltip:0 "#T Shtadlan#!\nThe community's intercessor with the powerful. Pleads its case before the host ruler."

 kehillah_council_gabbai:0 "Gabbai"
 kehillah_council_gabbai_possessive:0 "Gabbai's"
 kehillah_council_gabbai_tooltip:0 "#T Gabbai#!\nThe communal treasurer. Raises the community's revenue and oversees its building works."

 kehillah_council_rosh_hashmirah:0 "Rosh ha-Shmirah"
 kehillah_council_rosh_hashmirah_possessive:0 "Rosh ha-Shmirah's"
 kehillah_council_rosh_hashmirah_tooltip:0 "#T Rosh ha-Shmirah#!\nHead of the community's watch. Keeps the gates of the quarter and the night watch."

 kehillah_council_neeman:0 "Ne'eman"
 kehillah_council_neeman_possessive:0 "Ne'eman's"
 kehillah_council_neeman_female:0 "Ne'emanah"
 kehillah_council_neeman_female_possessive:0 "Ne'emanah's"
 kehillah_council_neeman_tooltip:0 "#T Ne'eman#!\nThe trustee, keeper of the communal pinkas. Knows who owes what to whom, and who is plotting what."

 kehillah_council_dayyan:0 "Dayyan"
 kehillah_council_dayyan_possessive:0 "Dayyan's"
 kehillah_council_dayyan_tooltip:0 "#T Dayyan#!\nA judge of the community's bet din. Must be a rabbi."
 kehillah_dayyan_must_be_rabbi:0 "Is a [GetTrait('kehillah_rabbi_trait').GetName( GetNullCharacter )]"
 # The "New Realm Priest" notice (KehillahRealmPriestMsg*). The _vanilla keys
 # are vanilla's own text, with ROOT.Char standing in for LEFT_CHARACTER.
 kehillah_dayyan_msg_title:0 "New Dayyan"
 kehillah_dayyan_msg_approve:0 "Your Dayyan, [ROOT.Char.GetShortUIName|U], takes his seat on the Bet Din with your blessing"
 kehillah_dayyan_msg_disapprove:0 "Your Dayyan, [ROOT.Char.GetShortUIName|U], takes his seat on the Bet Din, but without warmth toward you"
 kehillah_realm_priest_msg_title_vanilla:0 "New $game_concept_realm_priest$"
 kehillah_realm_priest_msg_approve_vanilla:0 "Your [realm_priest|E], [ROOT.Char.GetShortUIName|U], endorses you #weak ([church_property|E])#!"
 kehillah_realm_priest_msg_disapprove_vanilla:0 "Your [realm_priest|E], [ROOT.Char.GetShortUIName|U], does not endorse you #weak ([church_property|E])#!"

 # --- Tasks (wave 1)

 task_kehillah_petition_host:0 "Petition the Host"
 task_kehillah_petition_host_desc:0 "The Shtadlan waits on the host ruler and the court's officials, pleading the community's cause."
 task_kehillah_petition_host_effect_desc:0 "The host ruler's opinion of you improves while the petitioning continues.\nEach month, there is a #P [SCOPE.ScriptValue('kehillah_council_petition_chance_display_value')|1]%#! chance that the host raises the status of the Jews in his realm. A friendly host is easier to persuade.\n\nOnce a year, there is also a #P [SCOPE.ScriptValue('kehillah_audience_yearly_chance_value')|0]%#! chance that the Shtadlan improves the host's outlook on the Jews.\n#weak Diplomacy helps against the resistance of rank, religious teaching and Zeal. Each lord grants only one such audience in a year.#!"
 task_kehillah_seek_invitation:0 "Seek an Invitation"
 task_kehillah_seek_invitation_desc:0 "The Shtadlan travels to the court of a lord within reach whose realm does not yet welcome Jewish settlers, and argues the case for inviting them."
 task_kehillah_seek_invitation_effect_desc:0 "Courts the most receptive lord within reach whose realm does not yet favor the Jews.\nEach month, there is a #P [SCOPE.ScriptValue('kehillah_council_petition_chance_display_value')|1]%#! chance of an audience. If the embassy carries the argument, the lord raises the status of the Jews in his realm. If not, that court will refuse another petition for some time."
 kehillah_shtadlan_petition_opinion:0 "Petitioned by the Shtadlan"

 task_kehillah_raise_revenue:0 "Raise Communal Revenue"
 task_kehillah_raise_revenue_desc:0 "The Gabbai collects the communal levies, fees and pledges, and keeps the chest full."
 task_kehillah_raise_revenue_effect_desc:0 "Jewish Quarter income: #P +[SCOPE.ScriptValue('kehillah_council_revenue_pct_value')]%#!\n#weak Better [stewardship|E] improves the collection.#!"
 task_kehillah_raise_revenue_modifier:0 "Gabbai: Raising Communal Revenue"

 task_kehillah_oversee_construction:0 "Oversee Construction"
 task_kehillah_oversee_construction_desc:0 "The Gabbai haggles with the builders and keeps the works on schedule."
 task_kehillah_oversee_construction_effect_desc:0 "Jewish Quarter building costs: #P -[SCOPE.ScriptValue('kehillah_council_construction_pct_value')]%#!\nBuilding speed: #P +[SCOPE.ScriptValue('kehillah_council_construction_pct_value')]%#!\n#weak Better [stewardship|E] improves both effects.#!"
 task_kehillah_oversee_construction_modifier:0 "Gabbai: Overseeing Construction"

 task_kehillah_night_watch:0 "Keep the Night Watch"
 task_kehillah_night_watch_desc:0 "The Rosh ha-Shmirah posts watchmen at the gates of the quarter through the night."
 task_kehillah_night_watch_effect_desc:0 "Threats against the community come #P [SCOPE.ScriptValue('kehillah_council_night_watch_pct_value')]%#! less often. When one does come, the watch answers it with this councillor's [martial|E]."

 task_kehillah_prepare_bet_din:0 "Prepare the Bet Din"
 task_kehillah_prepare_bet_din_desc:0 "The Dayyan gathers the cases, consults the other judges and readies the court to sit."
 task_kehillah_learned_exchange:0 "A Learned Exchange"
 task_kehillah_learned_exchange_desc:0 "The Dayyan sits with the clergy of the county's faith: they ask him about the Hebrew of their scriptures, and he answers them, and they learn to see the Jews as neighbours."
 task_kehillah_learned_exchange_effect_desc:0 "Each year, there is a #P [SCOPE.ScriptValue('kehillah_exchange_yearly_chance_value')|0]%#! chance that the clergy listen. Success eases religious tension, quiets recent incidents and builds goodwill.\n#weak [learning|E] helps against hostile teaching and the fervor of a great holy war. A faith can absorb only so much goodwill in one year.#!"
 task_kehillah_prepare_bet_din_effect_desc:0 "The next Bet Din Conference can be called #P [SCOPE.ScriptValue('kehillah_council_bet_din_months_saved_value')] months#! sooner.\n#weak Better [learning|E] hastens the preparations.#!"

 # --- Spouse tasks: vanilla's six, renamed (identical mechanics)

 task_kehillah_assist_parnas:0 "Assist the Parnas"
 task_kehillah_assist_parnas_desc:0 "Your spouse helps you carry the community's burdens."
 task_kehillah_open_house:0 "Keep an Open House"
 task_kehillah_open_house_desc:0 "Your spouse keeps the household's table open to guests and travellers, practicing hachnasat orchim and earning the goodwill that comes with it."
 task_kehillah_guard_household:0 "Guard the Household"
 task_kehillah_guard_household_desc:0 "Your spouse sees to the household's safety and keeps its doors barred at the right hours."
 task_kehillah_family_business:0 "Run the Family Business"
 task_kehillah_family_business_desc:0 "Your spouse manages the household's trade and lending, as many Jewish wives of the period did."
 task_kehillah_market_talk:0 "Hear the Talk of the Market"
 task_kehillah_market_talk_desc:0 "Your spouse listens at the market stalls and the well, and learns what people say."
 task_kehillah_support_scholars:0 "Support the Scholars"
 task_kehillah_support_scholars_desc:0 "Your spouse sustains the students of the beit midrash and the scholars who pass through."
