l_english:

 # Kehillah council (docs/spec/v26-kehillah-council-and-baalei-batim.md).
 # Vanilla seats, renamed for Kehillot via triggered names in
 # common/council_positions/kehillah_vanilla_council_overrides.txt.

 kehillah_council_shtadlan:0 "Shtadlan"
 kehillah_council_shtadlan_possessive:0 "Shtadlan's"
 kehillah_council_shtadlan_tooltip:0 "#T Shtadlan#!\nThe community's intercessor with the powerful. Pleads its case before the host ruler."

 kehillah_council_gabbai:0 "Gabbai"
 kehillah_council_gabbai_possessive:0 "Gabbai's"
 kehillah_council_gabbai_tooltip:0 "#T Gabbai#!\nThe communal treasurer. Raises the community's revenue and oversees its building works."

 kehillah_council_rosh_hashmirah:0 "Rosh ha-Shmirah"
 kehillah_council_rosh_hashmirah_possessive:0 "Rosh ha-Shmirah's"
 kehillah_council_rosh_hashmirah_tooltip:0 "#T Rosh ha-Shmirah#!\nHead of the community's watch. Keeps the gates of the quarter and the night watch."

 kehillah_council_neeman:0 "Ne'eman"
 kehillah_council_neeman_possessive:0 "Ne'eman's"
 kehillah_council_neeman_female:0 "Ne'emanah"
 kehillah_council_neeman_female_possessive:0 "Ne'emanah's"
 kehillah_council_neeman_tooltip:0 "#T Ne'eman#!\nThe trustee, keeper of the communal pinkas. Knows who owes what to whom, and who is plotting what."

 kehillah_council_dayyan:0 "Dayyan"
 kehillah_council_dayyan_possessive:0 "Dayyan's"
 kehillah_council_dayyan_tooltip:0 "#T Dayyan#!\nA judge of the community's bet din. Must be a rabbi."
 kehillah_dayyan_must_be_rabbi:0 "Is an ordained [GetTrait('kehillah_rabbi_trait').GetName( GetNullCharacter )], or a Karaite"
 # The "New Realm Priest" notice (KehillahRealmPriestMsg*). The _vanilla keys
 # are vanilla's own text, with ROOT.Char standing in for LEFT_CHARACTER.
 kehillah_dayyan_msg_title:0 "New Dayyan"
 kehillah_dayyan_msg_approve:0 "Your Dayyan, [ROOT.Char.GetShortUIName|U], takes his seat on the Bet Din with your blessing"
 kehillah_dayyan_msg_disapprove:0 "Your Dayyan, [ROOT.Char.GetShortUIName|U], takes his seat on the Bet Din, but without warmth toward you"
 kehillah_realm_priest_msg_title_vanilla:0 "New $game_concept_realm_priest$"
 kehillah_realm_priest_msg_approve_vanilla:0 "Your [realm_priest|E], [ROOT.Char.GetShortUIName|U], endorses you #weak ([church_property|E])#!"
 kehillah_realm_priest_msg_disapprove_vanilla:0 "Your [realm_priest|E], [ROOT.Char.GetShortUIName|U], does not endorse you #weak ([church_property|E])#!"

 # --- Tasks (wave 1)

 task_kehillah_petition_host:0 "Petition the Host"
 task_kehillah_seek_religious_support:0 "Seek Religious Support"
 task_kehillah_seek_religious_support_effect_desc:0 "Each month, there is a [SCOPE.ScriptValue('kehillah_safety_religious_support_monthly_chance_value')|1]% chance that the host's religious adviser publicly urges restraint. This lowers incident danger by 8 for two years. A new assurance cannot be secured while one is in force."
 kehillah_safety_cleric_agrees_t:0 "A Call for Restraint"
 kehillah_safety_cleric_agrees_d:0 "The ruler's religious adviser has urged the town to leave the Jewish quarter in peace. The assurance will hold for two years, unless events overtake it."
 task_kehillah_petition_host_desc:0 "The Shtadlan waits on the host ruler and the court's officials, pleading the community's cause."
 task_kehillah_petition_host_effect_desc:0 "The host ruler's opinion of you improves while the petitioning continues.\nEach month, there is a #P [SCOPE.ScriptValue('kehillah_council_petition_chance_display_value')|1]%#! chance that the host raises the status of the Jews in his realm. A friendly host is easier to persuade.\n\nOnce a year, there is also a #P [SCOPE.ScriptValue('kehillah_audience_yearly_chance_value')|0]%#! chance that the Shtadlan improves the host's outlook on the Jews.\n#weak Diplomacy helps against the resistance of rank, religious teaching and Zeal. Each lord grants only one such audience in a year.#!"
 task_kehillah_seek_invitation:0 "Seek an Invitation"
 task_kehillah_seek_invitation_desc:0 "The Shtadlan travels to the court of a lord within reach whose realm does not yet welcome Jewish settlers, and argues the case for inviting them."
 task_kehillah_seek_invitation_effect_desc:0 "Courts the most receptive lord within reach whose realm does not yet favor the Jews.\nEach month, there is a #P [SCOPE.ScriptValue('kehillah_council_petition_chance_display_value')|1]%#! chance of an audience. If the embassy carries the argument, the lord raises the status of the Jews in his realm. If not, that court will refuse another petition for some time."
 kehillah_shtadlan_petition_opinion:0 "Petitioned by the Shtadlan"

 task_kehillah_raise_revenue:0 "Raise Communal Revenue"
 task_kehillah_raise_revenue_desc:0 "The Gabbai collects the communal levies, fees and pledges, and keeps the chest full."
 task_kehillah_raise_revenue_effect_desc:0 "Jewish Quarter income: #P +[SCOPE.ScriptValue('kehillah_council_revenue_pct_value')]%#!\n#weak Better [stewardship|E] improves the collection.#!"
 task_kehillah_raise_revenue_modifier:0 "Gabbai: Raising Communal Revenue"

 task_kehillah_oversee_construction:0 "Oversee Construction"
 task_kehillah_oversee_construction_desc:0 "The Gabbai haggles with the builders and keeps the works on schedule."
 task_kehillah_oversee_construction_effect_desc:0 "Jewish Quarter building costs: #P -[SCOPE.ScriptValue('kehillah_council_construction_pct_value')]%#!\nBuilding speed: #P +[SCOPE.ScriptValue('kehillah_council_construction_pct_value')]%#!\n#weak Better [stewardship|E] improves both effects.#!"
 task_kehillah_oversee_construction_modifier:0 "Gabbai: Overseeing Construction"

 task_kehillah_night_watch:0 "Defend the Quarter"
 task_kehillah_night_watch_desc:0 "The Rosh ha-Shmirah posts watchmen at the quarter's gates from dusk, and readies its defense if a mob ever comes."
 task_kehillah_night_watch_effect_desc:0 "Threats against the community come #P [SCOPE.ScriptValue('kehillah_council_night_watch_pct_value')]%#! less often. When one does come, the watch answers it with this councillor's [martial|E]."

 task_kehillah_prepare_bet_din:0 "Prepare the Bet Din"
 task_kehillah_prepare_bet_din_desc:0 "The Dayyan gathers the cases, consults the other judges and readies the court to sit."
 task_kehillah_learned_exchange:0 "A Learned Exchange"
 task_kehillah_learned_exchange_desc:0 "The Dayyan sits with the clergy of the county's faith: they ask him about the Hebrew of their scriptures, and he answers them, and they learn to see the Jews as neighbors."
 task_kehillah_learned_exchange_effect_desc:0 "Each year, there is a #P [SCOPE.ScriptValue('kehillah_exchange_yearly_chance_value')|0]%#! chance that the clergy listen. Success eases religious tension, quiets recent incidents and builds goodwill.\n#weak [learning|E] helps against hostile teaching and the fervor of a great holy war. A faith can absorb only so much goodwill in one year.#!"
 task_kehillah_prepare_bet_din_effect_desc:0 "The next Bet Din Conference can be called #P [SCOPE.ScriptValue('kehillah_council_bet_din_months_saved_value')] months#! sooner.\n#weak Better [learning|E] hastens the preparations.#!"

 # --- Spouse tasks: vanilla's six, renamed (identical mechanics)

 task_kehillah_assist_parnas:0 "Assist the Parnas"
 task_kehillah_assist_parnas_desc:0 "Your spouse helps you carry the community's burdens."
 task_kehillah_open_house:0 "Keep an Open House"
 task_kehillah_open_house_desc:0 "Your spouse keeps the household's table open to guests and travelers, practicing hachnasat orchim and earning the goodwill that comes with it."
 task_kehillah_guard_household:0 "Guard the Household"
 task_kehillah_guard_household_desc:0 "Your spouse sees to the household's safety and keeps its doors barred at the right hours."
 task_kehillah_family_business:0 "Run the Family Business"
 task_kehillah_family_business_desc:0 "Your spouse manages the household's trade and lending, as many Jewish wives of the period did."
 task_kehillah_market_talk:0 "Hear the Talk of the Market"
 task_kehillah_market_talk_desc:0 "Your spouse listens at the market stalls and the well, and learns what people say."
 task_kehillah_support_scholars:0 "Support the Scholars"
 task_kehillah_support_scholars_desc:0 "Your spouse sustains the students of the beit midrash and the scholars who pass through."

 # --- Council redesign (2026-11-25): docs/spec/2026-11-24-council-tasks-redesign.md

 task_kehillah_petition_host_charter_desc:0 "\n\nWhen the host seals the community's charter, a cold host's disfavor does not worsen its terms, and there is a #P [SCOPE.ScriptValue('kehillah_charter_petition_display_value')|0]%#! chance of one better term. Community security comes first, as it carries the right to a wall."

 task_kehillah_seek_protection:0 "Seek Protection"
 task_kehillah_seek_protection_desc:0 "The Shtadlan cultivates the community's protectors: the host's churchmen, the lord's officials and the town's notables."
 task_kehillah_seek_protection_effect_desc:0 "The community's protectors may take its part in public. Each time they do, #P Stability#! rises for ten years."
 task_kehillah_seek_protection_cleric_desc:0 "\n\nEach month, there is also a #P [SCOPE.ScriptValue('kehillah_safety_religious_support_monthly_chance_value')|1]%#! chance that the host's religious adviser publicly urges restraint. This lowers incident danger by 8 for two years, and helps hold off an attack. A new assurance cannot be secured while one is in force."

 kehillah_council_moment_active_desc_prosperity:0 "\n\n#weak Each year:#! #P [SCOPE.ScriptValue('kehillah_council_moment_chance_stewardship_value')|0]%#! #weak chance of a success that raises Affluence for ten years. At most three run at once. Better [stewardship|E] brings more, and larger ones.#!"
 kehillah_council_moment_active_desc_stability:0 "\n\n#weak Each year:#! #P [SCOPE.ScriptValue('kehillah_council_moment_chance_diplomacy_value')|0]%#! #weak chance of a success that raises Stability for ten years. At most three run at once. Better [diplomacy|E] brings more, and larger ones.#!"
 kehillah_council_moment_active_desc_greatness:0 "\n\n#weak Each year:#! #P [SCOPE.ScriptValue('kehillah_council_moment_chance_learning_value')|0]%#! #weak chance of a success that raises Greatness for ten years. At most three run at once. Better [learning|E] brings more, and larger ones.#!"

 task_kehillah_trade_at_fairs:0 "Trade at the Fairs"
 task_kehillah_trade_at_fairs_desc:0 "The Gabbai sends the Quarter's merchants to the market and the fairs, where they speak the town's tongue and make neighbors of strangers."
 task_kehillah_trade_at_fairs_effect_desc:0 "The Quarter's trade may win new customers and partners. Each time it does, #P Affluence#! rises for ten years."
 task_kehillah_trade_at_fairs_acceptance_desc:0 "\n\n[cultural_acceptance|E] between the community's culture and the town's: #P +[SCOPE.ScriptValue('kehillah_trade_fairs_acceptance_value')|0]#! each year"
 kehillah_trade_fairs_acceptance_reason:0 "Jewish merchants at the fairs"

 task_kehillah_manage_tzedakah:0 "Manage Tzedakah"
 task_kehillah_manage_tzedakah_desc:0 "The Gabbai keeps the charity chest, collects for it each week, and answers when another community's letter comes: a ransom, a burned synagogue, refugees on the road."
 task_kehillah_manage_tzedakah_giving_desc:0 "#weak Our community is prosperous, so it gives.#!\nGreatness and reputation for giving from each gift to another community: #P +50%#!"
 task_kehillah_manage_tzedakah_receiving_desc:0 "#weak Our community is not prosperous, so it asks.#!\nOther communities answer our appeals for aid more readily.\nAffluence from relief we receive: #P +50%#!"

 task_kehillah_defend_quarter_effect_desc:0 "Incident danger: #P -[SCOPE.ScriptValue('kehillah_council_watch_danger_display_value')|0]#! #weak (stronger with each tier of the quarter's Wall and Gates)#!\nIf a mob marches on the quarter, the defense brings it nearer to being #P Spared#! each month.\nThreats against the community come less often, and the watch answers them with this councillor's [martial|E]."

 task_kehillah_escort_travellers:0 "Escort the Travelers"
 task_kehillah_escort_travellers_desc:0 "The Rosh ha-Shmirah sends armed men on the road: with merchants to the fairs, students to a yeshiva, and the leader to a Bet Din."
 task_kehillah_escort_travellers_effect_desc:0 "[councillor.GetModifierDescForTask('task_kehillah_escort_travellers')]\nTrading voyages the community has invested in are lost less often."
 task_kehillah_escort_travellers_modifier:0 "Rosh ha-Shmirah: Escorting the Travelers"

 task_kehillah_farm_revenues:0 "Farm the Lord's Revenues"
 task_kehillah_farm_revenues_desc:0 "The lord lets out his tolls, his mint or his estates to the community, which pays in advance and sends the Rosh ha-Shmirah's men to collect. The money is good. The collector is hated."
 task_kehillah_farm_revenues_effect_desc:0 "Monthly income: #P +[SCOPE.ScriptValue('kehillah_farm_revenues_gold_display_value')|1]#! [gold_i]\nThe lord's opinion of you improves while the collection continues.\nIncident danger: #N +[SCOPE.ScriptValue('kehillah_tax_farming_danger')|0]#! #weak (the community is the face of the lord's exactions)#!"
 kehillah_farm_revenues_opinion:0 "Farms my revenues"
 kehillah_danger_term_tax_farming:0 "Collecting the lord's dues"
 kehillah_danger_term_watch:0 "The Rosh ha-Shmirah's defense"

 task_kehillah_pledge_chest:0 "Keep the Pledge Chest"
 task_kehillah_pledge_chest_desc:0 "The Ne'eman holds the community's bonds and pledges: who borrowed, on what pledge, when it falls due, and who must be pressed."
 task_kehillah_pledge_chest_effect_desc:0 "New interest-bearing loans: #P +[SCOPE.ScriptValue('kehillah_pledge_chest_interest_display_value')|0]%#! owed\nEach season, a debtor who can pay is pressed for #P [SCOPE.ScriptValue('kehillah_pledge_chest_collect_display_value')|0]%#! of what he owes.\n#weak Better [intrigue|E] writes better terms and presses harder. A Bond Chest presses harder still.#!"

 task_kehillah_teach_community:0 "Teach the Community"
 task_kehillah_teach_community_desc:0 "The Dayyan gives the daily lesson to the householders between the afternoon and evening prayers, and preaches the great sermons of the year."
 task_kehillah_teach_community_effect_desc:0 "The Dayyan's teaching may spread the community's name. Each time it does, #P Greatness#! rises for ten years.\nA sermon may be delivered every #P six months#! instead of every year."
 task_kehillah_teach_community_yeshiva_desc:0 "\nTraveling students come to the yeshiva more often."

 task_kehillah_learn_chavruta:0 "Learn in Chavruta"
 task_kehillah_learn_chavruta_desc:0 "The Dayyan studies with you, the two of you over one page, as learning was done. He knows the scribes and the booksellers, and which copy is sound."
 task_kehillah_learn_chavruta_effect_desc:0 "When you begin to study a sefer, the Dayyan is your study partner.\nSuccess chance when writing a sefer or examining the Miqra: #P +[SCOPE.ScriptValue('kehillah_chavruta_scheme_display_value')|0]%#!\nSefarim cost #P [SCOPE.ScriptValue('kehillah_chavruta_price_display_value')|0]%#! less to acquire and to repair.\n#weak Better [learning|E] helps more.#!"
 kehillah_chavruta_scheme_desc:0 "Studying with the Dayyan"

 kehillah_sermon_year_wait_tt:0 "A year has passed since the last sermon, or the Dayyan is teaching the community"

 # Moments: community news (sizes, never numbers)
 kehillah_moment_prosperity_minor_tt:0 "Affluence: a #P minor#! rise for ten years"
 kehillah_moment_prosperity_moderate_tt:0 "Affluence: a #P moderate#! rise for ten years"
 kehillah_moment_stability_minor_tt:0 "Stability: a #P minor#! rise for ten years"
 kehillah_moment_stability_moderate_tt:0 "Stability: a #P moderate#! rise for ten years"
 kehillah_moment_greatness_minor_tt:0 "Greatness: a #P minor#! rise for ten years"
 kehillah_moment_greatness_moderate_tt:0 "Greatness: a #P moderate#! rise for ten years"

 kehillah_moment_prosperity_fair_t:0 "A Standing at the Fair"
 kehillah_moment_prosperity_fair_d:0 "Our merchants have taken a regular place at the fair, and buyers now ask for them by name."
 kehillah_moment_prosperity_house_t:0 "A Trusted Partner"
 kehillah_moment_prosperity_house_d:0 "A merchant house of the town now trades with ours on trust, and sends its business our way."
 kehillah_moment_prosperity_craft_t:0 "A New Craft"
 kehillah_moment_prosperity_craft_d:0 "A craftsman has brought a new trade to the Quarter, and the town comes to buy."
 kehillah_moment_prosperity_officials_t:0 "The Lord's Stewards Buy From Us"
 kehillah_moment_prosperity_officials_d:0 "The lord's stewards now buy from our market for his household."
 kehillah_moment_stability_bishop_t:0 "The Court's Cleric Speaks for Us"
 kehillah_moment_stability_bishop_d:0 "The ruler's chief cleric has said in public that our community is under his protection, and the town has heard it."
 kehillah_moment_stability_council_t:0 "The Town Heard Us"
 kehillah_moment_stability_council_d:0 "The Shtadlan brought our complaint before the town's notables, and they acted on it."
 kehillah_moment_stability_steward_t:0 "The Steward Takes Our Side"
 kehillah_moment_stability_steward_d:0 "The lord's steward settled a quarrel in our favor, and let it be known that we live under the lord's peace."
 kehillah_moment_stability_neighbours_t:0 "Neighbors Vouch for Us"
 kehillah_moment_stability_neighbours_d:0 "When a charge was laid against one of ours, neighbors from the town came before the magistrate to vouch for him."
 kehillah_moment_greatness_sermons_t:0 "The Dayyan's Sermons Travel"
 kehillah_moment_greatness_sermons_d:0 "Visitors carry the Dayyan's sermons home, and other communities repeat them in his name."
 kehillah_moment_greatness_student_t:0 "A Student From Afar"
 kehillah_moment_greatness_student_d:0 "A young man has come a long way to hear the Dayyan teach. When he writes home, our yeshiva's name goes with the letter."
 kehillah_moment_greatness_minhag_t:0 "Our Custom Is Asked After"
 kehillah_moment_greatness_minhag_d:0 "Another community has written to ask how we keep a custom, and means to follow our practice."
 kehillah_moment_greatness_siyum_t:0 "The Householders Finish a Tractate"
 kehillah_moment_greatness_siyum_d:0 "The householders' study circle has finished a tractate under the Dayyan, and the whole community came to the celebration."

 # Moments: pillar breakdown lines (KehillahBdMoment*)
 kehillah_bd_moment_prosperity_fair:0 "\n  A standing at the fair: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_prosperity_fair').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_prosperity_fair' ) )])#!"
 kehillah_bd_moment_prosperity_house:0 "\n  A trusted partner: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_prosperity_house').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_prosperity_house' ) )])#!"
 kehillah_bd_moment_prosperity_craft:0 "\n  A new craft: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_prosperity_craft').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_prosperity_craft' ) )])#!"
 kehillah_bd_moment_prosperity_officials:0 "\n  The lord's stewards buy from us: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_prosperity_officials').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_prosperity_officials' ) )])#!"
 kehillah_bd_moment_stability_bishop:0 "\n  The court's cleric speaks for us: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_stability_bishop').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_stability_bishop' ) )])#!"
 kehillah_bd_moment_stability_council:0 "\n  The town heard us: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_stability_council').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_stability_council' ) )])#!"
 kehillah_bd_moment_stability_steward:0 "\n  The steward takes our side: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_stability_steward').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_stability_steward' ) )])#!"
 kehillah_bd_moment_stability_neighbours:0 "\n  Neighbors vouch for us: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_stability_neighbours').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_stability_neighbours' ) )])#!"
 kehillah_bd_moment_greatness_sermons:0 "\n  The Dayyan's sermons travel: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_greatness_sermons').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_greatness_sermons' ) )])#!"
 kehillah_bd_moment_greatness_student:0 "\n  A student from afar: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_greatness_student').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_greatness_student' ) )])#!"
 kehillah_bd_moment_greatness_minhag:0 "\n  Our custom is asked after: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_greatness_minhag').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_greatness_minhag' ) )])#!"
 kehillah_bd_moment_greatness_siyum:0 "\n  The householders finish a tractate: #P +[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_moment_greatness_siyum').GetValue|0]#! #weak (until [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.GetPrimaryTitle.MakeScope, 'kehillah_moment_greatness_siyum' ) )])#!"
