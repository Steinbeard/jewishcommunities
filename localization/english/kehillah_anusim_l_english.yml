l_english:
 kehillah_anusim.0001.t:0 "The Baptized Wish to Return"
 kehillah_anusim.0001.desc:0 "They were baptized with a sword at their throats. Now some of them come to the synagogue door at night and ask to be Jews again. [kehillah_anusim_one.GetFirstName] is among them.\n\nThe Church holds that baptism, once given, cannot be undone. Only [kehillah_anusim_overlord.GetTitledFirstName] could let them return without punishment."
 kehillah_anusim.0001.a:0 "Petition [kehillah_anusim_overlord.GetTitledFirstName] to let them return."
 kehillah_anusim.0001.b:0 "Receive them quietly, without asking leave."
 kehillah_anusim.0001.c:0 "Not yet. It is too dangerous."
 kehillah_anusim_petition_player_tt:0 "The petition goes to [kehillah_anusim_overlord.GetTitledFirstName], who will decide."
 kehillah_anusim_allowed:0 "The overlord allows it"
 kehillah_anusim_allowed_tt:0 "The baptized may return to the faith of their fathers. His clergy will not be pleased."
 kehillah_anusim_refused:0 "The petition is refused"
 kehillah_anusim_refused_tt:0 "The baptized must remain Christians, for now."
 kehillah_anusim_quiet_tt:0 "They return at once. For years, the Church may discover what happened, provoking the lord, outraging the faith and badly harming Stability."
 kehillah_anusim_wait_tt:0 "They remain as they are. The question will come again next year."
 kehillah_anusim.0002.t:0 "How Shall We Receive Them?"
 kehillah_anusim.0002.desc:0 "The judges of the Bet Din sit to rule on the returning converts. Some say they sinned and must do penance before they are counted among us again. Others answer with Rashi's words: that one who was forced is not a sinner, and must not be shamed."
 kehillah_anusim.0002.a:0 "Receive them as Rashi taught, without reproach."
 kehillah_anusim.0002.b:0 "Require penance first."
 kehillah_anusim_lenient_tt:0 "All who can return, return to the faith and the community. Stability #P +40#!."
 kehillah_anusim_penance_tt:0 "A third are shamed and stay away; the rest return. Stability #P +40#!, Greatness #P +30#!."
 kehillah_anusim.0010.t:0 "A Petition for the Baptized"
 kehillah_anusim.0010.desc:0 "[kehillah_anusim_petitioner.GetTitledFirstName] begs leave for the Jews who were baptized by force to return to their own faith. Your clergy say that a baptism cannot be undone, and that to allow it is to mock the sacrament."
 kehillah_anusim.0010.a:0 "A forced baptism is no baptism. Let them return."
 kehillah_anusim.0010.b:0 "What is done is done."
 kehillah_anusim_allow_tt:0 "The baptized may return. Your clergy are angered."
 kehillah_anusim_discovered_t:0 "The Returned Are Discovered"
 kehillah_anusim_discovered_d:0 "The Church has learned that baptized Christians have gone back to the synagogue. The lord is furious, and the preachers have a new sermon."

 # V43 slice 3 (2026-10-14): the head of the faith and the baptized.
 kehillah_anusim.0020.t:0 "A Letter from [kehillah_anusim_hof.GetTitledFirstName]"
 kehillah_anusim.0020.desc:0 "[kehillah_anusim_hof.GetTitledFirstName] has written to [kehillah_anusim_overlord.GetTitledFirstName], and a copy has reached us.\n\nHe writes that a baptism, once given, cannot be undone, not even one given at the point of a sword. Those who go back to the synagogue are apostates, and a Christian prince who allows it puts his own soul in danger.\n\n[kehillah_anusim_overlord.GetTitledFirstName] has not answered him yet."
 kehillah_anusim.0020.a:0 "[kehillah_anusim_overlord.GetFirstName] gave [kehillah_anusim_overlord.GetHerHis] word. Let us hope [kehillah_anusim_overlord.GetSheHe] keeps it."
 kehillah_anusim.0021.desc:0 "[kehillah_anusim_hof.GetTitledFirstName] has written to you about the Jews you let go back to the synagogue.\n\nHe writes that a baptism, once given, cannot be undone, not even one given at the point of a sword. Those who go back are apostates, and a Christian prince who allows it puts his own soul in danger."
 kehillah_anusim.0021.a:0 "A forced baptism is no baptism. My word stands."
 kehillah_anusim.0021.b:0 "Write that the matter will be looked into."
 kehillah_anusim.0022.t:0 "The Baptized Belong to the Church"
 kehillah_anusim.0022.desc:0 "[kehillah_anusim_hof.GetTitledFirstName] has answered the princes who let the baptized go back. A baptism given under threat is still a baptism, he writes. Those who received it, even weeping, even with a sword at their throats, are Christians, and must be kept to the faith they were given.\n\nThe bishops are reading the letter aloud in their cathedrals."
 kehillah_anusim.0022.a:0 "We will bear it."

