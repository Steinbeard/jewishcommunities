l_english:
 kehillah_anusim.0001.t:0 "The Baptized Wish to Return"
 kehillah_anusim.0001.desc:0 "They were baptized with a sword at their throats. Now some of them come to the synagogue door at night -- [kehillah_anusim_one.GetFirstName] among them -- and ask to be Jews again.\n\nThe Church holds that baptism, once given, cannot be undone. Only [kehillah_anusim_overlord.GetTitledFirstName] could let them return without punishment."
 kehillah_anusim.0001.a:0 "Petition [kehillah_anusim_overlord.GetTitledFirstName] to let them return."
 kehillah_anusim.0001.b:0 "Receive them quietly, without asking leave."
 kehillah_anusim.0001.c:0 "Not yet. It is too dangerous."
 kehillah_anusim_petition_player_tt:0 "The petition goes to [kehillah_anusim_overlord.GetTitledFirstName], who will decide."
 kehillah_anusim_allowed:0 "The overlord allows it"
 kehillah_anusim_allowed_tt:0 "The baptized may return to the faith of their fathers. His clergy will not be pleased."
 kehillah_anusim_refused:0 "The petition is refused"
 kehillah_anusim_refused_tt:0 "The baptized must remain Christians, for now."
 kehillah_anusim_quiet_tt:0 "They return at once. But for ten years, each year there is a chance the Church learns of it: the lord's anger, the faith's outrage, and Stability #N -60#!."
 kehillah_anusim_wait_tt:0 "They remain as they are. The question will come again next year."
 kehillah_anusim.0002.t:0 "How Shall We Receive Them?"
 kehillah_anusim.0002.desc:0 "The judges of the Bet Din sit to rule on the returning converts. Some say they sinned and must do penance before they are counted among us again. Others answer with Rashi's words: that one who was forced is not a sinner, and must not be shamed."
 kehillah_anusim.0002.a:0 "Receive them as Rashi taught, without reproach."
 kehillah_anusim.0002.b:0 "Require penance first."
 kehillah_anusim_lenient_tt:0 "All who can return, return to the faith and the community. Stability #P +40#!."
 kehillah_anusim_penance_tt:0 "A third are shamed and stay away; the rest return. Stability #P +40#!, Greatness #P +30#!."
 kehillah_anusim.0010.t:0 "A Petition for the Baptized"
 kehillah_anusim.0010.desc:0 "[kehillah_anusim_petitioner.GetTitledFirstName] begs leave for the Jews who were baptized by force to return to their own faith. Your clergy say that a baptism cannot be undone, and that to allow it is to mock the sacrament."
 kehillah_anusim.0010.a:0 "A forced baptism is no baptism. Let them return."
 kehillah_anusim.0010.b:0 "What is done is done."
 kehillah_anusim_allow_tt:0 "The baptized may return. Your clergy are angered."
 kehillah_anusim_discovered_t:0 "The Returned Are Discovered"
 kehillah_anusim_discovered_d:0 "The Church has learned that baptized Christians have gone back to the synagogue. The lord is furious, and the preachers have a new sermon."
