l_english:
 d_kehillah_pumbedita:0 "Kehillah of Pumbedita"
 d_kehillah_pumbedita_adj:0 "Pumbeditan Jewish"
 d_kehillah_pumbedita_desc:0 "The old academy town on the Euphrates, represented here by Anbar. Its scholars have little of their former reach, but their community still studies beside Sura and Baghdad."
 d_kehillah_pumbedita_article:0 "the "
 d_kehillah_exilarchate:0 "Exilarchate"
 d_kehillah_exilarchate_adj:0 "Exilarchal"
 d_kehillah_exilarchate_desc:0 "The Resh Galuta claims the leadership of the Jews of the Exile by Davidic descent and communal and princely recognition. The office is distinct from Baghdad's community and from the Gaonate."
 d_kehillah_exilarchate_article:0 "the "
 dynn_Ibn_Sakri:0 "Ibn Sakri"
 dynn_Ibn_Fadlan:0 "Ibn Fadlan"
 kehillah_historical_exilarch_male:0 "Exilarch"
 kehillah_adventurer_dayyan_position:0 "Dayyan"
 kehillah_adventurer_dayyan_position_desc:0 "The camp's rabbinic judge and learned counsellor."
 kehillah_press_exilarch_claim_decision:0 "Seek Recognition as Exilarch"
 kehillah_press_exilarch_claim_decision_desc:0 "My acknowledged descent from David gives me a claim to the leadership of the Jews of the Exile. As a community leader, I can present my genealogy and seek recognition from the ruler who shelters us. The office stands beside a community seat; it does not appoint me Nagid or Gaon."
 kehillah_press_exilarch_claim_decision_tooltip:0 "Seek the separate lifetime office of Exilarch"
 kehillah_press_exilarch_at_seat_tt:0 "You are at your community's seat"
 kehillah_press_exilarch_host_tt:0 "Your host ruler will recognize the petition (opinion of you at least -25)"
 kehillah_press_exilarch_claim_decision_confirm:0 "Present the genealogy"
 kehillah_press_community_claim_interaction:0 "Press Claim to Community Seat"
 kehillah_press_community_claim_interaction_desc:0 "Present your claim to this community's leadership. Its current leader and the host ruler must consent to the handover. Your camp's Dayyan may continue as the community's Dayyan; the host's Nagid appointment is decided separately."
