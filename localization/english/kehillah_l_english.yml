 kehillah_translation_work_euclid_artifact_name:0 "Stoicheia"
 kehillah_translation_work_ptolemy_artifact_name:0 "Al-Majisti"
 kehillah_translation_work_galen_artifact_name:0 "Jawami' al-Iskandaraniyyin"
 kehillah_translation_work_hippocrates_artifact_name:0 "Kitab al-Fusul"
 kehillah_translation_work_dioscorides_artifact_name:0 "Al-Hashaish"
 kehillah_translation_work_khwarizmi_algebra_artifact_name:0 "Al-Jabr wa'l-Muqabala"
 kehillah_translation_work_khwarizmi_zij_artifact_name:0 "Zij al-Sindhind"
 kehillah_translation_work_kindi_artifact_name:0 "Rasa'il al-Kindi"
 kehillah_translation_work_jabir_artifact_name:0 "Kutub al-Mawazin"
 kehillah_translation_work_mashallah_artifact_name:0 "The Treatises of Masha'allah"

 # --- Translation: stolen-copy artifact descriptions, by final tier
 # (kehillah_translation_steal_effect, same illustrious/famed/masterwork
 # rarity ladder "Write a Book" already established) ---
 kehillah_translation_stolen_desc_illustrious:0 "A translation of rare quality, quietly kept rather than handed over. Whoever reads it next will know exactly what it is worth -- which is precisely why it never left."
 kehillah_translation_stolen_desc_famed:0 "A sound, careful rendering into Latin, competent enough that giving it away would have been a genuine loss to the community's own shelves."
 kehillah_translation_stolen_desc_masterwork:0 "A rough copy, made in haste and kept more out of principle than pride -- still worth more, on the Kehillah's own shelves, than whatever was actually handed over instead."

 # --- Translation offer: which work was requested (kehillah_task_
 # contract.0002's own desc, v11 -- first_valid/triggered_desc keyed on
 # var:kehillah_translation_work, picked by kehillah_translation_pick_
 # work_effect in the router before this event ever fires) ---
 kehillah_task_contract.0002.desc.euclid:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard of a copy of Euclid's own Elements of geometry, rendered into Arabic in Baghdad two generations past, and wants it set down properly in Latin at last, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.ptolemy:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard that the Kehillah's own scholars can make sense of Ptolemy's Almagest -- the great system of the heavens, studied from Baghdad to Constantinople alike -- and wants it in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.galen:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName]'s own physicians keep running up against Galen's method, translated long ago by the great Hunayn ibn Ishaq but never past Arabic, and want it in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.hippocrates:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] wants the Aphorisms of Hippocrates -- the old physician's own plain wisdom, already rendered once into Arabic -- carried one language further, into Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.dioscorides:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard of a great herbal, Dioscorides' own catalogue of every plant with a use, copied and kept in Constantinople's own libraries, and wants it in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.khwarizmi_algebra:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard of al-Khwarizmi's own book of restoring and balancing -- a whole new art of reckoning unknown numbers -- and wants it in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.khwarizmi_zij:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] wants al-Khwarizmi's own astronomical tables -- the positions of sun, moon and stars, reckoned to the day -- rendered into Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.kindi:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard of al-Kindi's own philosophical treatises -- the Philosopher of the Arabs himself, dead barely a few years now -- and wants them in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.jabir:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard of Jabir ibn Hayyan's own Books of Balances -- the secret art of transmuting substance from substance -- and wants them in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.mashallah:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard of the treatises of Masha'allah -- a Jew, by birth, whose reading of the stars helped set the very foundation-hour of Baghdad itself -- and wants them in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.desc.generic:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard the Kehillah's scholars can read what [employer.GetHerHis] own clerks cannot, and wants a particular work of Arabic or Greek learning set down properly in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"

 # --- Loan reward/closure tooltips ---
 kehillah_loan_contract_originated_tt:0 "The principal is paid out, and the debt is entered in the community's own books -- exactly the same ledger that already tracks any other loan the Kehillah has taken on. Repayment is handled separately, in full, whenever it comes."
 kehillah_loan_contract_concluded_tt:0 "The lending arrangement with this ruler has concluded. Whatever the outcome -- see the community's own accounts for the particulars."

 # --- Exotic goods reward tooltips ---
 kehillah_exotic_goods_great_tt:0 "The goods arrive intact, ahead of schedule, and better than what was actually asked for. Word of a trade network this reliable is worth more than the fee alone."
 kehillah_exotic_goods_good_tt:0 "The goods arrive, as promised, roughly on time. A satisfied customer, nothing more dramatic than that."
 kehillah_exotic_goods_poor_tt:0 "The shipment never materializes -- a contact overpromised, a road was unsafe, a merchant took the deposit and vanished. The commission is a loss, and the disappointment is not hidden."

 # --- Hebrew tutor reward tooltips ---
 kehillah_hebrew_tutor_great_tt:0 "The pupil takes to the lessons faster and further than anyone expected, and the household notices. Teaching this well sharpens the teacher too."
 kehillah_hebrew_tutor_good_tt:0 "The lessons proceed steadily -- no great flourish, but the pupil comes away having genuinely learned something."

 # --- Offer events (events/kehillah_task_contract_events.txt) ---

 kehillah_task_contract.0002.t:0 "A Commission for the Kehillah"
 kehillah_task_contract.0002.desc:0 "A rider arrives from [employer.GetTitledFirstName]'s household with a request rather than a demand, which is itself unusual: [employer.GetFirstName] has heard the Kehillah's scholars can read what [employer.GetHerHis] own clerks cannot, and wants a particular work of Arabic or Hebrew learning set down properly in Latin, for a fee.\n\n#EMP It is, on its face, a reasonable and well-paid piece of work.#!"
 kehillah_task_contract.0002.a:0 "Take the commission."
 kehillah_task_contract.0002.b:0 "Decline. The community's scholars have enough to occupy them."
 kehillah_task_contract.0002.b.flavor:0 "[employer.GetFirstName] takes the refusal without visible offense and, presumably, finds another translator."

 kehillah_task_contract.0003.t:0 "An Offer of Credit"
 kehillah_task_contract.0003.desc:0 "[employer.GetTitledFirstName] sends word through an intermediary, phrased carefully as a favor rather than a request: gold is available, on ordinary terms, should the Kehillah have use for it. The implication -- a debt owed by a Jewish community to a Christian ruler being, in its own quiet way, a form of standing -- goes unspoken but is not exactly hidden either.\n\n#EMP The terms are fair. The obligation is real.#!"
 kehillah_task_contract.0003.a:0 "Accept the loan."
 kehillah_task_contract.0003.b:0 "Decline. The community has no need of this debt."
 kehillah_task_contract.0003.b.flavor:0 "[employer.GetFirstName] shrugs off the refusal -- there will be other borrowers less careful about what a debt actually costs."

 kehillah_task_contract.0004.t:0 "A Request for Rare Goods"
 kehillah_task_contract.0004.desc:0 "[employer.GetTitledFirstName] wants something the local markets simply do not stock, and has heard -- correctly -- that the Kehillah's trade contacts run further afield than the usual local merchants. A fee is offered, generous enough to suggest [employer.GetHerHis] wants this more than [employer.GetSheHe] is letting on.\n\n#EMP Whether the goods can actually be had is another question entirely.#!"
 kehillah_task_contract.0004.a:0 "Take the commission."
 kehillah_task_contract.0004.b:0 "Decline. Not every request is worth the risk to the community's contacts."
 kehillah_task_contract.0004.b.flavor:0 "[employer.GetFirstName] is visibly disappointed, but the request was never going to go unanswered for long -- someone else will take the risk instead."

 kehillah_task_contract.0005.t:0 "A Request for Instruction"
 kehillah_task_contract.0005.desc:0 "[employer.GetTitledFirstName] approaches with an unusual request for [kehillah_tutor_target.GetFirstName]: real instruction in Hebrew, or failing that, a genuine account of what the Jews actually study and believe, rather than the rumor and pulpit-talk that otherwise passes for knowledge of it. A fee is offered for the Kehillah leader's own time and patience.\n\n#EMP Teaching a stranger's household is not nothing -- but neither, done well, is it small.#!"
 kehillah_task_contract.0005.a:0 "Take on the pupil."
 kehillah_task_contract.0005.b:0 "Decline. There is no time to spare for another household's education."
 kehillah_task_contract.0005.b.flavor:0 "[employer.GetFirstName] accepts the refusal graciously enough -- [kehillah_tutor_target.GetFirstName]'s education will simply have to come from somewhere else."

 #####################################################################
 # TRANSLATION CHALLENGE CHAIN -- v11 (events/kehillah_translation_
 # events.txt, namespace kehillah_translation). root throughout is the
 # Kehillah leader; the employer is reached via [kehillah_translation_
 # employer...], a saved scope, NOT [scope:kehillah_translation_
 # employer...] -- the "scope:" prefix is a SCRIPT-side idiom and is
 # invalid inside a loc bracket chain, the exact mistake kehillah_book.
 # 0003's own live-test fix (events/kehillah_book_events.txt) already
 # found and corrected once in this mod; not repeated here.
 #####################################################################

 kehillah_translation.0001.t:0 "Securing the Text"
 kehillah_translation.0001.desc:0 "The commission is accepted -- now comes the first real obstacle. A promise to translate a book is worth nothing without a working copy of the book itself in hand, and [kehillah_translation_employer.GetFirstName] has provided nothing but the title and the fee.\n\n#EMP The Kehillah's own reach, this far from the great libraries, has its limits.#!"
 kehillah_translation.0001.a:0 "Draw on the community's own correspondence."
 kehillah_translation.0001.a.pass.tt:0 "A letter to a cousin's cousin in a trading house pays off -- a working copy arrives inside a bolt of cloth, exactly where it was promised to be."
 kehillah_translation.0001.a.fail.tt:0 "The letters go out and mostly go unanswered. What eventually arrives is incomplete, badly copied in places, and will have to do."
 kehillah_translation.0001.b:0 "Pay a broker to have a copy smuggled in."
 kehillah_translation.0001.b.tt:0 "Gold changes hands quietly, and a complete, legible copy arrives inside the month -- no favors owed, no correspondence to keep track of, just a plain transaction."
 kehillah_translation.0001.c:0 "Make do with whatever fragments are already on hand."
 kehillah_translation.0001.c.tt:0 "There is no copy to be had in time, so the work begins from what little the community's own shelves already hold -- a start, but a thin one."

 kehillah_translation.0002.t:0 "The Difficult Passages"
 kehillah_translation.0002.desc.greek:0 "The text itself is the real trial now. Whoever first rendered it into Arabic did honest work, but a translation of a translation carries every earlier scholar's own choices buried inside it, and untangling Greek habits of thought from underneath two later languages is no small task.\n\n#EMP Some passages simply refuse to yield.#!"
 kehillah_translation.0002.desc.arabic:0 "The text itself is the real trial now. The author wrote precisely, in the dense, allusive style Arabic scholarship favors -- every sentence assuming a reader who already knows half of what is being explained.\n\n#EMP Some passages simply refuse to yield.#!"
 kehillah_translation.0002.a:0 "Work through it alone, on the strength of your own learning."
 kehillah_translation.0002.a.pass.tt:0 "Line by line, the sense of it gives way. It is slow work, but it is real progress."
 kehillah_translation.0002.a.fail.tt:0 "Whole paragraphs resist every reading tried against them. What goes down on the page is closer to a guess than a translation."
 kehillah_translation.0002.b:0 "Reason it through as you would a knotty page of Talmud."
 kehillah_translation.0002.b.tt:0 "The habits of argument the Talmud teaches -- turning a difficult line over and over until it finally gives up its meaning -- serve just as well here. The passage yields."
 kehillah_translation.0002.c:0 "Set it aside, and come back to it with fresh eyes."
 kehillah_translation.0002.c.tt:0 "No great breakthrough, but a night's rest and a second look untangle enough of it to keep moving."

 kehillah_translation.0003.t:0 "A Second Opinion"
 kehillah_translation.0003.desc.courtier:0 "[kehillah_translation_courtier.GetFirstName] has been watching the work pile up on the table for days now, and finally asks to see it -- an offer either worth taking seriously, or politely declined.\n\n#EMP A second pair of eyes rarely hurts a difficult translation.#!"
 kehillah_translation.0003.desc.alone:0 "There is no one in the household worth troubling with this -- the work continues in the same quiet the whole commission has been done in so far."
 kehillah_translation.0003.a:0 "Hear out [kehillah_translation_courtier.GetFirstName]'s own reading of the difficult passages."
 kehillah_translation.0003.a.pass.tt:0 "[kehillah_translation_courtier.GetFirstName] turns out to have a genuinely sharp eye for it, and more than one passage is the better for the conversation."
 kehillah_translation.0003.a.fail.tt:0 "The conversation is pleasant enough, but [kehillah_translation_courtier.GetFirstName]'s own suggestions mostly have to be quietly set aside afterward."
 kehillah_translation.0003.a.unlucky_tt:0 "Nothing more comes of it than the conversation itself."
 kehillah_translation.0003.a.lucky_tt:0 "Almost as an aside, [kehillah_translation_courtier.GetFirstName] mentions a reading that resolves a passage that had been stuck for days."
 kehillah_translation.0003.b:0 "Thank them, but trust your own judgment on this one."
 kehillah_translation.0003.b.tt:0 "It is, in the end, still the safer course -- one voice, one consistent reading, start to finish."
 kehillah_translation.0003.c:0 "Continue the work undisturbed."
 kehillah_translation.0003.c.tt:0 "The work continues exactly as it was."

 kehillah_translation.0004.t:0 "Revise or Rush"
 kehillah_translation.0004.desc:0 "A finished draft sits on the table -- readable, defensible, done. Whether it is actually FINISHED, in the sense the work deserves, is a separate question from whether it is done in the sense the deadline demands.\n\n#EMP Every hour spent revising is an hour [kehillah_translation_employer.GetFirstName] spends waiting.#!"
 kehillah_translation.0004.a:0 "Revise it once more, properly, before it leaves the house."
 kehillah_translation.0004.a.tt:0 "Another pass through it, line by line, catches what the first draft missed -- at the cost of sleep that would have been better spent resting."
 kehillah_translation.0004.b:0 "Send it as it stands. It is good enough."
 kehillah_translation.0004.b.tt:0 "The draft goes out unrevised. It will have to speak for itself."

 kehillah_translation.0005.t:0 "The Finished Copy"
 kehillah_translation.0005.desc.euclid:0 "The Elements sit finished on the table at last -- every proposition, every proof, carried whole from Greek through Arabic into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.ptolemy:0 "The Almagest sits finished on the table at last -- the whole architecture of the heavens, carried whole into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.galen:0 "Galen's own method sits finished on the table at last, carried whole into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.hippocrates:0 "The Aphorisms sit finished on the table at last, carried whole into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.dioscorides:0 "The great herbal sits finished on the table at last, every plant and every use of it carried whole into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.khwarizmi_algebra:0 "Al-Khwarizmi's own art of restoring and balancing sits finished on the table at last, carried whole into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.khwarizmi_zij:0 "The astronomical tables sit finished on the table at last, every reckoning carried whole into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.kindi:0 "Al-Kindi's own treatises sit finished on the table at last, carried whole into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.jabir:0 "The Books of Balances sit finished on the table at last, carried whole into Latin. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.desc.mashallah:0 "The treatises of Masha'allah sit finished on the table at last, carried whole into Latin -- a Jewish astronomer's own words, coming home before they go back out. [kehillah_translation_employer.GetFirstName] is owed this. So, arguably, is the Kehillah's own library.\n\n#EMP One copy. One decision.#!"
 kehillah_translation.0005.a:0 "Deliver it faithfully, as promised."
 kehillah_translation.0005.b:0 "Keep the true copy for the Kehillah, and deliver a lesser one."

