 # --- Contract types (common/task_contracts/kehillah_task_contracts.txt) ---
 #
 # The trailing "_contract_contract" keys below are not a typo -- ck3-
 # tiger derives a task_contract_type's own display-name key by
 # appending "_contract" to the type's key, and since every Kehillah
 # type key already ends in "_contract" (kehillah_translation_contract,
 # etc.), the derived key doubles up. Confirmed this is expected rather
 # than a naming mistake: vanilla's own non-"_contract"-suffixed types
 # (overdue_taxes, hoarding_mayor, etc.) have no dedicated name loc key
 # in the installed english localization at all -- ck3-tiger's own
 # heuristic would ask for "overdue_taxes_contract" there too, and
 # vanilla simply doesn't provide it. Added here anyway, cheaply, since
 # a contract having a real display name is worth having regardless of
 # whether vanilla's own Contracts UI is the delivery path this mod
 # relies on.

 kehillah_translation_contract_contract:0 "Commission a Translation"
 kehillah_translation_contract_desc:0 "A ruler with a taste for learning has heard, third- or fourth-hand, that the Jews keep libraries of Arabic and Greek scholarship no Latin cleric can read -- medicine, astronomy, philosophy, sometimes scripture itself in translation already, waiting only to cross one more language."
 kehillah_translation_contract_request:0 "Render a real work of Arabic or Greek scholarship into Latin, and see it delivered -- or decide, once it's finished, whether delivery is really what it deserves."

 kehillah_loan_contract_contract:0 "A Loan, Offered"
 kehillah_loan_contract_desc:0 "A neighboring ruler is, like every ruler, occasionally short of coin -- and has heard the Kehillah keeps a steady hand with money. An offer arrives, not as charity given but as business proposed: gold now, on terms, against the community's own good name."
 kehillah_loan_contract_request:0 "Accept the principal, and see the debt repaid in full before the term runs out."

 kehillah_exotic_goods_contract_contract:0 "Source Exotic Goods"
 kehillah_exotic_goods_contract_desc:0 "A ruler wants something the local markets do not carry -- a spice, a dye, a relic, a curiosity from further along the trade roads than any local merchant travels -- and has heard the Kehillah's own trade contacts reach further than most."
 kehillah_exotic_goods_contract_request:0 "Reach your community's trade contacts, and bring back what was asked for."

 kehillah_hebrew_tutor_contract_contract:0 "Tutor Hebrew"
 kehillah_hebrew_tutor_contract_desc:0 "A household wants a child, or the ruler themself, given real instruction -- the Hebrew tongue, or at least an honest introduction to what the Jews actually read and believe, rather than what is assumed about them from the pulpit."
 kehillah_hebrew_tutor_contract_request:0 "Take on the pupil, and see the instruction through."

 # --- Shared invalidation flavor (translation / exotic goods / hebrew tutor) ---
 kehillah_task_contract_fell_through_tt:0 "The arrangement fell through before it could be completed."

 # --- Translation reward tooltips (v11: three honest tiers plus the two
 # stolen-copy endings -- see common/task_contracts/kehillah_task_
 # contracts.txt's own header for the full account of the overhaul) ---
 kehillah_translation_triumph_tt:0 "The translation is not merely accurate -- it reads as though it were written in Latin to begin with. Copies of it will travel further than the original ever did, and the Kehillah's name travels with them."
 kehillah_translation_success_tt:0 "The work is done properly, on schedule, and delivered without complaint. Not every commission needs to be a masterpiece to be worth having."
 kehillah_translation_failure_tt:0 "The translation is delivered, flawed as it is -- rougher than promised, thinner than it should be, apologized for more than once in the accompanying letter. A fee changes hands out of politeness more than satisfaction."
 kehillah_translation_stolen_undetected_tt:0 "A passable transcription goes out to [kehillah_translation_employer.GetFirstName]'s household -- competent enough that no one thinks to question it. The real copy, the one actually worth having, stays exactly where it belongs: in the Kehillah's own library."
 kehillah_translation_stolen_caught_tt:0 "It does not hold up. Someone who has actually read the original compares it to what was delivered, and the difference is not subtle. [kehillah_translation_employer.GetFirstName] does not forget being lied to."

