 # COMMUNITY LIST UI -- v9 spec (docs/spec/v9-community-list-ui.md).
 # kehillah_view_communities_interaction (common/character_interactions/
 # kehillah_character_interactions.txt). See that file's own header for
 # the full mechanism writeup (Option A, the character-interaction
 # target-search list) and why there is no dedicated decision/button.
 #
 # The three *_tt keys below are not ordinary tooltips -- they are the
 # `desc` loc keys of this interaction's ai_accept modifiers, rendered
 # by vanilla's own per-candidate acceptance-breakdown tooltip
 # (gui/interaction_templates.gui:3082-3107, unmodified) as the reader
 # hovers each community leader in the list. [recipient...] is the
 # correct scope alias for this context -- confirmed against real
 # vanilla interaction loc (localization/english/interactions_l_
 # english.yml's arrange_marriage_interaction_desc_ruler_at_own_court,
 # which uses bare [actor...]/[recipient...], not [SCOPE:ACTOR...]).
 # The value/band calls themselves ([recipient.GetPrimaryTitle.
 # MakeScope.Var(...).GetValue|V0] and [recipient.GetPrimaryTitle.
 # Custom('KehillahStabilityBandName')]) are the exact same pattern
 # kehillah_view_standing_decision_desc already uses for the player's
 # own community, just rooted at recipient instead of ROOT.Char.GetPrimaryTitle --
 # reusing the mod's own established band thresholds and functions
 # (common/customizable_localization/kehillah_pillar_band_custom_loc.txt),
 # not new numbers.
 #
 # The "what contributes" line in each tooltip is a categorical summary
 # grounded in a real grep of every change_variable/add_to_variable
 # touching each kehillah_var_* name across the whole mod (v9 spec
 # section 4's instruction), not general CK3 knowledge:
 #   Stability  -- Bet Din case verdicts (events/kehillah_bet_din_
 #     events.txt), communal dispute rulings (events/kehillah_dispute_
 #     events.txt), the epidemic pulse and its recovery bonus (common/
 #     on_action/kehillah_on_actions.txt, common/scripted_effects/
 #     kehillah_scripted_effects.txt), a newly appointed leader's flat
 #     bonus and active community modifiers (common/on_action/
 #     kehillah_on_actions.txt, kehillah_scripted_effects.txt), the
 #     Distribute Tzedakah decision (common/decisions/
 #     kehillah_decisions.txt), and the season's own baseline
 #     convergence drift.
 #   Prosperity -- loans repaid or defaulted (kehillah_decisions.txt,
 #     kehillah_scripted_effects.txt's kehillah_loan_debtors handling),
 #     the epidemic drain, each community's own founding fortunes set
 #     at seeding (kehillah_scripted_effects.txt's per-community seed
 #     blocks), Bet Din case 1 verdicts, and baseline convergence.
 #   Greatness  -- books written (common/scripted_effects/
 #     kehillah_book_effects.txt), Bet Din cases judged and landmark
 #     sessions (kehillah_bet_din_events.txt), the Compose a Commentary
 #     decision, dispute rulings delegated to the Rabbi, translation
 #     contracts (common/task_contracts/kehillah_task_contracts.txt),
 #     each community's founding endowment, and baseline convergence.
 # =====================================================================

 # ck3-tiger wants recipient_secondary_<key> whenever populate_recipient_list
 # is used, even with no secondary_recipient field set (confirmed no real
 # vanilla interaction using populate_recipient_list defines this key either,
 # e.g. 00_diarch_interactions.txt's diarch_retract_vassal_interaction --
 # added here anyway since it is cheap and the warning is real).
 recipient_secondary_kehillah_view_communities_interaction:0 "Community Leader"

 kehillah_view_communities_interaction:0 "View Kehillah Communities"
 kehillah_view_communities_interaction_desc:0 "Every registered Kehillah community across the diaspora, and how each currently stands. Hover a name below for its Stability, Prosperity and Greatness -- and what has lately shaped them."
 kehillah_view_communities_interaction_prompt:0 "Select a community to view"
 kehillah_view_communities_interaction_notification:0 "[actor.GetTitledFirstName] has taken note of your community."

 kehillah_view_communities_send_tt:0 "You take note of the community's current standing. Nothing else changes."
 kehillah_view_communities_accept_tt:0 "[recipient.GetFirstName] takes the gesture as it was meant."
 kehillah_view_communities_decline_tt:0 "[recipient.GetFirstName] has little attention to spare for it right now."

 kehillah_view_communities_stability_tt:0 "#EMP Stability#!: [recipient.GetPrimaryTitle.MakeScope.Var('kehillah_var_stability').GetValue|V0] ([recipient.GetPrimaryTitle.Custom('KehillahStabilityBandName')])\n#weak Bet Din verdicts, dispute rulings, epidemics, a new leader's own appointment, and the season's steady drift all shape this.#!"
 kehillah_view_communities_prosperity_tt:0 "#EMP Prosperity#!: [recipient.GetPrimaryTitle.MakeScope.Var('kehillah_var_prosperity').GetValue|V0] ([recipient.GetPrimaryTitle.Custom('KehillahProsperityBandName')])\n#weak Loans repaid or defaulted, epidemics, the community's own founding fortunes, and the season's steady drift all shape this.#!"
 kehillah_view_communities_greatness_tt:0 "#EMP Greatness#!: [recipient.GetPrimaryTitle.MakeScope.Var('kehillah_var_greatness').GetValue|V0] ([recipient.GetPrimaryTitle.Custom('KehillahGreatnessBandName')])\n#weak Books written, Bet Din cases judged, translations completed, the community's founding endowment, and the season's steady drift all shape this.#!"

