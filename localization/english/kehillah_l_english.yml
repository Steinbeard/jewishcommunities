 kehillah_book_halakha_name_2:0 "A Fence Around the Law"
 kehillah_book_parshanut_name_1:0 "[owner.GetTitledFirstNamePossessiveNoTooltip] Commentary on the Torah"
 kehillah_book_parshanut_name_2:0 "A Reading of the Text"
 kehillah_book_talmudics_name_1:0 "[owner.GetTitledFirstNamePossessiveNoTooltip] Novellae"
 kehillah_book_talmudics_name_2:0 "Sharpening the Argument"
 kehillah_book_poetry_name_1:0 "[owner.GetTitledFirstNamePossessiveNoTooltip] Diwan"
 kehillah_book_poetry_name_2:0 "Verses for the Sabbath"

 # --- The event chain (events/kehillah_book_events.txt) ---
 kehillah_book.0001.t:0 "What to Write"
 kehillah_book.0001.desc:0 "There is something worth setting down properly -- the only question is what. A ruling reasoned out to its conclusion, a reading of the text that will not leave you alone, an argument worked all the way through, or -- if the words come to you that way instead -- something that does not resolve into prose at all."
 kehillah_book.0001.a:0 "A responsum -- a real ruling, reasoned out in full."
 kehillah_book.0001.b:0 "A commentary on the text itself."
 kehillah_book.0001.c:0 "An argument in the Talmudic style, worked through completely."
 kehillah_book.0001.d:0 "A cycle of Hebrew verse."

 kehillah_book.0002.t:0 "Where to Begin"
 kehillah_book.0002.desc:0 "Before the work can be written, it has to start somewhere -- and where it starts shapes what it becomes."
 kehillah_book.0002.a:0 "Study the sources alone, without distraction."
 kehillah_book.0002.a.pass.tt:0 "The solitary study pays off -- the argument comes together cleanly."
 kehillah_book.0002.a.fail.tt:0 "Alone with the sources, you go in circles more than you would like to admit."
 kehillah_book.0002.b:0 "Seek out a respected colleague's thinking on it first."
 kehillah_book.0002.b.pass.tt:0 "Their perspective sharpens your own before you have written a word."
 kehillah_book.0002.b.fail.tt:0 "The conversation goes nowhere useful, and you have learned nothing you did not already know."
 kehillah_book.0002.c:0 "Draw on something that actually happened -- a real case, a real dispute, a real grief."
 kehillah_book.0002.c.tt:0 "It is not the most disciplined way to begin, but it gives the work somewhere honest to stand."

 kehillah_book.0003.t:0 "A Second Opinion"
 kehillah_book.0003.desc.courtier:0 "[kbd_book_courtier.GetFirstName] has a mind for this sort of thing, and the work is at the stage where another pair of eyes -- or another voice arguing back -- would help more than more solitude would."
 kehillah_book.0003.desc.alone:0 "There is no one in the household just now suited to arguing this through with you. The work will have to stand or fall on its own reasoning."
 kehillah_book.0003.a:0 "Debate it with [kbd_book_courtier.GetFirstName], point by point."
 kehillah_book.0003.a.pass.tt:0 "The argument survives real scrutiny, and is the better for having been tested."
 kehillah_book.0003.a.fail.tt:0 "The debate exposes more weaknesses than it resolves."
 kehillah_book.0003.a.lucky_tt:0 "[kbd_book_courtier.GetFirstName] raises a point you had not considered -- a genuine improvement, and not one you can claim credit for."
 kehillah_book.0003.a.unlucky_tt:0 "The conversation is useful, but nothing more comes of it than the argument already had on its own."
 kehillah_book.0003.b:0 "Simply listen to what [kbd_book_courtier.GetFirstName] thinks, without pushing back."
 kehillah_book.0003.b.tt:0 "Not a rigorous exchange, but a useful one -- their reaction tells you something about how the work will land."
 kehillah_book.0003.c:0 "Work through it alone instead."
 kehillah_book.0003.c.tt:0 "No voice but your own shapes the work."

 kehillah_book.0004.t:0 "One More Pass"
 kehillah_book.0004.desc:0 "The work is close to finished. It could go out as it stands, or it could be set aside a while longer and gone through again -- line by line, argument by argument -- until it says exactly what it means to."
 kehillah_book.0004.a:0 "Revise it thoroughly, however long it takes."
 kehillah_book.0004.a.tt:0 "The extra work shows. It costs you real strain, but the result is unmistakably better for it."
 kehillah_book.0004.b:0 "It says what it needs to say. Let it stand."
 kehillah_book.0004.b.tt:0 "Good enough is not nothing -- and there is something to be said for finishing."

 kehillah_book.0005.t:0 "The Book Is Finished"
 kehillah_book.0005.desc:0 "The last page is written. Whatever it becomes now is out of your hands."
 kehillah_book.0005.a:0 "So it is done."

 kehillah_book.0006.t:0 "Sending Copies"
 kehillah_book.0006.desc:0 "A finished work does not stay in one place for long. Copies are made and sent on to the other communities of Sh'um -- your own name traveling with them, whether or not you ever hear how they were received."
 kehillah_book.0006.a:0 "Let them go."

 kehillah_book.0007.t:0 "A New Book Arrives"
 kehillah_book.0007.desc.halakha:0 "A responsum has reached you from [kehillah_book_author.GetTitledFirstName], reasoned out in full and worth keeping close at hand the next time a similar case comes before you."
 kehillah_book.0007.desc.parshanut:0 "A commentary has reached you from [kehillah_book_author.GetTitledFirstName] -- a reading of the text worth sitting with."
 kehillah_book.0007.desc.talmudics:0 "An argument has reached you from [kehillah_book_author.GetTitledFirstName], worked through with real rigor -- the kind worth studying for the method, not only the conclusion."
 kehillah_book.0007.desc.poetry:0 "A cycle of verse has reached you from [kehillah_book_author.GetTitledFirstName]. Not every gift between communities needs to be useful to be welcome."
 kehillah_book.0007.desc.generic:0 "A finished work has reached your own community's shelves from elsewhere in Sh'um."
 kehillah_book.0007.a:0 "Add it to the shelves."
 kehillah_book.0007.a.tt:0 "A small thing, but a real one -- there is always something to learn from a work seriously undertaken."


