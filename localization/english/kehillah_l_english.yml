 # entry -- ck3-tiger flagged the first as missing, confirming these are
 # two distinct required keys, not one).
 kehillah_bet_din_pulse_citation_title:0 "A Citation Offered"
 kehillah_bet_din_pulse_disagreement_title:0 "A Disagreement"
 kehillah_bet_din_pulse_renown_title:0 "A Judge Is Noticed"
 kehillah_bet_din_pulse_citation_log_title:0 "A Citation Offered"
 kehillah_bet_din_pulse_citation_log:0 "[CHARACTER.GetTitledFirstName] offered a citation the panel had not considered, and it held up."
 kehillah_bet_din_pulse_disagreement_log_title:0 "A Disagreement"
 kehillah_bet_din_pulse_disagreement_log:0 "[CHARACTER.GetTitledFirstName] and [TARGET_CHARACTER.GetTitledFirstName] argued a fine point of law rather more sharply than the docket required."
 kehillah_bet_din_pulse_renown_log_title:0 "A Judge Is Noticed"
 kehillah_bet_din_pulse_renown_log:0 "Other guests ask [CHARACTER.GetTitledFirstName] about a ruling and remember the answer."

 # --- Semicha (events/kehillah_bet_din_semicha_events.txt) ---
 kehillah_bet_din_semicha.0001.t:0 "Semicha"
 kehillah_bet_din_semicha.0001.desc.host:0 "It is not lost on the other two judges, sitting across from you as you convene the Bet Din yet again, that you are the one presiding over questions of law for the third time now -- and that nobody at this table, including you, still quite thinks of you as a layman who happens to be good at this.\n\nThere is no one more senior in the room to grant it. It falls to you to decide whether to simply take up the title everyone has already, in practice, been giving you."
 kehillah_bet_din_semicha.0001.desc.judge:0 "[kbd_av_beit_din.GetFirstName], presiding as Av Beit Din, takes you aside once the docket is closed. \"You did not come to this table as a scholar's understudy,\" [kbd_av_beit_din.GetHerHis] says. \"You argued as one who already belongs here. It is time the title said so too.\"\n\nSemicha, [kbd_av_beit_din.GetFirstName] is offering, plainly and without ceremony -- ordination, not as a formality, but as a recognition of what the docket has already shown."
 kehillah_bet_din_semicha.0001.a:0 "Accept semicha."
 kehillah_bet_din_semicha.0001.a.tt:0 "You are a rabbi now, in title as well as in practice."
 kehillah_bet_din_semicha.0001.b:0 "Decline. You are not ready to carry that title."
 kehillah_bet_din_semicha.0001.b.tt:0 "You judge as well as ever, but the title itself will have to wait -- perhaps for a session when it sits more easily."

 #####################################################################
 # TASK CONTRACTS -- v8 spec (docs/spec/v8-task-contracts.md). Contract
 # type desc/request text, reward tooltips, and the offer/accept/decline
 # event chain (events/kehillah_task_contract_events.txt).
 #####################################################################

 # --- Contract types (common/task_contracts/kehillah_task_contracts.txt) ---
 #
 # The trailing "_contract_contract" keys below are not a typo -- ck3-
 # tiger derives a task_contract_type's own display-name key by
 # appending "_contract" to the type's key, and since every Kehillah
 # type key already ends in "_contract" (kehillah_translation_contract,
 # etc.), the derived key doubles up. Confirmed this is expected rather
 # than a naming mistake: vanilla's own non-"_contract"-suffixed types
 # (overdue_taxes, hoarding_mayor, etc.) have no dedicated name loc key
 # in the installed english localization at all -- ck3-tiger's own
 # heuristic would ask for "overdue_taxes_contract" there too, and
 # vanilla simply doesn't provide it. Added here anyway, cheaply, since
 # a contract having a real display name is worth having regardless of
 # whether vanilla's own Contracts UI is the delivery path this mod
 # relies on.

 kehillah_translation_contract_contract:0 "Commission a Translation"
 kehillah_translation_contract_desc:0 "A ruler wants a Latin copy of a work held in Arabic or Greek. The community's scholars can obtain the text and translate it for a fee."
 kehillah_translation_contract_request:0 "Obtain the requested work, translate it into Latin, and decide what copy to deliver."

 kehillah_loan_contract_contract:0 "A Loan, Extended"
 kehillah_loan_contract_desc:0 "A neighboring ruler seeks a loan from the community. The treasurer wants the borrower's debts checked before any gold leaves the chest."
 kehillah_loan_contract_request:0 "Examine the borrower's finances, agree on terms, and record the loan in the community's ledger."

 kehillah_exotic_goods_contract_contract:0 "Source Exotic Goods"
 kehillah_exotic_goods_contract_desc:0 "A ruler wants goods unavailable in the local market. The community's merchants may know a supplier along a distant trade road."
 kehillah_exotic_goods_contract_request:0 "Find a supplier and deliver the requested goods."

 kehillah_hebrew_tutor_contract_contract:0 "Tutor Hebrew"
 kehillah_hebrew_tutor_contract_desc:0 "A ruler's household has asked for lessons in Hebrew and Jewish texts. A teacher must make time for the pupil alongside communal duties."
 kehillah_hebrew_tutor_contract_request:0 "Teach the pupil Hebrew and introduce the texts they have asked to study."

 # --- Shared invalidation flavor (translation / exotic goods / hebrew tutor) ---
 kehillah_task_contract_fell_through_tt:0 "The arrangement fell through before it could be completed."

 # --- Translation reward tooltips (v11: three honest tiers plus the two
 # stolen-copy endings -- see common/task_contracts/kehillah_task_
 # contracts.txt's own header for the full account of the overhaul) ---
 kehillah_translation_triumph_tt:0 "The Latin reads cleanly, and the patron praises the work. The community's reputation as a place of learning grows."
 kehillah_translation_success_tt:0 "You deliver a complete translation on schedule. The patron accepts it and pays the agreed fee."
 kehillah_translation_failure_tt:0 "Several passages remain unclear in the delivered copy. The patron pays, but complains about the work."
 kehillah_translation_stolen_undetected_tt:0 "The patron accepts the lesser copy. The better translation stays in the Kehillah's library."
 kehillah_translation_stolen_caught_tt:0 "A reader compares the delivered copy with the source and finds what you withheld. [kehillah_translation_employer.GetFirstName] learns of the deception."

 # --- Translation: what work was actually asked for (v11) -- shared
 # flavor referenced by both kehillah_task_contract.0002's own offer
 # desc and kehillah_translation.0005's closing desc (events/kehillah_
 # translation_events.txt), and by kehillah_translation_steal_effect's
 # own set_artifact_name calls (common/scripted_effects/kehillah_
 # translation_effects.txt) for the artifact's short title. Ten real
 # medieval works -- see that effect's own header for the dating each
 # one rests on.
 kehillah_translation_work_euclid_artifact_name:0 "Stoicheia"
 kehillah_translation_work_ptolemy_artifact_name:0 "Al-Majisti"
 kehillah_translation_work_galen_artifact_name:0 "Jawami' al-Iskandaraniyyin"
 kehillah_translation_work_hippocrates_artifact_name:0 "Kitab al-Fusul"
 kehillah_translation_work_dioscorides_artifact_name:0 "Al-Hashaish"
 kehillah_translation_work_khwarizmi_algebra_artifact_name:0 "Al-Jabr wa'l-Muqabala"
 kehillah_translation_work_khwarizmi_zij_artifact_name:0 "Zij al-Sindhind"
 kehillah_translation_work_kindi_artifact_name:0 "Rasa'il al-Kindi"
 kehillah_translation_work_jabir_artifact_name:0 "Kutub al-Mawazin"
 kehillah_translation_work_mashallah_artifact_name:0 "The Treatises of Masha'allah"

 # --- Translation: stolen-copy artifact descriptions, by final tier
 # (kehillah_translation_steal_effect, same illustrious/famed/masterwork
 # rarity ladder "Write a Book" already established) ---
 kehillah_translation_stolen_desc_illustrious:0 "A carefully revised Latin translation kept in the Kehillah's library. The patron received an inferior copy."
 kehillah_translation_stolen_desc_famed:0 "A complete Latin translation kept in the Kehillah's library. The patron received a poorer copy."
 kehillah_translation_stolen_desc_masterwork:0 "A hurried Latin translation kept in the Kehillah's library after a lesser copy was delivered to the patron."

 # --- Translation offer: which work was requested (kehillah_task_
 # contract.0002's own desc, v11 -- first_valid/triggered_desc keyed on
 # var:kehillah_translation_work, picked by kehillah_translation_pick_
 # work_effect in the router before this event ever fires) ---
 kehillah_task_contract.0002.desc.euclid:0 "A rider from [employer.GetTitledFirstName] asks whether your scholars can obtain Euclid's Elements in Arabic and render its proofs into Latin. The household will pay for a usable copy."
 kehillah_task_contract.0002.desc.ptolemy:0 "[employer.GetTitledFirstName]'s household wants Ptolemy's Almagest in Latin. Its tables and arguments will take time to copy and translate; the ruler offers a fee for the finished work."
 kehillah_task_contract.0002.desc.galen:0 "Physicians in [employer.GetTitledFirstName]'s household ask for a Latin translation of Galen's medical writing. Their messenger offers payment and wants to know when the copy can be delivered."
 kehillah_task_contract.0002.desc.hippocrates:0 "A messenger asks for Hippocrates' Aphorisms in Latin. [employer.GetTitledFirstName]'s household has physicians who can use the text and offers to pay for a translation."
 kehillah_task_contract.0002.desc.dioscorides:0 "[employer.GetTitledFirstName] wants a Latin copy of Dioscorides' herbal. The names of plants and their uses must survive the passage through another language; the household offers a fee for the work."
 kehillah_task_contract.0002.desc.khwarizmi_algebra:0 "A clerk of [employer.GetTitledFirstName] asks for al-Khwarizmi's work on restoring and balancing in Latin. The ruler will pay for a copy whose calculations the clerk can follow."
 kehillah_task_contract.0002.desc.khwarizmi_zij:0 "[employer.GetTitledFirstName] asks for al-Khwarizmi's astronomical tables in Latin. The household will pay for a copy that preserves the numbers as carefully as the words."
 kehillah_task_contract.0002.desc.kindi:0 "A messenger from [employer.GetTitledFirstName] requests al-Kindi's philosophical treatises in Latin. The household offers a fee if your scholars can obtain the Arabic text."
 kehillah_task_contract.0002.desc.jabir:0 "[employer.GetTitledFirstName] seeks a Latin translation of the Books of Balances attributed to Jabir ibn Hayyan. The household offers payment for the completed copy."
 kehillah_task_contract.0002.desc.mashallah:0 "A rider from [employer.GetTitledFirstName] asks for Masha'allah's astronomical treatises in Latin. The household offers a fee for a clear rendering of the calculations."
 kehillah_task_contract.0002.desc.generic:0 "A rider from [employer.GetTitledFirstName] brings a request for a work in Arabic or Greek. The household wants a Latin translation and offers to pay for the finished copy."

 # --- Loan reward/closure tooltips ---
 kehillah_loan_contract_concluded_tt:0 "The lending arrangement with this borrower has concluded. Whatever the outcome -- see the community's own accounts for the particulars."

 # --- Loan challenge chain (events/kehillah_loan_events.txt) ---
 kehillah_loan_challenge_success_tt:0 "The borrower accepts the terms. The treasurer pays out the principal and records the debt; repayment remains due later."
 kehillah_loan_challenge_failure_tt:0 "The borrower rejects the terms. No gold changes hands and no debt is recorded."

 # --- Exotic goods reward tooltips ---
 kehillah_exotic_goods_great_tt:0 "The goods arrive intact and early. The patron praises the merchants who found them."
 kehillah_exotic_goods_good_tt:0 "The goods arrive close to the agreed date. The patron accepts the delivery."
 kehillah_exotic_goods_poor_tt:0 "The supplier fails to deliver. The commission ends without the requested goods."

 # --- Hebrew tutor reward tooltips ---
 kehillah_hebrew_tutor_great_tt:0 "The pupil begins reading passages without your help. Preparing the lessons has sharpened your own knowledge too."
 kehillah_hebrew_tutor_good_tt:0 "The pupil can read a short Hebrew passage and explain what it says."
 kehillah_hebrew_tutor_poor_tt:0 "The pupil still struggles with the passages you assigned. The household is disappointed."

 # --- Offer events (events/kehillah_task_contract_events.txt) ---

 kehillah_task_contract.0002.t:0 "A Commission for the Kehillah"
 kehillah_task_contract.0002.desc:0 "A messenger from [employer.GetTitledFirstName] brings an offer of paid work. The household needs a Latin translation of an Arabic or Hebrew text and has asked for the help of our scholars.\n\nWe will need to obtain a copy and prepare a translation the patron can use."
 kehillah_task_contract.0002.a:0 "Take the commission."
 kehillah_task_contract.0002.b:0 "Decline. The community's scholars have enough to occupy them."
 kehillah_task_contract.0002.b.flavor:0 "The messenger folds the request and takes it back to [employer.GetFirstName]."

 kehillah_task_contract.0003.t:0 "A Debtor Worth Having"
 kehillah_task_contract.0003.desc:0 "[employer.GetTitledFirstName]'s steward is seeking a loan. The community has money to lend, though the councillors want to examine the household's finances before agreeing to terms.\n\nA loan could earn us both income and the ruler's goodwill."
 kehillah_task_contract.0003.a:0 "Offer the loan."
 kehillah_task_contract.0003.b:0 "Decline. The community's gold is better kept close for now."
 kehillah_task_contract.0003.b.flavor:0 "The councillors put the proposed loan aside before sending terms to [employer.GetFirstName]."

 kehillah_task_contract.0004.t:0 "A Request for Rare Goods"
 kehillah_task_contract.0004.desc:0 "[employer.GetTitledFirstName] has offered a fee for goods unavailable in the local markets. Our merchants may be able to obtain them through contacts abroad.\n\nWe must find a supplier and arrange delivery."
 kehillah_task_contract.0004.a:0 "Take the commission."
 kehillah_task_contract.0004.b:0 "Decline. Not every request is worth the risk to the community's contacts."
 kehillah_task_contract.0004.b.flavor:0 "The messenger returns to [employer.GetFirstName] without an agreement."

 kehillah_task_contract.0005.t:0 "A Request for Instruction"
 kehillah_task_contract.0005.desc:0 "[employer.GetTitledFirstName] wishes to arrange lessons for [kehillah_tutor_target.GetFirstName]. The request is for instruction in Hebrew and Jewish learning, with a fee for your time.\n\nTaking on the pupil would add regular lessons to your duties."
 kehillah_task_contract.0005.a:0 "Take on the pupil."
 kehillah_task_contract.0005.b:0 "Decline. There is no time to spare for another household's education."
 kehillah_task_contract.0005.b.flavor:0 "[employer.GetFirstName] receives your refusal and must arrange other lessons for [kehillah_tutor_target.GetFirstName]."

 # --- Loan challenge chain (events/kehillah_loan_events.txt) ---

 kehillah_loan_challenge.0001.t:0 "Assessing the Borrower"
 kehillah_loan_challenge.0001.desc:0 "Before approving the loan, the councillors ask you to examine [kehillah_loan_challenge_employer.GetTitledFirstName]'s finances. They want to know what debts are already outstanding and whether the household can afford to repay us."
 kehillah_loan_challenge.0001.a:0 "Look into it yourself."
 kehillah_loan_challenge.0001.a.pass.tt:0 "The accounts show [kehillah_loan_challenge_employer.GetFirstName]'s existing debts and a workable path to repayment."
 kehillah_loan_challenge.0001.a.fail.tt:0 "The accounts leave too many debts unexplained for you to judge the risk."
 kehillah_loan_challenge.0001.b:0 "Send a trusted agent ahead first."
 kehillah_loan_challenge.0001.b.tt:0 "Your agent asks creditors about [kehillah_loan_challenge_employer.GetFirstName]'s unpaid debts and reports back."
 kehillah_loan_challenge.0001.c:0 "Lend on reputation alone."
 kehillah_loan_challenge.0001.c.tt:0 "You accept [kehillah_loan_challenge_employer.GetFirstName]'s reputation without examining the accounts."

 kehillah_loan_challenge.0002.t:0 "Negotiating Terms"
 kehillah_loan_challenge.0002.desc:0 "[kehillah_loan_challenge_employer.GetFirstName]'s steward waits for your terms. The councillors ask how much time to allow for repayment and what happens if it is late."
 kehillah_loan_challenge.0002.a:0 "Press for firm terms."
 kehillah_loan_challenge.0002.a.tt:0 "The agreement gives the borrower a firm repayment date and little room to renegotiate."
 kehillah_loan_challenge.0002.b:0 "Extend generous terms, and hope it's remembered."
 kehillah_loan_challenge.0002.b.pays_off.tt:0 "[kehillah_loan_challenge_employer.GetFirstName] accepts the longer repayment period and thanks the community."
 kehillah_loan_challenge.0002.b.exploited.tt:0 "[kehillah_loan_challenge_employer.GetFirstName] asks for further concessions after you offer easier terms."

 kehillah_loan_challenge.0003.t:0 "Sealing the Loan"
 kehillah_loan_challenge.0003.desc.success:0 "The terms are agreed. The borrower has accepted the repayment schedule, and the principal is ready to be counted out."
 kehillah_loan_challenge.0003.desc.failure:0 "Negotiations have broken down over the terms. The community will keep its funds in the treasury."
 kehillah_loan_challenge.0003.a:0 "See it through."

 # --- Hebrew tutor challenge chain (events/kehillah_hebrew_tutor_events.txt) ---

 kehillah_hebrew_tutor.0001.t:0 "The First Lesson"
 kehillah_hebrew_tutor.0001.desc:0 "[kehillah_hebrew_tutor_target.GetFirstName] sits for the first real lesson -- the alphabet, or if already literate, a first real passage, read aloud and puzzled over word by word. How this goes sets the tone for everything that follows."
 kehillah_hebrew_tutor.0001.a:0 "Teach the lesson yourself."
 kehillah_hebrew_tutor.0001.a.pass.tt:0 "The lesson goes better than expected -- [kehillah_hebrew_tutor_target.GetFirstName] is quicker than most at this age, and it shows already."
 kehillah_hebrew_tutor.0001.a.fail.tt:0 "The lesson is a slog -- patience wears thin on both sides before the hour is out."
 kehillah_hebrew_tutor.0001.b:0 "Bring in a learned courtier to help."
 kehillah_hebrew_tutor.0001.b.tt:0 "The courtier helps the pupil sound out the passage while you explain its meaning."
 kehillah_hebrew_tutor.0001.c:0 "Get through it quickly."
 kehillah_hebrew_tutor.0001.c.tt:0 "The lesson is rushed through rather than taught -- covered, not learned."

 kehillah_hebrew_tutor.0002.t:0 "Patient or Rigorous"
 kehillah_hebrew_tutor.0002.desc:0 "The early lessons are behind [kehillah_hebrew_tutor_target.GetFirstName] now; the question is how to teach the rest of it -- slowly and gently, or hard and fast."
 kehillah_hebrew_tutor.0002.a:0 "Teach patiently."
 kehillah_hebrew_tutor.0002.a.tt:0 "Patience wins out over speed -- slower, but nothing is lost along the way."
 kehillah_hebrew_tutor.0002.b:0 "Push a rigorous pace."
 kehillah_hebrew_tutor.0002.b.pass.tt:0 "The harder pace pays off -- [kehillah_hebrew_tutor_target.GetFirstName] rises to it, and the lessons move faster for the push."
 kehillah_hebrew_tutor.0002.b.fail.tt:0 "The harder pace backfires -- [kehillah_hebrew_tutor_target.GetFirstName] balks, and ground already covered has to be revisited."

 kehillah_hebrew_tutor.0003.t:0 "The Pupil's Progress"
 kehillah_hebrew_tutor.0003.desc.great:0 "[kehillah_hebrew_tutor_target.GetFirstName] has come further than the lessons alone would explain -- a real aptitude, not just diligence."
 kehillah_hebrew_tutor.0003.desc.good:0 "[kehillah_hebrew_tutor_target.GetFirstName] has learned what was promised, steadily, without any particular flourish."
 kehillah_hebrew_tutor.0003.desc.poor:0 "[kehillah_hebrew_tutor_target.GetFirstName] still needs help with the passages covered in the lessons."
 kehillah_hebrew_tutor.0003.a:0 "See the instruction through."

 #####################################################################
 # TRANSLATION CHALLENGE CHAIN -- v11 (events/kehillah_translation_
 # events.txt, namespace kehillah_translation). root throughout is the
 # Kehillah leader; the employer is reached via [kehillah_translation_
 # employer...], a saved scope, NOT [scope:kehillah_translation_
 # employer...] -- the "scope:" prefix is a SCRIPT-side idiom and is
 # invalid inside a loc bracket chain, the exact mistake kehillah_book.
 # 0003's own live-test fix (events/kehillah_book_events.txt) already
 # found and corrected once in this mod; not repeated here.
 #####################################################################

 kehillah_translation.0001.t:0 "Securing the Text"
 kehillah_translation.0001.desc:0 "[kehillah_translation_employer.GetFirstName] has supplied a title and a fee, but no manuscript. Before you can translate the work, you need a legible copy.\n\nThe community's correspondents may know where to find one."
 kehillah_translation.0001.a:0 "Draw on the community's own correspondence."
 kehillah_translation.0001.a.pass.tt:0 "A letter to a cousin's cousin in a trading house pays off -- a working copy arrives inside a bolt of cloth, exactly where it was promised to be."
 kehillah_translation.0001.a.fail.tt:0 "The letters go out and mostly go unanswered. What eventually arrives is incomplete, badly copied in places, and will have to do."
 kehillah_translation.0001.b:0 "Pay a broker to have a copy smuggled in."
 kehillah_translation.0001.b.tt:0 "The broker takes payment and brings a legible copy within the month."
 kehillah_translation.0001.c:0 "Make do with whatever fragments are already on hand."
 kehillah_translation.0001.c.tt:0 "You begin from the incomplete passages already held in the community library."

 kehillah_translation.0002.t:0 "The Difficult Passages"
 kehillah_translation.0002.desc.greek:0 "The Arabic copy preserves a Greek work, but some technical terms were translated differently from one chapter to the next. You must decide which Latin words will carry the argument consistently."
 kehillah_translation.0002.desc.arabic:0 "The Arabic text assumes its reader knows the subject already. Several passages use a term without defining it, and the Latin draft cannot leave the same uncertainty in place."
 kehillah_translation.0002.a:0 "Work through it alone, on the strength of your own learning."
 kehillah_translation.0002.a.pass.tt:0 "You check the difficult passages against the rest of the work and settle on a consistent translation."
 kehillah_translation.0002.a.fail.tt:0 "Whole paragraphs resist every reading tried against them. What goes down on the page is closer to a guess than a translation."
 kehillah_translation.0002.b:0 "Reason it through as you would a knotty page of Talmud."
 kehillah_translation.0002.b.tt:0 "You compare each difficult term with its uses elsewhere in the work and resolve the passage."
 kehillah_translation.0002.c:0 "Set it aside, and come back to it with fresh eyes."
 kehillah_translation.0002.c.tt:0 "A second reading clears enough of the passage for you to continue."

 kehillah_translation.0003.t:0 "A Second Opinion"
 kehillah_translation.0003.desc.courtier:0 "[kehillah_translation_courtier.GetFirstName] finds a difficult passage among your notes and asks to read the source beside the Latin draft."
 kehillah_translation.0003.desc.alone:0 "No one in the household has the knowledge needed to check these passages. You will continue the translation alone."
 kehillah_translation.0003.a:0 "Hear out [kehillah_translation_courtier.GetFirstName]'s own reading of the difficult passages."
 kehillah_translation.0003.a.pass.tt:0 "[kehillah_translation_courtier.GetFirstName] catches two passages where the Latin changes the author's meaning. You revise them."
 kehillah_translation.0003.a.fail.tt:0 "[kehillah_translation_courtier.GetFirstName]'s suggested readings do not fit the surrounding passages."
 kehillah_translation.0003.a.unlucky_tt:0 "Nothing more comes of it than the conversation itself."
 kehillah_translation.0003.a.lucky_tt:0 "Almost as an aside, [kehillah_translation_courtier.GetFirstName] mentions a reading that resolves a passage that had been stuck for days."
 kehillah_translation.0003.b:0 "Thank them, but trust your own judgment on this one."
 kehillah_translation.0003.b.tt:0 "You keep your own readings and finish the draft alone."
 kehillah_translation.0003.c:0 "Continue the work undisturbed."
 kehillah_translation.0003.c.tt:0 "The work continues exactly as it was."

 kehillah_translation.0004.t:0 "Revise or Rush"
 kehillah_translation.0004.desc:0 "Your draft is complete, but several passages could use another revision. [kehillah_translation_employer.GetFirstName] is waiting for the finished copy.\n\nDo you spend more time checking it or send it now?"
 kehillah_translation.0004.a:0 "Revise it once more, properly, before it leaves the house."
 kehillah_translation.0004.a.tt:0 "You correct errors in the draft, spending late nights at the table."
 kehillah_translation.0004.b:0 "Send it as it stands. It is good enough."
 kehillah_translation.0004.b.tt:0 "The draft goes out unrevised. It will have to speak for itself."

 kehillah_translation.0005.t:0 "The Finished Copy"
 kehillah_translation.0005.desc.euclid:0 "The final proof of Euclid's Elements is copied into Latin. [kehillah_translation_employer.GetFirstName] expects the finished work. You could keep this copy and send a poorer one."
 kehillah_translation.0005.desc.ptolemy:0 "The Latin Almagest lies open at its last table of figures. [kehillah_translation_employer.GetFirstName] paid for this copy. The Beit Midrash could keep it if a lesser one were delivered."
 kehillah_translation.0005.desc.galen:0 "The Latin text of Galen is ready for [kehillah_translation_employer.GetFirstName]'s physicians. You could deliver it as promised, or keep the better copy for the community."
 kehillah_translation.0005.desc.hippocrates:0 "The Aphorisms have been translated and bound. [kehillah_translation_employer.GetFirstName] waits for the book; your own scholars have asked to keep it."
 kehillah_translation.0005.desc.dioscorides:0 "The plant names in Dioscorides' herbal have been checked against the Latin draft. [kehillah_translation_employer.GetFirstName] expects the finished copy, but the Beit Midrash could keep it."
 kehillah_translation.0005.desc.khwarizmi_algebra:0 "The last calculation in al-Khwarizmi's book has been copied into Latin. [kehillah_translation_employer.GetFirstName] expects the work; you could keep this copy and send a poorer one."
 kehillah_translation.0005.desc.khwarizmi_zij:0 "Al-Khwarizmi's tables are ready in Latin, their figures checked against the source. [kehillah_translation_employer.GetFirstName] expects them. The community could keep the better copy."
 kehillah_translation.0005.desc.kindi:0 "The Latin draft of al-Kindi's treatises is complete. [kehillah_translation_employer.GetFirstName] has paid for it, but you could leave the better copy on the community's shelves."
 kehillah_translation.0005.desc.jabir:0 "The Books of Balances are ready in Latin. [kehillah_translation_employer.GetFirstName] expects the finished work. You could deliver it or keep the better copy in the Beit Midrash."
 kehillah_translation.0005.desc.mashallah:0 "Masha'allah's treatises are translated, with their calculations set down in Latin. [kehillah_translation_employer.GetFirstName] expects the book. The Beit Midrash could keep the better copy."
 kehillah_translation.0005.a:0 "Deliver it faithfully, as promised."
 kehillah_translation.0005.b:0 "Keep the true copy for the Kehillah, and deliver a lesser one."

