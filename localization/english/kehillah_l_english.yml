 kehillah_bet_din_case7_good_log_title:0 "A Captive's Ransom: A Sound Ruling"
 kehillah_bet_din_case7_good_log:0 "[CHARACTER.GetTitledFirstName] helped settle a petition over the price of a captive's redemption."
 kehillah_bet_din_case7_poor_log_title:0 "A Captive's Ransom: A Divided Court"
 kehillah_bet_din_case7_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling on a captive's ransom left the community divided over its pledge."

 # --- Case 5 memory (common/character_memory_types/kehillah_memory_types.txt) ---
