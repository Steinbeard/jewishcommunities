 activity_kehillah_bet_din_conference_owner:0 "Convening Judge"
 activity_kehillah_bet_din_conference_guest_desc:0 "A co-judge of the Bet Din, called to weigh in on the docket."
 activity_kehillah_bet_din_conference_guest_help_text:0 "The other [GetPlayer.GetPrimaryTitle.GetDeJureLiege.GetNameNoTooltip] leaders sit with you as co-judges. Their own scholarship shapes how well each case is ruled."
 activity_kehillah_bet_din_conference_selection_tooltip:0 "Convene a Bet Din of your own minhag region, in your own community."
 activity_kehillah_bet_din_conference_destination_selection:0 "Host the Bet Din Conference"
 activity_kehillah_bet_din_conference_predicted_cost:0 "No cost to convene, beyond the standing of the ruling itself."
 TRAVEL_NAME_FOR_activity_kehillah_bet_din_conference:0 "Travelling to the Bet Din Conference"

 kehillah_bet_din_co_judge_1:0 "Co-Judge"
 kehillah_bet_din_co_judge_1_for_host:0 "Co-Judge"
 kehillah_bet_din_co_judge_1_desc:0 "A leader of another community in your own minhag region, called to sit as a co-judge."
 kehillah_bet_din_co_judge_1_desc_for_host:0 "A leader of another community in your own minhag region, called to sit as a co-judge."
 kehillah_bet_din_co_judge_2:0 "Co-Judge"
 kehillah_bet_din_co_judge_2_for_host:0 "Co-Judge"
 kehillah_bet_din_co_judge_2_desc:0 "A leader of another community in your own minhag region, called to sit as a co-judge."
 kehillah_bet_din_co_judge_2_desc_for_host:0 "A leader of another community in your own minhag region, called to sit as a co-judge."

 # One phase per case on the docket -- the phase list is what sequences
 # the cases and what makes the session end after three. See the phases
 # block in common/activities/activity_types/kehillah_bet_din_conference.txt.
 phase_bet_din_case_1:0 "The First Case"
 phase_bet_din_case_1_desc:0 "The Bet Din takes up the first case on its docket."
 phase_bet_din_case_2:0 "The Second Case"
 phase_bet_din_case_2_desc:0 "The first case is settled. The Bet Din turns to the next."
 phase_bet_din_case_3:0 "The Third Case"
 phase_bet_din_case_3_desc:0 "The last case of the session comes before the judges."

 # --- Case 1: A Dowry Beyond Reach ---

 kehillah_bet_din.0001.t:0 "A Dowry Beyond Reach"
 kehillah_bet_din.0001.desc:0 "The first case on the docket: a match was agreed between [kbd_litigant_a.GetFirstName]'s family and [kbd_litigant_b.GetFirstName]'s, and a dowry promised to make it possible. Now the sum promised is not the sum in hand -- a bad harvest, a debt nobody mentioned at the betrothal. [kbd_litigant_b.GetFirstName]'s family calls it a broken promise. [kbd_litigant_a.GetFirstName]'s family calls it a promise made in good faith that circumstances no longer allow.\n\nThe Bet Din must rule."
 kehillah_bet_din.0001.a:0 "Hold [kbd_litigant_a.GetFirstName]'s family to the letter of the agreement."
 kehillah_bet_din.0001.a.pass.tt:0 "You find a way to make the sum whole without ruining anyone outright -- real judgement, not just a hard line."
 kehillah_bet_din.0001.a.fail.tt:0 "You insist on the letter of an agreement neither family can actually afford to keep, and it satisfies no one."
 kehillah_bet_din.0001.b:0 "Excuse the shortfall and side with [kbd_litigant_b.GetFirstName]'s family."
 kehillah_bet_din.0001.b.pass.tt:0 "The shortfall is excused in a way that reads as mercy, not favoritism."
 kehillah_bet_din.0001.b.fail.tt:0 "The excuse reads as favoritism rather than mercy, and it is not forgotten."

 kehillah_bet_din.0002.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0002.desc:0 "The case of [kbd_litigant_a.GetFirstName] and [kbd_litigant_b.GetFirstName]'s dowry is laid before the other two judges of the Bet Din. Each has their own read of the matter."
 kehillah_bet_din.0002.a:0 "Concur with the letter of the agreement."
 kehillah_bet_din.0002.b:0 "Concur with excusing the shortfall."

 kehillah_bet_din.0003.t:0 "The Ruling on the Dowry"
 kehillah_bet_din.0003.desc:0 "The Bet Din's verdict is recorded."
 kehillah_bet_din.0003.a:0 "So it is written."
 kehillah_bet_din.0003.great.tt:0 "A ruling the whole community recognizes as both fair and wise. Word of it travels."
 kehillah_bet_din.0003.good.tt:0 "A sound ruling, competently reasoned. Nothing more is asked of it."
 kehillah_bet_din.0003.poor.tt:0 "A poorly reasoned ruling. It settles nothing and satisfies no one."

 # --- Case 2: The Agunah's Plea ---

 kehillah_bet_din.0011.t:0 "The Agunah's Plea"
 kehillah_bet_din.0011.desc:0 "[kbd_litigant_a.GetFirstName]'s husband has not been seen in three years -- gone on the road and never returned, neither body nor word. Without a clear ruling she cannot remarry, cannot rebuild a life; she is an agunah, chained to a marriage that may already be a widowhood. [kbd_litigant_b.GetFirstName], a kinsman of the missing man, argues the law demands more certainty than this before the chain can be broken.\n\nThe Bet Din must rule."
 kehillah_bet_din.0011.a:0 "Grant [kbd_litigant_a.GetFirstName] leave to remarry."
 kehillah_bet_din.0011.a.pass.tt:0 "The reasoning is careful and thorough enough to stand -- a compassionate ruling built on real scholarship, not just sympathy."
 kehillah_bet_din.0011.a.fail.tt:0 "The ruling is compassionate but thin -- it will not withstand a serious challenge, and everyone who hears it reasoned knows it."
 kehillah_bet_din.0011.b:0 "Hold to the stricter reading and make her wait."
 kehillah_bet_din.0011.b.pass.tt:0 "A rigorous, well-grounded application of the law, even if a hard one to deliver."
 kehillah_bet_din.0011.b.fail.tt:0 "A harsh ruling delivered without the scholarship to justify the harshness -- it reads as cruelty, not caution."

 kehillah_bet_din.0012.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0012.desc:0 "[kbd_litigant_a.GetFirstName]'s case is laid before the other two judges of the Bet Din."
 kehillah_bet_din.0012.a:0 "Concur with granting leave to remarry."
 kehillah_bet_din.0012.b:0 "Concur with the stricter reading."

 kehillah_bet_din.0013.t:0 "The Ruling on the Agunah"
 kehillah_bet_din.0013.desc:0 "The Bet Din's verdict is recorded."
 kehillah_bet_din.0013.a:0 "So it is written."
 kehillah_bet_din.0013.great.tt:0 "A ruling that will be cited for years -- the panel's scholarship is not in doubt."
 kehillah_bet_din.0013.good.tt:0 "A sound, defensible ruling. It holds."
 kehillah_bet_din.0013.poor.tt:0 "A poorly reasoned ruling on a matter that deserved better. It shakes confidence in the court."
 kehillah_bet_din.0013.remarried.tt:0 "She is granted leave to remarry, and within the week is wed to another -- the chain that held her is broken."

 # --- Case 3: The Second Wife (tenet-adding) ---

 kehillah_bet_din.0021.t:0 "The Second Wife"
 kehillah_bet_din.0021.desc:0 "A wealthy man of standing in the community has taken a second wife, as the old law still permits. His first wife's family has brought the matter before the Bet Din -- not as a crime, but as a question: should the community bind itself, as some communities elsewhere already have, to forbid the practice outright?\n\nThis is not a dispute between two households. It is a question of what the community will be."
 kehillah_bet_din.0021.a:0 "Forbid it -- no man of this community may take a second wife."
 kehillah_bet_din.0021.a.pass.tt:0 "The ruling is argued with real command of the sources -- this is scholarship serious enough to bind a community, not just an opinion."
 kehillah_bet_din.0021.a.fail.tt:0 "The intent is right but the argument is thin. A herem needs more than good intentions behind it, and this one will not hold."
 kehillah_bet_din.0021.b:0 "Leave the old custom be -- it is not yet time to bind the community to a new rule."
 kehillah_bet_din.0021.b.pass.tt:0 "A carefully reasoned restraint, not mere avoidance -- the community understands why the question was set aside rather than answered."
 kehillah_bet_din.0021.b.fail.tt:0 "The refusal to rule reads as indecision, not wisdom, and settles nothing."

 kehillah_bet_din.0022.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0022.desc:0 "The question of the second wife is laid before the other two judges of the Bet Din -- a ruling this large cannot rest on one voice alone."
 kehillah_bet_din.0022.a:0 "Add your own voice to the ruling."

 kehillah_bet_din.0023.t:0 "The Ruling on the Second Wife"
 kehillah_bet_din.0023.desc:0 "The Bet Din's verdict is recorded."
 kehillah_bet_din.0023.a:0 "So it is written."
 kehillah_bet_din.0023.herem.tt:0 "The Bet Din issues a formal herem: from this day, no man of the community may take a second wife. It is argued so thoroughly that it holds -- word of the ruling will travel to every community of the region."
 kehillah_bet_din.0023.good.tt:0 "A sound ruling, whichever way it went, though not one that reshapes anything beyond this community."
 kehillah_bet_din.0023.poor.tt:0 "A poorly argued ruling on the community's largest question of the year. It persuades no one and settles nothing."

 # --- Case 4: The Recalcitrant Husband ---
 kehillah_bet_din.0031.t:0 "The Recalcitrant Husband"
 kehillah_bet_din.0031.desc:0 "[kbd_litigant_a.GetFirstName] has asked her husband for a get -- a bill of divorce -- for two years running, and for two years running [kbd_litigant_b.GetFirstName] has refused her. He offers no reason worth the name; only that he can, and that it costs him nothing to keep refusing. There is no law that compels him to relent. There is only a woman who cannot remarry, cannot leave, cannot do anything at all so long as he holds a paper he will not sign.\n\nThe Bet Din must decide what, if anything, it is willing to do about a man who has broken no law and ruined a life regardless."
 kehillah_bet_din.0031.a:0 "Place him in cherem."
 kehillah_bet_din.0031.a.pass.tt:0 "The cherem is pronounced with real authority -- every community of the region will know his name, and why."
 kehillah_bet_din.0031.a.fail.tt:0 "The cherem is announced but poorly grounded -- word gets around that the Bet Din reached for its harshest tool and could not fully justify using it."
 kehillah_bet_din.0031.b:0 "Have him beaten until he grants the divorce."
 kehillah_bet_din.0031.b.pass.tt:0 "Chosen and briefed with real care, this reads as the considered will of a court, not a mob turned loose."
 kehillah_bet_din.0031.b.fail.tt:0 "It reads as exactly what it also is -- a beating, ordered by a court that could not make its case any other way."
 kehillah_bet_din.0031.c:0 "The law does not compel him. Side with the husband."
 kehillah_bet_din.0031.c.pass.tt:0 "The refusal is upheld on real legal grounding -- whatever it costs, it does not look like cowardice."
 kehillah_bet_din.0031.c.fail.tt:0 "The refusal is upheld because it is easier than the alternative, and everyone who hears the ruling knows it."

 kehillah_bet_din.0032.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0032.desc:0 "[kbd_litigant_a.GetFirstName]'s case is laid before the other two judges of the Bet Din."
 kehillah_bet_din.0032.a:0 "Concur with the cherem."
 kehillah_bet_din.0032.b:0 "Concur with having him beaten."
 kehillah_bet_din.0032.c:0 "Concur with siding with the husband."

 kehillah_bet_din.0033.t:0 "The Ruling on the Recalcitrant Husband"
 kehillah_bet_din.0033.desc:0 "The Bet Din's verdict is recorded."
 kehillah_bet_din.0033.a:0 "So it is written."
 kehillah_bet_din.0033.great.tt:0 "A ruling delivered with real command of the law and real conviction. However it went, no one doubts the Bet Din meant it."
 kehillah_bet_din.0033.good.tt:0 "A defensible ruling, competently delivered. It holds."
 kehillah_bet_din.0033.poor.tt:0 "A poorly reasoned ruling. Whatever the panel decided, it does not sound like they were sure of it themselves."
 kehillah_bet_din.0033.cherem.tt:0 "He is placed in cherem, cut off from the community's religious life until he relents -- if he ever does."
 kehillah_bet_din.0033.beaten.tt:0 "He is beaten until he grants the divorce, and does. The marriage is dissolved; his opinion of the men who ordered it beaten into him is exactly what you would expect."
 kehillah_bet_din.0033.sided.tt:0 "The panel upholds his refusal. The law, such as it is, is on his side -- and the Bet Din's own standing pays the price of saying so."

 # --- Case 5 (events/kehillah_bet_din_events.txt, ADDED 2026-09-15) ---
 kehillah_bet_din.0041.t:0 "A Cursed Amulet"
 kehillah_bet_din.0041.desc:0 "[kbd_litigant_a.GetFirstName] paid [kbd_litigant_b.GetFirstName] a fair sum for an amulet -- a folded parchment, sewn into leather, meant to carry a blessing over a hard year. Since he began wearing it nothing has gone right: a sick child, a lost contract, a fall that should not have hurt as badly as it did. He has had the parchment opened and read, and what it holds is nonsense -- Hebrew letters that spell nothing, repeated over and over in a rhythm that means something to someone, he is now sure, but not a blessing.\n\n[kbd_litigant_b.GetFirstName] does not deny writing it. He insists the letters are not nonsense at all -- a working of the divine names, set down the way his own master taught him, meant to be felt rather than simply read. He cannot explain, when pressed, what the words themselves mean. He says that is not how it is supposed to work.\n\n#EMP The parchment sits on the table between them. No one at this table can actually read it.#!"
 kehillah_bet_din.0041.a:0 "Study the text yourself."
 kehillah_bet_din.0041.a.pass.tt:0 "The rhythm of the letters gives way, slowly, to real understanding -- whatever else is true, you now know exactly what this parchment is."
 kehillah_bet_din.0041.a.fail.tt:0 "The letters resist every reading tried against them. Whatever this parchment actually is stays exactly as opaque as when you started -- a verdict will have to be reached without it."
 kehillah_bet_din.0041.b:0 "Amulets have no power to curse anyone. This is not a question of magic."
 kehillah_bet_din.0041.b.tt:0 "The ruling sidesteps the actual parchment entirely -- whatever it says, an object cannot curse a man, and so there is nothing here to try. It settles the case. It does not answer the question the community actually brought to court."
 kehillah_bet_din.0041.c:0 "Judge the man, not the letters."
 kehillah_bet_din.0041.c.pass.tt:0 "[kbd_litigant_b.GetFirstName]'s own standing in the community -- what kind of man he has shown himself to be, across every dealing anyone can recall -- is weighed carefully, and honestly."
 kehillah_bet_din.0041.c.fail.tt:0 "The weighing is rushed, more impression than judgment -- a fair method used carelessly is still a lesser ruling."

 kehillah_bet_din.0042.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0042.desc:0 "[kbd_litigant_a.GetFirstName]'s amulet, and [kbd_litigant_b.GetFirstName]'s own account of it, are laid before the other two judges of the Bet Din."
 kehillah_bet_din.0042.a:0 "Weigh the matter carefully."
 kehillah_bet_din.0042.b:0 "Defer to the host's own reasoning."

 kehillah_bet_din.0043.t:0 "The Ruling on the Cursed Amulet"
 kehillah_bet_din.0043.desc:0 "The Bet Din's verdict is recorded."
 kehillah_bet_din.0043.a:0 "So it is written."
 kehillah_bet_din.0043.great.tt:0 "A ruling reached with real care and real command of the case, whichever way it landed. No one doubts the Bet Din took this seriously."
 kehillah_bet_din.0043.good.tt:0 "A defensible ruling, competently reached. It holds."
 kehillah_bet_din.0043.poor.tt:0 "A poorly reasoned ruling. Whatever the panel decided, it does not sound like a court that was sure of itself."
 kehillah_bet_din.0043.guilty.tt:0 "[kbd_litigant_b.GetFirstName] is placed in cherem, cut off from the community's religious life, and the parchment itself is burned before witnesses -- whatever it was, it will not be worn again."
 kehillah_bet_din.0043.innocent.tt:0 "[kbd_litigant_b.GetFirstName] is vindicated. [kbd_litigant_a.GetFirstName] is reprimanded for bringing a serious accusation the court did not find grounds for -- nothing more, but nothing less either."

 # --- Case 6 (events/kehillah_bet_din_events.txt, ADDED 2026-09-15) ---
 kehillah_bet_din.0051.t:0 "The Silversmiths' Quarrel"
 kehillah_bet_din.0051.desc:0 "[kbd_litigant_a.GetFirstName]'s shop was smashed three nights ago -- a gentile mob, drunk and loud, that left every window broken and half his stock gone before it thought better of itself and scattered. He is a silversmith. So, as it happens, is [kbd_litigant_b.GetFirstName], two streets over and losing custom to him for a year now. [kbd_litigant_a.GetFirstName] swears he heard [kbd_litigant_b.GetFirstName]'s own name spoken in the crowd that night, more than once, spoken the way a man's name is spoken by people he has paid to say it.\n\n[kbd_litigant_b.GetFirstName] does not deny the rivalry. He denies everything else -- the mob was drunk, mobs shout names for no reason, and a competitor's ruin is not proof of a competitor's hand in it.\n\n#EMP Whatever happened that night, two things are certain: a shop lies in ruins, and two silversmiths hate each other more than they did a week ago.#!"
 kehillah_bet_din.0051.a:0 "Treat this as Mesirah -- he betrayed a fellow Jew to gentile hands."
 kehillah_bet_din.0051.a.pass.tt:0 "The case for actual intent -- not mere coincidence, not a name shouted by chance -- is built carefully, thread by thread, until it holds."
 kehillah_bet_din.0051.a.fail.tt:0 "The gravest charge the community has is leveled on evidence that, examined honestly, does not really bear its weight."
 kehillah_bet_din.0051.b:0 "Rule it Gerama -- liable for damage caused through another's hands."
 kehillah_bet_din.0051.b.pass.tt:0 "The distinction is drawn correctly and explained plainly: not the direct damage of a man's own fist, but real liability all the same for setting it in motion."
 kehillah_bet_din.0051.b.fail.tt:0 "The distinction is reached for but not quite grasped -- the ruling sounds like law without quite being sound law."
 kehillah_bet_din.0051.c:0 "Dismiss the charge. Rivalry is not evidence."
 kehillah_bet_din.0051.c.pass.tt:0 "The dismissal is handled with real skill -- both men leave the room still angry, but neither leaves it feeling cheated by the court itself."
 kehillah_bet_din.0051.c.fail.tt:0 "The dismissal lands badly -- to [kbd_litigant_a.GetFirstName], and to more than a few who hear of it, it sounds less like justice than like the court simply not wanting the trouble."

 kehillah_bet_din.0052.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0052.desc:0 "[kbd_litigant_a.GetFirstName]'s ruined shop, and [kbd_litigant_b.GetFirstName]'s own denial, are laid before the other two judges of the Bet Din."
 kehillah_bet_din.0052.a:0 "Press the case for Mesirah."
 kehillah_bet_din.0052.b:0 "Press the case for Gerama."
 kehillah_bet_din.0052.c:0 "Press the case for dismissal."

 kehillah_bet_din.0053.t:0 "The Ruling on the Silversmiths' Quarrel"
 kehillah_bet_din.0053.desc:0 "The Bet Din's verdict is recorded."
 kehillah_bet_din.0053.a:0 "So it is written."
 kehillah_bet_din.0053.great.tt:0 "A ruling reached with real command of the law and real conviction, whichever framework it settled on. No one doubts the Bet Din meant it."
 kehillah_bet_din.0053.good.tt:0 "A defensible ruling, competently reached. It holds."
 kehillah_bet_din.0053.poor.tt:0 "A poorly reasoned ruling. Whatever the panel decided, it does not sound like a court that was sure of itself."
 kehillah_bet_din.0053.mesirah.tt:0 "[kbd_litigant_b.GetFirstName] is placed in cherem as an informer, cut off from the community's religious life, and ordered to pay [kbd_litigant_a.GetFirstName] in full for the shop besides -- betrayal, the Bet Din rules, does not excuse a man from an honest debt."
 kehillah_bet_din.0053.gerama.tt:0 "[kbd_litigant_b.GetFirstName] is ordered to make [kbd_litigant_a.GetFirstName] whole for the shop -- liable for damage caused through another's hands, not innocent of it merely for not swinging the club himself."
 kehillah_bet_din.0053.dismissed.tt:0 "The charge is dismissed. [kbd_litigant_b.GetFirstName] walks away untouched; [kbd_litigant_a.GetFirstName] walks away with a ruined shop, no restitution, and a considerably lower opinion of the court that left him with neither."

 # --- Guest invite rules (common/activities/guest_invite_rules/kehillah_bet_din_invite_rules.txt) ---
 kehillah_bet_din_invite_rule_jewish_scholars:0 "Jewish Scholars"
 kehillah_bet_din_invite_rule_jewish_scholars_desc:0 "Independent Jewish rulers of particularly high Learning -- not required to attend, but word of a Bet Din conference reaches renowned scholars regardless of whose court they lead."
 kehillah_bet_din_invite_rule_jewish_adventurers:0 "Jewish Adventurers"
 kehillah_bet_din_invite_rule_jewish_adventurers_desc:0 "Landless Jewish adventurers -- not required to attend, but a gathering of this kind draws its share of wanderers too."

 # --- Travel flavor (events/kehillah_bet_din_travel_events.txt) ---
 kehillah_bet_din_travel.0001.t:0 "On the Road"
 kehillah_bet_din_travel.0001.desc:0 "The days on the road are long, and there is little to do but think. [ROOT.Char.GetFirstName] turns the docket's likely cases over and over, rehearsing arguments that may not even be the ones actually waiting at the end of the journey."
 kehillah_bet_din_travel.0001.a:0 "Onward."
 kehillah_bet_din_travel.0002.t:0 "A Fellow Traveller"
 kehillah_bet_din_travel.0002.desc:0 "A merchant on the same road asks, once he learns where [ROOT.Char.GetFirstName] is bound, whether the Bet Din takes requests from ordinary people or only disputes between the great and notable. [ROOT.Char.GetHerselfHimself|U] gives an answer that is mostly true."
 kehillah_bet_din_travel.0002.a:0 "Onward."

 # --- Closing ---

 kehillah_bet_din.0099.t:0 "The Docket Is Closed"
 # The tier-free original, now only the fallback for a session that
 # somehow closed without hearing a single case (no eligible case in a
 # very thin court). The four descs below are the real ones, picked by
 # the session score -- see kehillah_bet_din.0099 in events/kehillah_bet_din_events.txt.
 kehillah_bet_din.0099.desc:0 "The cases are heard, the rulings recorded. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave; the Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.landmark:0 "The cases are heard, the rulings recorded -- and this was not an ordinary session. Ruling after ruling came out clear, well-argued, and hard to quarrel with; the record of this docket is the kind that gets copied out and carried to other communities. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave knowing they sat on something that will be remembered -- and their own communities stand the steadier for having sat on it.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.strong:0 "The cases are heard, the rulings recorded. It was a good session -- the reasoning held, the parties left knowing why they had won or lost, and the court's standing is the better for it. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave satisfied, their own communities a little steadier for it too.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.adequate:0 "The cases are heard, the rulings recorded. Not every ruling was a triumph, and one or two will be argued over for years, but the docket was cleared and the court did its work. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave, a small measure of steadiness going home with them.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.failed:0 "The cases are heard, the rulings recorded -- and the record does the court no credit. More than one ruling was thin, and everyone who stood before the panel knows it; what was meant to settle these matters has instead given the community fresh grievances to nurse. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave quickly, and say little on the way out -- their own communities will hear of this docket too, and not kindly.\n\nThe Bet Din will not sit again for some years yet. Perhaps that is a mercy."
 kehillah_bet_din.0099.a:0 "Until it is called again."
 kehillah_bet_din.0099.landmark.tt:0 "A landmark session. This region's own Bet Din is spoken of with real authority now, and your own name with it."
 kehillah_bet_din.0099.strong.tt:0 "A well-ruled docket. The court's standing rises, and so does yours."
 kehillah_bet_din.0099.adequate.tt:0 "A serviceable session. The docket was cleared; little more can be claimed for it."
 kehillah_bet_din.0099.failed.tt:0 "A badly ruled docket. The court's authority is diminished, and convening it was your idea."

