# common/scripted_effects/kehillah_found_community_effects.txt, ADDED 2026-09-19) ---
d_kehillah_founder_test:0 "The Wandering Kehillah"
d_kehillah_founder_test_adj:0 "Wandering Kehillah"
kehillah_found_community_decision:0 "Found a Jewish Community"
 kehillah_found_community_decision_desc:0 "A wandering scholar can be more than a guest wherever he stops. With learning enough to teach and Torah enough to judge by, there is nothing stopping a minyan from gathering around him -- and a minyan that gathers is the seed of a Kehillah."
 kehillah_found_community_decision_tooltip:0 "Settle here and found a new Jewish community, becoming its rabbi and leader."
kehillah_found_community_decision_confirm:0 "Found the community"
kehillah_found_community_title_name:0 "Kehillah of [kehillah_founding_county.GetNameNoTierNoTooltip]"
kehillah_found_community_title_article:0 ""

 kehillah_rabbi_parshanut_book_desc_masterwork:0 "A close reading of a single passage, argued carefully enough that other yeshivot ask for copies."
 kehillah_rabbi_parshanut_book_masterwork_tt:0 "The reading holds up. Other yeshivot ask for copies."
 kehillah_rabbi_parshanut_book_desc_famed:0 "A commentary cited by name wherever the text itself is studied -- this reading has become part of how the passage is read."
 kehillah_rabbi_parshanut_book_famed_tt:0 "The reading spreads beyond anywhere you have taught -- scholars who have never met you cite it by name."
 kehillah_rabbi_parshanut_book_desc_illustrious:0 "A commentary that changes how the text itself is read, not just this one passage of it -- the kind later generations assume was always the plain meaning."
 kehillah_rabbi_parshanut_book_illustrious_tt:0 "You have not just read the passage well -- you have changed how it is read. Later generations will assume this was always the plain meaning."

 kehillah_rabbi_talmudics_book_desc_masterwork:0 "A single Talmudic argument, worked through with real rigor -- the kind of close reasoning students copy out to study the method, not just the conclusion."
 kehillah_rabbi_talmudics_book_masterwork_tt:0 "The argument holds together. Students copy it out to study the reasoning itself."
 kehillah_rabbi_talmudics_book_desc_famed:0 "An argument cited in yeshivot that have never heard of the community it was written in -- the reasoning itself has outgrown its author."
 kehillah_rabbi_talmudics_book_famed_tt:0 "The argument is cited in yeshivot that have never heard of you -- the reasoning has outgrown its author."
 kehillah_rabbi_talmudics_book_desc_illustrious:0 "A work of argumentation studied for the method as much as any single ruling in it -- the kind later scholars measure their own reasoning against."
 kehillah_rabbi_talmudics_book_illustrious_tt:0 "Later scholars will measure their own reasoning against this. That is not a small thing to have written."

 # HASHKAFA -- UPDATED 2026-09-15, was HALAKHA (a code of law; that
 # genre merged into Talmudics above). Genuinely re-flavored, not just
 # renamed -- worldview/philosophy, weighing outside wisdom against
 # revelation, not legal codification. See kehillah_rabbi_trait's own
 # header, common/traits/kehillah_traits.txt.
 kehillah_rabbi_hashkafa_book_desc_masterwork:0 "A modest treatise weighing the claims of philosophy against the claims of faith -- read with real interest by more than the household it was written in."
 kehillah_rabbi_hashkafa_book_masterwork_tt:0 "The argument holds together. It is read with real interest beyond your own household."
 kehillah_rabbi_hashkafa_book_desc_famed:0 "A work of worldview substantial enough that scholars of other faiths, not just your own, ask after a copy."
 kehillah_rabbi_hashkafa_book_famed_tt:0 "Scholars of other faiths, not just your own, ask after a copy -- the surest sign the argument reaches beyond its own community."
 kehillah_rabbi_hashkafa_book_desc_illustrious:0 "A reconciliation of reason and revelation weighed seriously for generations -- the kind later thinkers, Jewish and gentile alike, measure their own worldview against."
 kehillah_rabbi_hashkafa_book_illustrious_tt:0 "Later thinkers -- not only Jewish ones -- will measure their own worldview against this. That is not a small thing to have written."

 # Hebrew Poetry -- the fourth genre, ADDED 2026-09-09, gated on
 # lifestyle_poet rather than a kehillah_rabbi_trait track (poets do not
 # need to be rabbis to write).
 kehillah_book_poetry_desc_masterwork:0 "A modest cycle of Hebrew verse, competently turned -- read aloud at more than one table since it was written."
 kehillah_book_poetry_masterwork_tt:0 "The verses hold together. They are read aloud at more than one table."
 kehillah_book_poetry_desc_famed:0 "A cycle of verse copied and recited well beyond the household it was written for -- lines from it turning up, unattributed, in other poets' own work."
 kehillah_book_poetry_famed_tt:0 "Lines from it turn up, unattributed, in other poets' own work -- the surest sign it has actually spread."
 kehillah_book_poetry_desc_illustrious:0 "A work of Hebrew verse that outlasts the fashions it was written in -- the kind later poets measure their own ear against."
 kehillah_book_poetry_illustrious_tt:0 "Later poets will measure their own ear against this. That is not a small thing to have written."

