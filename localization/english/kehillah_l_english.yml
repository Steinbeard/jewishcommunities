 # FIXED 2026-09-15, same broken GetDeJureLiege chain as _host_desc above
 # -- dropped the region-name reference entirely rather than replacing it,
 # since a co-judge here may be a fellow community leader, a courtier, or
 # an independent scholar/adventurer, not necessarily anyone from "the"
 # region at all (THE PANEL, kehillah_bet_din_conference.txt's own header).
 # REWRITTEN AGAIN 2026-09-17 for the same reason as _guest_desc above --
 # no longer states co-judgeship as a given.
 activity_kehillah_bet_din_conference_guest_help_text:0 "You have come to this Bet Din. If you are among the most distinguished who attend, you may sit as a co-judge -- your own scholarship shapes how well each case is ruled."
 activity_kehillah_bet_din_conference_selection_tooltip:0 "Convene a Bet Din of your own minhag region."
 activity_kehillah_bet_din_conference_destination_selection:0 "Convene the Bet Din"
 activity_kehillah_bet_din_conference_predicted_cost:0 "No cost to convene, beyond the standing of the ruling itself."
 TRAVEL_NAME_FOR_activity_kehillah_bet_din_conference:0 "Travelling to the Bet Din Conference"

