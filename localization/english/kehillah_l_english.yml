 kehillah_learn_torah_journey.0001.t:0 "A Foreign Beit Midrash"
 kehillah_learn_torah_journey.0001.desc:0 "[kehillah_journey_host.GetTitledFirstName] welcomes you to the library. You can study works here that are unavailable at home."
 kehillah_learn_torah_journey.0001.desc.fallback:0 "A foreign community's library is laid open to you, a guest with no claim on it beyond a fellow scholar's welcome. It would be a waste to come this far and not take up something you cannot read at home."
 kehillah_learn_torah_journey.0001.a:0 "See what works of Parshanut they hold."
 kehillah_learn_torah_journey.0001.b:0 "See what works of Talmudics they hold."
 kehillah_learn_torah_journey.0001.c:0 "See what works of Hashkafa they hold."
 kehillah_learn_torah_journey.0001.d:0 "Thank your hosts, and head for home."
 kehillah_learn_torah_journey.0001.d.tt:0 "You thank your hosts and begin the journey home."

 # REWORKED 2026-09-17: picking a track used to study a random work in it
 # immediately (kehillah_study_<track>_effect's own random_list, common/
 # scripted_effects/kehillah_library_effects.txt); now it opens one of
 # these three events instead, listing that track's actually-owned works
