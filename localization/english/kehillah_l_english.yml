 # --- The event chain (events/kehillah_book_events.txt) ---
 kehillah_book.0001.t:0 "What to Write"
 kehillah_book.0001.desc:0 "You have cleared a table for your notes and asked the scribe to set aside parchment. Before you begin, you must choose what to write."
 kehillah_book.0001.a:0 "A responsum, with its sources and ruling."
 kehillah_book.0001.b:0 "A commentary on the text itself."
 kehillah_book.0001.c:0 "An argument in the Talmudic style, worked through completely."
 kehillah_book.0001.d:0 "A cycle of Hebrew verse."

 kehillah_book.0002.t:0 "Where to Begin"
 kehillah_book.0002.desc:0 "The parchment is ready. Do you begin with the sources, a colleague's questions, or a case you know firsthand?"
 kehillah_book.0002.a:0 "Study the sources alone, without distraction."
 kehillah_book.0002.a.pass.tt:0 "Working alone, you find a passage that gives the work a clear beginning."
 kehillah_book.0002.a.fail.tt:0 "You fill pages of notes but still have no clear beginning."
 kehillah_book.0002.b:0 "Seek out a respected colleague's thinking on it first."
 kehillah_book.0002.b.pass.tt:0 "Their perspective sharpens your own before you have written a word."
 kehillah_book.0002.b.fail.tt:0 "The conversation goes nowhere useful, and you have learned nothing you did not already know."
 kehillah_book.0002.c:0 "Begin with a dispute brought before the community."
 kehillah_book.0002.c.tt:0 "The case gives you a concrete question to work through."
 kehillah_book.0002.d:0 "Draw on a Bet Din ruling you sat on and argued well."
 kehillah_book.0002.d.tt:0 "You return to the testimony and ruling from a case you judged."

 kehillah_book.0003.t:0 "A Second Opinion"
 kehillah_book.0003.desc.courtier:0 "[kbd_book_courtier.GetFirstName] could help you test the argument in your draft. You have reached a difficult passage, and would welcome another reader's opinion."
 kehillah_book.0003.desc.alone:0 "No one in the household can help with this subject. You will need to check the argument yourself."
 kehillah_book.0003.a:0 "Debate it with [kbd_book_courtier.GetFirstName], point by point."
 kehillah_book.0003.a.pass.tt:0 "The discussion helps you answer several objections to your argument."
 kehillah_book.0003.a.fail.tt:0 "The debate exposes more weaknesses than it resolves."
 kehillah_book.0003.a.lucky_tt:0 "[kbd_book_courtier.GetFirstName] suggests an explanation that improves the draft."
 kehillah_book.0003.a.unlucky_tt:0 "The discussion produces no further improvements."
 kehillah_book.0003.b:0 "Ask [kbd_book_courtier.GetFirstName] for an initial impression."
 kehillah_book.0003.b.tt:0 "Their response helps you see which passages need explaining more clearly."
 kehillah_book.0003.c:0 "Work through it alone instead."
 kehillah_book.0003.c.tt:0 "No voice but your own shapes the work."

 kehillah_book.0004.t:0 "One More Pass"
 kehillah_book.0004.desc:0 "The manuscript is ready to copy. A final revision could improve it, but would mean more late nights at your desk."
 kehillah_book.0004.a:0 "Revise it thoroughly, however long it takes."
 kehillah_book.0004.a.tt:0 "The revisions improve the manuscript, but the extra work leaves you strained."
 kehillah_book.0004.b:0 "It says what it needs to say. Let it stand."
 kehillah_book.0004.b.tt:0 "You finish the manuscript without further revisions."

 kehillah_book.0005.t:0 "The Book Is Finished"
 kehillah_book.0005.desc:0 "The last page is written. The scribe can now prepare a fair copy."
 kehillah_book.0005.a:0 "So it is done."

 kehillah_book.0006.t:0 "Sending Copies"
 kehillah_book.0006.desc:0 "The scribe has made copies for the other communities of Sh'um. Messengers take them down the Rhine."
 kehillah_book.0006.a:0 "Let them go."

 kehillah_book.0007.t:0 "A New Book Arrives"
 kehillah_book.0007.desc.hashkafa:0 "A treatise on faith and philosophy has arrived from [kehillah_book_author.GetTitledFirstName]."
 kehillah_book.0007.desc.parshanut:0 "A commentary has arrived from [kehillah_book_author.GetTitledFirstName], offering new interpretations to discuss in the study hall."
 kehillah_book.0007.desc.talmudics:0 "A work of Talmudic scholarship has arrived from [kehillah_book_author.GetTitledFirstName]."
 kehillah_book.0007.desc.poetry:0 "A collection of verse has arrived from [kehillah_book_author.GetTitledFirstName]."
 kehillah_book.0007.desc.generic:0 "A finished work has reached your own community's shelves from elsewhere in Sh'um."
 kehillah_book.0007.a:0 "Add it to the shelves."
 kehillah_book.0007.a.tt:0 "Reading the new work adds to your learning."


