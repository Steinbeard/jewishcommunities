 activity_kehillah_bet_din_conference_name:0 "Bet Din Conference"
 activity_kehillah_bet_din_conference_desc:0 "Convene a panel of judges to hear disputes, weigh testimony and record rulings together."
 activity_kehillah_bet_din_conference_province_desc:0 "Convene a panel of judges to hear disputes, weigh testimony and record rulings together."
 # FIXED 2026-09-15: [GetPlayer.GetPrimaryTitle.GetDeJureLiege...] was left
 # over from the v6 spec's de jure duchy design and broke live -- every
 # Kehillah community title has been FLAT since the v7 pass (common/landed_
