 kehillah_shum_takkanah_decision:0 "Convene the Bet Din of Sh'um"
 kehillah_shum_takkanah_decision_desc:0 "Worms, Speyer and Mainz do not answer to each other -- but they are not strangers either. When the standing rabbis of the three communities judge the moment serious enough, they can sit together as a single Bet Din and issue a takkanah: a ruling every one of the three communities is expected to live by, not just the one that convened it.\n\nThis is not done lightly, and not done often."
 kehillah_shum_takkanah_decision_tooltip:0 "Convene the joint rabbinical court of Sh'um to issue a binding communal ordinance."
 kehillah_shum_takkanah_decision_confirm:0 "Convene the Bet Din"

