l_english:

 #####################################################################
 # Kehillah -- Phase 1 localization.
 #
 # Sourced from docs/spec/v1-kehillah-community.md and
 # docs/scenarios/worms-1066.md. Terminology notes:
 #
 #  - "Kehillah" (plural Kehillot) is the ordinary Hebrew word for an
 #    organised Jewish community. It is the mod's own term, not a
 #    coinage.
 #  - "Shtadlan" is the historical term for a community's intercessor
 #    with outside authority. Left untranslated on purpose; there is no
 #    good one-word English equivalent, and the word carries the whole
 #    idea.
 #  - "Beit Midrash" (house of study), "Mikvah" (ritual bath),
 #    "Tzedakah" (charity, more precisely righteous obligation),
 #    "Gabbai" (communal treasurer/warden), "Genizah" (storeroom for
 #    worn sacred texts) are likewise real terms used in their real
 #    senses.
 #  - "Parnas" is the historical title for a lay communal leader; it is
 #    used in a couple of descriptions where "the leader" would read
 #    flatly.
 #####################################################################


 #####################################################################
 # GOVERNMENT
 #####################################################################

 kehillah_government:0 "Kehillah"
 kehillah_government_adjective:0 "Communal"
 kehillah_government_realm:0 "Kehillah"
 kehillah_government_desc:0 "#F A Kehillah is an organised Jewish community living inside somebody else's realm. It holds no land and commands no armies. What it holds is itself: a synagogue, a study hall, a treasury, and the right to govern its own affairs.#!\n\nStanding here is earned through #EMP competence and learning#!, not through plots. Leadership passes to whoever the community judges best fit for it, whatever family they were born into."

 kehillah_government_tt:0 "Leads a #EMP Kehillah#!"


 #####################################################################
 # DOMICILE
 #####################################################################

 kehillah_quarter:0 "Kehillah Quarter"
 kehillah_quarter_desc:0 "The community's own streets: the synagogue at their heart, and around it the halls, workshops and stalls that a congregation builds for itself over generations."


 #####################################################################
 # TITLE
 #####################################################################

 d_kehillah_worms:0 "Kehillah of Worms"
 d_kehillah_worms_desc:0 "The Jewish community of Worms on the Rhine. Its synagogue was raised in 1034, and its yeshiva draws students from across the Rhineland."


 #####################################################################
 # SUCCESSION
 #####################################################################

 kehillah_appointment_succession_law:0 "Communal Appointment"
 kehillah_appointment_succession_law_subname:0 "The Community Chooses Its Own Leader"
 kehillah_appointment_succession_law_effects:0 "When the leader of the community dies, the [Kehillah|E] appoints whichever eligible figure it judges most worthy. #EMP Bloodline carries little weight.#! Learning, standing in the community, and holding one of its offices count for far more.\n\nThe candidates include the leader's family, but also the community's own officers -- the Chief Rabbi, the Treasurer and the Shtadlan -- who need be no relation at all."

 # Candidate score breakdown lines.
 kehillah_score_learning_desc:0 "Learning"
 kehillah_score_stewardship_desc:0 "Stewardship"
 kehillah_score_diplomacy_desc:0 "Diplomacy"
 kehillah_score_influence_desc:0 "Standing in the community"
 kehillah_score_no_influence_desc:0 "No standing in the community"
 kehillah_score_officer_desc:0 "Holds an office of the community"
 kehillah_score_piety_desc:0 "Piety"
 kehillah_score_dynasty_prestige_desc:0 "Renown of their family"
 kehillah_score_mature_desc:0 "Old enough to be taken seriously"
 kehillah_score_elder_desc:0 "An elder of the community"
 kehillah_score_very_aged_desc:0 "Very aged"
 kehillah_score_theologian_desc:0 "A dedicated scholar of the faith"
 kehillah_score_scholar_desc:0 "A scholar"
 kehillah_score_just_desc:0 "Just"
 kehillah_score_patient_desc:0 "Patient"
 kehillah_score_compassionate_desc:0 "Compassionate"
 kehillah_score_arbitrary_desc:0 "Arbitrary -- the community does not trust their judgement"
 kehillah_score_greedy_desc:0 "Greedy -- the community does not trust them with its purse"
 kehillah_score_incapable_desc:0 "Not able to serve"
 kehillah_score_wrong_faith_desc:0 "Not of the community's faith"
 kehillah_score_same_culture_desc:0 "One of the community's own"
 kehillah_score_friend_desc:0 "A friend of the late leader"


 #####################################################################
 # BUILDINGS -- THE SYNAGOGUE
 #####################################################################

 kehillah_synagogue_01_domicile_building:0 "Synagogue"
 kehillah_synagogue_01_domicile_building_desc:0 "A plain stone hall with an ark for the scrolls and benches enough for the men of the town. Modest, and entirely sufficient."

 kehillah_synagogue_02_domicile_building:0 "Enlarged Synagogue"
 kehillah_synagogue_02_domicile_building_desc:0 "The hall has been extended, a women's section added along the northern wall, and the roof raised. The congregation has outgrown its first building and said so."

 kehillah_synagogue_03_domicile_building:0 "Great Synagogue"
 kehillah_synagogue_03_domicile_building_desc:0 "Vaulted, pillared, and known well beyond this town. Travellers ask directions to it by name.\n\n#N Prominence is not only an asset. A building people can find is a building people can trouble.#!"

 kehillah_synagogue_04_domicile_building:0 "Synagogue and Court"
 kehillah_synagogue_04_domicile_building_desc:0 "A courtyard now adjoins the hall, where the community's court sits and its disputes are heard in the open."

 kehillah_synagogue_05_domicile_building:0 "The Great House of the Community"
 kehillah_synagogue_05_domicile_building_desc:0 "Synagogue, court, school and hall together, a quarter unto itself. Rulings issued here are cited in communities that will never see it."


 #####################################################################
 # BUILDINGS -- BEIT MIDRASH
 #####################################################################

 kehillah_beit_midrash_01_domicile_building:0 "Beit Midrash"
 kehillah_beit_midrash_01_domicile_building_desc:0 "A house of study: a room, a table, and men arguing over a page late into the night.\n\n#N Allows a #EMP Chief Rabbi#! to be appointed.#!"

 kehillah_beit_midrash_02_domicile_building:0 "Scribes' Room"
 kehillah_beit_midrash_02_domicile_building_desc:0 "Copyists work here, and the community's collection of texts is no longer kept in a single chest."

 kehillah_beit_midrash_03_domicile_building:0 "Yeshiva"
 kehillah_beit_midrash_03_domicile_building_desc:0 "A full academy, with students who came here on purpose and from far away. This is where lasting work gets written."


 #####################################################################
 # BUILDINGS -- COUNTINGHOUSE
 #####################################################################

 kehillah_countinghouse_01_domicile_building:0 "Countinghouse"
 kehillah_countinghouse_01_domicile_building_desc:0 "The community's chest, its ledgers, and a locked door.\n\n#N Allows a #EMP Treasurer#! to be appointed.#!"

 kehillah_countinghouse_02_domicile_building:0 "Ledger Room"
 kehillah_countinghouse_02_domicile_building_desc:0 "Proper accounts, kept year on year. Nobody has to remember who owes what."

 kehillah_countinghouse_03_domicile_building:0 "Communal Treasury"
 kehillah_countinghouse_03_domicile_building_desc:0 "Deposits, loans and the funds of orphans and widows, all held and reckoned separately. The community is trusted with money, which is its own kind of standing."


 #####################################################################
 # BUILDINGS -- SHTADLAN'S CHAMBERS
 #####################################################################

 kehillah_shtadlan_chambers_01_domicile_building:0 "Shtadlan's Chambers"
 kehillah_shtadlan_chambers_01_domicile_building_desc:0 "A room set aside for the man who speaks to the authorities on the community's behalf, and for the waiting that job involves.\n\n#N Allows a #EMP Shtadlan#! to be appointed.#!"

 kehillah_shtadlan_chambers_02_domicile_building:0 "Chambers and Archive"
 kehillah_shtadlan_chambers_02_domicile_building_desc:0 "Every charter, privilege and promise the community has ever been granted, copied and kept. Arguments go better when you can produce the document."

 kehillah_shtadlan_chambers_03_domicile_building:0 "House of Advocacy"
 kehillah_shtadlan_chambers_03_domicile_building_desc:0 "A standing office with clerks and a practised routine. The community no longer improvises when it is summoned."


 #####################################################################
 # BUILDINGS -- COMMUNAL WATCH
 #####################################################################

 kehillah_communal_watch_01_domicile_building:0 "Communal Watch"
 kehillah_communal_watch_01_domicile_building_desc:0 "Men of the community taking turns at the quarter's gate at night. Not soldiers. Enough to make trouble inconvenient."

 kehillah_communal_watch_02_domicile_building:0 "Watch House"
 kehillah_communal_watch_02_domicile_building_desc:0 "A proper roster, a bell, and a room to sit in out of the rain. Organised enough that people notice it is organised."


 #####################################################################
 # BUILDINGS -- MIKVAH
 #####################################################################

 kehillah_mikvah_01_domicile_building:0 "Mikvah"
 kehillah_mikvah_01_domicile_building_desc:0 "A ritual bath, cut down to the groundwater as the law requires. One of the first things any community builds, and often the last thing it abandons."

 kehillah_mikvah_02_domicile_building:0 "Vaulted Mikvah"
 kehillah_mikvah_02_domicile_building_desc:0 "Stone steps down to clean, cold, living water, under a vaulted roof. Well built, and built to last."


 #####################################################################
 # BUILDINGS -- COMMUNAL HALL
 #####################################################################

 kehillah_communal_hall_01_domicile_building:0 "Communal Hall"
 kehillah_communal_hall_01_domicile_building_desc:0 "Where the community meets, argues, celebrates, and puts up whoever has arrived without anywhere to stay."

 kehillah_communal_hall_02_domicile_building:0 "Hall and Guest House"
 kehillah_communal_hall_02_domicile_building_desc:0 "Beds for travellers and a table for visiting scholars. News, letters and rulings arrive with the guests."


 #####################################################################
 # BUILDINGS -- EXTERNAL
 #####################################################################

 kehillah_market_stalls_01_domicile_building:0 "Market Stalls"
 kehillah_market_stalls_01_domicile_building_desc:0 "A handful of stalls at the edge of the town market."

 kehillah_market_stalls_02_domicile_building:0 "Market Row"
 kehillah_market_stalls_02_domicile_building_desc:0 "A permanent row with lock-ups behind, held by families of the community."

 kehillah_market_stalls_03_domicile_building:0 "Merchants' Quarter"
 kehillah_market_stalls_03_domicile_building_desc:0 "Warehousing, credit and contacts in other towns. Trade that does not depend on any one market day."

 kehillah_workshops_01_domicile_building:0 "Craft Workshops"
 kehillah_workshops_01_domicile_building_desc:0 "Workshops along the lane: a goldsmith, a dyer, a man who mends anything."

 kehillah_workshops_02_domicile_building:0 "Established Workshops"
 kehillah_workshops_02_domicile_building_desc:0 "Trades passed from father to son, with apprentices and a reputation."

 kehillah_workshops_03_domicile_building:0 "Renowned Workshops"
 kehillah_workshops_03_domicile_building_desc:0 "Work from these lanes is sought by name, and by people who would not otherwise come here."


 #####################################################################
 # OFFICERS
 #####################################################################

 chief_rabbi_kehillah_position:0 "Chief Rabbi"
 chief_rabbi_kehillah_position_desc:0 "The community's authority on law and learning. Rules on questions put to him, teaches in the Beit Midrash, and answers letters from communities with no scholar of their own.\n\n#N Requires a #EMP Beit Midrash#!.#!"

 treasurer_kehillah_position:0 "Gabbai"
 treasurer_kehillah_position_desc:0 "The warden of the community's chest. Collects what is owed, pays what is due, and keeps the accounts that let the community be trusted with other people's money.\n\n#N Requires a #EMP Countinghouse#!.#!"

 shtadlan_kehillah_position:0 "Shtadlan"
 shtadlan_kehillah_position_desc:0 "The community's advocate before outside authority. Carries petitions, argues charters, and is the first person sent for when an official arrives with a demand.\n\n#N Requires the #EMP Shtadlan's Chambers#!.#!"

 kehillah_requires_beit_midrash_tt:0 "The community has a #EMP Beit Midrash#!"
 kehillah_requires_countinghouse_tt:0 "The community has a #EMP Countinghouse#!"
 kehillah_requires_shtadlan_chambers_tt:0 "The community has the #EMP Shtadlan's Chambers#!"
 kehillah_officer_same_faith_tt:0 "Is of the community's faith"


 #####################################################################
 # DECISIONS
 #####################################################################

 decision_group_type_kehillah:0 "Community Decisions"

 kehillah_mediate_dispute_decision:0 "Mediate a Dispute Between Families"
 kehillah_mediate_dispute_decision_desc:0 "Two of the community's families have fallen out, and the quarrel has gone on long enough that people are choosing sides at prayer.\n\nThere is no court above yours to appeal to and no lord who will hear it. They have come to you because you are who they come to. #EMP You will settle this by being right and being trusted, or not at all.#!"
 kehillah_mediate_dispute_decision_tooltip:0 "Settle a quarrel between notable families of the community."
 kehillah_mediate_dispute_decision_confirm:0 "Hear them out"

 kehillah_mediate_dispute_great_tt:0 "Your judgement is accepted by both families, and remembered."
 kehillah_mediate_dispute_good_tt:0 "You find a settlement both families can live with."
 kehillah_mediate_dispute_poor_tt:0 "You fumble it in front of everyone. The quarrel outlives your attempt to end it."

 kehillah_distribute_tzedakah_decision:0 "Distribute Tzedakah"
 kehillah_distribute_tzedakah_decision_desc:0 "The chest is opened for the community's poor: for widows, for orphans, for the family whose workshop burned, and for travellers who arrived with nothing.\n\nThis is not generosity. #EMP It is an obligation#!, and the community knows the difference -- which is precisely why meeting it so publicly is also how a leader is judged."
 kehillah_distribute_tzedakah_decision_tooltip:0 "Spend from the community chest on those who need it."
 kehillah_distribute_tzedakah_decision_confirm:0 "Open the chest"

 kehillah_distribute_tzedakah_tt:0 "The community's poor are provided for, and the community notices who provided."

 kehillah_compose_commentary_decision:0 "Compose a Commentary"
 kehillah_compose_commentary_decision_desc:0 "You have been turning a difficulty over for years -- a passage everyone reads past, a contradiction the accepted reading does not resolve.\n\nSetting it down properly will take months of work that the community's business will have to do without. #EMP What survives of a scholar is what they wrote.#!"
 kehillah_compose_commentary_decision_tooltip:0 "Set down your scholarship in writing."
 kehillah_compose_commentary_decision_confirm:0 "Begin the work"

 kehillah_requires_learning_8_tt:0 "You have the learning to attempt it"
 kehillah_compose_commentary_ordinary_tt:0 "A sound piece of work. It is copied, read, and argued with."
 kehillah_compose_commentary_masterwork_tt:0 "The work outgrows its author. Copies leave the yeshiva for communities you will never visit."
 kehillah_compose_commentary_masterwork_no_dlc_tt:0 "The work outgrows its author. Copies leave the yeshiva for communities you will never visit."
 kehillah_commentary_artifact_desc:0 "A commentary composed in the yeshiva, copied by hand and carried far beyond the town it was written in."


 #####################################################################
 # MODIFIERS
 #####################################################################

 kehillah_settled_dispute_modifier:0 "Quarrel Settled"
 kehillah_tzedakah_modifier:0 "Tzedakah Distributed"
 kehillah_shaken_community_modifier:0 "Shaken Community"
 kehillah_emboldened_community_modifier:0 "Confident Community"


 #####################################################################
 # PROTECTION EVENTS
 #####################################################################

 kehillah.0001.t:0 "The Bailiff's Demand"
 kehillah.0001.desc:0 "The bailiff has come again, and this time he has brought two men with him and a figure in mind.\n\nHe is careful never to call it a fine. There is a word for what it is, and everyone in the room knows the word, and nobody says it. He waits, pleasantly, for you to be reasonable."

 kehillah.0001.a:0 "Let the Shtadlan speak for us."
 kehillah.0001.a.success.tt:0 "The demand is talked down to nothing, courteously, over the course of an afternoon. The community sees that it has someone who can do this."
 kehillah.0001.a.partial.tt:0 "He talks the figure down, though not away. Something still changes hands."

 kehillah.0001.b:0 "Pay him and be done with it."
 kehillah.0001.b.tt:0 "The money is counted out. He will be back, and everyone understands that he will be back."

 kehillah.0001.c:0 "The watch will see him out."
 kehillah.0001.c.success.tt:0 "He finds the quarter unhelpful, the streets full, and the whole business more trouble than it is worth."
 kehillah.0001.c.failure.tt:0 "He leaves angry and empty-handed, which is not the same as leaving. The community spends a nervous season."

 kehillah.0001.d:0 "Endure it."
 kehillah.0001.d.tt:0 "Nothing is paid and nothing is said. It is noted, by him and by the community, that nothing was done."

 kehillah.0002.t:0 "An Ugly Rumour"
 kehillah.0002.desc:0 "A story is going round the market with nothing at all underneath it. You know where it started, which is to say you know it started with someone who owed money and wanted a reason not to pay.\n\nThat has never yet stopped a story. It is repeated with each telling a little more certain than the last."

 kehillah.0002.a:0 "Send the Shtadlan to answer it."
 kehillah.0002.a.success.tt:0 "He puts the case plainly to people who matter, and the story loses its footing."
 kehillah.0002.a.partial.tt:0 "He does what he can. The story thins without quite dying."

 kehillah.0002.b:0 "A quiet gift to the right people."
 kehillah.0002.b.tt:0 "Money moves discreetly, and the story becomes less interesting to repeat."

 kehillah.0002.c:0 "Say nothing. It will burn out."
 kehillah.0002.c.wise.tt:0 "You have seen this before. Answering it would only have fed it, and you were right: within a month nobody can remember who started it."
 kehillah.0002.c.tt:0 "It does burn out, eventually. It takes longer than you expected, and it leaves a mark."

 kehillah.0003.t:0 "Stones in the Night"
 kehillah.0003.desc:0 "Shutters broken, the synagogue door scarred, and a great deal of shouting some time after midnight. Boys with drink in them, most likely, and nobody hurt.\n\nBy morning it is only mess and expense. The community is looking to see what you do about it, which is a separate question from how bad it was."

 kehillah.0003.a:0 "Set the watch on the lanes."
 kehillah.0003.a.success.tt:0 "The watch is out for a fortnight, visibly and in numbers. There is no second night."
 kehillah.0003.a.partial.tt:0 "The watch turns out. It is something, and the community is glad of it."

 kehillah.0003.b:0 "Take it to the authorities."
 kehillah.0003.b.success.tt:0 "A complaint is lodged properly and taken seriously enough to matter. Someone's father hears about it."
 kehillah.0003.b.partial.tt:0 "The complaint is heard, written down, and filed."

 kehillah.0003.c:0 "Repair it and carry on."
 kehillah.0003.c.tt:0 "The shutters are replaced and the door is planed smooth by the end of the week. Things that break here get fixed here."

 kehillah.0003.d:0 "Leave it."
 kehillah.0003.d.tt:0 "The scars stay in the door. People walk past them every day on the way in."


 #####################################################################
 # BOOKMARK
 #####################################################################

 bm_1066_kehillah_worms:0 "The Kehillah of Worms"
 bm_1066_kehillah_worms_desc:0 "On the Rhine, in a town belonging to a bishop, a Jewish community keeps its own law, its own accounts and its own school. Its synagogue has stood for thirty-two years. Its yeshiva teaches students who will be remembered longer than most of the princes fighting over the map.\n\nYou own nothing you stand on. You command no soldiers. What you have is a congregation that has agreed to be governed by you, for exactly as long as you are worth governing by.\n\n#bold Build the quarter, teach the students, keep the peace between the families -- and know that the man who follows you need not be your son.#!"

 bookmark_kehillah_worms_isaac:0 "Isaac ben Eliezer ha-Levi"
 bookmark_kehillah_worms_isaac_desc:0 "Head of the yeshiva and chief rabbi of Worms since 1064, when he succeeded Yaakov ben Yakar. Among his students is a young man from Troyes named Shlomo Yitzchaki, who will be known to every later generation as Rashi.\n\nHe is an old man already, and what he leaves behind will not be an inheritance. It will be an institution, and whoever the community judges fit to lead it.\n\n#N Some sources render his father's name Eleazar rather than Eliezer. The same man.#!"

 bookmark_kehillah_worms_alt_siegfried:0 "Bishop Siegfried"
 bookmark_kehillah_worms_alt_siegfried_desc:0 "Bishop of Worms, and lord of the ground the community stands on. Its charters are his to grant, confirm, or quietly forget about.\n\nHe is not an enemy. He is a landlord, a court of appeal, and a fact of life."

 BOOKMARK_RELATION_KEHILLAH_HOST:0 "(Lord of the Town)"
