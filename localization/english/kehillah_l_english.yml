 kehillah_study_torah:1 "Study Torah"
 kehillah_study_torah_action:0 "Studying Torah"
 kehillah_study_torah_scheme_desc_general:0 "A rabbi who has taken up an ongoing course of study, reading through their own community's library one work at a time for as long as it continues."
 KEHILLAH_STUDY_TORAH_SCHEME_SUCCESS_DESC:0 "Another season of study is done."
 kehillah_study_torah_scheme_learning_modifier:0 "Learning"
 kehillah_study_torah_scheme_rabbi_modifier:0 "A rabbi's own training"

 kehillah_study_torah_book_lost_title:0 "A Book No Longer on the Shelf"
 kehillah_study_torah_book_lost_tt:0 "The very volume you were reading has left the Beit Midrash's own shelves since you last opened it. You set it aside and take up something else the library still holds."

 # --- kehillah_study_torah.0001 (phase-completion: mastery, then automatic continuation) ---
 kehillah_study_torah.0001.t:0 "A Course of Study Continues"
 kehillah_study_torah.0001.desc:0 "Another stretch of your ongoing reading draws to a close. The next volume has already been chosen from the works your library holds."
 kehillah_study_torah.0001.mastered_desc:0 "You have worked through the book and can now explain its central arguments to a pupil."
 kehillah_study_torah.0001.unmastered_desc:0 "You have finished reading the book, but several arguments remain unclear. You will need further study to master it."
 kehillah_study_torah.0001.repeat_mastered_desc:0 "Rereading the book has helped you understand passages you gave less attention to before."
 kehillah_study_torah.0001.repeat_unmastered_desc:0 "You have read the book again, but still struggle to explain its argument. Further study may help."
 kehillah_study_torah.0001.a:0 "Take up the next book."

 # --- kehillah_study_torah.0002 (the chosen work, shown when the scheme starts) ---
 kehillah_study_torah.0002.t:0 "The Text Before You"
 kehillah_study_torah.0002.a:0 "Open the book."
 kehillah_study_torah.0002.targum_onkelos_desc:0 "You open Targum Onkelos, the old Aramaic Torah, and begin reading its rendering of the Hebrew line by line. The translator's choices will become part of how you see the text itself."
 kehillah_study_torah.0002.mekhilta_desc:0 "You open the Mekhilta and begin following its reading of Exodus clause by clause, where a small word can carry an entire argument."
 kehillah_study_torah.0002.genesis_rabbah_desc:0 "You open Genesis Rabbah and enter its readings of Bereshit, where the old stories keep opening into stranger and richer meanings."
 kehillah_study_torah.0002.pirkei_derabbi_eliezer_desc:0 "You open Pirkei De-Rabbi Eliezer and begin its retelling of the ancient stories, where the familiar narrative refuses to stay plain."
 kehillah_study_torah.0002.mishnah_desc:0 "You open the Mishnah and begin working case by case through its spare, exacting language, where the silence around a ruling can matter as much as the ruling itself."
 kehillah_study_torah.0002.bavli_zeraim_desc:0 "You open the Bavli's Seder Zeraim: most of it is Mishnah alone, while Berakhot carries the Bavli's own Gemara this far into the order."
 kehillah_study_torah.0002.bavli_moed_desc:0 "You open the Bavli's Seder Moed and enter its arguments over festivals, sacred time, and exactly when one day yields to the next."
 kehillah_study_torah.0002.bavli_nashim_desc:0 "You open the Bavli's Seder Nashim, where marriage, divorce, vows, and obligations turn on distinctions too fine to leave to memory alone."
 kehillah_study_torah.0002.bavli_nezikin_desc:0 "You open the Bavli's Seder Nezikin and enter its world of damages, courts, testimony, and arguments over what justice can require."
 kehillah_study_torah.0002.bavli_kodashim_desc:0 "You open the Bavli's Seder Kodashim, where rites for a Temple that no longer stands are argued with the precision of an institution still present."
 kehillah_study_torah.0002.bavli_tahorot_desc:0 "You open the Bavli's Seder Tahorot and begin with its many layers of Mishnah, Niddah standing out as the place where Bavli Gemara returns most fully."
 kehillah_study_torah.0002.yerushalmi_zeraim_desc:0 "You open the Yerushalmi's Seder Zeraim and begin reading the ground its Bavli counterpart mostly leaves to the Mishnah alone."
 kehillah_study_torah.0002.yerushalmi_moed_desc:0 "You open the Yerushalmi's Seder Moed, whose terser rulings on sacred time often demand a second reading before they settle."
 kehillah_study_torah.0002.yerushalmi_nashim_desc:0 "You open the Yerushalmi's Seder Nashim and find its rulings on marriage sometimes departing from the answers you thought the Bavli had settled."
 kehillah_study_torah.0002.yerushalmi_nezikin_desc:0 "You open the Yerushalmi's Seder Nezikin and enter its distinct way of arguing damages, courts, and the repair of wrongs."
 kehillah_study_torah.0002.halakhot_gedolot_desc:0 "You open the Halakhot Gedolot, its rulings laid out in the settled voice of a code rather than the combative voice of an argument."
 kehillah_study_torah.0002.sefer_yetzirah_desc:0 "You open the Sefer Yetzirah and begin its account of creation through letter and number, where language itself becomes an instrument of making."
 kehillah_study_torah.0002.emunot_vedeot_desc:0 "You open Saadia Gaon's Book of Beliefs and Opinions and begin weighing revelation against what reason alone can prove."
 kehillah_study_torah.0002.chovot_halevavot_desc:0 "You open the Duties of the Heart, a work concerned less with what you do than with what you actually feel while doing it."
 kehillah_study_torah.0002.kuzari_desc:0 "You open the Kuzari, where a pagan king questions a rabbi hard enough that your own answers will have to become precise."
 kehillah_study_torah.0002.hekhalot_rabbati_desc:0 "You open Hekhalot Rabbati and begin its account of ascent through the seven halls, a map of heaven that does not grow smaller with familiarity."
 kehillah_study_torah.0002.shiur_qomah_desc:0 "You open the Shi'ur Qomah and confront its measures of the divine form, too vast to hold in the mind all at once."
 kehillah_study_torah.0002.sefer_harazim_desc:0 "You open the Sefer HaRazim and begin working down through its heavens and the angels who keep each one."

 # --- kehillah_study_torah.0003 (rare same-track insight) ---
 kehillah_study_torah.0003.t:0 "A Thread Between Texts"
 kehillah_study_torah.0003.parshanut_or_talmudics_desc:0 "You recall a passage from another work you have studied. Comparing the two helps you understand a distinction that had been troubling you."
 kehillah_study_torah.0003.hashkafa_desc:0 "An argument from another work of Hashkafa helps you understand the passage before you."
 kehillah_study_torah.0003.a:0 "Follow the connection through."
 kehillah_study_torah.0003.b:0 "Ask a learned courtier to test the reading."

 # --- kehillah_study_torah.0004 (rare courtly help) ---
 kehillah_study_torah.0004.t:0 "A Companion in Study"
 kehillah_study_torah.0004.desc:0 "Someone in your household may be able to help with your studies. Discussing a difficult passage together could resolve questions you have struggled with alone."
 kehillah_study_torah.0004.a:0 "Ask a learned friend to study with you."
 kehillah_study_torah.0004.b:0 "Invite the court's strongest scholar."
 kehillah_study_torah.0004.c:0 "Keep the difficulty to yourself."

