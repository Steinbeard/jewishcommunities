 #####################################################################

 kehillah_shum.0001.t:0 "The Bet Din of Sh'um"
 kehillah_shum.0001.desc:0 "Word goes out along the Rhine, and the rabbis of Worms, Speyer and Mainz sit down together as one court. It has not happened in years, and it will not happen again for years after -- but a Bet Din convened by all three communities at once speaks with a weight no single community's ruling carries alone.\n\nThere is more than one matter worth its attention. Which takkanah does the Bet Din take up?"

 kehillah_shum.0001.a:0 "The ban on informing (issur mesirah)."
 kehillah_shum.0001.a.tt:0 "The Bet Din places its full weight behind the oldest and gravest of the Sh'um ordinances: a Jew who informs against another to the gentile authorities stands outside the community entirely. Every household in all three towns understands, plainly, what that means and why it matters."

 kehillah_shum.0001.b:0 "The ordinance on wedding extravagance."
 kehillah_shum.0001.b.tt:0 "The Bet Din sets real limits on what a wedding may cost -- how many guests, how rich the feast, how much silver on the bride. Families who cannot afford to compete stop being expected to, and the coin that would have gone to outshining a neighbor stays in the community's own hands."

 kehillah_shum.0001.c:0 "The ordinance protecting widows."
 kehillah_shum.0001.c.tt:0 "The Bet Din sets down, in writing, what a widow in any of the three communities is owed and cannot be denied. It is the kind of ruling that changes almost nothing for most people, and everything for the ones who need it."


 #####################################################################
 # BOOKMARK
 #####################################################################

 bm_1066_kehillah_worms:0 "The Kehillah of Worms"
 bm_1066_kehillah_worms_desc:0 "On the Rhine, under a bishop's rule, the Jews of Worms maintain a synagogue, a treasury and a school. Students come from other towns to study in its yeshiva.\n\nYou hold no county and command no soldiers. The households look to you to settle disputes, appoint officers and keep their institutions working.\n\n#bold Build the quarter and teach its students. The community will choose your successor, whether or not he is your son.#!"

 bm_1066_kehillah_founder_test:0 "A Rabbi on the Road"
 bm_1066_kehillah_founder_test_desc:0 "A learned rabbinic adventurer carrying a yeshiva in his memory and a small following on the road. Stop wandering, gather a minyan, and found a Jewish community."

 # The bookmark screen prints a _subheading line under each character's
 # name. Vanilla defines none of these, so the game rendered the raw key
 # on the first playtest. Supplied explicitly here.
 bookmark_kehillah_worms_isaac_subheading:0 "Rav of Worms"
 bookmark_kehillah_worms_alt_siegfried_subheading:0 "Bishop of Worms"

 bookmark_kehillah_worms_isaac:0 "Isaac ben Eliezer ha-Levi"
 bookmark_kehillah_worms_isaac_desc:0 "Isaac has led the yeshiva of Worms since succeeding Yaakov ben Yakar in 1064. Shlomo Yitzchaki of Troyes is among the pupils who studied with him.\n\nIsaac must keep the school and the community's other institutions in order. When he dies, the community will appoint a new leader on merit.\n\n#N Some sources render his father's name Eleazar rather than Eliezer. The same man.#!"

 bookmark_kehillah_worms_alt_siegfried:0 "Bishop Siegfried"
 bookmark_kehillah_worms_alt_siegfried_desc:0 "Bishop of Worms, and lord of the ground the community stands on. Its charters are his to grant, confirm, or quietly forget about.\n\nHe is not an enemy. He is a landlord, a court of appeal, and a fact of life."

 bookmark_kehillah_founder_test:0 "Yitzhak ben Natan"
 bookmark_kehillah_founder_test_subheading:0 "The Wandering Rabbi"
 bookmark_kehillah_founder_test_desc:0 "A learned rabbinic adventurer carrying a yeshiva in his memory and a small following on the road. Stop wandering, gather a minyan, and found a Jewish community."

 BOOKMARK_RELATION_KEHILLAH_HOST:0 "(Lord of the Town)"


 #####################################################################
 # Traits
 #####################################################################
 trait_kehillah_rabbi_trait:0 "Rabbi"
 trait_kehillah_rabbi_trait_desc:0 "A rabbi teaches Torah, answers questions of Jewish law and may sit in judgment for the community."

 # Track loc, ADDED 2026-09-09: trait_track_<name>/_desc is a GLOBAL
 # naming convention (ck3-tiger: "missing english localization key
 # trait_track_parshanut", not a trait-scoped key), so these three names
 # need to stay unique across every trait this mod (or any other) ever
 # gives a tracks block, not just unique within kehillah_rabbi_trait.
 trait_track_parshanut:0 "Parshanut"
 trait_track_parshanut_desc:0 "Skill in biblical exegesis -- reading scripture with the tools that turn text into law and life.\n\n#weak Teaching: makes a better #EMP Rosh Yeshiva#!, and wards raised by a rabbi with 65 or more grow in [learning|E] each year.#!"
 # UPDATED 2026-09-15: desc broadened to cover halakhic ruling as well as
 # argumentation proper -- Halakha (below, retired as its own track) merged
 # into this one; see kehillah_rabbi_trait's own header, common/traits/
 # kehillah_traits.txt.
 trait_track_talmudics:0 "Talmudics"
 trait_track_talmudics_desc:0 "Skill in Talmudic argumentation and halakhic ruling -- the back-and-forth of precedent and counter-precedent, turned into a decision real people have to live with.\n\n#weak Judging: counts as +2 / +4 / +6 [learning|E] (at 30 / 65 / 100) when ruling on the Bet Din, in disputes and in responsa, and makes a better #EMP Rosh Yeshiva#!.#!"
 # NEW 2026-09-15, replacing Halakha's vacated slot above.
 trait_track_hashkafa:0 "Hashkafa"
 trait_track_hashkafa_desc:0 "Skill in worldview -- philosophy, mysticism, and the wider Greek and Arabic learning a rabbi engages rather than simply dismisses.\n\n#weak Standing with the host: the leader's Hashkafa makes the #EMP Shtadlan's#! petitions x1.25 / x1.5 / x1.75 as likely to move the host (at 30 / 65 / 100).#!"

 trait_kohen:0 "Kohen"
 trait_kohen_desc:0 "A descendant of the priestly line of Aaron."
 trait_levite:0 "Levite"
 trait_levite_desc:0 "A descendant of the tribe of Levi, traditionally entrusted with service to the Temple and its community."
 trait_excommunicated_herem:0 "In Herem"
 trait_excommunicated_herem_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is under herem, shunned by the community and barred from its worship and fellowship."
 trait_kehillah_apostate_trait:0 "Apostate"
 trait_kehillah_apostate_trait_desc:0 "Abandoned the Jewish faith for another. Returning to it would end the stigma."


