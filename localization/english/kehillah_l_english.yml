 #####################################################################

 kehillah_band_crisis:0 "Crisis"
 kehillah_band_strained:0 "Strained"
 kehillah_band_healthy:0 "Healthy"
 kehillah_band_flourishing:0 "Flourishing"
 kehillah_band_legendary:0 "Legendary"


 #####################################################################
 # BAND GATE TOOLTIPS (Wave 3 item 2) -- used by can_construct blocks
 # in common/domiciles/buildings/kehillah_domicile_buildings.txt, and
 # (the two Prosperity ones) reused by the loan decisions below.
 #####################################################################

 kehillah_requires_prosperity_strained_tt:0 "The community's Prosperity is at least #EMP Strained#!"
 kehillah_requires_prosperity_healthy_tt:0 "The community's Prosperity is at least #EMP Healthy#!"
 kehillah_requires_stability_strained_tt:0 "The community's Stability is at least #EMP Strained#!"
 kehillah_requires_greatness_strained_tt:0 "The community's Greatness is at least #EMP Strained#!"
 kehillah_requires_greatness_healthy_tt:0 "The community's Greatness is at least #EMP Healthy#!"
 kehillah_requires_greatness_flourishing_tt:0 "The community's Greatness is at least #EMP Flourishing#!"
 kehillah_requires_greatness_legendary_tt:0 "The community's Greatness is at least #EMP Legendary#!"


 #####################################################################
 # MODIFIERS
 #####################################################################

 kehillah_settled_dispute_modifier:0 "Quarrel Settled"
 kehillah_tzedakah_modifier:0 "Tzedakah Distributed"
 kehillah_shaken_community_modifier:0 "Shaken Community"
 kehillah_emboldened_community_modifier:0 "Confident Community"

 # Opinion modifiers (common/opinion_modifiers/kehillah_opinion_modifiers.txt),
 # used by the dispute events below.
 kehillah_dispute_ruling_favor_opinion:0 "Ruled in Their Favor"
 kehillah_dispute_ruling_disfavor_opinion:0 "Ruled Against Them"

 kehillah_epidemic_recovery_modifier:0 "Weathered the Sickness"
 kehillah_overcrowded_quarter_modifier:0 "Overcrowded Quarter"


 #####################################################################
 # PROTECTION EVENTS
 #####################################################################

 kehillah.0001.t:0 "The Bailiff's Demand"
 kehillah.0001.desc:0 "The bailiff has come again, and this time he has brought two men with him and a figure in mind.\n\nHe is careful never to call it a fine. There is a word for what it is, and everyone in the room knows the word, and nobody says it. He waits, pleasantly, for you to be reasonable."

 kehillah.0001.a:0 "Let the Shtadlan speak for us."
 kehillah.0001.a.success.tt:0 "The demand is talked down to nothing, courteously, over the course of an afternoon. The community sees that it has someone who can do this."
 kehillah.0001.a.partial.tt:0 "He talks the figure down, though not away. Something still changes hands."

 kehillah.0001.b:0 "Pay him and be done with it."
 kehillah.0001.b.tt:0 "The money is counted out. He will be back, and everyone understands that he will be back."

 kehillah.0001.c:0 "The watch will see him out."
 kehillah.0001.c.success.tt:0 "He finds the quarter unhelpful, the streets full, and the whole business more trouble than it is worth."
 kehillah.0001.c.failure.tt:0 "He leaves angry and empty-handed, which is not the same as leaving. The community spends a nervous season."

 kehillah.0001.d:0 "Endure it."
 kehillah.0001.d.tt:0 "Nothing is paid and nothing is said. It is noted, by him and by the community, that nothing was done."

 kehillah.0002.t:0 "An Ugly Rumour"
 kehillah.0002.desc:0 "A story is going round the market with nothing at all underneath it. You know where it started, which is to say you know it started with someone who owed money and wanted a reason not to pay.\n\nThat has never yet stopped a story. It is repeated with each telling a little more certain than the last."

 kehillah.0002.a:0 "Send the Shtadlan to answer it."
 kehillah.0002.a.success.tt:0 "He puts the case plainly to people who matter, and the story loses its footing."
 kehillah.0002.a.partial.tt:0 "He does what he can. The story thins without quite dying."

 kehillah.0002.b:0 "A quiet gift to the right people."
 kehillah.0002.b.tt:0 "Money moves discreetly, and the story becomes less interesting to repeat."

 kehillah.0002.c:0 "Say nothing. It will burn out."
 kehillah.0002.c.wise.tt:0 "You have seen this before. Answering it would only have fed it, and you were right: within a month nobody can remember who started it."
 kehillah.0002.c.tt:0 "It does burn out, eventually. It takes longer than you expected, and it leaves a mark."

 kehillah.0003.t:0 "Stones in the Night"
 kehillah.0003.desc:0 "Shutters broken, the synagogue door scarred, and a great deal of shouting some time after midnight. Boys with drink in them, most likely, and nobody hurt.\n\nBy morning it is only mess and expense. The community is looking to see what you do about it, which is a separate question from how bad it was."

 kehillah.0003.a:0 "Set the watch on the lanes."
 kehillah.0003.a.success.tt:0 "The watch is out for a fortnight, visibly and in numbers. There is no second night."
 kehillah.0003.a.partial.tt:0 "The watch turns out. It is something, and the community is glad of it."

 kehillah.0003.b:0 "Take it to the authorities."
 kehillah.0003.b.success.tt:0 "A complaint is lodged properly and taken seriously enough to matter. Someone's father hears about it."
 kehillah.0003.b.partial.tt:0 "The complaint is heard, written down, and filed."

 kehillah.0003.c:0 "Repair it and carry on."
 kehillah.0003.c.tt:0 "The shutters are replaced and the door is planed smooth by the end of the week. Things that break here get fixed here."

 kehillah.0003.d:0 "Leave it."
 kehillah.0003.d.tt:0 "The scars stay in the door. People walk past them every day on the way in."


 #####################################################################
 # DISPUTE EVENTS (events/kehillah_dispute_events.txt)
 #
 # Replaces Mediate a Dispute Between Families -- see
 # common/decisions/kehillah_decisions.txt's header. kehillah_party_a
 # and kehillah_party_b are the two disputants, picked at random from
 # the court by kehillah_dispute_pick_parties_effect (common/
 # scripted_effects/kehillah_scripted_effects.txt); referenced below by
 # their saved scope names, bare and without a "scope:" prefix, matching
 # vanilla's own dynamic-text convention (confirmed: vanilla localization
 # never uses a "scope:"-prefixed reference inside [...], always the
 # bare saved-scope name, e.g. this mod's own
 # kehillah_view_standing_decision_desc's [ROOT.Char.GetPrimaryTitle...]).
 #
 # CORRECTED 2026-09-07 (live-test finding): that same key originally
 # read [ROOT.GetPrimaryTitle...] with no ".Char" and no ".MakeScope"
 # before .Var(...), and every one of its six dynamic-text calls failed
 # live with "Could not find promote for 'GetPrimaryTitle' in
 # 'ROOT.GetPrimaryTitle...'" -- ROOT is a generic scope wrapper and
 # needs ".Char" to reach the actual character first (confirmed against
 # vanilla's own ROOT.Char.GetCulture.GetName in coronation_activity_
 # l_english.yml), and .Var(...) additionally needs an immediately
 # preceding .MakeScope (confirmed against vanilla's
 # THIS.Char.MakeScope.Var(...) in the same file). .Custom(...) does not
 # need MakeScope -- it chains directly off the title like any other
 # typed-object method (GetName, GetTierAsName, etc.).
 #####################################################################

 kehillah_dispute.0001.t:0 "A Broken Partnership"
 kehillah_dispute.0001.desc:0 "[kehillah_party_a.GetFirstName] and [kehillah_party_b.GetFirstName] entered into an agreement two winters ago -- capital and craft, teacher and apprentice, witnessed by half the quarter at the time. Now it has come apart. [kehillah_party_a.GetFirstName] says the wage promised was never paid in full. [kehillah_party_b.GetFirstName] says tools and half a season's earnings walked out the door along with the apprentice.\n\nBoth are certain they are the wronged party. #EMP Both are probably a little bit right.#!"

 kehillah_dispute.0001.a:0 "Rule for [kehillah_party_a.GetFirstName]."
 kehillah_dispute.0001.a.great.tt:0 "Your reasoning is plain enough that even [kehillah_party_b.GetFirstName] cannot fault it. The community takes note of a leader who can actually settle something."
 kehillah_dispute.0001.a.good.tt:0 "[kehillah_party_a.GetFirstName] gets their due. It is not an elegant ruling, but it holds."
 kehillah_dispute.0001.a.poor.tt:0 "Your reasoning does not survive contact with the room. [kehillah_party_b.GetFirstName] leaves certain they have been robbed twice -- once by their partner, and once by you."

 kehillah_dispute.0001.b:0 "Rule for [kehillah_party_b.GetFirstName]."
 kehillah_dispute.0001.b.great.tt:0 "Your reasoning is plain enough that even [kehillah_party_a.GetFirstName] cannot fault it. The community takes note of a leader who can actually settle something."
 kehillah_dispute.0001.b.good.tt:0 "[kehillah_party_b.GetFirstName] gets their due. It is not an elegant ruling, but it holds."
 kehillah_dispute.0001.b.poor.tt:0 "Your reasoning does not survive contact with the room. [kehillah_party_a.GetFirstName] leaves certain they have been robbed twice -- once by their partner, and once by you."

 kehillah_dispute.0001.c:0 "Split what remains between them."
 kehillah_dispute.0001.c.tt:0 "Nobody gets everything they came for, and nobody leaves with nothing. It satisfies no one and offends no one, which is its own kind of success."

 kehillah_dispute.0001.d:0 "Let the Chief Rabbi judge it."
 kehillah_dispute.0001.d.success.tt:0 "The ruling is reasoned from precedent and delivered with the weight of the Beit Midrash behind it. Both sides accept it as they would a verse of Torah."
 kehillah_dispute.0001.d.failure.tt:0 "The ruling, once given, satisfies no one and settles nothing. The quarrel simply moves to a new subject: whether the Chief Rabbi was the right one to ask."

 kehillah_dispute.0002.t:0 "A Question of Dowry"
 kehillah_dispute.0002.desc:0 "A match was agreed between [kehillah_party_a.GetFirstName]'s family and [kehillah_party_b.GetFirstName]'s, and a dowry promised to make it possible. Now the wedding approaches and the sum promised is not the sum in hand -- a bad harvest, a bad season, a debt nobody mentioned at the betrothal.\n\n[kehillah_party_b.GetFirstName]'s family calls it a broken promise. [kehillah_party_a.GetFirstName]'s family calls it a promise made in good faith that circumstances have not allowed them to keep. #EMP Somewhere in this is a young woman waiting to know if she is getting married.#!"

 kehillah_dispute.0002.a:0 "Hold [kehillah_party_a.GetFirstName] to the letter of the agreement."
 kehillah_dispute.0002.a.great.tt:0 "You find a way to make the sum whole without ruining anyone outright, and both families know it took real judgement to manage it."
 kehillah_dispute.0002.a.good.tt:0 "The agreement stands, more or less as it was made. It is not gently done, but it is done."
 kehillah_dispute.0002.a.poor.tt:0 "You insist on the letter of an agreement neither family can actually afford to keep, and it satisfies no one, least of all [kehillah_party_b.GetFirstName]'s family."

 kehillah_dispute.0002.b:0 "Side with [kehillah_party_b.GetFirstName]'s family and excuse the shortfall."
 kehillah_dispute.0002.b.great.tt:0 "You find a way to make the sum whole without ruining anyone outright, and both families know it took real judgement to manage it."
 kehillah_dispute.0002.b.good.tt:0 "The shortfall is quietly excused. It is not gently done, but it is done."
 kehillah_dispute.0002.b.poor.tt:0 "You excuse a debt in a way that reads as favoritism rather than mercy, and [kehillah_party_a.GetFirstName]'s family does not forget it."

 kehillah_dispute.0002.c:0 "Split the difference and cover the rest from the chest."
 kehillah_dispute.0002.c.tt:0 "The community's own funds make up part of the gap. Nobody is fully satisfied, and the wedding, at least, goes ahead."

 kehillah_dispute.0002.d:0 "Let the Chief Rabbi judge it."
 kehillah_dispute.0002.d.success.tt:0 "The Chief Rabbi weighs the obligation to keep a promise against the obligation to a poor bride, and finds a resolution that leaves both families able to stand together at the wedding."
 kehillah_dispute.0002.d.failure.tt:0 "The ruling pleases neither family, and the wedding goes ahead under a cloud neither side asked for."


 #####################################################################
 # BOOKMARK
 #####################################################################

 bm_1066_kehillah_worms:0 "The Kehillah of Worms"
 bm_1066_kehillah_worms_desc:0 "On the Rhine, in a town belonging to a bishop, a Jewish community keeps its own law, its own accounts and its own school. Its synagogue has stood for thirty-two years. Its yeshiva teaches students who will be remembered longer than most of the princes fighting over the map.\n\nYou own nothing you stand on. You command no soldiers. What you have is a congregation that has agreed to be governed by you, for exactly as long as you are worth governing by.\n\n#bold Build the quarter, teach the students, keep the peace between the families -- and know that the man who follows you need not be your son.#!"

 # The bookmark screen prints a _subheading line under each character's
 # name. Vanilla defines none of these, so the game rendered the raw key
 # on the first playtest. Supplied explicitly here.
 bookmark_kehillah_worms_isaac_subheading:0 "Chief Rabbi of Worms"
 bookmark_kehillah_worms_alt_siegfried_subheading:0 "Bishop of Worms"

 bookmark_kehillah_worms_isaac:0 "Isaac ben Eliezer ha-Levi"
 bookmark_kehillah_worms_isaac_desc:0 "Head of the yeshiva and chief rabbi of Worms since 1064, when he succeeded Yaakov ben Yakar. Among his students is a young man from Troyes named Shlomo Yitzchaki, who will be known to every later generation as Rashi.\n\nHe is an old man already, and what he leaves behind will not be an inheritance. It will be an institution, and whoever the community judges fit to lead it.\n\n#N Some sources render his father's name Eleazar rather than Eliezer. The same man.#!"

 bookmark_kehillah_worms_alt_siegfried:0 "Bishop Siegfried"
 bookmark_kehillah_worms_alt_siegfried_desc:0 "Bishop of Worms, and lord of the ground the community stands on. Its charters are his to grant, confirm, or quietly forget about.\n\nHe is not an enemy. He is a landlord, a court of appeal, and a fact of life."

 BOOKMARK_RELATION_KEHILLAH_HOST:0 "(Lord of the Town)"


