 # PROTECTION EVENTS
 #####################################################################

 kehillah.0001.t:0 "The Bailiff's Demand"
 kehillah.0001.desc:0 "The bailiff arrives with two armed men and demands a payment from the community treasury. He produces no order and names no offence.\n\nHe waits beside the door while you consider your answer."

 kehillah.0001.a:0 "Let the Shtadlan speak for us."
 kehillah.0001.a.success.tt:0 "After an afternoon of negotiations, the Shtadlan persuades the bailiff to withdraw his demand."
 kehillah.0001.a.partial.tt:0 "The Shtadlan negotiates a smaller payment."

 kehillah.0001.b:0 "Pay him and be done with it."
 kehillah.0001.b.tt:0 "You pay the bailiff from the treasury."

 kehillah.0001.c:0 "The watch will see him out."
 kehillah.0001.c.success.tt:0 "He finds the quarter unhelpful, the streets full, and the whole business more trouble than it is worth."
 kehillah.0001.c.failure.tt:0 "The bailiff leaves without payment, threatening to return. Families in the quarter fear reprisals."

 kehillah.0001.d:0 "Endure it."
 kehillah.0001.d.tt:0 "You leave the demand unanswered. The community is troubled by your inaction."

 kehillah.0002.t:0 "An Ugly Rumour"
 kehillah.0002.desc:0 "A debtor has begun spreading accusations against the community at the market. Merchants who traded with us last week are now repeating them.\n\nSeveral residents urge you to answer before the rumour spreads further."

 kehillah.0002.a:0 "Send the Shtadlan to answer it."
 kehillah.0002.a.success.tt:0 "He puts the case plainly to people who matter, and the story loses its footing."
 kehillah.0002.a.partial.tt:0 "He does what he can. The story thins without quite dying."

 kehillah.0002.b:0 "A quiet gift to the right people."
 kehillah.0002.b.tt:0 "Money moves discreetly, and the story becomes less interesting to repeat."

 kehillah.0002.c:0 "Say nothing. It will burn out."
 kehillah.0002.c.wise.tt:0 "You have seen this before. Answering it would only have fed it, and you were right: within a month nobody can remember who started it."
 kehillah.0002.c.tt:0 "It does burn out, eventually. It takes longer than you expected, and it leaves a mark."

 kehillah.0003.t:0 "Stones in the Night"
 kehillah.0003.desc:0 "Stones struck the quarter after midnight, breaking shutters and damaging the synagogue door. No one was hurt, but the shouting kept several households awake until dawn.\n\nThis morning, residents ask how you intend to prevent another attack."

 kehillah.0003.a:0 "Set the watch on the lanes."
 kehillah.0003.a.success.tt:0 "The watch is out for a fortnight, visibly and in numbers. There is no second night."
 kehillah.0003.a.partial.tt:0 "Patrols reassure some residents, though others still fear another attack."

 kehillah.0003.b:0 "Take it to the authorities."
 kehillah.0003.b.success.tt:0 "The authorities take the complaint seriously and intervene."
 kehillah.0003.b.partial.tt:0 "The complaint is heard, written down, and filed."

 kehillah.0003.c:0 "Repair it and carry on."
 kehillah.0003.c.tt:0 "The shutters are replaced and the synagogue door repaired by the end of the week."

 kehillah.0003.d:0 "Leave it."
 kehillah.0003.d.tt:0 "The scars stay in the door. People walk past them every day on the way in."


 #####################################################################
 # DISPUTE EVENTS (events/kehillah_dispute_events.txt)
 #
 # Replaces Mediate a Dispute Between Families -- see
 # common/decisions/kehillah_decisions.txt's header. kehillah_party_a
 # and kehillah_party_b are the two disputants, picked at random from
 # the court by kehillah_dispute_pick_parties_effect (common/
 # scripted_effects/kehillah_scripted_effects.txt); referenced below by
 # their saved scope names, bare and without a "scope:" prefix, matching
 # vanilla's own dynamic-text convention (confirmed: vanilla localization
 # never uses a "scope:"-prefixed reference inside [...], always the
 # bare saved-scope name, e.g. this mod's own
 # kehillah_view_standing_decision_desc's [ROOT.Char.GetPrimaryTitle...]).
 #
 # CORRECTED 2026-09-07 (live-test finding): that same key originally
 # read [ROOT.GetPrimaryTitle...] with no ".Char" and no ".MakeScope"
 # before .Var(...), and every one of its six dynamic-text calls failed
 # live with "Could not find promote for 'GetPrimaryTitle' in
 # 'ROOT.GetPrimaryTitle...'" -- ROOT is a generic scope wrapper and
 # needs ".Char" to reach the actual character first (confirmed against
 # vanilla's own ROOT.Char.GetCulture.GetName in coronation_activity_
 # l_english.yml), and .Var(...) additionally needs an immediately
 # preceding .MakeScope (confirmed against vanilla's
 # THIS.Char.MakeScope.Var(...) in the same file). .Custom(...) does not
 # need MakeScope -- it chains directly off the title like any other
 # typed-object method (GetName, GetTierAsName, etc.).
 #####################################################################

 kehillah_dispute.0001.t:0 "A Broken Partnership"
 kehillah_dispute.0001.desc:0 "Two winters ago, [kehillah_party_a.GetFirstName] and [kehillah_party_b.GetFirstName] agreed to share the proceeds of a workshop. [kehillah_party_a.GetFirstName] says the promised share was never paid in full. [kehillah_party_b.GetFirstName] says [kehillah_party_a.GetFirstName] took tools from the workshop when the partnership ended.\n\nTheir agreement names the share, but says nothing about the tools. Both have come for a ruling."

 kehillah_dispute.0001.a:0 "Rule for [kehillah_party_a.GetFirstName]."
 kehillah_dispute.0001.a.great.tt:0 "You explain how the unpaid share and the missing tools should be accounted for. [kehillah_party_b.GetFirstName] accepts the ruling."
 kehillah_dispute.0001.a.good.tt:0 "You award [kehillah_party_a.GetFirstName] the unpaid share and settle the claim."
 kehillah_dispute.0001.a.poor.tt:0 "You award [kehillah_party_a.GetFirstName] the share without resolving the claim about the tools. [kehillah_party_b.GetFirstName] leaves angry."

 kehillah_dispute.0001.b:0 "Rule for [kehillah_party_b.GetFirstName]."
 kehillah_dispute.0001.b.great.tt:0 "You account for the missing tools and explain why they settle the unpaid share. [kehillah_party_a.GetFirstName] accepts the ruling."
 kehillah_dispute.0001.b.good.tt:0 "You uphold [kehillah_party_b.GetFirstName]'s claim to the tools and settle the partnership."
 kehillah_dispute.0001.b.poor.tt:0 "You uphold [kehillah_party_b.GetFirstName]'s claim without accounting for the unpaid share. [kehillah_party_a.GetFirstName] leaves angry."

 kehillah_dispute.0001.c:0 "Split what remains between them."
 kehillah_dispute.0001.c.tt:0 "You divide what remains. Neither party gets the whole share claimed."

 kehillah_dispute.0001.d:0 "Put it before the rabbi."
 kehillah_dispute.0001.d.success.tt:0 "The rabbi cites precedent and explains what each partner is owed. Both accept the ruling."
 kehillah_dispute.0001.d.failure.tt:0 "The rabbi's ruling leaves the claim about the tools unresolved. The parties continue their quarrel."

 kehillah_dispute.0002.t:0 "A Question of Dowry"
 kehillah_dispute.0002.desc:0 "[kehillah_party_a.GetFirstName]'s family promised a dowry for a marriage into [kehillah_party_b.GetFirstName]'s family. With the wedding near, they have brought only part of the agreed sum. A debt came due after the betrothal.\n\n[kehillah_party_b.GetFirstName]'s family asks for the full promise. [kehillah_party_a.GetFirstName]'s family asks to pay what it can. The couple waits for your ruling."

 kehillah_dispute.0002.a:0 "Allow [kehillah_party_a.GetFirstName]'s family to pay less."
 kehillah_dispute.0002.a.great.tt:0 "You hear what [kehillah_party_a.GetFirstName]'s family can pay and explain the reduction to [kehillah_party_b.GetFirstName]'s family. Both accept it."
 kehillah_dispute.0002.a.good.tt:0 "You reduce the dowry to what [kehillah_party_a.GetFirstName]'s family can provide. The match goes ahead."
 kehillah_dispute.0002.a.poor.tt:0 "You excuse the shortfall without addressing the promise. [kehillah_party_b.GetFirstName]'s family feels cheated."

 kehillah_dispute.0002.b:0 "Hold [kehillah_party_a.GetFirstName]'s family to the promised sum."
 kehillah_dispute.0002.b.great.tt:0 "You give [kehillah_party_a.GetFirstName]'s family time to provide the rest while upholding the promise to [kehillah_party_b.GetFirstName]'s family. Both accept it."
 kehillah_dispute.0002.b.good.tt:0 "You uphold the promised sum. [kehillah_party_b.GetFirstName]'s family accepts the ruling."
 kehillah_dispute.0002.b.poor.tt:0 "You demand the full sum without asking how it can be paid. [kehillah_party_a.GetFirstName]'s family leaves angry."

 kehillah_dispute.0002.c:0 "Ask both families to accept a smaller dowry."
 kehillah_dispute.0002.c.tt:0 "Both families accept a sum between the promise and what was brought. The match goes ahead."

 kehillah_dispute.0002.d:0 "Put it before the rabbi."
 kehillah_dispute.0002.d.success.tt:0 "The rabbi weighs the obligation to keep a promise against the obligation to a poor bride, and finds a resolution that leaves both families able to stand together at the wedding."
 kehillah_dispute.0002.d.failure.tt:0 "The ruling pleases neither family, and the wedding goes ahead under a cloud neither side asked for."


