 # FIXED 2026-09-15, same broken GetDeJureLiege chain as _host_desc above
 # -- dropped the region-name reference entirely rather than replacing it,
 # since a co-judge here may be a fellow community leader, a courtier, or
 # an independent scholar/adventurer, not necessarily anyone from "the"
