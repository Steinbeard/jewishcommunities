 activity_kehillah_bet_din_conference_desc:0 "Convene a regional rabbinical court to sit in judgement over a docket of real cases from your community's own life and rule on Jewish law."
 activity_kehillah_bet_din_conference_province_desc:0 "Convene a regional rabbinical court to sit in judgement over a docket of real cases from your community's own life and rule on Jewish law."
 activity_kehillah_bet_din_conference_host_desc:0 "You have called the Bet Din of [GetPlayer.GetPrimaryTitle.GetDeJureLiege.GetNameNoTooltip] to session. The rabbis of the other two communities travel to sit beside you; between you, a handful of cases await judgement."
