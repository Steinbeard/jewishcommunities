 kehillah_band_stability_crisis_modifier:0 "Communal Stability: Crisis"
 kehillah_band_stability_strained_modifier:0 "Communal Stability: Strained"
 kehillah_band_stability_flourishing_modifier:0 "Communal Stability: Flourishing"
 kehillah_band_stability_legendary_modifier:0 "Communal Stability: Legendary"
 kehillah_band_greatness_crisis_modifier:0 "Communal Greatness: Crisis"
 kehillah_band_greatness_strained_modifier:0 "Communal Greatness: Strained"
 kehillah_band_greatness_flourishing_modifier:0 "Communal Greatness: Flourishing"
 kehillah_band_greatness_legendary_modifier:0 "Communal Greatness: Legendary"

 #####################################################################
 # ENDORSE AS SUCCESSOR -- ROADMAP S3(d), ADDED 2026-09-26.
 # kehillah_endorse_successor_interaction, common/character_interactions/
 # kehillah_character_interactions.txt. The score-breakdown line
 # (kehillah_score_endorsed_desc) sits with its siblings up at
 # kehillah_score_learning_desc rather than here, so the whole
 # candidate_score breakdown reads together in one place.
 #####################################################################

 kehillah_endorse_successor_interaction:0 "Endorse as Successor"
 kehillah_endorse_successor_interaction_desc:0 "Name [recipient.GetFirstName] before the community as the one you would have lead it after you. The congregation will weigh your word when the time comes -- it will not simply obey it. Only one endorsement stands at a time, and it lapses when the office changes hands."
 kehillah_endorse_successor_interaction_prompt:0 "Whom would you have lead the community after you?"
 kehillah_endorse_successor_interaction_notification:0 "[actor.GetTitledFirstName] has named you as the one who should lead the community after [actor.GetHerHis] time."
 recipient_secondary_kehillah_endorse_successor_interaction:0 "Successor"

 kehillah_endorse_successor_in_pool_tt:0 "[recipient.GetFirstName] is of your household or holds one of the community's offices"
 kehillah_endorse_successor_not_already_tt:0 "[recipient.GetFirstName] is not already your endorsed successor"

 kehillah_endorsement_prestige_cost_desc:0 "Naming a successor before the community"

 kehillah_endorse_successor_msg_title:0 "A Successor Is Named"
 kehillah_endorse_successor_msg_desc:0 "You have endorsed [recipient.GetTitledFirstName] as your successor. Your support will strengthen the candidate's claim when the community appoints its next leader."

 #####################################################################
 # SEEK A RABBI -- 2026-10-11 (was Seek a Chief Rabbi, ROADMAP S4(1)).
 # common/decisions/kehillah_rabbi_office_decisions.txt and
 # events/kehillah_rabbi_search_events.txt. The rabbi found is seated as
 # the community's Dayyan.
 #####################################################################

 kehillah_seek_rabbi_decision:0 "Seek a Rabbi"
 kehillah_seek_rabbi_decision_desc:0 "The Dayyan's seat stands empty. The community needs a rabbi to judge in its Bet Din and answer questions of religious law.\n\nSend enquiries to other communities. You will need to pay for a suitable scholar to travel here and settle into the seat."
 kehillah_seek_rabbi_decision_confirm:0 "Send word"
 kehillah_seek_rabbi_decision_tooltip:0 "You will send word that the community seeks a rabbi."
 kehillah_seek_rabbi_tt:0 "Word goes out that the community seeks a rabbi. Within a fortnight you will hear back with #EMP whoever can be found#! -- from the courts of other communities, or from among the unattached scholars of the diaspora. The one you choose becomes your #EMP Dayyan#!."
 kehillah_seek_rabbi_seat_empty_tt:0 "The Dayyan's seat stands empty"
 kehillah_seek_rabbi_cooldown_tt:0 "You have not sent word again so soon"

 kehillah_rabbi_search.0001.t:0 "Word Comes Back"
 kehillah_rabbi_search.0001.desc:0 "Replies to your enquiries name three candidates: a renowned scholar, an experienced congregational rabbi and a recent student seeking a first appointment.\n\nEach needs help with travel and resettlement. The more established candidates ask for larger payments."
 kehillah_rabbi_search.0001.a:0 "[kehillah_rabbi_eminent.GetTitledFirstName] -- a name already known ([kehillah_rabbi_eminent.GetSkill('learning')] Learning, #EMP [SCOPE.ScriptValue('kehillah_rabbi_price_eminent_display')|0] gold#!)"
 kehillah_rabbi_search.0001.b:0 "[kehillah_rabbi_capable.GetTitledFirstName] -- a steady man ([kehillah_rabbi_capable.GetSkill('learning')] Learning, #EMP [SCOPE.ScriptValue('kehillah_rabbi_price_capable_display')|0] gold#!)"
 kehillah_rabbi_search.0001.c:0 "[kehillah_rabbi_young.GetTitledFirstName] -- young, and willing ([kehillah_rabbi_young.GetSkill('learning')] Learning, #EMP [SCOPE.ScriptValue('kehillah_rabbi_price_young_display')|0] gold#!)"
 kehillah_rabbi_search.0001.d:0 "None of them. The seat can wait."
 kehillah_rabbi_search.0001.d.tt:0 "The Dayyan's seat remains #N empty#!. You may send word again in time."

 # S4(3) -- the community a rabbi is called AWAY from. root is that
 # community's leader; scope:kehillah_rabbi_departed is the rabbi and
 # scope:kehillah_rabbi_new_patron the leader who hired him.
 kehillah_rabbi_search.0002.t:0 "He Has Been Called Away"
 kehillah_rabbi_search.0002.desc:0 "[kehillah_rabbi_departed.GetTitledFirstName] has received an offer from [kehillah_rabbi_new_patron.GetTitledFirstName] to serve as a rabbi. He has asked your leave to accept it.\n\nA scholar trained in your household will now teach another community."
 kehillah_rabbi_search.0002.a:0 "Let him go, and let them learn where he studied."

 # --- Ordination / semicha (V21 slice 3, common/decisions/kehillah_semicha_decisions.txt,
 # events/kehillah_semicha_events.txt, ADDED 2026-10-09) ---
 kehillah_study_torah.apprentice.tt:0 "You study as an apprentice, not yet ordained. Semicha comes from study at a #EMP yeshiva#!, or from a rabbinic guardian who raised you."
 kehillah_study_torah.apprentice_ready.tt:0 "You have read widely: two works, from two different fields. A yeshiva would make a rabbi of you."

 # --- Semicha of a Student (V21 slice 4, events/kehillah_semicha_events.txt,
 # ADDED 2026-10-10) ---
 kehillah_semicha.0003.t:0 "Semicha of a Student"
 kehillah_semicha.0003.desc:0 "You have come of age in [kehillah_semicha_mentor.GetTitledFirstName]'s house, and most of what you know you learned at his table.\n\nHe does not make a speech about it. He says that you have sat with him long enough that he knows what you know, and that there is nothing left to examine you on that he has not already heard you argue.\n\nThe endorsement is his to give, and he is offering it."
 kehillah_semicha.0003.a:0 "Accept his endorsement."
 kehillah_semicha.0003.b:0 "Not on his word. I would rather earn it at a yeshiva."
 kehillah_semicha.0003.b.tt:0 "Your years of apprenticeship are not lost. You may still study at a yeshiva and be ordained there."
 kehillah_bet_din.0003.outcome_1:0 "The court holds the bride's family to the promised sum. The groom's family may claim it, but the wedding waits while the money is found."
 kehillah_bet_din.0003.outcome_2:0 "The families agree to a smaller dowry. They may set a wedding day; the unpaid portion of the first promise is released."
 kehillah_bet_din.0003.quality_great:0 "\n\nThe judges explain the evidence and their reasons to both sides. The court gains standing from the hearing."
 kehillah_bet_din.0003.quality_good:0 "\n\nThe judges give their reasons. Some objections remain, but the ruling can be carried out."
 kehillah_bet_din.0003.quality_poor:0 "\n\nThe reasons are disputed before the parties leave. The court loses standing over the case."
 kehillah_bet_din.0013.outcome_1:0 "The court permits her to remarry. Its decision rests on the boatman's testimony about the river and the shore."
 kehillah_bet_din.0013.outcome_2:0 "The court withholds permission. She remains married in law while the judges seek clearer testimony about the river crossing."
 kehillah_bet_din.0013.quality_great:0 "\n\nThe judges explain the evidence and their reasons to both sides. The court gains standing from the hearing."
 kehillah_bet_din.0013.quality_good:0 "\n\nThe judges give their reasons. Some objections remain, but the ruling can be carried out."
 kehillah_bet_din.0013.quality_poor:0 "\n\nThe reasons are disputed before the parties leave. The court loses standing over the case."
 kehillah_bet_din.0023.outcome_1:0 "The court calls for a ban on second marriages, but its argument does not carry enough weight to change the faith's rule."
 kehillah_bet_din.0023.outcome_1_great:0 "The court bans second marriages. Its ruling is adopted as a change to the faith's marriage doctrine."
 kehillah_bet_din.0023.outcome_2:0 "The court rejects the proposed ban and cites the first wife's existing rights. Her claim to maintenance remains hers to press."
 kehillah_bet_din.0023.quality_great:0 "\n\nThe judges explain the evidence and their reasons to both sides. The court gains standing from the hearing."
 kehillah_bet_din.0023.quality_good:0 "\n\nThe judges give their reasons. Some objections remain, but the ruling can be carried out."
 kehillah_bet_din.0023.quality_poor:0 "\n\nThe reasons are disputed before the parties leave. The court loses standing over the case."
 kehillah_bet_din.0033.outcome_1:0 "The court places the husband in cherem. He loses his place in communal worship, but he has not yet given the get."
 kehillah_bet_din.0033.outcome_2:0 "The court orders him beaten until he gives the get. He does so, and the marriage ends."
 kehillah_bet_din.0033.outcome_3:0 "The court upholds his refusal. His wife remains bound to the marriage."
 kehillah_bet_din.0033.quality_great:0 "\n\nThe judges explain the evidence and their reasons to both sides. The court gains standing from the hearing."
 kehillah_bet_din.0033.quality_good:0 "\n\nThe judges give their reasons. Some objections remain, but the ruling can be carried out."
 kehillah_bet_din.0033.quality_poor:0 "\n\nThe reasons are disputed before the parties leave. The court loses standing over the case."
 kehillah_bet_din.0043.outcome_1:0 "The court finds against the scribe. The amulet is destroyed and he is placed in cherem."
 kehillah_bet_din.0043.outcome_2:0 "The court does not find that the scribe cursed his buyer. He is cleared; the buyer is reprimanded for the charge."
 kehillah_bet_din.0043.quality_great:0 "\n\nThe judges explain the evidence and their reasons to both sides. The court gains standing from the hearing."
 kehillah_bet_din.0043.quality_good:0 "\n\nThe judges give their reasons. Some objections remain, but the ruling can be carried out."
 kehillah_bet_din.0043.quality_poor:0 "\n\nThe reasons are disputed before the parties leave. The court loses standing over the case."
 kehillah_bet_din.0053.outcome_1:0 "The court finds that the rival brought the mob upon the shop. He is placed in cherem and ordered to pay for the loss."
 kehillah_bet_din.0053.outcome_2:0 "The court holds the rival liable for the damage without finding deliberate betrayal. He must pay for the shop."
 kehillah_bet_din.0053.outcome_3:0 "The charge is dismissed for want of proof. The shop remains ruined, and no restitution is ordered."
 kehillah_bet_din.0053.quality_great:0 "\n\nThe judges explain the evidence and their reasons to both sides. The court gains standing from the hearing."
