 activity_kehillah_learn_torah_journey_guest_help_text:0 "This activity has no guests -- a Learn Torah journey is made alone."

 phase_learn_torah_journey:0 "At the Beit Midrash"
 phase_learn_torah_journey_desc:0 "Studying whatever this community's own library holds that yours does not."

 kehillah_requires_unstudied_library_elsewhere_tt:0 "At least one other community's library holds a work of Parshanut, Talmudics or Hashkafa you have not yet mastered"

 # kehillah_bet_din_co_judge_1/2 (the special_guests slot loc) REMOVED
 # 2026-09-17 -- that slot no longer exists at all (THE PANEL, common/
 # activities/activity_types/kehillah_bet_din_conference.txt's own
 # header): co-judges are now decided from real attendance, not picked
 # in advance, so there is no special-guest key left to localize. See
 # kehillah_bet_din_invite_rule_jewish_regional_leaders/_courtiers below
 # for the open-invite categories that replaced it.

 # One phase per case on the docket -- the phase list is what sequences
 # the cases and what makes the session end after three. See the phases
 # block in common/activities/activity_types/kehillah_bet_din_conference.txt.
 phase_bet_din_case_1:0 "The First Case"
 phase_bet_din_case_1_desc:0 "The Bet Din takes up the first case on its docket."
 phase_bet_din_case_2:0 "The Second Case"
 phase_bet_din_case_2_desc:0 "The first case is settled. The Bet Din turns to the next."
 phase_bet_din_case_3:0 "The Third Case"
 phase_bet_din_case_3_desc:0 "The last case of the session comes before the judges."

 # --- Case 1: A Dowry Beyond Reach ---

 kehillah_bet_din.0001.t:0 "A Dowry Beyond Reach"
 kehillah_bet_din.0001.desc:0 "[kbd_litigant_a.GetFirstName]'s father promised a dowry to [kbd_litigant_b.GetFirstName]'s family. The harvest failed, and he can pay only half. The groom's family will not set a wedding day until the rest arrives. The bride says she never promised the money and asks how long she must wait.\n\nThe families have brought the agreement to the Bet Din."
 kehillah_bet_din.0001.a:0 "Hold [kbd_litigant_a.GetFirstName]'s family to the letter of the agreement."
 kehillah_bet_din.0001.a.pass.tt:0 "You uphold the promised sum and give the bride's family time to pay the remainder."
 kehillah_bet_din.0001.a.fail.tt:0 "You demand the full sum at once. The bride's family cannot pay it."
 kehillah_bet_din.0001.b:0 "Mediate a smaller dowry both families can honor."
 kehillah_bet_din.0001.b.pass.tt:0 "Both families accept a new sum, and the shortfall reads as mercy rather than favoritism."
 kehillah_bet_din.0001.b.fail.tt:0 "The proposed compromise reads as favoritism, and neither family forgets it."

 kehillah_bet_din.0002.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0002.desc:0 "The dowry agreement is before you. The presiding judge has proposed a ruling. You may defend it or ask the families to settle on a sum they can pay."
 kehillah_bet_din.0002.a:0 "Concur with the letter of the agreement."
 kehillah_bet_din.0002.b:0 "Press for a negotiated dowry both families can pay."

 kehillah_bet_din.0003.t:0 "The Ruling on the Dowry"
 kehillah_bet_din.0003.desc:0 "The judges give their ruling to the parties."
 kehillah_bet_din.0003.a:0 "Close the hearing."
 kehillah_bet_din.0003.great.tt:0 "The judges explain how they weighed the agreement and what each family must do. Their reasoning is copied with the ruling."
 kehillah_bet_din.0003.good.tt:0 "Both families know what the ruling requires of them."
 kehillah_bet_din.0003.poor.tt:0 "The families leave with conflicting accounts of what the court ordered."

 # --- Case 2: The Agunah's Plea ---

 kehillah_bet_din.0011.t:0 "The Agunah's Plea"
 kehillah_bet_din.0011.desc:0 "A boatman saw [kbd_litigant_a.GetFirstName]'s husband fall from a ferry into the Rhine. He watched the near bank but lost sight of the far shore. No body was found. [kbd_litigant_a.GetFirstName] asks leave to remarry; [kbd_litigant_b.GetFirstName], her husband's kinsman, says the witness cannot rule out an escape.\n\nThe court must decide what this testimony establishes."
 kehillah_bet_din.0011.a:0 "Grant [kbd_litigant_a.GetFirstName] leave to remarry."
 kehillah_bet_din.0011.a.pass.tt:0 "You explain why the boatman's testimony is enough to release her to remarry. The kinsman accepts the ruling."
 kehillah_bet_din.0011.a.fail.tt:0 "You grant leave to remarry without answering the kinsman's objection about the far shore."
 kehillah_bet_din.0011.b:0 "Hold to the stricter reading and make her wait."
 kehillah_bet_din.0011.b.pass.tt:0 "You explain what the boatman could not see and why the testimony cannot release her."
 kehillah_bet_din.0011.b.fail.tt:0 "You make her wait without establishing what further evidence the court needs."

 kehillah_bet_din.0012.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0012.desc:0 "The boatman's account is before you. The presiding judge has proposed a ruling. Where was the witness standing, and which shore could he see?"
 kehillah_bet_din.0012.a:0 "Concur with granting leave to remarry."
 kehillah_bet_din.0012.b:0 "Concur with the stricter reading."

 kehillah_bet_din.0013.t:0 "The Ruling on the Agunah"
 kehillah_bet_din.0013.desc:0 "The judges give their ruling to the parties."
 kehillah_bet_din.0013.a:0 "Close the hearing."
 kehillah_bet_din.0013.great.tt:0 "The judges set out what the witness saw and why it supports their decision. Their reasoning is copied with the ruling."
 kehillah_bet_din.0013.good.tt:0 "The court answers the objection to the boatman's testimony."
 kehillah_bet_din.0013.poor.tt:0 "The court leaves a serious objection unanswered, and its ruling is challenged."
 kehillah_bet_din.0013.remarried.tt:0 "She is granted leave to remarry. Her husband's kinsman must accept the court's decision."

 # --- Case 3: The Second Wife (tenet-adding) ---

 kehillah_bet_din.0021.t:0 "The Second Wife"
 kehillah_bet_din.0021.desc:0 "A merchant has taken a second wife. His first wife says the new household has left her short of food and clothing. Her relatives ask the Bet Din to forbid second marriages throughout the community. The merchant says he has broken no communal rule.\n\nThe judges must decide whether to issue a ban or enforce the first wife's existing claims."
 kehillah_bet_din.0021.a:0 "Forbid it -- no man of this community may take a second wife."
 kehillah_bet_din.0021.a.pass.tt:0 "You cite the sources for a communal ban and answer the merchant's objection that he broke no existing rule."
 kehillah_bet_din.0021.a.fail.tt:0 "You call for a ban without explaining why the court may bind every household to it."
 kehillah_bet_din.0021.b:0 "Leave the old custom be -- it is not yet time to bind the community to a new rule."
 kehillah_bet_din.0021.b.pass.tt:0 "You explain why the first wife's claim can be heard without imposing a new ban on every household."
 kehillah_bet_din.0021.b.fail.tt:0 "You reject the ban but leave the first wife's claim unanswered."

 kehillah_bet_din.0022.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0022.desc:0 "The first wife's claim and the proposed communal ban are before you. Does the court need a new prohibition to enforce what her husband already owes?"
 kehillah_bet_din.0022.a:0 "Add your own voice to the ruling."

 kehillah_bet_din.0023.t:0 "The Ruling on the Second Wife"
 kehillah_bet_din.0023.desc:0 "The judges give their ruling to the parties."
 kehillah_bet_din.0023.a:0 "Close the hearing."
 kehillah_bet_din.0023.herem.tt:0 "The Bet Din forbids men of this community to take a second wife. Copies of the ordinance go to neighboring communities."
 kehillah_bet_din.0023.good.tt:0 "The parties hear a ruling supported by the court's reasons."
 kehillah_bet_din.0023.poor.tt:0 "The court leaves the first wife's needs and the proposed ban at odds. The dispute continues."

 # --- Case 4: The Recalcitrant Husband ---
 kehillah_bet_din.0031.t:0 "The Recalcitrant Husband"
 kehillah_bet_din.0031.desc:0 "[kbd_litigant_a.GetFirstName] has asked [kbd_litigant_b.GetFirstName] for a get for two years. He refuses and gives no reason. She asks the Bet Din to press him; he insists that no grounds for compulsion have been proved.\n\nThe judges can exclude him, use force, or uphold his refusal. Each course will leave someone living with the ruling."
 kehillah_bet_din.0031.a:0 "Place him in cherem."
 kehillah_bet_din.0031.a.pass.tt:0 "The court states the grounds for cherem and sends notice of its ruling to neighboring communities."
 kehillah_bet_din.0031.a.fail.tt:0 "The court places him in cherem without establishing grounds for so severe a measure."
 kehillah_bet_din.0031.b:0 "Have him beaten until he grants the divorce."
 kehillah_bet_din.0031.b.pass.tt:0 "The court states its grounds for compulsion before ordering force."
 kehillah_bet_din.0031.b.fail.tt:0 "The court orders a beating without explaining why the law permits compulsion here."
 kehillah_bet_din.0031.c:0 "The law does not compel him. Side with the husband."
 kehillah_bet_din.0031.c.pass.tt:0 "You explain why the testimony does not permit the court to compel a get."
 kehillah_bet_din.0031.c.fail.tt:0 "You uphold his refusal without answering his wife's petition."

 kehillah_bet_din.0032.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0032.desc:0 "The husband still refuses to give a get. The presiding judge has proposed a response. You can support it or argue for another course."
 kehillah_bet_din.0032.a:0 "Concur with the cherem."
 kehillah_bet_din.0032.b:0 "Concur with having him beaten."
 kehillah_bet_din.0032.c:0 "Concur with siding with the husband."

 kehillah_bet_din.0033.t:0 "The Ruling on the Recalcitrant Husband"
 kehillah_bet_din.0033.desc:0 "The judges give their ruling to the parties."
 kehillah_bet_din.0033.a:0 "Close the hearing."
 kehillah_bet_din.0033.great.tt:0 "The judges record the grounds for their decision and address the objection raised in court."
 kehillah_bet_din.0033.good.tt:0 "The judges state the grounds for their decision."
 kehillah_bet_din.0033.poor.tt:0 "The court cannot explain how its ruling follows from the testimony."
 kehillah_bet_din.0033.cherem.tt:0 "He is placed in cherem, cut off from the community's religious life until he relents -- if he ever does."
 kehillah_bet_din.0033.beaten.tt:0 "He is beaten until he grants the divorce. The marriage ends, and he holds the judges responsible."
 kehillah_bet_din.0033.sided.tt:0 "The panel upholds his refusal. The law, such as it is, is on his side -- and the Bet Din's own standing pays the price of saying so."

 # --- Case 5 (events/kehillah_bet_din_events.txt, ADDED 2026-09-15) ---
 kehillah_bet_din.0041.t:0 "A Cursed Amulet"
 kehillah_bet_din.0041.desc:0 "[kbd_litigant_a.GetFirstName] bought an amulet from [kbd_litigant_b.GetFirstName]. After his child fell ill, he opened it and found lines of unfamiliar letters. He calls it a curse and wants the scribe punished. The scribe says he copied a formula learned from his teacher.\n\nThe parchment lies on the table. The court has heard no account of how the child became ill."
 kehillah_bet_din.0041.a:0 "Study the text yourself."
 kehillah_bet_din.0041.a.pass.tt:0 "You identify the formula and can judge what the scribe actually wrote."
 kehillah_bet_din.0041.a.fail.tt:0 "You cannot identify the formula. The court must rule without a reading of the parchment."
 kehillah_bet_din.0041.b:0 "Amulets have no power to curse anyone. This is not a question of magic."
 kehillah_bet_din.0041.b.tt:0 "You dismiss the claim that the amulet caused the illness. The court does not examine what the scribe wrote."
 kehillah_bet_din.0041.c:0 "Judge the man, not the letters."
 kehillah_bet_din.0041.c.pass.tt:0 "[kbd_litigant_b.GetFirstName]'s own standing in the community -- what kind of man he has shown himself to be, across every dealing anyone can recall -- is weighed carefully, and honestly."
 kehillah_bet_din.0041.c.fail.tt:0 "The weighing is rushed, more impression than judgment -- a fair method used carelessly is still a lesser ruling."

 kehillah_bet_din.0042.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0042.desc:0 "The amulet and the scribe's account are before you. The presiding judge has proposed a ruling. You may examine the text or question what can be proved about its maker."
 kehillah_bet_din.0042.a:0 "Weigh the matter carefully."
 kehillah_bet_din.0042.b:0 "Defer to the host's own reasoning."

 kehillah_bet_din.0043.t:0 "The Ruling on the Cursed Amulet"
 kehillah_bet_din.0043.desc:0 "The judges give their ruling to the parties."
 kehillah_bet_din.0043.a:0 "Close the hearing."
 kehillah_bet_din.0043.great.tt:0 "The judges distinguish what the witnesses know from what they fear about the amulet."
 kehillah_bet_din.0043.good.tt:0 "The judges explain which evidence supports their decision."
 kehillah_bet_din.0043.poor.tt:0 "The court leaves the link between the amulet and the illness unproved."
 kehillah_bet_din.0043.guilty.tt:0 "[kbd_litigant_b.GetFirstName] is placed in cherem, cut off from the community's religious life, and the parchment itself is burned before witnesses -- whatever it was, it will not be worn again."
 kehillah_bet_din.0043.innocent.tt:0 "[kbd_litigant_b.GetFirstName] is vindicated. [kbd_litigant_a.GetFirstName] is reprimanded for bringing a serious accusation the court did not find grounds for -- nothing more, but nothing less either."

 # --- Case 6 (events/kehillah_bet_din_events.txt, ADDED 2026-09-15) ---
 kehillah_bet_din.0051.t:0 "The Silversmiths' Quarrel"
 kehillah_bet_din.0051.desc:0 "A mob broke the windows of [kbd_litigant_a.GetFirstName]'s silver shop and took his stock. Someone heard the name of his rival, [kbd_litigant_b.GetFirstName], shouted in the street. The men have competed for customers all year.\n\n[kbd_litigant_b.GetFirstName] denies paying or directing anyone. The shop's losses are plain; his part in them is not."
 kehillah_bet_din.0051.a:0 "Treat this as Mesirah -- he betrayed a fellow Jew to gentile hands."
 kehillah_bet_din.0051.a.pass.tt:0 "You establish evidence that [kbd_litigant_b.GetFirstName] directed the attack, beyond the name heard in the street."
 kehillah_bet_din.0051.a.fail.tt:0 "You charge [kbd_litigant_b.GetFirstName] with betrayal on little more than the name shouted in the street."
 kehillah_bet_din.0051.b:0 "Rule it Gerama -- liable for damage caused through another's hands."
 kehillah_bet_din.0051.b.pass.tt:0 "You explain why directing others to damage the shop creates a claim for restitution."
 kehillah_bet_din.0051.b.fail.tt:0 "You order restitution without showing how [kbd_litigant_b.GetFirstName] caused the damage."
 kehillah_bet_din.0051.c:0 "Dismiss the charge. Rivalry is not evidence."
 kehillah_bet_din.0051.c.pass.tt:0 "You explain why rivalry and a shouted name do not prove a charge. Both men hear the court's reasoning."
 kehillah_bet_din.0051.c.fail.tt:0 "You dismiss the charge without addressing the loss of the shop. [kbd_litigant_a.GetFirstName] leaves angry."

 kehillah_bet_din.0052.t:0 "The Co-Judges Confer"
 kehillah_bet_din.0052.desc:0 "The ruined shop and the rival's denial are before you. The presiding judge has proposed a charge. You can defend it or argue that the evidence supports a different ruling."
 kehillah_bet_din.0052.a:0 "Argue that the evidence proves Mesirah."
 kehillah_bet_din.0052.a.pass.tt:0 "Your argument persuades the bench to find deliberate betrayal."
 kehillah_bet_din.0052.b:0 "Argue for indirect liability under Gerama."
 kehillah_bet_din.0052.b.pass.tt:0 "Your distinction persuades the bench to order restitution without the graver charge."
 kehillah_bet_din.0052.c:0 "Argue that rivalry alone cannot prove guilt."
 kehillah_bet_din.0052.c.pass.tt:0 "Your insistence on proof persuades the bench to dismiss the charge."
 kehillah_bet_din.0052.fail.tt:0 "The bench remains with the presiding judge's proposed ruling."

 kehillah_bet_din.0053.t:0 "The Ruling on the Silversmiths' Quarrel"
 kehillah_bet_din.0053.desc:0 "The judges give their ruling to the parties."
 kehillah_bet_din.0053.a:0 "Close the hearing."
 kehillah_bet_din.0053.great.tt:0 "The judges distinguish what witnesses saw from what they inferred about the rival."
 kehillah_bet_din.0053.good.tt:0 "The judges explain the evidence behind their ruling."
 kehillah_bet_din.0053.poor.tt:0 "The court leaves the rival's part in the attack uncertain."
 kehillah_bet_din.0053.mesirah.tt:0 "[kbd_litigant_b.GetFirstName] is placed in cherem as an informer, cut off from the community's religious life, and ordered to pay [kbd_litigant_a.GetFirstName] in full for the shop besides -- betrayal, the Bet Din rules, does not excuse a man from an honest debt."
 kehillah_bet_din.0053.gerama.tt:0 "[kbd_litigant_b.GetFirstName] is ordered to make [kbd_litigant_a.GetFirstName] whole for the shop -- liable for damage caused through another's hands, not innocent of it merely for not swinging the club himself."
 kehillah_bet_din.0053.dismissed.tt:0 "The charge is dismissed. [kbd_litigant_b.GetFirstName] walks away untouched; [kbd_litigant_a.GetFirstName] walks away with a ruined shop, no restitution, and a considerably lower opinion of the court that left him with neither."

 # --- Case 7: A Captive's Ransom ---
 kehillah_bet_din.0061.t:0 "A Captive's Ransom"
 kehillah_bet_din.0061.desc:0 "A merchant's letter says a captive from our community is being held for more than the customary ransom. The family asks for the full sum before the captors move on. Other householders fear a public levy will empty the chest and invite another seizure.\n\nThe Bet Din can authorize a collection or set terms for a lower offer. It cannot promise that the captors will accept either."
 kehillah_bet_din.0061.a:0 "Raise the full demand from communal funds. A life is at stake."
 kehillah_bet_din.0061.a.pass.tt:0 "The exception is argued with care, and the court names its cost openly."
 kehillah_bet_din.0061.a.fail.tt:0 "The court asks the community to pay without answering the danger of the next kidnapping."
 kehillah_bet_din.0061.b:0 "Hold to the customary limit and seek a lower price."
 kehillah_bet_din.0061.b.pass.tt:0 "The limit is explained as a duty to future captives as well as today's petitioner."
 kehillah_bet_din.0061.b.fail.tt:0 "The family hears a rule recited without a serious plan to bring their kin home."
 kehillah_bet_din.0061.c:0 "Invite voluntary pledges from kin and donors."
 kehillah_bet_din.0061.c.pass.tt:0 "You give the family a way to seek help without levying the whole community."
 kehillah_bet_din.0061.c.fail.tt:0 "The appeal is vague; the family leaves with names to ask, but no reliable pledge."
 kehillah_bet_din.0061.d:0 "Cite the Mishnah: keep the ransom within the communal limit."
 kehillah_bet_din.0061.d.tt:0 "Your mastery of the Mishnah makes the limit a reasoned ruling, not a refusal to help. The bench gains a source-based argument."
 kehillah_bet_din.0061.e:0 "Cite [Glossary( 'Duchka de-tzibbura', 'KEHILLAH_DIN_QUOTE_7_BAVLI' )]: ask willing donors to pledge."
 kehillah_bet_din.0061.e.tt:0 "Mastery of Bavli Nashim supports a private collection and contributes 22 to this judge's argument. The source debates whether private payment avoids the limit; it does not settle the question."
 kehillah_bet_din.0061.h:0 "Cite [kbd_ransom_precedent_author.GetTitledFirstName]'s earlier responsum for the customary limit."
 kehillah_bet_din.0061.i:0 "Cite [kbd_ransom_precedent_author.GetTitledFirstName]'s earlier responsum for willing donors."
 kehillah_bet_din.0061.precedent.tt:0 "The community's archived responsum gives this court a named precedent. It carries less weight than a judge's own mastery of the source."
 kehillah_bet_din.0061.f:0 "Write to [kbd_ransom_candidate_1.GetTitledFirstName] for a responsum."
 kehillah_bet_din.0061.g:0 "Write to [kbd_ransom_candidate_2.GetTitledFirstName] for a responsum."
 kehillah_bet_din.0061.letter.tt:0 "A named Rabbi who mastered a relevant source will receive the question. The Bet Din waits for the answer before judging the case."
 kehillah_bet_din.0062.t:0 "The Price of Redemption"
 kehillah_bet_din.0062.desc:0 "The presiding judge has proposed what the community may offer. The family needs a messenger soon; the other householders ask who will pay and what the next captors might demand."
 kehillah_bet_din.0062.a:0 "Argue for an exceptional communal collection."
 kehillah_bet_din.0062.a.pass.tt:0 "Your argument persuades the bench to authorize the full levy."
 kehillah_bet_din.0062.b:0 "Argue for a firm cap and a renewed offer."
 kehillah_bet_din.0062.b.pass.tt:0 "Your plan persuades the bench to set a limit and negotiate."
 kehillah_bet_din.0062.c:0 "Organize a voluntary collection instead."
 kehillah_bet_din.0062.c.pass.tt:0 "Your pledges persuade the bench to leave the appeal to willing donors."
 kehillah_bet_din.0062.fail.tt:0 "Your argument does not persuade the bench; the existing proposal stands."
 kehillah_bet_din.0062.d:0 "Cite the Mishnah's limit and argue for a lower offer."
 kehillah_bet_din.0062.d.tt:0 "Your mastered Mishnah passage persuades the bench to set a limit."
 kehillah_bet_din.0062.e:0 "Cite [Glossary( 'Duchka de-tzibbura', 'KEHILLAH_DIN_QUOTE_7_BAVLI' )]: argue for private pledges."
 kehillah_bet_din.0062.e.tt:0 "Mastery of Bavli Nashim contributes 22 to your argument for private pledges. The question of future kidnappings remains."
 kehillah_bet_din.0062.judge3_source.tt:0 "The third judge cites a relevant mastered source during deliberation."
 kehillah_bet_din.0063.t:0 "The Ruling on the Ransom"
 kehillah_bet_din.0063.desc.pay:0 "The Bet Din authorizes a public collection for the captors' full demand. Some call the price dangerous; the family calls the pledge a lifeline. A messenger carries the offer toward the caravan. The captive's fate is still unknown."
 kehillah_bet_din.0063.desc.cap:0 "The Bet Din sets a customary limit and sends a messenger to negotiate. The family fears that a lower offer may fail; the judges fear what an excessive ransom would invite next. No answer has yet come from the captors."
 kehillah_bet_din.0063.desc.pledge:0 "The Bet Din invites relatives and willing donors to pledge a ransom without levying the whole community. Names and sums are written down for the messenger. No answer has yet come from the captors."
 kehillah_bet_din.0063.a:0 "Send the court's answer."
 kehillah_bet_din.0063.great.tt:0 "The panel names both its duty to this captive and its duty to those who may be seized next."
 kehillah_bet_din.0063.good.tt:0 "The ruling is defensible, and the community understands what it has promised."
 kehillah_bet_din.0063.poor.tt:0 "The panel's reasoning leaves the family and donors at odds over what should happen next."
 kehillah_bet_din.0063.pay.tt:0 "A public collection commits substantial communal resources and earns piety. It does not guarantee the captors' answer."
 kehillah_bet_din.0063.cap.tt:0 "The messenger is instructed to negotiate within the customary limit. The captors' answer remains unknown."
 kehillah_bet_din.0063.pledge.tt:0 "Relatives and donors make a smaller voluntary collection. Their generosity raises the court's standing, though the outcome remains uncertain."
 kehillah_bet_din.0064.t:0 "A Question on a Captive's Ransom"
 kehillah_bet_din.0064.desc:0 "[kbd_ransom_asker.GetTitledFirstName]'s Bet Din has no judge who mastered the sources bearing on an excessive ransom. A letter asks for your opinion: must the community hold to the customary limit, or may willing donors offer more for this captive? The messenger waits for a written answer."
 kehillah_bet_din.0064.a:0 "Answer from the Mishnah: negotiate within the limit."
 kehillah_bet_din.0064.a.tt:0 "You send a responsum citing Mishnah Gittin's communal limit."
 kehillah_bet_din.0064.b:0 "Answer from Bavli Gittin: invite willing donors."
 kehillah_bet_din.0064.b.tt:0 "You send a responsum explaining the Bavli's debate and a voluntary collection."
 kehillah_bet_din.0064.c:0 "Decline to issue a ruling from this letter."
 kehillah_bet_din.0064.c.tt:0 "The asking court receives your refusal and must decide locally."
 kehillah_bet_din.0065.t:0 "A Responsum Returns to the Bet Din"
 kehillah_bet_din.0065.desc.mishnah:0 "[kbd_ransom_author.GetTitledFirstName] writes from the Mishnah: the community must restrain an excessive ransom, while continuing to negotiate for the captive. The reply is an argument for the bench, not a verdict made in its place."
 kehillah_bet_din.0065.desc.bavli:0 "[kbd_ransom_author.GetTitledFirstName] writes from Bavli Gittin: the danger of excessive ransom remains, but willing donors can take up an exceptional collection. The reply is an argument for the bench, not a verdict made in its place."
 kehillah_bet_din.0065.desc.declined:0 "The Rabbi you asked has declined to rule from a distant letter. The Bet Din must proceed from the testimony and learning it has at hand."
 kehillah_bet_din.0065.desc.late:0 "A reply to the ransom petition has arrived, but the session that requested it has ended. The correspondence is filed without reopening the old verdict."
 kehillah_bet_din.0065.a:0 "Adopt [kbd_ransom_author.GetTitledFirstName]'s Mishnah argument."
 kehillah_bet_din.0065.b:0 "Adopt [kbd_ransom_author.GetTitledFirstName]'s Bavli argument."
 kehillah_bet_din.0065.c:0 "Thank the Rabbi; rule locally instead."
 kehillah_bet_din.0065.d:0 "File the late reply."
 kehillah_bet_din.0065.accept.tt:0 "The court accepts a named source-based responsum and records its author as a precedent."
 kehillah_bet_din.0065.local.tt:0 "The court resumes without adopting the outside opinion."
 kehillah_bet_din.0065.late.tt:0 "The old case is closed; this letter cannot change its verdict."

 # --- Guest invite rules (common/activities/guest_invite_rules/kehillah_bet_din_invite_rules.txt) ---
 # ADDED 2026-09-17, replacing the retired co-judge special_guests slot
 # (see the note above, near kehillah_requires_unstudied_library_
 # elsewhere_tt): these two categories are who used to be picked for you
 # automatically -- now they simply get an invitation, like everyone else
 # in this list, and whoever actually shows up may end up presiding.
 kehillah_bet_din_invite_rule_jewish_regional_leaders:0 "Fellow Community Leaders"
 kehillah_bet_din_invite_rule_jewish_regional_leaders_desc:0 "Leaders of other communities sharing your own minhag region -- most likely, among those who attend, to end up presiding as your co-judges."
 kehillah_bet_din_invite_rule_jewish_courtiers:0 "Your Own Scholars"
 kehillah_bet_din_invite_rule_jewish_courtiers_desc:0 "Courtiers of your own court, learned enough to help judge a real docket."
 kehillah_bet_din_invite_rule_jewish_scholars:0 "Jewish Scholars"
 kehillah_bet_din_invite_rule_jewish_scholars_desc:0 "Independent Jewish rulers of particularly high Learning -- not required to attend, but word of a Bet Din conference reaches renowned scholars regardless of whose court they lead."
 kehillah_bet_din_invite_rule_jewish_adventurers:0 "Jewish Adventurers"
 kehillah_bet_din_invite_rule_jewish_adventurers_desc:0 "Landless Jewish adventurers -- not required to attend, but a gathering of this kind draws its share of wanderers too."

 # --- Travel flavor (events/kehillah_bet_din_travel_events.txt) ---
 kehillah_bet_din_travel.0001.t:0 "On the Road"
 kehillah_bet_din_travel.0001.desc:0 "The days on the road are long, and there is little to do but think. [ROOT.Char.GetFirstName] turns the docket's likely cases over and over, rehearsing arguments that may not even be the ones actually waiting at the end of the journey."
 kehillah_bet_din_travel.0001.a:0 "Onward."
 kehillah_bet_din_travel.0002.t:0 "A Fellow Traveller"
 kehillah_bet_din_travel.0002.desc:0 "A merchant on the same road asks, once he learns where [ROOT.Char.GetFirstName] is bound, whether the Bet Din takes requests from ordinary people or only disputes between the great and notable. [ROOT.Char.GetHerselfHimself|U] gives an answer that is mostly true."
 kehillah_bet_din_travel.0002.a:0 "Onward."

 # --- Closing ---

 kehillah_bet_din.0099.t:0 "The Docket Is Closed"
 # The tier-free original, now only the fallback for a session that
 # somehow closed without hearing a single case (no eligible case in a
 # very thin court). The four descs below are the real ones, picked by
 # the session score -- see kehillah_bet_din.0099 in events/kehillah_bet_din_events.txt.
 kehillah_bet_din.0099.desc:0 "The cases are heard, the rulings recorded. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave; the Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.landmark:0 "The judges record their rulings and the reasons behind each one. Scribes make copies for the other communities. [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName] take copies home when the panel closes.\n\n#EMP Greatness#! #P +50#!, #EMP Prosperity#! #P +20#!, and #EMP Stability#! #P +30#! for every community that sat on the panel. You also gain @piety_icon!#P +250#! Piety and @prestige_icon!#P +350#! Prestige.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.strong:0 "The parties hear the rulings and the court records its reasons. [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName] leave with copies for their own communities.\n\n#EMP Greatness#! #P +25#! and #EMP Stability#! #P +15#! for every community that sat on the panel. You also gain @piety_icon!#P +100#! Piety and @prestige_icon!#P +150#! Prestige.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.adequate:0 "The docket is cleared. A few parties still dispute the reasoning, but the rulings are entered in the record. [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName] take their leave.\n\n#EMP Greatness#! #P +10#! and #EMP Stability#! #P +5#! for every community that sat on the panel. You also gain @piety_icon!#P +50#! Piety.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.failed:0 "The judges record their rulings, but several parties say their evidence was not answered. [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName] leave with disputes still being argued outside the court.\n\n#EMP Greatness#! #N -20#! and #EMP Stability#! #N -25#! for every community that sat on the panel. You also lose @prestige_icon!#N -75#! Prestige.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.a:0 "Until it is called again."
 kehillah_bet_din.0099.landmark.tt:0 "The rulings are copied for other communities. #EMP Greatness#! #P +50#!, #EMP Prosperity#! #P +20#!, #EMP Stability#! #P +30#!, @piety_icon!#P +250#! Piety, @prestige_icon!#P +350#! Prestige."
 kehillah_bet_din.0099.strong.tt:0 "A well-ruled docket. The court's standing rises, and so does yours. #EMP Greatness#! #P +25#!, #EMP Stability#! #P +15#!, @piety_icon!#P +100#! Piety, @prestige_icon!#P +150#! Prestige."
 kehillah_bet_din.0099.adequate.tt:0 "The docket is cleared, though some parties contest the reasoning. #EMP Greatness#! #P +10#!, #EMP Stability#! #P +5#!, @piety_icon!#P +50#! Piety."
 kehillah_bet_din_attendee_reward_tt:0 "Every attendee other than the convening leader gains @prestige_icon!#P +10#! Prestige, @piety_icon!#P +10#! Piety, #P +15#! Learning Lifestyle Experience, and a warmer relationship with the host. Ordained judges also gain #P 1–3#! Talmudics Rabbi Experience for each good or great ruling."
 kehillah_bet_din.0099.failed.tt:0 "Several parties challenge the court's reasoning. #EMP Greatness#! #N -20#!, #EMP Stability#! #N -25#!, @prestige_icon!#N -75#! Prestige."

