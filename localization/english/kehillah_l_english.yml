 # installed game's own witnessed_a_coronation_memory: "witnessed a
 # coronation" (localization/english/memories_l_english.yml).
 kehillah_bet_din_amulet_case_memory_guilty:0 "ruled a cursed amulet case"
 kehillah_bet_din_amulet_case_memory_innocent:0 "ruled a cursed amulet case"
 kehillah_bet_din_amulet_case_memory_desc_guilty:0 "I sat on the Bet Din that placed [scribe.GetFirstName] in cherem over an amulet [scribe.GetHerHis] sold to [accuser.GetFirstName] -- letters that meant nothing anyone could read, and misfortune that followed regardless. I am still not entirely sure we were right."
 kehillah_bet_din_amulet_case_memory_desc_innocent:0 "I sat on the Bet Din that heard [accuser.GetFirstName]'s case against [scribe.GetFirstName] over a cursed amulet, and cleared [scribe.GetHerHis] name. The letters on that parchment never did mean anything to me, one way or the other."

 # --- Memories, cases 1-4 and 6 (common/character_memory_types/kehillah_memory_types.txt, ADDED 2026-09-15) ---
 kehillah_bet_din_case1_memory:0 "ruled well on a dowry dispute"
 kehillah_bet_din_case1_memory_desc:0 "I sat on the Bet Din when [party_a.GetFirstName]'s family could not pay the dowry promised to [party_b.GetFirstName]'s. We heard both families before ruling."
 kehillah_bet_din_case2_memory:0 "ruled well on an agunah's plea"
 kehillah_bet_din_case2_memory_desc:0 "I sat on the Bet Din when [petitioner.GetFirstName] asked leave to remarry and [kinsman.GetFirstName] questioned the boatman's testimony."
 kehillah_bet_din_case3_memory:0 "ruled well on the Second Wife question"
 kehillah_bet_din_case3_memory_desc:0 "I sat on the Bet Din when a first wife's claim prompted a proposal to ban second marriages in the community."
 kehillah_bet_din_case4_memory:0 "ruled well on a recalcitrant husband"
 kehillah_bet_din_case4_memory_desc:0 "I sat on the Bet Din when [wife.GetFirstName] asked us to compel [husband.GetFirstName] to grant a divorce."
 kehillah_bet_din_case6_memory:0 "ruled well on the silversmiths' quarrel"
 kehillah_bet_din_case6_memory_desc:0 "I sat on the Bet Din after [accuser.GetFirstName]'s shop was smashed and [accused.GetFirstName] was accused of directing the attack."

 kehillah_bet_din_session_co_judge_log_title:0 "A Co-Judge Sat in Judgement"
 kehillah_bet_din_session_co_judge_log:0 "[CHARACTER.GetTitledFirstName] sat as a co-judge of the Bet Din, alongside [TARGET_CHARACTER.GetTitledFirstName]."

 # --- Guest pulse actions (common/activities/pulse_actions/kehillah_bet_din_pulse_actions.txt) ---
