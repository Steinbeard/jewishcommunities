 kehillah_learn_torah_journey.0002.t:0 "Their Works of Parshanut"
 kehillah_learn_torah_journey.0002.desc:0 "[kehillah_journey_host.GetTitledFirstName]'s shelves hold more than one reading of the text worth your time. Which will you take up?"
 kehillah_learn_torah_journey.0002.desc.fallback:0 "The shelves here hold more than one reading of the text worth your time. Which will you take up?"
 kehillah_learn_torah_journey.0002.a:0 "Study the Targum Onkelos."
 kehillah_learn_torah_journey.0002.b:0 "Study the Mekhilta."
 kehillah_learn_torah_journey.0002.c:0 "Study Genesis Rabbah."
 kehillah_learn_torah_journey.0002.d:0 "Study Pirkei De-Rabbi Eliezer."

