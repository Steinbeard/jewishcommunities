 # --- Travel flavor (events/kehillah_bet_din_travel_events.txt) ---
 kehillah_bet_din_travel.0001.t:0 "On the Road"
 kehillah_bet_din_travel.0001.desc:0 "The days on the road are long, and there is little to do but think. [ROOT.Char.GetFirstName] turns the docket's likely cases over and over, rehearsing arguments that may not even be the ones actually waiting at the end of the journey."
 kehillah_bet_din_travel.0001.a:0 "Onward."
 kehillah_bet_din_travel.0002.t:0 "A Fellow Traveller"
 kehillah_bet_din_travel.0002.desc:0 "A merchant on the same road asks, once he learns where [ROOT.Char.GetFirstName] is bound, whether the Bet Din takes requests from ordinary people or only disputes between the great and notable. [ROOT.Char.GetHerselfHimself|U] gives an answer that is mostly true."
 kehillah_bet_din_travel.0002.a:0 "Onward."

 # --- Closing ---

 kehillah_bet_din.0099.t:0 "The Docket Is Closed"
 # The tier-free original, now only the fallback for a session that
 # somehow closed without hearing a single case (no eligible case in a
 # very thin court). The four descs below are the real ones, picked by
 # the session score -- see kehillah_bet_din.0099 in events/kehillah_bet_din_events.txt.
 kehillah_bet_din.0099.desc:0 "The cases are heard, the rulings recorded. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave; the Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.landmark:0 "The cases are heard, the rulings recorded -- and this was not an ordinary session. Ruling after ruling came out clear, well-argued, and hard to quarrel with; the record of this docket is the kind that gets copied out and carried to other communities. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave knowing they sat on something that will be remembered -- and their own communities stand the steadier for having sat on it.\n\n#EMP Greatness#! #P +50#!, #EMP Prosperity#! #P +20#!, and #EMP Stability#! #P +30#! for every community that sat on the panel. You also gain @piety_icon!#P +250#! Piety and @prestige_icon!#P +350#! Prestige.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.strong:0 "The cases are heard, the rulings recorded. It was a good session -- the reasoning held, the parties left knowing why they had won or lost, and the court's standing is the better for it. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave satisfied, their own communities a little steadier for it too.\n\n#EMP Greatness#! #P +25#! and #EMP Stability#! #P +15#! for every community that sat on the panel. You also gain @piety_icon!#P +100#! Piety and @prestige_icon!#P +150#! Prestige.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.adequate:0 "The cases are heard, the rulings recorded. Not every ruling was a triumph, and one or two will be argued over for years, but the docket was cleared and the court did its work. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave, a small measure of steadiness going home with them.\n\n#EMP Greatness#! #P +10#! and #EMP Stability#! #P +5#! for every community that sat on the panel. You also gain @piety_icon!#P +50#! Piety.\n\nThe Bet Din will not sit again for some years yet."
 kehillah_bet_din.0099.desc.failed:0 "The cases are heard, the rulings recorded -- and the record does the court no credit. More than one ruling was thin, and everyone who stood before the panel knows it; what was meant to settle these matters has instead given the community fresh grievances to nurse. The co-judges, [kbd_judge2.GetFirstName] and [kbd_judge3.GetFirstName], take their leave quickly, and say little on the way out -- their own communities will hear of this docket too, and not kindly.\n\n#EMP Greatness#! #N -20#! and #EMP Stability#! #N -25#! for every community that sat on the panel. You also lose @prestige_icon!#N -75#! Prestige.\n\nThe Bet Din will not sit again for some years yet. Perhaps that is a mercy."
 kehillah_bet_din.0099.a:0 "Until it is called again."
 kehillah_bet_din.0099.landmark.tt:0 "A landmark session. This region's own Bet Din is spoken of with real authority now, and your own name with it. #EMP Greatness#! #P +50#!, #EMP Prosperity#! #P +20#!, #EMP Stability#! #P +30#!, @piety_icon!#P +250#! Piety, @prestige_icon!#P +350#! Prestige."
 kehillah_bet_din.0099.strong.tt:0 "A well-ruled docket. The court's standing rises, and so does yours. #EMP Greatness#! #P +25#!, #EMP Stability#! #P +15#!, @piety_icon!#P +100#! Piety, @prestige_icon!#P +150#! Prestige."
 kehillah_bet_din.0099.adequate.tt:0 "A serviceable session. The docket was cleared; little more can be claimed for it. #EMP Greatness#! #P +10#!, #EMP Stability#! #P +5#!, @piety_icon!#P +50#! Piety."
 kehillah_bet_din.0099.failed.tt:0 "A badly ruled docket. The court's authority is diminished, and convening it was your idea. #EMP Greatness#! #N -20#!, #EMP Stability#! #N -25#!, @prestige_icon!#N -75#! Prestige."

