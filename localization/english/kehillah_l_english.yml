l_english:

 #####################################################################
 # Kehillah -- Phase 1 localization.
 #
 # Sourced from docs/spec/v1-kehillah-community.md and
 # docs/scenarios/worms-1066.md. Terminology notes:
 #
 #  - "Kehillah" (plural Kehillot) is the ordinary Hebrew word for an
 #    organised Jewish community. It is the mod's own term, not a
 #    coinage.
 #  - "Shtadlan" is the historical term for a community's intercessor
 #    with outside authority. Left untranslated on purpose; there is no
 #    good one-word English equivalent, and the word carries the whole
 #    idea.
 #  - "Beit Midrash" (house of study), "Mikvah" (ritual bath),
 #    "Tzedakah" (charity, more precisely righteous obligation),
 #    "Gabbai" (communal treasurer/warden), "Genizah" (storeroom for
 #    worn sacred texts) are likewise real terms used in their real
 #    senses.
 #  - "Parnas" is the historical title for a lay communal leader; it is
 #    used in a couple of descriptions where "the leader" would read
 #    flatly.
 #####################################################################


 #####################################################################
 # GOVERNMENT
 #####################################################################

 kehillah_government:0 "Kehillah"
 kehillah_government_adjective:0 "Communal"
 kehillah_government_realm:0 "Kehillah"
 # The bookmark screen asks for the _with_icon form. Vanilla's version
 # prefixes a government-type icon; this mod ships no such icon, so the
 # name is used bare rather than pointing at a texture that is not there.
 kehillah_government_with_icon:0 "$kehillah_government$"
 kehillah_government_desc:0 "#F A Kehillah is an organised Jewish community living inside somebody else's realm. It holds no land and commands no armies. What it holds is itself: a synagogue, a study hall, a treasury, and the right to govern its own affairs.#!\n\nStanding here is earned through #EMP competence and learning#!, not through plots. Leadership passes to whoever the community judges best fit for it, whatever family they were born into."

 kehillah_government_tt:0 "Leads a #EMP Kehillah#!"

 # Leader rank flavorization (common/flavorization/kehillah_title_holders.txt).
 # Replaces the default "Duke"/"Duchess" rank with a title reflecting
 # whether THIS leader reads as the community's rabbi or its lay elder --
 # see that file's header for the historical reasoning.
 kehillah_rav_male:0 "Rav"
 kehillah_rav_female:0 "Rav"
 kehillah_parnas_male:0 "Parnas"
 kehillah_parnas_female:0 "Parnas"
 kehillah_rav_spouse_ashkenazi_female:0 "Rebbetzin"
 kehillah_rav_spouse_female:0 "Rabbanit"
 kehillah_parnas_spouse_female:0 "Parnasit"


 #####################################################################
 # DOMICILE
 #####################################################################

 kehillah_quarter:0 "Kehillah Quarter"
 kehillah_quarter_desc:0 "The community's own streets: the synagogue at their heart, and around it the halls, workshops and stalls that a congregation builds for itself over generations."
 kehillah_quarter_domicile_type:0 "Jewish Quarter"
 kehillah_quarter_domicile_type_desc:0 "A quarter of the town where the Jewish community lives, works, and worships."
 kehillah_quarter_domicile_type_tooltip:0 "Jewish Quarter"

 #####################################################################
 # CHARACTER NAMES
 #
 # Given names used directly in history/characters/*.txt that aren't
 # already covered by a vanilla or name-list loc key. Kalonymus is used
 # here as a personal given name (see history/characters/speyer_1066.txt
 # header), not only as the dynn_Kalonymus dynasty name (localized
 # separately in localization/english/dynasties/
 # ha_levi_dynasty_names_l_english.yml) -- the two keys are unrelated
 # despite the shared word.
 #####################################################################

 Kalonymus:0 "Kalonymus"

 # Todros: used in history/characters/narbonne_1066.txt as a personal
 # given name (a real, attested name among later medieval Narbonnese
 # Jewish notables -- see that file's own header), not already covered by
 # any vanilla or name-list loc key -- ck3-tiger flagged it as missing on
 # this pass's own validation run.
 Todros:0 "Todros"

 #####################################################################
 # TITLE
 #####################################################################

 d_kehillah_worms:0 "Kehillah of Worms"
 d_kehillah_worms_adj:0 "Wormsian Jewish"
 d_kehillah_worms_desc:0 "The Jewish community of Worms on the Rhine. Its synagogue was raised in 1034, and its yeshiva draws students from across the Rhineland."

 d_kehillah_speyer:0 "Kehillah of Speyer"
 d_kehillah_speyer_adj:0 "Speyerite Jewish"
 d_kehillah_speyer_desc:0 "The Jewish community of Speyer on the Rhine -- the youngest of the old Sh'um trio, its own settlers barely established by this era."

 d_kehillah_mainz:0 "Kehillah of Mainz"
 d_kehillah_mainz_adj:0 "Mainzite Jewish"
 d_kehillah_mainz_desc:0 "The Jewish community of Mainz on the Rhine, the oldest and most eminent of the old Sh'um trio -- Rabbeinu Gershom, the Meor HaGolah, taught and led here a generation before this era's start."

 # --- Western Ashkenaz, new communities (v6 spec section 3a) ---

 d_kehillah_troyes:0 "Kehillah of Troyes"
 d_kehillah_troyes_adj:0 "Troyesian Jewish"
 d_kehillah_troyes_desc:0 "The Jewish community of Troyes in Champagne -- home, from this era, to Shlomo Yitzhaki, whose commentaries will one day be read wherever the Torah and Talmud are studied at all."

 d_kehillah_paris:0 "Kehillah of Paris"
 d_kehillah_paris_adj:0 "Parisian Jewish"
 d_kehillah_paris_desc:0 "The Jewish community of Paris on the Seine -- a young settlement, not yet the scholarly center it becomes in the centuries to come."

 d_kehillah_cologne:0 "Kehillah of Cologne"
 d_kehillah_cologne_adj:0 "Colognian Jewish"
 d_kehillah_cologne_desc:0 "The Jewish community of Cologne on the Rhine -- one of the oldest in northern Europe, its presence in the city already attested under Roman law."

 # --- Eastern Ashkenaz (v6 spec section 3b) ---

 d_kehillah_praha:0 "Kehillah of Prague"
 d_kehillah_praha_adj:0 "Praguian Jewish"
 d_kehillah_praha_desc:0 "The Jewish community of Prague on the Vltava -- merchants of this community were already noted by foreign travelers a century before this era's start."

 d_kehillah_vienna:0 "Kehillah of Vienna"
 d_kehillah_vienna_adj:0 "Viennese Jewish"
 d_kehillah_vienna_desc:0 "The Jewish community of Vienna on the Danube -- a small and recent settlement, its own later prominence still generations away."

 # --- Anglia REMOVED 2026-09-25 (v18 spec) --- London/York/Lincoln/Norwich
 # are no longer pre-authored titles; their loc now lives in
 # kehillah_norman_conquest_l_english.yml as fixed title-name/adj/desc keys
 # read by the dynamically-created titles kehillah_norman_conquest_effects.txt
 # produces. The old London desc line's own "newly arrived in the
 # Conqueror's own wake" foreshadowing is exactly what that new mechanism
 # now actually plays out, rather than merely gesturing at.

 # --- Provence (v6 spec section 3d) ---

 d_kehillah_narbonne:0 "Kehillah of Narbonne"
 d_kehillah_narbonne_adj:0 "Narbonnese Jewish"
 d_kehillah_narbonne_desc:0 "The Jewish community of Narbonne in Languedoc -- long and prominently established, a real center of Talmudic learning in its own right."

 d_kehillah_beziers:0 "Kehillah of Béziers"
 d_kehillah_beziers_adj:0 "Béziers Jewish"
 d_kehillah_beziers_desc:0 "The Jewish community of Béziers in Languedoc -- smaller than Narbonne's own, but real and enduring."

 d_kehillah_lunel:0 "Kehillah of Lunel"
 d_kehillah_lunel_adj:0 "Lunelese Jewish"
 d_kehillah_lunel_desc:0 "The Jewish community of Lunel, near Montpellier -- destined to host an academy renowned as far as Spain, though that renown still lies ahead of this era."

 # --- Southern Sepharad and Bavel (v18 spec, 2026-09-25) ---

 d_kehillah_toledo:0 "Kehillah of Toledo"
 d_kehillah_toledo_adj:0 "Toledan Jewish"
 d_kehillah_toledo_desc:0 "The Jewish community of Toledo, capital of its own Taifa -- prosperous and well-established, though its own greatest scholarly renown still lies a century ahead."

 d_kehillah_cordoba:0 "Kehillah of Córdoba"
 d_kehillah_cordoba_adj:0 "Cordoban Jewish"
 d_kehillah_cordoba_desc:0 "The Jewish community of Córdoba, once the Caliphate's own capital -- still a great and wealthy city, even three decades after the Caliphate itself broke apart."

 d_kehillah_granada:0 "Kehillah of Granada"
 d_kehillah_granada_adj:0 "Granadan Jewish"
 d_kehillah_granada_desc:0 "The Jewish community of Granada -- led, this very year, by its own vizier of the Taifa itself, the height of Jewish political power anywhere in the Islamic world."

 d_kehillah_baghdad:0 "Kehillah of Baghdad"
 d_kehillah_baghdad_adj:0 "Baghdadi Jewish"
 d_kehillah_baghdad_desc:0 "The Jewish community of Baghdad, seat of the old Babylonian Gaonate -- its own formal academies have lapsed, but its standing has not been forgotten."

 #####################################################################
 # REGIONS -- REMOVED 2026-09-10 (v7 spec section 1, supersedes v6
 # sections 1-2). The four titular duchies these keys named --
 # d_kehillah_western_ashkenaz, d_kehillah_eastern_ashkenaz,
 # d_kehillah_anglia, d_kehillah_provence -- no longer exist (common/
 # landed_titles/kehillah_landed_titles.txt's own header has the full
 # account of why: de jure nesting cannot support founding a community
 # anywhere, only at pre-authored locations). Minhag region membership is
 # now a computed fact about real vanilla geography, tagged by
 # kehillah_tag_minhag_regions_effect (common/scripted_effects/kehillah_
 # minhag_geography_effects.txt) rather than a title name -- there is no
 # replacement loc key because there is no replacement title; a future
 # "display name for my minhag" tooltip (explicitly out of scope for this
 # pass, v7 spec's own closing section) would read the SAME flag values
 # that effect sets, not reintroduce titular duchy names.
 #####################################################################


 #####################################################################
 # SUCCESSION
 #####################################################################

 kehillah_appointment_succession_law:0 "Communal Appointment"
 kehillah_appointment_succession_law_subname:0 "The Community Chooses Its Own Leader"
 kehillah_appointment_succession_law_effects:0 "When the leader of the community dies, the community appoints whichever eligible figure it judges most worthy. #EMP Birth order counts for nothing.#! Learning weighs heaviest, then standing in the community, then holding one of its offices. Renown of family counts for something, but never for much."

 # Candidate score breakdown lines.
 kehillah_score_learning_desc:0 "Learning"
 kehillah_score_stewardship_desc:0 "Stewardship"
 kehillah_score_diplomacy_desc:0 "Diplomacy"
 kehillah_score_officer_desc:0 "Holds an office of the community"
 kehillah_score_piety_desc:0 "Piety"
 kehillah_score_dynasty_prestige_desc:0 "Renown of their family"
 kehillah_score_mature_desc:0 "Old enough to be taken seriously"
 kehillah_score_elder_desc:0 "An elder of the community"
 kehillah_score_very_aged_desc:0 "Very aged"
 kehillah_score_theologian_desc:0 "A dedicated scholar of the faith"
 kehillah_score_scholar_desc:0 "A scholar"
 kehillah_score_just_desc:0 "Just"
 kehillah_score_patient_desc:0 "Patient"
 kehillah_score_compassionate_desc:0 "Compassionate"
 kehillah_score_arbitrary_desc:0 "Arbitrary -- the community does not trust their judgement"
 kehillah_score_greedy_desc:0 "Greedy -- the community does not trust them with its purse"
 kehillah_score_incapable_desc:0 "Not able to serve"
 kehillah_score_wrong_faith_desc:0 "Not of the community's faith"
 kehillah_score_same_culture_desc:0 "One of the community's own"
 kehillah_score_friend_desc:0 "A friend of the late leader"
 kehillah_score_male_only_desc:0 "The community does not yet recognize female leadership"


 #####################################################################
 # BUILDINGS -- THE SYNAGOGUE
 #####################################################################

 kehillah_synagogue_01_domicile_building:0 "Synagogue"
 kehillah_synagogue_01_domicile_building_desc:0 "A plain stone hall with an ark for the scrolls and benches enough for the men of the town. Modest, and entirely sufficient."

 kehillah_synagogue_02_domicile_building:0 "Enlarged Synagogue"
 kehillah_synagogue_02_domicile_building_desc:0 "The hall has been extended, a women's section added along the northern wall, and the roof raised. The congregation has outgrown its first building and said so."

 kehillah_synagogue_03_domicile_building:0 "Great Synagogue"
 kehillah_synagogue_03_domicile_building_desc:0 "Vaulted, pillared, and known well beyond this town. Travellers ask directions to it by name.\n\n#N Prominence is not only an asset. A building people can find is a building people can trouble.#!"

 kehillah_synagogue_04_domicile_building:0 "Synagogue and Court"
 kehillah_synagogue_04_domicile_building_desc:0 "A courtyard now adjoins the hall, where the community's court sits and its disputes are heard in the open."

 kehillah_synagogue_05_domicile_building:0 "The Great House of the Community"
 kehillah_synagogue_05_domicile_building_desc:0 "Synagogue, court, school and hall together, a quarter unto itself. Rulings issued here are cited in communities that will never see it."


 #####################################################################
 # BUILDINGS -- BEIT MIDRASH
 #####################################################################

 kehillah_beit_midrash_01_domicile_building:0 "Beit Midrash"
 kehillah_beit_midrash_01_domicile_building_desc:0 "A house of study: a room, a table, and men arguing over a page late into the night.\n\n#N Allows a #EMP Chief Rabbi#! to be appointed.#!"

 kehillah_beit_midrash_02_domicile_building:0 "House of Debate"
 kehillah_beit_midrash_02_domicile_building_desc:0 "A larger room, more benches, and more voices arguing over the same page. The study hall has outgrown a single teacher and a handful of pupils."

 kehillah_beit_midrash_03_domicile_building:0 "Yeshiva"
 kehillah_beit_midrash_03_domicile_building_desc:0 "A full academy, with students who came here on purpose and from far away. This is where lasting work gets written."


 #####################################################################
 # BUILDINGS -- COUNTINGHOUSE
 #####################################################################

 kehillah_countinghouse_01_domicile_building:0 "Countinghouse"
 kehillah_countinghouse_01_domicile_building_desc:0 "The community's chest, its ledgers, and a locked door.\n\n#N Allows a #EMP Treasurer#! to be appointed.#!"

 kehillah_countinghouse_02_domicile_building:0 "Ledger Room"
 kehillah_countinghouse_02_domicile_building_desc:0 "Proper accounts, kept year on year. Nobody has to remember who owes what."

 kehillah_countinghouse_03_domicile_building:0 "Communal Treasury"
 kehillah_countinghouse_03_domicile_building_desc:0 "Deposits, loans and the funds of orphans and widows, all held and reckoned separately. The community is trusted with money, which is its own kind of standing."


 #####################################################################
 # BUILDINGS -- MIKVAH
 #####################################################################

 kehillah_mikvah_01_domicile_building:0 "Mikvah"
 kehillah_mikvah_01_domicile_building_desc:0 "A ritual bath, cut down to the groundwater as the law requires. One of the first things any community builds, and often the last thing it abandons."

 kehillah_mikvah_02_domicile_building:0 "Vaulted Mikvah"
 kehillah_mikvah_02_domicile_building_desc:0 "Stone steps down to clean, cold, living water, under a vaulted roof. Well built, and built to last."


 #####################################################################
 # BUILDINGS -- HEKDESH
 #####################################################################

 kehillah_hekdesh_01_domicile_building:0 "Hekdesh"
 kehillah_hekdesh_01_domicile_building_desc:0 "The community's poorhouse and hospice: a roof for the sick, the destitute, and travellers who arrived with nowhere else to stay.\n\n#N Allows a #EMP Gabbai Tzedakah#! to be appointed. Reduces the community's risk of catching an illness that reaches the quarter.#!"

 kehillah_hekdesh_02_domicile_building:0 "Hekdesh and Hospice"
 kehillah_hekdesh_02_domicile_building_desc:0 "Proper wards, and beds enough that a visiting scholar is housed as readily as a beggar. News, letters and rulings arrive with the guests.\n\n#N Allows a #EMP Gabbai Tzedakah#! to be appointed. Further reduces the community's risk of catching an illness that reaches the quarter.#!"


 #####################################################################
 # BUILDINGS -- SOFER'S WORKSHOP
 #####################################################################

 kehillah_sofer_workshop_01_domicile_building:0 "Sofer's Workshop"
 kehillah_sofer_workshop_01_domicile_building_desc:0 "Ink, parchment, and a scribe steady enough of hand to write a Torah scroll without a single correction. Scrolls, mezuzot and tefillin all begin here, and so does every ketubah and get the community needs.\n\n#N Allows a #EMP Sofer#! to be appointed.#!"

 kehillah_sofer_workshop_02_domicile_building:0 "Scriptorium"
 kehillah_sofer_workshop_02_domicile_building_desc:0 "More than one sofer now works here, and what they copy travels. A text finished in this room is read in towns nobody here has visited.\n\n#N Allows a #EMP Sofer#! to be appointed.#!"


 #####################################################################
 # BUILDINGS -- SLAUGHTERHOUSE
 #####################################################################

 kehillah_slaughterhouse_01_domicile_building:0 "Slaughterhouse"
 kehillah_slaughterhouse_01_domicile_building_desc:0 "Kosher meat for the community's own table, prepared according to the law by someone trained to do it properly.\n\n#N Allows a #EMP Shochet#! to be appointed.#!"

 kehillah_slaughterhouse_02_domicile_building:0 "Communal Slaughterhouse"
 kehillah_slaughterhouse_02_domicile_building_desc:0 "Enough capacity to sell kosher meat to travellers and neighbouring communities, not merely to feed this one.\n\n#N Allows a #EMP Shochet#! to be appointed.#!"


 #####################################################################
 # BUILDINGS -- EXTERNAL
 #####################################################################

 kehillah_market_stalls_01_domicile_building:0 "Market Stalls"
 kehillah_market_stalls_01_domicile_building_desc:0 "A handful of stalls at the edge of the town market."

 kehillah_market_stalls_02_domicile_building:0 "Market Row"
 kehillah_market_stalls_02_domicile_building_desc:0 "A permanent row with lock-ups behind, held by families of the community."

 kehillah_market_stalls_03_domicile_building:0 "Merchants' Quarter"
 kehillah_market_stalls_03_domicile_building_desc:0 "Warehousing, credit and contacts in other towns. Trade that does not depend on any one market day."

 kehillah_workshops_01_domicile_building:0 "Craft Workshops"
 kehillah_workshops_01_domicile_building_desc:0 "Workshops along the lane: a goldsmith, a dyer, a man who mends anything."

 kehillah_workshops_02_domicile_building:0 "Established Workshops"
 kehillah_workshops_02_domicile_building_desc:0 "Trades passed from father to son, with apprentices and a reputation."

 kehillah_workshops_03_domicile_building:0 "Renowned Workshops"
 kehillah_workshops_03_domicile_building_desc:0 "Work from these lanes is sought by name, and by people who would not otherwise come here."


 #####################################################################
 # OFFICERS
 #####################################################################

 chief_rabbi_kehillah_position:0 "Chief Rabbi"
 chief_rabbi_kehillah_position_desc:0 "The community's authority on law and learning. Rules on questions put to him, teaches in the Beit Midrash, and answers letters from communities with no scholar of their own.\n\n#N Requires a #EMP Beit Midrash#!.#!"

 treasurer_kehillah_position:0 "Gabbai"
 treasurer_kehillah_position_desc:0 "The warden of the community's chest. Collects what is owed, pays what is due, and keeps the accounts that let the community be trusted with other people's money.\n\n#N Requires a #EMP Countinghouse#!.#!"

 shtadlan_kehillah_position:0 "Shtadlan"
 shtadlan_kehillah_position_desc:0 "The community's advocate before outside authority. Carries petitions, argues charters, and is the first person sent for when an official arrives with a demand.\n\n#N A shtadlan has no chambers of his own -- his work happens wherever the person he is petitioning happens to be.#!"

 kehillah_requires_beit_midrash_tt:0 "The community has a #EMP Beit Midrash#!"
 kehillah_requires_countinghouse_tt:0 "The community has a #EMP Countinghouse#!"
 kehillah_requires_sofer_workshop_tt:0 "The community has a #EMP Sofer's Workshop#!"
 kehillah_requires_slaughterhouse_tt:0 "The community has a #EMP Slaughterhouse#!"
 kehillah_requires_hekdesh_tt:0 "The community has a #EMP Hekdesh#!"
 kehillah_requires_mikvah_tt:0 "The community has a #EMP Mikvah#!"
 kehillah_officer_same_faith_tt:0 "Is of the community's faith"
 kehillah_officer_male_only_tt:0 "The community does not yet recognize female leadership"


 #####################################################################
 # MINOR COMMUNAL POSITIONS
 #####################################################################

 sofer_kehillah_position:0 "Sofer"
 sofer_kehillah_position_desc:0 "The community's scribe. Writes and repairs the Torah scrolls, the mezuzot on the doorposts, and the tefillin worn at prayer, and drafts the ketubot and gittin the community's marriages and divorces require.\n\n#N Requires a #EMP Sofer's Workshop#!.#!"

 shochet_kehillah_position:0 "Shochet"
 shochet_kehillah_position_desc:0 "The ritual slaughterer. Without him the community has no kosher meat at all, which makes this one of the least optional roles in the quarter.\n\n#N Requires a #EMP Slaughterhouse#!.#!"

 gabbai_tzedakah_kehillah_position:0 "Gabbai Tzedakah"
 gabbai_tzedakah_kehillah_position_desc:0 "The charity warden. Administers the hekdesh, decides who among the community's poor and sick is helped first, and keeps that accounting separate from the treasury's own.\n\n#N Requires a #EMP Hekdesh#!.#!"

 mikvah_attendant_kehillah_position:0 "Mikvah Attendant"
 mikvah_attendant_kehillah_position_desc:0 "Keeps the mikvah's waters and its schedule, quietly and without much thanks.\n\n#N Requires a #EMP Mikvah#!.#!"


 #####################################################################
 # DECISIONS
 #####################################################################

 decision_group_type_kehillah:0 "Community Decisions"

 # Pure information, no mechanical effect -- see the decision's own
 # header comment in common/decisions/kehillah_decisions.txt for why
 # this exists (there is no other in-game way to see the pillar
 # variables, which live on primary_title with no top-bar display).
 kehillah_view_standing_decision:0 "Take Stock of the Community"
 kehillah_view_standing_decision_desc:0 "#EMP Standing#!: [ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_var_standing').GetValue|V0] ([ROOT.Char.GetPrimaryTitle.Custom('KehillahStandingBandName')])\n#weak The three pillars averaged -- the community's overall standing in one figure.#!\n\n#EMP Prosperity#!: [ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_var_prosperity').GetValue|V0] ([ROOT.Char.GetPrimaryTitle.Custom('KehillahProsperityBandName')])\n#EMP Stability#!: [ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_var_stability').GetValue|V0] ([ROOT.Char.GetPrimaryTitle.Custom('KehillahStabilityBandName')])\n#EMP Greatness#!: [ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_var_greatness').GetValue|V0] ([ROOT.Char.GetPrimaryTitle.Custom('KehillahGreatnessBandName')])\n\nThese numbers move on their own each season, drifting toward what the quarter's buildings, offices and your own skills can structurally support -- and your own decisions can move them further, up or down, in between."
 kehillah_view_standing_decision_confirm:0 "Noted"
 kehillah_view_standing_decision_tooltip:0 "See where the community currently stands."
 kehillah_view_standing_taken_tt:0 "You take stock of the community's standing."

 # Mediate a Dispute Between Families and its three outcome tooltips
 # were retired here 2026-09-07, replaced by the organic dispute-ruling
 # event pair (events/kehillah_dispute_events.txt, localized below under
 # DISPUTE EVENTS) -- see common/decisions/kehillah_decisions.txt's
 # header for the reasoning.

 kehillah_distribute_tzedakah_decision:0 "Distribute Tzedakah"
 kehillah_distribute_tzedakah_decision_desc:0 "The chest is opened for the community's poor: for widows, for orphans, for the family whose workshop burned, and for travellers who arrived with nothing.\n\nThis is not generosity. #EMP It is an obligation#!, and the community knows the difference -- which is precisely why meeting it so publicly is also how a leader is judged."
 kehillah_distribute_tzedakah_decision_tooltip:0 "Spend from the community chest on those who need it."
 kehillah_distribute_tzedakah_decision_confirm:0 "Open the chest"

 kehillah_distribute_tzedakah_tt:0 "The community's poor are provided for, and the community notices who provided."

 # --- V16 Host Charter: construction permission ---
 kehillah_secure_construction_permission_decision:0 "Secure Construction Permission"
 kehillah_secure_construction_permission_decision_desc:0 "Our charter permits new communal building only by the host's leave. Gifts, petitions, and patient visits to the right officials can secure a period in which the community may build openly."
 kehillah_secure_construction_permission_decision_tooltip:0 "Pay the expenses of petitioning the host for five years of construction permission."
 kehillah_secure_construction_permission_decision_confirm:0 "Present the petition"
 kehillah_secure_construction_permission_tt:0 "For five years, the host's permission allows the community to establish new Quarter institutions."
 kehillah_charter_construction_permission_modifier:0 "Host Construction Permission"
 kehillah_charter_construction_permission_modifier_desc:0 "The host has granted a temporary leave to establish new communal institutions."
 kehillah_charter_construction_permission_tt:0 "#N The Host Charter must allow new communal construction.#!\n#weak A free charter needs no further step. A permission charter requires an active Host Construction Permission; a prohibition forbids new institutions entirely.#!"

 #####################################################################
 # LIGHT LOAN CONTRACTS (Wave 3 item 4). See
 # common/decisions/kehillah_decisions.txt's own header for the full
 # mechanism and why the target is fixed (the community's own local
 # county holder) rather than player-chosen.
 #####################################################################

 # kehillah_extend_loan_decision and its loc (kehillah_extend_loan_
 # decision/_desc/_tooltip/_confirm, kehillah_extend_loan_tt,
 # kehillah_loan_target_exists_tt, kehillah_loan_target_tier_tt,
 # kehillah_loan_target_not_indebted_tt) were REMOVED 2026-09-10 (v8
 # spec) -- superseded by kehillah_loan_contract, see common/decisions/
