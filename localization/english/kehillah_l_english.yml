# S1 -- leaving the Kehillah (common/scripted_effects/kehillah_departure_effects.txt,
# common/decisions/kehillah_departure_decisions.txt). Mirror-image wording to the
# kehillah_found_community_* block above, on purpose: entering and leaving the
# government type are the same door from opposite sides.
 kehillah_step_down_decision:0 "Step Down and Take to the Road"
 kehillah_step_down_decision_desc:0 "Hand over leadership of the community and return to life on the road. The community will continue under your successor while you travel with your followers."
 kehillah_step_down_decision_tooltip:0 "Hand the community to its appointed successor and take to the road as a landless wanderer."
 kehillah_step_down_decision_confirm:0 "Hand it on and go"
 kehillah_step_down_requires_successor_tt:0 "There is someone fit to take the community after you"
 kehillah_departure_title_name:0 "[kehillah_departure_leader.GetFirstName]'s Wayfarers"
kehillah_successor_scaffold_title_name:0 "Kehillah Quarter"
kehillah_successor_scaffold_title_article:0 ""
 kehillah_departure_title_article:0 ""

# S1 -- the Stability floor (events/kehillah_dissolution_events.txt).
 kehillah_dissolution.0001.t:0 "The Community Frays"
 kehillah_dissolution.0001.desc:0 "Two families have left to join relatives elsewhere. Others now take their disputes to the local authorities because they no longer trust the community to settle them. Fewer people attend the synagogue each week.\n\nThe elders warn that more households will leave unless you restore confidence in the community."
 kehillah_dissolution.0001.a:0 "Then it must be turned around."
 kehillah_dissolution.0002.t:0 "The Last to Leave"
 kehillah_dissolution.0002.desc:0 "The remaining families are leaving. There are no longer enough men for a minyan, and the synagogue has closed.\n\nYour leadership of this community has ended. You and your followers must seek a new home."
 kehillah_dissolution.0002.a:0 "Shut the door and go."

# S2 -- pillar band-change notices (common/scripted_effects/kehillah_pillar_band_effects.txt).
# One title/desc pair per pillar. The desc names the band the community has just
# moved INTO, via the existing Kehillah*BandName customizable localization, and
# then states what that band does -- so the notice answers "what changed" and
# "what does it mean for me" in one line, in either direction.
 kehillah_band_change_prosperity_title:0 "The Community's Prosperity Has Shifted"
 kehillah_band_change_prosperity_desc:0 "Prosperity in [ROOT.Char.GetPrimaryTitle.GetName] is now #high [ROOT.Char.GetPrimaryTitle.Custom('KehillahProsperityBandName')]#!.\n\nA community's Prosperity band adjusts your monthly income: #N -20%#! at Crisis, #N -10%#! at Strained, nothing either way at Healthy, #P +10%#! at Flourishing and #P +20%#! at Legendary."
 kehillah_band_change_stability_title:0 "The Community's Stability Has Shifted"
 kehillah_band_change_stability_desc:0 "Stability in [ROOT.Char.GetPrimaryTitle.GetName] is now #high [ROOT.Char.GetPrimaryTitle.Custom('KehillahStabilityBandName')]#!.\n\nA community's Stability band adjusts the stress of leading it and how your courtiers regard you: worse at Crisis and Strained, nothing either way at Healthy, better at Flourishing and Legendary."
 kehillah_band_change_greatness_title:0 "The Community's Greatness Has Shifted"
 kehillah_band_change_greatness_desc:0 "Greatness in [ROOT.Char.GetPrimaryTitle.GetName] is now #high [ROOT.Char.GetPrimaryTitle.Custom('KehillahGreatnessBandName')]#!.\n\nA community's Greatness band adjusts your monthly prestige: #N -20%#! at Crisis, #N -10%#! at Strained, nothing either way at Healthy, #P +10%#! at Flourishing and #P +20%#! at Legendary. The top two bands also draw scholars to you, worth #P +1#! and #P +2#! Learning."

