 kehillah_study_torah.parshanut.genesis_rabbah_tt:0 "You take up Genesis Rabbah, following its readings of Bereshit from one to the next."
 kehillah_study_torah.parshanut.pirkei_derabbi_eliezer_tt:0 "You take up Pirkei De-Rabbi Eliezer, its retelling of the old stories stranger and richer than the plain text alone."
 kehillah_study_torah.talmudics.mishnah_tt:0 "You take up the Mishnah, working case by case through its own spare, exacting language."
 kehillah_study_torah.talmudics.bavli_zeraim_tt:0 "You take up the Bavli's Seder Zeraim, most of it Mishnah alone -- only Berakhot carries the Bavli's own Gemara this far."
 kehillah_study_torah.talmudics.bavli_moed_tt:0 "You take up the Bavli's Seder Moed, the year's festivals argued through in full."
 kehillah_study_torah.talmudics.bavli_nashim_tt:0 "You take up the Bavli's Seder Nashim, working through betrothal and divorce case by case."
 kehillah_study_torah.talmudics.bavli_nezikin_tt:0 "You take up the Bavli's Seder Nezikin, its tractates on damages and courts as combative as ever."
 kehillah_study_torah.talmudics.bavli_kodashim_tt:0 "You take up the Bavli's Seder Kodashim, rites for a Temple that no longer stands argued as if it still did."
 kehillah_study_torah.talmudics.bavli_tahorot_tt:0 "You take up the Bavli's Seder Tahorot, most of it Mishnah alone -- only Niddah carries the Bavli's own Gemara this far."
 kehillah_study_torah.talmudics.yerushalmi_zeraim_tt:0 "You take up the Yerushalmi's Seder Zeraim, the one seder its Bavli counterpart mostly leaves to the Mishnah alone."
 kehillah_study_torah.talmudics.yerushalmi_moed_tt:0 "You take up the Yerushalmi's Seder Moed, terser than the Bavli's own and harder for it."
 kehillah_study_torah.talmudics.yerushalmi_nashim_tt:0 "You take up the Yerushalmi's Seder Nashim, its own rulings on marriage sometimes departing from the Bavli's."
 kehillah_study_torah.talmudics.yerushalmi_nezikin_tt:0 "You take up the Yerushalmi's Seder Nezikin, the courts of the Galilee arguing damages their own way."
 kehillah_study_torah.talmudics.halakhot_gedolot_tt:0 "You take up the Halakhot Gedolot, its rulings laid out in the plain, settled voice of a code rather than an argument."
 kehillah_study_torah.hashkafa.sefer_yetzirah_tt:0 "You take up the Sefer Yetzirah, its account of creation through letter and number as strange on the tenth reading as the first."
 kehillah_study_torah.hashkafa.emunot_vedeot_tt:0 "You take up Saadia Gaon's Book of Beliefs and Opinions, weighing his case for revelation against what reason alone can prove."
 kehillah_study_torah.hashkafa.chovot_halevavot_tt:0 "You take up the Duties of the Heart, its demands falling less on what you do than on what you actually feel while doing it."
 kehillah_study_torah.hashkafa.kuzari_tt:0 "You take up the Kuzari, its pagan king questioning the rabbi harder than most real opponents ever would."
 kehillah_study_torah.hashkafa.hekhalot_rabbati_tt:0 "You take up Hekhalot Rabbati, its account of the ascent through the seven halls no less vertiginous for how many times you have read it."
 kehillah_study_torah.hashkafa.shiur_qomah_tt:0 "You take up the Shi'ur Qomah, its measures of the divine form too vast to hold in the mind at once."
 kehillah_study_torah.hashkafa.sefer_harazim_tt:0 "You take up the Sefer HaRazim, working down through its heavens and the angels who keep each one."
