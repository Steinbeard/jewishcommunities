 activity_kehillah_bet_din_conference_conclusion_desc:0 "The docket is closed. Whatever was ruled, ruled well or poorly, is now part of the record."
 activity_kehillah_bet_din_conference_owner:0 "Convening Judge"
 # REWRITTEN 2026-09-17: used to flatly claim "A co-judge of the Bet
