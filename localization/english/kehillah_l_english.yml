 kehillah_repay_loan_decision_desc:0 "The debt to the Jewish community is still outstanding. It is owed to the community itself, not to any one man in it -- whoever leads them now will be paid, regardless of who extended the coin originally."
 kehillah_repay_loan_decision_tooltip:0 "Repay the outstanding loan in full."
 kehillah_repay_loan_decision_confirm:0 "Repay it"
