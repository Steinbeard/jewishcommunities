l_english:
 kehillah_bet_din.0611.t:0 "The Missing Torah Scroll"
 kehillah_bet_din.0611.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a congregation that lent a Torah scroll to its neighbors. [kbd_litigant_b.GetFirstName] speaks for the other synagogue, where the scroll now sits. Both remember repairs to its mantle; neither kept a lending note. The next reading approaches, and the court must keep the scroll in use while testing ownership."
 kehillah_bet_din.0611.a:0 "Return the scroll to the first congregation."
 kehillah_bet_din.0611.a.tt:0 "The first group can read, but a mistaken identification could take another's scroll."
 kehillah_bet_din.0611.b:0 "Keep it available and compare marks, repairs and witnesses."
 kehillah_bet_din.0611.b.tt:0 "Shared access costs coordination while the court checks the object."
 kehillah_bet_din.0611.c:0 "Leave the scroll with the second congregation permanently."
 kehillah_bet_din.0611.c.tt:0 "The second group keeps its reading, but a proven loan would be turned into a gift."
 kehillah_din_source_61:0 "Cite a mastered Moed work and inspect the scroll's custody."
 kehillah_din_source_61_tt:0 "Mishnah Megillah 3:1 concerns communal sacred property. It does not identify this scroll by its stitching."
 kehillah_din_combo_61:0 "Have a scholar and steward arrange readings and inspect the marks."
 kehillah_din_combo_61_tt:0 "The judges keep Torah reading possible while determining title."
 kehillah_bet_din.0614.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0614.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0614.outcome_1:0 "The court orders the scroll returned at once."
 kehillah_bet_din.0614.outcome_2:0 "The court arranges readings for both groups while examining marks and testimony."
 kehillah_bet_din.0614.outcome_3:0 "The court confirms the scroll in the second synagogue."
 kehillah_bet_din.0614.fact_true:0 "The sewn mark belongs to the second congregation's older scroll. Immediate return would seize the wrong book."
 kehillah_bet_din.0614.fact_false:0 "A repair record names the first congregation as owner and the transfer as a loan. Permanent retention ignored it."
 kehillah_bet_din.0614.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0614.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0614.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case61_one_tt:0 "Immediate transfer costs substantial Greatness."
 kehillah_din_case61_two_tt:0 "Shared access and inspection cost some Greatness."
 kehillah_din_case61_three_tt:0 "Permanent retention costs less now but may turn a loan into a taking."
 kehillah_bet_din_case61_great_log_title:0 "The Missing Torah Scroll: a well-supported ruling"
 kehillah_bet_din_case61_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s Torah scroll claim."
 kehillah_bet_din_case61_good_log_title:0 "The Missing Torah Scroll: a workable ruling"
 kehillah_bet_din_case61_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s Torah scroll claim."
 kehillah_bet_din_case61_poor_log_title:0 "The Missing Torah Scroll: a disputed ruling"
 kehillah_bet_din_case61_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s Torah scroll claim."
