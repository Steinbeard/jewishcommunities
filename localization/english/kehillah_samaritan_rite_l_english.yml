 kehillah_samaritan_rite_desc:0 "Samaritanism is the religious tradition of the Samaritan communities of Samaria and Mount Gerizim. It centers on the Samaritan Pentateuch and the sanctity of Mount Gerizim rather than Jerusalem. Samaritans maintain their own priestly succession and understand their Torah as the Mosaic original; Rabbinic Judaism contests these claims and does not accept the Samaritan Pentateuch or its rejection of the Prophets and Oral Torah."
