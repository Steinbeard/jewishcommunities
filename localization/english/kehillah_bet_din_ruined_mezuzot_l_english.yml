l_english:
 kehillah_bet_din.0621.t:0 "The Ruined Mezuzot"
 kehillah_bet_din.0621.desc:0 "[kbd_litigant_a.GetFirstName] sold mezuzot to households in the quarter. [kbd_litigant_b.GetFirstName] speaks for buyers who found blurred letters after the first rain. The seller says a damp doorway ruined sound parchment. The court must protect household practice and a craftsperson's name while testing when the damage began."
 kehillah_bet_din.0621.a:0 "Uphold the sale and blame damp doorways."
 kehillah_bet_din.0621.a.tt:0 "The dealer keeps the price, but defective ink would leave buyers with unusable work."
 kehillah_bet_din.0621.b:0 "Replace urgent cases and inspect unused parchments."
 kehillah_bet_din.0621.b.tt:0 "Immediate replacement and independent inspection cost money."
 kehillah_bet_din.0621.c:0 "Refund every buyer and bar the dealer from selling."
 kehillah_bet_din.0621.c.tt:0 "Buyers are compensated, but sound unused stock would make a blanket ban unfair."
 kehillah_din_source_62:0 "Cite a mastered Moed work and inspect the writing."
 kehillah_din_source_62_tt:0 "Mishnah Shabbat 7:2 provides ritual context; it cannot reveal whether this ink was defective before sale."
 kehillah_din_combo_62:0 "Have a scholar and steward arrange replacements and an inspection."
 kehillah_din_combo_62_tt:0 "The judges protect households without condemning the dealer on rumor."
 kehillah_bet_din.0624.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0624.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0624.outcome_1:0 "The court confirms the sale and asks households to repair their doors."
 kehillah_bet_din.0624.outcome_2:0 "The court supplies temporary replacements and has a scribe inspect unused pieces."
 kehillah_bet_din.0624.outcome_3:0 "The court refunds every sale and suspends the dealer."
 kehillah_bet_din.0624.fact_true:0 "Unused pieces show the same ink failure. Doorway damp was not the cause."
 kehillah_bet_din.0624.fact_false:0 "Unused parchment and ink pass inspection; damage follows a leaking roof. A blanket ban wronged the dealer."
 kehillah_bet_din.0624.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0624.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0624.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case62_one_tt:0 "Upholding sales risks substantial Greatness."
 kehillah_din_case62_two_tt:0 "Replacement and inspection cost some Greatness."
 kehillah_din_case62_three_tt:0 "Refund and ban cost less now but may ruin an honest craft."
 kehillah_bet_din_case62_great_log_title:0 "The Ruined Mezuzot: a well-supported ruling"
 kehillah_bet_din_case62_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s mezuzot complaint."
 kehillah_bet_din_case62_good_log_title:0 "The Ruined Mezuzot: a workable ruling"
 kehillah_bet_din_case62_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s mezuzot complaint."
 kehillah_bet_din_case62_poor_log_title:0 "The Ruined Mezuzot: a disputed ruling"
 kehillah_bet_din_case62_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s mezuzot complaint."
