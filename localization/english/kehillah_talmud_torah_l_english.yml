l_english:
 tenet_talmud_torah_name:0 "Talmud Torah"
 tenet_talmud_torah_desc:0 "The Torah was given twice at Sinai: written, and by mouth. Its oral teaching, set down in the Mishnah and the Talmud, binds as the written text does, and studying it is a lifelong obligation. A household sets aside time for learning, and each generation passes what it has learned to the next."
 doctrine_parameter_kehillah_talmud_torah_study_reward:0 "Learn Torah readers may master works once they are ready to enter the semicha curriculum. Mastery grants extra [piety|E] and [learning_lifestyle|E] experience; rabbis also deepen their command of the work's field."
 kehillah_study_torah.0001.mastered_talmud_torah_desc:0 "You have worked through the book and can now explain its central arguments to another reader. Your rite honors the time you gave to its study."
 kehillah_study_torah.0001.mastered_talmud_torah_desc_2:0 "The last page is turned, and the argument sits clearly in your mind. You could set it out for anyone who asked. Your community counts such hours among its obligations, and you have kept them."
 kehillah_study_torah.0001.mastered_talmud_torah_desc_3:0 "You close the book knowing it. The objections that troubled you in the first chapters have answers now, and you could give them aloud. A day set aside for study has been well spent."
 kehillah_study_torah.0001.repeat_talmud_torah_desc:0 "Returning to the book has opened passages you missed before. Your renewed study is valued, though the discovery is smaller than the first."
 kehillah_study_torah.0001.repeat_talmud_torah_desc_2:0 "A second reading brings out what the first passed over: a phrase repeated for a reason, a question left open on purpose. It is a quieter satisfaction than the first time through."
 kehillah_study_torah.0001.repeat_talmud_torah_desc_3:0 "You read the book again and find it altered, because you are. The old difficulties are easier now, and a few new ones have taken their place."

 kehillah_study_forbidden_toast_t:0 "Forbidden Study Rouses Suspicion"
 kehillah_study_forbidden_toast_d:0 "Your rite forbids this book. Studying it has roused suspicion and added Cherem experience."
 kehillah_study_torah.0001.forbidden_desc:0 "You have finished this stretch of study, but the book is forbidden by your rite. Word of your reading has roused suspicion among your community."
 KEHILLAH_STUDY_FORBIDDEN_MARK:0 "@warning_icon! "
 KEHILLAH_STUDY_FORBIDDEN_TT:0 "#T Forbidden by your rite#!\nStudying this book can add Cherem experience: 5 for a banned work, 15 for one under anathema. An unsuccessful rereading adds none. Acquiring a copy does not itself add Cherem experience."
