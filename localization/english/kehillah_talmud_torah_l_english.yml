l_english:
 tenet_talmud_torah_name:0 "Talmud Torah"
 tenet_talmud_torah_desc:0 "The study of Torah is a lifelong obligation and a sacred practice. A household sets aside time for learning, and each generation passes what it has learned to the next."
 doctrine_parameter_kehillah_talmud_torah_study_reward:0 "Mastering a work through Learn Torah grants additional [piety|E] and [learning_lifestyle|E] experience; rereading a mastered work grants a smaller reward."
 kehillah_study_torah.0001.mastered_talmud_torah_desc:0 "You have worked through the book and can now explain its central arguments to another reader. Your rite honors the time you gave to its study."
 kehillah_study_torah.0001.repeat_talmud_torah_desc:0 "Returning to the book has opened passages you missed before. Your renewed study is valued, though the discovery is smaller than the first."
