l_english:
 tenet_talmud_torah_name:0 "Talmud Torah"
 tenet_talmud_torah_desc:0 "The study of Torah is a lifelong obligation and a sacred practice. A household sets aside time for learning, and each generation passes what it has learned to the next."
 doctrine_parameter_kehillah_talmud_torah_study_reward:0 "Learn Torah readers can master works from Learning 8. Mastery grants extra [piety|E] and [learning_lifestyle|E] experience; readers with the Rabbi trait also gain extra experience in the work's field. The usual semicha curriculum still applies."
 kehillah_study_torah.0001.mastered_talmud_torah_desc:0 "You have worked through the book and can now explain its central arguments to another reader. Talmud Torah asks exactly this of a household: that the hours given to study should come back as understanding."
 kehillah_study_torah.0001.mastered_talmud_torah_desc_2:0 "The last page is turned, and the argument sits clearly in your mind. You could set it out for anyone who asked. Your community counts such hours among its obligations, and you have kept them."
 kehillah_study_torah.0001.mastered_talmud_torah_desc_3:0 "You close the book knowing it. The objections that troubled you in the first chapters have answers now, and you could give them aloud. A day set aside for study has been well spent."
 kehillah_study_torah.0001.repeat_talmud_torah_desc:0 "Returning to the book has opened passages you missed before. The discovery is smaller than the first, but your community holds that a text is never finished with its reader."
 kehillah_study_torah.0001.repeat_talmud_torah_desc_2:0 "A second reading brings out what the first passed over: a phrase repeated for a reason, a question left open on purpose. It is a quieter satisfaction than the first time through."
 kehillah_study_torah.0001.repeat_talmud_torah_desc_3:0 "You read the book again and find it altered, because you are. The old difficulties are easier now, and a few new ones have taken their place."
