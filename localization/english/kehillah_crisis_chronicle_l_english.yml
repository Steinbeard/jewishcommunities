 kehillah_struck_arrival_crusade:0 "$kehillah_struck_host$'s crusaders reached the quarter at dawn, crosses sewn to their cloaks."
 kehillah_struck_arrival_vizier:0 "The crowd came down from the Alcazaba at dawn, chanting the verses against the vizier."
 kehillah_struck_arrival_accusation:0 "$kehillah_struck_host$'s host came straight from the square, where the charge against us had been read aloud once more."
 kehillah_struck_arrival_debts:0 "$kehillah_struck_host$'s host reached the quarter at dusk. Many of the men in it owe money to families here."
 kehillah_struck_arrival_holy_week:0 "$kehillah_struck_host$'s host came out of the churches and down to the quarter as the sermons ended."
 kehillah_struck_arrival_1:0 "$kehillah_struck_host$'s host reached the quarter at midday, in full view of the town."
 kehillah_struck_arrival_2:0 "$kehillah_struck_host$'s host reached the quarter at dawn."
 kehillah_struck_arrival_3:0 "$kehillah_struck_host$'s host reached the quarter after nightfall, carrying torches."
 kehillah_struck_arrival_4:0 "$kehillah_struck_host$'s host came at dawn from every street that leads to the quarter."
 kehillah_struck_lost_men:0 "$kehillah_struck_men_lord$ did not send the soldiers we asked for. "
 kehillah_struck_lost_men_nolord:0 "No soldiers came for us. "
 kehillah_struck_lost_refuge:0 "$kehillah_struck_refuge_lord$ would not open $kehillah_struck_refuge_lord_his$ castle to us. "
 kehillah_struck_lost_refuge_nolord:0 "No castle would open its gates to us. "
 kehillah_struck_lost_escort:0 "No escort came to take our families out of town. "
 kehillah_struck_lost_condemned:0 "No one in authority would condemn the attack. "
 kehillah_struck_lost_terms:0 "$kehillah_struck_host$ would not bargain with us. "
 kehillah_struck_lost_silver:0 "$kehillah_struck_host$ took the silver we sent and marched anyway. "
 kehillah_struck_lost_delay:0 "$kehillah_struck_host$ would not wait. "
 kehillah_struck_lost_divide:0 "We could not turn $kehillah_struck_host$'s captains against $kehillah_struck_host_him$. "
 kehillah_struck_lost_oath:0 "$kehillah_struck_host$ would not hear of $kehillah_struck_host_his$ oath to keep the peace. "
 kehillah_struck_lost_watch:0 "We could not find enough men to stand with the watch. "
 kehillah_struck_lost_arms:0 "We could not arm our own men. "
 kehillah_struck_lost_bar:0 "Our barricades fell almost at once. "
 kehillah_struck_lost_shelter:0 "There was no room to hide everyone. "
 kehillah_struck_lost_retreat:0 "The way out we planned has been cut off. "
 kehillah_struck_won_men:0 "True to $kehillah_struck_men_lord_his$ word, $kehillah_struck_men_lord$ sent soldiers to guard us, and the sight of them has turned part of the crowd away. "
 kehillah_struck_won_men_nolord:0 "Soldiers came to guard us, and the sight of them has turned part of the crowd away. "
 kehillah_struck_won_refuge:0 "$kehillah_struck_refuge_lord$ has taken our old and sick into $kehillah_struck_refuge_lord_his$ castle. "
 kehillah_struck_won_refuge_nolord:0 "Our old and sick have found refuge behind castle walls. "
 kehillah_struck_won_escort:0 "Many families left town before the host arrived, though their empty houses are now open to looting. "
 kehillah_struck_won_condemned:0 "Some of the town stayed home, heeding those who condemned the attack. "
 kehillah_struck_won_terms:0 "$kehillah_struck_host$ accepted our payment, and some of $kehillah_struck_host_his$ men have gone home with their share. "
 kehillah_struck_won_silver:0 "The silver we sent to $kehillah_struck_host$'s camp kept the host there longer than it meant to stay. "
 kehillah_struck_won_delay:0 "$kehillah_struck_host$ agreed to wait a night, and we used it to move what we could to safety. "
 kehillah_struck_won_divide:0 "Some of $kehillah_struck_host$'s captains quarreled with $kehillah_struck_host_him$ and stayed behind with their men. "
 kehillah_struck_won_oath:0 "Reminded of $kehillah_struck_host_his$ oath to keep the peace, $kehillah_struck_host$ is holding some of $kehillah_struck_host_his$ men back. "
 kehillah_struck_won_watch:0 "The watch is holding the lanes around the synagogue. "
 kehillah_struck_won_arms:0 "Our own men are armed and standing at their doors. "
 kehillah_struck_won_bar:0 "Our barricades held the host in the lanes for a time. "
 kehillah_struck_won_shelter:0 "Most of the women and children are hidden in the synagogue and in cellars across the quarter. "
 kehillah_struck_won_retreat:0 "Families are leaving by the back gate, as we planned. "
 kehillah_struck_won_supplies:0 "We have food and water laid in for the days ahead. "
 kehillah_struck_breach_unprepared:0 "We had made no preparations, and $kehillah_struck_host$'s men have walked into the quarter."
 kehillah_struck_breach_failed:0 "None of it stopped them. $kehillah_struck_host$'s men have broken into the quarter."
 kehillah_struck_breach_plain:0 "$kehillah_struck_host$'s men have broken into the quarter."
 kehillah_struck_breach_slowed:0 "Even so, $kehillah_struck_host$'s men have broken into the quarter."
 kehillah_struck_breach_fewer:0 "Even so, $kehillah_struck_host$'s men have broken into the quarter, though fewer of them than we feared."
 kehillah_struck_grade_lessened:0 "#italic Your preparations have lessened this attack from [ROOT.Char.Custom('KehillahStruckGradeBefore')] to [ROOT.Char.Custom('KehillahStruckGradeAfter')].#!"
 kehillah_struck_grade_softened:0 "#italic Your preparations have softened this attack, which remains [ROOT.Char.Custom('KehillahStruckGradeAfter')].#!"
 kehillah_struck_grade_not_enough:0 "#italic Your preparations were not enough to lessen this attack. It remains [ROOT.Char.Custom('KehillahStruckGradeAfter')].#!"
 kehillah_struck_grade_plain:0 "#italic This attack is [ROOT.Char.Custom('KehillahStruckGradeAfter')].#!"
 kehillah_struck_grade_name_1:0 "Contained"
 kehillah_struck_grade_name_2:0 "Serious"
 kehillah_struck_grade_name_3:0 "Grave"
 kehillah_struck_grade_name_4:0 "Catastrophic"
 kehillah_struck_closing_1:0 "The attack has not spread beyond the streets by the gate. We must protect our people and our property until it passes."
 kehillah_struck_closing_2:0 "We must protect our people and our property as best we can while the mob is loose in the quarter."
 kehillah_struck_closing_3:0 "Much of the quarter is in their hands. We must save whoever and whatever we can."
 kehillah_struck_closing_4:0 "The mob is everywhere in the quarter. We must save whoever we can."
 # 2026-11-08: the Armed host opener (kehillah_crisis_chronicle.0002). Reads the ledger from kehillah_crisis_armed_reckoning_effect.
 kehillah_crisis_chronicle.0002.t:0 "The Host Gathers"
 kehillah_crisis_chronicle.0002.a:0 "We must prepare the quarter."
