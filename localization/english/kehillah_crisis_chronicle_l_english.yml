 kehillah_crisis_chronicle.0001.armed_a:0 "We must prepare for the host."
 kehillah_crisis_chronicle.0001.spared_a:0 "We have been spared. Now the ruler must answer."
 kehillah_crisis_chronicle.0001.held_a:0 "The quarter held. Let us reckon with what remains."
 kehillah_crisis_chronicle.0001.struck_a:0 "See to those still in the quarter."
 kehillah_crisis_chronicle.0001.recovery_a:0 "We must tend to those who survived."
 kehillah_crisis_chronicle.0003.t:0 "The Crowd Disperses"
 kehillah_crisis_chronicle.0003.a:0 "We have been spared. Now the ruler must answer."
 kehillah_crisis_chronicle.0003.desc:0 "The crowd has not become an armed host. As the streets empty, shuttered doors begin to open and word passes from household to household: for this night, the quarter is safe.\n\nThe danger has not been forgotten. Its leaders still speak freely, and the community now waits to see whether its ruler will turn this reprieve into protection."
 kehillah_chronicle_open_vizier:0 "The verses against the Jewish vizier have passed from courtly grievance into the streets of Granada."
 kehillah_chronicle_open_crusade:0 "The crusading host has drawn followers from beyond the town, and some turn their zeal toward the Jewish quarter."
 kehillah_chronicle_open_accusation:0 "A charge against the community has been repeated in the market until rumor sounds like testimony."
 kehillah_chronicle_open_debts:0 "The town's resentment over debts has become a charge against the whole community."
 kehillah_chronicle_open_holy_week:0 "Hard sermons in Holy Week have given old accusations new force."
 kehillah_chronicle_open_generic:0 "Words against the quarter have found an audience in the town."
 kehillah_chronicle_dev_sermon:0 "A sermon gave the accusation a new audience."
 kehillah_chronicle_dev_tavern_song:0 "A hostile song passed from the tavern into the streets."
 kehillah_chronicle_dev_market_whispers:0 "Unfounded talk in the market made ordinary trade more fraught."
 kehillah_chronicle_dev_hall:0 "A well-connected household lent its hall to the agitator's meetings."
 kehillah_chronicle_dev_false_alarm:0 "A warning before dawn sent families packing before anyone could verify it."
 kehillah_chronicle_dev_vandalism:0 "A shop at the edge of the quarter was damaged while its neighbors watched."
 kehillah_chronicle_dev_assembly:0 "Men gathered at the crossing and spoke openly against the quarter."
 kehillah_chronicle_dev_officer:0 "A town officer allowed the speakers to gather despite a neighbor's testimony."
 kehillah_chronicle_dev_watch:0 "A disturbance tested the watch in the quarter's streets."
 kehillah_chronicle_dev_market:0 "Talk in the market brought the unrest closer to ordinary households."
 kehillah_chronicle_dev_follower:0 "Another follower joined the agitator's cause."
 kehillah_chronicle_dev_brawl:0 "A quarrel in the street raised the danger of broader violence."
 kehillah_chronicle_dev_neighbours:0 "Neighbors were pressed to decide whether they would stand with the quarter."
 kehillah_chronicle_dev_child:0 "A frightened household found itself at the center of the unrest."
 kehillah_chronicle_dev_threats:0 "Threats against the quarter grew more explicit."
 kehillah_chronicle_dev_vizier:0 "The verses against the vizier travelled through Granada."
 kehillah_chronicle_dev_crusade:0 "Vow-takers spoke of the quarter as a target on their road."
 kehillah_chronicle_dev_debts:0 "Anger over debts reached the streets beyond the market."
 kehillah_chronicle_dev_other:0 "The unrest spread through the town."
 kehillah_chronicle_justice_arrested:0 "The ruler had the agitator arrested."
 kehillah_chronicle_justice_censured:0 "The ruler publicly censured the agitator, who remained free."
 kehillah_chronicle_justice_unpunished:0 "The ruler allowed the agitator to go unpunished."
 kehillah_chronicle_justice_beyond_reach:0 "The agitator was beyond the ruler's reach when judgment came."
 kehillah_chronicle_justice_unknown:0 "The agitator's fate remained uncertain."
 kehillah_chronicle_ruler_aid:0 "The ruler reaffirmed the quarter's protection and offered aid."
 kehillah_chronicle_ruler_price:0 "The ruler demanded a price for renewed protection."
 kehillah_chronicle_ruler_refused:0 "The ruler offered no further help."
 kehillah_chronicle_ruler_edict:0 "The ruler ordered the community to leave; its members now face a separate appeal or departure."
 kehillah_chronicle_ruler_unknown:0 "The ruler gave no settled answer."
 kehillah_chronicle_lives_lost:0 "The dead left families and duties behind."
 kehillah_chronicle_buildings_lost:0 "Damaged communal buildings still require repair."
 kehillah_chronicle_books_lost:0 "Books were lost from the community's study houses."
 kehillah_chronicle_captives_home:0 "The captives were brought home by ransom."
 kehillah_chronicle_captives_held:0 "Some captives remain in the attackers' hands."
 kehillah_chronicle_no_losses:0 "The community's material losses were limited."
 kehillah_chronicle_collapsed:0 "The survivors dispersed and the kehillah ceased to exist."
 kehillah_chronicle_expelled:0 "The crisis is over, but the edict of departure remains to be answered."
 kehillah_chronicle_relief:0 "Relief efforts helped the community endure with its losses still visible."
 kehillah_chronicle_endured:0 "The community endured, though the unrest left its mark."
 kehillah_chronicle_lord_condemned:0 "The lord publicly condemned the calls to violence."
 kehillah_chronicle_scholars_condemned:0 "Religious scholars spoke against violence."
 kehillah_chronicle_overlord_order:0 "An order from the higher court called for peace."
 kehillah_chronicle_condemned:0 "An authority spoke against the incitement."
 kehillah_chronicle_no_authority:0 "No clear condemnation came from those in power."
 kehillah_chronicle_aid_given:0 "Aid to frightened households helped the quarter remain together."
 kehillah_chronicle_mediated:0 "The dayyan reconciled those who urged patience with those who wanted to resist."
 kehillah_chronicle_watch:0 "A watch kept the quarter's streets under observation."
 kehillah_chronicle_no_community:0 "The households watched the unrest with growing unease."
 kehillah_chronicle_refuted:0 "Evidence exposed the weakness of the charge."
 kehillah_chronicle_neighbors:0 "Neighbors spoke for the quarter before the town."
 kehillah_chronicle_answered:0 "Our answer to the accusation was heard in public."
 kehillah_chronicle_no_case:0 "The accusation continued to circulate unanswered."
 kehillah_chronicle_men:0 "The lord's men stood by the quarter."
 kehillah_chronicle_refuge:0 "Families found a refuge from the host."
 kehillah_chronicle_barred:0 "The lanes were barricaded before the host arrived."
 kehillah_chronicle_bargain:0 "The host's captain accepted more modest terms."
 kehillah_chronicle_retreat:0 "The households prepared a way to retreat if the lanes failed."
 kehillah_chronicle_sheltered:0 "Families sheltered within the quarter before the host came."
 kehillah_chronicle_no_defense:0 "The quarter had little time to prepare its streets."
 kehillah_chronicle_host_delayed:0 "The host's advance was delayed by negotiation."
 kehillah_chronicle_host_divided:0 "The host's captains disagreed over whether to press the attack."
 kehillah_chronicle_host_restrained:0 "The host's leader was reminded of obligations he could not easily dismiss."
 kehillah_chronicle_no_parley:0 "No terms with the host could be secured."
 kehillah_chronicle_no_armed:0 "The quarter met the approaching host with few new protections."
 kehillah_chronicle_near_host:0 "The host almost formed: the quarter remains deeply shaken, and its lord may reconsider his policy."
 kehillah_chronicle_shaken:0 "The danger passed, though fear and distrust linger in the streets."
 kehillah_chronicle_quiet:0 "The call to violence lost its force before a host could form."
 kehillah_crisis_chronicle.0001.armed:0 "[ROOT.Char.Custom('KehillahCrisisOpeningBeat')] [ROOT.Char.Custom('KehillahCrisisDevelopmentBeat')] [ROOT.Char.Custom('KehillahCrisisAuthorityBeat')] [ROOT.Char.Custom('KehillahCrisisCommunityBeat')] [ROOT.Char.Custom('KehillahCrisisCaseBeat')]\n\nDespite those efforts, an armed host has gathered. The quarter must now seek enforceable protection, prepare its defenses, and consider terms with the men approaching it."
 kehillah_crisis_chronicle.0001.spared:0 "[ROOT.Char.Custom('KehillahCrisisOpeningBeat')] [ROOT.Char.Custom('KehillahCrisisDevelopmentBeat')] [ROOT.Char.Custom('KehillahCrisisAuthorityBeat')] [ROOT.Char.Custom('KehillahCrisisCommunityBeat')] [ROOT.Char.Custom('KehillahCrisisCaseBeat')]\n\nNo armed host emerged. [ROOT.Char.Custom('KehillahCrisisResidualBeat')] The ruler's judgment and the agitator's fate remain to be settled."
 kehillah_crisis_chronicle.0001.held:0 "[ROOT.Char.Custom('KehillahCrisisOpeningBeat')] [ROOT.Char.Custom('KehillahCrisisArmedBeat')] [ROOT.Char.Custom('KehillahCrisisArmedDefenseBeat')] [ROOT.Char.Custom('KehillahCrisisArmedParleyBeat')]\n\nThe quarter held. The host has been stopped, though the damage at its margins and the ruler's response still require an accounting."
 kehillah_crisis_chronicle.0001.struck:0 "[ROOT.Char.Custom('KehillahCrisisOpeningBeat')] [ROOT.Char.Custom('KehillahCrisisArmedBeat')] [ROOT.Char.Custom('KehillahCrisisArmedDefenseBeat')] [ROOT.Char.Custom('KehillahCrisisArmedParleyBeat')]\n\nThe host breached the quarter. The protection secured earlier may yet spare people and possessions, but the attack's losses must now be counted."
 kehillah_crisis_chronicle.0001.recovery:0 "[ROOT.Char.Custom('KehillahCrisisOpeningBeat')] [ROOT.Char.Custom('KehillahCrisisArmedBeat')] [ROOT.Char.Custom('KehillahCrisisArmedDefenseBeat')] [ROOT.Char.Custom('KehillahCrisisArmedParleyBeat')]\n\nThe quarter was struck. The survivors now need relief and an answer from the ruler. The kehillah may endure in a diminished state; if its people and institutions disperse, it may collapse."
 kehillah_crisis_chronicle.0090.t:0 "What the Kehillah Survived"
 kehillah_crisis_chronicle.0090.a:0 "Remember what happened here."
 kehillah_crisis_chronicle.0090.spared:0 "[ROOT.Char.Custom('KehillahCrisisOpeningBeat')] [ROOT.Char.Custom('KehillahCrisisDevelopmentBeat')] [ROOT.Char.Custom('KehillahCrisisAuthorityBeat')] [ROOT.Char.Custom('KehillahCrisisCommunityBeat')] [ROOT.Char.Custom('KehillahCrisisCaseBeat')]\n\nThe danger was defused before an armed host formed. [ROOT.Char.Custom('KehillahCrisisResidualBeat')] [ROOT.Char.Custom('KehillahCrisisRulerBeat')] [ROOT.Char.Custom('KehillahCrisisJusticeBeat')] [ROOT.Char.Custom('KehillahCrisisRecoveryBeat')]"
 kehillah_crisis_chronicle.0090.held:0 "[ROOT.Char.Custom('KehillahCrisisOpeningBeat')] [ROOT.Char.Custom('KehillahCrisisDevelopmentBeat')] [ROOT.Char.Custom('KehillahCrisisArmedBeat')] [ROOT.Char.Custom('KehillahCrisisArmedDefenseBeat')] [ROOT.Char.Custom('KehillahCrisisArmedParleyBeat')]\n\nThe host was turned away. [ROOT.Char.Custom('KehillahCrisisRulerBeat')] [ROOT.Char.Custom('KehillahCrisisJusticeBeat')] [ROOT.Char.Custom('KehillahCrisisRecoveryBeat')]"
 kehillah_crisis_chronicle.0090.struck:0 "[ROOT.Char.Custom('KehillahCrisisOpeningBeat')] [ROOT.Char.Custom('KehillahCrisisDevelopmentBeat')] [ROOT.Char.Custom('KehillahCrisisArmedBeat')] [ROOT.Char.Custom('KehillahCrisisArmedDefenseBeat')] [ROOT.Char.Custom('KehillahCrisisArmedParleyBeat')]\n\nThe host entered the quarter. [ROOT.Char.Custom('KehillahCrisisLossBeat')] [ROOT.Char.Custom('KehillahCrisisRulerBeat')] [ROOT.Char.Custom('KehillahCrisisJusticeBeat')] [ROOT.Char.Custom('KehillahCrisisRecoveryBeat')]"
 kehillah_crisis_phase_held_t:0 "Kehillah Crisis: Quarter Held"
 kehillah_crisis_phase_held_d:0 "The approaching host has been stopped. The community now awaits the ruler's judgment and accounts for the damage."
 kehillah_crisis_phase_struck_t:0 "Kehillah Crisis: Quarter Struck"
 kehillah_crisis_phase_struck_d:0 "The host has breached the quarter. The attack's losses and the ruler's response will determine what comes next."
 kehillah_crisis_phase_recovery_t:0 "Kehillah Crisis: Recovery"
 kehillah_crisis_phase_recovery_d:0 "The survivors face a struggle to keep their community together. Relief, protection, and the ruler's judgment will matter."
