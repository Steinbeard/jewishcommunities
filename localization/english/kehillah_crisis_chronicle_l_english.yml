 kehillah_crisis_chronicle.0001.t:0 "The Crisis Turns"
 kehillah_crisis_chronicle.0001.a:0 "We must face what comes next."
 kehillah_crisis_chronicle.0001.armed_t:0 "An Armed Host Gathers"
 kehillah_crisis_chronicle.0001.spared_t:0 "The Danger Passes"
 kehillah_crisis_chronicle.0001.held_t:0 "The Quarter Holds"
