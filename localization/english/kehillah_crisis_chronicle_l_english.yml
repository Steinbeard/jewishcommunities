 kehillah_armed_host_his:0 "[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_al_name_host').Char.GetHerHis]"
 kehillah_armed_host_him:0 "[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_al_name_host').Char.GetHerHim]"
 kehillah_armed_lord:0 "[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_al_name_lord').Char.GetTitledFirstName]"
 kehillah_armed_ruler:0 "[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_al_name_ruler').Char.GetTitledFirstName]"
 kehillah_armed_ruler_his:0 "[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_al_name_ruler').Char.GetHerHis]"
 kehillah_armed_refuser:0 "[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_al_name_refuser').Char.GetTitledFirstName]"
 kehillah_armed_opening_sudden:0 "$kehillah_armed_host$ has raised an armed band against us, with no warning."
 kehillah_armed_opening_granada:0 "Abu Ishaq's verses against the Jewish vizier have passed from the court into the squares of Granada."
 kehillah_armed_opening_vizier:0 "$kehillah_armed_host$ has been preaching against the Jew who serves at court, and against all of us with him."
 kehillah_armed_opening_crusade:0 "$kehillah_armed_host$ has been preaching the crusade, and some of those who took the cross have turned on us."
 kehillah_armed_opening_accusation:0 "$kehillah_armed_host$ has been repeating the charge against us in the market."
 kehillah_armed_opening_debts:0 "$kehillah_armed_host$ has been turning the town's anger over its debts against all of us."
 kehillah_armed_opening_holy_week:0 "$kehillah_armed_host$ has been preaching against us through Holy Week."
 kehillah_armed_opening_preacher:0 "$kehillah_armed_host$ has been preaching against us in the town."
 kehillah_armed_lost_lord:0 "$kehillah_armed_lord$ would not speak against $kehillah_armed_host$. "
 kehillah_armed_lost_lord_noname:0 "The lord would not speak against $kehillah_armed_host$. "
 kehillah_armed_lost_overlord:0 "$kehillah_armed_ruler$'s court turned our petition away. "
 kehillah_armed_lost_overlord_noname:0 "The court turned our petition away. "
 kehillah_armed_lost_scholars:0 "The scholars we asked would not denounce the violence. "
 kehillah_armed_lost_town:0 "The town's officers would not act to keep order. "
 kehillah_armed_lost_silence:0 "$kehillah_armed_ruler$ would not forbid the recitations. "
 kehillah_armed_lost_condemned:0 "$kehillah_armed_refuser$ would not condemn $kehillah_armed_host$. "
 kehillah_armed_lost_fast:0 "Few households kept the fast we proclaimed. "
 kehillah_armed_lost_watch:0 "We could not find enough men to keep a watch. "
 kehillah_armed_lost_aid:0 "Our aid ran short before it reached every family. "
 kehillah_armed_lost_mediate:0 "We could not reconcile the frightened families with the young men who want to fight. "
 kehillah_armed_lost_answer:0 "Our public answer to $kehillah_armed_host$ did not sway the town. "
 kehillah_armed_lost_advocacy:0 "No one in the market or at court would hear our case. "
 kehillah_armed_lost_evidence:0 "The town dismissed the proof we gathered against the charge. "
 kehillah_armed_lost_neighbors:0 "The neighbors we asked to speak for us kept quiet. "
 kehillah_armed_lost_burned:0 "We burned the copy of the verses we were given, but others still pass from hand to hand. "
 kehillah_armed_won_lord:0 "$kehillah_armed_lord$ has forbidden violence against us. "
 kehillah_armed_won_lord_noname:0 "The lord has forbidden violence against us. "
 kehillah_armed_won_overlord:0 "$kehillah_armed_ruler$'s court has sent a written order to keep the peace. "
 kehillah_armed_won_overlord_noname:0 "A written order to keep the peace has come from the court. "
 kehillah_armed_won_scholars:0 "The scholars have denounced the violence. "
 kehillah_armed_won_town:0 "The town's officers have promised to keep order. "
 kehillah_armed_won_silence:0 "$kehillah_armed_ruler$ has forbidden the recitations, and the verses are no longer heard in the squares. "
 kehillah_armed_won_condemned:0 "$kehillah_armed_host$ has been condemned, and some who listened to $kehillah_armed_host_him$ have stayed away. "
 kehillah_armed_won_fast:0 "The fast we proclaimed drew the households together. "
 kehillah_armed_won_watch:0 "Our watch is keeping the streets of the quarter. "
 kehillah_armed_won_aid:0 "Families whose trade had stopped have been fed. "
 kehillah_armed_won_mediate:0 "The frightened families and the young men who wanted to fight have been reconciled. "
 kehillah_armed_won_supplies:0 "We have laid in food and water. "
 kehillah_armed_won_routes:0 "We have found routes out of town for the families who must leave. "
 kehillah_armed_won_answer:0 "Our public answer to $kehillah_armed_host$ has swayed some of the town. "
 kehillah_armed_won_advocacy:0 "Our case has been heard in the market and at court. "
 kehillah_armed_won_evidence:0 "We have shown the charge against us to be false. "
 kehillah_armed_won_neighbors:0 "Respected neighbors have spoken for us. "
 kehillah_armed_won_burned:0 "We burned the copy of the verses we were given and quietly gathered in the rest, and the talk has died away. "
 kehillah_armed_turn_unprepared:0 "We did nothing to answer $kehillah_armed_host$, and now $kehillah_armed_host_his$ followers have taken up arms."
 kehillah_armed_turn_failed:0 "None of it calmed the town. $kehillah_armed_host$'s followers have taken up arms."
 kehillah_armed_turn_plain:0 "$kehillah_armed_host$'s followers have taken up arms."
 kehillah_armed_turn_not_enough:0 "It was not enough. $kehillah_armed_host$'s followers have taken up arms."
 kehillah_armed_turn_slowed:0 "Even so, $kehillah_armed_host$'s followers have taken up arms."
 kehillah_armed_turn_fewer:0 "Even so, $kehillah_armed_host$'s followers have taken up arms, though fewer have joined $kehillah_armed_host_him$ than we feared."
 kehillah_armed_turn_granada_unprepared:0 "We did nothing to answer Abu Ishaq, and now the Sanhaja commanders are arming their followers and summoning men from the villages around Granada. Abu Ishaq's call for your death is being recited in the barracks."
 kehillah_armed_turn_granada_failed:0 "None of it calmed the city. The Sanhaja commanders are arming their followers and summoning men from the villages around Granada. Abu Ishaq's call for your death is being recited in the barracks."
 kehillah_armed_turn_granada_plain:0 "The Sanhaja commanders are arming their followers and summoning men from the villages around Granada. Abu Ishaq's call for your death is being recited in the barracks."
 kehillah_armed_turn_granada_not_enough:0 "It was not enough. The Sanhaja commanders are arming their followers and summoning men from the villages around Granada. Abu Ishaq's call for your death is being recited in the barracks."
 kehillah_armed_turn_granada_slowed:0 "Even so, the Sanhaja commanders are arming their followers and summoning men from the villages around Granada. Abu Ishaq's call for your death is being recited in the barracks."
 kehillah_armed_turn_granada_fewer:0 "Even so, the Sanhaja commanders are arming their followers, though fewer men have come in from the villages than we feared. Abu Ishaq's call for your death is being recited in the barracks."
 kehillah_armed_granada_emir:0 "\n\n$kehillah_armed_ruler$ has given no order to attack you, yet $kehillah_armed_ruler_his$ soldiers are preparing to act without $kehillah_armed_ruler_his$ leave."
 kehillah_armed_grade_lessened:0 "#italic Your efforts have lowered this threat from [ROOT.Char.Custom('KehillahArmedGradeBefore')] to [ROOT.Char.Custom('KehillahStruckGradeAfter')].#!"
 kehillah_armed_grade_head_start:0 "#italic This threat remains [ROOT.Char.Custom('KehillahStruckGradeAfter')], but your efforts have given the quarter's defense a head start.#!"
 kehillah_armed_grade_not_enough:0 "#italic Your efforts were not enough to lower this threat. It remains [ROOT.Char.Custom('KehillahStruckGradeAfter')].#!"
 kehillah_armed_grade_plain:0 "#italic This threat is [ROOT.Char.Custom('KehillahStruckGradeAfter')].#!"
 kehillah_armed_closing:0 "While they muster, we must strengthen the quarter's defenses and seek protection."
 kehillah_armed_closing_hard:0 "They will not be easily turned back. While they muster, we must strengthen the quarter's defenses and seek protection."
