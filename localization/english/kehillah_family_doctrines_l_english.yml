l_english:
 kehillah_interfaith_marriage_name:0 "Marriage Outside Judaism"
 kehillah_interfaith_marriage_restricted_name:0 "Forbidden"
 kehillah_interfaith_marriage_restricted_desc:0 "A member of our faith may marry within Judaism, but not someone outside it."
 kehillah_interfaith_marriage_permitted_name:0 "Permitted"
 kehillah_interfaith_marriage_permitted_desc:0 "A member of our faith may marry someone outside Judaism, though the match must still meet the usual marriage requirements."
 kehillah_interfaith_marriage_forbidden:0 "This Jewish faith forbids marriage outside Judaism"
 kehillah_jewish_descent_name:0 "Jewish Descent"
 kehillah_jewish_descent_matrilineal_name:0 "Matrilineal Descent"
 kehillah_jewish_descent_matrilineal_desc:0 "A child of a Jewish mother belongs to her faith and rite, even when the father follows another religion."
 kehillah_jewish_descent_patrilineal_name:0 "Patrilineal Descent"
 kehillah_jewish_descent_patrilineal_desc:0 "A child of a Jewish father belongs to his faith and rite, even when the mother follows another religion."
 kehillah_jewish_descent_either_parent_name:0 "Descent Through Either Parent"
 kehillah_jewish_descent_either_parent_desc:0 "A child belongs to the Jewish parent's faith and rite when either parent is Jewish."
 kehillah_proselytism_name:0 "Proselytism"
 kehillah_proselytism_discouraged_name:0 "Discouraged"
 kehillah_proselytism_discouraged_desc:0 "Sincere converts may be accepted, but our faith does not seek them out. Rulers of this rite cannot plan Mass Conversion or demand that anyone outside Judaism convert."
 kehillah_proselytism_encouraged_name:0 "Encouraged"
 kehillah_proselytism_encouraged_desc:0 "Spreading our faith is a religious duty. Rulers of this rite may plan Mass Conversion and demand conversion."
 kehillah_forced_conversion_forbidden_tt:0 "A coerced conversion is no conversion: our faith does not seek converts (#V Proselytism: Discouraged#!), and a convert must accept the commandments freely"
