l_english:
 kehillah_bet_din.01061.t:0 "The Child Returned from Captivity"
 kehillah_bet_din.01061.desc:0 "A child has returned after years away. [kbd_litigant_a.GetFirstName] seeks custody as kin; [kbd_litigant_b.GetFirstName] managed the child's property during the absence. Both claim to have kept it safe, but the child has not been asked where they feel secure."
 kehillah_bet_din.01061.a:0 "Give kin full custody and the estate today."
 kehillah_bet_din.01061.a.tt:0 "A missing estate account may follow the child home."
 kehillah_bet_din.01061.b:0 "Hear the child and audit the guardian's account."
 kehillah_bet_din.01061.b.tt:0 "Inquiry costs time but joins the child's welfare to the property record."
 kehillah_bet_din.01061.c:0 "Leave custody and property permanently with the guardian."
 kehillah_bet_din.01061.c.tt:0 "Kinship and a valid inheritance claim may be ignored."
 kehillah_din_source_106:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_106_tt:0 "Mishnah Bava Batra 9:1 gives the judges a textual point of reference. It cannot establish the child's wishes and the guardian's account."
 kehillah_din_combo_106:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_106_tt:0 "The judges preserve both parties' interests while checking the child's wishes and the guardian's account."
 kehillah_bet_din.01064.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01064.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01064.outcome_1:0 "The relative receives custody and property at once."
 kehillah_bet_din.01064.outcome_2:0 "The court appoints temporary care while checking accounts and the child's wishes."
 kehillah_bet_din.01064.outcome_3:0 "The guardian retains everything."
 kehillah_bet_din.01064.fact_true:0 "The guardian's account omits income held for the child. A quick transfer without audit loses it."
 kehillah_bet_din.01064.fact_false:0 "The relative has a clear claim and the child wants to join them. Permanent refusal ignores both."
 kehillah_bet_din.01064.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01064.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01064.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case106_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case106_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case106_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_bet_din_case106_great_log_title:0 "The Child Returned from Captivity: a well-supported ruling"
 kehillah_bet_din_case106_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the child returned from captivity dispute."
 kehillah_bet_din_case106_good_log_title:0 "The Child Returned from Captivity: a workable ruling"
 kehillah_bet_din_case106_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the child returned from captivity dispute."
 kehillah_bet_din_case106_poor_log_title:0 "The Child Returned from Captivity: a disputed ruling"
 kehillah_bet_din_case106_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the child returned from captivity dispute."
