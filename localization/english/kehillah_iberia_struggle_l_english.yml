l_english:
 # Catalysts (common/struggle/catalysts/kehillah_catalysts.txt), in vanilla's own form
 catalyst_kehillah_crisis:0 "Jewish Community in Crisis [struggle_catalyst_catalyst|E]"
 catalyst_kehillah_crisis_desc:0 "A Jewish community in the region faces a mob, a trial or an armed host"
 catalyst_kehillah_lost:0 "Jewish Community Lost [struggle_catalyst_catalyst|E]"
 catalyst_kehillah_lost_desc:0 "A Jewish community in the region is destroyed, expelled or dissolved"
 catalyst_kehillah_charter_worsened:0 "Jewish Charter Worsened [struggle_catalyst_catalyst|E]"
 catalyst_kehillah_charter_worsened_desc:0 "A Jewish community in the region is given a less favorable charter"
 catalyst_kehillah_founded:0 "Jewish Community Founded [struggle_catalyst_catalyst|E]"
 catalyst_kehillah_founded_desc:0 "A Jewish community is founded in the region"
 catalyst_kehillah_flourishing:0 "Jewish Community Flourishing [struggle_catalyst_catalyst|E]"
 catalyst_kehillah_flourishing_desc:0 "A Jewish community in the region reaches Flourishing in a pillar"
 catalyst_kehillah_charter_improved:0 "Jewish Charter Improved [struggle_catalyst_catalyst|E]"
 catalyst_kehillah_charter_improved_desc:0 "A Jewish community in the region is given a more favorable charter"

 # Notices to the community's player (kehillah_iberia_struggle_effects.txt)
 kehillah_iberia_push_crisis_t:0 "Sepharad Watches Our Trouble"
 kehillah_iberia_push_crisis_d:0 "Word of the danger to our Quarter has spread through Iberia, and each side reads it as proof against the other.\n\n[ROOT.Char.Custom('KehillahIberiaRuinOutcome')]"
 kehillah_iberia_push_lost_t:0 "A Light of Sepharad Goes Out"
 kehillah_iberia_push_lost_d:0 "The end of our community is told in every court of Iberia, and it hardens hearts on both sides of the frontier.\n\n[ROOT.Char.Custom('KehillahIberiaRuinOutcome')]"
 kehillah_iberia_push_charter_worsened_t:0 "Our Charter Is Narrowed"
 kehillah_iberia_push_charter_worsened_d:0 "Our lord has taken back what he once granted us, and his rivals take note of how he treats those of another faith.\n\n[ROOT.Char.Custom('KehillahIberiaRuinOutcome')]"
 kehillah_iberia_push_founded_t:0 "A New Community in Sepharad"
 kehillah_iberia_push_founded_d:0 "Our founding shows that Jew, Christian and Muslim can still make a life side by side in Iberia.\n\n[ROOT.Char.Custom('KehillahIberiaFlourishOutcome')]"
 kehillah_iberia_push_flourishing_t:0 "Sepharad Takes Note"
 kehillah_iberia_push_flourishing_d:0 "Our community's flourishing is spoken of at courts of every faith in Iberia.\n\n[ROOT.Char.Custom('KehillahIberiaFlourishOutcome')]"
 kehillah_iberia_push_charter_improved_t:0 "Our Charter Is Widened"
 kehillah_iberia_push_charter_improved_d:0 "Our lord has granted us better terms, and the other courts of Iberia take note of a ruler who deals fairly with another faith.\n\n[ROOT.Char.Custom('KehillahIberiaFlourishOutcome')]"

 # Outlook on the Jews breakdown line (KehillahOutlookBdStruggle)
 kehillah_outlook_bd_struggle_pos:0 "\n • The $iberian_struggle$ ([ROOT.Char.Custom('KehillahIberiaPhase')]): #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_outlook_struggle_value')|0]#!"
 kehillah_outlook_bd_struggle_neg:0 "\n • The $iberian_struggle$ ([ROOT.Char.Custom('KehillahIberiaPhase')]): #N [ROOT.Char.MakeScope.ScriptValue('kehillah_outlook_struggle_value')|0]#!"

 # Office at court (kehillah_nagid_effects.txt hooks)
 catalyst_kehillah_nagid_named:0 "Head of the Realm's Jews Named [struggle_catalyst_catalyst|E]"
 catalyst_kehillah_nagid_named_desc:0 "A ruler names the leader of a Jewish community in the region Nagid, head of his realm's Jews"
 catalyst_kehillah_court_service:0 "Jew Given Office at Court [struggle_catalyst_catalyst|E]"
 catalyst_kehillah_court_service_desc:0 "A ruler gives the Nagid of a Jewish community in the region a new office at court"
 kehillah_iberia_push_nagid_named_t:0 "Sepharad Hears of the Nagid"
 kehillah_iberia_push_nagid_named_d:0 "A Jew raised to lead all the Jews of a realm is news at every court in Iberia. Some call it wisdom and others call it scandal.\n\n[ROOT.Char.Custom('KehillahIberiaFlourishOutcome')]"
 kehillah_iberia_push_court_service_t:0 "A Jew at the King's Side"
 kehillah_iberia_push_court_service_d:0 "Our leader's new office at court is spoken of across Iberia, as proof that a king may trust a man of another faith.\n\n[ROOT.Char.Custom('KehillahIberiaFlourishOutcome')]"

 kehillah_iberia_outcome_toward_hostility:0 "This pushes the $iberian_struggle$ toward #N $struggle_iberia_phase_hostility$#!."
 kehillah_iberia_outcome_toward_opportunity:0 "This pushes the $iberian_struggle$ toward #N $struggle_iberia_phase_opportunity$#!."
 kehillah_iberia_outcome_toward_compromise:0 "This pushes the $iberian_struggle$ toward $struggle_iberia_phase_compromise$."
 kehillah_iberia_outcome_toward_conciliation:0 "This pushes the $iberian_struggle$ toward #P $struggle_iberia_phase_conciliation$#!."
 kehillah_iberia_outcome_prolongs:0 "This prolongs the $iberian_struggle$'s [ROOT.Char.Custom('KehillahIberiaPhase')]."
