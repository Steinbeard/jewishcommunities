l_english:
 kehillah_bet_din.01101.t:0 "The Unredeemed Captive"
 kehillah_bet_din.01101.desc:0 "[kbd_litigant_a.GetFirstName] asks why a captive remains held after the community raised money. [kbd_litigant_b.GetFirstName] says a first ransom demand failed and the fund is now needed elsewhere. A new message may or may not offer a real release."
 kehillah_bet_din.01101.a:0 "Send the remaining fund on the new demand."
 kehillah_bet_din.01101.a.tt:0 "Another empty demand could exhaust the purse."
 kehillah_bet_din.01101.b:0 "Verify the offer and reserve aid for the captive."
 kehillah_bet_din.01101.b.tt:0 "Verification costs time but keeps faith with the donors and captive."
 kehillah_bet_din.01101.c:0 "Transfer the fund permanently to other relief."
 kehillah_bet_din.01101.c.tt:0 "A real release chance could be lost."
 kehillah_din_source_110:0 "Cite a mastered Nashim work and examine the evidence."
 kehillah_din_source_110_tt:0 "Mishnah Gittin 4:6 gives the judges a textual point of reference. It cannot establish whether the new offer can secure release."
 kehillah_din_combo_110:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_110_tt:0 "The judges preserve both parties' interests while checking whether the new offer can secure release."
 kehillah_bet_din.01104.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01104.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01104.outcome_1:0 "The entire fund is sent again."
 kehillah_bet_din.01104.outcome_2:0 "The court checks the offer and holds the fund for a documented release."
 kehillah_bet_din.01104.outcome_3:0 "The ransom fund is reassigned."
 kehillah_bet_din.01104.fact_true:0 "The new demand comes from someone who cannot release the captive. Full payment would be lost."
 kehillah_bet_din.01104.fact_false:0 "A verified custodian offers release. Reassignment would abandon the captive."
 kehillah_bet_din.01104.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01104.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01104.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case110_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case110_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case110_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_din_proposed_110_1:0 "The ruling proposed so far: $kehillah_bet_din.01101.a$"
 kehillah_din_proposed_110_2:0 "The ruling proposed so far: $kehillah_bet_din.01101.b$"
