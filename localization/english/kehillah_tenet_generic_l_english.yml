l_english:
 tenet_kehillah_hokhmah_generic_name:0 "Reasoned Theology"
 tenet_kehillah_hokhmah_generic_desc:0 "The order of creation and the truth of revelation cannot ultimately be at odds. Philosophy, medicine, and the study of nature can deepen our understanding of the divine when pursued with care."
 tenet_kehillah_emunah_temimah_generic_name:0 "Inherited Faith"
 tenet_kehillah_emunah_temimah_generic_desc:0 "The teachings received from earlier generations deserve trust. Subtle argument may sharpen understanding, but it must not uproot the faith handed down to us."
 tenet_kehillah_pesak_generic_name:0 "Codified Law"
 tenet_kehillah_pesak_generic_desc:0 "A clear judgment serves the faithful better than a dispute without end. Scholars gather precedents and set out rules that rulers and households can follow."
 tenet_kehillah_pilpul_generic_name:0 "Dialectical Study"
 tenet_kehillah_pilpul_generic_desc:0 "Disputation is a discipline of learning. By testing each interpretation against its rivals, students come to understand the reasons behind the law."
 tenet_kehillah_geonut_generic_name:0 "Scholarly Authority"
 tenet_kehillah_geonut_generic_desc:0 "Esteemed centers of learning preserve teaching and answer difficult questions. Their judgments carry weight far beyond the places in which they sit."
 tenet_kehillah_minhag_avoteinu_generic_name:0 "Ancestral Custom"
 tenet_kehillah_minhag_avoteinu_generic_desc:0 "The practices of earlier generations bind a community together. A distant authority ought to think carefully before setting aside a custom long observed."
 tenet_kehillah_avelei_tziyon_generic_name:0 "Sacred Homeland"
 tenet_kehillah_avelei_tziyon_generic_desc:0 "Sacred places bind scattered communities to a common inheritance. Pilgrimage and support for those who dwell there make distant holy ground part of the congregation's daily life."
 tenet_baalei_hamiqra_generic_name:0 "Scriptural Primacy"
 tenet_baalei_hamiqra_generic_desc:0 "Sacred writing is the highest authority. Every inherited interpretation must be measured against its words, and attentive readers may challenge received rulings."
 tenet_talmud_torah_generic_name:0 "Received Tradition"
 tenet_talmud_torah_generic_desc:0 "The sacred teaching reaches us through both writing and its transmitted interpretation. Study renews that inheritance in every generation."
 tenet_kehillah_kiddush_hashem_generic_name:0 "Sanctification of the Name"
 tenet_kehillah_kiddush_hashem_generic_desc:0 "Faithfulness under persecution bears witness to what the congregation holds sacred. Those who remember its suffering are called to protect the endangered and sustain the living."