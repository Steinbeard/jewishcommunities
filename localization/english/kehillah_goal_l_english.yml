l_english:

 # =====================================================================
 # COMMUNITY GOALS -- ROADMAP S6, added 2026-09-28.
 #
 # Decision: common/decisions/kehillah_goal_decisions.txt
 # Event: events/kehillah_goal_events.txt
 # Custom loc: common/customizable_localization/kehillah_goal_custom_loc.txt
 # Standing-tooltip row: KEHILLAH_BD_STANDING_TOOLTIP calls KehillahBdGoal
 # (localization/english/kehillah_breakdown_l_english.yml).
 # =====================================================================

 kehillah_set_community_goal_decision:0 "Set the Community's Goal"
 kehillah_set_community_goal_decision_desc:0 "The elders meet, as they meet every year, and as every year the talk goes in four directions at once.\n\nA community that wants everything at once builds nothing. Name one thing, and let the decade be spent on it."
 kehillah_set_community_goal_decision_tooltip:0 "Gather the elders and settle on a single ambition for the community. You will have ten years."
 kehillah_set_community_goal_decision_confirm:0 "Call them together"

 kehillah_goal_none_active_tt:0 "The community has no goal running"

 kehillah_goals.0001.t:0 "What Shall We Be Remembered For"
 kehillah_goals.0001.desc:0 "#weak They have argued since the afternoon prayers. Someone has brought bread.#!\n\nThe question is not what the community needs -- everyone here could list that -- but what it will actually spend the next ten years doing, since it plainly cannot do all of it.\n\n#italic Name one. The rest can wait, and will have to.#!"

 kehillah_goals.0001.a:0 "A yeshiva, and scholars who come to it"
 kehillah_goals.0001.a.tt:0 "The community's goal: raise the beit midrash to a full yeshiva within ten years."
 kehillah_goals.0001.b:0 "A name that carries past the river"
 kehillah_goals.0001.b.tt:0 "The community's goal: bring Greatness to Flourishing within ten years."
 kehillah_goals.0001.c:0 "Rights set down in writing"
 kehillah_goals.0001.c.tt:0 "The community's goal: improve the charter's protection or building rights within ten years."
 kehillah_goals.0001.d:0 "Send our own out to found another"
 kehillah_goals.0001.d.tt:0 "The community's goal: see a kinsman of yours found a community of their own within ten years."
 kehillah_goals.0001.e:0 "Let it wait another year"

 # --- The four goals, named once and read everywhere ---
 kehillah_goal_name_yeshiva:0 "Build the Yeshiva"
 kehillah_goal_name_renown:0 "A Name Among the Communities"
 kehillah_goal_name_rights:0 "Secure Our Rights"
 kehillah_goal_name_daughter:0 "A Daughter Community"
 kehillah_goal_name_none:0 "no goal"

 # --- Progress, one line each, shown under the goal in the tooltip ---
 kehillah_goal_progress_yeshiva:0 "the beit midrash is not yet a full yeshiva"
 kehillah_goal_progress_renown:0 "[Title.MakeScope.ScriptValue('kehillah_next_band_gap_greatness_value')|0] more Greatness to Flourishing"
 kehillah_goal_progress_rights:0 "the charter has not improved since the goal was set"
 kehillah_goal_progress_daughter:0 "no kinsman has founded a community yet"

 # --- The standing-tooltip row ---
 kehillah_bd_goal_active:0 "\n\n#T Goal: [Title.Custom('KehillahGoalName')]#!\n#weak [Title.Custom('KehillahGoalProgress')]#!\n#weak Goals achieved: [Title.MakeScope.Var('kehillah_var_goals_completed').GetValue|0]#!"
 kehillah_bd_goal_record_only:0 "\n\n#weak No goal set. Goals achieved: [Title.MakeScope.Var('kehillah_var_goals_completed').GetValue|0]#!"

 # --- The two interface messages ---
 kehillah_goal_achieved_title:0 "The Community Has Done What It Set Out To Do"
 kehillah_goal_achieved_desc:0 "[ROOT.Char.GetPrimaryTitle.GetName] set out to achieve #high [ROOT.Char.GetPrimaryTitle.Custom('KehillahGoalLastName')]#!, and has.\n\nIt is written into the community's record, and the pillar it was built on has risen. The elders may now name another."
 kehillah_goal_failed_title:0 "The Decade Has Gone"
 kehillah_goal_failed_desc:0 "Ten years ago [ROOT.Char.GetPrimaryTitle.GetName] settled on #high [ROOT.Char.GetPrimaryTitle.Custom('KehillahGoalLastName')]#!. The years went elsewhere.\n\nNothing was lost that anyone can point to, which is its own kind of loss: Stability suffers. The elders may name another goal whenever they are ready."
