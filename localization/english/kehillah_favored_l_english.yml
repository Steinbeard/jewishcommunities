 # Favored beyond the teaching (the Nagid spec section 3, 2026-10-30).
 kehillah_favored_beyond_teaching_1_modifier:0 "Favors the Jews Beyond the Teaching"
 kehillah_favored_beyond_teaching_1_modifier_desc:0 "This realm favors its Jews more than any faith's teaching allows. Under the Dhimma, in a culture at ease with other faiths, the clergy barely object."
 kehillah_favored_beyond_teaching_2_modifier:0 "Favors the Jews Beyond the Teaching"
 kehillah_favored_beyond_teaching_2_modifier_desc:0 "This realm favors its Jews more than any faith's teaching allows. The clergy object, though the stretch is one their teaching or the culture can bear."
 kehillah_favored_beyond_teaching_3_modifier:0 "Favors the Jews Beyond the Teaching"
 kehillah_favored_beyond_teaching_3_modifier_desc:0 "This realm favors its Jews more than its faith's teaching allows, and the clergy say so."
 kehillah_favored_beyond_teaching_4_modifier:0 "Favors the Jews in Defiance of the Teaching"
 kehillah_favored_beyond_teaching_4_modifier_desc:0 "This realm favors its Jews in open defiance of a teaching that would mark them out and keep them from authority. The clergy object loudly."
 kehillah_favored_exclusion_blocks_tt:0 "Your faith's teaching leaves the Jews no protected place, so they cannot be #N Favored#!"
