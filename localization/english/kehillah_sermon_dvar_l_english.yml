l_english:
 # Sermon variety and sequels, 2026-11-13 (Daniel).

 # The toasts' texts (they showed DESCRIPTION_AND_EFFECT without one).
 kehillah_sermon_delivered_desc:0 "The congregation lingers over the words long after the benches empty."
 kehillah_sermon_flat_desc:0 "The words come out wrong, the heads nod politely, and almost nothing stays with them."

 kehillah_sermon.0004.desc_thrust:0 "\n\n[GetPlayer.Custom('KehillahSermonThrust')]"
 kehillah_sermon_thrust_fallback:0 "The sermon keeps to the plain sense of the text."

 # The month's portion.
 kehillah_sermon_parsha_1:0 "Shemot"
 kehillah_sermon_parsha_2:0 "Yitro"
 kehillah_sermon_parsha_3:0 "Tzav"
 kehillah_sermon_parsha_4:0 "Kedoshim"
 kehillah_sermon_parsha_5:0 "Behar"
 kehillah_sermon_parsha_6:0 "Korach"
 kehillah_sermon_parsha_7:0 "Pinchas"
 kehillah_sermon_parsha_8:0 "Va'etchanan"
 kehillah_sermon_parsha_9:0 "Nitzavim"
 kehillah_sermon_parsha_10:0 "Bereishit"
 kehillah_sermon_parsha_11:0 "Lech Lecha"
 kehillah_sermon_parsha_12:0 "Vayeshev"

 # A dvar Torah for each.
 kehillah_sermon_dvar_1:0 "The portion is #EMP Shemot#!. The sermon dwells on the midwives Shifrah and Puah, who feared God and let the children live against Pharaoh's decree: when the law of the land commands what the Torah forbids, it is often the humblest who are the bravest."
 kehillah_sermon_dvar_2:0 "The portion is #EMP Yitro#!. A priest of Midian saw Moses judging the people from morning to evening and told him, 'The thing you do is not good.' The sermon asks what a teacher is worth who cannot be corrected, and notes that the Torah was given in the wilderness, where it belonged to no one, that no one might hold it as his own."
 kehillah_sermon_dvar_3:0 "The portion is #EMP Tzav#!. 'A fire shall be kept burning continually upon the altar; it shall not go out.' The altar is gone, says the sermon, but the fire is not: it is kept in the study-house, in the lamp by the ark, and in whoever rises before dawn to learn."
 kehillah_sermon_dvar_4:0 "The portion is #EMP Kedoshim#!. 'You shall be holy.' The sermon observes that the Torah does not stop at the command but goes on at once to the gleanings left for the poor, to honest weights, and to not putting a stumbling block before the blind. A holy people, it says, is known by its market."
 kehillah_sermon_dvar_5:0 "The portion is #EMP Behar#!. 'Proclaim liberty throughout the land.' Every field returns in the Jubilee and every bondman goes free, for the land is the Lord's and we are only tenants upon it. The sermon says that a man who holds nothing may still hope, because the year will turn."
 kehillah_sermon_dvar_6:0 "The portion is #EMP Korach#!. The Sages set a quarrel for the sake of Heaven, like Hillel's and Shammai's, against Korach's quarrel, and say that the first endures and the second does not. The sermon asks the congregation which of its own disputes it is keeping alive, and for whose sake."
 kehillah_sermon_dvar_7:0 "The portion is #EMP Pinchas#!. The daughters of Tzelofchad come before Moses and ask for a share in the land, and the Holy One says, 'The daughters of Tzelofchad speak justly.' No claim is too small for the court of Torah, says the sermon, and a community that cannot hear a just word from the least of its members has no right to call itself a kehillah."
 kehillah_sermon_dvar_8:0 "The portion is #EMP Va'etchanan#!, read after the Ninth of Av: the Sabbath of comfort. 'Hear, O Israel.' We have lost the house, says the sermon, but not the Name; we have lost the altar, but not the Shema. Comfort is not forgetting but a reason to stand up again."
 kehillah_sermon_dvar_9:0 "The portion is #EMP Nitzavim#!. 'You stand this day, all of you, before the Lord your God': the heads of the tribes and the drawers of water, the stranger in the gates. The sermon says that the covenant needs every one of them, and that the Torah 'is not in heaven' but 'very near you, in your mouth and in your heart'."
 kehillah_sermon_dvar_10:0 "The portion is #EMP Bereishit#!. Why does the Torah begin with the creation and not with the first commandment? The Sages answer: so that if the nations call Israel robbers for holding a land, they may answer that the whole earth is the Lord's, and He gave it to whom He saw fit. The sermon turns this on the question of where we have a right to live."
 kehillah_sermon_dvar_11:0 "The portion is #EMP Lech Lecha#!. 'Go from your land.' Abraham was a wanderer who built an altar wherever he stopped. The sermon says that a people who may be moved on must still build, and pray, and plant, and not wait to be settled before it begins to live."
 kehillah_sermon_dvar_12:0 "The portion is #EMP Vayeshev#!. 'And Jacob sought to dwell in peace', and the trouble of Joseph sprang upon him. The Sages say that the righteous seek quiet, and the Holy One asks whether what is prepared for them in the world to come is not enough, that they seek ease in this one as well. The sermon asks what the congregation does when quiet is not given."

 # What neighbours owe one another.
 kehillah_sermon_neighbours_1:0 "The sermon speaks of the lost ox and the straying ass: 'you shall not hide yourself from them.' A neighbour's loss, it says, is already half your own."
 kehillah_sermon_neighbours_2:0 "The sermon speaks of the Sages' rule that a man may not open a window upon his neighbour's courtyard. Good neighbours, it says, are made of small refusals."
 kehillah_sermon_neighbours_3:0 "The sermon speaks of Hillel: 'What is hateful to you, do not do to your fellow; that is the whole Torah, and the rest is commentary.' A quarrel over a boundary stone, it says, is a quarrel over the whole Torah."

 # Tzedakah.
 kehillah_sermon_tzedakah_1:0 "The sermon speaks of the highest giving: to set a poor man up in a trade, or a partnership, before he must ask, so that he never needs to be given to again."
 kehillah_sermon_tzedakah_2:0 "The sermon speaks of the ransoming of captives, which the Sages place before feeding the poor and before clothing them. A community that cannot raise a ransom, it says, has already begun to be lost."
 kehillah_sermon_tzedakah_3:0 "The sermon speaks of Daniel's counsel to the king, 'break off your sins by tzedakah', and of the hekdesh door, which is never locked at night."

 # The peace of the city.
 kehillah_sermon_peace_1:0 "The sermon speaks of Jeremiah's letter to the exiles in Babylon: 'Seek the peace of the city where I have caused you to be carried, and pray for it; for in its peace you shall have peace.'"
 kehillah_sermon_peace_2:0 "The sermon speaks of the Sages' counsel to pray for the welfare of the government, 'for were it not for fear of it, men would swallow one another alive.'"
 kehillah_sermon_peace_3:0 "The sermon speaks of Jacob before Esau, who sent gifts and bowed low and still divided his camp. The Sages see in it a rule for every later exile: be gracious, and do not be a fool."

 # A time of trouble.
 kehillah_sermon_trouble_1:0 "The sermon speaks of Job's friends, who sat with him seven days and said nothing, and were wise until they began to speak."
 kehillah_sermon_trouble_2:0 "The sermon speaks of Nachum of Gamzo, who said of every blow, 'this too is for the good,' and says that his saying was less a doctrine than a way of getting up in the morning."
 kehillah_sermon_trouble_3:0 "The sermon speaks of the verse, 'I am with him in trouble.' The Shekhinah went into exile with Israel, says the preacher, and is in this house tonight."

 # A maggid's appeal.
 kehillah_sermon_appeal_1:0 "The sermon speaks of the road: the traveller has no door to knock on but the door of the next town's synagogue, and the Sages hold that welcoming a guest is greater than welcoming the Divine Presence."
 kehillah_sermon_appeal_2:0 "The sermon speaks of redeeming the captive and burying the stranger, which have no limit. The roads are full of people who cannot repay, it says, and those are the ones for whom the Torah asks."
 kehillah_sermon_appeal_3:0 "The sermon speaks of Abraham's tent, open on all four sides, and asks the congregation whether its own door is open on even one."

 # Sequels.
 kehillah_sermon.0020.t:0 "A Quarrel Brought to the Bimah"
 kehillah_sermon.0020.desc:0 "As the benches empty, two men of the community stay behind: a dyer and a tanner who have not spoken since the matter of the stream. Each heard the sermon as meant for the other, and neither will be the first to give way."
 kehillah_sermon.0020.a:0 "Sit with them after the meal, and hear each out."
 kehillah_sermon.0020.b:0 "Tell them the community's court will rule, and they will abide by it."
 kehillah_sermon.0020.c:0 "A sermon is not a summons. Let them find their own way."

 kehillah_sermon.0021.t:0 "A Pledge at the Door"
 kehillah_sermon.0021.desc:0 "A wool-merchant catches my sleeve at the door. He has not given to the hekdesh in years, and he says he heard his own name in every sentence. His hand is already on his purse."
 kehillah_sermon.0021.a:0 "Take the pledge gladly, and write it in the hekdesh book."
 kehillah_sermon.0021.b:0 "Let him give in secret, to the poor, himself."
 kehillah_sermon.0021.c:0 "Ask for his hours, not his coin: come and learn with us."

 kehillah_sermon.0022.t:0 "The Lord's Steward"
 kehillah_sermon.0022.desc:0 "Two days later a steward in [kehillah_sermon_host.GetTitledFirstName]'s livery asks after me. The prayer I made for his master's house was repeated in the hall, and the lord wishes to know what kind of man says it."
 kehillah_sermon.0022.a:0 "Go up to the hall, and speak for the community."
 kehillah_sermon.0022.b:0 "Send a gift, and wait."
 kehillah_sermon.0022.c:0 "Let the words stand on their own."

 kehillah_sermon.0023.t:0 "One Who Stayed Behind"
 kehillah_sermon.0023.desc:0 "When the others have gone, a young woman remains in her seat by the wall of the women's gallery. Her husband was lost in the trouble, and the sermon did not reach her. 'Comfort is easy to say from the bimah,' she tells me, not unkindly."
 kehillah_sermon.0023.a:0 "Sit with her, and say nothing for a while."
 kehillah_sermon.0023.b:0 "Ask the women of the community to take her in."
 kehillah_sermon.0023.c:0 "Tell her the truth: it will come late, and she must be here to see it."
