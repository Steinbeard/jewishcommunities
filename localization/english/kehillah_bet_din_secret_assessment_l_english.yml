l_english:
 kehillah_bet_din.0481.t:0 "The Elders' Secret Assessment"
 kehillah_bet_din.0481.desc:0 "[kbd_litigant_a.GetFirstName] represents tax assessors who refuse to reveal how an emergency levy was divided. [kbd_litigant_b.GetFirstName] speaks for households charged far more than expected. The assessors cite private trade accounts; families suspect favoritism. The defense fund needs coin before the next market day."
 kehillah_bet_din.0481.a:0 "Collect the sealed assessment as written."
 kehillah_bet_din.0481.a.tt:0 "Money arrives quickly, but a biased roll would be enforced unseen."
 kehillah_bet_din.0481.b:0 "Fund urgent defense and let independent elders audit the roll."
 kehillah_bet_din.0481.b.tt:0 "An audit costs time while essential defense is funded."
 kehillah_bet_din.0481.c:0 "Publish every household's trade figures and recalculate."
 kehillah_bet_din.0481.c.tt:0 "Full disclosure may expose honest private accounts for little gain."
 kehillah_din_source_48:0 "Cite a mastered Nezikin work and audit the common levy."
 kehillah_din_source_48_tt:0 "Mishnah Bava Batra 1:5 frames shared public expenses. It does not prove this roll was fairly made."
 kehillah_din_combo_48:0 "Have a scholar and steward audit without exposing private trade."
 kehillah_din_combo_48_tt:0 "The judges separate a fair assessment from unnecessary disclosure."
 kehillah_bet_din.0484.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0484.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0484.outcome_1:0 "The court orders payment under the sealed roll."
 kehillah_bet_din.0484.outcome_2:0 "The court advances defense costs and lets independent elders inspect the assessments."
 kehillah_bet_din.0484.outcome_3:0 "The court publishes the underlying accounts and orders a new roll."
 kehillah_bet_din.0484.fact_true:0 "The roll understates allies of the assessors. Secrecy hid unequal shares."
 kehillah_bet_din.0484.fact_false:0 "The roll is consistent with the stated method. Publishing every private account caused needless harm."
 kehillah_bet_din.0484.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0484.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0484.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case48_one_tt:0 "Sealed collection costs substantial Stability."
 kehillah_din_case48_two_tt:0 "Independent review costs some Stability."
 kehillah_din_case48_three_tt:0 "Open publication costs less now but may damage trust."
