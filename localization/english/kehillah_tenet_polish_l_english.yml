l_english:
 tenet_kehillah_covenant_community_name:0 "Covenant Community"
 tenet_kehillah_covenant_community_desc:0 "The covenant binds its people to duties toward one another. Differences of custom and language need not prevent the faithful from sustaining the poor, welcoming strangers, and standing beside communities in distress."
 kehillah_am_kadosh_historical_glossary:0 "[Glossary('Am Kadosh','kehillah_am_kadosh_historical_glossary_text')]"
 kehillah_am_kadosh_historical_glossary_text:0 "Am Kadosh\n\nA 'holy people' is bound by shared obligations as well as shared worship. Jewish communal life gave these obligations practical form through charity, hospitality, the redemption of captives, and assistance between congregations. The related teaching of arevut emphasizes responsibility for one's fellows.\n\nThis solidarity could extend across different local customs and spoken languages without requiring agreement on every religious question. Membership in the covenant is not limited to one ancestry: converts participate in its obligations too."
 kehillah_covenant_community_historical_glossary:0 "[Glossary('Covenant Community','kehillah_covenant_community_historical_glossary_text')]"
 kehillah_covenant_community_historical_glossary_text:0 "Covenant Community\n\nA religious community may understand its shared faith as a bond of mutual obligation. Gifts to the poor, hospitality to travelers, and help for congregations in danger turn that bond into a social practice. Shared ancestry can supply another connection, but it does not replace religious membership."
 doctrine_parameter_kehillah_covenant_aid:0 "Unlocks #V Offer Communal Aid#! to needy characters of your faith or cultural heritage"
 doctrine_parameter_kehillah_covenant_aid_personal:0 "Communal aid grants additional [piety|E] and relieves [stress|E]"
 kehillah_covenant_aid_interaction:0 "Offer Communal Aid"
 kehillah_covenant_aid_interaction_desc:0 "Send financial support to [recipient.GetShortUINameNoTooltip]. Shared faith or cultural heritage opens this aid; shared heritage strengthens the recipient's gratitude. Religious rewards are granted at most once a year."
 kehillah_covenant_aid_opinion:0 "Communal Aid"
 kehillah_covenant_shared_heritage_opinion:0 "Remembered Our Shared Heritage"
 kehillah_sefer.0200.tt_14:0 "Covenant Community: obligations that bind the faithful together."
 kehillah_hokhmah_historical_glossary:0 "[Glossary('Hokhmah and Greek Wisdom','kehillah_hokhmah_historical_glossary_text')]"
 kehillah_hokhmah_historical_glossary_text:0 "Hokhmah and Greek Wisdom\n\nHokhmah means wisdom or learning. In medieval Jewish intellectual life, the study of philosophy and the sciences could accompany mastery of religious texts. The 'Greek wisdom' encountered by many Jewish scholars included logic, natural philosophy, mathematics, and medicine, often transmitted and developed in Arabic.\n\nThinkers differed over its proper scope. Advocates sought harmony between reason and revelation, rather than treating inquiry as the abandonment of faith. Ibn Daud's philosophical work offers one expression of that project, alongside the different approaches of other scholars."
 kehillah_reasoned_theology_historical_glossary:0 "[Glossary('Reasoned Theology','kehillah_reasoned_theology_historical_glossary_text')]"
 kehillah_reasoned_theology_historical_glossary_text:0 "Reasoned Theology\n\nReligious thinkers have often used philosophical argument and the study of nature to interpret revelation. Medicine and natural philosophy could be understood as inquiries into an ordered creation, rather than pursuits outside religious life. The boundaries of such inquiry remained subjects of disagreement."
 kehillah_scholarly_study_historical_glossary:0 "[Glossary('Iyyun ha-Talmud','kehillah_scholarly_study_historical_glossary_text')]"
 kehillah_scholarly_study_historical_glossary_text:0 "Iyyun ha-Talmud\n\nClose study of the Talmud involves comparing passages, examining inherited explanations, and testing the reasoning behind a ruling. Discussion between teachers and students can reveal distinctions that a first reading misses.\n\nMedieval scholars developed different methods of comparison and argument, drawing on their teachers, local traditions, and exchanges with distant academies. Their differences could produce competing interpretations without dissolving their shared commitment to the received texts."
 kehillah_scholarly_study_general_glossary:0 "[Glossary('Scholarly Study','kehillah_scholarly_study_general_glossary_text')]"
 kehillah_scholarly_study_general_glossary_text:0 "Scholarly Study\n\nReligious scholarship can make comparison, questioning, and disciplined argument into acts of devotion. Readers learn not only an inherited answer but the reasoning that supports it. Traditions differ over which sources possess authority; careful study does not itself settle that disagreement."
 kehillah_sacred_liturgy_historical_glossary:0 "[Glossary('Piyyut','kehillah_sacred_liturgy_historical_glossary_text')]"
 kehillah_sacred_liturgy_historical_glossary_text:0 "Piyyut\n\nJewish liturgical poetry gives the congregation's prayers an additional voice through crafted language, imagery, and rhythm. Poets draw on the texts and memories received by their own communities. Such composition belongs to worship, and is distinct from the enjoyment of a festival meal.\n\nPoetic traditions vary by place and religious allegiance. A congregation's poems can preserve its distinctive interpretations and memories, while familiar forms and melodies give worshippers a shared language of devotion."
 kehillah_sacred_liturgy_general_glossary:0 "[Glossary('Sacred Liturgy','kehillah_sacred_liturgy_general_glossary_text')]"
 kehillah_sacred_liturgy_general_glossary_text:0 "Sacred Liturgy\n\nHymns, prayers, and devotional verse can organize a congregation's shared worship. Their composition requires skill, while their performance gives that skill a religious purpose. The texts, languages, and forms differ between traditions."
 kehillah_sacred_homeland_historical_glossary:0 "[Glossary('Sacred Homeland','kehillah_sacred_homeland_historical_glossary_text')]"
 kehillah_sacred_homeland_historical_glossary_text:0 "Sacred Homeland\n\nA sacred landscape can remain part of a community's religious life even when many of its members live elsewhere. Pilgrimage, gifts to custodians, and support for resident congregations keep that connection tangible.\n\nThe places themselves differ by tradition: Mount Gerizim has a central role in Samaritan worship, while Jerusalem holds a different place in other Jewish traditions. Among Karaites, the Mourners of Zion gave attachment to Jerusalem a particular ascetic expression, joining residence in the holy city to mourning and prayer for its restoration."
 kehillah_kiddush_hashem_historical_glossary:0 "[Glossary('Kiddush ha-Shem','kehillah_kiddush_hashem_historical_glossary_text')]"
 kehillah_kiddush_hashem_historical_glossary_text:0 "Kiddush ha-Shem\n\nThe sanctification of the divine Name can be expressed through conduct that honors the faith. Persecution gave the phrase an especially forceful association with fidelity under coercion, and communities remembered those who suffered through prayer and accounts of their lives.\n\nRemembrance also raises duties toward survivors and endangered neighbors. Steadfastness and care for the living could stand beside one another in a community's response to loss."
 kehillah_literalism_historical_glossary:0 "[Glossary('Peshuto shel Miqra','kehillah_literalism_historical_glossary_text')]"
 kehillah_literalism_historical_glossary_text:0 "Peshuto shel Miqra\n\nClose attention to Scripture's wording and context is a method of interpretation, not an inability to understand metaphor. Readers compare passages, examine language, and dispute the force of particular expressions.\n\nRabbinic and Karaite scholars could both pursue the plain sense while disagreeing about the authority of inherited oral teaching. Their disputes concerned both the meaning of particular passages and the sources by which an interpretation could become binding."
 kehillah_pesak_historical_glossary:0 "[Glossary('Pesak Halakha','kehillah_pesak_historical_glossary_text')]"
 kehillah_pesak_historical_glossary_text:0 "Pesak Halakha\n\nA legal ruling applies received law to a question requiring an answer. Rabbinic judges and scholars draw on the Written and Oral Torah, earlier decisions, and recognized methods of interpretation. Their authority depends on office, learning, and the acceptance of those who consult them.\n\nQuestions could travel between communities in letters, and authoritative answers circulated as responsa. The practice connected local disputes to wider networks of scholarship while leaving room for disagreement over a judge's reasoning or jurisdiction."
 kehillah_esotericism_jewish_historical_glossary:0 "[Glossary('Jewish Esoteric Traditions','kehillah_esotericism_jewish_historical_glossary_text')]"
 kehillah_esotericism_jewish_historical_glossary_text:0 "Jewish Esoteric Traditions\n\nJewish mystical writings explore concealed meanings, divine attributes, creation, and heavenly ascent. These traditions include different texts and approaches; the Hekhalot literature and Sefer Yetzirah do not constitute a single uniform school.\n\nKabbalah became a name for particular bodies of transmitted mystical teaching. Earlier writings and practices continued to be read and reinterpreted, while their relationship to emerging schools remained varied and contested."
