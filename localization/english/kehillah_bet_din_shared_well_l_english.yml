l_english:
 kehillah_bet_din.0411.t:0 "The Shared Well"
 kehillah_bet_din.0411.desc:0 "[kbd_litigant_a.GetFirstName] speaks for courtyard households who pay to keep a well open. [kbd_litigant_b.GetFirstName] runs an adjoining shop and draws water from it. The shopkeeper says an old agreement permits this; the households say their buckets now come up dry. The court must divide repair costs and water without ending either use by guesswork."
 kehillah_bet_din.0411.a:0 "Bar the shop from the well and charge households for repair."
 kehillah_bet_din.0411.a.tt:0 "Household water is protected, but a valid agreement may give the shop a share."
 kehillah_bet_din.0411.b:0 "Measure use and inspect the courtyard agreement."
 kehillah_bet_din.0411.b.tt:0 "The court measures usage and shares immediate repair costs while finding the old terms."
 kehillah_bet_din.0411.c:0 "Let the shop draw freely and make households pay."
 kehillah_bet_din.0411.c.tt:0 "The shop keeps working, but heavy unlicensed use may empty the households' supply."
 kehillah_din_source_41:0 "Cite a mastered Nezikin work and inspect well rights."
 kehillah_din_source_41_tt:0 "Mishnah Bava Batra 2:11 offers an analogy for neighboring water use. The old agreement still has to be found."
 kehillah_din_combo_41:0 "Have a scholar and steward measure the well and read its deed."
 kehillah_din_combo_41_tt:0 "The judges keep water available while assigning shares and repairs."
 kehillah_bet_din.0414.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0414.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0414.outcome_1:0 "The court bars the shop and orders householders to repair the well."
 kehillah_bet_din.0414.outcome_2:0 "The court measures withdrawals and seeks the courtyard agreement before allocating cost."
 kehillah_bet_din.0414.outcome_3:0 "The court lets the shop draw without a limit and leaves repair to households."
 kehillah_bet_din.0414.fact_true:0 "The old agreement grants the shop a measured share. A complete ban broke that bargain."
 kehillah_bet_din.0414.fact_false:0 "The agreement limits water to households, and the shop's use lowered the well. Free access was unjust."
 kehillah_bet_din.0414.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0414.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0414.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case41_one_tt:0 "A ban costs substantial Stability."
 kehillah_din_case41_two_tt:0 "Measurement and repair cost some Stability."
 kehillah_din_case41_three_tt:0 "Free access costs less now but may exhaust the shared supply."
 kehillah_bet_din_case41_great_log_title:0 "The Shared Well: a well-supported ruling"
 kehillah_bet_din_case41_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s well-use claim."
 kehillah_bet_din_case41_good_log_title:0 "The Shared Well: a workable ruling"
 kehillah_bet_din_case41_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s well-use claim."
