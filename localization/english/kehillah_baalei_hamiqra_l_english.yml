l_english:
 tenet_baalei_hamiqra_name:0 "Ba'alei ha-Miqra"
 tenet_baalei_hamiqra_desc:0 "Scripture is the source from which we seek the law. A careful reader weighs its language, context, and implications, and may offer a reasoned interpretation without requiring the rulings of the rabbinic tradition to bind the community."
 doctrine_parameter_kehillah_baalei_examine_scripture:0 "May Examine Scripture as a continuing personal scheme. Successful study raises Spiritual Fulfillment and can lead to the Religious Scholar trait; readers may share an interpretation with their community."

 kehillah_examine_miqra_decision:0 "Examine Scripture"
 kehillah_examine_miqra_decision_desc:0 "Set aside time to read Scripture closely, comparing passages and weighing their language before drawing conclusions."
 kehillah_examine_miqra_decision_tooltip:0 "Begin a continuing course of scriptural study and interpretation."
 kehillah_examine_miqra_decision_confirm:0 "Begin reading"
 kehillah_examine_miqra_already_studying_tt:0 "Already examining Scripture."
 kehillah_examine_miqra:0 "Examine Scripture"
 kehillah_examine_miqra_action:0 "Examine Scripture"
 kehillah_examine_miqra_desc_general:0 "Read Scripture closely and consider how its words guide practice."
 KEHILLAH_EXAMINE_MIQRA_SCHEME_SUCCESS_DESC:0 "Another course of scriptural study concludes."
 kehillah_examine_miqra_learning_modifier:0 "Your Learning"

 kehillah_examine_miqra.0001.t:0 "A Reading Takes Shape"
 kehillah_examine_miqra.0001.desc:0 "After comparing the passage with other verses and considering its words in context, I have reached an interpretation I can defend. I can continue working through its implications privately, or offer it as guidance to others."
 kehillah_examine_miqra.0001.private:0 "Continue weighing the passage."
 kehillah_examine_miqra.0001.public:0 "Offer my interpretation to the community."
 kehillah_examine_miqra.0002.t:0 "A Difficult Passage"
 kehillah_examine_miqra.0002.desc:0 "The verses resist a confident conclusion. I have learned from the attempt, but need more time before I can explain how they should guide practice."
 kehillah_examine_miqra.0002.a:0 "Return to the text."
 kehillah_miqra_public_reading_modifier:0 "Scriptural Interpretation Shared"
 kehillah_miqra_public_reading_modifier_desc:0 "This character has offered a carefully reasoned reading of Scripture to the community."
