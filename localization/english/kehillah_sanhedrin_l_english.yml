l_english:
 # The Sanhedrin: V46 College and election; V47 phase B seat in the Land
 # (docs/spec/v47-gaon-and-the-seat-of-the-sanhedrin.md)

 kehillah_nasi_government:0 "Kehillah of the Nasi"
 kehillah_nasi_government_adjective:0 "Communal"
 kehillah_nasi_government_realm:0 "Kehillah"
 kehillah_nasi_government_with_icon:0 "$kehillah_nasi_government$"
 kehillah_nasi_government_desc:0 "#F The seat of the restored Sanhedrin in the Land of Israel. Its Nasi holds the county of his liege and presides over the court that speaks for all Israel, while his community keeps its quarter and its dangers.#!"
 kehillah_nasi_government_tt:0 "Presides over the #EMP Sanhedrin#! as its #EMP Nasi#!"

 kehillah_nasi_male:0 "Nasi"
 kehillah_nasi_female:0 "Nasi"

 KEHILLAH_SANHEDRIN_SEAT_NAME:0 "Sanhedrin Seat of [kehillah_seat_recipient.GetFirstNameNoTooltip]"
 KEHILLAH_SANHEDRIN_SEAT_ADJ:0 "Sanhedrin"

 kehillah_restore_sanhedrin_decision:0 "Restore the Sanhedrin"
 kehillah_restore_sanhedrin_decision_tooltip:0 "Ask your liege for the land to seat the Great Sanhedrin"
 kehillah_restore_sanhedrin_decision_confirm:0 "Petition for the seat of the Sanhedrin"
 kehillah_restore_sanhedrin_decision_desc:0 "The Great Sanhedrin last sat at Tiberias. Ordination could only be given in the Land of Israel, so when the court ended, no court anywhere could speak for all Israel. A sage of the Land who has mastered the whole Torah, and whose devotion no one doubts, might restore it, if the ruler of the Land would grant him the ground to seat it on. Such grants are rare: the patriarchs of old had the Romans' leave, and the Exilarchs the caliphs'."
 kehillah_restore_sanhedrin_effect_tt:0 "Your liege grants you your community's county, and the #EMP Sanhedrin#! sits there again. You become its #EMP Nasi#! and Rabbinic Judaism's [head_of_faith|E], and your community becomes the court's seat. Every rabbi who leads a community or rules a realm takes a seat in the court. When you die, its members elect the next Nasi, who comes to the seat and gives up his own community."
 kehillah_sanhedrin_requires_the_land_tt:0 "Your community lies in the #EMP Land of Israel#!"
 kehillah_sanhedrin_requires_grantable_county_tt:0 "Your liege holds your community's county himself, and it is not his capital"
 kehillah_sanhedrin_requires_mastery_tt:0 "You have mastered all three fields of the Rabbi's learning: Parshanut, Talmud and Hashkafa"
 kehillah_sanhedrin_requires_members_tt:0 "Enough other rabbis lead communities to fill the court"
 kehillah_sanhedrin_requires_no_head_tt:0 "Rabbinic Judaism has no head of faith"
 kehillah_sanhedrin_requires_no_recent_refusal_tt:0 "Your liege has not refused such a request in recent years"
 kehillah_sanhedrin_petition_player_liege_tt:0 "Your liege will decide whether to grant the county."
 kehillah_sanhedrin_petition_granted:0 "Your liege grants the county"
 kehillah_sanhedrin_petition_refused:0 "Your liege refuses"
 kehillah_sanhedrin_petition_refused_tt:0 "You may not ask again for some years."

 kehillah_synod.0006.t:0 "A Seat for the Sanhedrin"
 kehillah_synod.0006.desc:0 "[kehillah_sanhedrin_petitioner.GetTitledFirstName], the most learned of your Jewish subjects, comes before you with a request no ruler has heard in centuries. The sages of his people would seat their ancient high court again, the Sanhedrin, here in the land under your rule. For that they ask you to grant him the county where his community lives."
 kehillah_synod.0006.a:0 "Let the court of the Jews sit in my land."
 kehillah_synod.0006.b:0 "I will not give up land for this."
 kehillah_news_sanhedrin_refused_t:0 "The Petition Refused"
 kehillah_news_sanhedrin_refused_d:0 "Your liege has refused to grant the county for the Sanhedrin."

 kehillah_sanhedrin_succession_law:0 "Election by the Sanhedrin"
 kehillah_sanhedrin_succession_law_subname:0 "The Sanhedrin"
 kehillah_sanhedrin_succession_law_effects:0 "\nThe members of the Sanhedrin elect the next Nasi from among their own number. Every member is both an [elector|E] and a candidate. The new Nasi gives up his own community and comes to the seat."
 kehillah_sanhedrin_elective_candidates:0 "Members of the Sanhedrin"
 kehillah_sanhedrin_elective_candidates_tooltip:0 "To be a candidate, a character must be a rabbi with a seat on the Sanhedrin."
 kehillah_sanhedrin_elective_electors:0 "The Sanhedrin"
 kehillah_sanhedrin_elective_electors_tooltip:0 "To be an [elector|E], a character must hold a seat on the Sanhedrin."
 kehillah_sanhedrin_members:0 "Members of the Sanhedrin"
 kehillah_sanhedrin_member_candidates:0 "Members of the Sanhedrin"

 kehillah_news_sanhedrin_restored_t:0 "The Sanhedrin Restored"
 kehillah_news_sanhedrin_restored_d:0 "[kehillah_sanhedrin_founder.GetTitledFirstName] has restored the Great Sanhedrin at [kehillah_sanhedrin_county.GetNameNoTooltip] and sits as its Nasi. For the first time since antiquity, one court speaks for all Israel."
 kehillah_news_sanhedrin_lapsed_t:0 "The Sanhedrin Lapses"
 kehillah_news_sanhedrin_lapsed_d:0 "The Sanhedrin has lost its seat in the Land, and its members have dispersed. Each community follows its own sages again."
