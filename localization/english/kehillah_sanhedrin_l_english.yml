 kehillah_restore_sanhedrin_decision:0 "Restore the Sanhedrin"
 kehillah_restore_sanhedrin_decision_tooltip:0 "Seat the Great Sanhedrin again in the Land of Israel"
 kehillah_restore_sanhedrin_decision_confirm:0 "Restore the Sanhedrin"
 kehillah_restore_sanhedrin_decision_desc:0 "The Great Sanhedrin last sat at Tiberias. Ordination could only be given in the Land of Israel, so when the court ended, no court anywhere could speak for all Israel. A sage who holds land in the Land, and has mastered the whole Torah, might seat it again."
 kehillah_restore_sanhedrin_effect_tt:0 "The #EMP Sanhedrin#! sits again on your county in the Land. You become its #EMP Nasi#! and Rabbinic Judaism's [head_of_faith|E], and your community, if you lead one, becomes the court's seat. Every rabbi who leads a community or rules land takes a seat in the court. When you die, its members elect the next Nasi."
 kehillah_sanhedrin_requires_county_in_the_land_tt:0 "You hold a county in the #EMP Land of Israel#! (the de jure Kingdom of Jerusalem)"
 kehillah_sanhedrin_requires_mastery_tt:0 "You have mastered all three fields of the Rabbi's learning: Parshanut, Talmud and Hashkafa"
 kehillah_sanhedrin_requires_members_tt:0 "Enough other rabbis lead communities to fill the court"
 kehillah_sanhedrin_requires_no_head_tt:0 "Rabbinic Judaism has no head of faith"

 kehillah_petition_for_land_decision:0 "Petition for Land in Eretz Yisrael"
 kehillah_petition_for_land_decision_tooltip:0 "Ask your liege to grant you the county your community lives in"
 kehillah_petition_for_land_decision_confirm:0 "Make the petition"
 kehillah_petition_for_land_decision_desc:0 "Jewish communities hold their quarters by a ruler's leave, not land of their own. Yet in the Land of Israel a leader of great renown might ask his liege for the county his people live in, and a liege with land to spare, or a Jewish one, might grant it. It has rarely happened since the patriarchs."
 kehillah_land_requires_grantable_county_tt:0 "Your liege holds your community's county himself, and it is not his capital"
 kehillah_land_requires_no_recent_refusal_tt:0 "Your liege has not refused such a request in recent years"
 kehillah_land_petition_player_liege_tt:0 "Your liege will decide whether to grant the county."
 kehillah_land_petition_granted:0 "Your liege grants the county"
 kehillah_land_petition_granted_tt:0 "You receive your community's county as your liege's vassal, and your community becomes a #EMP Kehillah of the Land#!."
 kehillah_land_petition_refused:0 "Your liege refuses"
 kehillah_land_petition_refused_tt:0 "You may not ask again for some years."

 kehillah_synod.0006.t:0 "A Petition for Land"
 kehillah_synod.0006.desc:0 "[kehillah_land_petitioner.GetTitledFirstName], the leader of your Jewish subjects at [kehillah_land_petitioner.GetPrimaryTitle.GetNameNoTooltip], comes before you with a request rarely heard. He asks you to grant him the county his community lives in, to hold of you as your vassal."
 kehillah_synod.0006.a:0 "Let him hold it of me."
 kehillah_synod.0006.b:0 "I will not give up land for this."
 kehillah_news_land_refused_t:0 "The Petition Refused"
 kehillah_news_land_refused_d:0 "Your liege has refused to grant your community's county."

 kehillah_sanhedrin_succession_law:0 "Election by the Sanhedrin"
 kehillah_sanhedrin_succession_law_subname:0 "The Sanhedrin"
 kehillah_sanhedrin_succession_law_effects:0 "\nThe members of the Sanhedrin elect the next Nasi from among their own number. Every member is both an [elector|E] and a candidate. The new Nasi gives up his own community and comes to the seat."
 kehillah_sanhedrin_elective_candidates:0 "Members of the Sanhedrin"
 kehillah_sanhedrin_elective_candidates_tooltip:0 "To be a candidate, a character must be a rabbi with a seat on the Sanhedrin."
 kehillah_sanhedrin_elective_electors:0 "The Sanhedrin"
 kehillah_sanhedrin_elective_electors_tooltip:0 "To be an [elector|E], a character must hold a seat on the Sanhedrin."
 kehillah_sanhedrin_members:0 "Members of the Sanhedrin"
 kehillah_sanhedrin_member_candidates:0 "Members of the Sanhedrin"

 kehillah_news_sanhedrin_restored_t:0 "The Sanhedrin Restored"
 kehillah_news_sanhedrin_restored_d:0 "[kehillah_sanhedrin_founder.GetTitledFirstName] has restored the Great Sanhedrin at [kehillah_sanhedrin_county.GetNameNoTooltip] and sits as its Nasi. For the first time since antiquity, one court speaks for all Israel."
 kehillah_news_sanhedrin_lapsed_t:0 "The Sanhedrin Lapses"
 kehillah_news_sanhedrin_lapsed_d:0 "The Sanhedrin has lost its seat in the Land, and its members have dispersed. Each community follows its own sages again."
