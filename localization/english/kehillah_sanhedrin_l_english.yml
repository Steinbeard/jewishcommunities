l_english:
 # V46 the Sanhedrin (docs/spec/v46-the-sanhedrin.md)

 d_kehillah_sanhedrin:0 "The Sanhedrin"
 d_kehillah_sanhedrin_adj:0 "Sanhedrin"

 kehillah_nasi_male:0 "Nasi"
 kehillah_nasi_female:0 "Nasi"

 KEHILLAH_SANHEDRIN_SEAT_NAME:0 "Sanhedrin Seat of [kehillah_seat_recipient.GetFirstNameNoTooltip]"
 KEHILLAH_SANHEDRIN_SEAT_ADJ:0 "Sanhedrin"

 kehillah_restore_sanhedrin_decision:0 "Restore the Sanhedrin"
 kehillah_restore_sanhedrin_decision_tooltip:0 "Restore the Great Sanhedrin"
 kehillah_restore_sanhedrin_decision_confirm:0 "The Sanhedrin will sit again"
 kehillah_restore_sanhedrin_decision_desc:0 "The Great Sanhedrin last sat at Tiberias. When the patriarchate ended, so did the last court that could speak for all Israel. Since then every community has followed its own sages. A rabbi who has mastered the whole of the Torah, written and oral, and whose piety no one can doubt, might persuade the Jewish world to gather around him and restore it in his own city. The ancient court itself moved, from Yavne to Usha to Tiberias, and a restored one would follow its Nasi."
 kehillah_restore_sanhedrin_effect_tt:0 "You become #EMP Nasi#!, head of the restored #EMP Sanhedrin#!. Rabbinic Judaism gains a [head_of_faith|E], its clergy are lay scholars rather than a priesthood, and every rabbi who leads a community or rules a realm takes a seat in the court. The court sits in your community. When you die, the members elect the next Nasi from among themselves, and the court moves to wherever the new Nasi leads."
 kehillah_sanhedrin_requires_mastery_tt:0 "You have mastered all three fields of the Rabbi's learning: Parshanut, Talmud and Hashkafa"
 kehillah_sanhedrin_requires_members_tt:0 "Enough other rabbis lead communities to fill the court"
 kehillah_sanhedrin_requires_no_head_tt:0 "Rabbinic Judaism has no head of faith"

 kehillah_sanhedrin_succession_law:0 "Election by the Sanhedrin"
 kehillah_sanhedrin_succession_law_subname:0 "The Sanhedrin"
 kehillah_sanhedrin_succession_law_effects:0 "\nThe members of the Sanhedrin elect the next Nasi from among their own number. Every member is both an [elector|E] and a candidate. The court moves to the new Nasi's community."
 kehillah_sanhedrin_elective_candidates:0 "Members of the Sanhedrin"
 kehillah_sanhedrin_elective_candidates_tooltip:0 "To be a candidate, a character must be a rabbi with a seat on the Sanhedrin."
 kehillah_sanhedrin_elective_electors:0 "The Sanhedrin"
 kehillah_sanhedrin_elective_electors_tooltip:0 "To be an [elector|E], a character must hold a seat on the Sanhedrin."
 kehillah_sanhedrin_members:0 "Members of the Sanhedrin"
 kehillah_sanhedrin_member_candidates:0 "Members of the Sanhedrin"

 kehillah_news_sanhedrin_restored_t:0 "The Sanhedrin Restored"
 kehillah_news_sanhedrin_restored_d:0 "[kehillah_sanhedrin_founder.GetTitledFirstName] has restored the Great Sanhedrin in [kehillah_sanhedrin_city.GetNameNoTooltip] and sits as its Nasi. For the first time since antiquity, one court speaks for all Israel."
 kehillah_news_sanhedrin_lapsed_t:0 "The Sanhedrin Lapses"
 kehillah_news_sanhedrin_lapsed_d:0 "No member was fit to succeed the Nasi, and the Sanhedrin has dispersed. Each community follows its own sages again."
