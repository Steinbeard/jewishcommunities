l_english:
 kehillah_bet_din.0591.t:0 "The Community That Divided"
 kehillah_bet_din.0591.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a faction that has opened its own treasury and wants the old debt charged to its rivals. [kbd_litigant_b.GetFirstName] speaks for the other faction, whose members say both sides borrowed for the same quarter. The split is recent; the creditors remember one community. The court must separate future accounts without erasing yesterday's promises."
 kehillah_bet_din.0591.a:0 "Assign the old debt to the rival faction."
 kehillah_bet_din.0591.a.tt:0 "One treasury is freed quickly, but a joint debt would be shifted unfairly."
 kehillah_bet_din.0591.b:0 "Preserve payments and audit who authorized each loan."
 kehillah_bet_din.0591.b.tt:0 "The court pays essential installments while tracing each obligation."
 kehillah_bet_din.0591.c:0 "Cancel every old communal debt after the split."
 kehillah_bet_din.0591.c.tt:0 "Both treasuries start clean, but creditors may be owed real money."
 kehillah_din_source_59:0 "Cite a mastered Nezikin work and trace communal liability."
 kehillah_din_source_59_tt:0 "Mishnah Bava Batra 1:5 frames shared expenses. It cannot identify who signed these loans."
 kehillah_din_combo_59:0 "Have a scholar and steward separate shared from private debts."
 kehillah_din_combo_59_tt:0 "The judges keep creditors paid while untangling the two accounts."
 kehillah_bet_din.0594.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0594.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0594.outcome_1:0 "The court charges the debt to the rival treasury alone."
 kehillah_bet_din.0594.outcome_2:0 "The court continues essential payments and audits the old authorizations."
 kehillah_bet_din.0594.outcome_3:0 "The court declares every pre-split debt void."
 kehillah_bet_din.0594.fact_true:0 "Both factions signed the loan for a shared purpose. Assigning it to one side alone was unjust."
 kehillah_bet_din.0594.fact_false:0 "One faction alone borrowed for its private hall. Cancelling the debt ignored a real creditor."
 kehillah_bet_din.0594.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0594.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0594.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case59_one_tt:0 "Debt shifting costs substantial Stability."
 kehillah_din_case59_two_tt:0 "Audit and installments cost some Stability."
 kehillah_din_case59_three_tt:0 "Cancellation costs less now but harms trust with lenders."
 kehillah_bet_din_case59_great_log_title:0 "The Community That Divided: a well-supported ruling"
 kehillah_bet_din_case59_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s pre-split debt."
 kehillah_bet_din_case59_good_log_title:0 "The Community That Divided: a workable ruling"
 kehillah_bet_din_case59_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s pre-split debt."
 kehillah_bet_din_case59_poor_log_title:0 "The Community That Divided: a disputed ruling"
 kehillah_bet_din_case59_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s pre-split debt."
