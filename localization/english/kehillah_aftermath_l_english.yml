l_english:
 # V43 slice 2 (2026-10-14): after a pogrom.
 kehillah_aftermath.0001.t:0 "The Burial"
 kehillah_aftermath.0001.desc:0 "They dug the graves in the cemetery outside the walls, side by side, because there was no time to do it any other way. The men who dug them were the ones who had not been hurt.\n\nThere are [ROOT.Char.MakeScope.Var('kehillah_pogrom_dead').GetValue|0] graves. The women have washed the bodies and wrapped them. The sexton has asked who will say Kaddish for those who have no one left to say it."
 kehillah_aftermath.0001.a:0 "I will say it for them myself, every day of the year."
 kehillah_aftermath.0001.b:0 "Write down their names. They will be read every year."
 kehillah_aftermath.0001.c:0 "Bury them, and open the market again."

 kehillah_aftermath.0002.t:0 "The Survivors"
 kehillah_aftermath.0002.desc:0 "A month after, the houses that are still standing are full. Families who lost their own sleep three to a bed in other people's rooms, and eat at other people's tables. Some of them have not said a word since."
 kehillah_aftermath.0002.desc_orphan:0 "[kehillah_aftermath_orphan.GetFirstName]'s father was killed in the street. [kehillah_aftermath_orphan.GetSheHe|U] sleeps in the synagogue with the other children who have no one, and every morning [kehillah_aftermath_orphan.GetSheHe] goes back to look at the house.\n\nThere are more like [kehillah_aftermath_orphan.GetHerHim] than the community can easily feed."
 kehillah_aftermath.0002.desc_convert:0 "[kehillah_aftermath_convert.GetFirstName] was made to convert, with the others, when the mob broke in. Now [kehillah_aftermath_convert.GetSheHe] stands at the back of the synagogue during the prayers and leaves before the end, so that no one will have to decide whether to speak to [kehillah_aftermath_convert.GetHerHim].\n\nThe houses are full of those who lost their own, and the community chest is nearly empty."
 kehillah_aftermath.0002.a:0 "The community chest will feed them until the spring."
 kehillah_aftermath.0002.b:0 "The families will take them into their houses."
 kehillah_aftermath.0002.c:0 "Find them work."

 kehillah_aftermath.0003.t:0 "Rebuilding"
 kehillah_aftermath.0003.desc:0 "The fire took the roof of the synagogue and half the houses on the street behind it. The walls are standing. The builders say there is timber and lime enough for one thing before the winter, not both."
 kehillah_aftermath.0003.a:0 "The synagogue first."
 kehillah_aftermath.0003.b:0 "The houses and the market first."
 kehillah_aftermath.0003.c:0 "Ask [kehillah_aftermath_lord.GetTitledFirstName] for timber from [kehillah_aftermath_lord.GetHerHis] forests."
 kehillah_aftermath_timber_given:0 "The carts come"
 kehillah_aftermath_timber_refused:0 "The steward says the forests are spoken for"

 kehillah_aftermath.0004.t:0 "The Year's Mind"
 kehillah_aftermath.0004.desc:0 "A year has passed. On the day, the synagogue is full, and the names are read. When they come to the end of the list the reader stops and starts again, because more people have come in.\n\nAfterwards they recite Av ha-Rachamim, for the communities that gave their lives for the Name."
 kehillah_aftermath.0004.a:0 "We will fast on this day, every year."
 kehillah_aftermath.0004.b:0 "Have a lament written, to be read on the Ninth of Av."
 kehillah_aftermath.0004.c:0 "Let the year be enough."
