 # The danger-of-violence tooltip (gui/kehillah_danger_breakdown.gui), 2026-11-09.
 # Its rows are kehillah_danger_value's own breakdown; the labels are the
 # kehillah_safety_factor_* keys where the safety view already has one.
 KEHILLAH_DANGER_TERM_FORMAT:0 "$KEY$: $VALUE|=-0$"
 KEHILLAH_DANGER_BD_HEADER:0 "Danger of violence: [Title.GetHolder.Custom('KehillahDangerBand')]"
 KEHILLAH_DANGER_BD_CHANCE:0 "#EMP A [Title.GetHolder.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]% chance of trouble this year#![Title.GetHolder.Custom('KehillahTroubleStatusLine')]"
 KEHILLAH_DANGER_BD_KINDS:0 "An accusation, a disputation, friars in the synagogue, a trial of the Talmud, the badge, Holy Week, a riot over the bonds, or a mob."
 KEHILLAH_DANGER_BD_SCORE:0 "#EMP Danger [Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_value')|0]#! #weak = a [Title.GetHolder.MakeScope.ScriptValue('kehillah_incident_chance_value')|1]% chance each quarter#!"

 kehillah_danger_term_court_rivals:0 "Court rivals"
