l_english:
 kehillah_bet_din.01041.t:0 "The Prisoner's Uncertain Release"
 kehillah_bet_din.01041.desc:0 "[kbd_litigant_a.GetFirstName] has collected money to release a detained neighbor. [kbd_litigant_b.GetFirstName] says the messenger's promise of release has no written guarantee. The prisoner may be moved tomorrow, but the communal purse cannot buy a rumor."
 kehillah_bet_din.01041.a:0 "Send every coin with the messenger now."
 kehillah_bet_din.01041.a.tt:0 "A false promise could consume the ransom fund."
 kehillah_bet_din.01041.b:0 "Pay for a verified contact and stage the ransom."
 kehillah_bet_din.01041.b.tt:0 "Verification costs time and keeps the offer alive."
 kehillah_bet_din.01041.c:0 "Close the collection and return the gifts."
 kehillah_bet_din.01041.c.tt:0 "The prisoner may lose the only available route to release."
 kehillah_din_source_104:0 "Cite a mastered Nashim work and examine the evidence."
 kehillah_din_source_104_tt:0 "Mishnah Gittin 4:6 gives the judges a textual point of reference. It cannot establish the messenger's authority and the prisoner's location."
 kehillah_din_combo_104:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_104_tt:0 "The judges preserve both parties' interests while checking the messenger's authority and the prisoner's location."
 kehillah_bet_din.01044.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01044.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01044.outcome_1:0 "The full purse goes to the messenger."
 kehillah_bet_din.01044.outcome_2:0 "The court confirms custody and releases funds against documented stages."
 kehillah_bet_din.01044.outcome_3:0 "The collection is dissolved."
 kehillah_bet_din.01044.fact_true:0 "The messenger has no authority to secure release. The full purse would be lost."
 kehillah_bet_din.01044.fact_false:0 "The custodian confirms a real release offer. Closing the collection abandons it."
 kehillah_bet_din.01044.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01044.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01044.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case104_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case104_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case104_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_din_proposed_104_1:0 "The ruling proposed so far: $kehillah_bet_din.01041.a$"
