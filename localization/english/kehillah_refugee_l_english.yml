l_english:
 # V41 -- refugees (events/kehillah_refugee_events.txt), 2026-10-14.
 kehillah_refugee.0001.t:0 "Refugees"
 kehillah_refugee.0001.desc:0 "They came up the road from [kehillah_refugee_from.GetName] this morning, [ROOT.Char.MakeScope.Var('kehillah_refugees_families').GetValue|0] families on foot, carrying what they could. Some of the children have no shoes. One man has his arm bound to his chest.\n\n[kehillah_refugee_speaker.GetFirstName] speaks for them. [kehillah_refugee_speaker.GetSheHe|U] says the quarter in [kehillah_refugee_from.GetName] was burned, and that they will do any work we have. They ask to stay."
 kehillah_refugee.0001.a:0 "Take them in."
 kehillah_refugee.0001.b:0 "Give them silver for the road."
 kehillah_refugee.0001.c:0 "Close the gate."
 kehillah_refugee_take_in_tt:0 "[kehillah_refugee_speaker.GetFirstName] and the others who came with [kehillah_refugee_speaker.GetHerHim] join our community."
 kehillah_refugee_road_tt:0 "They go on to look for another town."
 kehillah_refugee_refuse_tt:0 "They go back the way they came. People will hear of it."
 kehillah_refugee.0002.t:0 "The Families from the Road"
 kehillah_refugee.0002.desc:0 "The families who came to us after the burning have work now. Two of them keep stalls in the market. One of the women teaches the youngest children their letters, and some of our own children go to her.\n\nThis year they paid the community tax in full."
 kehillah_refugee.0002.a:0 "We were right to take them in."
