l_english:
 # Visit the Jewish community -- docs/spec/2026-11-14-adventurers-seats-and-invitations.md (2026-11-16)

 # This replaces the Tavern row of Visit Local Settlement while a community call is available.
 kehillah_visit.0001.entry:0 "Visit the Jewish Community"
 kehillah_visit.0001.entry.tt:0 "Call on the local Jewish community and its leader."

 kehillah_visit.0001.t:0 "At the Gate of [kehillah_visit_title.GetNameNoTooltip]"
 kehillah_visit.0001.desc:0 "Beyond the clamor of the market, the lane narrows between limewashed walls and open doors. The scent of bread and lamp-oil hangs in the air. [kehillah_visit_leader.GetShortUIName] waits beneath the quarter gate—not as a lord receiving a petitioner, but as the keeper of a threshold.\n\n\"A traveller of our people is never only a stranger,\" [kehillah_visit_leader.GetSheHe] says. \"Come in. We will hear what road has brought you here, and what road you mean to take next.\""
 kehillah_visit.0001.desc_spare:0 "\n\nA quiet look passes between the elders. The quarter has already sent a household away recently; generosity has its measure, and the families who remain must still make a life here."
 kehillah_visit.0001.a:0 "Break bread and pray with [kehillah_visit_leader.GetHerHim]"
 kehillah_visit.0001.b:0 "Ask [kehillah_visit_leader.GetHerHim] to make introductions"
 kehillah_visit.0001.c:0 "Speak with [kehillah_visit_leader.GetShortUIName] about the community's seat"
 kehillah_visit.0001.d:0 "Thank the community and take my leave"

 kehillah_visit.0002.t:0 "Names at the Table"
 kehillah_visit.0002.desc:0 "A little later, [kehillah_visit_leader.GetShortUIName] has a table laid beneath the awning of a courtyard. One by one, people are named—not wares offered for hire, but neighbours whose households might choose a harder future beyond these walls.\n\n\"No one is sent away,\" [kehillah_visit_leader.GetSheHe] says quietly. \"But some may find that the road you offer is the road they have been waiting to take. Whom would you meet?\""
 kehillah_visit.0002.desc_spare:0 "\n\nFor all their courtesy, the elders do not soften their answer: the community cannot spare another household so soon."
 kehillah_visit.0002.a:0 "Meet a teacher and copyist"
 kehillah_visit.0002.a.tt:0 "A learned Jewish household joins your camp. Its head has high Learning."
 kehillah_visit.0002.b:0 "Visit the countinghouse"
 kehillah_visit.0002.b.tt:0 "A merchant household joins your camp. Its head has high Stewardship and good Diplomacy."
 kehillah_visit.0002.c:0 "Speak with a caravan guard"
 kehillah_visit.0002.c.tt:0 "A road-wise Jewish household joins your camp. Its head has high Martial and Prowess."
 kehillah_visit.0002.d:0 "No household should be hurried onto the road"

 kehillah_visit_family_spare_tt:0 "The community has no household to spare just now"
