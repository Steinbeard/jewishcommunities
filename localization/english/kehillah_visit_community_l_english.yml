l_english:
 # Visit the Jewish community -- docs/spec/2026-11-14-adventurers-seats-and-invitations.md (2026-11-14)

 kehillah_visit.0002.t:0 "The Settlement of [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 kehillah_visit.0002.desc:0 "The road leads through the settlement. The Jewish Quarter of [kehillah_visit_title.GetName] is open to a traveller of the faith, while the town beyond has its own pleasures and opportunities."
 kehillah_visit.0002.a:0 "Call on the Jewish community"
 kehillah_visit.0002.b:0 "Visit the settlement"
 kehillah_visit.0002.c:0 "Continue on my way"

 kehillah_visit.0001.t:0 "The Jewish Quarter of [kehillah_visit_title.GetName]"
 kehillah_visit.0001.desc:0 "The Jews of [kehillah_visit_title.GetName] keep a quarter here, under the care of [kehillah_visit_leader.GetShortUIName]. Their customs are [kehillah_visit_leader.GetCulture.GetNameNoTooltip] ones, and they keep the rite as their fathers did. A traveller of the faith is a guest at their table, and the road is long."
 kehillah_visit.0001.desc_spare:0 "\n\nThe quarter has sent families out with travellers lately. [kehillah_visit_leader.GetShortUIName] says it cannot spare more yet."
 kehillah_visit.0001.a:0 "Pray with the congregation"
 kehillah_visit.0001.b:0 "Take a family into my company"
 kehillah_visit.0001.b.tt:0 "A Jewish family of the quarter joins your company."
 kehillah_visit.0001.c:0 "Speak with [kehillah_visit_leader.GetShortUIName] about the seat"
 kehillah_visit.0001.d:0 "Take my leave"
 kehillah_visit_family_spare_tt:0 "The quarter has no family to spare just now"
