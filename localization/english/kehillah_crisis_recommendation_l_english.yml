l_english:
 kehillah_crisis_recommend_button:0 "Suggested Actions"
 kehillah_crisis_recommend_button_tt:0 "Hear counsel on measures still open to the community. Each suggestion leads straight to that action."
 kehillah_crisis_recommend.0001.t:0 "The Elders' Counsel"
 kehillah_crisis_recommend.0001.desc:0 "The elders bring reports from the streets and lay the quarter's accounts beside them. We can still answer the danger, but each measure asks something different of the community. They offer the courses they would consider first."
 kehillah_crisis_recommend.0001.desc_dayyan:0 "The dayyan listens to the reports from the streets, then lays the quarter's accounts before you. 'We cannot buy our way out of every threat,' he says. 'There are people we can approach, and words we can answer, before we empty the treasury.'"
 kehillah_crisis_recommend.0001.desc_urgent:0 "The dayyan warns that the host may gather soon. A task begun now may not finish in time. He turns first to people who can act today and to answers that can still be heard in town."
 kehillah_crisis_recommend.0001.desc_empty:0 "The elders find no further course they can readily recommend. A measure may become possible if the community's means or circumstances change; the full crisis actions remain open."
 kehillah_crisis_recommend.0001.fast:0 "A fast could steady the quarter."
 kehillah_crisis_recommend.0001.fast.tt:0 "Consider a free communal fast: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_ev_small')|0]#! toward #high $kehillah_crisis_spared$#! immediately, with Piety and Stress relief."
 kehillah_crisis_recommend.0001.powerful:0 "Ask [kehillah_recommend_lord.GetTitledFirstName] for protection."
 kehillah_crisis_recommend.0001.powerful.tt:0 "Approach [kehillah_recommend_lord.GetTitledFirstName], whom you have not asked in this crisis. Decide whether to visit or send a messenger; the answer is uncertain."
 kehillah_crisis_recommend.0001.answer:0 "The charge ought to be answered in public."
 kehillah_crisis_recommend.0001.answer.tt:0 "Answer the agitator without paying gold. A successful argument adds #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_ev_medium')|0]#! toward #high $kehillah_crisis_spared$#!; a failure adds the same amount toward #high $kehillah_crisis_armed$#!. Choose who speaks in the next scene."
 kehillah_crisis_recommend.0001.advocacy:0 "A campaign of answers may reach more ears."
 kehillah_crisis_recommend.0001.advocacy.tt:0 "Consider a [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_advocacy_cost')|0]-gold campaign. It takes fourteen days and the communal task slot; on completion it lowers agitation and adds #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_advocacy_points')|0]#! toward #high $kehillah_crisis_spared$#!."
 kehillah_crisis_recommend.0001.watch:0 "A watch could guard the quarter."
 kehillah_crisis_recommend.0001.watch.tt:0 "Consider a watch costing [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_watch_cost')|0] gold. It takes fourteen days and the communal task slot; on completion it adds #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_watch_points')|0]#! toward #high $kehillah_crisis_spared$#! and helps if the host comes."
 kehillah_crisis_recommend.0001.town:0 "The town's support might be bought."
 kehillah_crisis_recommend.0001.town.tt:0 "Consider gifts costing [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_town_cost')|0] gold. If chosen, they add #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_ev_medium')|0]#! toward #high $kehillah_crisis_spared$#! immediately. Counsel suggests this only when the treasury can comfortably bear it."
 kehillah_crisis_recommend.0001.later:0 "I will hear the other possibilities myself."
 kehillah_crisis_recommend.0002.t:0 "The Elders' Counsel"
 kehillah_crisis_recommend.0002.desc:0 "The host has gathered. The elders spread out reports of its route and the quarter's defenses. They urge measures that can be taken before the crowd reaches the gates."
 kehillah_crisis_recommend.0002.desc_dayyan:0 "The dayyan points to the host's route on the map. 'We must decide where to seek help and where our own people can hold,' he says. 'The quarter cannot wait for a long preparation now.'"
 kehillah_crisis_recommend.0002.plead:0 "The lord must hear what is coming."
 kehillah_crisis_recommend.0002.plead.tt:0 "Ask the lord for his men. This costs no gold, but his answer is uncertain; the next scene shows the possible outcomes."
 kehillah_crisis_recommend.0002.bar:0 "Bar the streets before the host arrives."
 kehillah_crisis_recommend.0002.bar.tt:0 "Consider barricades. If chosen, they add #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_held_bar_points')|0]#! toward #high $kehillah_crisis_held$#! immediately and cause minor Stress."
 kehillah_crisis_recommend.0002.shelter:0 "Bring families into the stone houses."
 kehillah_crisis_recommend.0002.shelter.tt:0 "Consider shelter. If chosen, it adds #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_held_shelter_points')|0]#! toward #high $kehillah_crisis_held$#! immediately and costs 10 Prosperity."
 kehillah_crisis_recommend.0002.silver:0 "Silver might delay the march."
 kehillah_crisis_recommend.0002.silver.tt:0 "Consider sending [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_silver_cost')|0] gold to the host. If chosen, it adds #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_held_silver_points')|0]#! toward #high $kehillah_crisis_held$#! and may delay the march. Counsel suggests it only when the treasury can comfortably bear it."
 kehillah_crisis_recommend.action_decline:0 "Not yet."
 kehillah_crisis_recommend.0101.t:0 "A Fast for the Quarter"
 kehillah_crisis_recommend.0101.desc:0 "The elders ask whether the whole community should set aside a day of fasting. The quarter may find courage in acting together, even while the voices outside grow louder."
 kehillah_crisis_recommend.0101.confirm:0 "Call the community to a fast."
 kehillah_crisis_recommend.0101.tt:0 "No gold cost. #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_ev_small')|0]#! toward #high $kehillah_crisis_spared$#! now, with Piety and Stress relief. Once per crisis."
 kehillah_crisis_recommend.0102.t:0 "Answering the Accusations"
 kehillah_crisis_recommend.0102.desc:0 "A few answers in one place will not reach every listener. The elders propose sending trusted speakers through the market and to the lord's hall, while the danger still gives them time."
 kehillah_crisis_recommend.0102.confirm:0 "Fund the campaign of answers."
 kehillah_crisis_recommend.0102.tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_advocacy_cost')|0] gold and occupies the task slot for fourteen days. On completion, agitation falls and #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_advocacy_points')|0]#! goes toward #high $kehillah_crisis_spared$#!."
 kehillah_crisis_recommend.0103.t:0 "A Watch for the Quarter"
 kehillah_crisis_recommend.0103.desc:0 "The watch could stand at the gates and along the streets where threats have been heard. The elders can organize the households, but equipping and keeping men there will take coin and time."
 kehillah_crisis_recommend.0103.confirm:0 "Post the watch."
 kehillah_crisis_recommend.0103.tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_watch_cost')|0] gold and occupies the task slot for fourteen days. On completion, #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_watch_points')|0]#! goes toward #high $kehillah_crisis_spared$#!; the watch also aids a later defense."
 kehillah_crisis_recommend.0104.t:0 "The Town's Support"
 kehillah_crisis_recommend.0104.desc:0 "The town's leading households and guilds can still speak against the threats. Gifts might bring them to the table now, though the price deserves careful thought."
 kehillah_crisis_recommend.0104.confirm:0 "Send gifts to the town leaders."
 kehillah_crisis_recommend.0104.tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_town_cost')|0] gold. #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_ev_medium')|0]#! toward #high $kehillah_crisis_spared$#! immediately."
 kehillah_crisis_recommend.0201.t:0 "Bar the Streets"
 kehillah_crisis_recommend.0201.desc:0 "Chains, carts, and timber could hold the narrower ways into the quarter. The marshal asks for leave to put the households to work before the host reaches them."
 kehillah_crisis_recommend.0201.confirm:0 "Bar the approaches."
 kehillah_crisis_recommend.0201.tt:0 "#P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_held_bar_points')|0]#! toward #high $kehillah_crisis_held$#! immediately. Causes minor Stress."
 kehillah_crisis_recommend.0202.t:0 "The Stone Houses"
 kehillah_crisis_recommend.0202.desc:0 "Families have begun to gather at the strongest houses in the quarter. Taking them in may damage stores and livelihoods, but the walls offer a place to hold."
 kehillah_crisis_recommend.0202.confirm:0 "Bring the families inside."
 kehillah_crisis_recommend.0202.tt:0 "#P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_held_shelter_points')|0]#! toward #high $kehillah_crisis_held$#! immediately. Costs 10 Prosperity."
 kehillah_crisis_recommend.0203.t:0 "Silver for the Host"
 kehillah_crisis_recommend.0203.desc:0 "Some among the host might wait if their leaders are paid. Silver could be carried to them, though there is no certainty that it will buy more than a little time."
 kehillah_crisis_recommend.0203.confirm:0 "Send the silver."
 kehillah_crisis_recommend.0203.tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_silver_cost')|0] gold. #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_held_silver_points')|0]#! toward #high $kehillah_crisis_held$#! now; if the host is still mustering, its march is delayed."
