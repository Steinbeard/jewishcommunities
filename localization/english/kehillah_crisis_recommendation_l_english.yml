l_english:
 kehillah_crisis_recommend_button:0 "Suggested Actions"
 kehillah_crisis_recommend_button_tt:0 "Hear counsel on measures still open to the community. Each suggestion leads straight to that action."
 kehillah_crisis_recommend.0001.t:0 "The Elders' Counsel"
 kehillah_crisis_recommend.0001.desc:0 "The elders bring reports from the streets and lay the quarter's accounts beside them. We can still answer the danger, but each measure asks something different of the community. They offer the courses they would consider first."
 kehillah_crisis_recommend.0001.desc_dayyan:0 "The dayyan listens to the reports from the streets, then lays the quarter's accounts before you. 'We cannot buy our way out of every threat,' he says. 'There are people we can approach, and words we can answer, before we empty the treasury.'"
 kehillah_crisis_recommend.0001.desc_urgent:0 "The dayyan warns that the host may gather soon. A task begun now may not finish in time. He turns first to people who can act today and to answers that can still be heard in town."
 kehillah_crisis_recommend.0001.desc_empty:0 "The elders find no further course they can readily recommend. A measure may become possible if the community's means or circumstances change; the full crisis actions remain open."
 kehillah_crisis_recommend.0001.fast:0 "A fast could steady the quarter."
 kehillah_crisis_recommend.0001.fast.tt:0 "A sure small gain, or a riskier try for more with your $kehillah_council_dayyan$"
 kehillah_crisis_recommend.0001.powerful:0 "Ask [kehillah_recommend_lord.GetTitledFirstName] for protection."
 kehillah_crisis_recommend.0001.powerful.tt:0 "Approach [kehillah_recommend_lord.GetTitledFirstName], whom you have not yet asked in this crisis"
 kehillah_crisis_recommend.0001.answer:0 "The charge ought to be answered in public."
 kehillah_crisis_recommend.0001.answer.tt:0 "Costs no gold. The argument could go either way"
 kehillah_crisis_recommend.0001.advocacy:0 "A campaign of answers may reach more ears."
 kehillah_crisis_recommend.0001.advocacy.tt:0 "A long campaign of answers, paid for or carried by volunteers"
 kehillah_crisis_recommend.0001.watch:0 "A watch could guard the quarter."
 kehillah_crisis_recommend.0001.watch.tt:0 "A watch on the lanes, paid for or kept by volunteers"
 kehillah_crisis_recommend.0001.town:0 "The town's support might be bought."
 kehillah_crisis_recommend.0001.town.tt:0 "Gifts to the guild leaders, or your $kehillah_council_shtadlan$'s persuasion alone"
 kehillah_crisis_recommend.0001.later:0 "I will hear the other possibilities myself."
 kehillah_crisis_recommend.0002.t:0 "The Elders' Counsel"
 kehillah_crisis_recommend.0002.desc:0 "The host has gathered. The elders spread out reports of its route and the quarter's defenses. They urge measures that can be taken before the crowd reaches the gates."
 kehillah_crisis_recommend.0002.desc_dayyan:0 "The dayyan points to the host's route on the map. 'We must decide where to seek help and where our own people can hold,' he says. 'The quarter cannot wait for a long preparation now.'"
 kehillah_crisis_recommend.0002.plead:0 "The lord must hear what is coming."
 kehillah_crisis_recommend.0002.plead.tt:0 "Costs no gold, but the lord's answer is uncertain"
 kehillah_crisis_recommend.0002.bar:0 "Bar the streets before the host arrives."
 kehillah_crisis_recommend.0002.bar.tt:0 "Every approach barred, or a narrower line under your $kehillah_council_rosh_hashmirah$"
 kehillah_crisis_recommend.0002.shelter:0 "Bring families into the stone houses."
 kehillah_crisis_recommend.0002.shelter.tt:0 "The stone houses, or spare rooms found by your $kehillah_council_rosh_hashmirah$"
 kehillah_crisis_recommend.0002.silver:0 "Silver might delay the march."
 kehillah_crisis_recommend.0002.silver.tt:0 "The full sum, or a smaller one through your $kehillah_council_neeman$'s contacts"
 kehillah_crisis_recommend.action_decline:0 "Not yet."
 kehillah_crisis_recommend.0101.t:0 "A Fast for the Quarter"
 kehillah_crisis_recommend.0101.desc:0 "The elders can announce a fast at once. Most households will observe it, and the shared day may ease their fear.\n\nThe $kehillah_council_dayyan$ thinks he could first speak to the families who distrust the elders. If they join of their own accord, the quarter may be steadier still; if they refuse, a public call for unity could expose its divisions."
 kehillah_crisis_recommend.0101.confirm:0 "Call the community to a fast."
 kehillah_crisis_recommend.0101.risk:0 "Ask the Dayyan to bring the reluctant families into the fast."
 kehillah_crisis_recommend.0101.risk.tt:0 "Turns on your $kehillah_council_dayyan$'s Learning; compassion helps."
 kehillah_crisis_recommend.0102.t:0 "Answering the Accusations"
 kehillah_crisis_recommend.0102.desc:0 "A reply heard only in the quarter will not reach the market. Paid messengers can carry the community's answer to the traders and the ruler's court.\n\nThe $kehillah_council_neeman$ offers another way: find witnesses willing to speak for nothing. He knows whom to ask, but a refusal in public would make the accusation harder to contain."
 kehillah_crisis_recommend.0102.confirm:0 "Fund the campaign of answers."
 kehillah_crisis_recommend.0102.tt:0 "$kehillah_crisis_tt_spared_large$ in [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_preparation_days')|0] days"
 kehillah_crisis_recommend.0102.risk:0 "Ask the Ne'eman to recruit volunteer witnesses."
 kehillah_crisis_recommend.0102.risk.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue; patience helps."
 kehillah_crisis_recommend.0103.t:0 "A Watch for the Quarter"
 kehillah_crisis_recommend.0103.desc:0 "The Rosh ha-Shmirah marks the lanes where men have been heard shouting after dark. 'I can pay the watchmen to stand here for a fortnight,' he says, tracing the route with his finger. 'Or I can ask the households to take turns. That costs no coin, if I can persuade enough of them to serve.'\n\nA thin watch might leave its posts unmanned just when a shopkeeper needs help."
 kehillah_crisis_recommend.0103.confirm:0 "Post the watch."
 kehillah_crisis_recommend.0103.tt:0 "$kehillah_crisis_tt_spared_large$ in [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_preparation_days')|0] days"
 kehillah_crisis_recommend.0103.risk:0 "Organize a volunteer rota with the Rosh ha-Shmirah."
 kehillah_crisis_recommend.0103.risk.tt:0 "Turns on your $kehillah_council_rosh_hashmirah$'s Martial; bravery helps."
 kehillah_crisis_recommend.0104.t:0 "The Town's Support"
 kehillah_crisis_recommend.0104.desc:0 "The guild leaders can tell their members to leave the quarter in peace. The Shtadlan has names and invitations ready; gifts will bring them to a meeting, though the treasury will feel the loss.\n\nHe could also go without gifts and ask them to remember years of trade. If they turn him away, the refusal will travel through the town."
 kehillah_crisis_recommend.0104.confirm:0 "Send gifts to the town leaders."
 kehillah_crisis_recommend.0104.risk:0 "Ask the Shtadlan to win the guild leaders without gifts."
 kehillah_crisis_recommend.0104.risk.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy; a gregarious nature helps."
 kehillah_crisis_recommend.0201.t:0 "Bar the Streets"
 kehillah_crisis_recommend.0201.desc:0 "The Rosh ha-Shmirah has carts, chains, and timber gathered beside the gate. Closing every approach will take many hands and leave the households exhausted.\n\nHe points instead to a single narrow passage: 'If the host comes this way, fewer men could hold them. If they find another lane, our work will have been for nothing.'"
 kehillah_crisis_recommend.0201.confirm:0 "Bar the approaches."
 kehillah_crisis_recommend.0201.risk:0 "Trust the Rosh ha-Shmirah to fortify the narrow passage."
 kehillah_crisis_recommend.0201.risk.tt:0 "Turns on your $kehillah_council_rosh_hashmirah$'s Martial; bravery helps."
 kehillah_crisis_recommend.0202.t:0 "The Stone Houses"
 kehillah_crisis_recommend.0202.desc:0 "The stone houses could hold the families nearest the gate, but their owners would have to clear stores and turn away trade. One household has offered its hall; the others are waiting to see who will bear the cost.\n\nThe Rosh ha-Shmirah believes he can divide the families among spare rooms. It would spare more goods if the owners agree, and leave people exposed if they do not."
 kehillah_crisis_recommend.0202.confirm:0 "Bring the families inside."
 kehillah_crisis_recommend.0202.risk:0 "Ask the Rosh ha-Shmirah to find spare rooms."
 kehillah_crisis_recommend.0202.risk.tt:0 "Turns on your $kehillah_council_rosh_hashmirah$'s Martial; bravery helps."
 kehillah_crisis_recommend.0203.t:0 "Silver for the Host"
 kehillah_crisis_recommend.0203.desc:0 "A messenger has found captains willing to pause while they count silver. The full sum would give them little reason to advance tonight, though it would empty a portion of the treasury.\n\nThe Ne'eman suggests sending a smaller amount through the men whose allegiance is least certain. They may accept it and delay their comrades, or take the coin and march anyway."
 kehillah_crisis_recommend.0203.confirm:0 "Send the silver."
 kehillah_crisis_recommend.0203.risk:0 "Send a smaller sum through the Ne'eman's contacts."
 kehillah_crisis_recommend.0203.risk.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue; patience helps."
