l_english:
 kehillah_restore_kohen_gadol_decision:0 "Restore the Kohen Gadol"
 kehillah_restore_kohen_gadol_decision_tooltip:0 "Seat a High Priest over Jerusalem's restored Temple service"
 kehillah_restore_kohen_gadol_decision_confirm:0 "Seat the High Priest"
 kehillah_restore_kohen_gadol_decision_desc:0 "The service in Jerusalem has begun again, but no High Priest has stood before the altar since the Temple fell. The office belongs to the sons of Aaron. If one of them will take it, I can give it to him, or, being of that line myself, take it up as the Hasmoneans did."
 kehillah_kohen_gadol_requires_tenet_tt:0 "Your rite holds, or you personally hold, the tenet of Messianic Hope, Temple Service or Sacred Homeland"
 kehillah_kohen_gadol_requires_jerusalem_tt:0 "You hold the county of Jerusalem, and its people share your faith"
 kehillah_kohen_gadol_requires_kohen_tt:0 "You are a Kohen yourself, or you are a king with an adult Kohen of your faith among your courtiers and a temple holding in the county of Jerusalem to seat him in"
 kehillah_restore_kohen_gadol_effect_tt:0 "The #EMP High Priesthood#! is restored at Jerusalem\nIf you are a Kohen, you take the office yourself\nOtherwise your most learned Kohen courtier receives your temple holding in Jerusalem and the office\nYour rite adopts the Kohanim's authority over the law; rites that keep the sages' authority will think it astray\nIf Rabbinic Judaism has no [head_of_faith|E], the High Priest becomes its head, and only a Kohen may succeed him\nThe office lapses if it passes to anyone who is not a Kohen of its faith"
 kehillah_kohen_gadol_title_name:0 "High Priesthood"
 kehillah_kohen_gadol_title_name_adj:0 "Priestly"
 kehillah_news_kohen_gadol_restored_t:0 "A High Priest in Jerusalem"
 kehillah_news_kohen_gadol_restored_d:0 "[kehillah_kg_kohen.GetTitledFirstName] has been seated as Kohen Gadol at Jerusalem. For the first time since the Temple fell, a High Priest serves before the altar."
