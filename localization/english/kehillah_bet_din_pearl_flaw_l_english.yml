l_english:
 kehillah_bet_din.0381.t:0 "The Pearl Seller's Hidden Flaw"
 kehillah_bet_din.0381.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a seller who calls a repaired pearl sound and says its join was visible. [kbd_litigant_b.GetFirstName] bought it as flawless and discovered the join under lamplight. The buyer has a second merchant willing to inspect it. The court must decide whether the sale stood on an honest description."
 kehillah_bet_din.0381.a:0 "Confirm the sale at its full price."
 kehillah_bet_din.0381.a.tt:0 "Trade closes quickly, but a concealed repair would leave the buyer overcharged."
 kehillah_bet_din.0381.b:0 "Have independent merchants inspect the pearl and sale terms."
 kehillah_bet_din.0381.b.tt:0 "Inspection costs time and money while the pearl is held safely."
 kehillah_bet_din.0381.c:0 "Cancel the sale and return the buyer's money."
 kehillah_bet_din.0381.c.tt:0 "The buyer is protected, but a visible repair could make cancellation unfair."
 kehillah_din_source_38:0 "Cite a mastered Nezikin work and test the sale's description."
 kehillah_din_source_38_tt:0 "Mishnah Bava Metzia 4:11 addresses defects in sales. The court still needs to inspect this pearl and hear what was said."
 kehillah_din_combo_38:0 "Have a scholar and steward inspect the pearl with traders."
 kehillah_din_combo_38_tt:0 "The judges compare the object, price and witnesses to the sale."
 kehillah_bet_din.0384.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0384.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0384.outcome_1:0 "The court confirms the price and returns the pearl to the buyer."
 kehillah_bet_din.0384.outcome_2:0 "The court holds the pearl and summons independent merchants to examine its join."
 kehillah_bet_din.0384.outcome_3:0 "The court cancels the sale and refunds the buyer."
 kehillah_bet_din.0384.fact_true:0 "The repair was hidden beneath a coating. Confirming the full price rewarded a misleading sale."
 kehillah_bet_din.0384.fact_false:0 "The join was plain to experienced buyers and was named before purchase. Cancellation ignored an informed bargain."
 kehillah_bet_din.0384.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0384.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0384.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case38_one_tt:0 "Confirming the sale risks substantial Stability."
 kehillah_din_case38_two_tt:0 "Inspection costs some Stability."
 kehillah_din_case38_three_tt:0 "Cancellation costs less now but may unsettle honest trade."
 kehillah_bet_din_case38_great_log_title:0 "The Pearl Seller's Hidden Flaw: a well-supported ruling"
 kehillah_bet_din_case38_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s pearl sale complaint."
 kehillah_bet_din_case38_good_log_title:0 "The Pearl Seller's Hidden Flaw: a workable ruling"
 kehillah_bet_din_case38_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s pearl sale complaint."
 kehillah_bet_din_case38_poor_log_title:0 "The Pearl Seller's Hidden Flaw: a disputed ruling"
 kehillah_bet_din_case38_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s pearl sale complaint."
