l_english:
 # V34 section 3: the teaching changes
 kehillah_council.0001.t:0 "The Council Considers the Jews"
 kehillah_council.0001.desc:0 "Between the weightier canons, the fathers turn to the Jews who live among the faithful. Some would mark them apart and send preachers to their synagogues; some call their books blasphemy. Others recall the old teaching: that they are to be preserved, unharmed, as witnesses.\n\nWhat the council decides will bind every bishop and prince of the faith."
 kehillah_council.0001.a:0 "Separate them, and press them harder."
 kehillah_council.0001.b:0 "Reaffirm the old protection."
 kehillah_council.0001.c:0 "Leave the matter as it stands."
 kehillah_news_teaching_t:0 "A Teaching on the Jews Changes"
 kehillah_news_teaching_d:0 "The [kehillah_teaching_rite.GetName] has changed its teaching on the Jews. Your host's church now holds a different view of your people and of what it allows him to do."

 # V34 section 4: popular risings
 kehillah_news_rising_t:0 "The Rising Turns on the Jews"
 kehillah_news_rising_self_d:0 "The rising led by [kehillah_rising_leader.GetTitledFirstName] has fallen on your quarter. His preachers call the Jews the enemy within; houses are burned, and those who could not flee or pay were killed. The community is badly shaken."
 kehillah_news_rising_d:0 "The rising led by [kehillah_rising_leader.GetTitledFirstName] has fallen on the Jews of the [kehillah_news_title.GetNameNoTooltip]. Houses were burned and lives were lost."
