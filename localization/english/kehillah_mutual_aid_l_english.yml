l_english:
 # --- Game concepts -----------------------------------------------------
 game_concept_kehillah_mutual_aid:0 "Mutual Aid"
 game_concept_kehillah_mutual_aid_appeal:0 "appeal"
 game_concept_kehillah_mutual_aid_appeals:0 "appeals"
 game_concept_kehillah_mutual_aid_desc:0 "Kol Yisrael arevim zeh bazeh: all Israel are responsible for one another. When a Jew is held captive by a non-Jew, or a community falls into poverty, is struck by an attack, shelters refugees or is driven out, the other communities are asked to help.\n\nAn appeal stays open for about two years. Communities with at least Healthy Prosperity in reach are #emphasis expected#! to answer it. A Flourishing community carries twice the share of a Healthy one and reaches twice as far. A Legendary community carries three shares and is asked from anywhere. Poorer communities are not expected, but whatever they give counts double.\n\nAnswering raises a community's [kehillah_giving_name|E]. Staying silent until the appeal closes lowers it, and the community in need remembers. The largest giver becomes the appeal's patron: it gains prestige and a favour from the community it helped, and that community answers its own appeals first. A richer community's gifts, and its silences, count for more. A poor or struck community can ask for help itself with the decision #high Write to the Communities#!."
 game_concept_kehillah_giving_name:0 "Name for Giving"
 game_concept_kehillah_giving_name_desc:0 "How the Jewish world speaks of a community's charity to others. It rises when the community answers [kehillah_mutual_aid|E] appeals, takes in refugees or sends gifts to the Land of Israel. It falls when the community ignores an appeal, turns refugees away or refuses the emissaries. It fades a little every year.\n\nA high name earns the leader the regard of Jews everywhere, and other communities answer its own appeals sooner. A low one does the opposite."

 # --- Interactions --------------------------------------------------------
 kehillah_send_aid_interaction:0 "Send Aid"
 kehillah_send_aid_interaction_desc:0 "Send this community's share toward [recipient.GetTitledFirstName]'s [kehillah_mutual_aid_appeal|E]. A greater community sends a greater share, and its gift counts for more. Tick the option below to give everything still needed: for a captive, pidyon shvuyim, the redemption of captives, the greatest of mitzvot."
 kehillah_aid_give_all_option:0 "Give everything still needed"

 # --- Name for giving -----------------------------------------------------
 kehillah_giving_renowned_modifier:0 "Renowned for Giving"
 kehillah_giving_renowned_modifier_desc:0 "This leader's community answers every call: captives redeemed, refugees housed, the poor of other towns fed. Jews far away speak of it."
 kehillah_giving_generous_modifier:0 "Generous Community"
 kehillah_giving_generous_modifier_desc:0 "This leader's community is known to answer when other communities are in need."
 kehillah_giving_stingy_modifier:0 "Tight-Fisted Community"
 kehillah_giving_stingy_modifier_desc:0 "This leader's community has turned away from the needs of others, and other communities have noticed."
 kehillah_giving_disgraced_modifier:0 "Community Without Charity"
 kehillah_giving_disgraced_modifier_desc:0 "This leader's community has ignored captives and the needy again and again. Its name is spoken with contempt."

 kehillah_giving_rep_up_minor_tt:0 "[kehillah_giving_name|E]: #P Minor rise#!"
 kehillah_giving_rep_up_moderate_tt:0 "[kehillah_giving_name|E]: #P Moderate rise#!"
 kehillah_giving_rep_up_major_tt:0 "[kehillah_giving_name|E]: #P Major rise#!"
 kehillah_giving_rep_down_minor_tt:0 "[kehillah_giving_name|E]: #N Minor fall#!"
 kehillah_giving_rep_down_moderate_tt:0 "[kehillah_giving_name|E]: #N Moderate fall#!"
 kehillah_giving_rep_down_major_tt:0 "[kehillah_giving_name|E]: #N Major fall#!"
 kehillah_aid_refugees_appeal_tt:0 "The communities nearby are asked to help house the refugees"

 kehillah_aid_patron_opinion:0 "Patron of Our Appeal"
 kehillah_aid_redeemer_opinion:0 "Redeemed Me from Captivity"
 kehillah_aid_silent_opinion:0 "Ignored Our Appeal"
 kehillah_aid_refused_opinion:0 "Refused Our Appeal"

 # --- Giving --------------------------------------------------------------
 kehillah_aid_gift_ransom_tt:0 "The gold is held toward [kehillah_aid_need.GetTitledFirstName]'s ransom"
 kehillah_aid_gift_relief_tt:0 "The gold goes to [kehillah_aid_need.GetTitledFirstName]'s community"
 kehillah_aid_gift_rebuild_tt:0 "Helps [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] recover from the attack"
 kehillah_aid_completes_ransom_tt:0 "This completes the ransom: [kehillah_aid_need.GetTitledFirstName] goes free"
 kehillah_aid_completes_relief_tt:0 "This answers the [kehillah_mutual_aid_appeal|E] in full"
 kehillah_aid_later_tt:0 "The [kehillah_mutual_aid_appeal|E] stays open for about two years. Until then, right-click [kehillah_aid_need.GetTitledFirstName] to answer it"
 kehillah_aid_later_risk_tt:0 "If it closes and we never answered: [kehillah_giving_name|E] #N Moderate fall#!, Greatness: #N Minor penalty#!, and [kehillah_aid_need.GetFirstName] will hold it against us"

 # --- Letters and news ----------------------------------------------------
 kehillah_aid_open_ransom_t:0 "A Captive to Redeem"
 kehillah_aid_open_ransom_d:0 "[kehillah_aid_need.GetTitledFirstName] is held captive, and the ransom is [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon!. Our community is among those expected to help. Right-click [kehillah_aid_need.GetHerHim] to answer."
 kehillah_aid_open_relief_t:0 "A Community in Need"
 kehillah_aid_open_relief_d:0 "[kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has fallen on hard times and asks for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon!. Our community is among those expected to help. Right-click [kehillah_aid_need.GetTitledFirstName] to answer."
 kehillah_aid_open_rebuild_t:0 "A Quarter to Rebuild"
 kehillah_aid_open_rebuild_d:0 "[kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] was struck and asks for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon! to rebuild. Our community is among those expected to help. Right-click [kehillah_aid_need.GetTitledFirstName] to answer."
 kehillah_aid_open_refugees_t:0 "Refugees to House"
 kehillah_aid_open_refugees_d:0 "[kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has taken in refugees and asks for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon! to house them. Our community is among those expected to help. Right-click [kehillah_aid_need.GetTitledFirstName] to answer."
 kehillah_aid_open_exiles_t:0 "A Community Driven Out"
 kehillah_aid_open_exiles_d:0 "[kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has been expelled and asks for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon! to resettle its families. Our community is among those expected to help. Right-click [kehillah_aid_need.GetTitledFirstName] to answer."

 kehillah_aid_news_t:0 "News of an Appeal"
 kehillah_aid_news_ransom_d:0 "Word comes that [kehillah_aid_need.GetTitledFirstName] is held captive. The richer communities are asked to ransom [kehillah_aid_need.GetHerHim]; we were not asked, but whatever we send would count for much."
 kehillah_aid_news_relief_d:0 "Word comes that [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has fallen on hard times. The richer communities are asked to help; we were not asked, but whatever we send would count for much."
 kehillah_aid_news_rebuild_d:0 "Word comes that [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] was struck and is rebuilding. The richer communities are asked to help; we were not asked, but whatever we send would count for much."
 kehillah_aid_news_refugees_d:0 "Word comes that [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has taken in refugees. The richer communities are asked to help; we were not asked, but whatever we send would count for much."
 kehillah_aid_news_exiles_d:0 "Word comes that [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has been driven out. The richer communities are asked to help it resettle; we were not asked, but whatever we send would count for much."

 kehillah_aid_reminder_t:0 "An Appeal Closes Soon"
 kehillah_aid_reminder_d:0 "The [kehillah_mutual_aid_appeal|E] for [kehillah_aid_need.GetTitledFirstName] closes within the year, and our community has sent nothing yet. The other communities will notice."

 kehillah_aid_done_ransom_t:0 "A Captive Redeemed"
 kehillah_aid_done_ransom_d:0 "The ransom is paid in full and [kehillah_aid_need.GetTitledFirstName] is free. Our community's gift was part of it."
 kehillah_aid_done_relief_t:0 "The Appeal Is Answered"
 kehillah_aid_done_relief_d:0 "[kehillah_aid_need.GetTitledFirstName] has everything the [kehillah_mutual_aid_appeal|E] asked for. Our community's gift was part of it."
 kehillah_aid_patron_t:0 "Named Patron"
 kehillah_aid_patron_d:0 "No community gave more toward [kehillah_aid_need.GetTitledFirstName]'s [kehillah_mutual_aid_appeal|E] than ours. Our name is read out in their synagogue; they owe us a favour, and will answer our own appeals before anyone's."
 kehillah_aid_refused_t:0 "An Appeal Went Unanswered"
 kehillah_aid_refused_d:0 "Our community was asked to help [kehillah_aid_need.GetTitledFirstName] and sent nothing before the [kehillah_mutual_aid_appeal|E] closed. The other communities remember."
 kehillah_aid_died_t:0 "Died in Captivity"
 kehillah_aid_died_d:0 "[kehillah_aid_need.GetTitledFirstName] has died in [kehillah_aid_need.GetHerHis] captor's prison, still waiting to be redeemed. Our community was asked to help and sent nothing."

 kehillah_aid_hint_t:0 "Our Poor Go Hungry"
 kehillah_aid_hint_d:0 "The community's Prosperity has fallen into crisis. Other communities answer such [kehillah_mutual_aid_appeals|E]: we may ask them with the decision #high Write to the Communities#!."

 # --- The emissary (.0001) --------------------------------------------------
 kehillah_mutual_aid.0001.t:0 "An Emissary from the Land of Israel"
 kehillah_mutual_aid.0001.desc:0 "A shadar has come from the Land of Israel, carrying letters from the communities there. They are poor, he says, and few, and they pray for the communities of the diaspora. He asks what this community can give."
 kehillah_mutual_aid.0001.a:0 "Give generously."
 kehillah_mutual_aid.0001.b:0 "Give what we can spare."
 kehillah_mutual_aid.0001.c:0 "We have nothing to give this year."

 # --- The letter (.0002) ----------------------------------------------------
 kehillah_mutual_aid.0002.desc_ransom:0 "A letter comes, passed from community to community. [kehillah_aid_need.GetTitledFirstName] is held captive, and [kehillah_aid_need.GetSheHe] will not go free until a ransom of [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon! is paid. Whoever can, it says, must help redeem [kehillah_aid_need.GetHerHim]."
 kehillah_mutual_aid.0002.desc_relief:0 "A letter comes from [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip], in [kehillah_aid_need.GetTitledFirstName]'s own hand. Trade has failed them; the charity box is empty and the poor go hungry. They ask their sister communities for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon!."
 kehillah_mutual_aid.0002.desc_rebuild:0 "A letter comes from [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip]. The quarter was struck; houses are burned and families are living with neighbours. [kehillah_aid_need.GetTitledFirstName] asks their sister communities for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon! to rebuild."
 kehillah_mutual_aid.0002.desc_refugees:0 "A letter comes from [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip]. They have opened their doors to refugees, more than they can feed. [kehillah_aid_need.GetTitledFirstName] asks their sister communities for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon! to house them."
 kehillah_mutual_aid.0002.desc_exiles:0 "A letter comes from the people of [kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip], who have been driven from their homes. [kehillah_aid_need.GetTitledFirstName] asks their sister communities for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] @gold_icon! to settle their families somewhere new."
 kehillah_mutual_aid.0002.desc_they_gave:0 "\n\nThey have always answered when others asked."
 kehillah_mutual_aid.0002.desc_they_withheld:0 "\n\nWhen others asked them for help, they gave little or nothing."
 kehillah_mutual_aid.0002.desc_nothing:0 ""
 kehillah_mutual_aid.0002.desc_we_owe:0 "\n\nThey were our patrons once, when we were the ones in need. We owe them this."
 kehillah_mutual_aid.0002.desc_we_lead:0 "\n\nThe letter is addressed to us first, as the greatest community of the diaspora, and it reached us from far away."
 kehillah_mutual_aid.0002.desc_we_are_great:0 "\n\nWord of our prosperity has travelled far: the letter reached us from well beyond our own region, and more is expected of us than of our neighbours."
 kehillah_mutual_aid.0002.desc_we_are_neighbours:0 "\n\nWe are among the neighbours they have written to."
 kehillah_mutual_aid.0002.a:0 "Send our share."
 kehillah_mutual_aid.0002.b:0 "Give them everything they still need."
 kehillah_mutual_aid.0002.b_ransom:0 "We will redeem [kehillah_aid_need.GetHerHim] ourselves."
 kehillah_mutual_aid.0002.c:0 "We will decide later."
 kehillah_mutual_aid.0002.d:0 "We cannot help them this time."

 # --- The redeemed captive (.0003) ------------------------------------------
 kehillah_mutual_aid.0003.t:0 "The Redeemed"
 kehillah_mutual_aid.0003.desc:0 "[kehillah_aid_need.GetTitledFirstName], whose ransom our community paid most of, has come to us. [kehillah_aid_need.GetSheHe|U] has no Jewish household to return to, and asks to stay among those who freed [kehillah_aid_need.GetHerHim]."
 kehillah_mutual_aid.0003.desc_learned:0 " Our scholars are already arguing with [kehillah_aid_need.GetHerHim] in the study house; the old story of the four captives, whose redemption brought learning to new lands, is on everyone's lips."
 kehillah_mutual_aid.0003.desc_plain:0 ""
 kehillah_mutual_aid.0003.a:0 "Welcome [kehillah_aid_need.GetHerHim] among us."
 kehillah_mutual_aid.0003.b:0 "Give [kehillah_aid_need.GetHerHim] silver for the road."

 # --- The appeal answered (.0004) -------------------------------------------
 kehillah_mutual_aid.0004.t:0 "The Appeal Is Answered"
 kehillah_mutual_aid.0004.desc:0 "The last of the gold has come in. Our [kehillah_mutual_aid_appeal|E] is answered in full, and of all who gave, none gave more than [kehillah_aid_patron.GetTitledFirstName] of [kehillah_aid_patron.GetPrimaryTitle.GetNameNoTooltip]. We owe them a favour, and when they are in need, we will be the first to answer."
 kehillah_mutual_aid.0004.a:0 "Read the names of our benefactors in the synagogue."

 # --- Writing to the communities (.0010) ------------------------------------
 kehillah_write_to_communities_decision:0 "Write to the Communities"
 kehillah_write_to_communities_decision_desc:0 "Our community cannot recover alone. We can write to our sister communities and ask for help, as they would ask us."
 kehillah_write_to_communities_decision_tooltip:0 "Ask the other communities for help"
 kehillah_write_to_communities_decision_confirm:0 "Take up the pen"
 kehillah_write_to_communities_decision_effect_tt:0 "Choose how to word an [kehillah_mutual_aid_appeal|E] to the other communities"
 kehillah_aid_appeal_already_open_tt:0 "We already have an [kehillah_mutual_aid_appeal|E] open"
 kehillah_aid_appeal_cooldown_tt:0 "We have written to the communities too recently"

 kehillah_mutual_aid.0010.t:0 "A Letter to Our Sister Communities"
 kehillah_mutual_aid.0010.desc_struck:0 "The quarter is still half in ruins. The council has drafted a letter to the other communities, asking them to help us rebuild. Whether it goes only to our neighbours, or with an envoy to the great communities farther away, is for [ROOT.Char.GetFirstName] to decide."
 kehillah_mutual_aid.0010.desc_poor:0 "Trade has dried up and the charity box is empty. The council has drafted a letter to the other communities, asking them to help us through. Whether it goes only to our neighbours, or with an envoy to the great communities farther away, is for [ROOT.Char.GetFirstName] to decide."
 kehillah_mutual_aid.0010.desc_we_gave:0 "\n\n\"They will remember what we gave when they were in need,\" says one of the elders."
 kehillah_mutual_aid.0010.desc_we_withheld:0 "\n\n\"And when they wrote to us,\" mutters one of the elders, \"what did we send?\""
 kehillah_mutual_aid.0010.a:0 "Write to our neighbours."
 kehillah_mutual_aid.0010.b:0 "Send our Shtadlan with the letters to the great communities."
 kehillah_mutual_aid.0010.c:0 "Not yet."
 kehillah_aid_appeal_full_tt:0 "The communities in reach are asked for [GetPlayer.MakeScope.ScriptValue('kehillah_aid_appeal_size_value')|0] @gold_icon!"
 kehillah_aid_appeal_wide_tt:0 "Communities twice as far away are asked too"
 kehillah_aid_appeal_envoy_tt:0 "[kehillah_aid_envoy.GetTitledFirstName], our Shtadlan, carries them: the more persuasive, the likelier the communities are to answer"
 kehillah_aid_no_shtadlan_tt:0 "We need a Shtadlan, free to travel, to carry the letters"

 # --- Pillar breakdown ------------------------------------------------------
 kehillah_bd_aid_duty_legendary:0 "\n#weak [kehillah_mutual_aid|E]:#! expected to give three shares to any [kehillah_mutual_aid_appeal|E], wherever it comes from"
 kehillah_bd_aid_duty_flourishing:0 "\n#weak [kehillah_mutual_aid|E]:#! expected to give two shares to [kehillah_mutual_aid_appeals|E] from across the region"
 kehillah_bd_aid_duty_healthy:0 "\n#weak [kehillah_mutual_aid|E]:#! expected to give one share to our neighbours' [kehillah_mutual_aid_appeals|E]"
 kehillah_bd_aid_duty_poor:0 "\n#weak [kehillah_mutual_aid|E]:#! not expected to give; we may write to the communities for help"
 kehillah_bd_giving_renowned:0 "\n#weak [kehillah_giving_name|E]:#! #P Renowned#!"
 kehillah_bd_giving_generous:0 "\n#weak [kehillah_giving_name|E]:#! #P Generous#!"
 kehillah_bd_giving_stingy:0 "\n#weak [kehillah_giving_name|E]:#! #N Tight-fisted#!"
 kehillah_bd_giving_disgraced:0 "\n#weak [kehillah_giving_name|E]:#! #N Without charity#!"
 kehillah_bd_giving_none:0 "\n#weak [kehillah_giving_name|E]:#! unremarkable"
 kehillah_aid_highlighted_reason:0 "An [kehillah_mutual_aid_appeal|E] our community should answer"
