l_english:
 kehillah_send_aid_interaction:0 "Send Aid"
 kehillah_send_aid_interaction_desc:0 "Send this community's share toward [recipient.GetTitledFirstName]'s need. Kol Yisrael arevim zeh bazeh: all Israel are responsible for one another."
 kehillah_redeem_captive_interaction:0 "Redeem Captive"
 kehillah_redeem_captive_interaction_desc:0 "Pay what remains of [recipient.GetTitledFirstName]'s ransom. There is no greater mitzvah than pidyon shvuyim, the redemption of captives."

 kehillah_giving_renowned_modifier:0 "Renowned for Giving"
 kehillah_giving_renowned_modifier_desc:0 "This leader's community answers every call: captives redeemed, refugees housed, the poor of other towns fed. Jews far away speak of it."
 kehillah_giving_generous_modifier:0 "Generous Community"
 kehillah_giving_generous_modifier_desc:0 "This leader's community is known to answer when other communities are in need."
 kehillah_giving_stingy_modifier:0 "Tight-Fisted Community"
 kehillah_giving_stingy_modifier_desc:0 "This leader's community has turned away from the needs of others, and other communities have noticed."
 kehillah_giving_disgraced_modifier:0 "Community Without Charity"
 kehillah_giving_disgraced_modifier_desc:0 "This leader's community has ignored captives and the needy again and again. Its name is spoken with contempt."

 kehillah_giving_rep_up_tt:0 "Your community's name for giving rises."
 kehillah_giving_rep_down_tt:0 "Your community's name for giving falls."
 kehillah_aid_refugees_appeal_tt:0 "The communities nearby are asked to help house the refugees."

 kehillah_aid_open_ransom_t:0 "A Captive to Redeem"
 kehillah_aid_open_ransom_d:0 "[kehillah_aid_need.GetTitledFirstName] is held captive by [imprisoner.GetTitledFirstName]. The ransom is [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] gold, and your community is among those expected to help. Right-click [kehillah_aid_need.GetHerHim] to Send Aid or Redeem Captive."
 kehillah_aid_open_relief_t:0 "A Community in Need"
 kehillah_aid_open_relief_d:0 "[kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has fallen on hard times and asks its neighbours for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] gold. Your community is among those expected to help. Right-click [kehillah_aid_need.GetHerHim] to Send Aid."
 kehillah_aid_open_refugees_t:0 "Refugees to House"
 kehillah_aid_open_refugees_d:0 "[kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has taken in refugees and asks its neighbours for [kehillah_aid_need.MakeScope.Var('kehillah_aid_size').GetValue|0] gold to house them. Your community is among those expected to help. Right-click [kehillah_aid_need.GetHerHim] to Send Aid."
 kehillah_aid_done_ransom_t:0 "A Captive Redeemed"
 kehillah_aid_done_ransom_d:0 "The ransom is paid in full and [kehillah_aid_need.GetTitledFirstName] is free. Your community's gift was part of it."
 kehillah_aid_done_relief_t:0 "The Appeal Is Answered"
 kehillah_aid_done_relief_d:0 "[kehillah_aid_need.GetPrimaryTitle.GetNameNoTooltip] has what it asked for. Your community's gift was part of it."
 kehillah_aid_refused_t:0 "An Appeal Went Unanswered"
 kehillah_aid_refused_d:0 "Your community was asked to help [kehillah_aid_need.GetTitledFirstName] and sent nothing. The other communities remember."

 kehillah_mutual_aid.0001.t:0 "An Emissary from the Land of Israel"
 kehillah_mutual_aid.0001.desc:0 "A shadar has come from the Land of Israel, carrying letters from the communities there. They are poor, he says, and few, and they pray for the communities of the diaspora. He asks what this community can give."
 kehillah_mutual_aid.0001.a:0 "Give generously."
 kehillah_mutual_aid.0001.b:0 "Give what we can spare."
 kehillah_mutual_aid.0001.c:0 "We have nothing to give this year."
