l_english:
 kehillah_bet_din.0971.t:0 "The Judge Who Heard One Side"
 kehillah_bet_din.0971.desc:0 "[kbd_litigant_a.GetFirstName] visited a judge before the hearing and described a disputed sale. [kbd_litigant_b.GetFirstName] now fears the judge has already advised the seller. The judge says the meeting was brief. The court must decide whether the coming hearing can still be trusted."
 kehillah_bet_din.0971.a:0 "Keep the judge and proceed today."
 kehillah_bet_din.0971.a.tt:0 "A private consultation may already have shaped the bench."
 kehillah_bet_din.0971.b:0 "Ask what was said and seat a replacement if needed."
 kehillah_bet_din.0971.b.tt:0 "Inquiry preserves a hearing while protecting its appearance of fairness."
 kehillah_bet_din.0971.c:0 "Dismiss the sale claim as tainted."
 kehillah_bet_din.0971.c.tt:0 "The claimant may lose a valid claim for a judge's mistake."
 kehillah_din_source_97:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_97_tt:0 "Mishnah Pirkei Avot 1:8 gives the judges a textual point of reference. It cannot establish the substance of the private meeting."
 kehillah_din_combo_97:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_97_tt:0 "The judges preserve both parties' interests while checking the substance of the private meeting."
 kehillah_bet_din.0974.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0974.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0974.outcome_1:0 "The original judge hears the sale dispute."
 kehillah_bet_din.0974.outcome_2:0 "The court records the meeting and appoints an uninvolved judge if advice was given."
 kehillah_bet_din.0974.outcome_3:0 "The claim is dismissed before evidence is heard."
 kehillah_bet_din.0974.fact_true:0 "The judge gave detailed advice about winning the case. Keeping that judge compromised the hearing."
 kehillah_bet_din.0974.fact_false:0 "The meeting concerned only scheduling. Dismissal punished the claimant without cause."
 kehillah_bet_din.0974.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0974.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0974.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case97_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case97_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case97_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case97_great_log_title:0 "The Judge Who Heard One Side: a well-supported ruling"
 kehillah_bet_din_case97_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the judge who heard one side dispute."
 kehillah_bet_din_case97_good_log_title:0 "The Judge Who Heard One Side: a workable ruling"
 kehillah_bet_din_case97_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the judge who heard one side dispute."
