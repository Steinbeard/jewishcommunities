l_english:

 # Expulsion (ROADMAP S9b) and the AI policy review (V17 Slice B).
 # docs/spec/v30-expulsion-and-householders.md

 kehillah_policy_lower_to_banned_tt:0 "Jewish Settlement Policy becomes #N Settlement Banned#!: every Jewish community in the realm is ordered to leave within a year. Their leaders may plead or offer a ransom. Those who go leave much of their wealth behind, and every debt owed to them is void."
 kehillah_policy_lifts_expulsion_tt:0 "Every edict of expulsion in the realm is withdrawn."

 kehillah_policy_reason_debts:0 "\n\n#weak The ruler's debts to Jewish lenders weighed in the decision.#!"
 kehillah_policy_reason_zeal:0 "\n\n#weak The ruler's religious zeal weighed in the decision.#!"
 kehillah_policy_reason_grievance:0 "\n\n#weak The ruler's grievance against a Jewish community's leader weighed in the decision.#!"
 kehillah_policy_reason_clergy:0 "\n\n#weak The court chaplain's zeal weighed in the decision.#!"
 kehillah_policy_reason_temper:0 "\n\n#weak The ruler's temper weighed in the decision.#!"
 kehillah_policy_reason_revenue:0 "\n\n#weak A prosperous Jewish community's value to the realm weighed in the decision.#!"
 kehillah_policy_reason_patron:0 "\n\n#weak The ruler's regard for a Jewish community's leader weighed in the decision.#!"
 kehillah_policy_reason_justice:0 "\n\n#weak The ruler's sense of justice weighed in the decision.#!"
 kehillah_policy_reason_petition:0 "\n\n#weak A Shtadlan's patient petitions brought this about.#!"
 kehillah_policy_reason_plea:0 "\n\n#weak The ruler granted a community's plea.#!"
 kehillah_policy_reason_decree:0 "\n\n#weak The ruler decreed it personally.#!"

 kehillah_expulsion_time_year:0 "a year"
 kehillah_expulsion_time_nine_months:0 "nine months"
 kehillah_expulsion_time_six_months:0 "six months"
 kehillah_expulsion_time_months:0 "only a few months"

 kehillah_expelled_us_opinion:0 "Expelled Us"
 kehillah_ransom_betrayed_opinion:0 "Took Our Ransom"

 kehillah_expulsion_done_msg_title:0 "The Jews Have Left"
 kehillah_expulsion_done_msg_desc:0 "[kehillah_exp_left_title.GetNameNoTooltip] has left your realm. What the community could not carry, and every debt owed to it, now belongs to the crown."

 # --- The edict ---
 kehillah_expulsion.0001.t:0 "The Edict of Expulsion"
 kehillah_expulsion.0001.desc:0 "A herald read it in the market and then nailed it to the synagogue door. [kehillah_exp_host.GetTitledFirstName] has banned Jewish settlement in [kehillah_exp_host.GetPrimaryTitle.GetNameNoTooltip]. The Jews of [kehillah_exp_title.GetNameNoTooltip] must leave within [ROOT.Char.Custom('KehillahExpulsionTimeLeft')].[kehillah_exp_host.GetPrimaryTitle.Custom('KehillahPolicyReason')]\n\nThe elders have gathered in the synagogue. Some want to send the Shtadlan to the court at once. Others want to sell what can be sold while there are still buyers."
 kehillah_expulsion.0001.a:0 "Send the Shtadlan to plead with [kehillah_exp_host.GetFirstName]."
 kehillah_expulsion.0001.a.tt:0 "Your Shtadlan pleads for the edict's repeal. The ruler's answer depends on your Shtadlan's diplomacy, on what the ruler thinks of you, and on the ruler's character. You can plead only once."
 kehillah_expulsion.0001.b:0 "Offer a ransom for the edict's repeal."
 kehillah_expulsion.0001.b.tt:0 "You offer #V [kehillah_exp_ransom_offer|0]#! gold. A greedy ruler is likelier to accept, and a deceitful one may take the gold and keep the edict. You can offer a ransom only once."
 kehillah_expulsion.0001.c:0 "Leave now, in good order."
 kehillah_expulsion.0001.c.tt:0 "The community ends and you take to the road with your household and followers. The crown seizes only a small share of your wealth, along with any debts owed to the community. You can found a new community where Jews may settle."
 kehillah_expulsion.0001.d:0 "We will wait, and see what the year brings."
 kehillah_expulsion.0001.d.tt:0 "Nothing changes yet. While the edict stands, you can still plead, pay or leave through the community's decisions."

 kehillah_answer_edict_decision:0 "Answer the Edict"
 kehillah_answer_edict_decision_desc:0 "The edict of expulsion still stands. There may yet be a way to have it repealed."
 kehillah_answer_edict_decision_tooltip:0 "Plead with the ruler, or offer a ransom for the edict's repeal."
 kehillah_answer_edict_decision_confirm:0 "Consider it"
 kehillah_answer_edict_exhausted_tt:0 "The community has already pleaded and offered a ransom"

 kehillah_leave_in_good_order_decision:0 "Leave in Good Order"
 kehillah_leave_in_good_order_decision_desc:0 "Sell what can be sold, collect what is owed, and go before the edict is enforced."
 kehillah_leave_in_good_order_decision_tooltip:0 "Leave the realm now, before the edict is enforced."
 kehillah_leave_in_good_order_decision_confirm:0 "We leave"
 kehillah_leave_in_good_order_decision_effect_tt:0 "The community ends and you take to the road with your household and followers. The crown seizes only a small share of your wealth, along with any debts owed to the community. You can found a new community where Jews may settle."

 # --- The host hears the plea ---
 kehillah_expulsion.0002.t:0 "A Plea from the Jews"
 kehillah_expulsion.0002.desc_plea:0 "[kehillah_exp_shtadlan.GetTitledFirstName] has come on behalf of [kehillah_exp_title.GetNameNoTooltip]. They have lived under your protection for generations, the Shtadlan says. They have paid every tax and lent to the crown in its need. He asks you to repeal the edict."
 kehillah_expulsion.0002.desc_ransom:0 "[kehillah_exp_leader.GetTitledFirstName] of [kehillah_exp_title.GetNameNoTooltip] sends a chest and a letter. The community offers #V [kehillah_exp_ransom|0]#! gold if the edict is withdrawn."
 kehillah_expulsion.0002.a:0 "Repeal the edict."
 kehillah_expulsion.0002.a.tt:0 "Jewish Settlement Policy returns to #N Settlement Discouraged#!, and every edict of expulsion in the realm is withdrawn. Any ransom offered is paid."
 kehillah_expulsion.0002.b:0 "The edict stands."
 kehillah_expulsion.0002.b.tt:0 "The Jews must still leave."
 kehillah_expulsion.0002.c:0 "Keep the gold, and let the edict stand."
 kehillah_expulsion.0002.c.tt:0 "You take the ransom. The Jews must still leave."

 kehillah_expulsion.0003.t:0 "The Plea Is Refused"
 kehillah_expulsion.0003.desc:0 "[kehillah_exp_host.GetTitledFirstName] heard us out and would not change the edict. The Jews of [kehillah_exp_title.GetNameNoTooltip] must still leave."
 kehillah_expulsion.0003.a:0 "Then we must prepare."

 kehillah_expulsion.0004.t:0 "Gold for Nothing"
 kehillah_expulsion.0004.desc:0 "[kehillah_exp_host.GetTitledFirstName] accepted the ransom, thanked our messenger, and sent him home. The edict has not been withdrawn."
 kehillah_expulsion.0004.a:0 "We will not forget this."

 kehillah_expulsion.0005.t:0 "The Edict Is Withdrawn"
 kehillah_expulsion.0005.desc:0 "The edict of expulsion no longer applies to [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. The houses that were for sale are taken off the market, and the community gathers in the synagogue to give thanks."
 kehillah_expulsion.0005.a:0 "Blessed is He who sets the captives free."

 # --- Enforcement ---
 kehillah_expulsion.0010.t:0 "The Year Is Up"
 kehillah_expulsion.0010.desc:0 "The edict's year has passed. Soldiers stand at the gate of the quarter, and the officials who inventoried our houses are back with carts. [kehillah_exp_host.GetTitledFirstName] means to be obeyed."
 kehillah_expulsion.0010.a:0 "Load the carts. We go."
 kehillah_expulsion.0010.a.tt:0 "The community ends and you take to the road with your household and followers. The crown seizes half of your wealth and every debt owed to the community. You can found a new community where Jews may settle."
 kehillah_expulsion.0010.b:0 "We stay, and keep out of sight."
 kehillah_expulsion.0010.b.tt:0 "The community stays in hiding, outside the law. Stability falls sharply now and keeps falling while you remain. Within a year you will be found and driven out, losing nearly everything, unless the edict is withdrawn first."

 kehillah_expulsion.0011.t:0 "Driven Out"
 kehillah_expulsion.0011.desc:0 "We were found out. The quarter has been emptied house by house, and what could not be hidden has been taken. The community has been driven to the border with whatever its members could carry."
 kehillah_expulsion.0011.a:0 "May the next place be kinder."
 kehillah_expulsion.0011.a.tt:0 "The community ends and you take to the road with your household and followers. The crown seizes nearly all of your wealth and every debt owed to the community."
 kehillah_bd_expulsion_defiance:0 "\n  Living in hiding from the edict: #N [ROOT.Char.MakeScope.ScriptValue('kehillah_bd_expulsion_defiance_value')|0]#!"
