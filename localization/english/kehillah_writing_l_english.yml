l_english:
 kehillah_writing_no_active_project_tt:0 "No writing project is already underway"
 kehillah_writing_ready_again_tt:0 "Enough time has passed since your last writing project"
 kehillah_writing:0 "Writing a Sefer"
 kehillah_writing_action:0 "Write a Sefer"
 kehillah_writing_desc_general:0 "Researching and composing a Sefer."
 kehillah_writing_scheme_desc:0 "A manuscript grows through research, objections and revision. The displayed date marks the next writing phase; several phases remain before the book is finished. Completion chance reflects your Learning, draft quality and study partner."
 kehillah_writing_scheme_success_desc:0 "The manuscript faces its final test. Exceptional works may become landmarks in the Sefarim Ledger."
 kehillah_writing_scheme_chance_desc:0 "Learning, draft quality and a study partner"
 kehillah_writing.0001.t:0 "What Should I Write?"
 kehillah_writing.0001.desc:0 "My learning has left me with ideas that could become books. The one I take up will shape both the questions I face and the readers I may reach."
 kehillah_writing.0001.parsh:0 "Parshanut: Scripture and its meanings. #weak Aptitude [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_parshanut_aptitude_value')|0]#!"
 kehillah_writing.0001.talmud:0 "Talmudics: argument, law and custom. #weak Aptitude [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_talmudics_aptitude_value')|0]#!"
 kehillah_writing.0001.thought:0 "Machshavah: belief, wisdom and devotion. #weak Aptitude [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_machshava_aptitude_value')|0]#!"
 kehillah_writing.close:0 "Put down the pen for now."
 kehillah_writing.back:0 "Consider another subject."
 kehillah_writing.landmark_open:0 "#P Landmark possibility:#! a unique work in this form is still unwritten. Reaching it requires exceptional quality and its own scholarly conditions."
 kehillah_writing.landmark_ready:0 "#P Landmark path ready:#! you meet the scholarly conditions for an unfilled historical niche in this form. Exceptional quality and a separate roll are still needed."
 kehillah_writing.landmark_none:0 "#weak No fixed historical landmark is catalogued for this form; a successful book remains an original manuscript.#!"
 kehillah_writing.landmark_filled:0 "#N Landmark niche filled:#! this project can still become an original work of high quality."
 kehillah_writing.rashi_torah_ready:0 "#P Landmark path open:#! your learning qualifies you for the role of the Torah's defining plain-sense commentary. Finish with exceptional quality to have a chance at it."
 kehillah_writing.rashi_torah_unready:0 "#weak Landmark path ahead:#! a defining Torah commentary calls for at least six mastered Parshanut works, two full Tanakh readings and 65 Parshanut Rabbi experience, as well as the rite and study conditions of the historical ambition. Rashi may satisfy some of those latter conditions more readily."
 kehillah_writing.rashi_talmud_ready:0 "#P Landmark path open:#! your learning qualifies you for the role of a defining Talmud commentary. Finish with exceptional quality to have a chance at it."
 kehillah_writing.rashi_talmud_unready:0 "#weak Landmark path ahead:#! a defining Talmud commentary calls for four mastered Bavli orders and the rite and study conditions of its historical ambition. Rashi may satisfy some of those latter conditions more readily."
 kehillah_writing.0002.t:0 "A Work of Parshanut"
 kehillah_writing.0002.desc:0 "Scripture can be read closely, retold through midrash, set to verse, or studied word by word."
 kehillah_writing.0003.t:0 "A Work of Talmudics"
 kehillah_writing.0003.desc:0 "The argument of the sages may call for a gloss, a practical ruling, answers sent to other communities, or a record of lived custom."
 kehillah_writing.0004.t:0 "A Work of Machshavah"
 kehillah_writing.0004.desc.early:0 "Scripture, the Mishnah and older visions offer questions enough for a book. I could set teachers in debate, defend our tradition, or write about how a person ought to live. The later philosophical schools have not yet supplied their arguments."
 kehillah_writing.0004.desc:0 "Saadia's arguments have given scholars a new language for belief. I could build a systematic dialogue on such learning, or continue older ways of debate, ethics, vision and translation."
 kehillah_writing.0004.desc.late:0 "Books of philosophy and inward devotion now sit beside older Scripture and tradition. I could answer their questions, or take up an earlier form in a new voice."
 kehillah_writing.torah:0 "Write a running commentary on the Torah."
 kehillah_writing.torah.gate:0 "Master the Torah and know its liturgical language."
 kehillah_writing.torah.tt:0 "Reading widely in Parshanut, completing rounds of Tanakh and gaining Rabbi experience may open a landmark commentary. If its niche is filled, a fine original commentary is still possible."
 kehillah_writing.midrash:0 "Expand and explain a midrash on the Torah."
 kehillah_writing.midrash.gate:0 "Master the Torah and Genesis Rabbah, and know Scripture's liturgical language."
 kehillah_writing.midrash.tt:0 "Close study of midrash and Scripture strengthens this work."
 kehillah_writing.poetry:0 "Compose a cycle of sacred poems."
 kehillah_writing.poetry.gate:0 "Be a Poet, master a Tanakh division and know its liturgical language."
 kehillah_writing.poetry.tt:0 "Diplomacy, Parshanut study and poetic experience shape the verses."
 kehillah_writing.grammar:0 "Write a grammar of Scripture's language."
 kehillah_writing.grammar.gate:0 "Master the Torah and know its language; study a Targum or know Arabic for comparison."
 kehillah_writing.grammar.tt:0 "A close account of words, usage and translation can serve later readers."
 kehillah_writing.chronicle:0 "Record our people's history and communal charters."
 kehillah_writing.chronicle.gate:0 "Master a Tanakh division, know Scripture's language and have at least 12 Learning."
 kehillah_writing.chronicle.tt:0 "A chronicle can preserve a diaspora story or a community's founding documents."
 kehillah_writing.talmud:0 "Write a commentary on a Talmud order."
 kehillah_writing.talmud.gate:0 "Belong to a Rabbanite rite, master a Bavli order and know Aramaic."
 kehillah_writing.talmud.tt:0 "Each mastered order and completed Bavli round improves aptitude. An unfilled landmark commentary needs exceptional quality and deeper mastery."
 kehillah_writing.yerushalmi:0 "Write on an order of the Yerushalmi."
 kehillah_writing.yerushalmi.gate:0 "Master a Yerushalmi order and know Aramaic."
 kehillah_writing.yerushalmi.tt:0 "A commentary on a less widely held work may begin with a smaller audience, but readers of the commentary may return to its source. No unique landmark niche is reserved for it."
 kehillah_writing.law:0 "Distill the law into a halakhic treatise."
 kehillah_writing.law.gate:0 "Belong to a Rabbanite rite and master a Bavli order."
 kehillah_writing.law.tt:0 "Bet Din experience can strengthen a practical legal work; a comprehensive code requires far broader study."
 kehillah_writing.responsa:0 "Gather answers to difficult questions."
 kehillah_writing.responsa.gate:0 "Master a Bavli order and remember a good Bet Din ruling."
 kehillah_writing.responsa.tt:0 "Judged cases give this collection its voice. Readers in other communities may send objections."
 kehillah_writing.minhag:0 "Record the customs of our community."
 kehillah_writing.minhag.gate:0 "Master the Mishnah or Orit, and know your tradition's scriptural language."
 kehillah_writing.minhag.tt:0 "A record of lived practice can give your rite a voice of its own."
 kehillah_writing.siddur:0 "Compile an order of prayer."
 kehillah_writing.siddur.gate:0 "Belong to a Rabbanite rite, master the Mishnah and know Hebrew."
 kehillah_writing.siddur.tt:0 "A prayer book gathers liturgy and its practical rules for distant communities."
 kehillah_writing.tradition_history:0 "Trace the chain of the sages."
 kehillah_writing.tradition_history.gate:0 "Belong to a Rabbanite rite and master the Mishnah and a Bavli order."
 kehillah_writing.tradition_history.tt:0 "A letter or history may explain how the Oral Torah came down to its readers."
 kehillah_writing.scriptural_law:0 "Set down the commandments from Scripture."
 kehillah_writing.scriptural_law.gate:0 "Belong to a Karaite rite and master the Torah and Anan's Sefer ha-Mitzvot."
 kehillah_writing.scriptural_law.tt:0 "An interpretation of Scripture can become a practical legal guide for a Karaite community."
 kehillah_writing.dialogue:0 "Stage a dialogue on Scripture, law and revelation."
 kehillah_writing.dialogue.gate:0 "Master the Torah and the Mishnah, Philo's Allegorical Treatises or Memar Marqah, and know Scripture's language."
 kehillah_writing.dialogue.tt:0 "An older form of argument available in any period. It may become an original work, but cannot fill the later philosophical dialogue niches."
 kehillah_writing.systematic_dialogue:0 "Stage a dialogue about faith and reason."
 kehillah_writing.systematic_dialogue.gate:0 "This path opens in 933 or later. Master Emunot ve-Deot or Chovot ha-Levavot, and know Hebrew or Arabic."
 kehillah_writing.systematic_dialogue.tt:0 "A systematic exchange drawing on later philosophical books. An exceptional work may fill the Kuzari or Moreh Nevukhim niche."
 kehillah_writing.mystical:0 "Write of the hidden structure of creation."
 kehillah_writing.mystical.gate:0 "Master Sefer Yetzirah and know Scripture's liturgical language."
 kehillah_writing.mystical.tt:0 "Esotericism and other hidden books strengthen the argument, but may complicate its reception."
 kehillah_writing.disputation:0 "Defend the truth of my tradition."
 kehillah_writing.disputation.gate:0 "Master a Tanakh division and the Mishnah, Philo, Memar Marqah or a later work of thought; know Scripture's language."
 kehillah_writing.disputation.tt:0 "The defence will reflect your rite's claims about law, revelation and sacred places."
 kehillah_writing.translation:0 "Translate and gloss a work of natural philosophy."
 kehillah_writing.translation.gate:0 "Know Hebrew and Greek or Arabic, and master the Theology of Aristotle or Galen."
 kehillah_writing.translation.tt:0 "The source's language and the clarity of your explanation will matter as much as your argument."
 kehillah_writing.devotion:0 "Write about the duties of the heart."
 kehillah_writing.ethics:0 "Write an exhortation on righteous conduct."
 kehillah_writing.ethics.gate:0 "Master a Tanakh division and the Mishnah, Philo or Memar Marqah; know Scripture's language."
 kehillah_writing.ethics.tt:0 "An older ethical form, open before the later books of inward devotion appear."
 kehillah_writing.devotion.gate:0 "This path opens in 1080 or later. Master Chovot ha-Levavot and know Scripture's language."
 kehillah_writing.devotion.tt:0 "Ethical study, piety and a lived example give this work its force."
 kehillah_writing.0011.t:0 "The First Page"
 kehillah_writing.0011.desc:0 "The project has begun. Its first questions fill the margins faster than I can answer them. The months ahead will test whether I can make this a book others can read."
 kehillah_writing.0011.a:0 "Back to the desk."
 kehillah_writing.0100.t:0 "The Evidence Before Me"
 kehillah_writing.0100.desc:0 "The first pages reveal gaps in my sources. I can read more carefully, ask a learned companion to work beside me, or press ahead with the argument as it stands. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0100.a:0 "Return to the texts and test every citation."
 kehillah_writing.0100.a.tt:0 "Careful study improves the draft."
 kehillah_writing.0100.b:0 "Ask [kehillah_writing_candidate.GetFirstName] to study beside me."
 kehillah_writing.0100.b.tt:0 "A chavrusa improves the draft and the chance to finish."
 kehillah_writing.0100.c:0 "Trust the argument and write boldly."
 kehillah_writing.0100.c.success:0 "A daring connection gives the work new force."
 kehillah_writing.0100.c.failure:0 "The argument runs ahead of the evidence."
 kehillah_writing.0200.t:0 "Objections in the Margins"
 kehillah_writing.0200.desc:0 "A reader has found a hard question. I must answer it before the manuscript can stand. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0200.desc.talmud:0 "A line in the sugya resists my reading, and a fellow scholar has marked it sharply. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0200.desc.responsa:0 "A letter from another community presses me on a ruling I thought settled. Their question deserves a full answer. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0200.desc.poetry:0 "The words scan, yet the verse says less than I hoped. A friend has pointed to the hollow line. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0200.desc.dialogue:0 "One of my imagined disputants has found a verse that the other cannot answer so easily. The conversation needs a more honest reply. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0200.desc.systematic:0 "The pupil asks whether my account of reason can stand beside the received tradition. I must show where the arguments truly meet. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0200.desc.ethics:0 "A neighbor who lives the virtue I praise has pointed out where my counsel asks too little of me. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0200.desc.devotion:0 "The chapter speaks of inward duty, yet its words sound too easy beside a life of obligation. I must sharpen it. #weak Current quality [ROOT.Char.MakeScope.ScriptValue('kehillah_writing_quality_outlook_value')|0]#!"
 kehillah_writing.0200.a:0 "Defend the passage with what I know."
 kehillah_writing.0200.a.success:0 "Your Learning resolves the objection and strengthens the draft."
 kehillah_writing.0200.a.failure:0 "The answer does not hold; the argument weakens."
 kehillah_writing.0200.b:0 "Narrow the claim and write only what I can support."
 kehillah_writing.0200.b.tt:0 "A modest revision makes the book sounder."
 kehillah_writing.0200.c:0 "Take another season to rebuild the chapter."
 kehillah_writing.0200.c.tt:0 "The revision improves the draft but adds another phase and Stress."
 kehillah_writing.0250.t:0 "The Long Revision"
 kehillah_writing.0250.desc:0 "The season I gave this chapter has become a year. At last I can see the book's argument end to end."
 kehillah_writing.0250.a:0 "Make one final careful pass."
 kehillah_writing.0250.b:0 "The draft must stand as it is."
 kehillah_writing.0300.t:0 "The Manuscript's Fate"
 kehillah_writing.0301.t:0 "A Work for Generations"
 kehillah_writing.0300.desc.failure:0 "The pages do not yet make a book. I have learned from them, and can return to the question another day."
 kehillah_writing.0300.desc.success:0 "The manuscript of #italic [ROOT.Char.Custom('KehillahWritingOrdinaryTitle')]#! is finished. Word of it may travel to nearby communities, though only time and readers can decide whether it will be remembered."
 kehillah_writing.0300.desc.landmark:0 "The final copy of #italic [ROOT.Char.Custom('KehillahSeferLatestWorkName')]#! rests in the library. I have written a work that may become a landmark of our learning. Its original manuscript is a treasure; its true standing will still be earned among readers."
 kehillah_writing.0300.a:0 "Let others read what I have written."
