 kehillah_spark.0001.t:0 "What Shall I Write?"
 kehillah_spark.0001.desc:0 "My studies have left me with ideas that could become books. Which shall I take up?"
 kehillah_spark.0002.t:0 "A Competing Idea"
 kehillah_spark.0002.desc:0 "While studying [ROOT.Char.Custom('KehillahSparkPendingSource')], an idea came to me for [ROOT.Char.Custom('KehillahSparkPendingForm')].\n\nBut my thoughts on this subject already belong to [ROOT.Char.Custom('KehillahSparkPendingHeld')]. I cannot pursue both."
 kehillah_spark.0002.keep:0 "Stay with the idea I have."
 kehillah_spark.0002.take:0 "Pursue the new idea."
 kehillah_spark.0002.take.tt:0 "The new idea begins as an #high Insight#!; the old one is set aside."
