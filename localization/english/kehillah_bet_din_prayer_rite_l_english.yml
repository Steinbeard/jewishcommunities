l_english:
 kehillah_bet_din.0211.t:0 "The Scholar Who Changed the Prayer Rite"
 kehillah_bet_din.0211.desc:0 "[kbd_litigant_a.GetFirstName], a visiting scholar, proposes a new reading for the congregation's prayers. [kbd_litigant_b.GetFirstName] speaks for the regular readers, who fear losing the words they know. Some households welcome the change; others have not been heard. The court must choose how the community will pray together next month."
 kehillah_bet_din.0211.a:0 "Fund new books and adopt the reading at once."
 kehillah_bet_din.0211.a.tt:0 "The scholar's reading takes hold quickly, but a divided congregation may stop attending. New books are costly."
 kehillah_bet_din.0211.b:0 "Hold trial services and ask each household to be heard."
 kehillah_bet_din.0211.b.tt:0 "The congregation can test the reading before choosing. Both sides share the work of teaching and listening."
 kehillah_bet_din.0211.c:0 "Keep the inherited reading and end the dispute."
 kehillah_bet_din.0211.c.tt:0 "Regular readers keep their practice, but a broadly welcomed change may be lost without a fair hearing."
 kehillah_din_source_21:0 "Cite a mastered Zeraim work and hold a trial reading."
 kehillah_din_source_21_tt:0 "A Zeraim work on prayer can inform the discussion. It does not reveal whether this congregation accepts the proposed reading."
 kehillah_din_combo_21:0 "Have a scholar and steward plan trial services together."
 kehillah_din_combo_21_tt:0 "The judges arrange teaching, listen to households, and keep regular services available."
 kehillah_bet_din.0214.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0214.desc:0 "[kbd_litigant_a.GetFirstName], a visiting scholar, proposes a new reading for the congregation's prayers. [kbd_litigant_b.GetFirstName] speaks for the regular readers, who fear losing the words they know. Some households welcome the change; others have not been heard. The court must choose how the community will pray together next month."
 kehillah_bet_din.0214.outcome_1:0 "The court adopts the scholar's reading and pays for new books. The regular readers must learn it before the next service."
 kehillah_bet_din.0214.outcome_2:0 "The court arranges trial services, records household views, and postpones a permanent change until the congregation has heard both readings."
 kehillah_bet_din.0214.outcome_3:0 "The court keeps the inherited reading. The scholar's supporters are told to let the matter rest."
 kehillah_bet_din.0214.fact_true:0 "The household count shows strong opposition. A sudden change would have split regular worshippers."
 kehillah_bet_din.0214.fact_false:0 "Most households were willing to learn the new reading. Ending the discussion closed a door the community wanted open."
 kehillah_bet_din.0214.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0214.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0214.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case21_one_tt:0 "Books and teaching cost the community substantial Prosperity."
 kehillah_din_case21_two_tt:0 "Trial services and instruction cost some Prosperity."
 kehillah_din_case21_three_tt:0 "Keeping the old reading costs little, but may leave a dispute unresolved."
 kehillah_bet_din_case21_great_log_title:0 "The Scholar Who Changed the Prayer Rite: a well-supported ruling"
 kehillah_bet_din_case21_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s proposed prayer reading."
 kehillah_bet_din_case21_good_log_title:0 "The Scholar Who Changed the Prayer Rite: a workable ruling"
 kehillah_bet_din_case21_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s proposed prayer reading."
 kehillah_bet_din_case21_poor_log_title:0 "The Scholar Who Changed the Prayer Rite: a disputed ruling"
 kehillah_bet_din_case21_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s proposed prayer reading."
