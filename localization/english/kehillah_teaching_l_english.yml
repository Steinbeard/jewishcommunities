l_english:
 kehillah_teaching_on_jews_name:0 "Teaching on the Jews"
 kehillah_teaching_witness_name:0 "Jews: Witness"
 kehillah_teaching_witness_desc:0 "Jews are to be preserved, subordinate, as witnesses to Scripture: not killed, not baptized by force. Zeal under this teaching protects them as much as it presses them. The Status of the Jews in a realm can fall no lower than #V Restricted#! through ordinary review."
 kehillah_teaching_separation_mission_name:0 "Jews: Separation and Mission"
 kehillah_teaching_separation_mission_desc:0 "Jews are tolerated, but marked out, kept from authority over believers, and pressed to convert by preaching and disputation. Zeal weighs more heavily, and a realm may come to ban Jewish settlement, but forced conversion is still forbidden."
 kehillah_teaching_exclusion_name:0 "Jews: Exclusion"
 kehillah_teaching_exclusion_desc:0 "The Jews of today are not the people Scripture told us to preserve, and a Christian realm should be wholly Christian. Zeal weighs most heavily, banning Jewish settlement comes easily, and a ruler may force a Jew to convert."
 kehillah_teaching_imperial_law_name:0 "Jews: Imperial Law"
 kehillah_teaching_imperial_law_desc:0 "Jews are a lawful community under the law of the realm: their own courts in civil matters, no new synagogues, no office or arms. Protection comes from the law rather than the clergy. The Status of the Jews in a realm can fall no lower than #V Restricted#! through ordinary review."
 kehillah_teaching_dhimma_name:0 "Jews: Dhimma"
 kehillah_teaching_dhimma_desc:0 "Under the Pact of Umar, Jews are a protected people who pay the jizya and keep their faith, under restrictions applied with more or less care. The Status of the Jews in a realm can fall no lower than #V Restricted#! through ordinary review."
 kehillah_teaching_strict_pact_name:0 "Jews: Strict Pact"
 kehillah_teaching_strict_pact_desc:0 "The Pact's restrictions are enforced in earnest: dress, buildings, offices. Zeal weighs more heavily and a ruler may force a Jew to convert, though the review still stops at #V Restricted#!."
 kehillah_teaching_abolition_name:0 "Jews: Abolition"
 kehillah_teaching_abolition_desc:0 "Protected status is abolished: convert or leave. Zeal weighs most heavily, banning Jewish settlement comes easily, and a ruler may force a Jew to convert."
