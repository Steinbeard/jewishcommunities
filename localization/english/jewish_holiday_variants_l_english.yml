l_english:
# Non-Rabbinic variants: no borrowed seder, Purim obligations, roof rules or all-night vigil.
 jewish_holidays.0201.t:0 "A Lamp at the Gathering"
 jewish_holidays.0201.desc:0 "The holy season of the seventh month has brought the household together. A lamp gutters in a draught, then burns steadily again.\n\nFor a moment conversation stops. What will this season bring?"
 jewish_holidays.0201.a:0 "A good year, then."
 jewish_holidays.0201.a.tt:0 "You take the steady flame as a hopeful sign for the year ahead."
 jewish_holidays.0201.b:0 "Best to be careful this year."
 jewish_holidays.0201.b.tt:0 "You find yourself worrying about what the coming year might bring."
 jewish_holidays.0201.c:0 "It was only a draught."
 jewish_holidays.0201.c.tt:0 "\"You shall not practise divination,\" says the Torah. You return to the gathering without giving it further thought."
 jewish_holidays.0202.t:0 "A Season of Reckoning"
 jewish_holidays.0202.desc:0 "The observance of the seventh month has turned your thoughts to neglected promises and moments of anger. Your household is making its preparations, but there is another task you could begin.\n\nThere is still time to make amends."
 jewish_holidays.0202.a:0 "I will acknowledge my faults and make amends."
 jewish_holidays.0202.a.tt:0 "You reflect on your conduct and resolve to do better."
 jewish_holidays.0202.b:0 "Make a public pledge of charity."
 jewish_holidays.0202.b.tt:0 "You pledge money for those in need before the assembled household."
 jewish_holidays.0202.c:0 "I am not ready to face this."
 jewish_holidays.0202.c.tt:0 "You put the matter aside."
 jewish_holidays.0203.t:0 "Tell Them of the Exodus"
 jewish_holidays.0203.desc:0 "As Passover approaches, [holiday_child.GetFirstName] asks about the flight from Egypt. The story is familiar, but this time the questions come from someone hearing its meaning for the first time.\n\nThe household turns to you."
 jewish_holidays.0203.a:0 "Tell the story, and leave room for questions."
 jewish_holidays.0203.a.tt:0 "[holiday_child.GetFirstName] listens closely and asks several more questions as you explain."
 jewish_holidays.0203.b:0 "Turn it into a proper lesson."
 jewish_holidays.0203.b.tt:0 "You give a detailed account of the Exodus, taking time to explain each part of the story."
 jewish_holidays.0203.c:0 "Wave it off. The food is getting cold."
 jewish_holidays.0203.c.tt:0 "[holiday_child.GetFirstName] falls silent as you hurry through the answer and turn to the meal."
 jewish_holidays.0204.t:0 "Ready for Passover"
 jewish_holidays.0204.desc:0 "Passover is approaching, and the household is removing leaven and preparing food. A cupboard still needs cleaning; flour is scattered beneath a table.\n\nThere is work enough for everyone."
 jewish_holidays.0204.a:0 "Finish the preparations myself."
 jewish_holidays.0204.a.tt:0 "You work until everything is ready, leaving yourself little time to rest."
 jewish_holidays.0204.b:0 "Give everyone a small task."
 jewish_holidays.0204.b.tt:0 "With everyone helping, the preparations become a shared undertaking."
 jewish_holidays.0204.c:0 "Pay for help, and rest."
 jewish_holidays.0204.c.tt:0 "You pay for help with the remaining work and save your strength for the observance."
 jewish_holidays.0207.t:0 "Remembering Esther"
 jewish_holidays.0207.desc:0 "The story of Esther has brought relief and conversation to the household. A neighbor has set out food and wine, and invites you to stay.\n\nHow should you spend the evening?"
 jewish_holidays.0207.a:0 "Drink with the guests."
 jewish_holidays.0207.a.good.tt:0 "Your songs and stories keep the table laughing late into the evening."
 jewish_holidays.0207.a.bad.tt:0 "You drink too much and make a spectacle of yourself before the guests."
 jewish_holidays.0207.b:0 "Enjoy the feast, but drink sparingly."
 jewish_holidays.0207.b.tt:0 "You enjoy the food and company, and leave the feast feeling rested."
 jewish_holidays.0207.c:0 "Decline the wine."
 jewish_holidays.0207.c.tt:0 "You join the feast without drinking."
 jewish_holidays.0208.t:0 "Generosity in a Time of Joy"
 jewish_holidays.0208.desc:0 "Remembering the deliverance described in Esther, you consider sharing food with others. There is enough in the household for a gift, if you choose to send one.\n\nWho should receive it?"
 jewish_holidays.0208.a:0 "Send it to a rival, as an overture."
 jewish_holidays.0208.a.tt:0 "[holiday_gift_target.GetFirstName] accepts your gift as an offer of reconciliation."
 jewish_holidays.0208.b:0 "Send it to a dear friend."
 jewish_holidays.0208.b.tt:0 "[holiday_gift_target.GetFirstName] receives the basket with thanks."
 jewish_holidays.0208.c:0 "Send it to the community's poor."
 jewish_holidays.0208.c.tt:0 "You set aside food from the basket for neighbors who need it."
 jewish_holidays.0209.t:0 "Before the Fast"
 jewish_holidays.0209.desc:0 "[holiday_neighbor.GetFirstName] returns your greeting but not your smile. Last month you corrected an account before several others. You were right about the sum; your words were sharper than they needed to be.\n\nThe Day of Atonement is approaching. Perhaps reconciliation should begin here."
 jewish_holidays.0209.a:0 "Apologize for how I spoke."
 jewish_holidays.0209.a.tt:0 "[holiday_neighbor.GetFirstName] accepts your apology for the public rebuke."
 jewish_holidays.0209.b:0 "Explain again why the account was wrong."
 jewish_holidays.0209.b.tt:0 "The sum is settled, and everyone nearby hears that you were right. [holiday_neighbor.GetFirstName] does not look your way during the prayers."
 jewish_holidays.0209.c:0 "Leave the matter for another day."
 jewish_holidays.0209.c.tt:0 "You go to prayers without raising the account."
 jewish_holidays.0210.t:0 "At the Close of Atonement"
 jewish_holidays.0210.desc:0 "The long observance of the Day of Atonement is drawing to a close. An older worshipper settles onto a bench while others continue their prayers. You too are tired, and there is room nearby.\n\nYou can still choose how to spend this last part of the day."
 jewish_holidays.0210.a:0 "Stay with the congregation and sing."
 jewish_holidays.0210.a.tt:0 "You remain for the closing prayers and add your voice to the singing."
 jewish_holidays.0210.b:0 "Sit and gather your strength."
 jewish_holidays.0210.b.tt:0 "You rest through part of the service and return to the prayers when you can."
 jewish_holidays.0210.c:0 "Help the older worshipper take part."
 jewish_holidays.0210.c.tt:0 "You stay beside the older worshipper and help them follow the prayers."
 jewish_holidays.0211.t:0 "Preparations for the Festival"
 jewish_holidays.0211.desc:0 "The Festival of Booths has arrived, and your household is finishing its preparations according to the practice of your congregation. Someone has left an important task until the last moment.\n\nThere is still time to help, though it will cost you some rest."
 jewish_holidays.0211.a:0 "I will finish the work."
 jewish_holidays.0211.a.tt:0 "You complete the task yourself and return tired but satisfied."
 jewish_holidays.0211.b:0 "Ask the household to help."
 jewish_holidays.0211.b.tt:0 "The work is shared, leaving time to enjoy the festival together."
 jewish_holidays.0211.c:0 "It can wait a little while."
 jewish_holidays.0211.c.tt:0 "You rest before returning to the preparations."
 jewish_holidays.0212.t:0 "Room at the Table"
 jewish_holidays.0212.desc:0 "During the Festival of Booths, [holiday_guest.GetFirstName] arrives with a bowl of figs. Your household is gathering for a meal, and the seats are filling.\n\nThere is still room for one more."
 jewish_holidays.0212.a:0 "Make room beside me."
 jewish_holidays.0212.a.tt:0 "You draw [holiday_guest.GetFirstName] into the conversation over supper."
 jewish_holidays.0212.b:0 "Offer a prayer of thanksgiving together."
 jewish_holidays.0212.b.tt:0 "You and [holiday_guest.GetFirstName] give thanks before sharing the meal."
 jewish_holidays.0212.c:0 "Pass the figs around and begin the meal."
 jewish_holidays.0212.c.tt:0 "The figs are shared, and the household settles to supper."
 jewish_holidays.0213.t:0 "The Worn Pages"
 jewish_holidays.0213.desc:0 "The Festival of Weeks has brought readers together around a borrowed copy of the Torah. Its owner has agreed that others may read it before its return. The edges of one passage are worn from many hands.\n\nThere is time to consider its words."
 jewish_holidays.0213.a:0 "Read the marked passage together."
 jewish_holidays.0213.a.tt:0 "You gather a few readers around the book and discuss the passage."
 jewish_holidays.0213.b:0 "Pay a scribe to copy those leaves."
 jewish_holidays.0213.b.tt:0 "A scribe makes a copy of the worn passage for others to study."
 jewish_holidays.0213.c:0 "Return the book before it wears further."
 jewish_holidays.0213.c.tt:0 "You send the book back to its owner in good order."
 jewish_holidays.0203.samaritan_desc:0 "Passover is approaching, and [holiday_child.GetFirstName] asks about the Exodus and the offering on Mount Gerizim. Whether or not the household can make the journey, these are matters the child wishes to understand.\n\nThe questions turn to you."
