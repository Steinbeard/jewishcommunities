l_english:
 kehillah_bet_din.0491.t:0 "The Community's Traveling Envoy"
 kehillah_bet_din.0491.desc:0 "[kbd_litigant_a.GetFirstName] traveled to petition a ruler for communal protection and spent more than the elders approved. [kbd_litigant_b.GetFirstName] keeps the treasury and asks why lodging and gifts exceeded the allowance. The petition succeeded, but success alone does not show which expenses were necessary."
 kehillah_bet_din.0491.a:0 "Repay every expense claimed by the envoy."
 kehillah_bet_din.0491.a.tt:0 "The envoy is rewarded, but padded charges would empty the treasury."
 kehillah_bet_din.0491.b:0 "Advance necessities and compare receipts with the mandate."
 kehillah_bet_din.0491.b.tt:0 "The court pays essentials while checking what the mission required."
 kehillah_bet_din.0491.c:0 "Refuse reimbursement beyond the original allowance."
 kehillah_bet_din.0491.c.tt:0 "The treasury is protected, but a genuine emergency expense may go unpaid."
 kehillah_din_source_49:0 "Cite a mastered Nezikin work and examine the envoy's mandate."
 kehillah_din_source_49_tt:0 "Mishnah Bava Metzia 6:1 offers an analogy for paid service. It does not establish which journey costs were authorized."
 kehillah_din_combo_49:0 "Have a scholar and steward compare receipts with the petition."
 kehillah_din_combo_49_tt:0 "The judges reimburse needful travel without paying private expenses."
 kehillah_bet_din.0494.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0494.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0494.outcome_1:0 "The court pays the envoy's entire claim."
 kehillah_bet_din.0494.outcome_2:0 "The court pays essential costs and checks receipts against the elders' instructions."
 kehillah_bet_din.0494.outcome_3:0 "The court limits payment to the original allowance."
 kehillah_bet_din.0494.fact_true:0 "Several charges were personal gifts, not mission expenses. Full repayment misused communal funds."
 kehillah_bet_din.0494.fact_false:0 "The extra lodging and travel were forced by a delayed audience. A strict cap left the envoy bearing public costs."
 kehillah_bet_din.0494.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0494.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0494.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case49_one_tt:0 "Full repayment costs substantial Prosperity."
 kehillah_din_case49_two_tt:0 "An advance and audit cost some Prosperity."
 kehillah_din_case49_three_tt:0 "Strict refusal costs less but may deter future envoys."
 kehillah_bet_din_case49_great_log_title:0 "The Community's Traveling Envoy: a well-supported ruling"
 kehillah_bet_din_case49_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s envoy expenses."
 kehillah_bet_din_case49_good_log_title:0 "The Community's Traveling Envoy: a workable ruling"
 kehillah_bet_din_case49_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s envoy expenses."
 kehillah_bet_din_case49_poor_log_title:0 "The Community's Traveling Envoy: a disputed ruling"
 kehillah_bet_din_case49_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s envoy expenses."
