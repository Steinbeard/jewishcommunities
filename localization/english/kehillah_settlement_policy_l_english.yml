l_english:

 # ROADMAP S9a, 2026-09-29 -- Raise / Lower Jewish Settlement Policy.
 # 2026-10-28: the two decisions became the realm law kehillah_jewish_settlement
 # (kehillah_jewish_settlement_law_l_english.yml); their strings are gone.


 kehillah_policy_review_cooldown_tt:0 "The Status of the Jews in this realm was reviewed too recently"
 kehillah_policy_lower_floor_tt:0 "The Jews are already #N Restricted#! here; banning them outright is not yet possible"

 kehillah_policy_raise_to_discouraged_tt:0 "The Status of the Jews becomes #N Restricted#!"
 kehillah_policy_raise_to_allowed_tt:0 "The Status of the Jews becomes #P Tolerated#!: Jewish adventurers may again found communities here, and new charters offer ordinary rights"
 kehillah_policy_raise_to_encouraged_tt:0 "The Status of the Jews becomes #P Favored#!: Jewish adventurers are keener to found communities here, and new charters offer their most generous terms"
 kehillah_policy_invitation_tt:0 "Jewish communities within reach hear of your invitation, drawing settlers to your lands for years to come"
 kehillah_policy_lower_to_allowed_tt:0 "The Status of the Jews becomes #P Tolerated#!: new charters offer ordinary rather than generous terms"
 kehillah_policy_lower_to_discouraged_tt:0 "The Status of the Jews becomes #N Restricted#!: no new Jewish community may be founded here, and new charters offer only limited rights"
 kehillah_policy_lower_consequence_tt:0 "Fewer Jewish settlers will come, and with them fewer of the traders and lenders a realm draws on"
 kehillah_policy_existing_charters_kept_tt:0 "Communities already in the realm keep the charters they hold"

 kehillah_policy_raised_msg_title:0 "Status of the Jews Raised"
 kehillah_policy_raised_msg_desc:0 "[kehillah_policy_host.GetShortUIName] has proclaimed a more welcoming stance toward Jewish settlement in [kehillah_policy_realm.GetNameNoTooltip]: it is now [kehillah_policy_realm.Custom('KehillahJewishSettlementPolicy')].[kehillah_policy_realm.Custom('KehillahPolicyReason')]\n\n[kehillah_policy_community.GetNameNoTooltip] keeps the charter it holds."
 kehillah_policy_lowered_msg_title:0 "Status of the Jews Lowered"
 kehillah_policy_lowered_msg_desc:0 "[kehillah_policy_host.GetShortUIName] has restricted Jewish settlement in [kehillah_policy_realm.GetNameNoTooltip]: it is now [kehillah_policy_realm.Custom('KehillahJewishSettlementPolicy')].[kehillah_policy_realm.Custom('KehillahPolicyReason')]\n\n[kehillah_policy_community.GetNameNoTooltip] keeps the charter it holds, but any right it holds beyond what the realm now offers is held on sufferance."

 kehillah_settlement_policy_raised_clergy_opinion:0 "Welcomed Jewish Settlers"
