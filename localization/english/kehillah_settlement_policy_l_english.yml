l_english:

 # ROADMAP S9a, 2026-09-29 -- Raise / Lower Jewish Settlement Policy.
 kehillah_raise_jewish_settlement_policy_decision:0 "Raise Jewish Settlement Policy"
 kehillah_raise_jewish_settlement_policy_decision_desc:0 "Proclaim a more welcoming stance toward Jews who would settle in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. The Jewish communities of the realm will hear of it, and so will the clergy.\n\nCurrent policy: [ROOT.Char.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]"
 kehillah_raise_jewish_settlement_policy_decision_tooltip:0 "Make [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] more welcoming to Jewish settlement"
 kehillah_raise_jewish_settlement_policy_decision_confirm:0 "Proclaim it"

 kehillah_lower_jewish_settlement_policy_decision:0 "Lower Jewish Settlement Policy"
 kehillah_lower_jewish_settlement_policy_decision_desc:0 "Restrict the welcome [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] extends to Jewish settlers. The clergy will approve; the Jewish communities of the realm will take note.\n\nCurrent policy: [ROOT.Char.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]"
 kehillah_lower_jewish_settlement_policy_decision_tooltip:0 "Make [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] less welcoming to Jewish settlement"
 kehillah_lower_jewish_settlement_policy_decision_confirm:0 "Proclaim it"

 kehillah_policy_review_cooldown_tt:0 "The realm's Jewish Settlement Policy has been reviewed within the last five years"
 kehillah_policy_lower_floor_tt:0 "Jewish settlement is already #N Discouraged#! here; banning it outright is not yet possible"

 kehillah_policy_raise_to_discouraged_tt:0 "Jewish Settlement Policy becomes #N Settlement Discouraged#!"
 kehillah_policy_raise_to_allowed_tt:0 "Jewish Settlement Policy becomes #P Settlement Allowed#!: Jewish adventurers may again found communities here, and new charters offer ordinary rights"
 kehillah_policy_raise_to_encouraged_tt:0 "Jewish Settlement Policy becomes #P Settlement Encouraged#!: Jewish adventurers are keener to found communities here, and new charters offer their most generous terms"
 kehillah_policy_lower_to_allowed_tt:0 "Jewish Settlement Policy becomes #P Settlement Allowed#!: new charters offer ordinary rather than generous terms"
 kehillah_policy_lower_to_discouraged_tt:0 "Jewish Settlement Policy becomes #N Settlement Discouraged#!: no new Jewish community may be founded here, and new charters offer only limited rights"
 kehillah_policy_lower_consequence_tt:0 "Fewer Jewish settlers will come, and with them fewer of the traders and lenders a realm draws on"
 kehillah_policy_existing_charters_kept_tt:0 "Communities already in the realm keep the charters they hold"

 kehillah_policy_raised_msg_title:0 "Settlement Policy Raised"
 kehillah_policy_raised_msg_desc:0 "[kehillah_policy_host.GetShortUIName] has proclaimed a more welcoming stance toward Jewish settlement in [kehillah_policy_realm.GetNameNoTooltip]: it is now [kehillah_policy_realm.Custom('KehillahJewishSettlementPolicy')].\n\n[kehillah_policy_community.GetNameNoTooltip] keeps the charter it holds."
 kehillah_policy_lowered_msg_title:0 "Settlement Policy Lowered"
 kehillah_policy_lowered_msg_desc:0 "[kehillah_policy_host.GetShortUIName] has restricted Jewish settlement in [kehillah_policy_realm.GetNameNoTooltip]: it is now [kehillah_policy_realm.Custom('KehillahJewishSettlementPolicy')].\n\n[kehillah_policy_community.GetNameNoTooltip] keeps the charter it holds, but any right it holds beyond what the realm now offers is held on sufferance."

 kehillah_settlement_policy_raised_clergy_opinion:0 "Welcomed Jewish Settlers"
