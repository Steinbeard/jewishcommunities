l_english:
 # HOST ARREST -- docs/spec/v32-host-arrest-and-exile.md
 kehillah_crime_defied_expulsion_opinion:0 "Defied an Expulsion Edict"
 kehillah_crime_proselytism_opinion:0 "Received a Convert from Their Faith"
 kehillah_host_crime_toast_title:0 "Grounds for Arrest"
 kehillah_host_crime_toast_tt:0 "[kehillah_crime_host.GetTitledFirstName] now holds a crime against you and may [imprison|E] you."
 kehillah_imprison_decline_summary_exile:0 "@warning_icon! #X If [ROOT.Char.GetShortUINameNoTooltip] refuses, [CharYouSheHe(ROOT.Char)] will flee into exile: the community passes to its appointed heir, and [CharYouSheHe(ROOT.Char)] takes to the road as a landless wanderer, beyond [second.GetShortUINamePossessiveNoTooltip] realm.#!"
 kehillah_imprison_decline_summary_no_heir:0 "@warning_icon! #X [ROOT.Char.GetShortUINameNoTooltip] has no successor to leave the community to and cannot flee. Refusing will not prevent the arrest.#!"
 kehillah_arrest_refusal_exile_tt:0 "#X Flee into exile:#! the road out of [kehillah_arrest_host.GetShortUINamePossessive] realm, as a landless wanderer, while [kehillah_arrest_heir.GetShortUIName] takes up [kehillah_arrest_title.GetName]"
 kehillah_arrest_refusal_no_heir_tt:0 "#X No one to leave the community to:#! [kehillah_arrest_refuser.GetShortUIName] cannot flee, and is imprisoned anyway"
 kehillah_arrest.0010.t:0 "Into Exile"
 kehillah_arrest.0010.desc:0 "[kehillah_arrest_host.GetTitledFirstName] sent men to take me, and I would not go to [kehillah_arrest_host.GetHerHis] dungeon. Before they reached the quarter I gave the keys of the synagogue and the community's seal to [kehillah_arrest_heir.GetFirstName], who leads [kehillah_arrest_title.GetNameNoTooltip] now. Its charter, its buildings and its people stay behind with [kehillah_arrest_heir.GetHerHim].\n\nI am no longer the community's leader, only the head of a household on the road, under no lord's charter. What we own is what our wagons carry."
 kehillah_arrest.0010.desc_road:0 "\n\nWe are making for [kehillah_exile_destination.GetNameNoTooltip], the nearest land beyond [kehillah_arrest_host.GetShortUINamePossessiveNoTooltip] reach."
 kehillah_arrest.0010.desc_road_unknown:0 "\n\nNo border lies near enough to reach easily. We will have to find our own road out of [kehillah_arrest_host.GetShortUINamePossessiveNoTooltip] lands."
 kehillah_arrest.0010.a:0 "Better a wanderer than a prisoner."
 kehillah_arrest.0010.a.tt_successor:0 "[kehillah_arrest_heir.GetShortUIName] now leads [kehillah_arrest_title.GetName]"
 kehillah_arrest.0010.a.tt_camp:0 "You now lead a landless camp of wanderers. Its provisions are low."
 kehillah_arrest.0010.a.tt_return:0 "To lead a community again, gather followers and take the decision #V Found a Jewish Community#!"
 kehillah_expulsion_defiance_crime_tt:0 "[kehillah_exp_host.GetTitledFirstName] will count this as a crime: grounds to [imprison|E] you."
