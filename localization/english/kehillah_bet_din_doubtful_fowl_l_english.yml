l_english:
 kehillah_bet_din.0711.t:0 "The Doubtful Fowl"
 kehillah_bet_din.0711.desc:0 "[kbd_litigant_a.GetFirstName] sold a slaughtered bird before the inspector arrived. [kbd_litigant_b.GetFirstName] saw an injury and wants the sale undone. The bird is preserved, but every delay makes it less useful. The court needs an actual examination, not a victory for the loudest market voice."
 kehillah_bet_din.0711.a:0 "Approve the sale on the butcher's assurance."
 kehillah_bet_din.0711.a.tt:0 "The market moves quickly, but a disqualifying injury could be missed."
 kehillah_bet_din.0711.b:0 "Hold the bird for a qualified inspection."
 kehillah_bet_din.0711.b.tt:0 "Inspection costs time while preserving the evidence."
 kehillah_bet_din.0711.c:0 "Refund the buyer and condemn the bird now."
 kehillah_bet_din.0711.c.tt:0 "A harmless mark could make condemnation wasteful and unfair."
 kehillah_din_source_71:0 "Cite a mastered Kodashim work and examine the evidence."
 kehillah_din_source_71_tt:0 "Mishnah Chullin 2:1 gives the judges a textual point of reference. It cannot establish the bird's actual injury."
 kehillah_din_combo_71:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_71_tt:0 "The judges preserve both parties' interests while checking the bird's actual injury."
 kehillah_bet_din.0714.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0714.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0714.outcome_1:0 "The court approves the sale without opening the bird."
 kehillah_bet_din.0714.outcome_2:0 "The court holds the bird for the inspector and records the seller's account."
 kehillah_bet_din.0714.outcome_3:0 "The court refunds the buyer and rejects the bird."
 kehillah_bet_din.0714.fact_true:0 "The inspector finds a disqualifying injury. Unexamined approval was unsound."
 kehillah_bet_din.0714.fact_false:0 "The mark is harmless and the cut sound. Immediate condemnation wasted food."
 kehillah_bet_din.0714.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0714.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0714.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case71_one_tt:0 "The immediate ruling costs 8 Greatness and carries the larger fact risk."
 kehillah_din_case71_two_tt:0 "Inquiry costs 4 Greatness while the court keeps the issue open."
 kehillah_din_case71_three_tt:0 "The quick final settlement costs 2 Greatness but may be overbroad."
 kehillah_bet_din_case71_great_log_title:0 "The Doubtful Fowl: a well-supported ruling"
 kehillah_bet_din_case71_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the doubtful fowl dispute."
