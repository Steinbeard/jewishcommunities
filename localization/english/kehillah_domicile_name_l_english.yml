l_english:

 #####################################################################
 # Kehillah domicile naming override.
 # Branching logic lives in common/customizable_localization/
 # kehillah_domicile_custom_loc.txt -- read that file's header before
 # touching anything here.
 #####################################################################

 # OVERRIDES vanilla's own definition of this key (vanilla's version,
 # for reference, lives in
 # localization/english/dlc/ep3/ep3_laamps_l_english.yml:
 # "[CHARACTER.GetDynastyHouseNameNoTooltip] [DOMICILE_TYPE.GetNameNoTooltip]").
 # domicile_name is a SHARED key the engine uses for every domicile type
 # in the game, so this redefinition affects everyone's domiciles, not
 # only Kehillah ones -- which is exactly why it only ever delegates to
 # KehillahDomicileName rather than deciding anything itself. That
 # function's fallback branch is what actually keeps every non-Kehillah
 # domicile looking the way vanilla always made it look.
 domicile_name:0 "[CHARACTER.Custom('KehillahDomicileName')]"

 # The Kehillah of Worms specifically.
 kehillah_worms_domicile_name:0 "Worms Jewish Community"

 # ADDED 2026-09-08 (v4 spec): Speyer and Mainz.
 kehillah_speyer_domicile_name:0 "Speyer Jewish Community"
 kehillah_mainz_domicile_name:0 "Mainz Jewish Community"

 # Any future Kehillah with no named branch of its own yet (see the
 # comment in kehillah_domicile_custom_loc.txt).
 kehillah_generic_domicile_name:0 "[CHARACTER.GetDomicile.GetType.GetNameNoTooltip]"

 # Reached only for characters who are NOT a Kehillah leader -- a
 # faithful reproduction of vanilla's own domicile_name text above, so
 # nothing else in the game changes.
 kehillah_domicile_name_vanilla_fallback:0 "[CHARACTER.GetDynastyHouseNameNoTooltip] [CHARACTER.GetDomicile.GetType.GetNameNoTooltip]"
