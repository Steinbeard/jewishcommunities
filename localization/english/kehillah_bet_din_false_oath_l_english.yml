l_english:
 kehillah_bet_din.0831.t:0 "The False Oath Allegation"
 kehillah_bet_din.0831.desc:0 "[kbd_litigant_a.GetFirstName] says a debtor swore that a loan was repaid. [kbd_litigant_b.GetFirstName] says the words referred to a different payment and were heard through a crowded room. Two witnesses remember different phrases. The court must settle the debt without declaring a false oath on uncertain hearing."
 kehillah_bet_din.0831.a:0 "Treat the oath as false and collect the debt."
 kehillah_bet_din.0831.a.tt:0 "Collection is quick, but misheard words could brand an honest person a liar."
 kehillah_bet_din.0831.b:0 "Hear the witnesses separately and compare both payments."
 kehillah_bet_din.0831.b.tt:0 "A careful hearing costs time and court resources."
 kehillah_bet_din.0831.c:0 "Clear the debtor and cancel the debt."
 kehillah_bet_din.0831.c.tt:0 "If the debt remains unpaid, complete release wrongs the lender."
 kehillah_din_source_83:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_83_tt:0 "Mishnah Shevuot 7:1 gives the judges a textual point of reference. It cannot establish the words used and the debt they concerned."
 kehillah_din_combo_83:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_83_tt:0 "The judges preserve both parties' interests while checking the words used and the debt they concerned."
 kehillah_bet_din.0834.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0834.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0834.outcome_1:0 "The court declares the oath false and orders payment."
 kehillah_bet_din.0834.outcome_2:0 "The court separates witnesses and traces the two payments."
 kehillah_bet_din.0834.outcome_3:0 "The court clears the debtor and cancels the claim."
 kehillah_bet_din.0834.fact_true:0 "The oath was about another payment. A false-oath ruling misread the speaker's words."
 kehillah_bet_din.0834.fact_false:0 "Both records show this loan remained unpaid. Cancelling it rewarded evasion."
 kehillah_bet_din.0834.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0834.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0834.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case83_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case83_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case83_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
