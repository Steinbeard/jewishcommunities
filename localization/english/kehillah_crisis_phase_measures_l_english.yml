l_english:
 kehillah_crisis_phase_actions.careful:0 "Spend a little to prepare the approach."
 kehillah_crisis_phase_actions.bold:0 "Trust our words and take the risk."
 kehillah_crisis_phase_actions.back:0 "Consider another course."
 kehillah_crisis_phase_actions.generic.desc:0 "The people involved will hear your proposal. Their answer may yet change the course of this crisis."
 kehillah_crisis_phase_actions.0101.t:0 "Holding the Quarter Together"
 kehillah_crisis_phase_actions.0101.aid.desc:0 "The $kehillah_council_dayyan$ has brought the names of households whose stalls have closed. 'Some will take bread from the communal stores,' he says, 'but the families who have borrowed against tomorrow need help before they ask.' You could pay for a careful distribution or ask neighbors to carry what they can spare. The latter may come too late."
 kehillah_crisis_phase_actions.0101.mediate.desc:0 "The elders and the younger watchmen sit on opposite sides of the table. Each fears the other will endanger the quarter: silence, say the young men, looks like weakness; an angry answer, say the elders, gives the agitator what he wants. The $kehillah_council_dayyan$ can convene a formal meeting with food and witnesses, or try to persuade them here and now."
 kehillah_crisis_phase_actions.0101.aid_stores:0 "Open the communal stores."
 kehillah_crisis_phase_actions.0101.aid_stores.tt:0 "What the kehillah has put by feeds the hungry now. Turns on your $kehillah_council_dayyan$'s Learning."
 kehillah_crisis_phase_actions.0101.aid_households:0 "Ask each household to take in a neighbor."
 kehillah_crisis_phase_actions.0101.aid_households.tt:0 "Turns on your own Diplomacy; a compassionate leader is heeded. If the households refuse, the quarter remembers it."
 kehillah_crisis_phase_actions.0101.mediate_hearing:0 "Convene a formal hearing, with food and witnesses."
 kehillah_crisis_phase_actions.0101.mediate_hearing.tt:0 "Turns on your $kehillah_council_dayyan$'s Learning."
 kehillah_crisis_phase_actions.0101.mediate_rule:0 "Settle it yourself, here at the table."
 kehillah_crisis_phase_actions.0101.mediate_rule.tt:0 "Turns on your own Diplomacy; a just leader is trusted, an arbitrary one is not."
 kehillah_crisis_phase_actions.0102.t:0 "Calling on Authority"
 kehillah_crisis_phase_actions.0102.lord.desc:0 "At [kehillah_restraint_target.GetTitledFirstNamePossessive] court, your plea is heard beneath the noise of other petitions. A private reassurance will not reach the men repeating the charges; you need a proclamation forbidding violence against the Jews."
 kehillah_crisis_phase_actions.0102.scholars.desc:0 "The scholars have heard what is being said in the streets. Your Shtadlan proposes that they condemn violence before their students and the town's officers. A formal delegation would bring witnesses and time to prepare the case; a direct appeal could reach them sooner but may receive a private answer that no one else hears."
 kehillah_crisis_phase_actions.0102.overlord.desc:0 "A petition reaches [kehillah_restraint_target.GetTitledFirstNamePossessive] court. You ask for a written order that the local officers cannot easily disregard, though every day spent securing it gives the rumor more room to spread."
 kehillah_crisis_phase_actions.0102.lord_gift:0 "Bring a gift with the petition."
 kehillah_crisis_phase_actions.0102.lord_gift.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard; a greedy lord likes the gift."
 kehillah_crisis_phase_actions.0102.lord_charter:0 "Lay his own charter before him."
 kehillah_crisis_phase_actions.0102.lord_charter.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard; a just lord honors his word, an arbitrary one does not. A refusal costs the community face."
 kehillah_crisis_phase_actions.0102.scholars_dispute:0 "Dispute the law before them."
 kehillah_crisis_phase_actions.0102.scholars_dispute.tt:0 "Turns on your $kehillah_council_dayyan$'s Learning; a theologian leader argues well."
 kehillah_crisis_phase_actions.0102.scholars_private:0 "Seek out a sympathetic scholar privately."
 kehillah_crisis_phase_actions.0102.scholars_private.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy."
 kehillah_crisis_phase_actions.0102.overlord_messenger:0 "Send a messenger with gifts."
 kehillah_crisis_phase_actions.0102.overlord_messenger.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the overlord's regard."
 kehillah_crisis_phase_actions.0102.overlord_ride:0 "Ride to the court yourself."
 kehillah_crisis_phase_actions.0102.overlord_ride.tt:0 "A hard journey. Turns on your own Diplomacy as well as your $kehillah_council_shtadlan$'s, and the overlord's regard."
 kehillah_crisis_phase_actions.0103.t:0 "Before the Town"
 kehillah_crisis_phase_actions.0103.evidence.desc:0 "Your $kehillah_council_neeman$ lays out what the witnesses actually said beside the story now told in the market. One contradiction could undo the charge; an inquiry made too openly might give it a new audience."
 kehillah_crisis_phase_actions.0103.neighbors.desc:0 "Your $kehillah_council_neeman$ names neighbors who know the quarter and still have the town's ear. Asking them to speak may turn public opinion, but a refusal would be noticed as readily as their support."
 kehillah_crisis_phase_actions.0103.evidence_inquiry:0 "Pay for a quiet inquiry first."
 kehillah_crisis_phase_actions.0103.evidence_inquiry.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue."
 kehillah_crisis_phase_actions.0103.evidence_market:0 "Name the contradiction in the market, today."
 kehillah_crisis_phase_actions.0103.evidence_market.tt:0 "Turns on your own Learning and nerve; a brave leader holds the crowd, a craven one falters. Win or lose, the whole town hears it."
 kehillah_crisis_phase_actions.0103.neighbors_ask:0 "Ask them to speak for us in the market."
 kehillah_crisis_phase_actions.0103.neighbors_ask.tt:0 "Turns on your own Diplomacy; a gregarious leader finds it easy, a shy one does not."
 kehillah_crisis_phase_actions.0103.neighbors_repay:0 "First repay the old kindnesses we owe them."
 kehillah_crisis_phase_actions.0103.neighbors_repay.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue."
 kehillah_crisis_phase_actions.0104.t:0 "The Lord's Protection"
 kehillah_crisis_phase_actions.0104.refuge.desc:0 "Families wait outside [kehillah_phase_lord.GetTitledFirstNamePossessive] hall with bundles in their hands. His steward asks how many are to be admitted and who will feed them. A delegation carrying provisions might settle the question; a direct appeal asks the lord to bear the burden himself."
 kehillah_crisis_phase_actions.0104.patrol.desc:0 "The captain can put soldiers at the quarter gate, but he wants [kehillah_phase_lord.GetTitledFirstNamePossessive] order before he moves. Your Shtadlan can offer to provision the patrol, or press the lord to honor his existing protection without a gift."
 kehillah_crisis_phase_actions.0104.escort.desc:0 "The road remains open. Families could leave under guard if [kehillah_phase_lord.GetTitledFirstName] assigns riders, but he must take men from his own household. You can help meet their expenses or ask him to do it for the sake of his promise."
 kehillah_crisis_phase_actions.0104.refuge_provisions:0 "Bring provisions for every family admitted."
 kehillah_crisis_phase_actions.0104.refuge_provisions.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard."
 kehillah_crisis_phase_actions.0104.refuge_burden:0 "Ask the lord to bear the burden himself."
 kehillah_crisis_phase_actions.0104.refuge_burden.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard; a compassionate lord opens his doors, a callous one does not."
 kehillah_crisis_phase_actions.0104.patrol_provision:0 "Provision the patrol at the community's expense."
 kehillah_crisis_phase_actions.0104.patrol_provision.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard."
 kehillah_crisis_phase_actions.0104.patrol_protection:0 "Hold him to the protection he has already promised."
 kehillah_crisis_phase_actions.0104.patrol_protection.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard; a just lord keeps his word, a craven one keeps his men at home."
 kehillah_crisis_phase_actions.0104.escort_riders:0 "Pay the riders' expenses."
 kehillah_crisis_phase_actions.0104.escort_riders.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard."
 kehillah_crisis_phase_actions.0104.escort_guides:0 "Send the families with our own guides."
 kehillah_crisis_phase_actions.0104.escort_guides.tt:0 "Turns on your $kehillah_council_rosh_hashmirah$'s Martial. If they lose the road, scattered families shake the quarter."
 kehillah_crisis_phase_actions.0105.t:0 "Keeping a Way Open"
 kehillah_crisis_phase_actions.0105.guards.desc:0 "The watch knows the alleys, but it cannot hold every turn alone. The $kehillah_council_rosh_hashmirah$ can hire trained guards and fit them into its ranks, or ask the households to provide men who have never stood together under a captain."
 kehillah_crisis_phase_actions.0105.retreat.desc:0 "The $kehillah_council_rosh_hashmirah$ has marked two lanes by which families could reach shelter if the gate fails. Paid guides could lead them in order. Without guides, the households would have to remember the route amid the noise of a breach."
 kehillah_crisis_phase_actions.0105.guards_hire:0 "Hire trained guards."
 kehillah_crisis_phase_actions.0105.guards_hire.tt:0 "Turns on your $kehillah_council_rosh_hashmirah$'s Martial."
 kehillah_crisis_phase_actions.0105.guards_households:0 "Arm the households and lead them yourself."
 kehillah_crisis_phase_actions.0105.guards_households.tt:0 "Men at the walls are not at work. Turns on your own Martial; a brave leader steadies them."
 kehillah_crisis_phase_actions.0105.retreat_guides:0 "Pay guides to lead each lane."
 kehillah_crisis_phase_actions.0105.retreat_guides.tt:0 "Turns on your $kehillah_council_rosh_hashmirah$'s Martial."
 kehillah_crisis_phase_actions.0105.retreat_drill:0 "Rehearse the flight by night."
 kehillah_crisis_phase_actions.0105.retreat_drill.tt:0 "The drills frighten the quarter, but the households learn the way. Turns on your $kehillah_council_rosh_hashmirah$'s Martial; a patient leader drills well."
 kehillah_crisis_phase_actions.0106.t:0 "Before the Host's Captains"
 kehillah_crisis_phase_actions.0106.terms.desc:0 "[kehillah_phase_host.GetTitledFirstName] names a sum to turn the host aside. Your $kehillah_council_neeman$ believes its captains will accept less, if their leader can be made to think the offer is his own victory."
 kehillah_crisis_phase_actions.0106.delay.desc:0 "The host has camped within sight of the walls, and the carts carrying the old and the sick need one more night on the road. [kehillah_phase_host.GetTitledFirstName] will not halt for nothing. A purse would buy the night outright. Your $kehillah_council_shtadlan$ suggests a cheaper bargain: tell him the lord will hear his complaint in the morning, and hope the lord does."
 kehillah_crisis_phase_actions.0106.divide.desc:0 "The captains behind [kehillah_phase_host.GetTitledFirstName] disagree about what they are owed. Your $kehillah_council_neeman$ has found a way to speak to them separately, though discovery may bring them together again."
 kehillah_crisis_phase_actions.0106.obligations.desc:0 "[kehillah_phase_host.GetTitledFirstName] still holds land and an oath from a lord who has sworn to keep the town's peace. Your $kehillah_council_dayyan$ has the words of that oath, and the law that binds a sworn man, written out in a fair hand. A letter to the lord himself would carry more weight, but going over the leader's head is a loss of face for the community."
 # 2026-11-07: one pair of choices per measure.
 kehillah_crisis_phase_actions.0106.terms_counter:0 "Counter with a sum the households can raise."
 kehillah_crisis_phase_actions.0106.terms_counter.tt:0 "Turns on your own Stewardship. A greedy leader is easier to bargain with."
 kehillah_crisis_phase_actions.0106.terms_poverty:0 "Plead that the quarter has nothing left to give."
 kehillah_crisis_phase_actions.0106.terms_poverty.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue. An honest leader finds the lie hard to tell; a deceitful one does not."
 kehillah_crisis_phase_actions.0106.delay_pay:0 "Pay for the night."
 kehillah_crisis_phase_actions.0106.delay_pay.tt:0 "A price he will not refuse."
 kehillah_crisis_phase_actions.0106.delay_hearing:0 "Promise him a hearing before the lord."
 kehillah_crisis_phase_actions.0106.delay_hearing.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy. If he sees through it, the broken promise is remembered."
 kehillah_crisis_phase_actions.0106.divide_conduct:0 "Offer one captain safe conduct and a purse to leave."
 kehillah_crisis_phase_actions.0106.divide_conduct.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue."
 kehillah_crisis_phase_actions.0106.divide_expose:0 "Show each captain what the others have been promised."
 kehillah_crisis_phase_actions.0106.divide_expose.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue, and a schemer's touch. If it is discovered, the captains close ranks against the quarter."
 kehillah_crisis_phase_actions.0106.obligations_law:0 "Read him the law and his own oath."
 kehillah_crisis_phase_actions.0106.obligations_law.tt:0 "Turns on your $kehillah_council_dayyan$'s Learning. A just leader may listen; an arbitrary one will not."
 kehillah_crisis_phase_actions.0106.obligations_lord:0 "Write to his lord over his head."
 kehillah_crisis_phase_actions.0106.obligations_lord.tt:0 "Turns on how the lord regards the community."
