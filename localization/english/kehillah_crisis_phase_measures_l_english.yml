l_english:
 kehillah_crisis_phase_actions.careful:0 "Spend a little to prepare the approach."
 kehillah_crisis_phase_actions.bold:0 "Trust our words and take the risk."
 kehillah_crisis_phase_actions.back:0 "Consider another course."
 kehillah_crisis_phase_actions.generic.desc:0 "The people involved will hear your proposal. Their answer may yet change the course of this crisis."
 kehillah_crisis_phase_actions.0101.t:0 "Holding the Quarter Together"
 kehillah_crisis_phase_actions.0101.aid.desc:0 "The $kehillah_council_dayyan$ has brought the names of households whose stalls have closed. 'Some will take bread from the communal stores,' he says, 'but the families who have borrowed against tomorrow need help before they ask.' You could pay for a careful distribution or ask neighbors to carry what they can spare. The latter may come too late."
 kehillah_crisis_phase_actions.0101.mediate.desc:0 "The elders and the younger watchmen sit on opposite sides of the table. Each fears the other will endanger the quarter: silence, say the young men, looks like weakness; an angry answer, say the elders, gives the agitator what he wants. The $kehillah_council_dayyan$ can convene a formal meeting with food and witnesses, or try to persuade them here and now."
 kehillah_crisis_phase_actions.0101.careful:0 "Fund the Dayyan's plan and give it time."
 kehillah_crisis_phase_actions.0101.bold:0 "Let the Dayyan try without spending coin."
 kehillah_crisis_phase_actions.0101.careful.tt:0 "Better odds. Turns on your $kehillah_council_dayyan$'s Learning."
 kehillah_crisis_phase_actions.0101.bold.tt:0 "Worse odds, but no cost. Turns on your $kehillah_council_dayyan$'s Learning."
 kehillah_crisis_phase_actions.0102.t:0 "Calling on Authority"
 kehillah_crisis_phase_actions.0102.lord.desc:0 "At [kehillah_restraint_target.GetTitledFirstNamePossessive] court, your plea is heard beneath the noise of other petitions. A private reassurance will not reach the men repeating the charges; you need a proclamation forbidding violence against the Jews."
 kehillah_crisis_phase_actions.0102.scholars.desc:0 "The scholars have heard what is being said in the streets. Your Shtadlan proposes that they condemn violence before their students and the town's officers. A formal delegation would bring witnesses and time to prepare the case; a direct appeal could reach them sooner but may receive a private answer that no one else hears."
 kehillah_crisis_phase_actions.0102.overlord.desc:0 "A petition reaches [kehillah_restraint_target.GetTitledFirstNamePossessive] court. You ask for a written order that the local officers cannot easily disregard, though every day spent securing it gives the rumor more room to spread."
 kehillah_crisis_phase_actions.0102.careful:0 "Fund a formal delegation with witnesses."
 kehillah_crisis_phase_actions.0102.bold:0 "Make the appeal directly, before the talk spreads."
 kehillah_crisis_phase_actions.0102.careful.tt:0 "Better odds. Turns on your $kehillah_council_shtadlan$'s Diplomacy."
 kehillah_crisis_phase_actions.0102.bold.tt:0 "Worse odds, but no cost. Turns on your $kehillah_council_shtadlan$'s Diplomacy."
 kehillah_crisis_phase_actions.0103.t:0 "Before the Town"
 kehillah_crisis_phase_actions.0103.evidence.desc:0 "Your $kehillah_council_neeman$ lays out what the witnesses actually said beside the story now told in the market. One contradiction could undo the charge; an inquiry made too openly might give it a new audience."
 kehillah_crisis_phase_actions.0103.neighbors.desc:0 "Your $kehillah_council_neeman$ names neighbors who know the quarter and still have the town's ear. Asking them to speak may turn public opinion, but a refusal would be noticed as readily as their support."
 kehillah_crisis_phase_actions.0103.careful:0 "Pay for witnesses and a careful inquiry."
 kehillah_crisis_phase_actions.0103.bold:0 "Trust the Ne'eman's contacts to speak at once."
 kehillah_crisis_phase_actions.0103.careful.tt:0 "Better odds. Turns on your $kehillah_council_neeman$'s Intrigue."
 kehillah_crisis_phase_actions.0103.bold.tt:0 "Worse odds, but no cost. Turns on your $kehillah_council_neeman$'s Intrigue."
 kehillah_crisis_phase_actions.0104.t:0 "The Lord's Protection"
 kehillah_crisis_phase_actions.0104.refuge.desc:0 "Families wait outside [kehillah_phase_lord.GetTitledFirstNamePossessive] hall with bundles in their hands. His steward asks how many are to be admitted and who will feed them. A delegation carrying provisions might settle the question; a direct appeal asks the lord to bear the burden himself."
 kehillah_crisis_phase_actions.0104.patrol.desc:0 "The captain can put soldiers at the quarter gate, but he wants [kehillah_phase_lord.GetTitledFirstNamePossessive] order before he moves. Your Shtadlan can offer to provision the patrol, or press the lord to honor his existing protection without a gift."
 kehillah_crisis_phase_actions.0104.escort.desc:0 "The road remains open. Families could leave under guard if [kehillah_phase_lord.GetTitledFirstName] assigns riders, but he must take men from his own household. You can help meet their expenses or ask him to do it for the sake of his promise."
 kehillah_crisis_phase_actions.0104.careful:0 "Offer to meet the cost of the lord's help."
 kehillah_crisis_phase_actions.0104.bold:0 "Ask the lord to honor his protection without payment."
 kehillah_crisis_phase_actions.0104.careful.tt:0 "Better odds. Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard."
 kehillah_crisis_phase_actions.0104.bold.tt:0 "Worse odds, but no cost. Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard."
 kehillah_crisis_phase_actions.0105.t:0 "Keeping a Way Open"
 kehillah_crisis_phase_actions.0105.guards.desc:0 "The watch knows the alleys, but it cannot hold every turn alone. The $kehillah_council_rosh_hashmirah$ can hire trained guards and fit them into its ranks, or ask the households to provide men who have never stood together under a captain."
 kehillah_crisis_phase_actions.0105.retreat.desc:0 "The $kehillah_council_rosh_hashmirah$ has marked two lanes by which families could reach shelter if the gate fails. Paid guides could lead them in order. Without guides, the households would have to remember the route amid the noise of a breach."
 kehillah_crisis_phase_actions.0105.careful:0 "Pay for trained hands and clear orders."
 kehillah_crisis_phase_actions.0105.bold:0 "Rely on the watch and the households."
 kehillah_crisis_phase_actions.0105.careful.tt:0 "Better odds. Turns on your $kehillah_council_rosh_hashmirah$'s Martial."
 kehillah_crisis_phase_actions.0105.bold.tt:0 "Worse odds, but no cost. Turns on your $kehillah_council_rosh_hashmirah$'s Martial."
 kehillah_crisis_phase_actions.0106.t:0 "Before the Host's Captains"
 kehillah_crisis_phase_actions.0106.terms.desc:0 "[kehillah_phase_host.GetTitledFirstName] names a sum to turn the host aside. Your $kehillah_council_neeman$ believes its captains will accept less, if their leader can be made to think the offer is his own victory."
 kehillah_crisis_phase_actions.0106.delay.desc:0 "The host's leader may halt until morning if given a reason to wait."
 kehillah_crisis_phase_actions.0106.divide.desc:0 "The captains behind [kehillah_phase_host.GetTitledFirstName] disagree about what they are owed. Your $kehillah_council_neeman$ has found a way to speak to them separately, though discovery may bring them together again."
 kehillah_crisis_phase_actions.0106.obligations.desc:0 "The leader has obligations to his lord and to the peace of the town. He may yet listen."
 kehillah_crisis_phase_actions.0106.careful:0 "Bring an offer and ask the captains to listen."
 kehillah_crisis_phase_actions.0106.bold:0 "Try to persuade them without an offer."
 kehillah_crisis_phase_actions.0106.careful.tt:0 "Better odds. Turns on your $kehillah_council_neeman$'s Intrigue."
 kehillah_crisis_phase_actions.0106.bold.tt:0 "Worse odds, but no cost. Turns on your $kehillah_council_neeman$'s Intrigue."
