 kehillah_crisis_tt_armed_small:0 "Small push toward #high $kehillah_crisis_armed$#!"
 kehillah_crisis_tt_armed_moderate:0 "Moderate push toward #high $kehillah_crisis_armed$#!"
 kehillah_crisis_tt_armed_large:0 "Large push toward #high $kehillah_crisis_armed$#!"
 kehillah_crisis_tt_held_small:0 "Small push toward #high $kehillah_crisis_held$#!"
 kehillah_crisis_tt_held_moderate:0 "Moderate push toward #high $kehillah_crisis_held$#!"
 kehillah_crisis_tt_held_large:0 "Large push toward #high $kehillah_crisis_held$#!"
