 kehillah_crisis_armed_protect_decision:0 "Seek Protection"
 kehillah_crisis_armed_protect_decision_desc:0 "Ask for troops, refuge, or safe passage against the approaching host."
 kehillah_crisis_armed_protect_decision_tooltip:0 "Choose how to seek protection."
 kehillah_crisis_armed_protect_decision_confirm:0 "Hear the proposals"
 kehillah_crisis_armed_defend_decision:0 "Defend the Quarter"
 kehillah_crisis_armed_defend_decision_desc:0 "Arrange defenses, shelters, and a route for those in danger."
 kehillah_crisis_armed_defend_decision_tooltip:0 "Choose a defensive measure."
 kehillah_crisis_armed_defend_decision_confirm:0 "Hear the proposals"
 kehillah_crisis_armed_parley_decision:0 "Parley with the Host"
 kehillah_crisis_armed_parley_decision_desc:0 "Approach the host's leaders about terms, delay, or their obligations."
 kehillah_crisis_armed_parley_decision_tooltip:0 "Choose how to parley."
 kehillah_crisis_armed_parley_decision_confirm:0 "Hear the proposals"
 kehillah_crisis_contribute_decision:0 "Contribute [ROOT.Char.MakeScope.ScriptValue('kehillah_crisis_next_contribution_cost_value')|0] Gold (+1 Held)"
 kehillah_crisis_contribute_decision_desc:0 "Send coin through captains and local brokers. Each further point costs more; a successful bargain lowers future prices."
 kehillah_crisis_contribute_decision_tooltip:0 "Buy one more point of #high $kehillah_crisis_held$#!. Each costs more than the last."
 kehillah_crisis_contribute_decision_confirm:0 "Contribute"
 kehillah_crisis_phase_actions.later:0 "I will decide later."
 kehillah_crisis_phase_actions.0001.t:0 "Steady the Kehillah"
 kehillah_crisis_phase_actions.0001.desc:0 "Fear has divided the quarter. Some families wish to close their doors; others want the community to answer every insult. The $kehillah_council_dayyan$ asks which need should be met first, before the argument among neighbors becomes a danger of its own."
 kehillah_crisis_phase_actions.0001.desc_dayyan:0 "[kehillah_phase_adviser.GetFirstName] brings you accounts of shutters barred before sunset and families whose trade has stopped. 'People are frightened of what may come,' the $kehillah_council_dayyan$ says. 'If we cannot yet silence the voices outside, we can decide how we care for one another inside the quarter.'"
 kehillah_crisis_phase_actions.0001.fast:0 "Proclaim a fast and gather the households."
 kehillah_crisis_phase_actions.0001.watch:0 "Set a discreet watch in the streets."
 kehillah_crisis_phase_actions.0001.aid:0 "Help families whose trade has stopped."
 kehillah_crisis_phase_actions.0001.mediate:0 "Mediate between frightened families and angry youths."
 kehillah_crisis_phase_actions.0001.fast.flavor:0 "The whole quarter fasts and prays as one."
 kehillah_crisis_phase_actions.0001.fast.tt:0 "#P Result:#! $kehillah_crisis_tt_spared_small$, with Piety and relief from Stress"
 kehillah_crisis_phase_actions.0001.fast.odds.tt:0 "Your $kehillah_council_dayyan$ may try for more, at a risk"
 kehillah_crisis_phase_actions.0001.watch.flavor:0 "Trusted men walk the lanes after dark."
 kehillah_crisis_phase_actions.0001.watch.tt:0 "#P Result:#! $kehillah_crisis_tt_spared_large$ after [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_preparation_days')|0] days"
 kehillah_crisis_phase_actions.0001.watch.last.tt:0 "#P Lasting:#! The watch stands ready if a host forms"
 kehillah_crisis_phase_actions.0001.watch.odds.tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_watch_cost')|0] gold, or risk asking for volunteers. Uses the task slot"
 kehillah_crisis_phase_actions.0001.aid.flavor:0 "Bread and coin for the homes the market has left behind."
 kehillah_crisis_phase_actions.0001.aid.tt:0 "#P Success:#! $kehillah_crisis_tt_spared_moderate$. Stability: #P Minor bonus#!"
 kehillah_crisis_phase_actions.0001.aid.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_armed_small$"
 kehillah_crisis_phase_actions.0001.aid.odds.tt:0 "Turns on your $kehillah_council_dayyan$'s Learning. Gold helps"
 kehillah_crisis_phase_actions.0001.mediate.flavor:0 "Fearful elders and angry youths, at one table."
 kehillah_crisis_phase_actions.0001.mediate.tt:0 "#P Success:#! $kehillah_crisis_tt_spared_moderate$. Stability: #P Minor bonus#!"
 kehillah_crisis_phase_actions.0001.mediate.fail.tt:0 "#N Failure:#! Stability: #N Minor penalty#!"
 kehillah_crisis_phase_actions.0001.mediate.odds.tt:0 "Turns on your $kehillah_council_dayyan$'s Learning. Gold helps"
 kehillah_crisis_phase_actions.0002.t:0 "Call for Restraint"
 kehillah_crisis_phase_actions.0002.desc:0 "The charges have begun to circulate beyond the men who first raised them. Your $kehillah_council_shtadlan$ lays out the authorities who could still stop the talk from becoming violence. A public prohibition, a religious rebuke, or officers in the streets would each carry a different kind of weight."
 kehillah_crisis_phase_actions.0002.desc_shtadlan:0 "[kehillah_phase_adviser.GetFirstName] has been listening at [kehillah_restraint_lord.GetTitledFirstNamePossessive] court. 'The words are spreading, but no one has yet called men to arms,' your $kehillah_council_shtadlan$ tells you. 'We should ask someone whose word carries beyond our quarter to forbid violence before the crowd decides it has permission.'"
 kehillah_crisis_phase_actions.0002.lord:0 "Ask the lord to condemn the incitement."
 kehillah_crisis_phase_actions.0002.scholars:0 "Ask the scholars to denounce violence."
 kehillah_crisis_phase_actions.0002.town:0 "Call on the town's officers to keep order."
 kehillah_crisis_phase_actions.0002.overlord:0 "Petition the lord's superior."
 kehillah_crisis_phase_actions.0002.lord.flavor:0 "Let [kehillah_restraint_lord.GetTitledFirstName] forbid the violence aloud, for all to hear."
 kehillah_crisis_phase_actions.0002.lord.tt:0 "#P Success:#! $kehillah_crisis_tt_spared_large$"
 kehillah_crisis_phase_actions.0002.lord.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_armed_small$"
 kehillah_crisis_phase_actions.0002.lord.odds.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard. Gold helps"
 kehillah_crisis_phase_actions.0002.scholars.flavor:0 "Have the scholars of their own faith rule against the calls for blood."
 kehillah_crisis_phase_actions.0002.scholars.tt:0 "#P Success:#! $kehillah_crisis_tt_spared_moderate$"
 kehillah_crisis_phase_actions.0002.scholars.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_armed_small$"
 kehillah_crisis_phase_actions.0002.scholars.odds.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy. Gold helps"
 kehillah_crisis_phase_actions.0002.town.flavor:0 "The guild leaders tell their members to leave the quarter in peace."
 kehillah_crisis_phase_actions.0002.town.tt:0 "#P Result:#! $kehillah_crisis_tt_spared_moderate$"
 kehillah_crisis_phase_actions.0002.town.odds.tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_town_cost')|0] gold, or risk your $kehillah_council_shtadlan$ going without gifts"
 kehillah_crisis_phase_actions.0002.overlord.flavor:0 "Go over the local officers' heads, to [kehillah_restraint_ruler.GetTitledFirstNamePossessive] court, for a written order."
 kehillah_crisis_phase_actions.0002.overlord.tt:0 "#P Success:#! $kehillah_crisis_tt_spared_large$"
 kehillah_crisis_phase_actions.0002.overlord.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_armed_small$"
 kehillah_crisis_phase_actions.0002.overlord.odds.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the overlord's regard. Gold helps"
 kehillah_crisis_phase_actions.0003.t:0 "Make Our Case"
 kehillah_crisis_phase_actions.0003.desc:0 "The accusation has gained a life of its own. The $kehillah_council_neeman$ gathers the accounts of witnesses, creditors, and neighbors who heard the first telling. The community can answer in public, trace the rumor to its source, or ask those who know us to speak."
 kehillah_crisis_phase_actions.0003.desc_neeman:0 "[kehillah_phase_adviser.GetFirstName] lays several conflicting accounts beside the communal pinkas. 'By tomorrow, the market will remember only the loudest version,' the $kehillah_council_neeman$ says. 'We should decide which part of this story we can prove, and who will be believed when we tell it.'"
 kehillah_crisis_phase_actions.0003.answer:0 "Answer the accusation before the town."
 kehillah_crisis_phase_actions.0003.advocacy:0 "Carry our case through the market and court."
 kehillah_crisis_phase_actions.0003.evidence:0 "Expose the falsehood behind the charge."
 kehillah_crisis_phase_actions.0003.neighbors:0 "Ask respected neighbors to speak for us."
 kehillah_crisis_phase_actions.0003.answer.flavor:0 "Meet the agitator before the whole town, word for word."
 kehillah_crisis_phase_actions.0003.answer.tt:0 "#P Success:#! $kehillah_crisis_tt_spared_moderate$"
 kehillah_crisis_phase_actions.0003.answer.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_armed_moderate$"
 kehillah_crisis_phase_actions.0003.answer.odds.tt:0 "Turns on your speaker's Learning against the agitator's"
 kehillah_crisis_phase_actions.0003.advocacy.flavor:0 "Reply after reply, until the charge wears thin."
 kehillah_crisis_phase_actions.0003.advocacy.tt:0 "#P Result:#! $kehillah_crisis_tt_spared_large$ after [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_preparation_days')|0] days, and tempers cool"
 kehillah_crisis_phase_actions.0003.advocacy.odds.tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_advocacy_cost')|0] gold, or risk seeking volunteers. Uses the task slot"
 kehillah_crisis_phase_actions.0003.evidence.flavor:0 "Set what the witnesses swore beside what the market repeats."
 kehillah_crisis_phase_actions.0003.evidence.tt:0 "#P Success:#! $kehillah_crisis_tt_spared_large$"
 kehillah_crisis_phase_actions.0003.evidence.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_armed_small$"
 kehillah_crisis_phase_actions.0003.evidence.odds.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue. Gold helps"
 kehillah_crisis_phase_actions.0003.neighbors.flavor:0 "Ask the neighbors the town still trusts to speak for you."
 kehillah_crisis_phase_actions.0003.neighbors.tt:0 "#P Success:#! $kehillah_crisis_tt_spared_moderate$"
 kehillah_crisis_phase_actions.0003.neighbors.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_armed_small$"
 kehillah_crisis_phase_actions.0003.neighbors.odds.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue. Gold helps"
 kehillah_crisis_phase_actions.0004.t:0 "Seek Protection"
 kehillah_crisis_phase_actions.0004.desc:0 "The host has gathered, and words alone will not stop it at the gate. Your $kehillah_council_shtadlan$ identifies the protections that could be secured in time: men at the quarter, a refuge for families, or an escorted road away."
 kehillah_crisis_phase_actions.0004.desc_shtadlan:0 "[kehillah_phase_adviser.GetFirstName] returns from [kehillah_phase_lord.GetTitledFirstNamePossessive] court with a sober account of its mood. 'We need a promise that can be seen when the host arrives,' your $kehillah_council_shtadlan$ says. 'Men, shelter, or a safe road. Let us ask for something the lord can actually give.'"
 kehillah_crisis_phase_actions.0004.troops:0 "Ask the lord to send his men."
 kehillah_crisis_phase_actions.0004.refuge:0 "Obtain refuge under the lord's protection."
 kehillah_crisis_phase_actions.0004.patrol:0 "Secure a patrol at the quarter gate."
 kehillah_crisis_phase_actions.0004.escort:0 "Ask for safe passage under escort."
 kehillah_crisis_phase_actions.0004.troops.flavor:0 "Beg [kehillah_phase_lord.GetTitledFirstName] to send men to the quarter."
 kehillah_crisis_phase_actions.0004.troops.tt:0 "#P Success:#! $kehillah_crisis_tt_held_large$"
 kehillah_crisis_phase_actions.0004.troops.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0004.troops.odds.tt:0 "Turns on your Diplomacy and the lord's regard"
 kehillah_crisis_phase_actions.0004.refuge.flavor:0 "Open [kehillah_phase_lord.GetTitledFirstNamePossessive] halls to families with nowhere to go."
 kehillah_crisis_phase_actions.0004.refuge.tt:0 "#P Success:#! $kehillah_crisis_tt_held_moderate$"
 kehillah_crisis_phase_actions.0004.refuge.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0004.refuge.last.tt:0 "#P Lasting:#! A refuge if the quarter falls"
 kehillah_crisis_phase_actions.0004.refuge.odds.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard. Gold helps"
 kehillah_crisis_phase_actions.0004.patrol.flavor:0 "Put [kehillah_phase_lord.GetTitledFirstNamePossessive] soldiers at the quarter gate."
 kehillah_crisis_phase_actions.0004.patrol.tt:0 "#P Success:#! $kehillah_crisis_tt_held_large$"
 kehillah_crisis_phase_actions.0004.patrol.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0004.patrol.odds.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard. Gold helps"
 kehillah_crisis_phase_actions.0004.escort.flavor:0 "A guarded road out of the host's path."
 kehillah_crisis_phase_actions.0004.escort.tt:0 "#P Success:#! $kehillah_crisis_tt_held_moderate$"
 kehillah_crisis_phase_actions.0004.escort.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0004.escort.last.tt:0 "#P Lasting:#! Fewer are caught if the quarter falls"
 kehillah_crisis_phase_actions.0004.escort.odds.tt:0 "Turns on your $kehillah_council_shtadlan$'s Diplomacy and the lord's regard. Gold helps"
 kehillah_crisis_phase_actions.0005.t:0 "Defend the Quarter"
 kehillah_crisis_phase_actions.0005.desc:0 "The host may reach the quarter before the lord's answer does. The $kehillah_council_rosh_hashmirah$ marks the narrow lanes, the stone houses, and the exits that could carry families away. Each defense protects something different, and there is time to organize only one of these measures."
 kehillah_crisis_phase_actions.0005.desc_officer:0 "[kehillah_phase_adviser.GetFirstName] has walked the lanes with the watch. 'We can bar the approaches, reinforce the men at the gate, or prepare places for families to hide,' the $kehillah_council_rosh_hashmirah$ says. 'Tell me whom we must get out first if the host breaks through.'"
 kehillah_crisis_phase_actions.0005.barricade:0 "Barricade the approaches."
 kehillah_crisis_phase_actions.0005.shelter:0 "Shelter the families in the stone houses."
 kehillah_crisis_phase_actions.0005.guards:0 "Reinforce the watch with trained guards."
 kehillah_crisis_phase_actions.0005.retreat:0 "Arrange an orderly retreat if the gate falls."
 kehillah_crisis_phase_actions.0005.barricade.flavor:0 "Carts, chains and timber across every approach."
 kehillah_crisis_phase_actions.0005.barricade.tt:0 "#P Result:#! $kehillah_crisis_tt_held_moderate$, at the price of Stress"
 kehillah_crisis_phase_actions.0005.barricade.odds.tt:0 "Your $kehillah_council_rosh_hashmirah$ may hold a narrower line, at a risk"
 kehillah_crisis_phase_actions.0005.shelter.flavor:0 "Crowd the families into the strongest stone houses."
 kehillah_crisis_phase_actions.0005.shelter.tt:0 "#P Result:#! $kehillah_crisis_tt_held_small$. Prosperity: #N Minor penalty#!"
 kehillah_crisis_phase_actions.0005.shelter.odds.tt:0 "Your $kehillah_council_rosh_hashmirah$ may find spare rooms, at a risk"
 kehillah_crisis_phase_actions.0005.guards.flavor:0 "Hired guards stand beside the watch."
 kehillah_crisis_phase_actions.0005.guards.tt:0 "#P Success:#! $kehillah_crisis_tt_held_moderate$"
 kehillah_crisis_phase_actions.0005.guards.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0005.guards.last.tt:0 "#P Lasting:#! A stronger defense when the host arrives"
 kehillah_crisis_phase_actions.0005.guards.odds.tt:0 "Turns on your $kehillah_council_rosh_hashmirah$'s Martial. Gold helps"
 kehillah_crisis_phase_actions.0005.retreat.flavor:0 "Guides and agreed streets, in case the gate falls."
 kehillah_crisis_phase_actions.0005.retreat.tt:0 "#P Success:#! $kehillah_crisis_tt_held_moderate$"
 kehillah_crisis_phase_actions.0005.retreat.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0005.retreat.odds.tt:0 "Turns on your $kehillah_council_rosh_hashmirah$'s Martial. Gold helps"
 kehillah_crisis_phase_actions.0006.t:0 "Parley with the Host"
 kehillah_crisis_phase_actions.0006.desc:0 "The host is not of one mind. The $kehillah_council_neeman$ has learned which captains want payment, which want a quarrel, and which still answer to their lord. You can make an offer, delay their advance, or exploit those divisions before they reach the quarter."
 kehillah_crisis_phase_actions.0006.desc_neeman:0 "[kehillah_phase_adviser.GetFirstName] has gathered the host's demands and the names of its captains. '[kehillah_phase_host.GetFirstName] speaks for them in public,' the $kehillah_council_neeman$ says, 'but the men behind that voice want different things. We should decide which demand to answer, and which to turn against the others.'"
 kehillah_crisis_phase_actions.0006.terms:0 "Bargain down the host's price."
 kehillah_crisis_phase_actions.0006.delay:0 "Purchase time to bring families to safety."
 kehillah_crisis_phase_actions.0006.divide:0 "Approach the captains separately."
 kehillah_crisis_phase_actions.0006.obligations:0 "Remind the host's leader of his obligations."
 kehillah_crisis_phase_actions.0006.terms.flavor:0 "Haggle with [kehillah_phase_host.GetTitledFirstName] over the price of turning aside."
 kehillah_crisis_phase_actions.0006.terms.tt:0 "#P Success:#! $kehillah_crisis_tt_held_small$"
 kehillah_crisis_phase_actions.0006.terms.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0006.terms.last.tt:0 "#P Lasting:#! Later contributions cost less"
 kehillah_crisis_phase_actions.0006.terms.odds.tt:0 "Turns on your Stewardship if you make an offer, or your $kehillah_council_neeman$'s Intrigue if you plead poverty, and on the leader's temper"
 kehillah_crisis_phase_actions.0006.delay.flavor:0 "Give [kehillah_phase_host.GetTitledFirstName] a reason to wait until morning."
 kehillah_crisis_phase_actions.0006.delay.tt:0 "#P Success:#! $kehillah_crisis_tt_held_moderate$"
 kehillah_crisis_phase_actions.0006.delay.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0006.delay.odds.tt:0 "Certain if you pay for the night; otherwise turns on your $kehillah_council_shtadlan$'s Diplomacy and the leader's temper"
 kehillah_crisis_phase_actions.0006.divide.flavor:0 "Speak to [kehillah_phase_host.GetTitledFirstNamePossessive] captains one by one."
 kehillah_crisis_phase_actions.0006.divide.tt:0 "#P Success:#! $kehillah_crisis_tt_held_large$"
 kehillah_crisis_phase_actions.0006.divide.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_moderate$"
 kehillah_crisis_phase_actions.0006.divide.odds.tt:0 "Turns on your $kehillah_council_neeman$'s Intrigue. Gold helps"
 kehillah_crisis_phase_actions.0006.obligations.flavor:0 "Remind [kehillah_phase_host.GetTitledFirstName] what is owed to the lord and the town's peace."
 kehillah_crisis_phase_actions.0006.obligations.tt:0 "#P Success:#! $kehillah_crisis_tt_held_moderate$"
 kehillah_crisis_phase_actions.0006.obligations.fail.tt:0 "#N Failure:#! $kehillah_crisis_tt_struck_small$"
 kehillah_crisis_phase_actions.0006.obligations.odds.tt:0 "Turns on your $kehillah_council_dayyan$'s Learning or the lord's regard, and the leader's temper"
