 # common/culture/name_lists/kehillah_khazar_kabarism_patch.txt, and
 # common/religion/religion_types/kehillah_judaism_reserved_names.txt that
 # have no vanilla localization. Every name in those lists that already had
 # a vanilla loc entry is deliberately left out here to avoid duplicate-key
 # warnings -- these are only the genuinely new ones (found via the
 # "Missing loc" errors in error.log's culture_name_equivalency pass).
 #
 # Seven names are compound (two words) and are written here with the
 # engine's own underscore convention for a compound name token (see
 # vanilla's Abu_Bakr for precedent) rather than the literal-space form the
 # name list used to use -- a bare space cannot appear in a loc key at all,
 # so the name list itself was corrected alongside this file.
 #####################################################################

