l_english:
 # Stand for the Seat -- docs/spec/2026-11-08-stand-for-the-seat.md (2026-11-08)

 # Succession breakdown lines (kehillah_leadership)
 kehillah_score_rabbi_desc:0 "A rabbi"
 kehillah_score_gaon_desc:0 "Gaon of the rite"
 kehillah_score_nagid_desc:0 "Nagid of the realm's Jews"
 kehillah_score_sanhedrin_desc:0 "Sits on the Sanhedrin"
 kehillah_score_board_opinion_desc:0 "How the board regards them"
 kehillah_score_leads_community_desc:0 "Leads a community of standing"
 kehillah_score_outsider_desc:0 "From another community"
 kehillah_score_foreign_minhag_desc:0 "Of another customary region"
 kehillah_score_stranger_desc:0 "A stranger to the congregation"
 kehillah_score_child_married_in_desc:0 "A child married into a local family"

 # Weigh a seat
 kehillah_weigh_seat_interaction:0 "Weigh Their Seat"
 kehillah_weigh_seat_interaction_desc:0 "See how [recipient.GetPrimaryTitle.GetName] would regard you as its next leader, and what its seat would bring. You may stand for it from there."

 kehillah_candidacy.0001.t:0 "The Seat of [cand_seat.GetName]"
 kehillah_candidacy.0001.desc_intro:0 "When [cand_seat_holder.GetShortUIName] is gone, the board of [cand_seat.GetName] will choose who follows. My standing with them is [ROOT.Char.MakeScope.Var('kehillah_cand_preview_score').GetValue|0]."
 kehillah_candidacy.0001.desc_first:0 " As things stand, I would be their first choice."
 kehillah_candidacy.0001.desc_behind:0 " That puts me [ROOT.Char.MakeScope.Var('kehillah_cand_preview_rank').GetValue|0] of [ROOT.Char.MakeScope.Var('kehillah_cand_preview_field').GetValue|0]. Their first choice is [cand_front_runner.GetShortUIName], at [ROOT.Char.MakeScope.Var('kehillah_cand_front_score').GetValue|0]."
 kehillah_candidacy.0001.desc_no_line:0 " No one stands in line for the seat yet."
 kehillah_candidacy.0001.desc_great_rabbi:0 "\n\nMy name as a scholar has reached them. They would hear me as one of their own."
 kehillah_candidacy.0001.desc_married_in:0 "\n\nMy marriage ties me to one of their leading families. They would hear me as one of their own."
 kehillah_candidacy.0001.desc_stranger:0 "\n\nTo them I am a stranger. A congregation takes in a leader from elsewhere when he is a rabbi of great name, or when he has married into one of its leading families."
 kehillah_candidacy.0001.desc_offers:0 "\n\n#bold The seat#!"
 kehillah_candidacy.0001.offer_capital:0 "\n$EFFECT_LIST_BULLET$ The community lives in the capital of its host's realm."
 kehillah_candidacy.0001.offer_yeshiva:0 "\n$EFFECT_LIST_BULLET$ It keeps a yeshiva."
 kehillah_candidacy.0001.offer_economy:0 "\n$EFFECT_LIST_BULLET$ Its trade is among the richest of any community in the world."
 kehillah_candidacy.0001.offer_standing:0 "\n$EFFECT_LIST_BULLET$ It stands [cand_seat.MakeScope.Var('kehillah_rank_standing').GetValue|0] of [cand_seat.MakeScope.Var('kehillah_rank_of').GetValue|0] among the world's communities."
 kehillah_candidacy.0001.offer_nagid:0 "\n$EFFECT_LIST_BULLET$ Its leader is Nagid of the realm's Jews."
 kehillah_candidacy.0001.offer_shum:0 "\n$EFFECT_LIST_BULLET$ It is one of the three communities of Sh'um."
 kehillah_candidacy.0001.offer_trouble_crisis:0 "\n$EFFECT_LIST_BULLET$ #N It is in crisis now.#!"
 kehillah_candidacy.0001.desc_declared:0 "\n\nI have put my name forward."
 kehillah_candidacy.0001.a:0 "Put my name forward"
 kehillah_candidacy.0001.a.tt:0 "You enter the line of succession for [cand_seat.GetName]. If you are first when its leader dies, the seat is yours, and your own community passes to its next leader."
 kehillah_candidacy.0001.b:0 "Withdraw my name"
 kehillah_candidacy.0001.b.tt:0 "You leave the line for [cand_seat.GetName], and may not stand for any seat for a while."
 kehillah_candidacy.0001.c:0 "Not now"
 kehillah_cand_free_to_declare_tt:0 "You stand for no other seat, and have not lately stood for one"

 kehillah_candidacy.0020.t:0 "Called to [cand_new_seat.GetName]"
 kehillah_candidacy.0020.desc:0 "The board of [cand_new_seat.GetName] has chosen me to lead them. My household and I go to their quarter."
 kehillah_candidacy.0020.desc_old:0 "\n\nAt home, [cand_old_successor.GetShortUIName] takes up the leadership of [cand_old_seat.GetName]."
 kehillah_candidacy.0020.a:0 "A great charge"

 kehillah_candidacy.0030.t:0 "Another Was Chosen"
 kehillah_candidacy.0030.desc:0 "The board of [cand_lost_seat.GetName] has chosen [cand_lost_winner.GetShortUIName] to lead them. My name was not enough."
 kehillah_candidacy.0030.a:0 "So be it"

 # Ask for endorsement
 kehillah_seek_endorsement_interaction:0 "Ask to Be Named Successor"
 kehillah_seek_endorsement_interaction_desc:0 "Ask [recipient.GetShortUIName] to name you the one [recipient.GetSheHe] would see follow [recipient.GetHerHim] in [recipient.GetPrimaryTitle.GetName]."
 kehillah_seek_endorsement_interaction_notification:0 "[actor.GetShortUIName] asks you to name [actor.GetHerHim] your successor."
 kehillah_seek_endorsement_cost_desc:0 "Asking openly"
 kehillah_seek_endorsement_not_already_tt:0 "[recipient.GetShortUIName] has not already named you"
 kehillah_seek_endorsement_great_rabbi_reason:0 "A rabbi of great name"
 kehillah_seek_endorsement_married_in_reason:0 "Married into a local family"
 kehillah_seek_endorsement_same_minhag_reason:0 "Of the same customary region"
 kehillah_seek_endorsement_has_family_reason:0 "Has grown kin of [recipient.GetHerHis] own"
 kehillah_seek_endorsement_accept_tt:0 "[recipient.GetShortUIName] names you [recipient.GetHerHis] successor"
 kehillah_seek_endorsement_decline_tt:0 "[recipient.GetShortUIName] keeps [recipient.GetHerHis] own counsel"
