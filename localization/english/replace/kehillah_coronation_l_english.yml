l_english:

 # CK3 1.20's Three Assents text reads the guest's faith for these two
 # religious terms. A Jewish guest at a Catholic coronation thus sees
 # "rabbis" (and, in the low-populace variant, a synagogue). The event
 # already saves its ruler as host; use that faith consistently here.
 coronation_events.6123.desc_intro: "Until the [host.GetFaith.BishopNeuterPlural], the [host.GetPrimaryTitle.GetAdjective] nobility, and the common people have all acted their customary part, [host.GetFirstName] is no true [host.GetTitleAsNameNoTooltip|l]. [host.GetHerHis|U] rule cannot be just without their acceptance of it.\n\nFirst, the [host.GetFaith.PriestNeuterPlural]."
 coronation_events.6123.desc_low_populace: "the elders of [location.GetTitle.GetBaseNameNoTier] come forth, shivering in fear, as a riot rages beyond the [host.GetFaith.HouseOfWorship]. The rabble here have no love for the [host.GetTitleAsNameNoTooltip|l].\n\n"
