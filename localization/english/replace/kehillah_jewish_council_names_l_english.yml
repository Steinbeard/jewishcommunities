l_english:

 # Replaces vanilla's names for a Jewish ruler's court chaplain (all
 # governments). Vanilla used Kohen / Rabban / Nasi / Gadol -- a priestly
 # caste, a Mishnaic patriarch's honorific, the patriarch's title and
 # "great" -- none of which named a medieval court rabbi. Kehillot use
 # "Dayyan" instead (kehillah_council_l_english.yml). v26, 2026-10-01.
 councillor_court_chaplain_judaism_religion_county:0 "Court Rabbi"
 councillor_court_chaplain_judaism_religion_county_possessive:0 "Court Rabbi's"
 councillor_court_chaplain_judaism_religion_duchy:0 "Rav"
 councillor_court_chaplain_judaism_religion_duchy_possessive:0 "Rav's"
 councillor_court_chaplain_judaism_religion_kingdom:0 "Chief Rabbi"
 councillor_court_chaplain_judaism_religion_kingdom_possessive:0 "Chief Rabbi's"
 councillor_court_chaplain_judaism_religion_empire:0 "Chief Rabbi"
 councillor_court_chaplain_judaism_religion_empire_possessive:0 "Chief Rabbi's"
