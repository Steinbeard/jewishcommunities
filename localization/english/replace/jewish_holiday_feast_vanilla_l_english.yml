l_english:
 # Jewish Feast wrappers preserve vanilla text for non-Jewish hosts.
 feast.1503.desc:0 "[sender.Custom('KehillahFeastInvitation')]"
 feast.7101.desc:0 "[ROOT.Char.Custom('KehillahFeastHostEnd')]"
 feast_food_bad:1 "[GetPlayer.Custom('KehillahFeastSimpleFood')]"
 feast_default_alex.200.desc: ""My [guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))], I have heard rumor of a plague called [epidemic.GetName]..." [guest.GetTitledFirstName] says worriedly.\n\n"It's said to be rampant in the [afflicted_top_liege.GetPrimaryTitle.GetBaseName], with the victims being [sick_peasant.Custom('disease_desc_short')]... not even the [root_scope.Custom('KehillahFeastSafeMeal')] can take my mind off it.""
 feast.7002.neutral:0 "#EMP Oh.#! I seem to have spotted some [ROOT.Char.Custom('KehillahFeastSafeMeal')] already..."
 feast.7202.adventurer_loot: "What the..? #EMP Rough [host.GetHerHim] up, steal the [host.Custom('KehillahFeastSafeMeal')]!#!"
 feast_default.9002.desc_roughed_up: "\n\nWhat a feast! My bags are laden with pilfered cutlery and [host.Custom('KehillahFeastSafeMeal')], that [host.Custom2('InsultNoun', ROOT.Char)] [host.GetFirstNameNoTooltip] never should have insulted me!"
 activity_pulse_action_lauded_food:1 "[first.GetShortUINameNoTooltip] Praise[_s(first)] the [root_scope.Custom('KehillahFeastSafeMeal')|U]"
 activity_pulse_action_guest_of_honor_impressed:1 "Honorary Guest [first.GetShortUINameNoTooltip] Enjoy[_s(first)] the [root_scope.Custom('KehillahFeastSafeMealAlt')|U]"
 activity_pulse_action_ridiculed_food:1 "[first.GetShortUINameNoTooltip|U] Lambast[_s(first)] the Quality of the [root_scope.Custom('KehillahFeastSafeMeal')|U]"
 excellent_food_title:0 "[first.GetShortUINameNoTooltip|U] Overjoyed with the Amount of [root_scope.Custom('KehillahFeastSafeDessert')|U]"
 feast.7205.b: "#EMP Oh!#! They even have [host.Custom('KehillahFeastSafeDessert')] here!"
 feast_default_laurence.100.desc: "On returning from relieving myself I am approached by a steely-eyed [conspiratorial_fellow.GetName]. [conspiratorial_fellow.GetSheHe|U] regales me with tales of the [war_memory.MakeScope.Var('war_cb').GetFlagName] [conspiratorial_fellow.GetSheHe] fought against [intent_target.GetName]. Through gritted teeth [conspiratorial_fellow.GetSheHe] laments missing the chance to split [intent_target.GetHerHim] from nave to chops. Leaning closer and locking [conspiratorial_fellow.GetHerHis] eyes with mine.\n\n"Let the [activity.GetHost.Custom('KehillahFeastSafeAnimal')] your chefs so nicely prepared not be the only beast skewered at this feast! You need but tell your guards to lose their sight and block their ears. I will take care of the rest.""
 feast_default.8001.desc.compassionate:0 "I can't lift the eyes from my plate. The [ROOT.Char.Custom('KehillahFeastSafeMeat')] is almost untouched. My [ROOT.Char.Custom('GetExpensiveDrink_Singular')] intact. I avoid [honorary_guest.GetTitledFirstName] when [honorary_guest.GetSheHe] talks about [honorary_guest.Custom('herhis_subject_of_interest')]. Shame.\n\n"Please, my friend," I excuse myself, leaving the room in a rush. I breathe heavily. It's what #EMP needs#! to be done. I give a sign to one of the servants and close my eyes.\n\nFlames, then screams."
 feast_events_ewan.0201.desc.meat.dramatic_snap:0 ""... of course, it's all about being", I snap the small bone of [activity.GetHost.Custom('KehillahFeastSafeAnimal')] I'm holding deftly in two, "#EMP firm#!. Wouldn't you agree?""
 feast_events_ewan.0201.desc.meat.sink_teeth:0 "Slowly, deliberately, I let my teeth sink into the flesh of a #EMP delectable#! morsel of [activity.GetHost.Custom('KehillahFeastSafeMeat')], gently, yet firmly, tearing the meat away."
 feast_events_ewan.0201.desc.meat.lick:0 "With a hearty, yet languid, lick, I collect a heavy mouthful of the sauce coating my portion of [activity.GetHost.Custom('KehillahFeastSafeAnimal')]. We maintain eye contact the entire time."
 feast_events_ewan.0801.desc.temperate:0 "\n\nOf course, I'm not too keen on the elaborate dishes, but I can enjoy the fine company and good spirits while nibbling on my hunk of [activity.GetHost.Custom('KehillahFeastBread')]."
 feast_events_ewan.0801.desc.generous:0 "\n\nThere's something so simply pleasant about the act of feeding others, of all [activity.GetHost.Custom('KehillahFeastSharingFood')] and sharing cups in the same room."
 feast_events_ewan.0401.desc.target_personality.fallback:0 "The [intent_target.GetWomanMan] gently dabs at the corners of [intent_target.GetHerHis] mouth with a corner of soiled tablecloth, brushing away [activity.GetHost.Custom('KehillahFeastPastryCrumbs')].\n\n"I just hope the next course is a bit lighter", [intent_target.GetSheHe] opines, "the whole point of a feast is to provide a rich, varied culinary experience, and so far this has felt more like it's trying to stuff us than excite us.""
