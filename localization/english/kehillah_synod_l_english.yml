l_english:
 # V45 rabbinic synods (docs/spec/v45-rabbinic-synods-and-minhag-ashkenaz.md)

 minhag_ashkenaz:0 "Minhag Ashkenaz"
 minhag_ashkenaz_adj:0 "Ashkenazi"
 minhag_ashkenaz_adherent:0 "Ashkenazi Jew"
 minhag_ashkenaz_adherent_plural:0 "Ashkenazi Jews"
 minhag_ashkenaz_desc:0 "The custom of the Jews of the Rhineland and northern France, who follow the Babylonian Talmud as their teachers in Mainz and Worms explain it. The ordinances of Rabbenu Gershom, the Light of the Exile, command great respect among them, though a synod must settle whether his ban on taking a second wife binds the rite."

 kehillah_synod_renews_herem_tt:0 "#EMP Minhag Ashkenaz#! becomes monogamous. Ashkenazi Jews may no longer take a second wife; other Rabbinic rites keep the older law."
 kehillah_synod_binds_region_tt:0 "The takkanah binds every community of your minhag region."

 kehillah_news_synod_t:0 "A Synod Concludes"
 kehillah_news_synod_passed_d:0 "The synod called by [kehillah_news_leader.GetTitledFirstName] of the [kehillah_news_title.GetNameNoTooltip] has enacted a takkanah. Copies are already on their way to every community of the region."

 # The Synod and Sanhedrin intents of the Sitting of the Bet Din
 kehillah_bet_din_synod_intent:0 "Convene a Synod"
 kehillah_bet_din_synod_intent_desc:0 "Alongside its cases, the Bet Din puts a takkanah before the assembled Kehillah leaders. Every community is invited to debate and vote; the ruling binds the communities within its jurisdiction."
 kehillah_bet_din_sanhedrin_intent:0 "Convene the Sanhedrin"
 kehillah_bet_din_sanhedrin_intent_desc:0 "The Nasi of the Sanhedrin puts a takkanah to the leaders of every community who come. If they vote for it, it binds every community of Israel."

 kehillah_synod_requires_regional_leadership_tt:0 "Your community has the greatest standing of any in your minhag region"
 kehillah_synod_requires_quorum_tt:0 "Enough other Kehillot to make a quorum"
 kehillah_synod_requires_open_takkanah_tt:0 "A takkanah your community has not yet enacted"
 kehillah_synod_requires_no_recent_synod_tt:0 "You have not put a motion to a synod in recent years"
 kehillah_sanhedrin_requires_head_tt:0 "You are #EMP Nasi#! of the Sanhedrin. No Sanhedrin has sat since antiquity, but a rabbi who masters every field of learning and reaches the height of devotion may restore it."
 kehillah_synod_not_nasi_tt:0 "You are not #EMP Nasi#! of the Sanhedrin. The Nasi convenes the Sanhedrin instead."
 kehillah_sanhedrin_requires_quorum_tt:0 "Enough other communities in the world to make a quorum"
 kehillah_bet_din_invite_rule_synod_delegates:0 "Delegates of the Kehillot"
 kehillah_bet_din_invite_rule_synod_delegates_desc:0 "A Synod or Sanhedrin calls the leaders of every Kehillah to debate its motion."
 kehillah_sanhedrin_binds_all_tt:0 "The takkanah binds every community of Israel."
 kehillah_sanhedrin_herem_all_israel_tt:0 "Rabbinic Jews everywhere are forbidden a second wife, not only in Ashkenaz."

 kehillah_synod.0100.t:0 "The Motion"
 kehillah_synod.0100.desc:0 "The delegates have arrived, and the judges have begun hearing their cases. Before the sitting ends, you will put one takkanah to the delegates. Which will it be?"
 kehillah_synod.0100.other:0 "Not a matter of marriage. A question of communal order."
 kehillah_synod.0105.desc:0 "The delegates have arrived, and the judges have begun hearing their cases. Before the sitting ends, you will put one takkanah to the delegates, a question of how the communities keep order among themselves. Which will it be?"
 kehillah_synod_option_herem_all_israel:0 "Herem against a Second Wife, for All Israel"
 kehillah_synod_option_herem_all_israel_desc:0 "$EFFECT_LIST_BULLET$ Extend Rabbenu Gershom's ban beyond Ashkenaz, to every Rabbinic Jew\n#weak Sepharad and Babylonia never accepted the ban. Only the Sanhedrin could make them.#!"
 kehillah_synod_motion_herem_all_israel:0 "The motion is that the ban of Rabbenu Gershom will bind all Israel: no Rabbinic Jew anywhere may take a second wife."
 kehillah_synod_option_herem_polygamy:0 "Herem against a Second Wife"
 kehillah_synod_option_herem_polygamy_desc:0 "$EFFECT_LIST_BULLET$ Renew Rabbenu Gershom's ban on taking a second wife\n$EFFECT_LIST_BULLET$ Make #EMP Minhag Ashkenaz#! monogamous\n#weak Ashkenazi communities already share their rite. The question before the delegates is whether Gershom's ordinance binds it.#!"
 kehillah_synod_option_ketubbah_clause:0 "A Clause in the Ketubbah"
 kehillah_synod_option_ketubbah_clause_desc:0 "$EFFECT_LIST_BULLET$ Every marriage contract in the region will carry the husband's oath not to take a second wife\n#weak The law still allows it. The bride's family need no longer accept it.#!"
 kehillah_synod_option_gentile_courts:0 "No Appeal to Gentile Courts"
 kehillah_synod_option_gentile_courts_desc:0 "$EFFECT_LIST_BULLET$ No Jew may bring a fellow Jew before a gentile court without the Bet Din's leave\n#weak The sages of Troyes held that a quarrel taken to the lord's court is a quarrel the whole community pays for.#!"
 kehillah_synod_option_informers:0 "The Ban on Informers"
 kehillah_synod_option_informers_desc:0 "$EFFECT_LIST_BULLET$ Whoever informs on a fellow Jew to the authorities is put under the ban\n#weak One malshin can do more harm than a year of bad harvests.#!"
 kehillah_synod_option_hayishuv:0 "Herem ha-Yishuv"
 kehillah_synod_option_hayishuv_desc:0 "$EFFECT_LIST_BULLET$ No newcomer may settle in a community without its consent\n#weak It protects the livelihoods of the households already there. It shuts the door on those who have nowhere else to go.#!"
 kehillah_synod_option_letters:0 "No Reading Another's Letters"
 kehillah_synod_option_letters_desc:0 "$EFFECT_LIST_BULLET$ Renew Rabbenu Gershom's ban on opening a letter meant for someone else\n#weak The responsa that bind the scattered communities travel by letter. They must arrive unread.#!"

 kehillah_synod.0101.t:0 "The Synod Opens"
 kehillah_synod.0101.desc:0 "The delegates have taken their places. The motion is yours to put to them.\n\n"
 kehillah_synod_motion_herem_polygamy:0 "The motion is to renew the ban of Rabbenu Gershom: no man of these communities may take a second wife."
 kehillah_synod_motion_ketubbah_clause:0 "The motion is that every ketubbah written in the region will carry the husband's oath not to take a second wife."
 kehillah_synod_motion_gentile_courts:0 "The motion is that no Jew may bring a fellow Jew before a gentile court without the Bet Din's leave."
 kehillah_synod_motion_informers:0 "The motion is to place under the ban anyone who informs on a fellow Jew to the authorities."
 kehillah_synod_motion_hayishuv:0 "The motion is that no newcomer may settle in a community of the region without its consent."
 kehillah_synod_motion_letters:0 "The motion is to renew Gershom's ban on reading a letter meant for someone else."
 kehillah_synod.0101.a:0 "Argue from the sources, and from the sages before us."
 kehillah_synod.0101.b:0 "Argue from what the people suffer without it."
 kehillah_synod.0101.c:0 "Say nothing. Let the delegates weigh it themselves."
 kehillah_synod_argument_won:0 "The delegates are persuaded"
 kehillah_synod_argument_lost:0 "The delegates are unmoved"

 kehillah_synod.0102.t:0 "The Synod Votes"
 kehillah_synod.0102.desc:0 "[kehillah_synod_host.GetTitledFirstName] has put the motion to the synod, and each delegate must now give their voice.\n\n"
 kehillah_synod.0102.a:0 "I vote for it."
 kehillah_synod.0102.b:0 "I vote against it."

 kehillah_synod.0103.t:0 "The Synod Rises"
 kehillah_synod.0103.desc.passed:0 "The votes are counted, and the motion carries. The scribes write out the takkanah, and the delegates carry copies home to their communities."
 kehillah_synod.0103.desc.failed:0 "The votes are counted, and the motion fails. The delegates leave politely, and some of them are already talking about the next synod."
 kehillah_synod.0103.desc.no_quorum:0 "Too few of the region's communities sent delegates. Without a quorum, the synod cannot bind anyone, and it rises without a ruling."
 kehillah_synod.0103.a:0 "So it is recorded."
