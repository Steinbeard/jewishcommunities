l_english:
 # V45 rabbinic synods (docs/spec/v45-rabbinic-synods-and-minhag-ashkenaz.md)

 minhag_ashkenaz:0 "Minhag Ashkenaz"
 minhag_ashkenaz_adj:0 "Minhag Ashkenaz"
 minhag_ashkenaz_adherent:0 "Ashkenazi Jew"
 minhag_ashkenaz_adherent_plural:0 "Ashkenazi Jews"
 minhag_ashkenaz_desc:0 "The Rabbinic custom of the Rhineland and northern France joins the study of the Talmud to the obligations of communal life. Its congregations preserve their own legal rulings and penitential practices, including the marriage restrictions associated with Rabbenu Gershom."

 kehillah_synod_renews_herem_tt:0 "The assembled Kehillot renew the monogamous custom of #EMP Minhag Ashkenaz#!. Other Rabbinic rites keep the older law."
 kehillah_synod_binds_region_tt:0 "The takkanah binds every community that keeps your rite."

 kehillah_news_synod_t:0 "A Synod Concludes"
 kehillah_news_synod_passed_d:0 "The synod called by [kehillah_news_leader.GetTitledFirstName] of the [kehillah_news_title.GetNameNoTooltip] has enacted a takkanah. Copies are already on their way to every community that keeps its rite."

 # The Synod and Sanhedrin intents of the Sitting of the Bet Din
 kehillah_bet_din_synod_intent:0 "Convene a Synod"
 kehillah_bet_din_synod_intent_desc:0 "Alongside its cases, the Bet Din puts a takkanah before the assembled Kehillah leaders. Every community is invited to debate and vote; the ruling binds the communities within its jurisdiction."
 kehillah_bet_din_sanhedrin_intent:0 "Convene the Sanhedrin"
 kehillah_bet_din_sanhedrin_intent_desc:0 "The Nasi of the Sanhedrin puts a takkanah to the leaders of every community who come. If they vote for it, it binds every community of Israel."

 kehillah_synod_requires_regional_leadership_tt:0 "Your community has the greatest standing of any in your minhag region"
 kehillah_synod_requires_greatness_tt:0 "Your community's Greatness is Flourishing or higher"
 kehillah_synod_requires_quorum_tt:0 "Enough other Kehillot of your rite to make a quorum"
 kehillah_synod_requires_open_takkanah_tt:0 "A valid tenet, rite-practice, headship, or personal-sanction proposal is available."
 kehillah_synod_requires_no_recent_synod_tt:0 "You have not put a motion to a synod in recent years"
 kehillah_sanhedrin_requires_head_tt:0 "You are #EMP Nasi#! of the Sanhedrin. No Sanhedrin has sat since antiquity, but a rabbi who masters every field of learning and reaches the height of devotion may restore it."
 kehillah_synod_not_nasi_tt:0 "You are not #EMP Nasi#! of the Sanhedrin. The Nasi convenes the Sanhedrin instead."
 kehillah_sanhedrin_requires_quorum_tt:0 "Enough other communities in the world to make a quorum"
 kehillah_bet_din_invite_rule_synod_delegates:0 "Delegates of the Kehillot"
 kehillah_bet_din_invite_rule_synod_delegates_desc:0 "A Synod calls the leaders of every Kehillah of its rite to debate its motion. The Sanhedrin calls every Kehillah."
 kehillah_sanhedrin_binds_all_tt:0 "The takkanah binds every community of Israel."
 kehillah_sanhedrin_herem_all_israel_tt:0 "Rabbinic Jews everywhere are forbidden a second wife, not only in Ashkenaz."

 kehillah_synod.0100.t:0 "The Synod’s Proposal"
 kehillah_synod.0100.desc:0 "The ordinary cases are concluded. The delegates may now vote on one proposal: a tenet, a change to our rite’s practice, or the exercise of communal authority.\n\nChoose a matter with a concrete consequence. You may also close the sitting without a proposal."
 kehillah_synod.0100.other:0 "Not a matter of marriage. A question of communal order."
 kehillah_synod.0105.desc:0 "An ordinance binds every community of the rite in how it keeps order among its own. Which will you put to the delegates?"
 kehillah_synod_option_herem_all_israel:0 "Herem against a Second Wife, for All Israel"
 kehillah_synod_option_herem_all_israel_desc:0 "$EFFECT_LIST_BULLET$ Extend Rabbenu Gershom's ban beyond Ashkenaz, to every Rabbinic Jew\n#weak Sepharad and Babylonia never accepted the ban. Only the Sanhedrin could make them.#!"
 kehillah_synod_motion_herem_all_israel:0 "The motion is that the ban of Rabbenu Gershom will bind all Israel: no Rabbinic Jew anywhere may take a second wife."
 kehillah_synod_option_herem_polygamy:0 "Herem against a Second Wife"
 kehillah_synod_option_herem_polygamy_desc:0 "$EFFECT_LIST_BULLET$ Renew Rabbenu Gershom's ban on taking a second wife\n$EFFECT_LIST_BULLET$ Ratify the monogamous custom of #EMP Minhag Ashkenaz#!\n#weak The ban already governs Ashkenazi households. The delegates are being asked to renew it together for the generation to come.#!"
 kehillah_synod_option_ketubbah_clause:0 "A Clause in the Ketubbah"
 kehillah_synod_option_ketubbah_clause_desc:0 "$EFFECT_LIST_BULLET$ Every marriage contract written under your rite will carry the husband's oath not to take a second wife\n#weak The law still allows it. The bride's family need no longer accept it.#!"
 kehillah_synod_option_gentile_courts:0 "No Appeal to Gentile Courts"
 kehillah_synod_option_gentile_courts_desc:0 "$EFFECT_LIST_BULLET$ No Jew may bring a fellow Jew before a gentile court without the Bet Din's leave\n#weak The sages of Troyes held that a quarrel taken to the lord's court is a quarrel the whole community pays for.#!"
 kehillah_synod_option_informers:0 "The Ban on Informers"
 kehillah_synod_option_informers_desc:0 "$EFFECT_LIST_BULLET$ Whoever informs on a fellow Jew to the authorities is put under the ban\n#weak One malshin can do more harm than a year of bad harvests.#!"
 kehillah_synod_option_hayishuv:0 "Herem ha-Yishuv"
 kehillah_synod_option_hayishuv_desc:0 "$EFFECT_LIST_BULLET$ No newcomer may settle in a community without its consent\n#weak It protects the livelihoods of the households already there. It shuts the door on those who have nowhere else to go.#!"
 kehillah_synod_option_letters:0 "No Reading Another's Letters"
 kehillah_synod_option_letters_desc:0 "$EFFECT_LIST_BULLET$ Renew Rabbenu Gershom's ban on opening a letter meant for someone else\n#weak The responsa that bind the scattered communities travel by letter. They must arrive unread.#!"

 kehillah_synod.0101.t:0 "The Synod Opens"
 kehillah_synod.0101.desc:0 "The delegates have taken their places. The motion is yours to put to them.\n\n"
 kehillah_synod_motion_herem_polygamy:0 "The motion is to renew the ban of Rabbenu Gershom: no man of these communities may take a second wife."
 kehillah_synod_motion_ketubbah_clause:0 "The motion is that every ketubbah written under this rite will carry the husband's oath not to take a second wife."
 kehillah_synod_motion_gentile_courts:0 "The motion is that no Jew may bring a fellow Jew before a gentile court without the Bet Din's leave."
 kehillah_synod_motion_informers:0 "The motion is to place under the ban anyone who informs on a fellow Jew to the authorities."
 kehillah_synod_motion_hayishuv:0 "The motion is that no newcomer may settle in a community of this rite without its consent."
 kehillah_synod_motion_letters:0 "The motion is to renew Gershom's ban on reading a letter meant for someone else."
 kehillah_synod.0101.a:0 "Argue from the sources, and from the sages before us."
 kehillah_synod.0101.b:0 "Argue from what the people suffer without it."
 kehillah_synod.0101.c:0 "Say nothing. Let the delegates weigh it themselves."
 kehillah_synod_argument_won:0 "The delegates are persuaded"
 kehillah_synod_argument_lost:0 "The delegates are unmoved"

 kehillah_synod.0102.t:0 "The Synod Votes"
 kehillah_synod.0102.desc:0 "[kehillah_synod_host.GetTitledFirstName] has put the motion to the synod, and each delegate must now give their voice.\n\n"
 kehillah_synod.0102.a:0 "I vote for it."
 kehillah_synod.0102.b:0 "I vote against it."

 kehillah_synod.0103.t:0 "The Synod Rises"
 kehillah_synod.0103.desc.passed:0 "The votes are counted, and the motion carries. The scribes write out the takkanah, and the delegates carry copies home to their communities."
 kehillah_synod.0103.desc.failed:0 "The votes are counted, and the motion fails. The delegates leave politely, and some of them are already talking about the next synod."
 kehillah_synod.0103.desc.no_quorum:0 "Too few of the rite's communities sent delegates. Without a quorum, the synod cannot bind anyone, and it rises without a ruling."
 kehillah_synod.0103.a:0 "Record the ruling."
 # 2026-11-25 dynamic agenda (docs/spec/2026-11-25-dynamic-synod-agenda.md)
 kehillah_synod_kind_marriage:0 "A question of marriage"
 kehillah_synod_kind_ordinance:0 "An ordinance for the communities"
 kehillah_synod_kind_headship:0 "The headship of our rite"
 kehillah_synod_kind_undertaking:0 "A common undertaking"
 kehillah_synod_kind_back:0 "Return to the agenda."
 kehillah_synod_kind_none:0 "Conclude without a proposal."
 kehillah_synod_kind_none_tt:0 "No proposal is put to a vote and no proposal prestige is spent."
 kehillah_synod.0105.t:0 "An Ordinance for the Communities"
 kehillah_synod.0106.t:0 "A Question of Marriage"
 kehillah_synod.0106.desc:0 "What a man may promise a woman, and what the community may forbid him, has been argued since Rabbenu Gershom's day. What will you ask the delegates to bind?"
 kehillah_synod.0107.t:0 "A Common Undertaking"
 kehillah_synod.0107.desc:0 "Some burdens no single community can carry. The delegates may pledge their communities to carry one together. Which will you ask of them?"
 kehillah_synod.0108.t:0 "Nominate a Head of Our Rite"
 kehillah_synod.0108.desc:0 "These attending academy heads qualify for the vacant headship. The delegates will vote on the person you nominate.\n\nThis uses the existing Gaonate office. A headship cannot be created here while that shared office is occupied."
 kehillah_synod_option_head_self:0 "Put myself forward."
 kehillah_synod_option_head_self_desc:0 "$EFFECT_LIST_BULLET$ If the delegates carry it, you become head of our rite\n#weak Some will call it presumption. Others will say no one else has the learning.#!"
 kehillah_synod_option_head_delegate:0 "Put forward [kehillah_synod_best_delegate.GetName]."
 kehillah_synod_option_head_delegate_desc:0 "$EFFECT_LIST_BULLET$ If the delegates carry it, [kehillah_synod_best_delegate.GetName] becomes head of our rite\n#weak The most eminent head of an academy at this sitting.#!"
 kehillah_synod_motion_head_of_rite:0 "The motion is that [kehillah_synod_nominee.GetName] be acknowledged as head of our rite."
 kehillah_synod_head_named_tt:0 "[kehillah_synod_nominee.GetName] becomes head of our rite."
 kehillah_synod_head_lapsed_tt:0 "The nominee can no longer take the headship. The motion lapses."
 kehillah_synod_option_captives:0 "A Fund for Captives"
 kehillah_synod_option_captives_desc:0 "$EFFECT_LIST_BULLET$ Every community of the rite gives toward the ransom of captives\n#weak Pidyon shevuyim comes before feeding the poor and clothing the naked. A captive's family cannot wait for one town's purse.#!"
 kehillah_synod_motion_captives:0 "The motion is that every community of the rite keep a fund for the ransom of captives, and give to it now."
 kehillah_synod_captives_tt:0 "Every community bound by the ruling gives what it can afford toward the fund."
 kehillah_synod_option_fast:0 "A Public Fast"
 kehillah_synod_option_fast_desc:0 "$EFFECT_LIST_BULLET$ Every community of the rite keeps a day of fasting and prayer together\n#weak In a hard season the communities' prayers rise together, or not at all.#!"
 kehillah_synod_motion_fast:0 "The motion is that every community of the rite keep a public fast on a single day, with the same prayers."
 kehillah_synod_fast_tt:0 "Every community bound by the ruling keeps the fast: its leader gains piety, and its people draw together."
 kehillah_synod_option_levy:0 "A Levy for the Academy"
 kehillah_synod_option_levy_desc:0 "$EFFECT_LIST_BULLET$ Every community of the rite gives toward your yeshiva\n#weak Students come to it from every town. Their towns may pay for their teachers.#!"
 kehillah_synod_motion_levy:0 "The motion is that every community of the rite send a levy to the yeshiva of this gathering's host."
 kehillah_synod_levy_tt:0 "Every community bound by the ruling that can afford it sends its levy to your treasury."
 kehillah_synod_undertaking_rite_tt:0 "Every community that keeps your rite takes part, and cannot be asked to again for some years."
 kehillah_sanhedrin_undertaking_all_tt:0 "Every community of Israel takes part, and cannot be asked to again for some years."
 # 2026-11-25 law and custom (kehillah_synod.0109)
 kehillah_synod_kind_law:0 "Rite practice"
 kehillah_synod.0109.t:0 "Change Our Rite’s Practice"
 kehillah_synod.0109.desc:0 "Each proposal replaces a doctrine of our rite. Hover the doctrine names to read their game effects. The ruling affects this rite, including at a Sanhedrin.\n\nThe proposals below cover marriage, conversion policy, and clergy eligibility. Received custom already in force does not need to be renewed."
 kehillah_synod_option_law_divorce_approval:0 "No Divorce against the Wife's Will"
 kehillah_synod_option_law_divorce_approval_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('doctrine_divorce_approval').GetName( GetPlayer.GetFaith )]#!\n#weak Rabbenu Gershom's second herem: a husband may no longer send his wife away with a bill she has not accepted.#!"
 kehillah_synod_option_law_divorce_allowed:0 "Loose the Ban on Divorce"
 kehillah_synod_option_law_divorce_allowed_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('doctrine_divorce_allowed').GetName( GetPlayer.GetFaith )]#!\n#weak The Torah gave the husband the get. The herem only stayed his hand.#!"
 kehillah_synod_option_law_proselytism_encouraged:0 "Welcome Those Who Would Join Us"
 kehillah_synod_option_law_proselytism_encouraged_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('kehillah_proselytism_encouraged').GetName( GetPlayer.GetFaith )]#!\n#weak Under the Church and the Caliph a convert's teachers can die with him. Few delegates will want to answer for it.#!"
 kehillah_synod_option_law_proselytism_discouraged:0 "Turn the Convert Away Three Times"
 kehillah_synod_option_law_proselytism_discouraged_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('kehillah_proselytism_discouraged').GetName( GetPlayer.GetFaith )]#!\n#weak The old caution of the sages, and the safer road for the communities.#!"
 kehillah_synod_option_law_clergy_either:0 "Women May Teach and Lead in Prayer"
 kehillah_synod_option_law_clergy_either_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('doctrine_clerical_gender_either').GetName( GetPlayer.GetFaith )]#!\n#weak There were learned women: Rashi's daughters, the women who led prayer for other women in Worms. No synod ever went this far.#!"
 kehillah_synod_option_law_clergy_male:0 "Restore the Rabbinate to Men"
 kehillah_synod_option_law_clergy_male_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('doctrine_clerical_gender_male_only').GetName( GetPlayer.GetFaith )]#!\n#weak Undo the innovation and return to the received custom.#!"
 kehillah_synod_option_law_funeral_bewailment:0 "Let Mourners Lament Aloud"
 kehillah_synod_option_law_funeral_bewailment_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('doctrine_funeral_bewailment').GetName( GetPlayer.GetFaith )]#!\n#weak Keening women and loud lament, as in the days of Jeremiah, rather than the quiet dignity the sages urged.#!"
 kehillah_synod_option_law_funeral_stoic:0 "Return to Restrained Mourning"
 kehillah_synod_option_law_funeral_stoic_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('doctrine_funeral_stoic').GetName( GetPlayer.GetFaith )]#!\n#weak Grief within the measure the sages set.#!"
 kehillah_synod_option_law_recognition:0 "Acknowledge the Authority of the Sages"
 kehillah_synod_option_law_recognition_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('kehillah_recognition_of_sages').GetName( GetPlayer.GetFaith )]#!\n#weak A rite that acknowledges the sages may come to have a head. Spain and Kairouan once broke from Babylonia to answer to no one.#!"
 kehillah_synod_option_law_divorce_approval_loosen_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('doctrine_divorce_approval').GetName( GetPlayer.GetFaith )]#!\n#weak The Torah gave the get. Let a Bet Din grant it where the marriage cannot be saved.#!"
 kehillah_synod_option_law_clergy_either_loosen_desc:0 "$EFFECT_LIST_BULLET$ Our rite holds the doctrine #EMP [GetDoctrine('doctrine_clerical_gender_either').GetName( GetPlayer.GetFaith )]#!\n#weak Let learned men stand again beside the women who now lead us.#!"
 kehillah_synod_law_now_divorce_allowed:0 "In place of #EMP [GetDoctrine('doctrine_divorce_allowed').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_divorce_approval:0 "In place of #EMP [GetDoctrine('doctrine_divorce_approval').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_divorce_disallowed:0 "In place of #EMP [GetDoctrine('doctrine_divorce_disallowed').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_proselytism_discouraged:0 "In place of #EMP [GetDoctrine('kehillah_proselytism_discouraged').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_proselytism_encouraged:0 "In place of #EMP [GetDoctrine('kehillah_proselytism_encouraged').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_clergy_male:0 "In place of #EMP [GetDoctrine('doctrine_clerical_gender_male_only').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_clergy_either:0 "In place of #EMP [GetDoctrine('doctrine_clerical_gender_either').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_clergy_female:0 "In place of #EMP [GetDoctrine('doctrine_clerical_gender_female_only').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_funeral_stoic:0 "In place of #EMP [GetDoctrine('doctrine_funeral_stoic').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_funeral_bewailment:0 "In place of #EMP [GetDoctrine('doctrine_funeral_bewailment').GetName( GetPlayer.GetFaith )]#!"
 kehillah_synod_law_now_funeral_other:0 "In place of our rite's present custom of mourning"
 kehillah_synod_motion_rite_doctrine:0 "The proposal is to replace [kehillah_synod_previous_doctrine.GetName( GetPlayer.GetFaith )] with [kehillah_synod_proposed_doctrine.GetName( GetPlayer.GetFaith )] in the host’s rite."
 kehillah_synod_rite_doctrine_tt:0 "This rite adopts [kehillah_synod_proposed_doctrine.GetName( GetPlayer.GetFaith )]."
 kehillah_synod_controversy_none_tt:0 "Controversy: #P None#!. The rest of the faith already keeps it."
 kehillah_synod_controversy_minor_tt:0 "Controversy: #P Minor#!. Few delegates will object."
 kehillah_synod_controversy_moderate_tt:0 "Controversy: #N Moderate#!. It sets our rite apart from the faith. The delegates will resist, and a ruling will divide the communities."
 kehillah_synod_controversy_major_tt:0 "Controversy: #N Major#!. Many delegates will refuse it, and a ruling will deeply divide the communities."
 kehillah_synod_controversy_grave_tt:0 "Controversy: #N Grave#!. It breaks with all received custom. Few will vote for it, and a ruling will tear the communities apart."
 kehillah_synod_practice_category_tt:0 "Change a doctrine of your rite: marriage, conversion policy, or clergy eligibility. Only alternatives allowed by the game are offered."
 kehillah_synod_authority:0 "Leadership and discipline"
 kehillah_synod_authority_tt:0 "Nominate an eligible academy head, or put a named leader already in Niddui before the delegates for Herem."
 kehillah_synod.0110.t:0 "Leadership and Discipline"
 kehillah_synod.0110.desc:0 "The gathering may recognise a head for a headless rite, or pronounce Herem on a leader already in Niddui. Only matters with an eligible candidate or target appear."
 kehillah_synod_sanction_named:0 "Pronounce Herem on [kehillah_synod_herem_target.GetName]."
 kehillah_synod_sanction_tt:0 "If passed and still valid, applies the existing Herem system to this named leader. This is a personal sanction, not a new doctrine."
 kehillah_synod_headship_choice_tt:0 "Choose among up to three eligible attending academy heads, ranked by the existing headship merit score."
 kehillah_synod_nominate_tt:0 "If the vote passes and the nominee still qualifies, grants the existing head-of-rite office. No new succession law is created."
 kehillah_synod_nominate_1:0 "Nominate [kehillah_synod_candidate_1.GetName]."
 kehillah_synod_practice_option_1:0 "[kehillah_synod_practice_1.GetGroup.GetName( ROOT.Char.GetFaith )]: [kehillah_synod_practice_1.GetName( ROOT.Char.GetFaith )]"
 kehillah_synod_practice_option_1_tt:0 "Current: [kehillah_synod_practice_old_1.GetName( ROOT.Char.GetFaith )]\nProposed: [kehillah_synod_practice_1.GetName( ROOT.Char.GetFaith )]\nApplies to your rite. The doctrine tooltip describes its game effects."
 kehillah_synod_nominate_2:0 "Nominate [kehillah_synod_candidate_2.GetName]."
 kehillah_synod_practice_option_2:0 "[kehillah_synod_practice_2.GetGroup.GetName( ROOT.Char.GetFaith )]: [kehillah_synod_practice_2.GetName( ROOT.Char.GetFaith )]"
 kehillah_synod_practice_option_2_tt:0 "Current: [kehillah_synod_practice_old_2.GetName( ROOT.Char.GetFaith )]\nProposed: [kehillah_synod_practice_2.GetName( ROOT.Char.GetFaith )]\nApplies to your rite. The doctrine tooltip describes its game effects."
 kehillah_synod_nominate_3:0 "Nominate [kehillah_synod_candidate_3.GetName]."
 kehillah_synod_practice_option_3:0 "[kehillah_synod_practice_3.GetGroup.GetName( ROOT.Char.GetFaith )]: [kehillah_synod_practice_3.GetName( ROOT.Char.GetFaith )]"
 kehillah_synod_practice_option_3_tt:0 "Current: [kehillah_synod_practice_old_3.GetName( ROOT.Char.GetFaith )]\nProposed: [kehillah_synod_practice_3.GetName( ROOT.Char.GetFaith )]\nApplies to your rite. The doctrine tooltip describes its game effects."
