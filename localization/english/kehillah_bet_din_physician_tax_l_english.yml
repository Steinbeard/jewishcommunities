l_english:
 kehillah_bet_din.0451.t:0 "The Physician's Tax Relief"
 kehillah_bet_din.0451.desc:0 "[kbd_litigant_a.GetFirstName] treats poor neighbors without charge and asks that service to count against the communal levy. [kbd_litigant_b.GetFirstName] speaks for assessors who say the work cannot be measured. Winter sickness is coming; the court must reward care without shifting an unearned tax share onto others."
 kehillah_bet_din.0451.a:0 "Exempt the physician from this year's levy."
 kehillah_bet_din.0451.a.tt:0 "Care is rewarded now, but an unverified claim makes neighbors pay the difference."
 kehillah_bet_din.0451.b:0 "Record free visits and grant temporary relief."
 kehillah_bet_din.0451.b.tt:0 "The court funds modest relief while checking patients and costs."
 kehillah_bet_din.0451.c:0 "Collect the full levy and leave service uncompensated."
 kehillah_bet_din.0451.c.tt:0 "The ledger stays simple, but proven service receives no recognition."
 kehillah_din_source_45:0 "Cite a mastered Nezikin work and compare service with the levy."
 kehillah_din_source_45_tt:0 "Mishnah Bava Batra 1:5 is an analogy for shared public costs. It does not count these visits."
 kehillah_din_combo_45:0 "Have a scholar and steward verify visits without delaying care."
 kehillah_din_combo_45_tt:0 "The judges compare treatment records and assessments before fixing relief."
 kehillah_bet_din.0454.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0454.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0454.outcome_1:0 "The court strikes the physician's name from the levy roll."
 kehillah_bet_din.0454.outcome_2:0 "The court grants temporary relief and asks patients to confirm the unpaid visits."
 kehillah_bet_din.0454.outcome_3:0 "The court collects the full tax despite the physician's petition."
 kehillah_bet_din.0454.fact_true:0 "The visit list includes paid work and names never treated. A full exemption shifted an unjust share to neighbors."
 kehillah_bet_din.0454.fact_false:0 "Patients confirm regular free care. Denying every allowance ignored a real communal service."
 kehillah_bet_din.0454.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0454.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0454.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case45_one_tt:0 "A full exemption costs substantial Prosperity."
 kehillah_din_case45_two_tt:0 "Temporary relief and review cost some Prosperity."
 kehillah_din_case45_three_tt:0 "Full collection costs less now but may discourage free care."
 kehillah_bet_din_case45_great_log_title:0 "The Physician's Tax Relief: a well-supported ruling"
 kehillah_bet_din_case45_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s tax-relief request."
 kehillah_bet_din_case45_good_log_title:0 "The Physician's Tax Relief: a workable ruling"
 kehillah_bet_din_case45_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s tax-relief request."
 kehillah_bet_din_case45_poor_log_title:0 "The Physician's Tax Relief: a disputed ruling"
 kehillah_bet_din_case45_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s tax-relief request."
