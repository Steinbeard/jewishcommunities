l_english:
 kehillah_bet_din.0981.t:0 "The Disputed Court Fee"
 kehillah_bet_din.0981.desc:0 "[kbd_litigant_a.GetFirstName] asks the court to hear a small debt. [kbd_litigant_b.GetFirstName] says the clerk's newly demanded fee is larger than the debt itself. The clerk calls it a customary charge, but no schedule is posted."
 kehillah_bet_din.0981.a:0 "Collect the fee before opening the case."
 kehillah_bet_din.0981.a.tt:0 "An unapproved charge can close the court to poorer neighbors."
 kehillah_bet_din.0981.b:0 "Hear the claim and inspect the fee account."
 kehillah_bet_din.0981.b.tt:0 "Review costs time but keeps the claim accessible."
 kehillah_bet_din.0981.c:0 "Abolish all hearing fees at once."
 kehillah_bet_din.0981.c.tt:0 "The court may lose a legitimate way to pay its clerk."
 kehillah_din_source_98:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_98_tt:0 "Mishnah Sanhedrin 1:1 gives the judges a textual point of reference. It cannot establish whether this fee was authorized."
 kehillah_din_combo_98:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_98_tt:0 "The judges preserve both parties' interests while checking whether this fee was authorized."
 kehillah_bet_din.0984.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0984.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0984.outcome_1:0 "The clerk collects the demanded fee."
 kehillah_bet_din.0984.outcome_2:0 "The claim is heard while the officers inspect fee approvals and costs."
 kehillah_bet_din.0984.outcome_3:0 "All hearing fees are canceled."
 kehillah_bet_din.0984.fact_true:0 "The clerk raised the fee without communal approval. Collection denied access on a private demand."
 kehillah_bet_din.0984.fact_false:0 "The posted schedule authorizes a modest fee. Blanket abolition leaves the clerk unpaid."
 kehillah_bet_din.0984.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0984.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0984.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case98_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case98_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case98_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
