l_english:
 kehillah_synod_vote_for_log:0 "[CHARACTER.GetTitledFirstName] voted for the synod’s proposal."
 kehillah_synod_vote_against_log:0 "[CHARACTER.GetTitledFirstName] voted against the synod’s proposal."
 kehillah_synod_vote_for_log_title:0 "A Vote in Favour"
 kehillah_synod_vote_against_log_title:0 "A Vote Against"
 kehillah_synod_vote_for_toast:0 "[kehillah_synod_voter.GetTitledFirstName] votes for the proposal"
 kehillah_synod_vote_against_toast:0 "[kehillah_synod_voter.GetTitledFirstName] votes against the proposal"
 kehillah_synod_result_head_appointed:0 "The motion carried. [kehillah_synod_nominee.GetTitledFirstName] has received the Gaonate and is now recognised as head of the rite. The appointment is already in effect. Open the rite’s page to see its Head of Rite; this is distinct from the faith’s religious head."
 kehillah_synod_result_head_unconfirmed:0 "The motion carried and [kehillah_synod_nominee.GetTitledFirstName] holds the Gaonate, but the game has not registered the nominee as head of the rite. The appointment could not be confirmed."
 kehillah_synod_result_head_already:0 "The motion carried. [kehillah_synod_nominee.GetTitledFirstName] already holds the Gaonate and is recognised as head of the rite, so no new appointment was needed."
 kehillah_synod_result_enacted:0 "The motion carried and the ruling is already in effect."
 kehillah_synod_result_lapsed:0 "The motion carried, but the proposal no longer met its requirements when the sitting closed. It was not enacted."
 kehillah_synod_result_tally:0 "\n\nFor: [ROOT.Char.MakeScope.Var('kehillah_synod_result_for').GetValue|0]   Against: [ROOT.Char.MakeScope.Var('kehillah_synod_result_against').GetValue|0]   Not cast: [ROOT.Char.MakeScope.Var('kehillah_synod_result_uncast').GetValue|0]\n\nHover Record the ruling for the named roll call. Individual votes are also recorded in the activity log. As sponsor, the host’s vote supports the proposal."
 kehillah_synod_result_recorded_tt:0 "Acknowledges the result. Valid rulings have already taken effect; this button does not grant the office."
 kehillah_synod_roll_for_header:0 "Voted for:"
 kehillah_synod_roll_against_header:0 "Voted against:"
 kehillah_synod_roll_uncast_header:0 "Did not cast a vote:"
 kehillah_synod_roll_name:0 "[kehillah_synod_voter.GetTitledFirstName]"
 kehillah_synod_head_unconfirmed_tt:0 "The game did not confirm both title ownership and recognition as head of rite."
