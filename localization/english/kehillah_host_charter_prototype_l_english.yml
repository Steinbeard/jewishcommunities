 # V16 committed-charter notices. These are deliberately reports, not a
 # second negotiation UI: the player opens the ordinary Host Charter to alter
 # terms, while the bespoke pillar strip and community ledger show effects.
 kehillah_charter_notice_unresolved:0 "Awaiting charter record"
 # 2026-10-29: .0004 is a letter from the host ruler. Its voice follows the
 # ruler's outlook band, frozen in the event as scope:kehillah_charter_tone
 # (-2 hostile .. +2 protective). The voice is flavour; the clauses are the
 # cached terms, and the footer names the outlook the voice came from.
 kehillah_settlement_conditions.0004.t:0 "A Charter Is Sealed"
 kehillah_settlement_conditions.0004.t_renewed:0 "The Charter Renewed"

 kehillah_settlement_conditions.0004.opening.christian.protective:0 "To [ROOT.Char.GetFirstName] and the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], our beloved Jews: grace, and our protection."
 kehillah_settlement_conditions.0004.opening.christian.well_disposed:0 "To [ROOT.Char.GetFirstName] and the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]: greeting, and our favour."
 kehillah_settlement_conditions.0004.opening.christian.indifferent:0 "To the Jews of the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], by these presents:"
 kehillah_settlement_conditions.0004.opening.christian.cold:0 "To the Jews of the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], who dwell in our realm by our leave:"
 kehillah_settlement_conditions.0004.opening.christian.hostile:0 "To the Jews of the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], whom we suffer to remain:"
 kehillah_settlement_conditions.0004.opening.muslim.protective:0 "In the name of God, the Compassionate, the Merciful. To [ROOT.Char.GetFirstName] and the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], people of the covenant: peace, and our protection."
 kehillah_settlement_conditions.0004.opening.muslim.well_disposed:0 "In the name of God, the Compassionate, the Merciful. To [ROOT.Char.GetFirstName] and the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], people of the covenant."
 kehillah_settlement_conditions.0004.opening.muslim.indifferent:0 "In the name of God. To the dhimmis of the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], by order of the diwan:"
 kehillah_settlement_conditions.0004.opening.muslim.cold:0 "In the name of God. To the Jews of the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], who live by the terms of the dhimma:"
 kehillah_settlement_conditions.0004.opening.muslim.hostile:0 "In the name of God. To the Jews of the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], who live among the believers on sufferance:"

 kehillah_settlement_conditions.0004.why.fresh.christian:0 "Be it known that we have set down the terms under which you may dwell in our realm, and have sealed them with our seal."
 kehillah_settlement_conditions.0004.why.fresh.muslim:0 "Be it known that our diwan has set down the terms of the covenant under which you may dwell in our lands, and that we have witnessed them."
 kehillah_settlement_conditions.0004.why.renewed.christian:0 "Your community has a new head, and [ROOT.Char.GetFirstName] has asked that its privileges be confirmed in a new name. We have had the old charter copied out again and sealed."
 kehillah_settlement_conditions.0004.why.renewed.muslim:0 "Your community has a new head, and [ROOT.Char.GetFirstName] has asked that its covenant be confirmed in a new name. Our scribes have copied it out again, and we have witnessed it."
 kehillah_settlement_conditions.0004.why.new_ruler.christian:0 "This realm has passed into our hands, and with it the oversight of the Jews who live in it. The agreement you held with our predecessor is ended, and we have caused new terms to be recorded."
 kehillah_settlement_conditions.0004.why.new_ruler.muslim:0 "These lands have passed into our hands, and with them the oversight of the people of the covenant who live in them. The agreement you held with our predecessor is ended, and our diwan has recorded new terms."

 kehillah_settlement_conditions.0004.voice.christian.protective:0 "We hold you as our own, a treasure of our chamber. Let no lord, bishop or burgher trouble you in your persons, your houses or your synagogue, and let none of you be dragged to the font against your will."
 kehillah_settlement_conditions.0004.voice.christian.well_disposed:0 "Your people have been useful to our realm and quiet in it. Keep to these terms and you will find us a fair lord."
 kehillah_settlement_conditions.0004.voice.christian.indifferent:0 "The following has been entered in our chancery and binds you and our officers alike."
 kehillah_settlement_conditions.0004.voice.christian.cold:0 "We have been asked to look kindly on you, and we have looked. Keep to your quarter, keep your accounts honest, and keep out of the affairs of Christians."
 kehillah_settlement_conditions.0004.voice.christian.hostile:0 "The law obliges us to grant you terms, and so we grant them, and not one clause more. Do not mistake our seal for our goodwill."
 kehillah_settlement_conditions.0004.voice.muslim.protective:0 "You are under the protection of God and His Messenger, and under ours. Let no governor or tax-farmer take from you more than the covenant allows, and let your synagogues stand."
 kehillah_settlement_conditions.0004.voice.muslim.well_disposed:0 "Your people have served the treasury well and kept the peace of the city. Keep the covenant and you will find our diwan just."
 kehillah_settlement_conditions.0004.voice.muslim.indifferent:0 "The following has been entered in the registers of the diwan and binds you and our officials alike."
 kehillah_settlement_conditions.0004.voice.muslim.cold:0 "Pay the jizya on its day, build no house above the houses of the believers, and give us no cause to read this covenant a second time."
 kehillah_settlement_conditions.0004.voice.muslim.hostile:0 "The law of God obliges us to grant the covenant to the people of the Book, and so we grant it, to the letter and no further. Do not mistake our seal for our favour."

 kehillah_settlement_conditions.0004.terms.christian:0 "\n\n$kehillah_charter_terms_block_christian$"
 kehillah_settlement_conditions.0004.terms.muslim:0 "\n\n$kehillah_charter_terms_block_muslim$"

 kehillah_settlement_conditions.0004.close.protective:0 "\n\nWhoever harms you harms us, and will answer to us for it."
 kehillah_settlement_conditions.0004.close.well_disposed:0 "\n\nWhoever wrongs you against these terms shall answer to our officers."
 kehillah_settlement_conditions.0004.close.indifferent:0 "\n\nGiven under our seal."
 kehillah_settlement_conditions.0004.close.cold:0 "\n\nWe shall be watching how you keep them."
 kehillah_settlement_conditions.0004.close.hostile:0 "\n\nOverstep them by a hair, and we will remember every clause we might have written instead."

 kehillah_settlement_conditions.0004.footer:0 "\n\n#weak [kehillah_charter_host.GetTitledFirstNameNoTooltip]'s outlook on the Jews: [kehillah_charter_host.Custom('KehillahOutlookBand')]. These terms bear on your community's wellbeing. The Host Charter is where you may seek to renegotiate them.#!"
 kehillah_settlement_conditions.0004.footer.new_ruler:0 "\n\n#weak [kehillah_charter_host.GetTitledFirstNameNoTooltip]'s outlook on the Jews: [kehillah_charter_host.Custom('KehillahOutlookBand')].#!\n#EMP The new ruler's personal posture#!: [kehillah_charter_host.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"

 kehillah_settlement_conditions.0004.a.protective:0 "Bless the hand that sealed it"
 kehillah_settlement_conditions.0004.a.well_disposed:0 "Receive the charter with thanks"
 kehillah_settlement_conditions.0004.a.indifferent:0 "File it with the community's papers"
 kehillah_settlement_conditions.0004.a.cold:0 "Read it twice, and say nothing"
 kehillah_settlement_conditions.0004.a.hostile:0 "Put it away, and bar the door"
 kehillah_charter_terms_block_christian:0 "#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Talmudic Study#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]"
 kehillah_charter_terms_block_muslim:0 "#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Market Access#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]"

 kehillah_settlement_conditions.0005.t:0 "Charters Under Your Rule"
 kehillah_settlement_conditions.0005.single.desc:0 "A Jewish community in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] now holds a Host Charter under your rule.\n\nYour Jewish Settlement Policy is [ROOT.Char.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]. It establishes the frontier for future settlement and negotiations, while this community's particular agreement remains its own."
 kehillah_settlement_conditions.0005.multiple.desc:0 "[ROOT.Char.MakeScope.Var('kehillah_charter_notice_count').GetValue|V0] Jewish communities in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] now hold Host Charters under your rule.\n\nYour Jewish Settlement Policy is [ROOT.Char.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]. It establishes the frontier for future settlement and negotiations, while each community's particular agreement remains its own."
 kehillah_settlement_conditions.0005.a:0 "Record the charters"

 kehillah_settlement_conditions.0006.t:0 "A New Steward of the Charters"
 kehillah_settlement_conditions.0006.single.desc:0 "With your accession, you now stand as suzerain over one Jewish community and its existing Host Charter. The agreement remains in force; this change of ruler has not silently rewritten it.\n\n#EMP Your personal posture toward Jewish subjects#!: [ROOT.Char.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"
 kehillah_settlement_conditions.0006.multiple.desc:0 "With your accession, you now stand as suzerain over [ROOT.Char.MakeScope.Var('kehillah_charter_steward_community_count').GetValue|V0] Jewish communities and their existing Host Charters. The agreements remain in force; this change of ruler has not silently rewritten them.\n\n#EMP Your personal posture toward Jewish subjects#!: [ROOT.Char.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charters.#!"
 kehillah_settlement_conditions.0006.a:0 "Honor the existing charters"

 kehillah_settlement_conditions.0007.t:0 "A New Steward for Your Charter"
 kehillah_settlement_conditions.0007.christian.desc:0 "[ROOT.Char.GetLiege.GetShortUINameNoTooltip] now holds suzerainty over your community. Your Host Charter remains in force; its current terms are:\n\n#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Talmudic Study#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]\n\n#EMP The new ruler's personal posture#!: [kehillah_charter_host.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"
 kehillah_settlement_conditions.0007.muslim.desc:0 "[ROOT.Char.GetLiege.GetShortUINameNoTooltip] now holds suzerainty over your community. Your Host Charter remains in force; its current terms are:\n\n#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Market Access#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]\n\n#EMP The new ruler's personal posture#!: [kehillah_charter_host.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"
 kehillah_settlement_conditions.0007.a:0 "Acknowledge the succession"

