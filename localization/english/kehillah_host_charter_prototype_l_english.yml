 # V16 committed-charter notices. These are deliberately reports, not a
 # second negotiation UI: the player opens the ordinary Host Charter to alter
 # terms, while the bespoke pillar strip and community ledger show effects.
 kehillah_charter_notice_unresolved:0 "Awaiting charter record"
 kehillah_settlement_conditions.0004.t:0 "A Charter Is Sealed"
 kehillah_settlement_conditions.0004.christian.desc:0 "The terms under which [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] dwells in its host realm are now recorded. The realm's policy constrains future negotiations; these are the rights your community actually holds.\n\n#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Talmudic Study#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]\n\n#weak These terms now inform your quarterly pillar baselines. Review the Host Charter to negotiate them later.#!"
 kehillah_settlement_conditions.0004.muslim.desc:0 "The terms under which [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] dwells in its host realm are now recorded. The realm's policy constrains future negotiations; these are the rights your community actually holds.\n\n#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Market Access#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]\n\n#weak These terms now inform your quarterly pillar baselines. Review the Host Charter to negotiate them later.#!"
 kehillah_settlement_conditions.0004.suzerain_changed.christian.desc:0 "[ROOT.Char.GetLiege.GetShortUINameNoTooltip] is now the new steward of your host realm. The former agreement has ended; the charter now recorded for [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] states the rights your community actually holds.\n\n#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Talmudic Study#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]\n\n#EMP The new ruler's personal posture#!: [ROOT.Char.GetLiege.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"
 kehillah_settlement_conditions.0004.suzerain_changed.muslim.desc:0 "[ROOT.Char.GetLiege.GetShortUINameNoTooltip] is now the new steward of your host realm. The former agreement has ended; the charter now recorded for [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] states the rights your community actually holds.\n\n#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Market Access#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]\n\n#EMP The new ruler's personal posture#!: [ROOT.Char.GetLiege.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"
 kehillah_settlement_conditions.0004.a:0 "Receive the charter"

 kehillah_settlement_conditions.0005.t:0 "Charters Under Your Rule"
 kehillah_settlement_conditions.0005.single.desc:0 "A Jewish community in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] now holds a Host Charter under your rule.\n\nYour Jewish Settlement Policy is [ROOT.Char.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]. It establishes the frontier for future settlement and negotiations, while this community's particular agreement remains its own."
 kehillah_settlement_conditions.0005.multiple.desc:0 "[ROOT.Char.MakeScope.Var('kehillah_charter_notice_count').GetValue|V0] Jewish communities in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] now hold Host Charters under your rule.\n\nYour Jewish Settlement Policy is [ROOT.Char.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]. It establishes the frontier for future settlement and negotiations, while each community's particular agreement remains its own."
 kehillah_settlement_conditions.0005.a:0 "Record the charters"

 kehillah_settlement_conditions.0006.t:0 "A New Steward of the Charters"
 kehillah_settlement_conditions.0006.single.desc:0 "With your accession, you now stand as suzerain over one Jewish community and its existing Host Charter. The agreement remains in force; this change of ruler has not silently rewritten it.\n\n#EMP Your personal posture toward Jewish subjects#!: [ROOT.Char.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"
 kehillah_settlement_conditions.0006.multiple.desc:0 "With your accession, you now stand as suzerain over [ROOT.Char.MakeScope.Var('kehillah_charter_steward_community_count').GetValue|V0] Jewish communities and their existing Host Charters. The agreements remain in force; this change of ruler has not silently rewritten them.\n\n#EMP Your personal posture toward Jewish subjects#!: [ROOT.Char.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charters.#!"
 kehillah_settlement_conditions.0006.a:0 "Honor the existing charters"

 kehillah_settlement_conditions.0007.t:0 "A New Steward for Your Charter"
 kehillah_settlement_conditions.0007.christian.desc:0 "[ROOT.Char.GetLiege.GetShortUINameNoTooltip] now holds suzerainty over your community. Your Host Charter remains in force; its current terms are:\n\n#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Talmudic Study#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]\n\n#EMP The new ruler's personal posture#!: [ROOT.Char.GetLiege.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"
 kehillah_settlement_conditions.0007.muslim.desc:0 "[ROOT.Char.GetLiege.GetShortUINameNoTooltip] now holds suzerainty over your community. Your Host Charter remains in force; its current terms are:\n\n#EMP Quarter Construction#!: [ROOT.Char.Custom('KehillahCharterNoticeConstruction')]\n#EMP Community Security#!: [ROOT.Char.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction#!: [ROOT.Char.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Market Access#!: [ROOT.Char.Custom('KehillahCharterNoticeKnowledgeOrTrade')]\n\n#EMP The new ruler's personal posture#!: [ROOT.Char.GetLiege.Custom('KehillahCharterStewardPosture')]\n#weak This is a provisional reading of character, not a legal forecast or an automatic change to the charter.#!"
 kehillah_settlement_conditions.0007.a:0 "Acknowledge the succession"

