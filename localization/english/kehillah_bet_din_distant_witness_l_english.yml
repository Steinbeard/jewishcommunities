l_english:
 kehillah_bet_din.0811.t:0 "The Missing Witness Across the Border"
 kehillah_bet_din.0811.desc:0 "[kbd_litigant_a.GetFirstName] offers a letter from a witness in a distant city to prove a merchant debt. [kbd_litigant_b.GetFirstName] disputes its handwriting and asks for sworn testimony. The witness cannot travel before the caravan leaves. The court must preserve the claim without turning an unverified letter into a verdict."
 kehillah_bet_din.0811.a:0 "Accept the letter and award the debt now."
 kehillah_bet_din.0811.a.tt:0 "The claimant is paid, but a forged letter could determine the case."
 kehillah_bet_din.0811.b:0 "Secure the claim and seek an authenticated deposition."
 kehillah_bet_din.0811.b.tt:0 "Security and a messenger cost money while testimony is checked."
 kehillah_bet_din.0811.c:0 "Reject distant testimony altogether."
 kehillah_bet_din.0811.c.tt:0 "A genuine witness may be silenced by a blanket rejection."
 kehillah_din_source_81:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_81_tt:0 "Mishnah Sanhedrin 3:6 gives the judges a textual point of reference. It cannot establish the letter's writer and certification."
 kehillah_din_combo_81:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_81_tt:0 "The judges preserve both parties' interests while checking the letter's writer and certification."
 kehillah_bet_din.0814.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0814.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0814.outcome_1:0 "The court awards the debt on the letter."
 kehillah_bet_din.0814.outcome_2:0 "The court secures the claim and asks the distant court to certify the testimony."
 kehillah_bet_din.0814.outcome_3:0 "The court rejects the letter and closes the claim."
 kehillah_bet_din.0814.fact_true:0 "The distant court cannot confirm the handwriting. An immediate award rested on uncertain proof."
 kehillah_bet_din.0814.fact_false:0 "The court certifies the witness and seal. Blanket rejection lost reliable testimony."
 kehillah_bet_din.0814.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0814.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0814.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case81_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case81_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case81_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case81_great_log_title:0 "The Missing Witness Across the Border: a well-supported ruling"
 kehillah_bet_din_case81_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the missing witness across the border dispute."
 kehillah_bet_din_case81_good_log_title:0 "The Missing Witness Across the Border: a workable ruling"
 kehillah_bet_din_case81_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the missing witness across the border dispute."
 kehillah_bet_din_case81_poor_log_title:0 "The Missing Witness Across the Border: a disputed ruling"
 kehillah_bet_din_case81_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the missing witness across the border dispute."
