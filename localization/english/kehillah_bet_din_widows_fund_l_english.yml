l_english:
 kehillah_bet_din.0461.t:0 "The Restricted Relief Fund"
 kehillah_bet_din.0461.desc:0 "[kbd_litigant_a.GetFirstName] speaks for elders facing hungry children during a siege. [kbd_litigant_b.GetFirstName] keeps a fund given for widows and fears breaking the donor's terms. Both widows and children need bread. The deed may allow emergency use, but it has not been read since the siege began."
 kehillah_bet_din.0461.a:0 "Open the widows' fund to every hungry child."
 kehillah_bet_din.0461.a.tt:0 "Children eat, but a strict gift could leave widows without their promised support."
 kehillah_bet_din.0461.b:0 "Feed children from general stores while reading the deed."
 kehillah_bet_din.0461.b.tt:0 "A general meal costs money while the court checks what may be shared."
 kehillah_bet_din.0461.c:0 "Reserve the fund for widows and deny other aid."
 kehillah_bet_din.0461.c.tt:0 "Widows remain protected, but a flexible gift could have fed more children."
 kehillah_din_source_46:0 "Cite a mastered Zeraim work and distinguish the needy groups."
 kehillah_din_source_46_tt:0 "Mishnah Peah 8:8 discusses who may receive poor relief. It does not rewrite this donor's deed."
 kehillah_din_combo_46:0 "Have a scholar and steward feed children while checking the gift."
 kehillah_din_combo_46_tt:0 "The judges protect both widows and children until the deed is read."
 kehillah_bet_din.0464.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0464.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0464.outcome_1:0 "The court opens the dedicated chest for children's meals."
 kehillah_bet_din.0464.outcome_2:0 "The court feeds children from common stores and asks for the donor's deed."
 kehillah_bet_din.0464.outcome_3:0 "The court reserves the chest for widows and turns other petitioners away."
 kehillah_bet_din.0464.fact_true:0 "The deed names widows alone, without an emergency clause. Opening the chest broke that promise."
 kehillah_bet_din.0464.fact_false:0 "The deed permits relief to any hungry household in crisis. Refusing the children wasted available food."
 kehillah_bet_din.0464.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0464.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0464.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case46_one_tt:0 "Opening the fund costs substantial Prosperity."
 kehillah_din_case46_two_tt:0 "General meals and review cost some Prosperity."
 kehillah_din_case46_three_tt:0 "Refusal costs less now but may leave children hungry."
