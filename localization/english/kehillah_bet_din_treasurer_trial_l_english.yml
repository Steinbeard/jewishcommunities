l_english:
 kehillah_bet_din.0951.t:0 "The Communal Officer on Trial"
 kehillah_bet_din.0951.desc:0 "[kbd_litigant_a.GetFirstName] accuses the communal treasurer of hiding a payment. [kbd_litigant_b.GetFirstName] offers to stand trial, but has named two close allies for the bench. The ledger is available; confidence in those who read it is not."
 kehillah_bet_din.0951.a:0 "Accept the proposed bench and hear the account today."
 kehillah_bet_din.0951.a.tt:0 "A friendly bench may clear its own patron."
 kehillah_bet_din.0951.b:0 "Choose independent judges and audit the ledger."
 kehillah_bet_din.0951.b.tt:0 "New judges cost time, but their ruling can command trust."
 kehillah_bet_din.0951.c:0 "Remove the treasurer before hearing the charge."
 kehillah_bet_din.0951.c.tt:0 "An innocent officer could lose both office and reputation."
 kehillah_din_source_95:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_95_tt:0 "Mishnah Sanhedrin 3:4 gives the judges a textual point of reference. It cannot establish the judges' interest in the account."
 kehillah_din_combo_95:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_95_tt:0 "The judges preserve both parties' interests while checking the judges' interest in the account."
 kehillah_bet_din.0954.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0954.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0954.outcome_1:0 "The treasurer's chosen bench hears the charge."
 kehillah_bet_din.0954.outcome_2:0 "Independent judges take the ledger and hear both parties."
 kehillah_bet_din.0954.outcome_3:0 "The treasurer is removed without a hearing."
 kehillah_bet_din.0954.fact_true:0 "The proposed judges share a financial interest with the treasurer. Their acquittal could not settle the charge."
 kehillah_bet_din.0954.fact_false:0 "The ledger clears the treasurer. Removal punished an officer without cause."
 kehillah_bet_din.0954.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0954.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0954.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case95_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case95_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case95_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case95_great_log_title:0 "The Communal Officer on Trial: a well-supported ruling"
 kehillah_bet_din_case95_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the communal officer on trial dispute."
 kehillah_bet_din_case95_good_log_title:0 "The Communal Officer on Trial: a workable ruling"
 kehillah_bet_din_case95_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the communal officer on trial dispute."
 kehillah_bet_din_case95_poor_log_title:0 "The Communal Officer on Trial: a disputed ruling"
 kehillah_bet_din_case95_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the communal officer on trial dispute."
