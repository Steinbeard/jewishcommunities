l_english:
 kehillah_ledger_news.0001.t:0 "A New Sefer"
 kehillah_ledger_news.0001.desc:0 "Word has reached me that [kehillah_ledger_author.GetTitledFirstName] has finished a new book: #italic [Localize( Concatenate( 'kehillah_lib_name_', ROOT.Char.MakeScope.Var( 'kehillah_ledger_news_work' ).GetFlagName ) )]#!, a work of [Localize( Concatenate( 'kehillah_lib_subject_', ROOT.Char.MakeScope.Var( 'kehillah_ledger_news_work' ).GetFlagName ) )].\n\nIn my rite it is held [Localize( Concatenate( 'KEHILLAH_STANDING_FMT_', IntToString( FixedPointToInt( ROOT.Char.MakeScope.ScriptValue( Concatenate( 'kehillah_lib_standing_', ROOT.Char.MakeScope.Var( 'kehillah_ledger_news_work' ).GetFlagName ) ) ) ) ) )] for now. #weak The opinion of a new book shifts as more people read it: some will praise it, others may ban it.#!"
 kehillah_ledger_news.0001.copy:0 "I must have a copy!"
 kehillah_ledger_news.0001.copy.tt:0 "Seek a copy for my library, as from the Ledger of Sefarim."
 kehillah_ledger_news.0001.study:0 "I must study it!"
 kehillah_ledger_news.0001.study.tt:0 "I will seek the book out. When I study it, my success chance is #P +10%#!."
 kehillah_ledger_news.0001.note:0 "Interesting. I will hear more of it in time."
 kehillah_ledger_news.0001.condemn:0 "This book must be condemned."
 kehillah_ledger_news.0001.condemn.tt:0 "Ban the book with a #N cherem#!, unread. Its standing in my rite falls, and a living author of my rite is rebuked."
 KEHILLAH_LEDGER_NEWS_WISHED_FACTOR:0 "A new book I set out to study"
