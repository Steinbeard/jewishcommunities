l_english:
 kehillah_bet_din.0301.t:0 "The Scholar's Unpaid Salary"
 kehillah_bet_din.0301.desc:0 "[kbd_litigant_a.GetFirstName] speaks for communal officers who stopped a schoolmaster's wages after parents complained of missed lessons. [kbd_litigant_b.GetFirstName] speaks for the teacher, who says illness accounted for only a few days. The school needs a teacher next week; the court must settle pay without pretending every complaint is proof."
 kehillah_bet_din.0301.a:0 "Withhold the full salary and hire a replacement."
 kehillah_bet_din.0301.a.tt:0 "The school gets a fresh start, but proved teaching would make the withheld wages unjust."
 kehillah_bet_din.0301.b:0 "Pay an advance and compare lesson records with witnesses."
 kehillah_bet_din.0301.b.tt:0 "The teacher receives some pay while attendance and agreed duties are checked."
 kehillah_bet_din.0301.c:0 "Pay the full salary and renew the appointment."
 kehillah_bet_din.0301.c.tt:0 "The school keeps continuity, but missed lessons could leave parents paying for work not done."
 kehillah_din_source_30:0 "Cite a mastered Nezikin work and examine the teaching contract."
 kehillah_din_source_30_tt:0 "Mishnah Bava Metzia 7:1 discusses the force of local work terms. It does not establish which lessons this teacher delivered."
 kehillah_din_combo_30:0 "Have a scholar and steward compare the contract with the school roll."
 kehillah_din_combo_30_tt:0 "The judges pay an advance while hearing parents, pupils and the teacher."
 kehillah_bet_din.0304.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0304.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0304.outcome_1:0 "The court withholds wages and instructs officers to seek another teacher."
 kehillah_bet_din.0304.outcome_2:0 "The court advances wages and calls parents and pupils to compare lesson records."
 kehillah_bet_din.0304.outcome_3:0 "The court pays the full term and renews the teaching contract."
 kehillah_bet_din.0304.fact_true:0 "Pupils and records confirm that most lessons were taught. Full withholding denied earned wages."
 kehillah_bet_din.0304.fact_false:0 "Several promised weeks have no lessons or substitute. Full payment ignored the missing work."
 kehillah_bet_din.0304.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0304.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0304.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case30_one_tt:0 "Hiring anew costs the community substantial Prosperity."
 kehillah_din_case30_two_tt:0 "An advance and inquiry cost some Prosperity."
 kehillah_din_case30_three_tt:0 "Full pay costs less in court but may waste school funds."
 kehillah_bet_din_case30_great_log_title:0 "The Scholar's Unpaid Salary: a well-supported ruling"
 kehillah_bet_din_case30_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s withheld teaching wages."
 kehillah_bet_din_case30_good_log_title:0 "The Scholar's Unpaid Salary: a workable ruling"
 kehillah_bet_din_case30_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s withheld teaching wages."
