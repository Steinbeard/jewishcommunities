 kehillah_din_title_1:0 "A Dowry Beyond Reach"
 kehillah_din_source_1:0 "Use Ketubot to negotiate a smaller dowry without prolonging the betrothal."
 kehillah_din_source_1_tt:0 "#P Source argument#!: Talmud Bavli, Seder Nashim (Ketubot 109a). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_1:0 "Negotiate instalments with a judge who can check the accounts."
 kehillah_din_combo_1_tt:0 "Available because the acting judge is compassionate with at least 10 Diplomacy, and another seated judge has at least 12 Stewardship. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_1:0 "Marry her or release her. Ketubot 109a discusses a promised dowry that was not paid and the position of the betrothed woman. It does not simply erase every dowry debt."
 kehillah_din_question_1:0 "A family promised a dowry it can no longer pay. The other household insists on the original sum. Must the marriage wait on the debt, or can the families agree to a smaller payment?\n\n[Glossary( 'O kenos o petor', 'KEHILLAH_DIN_QUOTE_1' )]\n\nThe relevant discussion is in Talmud Bavli, Seder Nashim. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_1:0 "[kds_asking_title.GetName] has sent a question:\n\nA family promised a dowry it can no longer pay. The other household insists on the original sum. Must the marriage wait on the debt, or can the families agree to a smaller payment?\n\n[Glossary( 'O kenos o petor', 'KEHILLAH_DIN_QUOTE_1' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_1:0 "Ketubot distinguishes the woman's position from the unpaid promise. Seek a settlement that lets the marriage proceed; the claim to the money still needs an agreement."
 kehillah_din_title_2:0 "The Agunah's Plea"
 kehillah_din_source_2:0 "Apply Yevamot: withhold permission until the testimony establishes death."
 kehillah_din_source_2_tt:0 "#P Source argument#!: Talmud Bavli, Seder Nashim (Yevamot 121a). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_2:0 "Reconstruct the journey with a judge skilled at questioning witnesses."
 kehillah_din_combo_2_tt:0 "Available because the acting judge is patient with at least 12 Learning, and another seated judge has at least 12 Intrigue. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_2:0 "Water whose limits cannot be seen. Yevamot 121a distinguishes kinds of drowning testimony and the possibility of survival. Absence alone is not proof of death."
 kehillah_din_question_2:0 "A missing husband is said to have drowned, but no body has been identified. His wife asks leave to remarry. Which details of the witness account would make it sufficient?\n\n[Glossary( 'Mayim she-ein lahem sof', 'KEHILLAH_DIN_QUOTE_2' )]\n\nThe relevant discussion is in Talmud Bavli, Seder Nashim. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_2:0 "[kds_asking_title.GetName] has sent a question:\n\nA missing husband is said to have drowned, but no body has been identified. His wife asks leave to remarry. Which details of the witness account would make it sufficient?\n\n[Glossary( 'Mayim she-ein lahem sof', 'KEHILLAH_DIN_QUOTE_2' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_2:0 "Ask where the witness stood, what could be seen, and whether escape was possible. The report as given does not establish death; withhold permission on this evidence."
 kehillah_din_title_3:0 "The Second Wife"
 kehillah_din_source_3:0 "Explain the first wife's rights before leaving the marriage custom unchanged."
 kehillah_din_source_3_tt:0 "#P Source argument#!: Mekhilta (Exodus 21:10; Mekhilta, Mishpatim). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_3:0 "Review household obligations with a judge learned in marriage law."
 kehillah_din_combo_3_tt:0 "Available because the acting judge is just with at least 12 Stewardship, and another seated judge has at least 12 Learning. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_3:0 "He must not reduce her food, clothing or marital rights. Exodus 21:10 is discussed in the Mekhilta on Mishpatim. These duties do not themselves settle whether a community should adopt a ban on plural marriage."
 kehillah_din_question_3:0 "A prosperous man has taken a second wife. His first wife's relatives seek a communal ban. Can the first household's rights be protected without changing the marriage rule?\n\n[Glossary( 'Sheerah kesutah veonatah lo yigra', 'KEHILLAH_DIN_QUOTE_3' )]\n\nThe relevant discussion is in Mekhilta. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_3:0 "[kds_asking_title.GetName] has sent a question:\n\nA prosperous man has taken a second wife. His first wife's relatives seek a communal ban. Can the first household's rights be protected without changing the marriage rule?\n\n[Glossary( 'Sheerah kesutah veonatah lo yigra', 'KEHILLAH_DIN_QUOTE_3' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_3:0 "The first wife retains claims to maintenance and marital duties. Enforce those obligations; the verse alone does not require a new communal ban."
 kehillah_din_title_4:0 "The Recalcitrant Husband"
 kehillah_din_source_4:0 "Cite Gittin: refuse coercion without sufficient grounds."
 kehillah_din_source_4_tt:0 "#P Source argument#!: Talmud Bavli, Seder Nashim (Gittin 88b). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_4:0 "Agree on communal pressure with a judge who can defend its legal basis."
 kehillah_din_combo_4_tt:0 "Available because the acting judge is compassionate with at least 12 Diplomacy, and another seated judge has at least 12 Learning. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_4:0 "A coerced bill of divorce. Gittin 88b distinguishes lawful from unlawful coercion. A court must establish its authority and grounds; physical force is not a general remedy for refusal."
 kehillah_din_question_4:0 "A husband refuses to grant a get. The court is considering communal exclusion or physical coercion. What must be established before such pressure can produce a valid divorce?\n\n[Glossary( 'Get hameusseh', 'KEHILLAH_DIN_QUOTE_4' )]\n\nThe relevant discussion is in Talmud Bavli, Seder Nashim. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_4:0 "[kds_asking_title.GetName] has sent a question:\n\nA husband refuses to grant a get. The court is considering communal exclusion or physical coercion. What must be established before such pressure can produce a valid divorce?\n\n[Glossary( 'Get hameusseh', 'KEHILLAH_DIN_QUOTE_4' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_4:0 "Gittin distinguishes coercion with lawful grounds from coercion without them. The letter does not establish those grounds. Do not order force on the account supplied."
 kehillah_din_title_5:0 "A Cursed Amulet"
 kehillah_din_source_5:0 "Cite Shabbat: unusual letters alone do not establish guilt."
 kehillah_din_source_5_tt:0 "#P Source argument#!: Talmud Bavli, Seder Moed (Shabbat 61a-b). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_5:0 "Examine the parchment while another judge checks the scribe's account."
 kehillah_din_combo_5_tt:0 "Available because the acting judge is diligent with at least 12 Learning, and another seated judge has at least 12 Intrigue. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_5:0 "An established or proven amulet. Shabbat 61a-b discusses experience with the amulet and its maker in the laws of carrying on the Sabbath. Unfamiliar writing or subsequent illness alone does not prove malicious intent."
 kehillah_din_question_5:0 "A buyer blames an amulet for illness and misfortune. Its maker says the unfamiliar letters follow a received formula. What can the court infer from the writing, and what requires evidence?\n\n[Glossary( 'Kamea mumhe', 'KEHILLAH_DIN_QUOTE_5' )]\n\nThe relevant discussion is in Talmud Bavli, Seder Moed. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_5:0 "[kds_asking_title.GetName] has sent a question:\n\nA buyer blames an amulet for illness and misfortune. Its maker says the unfamiliar letters follow a received formula. What can the court infer from the writing, and what requires evidence?\n\n[Glossary( 'Kamea mumhe', 'KEHILLAH_DIN_QUOTE_5' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_5:0 "The discussion of amulets examines their maker and prior use. It does not make unfamiliar letters proof of a curse. Reject that inference unless other evidence establishes misconduct."
 kehillah_din_title_6:0 "The Silversmiths' Quarrel"
 kehillah_din_source_6:0 "Cite Bava Kamma: dismiss a claim unsupported by proof."
 kehillah_din_source_6_tt:0 "#P Source argument#!: Talmud Bavli, Seder Nezikin (Bava Kamma 46a). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_6:0 "Trace the alleged payments with a judge who understands the accounts."
 kehillah_din_combo_6_tt:0 "Available because the acting judge is just with at least 12 Intrigue, and another seated judge has at least 12 Stewardship. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_6:0 "The claimant must bring the proof. Bava Kamma 46a assigns the burden of proof in a disputed monetary claim. Rivalry and suspicion alone do not establish liability for another person's loss."
 kehillah_din_question_6:0 "A silversmith accuses a competitor of arranging an attack on the shop. A name shouted in the crowd and a commercial rivalry are the evidence offered. Can the court order compensation?\n\n[Glossary( 'Hamotzi me-havero alav ha-raayah', 'KEHILLAH_DIN_QUOTE_6' )]\n\nThe relevant discussion is in Talmud Bavli, Seder Nezikin. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_6:0 "[kds_asking_title.GetName] has sent a question:\n\nA silversmith accuses a competitor of arranging an attack on the shop. A name shouted in the crowd and a commercial rivalry are the evidence offered. Can the court order compensation?\n\n[Glossary( 'Hamotzi me-havero alav ha-raayah', 'KEHILLAH_DIN_QUOTE_6' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_6:0 "The loss is real, but the claimant must prove the competitor caused it. Dismiss this claim on the evidence supplied. That does not prevent a later claim supported by witnesses."
 kehillah_din_title_7:0 "A Captive's Ransom"
 kehillah_din_source_7:0 "Cite the Mishnah and negotiate within the customary limit."
 kehillah_din_source_7_tt:0 "#P Source argument#!: Mishnah (Mishnah Gittin 4:6). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_7:0 "Gather private pledges with a judge who can assess what donors can afford."
 kehillah_din_combo_7_tt:0 "Available because the acting judge is compassionate with at least 12 Diplomacy, and another seated judge has at least 12 Stewardship. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_7:0 "For the ordering of communal life. Mishnah Gittin 4:6 limits excessive ransom payments. Gittin 45a debates communal hardship and the incentive to take further captives; it does not give blanket approval to every privately funded exception."
 kehillah_din_question_7:0 "Captors demand an unusually large ransom. The family asks the community to meet it; others fear exhausting the treasury and encouraging more seizures. What should the court promise?\n\n[Glossary( 'Mipnei tikkun ha-olam', 'KEHILLAH_DIN_QUOTE_7' )]\n\nThe relevant discussion is in Mishnah. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_7:0 "[kds_asking_title.GetName] has sent a question:\n\nCaptors demand an unusually large ransom. The family asks the community to meet it; others fear exhausting the treasury and encouraging more seizures. What should the court promise?\n\n[Glossary( 'Mipnei tikkun ha-olam', 'KEHILLAH_DIN_QUOTE_7' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_7:0 "Keep the offer within the customary limit and continue negotiations. The family's distress is urgent, but it does not remove the risks the Mishnah addresses."
 kehillah_din_title_8:0 "The Charity Chest"
 kehillah_din_source_8:0 "Appoint two collectors and three distributors under the rule in Bava Batra."
 kehillah_din_source_8_tt:0 "#P Source argument#!: Talmud Bavli, Seder Nezikin (Bava Batra 8b). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_8:0 "Fund immediate relief while another judge settles the contributors' objections."
 kehillah_din_combo_8_tt:0 "Available because the acting judge is generous with at least 12 Stewardship, and another seated judge has at least 12 Diplomacy. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_8:0 "The charity fund is collected by two. Bava Batra 8b describes collection by two and distribution by three, separating the handling of public funds from decisions about individual need."
 kehillah_din_question_8:0 "A collector both receives donations and decides who receives aid. Several donors demand public accounts; poor households fear losing their weekly bread while the dispute is heard. How should the fund be administered?\n\n[Glossary( 'Kupah nigbet bishnayim', 'KEHILLAH_DIN_QUOTE_8' )]\n\nThe relevant discussion is in Talmud Bavli, Seder Nezikin. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_8:0 "[kds_asking_title.GetName] has sent a question:\n\nA collector both receives donations and decides who receives aid. Several donors demand public accounts; poor households fear losing their weekly bread while the dispute is heard. How should the fund be administered?\n\n[Glossary( 'Kupah nigbet bishnayim', 'KEHILLAH_DIN_QUOTE_8' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_8:0 "Separate collection from distribution and appoint the required number of trustworthy people. Review the accounts without making the poor wait for their food."
 kehillah_din_title_9:0 "A Shared Courtyard"
 kehillah_din_source_9:0 "Recognize the loss of privacy and divide the cost of a proper partition."
 kehillah_din_source_9_tt:0 "#P Source argument#!: Talmud Bavli, Seder Nezikin (Bava Batra 2b). Available through the acting judge's personal mastery, a reply accepted for this case, or the community's recorded precedent. Personal mastery contributes 26 to the ruling; a detailed reply 24, a brief reply 20, and an archived opinion 22. These replace this judge's ordinary contribution; they do not add another judge."
 kehillah_din_combo_9:0 "Agree on a cheaper screen with a judge who can cost the work."
 kehillah_din_combo_9_tt:0 "Available because the acting judge is patient with at least 12 Diplomacy, and another seated judge has at least 12 Stewardship. Their combined work contributes 24 to the ruling."
 KEHILLAH_DIN_QUOTE_9:0 "Harm caused by overlooking another's private space. Bava Batra 2b debates privacy and partition walls. The discussion supplies an argument to consider local use and obligations, not a universal building specification."
 kehillah_din_question_9:0 "Two households share a courtyard. One wants a partition for privacy; the other cannot afford the wall demanded. Should both pay for a full wall, agree on a cheaper screen, or leave the yard open?\n\n[Glossary( 'Hezek reiyah', 'KEHILLAH_DIN_QUOTE_9' )]\n\nThe relevant discussion is in Talmud Bavli, Seder Nezikin. A named scholar can advise before the court hears the case; the court will still choose its ruling."
 kehillah_din_letter_9:0 "[kds_asking_title.GetName] has sent a question:\n\nTwo households share a courtyard. One wants a partition for privacy; the other cannot afford the wall demanded. Should both pay for a full wall, agree on a cheaper screen, or leave the yard open?\n\n[Glossary( 'Hezek reiyah', 'KEHILLAH_DIN_QUOTE_9' )]\n\nYou can offer a short answer, spend time addressing the objections, or decline to judge the account supplied. A book gives you an argument; it cannot supply missing facts."
 kehillah_din_answer_9:0 "Consider the loss of privacy as a real harm. Check local practice and divide the expense of an adequate partition, rather than leaving one household to bear it alone."
 kehillah_din_hear_locally:0 "We have enough to hear the case ourselves."
 kehillah_din_consult:0 "Ask [kds_candidate.GetTitledFirstName] for a responsum."
 kehillah_din_consult_tt:0 "Send the question to this rabbi, who has mastered the relevant book. Allow six days for the exchange. If no reply arrives within twelve days, the hearing proceeds locally. Only one question at a time can be addressed to this rabbi."
 kehillah_din_letter_title:0 "A Court Requests Your Opinion"
 kehillah_din_brief:0 "Send a concise opinion from the source."
 kehillah_din_careful:0 "Address the objections as well as the rule."
 kehillah_din_decline:0 "These facts do not justify an opinion. Say so."
 kehillah_din_brief_tt:0 "Your reply gives the court a source argument worth 20. You gain 5 Learning Lifestyle Experience. The court decides whether to use it."
 kehillah_din_careful_tt:0 "Your learning and patient or scholarly habits support a fuller answer, worth 24 to the court. The extra work costs 10 Stress and grants 10 Learning Lifestyle Experience."
 kehillah_din_decline_tt:0 "Send a refusal. The court proceeds without a source argument from you."
 kehillah_din_reply_title:0 "[kds_author.GetTitledFirstName] Answers the Court"
 kehillah_din_accept:0 "Make this argument available to the presiding judge."
 kehillah_din_accept_tt:0 "The opinion unlocks a specific source argument at the hearing. It becomes a community precedent only if that argument is actually used. The other judges may still challenge the proposed ruling."
 kehillah_din_set_aside:0 "Proceed with the hearing on our own judgment."
 kehillah_din_refusal_desc:0 "[kds_author.GetTitledFirstName] declines to give an opinion on the facts supplied. The court must hear the case with the evidence and learning available here."
 kehillah_din_third_desc:0 "The other judges have set out their arguments. Before the ruling is recorded, you may assess the proposal, offer a source of your own, or work with a colleague on a different approach."
 kehillah_din_review:0 "Review the proposed ruling and the evidence."
 kehillah_din_review_tt:0 "With at least 10 Learning, your review contributes 20 to the ruling. Otherwise it subtracts 12. The proposed outcome is unchanged."
 kehillah_din_adopted_title:0 "Your Responsum Is Cited"
 kehillah_din_adopted_desc:0 "The asking court has used your argument and preserved the letter as a precedent. Your reputation as a scholar grows."
 kehillah_din_consulted_opinion:0 "Consulted My Learning"
 kehillah_bet_din.0071.t:0 "The Charity Chest"
 kehillah_bet_din.0071.desc:0 "[kbd_litigant_a.GetFirstName] collects gifts for the poor and decides which households receive them. [kbd_litigant_b.GetFirstName] has stopped contributing, demanding to see the accounts. The collector says publishing every name would shame families who need help.\n\nThe bread must be bought this week. The court needs an arrangement the donors can trust without turning each household's poverty into public business."
 kehillah_bet_din.0071.a:0 "Appoint separate collectors and distributors."
 kehillah_bet_din.0071.a.tt:0 "The presiding judge tests Stewardship 12. Communal Prosperity -4 to administer the new arrangements."
 kehillah_bet_din.0071.b:0 "Pay for this week's relief while the accounts are examined."
 kehillah_bet_din.0071.b.tt:0 "The presiding judge tests Diplomacy 12. You pay 10 Gold and gain 15 Piety."
 kehillah_bet_din.0071.c:0 "Leave the collector in charge."
 kehillah_bet_din.0071.c.tt:0 "The presiding judge tests Learning 10. No immediate expense; communal Stability -5."
 kehillah_bet_din.0073.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0073.desc:0 "The ruling and the reasons for it are entered in the court record. The arrangements will be judged by what they cost and whether the households can live with them."
 kehillah_bet_din_case8_great_log_title:0 "The Charity Chest: a well-supported ruling"
 kehillah_bet_din_case8_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on the charity fund [TARGET_CHARACTER.GetFirstName] collects. The donors accept the arrangement, and the poor are fed without being named."
 kehillah_bet_din_case8_good_log_title:0 "The Charity Chest: a workable ruling"
 kehillah_bet_din_case8_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on the charity fund [TARGET_CHARACTER.GetFirstName] collects. The arrangement will hold, though not every donor is satisfied."
 kehillah_bet_din_case8_poor_log_title:0 "The Charity Chest: an unconvincing ruling"
 kehillah_bet_din_case8_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling on the charity fund [TARGET_CHARACTER.GetFirstName] collects persuaded neither the donors nor the collector."
 kehillah_bet_din.0081.t:0 "A Shared Courtyard"
 kehillah_bet_din.0081.desc:0 "[kbd_litigant_a.GetFirstName] and [kbd_litigant_b.GetFirstName] share a courtyard. Since a dividing screen fell, each household can see the other's meals, washing and visitors. One wants a stone partition; the other says the expense would consume the year's savings.\n\nThey ask the court to decide what privacy requires and who must pay for it."
 kehillah_bet_din.0081.a:0 "Divide the cost of a proper partition."
 kehillah_bet_din.0081.a.tt:0 "The presiding judge tests Learning 12. Communal Prosperity -10 and Stability +8 for the partition."
 kehillah_bet_din.0081.b:0 "Arrange a cheaper screen by agreement."
 kehillah_bet_din.0081.b.tt:0 "The presiding judge tests Diplomacy 12. Communal Prosperity -4 and Stability +3 for the screen."
 kehillah_bet_din.0081.c:0 "Require no new partition."
 kehillah_bet_din.0081.c.tt:0 "The presiding judge tests Stewardship 10. No construction expense; communal Stability -4."
 kehillah_bet_din.0083.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0083.desc:0 "The ruling and the reasons for it are entered in the court record. The arrangements will be judged by what they cost and whether the households can live with them."
 kehillah_bet_din_case9_great_log_title:0 "A Shared Courtyard: a well-supported ruling"
 kehillah_bet_din_case9_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on the courtyard [TARGET_CHARACTER.GetFirstName] shares with a neighbor. Both households accept what privacy requires and who pays for it."
 kehillah_bet_din_case9_good_log_title:0 "A Shared Courtyard: a workable ruling"
 kehillah_bet_din_case9_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on the courtyard [TARGET_CHARACTER.GetFirstName] shares with a neighbor. The arrangement is workable, if grudgingly kept."
 kehillah_bet_din_case9_poor_log_title:0 "A Shared Courtyard: an unconvincing ruling"
 kehillah_bet_din_case9_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling on the courtyard [TARGET_CHARACTER.GetFirstName] shares with a neighbor settled nothing either household believes in."
 kehillah_din_record:0 "Record the judgment."
 kehillah_din_charity_board_tt:0 "Separate collectors and distributors take responsibility for the fund. Communal Prosperity falls by 4 to cover administration."
 kehillah_din_charity_relief_tt:0 "Your payment covers immediate relief while the accounts are examined. You pay 10 Gold and gain 15 Piety."
 kehillah_din_charity_unfunded_tt:0 "The promised relief cannot be funded. Communal Stability falls by 5."
 kehillah_din_charity_unchanged_tt:0 "The collector remains in charge. Some donors continue to withhold support; communal Stability falls by 5."
 kehillah_din_wall_tt:0 "The households divide the expense of the partition. Communal Prosperity falls by 10 and Stability rises by 8."
 kehillah_din_screen_tt:0 "The households agree on a cheaper screen. Communal Prosperity falls by 4 and Stability rises by 3."
 kehillah_din_open_court_tt:0 "The courtyard stays open. The expense is avoided, but communal Stability falls by 4."
