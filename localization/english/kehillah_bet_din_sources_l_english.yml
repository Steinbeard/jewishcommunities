l_english:

 kehillah_din_title_1:0 "A Dowry Beyond Reach"
 kehillah_din_source_1:0 "Cite [Glossary( 'O kenos o petor', 'KEHILLAH_DIN_QUOTE_1' )]: seek a dowry the couple can live with."
 kehillah_din_source_1_tt:0 "The acting judge needs mastery of Bavli Nashim, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_1:0 "Negotiate instalments with a judge who can check the accounts."
 kehillah_din_combo_1_tt:0 "Requires Diplomacy 10 and either the Compassionate trait or 30 Talmudics experience, plus another seated judge with Stewardship 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_1:0 "My father promised the money; what could I do? Marry me or release me. — Ketubot 109a."
 kehillah_din_question_1:0 "The promised dowry is gone. The bride did not undertake the debt herself, but the groom's family will not set a wedding day. Can the court reduce the sum without extinguishing a claim it has not heard?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_1:0 "[kds_asking_title.GetName] asks your opinion:\n\nA bride's father promised a dowry he can no longer pay. The groom's family will not set a wedding day. She asks why she must wait for a promise she did not make. What can the court say about her position and the unpaid money?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_1:0 "[kds_author.GetTitledFirstName] replies: Ketubot gives the bride a claim against an endless wait. The two families should settle the unpaid sum rather than keep her betrothed without a wedding."
 kehillah_din_title_2:0 "The Agunah's Plea"
 kehillah_din_source_2:0 "Cite [Glossary( 'Mayim she-ein lahem sof', 'KEHILLAH_DIN_QUOTE_2' )]: withhold permission on this testimony."
 kehillah_din_source_2_tt:0 "The acting judge needs mastery of Bavli Nashim, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_2:0 "Reconstruct the journey with a judge skilled at questioning witnesses."
 kehillah_din_combo_2_tt:0 "Requires Learning 12 and either the Patient trait or 30 Talmudics experience, plus another seated judge with Intrigue 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_2:0 "If the water has a visible end, she may marry; if its end cannot be seen, she may not. — Yevamot 121a."
 kehillah_din_question_2:0 "A boatman saw a husband fall into the Rhine. He watched the near bank, not the far one. Is this enough to release the wife to remarry?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_2:0 "[kds_asking_title.GetName] asks your opinion:\n\nA boatman saw a married man fall into the Rhine, but lost sight of the far shore. No body was found. His wife asks leave to remarry. Does this witness establish death?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_2:0 "[kds_author.GetTitledFirstName] replies: Yevamot distinguishes water whose shore can be watched from water whose end cannot be seen. This account does not yet establish death."
 kehillah_din_title_3:0 "The Second Wife"
 kehillah_din_source_3:0 "Cite [Glossary( 'Sheerah kesutah veonatah lo yigra', 'KEHILLAH_DIN_QUOTE_3' )]: hear the first wife's claim without imposing a ban."
 kehillah_din_source_3_tt:0 "The acting judge needs mastery of Mekhilta, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_3:0 "Review household obligations with a judge learned in marriage law."
 kehillah_din_combo_3_tt:0 "Requires Stewardship 12 and either the Just trait or 30 Talmudics experience, plus another seated judge with Learning 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_3:0 "If he takes another wife, he must not diminish her food, clothing or marital rights. — Exodus 21:10; Mekhilta, Mishpatim."
 kehillah_din_question_3:0 "A first wife says her husband has reduced her maintenance after taking a second wife. Her kin want a communal ban. Must the court change the rule to hear her claim?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_3:0 "[kds_asking_title.GetName] asks your opinion:\n\nA man has taken a second wife. The first says she now lacks food and clothing; her kin ask for a ban on second marriages. What does the older obligation require, apart from the question of a new communal rule?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_3:0 "[kds_author.GetTitledFirstName] replies: The Mekhilta says a second marriage does not reduce the first wife's claims. The court can hear those claims without issuing a ban."
 kehillah_din_title_4:0 "The Recalcitrant Husband"
 kehillah_din_source_4:0 "Cite [Glossary( 'Get hameusseh', 'KEHILLAH_DIN_QUOTE_4' )]: withhold coercion until lawful grounds are established."
 kehillah_din_source_4_tt:0 "The acting judge needs mastery of Bavli Nashim, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_4:0 "Agree on communal pressure with a judge who can defend its legal basis."
 kehillah_din_combo_4_tt:0 "Requires Diplomacy 12 and either the Compassionate trait or 30 Talmudics experience, plus another seated judge with Learning 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_4:0 "A divorce compelled lawfully by a Jewish court is valid; one compelled without lawful grounds is invalid. — Gittin 88b."
 kehillah_din_question_4:0 "A husband refuses a get. His wife asks the court to press him, but the account gives no grounds for force. Can pressure yield a valid divorce here?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_4:0 "[kds_asking_title.GetName] asks your opinion:\n\nA husband refuses to give a get. His wife asks the Bet Din to compel him, but the letter states no legal grounds for force. What must the court establish first?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_4:0 "[kds_author.GetTitledFirstName] replies: Gittin distinguishes lawful coercion from force without grounds. The court should not order force on the facts sent."
 kehillah_din_title_5:0 "A Cursed Amulet"
 kehillah_din_source_5:0 "Cite [Glossary( 'Kamea mumhe', 'KEHILLAH_DIN_QUOTE_5' )]: clear the scribe on this evidence."
 kehillah_din_source_5_tt:0 "The acting judge needs mastery of Bavli Moed, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_5:0 "Examine the parchment while another judge checks the scribe's account."
 kehillah_din_combo_5_tt:0 "Requires Learning 12 and either the Diligent trait or 30 Talmudics experience, plus another seated judge with Intrigue 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_5:0 "An amulet is proven when it has healed once, twice and a third time. — Shabbat 61a."
 kehillah_din_question_5:0 "A buyer calls an amulet a curse after his child falls ill. The scribe says he copied a received formula. What can the court learn from the letters and the maker's record?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_5:0 "[kds_asking_title.GetName] asks your opinion:\n\nA buyer found unfamiliar letters inside an amulet after his child fell ill. He accuses its scribe of a curse. The scribe says he followed his teacher's formula. Does the text or its maker's standing establish harm?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_5:0 "[kds_author.GetTitledFirstName] replies: Shabbat asks whether an amulet or its maker has proved reliable. Unfamiliar letters do not prove that the scribe cursed anyone."
 kehillah_din_title_6:0 "The Silversmiths' Quarrel"
 kehillah_din_source_6:0 "Cite [Glossary( 'Hamotzi me-havero alav ha-raayah', 'KEHILLAH_DIN_QUOTE_6' )]: require proof before ordering the rival to pay."
 kehillah_din_source_6_tt:0 "The acting judge needs mastery of Bavli Nezikin, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_6:0 "Trace the alleged payments with a judge who understands the accounts."
 kehillah_din_combo_6_tt:0 "Requires Intrigue 12 and either the Just trait or 30 Talmudics experience, plus another seated judge with Stewardship 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_6:0 "The one who seeks payment from another bears the burden of proof. — Bava Kamma 46a."
 kehillah_din_question_6:0 "A silversmith's shop was wrecked. His rival's name was shouted in the mob, but no witness saw him pay or direct it. Can the court order him to compensate the loss?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_6:0 "[kds_asking_title.GetName] asks your opinion:\n\nA mob wrecked a silver shop. The owner's rival was named in the street, but no one saw him hire or direct the attackers. The owner wants compensation. What proof must he bring?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_6:0 "[kds_author.GetTitledFirstName] replies: Bava Kamma places the burden on the claimant. The loss is clear, but the rival cannot be ordered to pay on this account alone."
 kehillah_din_title_7:0 "A Captive's Ransom"
 kehillah_din_source_7:0 "Cite [Glossary( 'Mipnei tikkun ha-olam', 'KEHILLAH_DIN_QUOTE_7' )]: set a limit and keep negotiating."
 kehillah_din_source_7_tt:0 "The acting judge needs mastery of Mishnah, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_7:0 "Gather private pledges with a judge who can assess what donors can afford."
 kehillah_din_combo_7_tt:0 "Requires Diplomacy 12 and either the Compassionate trait or 30 Talmudics experience, plus another seated judge with Stewardship 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_7:0 "Captives are not redeemed for more than their value, for the ordering of communal life. — Mishnah Gittin 4:6."
 KEHILLAH_DIN_QUOTE_7_BAVLI:0 "Is the reason the burden on the community, or that captors should not seize more people? — Gittin 45a."
 kehillah_din_question_7:0 "Captors demand more than the customary ransom. The family asks for a levy; other householders fear exhausting the chest and inviting more seizures. What may the court promise?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_7:0 "[kds_asking_title.GetName] asks your opinion:\n\nCaptors demand an excessive ransom for one of the asking community's people. The family wants the whole sum raised; others fear future kidnappings. What limit should the court set for communal money?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_7:0 "[kds_author.GetTitledFirstName] replies: The Mishnah sets a limit on excessive ransom. Send a lower offer and keep negotiating for the captive."
 kehillah_din_title_8:0 "The Charity Chest"
 kehillah_din_source_8:0 "Cite [Glossary( 'Kupah nigbet bishnayim', 'KEHILLAH_DIN_QUOTE_8' )]: separate the collection and distribution of charity."
 kehillah_din_source_8_tt:0 "The acting judge needs mastery of Bavli Nezikin, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_8:0 "Fund immediate relief while another judge settles the contributors' objections."
 kehillah_din_combo_8_tt:0 "Requires Stewardship 12 and either the Generous trait or 30 Talmudics experience, plus another seated judge with Diplomacy 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_8:0 "The charity fund is collected by two and distributed by three. — Bava Batra 8b."
 kehillah_din_question_8:0 "One collector receives donations and decides who eats. Donors demand the accounts, while poor households need bread this week. Who should administer the fund?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_8:0 "[kds_asking_title.GetName] asks your opinion:\n\nOne collector both takes gifts and distributes the charity fund. Donors have stopped giving until the accounts are shown. Poor households still need bread. What arrangement does Bava Batra require?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_8:0 "[kds_author.GetTitledFirstName] replies: Bava Batra calls for two collectors and three distributors. The court can divide the work without stopping this week's relief."
 kehillah_din_title_9:0 "A Shared Courtyard"
 kehillah_din_source_9:0 "Cite [Glossary( 'Hezek reiyah', 'KEHILLAH_DIN_QUOTE_9' )]: recognize the privacy claim and divide the cost of a wall."
 kehillah_din_source_9_tt:0 "The acting judge needs mastery of Bavli Nezikin, a reply for this case, or a recorded precedent. The argument contributes 22, 20–24, or 20 respectively to this judge's part of the ruling. The court still decides the facts."
 kehillah_din_combo_9:0 "Agree on a cheaper screen with a judge who can cost the work."
 kehillah_din_combo_9_tt:0 "Requires Diplomacy 12 and either the Patient trait or 30 Talmudics experience, plus another seated judge with Stewardship 12. Their joint argument contributes 24 to this judge's part of the ruling."
 KEHILLAH_DIN_QUOTE_9:0 "Does harm caused by another's gaze count as harm? — Bava Batra 2b."
 kehillah_din_question_9:0 "A shared courtyard lost its screen. One household wants a wall; the other cannot pay for stone. Does the loss of privacy justify dividing the cost?\n\nHear the case now, or ask a scholar outside the panel for an opinion."
 kehillah_din_letter_9:0 "[kds_asking_title.GetName] asks your opinion:\n\nA screen between two households has fallen. One asks for a stone wall; the other says it cannot afford one. How does Bava Batra treat the harm of being seen, and what expense can be shared?\n\nYou may answer from the source, address the objection in detail, or decline to advise from a letter."
 kehillah_din_answer_9:0 "[kds_author.GetTitledFirstName] replies: Bava Batra treats the loss of privacy as a matter for the court. The neighbors should divide the cost of an adequate partition."
 kehillah_din_hear_locally:0 "We have enough to hear the case ourselves."
 kehillah_din_consult:0 "Ask [kds_candidate.GetTitledFirstName] for a responsum."
 kehillah_din_consult_tt:0 "Send this question to a named rabbi who has mastered the relevant work. The hearing waits up to twelve days. A reply will appear in the hearing itself; you choose whether to cite it."
 kehillah_din_letter_title:0 "A Court Requests Your Opinion"
 kehillah_din_brief:0 "Send the source and your conclusion."
 kehillah_din_careful:0 "Work through the objection before answering."
 kehillah_din_decline:0 "These facts do not justify an opinion. Say so."
 kehillah_din_brief_tt:0 "Send a usable argument to the asking court. Gain 5 Learning Lifestyle Experience. The court may cite or set it aside."
 kehillah_din_careful_tt:0 "Your experience, Learning or scholarly habits let you answer the objection. The argument is stronger; gain 10 Learning Lifestyle Experience and 10 Stress."
 kehillah_din_decline_tt:0 "Send a refusal. The court proceeds without a source argument from you."
 kehillah_din_reply_title:0 "[kds_author.GetTitledFirstName] Answers the Court"
 kehillah_din_accept:0 "Make this argument available to the presiding judge."
 kehillah_din_accept_tt:0 "The opinion unlocks a specific source argument at the hearing. It becomes a community precedent only if that argument is actually used. The other judges may still challenge the proposed ruling."
 kehillah_din_set_aside:0 "Proceed with the hearing on our own judgment."
 kehillah_din_refusal_desc:0 "[kds_author.GetTitledFirstName] declines to give an opinion on the facts supplied. The court must hear the case with the evidence and learning available here."
 kehillah_din_third_desc:0 "The other judges have spoken. Read the proposed ruling against the testimony, cite a source you know, or work through an alternative with a colleague."
 kehillah_din_review:0 "Review the proposed ruling and the evidence."
 kehillah_din_review_tt:0 "A judge with 10 Learning or 30 Talmudics experience contributes 20 to the ruling; otherwise this review subtracts 12. It does not change the proposed judgment."
 kehillah_din_adopted_title:0 "Your Responsum Is Cited"
 kehillah_din_adopted_desc:0 "The asking court cited your letter in its ruling and kept it as a precedent. The judges there now know your name."
 kehillah_din_consulted_opinion:0 "Consulted My Learning"
 kehillah_bet_din.0071.t:0 "The Charity Chest"
 kehillah_bet_din.0071.desc:0 "[kbd_litigant_a.GetFirstName] collects for the poor and decides who receives aid. [kbd_litigant_b.GetFirstName] has stopped giving until the accounts are shown. The collector fears a public list would expose households who depend on the fund.\n\nBread is due this week. The judges must decide who handles the money while the accounts are examined."
 kehillah_bet_din.0071.a:0 "Appoint separate collectors and distributors."
 kehillah_bet_din.0071.a.tt:0 "The presiding judge tests Stewardship 12. Communal Prosperity -4 to administer the new arrangements."
 kehillah_bet_din.0071.b:0 "Pay for this week's relief while the accounts are examined."
 kehillah_bet_din.0071.b.tt:0 "The presiding judge tests Diplomacy 12. You pay 10 Gold and gain 15 Piety."
 kehillah_bet_din.0071.c:0 "Leave the collector in charge."
 kehillah_bet_din.0071.c.tt:0 "The presiding judge tests Learning 10. No immediate expense; communal Stability -5."
 kehillah_bet_din.0073.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0073.desc:0 "The judges give their ruling to the parties."
 kehillah_bet_din_case8_great_log_title:0 "The Charity Chest: a well-supported ruling"
 kehillah_bet_din_case8_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on the charity fund [TARGET_CHARACTER.GetFirstName] collects. The donors accept the arrangement, and the poor are fed without being named."
 kehillah_bet_din_case8_good_log_title:0 "The Charity Chest: a workable ruling"
 kehillah_bet_din_case8_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on the charity fund [TARGET_CHARACTER.GetFirstName] collects. The arrangement will hold, though not every donor is satisfied."
 kehillah_bet_din_case8_poor_log_title:0 "The Charity Chest: an unconvincing ruling"
 kehillah_bet_din_case8_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling on the charity fund [TARGET_CHARACTER.GetFirstName] collects persuaded neither the donors nor the collector."
 kehillah_bet_din.0081.t:0 "A Shared Courtyard"
 kehillah_bet_din.0081.desc:0 "The screen between [kbd_litigant_a.GetFirstName]'s and [kbd_litigant_b.GetFirstName]'s halves of a courtyard has fallen. Meals, washing and visitors are visible from either door. [kbd_litigant_a.GetFirstName] wants a stone wall; [kbd_litigant_b.GetFirstName] cannot meet its cost.\n\nBoth ask the court what sort of partition they owe each other."
 kehillah_bet_din.0081.a:0 "Divide the cost of a proper partition."
 kehillah_bet_din.0081.a.tt:0 "The presiding judge tests Learning 12. Communal Prosperity -10 and Stability +8 for the partition."
 kehillah_bet_din.0081.b:0 "Arrange a cheaper screen by agreement."
 kehillah_bet_din.0081.b.tt:0 "The presiding judge tests Diplomacy 12. Communal Prosperity -4 and Stability +3 for the screen."
 kehillah_bet_din.0081.c:0 "Require no new partition."
 kehillah_bet_din.0081.c.tt:0 "The presiding judge tests Stewardship 10. No construction expense; communal Stability -4."
 kehillah_bet_din.0083.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0083.desc:0 "The judges give their ruling to the parties."
 kehillah_bet_din_case9_great_log_title:0 "A Shared Courtyard: a well-supported ruling"
 kehillah_bet_din_case9_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on the courtyard [TARGET_CHARACTER.GetFirstName] shares with a neighbor. Both households accept what privacy requires and who pays for it."
 kehillah_bet_din_case9_good_log_title:0 "A Shared Courtyard: a workable ruling"
 kehillah_bet_din_case9_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on the courtyard [TARGET_CHARACTER.GetFirstName] shares with a neighbor. The arrangement is workable, if grudgingly kept."
 kehillah_bet_din_case9_poor_log_title:0 "A Shared Courtyard: an unconvincing ruling"
 kehillah_bet_din_case9_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling on the courtyard [TARGET_CHARACTER.GetFirstName] shares with a neighbor settled nothing either household believes in."
 kehillah_din_record:0 "Record the judgment."
 kehillah_din_charity_board_tt:0 "Separate collectors and distributors take responsibility for the fund. Communal Prosperity falls by 4 to cover administration."
 kehillah_din_charity_relief_tt:0 "Your payment covers immediate relief while the accounts are examined. You pay 10 Gold and gain 15 Piety."
 kehillah_din_charity_unfunded_tt:0 "The promised relief cannot be funded. Communal Stability falls by 5."
 kehillah_din_charity_unchanged_tt:0 "The collector remains in charge. Some donors continue to withhold support; communal Stability falls by 5."
 kehillah_din_wall_tt:0 "The households divide the expense of the partition. Communal Prosperity falls by 10 and Stability rises by 8."
 kehillah_din_screen_tt:0 "The households agree on a cheaper screen. Communal Prosperity falls by 4 and Stability rises by 3."
 kehillah_din_open_court_tt:0 "The courtyard stays open. The expense is avoided, but communal Stability falls by 4."
 kehillah_din_reply_arrived_1:0 "\n\n$kehillah_din_answer_1$"
 kehillah_din_reply_arrived_2:0 "\n\n$kehillah_din_answer_2$"
 kehillah_din_reply_arrived_3:0 "\n\n$kehillah_din_answer_3$"
 kehillah_din_reply_arrived_4:0 "\n\n$kehillah_din_answer_4$"
 kehillah_din_reply_arrived_5:0 "\n\n$kehillah_din_answer_5$"
 kehillah_din_reply_arrived_6:0 "\n\n$kehillah_din_answer_6$"
 kehillah_din_reply_arrived_7:0 "\n\n$kehillah_din_answer_7$"
 kehillah_din_reply_arrived_8:0 "\n\n$kehillah_din_answer_8$"
 kehillah_din_reply_arrived_9:0 "\n\n$kehillah_din_answer_9$"
 kehillah_din_reply_declined_note:0 "\n\n[kds_author.GetTitledFirstName] declines to rule from the letter. The court must decide from the testimony and learning at hand."
 kehillah_din_reply_timeout_note:0 "\n\nNo answer reaches the court before the hearing. The judges proceed without an outside opinion."
 kehillah_bet_din.0073.outcome_1:0 "Two collectors and three distributors take charge of the fund. The accounts are reviewed while bread continues to be bought."
 kehillah_bet_din.0073.outcome_2:0 "The court pays for this week's relief and examines the accounts before changing the fund's officers."
 kehillah_bet_din.0073.outcome_2_unfunded:0 "The court promises to pay for this week's relief, but the money is no longer at hand. The households waiting for bread receive no payment."
 kehillah_bet_din.0073.outcome_3:0 "The collector remains in charge. Donors who asked for an accounting may continue to withhold their gifts."
 kehillah_bet_din.0073.quality_great:0 "\n\nThe judges explain the evidence and their reasons to both sides. The court gains standing from the hearing."
 kehillah_bet_din.0073.quality_good:0 "\n\nThe judges give their reasons. Some objections remain, but the ruling can be carried out."
 kehillah_bet_din.0073.quality_poor:0 "\n\nThe reasons are disputed before the parties leave. The court loses standing over the case."
 kehillah_bet_din.0083.outcome_1:0 "The households divide the cost of a proper wall. The work will restore privacy at a substantial expense."
 kehillah_bet_din.0083.outcome_2:0 "The households agree to replace the screen at lower cost. Both give up the stone wall they wanted or feared."
 kehillah_bet_din.0083.outcome_3:0 "The court orders no new partition. The expense is avoided; neither household gets its privacy back."
 kehillah_bet_din.0083.quality_great:0 "\n\nThe judges explain the evidence and their reasons to both sides. The court gains standing from the hearing."
 kehillah_bet_din.0083.quality_good:0 "\n\nThe judges give their reasons. Some objections remain, but the ruling can be carried out."
 kehillah_bet_din.0083.quality_poor:0 "\n\nThe reasons are disputed before the parties leave. The court loses standing over the case."
 kehillah_din_answer_careful_1:0 "[kds_author.GetTitledFirstName] replies: Ketubot speaks for the bride, but it does not erase her father's promise. Hear both households on the remaining debt, then seek a sum they can meet."
 kehillah_din_reply_careful_1:0 "\n\n$kehillah_din_answer_careful_1$"
 kehillah_din_answer_careful_2:0 "[kds_author.GetTitledFirstName] replies: Ask the boatman exactly where he stood and what banks were visible. Until the court can exclude an unseen escape, Yevamot does not support permission to remarry."
 kehillah_din_reply_careful_2:0 "\n\n$kehillah_din_answer_careful_2$"
 kehillah_din_answer_careful_3:0 "[kds_author.GetTitledFirstName] replies: The wife's claim to food, clothing and marital life is distinct from the proposed ban. The court should hear what has been withheld before deciding whether a new rule is needed."
 kehillah_din_reply_careful_3:0 "\n\n$kehillah_din_answer_careful_3$"
 kehillah_din_answer_careful_4:0 "[kds_author.GetTitledFirstName] replies: The court must first say what lawful grounds it has. Without them, a forced get may not free the wife, however urgently she needs relief."
 kehillah_din_reply_careful_4:0 "\n\n$kehillah_din_answer_careful_4$"
 kehillah_din_answer_careful_5:0 "[kds_author.GetTitledFirstName] replies: Ask what the scribe has made before and whether the parchment resembles those works. The passage tests an amulet's use; it does not make a child's illness evidence of malice."
 kehillah_din_reply_careful_5:0 "\n\n$kehillah_din_answer_careful_5$"
 kehillah_din_answer_careful_6:0 "[kds_author.GetTitledFirstName] replies: The claimant may be certain, and the rival's denial may be self-serving. Neither replaces proof that he brought the mob. Dismiss this claim unless a witness or payment record appears."
 kehillah_din_reply_careful_6:0 "\n\n$kehillah_din_answer_careful_6$"
 kehillah_din_answer_careful_7:0 "[kds_author.GetTitledFirstName] replies: The Mishnah's limit protects more than today's treasury. Name the lower offer and keep a messenger with the captors; the family must know the court has not abandoned the captive."
 kehillah_din_reply_careful_7:0 "\n\n$kehillah_din_answer_careful_7$"
 kehillah_din_answer_careful_8:0 "[kds_author.GetTitledFirstName] replies: Appoint two to collect and three to distribute. Review the books without naming the recipients publicly, and keep bread going to the households that need it."
 kehillah_din_reply_careful_8:0 "\n\n$kehillah_din_answer_careful_8$"
 kehillah_din_answer_careful_9:0 "[kds_author.GetTitledFirstName] replies: The discussion weighs both the harm of being seen and the form of a division. Ask what the households shared before the screen fell, then apportion the cost of a partition that restores privacy."
 kehillah_din_reply_careful_9:0 "\n\n$kehillah_din_answer_careful_9$"
