l_english:
 kehillah_bet_din.01111.t:0 "The Widow Against the Tax Farmer"
 kehillah_bet_din.01111.desc:0 "[kbd_litigant_a.GetFirstName] collects a levy on a widow's rooms. [kbd_litigant_b.GetFirstName] says the community already exempted her small holding. The exemption register is with the previous collector, while seizure is threatened this week."
 kehillah_bet_din.01111.a:0 "Collect the levy immediately."
 kehillah_bet_din.01111.a.tt:0 "A valid exemption could be ignored."
 kehillah_bet_din.01111.b:0 "Stay seizure and inspect the register."
 kehillah_bet_din.01111.b.tt:0 "Temporary protection and record search cost the treasury a little."
 kehillah_bet_din.01111.c:0 "Forbid the collector to levy any widow."
 kehillah_bet_din.01111.c.tt:0 "A broad ban may shift valid taxes onto poorer households."
 kehillah_din_source_111:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_111_tt:0 "Mishnah Bava Batra 1:5 gives the judges a textual point of reference. It cannot establish which holding the exemption covers."
 kehillah_din_combo_111:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_111_tt:0 "The judges preserve both parties' interests while checking which holding the exemption covers."
 kehillah_bet_din.01114.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01114.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01114.outcome_1:0 "The collector takes the assessed sum."
 kehillah_bet_din.01114.outcome_2:0 "The court pauses seizure and obtains the old register."
 kehillah_bet_din.01114.outcome_3:0 "Every widow's levy is canceled."
 kehillah_bet_din.01114.fact_true:0 "The register names this holding as exempt. Immediate collection violates the communal decision."
 kehillah_bet_din.01114.fact_false:0 "The exemption covered a different property. A universal ban would erase a lawful levy."
 kehillah_bet_din.01114.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01114.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01114.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case111_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case111_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case111_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_bet_din_case111_great_log_title:0 "The Widow Against the Tax Farmer: a well-supported ruling"
 kehillah_bet_din_case111_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the widow against the tax farmer dispute."
