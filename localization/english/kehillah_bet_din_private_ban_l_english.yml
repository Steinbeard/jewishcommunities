l_english:
 kehillah_bet_din.0771.t:0 "The Rav Who Issued a Private Ban"
 kehillah_bet_din.0771.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a scholar who sanctioned a tradesman after an insult. [kbd_litigant_b.GetFirstName] says there was no warning or communal hearing. Customers have stopped visiting his shop. The court must protect its discipline from private anger while allowing a genuine public wrong to be heard."
 kehillah_bet_din.0771.a:0 "Uphold the scholar's ban immediately."
 kehillah_bet_din.0771.a.tt:0 "Authority is defended, but a ban without notice may be personal retaliation."
 kehillah_bet_din.0771.b:0 "Pause the ban and hold a hearing with witnesses."
 kehillah_bet_din.0771.b.tt:0 "A hearing costs time while the tradesman's business remains protected."
 kehillah_bet_din.0771.c:0 "Void the ban and forbid any new complaint."
 kehillah_bet_din.0771.c.tt:0 "A serious public offense could be buried by a blanket dismissal."
 kehillah_din_source_77:0 "Cite a mastered Nashim work and examine the evidence."
 kehillah_din_source_77_tt:0 "Mishnah Nedarim 1:1 gives the judges a textual point of reference. It cannot establish the warning and hearing actually given."
 kehillah_din_combo_77:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_77_tt:0 "The judges preserve both parties' interests while checking the warning and hearing actually given."
 kehillah_bet_din.0774.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0774.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0774.outcome_1:0 "The court enforces the existing ban."
 kehillah_bet_din.0774.outcome_2:0 "The court pauses the sanction and calls both sides with witnesses."
 kehillah_bet_din.0774.outcome_3:0 "The court voids the ban and closes the matter."
 kehillah_bet_din.0774.fact_true:0 "No warning or hearing preceded the sanction. Enforcement turned private offense into court power."
 kehillah_bet_din.0774.fact_false:0 "A prior hearing and warning are documented. Closing every complaint ignored that record."
 kehillah_bet_din.0774.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0774.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0774.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case77_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case77_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case77_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case77_great_log_title:0 "The Rav Who Issued a Private Ban: a well-supported ruling"
 kehillah_bet_din_case77_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the rav who issued a private ban dispute."
