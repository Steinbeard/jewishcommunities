l_english:
 # =====================================================================
 # The tenet-reform loop (2026-11-08, Sefer redesign follow-up).
 # Option and tenet names: kehillah_reform_options_l_english.yml and
 # kehillah_reform_names_l_english.yml (generated).
 # =====================================================================
 kehillah_synod_option_tenet_reform:0 "A Question of Belief"
 kehillah_synod_option_tenet_reform_desc:0 "$EFFECT_LIST_BULLET$ Raise a tenet to a core tenet of our rite, or permit, ban or free it in our faith\n$EFFECT_LIST_BULLET$ Every book that argues for it rises or falls with the ruling\n#weak The books our scholars read have raised the question; the gathering can settle it.#!"
 kehillah_synod_motion_tenet_reform:0 "The motion is [ROOT.Char.Custom('KehillahReformMotionText')]."
 kehillah_synod_motion_tenet_reform_delegate:0 "The motion is [kehillah_synod_host.Custom('KehillahReformMotionText')]."
 KEHILLAH_REFORM_MOTION_CORE:0 "that #EMP [ROOT.Char.Custom('KehillahReformTenetName')]#! be held as a core tenet of our rite, in place of #EMP [ROOT.Char.Custom('KehillahReformReplaceName')]#!"
 KEHILLAH_REFORM_MOTION_PERMIT:0 "that the teaching of #EMP [ROOT.Char.Custom('KehillahReformTenetName')]#! be permitted in our faith"
 KEHILLAH_REFORM_MOTION_BAN:0 "that #EMP [ROOT.Char.Custom('KehillahReformTenetName')]#! be banned in our faith"
 KEHILLAH_REFORM_MOTION_LIFT:0 "that the ban on #EMP [ROOT.Char.Custom('KehillahReformTenetName')]#! be lifted"
 KEHILLAH_REFORM_MOTION_NONE:0 "a question of belief"

 kehillah_reform.0001.t:0 "A Question of Belief"
 kehillah_reform.0001.desc:0 "What our scholars read shapes what they believe, and in time what they believe must be settled by a gathering of the communities. Which teaching shall I put before the delegates?"
 kehillah_reform.0001.desc_pending:0 "\n\nSince the last controversy, the rite expects this gathering to rule on #EMP [ROOT.Char.Custom('KehillahReformPendingName')]#!."
 kehillah_reform.0001.none:0 "Another matter."
 kehillah_reform.0002.t:0 "The Motion"
 kehillah_reform.0002.desc:0 "On #EMP [ROOT.Char.Custom('KehillahReformTenetName')]#!, what shall I ask of the delegates?"
 kehillah_reform.0002.core:0 "That our rite hold it as a core tenet."
 kehillah_reform.0002.core.tt:0 "If carried, it becomes a core tenet of our rite in place of another. Books that argue for it may rise as high as #EMP Venerated#! here."
 kehillah_reform.0002.permit:0 "That our faith permit its teaching."
 kehillah_reform.0002.permit.tt:0 "If carried, it is permitted in our faith. Books that argue for it may rise as high as #EMP Authoritative#!."
 kehillah_reform.0002.ban:0 "That our faith ban it."
 kehillah_reform.0002.ban.tt:0 "If carried, it is prohibited in our faith. Books that argue for it fall to #EMP Contested#! at best."
 kehillah_reform.0002.lift:0 "That our faith lift its ban."
 kehillah_reform.0002.lift.tt:0 "If carried, it is no longer prohibited. Books that argue for it may rise as high as #EMP Esteemed#!."
 kehillah_reform.0002.back:0 "Another teaching."
 kehillah_reform.0003.t:0 "In Place of Which?"
 kehillah_reform.0003.desc:0 "A rite holds only three teachings as its core. If #EMP [ROOT.Char.Custom('KehillahReformTenetName')]#! is to be one of them, another must give way."

 kehillah_reform_enacted_tt:0 "The ruling: [ROOT.Char.Custom('KehillahReformMotionText')]. Every book that argues for it is weighed again in each rite of the faith."
 kehillah_reform_msg_t:0 "A Ruling on Belief"
 kehillah_reform_msg_d:0 "A gathering of the communities has ruled [ROOT.Char.Custom('KehillahReformMotionText')]."
