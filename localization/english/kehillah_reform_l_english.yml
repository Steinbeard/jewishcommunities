l_english:
kehillah_synod_option_tenet_reform:0 "Belief and tenets"
 kehillah_synod_option_tenet_reform_desc:0 "Propose a known tenet as core to your rite. Faith-wide permission and prohibition require the Sanhedrin."
 kehillah_synod_motion_tenet_reform:0 "The proposal is [ROOT.Char.Custom('KehillahReformMotionText')]."
 kehillah_synod_motion_tenet_reform_delegate:0 "The proposal is [kehillah_synod_host.Custom('KehillahReformMotionText')]."
 KEHILLAH_REFORM_MOTION_CORE:0 "to replace [kehillah_reform_replacement.GetName( GetPlayer.GetRite )] with [kehillah_reform_topic.GetName( GetPlayer.GetRite )] as a core tenet of the host’s rite"
 KEHILLAH_REFORM_MOTION_ADD:0 "to adopt [kehillah_reform_topic.GetName( GetPlayer.GetRite )] as a core tenet of the host’s rite"
 KEHILLAH_REFORM_MOTION_PERMIT:0 "to permit [kehillah_reform_topic.GetName( GetPlayer.GetRite )] throughout the host’s faith"
 KEHILLAH_REFORM_MOTION_BAN:0 "to prohibit [kehillah_reform_topic.GetName( GetPlayer.GetRite )] throughout the host’s faith"
 KEHILLAH_REFORM_MOTION_LIFT:0 "to lift the faith-wide prohibition of [kehillah_reform_topic.GetName( GetPlayer.GetRite )], returning it to Known"
 KEHILLAH_REFORM_MOTION_NONE:0 "a question of belief"
 kehillah_reform.0001.t:0 "Known Tenets"
 kehillah_reform.0001.desc:0 "Choose a tenet you know. Hover its name for the tenet’s description and effects. Only teachings with a valid proposal are listed, three at a time. A teaching raised by a book controversy comes first when you know it and can act on it.\n\nA Synod may change its own rite’s core tenets. Faith-wide permission and prohibition require the Sanhedrin."
 kehillah_reform.more:0 "Show three more known tenets."
 kehillah_reform.back:0 "Return to the agenda."
 kehillah_reform.0002.t:0 "A Ruling on Belief"
 kehillah_reform.0002.desc:0 "[kehillah_reform_topic.GetName( ROOT.Char.GetRite )]\nCurrent standing: [ROOT.Char.Custom('KehillahReformSelectedStatus')].\n\nChoose the change to put to a vote. Hover the tenet’s name to read its effects. No prestige is spent until you confirm the proposal."
 kehillah_reform.0002.core:0 "Adopt it as a core tenet of our rite."
 kehillah_reform.0002.core.tt:0 "Changes this rite’s core tenets and their effects. Choose the tenet to replace next; related books have their standing ceilings recalculated."
 kehillah_reform.0002.permit:0 "Permit it throughout our faith."
 kehillah_reform.0002.permit.tt:0 "Sets this tenet to Permitted throughout your faith. Recalculates related book ceilings in every rite."
 kehillah_reform.0002.ban:0 "Prohibit it throughout our faith."
 kehillah_reform.0002.ban.tt:0 "Sets this tenet to Prohibited throughout your faith. Unavailable while any rite holds it as core. Recalculates related book ceilings."
 kehillah_reform.0002.lift:0 "Lift the faith-wide prohibition."
 kehillah_reform.0002.lift.tt:0 "Returns this tenet to Known, not Permitted, throughout your faith. Recalculates related book ceilings."
 kehillah_reform.0003.t:0 "The Core Tenets of Our Rite"
 kehillah_reform.0003.desc:0 "Adopting [kehillah_reform_topic.GetName( ROOT.Char.GetRite )] changes what defines our rite. At the core-tenet limit, choose one of our actual core tenets to replace. Hover each name to compare its effects."
 kehillah_reform.no_drop:0 "Adopt it in our vacant core-tenet slot."
 kehillah_reform.0006.t:0 "Confirm the Proposal"
 kehillah_reform.0006.desc:0 "The proposal is [ROOT.Char.Custom('KehillahReformMotionText')].\n\nIt takes effect only if the delegates pass it and it remains valid when the ruling is enacted."
 kehillah_reform.confirm:0 "Put this proposal to the delegates."
 kehillah_reform.confirm_tt:0 "Spend prestige to open the argument and vote. Returning to the agenda costs nothing."
 kehillah_reform_enacted_tt:0 "The ruling is [ROOT.Char.Custom('KehillahReformMotionText')]. Related book ceilings are recalculated; this does not grant mastery or automatically raise every book’s standing."
 kehillah_reform_lapsed_tt:0 "The proposal is no longer valid. No tenet is removed or adopted."
 kehillah_reform.status_core:0 "Core to this rite"
 kehillah_reform.status_prohibited:0 "Prohibited by the faith"
 kehillah_reform.status_permitted:0 "Permitted by the faith"
 kehillah_reform.status_known:0 "Known to the faith"
 kehillah_reform.status_unknown:0 "Not yet recognised by the faith"
 kehillah_reform.pick_1:0 "[kehillah_reform_pick_1.GetName( ROOT.Char.GetRite )] ([ROOT.Char.Custom('KehillahReformPick1Status')])"
 kehillah_reform.pick_1_tt:0 "Consider [kehillah_reform_pick_1.GetName( ROOT.Char.GetRite )]. Choose a specific change on the next page."
 kehillah_reform.drop_1:0 "Replace [kehillah_reform_drop_1.GetName( ROOT.Char.GetRite )]."
 kehillah_reform.pick_2:0 "[kehillah_reform_pick_2.GetName( ROOT.Char.GetRite )] ([ROOT.Char.Custom('KehillahReformPick2Status')])"
 kehillah_reform.pick_2_tt:0 "Consider [kehillah_reform_pick_2.GetName( ROOT.Char.GetRite )]. Choose a specific change on the next page."
 kehillah_reform.drop_2:0 "Replace [kehillah_reform_drop_2.GetName( ROOT.Char.GetRite )]."
 kehillah_reform.pick_3:0 "[kehillah_reform_pick_3.GetName( ROOT.Char.GetRite )] ([ROOT.Char.Custom('KehillahReformPick3Status')])"
 kehillah_reform.pick_3_tt:0 "Consider [kehillah_reform_pick_3.GetName( ROOT.Char.GetRite )]. Choose a specific change on the next page."
 kehillah_reform.drop_3:0 "Replace [kehillah_reform_drop_3.GetName( ROOT.Char.GetRite )]."
