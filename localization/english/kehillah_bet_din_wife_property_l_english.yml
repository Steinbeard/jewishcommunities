l_english:
 kehillah_bet_din.0251.t:0 "The Wife's Property and the Creditor"
 kehillah_bet_din.0251.desc:0 "[kbd_litigant_a.GetFirstName] lent money to a husband and now seeks goods brought into the marriage by his wife. [kbd_litigant_b.GetFirstName] represents the wife, who says those goods were never pledged. The household inventory lists the objects but not who may dispose of them. The debt is due today; taking the wrong property could impoverish someone who never borrowed."
 kehillah_bet_din.0251.a:0 "Seize the listed goods to pay the lender."
 kehillah_bet_din.0251.a.tt:0 "The lender is paid quickly. Separate property would make the seizure unjust."
 kehillah_bet_din.0251.b:0 "Hold the goods and examine the marriage inventory."
 kehillah_bet_din.0251.b.tt:0 "An inventory and witnesses cost time, but can distinguish the husband's assets from the wife's."
 kehillah_bet_din.0251.c:0 "Protect the goods and give the lender a smaller settlement."
 kehillah_bet_din.0251.c.tt:0 "The wife keeps the goods. A valid pledge could leave the lender unfairly short."
 kehillah_din_source_25:0 "Cite a mastered Nashim work and check the wife's property claim."
 kehillah_din_source_25_tt:0 "Mishnah Ketubot 9:1 provides a starting point for claims over marital property. It cannot identify who pledged these particular goods."
 kehillah_din_combo_25:0 "Have a scholar and steward compare the debt and marriage records."
 kehillah_din_combo_25_tt:0 "The judges keep the goods safe while checking the inventory, pledge and witnesses."
 kehillah_bet_din.0254.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0254.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0254.outcome_1:0 "The court seizes the goods and pays the debt. The wife protests that she never pledged them."
 kehillah_bet_din.0254.outcome_2:0 "The court holds the disputed goods while it checks the marriage inventory and hears its witnesses."
 kehillah_bet_din.0254.outcome_3:0 "The wife keeps the goods, and the lender accepts a smaller payment from communal reserves."
 kehillah_bet_din.0254.fact_true:0 "Witnesses confirm the goods remained the wife's separate property. Seizing them for her husband's debt was wrong."
 kehillah_bet_din.0254.fact_false:0 "The inventory shows that the goods were pledged. The smaller settlement ignored the lender's security."
 kehillah_bet_din.0254.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0254.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0254.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case25_one_tt:0 "The debt is paid at a large Prosperity cost."
 kehillah_din_case25_two_tt:0 "Holding and checking the goods costs some Prosperity."
 kehillah_din_case25_three_tt:0 "The smaller settlement costs less but may leave a valid debt unpaid."
 kehillah_bet_din_case25_great_log_title:0 "The Wife's Property and the Creditor: a well-supported ruling"
 kehillah_bet_din_case25_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s claim to a wife's goods."
 kehillah_bet_din_case25_good_log_title:0 "The Wife's Property and the Creditor: a workable ruling"
 kehillah_bet_din_case25_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s claim to a wife's goods."
 kehillah_bet_din_case25_poor_log_title:0 "The Wife's Property and the Creditor: a disputed ruling"
 kehillah_bet_din_case25_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s claim to a wife's goods."
