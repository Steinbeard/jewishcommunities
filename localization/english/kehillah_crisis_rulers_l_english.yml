l_english:
 # What a crisis means to the ruler who must answer for it (2026-11-01).
 message_filter_kehillah_crisis_ruler:0 "A Crisis Among Your Jews"
 message_filter_kehillah_crisis_ruler_desc:0 "When a danger to the Jews under your rule begins or ends, and the verdicts given in your name"

 # The attack
 kehillah_crisis_ruler_begins_t:0 "Unrest Against the Jews of [kehillah_ruler_notice_county.GetNameNoTier]"
 kehillah_crisis_ruler_begins_d:0 "[kehillah_ruler_notice_agitator.GetFirstName] is stirring [kehillah_ruler_notice_county.GetNameNoTier] against its Jews. They live under your protection, and they will look to you before this is over. So will everyone else."
 kehillah_crisis_ruler_held_t:0 "The Quarter Held"
 kehillah_crisis_ruler_held_d:0 "The host that came against the Jews of [kehillah_ruler_notice_county.GetNameNoTier] has broken on their barricades. The quarter stands, and its leader will come to you to ask what your protection is worth now."
 kehillah_crisis_ruler_struck_t:0 "The Quarter Struck"
 kehillah_crisis_ruler_struck_d:0 "The host broke into the Jewish quarter of [kehillah_ruler_notice_county.GetNameNoTier]. Houses are burning, and the survivors will soon ask what your protection meant."
 kehillah_crisis_plea_lord_decides_tt:0 "The lord will decide."
 kehillah_crisis_race.0210.t:0 "The Jews Beg for Your Men"
 kehillah_crisis_race.0210.desc:0 "[kehillah_crisis_plea_leader.GetTitledFirstName] has come in person, dust still on [kehillah_crisis_plea_leader.GetHerHis] clothes. A host is coming for the Jewish quarter of [kehillah_crisis_plea_county.GetNameNoTier], and the Jews have no soldiers of their own.\n\n[kehillah_crisis_plea_leader.GetSheHe|U] asks for yours."
 kehillah_crisis_race.0210.a:0 "My men will stand in the quarter."
 kehillah_crisis_race.0210.b:0 "They must look to themselves."
 kehillah_crisis_plea_granted_t:0 "The Lord Sends His Men"
 kehillah_crisis_plea_granted_d:0 "[ROOT.Char.GetTitledFirstName] has sent soldiers to stand in the quarter."
 kehillah_crisis_plea_refused_t:0 "The Lord Refuses"
 kehillah_crisis_plea_refused_d:0 "[ROOT.Char.GetTitledFirstName] will not send soldiers. The quarter must look to itself."

 # The decree
 kehillah_decree_lord_decides_tt:0 "The lord will decide."
 kehillah_decree.0100.t:0 "A Decree in Your Name"
 kehillah_decree.0100.desc_mark:0 "A decree has been drafted in your name and needs only your seal: every Jew of your lands, including those of the [kehillah_decree_target_title.GetNameNoTooltip], is to wear a mark on the outer garment, so that no one can mistake them for Christians.\n\nYour clergy are for it. The Jews have not been asked."
 kehillah_decree.0100.desc_servants:0 "A decree has been drafted in your name and needs only your seal: no Jew of your lands, including those of the [kehillah_decree_target_title.GetNameNoTooltip], may keep a Christian servant or hold an office over a Christian.\n\nYour clergy are for it. The Jews have not been asked."
 kehillah_decree.0100.a:0 "Seal it, and have it proclaimed."
 kehillah_decree.0100.b:0 "I will not seal it."
 kehillah_decree_refused_t:0 "The Lord Will Not Seal It"
 kehillah_decree_refused_d:0 "A decree against the Jews was drafted in [ROOT.Char.GetTitledFirstName]'s name, and [ROOT.Char.GetSheHe] would not seal it. The clergy are displeased. The quarter is not."
 kehillah_decree.0110.t:0 "The Jews Answer Your Decree"
 kehillah_decree.0110.desc_petition:0 "[kehillah_decree_asker_scope.GetTitledFirstName] has come with a petition from the [kehillah_decree_asker_title.GetNameNoTooltip]: the decree, it says, shames people who have served you well and will drive away the trade your treasury lives on.\n\nWill you withdraw it?"
 kehillah_decree.0110.desc_common:0 "The Jewish communities of your lands have petitioned together, under the hands of their leaders, [kehillah_decree_asker_scope.GetTitledFirstName] among them. They ask that the decree be withdrawn, for all of them.\n\nWill you withdraw it?"
 kehillah_decree.0110.desc_pay:0 "[kehillah_decree_asker_scope.GetTitledFirstName] has sent silver, with a letter that does not mention the decree and does not need to.\n\nWill you lay the decree aside?"
 kehillah_decree.0110.desc_leave:0 "[kehillah_decree_asker_scope.GetTitledFirstName] says the Jews of the [kehillah_decree_asker_title.GetNameNoTooltip] will leave your lands rather than obey: their trade, their loans and their taxes with them.\n\nDo you believe it?"
 kehillah_decree.0110.a:0 "Withdraw it."
 kehillah_decree.0110.b:0 "The decree stands."
 kehillah_decree.0110.a_pay:0 "Keep the silver, and lay the decree aside."
 kehillah_decree.0110.b_pay:0 "Send the silver back. The decree stands."
 kehillah_decree.0110.a_leave:0 "I cannot afford to lose them. Lay it aside."
 kehillah_decree.0110.b_leave:0 "Let them go, then."
 kehillah_decree_answer_granted_t:0 "The Lord Relents"
 kehillah_decree_answer_granted_d:0 "[ROOT.Char.GetTitledFirstName] has given way on the decree."
 kehillah_decree_answer_refused_t:0 "The Lord Refuses"
 kehillah_decree_answer_refused_d:0 "[ROOT.Char.GetTitledFirstName] will not give way on the decree."
 kehillah_decree_ruler_enforced_t:0 "Your Decree Is Enforced"
 kehillah_decree_ruler_enforced_d:0 "Your clerks have finished their list: the decree against the Jews of the [kehillah_ruler_notice_title.GetNameNoTooltip] is enforced."
 kehillah_decree_ruler_suspended_t:0 "Your Decree Is Laid Aside"
 kehillah_decree_ruler_suspended_d:0 "The decree against the Jews of the [kehillah_ruler_notice_title.GetNameNoTooltip] has been laid aside. The silver is in your treasury; the clergy will want to know why."
 kehillah_decree_ruler_withdrawn_t:0 "Your Decree Is Withdrawn"
 kehillah_decree_ruler_withdrawn_d:0 "The decree against the Jews of the [kehillah_ruler_notice_title.GetNameNoTooltip] has been withdrawn, and the crier has read the withdrawal in the market."

 # The trial
 kehillah_trial_judge_summons_catalyst:0 "The judge summons them"
 kehillah_trial_judge_summons_catalyst_desc:0 "The lord himself ordered the Jews to answer for their books."
 kehillah_trial_judge_dismisses_catalyst:0 "The judge dismisses it"
 kehillah_trial_judge_dismisses_catalyst_desc:0 "The lord himself dismissed the denunciation."
 kehillah_trial_judge_lean_acquittal_catalyst:0 "The judge leans to the Jews"
 kehillah_trial_judge_lean_acquittal_catalyst_desc:0 "The lord has made it known that he expects the books to be returned."
 kehillah_trial_judge_lean_expurgation_catalyst:0 "The judge wants a compromise"
 kehillah_trial_judge_lean_expurgation_catalyst_desc:0 "The lord has made it known that he would be content with a few passages struck out."
 kehillah_trial_judge_lean_condemnation_catalyst:0 "The judge leans to the accuser"
 kehillah_trial_judge_lean_condemnation_catalyst_desc:0 "The lord has made it known that he expects the books to burn."
 kehillah_talmud_trial.0100.t:0 "Articles Against the Talmud"
 kehillah_talmud_trial.0100.desc:0 "[kehillah_trial_judge_accuser.GetFirstName], a convert who studied among the Jews as a boy, has laid before you a list of passages from their Talmud. He says they blaspheme, and he knows which houses in the [kehillah_trial_judge_title.GetNameNoTooltip] keep the books.\n\nYour clergy are waiting to see what you will do."
 kehillah_talmud_trial.0100.a:0 "Summon the Jews to answer for their books."
 kehillah_talmud_trial.0100.b:0 "This is a quarrel among scholars. Dismiss it."
 kehillah_talmud_trial.0100.c:0 "Let the matter take its course."
 kehillah_talmud_trial.0110.t:0 "You Will Sit in Judgment"
 kehillah_talmud_trial.0110.desc:0 "The hearing opens in your hall. The books of the [kehillah_trial_judge_title.GetNameNoTooltip] are stacked on a table, the accuser on one side and [kehillah_trial_judge_leader.GetTitledFirstName]'s disputant on the other.\n\nEveryone in the hall will be watching your face."
 kehillah_talmud_trial.0110.a:0 "Make it known that I expect the books to go home."
 kehillah_talmud_trial.0110.b:0 "Make it known that a few passages struck out would content me."
 kehillah_talmud_trial.0110.c:0 "Make it known that I expect them to burn."
 kehillah_talmud_trial.0110.d:0 "I will hear the arguments before I decide anything."
 kehillah_trial_ruler_quashed_t:0 "The Talmud Matter Dropped"
 kehillah_trial_ruler_quashed_d:0 "The denunciation of the books of the [kehillah_ruler_notice_title.GetNameNoTooltip] has come to nothing."
 kehillah_trial_ruler_acquittal_t:0 "The Talmud Acquitted"
 kehillah_trial_ruler_acquittal_d:0 "Your court has found nothing in the books of the [kehillah_ruler_notice_title.GetNameNoTooltip] that deserves the fire. They go home."
 kehillah_trial_ruler_expurgation_t:0 "The Talmud Expurgated"
 kehillah_trial_ruler_expurgation_d:0 "Your court has ordered passages struck from the books of the [kehillah_ruler_notice_title.GetNameNoTooltip] before they are returned."
 kehillah_trial_ruler_condemnation_t:0 "The Talmud Condemned"
 kehillah_trial_ruler_condemnation_d:0 "Your court has condemned the books of the [kehillah_ruler_notice_title.GetNameNoTooltip] to the fire."
