l_english:

 # Ba'alei batim (docs/spec/v26-kehillah-council-and-baalei-batim.md, part 2).

 kehillah_review_households_decision:0 "Review the Householders"
 kehillah_review_households_decision_desc:0 "Open the register of the community's householders: the families who pay its taxes, sit on its board and compete for its leadership."
 kehillah_review_households_decision_tooltip:0 "See which families make up the community and how much weight each carries."
 kehillah_review_households_decision_confirm:0 "Open the register"

 kehillah_household_band_leading:0 "#P Leading#!"
 kehillah_household_band_respected:0 "Respected"
 kehillah_household_band_minor:0 "#weak Minor#!"
 kehillah_household_trade_scholar:0 "scholars"
 kehillah_household_trade_merchant:0 "merchants"
 kehillah_household_trade_advocate:0 "spokesmen before the authorities"
 kehillah_household_trade_none:0 "householders"

 kehillah_household_joins_tt:0 "The family settles in the community and is counted among its householders. Its adults can be appointed to the board and can be chosen to lead the community."
 kehillah_household_leaves_tt:0 "The family and the members of the household living here move to the other community."
 kehillah_household_stays_tt:0 "The family stays."
 kehillah_household_refused_tt:0 "The family is refused."
 kehillah_household_refused_stay_tt:0 "The family stays where it is."
 kehillah_household_refused_return_tt:0 "The family settles in the community it came from instead."

 kehillah_household.0001.t:0 "A Family Asks to Settle"
 kehillah_household.0001.desc_move:0 "A letter has come from [kh_arr_origin.GetName]. [kh_arr_head.GetFirstName] of the house of [kh_arr_head.GetHouse.GetName] writes that the community there has more families than its trade and its charter can support. He asks whether we have room for his household here.\n\nA new family brings more taxpayers and more people fit for office. It also brings more competition for the same customers."
 kehillah_household.0001.desc_new:0 "[kh_arr_head.GetFirstName] of the house of [kh_arr_head.GetHouse.GetName] has come from [kh_arr_origin.GetName] with a letter of recommendation. His family are [kh_arr_head.Custom('KehillahHouseholdTrade')], and he asks for the right to settle in our quarter.\n\nA new family brings more taxpayers and more people fit for office. It also brings more competition for the same customers."
 kehillah_household.0001.desc_unknown:0 "[kh_arr_head.GetFirstName] of the house of [kh_arr_head.GetHouse.GetName] has arrived with his family and asks for the right to settle in our quarter. They are [kh_arr_head.Custom('KehillahHouseholdTrade')].\n\nA new family brings more taxpayers and more people fit for office. It also brings more competition for the same customers."
 kehillah_household.0001.a:0 "They are welcome here."
 kehillah_household.0001.b:0 "They may settle once they pay the entry fee."
 kehillah_household.0001.c:0 "Refuse them the right to settle."

 kehillah_household.0002.t:0 "A Household Prepares to Leave"
 kehillah_household.0002.desc:0 "[kh_dep_head.GetFirstName] of the house of [kh_dep_head.GetHouse.GetName] is trying to sell his house. He says the community can no longer protect its members or keep the peace between them, and his family will move to [kh_dep_dest.GetName]."
 kehillah_household.0002.a:0 "Let them go."
 kehillah_household.0002.b:0 "Cover their losses if they stay."
 kehillah_household.0002.c:0 "Persuade him that things will improve."

 kehillah_household.0003.t:0 "A Family Arrives"
 kehillah_household.0003.desc:0 "[kh_new_arrival.GetFirstName] of the house of [kh_new_arrival.GetHouse.GetName] has arrived from [kh_left_title.GetName] with his family. Things had become unsafe there. He has taken a house in the quarter and asks to be counted among our householders."
 kehillah_household.0003.a:0 "Welcome."

 kehillah_household.0010.t:0 "The Householders"
 kehillah_household.0010.desc:0 "The community's register lists these families. A family's standing depends on its head's ability, how many of its adults live here, the board seats its members hold, and how long it has been here."
 kehillah_household.0010.none:0 "\n\nNo families are registered yet."
 kehillah_household.0010.line_1:0 "\n\n#bold The house of [kh_rev_1.GetHouse.GetName]#!, [kh_rev_1.Custom('KehillahHouseholdTrade')], headed by [kh_rev_1.GetTitledFirstName]. Standing: [kh_rev_1.Custom('KehillahHouseholdBand')] ([kh_rev_1.MakeScope.Var('kehillah_household_standing').GetValue|0])."
 kehillah_household.0010.line_2:0 "\n#bold The house of [kh_rev_2.GetHouse.GetName]#!, [kh_rev_2.Custom('KehillahHouseholdTrade')], headed by [kh_rev_2.GetTitledFirstName]. Standing: [kh_rev_2.Custom('KehillahHouseholdBand')] ([kh_rev_2.MakeScope.Var('kehillah_household_standing').GetValue|0])."
 kehillah_household.0010.line_3:0 "\n#bold The house of [kh_rev_3.GetHouse.GetName]#!, [kh_rev_3.Custom('KehillahHouseholdTrade')], headed by [kh_rev_3.GetTitledFirstName]. Standing: [kh_rev_3.Custom('KehillahHouseholdBand')] ([kh_rev_3.MakeScope.Var('kehillah_household_standing').GetValue|0])."
 kehillah_household.0010.line_4:0 "\n#bold The house of [kh_rev_4.GetHouse.GetName]#!, [kh_rev_4.Custom('KehillahHouseholdTrade')], headed by [kh_rev_4.GetTitledFirstName]. Standing: [kh_rev_4.Custom('KehillahHouseholdBand')] ([kh_rev_4.MakeScope.Var('kehillah_household_standing').GetValue|0])."
 kehillah_household.0010.room:0 "\n\nThe community has room for [ROOT.Char.GetPrimaryTitle.MakeScope.ScriptValue('kehillah_household_cap_value')|0] householder families at its present prosperity. When there is room, Healthy Prosperity draws new families; low Stability drives the weakest family away."
 kehillah_household.0010.a:0 "Close the register."
