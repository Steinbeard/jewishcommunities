l_english:

 # Ba'alei batim (docs/spec/v26-kehillah-council-and-baalei-batim.md, part 2;
 # reworked 2026-10-12, docs/spec/v30-expulsion-and-householders.md). The
 # system runs in the background; the player meets it through the Ba'al
 # Bayit marker, the pillar tooltips and these notices.


 kehillah_baal_bayit_modifier:0 "Ba'al Bayit"
 kehillah_baal_bayit_modifier_desc:0 "Heads one of the community's householder families. His family's trade sustains the community, and his household brings in a modest income of its own."


 kehillah_household_trade_scholar:0 "scholars"
 kehillah_household_trade_merchant:0 "merchants"
 kehillah_household_trade_advocate:0 "spokesmen before the authorities"
 kehillah_household_trade_none:0 "householders"
 kehillah_household_pillar_prosperity:0 "Prosperity"
 kehillah_household_pillar_greatness:0 "Greatness"
 kehillah_household_pillar_stability:0 "Stability"

 kehillah_bd_households_prosperity:0 "\n  Merchant families: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_households_prosperity_value')|0]#!"
 kehillah_bd_households_stability:0 "\n  Families who speak for the community: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_households_stability_value')|0]#!"
 kehillah_bd_households_greatness:0 "\n  Scholarly families: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_households_greatness_value')|0]#!"

 # --- Side notifications ---
 kehillah_household_counted_msg_title:0 "A New Householder Family"
 kehillah_household_counted_msg_desc:0 "[kh_note_head.GetTitledFirstName] of the house of [kh_note_head.GetHouse.GetName] is now counted among the community's householders. His family are [kh_note_head.Custom('KehillahHouseholdTrade')] and add to the community's [kh_note_head.Custom('KehillahHouseholdPillar')]."
 kehillah_household_promoted_msg_desc:0 "[kh_note_head.GetTitledFirstName] has set up a household of his own, the house of [kh_note_head.GetHouse.GetName], and is now counted among the community's householders. His family are [kh_note_head.Custom('KehillahHouseholdTrade')] and add to the community's [kh_note_head.Custom('KehillahHouseholdPillar')]."
 kehillah_household_moved_in_msg_desc:0 "[kh_note_head.GetTitledFirstName] has brought the house of [kh_note_head.GetHouse.GetName] here from [kh_arr_origin.GetNameNoTooltip], where things had grown hard. His family are [kh_note_head.Custom('KehillahHouseholdTrade')] and add to the community's [kh_note_head.Custom('KehillahHouseholdPillar')]."
 kehillah_household_newcomer_from_msg_desc:0 "[kh_note_head.GetTitledFirstName] of the house of [kh_note_head.GetHouse.GetName] has come from [kh_arr_origin.GetNameNoTooltip] and settled in the quarter with his family. They are [kh_note_head.Custom('KehillahHouseholdTrade')] and add to the community's [kh_note_head.Custom('KehillahHouseholdPillar')]."
 kehillah_household_newcomer_msg_desc:0 "[kh_note_head.GetTitledFirstName] of the house of [kh_note_head.GetHouse.GetName] has settled in the quarter with his family. They are [kh_note_head.Custom('KehillahHouseholdTrade')] and add to the community's [kh_note_head.Custom('KehillahHouseholdPillar')]."
 kehillah_household_arrived_msg_desc:0 "[kh_note_head.GetTitledFirstName] has brought the house of [kh_note_head.GetHouse.GetName] here from [kh_dep_leader.GetPrimaryTitle.GetNameNoTooltip], where things had grown hard. His family are [kh_note_head.Custom('KehillahHouseholdTrade')] and add to the community's [kh_note_head.Custom('KehillahHouseholdPillar')]."

 kehillah_household_left_msg_title:0 "A Householder Family Leaves"
 kehillah_household_left_msg_desc:0 "[kh_note_head.GetTitledFirstName] has sold his house and taken the house of [kh_note_head.GetHouse.GetName] to [kh_dep_dest.GetNameNoTooltip]. What his family added to the community's [kh_note_head.Custom('KehillahHouseholdPillar')] goes with them."
 kehillah_household_moved_out_msg_desc:0 "[kh_note_head.GetTitledFirstName] has sold his house and taken the house of [kh_note_head.GetHouse.GetName] to [kh_rec_title.GetNameNoTooltip]. What his family added to the community's [kh_note_head.Custom('KehillahHouseholdPillar')] goes with them."
