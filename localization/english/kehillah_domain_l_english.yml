l_english:

 # My Realm > Domain overview for a Kehillah leader.
 # The GUI block sets Title to the player's community title.
 KEHILLAH_DOMAIN_OVERVIEW_HEADER:0 "Your Kehillah"
 KEHILLAH_DOMAIN_STANDING_LABEL:0 "Standing"
 KEHILLAH_DOMAIN_STANDING_VALUE:0 "[Title.Custom('KehillahStandingScore')]  [Title.Custom('KehillahStandingBandName')]"
 KEHILLAH_DOMAIN_HOST:0 "#EMP Host ruler:#! [Title.GetHolder.GetSuzerain.GetShortUINameNoTooltip][Title.GetHolder.GetSuzerain.Custom('KehillahRegentNote')]"
 KEHILLAH_DOMAIN_DANGER:0 "Danger of violence: [Title.GetHolder.Custom('KehillahDangerBand')] ([Title.GetHolder.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]% this year)"
 KEHILLAH_DOMAIN_HOST_OUTLOOK:0 "Outlook on the Jews: $KEHILLAH_HUD_HOST_OUTLOOK$"
 KEHILLAH_DOMAIN_CHARTER_HEADER:0 "Host Charter"
 KEHILLAH_DOMAIN_CHARTER_PENDING:0 "Awaiting the recorded charter terms."
 KEHILLAH_DOMAIN_CHARTER_TERMS:0 "#EMP Construction:#! [Title.GetHolder.Custom('KehillahCharterNoticeConstruction')]\n#EMP Security:#! [Title.GetHolder.Custom('KehillahCharterNoticeSecurity')]\n#EMP Jurisdiction:#! [Title.GetHolder.Custom('KehillahCharterNoticeJurisdiction')]\n#EMP Learning / trade:#! [Title.GetHolder.Custom('KehillahCharterNoticeKnowledgeOrTrade')]"

 # 2026-10-29 polish: realm view / holding card forms.
 KEHILLAH_DOMAIN_DESCRIPTION:0 "[Title.Custom('KehillahInspectorCommunityDescription')]"
 KEHILLAH_DOMAIN_HOST_SECTION:0 "Your Host"
 KEHILLAH_DOMAIN_HOST_TILE_TOOLTIP:0 "#T [Character.GetShortUINameNoTooltip]#!\nRuler of [Character.GetPrimaryTitle.GetNameNoTooltip], where your community lives.[Character.Custom('KehillahRegentNote')]\nJewish settlement policy: [Character.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]\n[GetPlayer.Custom('KehillahHudInvitationLine')]\n\n#weak Click to open [Character.GetShortUINameNoTooltip].#!"
 KEHILLAH_DOMAIN_CHARTER_BUTTON_TOOLTIP:0 "#T Your Charter#!\n$KEHILLAH_DOMAIN_CHARTER_TERMS$\n\n#weak Click to ask [Character.GetShortUINameNoTooltip] to change its terms.#!"
 KEHILLAH_DOMAIN_HISTORY_FOOTER:0 "#weak $KEHILLAH_HISTORY_HEADER$:#! $KEHILLAH_DOMAIN_HISTORY_SUMMARY$"
 KEHILLAH_DOMAIN_DANGER_LABEL:0 "Danger"
 KEHILLAH_DOMAIN_DANGER_VALUE:0 "[Title.GetHolder.Custom('KehillahDangerBand')] #weak · [Title.GetHolder.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]%/yr#!"
 KEHILLAH_DOMAIN_HOST_POLICY:0 "#weak Policy:#! [Character.GetPrimaryTitle.Custom('KehillahJewishSettlementPolicy')]"
 KEHILLAH_DOMAIN_PROSPERITY_TIER:0 "[Title.Custom('KehillahHudProsperityTier')][Title.GetHolder.Custom('KehillahHudProsperityTrend')]"
 KEHILLAH_DOMAIN_STABILITY_TIER:0 "[Title.Custom('KehillahHudStabilityTier')][Title.GetHolder.Custom('KehillahHudStabilityTrend')]"
 KEHILLAH_DOMAIN_GREATNESS_TIER:0 "[Title.Custom('KehillahHudGreatnessTier')][Title.GetHolder.Custom('KehillahHudGreatnessTrend')]"
