l_english:
 kehillah_bet_din.0391.t:0 "The Salt Monopoly"
 kehillah_bet_din.0391.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a salt merchant who received a ruler's seal for exclusive sales. [kbd_litigant_b.GetFirstName] speaks for rival sellers whose stalls were shut. The grant's words are broad, but its term may be short. Salt is needed daily; the court must weigh a promised privilege against fair access to the market."
 kehillah_bet_din.0391.a:0 "Enforce the merchant's monopoly at once."
 kehillah_bet_din.0391.a.tt:0 "The seal is honored, but a limited grant may not justify shutting every stall."
 kehillah_bet_din.0391.b:0 "Open temporary stalls while the grant is read."
 kehillah_bet_din.0391.b.tt:0 "Supply continues while the court checks the grant's term and reach."
 kehillah_bet_din.0391.c:0 "Ignore the grant and restore every rival seller."
 kehillah_bet_din.0391.c.tt:0 "Rivals return quickly, but a full valid grant could be broken."
 kehillah_din_source_39:0 "Cite a mastered Nezikin work and inspect the monopoly's terms."
 kehillah_din_source_39_tt:0 "Mishnah Bava Batra 1:5 offers an analogy for communal burdens. It does not define this ruler's commercial grant."
 kehillah_din_combo_39:0 "Have a scholar and steward read the seal while keeping salt available."
 kehillah_din_combo_39_tt:0 "The judges compare the grant, prices and market access."
 kehillah_bet_din.0394.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0394.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0394.outcome_1:0 "The court orders rival salt stalls closed under the merchant's seal."
 kehillah_bet_din.0394.outcome_2:0 "The court permits temporary sales and examines the grant with witnesses."
 kehillah_bet_din.0394.outcome_3:0 "The court restores all rival stalls and rejects the monopoly."
 kehillah_bet_din.0394.fact_true:0 "The grant covered only one market season. A permanent monopoly exceeded its terms."
 kehillah_bet_din.0394.fact_false:0 "The grant clearly covers the current season and stalls. Ignoring it broke a valid promise."
 kehillah_bet_din.0394.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0394.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0394.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case39_one_tt:0 "Enforcement costs substantial Stability."
 kehillah_din_case39_two_tt:0 "Temporary stalls and review cost some Stability."
 kehillah_din_case39_three_tt:0 "Restoring rivals costs less now but may breach the grant."
 kehillah_bet_din_case39_great_log_title:0 "The Salt Monopoly: a well-supported ruling"
 kehillah_bet_din_case39_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s salt-market claim."
 kehillah_bet_din_case39_good_log_title:0 "The Salt Monopoly: a workable ruling"
 kehillah_bet_din_case39_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s salt-market claim."
 kehillah_bet_din_case39_poor_log_title:0 "The Salt Monopoly: a disputed ruling"
 kehillah_bet_din_case39_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s salt-market claim."
