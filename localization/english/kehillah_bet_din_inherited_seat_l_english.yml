l_english:
 kehillah_bet_din.0651.t:0 "The Synagogue Seat Inherited"
 kehillah_bet_din.0651.desc:0 "[kbd_litigant_a.GetFirstName] claims the honored seat once used by a parent. [kbd_litigant_b.GetFirstName] speaks for members who want seats assigned anew. The old contribution book names the family, but not whether its gift bought lasting use. The next service is near, and a public quarrel over one bench threatens the prayer room."
 kehillah_bet_din.0651.a:0 "Let the heir keep the seat."
 kehillah_bet_din.0651.a.tt:0 "The family keeps continuity, but a communal seat may become private without cause."
 kehillah_bet_din.0651.b:0 "Assign a temporary place and read the contribution book."
 kehillah_bet_din.0651.b.tt:0 "The court buys time while checking the gift and current seating needs."
 kehillah_bet_din.0651.c:0 "Redistribute every honored seat now."
 kehillah_bet_din.0651.c.tt:0 "A fresh allocation may erase a genuine family grant."
 kehillah_din_source_65:0 "Cite a mastered Moed work and examine the evidence."
 kehillah_din_source_65_tt:0 "Mishnah Megillah 3:1 gives the judges a textual point of reference. It cannot establish the gift's seating term."
 kehillah_din_combo_65:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_65_tt:0 "The judges preserve both parties' interests while checking the gift's seating term."
 kehillah_bet_din.0654.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0654.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0654.outcome_1:0 "The court reserves the seat for the heir."
 kehillah_bet_din.0654.outcome_2:0 "The court gives a temporary place and asks for the original gift terms."
 kehillah_bet_din.0654.outcome_3:0 "The court opens all honored seats to reassignment."
 kehillah_bet_din.0654.fact_true:0 "The gift supported the synagogue generally; it did not grant a permanent seat. Sole inheritance narrowed common space."
 kehillah_bet_din.0654.fact_false:0 "The deed expressly reserved the seat to the family. A blanket redistribution broke that term."
 kehillah_bet_din.0654.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0654.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0654.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case65_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case65_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case65_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case65_great_log_title:0 "The Synagogue Seat Inherited: a well-supported ruling"
 kehillah_bet_din_case65_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the synagogue seat inherited dispute."
 kehillah_bet_din_case65_good_log_title:0 "The Synagogue Seat Inherited: a workable ruling"
 kehillah_bet_din_case65_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the synagogue seat inherited dispute."
