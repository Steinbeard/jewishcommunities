l_english:
 kehillah_rachel_imenu_name: "Rachel Imenu"
 kehillah_avraham_avinu_name: "Avraham Avinu"
 kehillah_poi_kever_rachel: "Kever Rachel"
 kehillah_poi_kever_rachel_desc: "The traditional burial place of Rachel Imenu, on the road to Bethlehem. Here visitors remember the matriarch and her children."
 kehillah_poi_kever_rachel.visit: "Kever Rachel"
 kehillah_poi_kever_rachel.visit_desc: "I pause at the tomb traditionally identified with Rachel's grave, remembering the matriarch and the generations who have cherished her memory."
 kehillah_poi_machpelah: "Ma'arat HaMachpelah"
 kehillah_poi_machpelah_desc: "The Cave of Machpelah at Hebron, traditionally revered as the burial place of Avraham and Sarah, Yitzhak and Rivkah, and Yaakov and Leah."
 kehillah_poi_machpelah.visit: "Ma'arat HaMachpelah"
 kehillah_poi_machpelah.visit_desc: "At Hebron I stand before the enclosure of the Cave of Machpelah, remembering Avraham, Sarah, and the patriarchs and matriarchs associated with this place."
