l_english:
 kehillah_bet_din.0561.t:0 "The Ransom Subscription"
 kehillah_bet_din.0561.desc:0 "[kbd_litigant_a.GetFirstName] speaks for households who pledged coin toward a captive's release but now say their promises were only intentions. [kbd_litigant_b.GetFirstName] speaks for the collectors, who have promised the ransom on the strength of those pledges. The captive's kin are waiting; a disputed page in the pledge book could decide whether the money exists."
 kehillah_bet_din.0561.a:0 "Release the households from their pledges."
 kehillah_bet_din.0561.a.tt:0 "Households keep their money, but recorded promises may leave the captive waiting."
 kehillah_bet_din.0561.b:0 "Advance part of the ransom and inspect the pledge book."
 kehillah_bet_din.0561.b.tt:0 "The court supports the effort while verifying what each donor actually undertook."
 kehillah_bet_din.0561.c:0 "Collect every promised coin by force."
 kehillah_bet_din.0561.c.tt:0 "Funds arrive quickly, but conditional pledges could be enforced beyond their terms."
 kehillah_din_source_56:0 "Cite a mastered Nashim work and examine the redemption pledge."
 kehillah_din_source_56_tt:0 "Mishnah Gittin 4:6 discusses communal limits around captives. It does not reveal the terms of these signatures."
 kehillah_din_combo_56:0 "Have a scholar and steward secure an advance and read the pledges."
 kehillah_din_combo_56_tt:0 "The judges act for the captive without inventing donor obligations."
 kehillah_bet_din.0564.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0564.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0564.outcome_1:0 "The court releases the disputed donors from payment."
 kehillah_bet_din.0564.outcome_2:0 "The court advances ransom funds and examines the signed pledge page."
 kehillah_bet_din.0564.outcome_3:0 "The court orders full collection from every named donor."
 kehillah_bet_din.0564.fact_true:0 "The donors signed unconditional amounts. Releasing them left the promised ransom short."
 kehillah_bet_din.0564.fact_false:0 "The pledges were conditional on a matching gift that never came. Forced full collection exceeded them."
 kehillah_bet_din.0564.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0564.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0564.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case56_one_tt:0 "Releasing pledges costs substantial Prosperity."
 kehillah_din_case56_two_tt:0 "An advance and inquiry cost some Prosperity."
 kehillah_din_case56_three_tt:0 "Forced collection costs less now but may exceed consent."
 kehillah_bet_din_case56_great_log_title:0 "The Ransom Subscription: a well-supported ruling"
 kehillah_bet_din_case56_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s ransom pledge."
