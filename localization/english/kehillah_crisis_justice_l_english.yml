l_english:
 kehillah_crisis_justice.0100.t:0 "The Agitator's Fate"
 kehillah_crisis_justice.0100.named:0 "[kehillah_justice_agitator.GetTitledFirstName] stirred the unrest that threatened the Jewish quarter. The community now waits to learn whether you will call this person to account."
 kehillah_crisis_justice.0100.absent:0 "The person who stirred the unrest is no longer within reach. You must decide what judgment, if any, your court can still give."
 kehillah_crisis_justice.0100.arrest:0 "Have the agitator arrested."
 kehillah_crisis_justice.0100.censure:0 "Condemn the incitement publicly."
 kehillah_crisis_justice.0100.ignore:0 "Let the matter rest."
 kehillah_crisis_justice.0100.unreachable:0 "Record the incitement, though its author is beyond our reach."
 kehillah_crisis_justice.0200.t:0 "A Demand for Justice"
 kehillah_crisis_justice.0200.desc:0 "The ruler has allowed the agitator to go unpunished. Survivors ask you to petition once more while the attack is still in memory."
 kehillah_crisis_justice.0200.petition:0 "Ask the ruler to reconsider."
 kehillah_crisis_justice.0200.petition.tt:0 "Send a new petition to the ruler. The ruler will decide whether to arrest or censure the agitator, taking account of their disposition toward you and the Jewish community. The petition can be made once during Recovery; it does not guarantee justice."
 kehillah_crisis_justice.0200.defer:0 "We must tend to other wounds."
 kehillah_crisis_recovery_justice_decision:0 "Demand Justice"
 kehillah_crisis_recovery_justice_decision_desc:0 "Ask the ruler to reconsider his decision to leave the agitator unpunished."
 kehillah_crisis_recovery_justice_decision_tooltip:0 "Ask the ruler once more to hold the agitator accountable. The ruler will make the decision."
 kehillah_crisis_recovery_justice_decision_confirm:0 "Petition the ruler"
