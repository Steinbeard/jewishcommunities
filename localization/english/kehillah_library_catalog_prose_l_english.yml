l_english:
 kehillah_lib_name_work_tanakh_torah:0 "The Torah"
 kehillah_lib_subject_work_tanakh_torah:0 "$KEHILLAH_LIB_TRACK_PARSHANUT$"
 kehillah_lib_desc_work_tanakh_torah:0 "The Five Books of Moses, read aloud in the synagogue week by week."
 kehillah_lib_detail_work_tanakh_torah:0 "Genesis, Exodus, Leviticus, Numbers and Deuteronomy: the heart of Scripture for every Jewish tradition. A community keeps its scroll in the ark for public reading and its bound copies for study, and a reader returns to them all his life."
 kehillah_lib_tt_work_tanakh_torah:0 "#T $kehillah_lib_name_work_tanakh_torah$#!\n#weak $KEHILLAH_LIB_TRACK_PARSHANUT$#!\n\n$kehillah_lib_detail_work_tanakh_torah$"
 kehillah_study_torah.parshanut.tanakh_torah_tt:0 "You open the Torah again and read the week's portion slowly, word by word."
 kehillah_yeshiva_msg_work_work_tanakh_torah:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_tanakh_torah$ at the yeshiva."
 kehillah_lib_name_work_tanakh_neviim:0 "Nevi'im"
 kehillah_lib_subject_work_tanakh_neviim:0 "$KEHILLAH_LIB_TRACK_PARSHANUT$"
 kehillah_lib_desc_work_tanakh_neviim:0 "The Prophets, from Joshua to Malachi, read in the synagogue as the haftarah."
 kehillah_lib_detail_work_tanakh_neviim:0 "The Former Prophets tell Israel's story from the conquest of the land to the exile. The Latter Prophets carry the rebukes and consolations of Isaiah, Jeremiah, Ezekiel and the Twelve."
 kehillah_lib_tt_work_tanakh_neviim:0 "#T $kehillah_lib_name_work_tanakh_neviim$#!\n#weak $KEHILLAH_LIB_TRACK_PARSHANUT$#!\n\n$kehillah_lib_detail_work_tanakh_neviim$"
 kehillah_study_torah.parshanut.tanakh_neviim_tt:0 "You take up the Prophets and read their warnings beside their comfort."
 kehillah_yeshiva_msg_work_work_tanakh_neviim:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_tanakh_neviim$ at the yeshiva."
 kehillah_lib_name_work_tanakh_ketuvim:0 "Ketuvim"
 kehillah_lib_subject_work_tanakh_ketuvim:0 "$KEHILLAH_LIB_TRACK_PARSHANUT$"
 kehillah_lib_desc_work_tanakh_ketuvim:0 "The Writings: Psalms, Proverbs, Job, the five scrolls, Daniel, Ezra-Nehemiah and Chronicles."
 kehillah_lib_detail_work_tanakh_ketuvim:0 "Songs and wisdom, the scrolls read on the festivals, and the last histories of the biblical canon. The Psalms above all are a book every Jew carries in memory."
 kehillah_lib_tt_work_tanakh_ketuvim:0 "#T $kehillah_lib_name_work_tanakh_ketuvim$#!\n#weak $KEHILLAH_LIB_TRACK_PARSHANUT$#!\n\n$kehillah_lib_detail_work_tanakh_ketuvim$"
 kehillah_study_torah.parshanut.tanakh_ketuvim_tt:0 "You read the Writings, from the Psalms to the last pages of Chronicles."
 kehillah_yeshiva_msg_work_work_tanakh_ketuvim:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_tanakh_ketuvim$ at the yeshiva."
 kehillah_lib_name_work_tosefta:0 "Tosefta"
 kehillah_lib_subject_work_tosefta:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_tosefta:0 "A companion to the Mishnah, gathering tannaitic teachings it left out."
 kehillah_lib_detail_work_tosefta:0 "Arranged by the Mishnah's own orders and tractates, the Tosefta keeps rulings, disputes and stories of the same sages. The Talmuds cite such teachings as baraitot."
 kehillah_lib_tt_work_tosefta:0 "#T $kehillah_lib_name_work_tosefta$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_tosefta$"
 kehillah_study_torah.talmudics.tosefta_tt:0 "You read the Tosefta beside the Mishnah, tractate by tractate."
 kehillah_yeshiva_msg_work_work_tosefta:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_tosefta$ at the yeshiva."
 kehillah_lib_name_work_seder_rav_amram:0 "Seder Rav Amram"
 kehillah_lib_subject_work_seder_rav_amram:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_seder_rav_amram:0 "The first full order of Jewish prayer, sent by the Gaon of Sura to the Jews of Spain."
 kehillah_lib_detail_work_seder_rav_amram:0 "Answering a request from Spain, Amram Gaon set out the prayers of the year with the laws that govern them. Copies spread through the West, and later prayer books grew out of it."
 kehillah_lib_tt_work_seder_rav_amram:0 "#T $kehillah_lib_name_work_seder_rav_amram$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_seder_rav_amram$"
 kehillah_study_torah.talmudics.seder_rav_amram_tt:0 "You work through Seder Rav Amram, prayer by prayer and law by law."
 kehillah_yeshiva_msg_work_work_seder_rav_amram:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_seder_rav_amram$ at the yeshiva."
 kehillah_lib_name_work_iggeret_rav_sherira:0 "Iggeret Rav Sherira Gaon"
 kehillah_lib_subject_work_iggeret_rav_sherira:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_iggeret_rav_sherira:0 "A gaon's answer to Kairouan on how the Mishnah and the Talmud came to be written."
 kehillah_lib_detail_work_iggeret_rav_sherira:0 "Asked by the community of Kairouan how the oral teaching was set down, Sherira Gaon traced the chain of sages from the Mishnah through the savoraim to the geonim of his own day. It became the standard account of the rabbinic tradition."
 kehillah_lib_tt_work_iggeret_rav_sherira:0 "#T $kehillah_lib_name_work_iggeret_rav_sherira$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_iggeret_rav_sherira$"
 kehillah_study_torah.talmudics.iggeret_rav_sherira_tt:0 "You follow Sherira Gaon's letter down the generations of the sages."
 kehillah_yeshiva_msg_work_work_iggeret_rav_sherira:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_iggeret_rav_sherira$ at the yeshiva."
 kehillah_lib_name_work_rabbenu_hananel:0 "Commentary of Rabbenu Hananel"
 kehillah_lib_subject_work_rabbenu_hananel:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_rabbenu_hananel:0 "A Kairouan commentary that sums up the Talmud's discussion and rules on it."
 kehillah_lib_detail_work_rabbenu_hananel:0 "Rabbenu Hananel explained the Bavli's argument briefly, drew on the Yerushalmi and the geonim, and stated the law. His work carried geonic learning across North Africa and beyond."
 kehillah_lib_tt_work_rabbenu_hananel:0 "#T $kehillah_lib_name_work_rabbenu_hananel$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_rabbenu_hananel$"
 kehillah_study_torah.talmudics.rabbenu_hananel_tt:0 "You read Rabbenu Hananel's summaries against the Talmud's own long argument."
 kehillah_yeshiva_msg_work_work_rabbenu_hananel:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_rabbenu_hananel$ at the yeshiva."
 kehillah_lib_name_work_mekor_hayyim:0 "Mekor Hayyim"
 kehillah_lib_subject_work_mekor_hayyim:0 "$KEHILLAH_LIB_TRACK_HASHKAFA$"
 kehillah_lib_desc_work_mekor_hayyim:0 "Ibn Gabirol's dialogue on matter, form and the divine will, written in Arabic."
 kehillah_lib_detail_work_mekor_hayyim:0 "A Neoplatonic work that almost never quotes Scripture. Jewish readers largely neglected it, while its Latin translation, Fons Vitae, circulated among Christian scholars who did not know its author was a Jew."
 kehillah_lib_tt_work_mekor_hayyim:0 "#T $kehillah_lib_name_work_mekor_hayyim$#!\n#weak $KEHILLAH_LIB_TRACK_HASHKAFA$#!\n\n$kehillah_lib_detail_work_mekor_hayyim$"
 kehillah_study_torah.hashkafa.mekor_hayyim_tt:0 "You follow Ibn Gabirol's argument from matter and form up to the divine will."
 kehillah_yeshiva_msg_work_work_mekor_hayyim:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_mekor_hayyim$ at the yeshiva."
 kehillah_lib_name_work_anan_sefer_hamitzvot:0 "Sefer ha-Mitzvot of Anan"
 kehillah_lib_subject_work_anan_sefer_hamitzvot:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_anan_sefer_hamitzvot:0 "The Aramaic legal code of Anan ben David, honoured by Karaites as a founder."
 kehillah_lib_detail_work_anan_sefer_hamitzvot:0 "Anan derived the commandments from Scripture by his own reasoning, often more strictly than the rabbis did. Later Karaites revered him as a founder while departing from many of his rulings."
 kehillah_lib_tt_work_anan_sefer_hamitzvot:0 "#T $kehillah_lib_name_work_anan_sefer_hamitzvot$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_anan_sefer_hamitzvot$"
 kehillah_study_torah.talmudics.anan_sefer_hamitzvot_tt:0 "You weigh Anan's rulings against the verses he derived them from."
 kehillah_yeshiva_msg_work_work_anan_sefer_hamitzvot:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_anan_sefer_hamitzvot$ at the yeshiva."
 kehillah_lib_name_work_kitab_alanwar:0 "Kitab al-Anwar"
 kehillah_lib_subject_work_kitab_alanwar:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_kitab_alanwar:0 "Qirqisani's Book of Lights and Watchtowers, a Karaite code of law in Arabic."
 kehillah_lib_detail_work_kitab_alanwar:0 "It opens with a history of the Jewish sects and a defence of deriving law from Scripture by reason and analogy, and then sets out the commandments one by one."
 kehillah_lib_tt_work_kitab_alanwar:0 "#T $kehillah_lib_name_work_kitab_alanwar$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_kitab_alanwar$"
 kehillah_study_torah.talmudics.kitab_alanwar_tt:0 "You read Qirqisani's arguments and test each against the verse."
 kehillah_yeshiva_msg_work_work_kitab_alanwar:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_kitab_alanwar$ at the yeshiva."
 kehillah_lib_name_work_yefet_commentary:0 "Commentary of Yefet ben Eli"
 kehillah_lib_subject_work_yefet_commentary:0 "$KEHILLAH_LIB_TRACK_PARSHANUT$"
 kehillah_lib_desc_work_yefet_commentary:0 "An Arabic translation of and commentary on the whole Bible by a Jerusalem Karaite."
 kehillah_lib_detail_work_yefet_commentary:0 "Yefet, one of the Mourners of Zion, glossed every book of the Bible with close attention to grammar and the plain sense. Karaites made it their standard commentary, and Rabbanite readers such as Abraham ibn Ezra read it and argued with it."
 kehillah_lib_tt_work_yefet_commentary:0 "#T $kehillah_lib_name_work_yefet_commentary$#!\n#weak $KEHILLAH_LIB_TRACK_PARSHANUT$#!\n\n$kehillah_lib_detail_work_yefet_commentary$"
 kehillah_study_torah.parshanut.yefet_commentary_tt:0 "You read a book of the Bible with Yefet's translation and notes beside it."
 kehillah_yeshiva_msg_work_work_yefet_commentary:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_yefet_commentary$ at the yeshiva."
 kehillah_lib_name_work_rashi_torah:0 "Rashi on the Torah"
 kehillah_lib_subject_work_rashi_torah:0 "$KEHILLAH_LIB_TRACK_PARSHANUT$"
 kehillah_lib_desc_work_rashi_torah:0 "A commentary on the Torah that explains the plain sense in few words, drawing on midrash where the plain sense needs it."
 kehillah_lib_detail_work_rashi_torah:0 "Written for a reader who knows Hebrew but not every tradition, it answers the questions a careful reader asks of each verse, often in a single line, and sometimes glosses a word in the vernacular."
 kehillah_lib_tt_work_rashi_torah:0 "#T $kehillah_lib_name_work_rashi_torah$#!\n#weak $KEHILLAH_LIB_TRACK_PARSHANUT$#!\n\n$kehillah_lib_detail_work_rashi_torah$"
 kehillah_study_torah.parshanut.rashi_torah_tt:0 "You read the Torah with the commentary at your elbow, verse by verse."
 kehillah_yeshiva_msg_work_work_rashi_torah:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_rashi_torah$ at the yeshiva."
 kehillah_lib_name_work_rashi_talmud:0 "Rashi on the Talmud"
 kehillah_lib_subject_work_rashi_talmud:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_rashi_talmud:0 "A running commentary that lets a student follow the Talmud's argument line by line."
 kehillah_lib_detail_work_rashi_talmud:0 "It supplies the missing step, the meaning of a rare word and the point of a question, so that the page can be learned without a teacher at every turn."
 kehillah_lib_tt_work_rashi_talmud:0 "#T $kehillah_lib_name_work_rashi_talmud$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_rashi_talmud$"
 kehillah_study_torah.talmudics.rashi_talmud_tt:0 "You learn a tractate with the running commentary beside the page."
 kehillah_yeshiva_msg_work_work_rashi_talmud:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_rashi_talmud$ at the yeshiva."
 kehillah_lib_name_work_hilkhot_harif:0 "Halakhot of the Rif"
 kehillah_lib_subject_work_hilkhot_harif:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_hilkhot_harif:0 "An abridged Talmud that keeps only the passages bearing on practice and states the law."
 kehillah_lib_detail_work_hilkhot_harif:0 "It follows the order of the Talmud's own tractates, sets aside the long debates and the agadah, and closes each question with the ruling."
 kehillah_lib_tt_work_hilkhot_harif:0 "#T $kehillah_lib_name_work_hilkhot_harif$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_hilkhot_harif$"
 kehillah_study_torah.talmudics.hilkhot_harif_tt:0 "You read the Rif's halakhot and check each ruling against its sugya."
 kehillah_yeshiva_msg_work_work_hilkhot_harif:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_hilkhot_harif$ at the yeshiva."
 kehillah_lib_name_work_mishneh_torah:0 "Mishneh Torah"
 kehillah_lib_subject_work_mishneh_torah:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_mishneh_torah:0 "A complete code of Jewish law in clear Hebrew, in fourteen books, without the debates or their sources."
 kehillah_lib_detail_work_mishneh_torah:0 "Its author meant a reader to need no other book after the Torah. Its order and clarity won it readers everywhere, and its silence about sources drew sharp critics."
 kehillah_lib_tt_work_mishneh_torah:0 "#T $kehillah_lib_name_work_mishneh_torah$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_mishneh_torah$"
 kehillah_study_torah.talmudics.mishneh_torah_tt:0 "You work through a book of the Mishneh Torah, law by law."
 kehillah_yeshiva_msg_work_work_mishneh_torah:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_mishneh_torah$ at the yeshiva."
 kehillah_lib_name_work_moreh_nevukhim:0 "Moreh Nevukhim"
 kehillah_lib_subject_work_moreh_nevukhim:0 "$KEHILLAH_LIB_TRACK_HASHKAFA$"
 kehillah_lib_desc_work_moreh_nevukhim:0 "The Guide of the Perplexed, written in Arabic for a student torn between philosophy and the Torah."
 kehillah_lib_detail_work_moreh_nevukhim:0 "It reads Scripture's bodily language about God as figurative and argues for a God beyond every attribute. Its admirers saw the summit of Jewish thought, its opponents a danger to faith."
 kehillah_lib_tt_work_moreh_nevukhim:0 "#T $kehillah_lib_name_work_moreh_nevukhim$#!\n#weak $KEHILLAH_LIB_TRACK_HASHKAFA$#!\n\n$kehillah_lib_detail_work_moreh_nevukhim$"
 kehillah_study_torah.hashkafa.moreh_nevukhim_tt:0 "You read a chapter of the Guide and turn its argument over slowly."
 kehillah_yeshiva_msg_work_work_moreh_nevukhim:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_moreh_nevukhim$ at the yeshiva."
 kehillah_lib_name_work_sefer_habahir:0 "Sefer ha-Bahir"
 kehillah_lib_subject_work_sefer_habahir:0 "$KEHILLAH_LIB_TRACK_HASHKAFA$"
 kehillah_lib_desc_work_sefer_habahir:0 "A short, cryptic book on the divine powers and the letters, which surfaced in Provence."
 kehillah_lib_detail_work_sefer_habahir:0 "In brief sayings and parables it speaks of ten powers within God. It is among the first books of the Kabbalah."
 kehillah_lib_tt_work_sefer_habahir:0 "#T $kehillah_lib_name_work_sefer_habahir$#!\n#weak $KEHILLAH_LIB_TRACK_HASHKAFA$#!\n\n$kehillah_lib_detail_work_sefer_habahir$"
 kehillah_study_torah.hashkafa.sefer_habahir_tt:0 "You read the Bahir's parables and try to hold their hidden meaning."
 kehillah_yeshiva_msg_work_work_sefer_habahir:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_sefer_habahir$ at the yeshiva."
 kehillah_lib_name_work_sefer_hasidim:0 "Sefer Hasidim"
 kehillah_lib_subject_work_sefer_hasidim:0 "$KEHILLAH_LIB_TRACK_HASHKAFA$"
 kehillah_lib_desc_work_sefer_hasidim:0 "The book of the German pietists: on fear of Heaven, penitence and conduct in daily life."
 kehillah_lib_detail_work_sefer_hasidim:0 "Through hundreds of short cases it asks more of a pious man than the law requires, in prayer, in business and with his neighbours, Jewish and Christian."
 kehillah_lib_tt_work_sefer_hasidim:0 "#T $kehillah_lib_name_work_sefer_hasidim$#!\n#weak $KEHILLAH_LIB_TRACK_HASHKAFA$#!\n\n$kehillah_lib_detail_work_sefer_hasidim$"
 kehillah_study_torah.hashkafa.sefer_hasidim_tt:0 "You read the pietists' cases and measure your own conduct against them."
 kehillah_yeshiva_msg_work_work_sefer_hasidim:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_sefer_hasidim$ at the yeshiva."
 kehillah_lib_name_work_tosafot:0 "Tosafot"
 kehillah_lib_subject_work_tosafot:0 "$KEHILLAH_LIB_TRACK_TALMUDICS$"
 kehillah_lib_desc_work_tosafot:0 "Glosses on the Talmud from the schools of northern France, set against Rashi's commentary."
 kehillah_lib_detail_work_tosafot:0 "Comparing distant passages, the Tosafists raise contradictions and resolve them by fine distinctions. They taught generations to read the whole Talmud as one argument."
 kehillah_lib_tt_work_tosafot:0 "#T $kehillah_lib_name_work_tosafot$#!\n#weak $KEHILLAH_LIB_TRACK_TALMUDICS$#!\n\n$kehillah_lib_detail_work_tosafot$"
 kehillah_study_torah.talmudics.tosafot_tt:0 "You learn a page with the Tosafot and follow them from one tractate into another."
 kehillah_yeshiva_msg_work_work_tosafot:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_tosafot$ at the yeshiva."
 kehillah_lib_name_work_zohar:0 "Zohar"
 kehillah_lib_subject_work_zohar:0 "$KEHILLAH_LIB_TRACK_HASHKAFA$"
 kehillah_lib_desc_work_zohar:0 "A vast mystical commentary on the Torah in Aramaic, presented as the teaching of Rabbi Shimon bar Yohai."
 kehillah_lib_detail_work_zohar:0 "It reads the Torah as a map of the divine life and of the soul. It appeared in Castile and grew in authority until many held it holy."
 kehillah_lib_tt_work_zohar:0 "#T $kehillah_lib_name_work_zohar$#!\n#weak $KEHILLAH_LIB_TRACK_HASHKAFA$#!\n\n$kehillah_lib_detail_work_zohar$"
 kehillah_study_torah.hashkafa.zohar_tt:0 "You read a passage of the Zohar and try to follow where it leads."
 kehillah_yeshiva_msg_work_work_zohar:0 "[kehillah_msg_talmid.GetTitledFirstName] has mastered $kehillah_lib_name_work_zohar$ at the yeshiva."
