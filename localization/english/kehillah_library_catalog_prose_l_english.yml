 kehillah_lib_subject_work_authored_01:0 "[GetPlayer.Custom('KehillahAuthoredKind01')]"
 kehillah_lib_desc_work_authored_01:0 "A [GetPlayer.Custom('KehillahAuthoredKind01')|l] written in this campaign by [GetGlobalVariable('kehillah_wk_work_authored_01_author').GetCharacter.GetShortUIName]."
