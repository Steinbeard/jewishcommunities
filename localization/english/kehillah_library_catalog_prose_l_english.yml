 kehillah_lib_detail_work_authored_02:0 "$kehillah_lib_desc_work_authored_02$ Its standing in each rite is earned: copies, readers, approbations, teaching and citations raise it, controversy can sink it."
 kehillah_lib_tt_work_authored_02:0 "#T $kehillah_lib_name_work_authored_02$#!\n#weak $kehillah_lib_subject_work_authored_02$#!\n\n$kehillah_lib_detail_work_authored_02$"
