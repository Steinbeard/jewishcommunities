l_english:
 # Reviews: haskamah and cherem on books (2026-11-11).
 # docs/spec/2026-11-11-reviews-and-cherem.md section 1.
 KEHILLAH_REVIEW_HASKAMAH_ACTION:0 "Give a Haskamah"
 KEHILLAH_REVIEW_HASKAMAH_TT:0 "#T Give a Haskamah#!\nSet your name to this book as an approbation. It raises the book's standing in your [faith|E], by how much your word weighs: your [learning|E], your [piety|E], your scholarship and your office. From now on, your [piety|E] rises and falls with the book."
 KEHILLAH_REVIEW_CHEREM_ACTION:0 "Pronounce a Cherem"
 KEHILLAH_REVIEW_CHEREM_TT:0 "#T Pronounce a Cherem#!\nBan this book in your [faith|E]. It lowers the book's standing, by how much your word weighs; a ban on a book you have not mastered weighs half. If the book rises to $KEHILLAH_STANDING_7$ anyway, it costs you [prestige|E]."
 KEHILLAH_REVIEW_BLOCKED:0 "#N You cannot do this now:#!\n"
 KEHILLAH_REVIEW_REQ_NOT_REVIEWED:0 "You have not yet given this book a haskamah or a cherem"
 KEHILLAH_REVIEW_REQ_MASTERED:0 "You have mastered this book"

 kehillah_review.0001.t:0 "A Haskamah"
 kehillah_review.0001.desc:0 "You have mastered #EMP [GetPlayer.Custom('KehillahReviewWork')]#!. A scholar's approbation, set at the front of a book, tells others it is worth their years. Will you set your name to this one?"
 kehillah_review.0001.a:0 "It deserves my name."
 kehillah_review.0001.a.tt:0 "The book's standing in your [faith|E] rises by the weight of your word, and your [piety|E] will rise and fall with it"
 kehillah_review.0001.b:0 "I keep my name to myself."

 kehillah_review.0002.t:0 "A Cherem"
 kehillah_review.0002.desc:0 "Some books do harm. Will you pronounce a cherem on #EMP [GetPlayer.Custom('KehillahReviewWork')]#!, and warn the faithful away from it?"
 kehillah_review.0002.a:0 "Let it be under the ban."
 kehillah_review.0002.a.tt:0 "The book's standing in your [faith|E] falls by the weight of your word"
 kehillah_review.0002.b:0 "Let it be."

 kehillah_review.0010.t:0 "Words Against Our Faith"
 kehillah_review.0010.desc:0 "#EMP [GetPlayer.Custom('KehillahReviewWork')]#! argues for what you were taught to reject. The pages are open before you."
 kehillah_review.0010.a:0 "Pronounce a cherem on it, and close it."
 kehillah_review.0010.a.stop_tt:0 "You stop reading it"
 kehillah_review.0010.b:0 "Read on, to answer it."
 kehillah_review.0010.c:0 "Read on, with an open mind."
 KEHILLAH_REVIEW_REQ_WINDOW:0 "A haskamah is for a living book: one written in the last fifty years, and between $KEHILLAH_STANDING_4$ and $KEHILLAH_STANDING_7$ in your [faith|E]"
 kehillah_review_approbation_refused_t:0 "The Approbation Is Refused"
 kehillah_review_approbation_cherem_t:0 "Your Book Is Put Under a Cherem"
