l_english:
 # 2026-11-24 (Daniel: "more descriptive descriptions that are specific to the
 # books in the scheme success learn Torah events"). The closing paragraph of
 # kehillah_study_torah.0001 when a book is mastered for the first time, one
 # per historical work. Chosen by KehillahStudyMasteredDesc (generated by
 # scripts/kehillah_library_catalog.py); a work without a line here, or one
 # written in this campaign, uses kehillah_study_mastered_generic.
 kehillah_study_torah.0001.mastered_book_desc:0 "[ROOT.Char.Custom('KehillahStudyMasteredDesc')][ROOT.Char.Custom('KehillahStudyMasteredTenets')]"
 kehillah_study_torah.0001.mastered_talmud_torah_honor:0 " Your rite honors the hours you gave to it."
 # The event widget (gui/event_window_widgets/event_window_widget_kehillah_sparks.gui).
 KEHILLAH_EVENT_SPARKS_BUTTON:0 "My Sparks"
 KEHILLAH_EVENT_SPARKS_BUTTON_TT:0 "Open the #high Sparks#! in your Learning: the ideas you hold for books, how to deepen each one, and where to write it."
 kehillah_study_mastered_generic:0 "You close #italic [ROOT.Char.Custom('KehillahStudyCurrentWorkName')]#! knowing it. Its argument sits whole in your mind, and you could set it out for a pupil tomorrow."
 kehillah_study_mastered_authored:0 "You close #italic [ROOT.Char.Custom('KehillahStudyCurrentWorkName')]#! knowing it. A living author's reasoning is harder to master than an old one, with no generations of commentary to lean on, but you could defend or dispute it now, line by line."

 # --- Parshanut ---
 kehillah_study_mastered_work_tanakh_torah:0 "You reach the last verses of Deuteronomy, Moses looking out over the land he would not enter. You have read the Torah all your life, but now you know its seams: where a law is repeated, where a word is missing, and why the rabbis cared."
 kehillah_study_mastered_work_tanakh_neviim:0 "From Joshua's conquest to Malachi's last warning, the Prophets are yours. You hear now how Isaiah's comfort answers Jeremiah's grief, and how the kings' history is a judgement on them."
 kehillah_study_mastered_work_tanakh_ketuvim:0 "Psalms and Proverbs, Job's quarrel with Heaven, the scrolls read on the festivals: the Writings are many voices, and you can now tell each one from the next."
 kehillah_study_mastered_work_targum_onkelos:0 "You finish Onkelos and hear the Torah differently. Where the Hebrew gives God a hand or a face, the Aramaic quietly turns it aside, and you understand every one of those choices."
 kehillah_study_mastered_work_targum_jonathan:0 "You finish the Aramaic Prophets of Jonathan ben Uzziel. Its renderings of the hard visions, the ones that verge on paraphrase, now read to you as deliberate answers."
 kehillah_study_mastered_work_targum_pseudo_jonathan:0 "You finish the Targum that bears Jonathan's name and carries far more than translation: angels, legends and hidden lore woven between the verses. You know now where the text ends and the telling begins."
 kehillah_study_mastered_work_mekhilta:0 "You close the Mekhilta. Its reading of Exodus, clause by clause, has taught you how much law the Sages could draw from a single word."
 kehillah_study_mastered_work_genesis_rabbah:0 "You close Genesis Rabbah with the stories of the patriarchs grown deep and strange. Every verse of Bereshit now opens onto a dozen midrashim you can recall."
 kehillah_study_mastered_work_pirkei_derabbi_eliezer:0 "You close Pirkei De-Rabbi Eliezer. Its retelling of creation and the fall, with the angels at its edges, no longer seems strange to you, only old."
 kehillah_study_mastered_work_leviticus_rabbah:0 "You close Leviticus Rabbah. Its homilies built on the laws of sacrifice and purity, each opening with a verse from far away, now hold together in your mind."
 kehillah_study_mastered_work_lamentations_rabbah:0 "You close Lamentations Rabbah. Its stories of the destruction are hard to carry, but you carry them now, and know how the Sages found consolation in them."
 kehillah_study_mastered_work_pesikta_derav_kahana:0 "You close the Pesikta de-Rav Kahana. Its sermons for the festivals and the special Sabbaths are yours to preach, from the weeks of mourning to the weeks of comfort."
 kehillah_study_mastered_work_tanhuma:0 "You close the Tanhuma. Each of its sermons on the weekly portion begins with a question of law and ends in comfort, and you can follow the path from one to the other."
 kehillah_study_mastered_work_seder_olam_rabbah:0 "You close Seder Olam. The years from Adam to Alexander are counted in your mind now, and you understand how the Sages reckoned the age of the world."
 kehillah_study_mastered_work_avot_derabbi_natan:0 "You close Avot de-Rabbi Natan. The sayings of the Fathers have stories behind them now, Akiva at the well and Yohanan ben Zakkai at the gates, and you can tell them."
 kehillah_study_mastered_work_rashi_torah:0 "You close Rashi on the Torah. Each comment answers a question you had not known to ask, in a few words, and you see now why every schoolboy learns the verse with him."
 kehillah_study_mastered_work_ibn_ezra_torah:0 "You close Ibn Ezra's commentary. Grammar first, then reason; and here and there a terse hint, 'the wise will understand', that you have finally understood."
 kehillah_study_mastered_work_ramban_torah:0 "You close the Ramban on the Torah. He argues with Rashi and with Ibn Ezra, then, in a few careful lines, points toward the way of truth. You know where those lines are."
 kehillah_study_mastered_work_yefet_commentary:0 "You close Yefet ben Eli's long Arabic commentary. His plain reading of each verse, and his grief for Zion, are clear to you now, Karaite though his reasoning is."
 kehillah_study_mastered_work_salmon_ben_jeroham_commentary:0 "You close Salmon ben Jeroham. His commentary is plain and his polemic against the Rabbanites is sharp, and you could answer either now."
 kehillah_study_mastered_work_sefer_hamivhar:0 "You close the Sefer ha-Mivhar. Aaron ben Joseph reads the Torah with Karaite plainness and a philosopher's care, and you can follow him through both."
 kehillah_study_mastered_work_agron_david_al_fasi:0 "You close the Agron. Root by root, David al-Fasi's dictionary has laid out the Hebrew language for you, and verses you once guessed at now parse cleanly."
 kehillah_study_mastered_work_sefer_yosippon:0 "You close the Yosippon. The kings and wars of the Second Temple, told in Hebrew from Josephus, are a history you can now tell in order to its bitter end."
 kehillah_study_mastered_work_josephus_jewish_war:0 "You close Josephus's Jewish War. The siege, the factions and the fall of the Temple are vivid to you, and so is the author's wish to be believed by Rome."
 kehillah_study_mastered_work_diwan_dunash:0 "You close the poems of Dunash ben Labrat. He set Hebrew to Arabic metre, and you can hear the measure in every line, and the quarrel it started."
 kehillah_study_mastered_work_diwan_samuel_hanagid:0 "You close the diwan of Samuel ha-Nagid: war poems from a vizier who led armies, and quiet ones on age and death. You know which lines will last."
 kehillah_study_mastered_work_diwan_ibn_gabirol:0 "You close Ibn Gabirol's poems. The lonely young man and the poet of the Royal Crown are one voice, and you can recite him from the bitter to the sublime."
 kehillah_study_mastered_work_samaritan_pentateuch:0 "You close the Samaritan Torah. You know now where its text parts from the Jews' own, and why Mount Gerizim stands in its commandments."
 kehillah_study_mastered_work_samaritan_targum:0 "You close the Samaritan Targum. Its Aramaic follows the Samaritan Torah word by word, and you can hear in it how that community has read its scripture."
 kehillah_study_mastered_work_defter:0 "You close the Defter, the Samaritan prayer book. Its hymns of Marqah and Amram Darah are known to you now, the liturgy of the faithful on Gerizim."
 kehillah_study_mastered_work_orit:0 "You close the Orit. The Torah in Ge'ez, as the Beta Israel keep it with Joshua, Judges and Ruth, is now a text you know."
 kehillah_study_mastered_work_cochin_copper_plates:0 "You close your study of the Cochin plates. The rights a Chera king granted Joseph Rabban, cut into copper, are clear to you, word by word and privilege by privilege."

 # --- Talmudics ---
 kehillah_study_mastered_work_mishnah:0 "You close the Mishnah. Its sixty-three tractates, terse and unexplained, are yours; you could recite a ruling and name who disputed it."
 kehillah_study_mastered_work_tosefta:0 "You close the Tosefta. The Mishnah's companion fills in what Rabbi Judah left out, and you can set the two side by side from memory."
 kehillah_study_mastered_work_bavli_zeraim:0 "You finish Seder Zeraim. Berakhot's long Gemara on blessings and prayer is yours, and the Mishnah's laws of fields and tithes beside it."
 kehillah_study_mastered_work_bavli_moed:0 "You finish Seder Moed. Shabbat's labours, the leaven of Pesach and the sukkah's measures now come to you without the page."
 kehillah_study_mastered_work_bavli_nashim:0 "You finish Seder Nashim. Ketubot, Gittin and Kiddushin, the law of marriage and divorce, are yours to rule from."
 kehillah_study_mastered_work_bavli_nezikin:0 "You finish Seder Nezikin. Damages and contracts, courts and witnesses: the law a community lives by every day is now in your hands."
 kehillah_study_mastered_work_bavli_kodashim:0 "You finish Seder Kodashim. The sacrifices of a Temple long destroyed are argued as if it still stood, and you can follow every step of the service."
 kehillah_study_mastered_work_bavli_tahorot:0 "You finish Seder Tahorot. Its many layers of Mishnah on purity are yours, and Niddah's Gemara, the part of it a rabbi is asked about most."
 kehillah_study_mastered_work_yerushalmi_zeraim:0 "You finish the Yerushalmi's Zeraim. The laws of the land of Israel, its tithes and fallow years, are argued here as the Bavli never did, and you know them."
 kehillah_study_mastered_work_yerushalmi_moed:0 "You finish the Yerushalmi's Moed. Its rulings on the festivals are terse and sometimes strange beside the Bavli, but you can now explain both."
 kehillah_study_mastered_work_yerushalmi_nashim:0 "You finish the Yerushalmi's Nashim. Where it parts from the Bavli on marriage, you know where and why."
 kehillah_study_mastered_work_yerushalmi_nezikin:0 "You finish the Yerushalmi's Nezikin. Its three Gates and its courts reason in their own way, and you can follow it to the end."
 kehillah_study_mastered_work_sifra:0 "You close the Sifra. Verse by verse it draws the laws of Leviticus from the text and argues against reasoning without one, and you can follow its every step."
 kehillah_study_mastered_work_sifre_numbers:0 "You close Sifre on Numbers. Its derivations from the wilderness laws, from the Nazirite to the tassels, are yours."
 kehillah_study_mastered_work_sifre_deuteronomy:0 "You close Sifre on Deuteronomy. The law and the farewell of Moses are read verse by verse, and you can follow each midrash to its source."
 kehillah_study_mastered_work_halakhot_gedolot:0 "You close the Halakhot Gedolot. The Talmud's rulings, set out in a code, are yours to cite, and you know its count of the six hundred and thirteen commandments."
 kehillah_study_mastered_work_seder_rav_amram:0 "You close the Seder of Rav Amram. The order of prayers for the year, sent from Sura to Spain, is clear to you, with the law behind each blessing."
 kehillah_study_mastered_work_iggeret_rav_sherira:0 "You close Rav Sherira's letter. How the Mishnah and Talmud were written down and handed on, generation by generation, is a chain you can now recite."
 kehillah_study_mastered_work_rabbenu_hananel:0 "You close Rabbenu Hananel's commentary. Brief and sure, it gives the sense of a Talmudic passage and its ruling, and you can now do the same."
 kehillah_study_mastered_work_hilkhot_harif:0 "You close the Rif's Halakhot. He takes the Talmud and leaves only what decides the law, and you can follow each passage back to its full source."
 kehillah_study_mastered_work_rashi_talmud:0 "You close Rashi on the Talmud. The hard words are explained, the flow of each sugya is plain, and you can open any page and read it with him at your side."
 kehillah_study_mastered_work_tosafot:0 "You close the Tosafot. One page leads to another, a contradiction to a fine distinction, and you begin to see the whole Talmud as a single argument."
 kehillah_study_mastered_work_mishneh_torah:0 "You close the Mishneh Torah. Fourteen books, every law in order, without the Talmud's debate. You can find any ruling in it, and you know which ones its critics attack."
 kehillah_study_mastered_work_sefer_mitzvot_gadol:0 "You close the Sefer Mitzvot Gadol. The commandments are counted, explained and ruled, positive and negative, and you can give the law for each."
 kehillah_study_mastered_work_or_zarua:0 "You close the Or Zarua. Its rulings carry the customs of the Rhineland communities, and you know where those customs came from."
 kehillah_study_mastered_work_sefer_hachinukh:0 "You close the Sefer ha-Chinukh. Each commandment, in the order of the weekly portions, comes with its root and its reason, and you could teach them to a child."
 kehillah_study_mastered_work_arbaah_turim:0 "You close the Arba'ah Turim. Its four rows lay out the law in force, with the opinions behind each ruling, and you can find your way through all of them."
 kehillah_study_mastered_work_maggid_mishneh:0 "You close the Maggid Mishneh. You can trace each law of the Mishneh Torah back to its source in the Talmud, as Vidal of Tolosa did."
 kehillah_study_mastered_work_anan_sefer_hamitzvot:0 "You close Anan's Book of Commandments. His laws are drawn from Scripture alone and set against the Rabbanites. You know them, and where his successors departed from him."
 kehillah_study_mastered_work_kitab_alanwar:0 "You close al-Qirqisani's Book of Lights. Karaite law is argued with reason and with a survey of every sect of his day, and you can follow it all."
 kehillah_study_mastered_work_levi_ben_yefet_mitzvot:0 "You close Levi ben Yefet's Book of Commandments. The Karaite law of his father's school, gathered and set in order, is yours to cite."
 kehillah_study_mastered_work_teezaza_sanbat:0 "You close the Te'ezaza Sanbat. The Sabbath's commandments, as the Beta Israel keep them, are clear to you, and the honour in which they hold the day."

 # --- Machshavah ---
 kehillah_study_mastered_work_sefer_yetzirah:0 "You close the Sefer Yetzirah. Its ten sefirot and twenty-two letters are no clearer than when you began, but you know now how it uses them, and why its readers find in it the making of the world."
 kehillah_study_mastered_work_hekhalot_rabbati:0 "You close Hekhalot Rabbati. The seven palaces, their guardians and the passwords at each gate are fixed in your memory, as the descenders to the Chariot wanted."
 kehillah_study_mastered_work_shiur_qomah:0 "You close the Shi'ur Qomah. Its measures of the divine body are beyond any mind to picture, and you understand why some revere it and others want it burned."
 kehillah_study_mastered_work_sefer_harazim:0 "You close the Sefer ha-Razim. The seven heavens, their angels and the spells to call on them are known to you now. Whether to use them is another matter."
 kehillah_study_mastered_work_emunot_vedeot:0 "You close Saadia's Beliefs and Opinions. He defends creation, revelation and the world to come by reason as well as tradition, and you can make his case."
 kehillah_study_mastered_work_chovot_halevavot:0 "You close the Duties of the Heart. Bahya asks for trust, humility and inner devotion beyond the outward commandments, and you have measured yourself against him."
 kehillah_study_mastered_work_kuzari:0 "You close the Kuzari. The rabbi has answered the philosopher, the Christian and the Muslim, and at the end he sets out for Zion. You could answer as he did."
 kehillah_study_mastered_work_mekor_hayyim:0 "You close the Fountain of Life. Ibn Gabirol's matter and form, rising to the divine will, are clear to you, though the book barely names Israel."
 kehillah_study_mastered_work_moreh_nevukhim:0 "You close the Guide of the Perplexed. Its chapters were written to be read with care, and some to conceal what others reveal. You have read them that way."
 kehillah_study_mastered_work_sefer_habahir:0 "You close the Bahir. Its parables of the king and his daughter, and its hints of the ten powers, have begun to arrange themselves into a teaching."
 kehillah_study_mastered_work_sefer_hasidim:0 "You close the Sefer Hasidim. Its hundreds of cases ask more of a pious man than the law does, and you have found yourself in a few of them."
 kehillah_study_mastered_work_zohar:0 "You close the Zohar. Rabbi Shimon and his companions walk the roads and expound the Torah as the life of God, and you can follow them now."
 kehillah_study_mastered_work_philo_allegorical:0 "You close Philo's allegories. The patriarchs as virtues of the soul and the Law as a philosophy: you know his method, and how far it strays from the Sages."
 kehillah_study_mastered_work_toldot_yeshu:0 "You close the Toldot Yeshu. Its scornful counter-history of the Christians' Messiah is clear to you, its versions and its dangers both."
 kehillah_study_mastered_work_theology_of_aristotle:0 "You close the Theology of Aristotle. The One, the Intellect and the Soul descend in order. You understand it now, whoever its real author was."
 kehillah_study_mastered_work_galen_de_usu_partium:0 "You close Galen's On the Usefulness of the Parts. Each organ is made for its purpose, and you see in the body an argument for its Maker."
 kehillah_study_mastered_work_memar_marqah:0 "You close the Memar Marqah. The Samaritan sage's teaching on Moses, the Law and the Day of Vengeance is clear to you, a theology unlike the rabbis'."
