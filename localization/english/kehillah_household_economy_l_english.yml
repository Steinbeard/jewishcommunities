 kehillah_economy_assign_local_tt:0 "Return to an ordinary local livelihood. Requires a household of your community with no current two-year assignment commitment."
 kehillah_economy_assign_workshop_tt:0 "Appoint this household to productive work. Requires a free workshop assignment, supplied by Craft Row or a specialised trade or winery. Improves sustainable wealth. Two-year commitment."
 kehillah_economy_assign_venture_tt:0 "Appoint this household to a trading venture. Requires a free Affluence/style venture allowance. Without Silk and Silver, seasonal ventures can bring gold or losses. With it, assign a member as a trader in the native trade window; an active family trader permits seasonal household fortunes, without extra route gold. Two-year commitment."
 kehillah_economy_assign_credit_tt:0 "Appoint this household to keep the lending table. Requires Bankers’ Row and no other appointed household. Adds 2.5 percentage points to new permitted interest-bearing loan terms. Actual repayments improve household wealth; repudiation costs wealth. Communal funds remain with the leader. Two-year commitment."
