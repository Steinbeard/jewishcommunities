l_english:
 kehillah_bet_din.0161.t:0 "The Brother and His Half-Sisters"
 kehillah_bet_din.0161.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a brother administering his father's estate. [kbd_litigant_b.GetFirstName] speaks for the brother's two half-sisters: their father directed monthly maintenance for them, but payment has stalled. The brother accepts that the will exists, yet says the estate accounts must be settled before he can promise a rate. The court must protect the sisters without spending an estate whose obligations it has not counted."
 kehillah_bet_din.0161.a:0 "Order the stated maintenance paid now."
 kehillah_bet_din.0161.a.tt:0 "The argument relies on Diplomacy. The sisters receive support promptly, but incomplete accounts could leave the estate short of other obligations."
 kehillah_bet_din.0161.b:0 "Provide interim support and audit the accounts."
 kehillah_bet_din.0161.b.tt:0 "The argument relies on Learning and Talmudics. Record the will, meet immediate needs, and settle the amount after an inventory."
 kehillah_bet_din.0161.c:0 "Suspend payments until the estate is counted."
 kehillah_bet_din.0161.c.tt:0 "The argument relies on Stewardship. The estate is protected during accounting, but the sisters go without the support their father directed."
 kehillah_din_source_16:0 "Cite a mastered Nezikin work and order interim support during the audit."
 kehillah_din_source_16_tt:0 "Available to a judge who has mastered a work covering #EMP Nezikin#!. Mishnah Bava Batra 8:1 addresses inheritance priority. The 1156 record specifically mentions the father's maintenance instruction; the Mishnah alone does not decide its amount or this estate's obligations."
 kehillah_din_combo_16:0 "Have a just scholar and a steward audit the estate together."
 kehillah_din_combo_16_tt:0 "Available to a learned judge who is Just or experienced in Talmudics, with a judge skilled in Stewardship. The sisters receive interim support while the panel checks the accounts."
 kehillah_bet_din.0164.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0164.desc:0 "The brother and his half-sisters wait while the court weighs the father's instruction against the estate's other obligations."
 kehillah_bet_din.0164.outcome_1:0 "The court orders the monthly maintenance paid immediately. The sisters have support, though the accounting remains unsettled."
 kehillah_bet_din.0164.outcome_2:0 "The court records the father's will, grants interim support, and orders a full account before setting the continuing payment."
 kehillah_bet_din.0164.outcome_3:0 "The court suspends payments until the books are complete. The estate is preserved, but the sisters must wait for support."
 kehillah_bet_din.0164.accounts_gap:0 "\n\nThe audit later finds an unrecorded estate obligation. Immediate full payment would have been harder to sustain."
 kehillah_bet_din.0164.accounts_sound:0 "\n\nThe accounts prove complete. A long delay in supporting the sisters was unnecessary."
 kehillah_bet_din.0164.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0164.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0164.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case16_one_tt:0 "Maintenance begins immediately. Prosperity pays the larger cost."
 kehillah_din_case16_two_tt:0 "Interim support and an audit share the cost."
 kehillah_din_case16_three_tt:0 "The estate is held during the audit; the sisters receive no interim support."
 kehillah_bet_din_case16_great_log_title:0 "The Brother and His Half-Sisters: a well-supported ruling"
 kehillah_bet_din_case16_good_log_title:0 "The Brother and His Half-Sisters: a workable ruling"
 kehillah_bet_din_case16_poor_log_title:0 "The Brother and His Half-Sisters: a disputed ruling"
 kehillah_bet_din_case16_great_log:0 "[CHARACTER.GetTitledFirstName] secured [TARGET_CHARACTER.GetFirstName]'s maintenance while reviewing the estate."
 kehillah_bet_din_case16_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s maintenance claim."
 kehillah_bet_din_case16_poor_log:0 "[CHARACTER.GetTitledFirstName]'s ruling left [TARGET_CHARACTER.GetFirstName]'s maintenance in dispute."
