 #####################################################################
 # THE YESHIVA -- V29 (docs/spec/v29-yeshiva.md), 2026-10-11.
 #####################################################################

 # Court position
 rosh_yeshiva_kehillah_position:0 "Rosh Yeshiva"
 rosh_yeshiva_kehillah_position_desc:0 "The head of the community's yeshiva. Students travel for his lectures, and he examines those ready for semicha. A great Rosh Yeshiva makes the academy famous.\n\n#weak Requires a Yeshiva. Must be a rabbi.#!\n\nIf none is appointed, a leader who is himself a rabbi heads the yeshiva in person."
 kehillah_rosh_yeshiva_talmudics_desc:0 "Depth in Talmud"
 kehillah_rosh_yeshiva_parshanut_desc:0 "Gift for teaching"
 kehillah_requires_yeshiva_tt:0 "The community has a #EMP Yeshiva#!"

 # The founding decision
 kehillah_found_yeshiva_decision:0 "Found a Yeshiva"
 kehillah_found_yeshiva_decision_desc:0 "Our House of Debate has outgrown its benches. With a teacher worth travelling to, it could become an academy: a yeshiva whose students come from distant communities and carry its name home with them."
 kehillah_found_yeshiva_decision_confirm:0 "Found the yeshiva"
 kehillah_found_yeshiva_decision_tooltip:0 "Turn the House of Debate into a yeshiva."
 kehillah_found_yeshiva_tt:0 "The House of Debate becomes a #EMP Yeshiva#!. Its head becomes #EMP Rosh Yeshiva#! (you, if you are a qualified rabbi), its renown begins to grow and adds to the community's #EMP Greatness#!, a hall is raised for it in the town, and scholars will come looking for a place."
 kehillah_found_yeshiva_house_of_debate_tt:0 "The community has a #EMP House of Debate#!"
 kehillah_found_yeshiva_stability_tt:0 "The community's #EMP Stability#! is at least #EMP Healthy#!"
 kehillah_found_yeshiva_greatness_tt:0 "The community's #EMP Greatness#! is at least #EMP Strained#!"
 kehillah_found_yeshiva_head_tt:0 "A rabbi of the community (you or a courtier) could head it: #EMP [learning|E] 14#! or more, and deep in #EMP Talmud#! or #EMP teaching#! (65 in either track of the [GetTrait('kehillah_rabbi_trait').GetName( GetNullCharacter )] trait)"
 kehillah_yeshiva_founded_by_decision_tt:0 "A Yeshiva is founded through the #EMP Found a Yeshiva#! decision, not built"

 # Map building (great building, and the special-building fallback)
 building_type_kehillah_yeshiva_hall:0 "Yeshiva"
 building_type_kehillah_yeshiva_hall_desc:0 "The hall of the town's Jewish academy. Students and scholars come from distant communities, and copyists and traders follow them; its lord gains a little prestige and a busier town."
 building_kehillah_yeshiva_hall:0 "$building_type_kehillah_yeshiva_hall$"
 building_kehillah_yeshiva_hall_desc:0 "$building_type_kehillah_yeshiva_hall_desc$"
 building_type_kehillah_yeshiva_hall_special:0 "$building_type_kehillah_yeshiva_hall$"
 building_type_kehillah_yeshiva_hall_special_desc:0 "$building_type_kehillah_yeshiva_hall_desc$"
 building_kehillah_yeshiva_hall_special:0 "$building_type_kehillah_yeshiva_hall$"
 building_kehillah_yeshiva_hall_special_desc:0 "$building_type_kehillah_yeshiva_hall_desc$"

 kehillah_yeshiva_hall_enabled_tt:0 "A Jewish community here keeps its #EMP Yeshiva#!"

 # Travel point of interest
 poi_kehillah_yeshiva.visit:0 "Visited the yeshiva of [province.GetName]"

 # Events
 kehillah_yeshiva.0001.t:0 "A Yeshiva Is Founded"
 kehillah_yeshiva.0001.desc:0 "The benches of the House of Debate are full before dawn now. Word has gone out that the community keeps a yeshiva, and letters already ask whether a son, a nephew, a promising boy from a small town might be taken in to study.\n\nOthers will measure the community by its academy from now on."
 kehillah_yeshiva.0001.a:0 "Let the study never cease."

 kehillah_yeshiva.0010.t:0 "A Scholar Seeks a Place"
 kehillah_yeshiva.0010.desc:0 "[kehillah_yeshiva_scholar.GetTitledFirstName], an ordained rabbi, has come to the community, drawn by its yeshiva. He asks for a place among its scholars. He could teach, sit in judgement on the Bet Din, or serve as Dayyan should the seat fall empty."
 kehillah_yeshiva.0010.a:0 "Welcome him."
 kehillah_yeshiva.0010.b:0 "We have no place for him."

 kehillah_yeshiva.0101.t:0 "The Yeshiva of the Town"
 kehillah_yeshiva.0101.desc:0 "The road passes the Jewish quarter, and from the yeshiva comes the sound of a hundred voices reading aloud. A student at the door recognises a fellow Jew and invites you in."
 kehillah_yeshiva.0101.a:0 "Sit in on the lecture."
 kehillah_yeshiva.0101.b:0 "Ask to speak with the Rosh Yeshiva."

 kehillah_yeshiva.0102.t:0 "The Jews' School"
 kehillah_yeshiva.0102.desc:0 "In this town the Jews keep a school famous enough that its name reached you before you arrived. Through an open window you see students arguing in pairs over a page, and an older man walking between them.\n\nOne of the students, noticing your interest, offers to explain what they study."
 kehillah_yeshiva.0102.a:0 "Ask what the Hebrew text of scripture says."
 kehillah_yeshiva.0102.b:0 "Debate him on a point of scripture."
 kehillah_yeshiva.0102.b.win:0 "You hold your own, and he concedes the point with good grace."
 kehillah_yeshiva.0102.b.lose:0 "He knows the text far better than you, and you leave having learned more than you meant to."
 kehillah_yeshiva.0102.c:0 "Ride on."

 # V29 section 9 (2026-10-11): the gameplay loop

 kehillah_yeshiva_tier_msg_title:0 "The Yeshiva's Name Grows"
 kehillah_yeshiva_tier_msg_desc:0 "Word of the yeshiva's teaching has spread. More students will come to study there."

 kehillah_yeshiva_tier_modest:0 "Modest"
 kehillah_yeshiva_tier_respected:0 "Respected"
 kehillah_yeshiva_tier_renowned:0 "Renowned"
 kehillah_yeshiva_tier_illustrious:0 "Illustrious"

 building_type_kehillah_great_yeshiva_hall:0 "Great Yeshiva"
 building_type_kehillah_great_yeshiva_hall_desc:0 "The hall of an illustrious academy, whose students come from across the Jewish world. Its town grows busier and its lord is known for sheltering it."
 building_kehillah_great_yeshiva_hall:0 "$building_type_kehillah_great_yeshiva_hall$"
 building_kehillah_great_yeshiva_hall_desc:0 "$building_type_kehillah_great_yeshiva_hall_desc$"

