 kehillah_yeshiva_spec_parshanut:0 "Scripture and its commentators"
 kehillah_yeshiva_spec_hashkafa:0 "the questions of faith and reason"


 kehillah_study_at_yeshiva_decision:0 "Study at a Yeshiva"
 kehillah_study_at_yeshiva_decision_desc:0 "Go and sit at a famous teacher's feet. Two years at a yeshiva, present on its benches, and its head will ordain you a rabbi."
 kehillah_study_at_yeshiva_decision_confirm:0 "Choose a yeshiva"
 kehillah_study_at_yeshiva_decision_tooltip:0 "Enrol at a yeshiva and travel there."
 kehillah_study_at_yeshiva_tt:0 "Choose one of the most renowned yeshivot of your faith and enrol. You become its #EMP student#! at once, and travel there; your study counts only while you are present. After #EMP two years#! there, its head ordains you."
 kehillah_return_to_yeshiva_decision:0 "Return to the Yeshiva"
 kehillah_return_to_yeshiva_decision_desc:0 "Your place on the benches is waiting. Your studies resume when you arrive."
 kehillah_return_to_yeshiva_decision_confirm:0 "Return"
 kehillah_return_to_yeshiva_decision_tooltip:0 "Travel back to your yeshiva."
 kehillah_return_to_yeshiva_tt:0 "You travel back to your yeshiva. Your studies resume when you arrive."
 kehillah_leave_yeshiva_decision:0 "Leave the Yeshiva"
 kehillah_leave_yeshiva_decision_desc:0 "Set your studies aside. You keep what you have learned, and may enrol again to finish."
 kehillah_leave_yeshiva_decision_confirm:0 "Leave"
 kehillah_leave_yeshiva_decision_tooltip:0 "Withdraw from the yeshiva without semicha."
 kehillah_leave_yeshiva_tt:0 "You are no longer a student. You keep your learning and your progress, but are #N not ordained#! until you return and finish."

 kehillah_yeshiva.0300.t:0 "Where to Study"
 kehillah_yeshiva.0300.desc:0 "The great yeshivot of our faith each have their teachers and their ways. Where will you go?"
 kehillah_yeshiva.0300.a:0 "The yeshiva of [kehillah_yeshiva_choice_1.GetNameNoTooltip]."
 kehillah_yeshiva.0300.b:0 "The yeshiva of [kehillah_yeshiva_choice_2.GetNameNoTooltip]."
 kehillah_yeshiva.0300.c:0 "The yeshiva of [kehillah_yeshiva_choice_3.GetNameNoTooltip]."
 kehillah_yeshiva.0300.d:0 "Not now."
 kehillah_yeshiva.0301.t:0 "On the Benches"
 kehillah_yeshiva.0301.desc:0 "You have arrived. Someone finds you a place on the benches and a book to share, and the reading goes on around you as if you had always been there."
 kehillah_yeshiva.0301.a:0 "Begin."
 kehillah_yeshiva.0302.t:0 "Semicha"
 kehillah_yeshiva.0302.desc:0 "Your teachers have examined you and found you ready. You are ordained: a rabbi, with the authority to teach and to rule."
 kehillah_yeshiva.0302.a:0 "Blessed is He who has granted us life."
 kehillah_yeshiva.0311.t:0 "This Season's Study"
 kehillah_yeshiva.0311.desc:0 "A new season begins at the yeshiva. What will you give it to? The yeshiva teaches #EMP [kehillah_study_title.GetHolder.Custom('KehillahYeshivaSpecialization')]#! above all, and you will learn most there."
 kehillah_yeshiva.0311.a:0 "The Talmud."
 kehillah_yeshiva.0311.b:0 "Scripture and its commentators."
 kehillah_yeshiva.0311.c:0 "The questions of faith and reason."
 kehillah_yeshiva.0312.t:0 "My Chavruta"
 kehillah_yeshiva.0312.desc:0 "[kehillah_my_chavruta.GetTitledFirstName] has been waiting with the page open. Yesterday's question is still unanswered, and he has an idea."
 kehillah_yeshiva.0312.a:0 "Argue it through together."
 kehillah_yeshiva.0312.b:0 "Work on it alone today."
 kehillah_yeshiva.0313.t:0 "My Rebbe"
 kehillah_yeshiva.0313.desc:0 "[kehillah_my_rebbe.GetTitledFirstName] stops at your place on the bench and asks what you are reading."
 kehillah_yeshiva.0313.a:0 "Ask him to examine you on it."
 kehillah_yeshiva.0313.b:0 "Listen, and say little."

 # V29 section 11 (2026-10-12): the yearly class and the teaching focus
 KEHILLAH_YESHIVA_PANEL_FOCUS:0 "Teaching focus: #EMP [Character.Custom('KehillahYeshivaSpecialization')]#!"
 KEHILLAH_YESHIVA_FOCUS_LABEL:0 "Teaching focus:"
 KEHILLAH_YESHIVA_FOCUS_TALMUDICS:0 "Talmud"
 KEHILLAH_YESHIVA_FOCUS_PARSHANUT:0 "Parshanut"
 KEHILLAH_YESHIVA_FOCUS_HASHKAFA:0 "Hashkafa"
 KEHILLAH_YESHIVA_FOCUS_TALMUDICS_TT:0 "#T The Talmud#!\nThe argument and the law. Its graduates make the strongest #EMP judges#! for a Bet Din.\n\n#weak To change what the yeshiva teaches, its head must be a master of the new subject (65 in that track), and it can change only once in five years.#!"
 KEHILLAH_YESHIVA_FOCUS_PARSHANUT_TT:0 "#T Parshanut#!\nScripture and its commentators: reading, teaching, preaching.\n\n#weak To change what the yeshiva teaches, its head must be a master of the new subject (65 in that track), and it can change only once in five years.#!"
 KEHILLAH_YESHIVA_FOCUS_HASHKAFA_TT:0 "#T Hashkafa#!\nThe questions of faith and reason. Few heads are masters of it, and few yeshivot teach it.\n\n#weak To change what the yeshiva teaches, its head must be a master of the new subject (65 in that track), and it can change only once in five years.#!"

 kehillah_yeshiva.0320.t:0 "The Graduating Class"
 kehillah_yeshiva.0320.desc:0 "The winter term is over, and [ROOT.Char.MakeScope.Var('kehillah_last_class_size').GetValue|0] of the yeshiva's students have received semicha.\n\nThe most promising of them is [kehillah_valedictorian.GetTitledFirstName]. Where should he make his life?"
 kehillah_yeshiva.0320.a:0 "Keep him here. Our own courts need him."
 kehillah_yeshiva.0320.a.tt:0 "He stays at court: another rabbi for the Bet Din and the Dayyan's seat. The community's #EMP Stability#! grows."
 kehillah_yeshiva.0320.b:0 "Send him where a community has no rabbi."
 kehillah_yeshiva.0320.b.tt:0 "He takes the Dayyan's seat in a community that lacks one. Its leader is grateful, and the yeshiva's #EMP renown#! grows."
 kehillah_yeshiva.0320.c:0 "Recommend him to [kehillah_local_lord.GetTitledFirstName]."
 kehillah_yeshiva.0320.c.tt:0 "A learned man in the lord's service -- physician, scribe or envoy -- earns the community the lord's favour, and its #EMP Prosperity#! grows. He is lost to Jewish learning."
 KEHILLAH_YESHIVA_FOCUS_TALMUDICS_ON:0 "#high Talmud#!"
 KEHILLAH_YESHIVA_FOCUS_PARSHANUT_ON:0 "#high Parshanut#!"
 KEHILLAH_YESHIVA_FOCUS_HASHKAFA_ON:0 "#high Hashkafa#!"
 KEHILLAH_YESHIVA_FOCUS_TALMUDICS_OFF:0 "#weak Talmud#!"
 KEHILLAH_YESHIVA_FOCUS_PARSHANUT_OFF:0 "#weak Parshanut#!"
 KEHILLAH_YESHIVA_FOCUS_HASHKAFA_OFF:0 "#weak Hashkafa#!"
 KEHILLAH_YESHIVA_FOCUS_STATUS_ON:0 "#P Taught here now.#!\n\n"
 KEHILLAH_YESHIVA_FOCUS_STATUS_CAN:0 "#P Click to make this what the yeshiva teaches.#!\n\n"
 KEHILLAH_YESHIVA_FOCUS_STATUS_CANNOT:0 "#N Not available now:#! the head is not yet a master of it, or the focus changed within the last five years.\n\n"

