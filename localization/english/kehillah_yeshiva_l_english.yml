 kehillah_yeshiva_next_toward_respected:0 "growing toward Respected"
 kehillah_yeshiva_next_nearly_respected:0 "nearly Respected"
 kehillah_yeshiva_next_toward_renowned:0 "growing toward Renowned"
 kehillah_yeshiva_next_nearly_renowned:0 "nearly Renowned"
 kehillah_yeshiva_next_toward_illustrious:0 "growing toward Illustrious"
 kehillah_yeshiva_next_nearly_illustrious:0 "nearly Illustrious"
 kehillah_yeshiva_next_tier_top:0 "the highest renown a yeshiva can have"

 kehillah_rival_yeshiva_quarrel:0 "a quarrel on the yeshiva's benches"

 # Yeshiva section of the library panel (gui/kehillah_domicile_library.gui)
 KEHILLAH_YESHIVA_PANEL:0 "#high The Yeshiva#! -- #EMP [Character.Custom('KehillahYeshivaFameTier')]#!, [Character.Custom('KehillahYeshivaNextTier')].\nHead: [Character.Custom('KehillahYeshivaHead')]\nStudents: #high [Character.MakeScope.ScriptValue('kehillah_yeshiva_student_count_value')|0]#!\nIts renown adds to the community's #EMP Greatness#!."
 kehillah_yeshiva_head_appointed:0 "the appointed #EMP Rosh Yeshiva#!"
 kehillah_yeshiva_head_leader:0 "[ROOT.Char.GetTitledFirstName] in person"
 kehillah_yeshiva_head_none:0 "#N none#! -- appoint a Rosh Yeshiva from among your rabbis"

 # The living yeshiva (V29 section 10, 2026-10-11)
 kehillah_yeshiva_student_modifier:0 "Yeshiva Student"
 kehillah_yeshiva_student_modifier_desc:0 "Studying at a yeshiva toward semicha. Study counts only while present at the yeshiva's town."
 relation_kehillah_talmid:0 "talmid"
 relation_kehillah_talmid_possessive:0 "talmid's"
