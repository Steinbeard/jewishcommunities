 kehillah_talmid_desc:0 "This is [CHARACTER.GetShortUINamePossessiveNoTooltip] talmid"
 kehillah_rebbe:0 "Rebbe"
 kehillah_rebbe_desc:0 "This is [CHARACTER.GetShortUINamePossessiveNoTooltip] rebbe"
 kehillah_chavruta:0 "Chavruta"
 kehillah_chavruta_desc:0 "This is [CHARACTER.GetShortUINamePossessiveNoTooltip] chavruta"
