l_english:
 # 2026-11-10: the crisis's threat grade beside its current phase (the crisis window, the
 # situation list, Military > Community Safety, the crisis map). The number comes from
 # kehillah_crisis_ui_grade_value, which is 0 outside a crisis and in its ending phases.
 kehillah_crisis_grade_tag_0:0 ""
 kehillah_crisis_grade_tag_1:0 "· Contained threat"
 kehillah_crisis_grade_tag_2:0 "· Serious threat"
 kehillah_crisis_grade_tag_3:0 "· Grave threat"
 kehillah_crisis_grade_tag_4:0 "· Catastrophic threat"

 # Included with $...$ where Situation is in context.
 kehillah_crisis_grade_tag:0 "[Localize( Concatenate( 'kehillah_crisis_grade_tag_', IntToString( FixedPointToInt( Situation.MakeScope.ScriptValue( 'kehillah_crisis_ui_grade_value' ) ) ) ) )]"
 # The crisis map, where the situation is reached through the community title.
 kehillah_crisis_map_grade_tag:0 "[Localize( Concatenate( 'kehillah_crisis_grade_tag_', IntToString( FixedPointToInt( ROOT.Title.MakeScope.Var('kehillah_crisis_situation').Situation.MakeScope.ScriptValue( 'kehillah_crisis_ui_grade_value' ) ) ) ) )]"

 # The crisis window's tooltip on the grade.
 kehillah_crisis_grade_tt:0 "#T [Localize( Concatenate( 'kehillah_struck_grade_name_', IntToString( FixedPointToInt( Situation.MakeScope.ScriptValue( 'kehillah_crisis_ui_grade_value' ) ) ) ) )] Threat#!\nHow dangerous this crisis is, from Contained to Catastrophic. A graver threat makes the community's measures harder, raises the price of buying off an armed host, and allows more harm if the quarter is struck. If it is, the community recovers faster from a lesser threat and is likelier to break apart after a graver one.[Situation.MakeScope.Var('kehillah_crisis_title').Title.GetHolder.Custom('KehillahCrisisGradeOrigin')][Situation.MakeScope.Var('kehillah_crisis_title').Title.GetHolder.Custom('KehillahCrisisGradeHistory')][Situation.MakeScope.Var('kehillah_crisis_title').Title.GetHolder.Custom('KehillahCrisisGradeOutlook')]"
 # 2026-11-25: why the crisis opened as grave as it did, one clause per cause that counted for much.
 kehillah_crisis_grade_origin:0 "\n\nIt began [ROOT.Char.Custom('KehillahCrisisOriginGrade')].[ROOT.Char.Custom('KehillahCrisisOriginLord')][ROOT.Char.Custom('KehillahCrisisOriginMood')][ROOT.Char.Custom('KehillahCrisisOriginShield')]"
 kehillah_crisis_origin_lord_hostile:0 " Our lord is hostile to the Jews."
 kehillah_crisis_origin_lord_cold:0 " Our lord is cold toward us."
 kehillah_crisis_origin_lord_protective:0 " Our lord's protection tempers it."
 kehillah_crisis_origin_lord_kind:0 " Our lord's goodwill tempers it."
 kehillah_crisis_origin_mood_aflame:0 " The whole country is inflamed against us."
 kehillah_crisis_origin_mood_restless:0 " The streets are restless."
 kehillah_crisis_origin_mood_calm:0 " The streets are calm."
 kehillah_crisis_origin_shield:0 " Our standing protections blunt it."
 kehillah_crisis_grade_history_struck:0 "\n\nPreparations before the breach lowered it from [ROOT.Char.Custom('KehillahStruckGradeBefore')]."
 kehillah_crisis_grade_history_struck_up:0 "\n\nPreparations that faltered before the breach let it grow from [ROOT.Char.Custom('KehillahStruckGradeBefore')]."
 kehillah_crisis_grade_history_armed:0 "\n\nProgress toward Spared lowered it from [ROOT.Char.Custom('KehillahArmedGradeBefore')] when the host gathered."
 kehillah_crisis_grade_history_armed_up:0 "\n\nThe agitation spread while the community faltered, and it grew from [ROOT.Char.Custom('KehillahArmedGradeBefore')] when the host gathered."
 kehillah_crisis_grade_history_armed_lord:0 "\n\nOur lord's cooling favour let it grow from [ROOT.Char.Custom('KehillahArmedGradeBefore')] when the host gathered."
 kehillah_crisis_grade_history_none:0 ""
 kehillah_crisis_grade_outlook_warning:0 "\n\nIf a host gathers, it eases if the community has come at least halfway to Spared, and grows worse if not."
 kehillah_crisis_grade_outlook_armed:0 "\n\nIf the quarter is struck, it eases if the community has come at least halfway to Quarter held, and grows worse if not."
 kehillah_crisis_grade_outlook_none:0 ""
