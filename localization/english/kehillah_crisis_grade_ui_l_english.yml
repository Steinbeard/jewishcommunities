l_english:
 # 2026-11-10: the crisis's threat grade beside its current phase (the crisis window, the
 # situation list, Military > Community Safety, the crisis map). The number comes from
 # kehillah_crisis_ui_grade_value, which is 0 outside a crisis and in its ending phases.
 kehillah_crisis_grade_tag_0:0 ""
 kehillah_crisis_grade_tag_1:0 "· Contained threat"
 kehillah_crisis_grade_tag_2:0 "· Serious threat"
 kehillah_crisis_grade_tag_3:0 "· Grave threat"
 kehillah_crisis_grade_tag_4:0 "· Catastrophic threat"

 # Included with $...$ where Situation is in context.
 kehillah_crisis_grade_tag:0 "[Localize( Concatenate( 'kehillah_crisis_grade_tag_', IntToString( FixedPointToInt( Situation.MakeScope.ScriptValue( 'kehillah_crisis_ui_grade_value' ) ) ) ) )]"
 # The crisis map, where the situation is reached through the community title.
 kehillah_crisis_map_grade_tag:0 "[Localize( Concatenate( 'kehillah_crisis_grade_tag_', IntToString( FixedPointToInt( ROOT.Title.MakeScope.Var('kehillah_crisis_situation').Situation.MakeScope.ScriptValue( 'kehillah_crisis_ui_grade_value' ) ) ) ) )]"

 # The crisis window's tooltip on the grade.
 kehillah_crisis_grade_tt:0 "#T [Localize( Concatenate( 'kehillah_struck_grade_name_', IntToString( FixedPointToInt( Situation.MakeScope.ScriptValue( 'kehillah_crisis_ui_grade_value' ) ) ) ) )] Threat#!\nHow dangerous this crisis is, from Contained to Catastrophic. A graver threat makes the community's measures harder, raises the price of buying off an armed host, and allows more harm if the quarter is struck.[Situation.MakeScope.Var('kehillah_crisis_title').Title.GetHolder.Custom('KehillahCrisisGradeHistory')][Situation.MakeScope.Var('kehillah_crisis_title').Title.GetHolder.Custom('KehillahCrisisGradeOutlook')]"
 kehillah_crisis_grade_history_struck:0 "\n\nPreparations before the breach lowered it from [ROOT.Char.Custom('KehillahStruckGradeBefore')]."
 kehillah_crisis_grade_history_armed:0 "\n\nProgress toward Spared lowered it from [ROOT.Char.Custom('KehillahArmedGradeBefore')] when the host gathered."
 kehillah_crisis_grade_history_none:0 ""
 kehillah_crisis_grade_outlook_warning:0 "\n\nIf a host gathers, progress toward Spared can lower it."
 kehillah_crisis_grade_outlook_armed:0 "\n\nIf the quarter is struck, progress toward Quarter held can lower it."
 kehillah_crisis_grade_outlook_none:0 ""
