 # ROADMAP S7, 2026-09-29 -- the two characters added to the 1066 Kehillah
 # bookmark beside Isaac of Worms, plus the Financier's title and house.
 bookmark_kehillah_troyes_rashi:0 "Shlomo Yitzhaki"
 bookmark_kehillah_troyes_rashi_subheading:0 "The Scholar, Kehillah of Troyes"
 bookmark_kehillah_troyes_rashi_desc:0 "Twenty-six, newly home from the yeshivot of Mainz and Worms, and already the rabbi of his own small community in Champagne. Troyes is poor, young and far from the Rhine.\n\nThe commentaries that will make him #high Rashi#!, the teacher of every later generation, are still unwritten. Write them."

 bookmark_kehillah_rodom_yosef:0 "Yosef ben Menahem"
 bookmark_kehillah_rodom_yosef_subheading:0 "The Financier, Rouen"
 bookmark_kehillah_rodom_yosef_desc:0 "A Jewish trader of Rouen with a ledger, a following and no community of his own. Across the Channel, the Duke of Normandy is about to win a kingdom, and a king will need money.\n\nFollow the Conquest, found a community in England, and make royal finance your fortune.\n\n#weak An invented figure: the Jews of Rouen are real, but no individual of 1066 is documented well enough to play.#!"

