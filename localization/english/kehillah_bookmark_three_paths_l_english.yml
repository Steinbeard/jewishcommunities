 # ROADMAP S7, 2026-09-29 -- the two characters added to the 1066 Kehillah
 # bookmark beside Isaac of Worms, plus the Financier's title and house.
 bookmark_kehillah_troyes_rashi:0 "Shlomo Yitzhaki"
 bookmark_kehillah_troyes_rashi_subheading:0 "The Scholar, Kehillah of Troyes"
 bookmark_kehillah_troyes_rashi_desc:0 "At twenty-six, Shlomo Yitzhaki has returned from the yeshivot of Mainz and Worms to lead the small community of Troyes. Its study hall needs books and pupils.\n\nHis commentaries on the Torah and Talmud are still unwritten. Begin them here."

 bookmark_kehillah_rodom_yosef:0 "Yosef ben Menahem"
 bookmark_kehillah_rodom_yosef_subheading:0 "The Financier, Rouen"
 bookmark_kehillah_rodom_yosef_desc:0 "Yosef keeps accounts for a group of Jewish traders in Rouen, but has no community of his own. Across the Channel, the Duke of Normandy is preparing to claim England.\n\nFollow the Conquest, settle in London, and negotiate a place for the community under the new crown.\n\n#weak Yosef is an invented character; no individual Jewish trader of Rouen in 1066 is documented well enough to play.#!"

