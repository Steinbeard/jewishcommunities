 bookmark_kehillah_troyes_rashi:0 "Shlomo Yitzhaki"
 bookmark_kehillah_troyes_rashi_subheading:0 "The Scholar, Kehillah of Troyes"
 bookmark_kehillah_troyes_rashi_desc:0 "Shlomo Yitzhaki is twenty-six. He studied at Mainz and at Worms, where Isaac ha-Levi was among his teachers, and has come home to lead the community of Troyes. Its study hall needs books and pupils.\n\nHistory knows what he went on to write: a commentary on the Torah and much of the Talmud that students still open first. None of it exists yet. His daughters married scholars, and their sons carried his method further. In 1096 the crusaders reach the Rhineland towns where he was taught.\n\n#bold Build the school and its library, and take on the commentary.#!"

