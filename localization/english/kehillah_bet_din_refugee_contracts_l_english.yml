l_english:
 kehillah_bet_din.01071.t:0 "The Refugees' Wedding Contracts"
 kehillah_bet_din.01071.desc:0 "Two refugee households ask the court to recognize wedding terms copied during flight. [kbd_litigant_a.GetFirstName] presents a fresh copy; [kbd_litigant_b.GetFirstName] says a promised amount changed between copies. The couple needs certainty before the ceremony."
 kehillah_bet_din.01071.a:0 "Approve the fresh copy immediately."
 kehillah_bet_din.01071.a.tt:0 "An altered amount could bind a household unfairly."
 kehillah_bet_din.01071.b:0 "Compare witnesses and write an agreed contract."
 kehillah_bet_din.01071.b.tt:0 "A short delay gives the couple a contract both can trust."
 kehillah_bet_din.01071.c:0 "Void both copies and forbid the wedding."
 kehillah_bet_din.01071.c.tt:0 "A remediable document dispute could bar the marriage."
 kehillah_din_source_107:0 "Cite a mastered Nashim work and examine the evidence."
 kehillah_din_source_107_tt:0 "Mishnah Ketubot 1:2 gives the judges a textual point of reference. It cannot establish which terms both households accepted."
 kehillah_din_combo_107:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_107_tt:0 "The judges preserve both parties' interests while checking which terms both households accepted."
 kehillah_bet_din.01074.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01074.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01074.outcome_1:0 "The court certifies the presented copy."
 kehillah_bet_din.01074.outcome_2:0 "The judges reconcile the terms with witnesses and both households."
 kehillah_bet_din.01074.outcome_3:0 "The ceremony is barred until further notice."
 kehillah_bet_din.01074.fact_true:0 "The fresh copy raises a promised payment without consent. Immediate approval enforces the alteration."
 kehillah_bet_din.01074.fact_false:0 "The witnesses agree on the original terms. A blanket ban needlessly interrupts the couple."
 kehillah_bet_din.01074.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01074.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01074.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case107_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case107_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case107_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case107_great_log_title:0 "The Refugees' Wedding Contracts: a well-supported ruling"
 kehillah_bet_din_case107_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the refugees' wedding contracts dispute."
