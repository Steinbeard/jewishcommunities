l_english:
 # V43 slice 5 (2026-10-14): the legend of the Jewish pope.
 kehillah_jewish_pope.0001.t:0 "A Pope from Our Town"
 kehillah_jewish_pope.0001.desc:0 "The new pope, [kehillah_jp_pope.GetFirstName], was raised in a monastery not far from here. That much the priests say proudly.\n\nThe old women of the quarter say more. They say that many years ago a child of this community was taken to the font and never brought back, and that the boy had a birthmark on his left hand, and that the pope has one too."
 kehillah_jewish_pope.0001.a:0 "Someone must go to Rome."
 kehillah_jewish_pope.0001.b:0 "It is a story the old women tell."

 kehillah_jewish_pope.0002.t:0 "The Game of Chess"
 kehillah_jewish_pope.0002.desc:0 "It took a month on the road and another in the antechambers to be admitted. [kehillah_jp_pope.GetFirstName] receives the Jews' envoy with courtesy, asks after the community, and then, to the surprise of his cardinals, asks whether the envoy plays chess.\n\nThe board is set up between you. He plays white, and waits."
 kehillah_jewish_pope.0002.a:0 "Play the opening the old rabbis of our town taught their sons."
 kehillah_jewish_pope.0002.b:0 "Speak plainly. Tell him where he was born."
 kehillah_jewish_pope_knows:0 "He knows"
 kehillah_jewish_pope_does_not:0 "He does not know the move"
 kehillah_jewish_pope_does_not_tt:0 "He wins the game, thanks you for your company, and sends you home with gifts."
 kehillah_jewish_pope_angered:0 "He has you shown out"
 kehillah_jewish_pope_angered_tt:0 "The pope does not care to be told he is a Jew."

 kehillah_jewish_pope.0003.t:0 "He Knows"
 kehillah_jewish_pope.0003.desc:0 "He looks at the board for a long time without moving. Then he sends the cardinals out of the room.\n\n"My father played that," he says. "I had forgotten. I had forgotten everything but that." He asks the names of his mother and his father, and whether either is still living, and he does not hide his face when you answer."
 kehillah_jewish_pope.0003.a:0 "Ask him to protect his people."
 kehillah_jewish_pope.0003.b:0 "Ask him to come home."
 kehillah_jewish_pope_comes_home:0 "In secret, he does"
 kehillah_jewish_pope_comes_home_tt:0 "He cannot leave the throne of Peter. But in his private chapel, at night, he says the Shema."
 kehillah_jewish_pope_cannot:0 "He cannot"
 kehillah_jewish_pope_protects_tt:0 "He issues a bull of protection for the Jews: no Christian is to baptize them by force, harm them, or take their goods. A forced baptism no longer binds them."

 kehillah_jewish_pope.0010.t:0 "The Pope Who Was a Jew"
 kehillah_jewish_pope.0010.desc:0 "A story is going from community to community. The new pope, [kehillah_jp_pope.GetFirstName], is said to have been born a Jew, a child taken to the font and raised in a monastery, who rose to the throne of Peter without knowing what he was.\n\nIt is the kind of story that is told on winter nights. This one, people swear, is true."
 kehillah_jewish_pope.0010.a:0 "May he remember."
