l_english:
 kehillah_bet_din.0231.t:0 "The Child's Maintenance After Divorce"
 kehillah_bet_din.0231.desc:0 "[kbd_litigant_a.GetFirstName] represents a father who offers a small weekly payment after his divorce. [kbd_litigant_b.GetFirstName] speaks for the child's household, where food and rent now cost more. The father says his trade has slowed; the household says he has kept some earnings out of view. The court must provide for the child without setting a payment the father cannot meet."
 kehillah_bet_din.0231.a:0 "Accept the father's smaller weekly payment."
 kehillah_bet_din.0231.a.tt:0 "The agreement is quick and affordable, but hidden income would leave the child short of needed support."
 kehillah_bet_din.0231.b:0 "Pay interim support and examine the trade accounts."
 kehillah_bet_din.0231.b.tt:0 "The child receives help now. The court sets the continuing amount after inspecting receipts and expenses."
 kehillah_bet_din.0231.c:0 "Order the larger payment requested by the household."
 kehillah_bet_din.0231.c.tt:0 "The child's needs are met on paper, but an honest low income could make the order impossible to sustain."
 kehillah_din_source_23:0 "Cite a mastered Nashim work and examine the support agreement."
 kehillah_din_source_23_tt:0 "A Nashim source helps frame family obligations. The court must still establish this parent's means and the child's needs."
 kehillah_din_combo_23:0 "Have a scholar and steward review the accounts and child's needs."
 kehillah_din_combo_23_tt:0 "The judges fund interim support and compare the household budget with the father's trade receipts."
 kehillah_bet_din.0234.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0234.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0234.outcome_1:0 "The court accepts a smaller weekly payment. The father agrees, while the child's household must stretch each coin."
 kehillah_bet_din.0234.outcome_2:0 "The court orders interim support and examines the trade records before setting a continuing payment."
 kehillah_bet_din.0234.outcome_3:0 "The court orders the larger weekly payment. The child's household welcomes the ruling, but collection may prove difficult."
 kehillah_bet_din.0234.fact_true:0 "The father's books omit earnings from a second route. The smaller payment understated his means."
 kehillah_bet_din.0234.fact_false:0 "The books show a genuine decline in earnings. The larger payment would be hard to collect."
 kehillah_bet_din.0234.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0234.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0234.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case23_one_tt:0 "Communal support fills the immediate gap at a large Prosperity cost."
 kehillah_din_case23_two_tt:0 "Interim support and accounting cost some Prosperity."
 kehillah_din_case23_three_tt:0 "The court subsidizes collection at a smaller Prosperity cost."
 kehillah_bet_din_case23_great_log_title:0 "The Child's Maintenance After Divorce: a well-supported ruling"
 kehillah_bet_din_case23_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s child support claim."
 kehillah_bet_din_case23_good_log_title:0 "The Child's Maintenance After Divorce: a workable ruling"
 kehillah_bet_din_case23_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s child support claim."
 kehillah_bet_din_case23_poor_log_title:0 "The Child's Maintenance After Divorce: a disputed ruling"
 kehillah_bet_din_case23_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s child support claim."
