l_english:
 kehillah_bet_din.01141.t:0 "The Disputed Convert's Betrothal"
 kehillah_bet_din.01141.desc:0 "[kbd_litigant_a.GetFirstName] asks the court to recognize a betrothal. [kbd_litigant_b.GetFirstName] contests whether the conversion and its witnesses were established before the promise. The couple wishes to marry, but two families dispute the order of events."
 kehillah_bet_din.01141.a:0 "Recognize the betrothal on the family's account."
 kehillah_bet_din.01141.a.tt:0 "An uncertain sequence could be treated as settled law."
 kehillah_bet_din.01141.b:0 "Hear the conversion witnesses and establish the dates."
 kehillah_bet_din.01141.b.tt:0 "A careful hearing respects the couple and clarifies their status."
 kehillah_bet_din.01141.c:0 "Declare the couple unable to marry."
 kehillah_bet_din.01141.c.tt:0 "A permanent bar may be imposed without cause."
 kehillah_din_source_114:0 "Cite a mastered Nashim work and examine the evidence."
 kehillah_din_source_114_tt:0 "Mishnah Kiddushin 4:1 gives the judges a textual point of reference. It cannot establish the conversion and betrothal dates."
 kehillah_din_combo_114:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_114_tt:0 "The judges preserve both parties' interests while checking the conversion and betrothal dates."
 kehillah_bet_din.01144.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01144.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01144.outcome_1:0 "The court recognizes the betrothal immediately."
 kehillah_bet_din.01144.outcome_2:0 "The court hears both sets of witnesses and records the sequence."
 kehillah_bet_din.01144.outcome_3:0 "The court forbids the marriage."
 kehillah_bet_din.01144.fact_true:0 "The conversion testimony dates from after the promise. Immediate recognition rests on a mistaken sequence."
 kehillah_bet_din.01144.fact_false:0 "Independent witnesses confirm the earlier conversion. A marriage ban would be unfounded."
 kehillah_bet_din.01144.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01144.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01144.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case114_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case114_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case114_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_din_proposed_114_1:0 "The ruling proposed so far: $kehillah_bet_din.01141.a$"
 kehillah_din_proposed_114_2:0 "The ruling proposed so far: $kehillah_bet_din.01141.b$"
