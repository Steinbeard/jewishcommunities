l_english:
 kehillah_bet_din.01081.t:0 "The Sold Property After an Expulsion"
 kehillah_bet_din.01081.desc:0 "[kbd_litigant_a.GetFirstName] sold a house while fleeing an expulsion. [kbd_litigant_b.GetFirstName] paid the stated price and now holds the deed. The seller says a threatened confiscation forced a bargain far below value; the buyer says the sale was freely offered."
 kehillah_bet_din.01081.a:0 "Confirm the deed and end the claim."
 kehillah_bet_din.01081.a.tt:0 "A forced bargain may become permanent loss."
 kehillah_bet_din.01081.b:0 "Examine the payment, threats, and witnesses."
 kehillah_bet_din.01081.b.tt:0 "Inquiry costs money but distinguishes coercion from an honest purchase."
 kehillah_bet_din.01081.c:0 "Void every sale made during the expulsion."
 kehillah_bet_din.01081.c.tt:0 "A fair buyer may lose a lawful purchase."
 kehillah_din_source_108:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_108_tt:0 "Mishnah Bava Batra 3:1 gives the judges a textual point of reference. It cannot establish the circumstances of consent and payment."
 kehillah_din_combo_108:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_108_tt:0 "The judges preserve both parties' interests while checking the circumstances of consent and payment."
 kehillah_bet_din.01084.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01084.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01084.outcome_1:0 "The buyer keeps the house under the deed."
 kehillah_bet_din.01084.outcome_2:0 "The court preserves possession while it hears the sale witnesses."
 kehillah_bet_din.01084.outcome_3:0 "The court voids the sale by category."
 kehillah_bet_din.01084.fact_true:0 "A witness confirms the buyer used the confiscation threat to cut the price. Bare confirmation rewards coercion."
 kehillah_bet_din.01084.fact_false:0 "The seller set the price before the order and received it. Blanket reversal harms an honest buyer."
 kehillah_bet_din.01084.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01084.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01084.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case108_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case108_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case108_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
