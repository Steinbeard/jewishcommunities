l_english:
 kehillah_bet_din.0991.t:0 "The Captives from a Border Raid"
 kehillah_bet_din.0991.desc:0 "[kbd_litigant_a.GetFirstName] brings news of neighbors taken in a border raid. [kbd_litigant_b.GetFirstName] holds the relief purse and warns that the intermediary's price may rise if paid without question. Families want action before the captives are moved again."
 kehillah_bet_din.0991.a:0 "Pay the full price immediately."
 kehillah_bet_din.0991.a.tt:0 "A hurried payment may reward an invented surcharge."
 kehillah_bet_din.0991.b:0 "Fund contact and verify the captives and demand."
 kehillah_bet_din.0991.b.tt:0 "Verification costs precious time but gives families a credible path."
 kehillah_bet_din.0991.c:0 "Refuse this demand and preserve the purse."
 kehillah_bet_din.0991.c.tt:0 "A real chance of release could vanish."
 kehillah_din_source_99:0 "Cite a mastered Nashim work and examine the evidence."
 kehillah_din_source_99_tt:0 "Mishnah Gittin 4:6 gives the judges a textual point of reference. It cannot establish the captives' names and the demanded price."
 kehillah_din_combo_99:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_99_tt:0 "The judges preserve both parties' interests while checking the captives' names and the demanded price."
 kehillah_bet_din.0994.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0994.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0994.outcome_1:0 "The court sends the full ransom through the intermediary."
 kehillah_bet_din.0994.outcome_2:0 "The court funds contact, confirms names, and negotiates a documented price."
 kehillah_bet_din.0994.outcome_3:0 "The court declines the demand."
 kehillah_bet_din.0994.fact_true:0 "The intermediary added captives who were already free. Full payment wasted relief money."
 kehillah_bet_din.0994.fact_false:0 "The names and demand are genuine. Refusal leaves captives without a timely advocate."
 kehillah_bet_din.0994.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0994.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0994.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case99_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case99_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case99_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_din_proposed_99_1:0 "The ruling proposed so far: $kehillah_bet_din.0991.a$"
 kehillah_din_proposed_99_2:0 "The ruling proposed so far: $kehillah_bet_din.0991.b$"
 kehillah_din_proposed_99_3:0 "The ruling proposed so far: $kehillah_bet_din.0991.c$"
