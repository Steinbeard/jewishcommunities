l_english:
 # Sefer condition: wear, repair and the genizah (2026-11-24).
 # docs/implementation/2026-11-24-sefer-condition-and-genizah.md

 # ---- Messages ------------------------------------------------------
 kehillah_lib_wear_fragile_t:0 "A Book Falls Apart"
 kehillah_lib_wear_fragile_d:0 "The binding of #EMP [ROOT.Char.Custom('KehillahWearWorkName')]#! has given way, and loose leaves slip from it at every reading. Mend it from its page in the Beit Midrash, or it will soon be past saving."
 kehillah_lib_genizah_t:0 "A Book Laid to Rest"
 kehillah_lib_genizah_room_d:0 "#EMP [ROOT.Char.Custom('KehillahWearWorkName')]#! can no longer be read. A page that bears the Name may not be thrown away, so its leaves are gathered and laid in the community's genizah, beside the worn scrolls and letters of earlier generations."
 kehillah_lib_genizah_burial_d:0 "#EMP [ROOT.Char.Custom('KehillahWearWorkName')]#! can no longer be read. A page that bears the Name may not be thrown away, and there is no genizah to keep it, so the leaves are wrapped and buried in the cemetery, as one buries a scholar."

 # ---- Repair --------------------------------------------------------
 kehillah_lib_repair_worn_effect_tt:0 "The book is rebound and is sound again"
 kehillah_lib_repair_fragile_effect_tt:0 "The loose leaves are sewn back and the book is rebound. It is sound again"
 KEHILLAH_LIB_REPAIR_ACTION:0 "Mend"
 KEHILLAH_LIB_REPAIR_BLOCKED:0 "#N You cannot mend this book now:#!\n"

 # ---- Condition on the shelf and the book's page -----------------------
 KEHILLAH_LIB_ROW_CONDITION:0 "Condition"
 KEHILLAH_LIB_CONDITION_0:0 "Sound"
 KEHILLAH_LIB_CONDITION_1:0 "#weak Worn#!"
 KEHILLAH_LIB_CONDITION_2:0 "#N Fragile#!"
 KEHILLAH_LIB_CONDITION_TT_0:0 "The book is in good repair. Every book wears with use and years, and a Sofer's Workshop slows the wear."
 KEHILLAH_LIB_CONDITION_TT_1:0 "The binding is worn and the corners soft. It reads well enough, but it will grow fragile in time. Mending it now costs less than mending it later."
 KEHILLAH_LIB_CONDITION_TT_2:0 "The binding has failed and leaves are coming loose. Unless it is mended, it will soon be past reading and laid in the genizah, and the library will need a new copy."
