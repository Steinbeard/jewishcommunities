l_english:
 kehillah_bet_din.0321.t:0 "The Community That Refuses Its Refugees"
 kehillah_bet_din.0321.desc:0 "[kbd_litigant_a.GetFirstName] speaks for families who fled violence and ask for food and a place to sleep. [kbd_litigant_b.GetFirstName] speaks for householders who fear that the winter stores cannot feed everyone. Children are waiting outside the gate. The court must answer tonight, even though the storekeeper's count is unfinished."
 kehillah_bet_din.0321.a:0 "Admit every family and open the common stores."
 kehillah_bet_din.0321.a.tt:0 "No one is turned away, but a real shortage could leave residents and guests hungry later."
 kehillah_bet_din.0321.b:0 "Offer shelter and meals now, then count stores and seek gifts."
 kehillah_bet_din.0321.b.tt:0 "Immediate shelter is paired with a costly stock count and appeal for more food."
 kehillah_bet_din.0321.c:0 "Limit entry and send the rest onward with provisions."
 kehillah_bet_din.0321.c.tt:0 "The stores are protected, but turning families away when food is plentiful would be needless harm."
 kehillah_din_source_32:0 "Cite a mastered Zeraim work and provide immediate relief."
 kehillah_din_source_32_tt:0 "Mishnah Peah 8:7 speaks to aid for a passing poor person. It does not count this community's winter stores."
 kehillah_din_combo_32:0 "Have a scholar and steward count food while arranging shelter."
 kehillah_din_combo_32_tt:0 "The judges meet immediate need and make a plan for a longer stay."
 kehillah_bet_din.0324.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0324.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0324.outcome_1:0 "The court opens its stores to every arriving family and arranges beds wherever it can."
 kehillah_bet_din.0324.outcome_2:0 "The court gives shelter and meals, counts remaining food, and asks households to contribute."
 kehillah_bet_din.0324.outcome_3:0 "The court admits a smaller group and sends the others onward with provisions."
 kehillah_bet_din.0324.fact_true:0 "The completed count shows too little grain for an unrestricted welcome. Without new supplies, both groups would suffer."
 kehillah_bet_din.0324.fact_false:0 "The stores are ample. Sending families onward denied help the community could have given."
 kehillah_bet_din.0324.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0324.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0324.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case32_one_tt:0 "Opening stores spends substantial Prosperity."
 kehillah_din_case32_two_tt:0 "Shelter, meals and a count cost some Prosperity."
 kehillah_din_case32_three_tt:0 "Limited aid costs less but may send people into danger."
 kehillah_bet_din_case32_great_log_title:0 "The Community That Refuses Its Refugees: a well-supported ruling"
 kehillah_bet_din_case32_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s request for refuge."
 kehillah_bet_din_case32_good_log_title:0 "The Community That Refuses Its Refugees: a workable ruling"
 kehillah_bet_din_case32_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s request for refuge."
 kehillah_bet_din_case32_poor_log_title:0 "The Community That Refuses Its Refugees: a disputed ruling"
 kehillah_bet_din_case32_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s request for refuge."
