l_english:
 kehillah_bet_din.0241.t:0 "The Caravan That Returned Empty"
 kehillah_bet_din.0241.desc:0 "[kbd_litigant_a.GetFirstName] returned from a long caravan journey with little to show its investors. [kbd_litigant_b.GetFirstName] says a share of the sales was concealed before the caravan reached home. The surviving tally names goods loaded, but not every sale. The court must weigh an expensive search against the risk of accusing a partner without proof."
 kehillah_bet_din.0241.a:0 "Release the agent and cover the investors' loss."
 kehillah_bet_din.0241.a.tt:0 "The dispute ends quickly at communal expense. A concealed share would make the release unjust."
 kehillah_bet_din.0241.b:0 "Trace the caravan's sales and pay an interim share."
 kehillah_bet_din.0241.b.tt:0 "The court checks merchants and cargo records while investors receive part of what is owed."
 kehillah_bet_din.0241.c:0 "Order the agent to repay the full claimed share."
 kehillah_bet_din.0241.c.tt:0 "Investors are protected, but a genuine loss could ruin an innocent trader."
 kehillah_din_source_24:0 "Cite a mastered Nezikin work and trace the caravan's accounts."
 kehillah_din_source_24_tt:0 "A Nezikin work can frame entrusted goods and proof. It cannot tell the court what this caravan actually sold."
 kehillah_din_combo_24:0 "Pair a scholar with a trader to follow the cargo trail."
 kehillah_din_combo_24_tt:0 "The panel compares departure lists, buyer receipts and the agent's return account."
 kehillah_bet_din.0244.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0244.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0244.outcome_1:0 "The court releases the agent and covers the investors' loss from communal reserves. No further account is demanded."
 kehillah_bet_din.0244.outcome_2:0 "The court advances part of the disputed share and sends for records from the caravan's ports."
 kehillah_bet_din.0244.outcome_3:0 "The court orders full repayment from the agent. Investors welcome the decision; the trader says the caravan truly returned empty."
 kehillah_bet_din.0244.fact_true:0 "A buyer's receipt reveals a share kept off the return account. Releasing the agent would have rewarded concealment."
 kehillah_bet_din.0244.fact_false:0 "The surviving receipts support a real loss. Full repayment would punish a trader for an empty journey."
 kehillah_bet_din.0244.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0244.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0244.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case24_one_tt:0 "Communal reserves cover the claim at a large Prosperity cost."
 kehillah_din_case24_two_tt:0 "Tracing the cargo and paying an advance cost some Prosperity."
 kehillah_din_case24_three_tt:0 "Enforcement costs less but may punish an honest loss."
 kehillah_bet_din_case24_great_log_title:0 "The Caravan That Returned Empty: a well-supported ruling"
 kehillah_bet_din_case24_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s caravan accounting claim."
 kehillah_bet_din_case24_good_log_title:0 "The Caravan That Returned Empty: a workable ruling"
 kehillah_bet_din_case24_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s caravan accounting claim."
 kehillah_bet_din_case24_poor_log_title:0 "The Caravan That Returned Empty: a disputed ruling"
 kehillah_bet_din_case24_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s caravan accounting claim."
