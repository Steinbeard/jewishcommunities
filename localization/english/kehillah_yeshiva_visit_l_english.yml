l_english:
 # V49 Yeshiva Visit from the Library (docs/spec/v49-yeshiva-visit-from-the-library.md)

 # Library book page
 KEHILLAH_LIB_HOLDERS_LABEL:0 "Held in Other Libraries"
 KEHILLAH_LIB_HOLDERS_EMPTY:0 "No other known community holds this work."
 KEHILLAH_LIB_JOURNEY_ACTION:0 "Travel to study"
 KEHILLAH_LIB_JOURNEY_TT:0 "#T Travel to study#!\nOpens the Yeshiva Visit planner with this community as the destination. On arrival you can take up this work at once, and have it copied to bring home if our library lacks it.\n\nOnly a rabbi may make a Yeshiva Visit."
 KEHILLAH_LIB_COMMISSION_CARRIED:0 "A copy made during a Yeshiva Visit is on its way home."

 # Decision
 kehillah_plan_yeshiva_visit_decision:0 "Plan a Yeshiva Visit"
 kehillah_plan_yeshiva_visit_decision_desc:0 "Every library holds something the others lack. Choose a book kept in another community and travel there to study it."
 kehillah_plan_yeshiva_visit_decision_tooltip:0 "Choose a book, then plan a Yeshiva Visit to a community that holds it."
 kehillah_plan_yeshiva_visit_decision_confirm:0 "Choose a book"
 kehillah_plan_yeshiva_visit_decision_effect_tt:0 "Suggests books held elsewhere, then opens the activity planner: [GetActivityType('activity_kehillah_learn_torah_journey').GetName]."
 kehillah_plan_yeshiva_visit_cooldown_tt:0 "Not recently returned from a Yeshiva Visit"

 # Arrival with a planned book
 kehillah_learn_torah_journey.0001.planned:0 "Take up [ROOT.Char.Custom('KehillahJourneyWorkName')], the book you came for."
 kehillah_learn_torah_journey.0001.browse:0 "First see what else their shelves hold."
 kehillah_learn_torah_journey.0005.t:0 "Their Shelves"
 kehillah_learn_torah_journey.0005.desc:0 "The library holds more than the book you came for. Which shelf will you look over?"
 kehillah_learn_torah_journey.0005.back:0 "Return to the book you came for."

 # A copy to carry home
 kehillah_learn_torah_journey.0006.t:0 "A Copy to Carry Home"
 kehillah_learn_torah_journey.0006.desc:0 "Our own library has no copy of [ROOT.Char.Custom('KehillahJourneyWorkName')]. [kehillah_journey_host.GetTitledFirstName] is willing to let the exemplar be copied before you leave."
 kehillah_learn_torah_journey.0006.desc.fallback:0 "Our own library has no copy of [ROOT.Char.Custom('KehillahJourneyWorkName')]. The community here is willing to let the exemplar be copied before you leave."
 kehillah_learn_torah_journey.0006.a:0 "Copy it out myself, however long it takes."
 kehillah_learn_torah_journey.0006.a.tt:0 "You stay on for some months to copy the exemplar in your own hand. The copy then travels home and enters the community's library."
 kehillah_learn_torah_journey.0006.b:0 "Pay their scribes to copy it while I wait."
 kehillah_learn_torah_journey.0006.b.tt:0 "Their Sofer's Workshop copies the exemplar within a few weeks. The copy then travels home and enters the community's library."
 kehillah_learn_torah_journey.0006.b.needs_sofer_tt:0 "Their community has a Sofer's Workshop"
 kehillah_journey_location_invalid_tt:0 "A community whose library holds a work worth the journey (or the community chosen in the Library)"
 kehillah_learn_torah_journey.0006.c:0 "Leave the exemplar where it is."

 # Planning event
 kehillah_learn_torah_journey.0010.t:0 "Which Book Do You Seek?"
 kehillah_learn_torah_journey.0010.desc:0 "Every library holds something the others lack. Name the book you want, and the journey can be planned around the community that keeps it. The Library's book pages list every community holding a given work."
 kehillah_learn_torah_journey.0010.desc.none:0 "You have already mastered every work the other communities' libraries hold. There is nothing new to travel for, though you may still look over the libraries yourself."
 kehillah_learn_torah_journey.0010.a:0 "Study [ROOT.Char.Custom('KehillahJourneyOffer1Name')] at [kehillah_journey_offer_1_title.GetNameNoTooltip]."
 kehillah_learn_torah_journey.0010.b:0 "Study [ROOT.Char.Custom('KehillahJourneyOffer2Name')] at [kehillah_journey_offer_2_title.GetNameNoTooltip]."
 kehillah_learn_torah_journey.0010.c:0 "Choose a library myself."
 kehillah_learn_torah_journey.0010.d:0 "Not now."
