l_english:
 kehillah_bet_din.01001.t:0 "The Merchant Before the Qadi"
 kehillah_bet_din.01001.desc:0 "[kbd_litigant_a.GetFirstName] asks this court to settle a cargo debt. [kbd_litigant_b.GetFirstName] has already petitioned the qadi and says the contract named that forum. Parallel hearings could produce two answers to the same obligation."
 kehillah_bet_din.01001.a:0 "Hear the case here and disregard the other petition."
 kehillah_bet_din.01001.a.tt:0 "A promised forum may be ignored and rulings may conflict."
 kehillah_bet_din.01001.b:0 "Examine the contract and coordinate a single hearing."
 kehillah_bet_din.01001.b.tt:0 "Review of the forum clause delays payment but protects both parties."
 kehillah_bet_din.01001.c:0 "Yield every claim to the qadi."
 kehillah_bet_din.01001.c.tt:0 "A communal claim may be abandoned without need."
 kehillah_din_source_100:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_100_tt:0 "Mishnah Sanhedrin 1:1 gives the judges a textual point of reference. It cannot establish the contract's chosen forum."
 kehillah_din_combo_100:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_100_tt:0 "The judges preserve both parties' interests while checking the contract's chosen forum."
 kehillah_bet_din.01004.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01004.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01004.outcome_1:0 "The court issues its own cargo ruling."
 kehillah_bet_din.01004.outcome_2:0 "The judges verify the forum clause and seek one recognized process."
 kehillah_bet_din.01004.outcome_3:0 "The court declines every part of the claim."
 kehillah_bet_din.01004.fact_true:0 "The parties expressly chose the qadi for this contract. A second ruling creates needless conflict."
 kehillah_bet_din.01004.fact_false:0 "No forum clause exists; both parties asked this court for relief. Automatic surrender abandoned them."
 kehillah_bet_din.01004.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01004.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01004.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case100_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case100_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case100_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_din_proposed_100_1:0 "The ruling proposed so far: $kehillah_bet_din.01001.a$"
 kehillah_din_proposed_100_2:0 "The ruling proposed so far: $kehillah_bet_din.01001.b$"
 kehillah_din_proposed_100_3:0 "The ruling proposed so far: $kehillah_bet_din.01001.c$"
 kehillah_bet_din_case100_great_log_title:0 "The Merchant Before the Qadi: a well-supported ruling"
 kehillah_bet_din_case100_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the merchant before the qadi dispute."
