 # The Nagid's own modifiers.
 kehillah_nagid_serving_vizier_modifier:0 "Vizier at Court"
 kehillah_nagid_serving_vizier_modifier_desc:0 "Serves the ruler as vizier, and learns the work of government by doing it."
 kehillah_nagid_serving_treasurer_modifier:0 "Treasurer at Court"
 kehillah_nagid_serving_treasurer_modifier_desc:0 "Keeps the ruler's treasury, and grows in stewardship by it."
 kehillah_nagid_serving_physician_modifier:0 "Physician at Court"
 kehillah_nagid_serving_physician_modifier_desc:0 "Attends the ruler as physician, and grows in learning by it."
 kehillah_nagid_serving_envoy_modifier:0 "Envoy at Court"
 kehillah_nagid_serving_envoy_modifier_desc:0 "Carries the ruler's embassies, and grows in diplomacy by it."

 # The ruler's choice.
 kehillah_nagid.0003.t:0 "Service at Court"
 kehillah_nagid.0003.desc:0 "[kehillah_nagid_seat_leader.GetTitledFirstName], our [ROOT.Char.Custom('KehillahNagidOfficeName')], heads the Jews of the realm. No Jew may sit on our council, yet not all the work of a court is done there. [kehillah_nagid_seat_leader.GetSheHe|U] could keep our treasury, attend us as physician, or carry our letters abroad."
 kehillah_nagid.0003.desc_vizier:0 " Under the Dhimma, a court may even make one of the protected people its vizier, as the Zirids of Granada have done."
 kehillah_nagid.0003.vizier:0 "Make [kehillah_nagid_seat_leader.GetHerHim] my vizier."
 kehillah_nagid.0003.treasurer:0 "Give [kehillah_nagid_seat_leader.GetHerHim] the treasury."
 kehillah_nagid.0003.physician:0 "[kehillah_nagid_seat_leader.GetSheHe|U] will be my physician."
 kehillah_nagid.0003.envoy:0 "Send [kehillah_nagid_seat_leader.GetHerHim] as my envoy."
 kehillah_nagid.0003.keep:0 "Let [kehillah_nagid_seat_leader.GetHerHim] go on as my [ROOT.Char.Custom('KehillahNagidServiceName')]."
 kehillah_nagid.0003.none:0 "[kehillah_nagid_seat_leader.GetSheHe|U] need not serve at court."

 # Changing it later (the ruler).
 kehillah_assign_nagid_service_decision:0 "Assign the Head of the Jews"
 kehillah_assign_nagid_service_decision_desc:0 "Our [ROOT.Char.Custom('KehillahNagidOfficeName')], head of the Jews of the realm, serves us at court. We could put those talents to other work."
 kehillah_assign_nagid_service_decision_tooltip:0 "Choose how the head of the Jews serves you at court"
 kehillah_assign_nagid_service_decision_confirm:0 "Choose"
 kehillah_assign_nagid_service_effect_tt:0 "You choose again how your [ROOT.Char.Custom('KehillahNagidOfficeName')] serves you at court"

 # Notices to the Nagid.
 kehillah_nagid_service_named_msg_t:0 "Named [kehillah_nagid_host.Custom('KehillahNagidServiceName')]"
 kehillah_nagid_service_named_msg_d:0 "[kehillah_nagid_host.GetTitledFirstName] has asked you to serve at court as [kehillah_nagid_host.Custom('KehillahNagidServiceName')]."

