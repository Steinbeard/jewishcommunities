l_english:
 # The Nagid office (the Nagid spec, sections 7-9 and 13; slice 4, 2026-10-30).

 # --- The office's name, by court (KehillahNagidOfficeName) ---
 kehillah_nagid_name_nagid:0 "Nagid"
 kehillah_nagid_name_rab_de_la_corte:0 "Rab de la Corte"
 kehillah_nagid_name_arrabi_mor:0 "Arrabi Mor"
 kehillah_nagid_name_presbyter:0 "Presbyter of the Jews"
 kehillah_nagid_name_hochmeister:0 "Hochmeister"
 kehillah_nagid_name_master:0 "Master of the Jews"

 # --- The holder ---
 kehillah_nagid_modifier:0 "Head of the Jews of the Realm"
 kehillah_nagid_modifier_desc:0 "Confirmed by the ruler as head of all the Jews of the realm: the community's voice at court, answerable for its taxes and its peace."
 kehillah_bd_nagid_greatness:0 "\n  Head of the Jews of the realm: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_nagid_greatness_value')|0]#!"
 kehillah_bd_nagid_stability:0 "\n  Head of the Jews of the realm: #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_nagid_stability_value')|0]#!"

 # --- Founding the office (the ruler) ---
 kehillah_establish_nagid_office_decision:0 "Establish a Head of the Jews"
 kehillah_establish_nagid_office_decision_desc:0 "The Jews of our capital are many, learned and prosperous. Let one of them answer for all the Jews of the realm as [ROOT.Char.Custom('KehillahNagidOfficeName')], serve us at court, and see that their taxes are paid."
 kehillah_establish_nagid_office_decision_tooltip:0 "Found the office of head of the Jews of your realm"
 kehillah_establish_nagid_office_decision_confirm:0 "Establish the Office"
 kehillah_establish_nagid_office_effect_tt:0 "The office of #P [ROOT.Char.Custom('KehillahNagidOfficeName')]#! is founded, and the leader of the Jewish community in your capital is named to it. Each new holder, and each new ruler, must confirm the office, for a fee the community pays. While the office is filled, the Jewish communities of the realm pay more tribute."
 kehillah_nagid_no_office_yet_tt:0 "The realm has no head of the Jews yet"
 kehillah_nagid_needs_favored_tt:0 "The Jews are #P Favored#! in the realm"
 kehillah_nagid_needs_protector_tt:0 "The ruler is a #P Protector#! of the Jews"
 kehillah_nagid_needs_seat_tt:0 "A Jewish community lives in the realm's capital"
 kehillah_nagid_needs_flourishing_tt:0 "That community's Standing is #P Flourishing#! or better"
 kehillah_nagid_needs_qualified_tt:0 "Its leader is an adult, free, with Diplomacy, Stewardship or Learning of at least 12"

 # --- Abolishing it (the ruler) ---
 kehillah_abolish_nagid_office_decision:0 "Abolish the Head of the Jews"
 kehillah_abolish_nagid_office_decision_desc:0 "The Jews have a head at our court and answer to [ROOT.Char.Custom('KehillahNagidOfficeName')] before they answer to us. We will end the office."
 kehillah_abolish_nagid_office_decision_tooltip:0 "End the office of head of the Jews of your realm"
 kehillah_abolish_nagid_office_decision_confirm:0 "Abolish the Office"
 kehillah_abolish_nagid_office_effect_tt:0 "The office of #N [ROOT.Char.Custom('KehillahNagidOfficeName')]#! is abolished and its holder dismissed. Every Jewish community in the realm loses Stability, and their tribute falls back to the ordinary rate."
 kehillah_abolish_nagid_needs_cold_tt:0 "Only a ruler #N Cold#! or worse toward the Jews would abolish the office"

 # --- Asking for it (the seat's leader) ---
 kehillah_ask_nagid_office_decision:0 "Ask for a Head of the Jews"
 kehillah_ask_nagid_office_decision_desc:0 "Our community lives at the ruler's door. Other courts have named one Jew to answer for all the Jews of the realm. We could ask the same here, and that the office be ours."
 kehillah_ask_nagid_office_decision_tooltip:0 "Petition your host to found the office of head of the Jews, and to name you to it"
 kehillah_ask_nagid_office_decision_confirm:0 "Send the Petition"
 kehillah_ask_nagid_office_effect_tt:0 "The elders petition your host to found the office and to name you to it. If the host refuses, the community cannot petition again for some years."
 kehillah_ask_nagid_cooldown_tt:0 "Your host refused your petition too recently"

 # --- Events ---
 kehillah_nagid.0001.t:0 "The Head of the Jews"
 kehillah_nagid.0001.desc:0 "[kehillah_nagid_seat_leader.GetTitledFirstName] leads the Jews of our capital. The elders of the community ask that we confirm [kehillah_nagid_seat_leader.GetHerHim] as [ROOT.Char.Custom('KehillahNagidOfficeName')], head of all the Jews of our realm. They have brought the customary fee."
 kehillah_nagid.0001.reconfirm_desc:0 "[kehillah_nagid_seat_leader.GetTitledFirstName] served our predecessor as [ROOT.Char.Custom('KehillahNagidOfficeName')]. The office stands, but each new ruler must confirm its holder. The community has brought the customary fee."
 kehillah_nagid.0001.a:0 "Confirm [kehillah_nagid_seat_leader.GetHerHim]."
 kehillah_nagid.0001.b:0 "Not yet."
 kehillah_nagid.0002.t:0 "A Petition from the Jews"
 kehillah_nagid.0002.desc:0 "[kehillah_nagid_seat_leader.GetTitledFirstName] and the elders of the Jews of our capital ask that we name one of them head over all the Jews of the realm, as [ROOT.Char.Custom('KehillahNagidOfficeName')], to answer for them at court and to serve us. They would have the office go to [kehillah_nagid_seat_leader.GetFirstName]."
 kehillah_nagid.0002.a:0 "Establish the office."
 kehillah_nagid.0002.b:0 "Refuse."

 # --- Notices ---
 kehillah_nagid_named_msg_t:0 "Named [kehillah_nagid_host.Custom('KehillahNagidOfficeName')]"
 kehillah_nagid_named_msg_d:0 "[kehillah_nagid_host.GetTitledFirstName] has confirmed you as [kehillah_nagid_host.Custom('KehillahNagidOfficeName')], head of the Jews of [kehillah_nagid_host.GetPrimaryTitle.GetNameNoTooltip]."
 kehillah_nagid_withheld_msg_t:0 "Confirmation Withheld"
 kehillah_nagid_withheld_msg_d:0 "[kehillah_nagid_host.GetTitledFirstName] has not confirmed you as head of the Jews of [kehillah_nagid_host.GetPrimaryTitle.GetNameNoTooltip] for now. The office stays vacant."
 kehillah_nagid_lost_msg_t:0 "No Longer Head of the Jews"
 kehillah_nagid_lost_msg_d:0 "You no longer hold the office of head of the Jews of the realm: you no longer qualify for it, or the realm no longer keeps it."
 kehillah_nagid_abolished_msg_t:0 "The Office Abolished"
 kehillah_nagid_abolished_msg_d:0 "[kehillah_nagid_host.GetTitledFirstName] has ended the office of head of the Jews of [kehillah_nagid_host.GetPrimaryTitle.GetNameNoTooltip]."
 kehillah_nagid_petition_refused_msg_t:0 "The Petition Refused"
 kehillah_nagid_petition_refused_msg_d:0 "[kehillah_nagid_host.GetTitledFirstName] will not found the office of head of the Jews. The elders may ask again in some years."

 # --- The service at court (section 9, Route B; slice 5, 2026-10-31) ---
 kehillah_nagid_service_vizier:0 "Vizier"
 kehillah_nagid_service_treasurer:0 "Treasurer"
 kehillah_nagid_service_physician:0 "Physician"
 kehillah_nagid_service_envoy:0 "Envoy"
 kehillah_nagid_service_none:0 "None"
 kehillah_nagid_choose_service_tt:0 "You will choose how [kehillah_nagid_seat_leader.GetFirstName] serves you at court"

 # The ruler's modifiers: one per service and skill tier.
 kehillah_nagid_service_tier_1:0 "Middling"
 kehillah_nagid_service_tier_2:0 "Able"
 kehillah_nagid_service_tier_3:0 "Skilled"
 kehillah_nagid_service_tier_4:0 "Brilliant"
 kehillah_nagid_service_vizier_desc:0 "The head of the Jews of the realm serves as vizier. No seat on the council can be theirs, but the business of the court passes through their hands. The abler the vizier, the more it shows."
 kehillah_nagid_service_treasurer_desc:0 "The head of the Jews of the realm keeps the treasury and farms the taxes. The abler the treasurer, the more it shows."
 kehillah_nagid_service_physician_desc:0 "The head of the Jews of the realm attends the ruler as physician. The more learned the physician, the more it shows."
 kehillah_nagid_service_envoy_desc:0 "The head of the Jews of the realm carries the ruler's letters to foreign courts. The abler the envoy, the more it shows."
 kehillah_nagid_service_vizier_1_modifier:0 "A Jewish Vizier: $kehillah_nagid_service_tier_1$"
