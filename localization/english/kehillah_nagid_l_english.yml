 kehillah_rv_nagid_tt_no_service:0 "[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_nagid_holder').Char.GetTitledFirstName] heads the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] as its [ROOT.Char.Custom('KehillahNagidOfficeName')]. [ROOT.Char.GetTitledFirstName] has named no service at court for [ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_nagid_holder').Char.GetHerHim]."
 kehillah_rv_nagid_tt_awaiting:0 "[ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_nagid_holder').Char.GetTitledFirstName] heads the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] as its [ROOT.Char.Custom('KehillahNagidOfficeName')], but [ROOT.Char.GetTitledFirstName] has not yet confirmed [ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_nagid_holder').Char.GetHerHim]. Until then [ROOT.Char.GetPrimaryTitle.MakeScope.Var('kehillah_nagid_holder').Char.GetSheHe] holds no place at court."
 kehillah_rv_nagid_tt_withheld:0 "The office of [ROOT.Char.Custom('KehillahNagidOfficeName')] of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] stands vacant: [ROOT.Char.GetTitledFirstName] has withheld confirmation for now."
 kehillah_rv_nagid_tt_vacant:0 "The office of [ROOT.Char.Custom('KehillahNagidOfficeName')] of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] stands vacant until [ROOT.Char.GetTitledFirstName] confirms the leader of the Jews of the capital."
 kehillah_rv_nagid_tt_none:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] has no head of the Jews. A ruler who favors and protects the Jews may found the office once the community of the capital flourishes, and its leader may ask for it."

 # The seat (the gallery card's badge and the detail card's line).
 KEHILLAH_RV_SEAT_TOOLTIP:0 "#T Seat of the Realm's Jews#!\nThe community of the realm's capital. At the ruler's door, it gains Prosperity and Greatness from the court, but the lord's demands fall on it more often, and it is in more danger when trouble comes. The pillar and danger tooltips show by how much.\n\n#weak Its leader is the one the ruler may confirm as head of all the realm's Jews.#!"
 kehillah_rv_seat_line:0 "#P Seat of the realm's Jews#!"
 kehillah_rv_seat_line_nagid:0 "#P Seat of the realm's Jews#! #weak · home of their head#!"

