l_english:
 kehillah_bd_host_protection_good:0 "\n  #weak War harm x[ROOT.Char.MakeScope.ScriptValue('kehillah_host_protection_mult_value')|2] (the host's protection)#!"
 kehillah_bd_host_protection_bad:0 "\n  #weak War harm#! #N x[ROOT.Char.MakeScope.ScriptValue('kehillah_host_protection_mult_value')|2]#! #weak (the host's ill will)#!"
 kehillah_host_crisis.0001.t:0 "The Lord's Demands"
 kehillah_host_crisis.0001.desc:0 "A herald of [kehillah_demanding_host.GetTitledFirstName] reads out a demand before the synagogue: the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] are to pay a special levy of #EMP [ROOT.Char.MakeScope.Var('kehillah_host_levy').GetValue|0]#! gold, or see their charter revised to the lord's liking.\n\nNo law gives [kehillah_demanding_host.GetHerHim] the right, and no court would stop [kehillah_demanding_host.GetHerHim]. [kehillah_demanding_host.GetSheHe|U] is [kehillah_demanding_host.Custom('KehillahOutlookBand')] toward the Jews."
 kehillah_host_crisis.0001.a:0 "Pay the levy."
 kehillah_host_crisis.0001.b:0 "Send [kehillah_plea_envoy.GetFirstName] to plead with [kehillah_demanding_host.GetTitledFirstName]."
 kehillah_host_crisis.0001.b_self:0 "Go to [kehillah_demanding_host.GetTitledFirstName] yourself and plead."
 kehillah_host_crisis.0001.c:0 "Appeal to [kehillah_appeal_hof.GetTitledFirstName]."
 kehillah_host_crisis.0001.d:0 "We will not pay."
 kehillah_host_crisis_plea_success:0 "The lord relents"
 kehillah_host_crisis_plea_failure:0 "The lord will not be moved"
 kehillah_host_crisis_appeal_success:0 "The head of the faith rebukes the lord"
 kehillah_host_crisis_appeal_failure:0 "The appeal goes unanswered"
 kehillah_host_demands_dropped_tt:0 "The lord drops his demand."
 kehillah_host_demands_charter_worse_tt:0 "The lord forces one term of our charter to worsen: the community's security, its right to build, its own jurisdiction, or its books and markets."
 kehillah_host_demands_plea_outlook_tt:0 "[kehillah_demanding_host.GetTitledFirstName] thinks a little better of the Jews."
 kehillah_host_demands_appeal_resent_tt:0 "[kehillah_demanding_host.GetTitledFirstName] resents the rebuke, and thinks worse of the Jews."
 kehillah_host_demands_appeal_angered_tt:0 "[kehillah_demanding_host.GetTitledFirstName] is angered that the Jews went over [kehillah_demanding_host.GetHerHis] head, and thinks worse of them."
 kehillah_host_demands_refuse_outlook_tt:0 "[kehillah_demanding_host.GetTitledFirstName] thinks worse of the Jews."
 kehillah_factor_hof_protective:0 "The head of the faith is #P Protective#! of the Jews"
 kehillah_factor_hof_well_disposed:0 "The head of the faith is #P Well-disposed#! toward the Jews"
 kehillah_host_crisis.0010.t:0 "The Mob at the Gates"
 kehillah_host_crisis.0010.desc:0 "The rising led by [kehillah_rising_leader.GetTitledFirstName] has turned on the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. Shops are broken open and the synagogue's doors are battered. \n\n"
 kehillah_host_crisis.0010.lord:0 "[ROOT.Char.Custom('KehillahRisingLordResponse')]"
 kehillah_rising_lord_protective:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName] opened [ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetHerHis] castle to the Jews and [ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetHerHis] men held the rioters at the gate. Much was saved."
 kehillah_rising_lord_well_disposed:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName]'s men came, late, and drove off the worst of the mob."
 kehillah_rising_lord_indifferent:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName] did nothing. The quarter defended itself as best it could."
 kehillah_rising_lord_cold:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName]'s men stood by and watched."
 kehillah_rising_lord_hostile:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName]'s own men joined the plunder, and carried the spoils to [ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetHerHis] treasury."
 kehillah_host_crisis.0010.a:0 "We will rebuild."
 kehillah_host_crisis.0010.losses:0 "\n\nThe community has lost #N [ROOT.Char.MakeScope.Var('kehillah_rising_last_stability').GetValue|0]#! Stability and #N [ROOT.Char.MakeScope.Var('kehillah_rising_last_prosperity').GetValue|0]#! Prosperity."
 kehillah_present_gift_interaction:0 "Present a Gift"
 kehillah_present_gift_interaction_desc:0 "Send [recipient.GetTitledFirstName] a gift from the community: a silver cup, fine cloth, a book of hours bound by Jewish craftsmen. #weak It warms [recipient.GetHerHis] opinion of you, and a little [recipient.GetHerHis] outlook on the Jews.#!\n\n#weak A fitting gift costs more for a greater lord, a richer lord and a richer community: less if [recipient.GetSheHe] is in debt, more if [recipient.GetHerHis] treasury is full, and more again for each gift the community gave in the last three years.#!"
 kehillah_present_gift_escalation_tt:0 "Each further gift within three years costs more"
 kehillah_present_gift_outlook_tt:0 "Outlook on the Jews #P +5#!"
 kehillah_forgive_debt_interaction:0 "Forgive the Debt"
 kehillah_forgive_debt_interaction_desc:0 "Release [recipient.GetTitledFirstName] from what [recipient.GetSheHe] owes the community. #weak An old debt breeds resentment; forgiving one is long remembered.#!"
 kehillah_forgive_debt_outlook_tt:0 "Outlook on the Jews #P +15#!"
 kehillah_forgive_debt_pillars_tt:0 "The money is gone: Prosperity #N -40#!. A name for generosity: Greatness #P +20#!."
 kehillah_loan_generous_outlook_tt:0 "Whatever comes of it, the borrower remembers the generosity: outlook on the Jews #P +5#!"
 kehillah_host_crisis.0002.t:0 "The Lord's Favour"
 kehillah_host_crisis.0002.desc:0 "Unasked, [kehillah_favouring_host.GetTitledFirstName] has sealed a new privilege for the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]: one of the charter's terms is to be a step more generous. \n\n[kehillah_favouring_host.GetSheHe|U] is [kehillah_favouring_host.Custom('KehillahOutlookBand')] toward the Jews ([kehillah_favouring_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0]). #weak The charter's new terms follow in the next report.#!"
 kehillah_host_crisis.0002.a:0 "Thank [kehillah_favouring_host.GetHerHim] with a gift."
 kehillah_host_crisis.0002.b:0 "Remember [kehillah_favouring_host.GetHerHim] in the synagogue's prayers."
 kehillah_host_favour_gift_outlook_tt:0 "Outlook on the Jews #P +3#!"
