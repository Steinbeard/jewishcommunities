l_english:
 kehillah_bd_host_protection_good:0 "\n  #weak (The harm of war and crusade above is lessened by the host's protection: x[ROOT.Char.MakeScope.ScriptValue('kehillah_host_protection_mult_value')|2])#!"
 kehillah_bd_host_protection_bad:0 "\n  #N (The harm of war and crusade above is made worse by the host's ill will: x[ROOT.Char.MakeScope.ScriptValue('kehillah_host_protection_mult_value')|2])#!"
 kehillah_host_crisis.0001.t:0 "The Lord's Demands"
 kehillah_host_crisis.0001.desc:0 "A herald of [kehillah_demanding_host.GetTitledFirstName] reads out a demand before the synagogue: the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] are to pay a special levy of #EMP [ROOT.Char.MakeScope.Var('kehillah_host_levy').GetValue|0]#! gold, or see their charter revised to the lord's liking. \n\n[kehillah_demanding_host.GetSheHe|U] is [kehillah_demanding_host.Custom('KehillahOutlookBand')] toward the Jews ([kehillah_demanding_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0])."
 kehillah_host_crisis.0001.a:0 "Pay the levy."
 kehillah_host_crisis.0001.b:0 "Send [kehillah_plea_shtadlan.GetFirstName] to plead with the lord."
 kehillah_host_crisis.0001.c:0 "Appeal to [kehillah_appeal_hof.GetTitledFirstName]."
 kehillah_host_crisis.0001.d:0 "We will not pay."
 kehillah_host_crisis_plea_success:0 "The Shtadlan persuades the lord"
 kehillah_host_crisis_plea_failure:0 "The lord will not be moved"
 kehillah_host_crisis_appeal_success:0 "The head of the faith rebukes the lord"
 kehillah_host_crisis_appeal_failure:0 "The appeal goes unanswered"
 kehillah_host_demands_dropped_tt:0 "The lord drops his demand."
 kehillah_host_demands_charter_worse_tt:0 "The lord forces the charter #N one step worse#!: the community's security, its right to build, its own jurisdiction, or its books and markets."
 kehillah_host_demands_stability_tt:0 "Stability #N -40#!"
 kehillah_host_demands_levy_prosperity_tt:0 "Prosperity #N -30#!"
 kehillah_host_demands_plea_outlook_tt:0 "[kehillah_demanding_host.GetTitledFirstName]'s outlook on the Jews #P +3#!"
 kehillah_host_demands_appeal_resent_tt:0 "[kehillah_demanding_host.GetTitledFirstName] resents the rebuke: outlook on the Jews #N -3#!"
 kehillah_host_demands_appeal_angered_tt:0 "[kehillah_demanding_host.GetTitledFirstName] is angered by the appeal: outlook on the Jews #N -5#!"
 kehillah_host_demands_refuse_outlook_tt:0 "[kehillah_demanding_host.GetTitledFirstName]'s outlook on the Jews #N -3#!"
 kehillah_host_crisis.0010.t:0 "The Mob at the Gates"
 kehillah_host_crisis.0010.desc:0 "The rising led by [kehillah_rising_leader.GetTitledFirstName] has turned on the Jews of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. Shops are broken open and the synagogue's doors are battered. \n\n"
 kehillah_host_crisis.0010.lord:0 "[ROOT.Char.Custom('KehillahRisingLordResponse')]"
 kehillah_rising_lord_protective:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName] opened [ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetHerHis] castle to the Jews and [ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetHerHis] men held the rioters at the gate. Much was saved."
 kehillah_rising_lord_well_disposed:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName]'s men came, late, and drove off the worst of the mob."
 kehillah_rising_lord_indifferent:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName] did nothing. The quarter defended itself as best it could."
 kehillah_rising_lord_cold:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName]'s men stood by and watched."
 kehillah_rising_lord_hostile:0 "[ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetTitledFirstName]'s own men joined the plunder, and carried the spoils to [ROOT.Char.MakeScope.Var('kehillah_rising_host_ref').Char.GetHerHis] treasury."
 kehillah_host_crisis.0010.a:0 "We will rebuild."
 kehillah_host_crisis.0010.losses_tt:0 "Stability #N [ROOT.Char.MakeScope.Var('kehillah_rising_last_stability').GetValue|0]#!, Prosperity #N [ROOT.Char.MakeScope.Var('kehillah_rising_last_prosperity').GetValue|0]#!"
 kehillah_present_gift_interaction:0 "Present a Gift"
 kehillah_present_gift_interaction_desc:0 "Send [recipient.GetTitledFirstName] a gift from the community: a silver cup, fine cloth, a book of hours bound by Jewish craftsmen. #weak It warms [recipient.GetHerHis] opinion of you, and a little [recipient.GetHerHis] outlook on the Jews.#!"
 kehillah_present_gift_cooldown_tt:0 "The community sent a gift less than five years ago"
 kehillah_present_gift_outlook_tt:0 "Outlook on the Jews #P +5#!"
 kehillah_forgive_debt_interaction:0 "Forgive the Debt"
 kehillah_forgive_debt_interaction_desc:0 "Release [recipient.GetTitledFirstName] from what [recipient.GetSheHe] owes the community. #weak An old debt breeds resentment; forgiving one is long remembered.#!"
 kehillah_forgive_debt_outlook_tt:0 "Outlook on the Jews #P +15#!"
 kehillah_forgive_debt_pillars_tt:0 "The money is gone: Prosperity #N -40#!. A name for generosity: Greatness #P +20#!."
 kehillah_loan_generous_outlook_tt:0 "Whatever comes of it, the borrower remembers the generosity: outlook on the Jews #P +5#!"
