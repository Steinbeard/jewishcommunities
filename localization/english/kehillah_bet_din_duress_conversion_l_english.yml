l_english:
 kehillah_bet_din.01091.t:0 "The Woman Converted Under Duress"
 kehillah_bet_din.01091.desc:0 "[kbd_litigant_a.GetFirstName] asks the court to rely on a woman's statement about property made during a forced conversion. [kbd_litigant_b.GetFirstName] says the statement was taken under threat. The woman is now safe enough to speak for herself if given a private hearing."
 kehillah_bet_din.01091.a:0 "Enforce the earlier statement."
 kehillah_bet_din.01091.a.tt:0 "Words spoken under threat may transfer property unjustly."
 kehillah_bet_din.01091.b:0 "Hear her freely and compare the property records."
 kehillah_bet_din.01091.b.tt:0 "A private hearing protects her voice and tests the account."
 kehillah_bet_din.01091.c:0 "Discard every statement she has ever made."
 kehillah_bet_din.01091.c.tt:0 "A truthful later claim could also be lost."
 kehillah_din_source_109:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_109_tt:0 "Mishnah Sanhedrin 3:3 gives the judges a textual point of reference. It cannot establish which statement she made freely."
 kehillah_din_combo_109:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_109_tt:0 "The judges preserve both parties' interests while checking which statement she made freely."
 kehillah_bet_din.01094.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01094.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01094.outcome_1:0 "The court treats the earlier statement as decisive."
 kehillah_bet_din.01094.outcome_2:0 "The court hears her in safety and compares each account with the records."
 kehillah_bet_din.01094.outcome_3:0 "The court refuses all her testimony."
 kehillah_bet_din.01094.fact_true:0 "The earlier statement was dictated under threat. Enforcing it would reward coercion."
 kehillah_bet_din.01094.fact_false:0 "She freely confirms a later transfer. Rejecting all her words erases her own choice."
 kehillah_bet_din.01094.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01094.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01094.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case109_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case109_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case109_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
