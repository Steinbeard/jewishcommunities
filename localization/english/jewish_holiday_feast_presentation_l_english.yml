l_english:
 jewish_holiday_feast_invitation:0 "I invite you to join my household for a festive meal. We shall offer blessings, share food, and welcome our guests in good company."
 jewish_holiday_feast_invitation_vanilla:0 "I hereby invite you to attend my feast in [barony.GetNameNoTier]! It will be a grand affair, with delightful food and entertainment."
 jewish_holiday_feast_end:0 "As the last guests depart, the blessing over our meal lingers in the hall. The table is cleared, but the warmth of this gathering will remain with my household."
 jewish_holiday_feast_end_vanilla:0 "Few candles survive after the last of the guests has left. I can hear a pair of servants letting out sighs of relief after the doors close. The food is still warm on the plates.\n\nSoon, word will reach every corner of the realm and every noble worth their salt will know that my magnificence is unparalleled."

