l_english:
 kehillah_din_argument_a_chance_tt:0 "Diplomacy challenge: [ROOT.Char.MakeScope.ScriptValue('kehillah_din_argument_a_chance_value')|0]% before citation. Diplomacy, Gregarious, Shy and Just affect this chance. Stress from the choice appears below."
 kehillah_din_argument_b_chance_tt:0 "Learning challenge: [ROOT.Char.MakeScope.ScriptValue('kehillah_din_argument_b_chance_value')|0]% before citation. Learning, Diligent, Lazy and Talmudics training affect this chance. Stress from the choice appears below."
 kehillah_din_argument_c_chance_tt:0 "Stewardship challenge: [ROOT.Char.MakeScope.ScriptValue('kehillah_din_argument_c_chance_value')|0]% before citation. Stewardship, Patient, Impatient and Just affect this chance. Stress from the choice appears below."
 kehillah_din_argument_citation_title:0 "On Whose Authority?"
 kehillah_din_argument_citation_desc:0 "You have chosen the argument. A mastered work on this part of the law may help you make it. A respected work is steadier; a less familiar work may carry more weight if your argument holds. You may also speak without naming a book."
 kehillah_din_argument_no_citation:0 "Make the argument without a citation."
 kehillah_din_argument_no_citation_tt:0 "Final chance: [ROOT.Char.MakeScope.Var('kehillah_din_argument_display_chance').GetValue|0]%. A success contributes 20; failure contributes 2."
 kehillah_din_argument_grounded_citation:0 "Cite [GetPlayer.Custom('KehillahDinCiteGrounded')]. [GetPlayer.Custom('KehillahDinCiteGroundedRisk')]"
 kehillah_din_argument_grounded_tt:0 "Final chance: [ROOT.Char.MakeScope.Var('kehillah_din_argument_grounded_display').GetValue|0]%. This work's standing improves reliability. Its rarity adds weight only if the argument succeeds."
 kehillah_din_argument_innovative_citation:0 "Cite the less familiar [GetPlayer.Custom('KehillahDinCiteInnovative')]. [GetPlayer.Custom('KehillahDinCiteInnovativeRisk')]"
 kehillah_din_argument_innovative_tt:0 "Final chance: [ROOT.Char.MakeScope.Var('kehillah_din_argument_innovative_display').GetValue|0]%. An uncommon work may add more weight on success, but its standing can make the argument less reliable."
 kehillah_din_argument_feedback_title:0 "The Argument Is Heard"
 kehillah_din_argument_feedback_success:0 "Your argument held. The court credits it with [ROOT.Char.MakeScope.Var('kehillah_din_argument_display_weight').GetValue|0] weight. Your final chance was [ROOT.Char.MakeScope.Var('kehillah_din_argument_display_chance').GetValue|0]%. The other judges must still speak."
 kehillah_din_argument_feedback_failure:0 "Your argument did not persuade the court. Your vote still stands, but it adds only [ROOT.Char.MakeScope.Var('kehillah_din_argument_display_weight').GetValue|0] weight. Your final chance was [ROOT.Char.MakeScope.Var('kehillah_din_argument_display_chance').GetValue|0]%."
 kehillah_din_argument_feedback_continue:0 "Hear the next judge."
 kehillah_din_argument_panel_desc:0 "#bold The panel's arguments#!\n[ROOT.Char.GetFirstName] (presiding): [ROOT.Char.Custom('KehillahDinVote1Position')] — [ROOT.Char.Custom('KehillahDinVote1Result')], [ROOT.Char.MakeScope.Var('kehillah_din_panel_display_1_weight').GetValue|0] weight at [ROOT.Char.MakeScope.Var('kehillah_din_panel_display_1_chance').GetValue|0]%. Source: [ROOT.Char.Custom('KehillahDinVote1Source')].\n[ROOT.Char.MakeScope.Var('kehillah_din_panel_display_judge2').Char.GetFirstName]: [ROOT.Char.Custom('KehillahDinVote2Position')] — [ROOT.Char.Custom('KehillahDinVote2Result')], [ROOT.Char.MakeScope.Var('kehillah_din_panel_display_2_weight').GetValue|0] weight at [ROOT.Char.MakeScope.Var('kehillah_din_panel_display_2_chance').GetValue|0]%. Source: [ROOT.Char.Custom('KehillahDinVote2Source')].\n[ROOT.Char.MakeScope.Var('kehillah_din_panel_display_judge3').Char.GetFirstName]: [ROOT.Char.Custom('KehillahDinVote3Position')] — [ROOT.Char.Custom('KehillahDinVote3Result')], [ROOT.Char.MakeScope.Var('kehillah_din_panel_display_3_weight').GetValue|0] weight at [ROOT.Char.MakeScope.Var('kehillah_din_panel_display_3_chance').GetValue|0]%. Source: [ROOT.Char.Custom('KehillahDinVote3Source')].\n#bold Prevailing position:#! [ROOT.Char.Custom('KehillahDinPanelWinner')] ([ROOT.Char.MakeScope.Var('kehillah_din_panel_display_weight').GetValue|0] combined weight)."
 kehillah_din_argument_held:0 "argument held"
 kehillah_din_argument_failed:0 "argument failed"
 kehillah_din_argument_no_work:0 "none"
 kehillah_din_argument_unrecorded:0 "no recorded position"
 kehillah_din_progress_unscored:0 "Bet Din: first ruling pending"
 kehillah_din_progress_scored:0 "Bet Din: [Activity.MakeScope.Var('kehillah_bet_din_session_score').GetValue|0] standing"
 kehillah_din_progress_tooltip:0 "#T Bet Din standing#!\n[Activity.MakeScope.Var('kehillah_bet_din_cases_heard_count').GetValue|0] cases decided. Current standing: [Activity.MakeScope.Var('kehillah_bet_din_session_score').GetValue|0]. Adequate: 1; strong: 3; landmark: 5. Future cases may change the final result."
