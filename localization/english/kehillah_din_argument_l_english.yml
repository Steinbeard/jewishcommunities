l_english:
 kehillah_din_argument_a_chance_tt:0 "Diplomacy challenge: [ROOT.Char.MakeScope.ScriptValue('kehillah_din_argument_a_chance_value')|0]% before citation. Diplomacy, Gregarious, Shy and Just affect this chance. Stress from the choice appears below."
 kehillah_din_argument_b_chance_tt:0 "Learning challenge: [ROOT.Char.MakeScope.ScriptValue('kehillah_din_argument_b_chance_value')|0]% before citation. Learning, Diligent, Lazy and Talmudics training affect this chance. Stress from the choice appears below."
 kehillah_din_argument_c_chance_tt:0 "Stewardship challenge: [ROOT.Char.MakeScope.ScriptValue('kehillah_din_argument_c_chance_value')|0]% before citation. Stewardship, Patient, Impatient and Just affect this chance. Stress from the choice appears below."
 kehillah_din_argument_a_factors_tt:0 "Diplomacy leads this argument. Gregarious and Just help; Shy hinders."
 kehillah_din_argument_b_factors_tt:0 "Learning leads this argument. Diligent and Talmudic training help; Lazy hinders."
 kehillah_din_argument_c_factors_tt:0 "Stewardship leads this argument. Patient and Just help; Impatient hinders."
 kehillah_din_stress_just_tt:0 "Your sense of justice makes this choice weigh on you."
 kehillah_din_stress_impatient_tt:0 "Your impatience makes the careful hearing wear on you."
 kehillah_din_stress_diligent_tt:0 "Your diligence eases the strain of reviewing the case."
 kehillah_din_argument_citation_title:0 "On Whose Authority?"
 kehillah_din_argument_citation_desc:0 "The court waits for your authority. Which work will you cite?"
 kehillah_din_argument_citation_no_books_desc:0 "No work you have mastered speaks to this case. The court waits for your argument."
 kehillah_din_argument_no_citation:0 "Speak from your own judgment."
 kehillah_din_argument_no_citation_tt:0 "Final chance: [ROOT.Char.MakeScope.Var('kehillah_din_argument_display_chance').GetValue|0]%. A success contributes 20; failure contributes 2."
 kehillah_din_argument_grounded_citation:0 "Cite [ROOT.Char.Custom('KehillahDinCiteGrounded')]. [ROOT.Char.Custom('KehillahDinCiteGroundedRisk')]"
 kehillah_din_argument_grounded_tt:0 "Final chance: [ROOT.Char.MakeScope.Var('kehillah_din_argument_grounded_display').GetValue|0]%. This work's standing improves reliability. Its rarity adds weight only if the argument succeeds."
 kehillah_din_argument_innovative_citation:0 "Cite [ROOT.Char.Custom('KehillahDinCiteInnovative')]. [ROOT.Char.Custom('KehillahDinCiteInnovativeRisk')]"
 kehillah_din_argument_innovative_tt:0 "Final chance: [ROOT.Char.MakeScope.Var('kehillah_din_argument_innovative_display').GetValue|0]%. An uncommon work may add more weight on success, but its standing can make the argument less reliable."
 kehillah_din_argument_feedback_title:0 "The Argument Is Heard"
 kehillah_din_argument_feedback_success:0 "Your words settle over the court. The judges take up your reasoning, and your ruling has gained a strong voice. The others have yet to speak."
 kehillah_din_argument_feedback_failure:0 "Your words find little purchase. A few judges listen, but the court remains unconvinced. Your ruling still stands as the others prepare to speak."
 kehillah_din_argument_preview_success:0 "Your argument persuades the court"
 kehillah_din_argument_preview_failure:0 "Your argument fails to persuade"
 kehillah_din_argument_feedback_continue:0 "Hear the next judge."
 kehillah_din_argument_panel_desc:0 "#bold The court rules:#! [ROOT.Char.Custom('KehillahDinPanelWinner')].\n\n#bold How the judges argued#!\nYou: [ROOT.Char.Custom('KehillahDinVote1Position')]. Your argument [ROOT.Char.Custom('KehillahDinVote1Result')].\n[ROOT.Char.MakeScope.Var('kehillah_din_panel_display_judge2').Char.GetFirstName]: [ROOT.Char.Custom('KehillahDinVote2Position')]. The argument [ROOT.Char.Custom('KehillahDinVote2Result')].\n[ROOT.Char.MakeScope.Var('kehillah_din_panel_display_judge3').Char.GetFirstName]: [ROOT.Char.Custom('KehillahDinVote3Position')]. The argument [ROOT.Char.Custom('KehillahDinVote3Result')]."
 kehillah_din_argument_held:0 "persuaded the court"
 kehillah_din_argument_failed:0 "failed to persuade"
 kehillah_din_argument_no_work:0 "none"
 kehillah_din_argument_unrecorded:0 "no recorded position"
 kehillah_din_progress_unscored:0 "Bet Din: first ruling pending"
 kehillah_din_progress_scored:0 "Bet Din: [Activity.MakeScope.Var('kehillah_bet_din_session_score').GetValue|0] standing"
 kehillah_din_progress_tooltip:0 "#T Bet Din standing#!\n[Activity.MakeScope.Var('kehillah_bet_din_cases_heard_count').GetValue|0] cases decided. Current standing: [Activity.MakeScope.Var('kehillah_bet_din_session_score').GetValue|0]. Adequate: 1; strong: 3; landmark: 5. Future cases may change the final result."
