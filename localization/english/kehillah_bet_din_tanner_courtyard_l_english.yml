l_english:
 kehillah_bet_din.0331.t:0 "The Tanner and the Courtyard"
 kehillah_bet_din.0331.desc:0 "[kbd_litigant_a.GetFirstName] keeps a leatherworking shop beside a shared courtyard. [kbd_litigant_b.GetFirstName] says fumes and runoff make the homes around it hard to use. The tanner promises a new drain but has not built it. Closing the shop takes away a livelihood; leaving the neighbors to bear the harm also has a price."
 kehillah_bet_din.0331.a:0 "Let the tanner work under the old arrangement."
 kehillah_bet_din.0331.a.tt:0 "A livelihood continues, but damaging runoff would leave neighbors with the cost."
 kehillah_bet_din.0331.b:0 "Set a deadline for a drain and inspect the courtyard."
 kehillah_bet_din.0331.b.tt:0 "The court pays for inspection and a practical change before deciding whether work may continue."
 kehillah_bet_din.0331.c:0 "Close the shop and move the trade elsewhere."
 kehillah_bet_din.0331.c.tt:0 "Neighbors get relief, but a sound drain could make closure needlessly severe."
 kehillah_din_source_33:0 "Cite a mastered Nezikin work and measure the nuisance."
 kehillah_din_source_33_tt:0 "Mishnah Bava Batra 2:9 gives an analogy for harmful neighboring uses. The court still needs to inspect this courtyard."
 kehillah_din_combo_33:0 "Have a scholar and steward test the drain together."
 kehillah_din_combo_33_tt:0 "The judges compare the neighbors' loss with a practical repair to the workshop."
 kehillah_bet_din.0334.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0334.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0334.outcome_1:0 "The court lets the tanner continue without changing the yard."
 kehillah_bet_din.0334.outcome_2:0 "The court orders a drain, checks the water and fumes, and sets a date for review."
 kehillah_bet_din.0334.outcome_3:0 "The court closes the shop and asks the tanner to find another site."
 kehillah_bet_din.0334.fact_true:0 "The runoff enters the neighbors' water channel. Leaving the shop unchanged imposed a real loss."
 kehillah_bet_din.0334.fact_false:0 "The proposed drain would contain the waste. Immediate closure destroyed a workable trade."
 kehillah_bet_din.0334.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0334.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0334.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case33_one_tt:0 "Unchanged trade costs substantial Stability."
 kehillah_din_case33_two_tt:0 "Inspection and a drain cost some Stability."
 kehillah_din_case33_three_tt:0 "Closure costs less now but displaces a household's work."
 kehillah_bet_din_case33_great_log_title:0 "The Tanner and the Courtyard: a well-supported ruling"
 kehillah_bet_din_case33_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s courtyard nuisance claim."
 kehillah_bet_din_case33_good_log_title:0 "The Tanner and the Courtyard: a workable ruling"
 kehillah_bet_din_case33_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s courtyard nuisance claim."
 kehillah_bet_din_case33_poor_log_title:0 "The Tanner and the Courtyard: a disputed ruling"
 kehillah_bet_din_case33_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s courtyard nuisance claim."
