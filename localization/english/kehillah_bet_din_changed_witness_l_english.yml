l_english:
 kehillah_bet_din.0791.t:0 "The Witness Who Changed His Story"
 kehillah_bet_din.0791.desc:0 "[kbd_litigant_a.GetFirstName] relies on a witness who described a debt one way at the first hearing. [kbd_litigant_b.GetFirstName] produces his second account, which gives a different date. The witness says memory improved; each litigant calls the other version a lie. The court needs the original notes before treating inconsistency as proof of fraud."
 kehillah_bet_din.0791.a:0 "Use the first account and rule now."
 kehillah_bet_din.0791.a.tt:0 "The case closes, but a false first date could distort the debt."
 kehillah_bet_din.0791.b:0 "Compare both records and question the witness again."
 kehillah_bet_din.0791.b.tt:0 "A new hearing costs time while testing the discrepancy."
 kehillah_bet_din.0791.c:0 "Reject all testimony from the witness."
 kehillah_bet_din.0791.c.tt:0 "An innocent correction could be discarded with the falsehood."
 kehillah_din_source_79:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_79_tt:0 "Mishnah Sanhedrin 3:6 gives the judges a textual point of reference. It cannot establish why the two accounts differ."
 kehillah_din_combo_79:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_79_tt:0 "The judges preserve both parties' interests while checking why the two accounts differ."
 kehillah_bet_din.0794.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0794.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0794.outcome_1:0 "The court relies on the first account."
 kehillah_bet_din.0794.outcome_2:0 "The court puts both records before the witness and asks for the change."
 kehillah_bet_din.0794.outcome_3:0 "The court excludes all of his testimony."
 kehillah_bet_din.0794.fact_true:0 "The first clerk wrote the wrong date; the witness corrected it promptly. Ruling on the first account was unsound."
 kehillah_bet_din.0794.fact_false:0 "Both accounts concern separate transactions. Blanket exclusion lost useful testimony."
 kehillah_bet_din.0794.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0794.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0794.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case79_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case79_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case79_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case79_great_log_title:0 "The Witness Who Changed His Story: a well-supported ruling"
 kehillah_bet_din_case79_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the witness who changed his story dispute."
