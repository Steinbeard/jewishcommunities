l_english:
 # She'elot, slice 1 (2026-11-22). docs/spec/2026-11-22-sheelot.md.
 kehillah_send_sheelah_interaction:0 "Send a She'elah"
 kehillah_send_sheelah_interaction_desc:0 "Write to [recipient.GetTitledFirstName] with a question: a hard case from our court, or a passage of the work you are reading. A gift goes with the letter."
 kehillah_sheelah_options_heading:0 "Our question"
 kehillah_sheelah_option_case:0 "A case from our court"
 kehillah_sheelah_option_case_desc:0 "Ask his community for a ruling on a hard case. A posek of standing is expected to answer; the gift goes to his community."
 kehillah_sheelah_option_study:0 "A passage of [actor.Custom('KehillahStudyCurrentWorkName')]"
 kehillah_sheelah_option_study_desc:0 "Ask him to explain a passage of the work you are reading, which he has mastered."
 kehillah_sheelah_choose_kind_tt:0 "Choose what to ask about"
 kehillah_sheelah_cooldown_tt:0 "We have written for a ruling within the last three years"
 kehillah_sheelah_needs_rabbi_tt:0 "Their community has a rabbi to answer"
 kehillah_sheelah_needs_greatness_tt:0 "Their community's Greatness is Healthy or higher"
 kehillah_sheelah_busy_tt:0 "They are not already answering another community's letter"
 kehillah_sheelah_send_tt:0 "A hard case from our court goes to [recipient.GetTitledFirstName]. His reply will come in some weeks."
 kehillah_sheelah.0001.t:0 "A She'elah Arrives"
 kehillah_sheelah.0001.a:0 "Send the ruling."
 kehillah_sheelah.0001.b:0 "Answer from the sources, and meet the objection."
 kehillah_sheelah.0001.c:0 "These facts do not justify a ruling. Say so."
 kehillah_sheelah.0002.t:0 "A Reply to Our She'elah"
 kehillah_sheelah.0002.declined:0 "[kds_author.GetTitledFirstName] has written back. He will not rule on the facts we sent, and we must decide the case without him."
 kehillah_sheelah.0002.a:0 "The court will rule accordingly."
 kehillah_sheelah.0002.b:0 "Then we decide it ourselves."
 # A passage of the work you are reading (2026-11-22; one of Send a She'elah's options).
 kehillah_study_help_cooldown_tt:0 "You have asked for help with your reading within the last year"
 kehillah_study_help_knows_work_tt:0 "[recipient.GetFirstName] has mastered [actor.Custom('KehillahStudyCurrentWorkName')]"
 kehillah_study_help_busy_tt:0 "[recipient.GetFirstName] is not already answering another student"
 kehillah_study_help_send_tt:0 "Your question about [actor.Custom('KehillahStudyCurrentWorkName')] goes to [recipient.GetTitledFirstName]. His reply will come in some weeks."
 kehillah_sheelah.0011.t:0 "A Student's Question"
 kehillah_sheelah.0011.desc:0 "[kehillah_study_student.GetTitledFirstName] is reading [kehillah_study_student.Custom('KehillahStudyCurrentWorkName')] and has come to a passage he cannot unravel. He copies it out for you, with his own attempts beside it, and asks how you read it."
 kehillah_sheelah.0011.a:0 "Explain the passage."
 kehillah_sheelah.0011.b:0 "Write out the whole argument for him."
 kehillah_sheelah.0011.c:0 "I have no time for this. Decline."
 kehillah_sheelah.0012.t:0 "A Reply on Your Reading"
 kehillah_sheelah.0012.brief:0 "[kehillah_study_teacher.GetTitledFirstName] has written back. His explanation is short, but it finds the thread you lost, and the next pages read more easily."
 kehillah_sheelah.0012.full:0 "[kehillah_study_teacher.GetTitledFirstName] has written back at length. He sets out the whole argument, step by step, and answers the objection that stopped you. The passage is yours now."
 kehillah_sheelah.0012.declined:0 "[kehillah_study_teacher.GetTitledFirstName] has written back. He cannot help you with this passage; you must work it out yourself."
 kehillah_sheelah.0012.moved_on:0 "[kehillah_study_teacher.GetTitledFirstName]'s reply has come, but you have since put that work aside. You keep the letter for when you return to it."
 kehillah_sheelah.0012.a:0 "Back to the page."
 kehillah_sheelah.0012.b:0 "So be it."
 kehillah_sheelah.0012.mastery_tt:0 "You master this part of the work when its study phase ends."
