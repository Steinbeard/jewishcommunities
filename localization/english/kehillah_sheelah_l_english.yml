l_english:
 # She'elot, slice 1 (2026-11-22). docs/spec/2026-11-22-sheelot.md.
 kehillah_send_sheelah_interaction:0 "Send a She'elah"
 kehillah_send_sheelah_interaction_desc:0 "Write to [recipient.GetTitledFirstName] with a question: a hard case from our court, or a passage of the work you are reading."
 kehillah_sheelah_options_heading:0 "Our question"
 kehillah_sheelah_option_case:0 "A case from our court"
 kehillah_sheelah_option_case_desc:0 "Ask [recipient.GetHerHis] community for a ruling on a hard case. A posek of standing is expected to answer, though to ask is to admit that another knows better."
 kehillah_sheelah_option_study:0 "A passage of [GetPlayer.Custom('KehillahStudyCurrentWorkName')]"
 kehillah_sheelah_option_study_desc:0 "Ask [recipient.GetHerHim] to explain a passage of the work you are reading, which [recipient.GetSheHe] has mastered."
 kehillah_sheelah_choose_kind_tt:0 "Choose what to ask about"
 kehillah_sheelah_cooldown_tt:0 "We have written for a ruling within the last year"
 kehillah_sheelah_needs_rabbi_tt:0 "Their community has a rabbi to answer"
 kehillah_sheelah_needs_greatness_tt:0 "Their community's Greatness is Healthy or higher"
 kehillah_sheelah_busy_tt:0 "They are not already answering another community's letter"
 kehillah_sheelah_send_tt:0 "A hard case from our court goes to [recipient.GetTitledFirstName]. [recipient.GetHerHis|U] reply will come in some weeks."
 kehillah_sheelah.0001.t:0 "A She'elah Arrives"
 kehillah_sheelah.0001.a:0 "Send the ruling."
 kehillah_sheelah.0001.b:0 "Answer from the sources, and meet the objection."
 kehillah_sheelah.0001.c:0 "These facts do not justify a ruling. Say so."
 # Why the letter came to us (2026-11-23): the terms of the AI's choice that hold.
 kehillah_sheelah_why_header:0 "\n\n#weak Why [kds_asking_title.GetName] wrote to you:#!"
 kehillah_sheelah_why_legendary:0 "\n $BULLET$ Our community's Greatness is #P Legendary#!"
 kehillah_sheelah_why_flourishing:0 "\n $BULLET$ Our community's Greatness is #P Flourishing#!"
 kehillah_sheelah_why_healthy:0 "\n $BULLET$ Our community's Greatness is Healthy"
 kehillah_sheelah_why_semicha:0 "\n $BULLET$ You hold semicha"
 kehillah_sheelah_why_scholarly:0 "\n $BULLET$ Our community is led in the Scholarly style"
 kehillah_sheelah_why_yeshiva:0 "\n $BULLET$ We keep a yeshiva"
 kehillah_sheelah_why_alma_mater:0 "\n $BULLET$ Their rabbi studied at our yeshiva"
 kehillah_sheelah_why_follows:0 "\n $BULLET$ They follow our rulings"
 kehillah_sheelah_why_wrote_before:0 "\n $BULLET$ They have written to us before"
 kehillah_sheelah_why_rite:0 "\n $BULLET$ They keep our rite, [ROOT.Char.GetRite.GetName]"
 kehillah_sheelah.0002.t:0 "A Reply to Our She'elah"
 kehillah_sheelah.0002.declined:0 "[kds_author.GetTitledFirstName] has written back. [kds_author.GetSheHe|U] will not rule on the facts we sent, and we must decide the case without [kds_author.GetHerHim]."
 kehillah_sheelah.0002.a:0 "The court will rule accordingly."
 kehillah_sheelah.0002.b:0 "Then we decide it ourselves."
 # A passage of the work you are reading (2026-11-22; one of Send a She'elah's options).
 kehillah_study_help_cooldown_tt:0 "You have asked for help with your reading within the last year"
 kehillah_study_help_knows_work_tt:0 "[recipient.GetFirstName] has mastered [actor.Custom('KehillahStudyCurrentWorkName')]"
 kehillah_study_help_busy_tt:0 "[recipient.GetFirstName] is not already answering another student"
 kehillah_study_help_send_tt:0 "Your question about [actor.Custom('KehillahStudyCurrentWorkName')] goes to [recipient.GetTitledFirstName]. [recipient.GetHerHis|U] reply will come in some weeks."
 kehillah_sheelah.0011.t:0 "A Student's Question"
 kehillah_sheelah.0011.desc:0 "[kehillah_study_student.GetTitledFirstName] is reading [kehillah_study_student.Custom('KehillahStudyCurrentWorkName')] and has come to a passage [kehillah_study_student.GetSheHe] cannot unravel. [kehillah_study_student.GetSheHe|U] copies it out for you, with [kehillah_study_student.GetHerHis] own attempts beside it, and asks how you read it."
 kehillah_sheelah.0011.a:0 "Explain the passage."
 kehillah_sheelah.0011.b:0 "Write out the whole argument for [kehillah_study_student.GetHerHim]."
 kehillah_sheelah.0011.c:0 "I have no time for this. Decline."
 kehillah_sheelah.0012.t:0 "A Reply on Your Reading"
 kehillah_sheelah.0012.brief:0 "[kehillah_study_teacher.GetTitledFirstName] has written back. [kehillah_study_teacher.GetHerHis|U] explanation is short, but it finds the thread you lost, and the next pages read more easily."
 kehillah_sheelah.0012.full:0 "[kehillah_study_teacher.GetTitledFirstName] has written back at length. [kehillah_study_teacher.GetSheHe|U] sets out the whole argument, step by step, and answers the objection that stopped you. The passage is yours now."
 kehillah_sheelah.0012.declined:0 "[kehillah_study_teacher.GetTitledFirstName] has written back. [kehillah_study_teacher.GetSheHe|U] cannot help you with this passage; you must work it out yourself."
 kehillah_sheelah.0012.moved_on:0 "[kehillah_study_teacher.GetTitledFirstName]'s reply has come, but you have since put that work aside. You keep the letter for when you return to it."
 kehillah_sheelah.0012.a:0 "Back to the page."
 kehillah_sheelah.0012.b:0 "So be it."
 kehillah_sheelah.0012.mastery_tt:0 "You master this part of the work when its study phase ends."
 # Slice 2: "follows the rulings of" (2026-11-22).
 kehillah_sheelah_tie_gain_posek_tt:0 "[kehillah_sheelah_asker.GetPrimaryTitle.GetName] follows our rulings more closely"
 kehillah_sheelah_tie_begin_posek_tt:0 "[kehillah_sheelah_asker.GetPrimaryTitle.GetName] begins to follow our rulings"
 kehillah_sheelah_tie_draw_posek_tt:0 "[kehillah_sheelah_asker.GetPrimaryTitle.GetName] follows the rulings of [kehillah_sheelah_asker_follows.GetName] less closely"
 kehillah_sheelah_tie_follows_tt:0 "We follow the rulings of [kds_author.GetPrimaryTitle.GetName] more closely"
 kehillah_sheelah_tie_other_tt:0 "We still follow the rulings of [kehillah_sheelah_now_followed.GetName], less closely than before"
 kehillah_bd_followers:0 "\n  Communities that follow our rulings ([ROOT.Char.MakeScope.ScriptValue('kehillah_sheelah_follower_count_value')|0]): #P +[ROOT.Char.MakeScope.ScriptValue('kehillah_bd_follower_greatness_value')|0]#!"
 kehillah_bd_follows:0 "\n  We follow the rulings of [Title.MakeScope.Var('kehillah_sheelah_follows').Title.GetName]"
 kehillah_bd_follows_strong:0 "\n  We follow the rulings of [Title.MakeScope.Var('kehillah_sheelah_follows').Title.GetName] closely"
 # Slice 3: rite pull (2026-11-22).
 kehillah_sheelah.0021.t:0 "The Customs of Our Teachers"
 kehillah_sheelah.0021.desc:0 "For years our questions have gone to [kehillah_rite_pull_title.GetName], and [kehillah_rite_pull_leader.GetTitledFirstName]'s answers have been read out in our synagogue. Now some of our householders ask why we keep our own customs at all, when the community whose rulings we follow prays and keeps the law by [kehillah_rite_pull_leader.GetRite.GetName]."
 kehillah_sheelah.0021.a:0 "We will take up their customs."
 kehillah_sheelah.0021.b:0 "Our fathers' customs are our own."
 kehillah_sheelah.0021.b.tt:0 "We follow the rulings of [kehillah_rite_pull_title.GetName] less closely"
 kehillah_sheelah_rite_court_follows_tt:0 "Our court takes up [kehillah_rite_pull_leader.GetRite.GetName] with us"
 kehillah_sheelah_rite_adopted_toast:0 "[kehillah_rite_pull_adopter.GetPrimaryTitle.GetName] Takes Up Our Customs"
 # Further letters to a player posek in a year (2026-11-23).
 kehillah_sheelah.0003.t:0 "A She'elah Answered"
 kehillah_sheelah.0003.desc:0 "[kehillah_sheelah_asker.GetPrimaryTitle.GetName] sent us a hard case. Our court answered it and sent the ruling back."
 kehillah_sheelah.0003.desc_sources:0 "[kehillah_sheelah_asker.GetPrimaryTitle.GetName] sent us a hard case. Our court answered it from the sources and sent the ruling back."