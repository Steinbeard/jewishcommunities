l_english:
 kehillah_bet_din.0641.t:0 "The Community's Divided Eruv"
 kehillah_bet_din.0641.desc:0 "[kbd_litigant_a.GetFirstName] says the courtyard's shared boundary was checked before the Sabbath. [kbd_litigant_b.GetFirstName] says a gap opened where carts pass. Families need to know whether they may carry between homes. The court must give clear guidance while the boundary's condition is established."
 kehillah_bet_din.0641.a:0 "Declare the arrangement valid without inspection."
 kehillah_bet_din.0641.a.tt:0 "Families can carry as planned, but a real gap would make the ruling unsafe."
 kehillah_bet_din.0641.b:0 "Inspect the cart passage and repair any gap."
 kehillah_bet_din.0641.b.tt:0 "Inspection costs time and supplies, yet settles the physical fact."
 kehillah_bet_din.0641.c:0 "Declare the whole arrangement invalid for this Sabbath."
 kehillah_bet_din.0641.c.tt:0 "Strict caution is clear, but an intact boundary would make disruption needless."
 kehillah_din_source_64:0 "Cite a mastered Moed work and inspect the boundary."
 kehillah_din_source_64_tt:0 "Mishnah Eruvin 1:1 treats the construction of shared boundaries. A text cannot show whether this passage has a gap today."
 kehillah_din_combo_64:0 "Have a scholar and steward walk the passage before the Sabbath."
 kehillah_din_combo_64_tt:0 "The judges make a physical check and give households timely guidance."
 kehillah_bet_din.0644.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0644.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0644.outcome_1:0 "The court confirms the eruv without walking the cart passage."
 kehillah_bet_din.0644.outcome_2:0 "The court sends a qualified examiner to the passage and orders repair if needed."
 kehillah_bet_din.0644.outcome_3:0 "The court tells every household to refrain from carrying this Sabbath."
 kehillah_bet_din.0644.fact_true:0 "The cart passage has a break. A declaration made without seeing it was unsound."
 kehillah_bet_din.0644.fact_false:0 "The boundary is continuous and maintained. Blanket invalidation burdened households without cause."
 kehillah_bet_din.0644.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0644.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0644.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case64_one_tt:0 "Uninspected approval risks substantial Stability."
 kehillah_din_case64_two_tt:0 "Inspection and repair cost some Stability."
 kehillah_din_case64_three_tt:0 "Blanket invalidation costs less now but may burden households needlessly."
 kehillah_bet_din_case64_great_log_title:0 "The Community's Divided Eruv: a well-supported ruling"
 kehillah_bet_din_case64_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s courtyard arrangement."
 kehillah_bet_din_case64_good_log_title:0 "The Community's Divided Eruv: a workable ruling"
 kehillah_bet_din_case64_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s courtyard arrangement."
 kehillah_bet_din_case64_poor_log_title:0 "The Community's Divided Eruv: a disputed ruling"
 kehillah_bet_din_case64_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s courtyard arrangement."
