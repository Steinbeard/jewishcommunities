l_english:
 kehillah_bet_din.01011.t:0 "The Christian Lord's Debt Claim"
 kehillah_bet_din.01011.desc:0 "[kbd_litigant_a.GetFirstName] carries a lord's demand for repayment from [kbd_litigant_b.GetFirstName]. A seal is visible, but the borrower says a receipt was given to the lord's steward. The court's answer may travel beyond the community."
 kehillah_bet_din.01011.a:0 "Pay the demand from communal funds."
 kehillah_bet_din.01011.a.tt:0 "Payment may duplicate a settled debt."
 kehillah_bet_din.01011.b:0 "Seek the steward's receipt and account for the seal."
 kehillah_bet_din.01011.b.tt:0 "A careful inquiry costs money but gives both sides a defensible record."
 kehillah_bet_din.01011.c:0 "Reject the lord's claim outright."
 kehillah_bet_din.01011.c.tt:0 "A valid debt could become a wider conflict."
 kehillah_din_source_101:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_101_tt:0 "Mishnah Bava Metzia 1:6 gives the judges a textual point of reference. It cannot establish whether the receipt covers this debt."
 kehillah_din_combo_101:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_101_tt:0 "The judges preserve both parties' interests while checking whether the receipt covers this debt."
 kehillah_bet_din.01014.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01014.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01014.outcome_1:0 "The court pays the sealed demand."
 kehillah_bet_din.01014.outcome_2:0 "The court requests the steward's account while preserving the claim."
 kehillah_bet_din.01014.outcome_3:0 "The court refuses payment."
 kehillah_bet_din.01014.fact_true:0 "The steward's receipt covers the debt. Immediate payment paid twice."
 kehillah_bet_din.01014.fact_false:0 "The receipt concerns another loan. Outright refusal leaves this debt unpaid."
 kehillah_bet_din.01014.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01014.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01014.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case101_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case101_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case101_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_din_proposed_101_1:0 "The ruling proposed so far: $kehillah_bet_din.01011.a$"
