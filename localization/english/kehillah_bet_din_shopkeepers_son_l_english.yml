l_english:
 kehillah_bet_din.0851.t:0 "The Shopkeeper's Son as Witness"
 kehillah_bet_din.0851.desc:0 "[kbd_litigant_a.GetFirstName] calls a young shopkeeper to testify in his father's debt case. [kbd_litigant_b.GetFirstName] says the son stands to inherit the unpaid account. The son's memory is clear, but the family books have not been opened. The court must decide how much weight a close witness can bear."
 kehillah_bet_din.0851.a:0 "Accept the son's account and order payment."
 kehillah_bet_din.0851.a.tt:0 "A quick award may rest on a hidden personal interest."
 kehillah_bet_din.0851.b:0 "Inspect the books and seek an independent witness."
 kehillah_bet_din.0851.b.tt:0 "The books and another witness cost time but test the claim."
 kehillah_bet_din.0851.c:0 "Exclude the son and dismiss the debt."
 kehillah_bet_din.0851.c.tt:0 "A reliable account may be lost merely because of kinship."
 kehillah_din_source_85:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_85_tt:0 "Mishnah Sanhedrin 3:4 gives the judges a textual point of reference. It cannot establish the witness's stake in this particular debt."
 kehillah_din_combo_85:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_85_tt:0 "The judges preserve both parties' interests while checking the witness's stake in this particular debt."
 kehillah_bet_din.0854.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0854.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0854.outcome_1:0 "The court awards the debt on the son's words."
 kehillah_bet_din.0854.outcome_2:0 "The court holds the claim and compares the family ledger with outside testimony."
 kehillah_bet_din.0854.outcome_3:0 "The court excludes the son and closes the account."
 kehillah_bet_din.0854.fact_true:0 "The son owns a share of the disputed account. His interest should have been weighed before judgment."
 kehillah_bet_din.0854.fact_false:0 "The son has no claim to the account, and independent receipts corroborate him. Dismissal discarded useful proof."
 kehillah_bet_din.0854.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0854.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0854.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case85_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case85_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case85_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case85_great_log_title:0 "The Shopkeeper's Son as Witness: a well-supported ruling"
 kehillah_bet_din_case85_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the shopkeeper's son as witness dispute."
