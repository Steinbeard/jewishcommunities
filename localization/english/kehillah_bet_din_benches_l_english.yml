l_english:
 # The bench and the benches (2026-11-25). kehillah_bet_din_benches_triggers.txt.

 # Who will judge, shown to each guest.
 activity_kehillah_bet_din_conference_guest_desc_judge:0 "#bold You may be seated as a judge.#! Two seats beside the convener go to those who arrive: the community's own rabbi first, then the leaders of fellow communities, then the most learned. Whoever is not seated sits on the benches.\n$BULLET_WITH_TAB$Sitting as a judge brings Greatness to your own community\n$BULLET_WITH_TAB$Attendees may gain [prestige_i] [prestige|E] during the sitting\n$BULLET_WITH_TAB$Attendees may improve their [opinion_i] [opinion|E] of the host"
 activity_kehillah_bet_din_conference_guest_desc_benches:0 "#bold You will sit on the benches, not the bench.#! Only those qualified in your tradition are seated as judges: among Rabbanites, an ordained rabbi. If too few arrive, learned laymen are seated in their place.\n$BULLET_WITH_TAB$From the benches you may follow the docket, study, make friends, seek semicha or bring a complaint of your own\n$BULLET_WITH_TAB$Attendees may gain [prestige_i] [prestige|E] during the sitting\n$BULLET_WITH_TAB$Attendees may improve their [opinion_i] [opinion|E] of the host"

 kehillah_din_factor_lay_judge_tt:0 "Seated without ordination: -10 chance"

 # Intents.
 kehillah_bet_din_follow_docket_intent:0 "Follow the Docket"
 kehillah_bet_din_follow_docket_intent_desc:0 "Hear every case from the benches and make your view of each known. A voice that carries can tip a close court."
 kehillah_bet_din_study_intent:0 "Study in the Library"
 kehillah_bet_din_study_intent_desc:0 "Spend the sitting with a book from the host community's shelves."
 kehillah_bet_din_make_friends_intent:0 "Make Friends"
 kehillah_bet_din_make_friends_intent_desc:0 "A sitting draws learned men from far and wide. Come to know one of them."
 kehillah_bet_din_seek_semicha_intent:0 "Seek Semicha"
 kehillah_bet_din_seek_semicha_intent_desc:0 "Ask the ordained judges to examine you. If they find you learned enough, they will lay hands on you as a rabbi."
 kehillah_bet_din_complaint_intent:0 "Bring a Complaint"
 kehillah_bet_din_complaint_intent_desc:0 "Lay a grievance of your own before the judges, outside the docket. They rule on it before the sitting ends."

 # 0001 -- a Parnas presides.
 kehillah_bet_din_benches.0001.t:0 "A Seat by Kavod"
 kehillah_bet_din_benches.0001.desc:0 "No one ever laid hands on me, and I have never claimed to be a rabbi. But the community convened this court in my name, and the judges have made room for me on the bench, out of respect for my standing and my years at the books.\n\nI will sit among them as an equal. I will also know, every time I speak, that they are weighing a Parnas's words and not a Rav's."
 kehillah_bet_din_benches.0001.a:0 "I will judge as well as I am able."

 # 0002 -- no court.
 kehillah_bet_din_benches.0002.t:0 "No Court of Three"
 kehillah_bet_din_benches.0002.desc:0 "A Bet Din needs three judges, and three could not be found. Of those who came, none was qualified to sit, and none of the laymen was learned enough to take a seat in their place.\n\nThe benches empty, and the litigants go home with their quarrels unsettled."
 kehillah_bet_din_benches.0002.a:0 "We will try again another season."
 kehillah_bet_din_benches.0002.cooldown_tt:0 "The Piety spent convening the court is returned. You still must wait to convene again."

 # 0003 -- where you sit.
 kehillah_bet_din_benches.0003.t:0 "The Court Is Seated"
 kehillah_bet_din_benches.0003.desc.seated_lay:0 "Too few qualified judges came, so the court has seated me, a layman, on the bench. I will judge alongside them, though my arguments will carry less weight than an ordained judge's.\n\n"
 kehillah_bet_din_benches.0003.desc.seated:0 "I have been seated on the bench. The cases are ours to hear.\n\n"
 kehillah_bet_din_benches.0003.desc.alternate:0 "I am qualified to sit, but the seats went to others before me. I take my place on the benches.\n\n"
 kehillah_bet_din_benches.0003.desc.benches:0 "I take my place on the benches with the other guests, close enough to hear every word the judges say.\n\n"
 kehillah_bet_din_benches.0003.desc.court:0 "[kbd_bench_av.GetName] presides, with [kbd_bench_j2.GetName] and [kbd_bench_j3.GetName] beside [kbd_bench_av.GetHerHim]."
 kehillah_bet_din_benches.0003.a:0 "Let the first case be called."

 # 0010 -- the benches lean.
 kehillah_bet_din_benches.0010.t:0 "From the Benches"
 kehillah_bet_din_benches.0010.desc:0 "A new case is called. While the judges hear the parties, those of us on the benches murmur among ourselves, and a well-placed word may reach the bench.\n\nWhich way do I lean?"
 kehillah_bet_din_benches.0010.desc.late:0 "By the time I had made up my mind, the judges had already ruled on the case."
 kehillah_bet_din_benches.0010.a:0 "Favor: [GetPlayer.Custom('KehillahDinBenchPosition1')]"
 kehillah_bet_din_benches.0010.b:0 "Favor: [GetPlayer.Custom('KehillahDinBenchPosition2')]"
 kehillah_bet_din_benches.0010.c:0 "Favor: [GetPlayer.Custom('KehillahDinBenchPosition3')]"
 kehillah_bet_din_benches.0010.d:0 "I will listen and keep my own counsel."
 kehillah_bet_din_benches.0010.e:0 "So be it."
 kehillah_bet_din_rows_heard:0 "My view reaches the bench"
 kehillah_bet_din_rows_heard_desc:0 "My argument passed from bench to bench until the judges heard it."
 kehillah_bet_din_rows_heard_tt:0 "The court gives my view weight in its ruling"
 kehillah_bet_din_rows_unheard:0 "My view goes unheard"
 kehillah_bet_din_rows_unheard_desc:0 "My argument never made it past the benches."
 kehillah_din_argument_panel_rows:0 "\nThe benches leaned toward [ROOT.Char.Custom('KehillahDinRowsLean')]"
 kehillah_bet_din_rows_line_none:0 ""

 # 0021 -- study.
 kehillah_bet_din_benches.0021.t:0 "In the Host's Library"
 kehillah_bet_din_benches.0021.desc.bare:0 "I came to study, but the community's shelves are almost empty. I spent the sitting reading whatever I could find."
 kehillah_bet_din_benches.0021.desc.mastered:0 "Between sessions I worked through [ROOT.Char.Custom('KehillahJourneyWorkName')] from the community's shelves, and by the end of the sitting I had mastered it."
 kehillah_bet_din_benches.0021.desc.reread:0 "I read [ROOT.Char.Custom('KehillahJourneyWorkName')] again from the community's shelves, and this time I understood it more deeply."
 kehillah_bet_din_benches.0021.desc.reread_failed:0 "I went back to [ROOT.Char.Custom('KehillahJourneyWorkName')] from the community's shelves, but this reading taught me nothing new."
 kehillah_bet_din_benches.0021.desc.failed:0 "I took [ROOT.Char.Custom('KehillahJourneyWorkName')] down from the community's shelves, but the sitting ended before I had mastered it."
 kehillah_bet_din_benches.0021.a:0 "Every page counts."

 # Semicha.
 kehillah_bet_din_semicha_no_examiner_t:0 "No One to Examine Me"
 kehillah_bet_din_semicha_no_examiner_desc:0 "No judge on this bench is ordained, so no one here could give me semicha."
 kehillah_bet_din_semicha_granted:0 "Semicha"
 kehillah_bet_din_semicha_granted_desc:0 "The judges questioned me on the law, conferred, and laid their hands on me. I am a rabbi."
 kehillah_bet_din_semicha_refused:0 "Not Yet"
 kehillah_bet_din_semicha_refused_desc:0 "The judges examined me and found me not yet ready. They told me to come back once I have studied more."

 # Friends.
 kehillah_bet_din_friend_made:0 "A New Friend"
 kehillah_bet_din_friend_made_desc:0 "Long evenings of argument between sessions turned into a friendship."
 kehillah_bet_din_friend_acquaintance:0 "A New Acquaintance"
 kehillah_bet_din_friend_acquaintance_desc:0 "We spoke often during the sitting and parted on good terms."
 kehillah_friend_bet_din_benches:0 "Met on the benches of a Bet Din"

 # 0030/0031 -- a complaint.
 kehillah_bet_din_benches.0030.t:0 "A Grievance of My Own"
 kehillah_bet_din_benches.0030.desc:0 "The judges will hear one private complaint outside the docket. If I am going to lay a grievance before them, I must decide whom I will name."
 kehillah_bet_din_benches.0030.desc.none:0 "I came ready to bring a complaint, but no one within my reach has wronged me in a way this court could rule on."
 kehillah_bet_din_benches.0030.a:0 "Name [kbd_complaint_cand_1.GetName]."
 kehillah_bet_din_benches.0030.b:0 "Name [kbd_complaint_cand_2.GetName]."
 kehillah_bet_din_benches.0030.c:0 "Name [kbd_complaint_cand_3.GetName]."
 kehillah_bet_din_benches.0030.d:0 "I will keep my grievances to myself."
 kehillah_bet_din_benches.0031.t:0 "The Complaint"
 kehillah_bet_din_benches.0031.desc:0 "[kbd_complaint_target.GetName] will be summoned to answer my complaint. If the judges find that I accused [kbd_complaint_target.GetHerHim] falsely, the shame will fall on me.\n\nWhat do I ask of the court?"
 kehillah_bet_din_benches.0031.cherem:0 "Ask that [kbd_complaint_target.GetHerHis] ban be made heavier."
 kehillah_bet_din_benches.0031.restitution:0 "Demand restitution for what [kbd_complaint_target.GetSheHe] cost me."
 kehillah_bet_din_benches.0031.boshet:0 "Demand damages for the insult to my honor."
 kehillah_bet_din_benches.0031.withdraw:0 "On reflection, I will let it lie."
 kehillah_bet_din_complaint_filed_tt:0 "The court will rule on your complaint before the sitting ends"
 kehillah_bet_din_complaint_cherem_win_preview:0 "The ban on [kbd_complaint_target.GetName] is made heavier"
 kehillah_bet_din_complaint_cherem_lose_preview:0 "You are censured as a false accuser"
 kehillah_bet_din_complaint_restitution_win_preview:0 "[kbd_complaint_target.GetName] pays you restitution"
 kehillah_bet_din_complaint_restitution_lose_preview:0 "Your complaint is dismissed"
 kehillah_bet_din_complaint_boshet_win_preview:0 "[kbd_complaint_target.GetName] pays for your shame"
 kehillah_bet_din_complaint_boshet_lose_preview:0 "Your complaint is dismissed"

 # The ruling, for the complainant.
 kehillah_bet_din_complaint_win_t:0 "The Court Finds for Me"
 kehillah_bet_din_complaint_lose_t:0 "The Court Finds Against Me"
 kehillah_bet_din_complaint_cherem_win_desc:0 "The judges agreed with me, and the ban on [kbd_complaint_target.GetName] has been made heavier."
 kehillah_bet_din_complaint_cherem_lose_desc:0 "The judges found that I had no grounds. They rebuked me for bringing a false accusation before the court."
 kehillah_bet_din_complaint_restitution_win_desc:0 "The judges ordered [kbd_complaint_target.GetName] to make good what [kbd_complaint_target.GetSheHe] cost me."
 kehillah_bet_din_complaint_restitution_lose_desc:0 "The judges heard my complaint and found that [kbd_complaint_target.GetName] owes me nothing."
 kehillah_bet_din_complaint_boshet_win_desc:0 "The judges ruled that [kbd_complaint_target.GetName] shamed me and must pay for it in public."
 kehillah_bet_din_complaint_boshet_lose_desc:0 "The judges found that no insult had been given. I was the only one shamed."
 kehillah_bet_din_complaint_cherem_win_tt:0 "A court cannot put a community leader under the full ban"
 kehillah_bet_din_complaint_cherem_lose_tt:0 "You are censured as a false accuser"

 # 0035 -- the defendant hears.
 kehillah_bet_din_benches.0035.opening:0 "From the Bet Din,"
 kehillah_bet_din_benches.0035.cherem_win:0 "[kbd_complainant.GetName] came before this court and asked that the ban on you be made heavier. Having heard the complaint, the court has granted it."
 kehillah_bet_din_benches.0035.cherem_lose:0 "[kbd_complainant.GetName] came before this court and asked that the ban on you be made heavier. The court found no grounds and has censured the accuser."
 kehillah_bet_din_benches.0035.restitution_win:0 "[kbd_complainant.GetName] brought a claim against you for damages. The court has found for the claimant, and restitution has been taken from your purse."
 kehillah_bet_din_benches.0035.restitution_lose:0 "[kbd_complainant.GetName] brought a claim against you for damages. The court has dismissed the claim."
 kehillah_bet_din_benches.0035.boshet_win:0 "[kbd_complainant.GetName] accused you of insulting [kbd_complainant.GetHerHis] honor. The court has upheld the accusation, and you have paid for it in shame."
 kehillah_bet_din_benches.0035.boshet_lose:0 "[kbd_complainant.GetName] accused you of insulting [kbd_complainant.GetHerHis] honor. The court has dismissed the accusation."
 kehillah_bet_din_benches.0035.a:0 "I will remember who summoned me."
 kehillah_bet_din_complaint_opinion:0 "Summoned me before the Bet Din"
