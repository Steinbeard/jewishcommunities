l_english:
 kehillah_bet_din.0631.t:0 "The Ritual Slaughterer's Apprentice"
 kehillah_bet_din.0631.desc:0 "[kbd_litigant_a.GetFirstName] speaks for an apprentice who slaughtered a bird while the master was away. [kbd_litigant_b.GetFirstName] bought the bird and asks whether it may be used. The apprentice says the cut was clean; the buyer says no examiner saw it. The court must protect the meal without turning a single unproved suspicion into a ruined apprenticeship."
 kehillah_bet_din.0631.a:0 "Accept the apprentice's account and release the bird."
 kehillah_bet_din.0631.a.tt:0 "The meal is saved, but a defective cut could be overlooked."
 kehillah_bet_din.0631.b:0 "Hold the bird for a qualified inspection."
 kehillah_bet_din.0631.b.tt:0 "Inspection delays the meal and costs the court, but tests the actual cut."
 kehillah_bet_din.0631.c:0 "Reject the bird and bar the apprentice from future work."
 kehillah_bet_din.0631.c.tt:0 "Caution protects diners, but a clean cut would make a blanket ban excessive."
 kehillah_din_source_63:0 "Cite a mastered Kodashim work and inspect the cut."
 kehillah_din_source_63_tt:0 "Mishnah Chullin 1:1 frames who may perform slaughter. The bird and the apprentice's training still require examination."
 kehillah_din_combo_63:0 "Have a scholar and steward arrange independent examination."
 kehillah_din_combo_63_tt:0 "The judges protect diners while preserving a fair path for the apprentice."
 kehillah_bet_din.0634.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0634.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0634.outcome_1:0 "The court releases the bird on the apprentice's word."
 kehillah_bet_din.0634.outcome_2:0 "The court holds the bird for an examiner and reviews the apprentice's training."
 kehillah_bet_din.0634.outcome_3:0 "The court rejects the bird and suspends the apprentice."
 kehillah_bet_din.0634.fact_true:0 "The examiner finds a defect in the cut. Immediate release would have ignored it."
 kehillah_bet_din.0634.fact_false:0 "The cut meets the required standard. A permanent ban punished work the apprentice could perform."
 kehillah_bet_din.0634.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0634.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0634.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case63_one_tt:0 "Immediate release risks substantial Stability."
 kehillah_din_case63_two_tt:0 "Inspection costs some Stability."
 kehillah_din_case63_three_tt:0 "A blanket ban costs less now but may destroy a vocation."
 kehillah_bet_din_case63_great_log_title:0 "The Ritual Slaughterer's Apprentice: a well-supported ruling"
 kehillah_bet_din_case63_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s apprentice slaughter."
 kehillah_bet_din_case63_good_log_title:0 "The Ritual Slaughterer's Apprentice: a workable ruling"
 kehillah_bet_din_case63_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s apprentice slaughter."
 kehillah_bet_din_case63_poor_log_title:0 "The Ritual Slaughterer's Apprentice: a disputed ruling"
 kehillah_bet_din_case63_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s apprentice slaughter."
