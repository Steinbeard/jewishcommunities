 #####################################################################
 # Jewish Communities map view and map mode (v12).
 #
 # Backs gui/kehillah_community_map_view.gui and gfx/map/map_modes/
 # kehillah_map_modes.txt. Design doc: docs/spec/v12-community-map-view.md.
 #
 # SCOPE NOTE. The roster keys are rendered inside a .gui widget, not
 # from a script event, so they use GUI datatypes -- Title, Character --
 # rather than ROOT/scope: promotes. The variable and custom-loc syntax
 # is otherwise identical to this mod's existing keys (compare
 # kehillah_view_standing_decision_desc in kehillah_l_english.yml).
 # On each row, Title is the d_kehillah_* community title supplied by
 # the row's own datacontext.
 #
 # The two MAP_MODE_TOOLTIP keys are the map mode's hover description
 # and are evaluated in PROVINCE scope, the way vanilla's own are
 # (ECONOMY_MAP_TOOLTIP: "[ROOT.Province.GetCounty.GetName]").
 #####################################################################

 ### Toggle
 KEHILLAH_MAP_VIEW_BUTTON_TOOLTIP:0 "#T Jewish Communities#!\n\nOpen the roster and colour the map to show each community, its standing, its leader and its home.\n\n#weak Click a community's locate button to bring its town into view.#!"
 KEHILLAH_MAP_VIEW_BUTTON_HIDE_TOOLTIP:0 "#T Hide Community Ledger#!\n\nHide the ledger while keeping the Jewish Communities map selected. Click this button again to reopen it."
 KEHILLAH_MAP_VIEW_BUTTON_SHOW_TOOLTIP:0 "#T Show Community Ledger#!\n\nReopen the ledger for the selected Jewish Communities map."

 ### Roster window
 KEHILLAH_MAP_VIEW_HEADER:0 "Jewish Communities"
 KEHILLAH_MAP_VIEW_MINIMIZED_HEADER:0 "Jewish Communities Ledger"
 KEHILLAH_MAP_VIEW_RESTORE_TOOLTIP:0 "Restore the community ledger"
 KEHILLAH_MAP_VIEW_SUBHEADER:0 "Shaded land shows customary regions (minhag). Bright host towns mark Kehillot by Standing; the roster's arrow locates each one. Region colours do not determine a community's prayer rite."

 KEHILLAH_MAP_VIEW_COL_COMMUNITY:0 "Community"
 KEHILLAH_MAP_VIEW_COL_STANDING:0 "Standing"
 KEHILLAH_MAP_VIEW_COL_P:0 "Prosp."
 KEHILLAH_MAP_VIEW_COL_S:0 "Stab."
 KEHILLAH_MAP_VIEW_COL_G:0 "Great."

 ### Region hierarchy (v12 section 7). Sub-region keys are the
 ### kehillah_minhag flags; see kehillah_minhag_geography_effects.txt.
 KEHILLAH_SUPERREGION_ASHKENAZ:0 "Ashkenaz"
 KEHILLAH_SUPERREGION_SEPHARAD:0 "Sepharad"
 KEHILLAH_SUPERREGION_MIZRACH:0 "Mizrach"
 KEHILLAH_SUPERREGION_ELSEWHERE:0 "Elsewhere"

 KEHILLAH_REGION_ANGLIA:0 "Anglia"
 KEHILLAH_REGION_WESTERN_ASHKENAZ:0 "Rhineland"
 KEHILLAH_REGION_EASTERN_ASHKENAZ:0 "Eastern Ashkenaz"
 KEHILLAH_REGION_PROVENCE:0 "Provence"
 KEHILLAH_REGION_ITALKI:0 "Italkia"
 KEHILLAH_REGION_ROMANIOTE:0 "Romaniote"
 KEHILLAH_REGION_NORTHERN_SEPHARAD:0 "Northern Sepharad"
 KEHILLAH_REGION_SOUTHERN_SEPHARAD:0 "Southern Sepharad"
 KEHILLAH_REGION_MAGHREB:0 "Maghreb"
 KEHILLAH_REGION_ERETZ_YISRAEL:0 "Eretz Yisrael"
 KEHILLAH_REGION_MISRAIM:0 "Misrayim"
 KEHILLAH_REGION_BAVEL:0 "Bavel"
 KEHILLAH_REGION_PARAS:0 "Paras"
 KEHILLAH_REGION_RADHANITE:0 "Radhanite"
 KEHILLAH_REGION_CAUCASUS:0 "Caucasus"
 KEHILLAH_REGION_UNPLACED:0 "Outside every known region"

 # "<leader>, in <host county>" -- the two facts that place a community
 # in the world. The host county is cached onto the title by
 # kehillah_cache_map_view_facts_effect; a community whose leader has no
 # domicile yet falls back to the title's own capital there, so this
 # line is never left dangling.
 KEHILLAH_MAP_VIEW_ROW_LOCATION:0 "[Title.GetHolder.GetShortUINameNoTooltip], in [Title.MakeScope.Var('kehillah_ui_host_county').Title.GetNameNoTooltip]"

 KEHILLAH_MAP_VIEW_LOCATE_TOOLTIP:0 "#T Bring into view#!\n\nMove the map to [Title.MakeScope.Var('kehillah_ui_host_county').Title.GetNameNoTooltip], where this community lives."
 KEHILLAH_MAP_VIEW_QUARTER_TOOLTIP:0 "#T Visit the Jewish Quarter#!\n\nOpen [Title.GetNameNoTooltip]'s own quarter, with its synagogue, yeshiva and other communal buildings."

 KEHILLAH_MAP_VIEW_ROW_TOOLTIP:0 "#T [Title.GetNameNoTooltip]#!\n#weak Founded [Title.MakeScope.Var('kehillah_founded_year').GetValue|0]. Led by [Title.GetHolder.GetShortUINameNoTooltip], in [Title.MakeScope.Var('kehillah_ui_host_county').Title.GetNameNoTooltip]#!\n\n#EMP Host realm#!: [Title.MakeScope.Var('kehillah_ui_host_realm').Title.GetNameNoTooltip]\n#EMP Jewish settlement policy#!: [Title.MakeScope.Var('kehillah_ui_host_realm').Title.Custom('KehillahJewishSettlementPolicy')]\n#EMP Charter status#!: [Title.Custom('KehillahCharterPolicyAlignment')]\n#weak This is the realm's frontier stance. The community's actual Host Charter determines its pillar benefits.#!\n\n#EMP Standing#!: [Title.MakeScope.Var('kehillah_var_standing').GetValue|V0] ([Title.Custom('KehillahStandingBandName')])\n#weak Standing combines the three pillars into a single measure of the community's fortunes.#!\n\n#EMP Prosperity#!: [Title.MakeScope.Var('kehillah_var_prosperity').GetValue|V0] ([Title.Custom('KehillahProsperityBandName')])\n#EMP Stability#!: [Title.MakeScope.Var('kehillah_var_stability').GetValue|V0] ([Title.Custom('KehillahStabilityBandName')])\n#EMP Greatness#!: [Title.MakeScope.Var('kehillah_var_greatness').GetValue|V0] ([Title.Custom('KehillahGreatnessBandName')])\n\n#weak Click the portrait to open the leader's court, the house to visit the community's own quarter, and the arrow to bring its town into view.#!"

 # V16 policy badge. The four labels are intentionally political
 # stances, not promises about a particular community's negotiated
 # rights; the roster tooltip explains that distinction.
 kehillah_settlement_policy_encouraged:0 "#P Settlement Encouraged#!"
 kehillah_settlement_policy_allowed:0 "#P Settlement Allowed#!"
 kehillah_settlement_policy_discouraged:0 "#N Settlement Discouraged#!"
 kehillah_settlement_policy_banned:0 "#N Settlement Banned#!"
 kehillah_charter_policy_alignment_current:0 "#P In line with the current policy#!"
 kehillah_charter_policy_review_needed:0 "#N Grandfathered rights exceed the current policy; the charter needs review#!"

 ### The map mode itself. Name and description keys follow vanilla's
 ### own convention: <map mode key> and <map mode key>_desc
 ### (game/localization/english/map/map_modes_l_english.yml).
 kehillah_communities_map:0 "Jewish Communities"
 kehillah_communities_map_desc:0 "#T Jewish Communities#!\nCustomary regions are tinted #EMP blue-violet#! for Ashkenaz, #EMP ochre#! for Sepharad and #EMP olive#! for Mizrach. Each Kehillah's home is coloured by its standing: #EMP red#! in crisis, #EMP orange#! strained, #EMP blue#! healthy, #EMP green#! flourishing and #EMP gold#! legendary. Hover a county to see its region."
 kehillah_community_rites_map:0 "Community Rites"
 # 2026-10-29: these _desc keys are also the tooltips of the two map-mode
 # buttons in the Faith strip (gui/shared/mapmodes.gui), as for vanilla modes.
 kehillah_community_rites_map_desc:0 "#T Community Rites#!\nWhich rite each Kehillah follows, taken from its leader. Only the community's own quarter is coloured:\n #EMP Blue#!: Rabbinism\n #EMP Pale blue#!: Minhag Ashkenaz\n #EMP Violet#!: Karaism\n #EMP Teal#!: Samaritan\n #EMP Gold#!: Kabarism\n #EMP Rose#!: another Jewish rite\n\n#weak Hover a coloured quarter to see its community, leader and rite.#!"
 kehillah_realm_jewish_policy_map:0 "Jewish Settlement Policy"
 kehillah_realm_jewish_policy_map_desc:0 "#T Jewish Settlement Policy#!\nEach realm's law on Jewish settlement, set by its top liege:\n #EMP Blue#!: encouraged\n #EMP Green#!: allowed\n #EMP Orange#!: discouraged\n #EMP Red#!: banned\n #EMP Grey#!: no policy, because the ruler is Jewish or leads a community\n\n#weak Hover a county to see its realm, ruler and policy.#!"

 # 2026-10-29: the rites map's hover, province scope. kehillah_paint_
 # community_rites_map_effect tags each community's host barony with
 # kehillah_map_community, as the communities map does.
 KEHILLAH_RITES_MAP_TOOLTIP_COMMUNITY:0 "#T [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetNameNoTooltip]#!\n#weak [ROOT.Province.GetCounty.GetName], led by [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetHolder.GetShortUINameNoTooltip]#!\n\n#EMP Rite#!: [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetHolder.GetRite.GetNameNoTooltip]"
 KEHILLAH_RITES_MAP_TOOLTIP_NONE:0 "#T [ROOT.Province.GetCounty.GetName]#!\n#weak No Kehillah lives here.#!"

 # Hover description, province scope. The province variable
 # kehillah_map_community is set on the community's one host barony
 # (not the whole county, since 2026-09-20) by kehillah_paint_
 # communities_map_effect and points at the community's title, so this
 # reads it straight off ROOT.Province rather than walking through the
 # county the way the county-scoped version had to.
 KEHILLAH_MAP_MODE_TOOLTIP_COMMUNITY:0 "#T [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetNameNoTooltip]#!\n#weak [ROOT.Province.GetCounty.GetName], led by [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.GetHolder.GetShortUINameNoTooltip]#!\n\n#EMP Customary region#!: [ROOT.Province.GetCounty.GetTitle.Custom('KehillahCountyRegionName')]\n#EMP Standing#!: [ROOT.Province.MakeScope.Var('kehillah_map_community').Title.MakeScope.Var('kehillah_var_standing').GetValue|V0] ([ROOT.Province.MakeScope.Var('kehillah_map_community').Title.Custom('KehillahStandingBandName')])"
 KEHILLAH_MAP_MODE_TOOLTIP_NONE:0 "#T [ROOT.Province.GetCounty.GetName]#!\n#EMP Customary region#!: [ROOT.Province.GetCounty.GetTitle.Custom('KehillahCountyRegionName')]\n#weak No Kehillah lives here.#![ROOT.Province.GetCounty.GetTitle.Custom('KehillahHistoryMapLine')]"

