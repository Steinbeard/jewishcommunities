l_english:

 #####################################################################
 # Jewish Communities map view and map mode (v12).
 #
 # Backs gui/kehillah_community_map_view.gui and gfx/map/map_modes/
 # kehillah_map_modes.txt. Design doc: docs/spec/v12-community-map-view.md.
 #
 # SCOPE NOTE. The roster keys are rendered inside a .gui widget, not
 # from a script event, so they use GUI datatypes -- Title, Character --
 # rather than ROOT/scope: promotes. The variable and custom-loc syntax
 # is otherwise identical to this mod's existing keys (compare
 # kehillah_view_standing_decision_desc in kehillah_l_english.yml).
 # On each row, Title is the c_kehillah_* community title supplied by
 # the row's own datacontext.
 #
 # The two MAP_MODE_TOOLTIP keys are the map mode's hover description
 # and are evaluated in PROVINCE scope, the way vanilla's own are
 # (ECONOMY_MAP_TOOLTIP: "[ROOT.Province.GetCounty.GetName]").
 #####################################################################

 ### Toggle
 KEHILLAH_MAP_VIEW_BUTTON_TOOLTIP:0 "#T Jewish Communities#!\n\nColour the map by every Kehillah in the known world and open the roster -- each community's standing, its leader, and where it lives.\n\n#weak Click a community's locate button to bring its town into view.#!"
 KEHILLAH_MAP_VIEW_BUTTON_CLOSE_TOOLTIP:0 "#T Jewish Communities#!\n\nClose the roster and return to the realms map."

 ### Roster window
 KEHILLAH_MAP_VIEW_HEADER:0 "Jewish Communities"
 KEHILLAH_MAP_VIEW_SUBHEADER:0 "The Kehillot of the known world, by region, greatest standing first. Each one lives in a town it does not rule."

 KEHILLAH_MAP_VIEW_COL_COMMUNITY:0 "Community"
 KEHILLAH_MAP_VIEW_COL_STANDING:0 "Standing"
 KEHILLAH_MAP_VIEW_COL_P:0 "Prosp."
 KEHILLAH_MAP_VIEW_COL_S:0 "Stab."
 KEHILLAH_MAP_VIEW_COL_G:0 "Great."

 ### Region hierarchy (v12 section 7). Sub-region keys are the
 ### kehillah_minhag flags; see kehillah_minhag_geography_effects.txt.
 KEHILLAH_SUPERREGION_ASHKENAZ:0 "Ashkenaz"
 KEHILLAH_SUPERREGION_SEPHARAD:0 "Sepharad"
 KEHILLAH_SUPERREGION_MIZRACH:0 "Mizrach"
 KEHILLAH_SUPERREGION_ELSEWHERE:0 "Elsewhere"

 KEHILLAH_REGION_ANGLIA:0 "Anglia"
 KEHILLAH_REGION_WESTERN_ASHKENAZ:0 "Rhineland"
 KEHILLAH_REGION_EASTERN_ASHKENAZ:0 "Eastern Ashkenaz"
 KEHILLAH_REGION_PROVENCE:0 "Provence"
 KEHILLAH_REGION_ITALKI:0 "Italkia"
 KEHILLAH_REGION_ROMANIOTE:0 "Romaniote"
 KEHILLAH_REGION_NORTHERN_SEPHARAD:0 "Northern Sepharad"
 KEHILLAH_REGION_SOUTHERN_SEPHARAD:0 "Southern Sepharad"
 KEHILLAH_REGION_MAGHREB:0 "Maghreb"
 KEHILLAH_REGION_ERETZ_YISRAEL:0 "Eretz Yisrael"
 KEHILLAH_REGION_MISRAIM:0 "Misrayim"
 KEHILLAH_REGION_BAVEL:0 "Bavel"
 KEHILLAH_REGION_PARAS:0 "Paras"
 KEHILLAH_REGION_RADHANITE:0 "Radhanite"
 KEHILLAH_REGION_CAUCASUS:0 "Caucasus"
 KEHILLAH_REGION_UNPLACED:0 "Outside every known region"

 # "<leader>, in <host county>" -- the two facts that place a community
 # in the world. The host county is cached onto the title by
 # kehillah_cache_map_view_facts_effect; a community whose leader has no
 # domicile yet falls back to the title's own capital there, so this
 # line is never left dangling.
 KEHILLAH_MAP_VIEW_ROW_LOCATION:0 "[Title.GetHolder.GetShortUINameNoTooltip], in [Title.MakeScope.Var('kehillah_ui_host_county').Title.GetNameNoTooltip]"

 KEHILLAH_MAP_VIEW_LOCATE_TOOLTIP:0 "#T Bring into view#!\n\nMove the map to [Title.MakeScope.Var('kehillah_ui_host_county').Title.GetNameNoTooltip], where this community lives."

 KEHILLAH_MAP_VIEW_ROW_TOOLTIP:0 "#T [Title.GetNameNoTooltip]#!\n#weak Led by [Title.GetHolder.GetShortUINameNoTooltip], in [Title.MakeScope.Var('kehillah_ui_host_county').Title.GetNameNoTooltip]#!\n\n#EMP Standing#!: [Title.MakeScope.Var('kehillah_var_standing').GetValue|V0] ([Title.Custom('KehillahStandingBandName')])\n#weak The three pillars averaged -- one figure for how the community is faring overall.#!\n\n#EMP Prosperity#!: [Title.MakeScope.Var('kehillah_var_prosperity').GetValue|V0] ([Title.Custom('KehillahProsperityBandName')])\n#EMP Stability#!: [Title.MakeScope.Var('kehillah_var_stability').GetValue|V0] ([Title.Custom('KehillahStabilityBandName')])\n#EMP Greatness#!: [Title.MakeScope.Var('kehillah_var_greatness').GetValue|V0] ([Title.Custom('KehillahGreatnessBandName')])\n\n#weak Click the portrait to open the leader's court; from their realm flag you can reach the community's own quarter. Click the locate button to bring the town into view.#!"

 ### The map mode itself. Name and description keys follow vanilla's
 ### own convention: <map mode key> and <map mode key>_desc
 ### (game/localization/english/map/map_modes_l_english.yml).
 kehillah_communities_map:0 "Jewish Communities"
 kehillah_communities_map_desc:0 "#T Jewish Communities#!\nEvery Kehillah's home county, coloured by the community's standing: #EMP red#! in crisis, #EMP orange#! strained, #EMP blue#! healthy, #EMP green#! flourishing, #EMP gold#! legendary."

 # Hover description, province scope. The county-title variable
 # kehillah_map_community is set on each host county by
 # kehillah_paint_communities_map_effect and points at the community.
 KEHILLAH_MAP_MODE_TOOLTIP_COMMUNITY:0 "#T [ROOT.Province.GetCounty.GetTitle.MakeScope.Var('kehillah_map_community').Title.GetNameNoTooltip]#!\n#weak In [ROOT.Province.GetCounty.GetName], led by [ROOT.Province.GetCounty.GetTitle.MakeScope.Var('kehillah_map_community').Title.GetHolder.GetShortUINameNoTooltip]#!\n\n#EMP Standing#!: [ROOT.Province.GetCounty.GetTitle.MakeScope.Var('kehillah_map_community').Title.MakeScope.Var('kehillah_var_standing').GetValue|V0] ([ROOT.Province.GetCounty.GetTitle.MakeScope.Var('kehillah_map_community').Title.Custom('KehillahStandingBandName')])"
 KEHILLAH_MAP_MODE_TOOLTIP_NONE:0 "#T [ROOT.Province.GetCounty.GetName]#!\n#weak No Kehillah lives here.#!"

 ### The colour titles (common/landed_titles/kehillah_map_color_titles.
 ### txt). Never shown to a player; named so nothing ever renders a raw
 ### key if one leaks into a list.
 d_kehillah_mapcolor_base:0 "Map colour: no community"
 d_kehillah_mapcolor_crisis:0 "Map colour: Crisis"
 d_kehillah_mapcolor_strained:0 "Map colour: Strained"
 d_kehillah_mapcolor_healthy:0 "Map colour: Healthy"
 d_kehillah_mapcolor_flourishing:0 "Map colour: Flourishing"
 d_kehillah_mapcolor_legendary:0 "Map colour: Legendary"
 d_kehillah_mapcolor_base_adj:0 "no-community"
 d_kehillah_mapcolor_crisis_adj:0 "Crisis"
 d_kehillah_mapcolor_strained_adj:0 "Strained"
 d_kehillah_mapcolor_healthy_adj:0 "Healthy"
 d_kehillah_mapcolor_flourishing_adj:0 "Flourishing"
 d_kehillah_mapcolor_legendary_adj:0 "Legendary"
