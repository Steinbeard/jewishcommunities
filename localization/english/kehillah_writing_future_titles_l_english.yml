 kehillah_future_detail_work_emunot_vedeot_written:0 "[GetGlobalVariable('kehillah_wk_work_emunot_vedeot_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_emunot_vedeot_historical:0 "Saadia Gaon wrote this tenth-century work to defend Jewish belief through reasoned argument. Its subjects include creation, revelation, human choice, and the relation between inherited teaching and philosophy."
