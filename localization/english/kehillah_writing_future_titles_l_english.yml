 kehillah_future_detail_work_diwan_ibn_gabirol_historical:0 "Ibn Gabirol's Hebrew poems range from philosophical reflection to piyyut and personal complaint. The catalog uses a representative late date for their circulation: the exact year of his death and the formation of a diwan remain uncertain."
