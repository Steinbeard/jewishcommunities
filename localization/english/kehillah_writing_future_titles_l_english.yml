 kehillah_future_detail_work_yefet_commentary_historical:0 "Yefet, one of the Mourners of Zion, glossed every book of the Bible with close attention to grammar and the plain sense. Karaites made it their standard commentary, and Rabbanite readers such as Abraham ibn Ezra read it and argued with it."
