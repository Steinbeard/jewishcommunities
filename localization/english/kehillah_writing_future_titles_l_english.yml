 kehillah_future_desc_work_mekor_hayyim_written:0 "A new work on Source of Life by [GetGlobalVariable('kehillah_wk_work_mekor_hayyim_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_mekor_hayyim_historical:0 "Ibn Gabirol's dialogue on matter, form and the divine will, written in Arabic."
