 kehillah_future_desc_work_chovot_halevavot_historical:0 "Bahya ibn Paquda's Duties of the Heart sets inward devotion beside the outward law."
 kehillah_future_detail_work_chovot_halevavot_written:0 "[GetGlobalVariable('kehillah_wk_work_chovot_halevavot_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_chovot_halevavot_historical:0 "Bahya ibn Paquda's Andalusian ethical work asks what intention and trust in God add to outward observance. Written in the later eleventh century, it moves from public duties toward the inward life of the worshipper."
