 kehillah_future_desc_work_iggeret_rav_sherira_historical:0 "A gaon's answer to Kairouan on how the Mishnah and the Talmud came to be written."
 kehillah_future_detail_work_iggeret_rav_sherira_written:0 "[GetGlobalVariable('kehillah_wk_work_iggeret_rav_sherira_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_iggeret_rav_sherira_historical:0 "Asked by the community of Kairouan how the oral teaching was set down, Sherira Gaon traced the chain of sages from the Mishnah through the savoraim to the geonim of his own day. It became the standard account of the rabbinic tradition."
 kehillah_writing.landmark_thesis_work_rabbenu_hananel:0 "A landmark Talmud Commentary needs conviction in $tenet_religious_legal_pronouncements_name$, held personally or by your rite."
