 kehillah_future_detail_work_etz_hayyim_karaite_written:0 "[GetGlobalVariable('kehillah_wk_work_etz_hayyim_karaite_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_etz_hayyim_karaite_historical:0 "Aaron ben Elijah took the questions of the Guide and answered them by the older Kalam of the Karaite scholars, which he held to be closer to Scripture. With his law code and commentary it closed the great age of Byzantine Karaism."
