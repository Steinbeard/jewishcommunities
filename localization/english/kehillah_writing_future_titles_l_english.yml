 kehillah_future_desc_work_rabbenu_hananel_written:0 "A new work on Talmud Commentary by [GetGlobalVariable('kehillah_wk_work_rabbenu_hananel_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_rabbenu_hananel_historical:0 "A Kairouan commentary that sums up the Talmud's discussion and rules on it."
 kehillah_future_detail_work_rabbenu_hananel_written:0 "[GetGlobalVariable('kehillah_wk_work_rabbenu_hananel_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_rabbenu_hananel_historical:0 "Rabbenu Hananel explained the Bavli's argument briefly, drew on the Yerushalmi and the geonim, and stated the law. His work carried geonic learning across North Africa and beyond."
