l_english:
 kehillah_future_title_work_emunot_vedeot_written:0 "[GetGlobalVariable('kehillah_wk_work_emunot_vedeot_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Book of Beliefs and Opinions"
 kehillah_future_title_work_emunot_vedeot_historical:0 "Emunot ve-Deot"
 kehillah_future_composer_work_emunot_vedeot_written:0 "[GetGlobalVariable('kehillah_wk_work_emunot_vedeot_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_emunot_vedeot_historical:0 "Saadia Gaon"
 kehillah_future_desc_work_emunot_vedeot_written:0 "A new work on Book of Beliefs and Opinions by [GetGlobalVariable('kehillah_wk_work_emunot_vedeot_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_emunot_vedeot_historical:0 "Saadia Gaon's Book of Beliefs and Opinions, the first systematic Jewish philosophy."
 kehillah_future_detail_work_emunot_vedeot_written:0 "[GetGlobalVariable('kehillah_wk_work_emunot_vedeot_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_emunot_vedeot_historical:0 "Saadia Gaon wrote this tenth-century work to defend Jewish belief through reasoned argument. Its subjects include creation, revelation, human choice, and the relation between inherited teaching and philosophy."
 kehillah_future_title_work_chovot_halevavot_written:0 "[GetGlobalVariable('kehillah_wk_work_chovot_halevavot_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Duties of the Heart"
 kehillah_future_title_work_chovot_halevavot_historical:0 "Chovot ha-Levavot"
 kehillah_future_composer_work_chovot_halevavot_written:0 "[GetGlobalVariable('kehillah_wk_work_chovot_halevavot_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_chovot_halevavot_historical:0 "Bahya ibn Paquda"
 kehillah_future_desc_work_chovot_halevavot_written:0 "A new work on Duties of the Heart by [GetGlobalVariable('kehillah_wk_work_chovot_halevavot_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_chovot_halevavot_historical:0 "Bahya ibn Paquda's Duties of the Heart sets inward devotion beside the outward law."
 kehillah_future_detail_work_chovot_halevavot_written:0 "[GetGlobalVariable('kehillah_wk_work_chovot_halevavot_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_chovot_halevavot_historical:0 "Bahya ibn Paquda's Andalusian ethical work asks what intention and trust in God add to outward observance. Written in the later eleventh century, it moves from public duties toward the inward life of the worshipper."
 kehillah_future_title_work_seder_rav_amram_written:0 "[GetGlobalVariable('kehillah_wk_work_seder_rav_amram_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Order of Prayer"
 kehillah_future_title_work_seder_rav_amram_historical:0 "Seder Rav Amram"
 kehillah_future_composer_work_seder_rav_amram_written:0 "[GetGlobalVariable('kehillah_wk_work_seder_rav_amram_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_seder_rav_amram_historical:0 "Amram Gaon of Sura"
 kehillah_future_desc_work_seder_rav_amram_written:0 "A new work on Order of Prayer by [GetGlobalVariable('kehillah_wk_work_seder_rav_amram_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_seder_rav_amram_historical:0 "The first full order of Jewish prayer, sent by the Gaon of Sura to the Jews of Spain."
 kehillah_future_detail_work_seder_rav_amram_written:0 "[GetGlobalVariable('kehillah_wk_work_seder_rav_amram_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_seder_rav_amram_historical:0 "Answering a request from Spain, Amram Gaon set out the prayers of the year with the laws that govern them. Copies spread through the West, and later prayer books grew out of it."
 kehillah_future_title_work_iggeret_rav_sherira_written:0 "[GetGlobalVariable('kehillah_wk_work_iggeret_rav_sherira_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Letter on the Chain of Tradition"
 kehillah_future_title_work_iggeret_rav_sherira_historical:0 "Iggeret Rav Sherira Gaon"
 kehillah_future_composer_work_iggeret_rav_sherira_written:0 "[GetGlobalVariable('kehillah_wk_work_iggeret_rav_sherira_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_iggeret_rav_sherira_historical:0 "Sherira Gaon of Pumbedita"
 kehillah_future_desc_work_iggeret_rav_sherira_written:0 "A new work on Letter on the Chain of Tradition by [GetGlobalVariable('kehillah_wk_work_iggeret_rav_sherira_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_iggeret_rav_sherira_historical:0 "A gaon's answer to Kairouan on how the Mishnah and the Talmud came to be written."
 kehillah_future_detail_work_iggeret_rav_sherira_written:0 "[GetGlobalVariable('kehillah_wk_work_iggeret_rav_sherira_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_iggeret_rav_sherira_historical:0 "Asked by the community of Kairouan how the oral teaching was set down, Sherira Gaon traced the chain of sages from the Mishnah through the savoraim to the geonim of his own day. It became the standard account of the rabbinic tradition."
 kehillah_future_title_work_rabbenu_hananel_written:0 "[GetGlobalVariable('kehillah_wk_work_rabbenu_hananel_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Talmud Commentary"
 kehillah_future_title_work_rabbenu_hananel_historical:0 "Commentary of Rabbenu Hananel"
 kehillah_future_composer_work_rabbenu_hananel_written:0 "[GetGlobalVariable('kehillah_wk_work_rabbenu_hananel_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_rabbenu_hananel_historical:0 "Hananel ben Hushiel of Kairouan"
 kehillah_future_desc_work_rabbenu_hananel_written:0 "A new work on Talmud Commentary by [GetGlobalVariable('kehillah_wk_work_rabbenu_hananel_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_rabbenu_hananel_historical:0 "A Kairouan commentary that sums up the Talmud's discussion and rules on it."
 kehillah_future_detail_work_rabbenu_hananel_written:0 "[GetGlobalVariable('kehillah_wk_work_rabbenu_hananel_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_rabbenu_hananel_historical:0 "Rabbenu Hananel explained the Bavli's argument briefly, drew on the Yerushalmi and the geonim, and stated the law. His work carried geonic learning across North Africa and beyond."
 kehillah_future_title_work_mekor_hayyim_written:0 "[GetGlobalVariable('kehillah_wk_work_mekor_hayyim_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Source of Life"
 kehillah_future_title_work_mekor_hayyim_historical:0 "Mekor Hayyim"
 kehillah_future_composer_work_mekor_hayyim_written:0 "[GetGlobalVariable('kehillah_wk_work_mekor_hayyim_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_mekor_hayyim_historical:0 "Solomon ibn Gabirol"
 kehillah_future_desc_work_mekor_hayyim_written:0 "A new work on Source of Life by [GetGlobalVariable('kehillah_wk_work_mekor_hayyim_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_mekor_hayyim_historical:0 "Ibn Gabirol's dialogue on matter, form and the divine will, written in Arabic."
 kehillah_future_detail_work_mekor_hayyim_written:0 "[GetGlobalVariable('kehillah_wk_work_mekor_hayyim_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_mekor_hayyim_historical:0 "A Neoplatonic work that almost never quotes Scripture. Jewish readers largely neglected it, while its Latin translation, Fons Vitae, circulated among Christian scholars who did not know its author was a Jew."
 kehillah_future_title_work_kitab_alanwar_written:0 "[GetGlobalVariable('kehillah_wk_work_kitab_alanwar_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Book of Lights and Watchtowers"
 kehillah_future_title_work_kitab_alanwar_historical:0 "Kitab al-Anwar"
 kehillah_future_composer_work_kitab_alanwar_written:0 "[GetGlobalVariable('kehillah_wk_work_kitab_alanwar_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_kitab_alanwar_historical:0 "Ya'qub al-Qirqisani"
 kehillah_future_desc_work_kitab_alanwar_written:0 "A new work on Book of Lights and Watchtowers by [GetGlobalVariable('kehillah_wk_work_kitab_alanwar_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_kitab_alanwar_historical:0 "Qirqisani's Book of Lights and Watchtowers, a Karaite code of law in Arabic."
 kehillah_future_detail_work_kitab_alanwar_written:0 "[GetGlobalVariable('kehillah_wk_work_kitab_alanwar_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_kitab_alanwar_historical:0 "It opens with a history of the Jewish sects and a defence of deriving law from Scripture by reason and analogy, and then sets out the commandments one by one."
 kehillah_future_title_work_yefet_commentary_written:0 "[GetGlobalVariable('kehillah_wk_work_yefet_commentary_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Scripture Commentary"
 kehillah_future_title_work_yefet_commentary_historical:0 "Commentary of Yefet ben Eli"
 kehillah_future_composer_work_yefet_commentary_written:0 "[GetGlobalVariable('kehillah_wk_work_yefet_commentary_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_yefet_commentary_historical:0 "Yefet ben Eli of Jerusalem"
 kehillah_future_desc_work_yefet_commentary_written:0 "A new work on Scripture Commentary by [GetGlobalVariable('kehillah_wk_work_yefet_commentary_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_yefet_commentary_historical:0 "An Arabic translation of and commentary on the whole Bible by a Jerusalem Karaite."
 kehillah_future_detail_work_yefet_commentary_written:0 "[GetGlobalVariable('kehillah_wk_work_yefet_commentary_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_yefet_commentary_historical:0 "Yefet, one of the Mourners of Zion, glossed every book of the Bible with close attention to grammar and the plain sense. Karaites made it their standard commentary, and Rabbanite readers such as Abraham ibn Ezra read it and argued with it."
 kehillah_future_title_work_sefer_yosippon_written:0 "[GetGlobalVariable('kehillah_wk_work_sefer_yosippon_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Chronicle of the Jewish People"
 kehillah_future_title_work_sefer_yosippon_historical:0 "Sefer Yosippon"
 kehillah_future_composer_work_sefer_yosippon_written:0 "[GetGlobalVariable('kehillah_wk_work_sefer_yosippon_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_sefer_yosippon_historical:0 "Anonymous southern Italian author"
 kehillah_future_desc_work_sefer_yosippon_written:0 "A new work on Chronicle of the Jewish People by [GetGlobalVariable('kehillah_wk_work_sefer_yosippon_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_sefer_yosippon_historical:0 "A Hebrew history of the Second Temple and the Roman war."
 kehillah_future_detail_work_sefer_yosippon_written:0 "[GetGlobalVariable('kehillah_wk_work_sefer_yosippon_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_sefer_yosippon_historical:0 "Written in southern Italy from Josephus and late antique sources, Yosippon gave medieval Jewish readers a Hebrew account of the Hasmoneans, Herod and the destruction of the Temple."
 kehillah_future_title_work_toldot_yeshu_written:0 "[GetGlobalVariable('kehillah_wk_work_toldot_yeshu_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Counter-History"
 kehillah_future_title_work_toldot_yeshu_historical:0 "Toldot Yeshu"
 kehillah_future_composer_work_toldot_yeshu_written:0 "[GetGlobalVariable('kehillah_wk_work_toldot_yeshu_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_toldot_yeshu_historical:0 "Anonymous; multiple Hebrew, Aramaic and Judeo-Arabic recensions"
 kehillah_future_desc_work_toldot_yeshu_written:0 "A new work on Counter-History by [GetGlobalVariable('kehillah_wk_work_toldot_yeshu_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_toldot_yeshu_historical:0 "A contested polemical counter-history of Jesus."
 kehillah_future_detail_work_toldot_yeshu_written:0 "[GetGlobalVariable('kehillah_wk_work_toldot_yeshu_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_toldot_yeshu_historical:0 "Toldot Yeshu is not a single stable book but a family of sharp, often satirical narratives transmitted in several Jewish languages. It is included as a disputed work of polemical religious thought: never an ordinary source of doctrine, but historically real and open to approval or cherem."
 kehillah_future_title_work_diwan_dunash_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_dunash_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Sacred Poems"
 kehillah_future_title_work_diwan_dunash_historical:0 "Poems of Dunash ben Labrat"
 kehillah_future_composer_work_diwan_dunash_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_dunash_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_diwan_dunash_historical:0 "Dunash ben Labrat"
 kehillah_future_desc_work_diwan_dunash_written:0 "A new work on Sacred Poems by [GetGlobalVariable('kehillah_wk_work_diwan_dunash_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_diwan_dunash_historical:0 "Hebrew court poetry and piyyutim shaped by Arabic meter."
 kehillah_future_detail_work_diwan_dunash_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_dunash_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_diwan_dunash_historical:0 "Dunash ben Labrat brought quantitative Arabic meter into Hebrew verse and wrote both secular poetry and liturgical songs. This catalogued collection stands for the surviving poems rather than claiming a single fixed medieval edition."
 kehillah_future_title_work_diwan_samuel_hanagid_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_samuel_hanagid_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Court Poems"
 kehillah_future_title_work_diwan_samuel_hanagid_historical:0 "Diwan of Samuel ha-Nagid"
 kehillah_future_composer_work_diwan_samuel_hanagid_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_samuel_hanagid_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_diwan_samuel_hanagid_historical:0 "Samuel ha-Nagid"
 kehillah_future_desc_work_diwan_samuel_hanagid_written:0 "A new work on Court Poems by [GetGlobalVariable('kehillah_wk_work_diwan_samuel_hanagid_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_diwan_samuel_hanagid_historical:0 "Hebrew poetry of court, war, friendship and religious life from Granada."
 kehillah_future_detail_work_diwan_samuel_hanagid_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_samuel_hanagid_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_diwan_samuel_hanagid_historical:0 "Samuel ha-Nagid was a Jewish courtier and commander as well as a poet. His diwan gathers poems in which biblical Hebrew carries the concerns of Andalusi public and private life; only parts of its manuscript tradition survive."
 kehillah_future_title_work_diwan_ibn_gabirol_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_ibn_gabirol_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Poems"
 kehillah_future_title_work_diwan_ibn_gabirol_historical:0 "Diwan of Solomon ibn Gabirol"
 kehillah_future_composer_work_diwan_ibn_gabirol_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_ibn_gabirol_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_diwan_ibn_gabirol_historical:0 "Solomon ibn Gabirol"
 kehillah_future_desc_work_diwan_ibn_gabirol_written:0 "A new work on Poems by [GetGlobalVariable('kehillah_wk_work_diwan_ibn_gabirol_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_diwan_ibn_gabirol_historical:0 "Hebrew poems of devotion, learning, friendship and exile by Ibn Gabirol."
 kehillah_future_detail_work_diwan_ibn_gabirol_written:0 "[GetGlobalVariable('kehillah_wk_work_diwan_ibn_gabirol_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_diwan_ibn_gabirol_historical:0 "Ibn Gabirol's Hebrew poems range from philosophical reflection to piyyut and personal complaint. The catalog uses a representative late date for their circulation: the exact year of his death and the formation of a diwan remain uncertain."
 kehillah_future_title_work_agron_david_al_fasi_written:0 "[GetGlobalVariable('kehillah_wk_work_agron_david_al_fasi_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Hebrew Grammar"
 kehillah_future_title_work_agron_david_al_fasi_historical:0 "Agron of David al-Fasi"
 kehillah_future_composer_work_agron_david_al_fasi_written:0 "[GetGlobalVariable('kehillah_wk_work_agron_david_al_fasi_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_agron_david_al_fasi_historical:0 "David ben Abraham al-Fasi"
 kehillah_future_desc_work_agron_david_al_fasi_written:0 "A new work on Hebrew Grammar by [GetGlobalVariable('kehillah_wk_work_agron_david_al_fasi_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_agron_david_al_fasi_historical:0 "A major Karaite Hebrew-Arabic biblical lexicon."
 kehillah_future_detail_work_agron_david_al_fasi_written:0 "[GetGlobalVariable('kehillah_wk_work_agron_david_al_fasi_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_agron_david_al_fasi_historical:0 "David al-Fasi collected Hebrew roots and their Arabic meanings to make Scripture yield its grammar and vocabulary. Later Karaites used the Agron as a foundational tool of exact biblical interpretation."
 kehillah_future_title_work_salmon_ben_jeroham_commentary_written:0 "[GetGlobalVariable('kehillah_wk_work_salmon_ben_jeroham_commentary_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Commentary on the Prophets"
 kehillah_future_title_work_salmon_ben_jeroham_commentary_historical:0 "Commentary of Salmon ben Jeroham"
 kehillah_future_composer_work_salmon_ben_jeroham_commentary_written:0 "[GetGlobalVariable('kehillah_wk_work_salmon_ben_jeroham_commentary_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_salmon_ben_jeroham_commentary_historical:0 "Salmon ben Jeroham"
 kehillah_future_desc_work_salmon_ben_jeroham_commentary_written:0 "A new work on Commentary on the Prophets by [GetGlobalVariable('kehillah_wk_work_salmon_ben_jeroham_commentary_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_salmon_ben_jeroham_commentary_historical:0 "A Karaite reading of Psalms, Lamentations and Ecclesiastes."
 kehillah_future_detail_work_salmon_ben_jeroham_commentary_written:0 "[GetGlobalVariable('kehillah_wk_work_salmon_ben_jeroham_commentary_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_salmon_ben_jeroham_commentary_historical:0 "Salmon's Arabic commentaries apply the Karaite demand for scriptural proof to the Writings, while arguing fiercely with rabbinic tradition. They belong to the ninth- and tenth-century flowering of Karaite letters."
 kehillah_future_title_work_levi_ben_yefet_mitzvot_written:0 "[GetGlobalVariable('kehillah_wk_work_levi_ben_yefet_mitzvot_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Book of Commandments"
 kehillah_future_title_work_levi_ben_yefet_mitzvot_historical:0 "Sefer ha-Mitzvot of Levi ben Yefet"
 kehillah_future_composer_work_levi_ben_yefet_mitzvot_written:0 "[GetGlobalVariable('kehillah_wk_work_levi_ben_yefet_mitzvot_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_levi_ben_yefet_mitzvot_historical:0 "Levi ben Yefet ha-Levi"
 kehillah_future_desc_work_levi_ben_yefet_mitzvot_written:0 "A new work on Book of Commandments by [GetGlobalVariable('kehillah_wk_work_levi_ben_yefet_mitzvot_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_levi_ben_yefet_mitzvot_historical:0 "A Karaite legal compendium grounded in Scripture."
 kehillah_future_detail_work_levi_ben_yefet_mitzvot_written:0 "[GetGlobalVariable('kehillah_wk_work_levi_ben_yefet_mitzvot_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_levi_ben_yefet_mitzvot_historical:0 "Levi ben Yefet's Arabic work on the commandments was used by later Karaite codifiers. It records both differences with the rabbis and arguments within the Karaite movement itself."
 kehillah_future_title_work_teezaza_sanbat_written:0 "[GetGlobalVariable('kehillah_wk_work_teezaza_sanbat_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Sabbath Commandments"
 kehillah_future_title_work_teezaza_sanbat_historical:0 "Te'ezaza Sanbat"
 kehillah_future_composer_work_teezaza_sanbat_written:0 "[GetGlobalVariable('kehillah_wk_work_teezaza_sanbat_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_teezaza_sanbat_historical:0 "Anonymous Beta Israel compilers"
 kehillah_future_desc_work_teezaza_sanbat_written:0 "A new work on Sabbath Commandments by [GetGlobalVariable('kehillah_wk_work_teezaza_sanbat_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_teezaza_sanbat_historical:0 "The Commandments of the Sabbath in the Beta Israel canon."
 kehillah_future_detail_work_teezaza_sanbat_written:0 "[GetGlobalVariable('kehillah_wk_work_teezaza_sanbat_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_teezaza_sanbat_historical:0 "Te'ezaza Sanbat gathers a distinctive Ethiopian Jewish vision of Sabbath observance in Ge'ez. Its surviving textual history is difficult to date precisely, so its medieval date is deliberately approximate."
 kehillah_future_title_work_cochin_copper_plates_written:0 "[GetGlobalVariable('kehillah_wk_work_cochin_copper_plates_author').GetCharacter.GetFirstNamePossessiveNoTooltip] Record of the Malabar Charter"
 kehillah_future_title_work_cochin_copper_plates_historical:0 "Copper Plates of Joseph Rabban"
 kehillah_future_composer_work_cochin_copper_plates_written:0 "[GetGlobalVariable('kehillah_wk_work_cochin_copper_plates_author').GetCharacter.GetShortUIName]"
 kehillah_future_composer_work_cochin_copper_plates_historical:0 "The ruler of Kerala's Jewish charter tradition"
 kehillah_future_desc_work_cochin_copper_plates_written:0 "A new work on Record of the Malabar Charter by [GetGlobalVariable('kehillah_wk_work_cochin_copper_plates_author').GetCharacter.GetShortUIName]."
 kehillah_future_desc_work_cochin_copper_plates_historical:0 "A royal charter remembered by the Jews of Kerala."
 kehillah_future_detail_work_cochin_copper_plates_written:0 "[GetGlobalVariable('kehillah_wk_work_cochin_copper_plates_author').GetCharacter.GetShortUIName] has given this subject a new form in this campaign. Copies, readers and debate will determine its standing in each rite."
 kehillah_future_detail_work_cochin_copper_plates_historical:0 "The Cochin Jewish tradition preserved copper plates granting Joseph Rabban and his descendants communal rights on the Malabar coast. This is a charter and a memory of diaspora belonging, not an invented Indian Talmud or philosophical school."
