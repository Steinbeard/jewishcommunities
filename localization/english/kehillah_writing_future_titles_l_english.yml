 kehillah_future_detail_work_mekor_hayyim_historical:0 "A Neoplatonic work that almost never quotes Scripture. Jewish readers largely neglected it, while its Latin translation, Fons Vitae, circulated among Christian scholars who did not know its author was a Jew."
