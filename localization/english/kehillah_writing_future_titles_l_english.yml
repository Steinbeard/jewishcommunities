 kehillah_future_detail_work_diwan_samuel_hanagid_historical:0 "Samuel ha-Nagid was a Jewish courtier and commander as well as a poet. His diwan gathers poems in which biblical Hebrew carries the concerns of Andalusi public and private life; only parts of its manuscript tradition survive."
