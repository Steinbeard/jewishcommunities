 kehillah_future_detail_work_toldot_yeshu_historical:0 "Toldot Yeshu is not a single stable book but a family of sharp, often satirical narratives transmitted in several Jewish languages. It is included as a disputed work of polemical religious thought: never an ordinary source of doctrine, but historically real and open to approval or cherem."
 kehillah_writing.landmark_thesis_work_diwan_dunash:0 "A landmark Sacred Poems needs conviction in $tenet_kehillah_sacred_liturgy_name$, held personally or by your rite."
