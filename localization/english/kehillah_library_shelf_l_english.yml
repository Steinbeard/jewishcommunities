 KEHILLAH_SEFARIM_COL_SCORE:0 "Score"
 KEHILLAH_SEFARIM_SCORE_TT:0 "#T Score#!\nHow well the chosen rite has received the book, from 0 to 100. The higher its score, the higher its canonicity can climb, up to the ceiling its tenets set. A book fixed by doctrine has no score."
