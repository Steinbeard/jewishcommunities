 KEHILLAH_STANDING_TT_3:0 "#T #color_light_red $KEHILLAH_STANDING_3$#!#!  #weak $KEHILLAH_STANDING_NUM_3$ · a tier of censure#!\n$KEHILLAH_STANDING_3_DESC$"
 KEHILLAH_STANDING_TT_4:0 "#T #color_gray $KEHILLAH_STANDING_4$#!#!  #weak $KEHILLAH_STANDING_NUM_4$ · where most books begin#!\n$KEHILLAH_STANDING_4_DESC$"
 KEHILLAH_STANDING_TT_5:0 "#T #color_green $KEHILLAH_STANDING_5$#!#!  #weak $KEHILLAH_STANDING_NUM_5$ · earned#!\n$KEHILLAH_STANDING_5_DESC$"
 KEHILLAH_STANDING_TT_6:0 "#T #color_green $KEHILLAH_STANDING_6$#!#!  #weak $KEHILLAH_STANDING_NUM_6$ · earned#!\n$KEHILLAH_STANDING_6_DESC$"
 KEHILLAH_STANDING_TT_7:0 "#T #color_yellow $KEHILLAH_STANDING_7$#!#!  #weak $KEHILLAH_STANDING_NUM_7$ · earned#!\n$KEHILLAH_STANDING_7_DESC$"
 KEHILLAH_STANDING_TT_8:0 "#T #color_yellow $KEHILLAH_STANDING_8$#!#!  #weak $KEHILLAH_STANDING_NUM_8$ · earned, the highest a book can climb#!\n$KEHILLAH_STANDING_8_DESC$"
 KEHILLAH_STANDING_TT_9:0 "#T #color_porple $KEHILLAH_STANDING_9$#!#!  #weak $KEHILLAH_STANDING_NUM_9$ · fixed by doctrine#!\n$KEHILLAH_STANDING_9_DESC$"
