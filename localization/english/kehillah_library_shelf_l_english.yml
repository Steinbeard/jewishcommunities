 KEHILLAH_STANDING_NUM_8:0 "V"
 KEHILLAH_STANDING_NUM_9:0 "VI"
 KEHILLAH_STANDING_NUM_10:0 "VII"
 KEHILLAH_STANDING_NUM_11:0 "VIII"
