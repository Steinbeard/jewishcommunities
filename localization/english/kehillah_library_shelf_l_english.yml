 ### 2026-11-10: a book your rite forbids, under the shelf and on its page.
 KEHILLAH_LIB_BANNED_LINE:0 "@warning_icon! #N;bold Banned in your rite.#! #N Its ideas are held deeply problematic, and its readers fall under suspicion.#!"
 # 2026-11-11: on the one scale (docs/spec/2026-11-11-standing-one-scale.md) the red line under 1
 # shows for 0, Anathema; the key keeps its old name.
 KEHILLAH_LIB_REJECTED_LINE:0 "@warning_icon! #N;bold Under a herem in your rite.#! #N Cut off by a formal act: keeping it is a scandal, and studying it an offence.#!"
