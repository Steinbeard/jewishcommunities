 KEHILLAH_SEFARIM_SUBHEADER_RITE:0 "Followers of #high [GetPlayer.MakeScope.Var('kehillah_ledger_rite').Rite.GetNameNoTooltip]#! know of #high [GetPlayer.MakeScope.Var('kehillah_lib_catalog_count').GetValue|0]#! works."
