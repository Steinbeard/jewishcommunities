 KEHILLAH_STANDING_TT_0:0 "#T @warning_icon! #bold;color_red $KEHILLAH_STANDING_0$#!#!  #weak $KEHILLAH_STANDING_NUM_0$ · a tier of censure, pronounced by a ban#!\n#N $KEHILLAH_STANDING_0_DESC$#!"
