 ### 2026-11-10: the ledger's columns, rite selector and per-tier standing.
 KEHILLAH_SEFARIM_COL_LANGUAGE:0 "Language"
 KEHILLAH_SEFARIM_COL_STANDING:0 "Canonicity"
 KEHILLAH_SEFARIM_RITE:0 "Canonicity in:"
 KEHILLAH_SEFARIM_RITE_TT:0 "#T Canonicity in each rite#!\nEvery living rite of every Jewish faith ranks the world's books on its own ladder. Choose a rite to see the standing it gives each work and the books its followers know. Your own rite comes first."
 KEHILLAH_SEFARIM_MASTERED_TT:0 "#T Mastered#!\nYou have mastered this work."
 KEHILLAH_SEFARIM_CARD_CLOSE:0 "Close"
 ### 2026-11-10 (Daniel: "make it clearer what the hierarchy of tiers is";
 ### "make banned books look scarier"); 2026-11-11 one scale, no bands
 ### (docs/spec/2026-11-11-standing-one-scale.md). Written by a script: each
 ### tier name in its colour (neighbouring tiers share one), the ladder, and
 ### one tooltip per tier that picks that tier out on it.
 KEHILLAH_STANDING_FMT_0:0 "@warning_icon! #bold;color_red $KEHILLAH_STANDING_0$#!"
 KEHILLAH_STANDING_FMT_1:0 "#bold;color_red $KEHILLAH_STANDING_1$#!"
 KEHILLAH_STANDING_FMT_2:0 "#color_light_red $KEHILLAH_STANDING_2$#!"
 KEHILLAH_STANDING_FMT_3:0 "#color_light_red $KEHILLAH_STANDING_3$#!"
 KEHILLAH_STANDING_FMT_4:0 "#color_gray $KEHILLAH_STANDING_4$#!"
 KEHILLAH_STANDING_FMT_5:0 "#color_green $KEHILLAH_STANDING_5$#!"
 KEHILLAH_STANDING_FMT_6:0 "#color_green $KEHILLAH_STANDING_6$#!"
 KEHILLAH_STANDING_FMT_7:0 "#color_yellow $KEHILLAH_STANDING_7$#!"
 KEHILLAH_STANDING_FMT_8:0 "#color_yellow $KEHILLAH_STANDING_8$#!"
 KEHILLAH_STANDING_FMT_9:0 "#color_porple $KEHILLAH_STANDING_9$#!"
 KEHILLAH_STANDING_FMT_10:0 "#color_porple $KEHILLAH_STANDING_10$#!"
 KEHILLAH_STANDING_FMT_11:0 "#color_porple $KEHILLAH_STANDING_11$#!"
 KEHILLAH_STANDING_LADDER:0 "#weak From the highest:#!\n#color_porple $KEHILLAH_STANDING_11$#!#weak  · #!#color_porple $KEHILLAH_STANDING_10$#!#weak  · #!#color_porple $KEHILLAH_STANDING_9$#!\n#color_yellow $KEHILLAH_STANDING_8$#!#weak  · #!#color_yellow $KEHILLAH_STANDING_7$#!\n#color_green $KEHILLAH_STANDING_6$#!#weak  · #!#color_green $KEHILLAH_STANDING_5$#!\n#color_gray $KEHILLAH_STANDING_4$#!\n#color_light_red $KEHILLAH_STANDING_3$#!#weak  · #!#color_light_red $KEHILLAH_STANDING_2$#!\n#color_red $KEHILLAH_STANDING_1$#!#weak  · #!#color_red $KEHILLAH_STANDING_0$#!"
 # 2026-11-11 (Daniel: "a number with each standing ... Obscure can be I. The negative tiers
 # should indicate that they're tiers of negative evaluation"): Obscure is I, Divine VIII;
 # the tiers of censure below Obscure count down, -I to -IV. An ASCII hyphen: the minus
 # sign may not be in the game's font.
 KEHILLAH_STANDING_NUM_0:0 "-IV"
 KEHILLAH_STANDING_NUM_1:0 "-III"
 KEHILLAH_STANDING_NUM_2:0 "-II"
 KEHILLAH_STANDING_NUM_3:0 "-I"
