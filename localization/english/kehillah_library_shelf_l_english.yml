 ### The Beit Midrash shelf and the Sefarim ledger (2026-11-08).
 ### gui/kehillah_domicile_library.gui, gui/kehillah_sefarim_ledger.gui;
 ### docs/implementation/2026-11-08-library-shelf-and-ledger.md.

 ### The shelf
 KEHILLAH_SHELF_MISSING_TANAKH:0 "#warning Your foundation is incomplete:#! #high [Title.MakeScope.ScriptValue('kehillah_lib_tanakh_held_count_value')|0]#! of the 3 parts of the Tanakh are on the shelf."
 KEHILLAH_SHELF_MISSING_BAVLI:0 "#warning Your foundation is incomplete:#! #high [Title.MakeScope.ScriptValue('kehillah_lib_bavli_held_count_value')|0]#! of the 6 orders of the Babylonian Talmud are on the shelf."
 KEHILLAH_SHELF_MISSING_TT:0 "#T A foundation incomplete#!\nEvery Jewish library is built on the Torah, the Prophets and the Writings. Where your rite holds the Babylonian Talmud as the Oral Torah, a library without all six of its orders lacks part of its foundation too.\n\nThe empty places in the ark and the Shas case show what is missing. Seek a copy from the #high Ledger of sefarim#!, or open a missing book to see which libraries hold it."
 KEHILLAH_SHELF_CAPTION_TANAKH:0 "The Torah in the ark, with the Prophets and the Writings"
 KEHILLAH_SHELF_CAPTION_BAVLI:0 "The Shas: #high [Title.MakeScope.ScriptValue('kehillah_lib_bavli_held_count_value')|0]#! of 6 orders"
 KEHILLAH_SHELF_DETAILS:0 "Details"
 KEHILLAH_SHELF_DETAILS_TT:0 "#T Details#!\nThe whole work, its parts on your shelf, and your rounds of study through it."
 KEHILLAH_SHELF_CAPTION_STAND:0 "On the reading stand: "
 KEHILLAH_SHELF_CAPTION_STAND_EMPTY:0 "The reading stand is empty"
 KEHILLAH_SHELF_STAND_EMPTY_TT:0 "#T The reading stand#!\nThe stand holds the library's most esteemed work of this kind, by its standing in your rite. The library holds none yet."
 KEHILLAH_SHELF_YERUSHALMI:0 "Talmud Yerushalmi"
 KEHILLAH_SHELF_GENRE_EMPTY:0 "No works of this kind on the shelves yet."
 KEHILLAH_SHELF_LEDGER_ACTION:0 "Ledger of sefarim"
 KEHILLAH_SHELF_LEDGER_TT:0 "#T Ledger of sefarim#!\nEvery work your community knows of, whether or not this library holds it: when and where it was written, by whom, its standing in your rite and what it argues for. Seek a copy of one you lack from here."

 ### The ledger window
 KEHILLAH_SEFARIM_HEADER:0 "Ledger of Sefarim"
 KEHILLAH_SEFARIM_SUBHEADER:0 "Your community knows of #high [GetPlayer.MakeScope.Var('kehillah_lib_catalog_count').GetValue|0]#! works, listed by the date they were written."
 KEHILLAH_SEFARIM_SHOW:0 "Show:"
 KEHILLAH_SEFARIM_TOGGLE_TT:0 "Show or hide the works of this kind."
 KEHILLAH_SEFARIM_LACK_ONLY:0 "Only works you lack"
 KEHILLAH_SEFARIM_LACK_ONLY_TT:0 "Show only the works your own library does not hold."
 KEHILLAH_SEFARIM_COL_WORK:0 "Work"
 KEHILLAH_SEFARIM_COL_WRITTEN:0 "Written"
 KEHILLAH_SEFARIM_COL_AUTHOR:0 "Author and standing"
 KEHILLAH_SEFARIM_COL_TENETS:0 "Argues for"
 KEHILLAH_SEFARIM_COL_COPY:0 "Your copy"
 KEHILLAH_SEFARIM_CLASS_TT:0 "#T Class#!\nHow great a work it is, which no rite can change: #high Foundational#!, #high Essential#!, #high Celebrated#!, #high Popular#! or #high Obscure#!. Its standing, beside the author, is what your rite makes of it."
 KEHILLAH_SEFARIM_STANDING_PREFIX:0 "#weak Standing:#! "
 KEHILLAH_SEFARIM_TENETS_TT:0 "#T Tenets#!\nThe tenets a work argues for. Studying it draws its reader toward them, and how your rite regards them limits how high the work can rise in it. A tenet in #N red#! is one the work argues against."
 KEHILLAH_SEFARIM_HELD:0 "#P Held#!"
 KEHILLAH_SEFARIM_SOUGHT:0 "#high Being sought#!"
 KEHILLAH_SEFARIM_SEEK:0 "Seek a copy"
 KEHILLAH_SEFARIM_SEEK_TT:0 "#T Seek a copy#!\nCommission a copy of this work for your library. What your community has built decides how it can be brought in, and only one work can be sought at a time. The Tanakh is copied in every library and cannot be sought."
 KEHILLAH_SEFARIM_MASTERED:0 "#P Mastered#!"
 KEHILLAH_SEFARIM_FOOTNOTE:0 "Some works are not listed. An obscure or forbidden book becomes known once your library holds it, you or a scholar of your court masters it, or it is respected in your rite and a copy exists somewhere."
 KEHILLAH_SEFARIM_PLACE_WRITTEN_IN_PLAY:0 "Written in your age"
 KEHILLAH_SEFARIM_AUTHOR_UNKNOWN:0 "Its author"
 KEHILLAH_SEFARIM_TENETS_AUTHORED:0 "#weak As its author argues#!"
 KEHILLAH_SEFARIM_TENETS_NONE:0 "#weak None#!"
 KEHILLAH_SEFARIM_AGAINST:0 "against"
