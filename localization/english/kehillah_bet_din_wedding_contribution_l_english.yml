l_english:
 kehillah_bet_din.0431.t:0 "The Poor Man's Wedding Contribution"
 kehillah_bet_din.0431.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a collector asking every household to contribute to a prominent family's wedding. [kbd_litigant_b.GetFirstName] speaks for poorer neighbors who cannot spare the coin. The collector calls the feast communal honor; the invitation names the host family. The court must decide which costs belong to shared charity and which to a private celebration."
 kehillah_bet_din.0431.a:0 "Collect the wedding levy from every household."
 kehillah_bet_din.0431.a.tt:0 "The feast is funded, but a private pledge would make the levy unfair to poorer households."
 kehillah_bet_din.0431.b:0 "Fund a modest meal and inspect the original pledge."
 kehillah_bet_din.0431.b.tt:0 "A smaller meal costs something while the court checks whether donors offered communal funds."
 kehillah_bet_din.0431.c:0 "Cancel all communal support for the wedding."
 kehillah_bet_din.0431.c.tt:0 "Taxpayers are protected, but a genuine communal pledge would be discarded."
 kehillah_din_source_43:0 "Cite a mastered Zeraim work and distinguish relief from ceremony."
 kehillah_din_source_43_tt:0 "Mishnah Peah 8:7 addresses help to the poor. It does not turn a prominent family's private wedding into a compulsory levy."
 kehillah_din_combo_43:0 "Have a scholar and steward read the pledge and protect poor households."
 kehillah_din_combo_43_tt:0 "The judges fund modest hospitality while separating charity from celebration."
 kehillah_bet_din.0434.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0434.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0434.outcome_1:0 "The court orders every household to pay the wedding levy."
 kehillah_bet_din.0434.outcome_2:0 "The court funds a modest meal and asks to see the collectors' pledge."
 kehillah_bet_din.0434.outcome_3:0 "The court cancels communal support and leaves the family to pay."
 kehillah_bet_din.0434.fact_true:0 "The pledge was made by the host family alone. Forcing poor households to pay turned a private feast into a tax."
 kehillah_bet_din.0434.fact_false:0 "The pledge was a community-wide gift for poor couples too. Cancelling every shared contribution broke its purpose."
 kehillah_bet_din.0434.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0434.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0434.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case43_one_tt:0 "A broad levy costs substantial Prosperity."
 kehillah_din_case43_two_tt:0 "A modest meal and inquiry cost some Prosperity."
 kehillah_din_case43_three_tt:0 "Cancelling support costs less now but may break a shared pledge."
 kehillah_bet_din_case43_great_log_title:0 "The Poor Man's Wedding Contribution: a well-supported ruling"
 kehillah_bet_din_case43_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s wedding-levy complaint."
