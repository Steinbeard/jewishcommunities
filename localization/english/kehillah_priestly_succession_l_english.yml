l_english:
 # Hereditary priestly succession (kehillah_priestly_succession_laws.txt)
 kehillah_priestly_succession_law:0 "Priestly Succession"
 kehillah_priestly_succession_law_subname:0 "The Priestly Line"
 kehillah_priestly_succession_law_effects:0 "\nThe office passes within the priestly line, to a Kohen of the same faith: the holder's sons first, then his brothers, grandsons and nephews, then other kin, and the eldest among them. Only a Kohen can hold it."
 kehillah_priestly_elective_candidates:0 "Kohanim of the Priestly Line"
 kehillah_priestly_elective_candidates_tooltip:0 "To be a candidate, a character must be a male Kohen of the holder's faith, among his kin, his council or his faith's clergy."
 kehillah_priestly_elective_electors:0 "The High Priest"
 kehillah_priestly_elective_electors_tooltip:0 "The High Priest alone names his successor from the priestly line."

 # Per-faith names for vanilla's cleric trait (kehillah_cleric_trait_override.txt)
 trait_cleric_kehillah_samaritan:0 "Priestly Elder"
 trait_cleric_kehillah_samaritan_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] serves among the priests of Mount Gerizim, reading the Torah to the congregation and keeping the calendar of the festivals."
 trait_cleric_kehillah_rabbinic:0 "Talmid Hakham"
 trait_cleric_kehillah_rabbinic_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a disciple of the sages, learned in Torah and Talmud, whom the community turns to for teaching and judgment."
 trait_cleric_kehillah_karaite:0 "Maskil"
 trait_cleric_kehillah_karaite_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is one of the enlightened, a Karaite scholar who searches Scripture for himself and teaches others to do the same."
 trait_cleric_kehillah_haymanot:0 "Debtera"
 trait_cleric_kehillah_haymanot_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] chants the liturgy in Ge'ez and keeps the prayer house's books, serving beside the priests of the Beta Israel."
