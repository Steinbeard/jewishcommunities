 kehillah_incident_talmud_safe_tt:0 "The books of the Talmud stay in our library."
 kehillah_incident_talmud_burned_tt:0 "Every tractate of the Talmud in our library is burned."
 kehillah_incident_badge_tt:0 "Our people must wear the badge. While they do, the danger of violence is higher."
 kehillah_incident_badge_exempt_tt:0 "My household does not have to wear it."
 kehillah_incident_badge_lifted_tt:0 "No one has to wear the badge."
 kehillah_incident_holy_week_ended_tt:0 "The custom ends in this town for good."
 kehillah_incident_mob_tt:0 "#N A mob gathers against the community.#!"
 kehillah_incident_bonds_safe_tt:0 "Our bonds are safe."
 kehillah_incident_bonds_burned_tt:0 "Every bond we hold on [kehillah_incident_host.GetFirstName] and the lords of [kehillah_incident_host.GetHerHis] realm is burned. Their debts to us are void."
 kehillah_incident_debt_forgiven_tt:0 "[kehillah_incident_debtor.GetFirstName] owes us nothing."

 kehillah_badge_modifier:0 "The Badge"
 kehillah_badge_modifier_desc:0 "This character must wear the mark the lord's decree requires of Jews."

 # .0090 What came of it
 kehillah_incident.0090.t:0 "What Came of It"
 kehillah_incident.0090.a:0 "So it is."
 kehillah_incident.0090.talmud_acquitted:0 "In the hall, [kehillah_incident_accuser.GetFirstName] read out his passages, and we read out the passages around them. The lord listened for most of the afternoon. At the end [kehillah_incident_host.GetSheHe] said the books could go home.\n\nThey came back in the carts that had taken them. Some volumes are missing pages."
 kehillah_incident.0090.talmud_burned:0 "They piled the books in the square in front of the church and burned them on a Friday. It took most of the day. The bindings burned slowly.\n\nOur students stood at the edge of the square and watched. That night some of them sat down and wrote out from memory what they could."
 kehillah_incident.0090.talmud_dropped:0 "[kehillah_incident_shtadlan.GetFirstName] spent two days at the castle. On the third, the lord's chaplain told [kehillah_incident_accuser.GetFirstName] that the matter was closed.\n\nThe books came back to us the next week. [kehillah_incident_accuser.GetFirstName] stayed at court."
 kehillah_incident.0090.talmud_hidden:0 "The lord's men went through every house on our street. They opened chests and pulled up the floorboards in two of them. They left with a cart of prayer books and account books.\n\nThe Talmud stayed in the cellar of the bathhouse until the winter."
 kehillah_incident.0090.talmud_found:0 "The lord's men went straight to the bathhouse cellar. Someone had told them where to look.\n\nThe books were burned in the square with the others. The man who kept the bathhouse was fined for hiding them."
 kehillah_incident.0090.talmud_redeemed:0 "The silver went to the lord's treasury. A week later the books came back to us in carts, with the lord's seal on the cords.\n\nNobody asked for a receipt."
 kehillah_incident.0090.talmud_cheated:0 "[kehillah_incident_host.GetFirstName] took the silver. A week later the books were burned in the square all the same.\n\nWhen our elders asked about the silver, the lord's steward said it had paid for the trial."
 kehillah_incident.0090.badge_revoked:0 "The lord heard the petition and said the decree could wait. The crier has not come back to the market.\n\nThe tailors are selling the yellow cloth at half price."
 kehillah_incident.0090.badge_stands:0 "The lord heard the petition and did not answer it. By the first of the month the patches were on our street, on old men and on boys of twelve.\n\nThe children of the town have a new game. They follow the patches and count them."
 kehillah_incident.0090.holy_week_bruised:0 "The chaplain struck you once with his open hand. The crowd at the church door was quieter than you expected.\n\nYou walked home with your cheek burning. The people of our street came out of their houses to walk the last part with you."
 kehillah_incident.0090.holy_week_wounded:0 "The man who struck you wore a ring and swung with his whole arm. You fell on the church steps.\n\nTwo men from our street carried you home. You do not remember it."
 kehillah_incident.0090.holy_week_sent:0 "[kehillah_incident_sent.GetFirstName] went to the church door on Good Friday and came back with a split lip.\n\nHe has not spoken to you since. His wife crosses the street when she sees you."
 kehillah_incident.0090.holy_week_ended:0 "The bishop took the silver and wrote that the custom was ended, for the peace of the town.\n\nA copy of the letter is kept with our charter. On Good Friday our shutters stayed closed, and nothing hit them."
 kehillah_incident.0090.holy_week_kept:0 "The bishop took the silver and thanked us.\n\nOn Good Friday the crowd came to our street anyway, and the stones came through the shutters."
 kehillah_incident.0090.holy_week_refused:0 "Nobody went to the church door. On Good Friday the lord's soldiers stood at both ends of our street. The crowd waited for an hour and went home.\n\nThe bishop has written to the lord about it."
 kehillah_incident.0090.holy_week_riot:0 "Nobody went to the church door. In the afternoon the crowd came to us instead.\n\nThey are still in the square. More of them come in from the villages every hour."
 kehillah_incident.0090.bonds_burned:0 "They came at night with torches and carried the box into the street. They burned the bonds one at a time and cheered each one. When the box was empty they went home. Nobody was hurt.\n\nIn the morning our moneylenders went through the ashes to see whose names were left."
 kehillah_incident.0090.bonds_hidden:0 "The strongbox spent the night under the floor of the synagogue.\n\nThe men broke down the door of the community house, found the room empty, and went back to the tavern."
 kehillah_incident.0090.bonds_guarded:0 "Four of the lord's men slept in our community house that night.\n\nNobody came."
 kehillah_incident.0090.bonds_forgiven:0 "[kehillah_incident_debtor.GetFirstName] sent no thanks. But [kehillah_incident_debtor.GetHerHis] men rode out of town the next morning, and the others went home after them."
 kehillah_incident.0090.bonds_forgiven_failed:0 "[kehillah_incident_debtor.GetFirstName] accepted the forgiveness and said nothing. [kehillah_incident_debtor.GetHerHis|U] men came that night anyway, and burned the rest."
 kehillah_incident.0090.bonds_riot:0 "They came at night, more of them than we had expected. They burned the bonds in the street.\n\nThen somebody said there was more money in the houses."

