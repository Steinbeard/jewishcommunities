 # V41 step 4b -- the new incidents (events/kehillah_incident_events.txt), 2026-10-14.

 # .0001 The Talmud on Trial
 kehillah_incident.0001.t:0 "The Talmud on Trial"
 kehillah_incident.0001.desc:0 "[kehillah_incident_accuser.GetFirstName] studied in our house of study as a boy. Some years ago he went to the priests and was baptized.\n\nNow he has come back with a list of passages from the Talmud, and he has read them aloud before [kehillah_incident_host.GetTitledFirstName]. He says they insult Christ and his mother. He knows which houses keep the books.\n\nThe lord's men are to collect every volume by the end of the week. On the day after, we are to answer the charges in [kehillah_incident_host.GetHerHis] hall."
 kehillah_incident.0001.a:0 "We will answer him in the hall."
 kehillah_incident.0001.b:0 "Hide the books."
 kehillah_incident.0001.c:0 "Offer [kehillah_incident_host.GetFirstName] silver to give them back."
 kehillah_incident.0001.d:0 "Let them take the books."
 kehillah_incident.0001.f:0 "[kehillah_incident_dayyan.GetFirstName] will answer him."
 kehillah_incident.0001.e:0 "[kehillah_incident_shtadlan.GetFirstName] goes to the castle before the day comes."

 # .0010 The Badge
 kehillah_incident.0010.t:0 "The Badge"
 kehillah_incident.0010.t_ghiyar:0 "The Ghiyar"
 kehillah_incident.0010.desc:0 "A crier read [kehillah_incident_host.GetTitledFirstName]'s decree in the market this morning. From the first of next month, every Jew over the age of twelve in [kehillah_incident_host.GetHerHis] lands is to wear a round yellow patch sewn to the chest of the outer garment. A Jew found without it will pay a fine the first time and be whipped the second.\n\nThe tailors already have the cloth."
 kehillah_incident.0010.desc_ghiyar:0 "A crier read [kehillah_incident_host.GetTitledFirstName]'s decree in the market this morning. The Jews of [kehillah_incident_host.GetHerHis] lands are to wear a yellow sash, and may not ride horses inside the walls. A wooden sign is to be nailed over each Jewish door.\n\nThe rules are old. They were written in the Pact of Umar before any of us were born. This time the lord's clerks are going from house to house, writing down our names."
 kehillah_incident.0010.a:0 "[kehillah_incident_shtadlan.GetFirstName] petitions the lord to withdraw it."
 kehillah_incident.0010.e:0 "I will petition the lord myself."
 kehillah_incident.0010.b:0 "Buy an exemption for my household."
 kehillah_incident.0010.c:0 "We will wear it."
 kehillah_incident.0010.d:0 "We will wear it the way our fathers wore their names."

 # .0020 Holy Week
 kehillah_incident.0020.t:0 "Holy Week"
 kehillah_incident.0020.desc_blow:0 "It is Holy Week. In [kehillah_incident_town.GetName], on Good Friday, a Jew is brought to the church door and struck once across the face in front of the people, for the death of Christ. The custom is old. [kehillah_incident_host.GetTitledFirstName] has let it be known that it will be kept this year.\n\nThe bishop's men have come to ask who we will send."
 kehillah_incident.0020.desc_stones:0 "It is Holy Week. Every year from Palm Sunday to Easter, the bishop of [kehillah_incident_town.GetName] preaches that the Jews killed Christ, and the people throw stones at our houses until the feast is over. Last year a boy lost an eye.\n\nThis year the bishop's men have come with an offer. If one of us comes to the church door on Good Friday and takes a blow in front of the people, the stones will stop."
 kehillah_incident.0020.a:0 "I will go myself."
 kehillah_incident.0020.b:0 "Send [kehillah_incident_sent.GetFirstName]."
 kehillah_incident.0020.c:0 "Pay the bishop to end the custom."
 kehillah_incident.0020.d:0 "Nobody goes."

 # .0030 The Bonds
 kehillah_incident.0030.t:0 "The Bonds"
 kehillah_incident.0030.desc:0 "Men from [kehillah_incident_debtor.GetTitledFirstName]'s household have been drinking in the town for three days. [kehillah_incident_debtor.GetFirstName] owes us [kehillah_incident_debtor.MakeScope.Var('kehillah_loan_amount_owed').GetValue|0] gold. The bond for it is kept in the strongbox in our community house, with the bonds of every other lord in these lands who owes us money.\n\nLast night they told anyone who would listen that every bond in that box was a sin, and that a man who burned them would owe nothing to anyone."
 kehillah_incident.0030.a:0 "Let them have the bonds."
 kehillah_incident.0030.b:0 "Move the strongbox tonight."
 kehillah_incident.0030.c:0 "Ask [kehillah_incident_host.GetFirstName] to guard the house."
 kehillah_incident.0030.d:0 "Forgive [kehillah_incident_debtor.GetFirstName]'s debt before they come."

