l_english:
 kehillah_bet_din.0861.t:0 "The Witness Who Cannot Hear"
 kehillah_bet_din.0861.desc:0 "[kbd_litigant_a.GetFirstName] relies on an elderly witness to a market bargain. [kbd_litigant_b.GetFirstName] says the witness could not hear the price over the crowd. The witness remembers seeing the parties clasp hands. The court must separate what was seen from what was heard."
 kehillah_bet_din.0861.a:0 "Accept the witness's price and enforce the bargain."
 kehillah_bet_din.0861.a.tt:0 "The price is settled quickly, but the witness may have guessed its words."
 kehillah_bet_din.0861.b:0 "Question the witness about sight, hearing and other proof."
 kehillah_bet_din.0861.b.tt:0 "A careful hearing costs time and may find independent evidence."
 kehillah_bet_din.0861.c:0 "Reject the witness's entire account."
 kehillah_bet_din.0861.c.tt:0 "A witness who saw the exchange may still provide useful facts."
 kehillah_din_source_86:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_86_tt:0 "Mishnah Sanhedrin 3:6 gives the judges a textual point of reference. It cannot establish which words the witness actually heard."
 kehillah_din_combo_86:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_86_tt:0 "The judges preserve both parties' interests while checking which words the witness actually heard."
 kehillah_bet_din.0864.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0864.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0864.outcome_1:0 "The court enforces the price the witness names."
 kehillah_bet_din.0864.outcome_2:0 "The court asks what the witness heard and what was only seen."
 kehillah_bet_din.0864.outcome_3:0 "The court refuses all of the witness's evidence."
 kehillah_bet_din.0864.fact_true:0 "The witness saw the bargain but misheard its price. Immediate enforcement overstated his knowledge."
 kehillah_bet_din.0864.fact_false:0 "He heard the price clearly before the crowd gathered. Total exclusion lost reliable testimony."
 kehillah_bet_din.0864.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0864.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0864.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case86_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case86_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case86_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_din_proposed_86_1:0 "The ruling proposed so far: $kehillah_bet_din.0861.a$"
 kehillah_din_proposed_86_2:0 "The ruling proposed so far: $kehillah_bet_din.0861.b$"
 kehillah_din_proposed_86_3:0 "The ruling proposed so far: $kehillah_bet_din.0861.c$"
