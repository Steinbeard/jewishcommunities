 kehillah_crisis_actions_header:0 "Prepare the community"
 kehillah_crisis_action_watch:0 "Organize the watch — 20 @gold_icon! · 14 days"
 kehillah_crisis_action_watch_tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_watch_cost')|0] gold. $kehillah_crisis_tt_spared_large$ in [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_preparation_days')|0] days, and the watch stands ready if a host forms. Only one communal task can run at a time."
 kehillah_crisis_action_supplies:0 "Assemble provisions — 30 @gold_icon! · 14 days"
 kehillah_crisis_action_supplies_tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_supplies_cost')|0] gold. $kehillah_crisis_tt_spared_moderate$ in [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_preparation_days')|0] days. Only one communal task can run at a time."
 kehillah_crisis_action_routes:0 "Arrange escape routes — 10 @gold_icon! · 14 days"
 kehillah_crisis_action_routes_tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_routes_cost')|0] gold. $kehillah_crisis_tt_spared_small$ in [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_preparation_days')|0] days, and a prepared escape if the quarter is attacked. Scattered households leave property exposed. Only one communal task can run at a time."
 kehillah_crisis_action_advocacy:0 "Answer accusations — 15 @gold_icon! · 14 days"
 kehillah_crisis_action_advocacy_tt:0 "Costs [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_advocacy_cost')|0] gold. $kehillah_crisis_tt_spared_large$ in [GetPlayer.MakeScope.ScriptValue('kehillah_crisis_preparation_days')|0] days, once per crisis. Only one communal task can run at a time."
 kehillah_crisis_action_council:0 "Seek protection or negotiate"
 kehillah_crisis_action_council_tt:0 "Meet the elders to petition the lord, send a messenger, approach religious authorities or negotiate with the agitator. Requests and travel use their existing time and costs."
 kehillah_crisis_actions_hint:0 "Preparations require an active warning, enough gold, freedom to act and no other communal preparation in progress. Decisions remain available through the council while an armed threat approaches."
 kehillah_crisis_outcome_header:0 "The latest crisis"
 kehillah_crisis_outcome_0:0 "No completed crisis has been recorded."
 kehillah_crisis_outcome_1:0 "The agitation subsided before an attack."
 kehillah_crisis_outcome_2:0 "The attackers were defeated or dispersed."
 kehillah_crisis_outcome_3:0 "The threat was bought off."
 kehillah_crisis_outcome_4:0 "The quarter was struck. Losses and recovery are recorded in the aftermath."
 kehillah_crisis_response_0:0 "No political settlement has been recorded."
 kehillah_crisis_response_1:0 "The ruler renewed protection."
 kehillah_crisis_response_2:0 "The ruler asks a payment for protection."
 kehillah_crisis_response_3:0 "Further disorder is forbidden; no additional aid is promised."
 kehillah_crisis_response_4:0 "An edict of expulsion has been issued against this community."
 kehillah_crisis_response_5:0 "The ruler withdrew the community's edict of expulsion."
 kehillah_crisis_targeted_edict_desc:0 "A herald brings an order from [kehillah_exp_host.GetTitledFirstName]. The right of residence held by [kehillah_exp_title.GetNameNoTooltip] is revoked. Its households must leave within [ROOT.Char.Custom('KehillahExpulsionTimeLeft')]. This edict concerns this community; the realm's general settlement law is unchanged.\n\nThe elders gather to consider a plea, a ransom or an orderly departure."
 kehillah_crisis_targeted_repeal_tt:0 "This community's edict of expulsion is withdrawn. The realm's settlement law and other communities' edicts are unchanged. Any ransom offered is paid."
 kehillah_crisis.0201.desc_granada:0 "A clerk brings you the petitions set aside during the unrest. There are accounts to settle and scholars waiting for replies. The elders want to know when the households who left may return.\n\nYour father's offices are still yours to exercise, but the weeks of accusations have shown how much depends on the palace. You have asked the ruler to state publicly what protection the community may expect."
 kehillah_crisis_warning_header:0 "The race"
 kehillah_crisis_diplomacy_header:0 "Petitions and negotiations"
 kehillah_crisis_effect_watch:0 "Reduces attack severity by 15 once the watch is ready."
 kehillah_crisis_effect_supplies:0 "Reduces attack severity by 10 once provisions are assembled."
 kehillah_crisis_effect_routes:0 "Helps households escape; property may be more exposed to looting."
 kehillah_crisis_effect_advocacy:0 "Reduces agitation by 20 on completion, lowering the chance of violence."
 kehillah_crisis_peace_hint:0 "A warning will open preparations here before an organized attack. The annual incident chance includes threats, accusations and restrictions."
 kehillah_crisis_protection_active:0 "#P Royal protection is in force.#! It lowers background danger and adds to Spared each month while a warning lasts."

 # 2026-11-01: what became of the man behind it.
 kehillah_crisis.0201.desc_spared:0 "[kehillah_crisis_last_agitator.GetFirstName] has stopped. Some say he was persuaded, some that he was paid, some that he simply tired of it; the men who followed him have gone back to their trades. Families begin opening doors they had kept barred.\n\nThe danger has passed for now. The elders have asked the ruler to confirm what happens next."
 kehillah_crisis.0201.desc_granada_spared:0 "[kehillah_crisis_last_agitator.GetFirstName] has gone back to the emir's court, and the souks have found other things to talk about. A clerk brings you the petitions set aside during the unrest.\n\nThe danger has passed for now. The elders have asked the emir to confirm what happens next."

 # 2026-11-01: the aftermath, by how the crisis began.
 kehillah_crisis.0201.desc_accusation:0 "[kehillah_crisis_last_witness.GetFirstName] has stopped telling the story, and no one in the market asks about it any more. The charge was never withdrawn. It was simply forgotten, for now.\n\nThe elders have asked the ruler to confirm what happens next."
 kehillah_crisis.0201.desc_debts:0 "The debtors' meetings have stopped. Some have paid, some were forgiven, and the rest have decided the bonds were not worth a riot.\n\nThe elders have asked the ruler to confirm what happens next."
 kehillah_crisis.0201.desc_holy_week:0 "Easter has passed, and with it the sermons on the Passion. The quarter has opened its shutters again.\n\nThe elders have asked the ruler to confirm what happens next."
 kehillah_crisis.0201.desc_crusade:0 "The vow-takers have marched east at last. The quarter watched them go from behind its shutters.\n\nThe elders have asked the ruler to confirm what happens next."
 kehillah_crisis.0240.t:0 "The Purim of [kehillah_purim_town.GetName]"
 kehillah_crisis.0240.desc:0 "It is the day the quarter keeps every year for its deliverance. The children are given sweets, and the story is read aloud in the synagogue, from the first night of fear to the morning it was over."
 kehillah_crisis.0240.desc_against:0 "It is the day the quarter keeps every year for its deliverance from [kehillah_purim_against.GetFirstName]. The children are given sweets, and the story is read aloud in the synagogue, from the first night of fear to the morning it was over."
 kehillah_crisis.0240.a:0 "Read the story, and give thanks."
 kehillah_crisis.0240.b:0 "Send portions to the poor, as on Purim."
