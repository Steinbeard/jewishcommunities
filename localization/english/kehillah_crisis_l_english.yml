l_english:
 kehillah_crisis.0010.t:0 "Words on the Door"
 kehillah_crisis.0010.desc:0 "The watch finds threats scratched into a shutter beside the quarter. The householder wants the words removed before his children see them. The elders ask whether to make a complaint or let the matter pass."
 kehillah_crisis.0010.a:0 "Record the threats and bring witnesses."
 kehillah_crisis.0010.b:0 "Erase them, and keep the watch nearby."
 kehillah_crisis.0011.t:0 "The Empty Market"
 kehillah_crisis.0011.desc:0 "Several customers turn back at the entrance to the quarter. A merchant says men have been warning them away. His neighbours can close their stalls for a few days, but their households need the income."
 kehillah_crisis.0011.a:0 "Cover their losses while the dispute is settled."
 kehillah_crisis.0011.b:0 "Close the stalls for now."
 kehillah_crisis.0011.c:0 "Keep trading, with the risk that entails."
 kehillah_crisis.0012.t:0 "Neighbours Speak Up"
 kehillah_crisis.0012.desc:0 "A group of townspeople asks to meet the elders. They trade with the quarter and dislike the threats now being made against it. They will speak to their neighbours, but ask you to keep your young men from answering insults with blows."
 kehillah_crisis.0012.a:0 "Ask the watch to observe that restraint."
 kehillah_crisis.0012.b:0 "Their goodwill cannot replace our preparations."
 kehillah_crisis.0013.t:0 "The Watch Wants Its Pay"
 kehillah_crisis.0013.desc:0 "The men keeping watch have left their workshops to stand at the end of the street. Several ask how long this will continue. They cannot keep losing their wages while their households wait to be fed."
 kehillah_crisis.0013.a:0 "Pay for their time away from work."
 kehillah_crisis.0013.b:0 "Reduce the watches. We must live within our means."
 kehillah_crisis.0200.t:0 "Order after the Unrest"
 kehillah_crisis.0200.desc:0 "The immediate threat to [kehillah_crisis_title.GetNameNoTier] has ended. Its leader asks what protection your word now carries. Your officials want to know whether the community may rebuild and return to its business, and whether its neighbours will answer for further attacks."
 kehillah_crisis.0200.a:0 "Reaffirm their protection, and provide relief if the treasury permits."
 kehillah_crisis.0200.b:0 "Offer renewed protection in return for a payment."
 kehillah_crisis.0200.c:0 "Forbid further disorder, but promise no aid."
 kehillah_crisis.0200.d:0 "Revoke this community's residence. They must leave."
 kehillah_crisis.0201.t:0 "When the Streets Grow Quiet"
 kehillah_crisis.0201.desc_struck:0 "The attackers have passed through the quarter. Those who remain begin finding one another, checking houses and asking which roads are safe. You have survived, but the community cannot yet return to its ordinary life.\n\nThe elders must account for the losses. There is also the question of what protection the ruler will now offer."
 kehillah_crisis.0201.desc_paid:0 "The payment has been made and the immediate threat has moved away. Families begin asking whether they may return to their houses. The chest is lighter, and you still need an assurance that the quarter will be protected.\n\nFor tonight, the watch can stand down in turns. The elders have sent to the ruler for an answer."
 kehillah_crisis.0201.desc_safe:0 "The immediate threat has broken. The watch finds the street quiet, and families begin opening doors they had kept barred. Your preparations have brought the community through this crisis.\n\nThe danger has passed for now. The elders have asked the ruler to confirm what happens next."
 kehillah_crisis.0201.a:0 "We have come through. Now we must take stock."
 kehillah_crisis.0202.t:0 "The Ruler's Answer"
 kehillah_crisis.0202.desc_aid:0 "[kehillah_crisis_ruler.GetTitledFirstName] reaffirms the community's right to remain. Officials are instructed to prevent further attacks; relief is sent if the treasury can afford it.\n\nThe promise will strengthen the quarter's protection while its households recover. It does not restore everything that has been spent or lost."
 kehillah_crisis.0202.desc_price:0 "[kehillah_crisis_ruler.GetTitledFirstName] will renew protection, but asks the community to contribute twenty gold toward its cost. The elders look over what remains in the chest.\n\nYou may pay for that assurance or refuse the demand and continue without the additional protection."
 kehillah_crisis.0202.desc_refused:0 "[kehillah_crisis_ruler.GetTitledFirstName] forbids further disorder, but offers neither relief nor a renewed promise of protection. The quarter may remain. Its households will have to meet the cost of recovery themselves."
 kehillah_crisis.0202.desc_expel:0 "[kehillah_crisis_ruler.GetTitledFirstName] has accepted the argument that the quarter brings too much trouble. Its right of residence is to be withdrawn.\n\nAn edict will set a deadline for departure. The community may plead, offer a ransom or prepare to leave together; this order concerns your community, not every Jewish settlement in the realm."
 kehillah_crisis.0202.a:0 "We must decide what comes next."
 kehillah_crisis.0202.b:0 "Pay twenty gold for renewed protection."
 kehillah_crisis.0202.c:0 "We cannot accept that demand."
 kehillah_crisis.0221.t:0 "Returning to Ordinary Life"
 kehillah_crisis.0221.desc:0 "The streets are quieter, but the weeks of danger have left their mark. Work was put aside, families borrowed from one another, and the watchmen have households of their own to support. The elders ask what should receive the community's attention first."
 kehillah_crisis.0221.a:0 "Help the households resume their work."
 kehillah_crisis.0221.b:0 "Acknowledge those who stood beside us."
 kehillah_crisis.0221.c:0 "Open a relief fund for the hardest-hit families."
 kehillah_crisis.0300.t:0 "A Door Still Open"
 kehillah_crisis.0300.desc:0 "A household has barred itself inside a house off the main street. Your watchmen can reach the door, but the lane behind them will not remain clear for long. A messenger asks whether to bring the family out now or keep the passage open for others."
 kehillah_crisis.0300.a:0 "Bring the children through the passage first."
 kehillah_crisis.0300.b:0 "Keep the passage open for more households."
 kehillah_crisis.0301.t:0 "The Way Out"
 kehillah_crisis.0301.desc:0 "Families have gathered at the end of a narrow lane. Some carry bundles; others have left everything behind. The watch knows a way past the houses, but fears the crowd will see them moving."
 kehillah_crisis.0301.a:0 "Use the escape routes we prepared."
 kehillah_crisis.0301.b:0 "Pay for guides who know the lanes."
 kehillah_crisis.0301.c:0 "Keep everyone together behind the watch."
 kehillah_crisis_tab:0 "Community Safety"
 kehillah_crisis_tab_short:0 "Safety"
 kehillah_crisis_hooks_tab_short:0 "Hooks & Secrets"
 kehillah_crisis_tab_tt:0 "Review the danger of violence, active preparations and the ruler's response."
 kehillah_crisis_risk_header:0 "Background risk"
 kehillah_crisis_risk:0 "[GetPlayer.Custom('KehillahDangerBand')]: [GetPlayer.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]% annual chance of an incident"
 kehillah_crisis_risk_tt:0 "This is the annualized chance of any eligible incident, not the chance of a massacre. Incidents include threats, restrictions and accusations. Prominence, wealth, recent incidents, the host's outlook, religious teaching, war and disease affect it. Renewed royal protection reduces the danger score for two years."
 kehillah_crisis_phase_header:0 "Current situation"
 kehillah_crisis_phase_none:0 "No organized threat is currently recorded."
 kehillah_crisis_phase_warning:0 "An agitator is gathering support. No army has been raised."
 kehillah_crisis_phase_war:0 "An armed host has formed. Your completed preparations still affect the outcome."
 kehillah_crisis_phase_waiting:0 "The immediate threat has ended. The ruler's judgment is pending."
 kehillah_crisis_phase_settled:0 "The ruler has answered. The community is recovering."
 kehillah_crisis_warning_numbers:0 "Armed host: [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_armed_points').GetValue|0]/100   Spared: [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_spared_points').GetValue|0]/100. Whichever fills first decides the warning. Agitation: [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_agitation').GetValue|0]/100."
 kehillah_crisis_warning_tt:0 "Each month the preaching adds to the Armed host, and a cold lord or a holy war adds more. Finished preparations, protection secured from the lord or the Church, and a friendly sovereign add to Spared. Open the crisis window to see every source of points."
 kehillah_crisis_organizer:0 "Organizer: [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_mob_threat').Char.GetTitledFirstName]"
 kehillah_crisis_readiness_header:0 "Protection and preparations"
 kehillah_crisis_refuge_yes:0 "Refuge in a castle: secured"
 kehillah_crisis_refuge_no:0 "Refuge in a castle: not secured"
 kehillah_crisis_men_yes:0 "The lord's soldiers: promised"
 kehillah_crisis_men_no:0 "The lord's soldiers: no promise"
 kehillah_crisis_condemn_yes:0 "A religious authority has condemned the agitation"
 kehillah_crisis_condemn_no:0 "No religious condemnation secured"
 kehillah_crisis_watch_yes:0 "Quarter watch: organized"
 kehillah_crisis_watch_no:0 "Quarter watch: not reinforced"
 kehillah_crisis_supplies_yes:0 "Emergency provisions: ready"
 kehillah_crisis_supplies_no:0 "Emergency provisions: not assembled"
 kehillah_crisis_routes_yes:0 "Household escape routes: arranged"
 kehillah_crisis_routes_no:0 "Household escape routes: not arranged"
 kehillah_crisis_advocacy_yes:0 "The communal advocate has answered the accusations"
 kehillah_crisis_advocacy_no:0 "No organized answer to the accusations"
 kehillah_crisis_pending_none:0 "No communal preparation is in progress."
 kehillah_crisis_pending_1:0 "Organizing the watch: [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_action_days').GetValue|0] days remaining"
 kehillah_crisis_pending_2:0 "Assembling provisions: [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_action_days').GetValue|0] days remaining"
 kehillah_crisis_pending_3:0 "Arranging household escape routes: [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_action_days').GetValue|0] days remaining"
 kehillah_crisis_pending_4:0 "Answering the accusations: [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_action_days').GetValue|0] days remaining"
 kehillah_crisis_diplomacy_pending:0 "A diplomatic messenger is on the road. The council records the request."
 kehillah_crisis_leader_away:0 "You are away on a visit. Other personal actions must wait for your return."
 kehillah_crisis_actions_header:0 "Prepare the community"
 kehillah_crisis_action_watch:0 "Organize the watch — 20 @gold_icon! · 14 days"
 kehillah_crisis_action_watch_tt:0 "Costs 20 gold and takes fourteen days, resolved on weekly updates. Reduces attack severity by 15. Only one communal preparation can run at a time."
 kehillah_crisis_action_supplies:0 "Assemble provisions — 30 @gold_icon! · 14 days"
 kehillah_crisis_action_supplies_tt:0 "Costs 30 gold and takes fourteen days. Reduces attack severity by 10. Only one communal preparation can run at a time."
 kehillah_crisis_action_routes:0 "Arrange escape routes — 10 @gold_icon! · 14 days"
 kehillah_crisis_action_routes_tt:0 "Costs 10 gold and takes fourteen days. Scatters households, reducing casualties, but can leave property exposed to looting. It also unlocks a prepared escape in the relevant attack encounter."
 kehillah_crisis_action_advocacy:0 "Answer accusations — 15 @gold_icon! · 14 days"
 kehillah_crisis_action_advocacy_tt:0 "Costs 15 gold and takes fourteen days. Reduces agitation by 20 when completed. It can be undertaken once per crisis."
 kehillah_crisis_action_council:0 "Seek protection or negotiate"
 kehillah_crisis_action_council_tt:0 "Meet the elders to petition the lord, send a messenger, approach religious authorities or negotiate with the agitator. Requests and travel use their existing time and costs."
 kehillah_crisis_actions_hint:0 "Preparations require an active warning, enough gold, freedom to act and no other communal preparation in progress. Decisions remain available through the council while an armed threat approaches."
 kehillah_crisis_outcome_header:0 "The latest crisis"
 kehillah_crisis_outcome_0:0 "No completed crisis has been recorded."
 kehillah_crisis_outcome_1:0 "The agitation subsided before an attack."
 kehillah_crisis_outcome_2:0 "The attackers were defeated or dispersed."
 kehillah_crisis_outcome_3:0 "The threat was bought off."
 kehillah_crisis_outcome_4:0 "The quarter was struck. Losses and recovery are recorded in the aftermath."
 kehillah_crisis_response_0:0 "No political settlement has been recorded."
 kehillah_crisis_response_1:0 "The ruler renewed protection."
 kehillah_crisis_response_2:0 "The ruler asks a payment for protection."
 kehillah_crisis_response_3:0 "Further disorder is forbidden; no additional aid is promised."
 kehillah_crisis_response_4:0 "An edict of expulsion has been issued against this community."
 kehillah_crisis_prepared_t:0 "A Preparation Is Complete"
 kehillah_crisis_prepared_d:0 "The Community Safety page in Military records what is ready and what remains to be done."
 kehillah_crisis_response_5:0 "The ruler withdrew the community's edict of expulsion."
 kehillah_crisis_targeted_edict_desc:0 "A herald brings an order from [kehillah_exp_host.GetTitledFirstName]. The right of residence held by [kehillah_exp_title.GetNameNoTooltip] is revoked. Its households must leave within [ROOT.Char.Custom('KehillahExpulsionTimeLeft')]. This edict concerns this community; the realm's general settlement law is unchanged.\n\nThe elders gather to consider a plea, a ransom or an orderly departure."
 kehillah_crisis_targeted_repeal_tt:0 "This community's edict of expulsion is withdrawn. The realm's settlement law and other communities' edicts are unchanged. Any ransom offered is paid."
 kehillah_crisis.0201.desc_granada:0 "A clerk brings you the petitions set aside during the unrest. There are accounts to settle and scholars waiting for replies. The elders want to know when the households who left may return.\n\nYour father's offices are still yours to exercise, but the weeks of accusations have shown how much depends on the palace. You have asked the ruler to state publicly what protection the community may expect."
 kehillah_crisis_warning_header:0 "The race"
 kehillah_crisis_diplomacy_header:0 "Petitions and negotiations"
 kehillah_crisis_effect_watch:0 "Reduces attack severity by 15 once the watch is ready."
 kehillah_crisis_effect_supplies:0 "Reduces attack severity by 10 once provisions are assembled."
 kehillah_crisis_effect_routes:0 "Helps households escape; property may be more exposed to looting."
 kehillah_crisis_effect_advocacy:0 "Reduces agitation by 20 on completion, lowering the chance of violence."
 kehillah_crisis_peace_hint:0 "A warning will open preparations here before an organized attack. The annual incident chance includes threats, accusations and restrictions."
 kehillah_crisis_protection_active:0 "#P Royal protection is in force.#! It lowers background danger and adds to Spared each month while a warning lasts."
