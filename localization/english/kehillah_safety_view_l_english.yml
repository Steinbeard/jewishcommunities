 kehillah_safety_danger_quarterly:0 "Danger [GetPlayer.MakeScope.ScriptValue('kehillah_danger_value')|0] is rolled once each quarter, a [GetPlayer.MakeScope.ScriptValue('kehillah_incident_chance_value')|1]% chance each time."
 kehillah_safety_danger_tt:0 "#T Danger of violence#!\nHow likely the people around the community are to turn on it this year. The bar fills from Calm to Perilous as the chance of trouble grows.\n\n#weak The drivers below show what is raising it and what holds it down.#!"
 kehillah_safety_band_calm:0 "#P;bold Calm#!"
 kehillah_safety_band_calm_off:0 "#weak Calm#!"
 kehillah_safety_band_uneasy:0 "#E;bold Uneasy#!"
 kehillah_safety_band_uneasy_off:0 "#weak Uneasy#!"
 kehillah_safety_band_tense:0 "#N;bold Tense#!"
 kehillah_safety_band_tense_off:0 "#weak Tense#!"
 kehillah_safety_band_dangerous:0 "#N;bold Dangerous#!"
 kehillah_safety_band_dangerous_off:0 "#weak Dangerous#!"
 kehillah_safety_band_perilous:0 "#N;bold Perilous#!"
 kehillah_safety_band_perilous_off:0 "#weak Perilous#!"

 kehillah_safety_drivers_header:0 "What drives the danger"
 kehillah_safety_drivers_total:0 "Danger #high [GetPlayer.MakeScope.ScriptValue('kehillah_danger_value')|0]#!"
 kehillah_safety_drivers_total_tt:0 "The drivers below, added together. It never falls below zero."
 kehillah_safety_raising_header:0 "Raising it"
 kehillah_safety_lowering_header:0 "Holding it down"
 kehillah_safety_lowering_none:0 "Nothing holds it down."
 kehillah_safety_factor_greatness:0 "Prominence (Greatness)"
 kehillah_safety_factor_greatness_tt:0 "A great community is a visible one. Its scholars, its friends at court and its fame draw the eye of preachers and crowds."
 kehillah_safety_factor_wealth:0 "Wealth (Prosperity)"
 kehillah_safety_factor_wealth_tt:0 "Wealth breeds envy, and debtors who would rather not repay."
 kehillah_safety_factor_incidents:0 "Recent incidents in the faith"
 kehillah_safety_factor_incidents_tt:0 "Accusations and violence elsewhere in the county's faith make the next one easier. They fade with the years."
 kehillah_safety_factor_hard_times:0 "Hard times"
 kehillah_safety_factor_hard_times_tt:0 "Plague in the county, its lord at war, or the faith on crusade."
 kehillah_safety_factor_teaching:0 "The host faith's teaching"
 kehillah_safety_factor_teaching_tt:0 "A strict or exclusionary teaching on the Jews in the ruler's faith."
 kehillah_safety_factor_lord:0 "The host's outlook"
 kehillah_safety_factor_lord_tt:0 "How the ruler regards the Jews: [GetPlayer.Custom('KehillahHostOutlookBand')]. A protective ruler holds the danger down; a hostile one invites it."
 kehillah_safety_factor_seat:0 "At the ruler's door"
 kehillah_safety_factor_seat_tt:0 "The community lives at the realm's seat, close to the court's intrigues and the capital's crowd."
 kehillah_safety_factor_badge:0 "The badge"
 kehillah_safety_factor_badge_tt:0 "While the community wears the badge, it is marked out in every street."
 kehillah_safety_factor_protection:0 "Royal protection"
 kehillah_safety_factor_protection_tt:0 "The ruler's renewed protection, for two years after it is granted."
 kehillah_safety_factor_lull:0 "The quiet after the decrees"
 kehillah_safety_factor_lull_tt:0 "After a wave of decrees, the town's anger is spent for a time."

 kehillah_safety_shields_header:0 "Shields, and what may come"
 kehillah_safety_shield_host:0 "#weak Host:#! [GetPlayer.GetTopLiege.GetTitledFirstNameNoTooltip], [GetPlayer.Custom('KehillahHostOutlookBand')]"
 kehillah_safety_shield_host_tt:0 "The ruler of the realm that holds the community's quarter, and how the ruler regards the Jews."
 kehillah_safety_shield_watch:0 "#weak Charter watch:#! [GetPlayer.Custom('KehillahCharterNoticeSecurity')]"
 kehillah_safety_shield_watch_tt:0 "What the charter allows the community for its own defence."
 kehillah_safety_shield_protection_on:0 "#weak Royal protection:#! #P in force#!"
 kehillah_safety_shield_protection_off:0 "#weak Royal protection:#! none"
 kehillah_safety_mob_header:0 "If an accusation turns violent"
 kehillah_safety_mob_split:0 "#N A mob besieges the quarter: [GetPlayer.MakeScope.ScriptValue('kehillah_accusation_mob_chance_value')|0]%#!   #weak ·#!   A riot in the street: [GetPlayer.MakeScope.ScriptValue('kehillah_accusation_riot_chance_value')|0]%"
 kehillah_safety_mob_tt:0 "The higher the danger, the likelier an accusation's violence becomes a mob at the gates rather than a riot in the street."
 kehillah_safety_incident_kinds:0 "Trouble may come as an accusation, a disputation, friars in the synagogue, a trial of the Talmud, the badge, Holy Week, a riot over the bonds, or a mob."
