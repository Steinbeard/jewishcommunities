 kehillah_safety_danger_header:0 "Danger of an incident"
 kehillah_safety_danger_chance:0 "#high [GetPlayer.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]%#! this year"
 kehillah_safety_danger_quarterly:0 "Danger [GetPlayer.MakeScope.ScriptValue('kehillah_danger_value')|0] is rolled once each quarter, a [GetPlayer.MakeScope.ScriptValue('kehillah_incident_chance_value')|1]% chance each time."
 kehillah_safety_danger_tt:0 "#T Danger of an incident: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_value')|0]#!\n#weak Current factors#!\nProsperity: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_wealth_value')|+0]\nGreatness: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_greatness_value')|+0]\nStability: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_stability_value')|0]\nRecent incidents: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_incidents_value')|+0]\nHard times: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_hard_times_value')|+0]\nHost faith's teaching: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_teaching_value')|+0]\nHost's outlook: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_lord_value')|+0]\nAt the ruler's seat: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_seat_value')|+0]\nThe badge: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_badge_value')|+0]\nRoyal protection: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_protection_value')|0]\nAfter the decrees: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_lull_value')|0]\n\nEach quarter, an eligible incident is rolled at [GetPlayer.MakeScope.ScriptValue('kehillah_incident_chance_value')|1]%. The annual chance of at least one successful roll is [GetPlayer.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]%. Eligibility and cooldowns still apply. This is not the chance of an attack.\n\nAfter an attack crisis, decree, or Talmud trial ends, no new crisis can begin for one year."
