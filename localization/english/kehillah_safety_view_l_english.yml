l_english:
 # Military > Community Safety (gui/kehillah_crisis_military.gui), 2026-11-01.
 kehillah_safety_live_header:0 "Crises under way"
 kehillah_safety_situation_phase:0 "#weak Now:#! [Situation.GetTopCurrentPhase.GetType.GetNameNoTooltip] #weak $kehillah_crisis_grade_tag$#!"
 kehillah_safety_open_situation:0 "Open"
 kehillah_safety_open_situation_tt:0 "Open this crisis: its phases, what is driving it, and what the community can do."
 kehillah_safety_race_header:0 "The warning"
 kehillah_safety_armed_progress:0 "Armed host · [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_armed_points').GetValue|0]/100"
 kehillah_safety_spared_progress:0 "Spared · [GetPlayer.GetPrimaryTitle.MakeScope.Var('kehillah_crisis_spared_points').GetValue|0]/100"

 kehillah_safety_danger_header:0 "Danger of an incident"
 kehillah_safety_danger_chance:0 "#high [GetPlayer.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]%#! this year[GetPlayer.Custom('KehillahTroubleTag')]"
 kehillah_safety_danger_quarterly:0 "Danger [GetPlayer.MakeScope.ScriptValue('kehillah_danger_value')|0] is rolled once each quarter, a [GetPlayer.MakeScope.ScriptValue('kehillah_incident_chance_value')|1]% chance each time."
 kehillah_safety_danger_planning_tt:0 "#T Chance of an incident#![GetPlayer.Custom('KehillahTroubleStatusLine')]\nAn eligible community has at least a 1% annual chance of an incident. The number is the chance of one successful quarterly roll in a year, not the chance of an attack. A crisis or cooldown pauses new incidents without changing the underlying danger.\n\n#bold Current danger: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_value')|0]#!\nCourt opposition: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_court_pressure_value')|0]\nPopular hostility: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_popular_pressure_value')|0]\nWealth and renown: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_visibility_value')|0]\nStability: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_stability_value')|0]\nRuler's outlook: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_lord_value')|0]\nRoyal protection: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_protection_value')|0]\nReligious assurance: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_religious_support_value')|0]\nAfter the decrees: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_lull_value')|0]\n#weak The total cannot fall below zero. The yearly chance has a separate 1% floor while incidents are eligible.#!"
 kehillah_safety_pressures_header:0 "Sources of pressure"
 kehillah_safety_court_label:0 "Opposition at court"
 kehillah_safety_popular_label:0 "Popular hostility"
 kehillah_safety_pressure_low:0 "#P Low#!"
 kehillah_safety_pressure_present:0 "#E Present#!"
 kehillah_safety_pressure_high:0 "#N High#!"
 kehillah_safety_pressure_severe:0 "#N Severe#!"
 kehillah_safety_court_tt:0 "#T Opposition at court: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_court_pressure_value')|0] danger#!\nAt the ruler's seat: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_seat_value')|0]\nA Jewish vizier: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_court_office_value')|0]\nPowerful rivals: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_court_rivals_value')|0]\n\n#weak The Nagid's communal office alone does not incur a penalty. The rivals' grievance is local and temporary. The ruler's own outlook is shown separately under protection.#!"
 kehillah_safety_popular_tt:0 "#T Popular hostility: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_popular_pressure_value')|0] danger#!\nRecent incidents in the host faith: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_incidents_value')|0]\nPlague, war or crusade: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_hard_times_value')|0]\nHost faith's teaching: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_teaching_value')|0]\nThe badge: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_badge_value')|0]\nLocal agitation: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_local_hostility_value')|0]\n\n#weak Hard times increase the danger of an incident; this is not a claim that every townsman blames the Jews.#!"
 kehillah_safety_visibility_summary:0 "#weak Wealth and renown also draw attention.#!"
 kehillah_safety_visibility_tt:0 "#T Visibility: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_visibility_value')|0] danger#!\nProsperity: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_wealth_value')|0]\nGreatness: +[GetPlayer.MakeScope.ScriptValue('kehillah_danger_greatness_value')|0]\n\nA wealthy, prominent community can attract opportunists without the whole town becoming hostile."
 kehillah_safety_protection_header:0 "Protection and preparation"
 kehillah_safety_stability_summary:0 "Communal Stability: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_stability_value')|0] danger"
 kehillah_safety_stability_tt:0 "#T Communal Stability#!\nCohesion reduces the background danger by [GetPlayer.MakeScope.ScriptValue('kehillah_danger_stability_value')|0]. A well-run Bet Din can strengthen Stability; poor judgments may weaken it."
 kehillah_safety_ruler_summary:0 "Ruler: [GetPlayer.GetTopLiege.GetTitledFirstNameNoTooltip] · [GetPlayer.Custom('KehillahHostOutlookBand')]"
 kehillah_safety_ruler_tt:0 "#T The ruler's outlook#!\n[GetPlayer.GetTopLiege.GetTitledFirstName] changes background danger by [GetPlayer.MakeScope.ScriptValue('kehillah_danger_lord_value')|0]. The Shtadlan can petition the host and seek an audience. Court rivals remain a separate pressure even under a favorable ruler."
 kehillah_safety_bet_din_action:0 "Host a Bet Din"
 kehillah_safety_bet_din_action_tt:0 "Open Activities to plan a Bet Din. Its cases and final session can increase Stability; results depend on the judgments and attendance."
 kehillah_safety_petition_action:0 "Petition the Host"
 kehillah_safety_petition_action_tt:0 "Open the Council to assign your Shtadlan to Petition the Host. A successful audience can improve the ruler's outlook and lower background danger."
 kehillah_safety_religious_support_on:0 "#weak Religious assurance:#! #P in force#!"
 kehillah_safety_religious_support_action:0 "Seek Religious Support"
 kehillah_safety_crisis_hint:0 "#weak Open the situation above to respond to the crisis.#!"
 kehillah_safety_religious_support_tt:0 "Open the Council to assign your Shtadlan to Seek Religious Support. The host's religious adviser may publicly urge restraint, reducing incident danger by 8 for two years. This competes with Petition the Host for the Shtadlan's time. An existing assurance cannot stack with another. During a crisis, use the situation's own measures for immediate help."
 kehillah_safety_danger_tt:0 "#T Danger of an incident: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_value')|0]#![GetPlayer.Custom('KehillahTroubleStatusLine')]\n#weak Current factors#!\nProsperity: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_wealth_value')|+0]\nGreatness: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_greatness_value')|+0]\nStability: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_stability_value')|0]\nRecent incidents: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_incidents_value')|+0]\nHard times: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_hard_times_value')|+0]\nHost faith's teaching: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_teaching_value')|+0]\nHost's outlook: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_lord_value')|+0]\nAt the ruler's seat: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_seat_value')|+0]\nThe badge: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_badge_value')|+0]\nRoyal protection: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_protection_value')|0]\nReligious assurance: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_religious_support_value')|0]\nAfter the decrees: [GetPlayer.MakeScope.ScriptValue('kehillah_danger_lull_value')|0]\n\nEach quarter, an eligible incident is rolled at [GetPlayer.MakeScope.ScriptValue('kehillah_incident_chance_value')|1]%. The annual chance of at least one successful roll is [GetPlayer.MakeScope.ScriptValue('kehillah_incident_yearly_chance_value')|0]%. Eligibility and cooldowns still apply. This is not the chance of an attack.\n\nAfter an attack crisis, decree, or Talmud trial ends, no new crisis can begin for one year."
 kehillah_safety_band_calm:0 "#P;bold Calm#!"
 kehillah_safety_band_calm_off:0 "#weak Calm#!"
 kehillah_safety_band_uneasy:0 "#E;bold Uneasy#!"
 kehillah_safety_band_uneasy_off:0 "#weak Uneasy#!"
 kehillah_safety_band_tense:0 "#N;bold Tense#!"
 kehillah_safety_band_tense_off:0 "#weak Tense#!"
 kehillah_safety_band_dangerous:0 "#N;bold Dangerous#!"
 kehillah_safety_band_dangerous_off:0 "#weak Dangerous#!"
 kehillah_safety_band_perilous:0 "#N;bold Perilous#!"
 kehillah_safety_band_perilous_off:0 "#weak Perilous#!"

 kehillah_safety_drivers_header:0 "What drives the danger"
 kehillah_safety_drivers_total:0 "Danger #high [GetPlayer.MakeScope.ScriptValue('kehillah_danger_value')|0]#!"
 kehillah_safety_drivers_total_tt:0 "The drivers below, added together. It never falls below zero."
 kehillah_safety_raising_header:0 "Raising it"
 kehillah_safety_lowering_header:0 "Holding it down"
 kehillah_safety_lowering_none:0 "Nothing holds it down."
 kehillah_safety_factor_greatness:0 "Prominence (Greatness)"
 kehillah_safety_factor_greatness_tt:0 "A renowned community draws attention, though less than its wealth."
 kehillah_safety_factor_wealth:0 "Wealth (Prosperity)"
 kehillah_safety_factor_wealth_tt:0 "Prosperity makes the community more visible and attractive as a target."
 kehillah_safety_factor_stability:0 "Communal stability"
 kehillah_safety_factor_stability_tt:0 "Cohesion and preparedness reduce the danger of an incident."
 kehillah_safety_readiness_summary:0 "Refuge · Ruler's soldiers · Watch · Supplies · Routes"
 kehillah_safety_readiness_tt:0 "#T If an armed host forms#!\n[GetPlayer.Custom('KehillahCrisisRefuge')]\n[GetPlayer.Custom('KehillahCrisisMen')]\n[GetPlayer.Custom('KehillahCrisisCondemn')]\n[GetPlayer.Custom('KehillahCrisisWatch')]\n[GetPlayer.Custom('KehillahCrisisSupplies')]\n[GetPlayer.Custom('KehillahCrisisRoutes')]\n[GetPlayer.Custom('KehillahCrisisAdvocacy')]"
 kehillah_safety_shields_summary:0 "#weak Charter watch:#! [GetPlayer.Custom('KehillahCharterNoticeSecurity')]"
 kehillah_safety_shields_tt:0 "#T Protection#!\nThe charter determines what watch the community may keep, which matters if violence occurs. Royal protection lowers incident danger by 10 while it lasts. A religious adviser's assurance lowers it by 8 and can help during an attack warning. The ruler's outlook is shown separately."
 kehillah_safety_factor_incidents:0 "Recent incidents in the faith"
 kehillah_safety_factor_incidents_tt:0 "Accusations and violence elsewhere in the county's faith make the next one easier. They fade with the years."
 kehillah_safety_factor_hard_times:0 "Hard times"
 kehillah_safety_factor_hard_times_tt:0 "Plague in the county, its lord at war, or the faith on crusade."
 kehillah_safety_factor_teaching:0 "The host faith's teaching"
 kehillah_safety_factor_teaching_tt:0 "A strict or exclusionary teaching on the Jews in the ruler's faith."
 kehillah_safety_factor_lord:0 "The host's outlook"
 kehillah_safety_factor_lord_tt:0 "How the ruler regards the Jews: [GetPlayer.Custom('KehillahHostOutlookBand')]. A protective ruler holds the danger down; a hostile one invites it."
 kehillah_safety_factor_seat:0 "At the ruler's door"
 kehillah_safety_factor_seat_tt:0 "The community lives at the realm's seat, close to the court's intrigues and the capital's crowd."
 kehillah_safety_factor_badge:0 "The badge"
 kehillah_safety_factor_badge_tt:0 "While the community wears the badge, it is marked out in every street."
 kehillah_safety_factor_protection:0 "Royal protection"
 kehillah_safety_factor_protection_tt:0 "The ruler's renewed protection, for two years after it is granted."
 kehillah_safety_factor_lull:0 "The quiet after the decrees"
 kehillah_safety_factor_lull_tt:0 "After a wave of decrees, the town's anger is spent for a time."

 kehillah_safety_shields_header:0 "Shields, and what may come"
 kehillah_safety_shield_host:0 "#weak Host:#! [GetPlayer.GetTopLiege.GetTitledFirstNameNoTooltip], [GetPlayer.Custom('KehillahHostOutlookBand')]"
 kehillah_safety_shield_host_tt:0 "The ruler of the realm that holds the community's quarter, and how the ruler regards the Jews."
 kehillah_safety_shield_watch:0 "#weak Charter watch:#! [GetPlayer.Custom('KehillahCharterNoticeSecurity')]"
 kehillah_safety_shield_watch_tt:0 "What the charter allows the community for its own defence."
 kehillah_safety_shield_protection_on:0 "#weak Royal protection:#! #P in force#!"
 kehillah_safety_shield_protection_off:0 "#weak Royal protection:#! none"
 kehillah_safety_mob_header:0 "If an accusation turns violent"
 kehillah_safety_mob_split:0 "#N A mob besieges the quarter: [GetPlayer.MakeScope.ScriptValue('kehillah_accusation_mob_chance_value')|0]%#!   #weak ·#!   A riot in the street: [GetPlayer.MakeScope.ScriptValue('kehillah_accusation_riot_chance_value')|0]%"
 kehillah_safety_mob_tt:0 "The higher the danger, the likelier an accusation's violence becomes a mob at the gates rather than a riot in the street."
 kehillah_safety_incident_kinds:0 "Trouble may come as an accusation, a disputation, friars in the synagogue, a trial of the Talmud, the badge, Holy Week, a riot over the bonds, or a mob."
