l_english:
 kehillah_accusation.0001.t:0 "An Accusation"
 kehillah_accusation_tale_blood_libel:0 "A Christian boy has been found dead beneath the walls of [kehillah_accusation_town.GetName]. By noon, a preacher is proclaiming that the Jews murdered him for their rites. No one knows how the child died, but the accusation spreads faster than any question of the truth."
 kehillah_accusation_tale_mockery:0 "A storm has torn the roof from the church in [kehillah_accusation_town.GetName], and a deacon swears that at that very hour he saw the Jews mocking an image of the crucified Christ. In Rome, in Pope Benedict's day, Jews were burned for a tale like this one.\n\nNo one in the market asks the deacon how he came to be looking through Jewish shutters in a storm."
 kehillah_accusation_tale_desecration:0 "The sexton of the church in [kehillah_accusation_town.GetName] says a consecrated wafer is missing from the altar. This morning a maidservant swore she had seen it in a Jewish house, and that it bled when the Jews stabbed it with knives.\n\nThe priest has taken her to the market square to tell it again, and again."
 kehillah_accusation_tale_blasphemy:0 "A man has sworn before the qadi that a Jew of [kehillah_accusation_town.GetName] cursed the Prophet in the market. Nobody can name another who heard it.\n\nIt hardly matters now. The whole street has heard of it."
 kehillah_accusation.0001.crowd:0 "\n\nBy nightfall there are torches at the end of the Jews' street. In the quarter, doors are being barred and children hurried indoors, and everyone is looking toward the castle."
 kehillah_accusation.0001.lord_protective:0 " [kehillah_accusing_host.GetTitledFirstName] has stood by the Jews before, against worse than this. Whether [kehillah_accusing_host.GetSheHe] will stand against [kehillah_accusing_host.GetHerHis] own townsmen tonight is another matter."
 kehillah_accusation.0001.lord_well_disposed:0 " [kehillah_accusing_host.GetTitledFirstName] has been kind to the Jews when kindness cost [kehillah_accusing_host.GetHerHim] little. Tonight it may cost [kehillah_accusing_host.GetHerHim] something."
 kehillah_accusation.0001.lord_indifferent:0 " [kehillah_accusing_host.GetTitledFirstName] has never much cared about the Jews either way. Whether [kehillah_accusing_host.GetSheHe] cares enough to send men into the street tonight, no one can say."
 kehillah_accusation.0001.lord_cold:0 " [kehillah_accusing_host.GetTitledFirstName] has no love for the Jews. If [kehillah_accusing_host.GetSheHe] sends men at all, they may take their time."
 kehillah_accusation.0001.lord_hostile:0 " [kehillah_accusing_host.GetTitledFirstName] would not be sorry to see the Jews gone. If [kehillah_accusing_host.GetHerHis] men come tonight, they may not come to keep order."
 kehillah_accusation.0001.a:0 "Send [kehillah_plea_envoy.GetFirstName] to plead with [kehillah_accusing_host.GetTitledFirstName]."
 kehillah_accusation.0001.a_self:0 "Go to [kehillah_accusing_host.GetTitledFirstName] yourself and plead."
 kehillah_accusation.0001.b:0 "Send silver to [kehillah_accusing_host.GetTitledFirstName], and ask for [kehillah_accusing_host.GetHerHis] men."
 kehillah_accusation.0001.c_killer:0 "Find out who really killed the boy."
 kehillah_accusation.0001.c_witness:0 "Find out who put the witness up to it."
 kehillah_accusation.0001.d:0 "Bar the gates of the quarter and wait for morning."
 kehillah_accusation_outcome_protected:0 "The lord's men clear the street"
 kehillah_accusation_outcome_exposed:0 "The lie is exposed"
 kehillah_accusation_outcome_caught:0 "Word gets out that the Jews are buying witnesses"
 kehillah_accusation_outcome_violence:0 "The mob comes"
 kehillah_accusation_defused_tt:0 "The crowd goes home, but the quarter will not forget how close it came."
 kehillah_accusation_exposed_tt:0 "The accuser is shamed before the town, and the tale dies with no blood shed."
 kehillah_accusation_violence_tt:0 "The crowd turns violent. It may riot in our street, or grow into a mob that besieges the quarter."
 kehillah_accusation_barred_tt:0 "The crowd will riot outside the gates and burn what it can reach, but it will not take the quarter. The community's courage will be remembered."
 kehillah_accusation_precedent_tt:0 "[kehillah_accusing_host.GetTitledFirstName] will remember that the Jews pay to be protected."
 kehillah_factor_charter_protects:0 "Our charter binds the lord to protect us"
 kehillah_factor_charter_promises:0 "Our charter promises us the lord's protection"
 kehillah_factor_hof_forbids:0 "The head of the faith has forbidden violence against the Jews"
 kehillah_accusation.0002.t:0 "After the Accusation"
 kehillah_accusation.0002.defused:0 "The crowd went home without blood. But the tale will be told again in the taverns, and the community will remember how near it came."
 kehillah_accusation.0002.defused_shtadlan:0 "The lord heard the plea. His bailiff's men took the market square and sent the crowd home, and the preacher was moved on to the next town. But the tale will be told again in the taverns, and the community will remember how near it came."
 kehillah_accusation.0002.defused_paid:0 "The lord took the silver and posted his men at the end of the street. The crowd thinned by midnight. No one in the quarter slept, and everyone knows what the peace cost, and that someone else can offer the lord a larger purse."
 kehillah_accusation.0002.exposed:0 "It took three days, but the truth came out, and in front of the whole town. The accuser left by the river gate before dawn. In the synagogue they are already telling the story, and in the market they are already pretending they never believed him."
 kehillah_accusation.0002.late_shtadlan:0 "The lord's men came too late to hold the street. "
 kehillah_accusation.0002.late_paid:0 "The lord kept the silver, and his men did not come in time. "
 kehillah_accusation.0002.late_caught:0 "Our questions reached the wrong ears. By morning the preacher was telling the crowd that the Jews were buying witnesses, and the crowd needed nothing more. "
 kehillah_accusation.0002.late_barred:0 "The gates held, but not everyone was behind them when they closed. "
 kehillah_accusation.0002.violence:0 "The crowd ran riot in the street before it was driven off. The community has lost #N [ROOT.Char.MakeScope.Var('kehillah_accusation_last_stability').GetValue|0]#! Stability and #N [ROOT.Char.MakeScope.Var('kehillah_accusation_last_prosperity').GetValue|0]#! Prosperity."
 kehillah_accusation.0002.martyr:0 "The crowd broke into the street, and [kehillah_accusation_martyr.GetFirstName] was killed there. The community has lost #N [ROOT.Char.MakeScope.Var('kehillah_accusation_last_stability').GetValue|0]#! Stability and #N [ROOT.Char.MakeScope.Var('kehillah_accusation_last_prosperity').GetValue|0]#! Prosperity. \n\nThey will say Kaddish for [kehillah_accusation_martyr.GetHerHim] tonight."
 kehillah_accusation.0002.a:0 "We will not forget."
 kehillah_news_accusation_t:0 "An Accusation and a Mob"
 kehillah_news_accusation_d:0 "A false accusation was raised against the Jews of [kehillah_news_title.GetNameNoTooltip], and a crowd broke into their quarter."
