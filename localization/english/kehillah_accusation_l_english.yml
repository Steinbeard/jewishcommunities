l_english:
 kehillah_accusation.0001.t:0 "An Accusation"
 kehillah_accusation.0001.desc:0 "[ROOT.Char.Custom('KehillahAccusationTale')] \n\nBy evening a crowd has gathered at the end of the Jews' street. Everything now depends on what [kehillah_accusing_host.GetTitledFirstName] will do. [kehillah_accusing_host.GetSheHe|U] is [kehillah_accusing_host.Custom('KehillahOutlookBand')] toward the Jews ([kehillah_accusing_host.MakeScope.ScriptValue('kehillah_outlook_on_jews_value')|0])."
 kehillah_accusation_tale_blood_libel:0 "A Christian child has been found dead outside the walls of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], and a preacher in the market cries that the Jews killed him for their rites. The tale is old and false, and the crowd believes it."
 kehillah_accusation_tale_blasphemy:0 "A man swears before the qadi that a Jew of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] cursed the Prophet in the market. Whether he did or not hardly matters now; the crowd has heard it."
 kehillah_accusation_tale_desecration:0 "The sexton of the church in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] says a consecrated wafer is missing from the altar. This morning a maidservant swore she saw it in a Jewish house, and that it bled when the Jews stabbed it with knives. The priest has taken her to the market square to tell it again."
 kehillah_accusation.0001.a:0 "Send [kehillah_plea_shtadlan.GetFirstName] to the lord to beg for protection."
 kehillah_accusation.0001.b:0 "Pay the lord for his men."
 kehillah_accusation.0001.c:0 "Appeal to [kehillah_appeal_hof.GetTitledFirstName], who has condemned such tales."
 kehillah_accusation.0001.d:0 "Bar the gates of the quarter and stand together."
 kehillah_accusation_outcome_protected:0 "The lord's men keep order"
 kehillah_accusation_outcome_rebuked:0 "The head of the faith condemns the libel"
 kehillah_accusation_outcome_violence:0 "The mob comes"
 kehillah_accusation_defused_tt:0 "The crowd disperses. Fear lingers: Stability #N -20#!"
 kehillah_accusation_violence_tt:0 "The crowd turns violent. It may riot in our street, or grow into a mob that besieges the quarter."
 kehillah_accusation_barricade_tt:0 "The community defends itself: the harm is lessened (#P x0.6#!), and its courage is remembered: Greatness #P +10#!"
 kehillah_host_demands_appeal_resent_tt_accusation:0 "The lord resents the rebuke: outlook on the Jews #N -3#!"
 kehillah_accusation.0002.t:0 "After the Accusation"
 kehillah_accusation.0002.defused:0 "The crowd dispersed without blood. But the tale will be told again in the taverns, and the community will remember how near it came."
 kehillah_accusation.0002.violence:0 "The mob broke into the quarter before it was driven off. The community has lost #N [ROOT.Char.MakeScope.Var('kehillah_accusation_last_stability').GetValue|0]#! Stability and #N [ROOT.Char.MakeScope.Var('kehillah_accusation_last_prosperity').GetValue|0]#! Prosperity."
 kehillah_accusation.0002.martyr:0 "The mob broke into the quarter, and [kehillah_accusation_martyr.GetFirstName] was killed in the street. The community has lost #N [ROOT.Char.MakeScope.Var('kehillah_accusation_last_stability').GetValue|0]#! Stability and #N [ROOT.Char.MakeScope.Var('kehillah_accusation_last_prosperity').GetValue|0]#! Prosperity. \n\nThey will say Kaddish for [kehillah_accusation_martyr.GetHerHim] tonight."
 kehillah_accusation.0002.a:0 "We will not forget."
 kehillah_news_accusation_t:0 "An Accusation and a Mob"
 kehillah_news_accusation_d:0 "A false accusation was raised against the Jews of [kehillah_news_title.GetNameNoTooltip], and a crowd broke into their quarter."
