l_english:
 kehillah_bet_din.01021.t:0 "The Converted Husband's Property"
 kehillah_bet_din.01021.desc:0 "[kbd_litigant_a.GetFirstName] seeks household goods after a spouse's change of faith. [kbd_litigant_b.GetFirstName] holds the marriage agreement and says some goods were reserved separately. The neighbors' anger cannot tell the court who owns a chest."
 kehillah_bet_din.01021.a:0 "Give the claimant all goods in the house."
 kehillah_bet_din.01021.a.tt:0 "A reserved dowry could be seized."
 kehillah_bet_din.01021.b:0 "Inventory the goods and read the marriage terms."
 kehillah_bet_din.01021.b.tt:0 "Inventory costs time and protects both property claims."
 kehillah_bet_din.01021.c:0 "Leave every good with its current keeper."
 kehillah_bet_din.01021.c.tt:0 "A clear claim could be lost through inaction."
 kehillah_din_source_102:0 "Cite a mastered Nashim work and examine the evidence."
 kehillah_din_source_102_tt:0 "Mishnah Kiddushin 4:1 gives the judges a textual point of reference. It cannot establish the marriage agreement's property terms."
 kehillah_din_combo_102:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_102_tt:0 "The judges preserve both parties' interests while checking the marriage agreement's property terms."
 kehillah_bet_din.01024.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.01024.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.01024.outcome_1:0 "All household goods pass to the claimant."
 kehillah_bet_din.01024.outcome_2:0 "The court seals an inventory and compares each item with the marriage agreement."
 kehillah_bet_din.01024.outcome_3:0 "Possession decides every item."
 kehillah_bet_din.01024.fact_true:0 "The agreement reserves several goods to the other spouse. A blanket transfer takes their property."
 kehillah_bet_din.01024.fact_false:0 "The agreement assigns the disputed chest to the claimant. Leaving all goods in place ignores that term."
 kehillah_bet_din.01024.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.01024.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.01024.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case102_one_tt:0 "The immediate ruling costs 8 Prosperity and carries the larger fact risk."
 kehillah_din_case102_two_tt:0 "Inquiry costs 4 Prosperity while the court keeps the issue open."
 kehillah_din_case102_three_tt:0 "The quick final settlement costs 2 Prosperity but may be overbroad."
 kehillah_bet_din_case102_great_log_title:0 "The Converted Husband's Property: a well-supported ruling"
 kehillah_bet_din_case102_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the converted husband's property dispute."
 kehillah_bet_din_case102_good_log_title:0 "The Converted Husband's Property: a workable ruling"
 kehillah_bet_din_case102_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the converted husband's property dispute."
