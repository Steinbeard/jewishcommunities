l_english:

 # =====================================================================
 # Responsa -- she'elot u-teshuvot. ROADMAP S5, added 2026-09-27.
 # Events: events/kehillah_responsa_events.txt
 # Decision: common/decisions/kehillah_responsa_decisions.txt
 #
 # THE SIX QUESTIONS are written as plausible questions of the kind the
 # real responsa literature is full of -- kashrut, an agunah, wine handled
 # by non-Jews, an orphan's upkeep, a Sabbath lamp, a convert's standing.
 # Per this repo's standing norm, NONE is attributed to a named historical
 # figure or presented as a specific surviving teshuvah; the asker is
 # whichever community leader the registry supplied, so no ruling is put
 # in a real person's mouth.
 #
 # Each question is a genuine tension between a strict reading and a
 # lenient one, with a real cost either way -- not a puzzle with a right
 # answer. That is the same "competence and knowledge, not plots" design
 # principle the dispute events are built on.
 # =====================================================================

 kehillah_responsa.0001.t:0 "A Question From Afar"

 kehillah_responsa.0001.desc:0 "#weak A letter, carried by a merchant who would not say how long it had been in his bag.#!\n\n[kehillah_responsa_asker.GetTitledFirstName] of [kehillah_responsa_asker_title.GetName] writes to [ROOT.Char.GetTitledFirstName], and the question is not a small one.\n\n[ROOT.Char.Custom('KehillahResponsaQuestion')]\n\n#italic They have asked you. Whatever you write will be copied, and read by people who have never met you.#!"

 # The question bodies, selected by var:kehillah_responsa_question through
 # the KehillahResponsaQuestion custom loc.
 kehillah_responsa_question_oven:0 "A widow's oven cracked in the firing, and she baked in it for a month before anyone noticed the seam. The community's baker says everything she sold is forbidden and must be made good from her own purse. She has no purse. #italic Is the bread forbidden, and if it is, must she pay for what was eaten in good faith?#!"

 kehillah_responsa_question_agunah:0 "A man went to the Frankish fairs four years ago and has not returned. Two traders say they saw him drown at a river crossing; neither saw the body, and they do not agree on the river. His wife is twenty-three. #italic May she be released to remarry on testimony that agrees on the death but not on the place?#!"

 kehillah_responsa_question_wine:0 "The community's wine was pressed under supervision, but the carter who brought it broke a seal to check for leaking and drew off a cup. He is not a Jew, and he says he did not drink it. #italic Is the whole cask forbidden, or only what he touched -- and does it matter whether we believe him?#!"

 kehillah_responsa_question_orphan:0 "An orphan boy was taken in by his uncle, who has fed him for six years and now wants the boy's inherited share of his father's house to cover what he has spent. The other heirs say a relative's charity cannot be billed for afterwards. #italic May he recover the cost of raising his brother's son?#!"

 kehillah_responsa_question_sabbath_lamp:0 "A lamp was left burning on the Sabbath in a house where a child lay sick, and a neighbour -- not a Jew, and not asked -- came in and moved it closer to the bed. The father says he did not ask and did not refuse. #italic Was the Sabbath broken, and by whom?#!"

 kehillah_responsa_question_convert:0 "A man converted eleven years ago, married here, and has kept everything asked of him. His wife's family now wants their daughter's marriage dissolved, saying his conversion was for her and not for Heaven. #italic Is a conversion undone by what was in a man's heart eleven years ago, and who may say what that was?#!"

 # -------------------------------------------------------------------
 # OPTIONS. The two rulings are Learning-tiered; the deferral is not --
 # see the event file's header for why a deferral is not a skill test.
 # -------------------------------------------------------------------

 kehillah_responsa.0001.a:0 "Rule leniently. There is ground to permit, and people to spare."
 kehillah_responsa.0001.b:0 "Rule strictly. The law is not ours to soften."
 kehillah_responsa.0001.c:0 "Send it on to a greater authority than I."

 kehillah_responsa.0001.a.great.tt:0 "Your teshuvah finds the permitting ground and shows its working, so that the next community to face this will not have to write to anyone. It is copied before it is even answered."
 kehillah_responsa.0001.a.good.tt:0 "You permit, carefully, and say plainly which authorities you are leaning on. It will hold."
 kehillah_responsa.0001.a.poor.tt:0 "You permit, and cannot fully say why. The leniency is remembered; the reasoning is not, and better scholars than you say so in writing."

 kehillah_responsa.0001.b.great.tt:0 "You uphold the stricter reading and make the cost of it plain, without pretending there is no cost. Severity argued this well is not remembered as severity."
 kehillah_responsa.0001.b.good.tt:0 "You hold to the letter, and cite enough that nobody can call it mere caution."
 kehillah_responsa.0001.b.poor.tt:0 "You forbid, because forbidding is safe, and everyone who reads it can tell that is why."

 kehillah_responsa.0001.c.tt:0 "You write back that the question deserves a greater head than yours, and name one. It is the honest answer, and it is not the one they hoped for."

 # -------------------------------------------------------------------
 # COMPILE THE RESPONSA
 # -------------------------------------------------------------------

 kehillah_compile_responsa_decision:0 "Gather the Responsa"
 kehillah_compile_responsa_decision_desc:0 "The rulings have gone out one at a time, to whoever asked. Copied, miscopied, and argued over in places you will never see.\n\nGathered into one volume, in order, with the reasoning intact, they stop being correspondence and become a book."
 kehillah_compile_responsa_decision_tooltip:0 "Compile the community's answered responsa into a single collection, through the same path a written work takes. The more rulings gathered, the greater the volume."
 kehillah_compile_responsa_decision_confirm:0 "Gather them"

 kehillah_compile_responsa_not_mid_book_tt:0 "You are not already in the middle of writing a book"
