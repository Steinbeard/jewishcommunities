l_english:
 # Jewish revolt, fallen realms and Jewish majorities (2026-11-15).
 # docs/spec/2026-11-15-fallen-realms-revolts-and-jewish-majorities.md

 kehillah_jewish_revolt_cb:0 "Jewish Rising"
 kehillah_jewish_revolt_cb_victory_desc:0 "The town is theirs. Its land passes to the community's leaders."
 kehillah_jewish_revolt_cb_white_peace_desc:0 "The rising lays down its arms, and nothing changes hands."
 kehillah_jewish_revolt_cb_defeat_desc:0 "The rising is broken, and the community will pay for it."
 KEHILLAH_REVOLT_WAR_NAME:0 "The Jewish Rising"
 kehillah_revolt_army_name:0 "Men of the Quarter"
 kehillah_revolt_prepared_army_name:0 "The Prepared Companies"

 kehillah_raise_the_banner_decision:0 "Raise the Banner"
 kehillah_raise_the_banner_decision_desc:0 "The town is ours in all but name. Its streets keep our Sabbath and its markets close on our feasts; only its lord is a stranger."
 kehillah_raise_the_banner_decision_tooltip:0 "Rise against the realm that hosts the community"
 kehillah_raise_the_banner_decision_confirm:0 "Raise the banner"
 kehillah_raise_the_banner_tt:0 "Choose what the rising fights for: the county, or its whole duchy"

 kehillah_prepare_the_rising_decision:0 "Prepare the Rising"
 kehillah_prepare_the_rising_decision_desc:0 "Swords bought one at a time, men who drill in the yeshiva's yard after dark. If the day comes, the Quarter will not go out with kitchen knives."
 kehillah_prepare_the_rising_decision_tooltip:0 "Gather arms and train men in secret"
 kehillah_prepare_the_rising_decision_confirm:0 "Begin"
 kehillah_prepare_the_rising_max_tt:0 "The community is as ready as it can be"
 kehillah_revolt_prepare_tt:0 "When the banner is raised, the community fields one more company of armoured or mounted men"

 kehillah_revolt_county_jewish_tt:0 "The community's county keeps the Jewish faith"
 kehillah_revolt_foreign_suzerain_tt:0 "The realm that hosts the community is not ruled by a Jew"
 kehillah_revolt_cooldown_tt:0 "The community has not risen within the last generation"

 kehillah_revolt_joins_mission_tt:0 "The rising becomes part of your messianic mission"
 kehillah_revolt_raise_men_tt:0 "The town turns out under arms: levies, light foot and archers, and the companies the community has prepared"
 kehillah_revolt_coalition_tt:0 "Every other community of the realm is called to join"
 kehillah_revolt_join_tt:0 "Join the rising; on victory, your own town is freed with it"
 kehillah_revolt_messianic_reckoning_tt:0 "The messianic mission meets its reckoning"
 kehillah_fallen_realm_exiles_tt:0 "You lead the Exiles of your lost seat until they find a place to settle"

 kehillah_revolt.0001.t:0 "Raise the Banner"
 kehillah_revolt.0001.desc:0 "In [kehillah_revolt_county.GetNameNoTierNoTooltip] the Jews are no longer a quarter of the town; they are the town. Yet it is [kehillah_revolt_suzerain.GetTitledFirstName] who takes its taxes and names its judges.\n\nThe elders are ready to hear what you mean to fight for."
 kehillah_revolt.0001.county:0 "For [kehillah_revolt_county.GetNameNoTooltip]"
 kehillah_revolt.0001.duchy:0 "For all of [kehillah_revolt_duchy.GetNameNoTooltip]"
 kehillah_revolt.0001.county_messianic:0 "For [kehillah_revolt_county.GetNameNoTooltip], and the Redemption"
 kehillah_revolt.0001.duchy_messianic:0 "For all of [kehillah_revolt_duchy.GetNameNoTooltip], and the Redemption"
 kehillah_revolt.0001.wait:0 "Not yet"

 kehillah_revolt.0010.t:0 "A Call to Arms"
 kehillah_revolt.0010.desc:0 "A rider from [kehillah_revolt_leader.GetTitledFirstName] brings word: the Jews of [kehillah_revolt_leader.MakeScope.Var('kehillah_revolt_target').Title.GetNameNoTooltip] have risen against [kehillah_revolt_suzerain.GetTitledFirstName]. Every community of the realm is asked to stand with them."
 kehillah_revolt.0010.desc_messianic:0 "\n\nThe rider says more, and quietly: that [kehillah_revolt_leader.GetFirstName] is the Anointed, and that this is the beginning of the Redemption."
 kehillah_revolt.0010.join:0 "We stand with them"
 kehillah_revolt.0010.join_messianic:0 "We stand with the Anointed"
 kehillah_revolt.0010.refuse:0 "This is not our fight"

 kehillah_revolt_news_rising_t:0 "A Jewish Rising"
 kehillah_revolt_news_rising_d:0 "[kehillah_revolt_news_leader.GetTitledFirstName] has raised the banner against [kehillah_revolt_news_suzerain.GetTitledFirstName] for [kehillah_revolt_news_prize.GetNameNoTooltip]."
 kehillah_revolt_news_victory_t:0 "The Rising Prevails"
 kehillah_revolt_news_victory_d:0 "[kehillah_revolt_news_leader.GetTitledFirstName] now rules [kehillah_revolt_news_prize.GetNameNoTooltip]."
 kehillah_revolt_news_defeat_t:0 "The Rising Is Crushed"
 kehillah_revolt_news_defeat_d:0 "The rising of [kehillah_revolt_news_leader.GetTitledFirstName] for [kehillah_revolt_news_prize.GetNameNoTooltip] has been put down."
 kehillah_revolt_news_plot_t:0 "Arms in the Jewish Quarter"
 kehillah_revolt_news_plot_d:0 "Your officers have found weapons hidden in the Quarter of [kehillah_revolt_leader.GetTitledFirstName]'s community."

 kehillah_majority_news_t:0 "A Jewish Town"
 kehillah_majority_news_d:0 "The Jews of [kehillah_majority_county.GetNameNoTierNoTooltip] now outnumber the rest of its people. The county keeps the faith and ways of [kehillah_news_leader.GetTitledFirstName]'s community."
 kehillah_majority_news_own_d:0 "Our people now outnumber the rest of [kehillah_majority_county.GetNameNoTierNoTooltip]. The county keeps our faith and our ways."

 kehillah_fallen_realm_news_t:0 "A Fallen House Gathers Its People"
 kehillah_fallen_realm_news_d:0 "[kehillah_news_leader.GetTitledFirstName], who lost a realm, now leads the Jews of [kehillah_founding_county.GetNameNoTierNoTooltip]."

 kehillah_fallen_realm.0001.t:0 "What Remains"
 kehillah_fallen_realm.0001.desc:0 "The land is gone. [kehillah_fallen_conqueror.GetTitledFirstName] holds what was ours, and the banners in the square are not our own.\n\nBut the Jews of the old realm remain where they always were, and they still look to our house. They would follow us still, as a community under [kehillah_fallen_conqueror.GetHerHis] rule."
 kehillah_fallen_realm.0001.lead:0 "Then I will lead them"
 kehillah_fallen_realm.0001.refuse:0 "I will not live by another's leave"
