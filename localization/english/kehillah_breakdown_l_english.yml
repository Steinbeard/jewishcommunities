 #####################################################################
 # Kehillah pillar breakdown (v12 section 8).
 #
 # kehillah_bd_* line keys are returned by the KehillahBd* customizable
 # loc functions (character scope, so ROOT.Char is the leader); each
 # carries its own leading newline so an absent line leaves no gap.
 # KEHILLAH_BD_*_TOOLTIP are the assembled tooltips, rendered in the
 # map view with a Title datacontext.
 #
 # kehillah_bd_none is deliberately the empty string: it is what every
 # KehillahBd* function returns when its line does not apply.
 #####################################################################

