 KEHILLAH_BD_STABILITY_TOOLTIP:0 "#T Stability: [Title.Custom('KehillahStabilityScore')] ([Title.Custom('KehillahStabilityBandName')])#!\n[Title.GetHolder.Custom('KehillahBdStabilityDrift')]\n\n#EMP Baseline: [Title.GetHolder.MakeScope.ScriptValue('kehillah_stability_baseline_value')|0]#![Title.GetHolder.Custom('KehillahBdStabilityFloor')][Title.GetHolder.Custom('KehillahBdHekdesh')][Title.GetHolder.Custom('KehillahBdShtadlan')][Title.GetHolder.Custom('KehillahBdGabbaiTzedakah')][Title.GetHolder.Custom('KehillahBdCharterQuarterProtection')]\n\n#EMP This season#![Title.GetHolder.Custom('KehillahBdSettledDispute')][Title.GetHolder.Custom('KehillahBdTzedakah')][Title.GetHolder.Custom('KehillahBdShaken')][Title.GetHolder.Custom('KehillahBdEmboldened')][Title.GetHolder.Custom('KehillahBdOvercrowded')]\n\n#weak Each season the value moves a twentieth of the way toward its baseline. Events -- disputes, loans, epidemics, the Bet Din -- move it directly as they happen.#!"
