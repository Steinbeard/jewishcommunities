BdNextBandStability')]\n\n#T Danger of violence: [Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_value')|0]#!\n  Prominence (Greatness): +[Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_greatness_value')|0]\n  Wealth (Prosperity): +[Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_wealth_value')|0]\n  Recent incidents in the faith: +[Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_incidents_value')|0]\n  Hard times (plague, war, crusade): +[Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_hard_times_value')|0]\n  The host's teaching: +[Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_teaching_value')|0]\n  The badge: +[Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_badge_value')|0]\n  The host's outlook: [Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_lord_value')|0]\n  The quiet after the decrees: [Title.GetHolder.MakeScope.ScriptValue('kehillah_danger_lull_value')|0]\n#weak Each quarter, a [Title.GetHolder.MakeScope.ScriptValue('kehillah_incident_chance_value')|0]% chance of an incident: an accusation, a disputation, friars in the synagogue, a trial of the Talmud, the badge, Holy Week, a riot over the bonds, or a mob.#![Title.Custom('KehillahBdLowerBandStability')]\n\n#weak Stability moves toward its baseline each season, falling faster than it recovers. Disputes, loans, epidemics and the Bet Din can move it at once.#!"
