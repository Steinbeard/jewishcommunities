l_english:
 kehillah_bet_din.0271.t:0 "The Loan Written in Two Languages"
 kehillah_bet_din.0271.desc:0 "[kbd_litigant_a.GetFirstName] seeks repayment under the Hebrew copy of a loan agreement. [kbd_litigant_b.GetFirstName] produces a Judaeo-Arabic copy with a later due date. Both bear marks of the same witnesses, but the translator is away. The lender needs money; the borrower says early collection would break the bargain."
 kehillah_bet_din.0271.a:0 "Collect under the Hebrew copy now."
 kehillah_bet_din.0271.a.tt:0 "The lender receives cash quickly. A translation error could make the collection premature."
 kehillah_bet_din.0271.b:0 "Secure the debt and ask the translator and witnesses."
 kehillah_bet_din.0271.b.tt:0 "The lender has security while the court compares both texts at some expense."
 kehillah_bet_din.0271.c:0 "Accept the later date and release the security."
 kehillah_bet_din.0271.c.tt:0 "The borrower gets time, but matching early terms could leave a valid debt unprotected."
 kehillah_din_source_27:0 "Cite a mastered Nezikin work and compare both instruments."
 kehillah_din_source_27_tt:0 "Mishnah Bava Metzia 1:6 raises questions about documents and proof. It does not choose between these two inconsistent copies."
 kehillah_din_combo_27:0 "Have a scholar and steward trace the witnesses and translation."
 kehillah_din_combo_27_tt:0 "The judges preserve the debt while checking language, seals and dates."
 kehillah_bet_din.0274.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0274.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0274.outcome_1:0 "The court orders immediate payment under the Hebrew wording."
 kehillah_bet_din.0274.outcome_2:0 "The court holds security and summons the translator and witnesses before fixing the date."
 kehillah_bet_din.0274.outcome_3:0 "The court adopts the later date and releases the pledged security."
 kehillah_bet_din.0274.fact_true:0 "The translator omitted a postponement clause from the Hebrew copy. Early collection was not agreed."
 kehillah_bet_din.0274.fact_false:0 "The two originals agree on the earlier date; the later wording was added to one copy. Releasing security exposed the lender."
 kehillah_bet_din.0274.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0274.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0274.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case27_one_tt:0 "Immediate collection uses the court's larger reserve."
 kehillah_din_case27_two_tt:0 "Security and testimony cost some Prosperity."
 kehillah_din_case27_three_tt:0 "The later date costs less now but may weaken a valid claim."
 kehillah_bet_din_case27_great_log_title:0 "The Loan Written in Two Languages: a well-supported ruling"
 kehillah_bet_din_case27_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s disputed loan date."
 kehillah_bet_din_case27_good_log_title:0 "The Loan Written in Two Languages: a workable ruling"
 kehillah_bet_din_case27_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s disputed loan date."
 kehillah_bet_din_case27_poor_log_title:0 "The Loan Written in Two Languages: a disputed ruling"
 kehillah_bet_din_case27_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s disputed loan date."
