l_english:
 kehillah_bet_din.0531.t:0 "The Majority and the School"
 kehillah_bet_din.0531.desc:0 "[kbd_litigant_a.GetFirstName] speaks for wealthy families who voted to close a communal school and hire tutors at home. [kbd_litigant_b.GetFirstName] speaks for parents who cannot pay a tutor. The vote was orderly; the pupils' attendance record has not been shown. The court must decide whether a majority may close the only classroom many children can reach."
 kehillah_bet_din.0531.a:0 "Close the school and release its funds."
 kehillah_bet_din.0531.a.tt:0 "Private tutors gain room, but strong attendance would leave poorer pupils without lessons."
 kehillah_bet_din.0531.b:0 "Keep classes for a term and review attendance and costs."
 kehillah_bet_din.0531.b.tt:0 "A term of teaching costs money while the court checks actual use."
 kehillah_bet_din.0531.c:0 "Make the school permanent under its old budget."
 kehillah_bet_din.0531.c.tt:0 "Pupils keep a school, but an empty classroom could consume funds better spent elsewhere."
 kehillah_din_source_53:0 "Cite a mastered Moed work and inspect the school endowment."
 kehillah_din_source_53_tt:0 "Mishnah Megillah 3:1 discusses communal property. It does not count pupils or define this school's founding terms."
 kehillah_din_combo_53:0 "Have a scholar and steward keep lessons running while reviewing costs."
 kehillah_din_combo_53_tt:0 "The judges compare the vote with the children's access to teaching."
 kehillah_bet_din.0534.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0534.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0534.outcome_1:0 "The court closes the school at the end of the week."
 kehillah_bet_din.0534.outcome_2:0 "The court funds a further term and asks for the pupil roll and school accounts."
 kehillah_bet_din.0534.outcome_3:0 "The court orders the school kept open under its old endowment."
 kehillah_bet_din.0534.fact_true:0 "The roll shows a full classroom of children without another teacher. Closure abandoned them."
 kehillah_bet_din.0534.fact_false:0 "Attendance has dwindled and another public classroom has opened nearby. A permanent order wasted resources."
 kehillah_bet_din.0534.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0534.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0534.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case53_one_tt:0 "Closure spends substantial Greatness."
 kehillah_din_case53_two_tt:0 "A further term and review cost some Greatness."
 kehillah_din_case53_three_tt:0 "Permanent funding costs less now but may bind an empty school."
 kehillah_bet_din_case53_great_log_title:0 "The Majority and the School: a well-supported ruling"
 kehillah_bet_din_case53_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s school petition."
 kehillah_bet_din_case53_good_log_title:0 "The Majority and the School: a workable ruling"
 kehillah_bet_din_case53_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s school petition."
 kehillah_bet_din_case53_poor_log_title:0 "The Majority and the School: a disputed ruling"
 kehillah_bet_din_case53_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s school petition."
