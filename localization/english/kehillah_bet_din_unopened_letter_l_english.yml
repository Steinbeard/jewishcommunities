l_english:
 kehillah_bet_din.0921.t:0 "The Unopened Letter"
 kehillah_bet_din.0921.desc:0 "[kbd_litigant_a.GetFirstName] carries a sealed letter about a dead merchant's accounts but refuses to open it in court. [kbd_litigant_b.GetFirstName] says the letter may settle an estate debt. The bearer gives a confident summary; the seal belongs to another person. The court needs evidence without making secrecy itself a verdict."
 kehillah_bet_din.0921.a:0 "Accept the bearer's summary as proof."
 kehillah_bet_din.0921.a.tt:0 "The contents may differ from the summary offered aloud."
 kehillah_bet_din.0921.b:0 "Preserve the claim and seek lawful disclosure."
 kehillah_bet_din.0921.b.tt:0 "The court pays to protect the letter and consult those entitled to open it."
 kehillah_bet_din.0921.c:0 "Discard the letter and end the dispute."
 kehillah_bet_din.0921.c.tt:0 "An authentic letter could be lost before its proper reader appears."
 kehillah_din_source_92:0 "Cite a mastered Nezikin work and examine the evidence."
 kehillah_din_source_92_tt:0 "Mishnah Sanhedrin 4:1 gives the judges a textual point of reference. It cannot establish the sealed letter's contents."
 kehillah_din_combo_92:0 "Have a scholar and steward inspect the disputed evidence together."
 kehillah_din_combo_92_tt:0 "The judges preserve both parties' interests while checking the sealed letter's contents."
 kehillah_bet_din.0924.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0924.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0924.outcome_1:0 "The court rules from the bearer's summary."
 kehillah_bet_din.0924.outcome_2:0 "The court secures the letter and seeks an authorized opening."
 kehillah_bet_din.0924.outcome_3:0 "The court ignores the letter and closes the claim."
 kehillah_bet_din.0924.fact_true:0 "The opened letter contradicts the bearer. His summary would have misled the court."
 kehillah_bet_din.0924.fact_false:0 "The letter is authentic and decisive for the estate. Discarding it would have erased proof."
 kehillah_bet_din.0924.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0924.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0924.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case92_one_tt:0 "The immediate ruling costs 8 Stability and carries the larger fact risk."
 kehillah_din_case92_two_tt:0 "Inquiry costs 4 Stability while the court keeps the issue open."
 kehillah_din_case92_three_tt:0 "The quick final settlement costs 2 Stability but may be overbroad."
 kehillah_bet_din_case92_great_log_title:0 "The Unopened Letter: a well-supported ruling"
 kehillah_bet_din_case92_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s the unopened letter dispute."
