l_english:
 kehillah_bet_din.0521.t:0 "The Communal Ledger Destroyed"
 kehillah_bet_din.0521.desc:0 "[kbd_litigant_a.GetFirstName] speaks for a treasurer whose payment book burned in a fire. [kbd_litigant_b.GetFirstName] speaks for households asked to pay a second time. Officers need money to repair the quarter. Some families kept receipts; others kept none. The court must rebuild an account without making the fire a tax on honesty."
 kehillah_bet_din.0521.a:0 "Levy every household again now."
 kehillah_bet_din.0521.a.tt:0 "Repairs begin, but families who can prove payment would be charged twice."
 kehillah_bet_din.0521.b:0 "Fund repairs and reconstruct payments from receipts and witnesses."
 kehillah_bet_din.0521.b.tt:0 "The court spends to restore records while urgent repairs proceed."
 kehillah_bet_din.0521.c:0 "Cancel every unpaid balance for this year."
 kehillah_bet_din.0521.c.tt:0 "No family pays twice, but real unpaid balances may be abandoned."
 kehillah_din_source_52:0 "Cite a mastered Nezikin work and reconstruct testimony."
 kehillah_din_source_52_tt:0 "Mishnah Sanhedrin 3:6 concerns court evidence. It cannot recreate entries lost in this fire without witnesses."
 kehillah_din_combo_52:0 "Have a scholar and steward rebuild the roll from surviving proof."
 kehillah_din_combo_52_tt:0 "The judges fund repairs while separating paid and unpaid households."
 kehillah_bet_din.0524.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0524.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0524.outcome_1:0 "The court orders a second assessment of every household."
 kehillah_bet_din.0524.outcome_2:0 "The court advances repair funds and gathers surviving receipts and witnesses."
 kehillah_bet_din.0524.outcome_3:0 "The court cancels the year's remaining levy."
 kehillah_bet_din.0524.fact_true:0 "Several families show receipts from before the fire. A blanket re-levy charged them twice."
 kehillah_bet_din.0524.fact_false:0 "Many assessments were still unpaid when the book burned. Cancelling all balances left a real gap."
 kehillah_bet_din.0524.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0524.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0524.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case52_one_tt:0 "A blanket levy costs substantial Prosperity."
 kehillah_din_case52_two_tt:0 "Reconstruction and an advance cost some Prosperity."
 kehillah_din_case52_three_tt:0 "Cancellation costs less now but may leave repairs unfunded."
 kehillah_bet_din_case52_great_log_title:0 "The Communal Ledger Destroyed: a well-supported ruling"
 kehillah_bet_din_case52_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s burned tax ledger."
