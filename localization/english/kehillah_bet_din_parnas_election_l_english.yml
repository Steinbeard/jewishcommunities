l_english:
 kehillah_bet_din.0291.t:0 "The Election of the New Parnas"
 kehillah_bet_din.0291.desc:0 "[kbd_litigant_a.GetFirstName] speaks for wealthy householders who installed a new communal officer. [kbd_litigant_b.GetFirstName] says other contributors were promised a vote and never summoned. The new parnas has already begun collecting dues. The court must keep the office working while deciding whether the choice bound the whole community."
 kehillah_bet_din.0291.a:0 "Confirm the appointment and fund the new office."
 kehillah_bet_din.0291.a.tt:0 "Administration continues, but excluded voters could lose their promised say."
 kehillah_bet_din.0291.b:0 "Keep a temporary officer and verify the meeting roll."
 kehillah_bet_din.0291.b.tt:0 "The office works during a costly review of notices and votes."
 kehillah_bet_din.0291.c:0 "Void the appointment and call a new election immediately."
 kehillah_bet_din.0291.c.tt:0 "A fresh vote restores trust if exclusion occurred; otherwise it discards a settled choice."
 kehillah_din_source_29:0 "Cite a mastered Nezikin work and check the appointment procedure."
 kehillah_din_source_29_tt:0 "Mishnah Sanhedrin 3:1 concerns selecting decision-makers. It is an analogy, not a charter for this community's parnas election."
 kehillah_din_combo_29:0 "Have a scholar and steward count notices and dues together."
 kehillah_din_combo_29_tt:0 "The court keeps collections running while checking the meeting's authority."
 kehillah_bet_din.0294.t:0 "The Court Records Its Ruling"
 kehillah_bet_din.0294.desc:0 "The parties return to hear the court's ruling."
 kehillah_bet_din.0294.outcome_1:0 "The court confirms the parnas and releases office funds."
 kehillah_bet_din.0294.outcome_2:0 "The court appoints a temporary collector while checking notices and the meeting roll."
 kehillah_bet_din.0294.outcome_3:0 "The court voids the appointment and calls every contributing household to vote."
 kehillah_bet_din.0294.fact_true:0 "The notice list omitted households entitled to vote. Confirmation would have entrenched their exclusion."
 kehillah_bet_din.0294.fact_false:0 "The roll shows every eligible household was summoned. A new election would repeat a valid decision."
 kehillah_bet_din.0294.quality_great:0 "$kehillah_bet_din.0083.quality_great$"
 kehillah_bet_din.0294.quality_good:0 "$kehillah_bet_din.0083.quality_good$"
 kehillah_bet_din.0294.quality_poor:0 "$kehillah_bet_din.0083.quality_poor$"
 kehillah_din_case29_one_tt:0 "Confirming the office spends substantial Stability."
 kehillah_din_case29_two_tt:0 "Temporary administration costs some Stability."
 kehillah_din_case29_three_tt:0 "A new election costs less now but may reopen old factions."
 kehillah_bet_din_case29_great_log_title:0 "The Election of the New Parnas: a well-supported ruling"
 kehillah_bet_din_case29_great_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s parnas election challenge."
 kehillah_bet_din_case29_good_log_title:0 "The Election of the New Parnas: a workable ruling"
 kehillah_bet_din_case29_good_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s parnas election challenge."
 kehillah_bet_din_case29_poor_log_title:0 "The Election of the New Parnas: a disputed ruling"
 kehillah_bet_din_case29_poor_log:0 "[CHARACTER.GetTitledFirstName] ruled on [TARGET_CHARACTER.GetFirstName]'s parnas election challenge."
