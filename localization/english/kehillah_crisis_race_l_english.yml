l_english:
 # Step 1b: the agitator's following, and the warning events' catalysts.

 # Step 1b: the new warning events.
 kehillah_crisis.0020.t:0 "A Sermon in the Market"
 kehillah_crisis.0020.desc:0 "[kehillah_crisis_agitator_scope.GetFirstName] speaks from the steps by the cloth hall. His charges against the quarter draw a crowd large enough to close the market lane. Those at the back repeat what they cannot quite hear.\n\nA trader who once greeted you crosses to the other side of the street. Your companions ask whether the town's officers will intervene, or whether the speaker must be answered in public."
 kehillah_crisis.0020.a:0 "Let him talk himself hoarse."
 kehillah_crisis.0020.b:0 "Pay the market wardens to move him on."
 kehillah_crisis.0020.c:0 "Ask the lord's bailiff to keep the peace."
 kehillah_crisis.0020.c.success:0 "The bailiff sends him on his way"
 kehillah_crisis.0020.c.success_desc:0 "The bailiff sends him on his way."
 kehillah_crisis.0020.c.failure:0 "The bailiff shrugs"
 kehillah_crisis.0020.c.failure_desc:0 "The bailiff shrugs."
 kehillah_crisis.0021.t:0 "A Child Is Missing"
 kehillah_crisis.0021.desc:0 "A tanner's son has not returned from an errand. A porter thinks he saw the boy near the quarter at dusk, and that uncertain recollection has become a charge in the mouths of the men outside.\n\nThe father asks for help finding his child. Behind him, others demand entry to Jewish homes before anyone has established where the boy was last seen."
 kehillah_crisis.0021.desc_vizier:0 "A tanner comes to the palace looking for his son. The boy went out on an errand yesterday and never came home. A porter says he saw him near the Jewish quarter at dusk.\n\nThe tanner only wants help finding his son. Behind him, a man demands to know why the palace guards have yet to search Jewish homes. You recognize his voice. You heard him reciting the verses outside the gate."
 kehillah_crisis.0021.a:0 "We will join the search. Start with the porter."
 kehillah_crisis.0021.a.success:0 "The searchers find the boy safe"
 kehillah_crisis.0021.a.success_desc:0 "The searchers find the boy safe."
 kehillah_crisis.0021.a.failure:0 "The search turns up nothing, and the rumor spreads"
 kehillah_crisis.0021.a.failure_desc:0 "The search turns up nothing, and the rumor spreads."
 kehillah_crisis.0021.b:0 "Pay for a search led by the watch."
 kehillah_crisis.0021.c:0 "Tell our people to stay indoors."
 kehillah_crisis.0022.t:0 "A Brawl at the Well"
 kehillah_crisis.0022.desc:0 "A young man from the quarter and an apprentice quarreled over their place at the well. The apprentice threw an insult; our young man struck him, breaking his nose. By the time they were pulled apart, a crowd had gathered.\n\nThe apprentice's master demands judgment from the lord's court. Our elders insist that the bet din can hear the matter fairly. Neither course will make the witnesses forget what they saw, and the apprentice still needs care."
 kehillah_crisis.0022.a:0 "Let the lord's court hear the witnesses."
 kehillah_crisis.0022.a.flavor:0 "The court may quiet the crowd if [kehillah_crisis_brawl_lord.GetTitledFirstName] hears our account, but surrendering the case will weigh on me."
 kehillah_crisis.0022.a.success:0 "The lord's court hears our witnesses"
 kehillah_crisis.0022.a.success_desc:0 "The lord's court hears our witnesses."
 kehillah_crisis.0022.a.failure:0 "The court dismisses our account"
 kehillah_crisis.0022.a.failure_desc:0 "The court dismisses our account."
 kehillah_crisis.0022.b:0 "Hear both men before the bet din."
 kehillah_crisis.0022.c:0 "Offer to pay for the apprentice's care."
 kehillah_crisis.0023.t:0 "A Follower Joins"
 kehillah_crisis.0023.desc_named:0 "[kehillah_crisis_follower.GetTitledFirstName] has begun standing beside [kehillah_crisis_agitator_scope.GetFirstName] when the crowd gathers. Townspeople who dismissed the agitation now pause to listen.\n\nA messenger says the two have been speaking privately as well. The new ally may bring others with him unless he can be persuaded to withdraw."
 kehillah_crisis.0023.desc:0 "A master of the weavers' guild has begun standing beside [kehillah_crisis_agitator_scope.GetFirstName] when the crowd gathers. Townspeople who dismissed the agitation now pause to listen.\n\nHis apprentices have started repeating the charges at work. Perhaps he can still be persuaded to withdraw."
 kehillah_crisis.0023.a:0 "Win him back before he commits: a gift, and a word."
 kehillah_crisis.0023.a.success:0 "He keeps his distance from the sermons"
 kehillah_crisis.0023.a.success_desc:0 "He keeps his distance from the sermons."
 kehillah_crisis.0023.a.success.tt:0 "The agitator loses this follower."
 kehillah_crisis.0023.a.failure:0 "He keeps the gift, and his place in the crowd"
 kehillah_crisis.0023.a.failure_desc:0 "He keeps the gift, and his place in the crowd."
 kehillah_crisis.0023.b:0 "We cannot stop every man who listens to him."
 kehillah_crisis.0023.b.tt:0 "His following grows, and it adds to the Armed host each month."
 kehillah_crisis.0024.t:0 "A Convert Speaks"
 kehillah_crisis.0024.desc:0 "A man who once lived among us now stands beside [kehillah_crisis_agitator_scope.GetFirstName]. He speaks as though he knows the life of every household behind the quarter's doors. The crowd listens more closely to him than to any stranger.\n\nSome of his claims are easily answered. Others cannot be disproved to people who have already chosen to believe them."
 kehillah_crisis.0024.a:0 "Answer him in the square: our learning against his charges."
 kehillah_crisis.0024.a.success:0 "His charges fall apart"
 kehillah_crisis.0024.a.success_desc:0 "His charges fall apart."
 kehillah_crisis.0024.a.failure:0 "The crowd hears only him"
 kehillah_crisis.0024.a.failure_desc:0 "The crowd hears only him."
 kehillah_crisis.0024.b:0 "Pay him to take his charges to another town."
 kehillah_crisis.0024.c:0 "Let him talk. No one who knows us will believe him."

 kehillah_crisis.0040.t:0 "A Hall for the Speaker"
 kehillah_crisis.0040.desc:0 "A household with friends at court has opened its hall to [kehillah_crisis_agitator_scope.GetFirstName]. The men who once listened in the street can now gather out of the rain, speak at length, and bring others without attracting the watch.\n\nThe owner has not endorsed their words, a neighbor insists. Yet the invitation lends them standing. If the hall remains open, tomorrow's audience may be larger."
 kehillah_crisis.0040.a:0 "Ask the host to withdraw the invitation."
 kehillah_crisis.0040.a.success:0 "The hall closes to the speaker"
 kehillah_crisis.0040.a.success_desc:0 "The hall closes to the speaker."
 kehillah_crisis.0040.a.failure:0 "The host refuses, and others take notice"
 kehillah_crisis.0040.a.failure_desc:0 "The host refuses, and others take notice."
 kehillah_crisis.0040.b:0 "Ask our trading partners to speak against the gathering."
 kehillah_crisis.0040.c:0 "Let them meet. A hall does not make their charges true."
 kehillah_crisis.0041.t:0 "Carts before Dawn"
 kehillah_crisis.0041.desc:0 "A shout travels through the quarter before first light: armed men are coming. Families pack what they can carry; one cart is already turning into the lane.\n\nNo one has seen a host. A frightened courier heard a crowd on the road and brought the warning himself. The rumor has already spread through the town. What you do now may limit the panic or give it another life."
 kehillah_crisis.0041.a:0 "Send the watch to verify the road, then tell every household."
 kehillah_crisis.0041.a.flavor:0 "A trained watch is more likely to return with an answer the families will believe."
 kehillah_crisis.0041.a.success:0 "The watch returns with a clear account"
 kehillah_crisis.0041.a.success_desc:0 "The watch returns with a clear account."
 kehillah_crisis.0041.a.failure:0 "Conflicting reports feed the rumor"
 kehillah_crisis.0041.a.failure_desc:0 "Conflicting reports feed the rumor."
 kehillah_crisis.0041.b:0 "Go from door to door and steady the families."
 kehillah_crisis.0041.b.flavor:0 "Your Diplomacy matters here; a compassionate leader can better hear what frightens each household."
 kehillah_crisis.0041.b.success:0 "The families listen and put down their bundles"
 kehillah_crisis.0041.b.success_desc:0 "The families listen and put down their bundles."
 kehillah_crisis.0041.b.failure:0 "Some families leave despite your assurances"
 kehillah_crisis.0041.b.failure_desc:0 "Some families leave despite your assurances."
 kehillah_crisis.0041.c:0 "Keep everyone indoors until the road is quiet."
 kehillah_crisis.0041.c.flavor:0 "No further risk tonight, but families lose confidence in the quarter's ability to respond."
 kehillah_crisis_offcamera_tavern_song.t:0 "Crisis: A Song in the Tavern"
 kehillah_crisis_offcamera_tavern_song.desc:0 "A verse against the quarter has become a drinking song. By morning, men who never heard the speaker are repeating it."
 kehillah_crisis_offcamera_market_whispers.t:0 "Crisis: Market Whispers"
 kehillah_crisis_offcamera_market_whispers.desc:0 "A rumor about Jewish merchants passes from stall to stall. No one claims to have seen what it alleges, but customers have begun to repeat it."
 kehillah_crisis_offcamera_pressure:0 "Small push toward #high $kehillah_crisis_armed$#!."
 kehillah_crisis.0042.t:0 "A Shutter Broken"
 kehillah_crisis.0042.desc:0 "Someone has smashed the shutter of a merchant's shop at the edge of the quarter. Nothing was taken. A neighbor saw three men run when a lamp appeared in the street.\n\nThe merchant asks whether the watch can guard his goods tonight. He fears the broken wood is a test: if no one answers it, the next blow may come while his family is inside."
 kehillah_crisis.0042.a:0 "Guard the shop and help its owner make the shutters secure."
 kehillah_crisis.0042.b:0 "Bring the neighbor's account to the town's officers."
 kehillah_crisis.0042.b.success:0 "The officers agree to investigate"
 kehillah_crisis.0042.b.success_desc:0 "The officers agree to investigate."
 kehillah_crisis.0042.b.failure:0 "The officers dismiss the complaint"
 kehillah_crisis.0042.b.failure_desc:0 "The officers dismiss the complaint."
 kehillah_crisis.0042.c:0 "Tell the merchant to close and take his family elsewhere."
 kehillah_crisis.0043.t:0 "Men at the Crossing"
 kehillah_crisis.0043.desc:0 "Men have begun gathering at the crossing outside the quarter. They carry no banners and make no open threat, but they stop travelers to ask what the Jews have done to earn the ruler's favor.\n\nTheir numbers change through the day. A few townspeople who came only to listen now stand with them. There is still time to break up the gathering before it becomes a march."
 kehillah_crisis.0043.a:0 "Remind the officers of the ruler's prohibition."
 kehillah_crisis.0043.b:0 "Ask the town's officers to clear the crossing."
 kehillah_crisis.0043.b.success:0 "The officers send the men home"
 kehillah_crisis.0043.b.success_desc:0 "The officers send the men home."
 kehillah_crisis.0043.b.failure:0 "The officers leave the gathering in place"
 kehillah_crisis.0043.b.failure_desc:0 "The officers leave the gathering in place."
 kehillah_crisis.0043.c:0 "Ask their families and employers to call them home."
 kehillah_crisis.0044.t:0 "The Officer Looks Away"
 kehillah_crisis.0044.desc:0 "A town officer has watched the speakers gather twice this week. Asked whether he will disperse them, he says no law forbids men from talking in the street.\n\nA woman who lives near the crossing tells you what he did not see: one of the men followed her home, reciting the charges under his breath. She will testify, if someone with authority is prepared to listen."
 kehillah_crisis.0044.a:0 "Take her testimony over the officer's head."
 kehillah_crisis.0044.a.success:0 "A superior orders the officer to keep the peace"
 kehillah_crisis.0044.a.success_desc:0 "A superior orders the officer to keep the peace."
 kehillah_crisis.0044.a.failure:0 "The officer's answer stands"
 kehillah_crisis.0044.a.failure_desc:0 "The officer's answer stands."
 kehillah_crisis.0044.b:0 "Gather other witnesses before making another complaint."
 kehillah_crisis.0044.c:0 "Leave the officer to his excuses."

 # Step 1c: actions.
 kehillah_crisis_once_per_crisis_tt:0 "You have not already taken this action during this crisis"
 kehillah_crisis_task_slot_free_tt:0 "No other crisis task is in progress"
 kehillah_crisis_leader_present_tt:0 "You are present in the community"
 kehillah_crisis_family_not_sent_tt:0 "You have not already sent your family to Lucena"
 kehillah_crisis_contribution_room_tt:0 "The limit on contributions for this crisis has not been reached"
 kehillah_crisis_other_community_tt:0 "Another community is able to answer the request"
 kehillah_crisis_ruler_to_petition_tt:0 "There is a ruler to petition"
 kehillah_crisis_captives_held_tt:0 "Your people are still being held captive"
 kehillah_crisis_anusim_not_asked_tt:0 "You have not already made this appeal within the past year"

 kehillah_crisis_protection_decision:0 "Seek Protection"
 kehillah_crisis_protection_decision_desc:0 "Ask the lord, his overlord or the Church to protect the quarter."
 kehillah_crisis_protection_decision_tooltip:0 "Ask the lord, his overlord or the Church for protection."
 kehillah_crisis_protection_decision_confirm:0 "Seek protection"
 kehillah_crisis_protection_decision_effect_tt:0 "Choose whom to ask. Protection won adds to Spared each month, and once more when it is first won."
 kehillah_crisis_camp_decision:0 "Go to the Agitator's Camp"
 kehillah_crisis_camp_decision_desc:0 "Go out to the agitator, and see whether he can be reasoned with or bought."
 kehillah_crisis_camp_decision_tooltip:0 "Go out to the agitator's camp."
 kehillah_crisis_camp_decision_confirm:0 "Go"
 kehillah_crisis_camp_decision_effect_tt:0 "You leave the quarter for a few days. If he can be turned away, the danger passes."
 kehillah_crisis_answer_decision:0 "Answer Him in Public"
 kehillah_crisis_answer_decision_desc:0 "The agitator's charges will be answered before the town, by our most learned voice."
 kehillah_crisis_answer_decision_tooltip:0 "Answer the agitator in public."
 kehillah_crisis_answer_decision_confirm:0 "Answer him"
 kehillah_crisis_town_decision:0 "Win the Town"
 kehillah_crisis_town_decision_desc:0 "Gifts to the town council and the guild masters, who want no trouble in their streets."
 kehillah_crisis_town_decision_tooltip:0 "Send gifts to the council and the guilds."
 kehillah_crisis_town_decision_confirm:0 "Send the gifts"
 kehillah_crisis_discredit_decision:0 "Discredit Him"
 kehillah_crisis_discredit_decision_desc:0 "Every preacher has a past. Find his, and make it known."
 kehillah_crisis_discredit_decision_tooltip:0 "Look into the agitator's past."
 kehillah_crisis_discredit_decision_confirm:0 "Start asking"
 kehillah_crisis_appeal_decision:0 "Appeal to the Emperor or the Head of the Faith"
 kehillah_crisis_appeal_decision_desc:0 "A letter asking for a condemnation of violence against the Jews. It will be months before an answer comes."
 kehillah_crisis_appeal_decision_tooltip:0 "Send an appeal for a condemnation."
 kehillah_crisis_appeal_decision_confirm:0 "Send the letter"
 kehillah_crisis_appeal_decision_effect_tt:0 "In about two and a half months, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_appeal_points')|0]#! toward Spared, and the condemnation protects the quarter each month. This is the community's one task until then."
 kehillah_crisis_fast_decision:0 "Proclaim a Fast"
 kehillah_crisis_fast_decision_desc:0 "The community will fast and pray in the synagogue."
 kehillah_crisis_fast_decision_tooltip:0 "Proclaim a public fast."
 kehillah_crisis_fast_decision_confirm:0 "Proclaim it"
 kehillah_crisis_neighbours_decision:0 "Ask the Neighbours to Speak"
 kehillah_crisis_neighbours_decision_desc:0 "The townspeople who offered to speak for us could say it before the council."
 kehillah_crisis_neighbours_decision_tooltip:0 "Ask our neighbours to speak before the council."
 kehillah_crisis_neighbours_decision_confirm:0 "Ask them"

 kehillah_crisis_race.0100.t:0 "Answered in Public"
 kehillah_crisis_race.0100.desc:0 "The square is full. [kehillah_crisis_agitator_scope.GetFirstName] has repeated his charges for weeks, and today someone will answer them where the town can hear. The crowd came for a show, and will decide who won it."
 kehillah_crisis_race.0100.a:0 "The Dayyan answers him: a more learned voice than mine."
 kehillah_crisis_race.0100.b:0 "I will answer him myself."
 kehillah_crisis_race.0100.success:0 "The crowd laughs at him, not at us"
 kehillah_crisis_race.0100.success_desc:0 "The crowd laughs at him, not at us."
 kehillah_crisis_race.0100.failure:0 "The crowd hears only him"
 kehillah_crisis_race.0100.failure_desc:0 "The crowd hears only him."
 kehillah_crisis_race.0110.t:0 "Every Preacher Has a Past"
 kehillah_crisis_race.0110.desc:0 "[kehillah_crisis_agitator_scope.GetFirstName] came to this town from somewhere else, and men do not usually leave home for no reason. A debt, a woman, a teacher who sent him away: whatever it is, someone knows it."
 kehillah_crisis_race.0110.a:0 "The Shtadlan knows whom to ask."
 kehillah_crisis_race.0110.b:0 "I will ask the questions myself."
 kehillah_crisis_race.0110.c:0 "Think better of it."
 kehillah_crisis_race.0110.success:0 "His past catches up with him"
 kehillah_crisis_race.0110.success_desc:0 "His past catches up with him."
 kehillah_crisis_race.0110.failure:0 "We are caught asking"
 kehillah_crisis_race.0110.failure_desc:0 "We are caught asking."
 kehillah_crisis_race.0110.success_notice:0 "Word of what you uncovered has reached his listeners. Some are beginning to doubt him."
 kehillah_crisis_race.0110.failure_notice:0 "He heard about your inquiries and is telling his listeners the quarter tried to silence him."

 # Step 1d: the Armed race.
 kehillah_community_crisis_kehillah_crisis_held_situation_phase:0 "Quarter held"
 kehillah_community_crisis_kehillah_crisis_struck_situation_phase:0 "Quarter struck"
 kehillah_crisis_held:0 "Quarter held"
 kehillah_crisis_held_desc:0 "The host has gone, and the quarter stands. We wait for the sovereign's answer."
 kehillah_crisis_struck:0 "Quarter struck"
 kehillah_crisis_struck_desc:0 "The host has broken into the quarter. What follows will be counted for years."

 kehillah_crisis_silver_decision:0 "Send Silver to the Host"
 kehillah_crisis_silver_decision_desc:0 "Silver sent ahead to the host's leaders, so that the march slows and the anger cools."
 kehillah_crisis_silver_decision_tooltip:0 "Send silver to the host's leaders."
 kehillah_crisis_silver_decision_confirm:0 "Send it"
 kehillah_crisis_shelter_decision:0 "Shelter in the Stone Houses"
 kehillah_crisis_shelter_decision_desc:0 "The families leave their homes and crowd into the stone houses at the heart of the quarter."
 kehillah_crisis_shelter_decision_tooltip:0 "Move the families into the stone houses."
 kehillah_crisis_shelter_decision_confirm:0 "Move them"
 kehillah_crisis_bar_decision:0 "Bar the Quarter"
 kehillah_crisis_bar_decision_desc:0 "Chains across the street ends, and a man at every door."
 kehillah_crisis_bar_decision_tooltip:0 "Bar the quarter's streets."
 kehillah_crisis_bar_decision_confirm:0 "Bar it"
 kehillah_crisis_plead_decision:0 "Beg the Lord to Send His Men"
 kehillah_crisis_plead_decision_desc:0 "The host is on the road. Only the lord's soldiers can stop it now."
 kehillah_crisis_plead_decision_tooltip:0 "Go to the lord and beg for his soldiers."
 kehillah_crisis_plead_decision_confirm:0 "Go to him"

 kehillah_crisis_race.0200.t:0 "Before the Lord"
 kehillah_crisis_race.0200.desc:0 "[kehillah_crisis_lord.GetTitledFirstName] hears me out in his hall. His captains stand at the wall and say nothing. Everyone here knows the host is on the road, and everyone knows what it will cost him to stand in its way."
 kehillah_crisis_race.0200.a:0 "Throw myself on his mercy."
 kehillah_crisis_race.0200.success:0 "He sends his men"
 kehillah_crisis_race.0200.failure:0 "He will not risk his men for us"
 kehillah_crisis_race.0200.success_toast:0 "[kehillah_crisis_lord.GetTitledFirstName] sends his men to stand in the quarter."
 kehillah_crisis_race.0200.failure_toast:0 "[kehillah_crisis_lord.GetTitledFirstName] will not risk his men for us. The quarter must look to itself."
 kehillah_toast_success:0 "Success!"
 kehillah_toast_failure:0 "Failure"
 kehillah_toast_event_toast_text_good:0 "$kehillah_toast_success$"
 kehillah_toast_event_toast_text_bad:0 "$kehillah_toast_failure$"
 kehillah_toast_event_toast_effect_good:0 "$kehillah_toast_success$"
 kehillah_toast_event_toast_effect_bad:0 "$kehillah_toast_failure$"

 # Step 1e: openings.

 kehillah_crisis_forgive_decision:0 "Forgive the Debts"
 kehillah_crisis_forgive_decision_desc:0 "Forgive what the townsmen owe. It will cost the community dearly, and it is the surest way to calm them."
 kehillah_crisis_forgive_decision_tooltip:0 "Forgive the townsmen's debts."
 kehillah_crisis_forgive_decision_confirm:0 "Forgive them"

 kehillah_crisis_race.0300.t:0 "Crisis: Debts and a Dear Year"
 kehillah_crisis_race.0300.desc:0 "The harvest was poor and the lord's taxes were not. Half the town owes money to someone in the quarter, the bonds are falling due, and no one has the coin. [kehillah_crisis_agitator_scope.GetFirstName], who owes more than most, has started saying in the market that a debt to a Jew is no debt at all.\n\nThe first time, people laughed. Now they ask to hear it again."
 kehillah_crisis_race.0300.a:0 "We must see to this before it spreads."
 kehillah_crisis_race.0310.t:0 "Crisis: Holy Week"
 kehillah_crisis_race.0310.desc:0 "Easter is coming, and with it the sermons of the Passion. This year [kehillah_crisis_agitator_scope.GetFirstName] preaches them in the street, and he does not let the crowd forget who he says is to blame.\n\nIn some towns it is a custom to throw stones at the Jews' doors on Good Friday."
 kehillah_crisis_race.0310.a:0 "We must see the community through the week."

 kehillah_crisis.0030.t:0 "The Vow-Takers"
 kehillah_crisis.0030.desc:0 "A dozen men with crosses sewn to their cloaks drink in the tavern by the bridge. They are waiting for the season to march east, and they are short of money for the road. One of them asks, loud enough for the street to hear, why they should go so far to fight the enemies of Christ when some live here."
 kehillah_crisis.0030.a:0 "Pay for their road east, and let them go."
 kehillah_crisis.0030.b:0 "Ask the bishop to remind them what the Pope has said of the Jews."
 kehillah_crisis.0030.b.success:0 "The bishop speaks, and they listen"
 kehillah_crisis.0030.b.success_desc:0 "The bishop speaks, and they listen."
 kehillah_crisis.0030.b.failure:0 "The bishop will not be drawn"
 kehillah_crisis.0030.b.failure_desc:0 "The bishop will not be drawn."
 kehillah_crisis.0030.c:0 "Stay out of their sight until they march."
 kehillah_crisis.0031.t:0 "The Witness Wavers"
 kehillah_crisis.0031.desc:0 "The man who swore to the charge against us has been seen drinking alone, and his story has grown smaller each time he tells it. [kehillah_crisis_agitator_scope.GetFirstName] keeps him close."
 kehillah_crisis.0031.a:0 "Bring him before the lord, and let him say it there."
 kehillah_crisis.0031.a.success:0 "He takes it back before the lord"
 kehillah_crisis.0031.a.success_desc:0 "He takes it back before the lord."
 kehillah_crisis.0031.a.failure:0 "He holds to his story"
 kehillah_crisis.0031.a.failure_desc:0 "He holds to his story."
 kehillah_crisis.0031.b:0 "Leave him be. A man pushed may push back."
 kehillah_crisis.0032.t:0 "The Debtors Meet"
 kehillah_crisis.0032.desc:0 "The men who owe money in the quarter have started meeting in the back room of a tavern. [kehillah_crisis_agitator_scope.GetFirstName] does most of the talking. The boy who serves them also runs errands for our families, and he says they spent last night talking about the chest where the bonds are kept."
 kehillah_crisis.0032.a:0 "Ease the terms for the poorest of them."
 kehillah_crisis.0032.b:0 "Lodge the bonds with the lord's officers, where no fire can reach them."
 kehillah_crisis.0032.c:0 "A debt is a debt."
 kehillah_crisis.0033.t:0 "Stones on Good Friday"
 kehillah_crisis.0033.desc:0 "It is said that in some towns the bishop himself opens Holy Week by calling the people to throw stones at the Jews' houses. Here no one has called them yet, but the boys of the parish have been gathering stones all week."
 kehillah_crisis.0033.a:0 "Pay the bishop to forbid it."
 kehillah_crisis.0033.b:0 "Everyone indoors, shutters closed, until Easter is past."
 kehillah_crisis.0033.c:0 "Our men will stand at the doors."
 kehillah_crisis.0034.t:0 "Verses in the Souk"
 kehillah_crisis.0034.desc:0 "A poem is going around the market. It says that the Jews have grown rich and proud under this ruler, and that a believer should be ashamed to bow to one of them. [kehillah_crisis_agitator_scope.GetFirstName] did not write it, but he recites it well."
 kehillah_crisis.0034.a:0 "Let our people at court step back for a season."
 kehillah_crisis.0034.b:0 "Answer verse with verse."
 kehillah_crisis.0034.b.success:0 "Our answer is the better poem"
 kehillah_crisis.0034.b.success_desc:0 "Our answer is the better poem."
 kehillah_crisis.0034.b.failure:0 "Theirs is the one people remember"
 kehillah_crisis.0034.b.failure_desc:0 "Theirs is the one people remember."
 kehillah_crisis.0034.c:0 "Verses are only words."
 # 2026-11-01: the second warning event of each opening.
 kehillah_crisis.0035.t:0 "Others Come Forward"
 kehillah_crisis.0035.desc:0 "The charge has new witnesses. A carter says he saw something by the river; a washerwoman says she heard something through a wall. None of them said a word until [kehillah_crisis_agitator_scope.GetFirstName] began buying their drinks."
 kehillah_crisis.0035.a:0 "Take their names to the lord. Swearing falsely before him is a crime."
 kehillah_crisis.0035.a.success:0 "The witnesses lose their nerve"
 kehillah_crisis.0035.a.success_desc:0 "The witnesses lose their nerve."
 kehillah_crisis.0035.a.failure:0 "The lord shrugs, and the witnesses grow bolder"
 kehillah_crisis.0035.a.failure_desc:0 "The lord shrugs, and the witnesses grow bolder."
 kehillah_crisis.0035.b:0 "Find neighbours who will swear for us, and pay them for their trouble."
 kehillah_crisis.0035.c:0 "Say nothing. Every answer is another telling."
 kehillah_crisis.0036.t:0 "A Debtor's Ruin"
 kehillah_crisis.0036.desc:0 "The bailiff came this morning to a cooper's house with the lord's warrant and one of our bonds. By noon the man's tools were in the street, and his neighbours had stopped working to watch. [kehillah_crisis_agitator_scope.GetFirstName] was there before the bailiff left."
 kehillah_crisis.0036.a:0 "Release him from the debt."
 kehillah_crisis.0036.b:0 "Pay the lender out of the community's chest, and let the man keep his house."
 kehillah_crisis.0036.c:0 "The bailiff has the lord's warrant. The law is the law."
 kehillah_crisis.0037.t:0 "The Passion Play"
 kehillah_crisis.0037.desc:0 "The town is staging its Passion play in the square before the church. This year the men who play the Jews are to wear false beards and carry money-bags, and the boys who will watch have been practising the jeers for a week."
 kehillah_crisis.0037.a:0 "Ask the priest who stages it to change the scene."
 kehillah_crisis.0037.a.success:0 "The beards and money-bags are left out"
 kehillah_crisis.0037.a.success_desc:0 "The beards and money-bags are left out."
 kehillah_crisis.0037.a.failure:0 "The priest will not change a word"
 kehillah_crisis.0037.a.failure_desc:0 "The priest will not change a word."
 kehillah_crisis.0037.b:0 "Close the quarter's gate on the day of the play."
 kehillah_crisis.0037.c:0 "Let them play what they like."
 kehillah_crisis.0038.t:0 "The Preacher of the Cross"
 kehillah_crisis.0038.desc:0 "A monk has come down the valley preaching the holy war, and the crowds follow him from town to town. He tells them the enemies of the cross are not only abroad, and that a man who takes the vow should begin at home. [kehillah_crisis_agitator_scope.GetFirstName] walks at his side."
 kehillah_crisis.0038.a:0 "Write to the great abbots. A preacher of the cross answers to his order."
 kehillah_crisis.0038.a.success:0 "An abbot sends him back to his cloister"
 kehillah_crisis.0038.a.success_desc:0 "An abbot sends him back to his cloister."
 kehillah_crisis.0038.a.failure:0 "The letters go unanswered"
 kehillah_crisis.0038.a.failure_desc:0 "The letters go unanswered."
 kehillah_crisis.0038.b:0 "Ask the lord to send him on his way."
 kehillah_crisis.0038.b.success:0 "The lord's men escort him out of the county"
 kehillah_crisis.0038.b.success_desc:0 "The lord's men escort him out of the county."
 kehillah_crisis.0038.b.failure:0 "The lord will not touch a holy man"
 kehillah_crisis.0038.b.failure_desc:0 "The lord will not touch a holy man."
 kehillah_crisis.0038.c:0 "Endure it. He will march east with the rest of them."
