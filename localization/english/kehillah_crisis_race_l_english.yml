l_english:
 # Step 1b: the agitator's following, and the warning events' catalysts.
 kehillah_crisis_following_catalyst:0 "His following"
 kehillah_crisis_following_catalyst_desc:0 "Each month, the men who have joined the agitator bring others."
 kehillah_crisis_ev_threats_catalyst:0 "Threats go unanswered"
 kehillah_crisis_ev_threats_catalyst_desc:0 "The words on the door were wiped away, and whoever wrote them was not named."
 kehillah_crisis_ev_market_turns_catalyst:0 "The market turns"
 kehillah_crisis_ev_market_turns_catalyst_desc:0 "Men who warned customers away saw that it worked."
 kehillah_crisis_ev_watch_thins_catalyst:0 "The watch thins"
 kehillah_crisis_ev_watch_thins_catalyst_desc:0 "Fewer of our men walk the street at night."
 kehillah_crisis_ev_sermon_catalyst:0 "A sermon goes unanswered"
 kehillah_crisis_ev_sermon_catalyst_desc:0 "The agitator preached in the market, and no one stopped him."
 kehillah_crisis_ev_rumor_catalyst:0 "The missing child"
 kehillah_crisis_ev_rumor_catalyst_desc:0 "A child went missing, and the town has decided who is to blame."
 kehillah_crisis_ev_indoors_catalyst:0 "Shuttered windows"
 kehillah_crisis_ev_indoors_catalyst_desc:0 "We hid while the town searched. They noticed."
 kehillah_crisis_ev_follower_kept_catalyst:0 "A follower holds firm"
 kehillah_crisis_ev_follower_kept_catalyst_desc:0 "We tried to win back a man who joined the agitator, and failed."
 kehillah_crisis_ev_convert_catalyst:0 "A convert's charges"
 kehillah_crisis_ev_convert_catalyst_desc:0 "A man who left us tells the town what we are said to do in secret."
 kehillah_crisis_ev_witnesses_catalyst:0 "Witnesses to the threats"
 kehillah_crisis_ev_witnesses_catalyst_desc:0 "The threats were recorded before witnesses."
 kehillah_crisis_ev_market_covered_catalyst:0 "The stalls stay open"
 kehillah_crisis_ev_market_covered_catalyst_desc:0 "The community covered its merchants' losses, and the market carried on."
 kehillah_crisis_ev_market_closed_catalyst:0 "The stalls close"
 kehillah_crisis_ev_market_closed_catalyst_desc:0 "We gave the troublemakers nothing to fight over."
 kehillah_crisis_ev_neighbours_catalyst:0 "Neighbours speak for us"
 kehillah_crisis_ev_neighbours_catalyst_desc:0 "Townspeople who trade with the quarter speak up in the taverns and at the well."
 kehillah_crisis_ev_watch_paid_catalyst:0 "The watch is paid"
 kehillah_crisis_ev_watch_paid_catalyst_desc:0 "The men of the watch stay at their posts."
 kehillah_crisis_ev_wardens_catalyst:0 "The wardens move him on"
 kehillah_crisis_ev_wardens_catalyst_desc:0 "The market wardens sent the agitator away from the stalls."
 kehillah_crisis_ev_bailiff_catalyst:0 "The bailiff keeps the peace"
 kehillah_crisis_ev_bailiff_catalyst_desc:0 "The lord's bailiff made it known that the market is no place for sermons."
 kehillah_crisis_ev_child_found_catalyst:0 "The child is found"
 kehillah_crisis_ev_child_found_catalyst_desc:0 "The missing child was found alive, and our people helped find him."
 kehillah_crisis_ev_lord_proclaims_catalyst:0 "The lord's men search"
 kehillah_crisis_ev_lord_proclaims_catalyst_desc:0 "The lord's men searched for the child, and the lord's name is on the matter."
 kehillah_crisis_ev_brawl_settled_catalyst:0 "The brawl is settled"
 kehillah_crisis_ev_brawl_settled_catalyst_desc:0 "The fight at the well was settled before it became a feud."
 kehillah_crisis_ev_brawl_judged_catalyst:0 "The Bet Din judges its own"
 kehillah_crisis_ev_brawl_judged_catalyst_desc:0 "The town saw the community punish its own young man."
 kehillah_crisis_ev_follower_won_catalyst:0 "A follower is won back"
 kehillah_crisis_ev_follower_won_catalyst_desc:0 "A man who joined the agitator thought better of it."
 kehillah_crisis_ev_convert_answered_catalyst:0 "The convert is answered"
 kehillah_crisis_ev_convert_answered_catalyst_desc:0 "His charges were answered in the square, and the crowd laughed at him."
 kehillah_crisis_ev_convert_gone_catalyst:0 "The convert leaves"
 kehillah_crisis_ev_convert_gone_catalyst_desc:0 "He has taken his charges to another town."

 # Step 1b: the new warning events.
 kehillah_crisis.0020.t:0 "A Sermon in the Market"
 kehillah_crisis.0020.desc:0 "[kehillah_crisis_agitator_scope.GetFirstName] has set up on the steps by the cloth hall. He tells the crowd that the Jews of the quarter mock their Lord, and the crowd listens. Some of them are men who owe us money.\n\nOur people have stopped going to market."
 kehillah_crisis.0020.a:0 "Let him talk himself hoarse."
 kehillah_crisis.0020.b:0 "Pay the market wardens to move him on."
 kehillah_crisis.0020.c:0 "Ask the lord's bailiff to keep the peace."
 kehillah_crisis.0020.c.success:0 "The bailiff sends him on his way"
 kehillah_crisis.0020.c.failure:0 "The bailiff shrugs"
 kehillah_crisis.0021.t:0 "A Child Is Missing"
 kehillah_crisis.0021.desc:0 "A tanner's boy did not come home last night. By morning his mother is at the church door, and by noon men are saying he was last seen near the quarter.\n\n[kehillah_crisis_agitator_scope.GetFirstName] has not said a word about it yet. He does not need to."
 kehillah_crisis.0021.a:0 "Our people will join the search, and ask who saw him last."
 kehillah_crisis.0021.a.success:0 "The boy is found, asleep in a hayloft"
 kehillah_crisis.0021.a.failure:0 "The boy is not found, and the questions turn on us"
 kehillah_crisis.0021.b:0 "Ask the lord to send his men to search."
 kehillah_crisis.0021.c:0 "Keep everyone indoors until it is over."
 kehillah_crisis.0022.t:0 "A Brawl at the Well"
 kehillah_crisis.0022.desc:0 "One of our young men answered an apprentice's insult with his fists. The apprentice's nose is broken, and his master wants justice. Half the street watched it happen."
 kehillah_crisis.0022.a:0 "Hand the boy to the lord's court."
 kehillah_crisis.0022.b:0 "The Bet Din will judge him, and judge him hard."
 kehillah_crisis.0022.c:0 "Pay the apprentice's master for the injury."
 kehillah_crisis.0023.t:0 "A Follower Joins"
 kehillah_crisis.0023.desc_named:0 "[kehillah_crisis_follower.GetTitledFirstName] of the lord's household has been seen beside [kehillah_crisis_agitator_scope.GetFirstName] at his sermons. Where a man of his standing goes, others follow."
 kehillah_crisis.0023.desc:0 "A master of the weavers' guild has been seen beside [kehillah_crisis_agitator_scope.GetFirstName] at his sermons. Where a man of his standing goes, others follow."
 kehillah_crisis.0023.a:0 "Win him back before he commits: a gift, and a word."
 kehillah_crisis.0023.a.success:0 "He keeps his distance from the sermons"
 kehillah_crisis.0023.a.failure:0 "He keeps the gift, and his place in the crowd"
 kehillah_crisis.0023.b:0 "We cannot stop every man who listens to him."
 kehillah_crisis.0023.b.tt:0 "His following grows, and it adds to the Armed host each month."
 kehillah_crisis.0024.t:0 "A Convert Speaks"
 kehillah_crisis.0024.desc:0 "A man who grew up in the quarter and was baptized last year now stands beside [kehillah_crisis_agitator_scope.GetFirstName]. He tells the crowd what he says we do behind our doors, and because he was one of us, they believe him."
 kehillah_crisis.0024.a:0 "Answer him in the square: our learning against his charges."
 kehillah_crisis.0024.a.success:0 "His charges fall apart"
 kehillah_crisis.0024.a.failure:0 "The crowd hears only him"
 kehillah_crisis.0024.b:0 "Pay him to take his charges to another town."
 kehillah_crisis.0024.c:0 "Let him talk. No one who knows us will believe him."

 # Step 1c: actions.
 kehillah_crisis_once_per_crisis_tt:0 "Not yet done in this crisis"
 kehillah_crisis_protection_won_catalyst:0 "Protection won"
 kehillah_crisis_protection_won_catalyst_desc:0 "Word spreads that the community has a protector."
 kehillah_crisis_act_answered_catalyst:0 "He is answered in public"
 kehillah_crisis_act_answered_catalyst_desc:0 "The agitator was answered before the town, and came off worse."
 kehillah_crisis_act_answer_failed_catalyst:0 "Our answer falls flat"
 kehillah_crisis_act_answer_failed_catalyst_desc:0 "We answered the agitator in public, and the crowd took his side."
 kehillah_crisis_act_town_catalyst:0 "The council is won over"
 kehillah_crisis_act_town_catalyst_desc:0 "The town council and the guild masters want no trouble in their streets."
 kehillah_crisis_act_discredited_catalyst:0 "The agitator is discredited"
 kehillah_crisis_act_discredited_catalyst_desc:0 "What the agitator would rather hide is now known in the town."
 kehillah_crisis_act_exposed_catalyst:0 "Caught digging"
 kehillah_crisis_act_exposed_catalyst_desc:0 "Word spread that the Jews pay men to slander a preacher."
 kehillah_crisis_act_appeal_catalyst:0 "A letter from on high"
 kehillah_crisis_act_appeal_catalyst_desc:0 "A letter has come condemning violence against the Jews."
 kehillah_crisis_act_fast_catalyst:0 "A public fast"
 kehillah_crisis_act_fast_catalyst_desc:0 "The community fasted and prayed, and the town saw it."
 kehillah_crisis_act_neighbours_catalyst:0 "Neighbours before the council"
 kehillah_crisis_act_neighbours_catalyst_desc:0 "Townspeople who trade with the quarter spoke for us before the council."

 kehillah_crisis_protection_decision:0 "Seek Protection"
 kehillah_crisis_protection_decision_desc:0 "Ask the lord, his overlord or the Church to protect the quarter."
 kehillah_crisis_protection_decision_tooltip:0 "Ask the lord, his overlord or the Church for protection."
 kehillah_crisis_protection_decision_confirm:0 "Seek protection"
 kehillah_crisis_protection_decision_effect_tt:0 "Choose whom to ask. Protection won adds to Spared each month, and once more when it is first won."
 kehillah_crisis_camp_decision:0 "Go to the Agitator's Camp"
 kehillah_crisis_camp_decision_desc:0 "Go out to the agitator, and see whether he can be reasoned with or bought."
 kehillah_crisis_camp_decision_tooltip:0 "Go out to the agitator's camp."
 kehillah_crisis_camp_decision_confirm:0 "Go"
 kehillah_crisis_camp_decision_effect_tt:0 "You leave the quarter for a few days. If he can be turned away, the danger passes."
 kehillah_crisis_answer_decision:0 "Answer Him in Public"
 kehillah_crisis_answer_decision_desc:0 "The agitator's charges will be answered before the town, by our most learned voice."
 kehillah_crisis_answer_decision_tooltip:0 "Answer the agitator in public."
 kehillah_crisis_answer_decision_confirm:0 "Answer him"
 kehillah_crisis_town_decision:0 "Win the Town"
 kehillah_crisis_town_decision_desc:0 "Gifts to the town council and the guild masters, who want no trouble in their streets."
 kehillah_crisis_town_decision_tooltip:0 "Send gifts to the council and the guilds."
 kehillah_crisis_town_decision_confirm:0 "Send the gifts"
 kehillah_crisis_discredit_decision:0 "Discredit Him"
 kehillah_crisis_discredit_decision_desc:0 "Every preacher has a past. Find his, and make it known."
 kehillah_crisis_discredit_decision_tooltip:0 "Look into the agitator's past."
 kehillah_crisis_discredit_decision_confirm:0 "Start asking"
 kehillah_crisis_appeal_decision:0 "Appeal to the Emperor or the Head of the Faith"
 kehillah_crisis_appeal_decision_desc:0 "A letter asking for a condemnation of violence against the Jews. It will be months before an answer comes."
 kehillah_crisis_appeal_decision_tooltip:0 "Send an appeal for a condemnation."
 kehillah_crisis_appeal_decision_confirm:0 "Send the letter"
 kehillah_crisis_appeal_decision_effect_tt:0 "In about two and a half months, if the warning lasts: #P +[GetPlayer.MakeScope.ScriptValue('kehillah_crisis_appeal_points')|0]#! toward Spared, and the condemnation protects the quarter each month. This is the community's one task until then."
 kehillah_crisis_fast_decision:0 "Proclaim a Fast"
 kehillah_crisis_fast_decision_desc:0 "The community will fast and pray in the synagogue."
 kehillah_crisis_fast_decision_tooltip:0 "Proclaim a public fast."
 kehillah_crisis_fast_decision_confirm:0 "Proclaim it"
 kehillah_crisis_neighbours_decision:0 "Ask the Neighbours to Speak"
 kehillah_crisis_neighbours_decision_desc:0 "The townspeople who offered to speak for us could say it before the council."
 kehillah_crisis_neighbours_decision_tooltip:0 "Ask our neighbours to speak before the council."
 kehillah_crisis_neighbours_decision_confirm:0 "Ask them"

 kehillah_crisis_race.0100.t:0 "Answered in Public"
 kehillah_crisis_race.0100.desc:0 "The square is full. [kehillah_crisis_agitator_scope.GetFirstName] has repeated his charges for weeks, and today someone will answer them where the town can hear. The crowd came for a show, and will decide who won it."
 kehillah_crisis_race.0100.a:0 "The Dayyan answers him: a more learned voice than mine."
 kehillah_crisis_race.0100.b:0 "I will answer him myself."
 kehillah_crisis_race.0100.success:0 "The crowd laughs at him, not at us"
 kehillah_crisis_race.0100.failure:0 "The crowd hears only him"
 kehillah_crisis_race.0110.t:0 "Every Preacher Has a Past"
 kehillah_crisis_race.0110.desc:0 "[kehillah_crisis_agitator_scope.GetFirstName] came to this town from somewhere else, and men do not usually leave home for no reason. A debt, a woman, a teacher who sent him away: whatever it is, someone knows it."
 kehillah_crisis_race.0110.a:0 "The Shtadlan knows whom to ask."
 kehillah_crisis_race.0110.b:0 "I will ask the questions myself."
 kehillah_crisis_race.0110.c:0 "Think better of it."
 kehillah_crisis_race.0110.success:0 "His past catches up with him"
 kehillah_crisis_race.0110.failure:0 "We are caught asking"

 # Step 1d: the Armed race.
 kehillah_community_crisis_kehillah_crisis_held_situation_phase:0 "Quarter held"
 kehillah_community_crisis_kehillah_crisis_struck_situation_phase:0 "Quarter struck"
 kehillah_crisis_held:0 "Quarter held"
 kehillah_crisis_held_desc:0 "The host has gone, and the quarter stands. We wait for the sovereign's answer."
 kehillah_crisis_struck:0 "Quarter struck"
 kehillah_crisis_struck_desc:0 "The host has broken into the quarter. What follows will be counted for years."
 kehillah_crisis_struck_catalyst:0 "The quarter falls"
 kehillah_crisis_struck_catalyst_desc:0 "The host broke into the quarter."
 kehillah_crisis_held_watch_catalyst:0 "The watch stands"
 kehillah_crisis_held_watch_catalyst_desc:0 "The watch we posted is still at the street ends."
 kehillah_crisis_held_supplies_catalyst:0 "Provisions laid in"
 kehillah_crisis_held_supplies_catalyst_desc:0 "The quarter has bread and water for a siege."
 kehillah_crisis_held_routes_catalyst:0 "A way out"
 kehillah_crisis_held_routes_catalyst_desc:0 "The families know where to go if the gates give."
 kehillah_crisis_held_men_catalyst:0 "The lord's men"
 kehillah_crisis_held_men_catalyst_desc:0 "A lord promised his soldiers, and they are coming."
 kehillah_crisis_held_refuge_catalyst:0 "Behind the lord's walls"
 kehillah_crisis_held_refuge_catalyst_desc:0 "The families are sheltered in a lord's castle or a bishop's palace."
 kehillah_crisis_held_arms_catalyst:0 "Arms in the quarter"
 kehillah_crisis_held_arms_catalyst_desc:0 "Our men are armed."
 kehillah_crisis_held_condemned_catalyst:0 "Condemned by the Church"
 kehillah_crisis_held_condemned_catalyst_desc:0 "The host marches under the Church's condemnation, and some of its men have gone home."
 kehillah_crisis_held_silver_catalyst:0 "Silver for the host"
 kehillah_crisis_held_silver_catalyst_desc:0 "Silver sent to the host's leaders slows the march and cools the anger."
 kehillah_crisis_held_shelter_catalyst:0 "The stone houses"
 kehillah_crisis_held_shelter_catalyst_desc:0 "The families have moved into the stone houses at the heart of the quarter."
 kehillah_crisis_held_bar_catalyst:0 "The quarter is barred"
 kehillah_crisis_held_bar_catalyst_desc:0 "Chains across the street ends, and a man at every door."
 kehillah_crisis_held_lord_catalyst:0 "The lord sends his men"
 kehillah_crisis_held_lord_catalyst_desc:0 "The lord answered our plea and sent his men."
 kehillah_crisis_acc_protected_catalyst:0 "The lord cleared the street"
 kehillah_crisis_acc_protected_catalyst_desc:0 "When the charge was first made, the lord's men sent the crowd home."
 kehillah_crisis_acc_exposed_catalyst:0 "The lie exposed"
 kehillah_crisis_acc_exposed_catalyst_desc:0 "The accuser was shamed before the town."
 kehillah_crisis_acc_gates_catalyst:0 "Rage spent on the gates"
 kehillah_crisis_acc_gates_catalyst_desc:0 "The crowd rioted outside the barred gates and went home tired."
 kehillah_crisis_acc_refused_catalyst:0 "No help came"
 kehillah_crisis_acc_refused_catalyst_desc:0 "When the charge was first made, no one stood between the crowd and the quarter."
 kehillah_crisis_acc_caught_catalyst:0 "Buying witnesses"
 kehillah_crisis_acc_caught_catalyst_desc:0 "Word got out that the Jews were questioning witnesses, and the town took it for guilt."
 kehillah_crisis_struck_muster_catalyst:0 "The host gathers"
 kehillah_crisis_struck_muster_catalyst_desc:0 "Every few days more men join the host and take up arms."
 kehillah_crisis_struck_march_catalyst:0 "The host draws nearer"
 kehillah_crisis_struck_march_catalyst_desc:0 "Every few days the host is closer, and larger."
 kehillah_crisis_struck_siege_catalyst:0 "The siege"
 kehillah_crisis_struck_siege_catalyst_desc:0 "Every few days at the gates, the host presses harder."
 kehillah_crisis_struck_handover_catalyst:0 "The lord gives us up"
 kehillah_crisis_struck_handover_catalyst_desc:0 "The lord who sheltered us has opened his gates to the host."
 kehillah_crisis_struck_lord_refused_catalyst:0 "The lord refuses"
 kehillah_crisis_struck_lord_refused_catalyst_desc:0 "We begged the lord for his men, and he would not send them."

 kehillah_crisis_silver_decision:0 "Send Silver to the Host"
 kehillah_crisis_silver_decision_desc:0 "Silver sent ahead to the host's leaders, so that the march slows and the anger cools."
 kehillah_crisis_silver_decision_tooltip:0 "Send silver to the host's leaders."
 kehillah_crisis_silver_decision_confirm:0 "Send it"
 kehillah_crisis_shelter_decision:0 "Shelter in the Stone Houses"
 kehillah_crisis_shelter_decision_desc:0 "The families leave their homes and crowd into the stone houses at the heart of the quarter."
 kehillah_crisis_shelter_decision_tooltip:0 "Move the families into the stone houses."
 kehillah_crisis_shelter_decision_confirm:0 "Move them"
 kehillah_crisis_bar_decision:0 "Bar the Quarter"
 kehillah_crisis_bar_decision_desc:0 "Chains across the street ends, and a man at every door."
 kehillah_crisis_bar_decision_tooltip:0 "Bar the quarter's streets."
 kehillah_crisis_bar_decision_confirm:0 "Bar it"
 kehillah_crisis_plead_decision:0 "Beg the Lord to Send His Men"
 kehillah_crisis_plead_decision_desc:0 "The host is on the road. Only the lord's soldiers can stop it now."
 kehillah_crisis_plead_decision_tooltip:0 "Go to the lord and beg for his soldiers."
 kehillah_crisis_plead_decision_confirm:0 "Go to him"

 kehillah_crisis_race.0200.t:0 "Before the Lord"
 kehillah_crisis_race.0200.desc:0 "[kehillah_crisis_lord.GetTitledFirstName] hears me out in his hall. His captains stand at the wall and say nothing. Everyone here knows the host is on the road, and everyone knows what it will cost him to stand in its way."
 kehillah_crisis_race.0200.a:0 "Throw myself on his mercy."
 kehillah_crisis_race.0200.success:0 "He sends his men"
 kehillah_crisis_race.0200.failure:0 "He will not risk his men for us"

 # Step 1e: openings.
 kehillah_crisis_opening_preacher_catalyst:0 "A preacher arrives"
 kehillah_crisis_opening_preacher_catalyst_desc:0 "A wandering preacher has come to the town and names the Jews in his sermons."
 kehillah_crisis_opening_accusation_catalyst:0 "An accusation"
 kehillah_crisis_opening_accusation_catalyst_desc:0 "A charge against the community has not died down, and a man in the town keeps it alive."
 kehillah_crisis_opening_crusade_catalyst:0 "Crusaders on the road"
 kehillah_crisis_opening_crusade_catalyst_desc:0 "Men have taken the cross, and some ask why they should march abroad while unbelievers live at home."
 kehillah_crisis_opening_debts_catalyst:0 "Debts and a dear year"
 kehillah_crisis_opening_debts_catalyst_desc:0 "Hard times have made the townsmen's debts heavy, and some would rather burn the bonds than pay them."
 kehillah_crisis_opening_holy_week_catalyst:0 "Holy Week"
 kehillah_crisis_opening_holy_week_catalyst_desc:0 "The sermons of the Passion name the Jews, and the crowd remembers."
 kehillah_crisis_opening_vizier_catalyst:0 "The vizier's enemies"
 kehillah_crisis_opening_vizier_catalyst_desc:0 "Rivals at court resent a Jew's power, and say so in the souk."
 kehillah_crisis_holy_week_catalyst:0 "Holy Week"
 kehillah_crisis_holy_week_catalyst_desc:0 "In the weeks before Easter, the sermons turn on the Jews."
 kehillah_crisis_ev_vows_catalyst:0 "The vow-takers"
 kehillah_crisis_ev_vows_catalyst_desc:0 "Men with crosses on their cloaks ask why they should go east first."
 kehillah_crisis_ev_vowtakers_gone_catalyst:0 "The vow-takers march on"
 kehillah_crisis_ev_vowtakers_gone_catalyst_desc:0 "We paid for their road, and they took it."
 kehillah_crisis_ev_bishop_reminds_catalyst:0 "The bishop's reminder"
 kehillah_crisis_ev_bishop_reminds_catalyst_desc:0 "The bishop reminded the vow-takers that the Pope has forbidden harm to the Jews."
 kehillah_crisis_ev_witness_holds_catalyst:0 "The witness holds"
 kehillah_crisis_ev_witness_holds_catalyst_desc:0 "The witness still swears to what he says he saw."
 kehillah_crisis_ev_witness_recants_catalyst:0 "The witness recants"
 kehillah_crisis_ev_witness_recants_catalyst_desc:0 "Before the lord, the witness took back his story."
 kehillah_crisis_ev_debtors_catalyst:0 "The debtors' anger"
 kehillah_crisis_ev_debtors_catalyst_desc:0 "Men who owe the community money meet in the taverns and talk about fire."
 kehillah_crisis_ev_debts_eased_catalyst:0 "Easier terms"
 kehillah_crisis_ev_debts_eased_catalyst_desc:0 "The poorest debtors were given time."
 kehillah_crisis_ev_bonds_lodged_catalyst:0 "The bonds are lodged"
 kehillah_crisis_ev_bonds_lodged_catalyst_desc:0 "The bonds are with the lord's officers now, and burning the quarter would not burn them."
 kehillah_crisis_ev_stones_catalyst:0 "Stones on Good Friday"
 kehillah_crisis_ev_stones_catalyst_desc:0 "Stones were thrown at the quarter's doors, and men stood in them."
 kehillah_crisis_ev_good_friday_indoors_catalyst:0 "Shutters closed for Easter"
 kehillah_crisis_ev_good_friday_indoors_catalyst_desc:0 "The quarter stayed indoors until Easter was past."
 kehillah_crisis_ev_bishop_forbids_catalyst:0 "The bishop forbids it"
 kehillah_crisis_ev_bishop_forbids_catalyst_desc:0 "For a payment, the bishop forbade the stoning, as at Béziers."
 kehillah_crisis_ev_verses_catalyst:0 "Verses in the souk"
 kehillah_crisis_ev_verses_catalyst_desc:0 "A poem against the Jews is recited in the market."
 kehillah_crisis_ev_official_steps_back_catalyst:0 "A step back from court"
 kehillah_crisis_ev_official_steps_back_catalyst_desc:0 "Our people at court stepped back for a season, and the rivals lost their target."
 kehillah_crisis_ev_verses_answered_catalyst:0 "Verse answered with verse"
 kehillah_crisis_ev_verses_answered_catalyst_desc:0 "Our answer was the better poem, and the souk laughed at theirs."
 kehillah_crisis_act_forgive_catalyst:0 "The debts are forgiven"
 kehillah_crisis_act_forgive_catalyst_desc:0 "The community forgave what the townsmen owed."

 kehillah_crisis_forgive_decision:0 "Forgive the Debts"
 kehillah_crisis_forgive_decision_desc:0 "Forgive what the townsmen owe. It will cost the community dearly, and it is the surest way to calm them."
 kehillah_crisis_forgive_decision_tooltip:0 "Forgive the townsmen's debts."
 kehillah_crisis_forgive_decision_confirm:0 "Forgive them"

 kehillah_crisis_race.0300.t:0 "Debts and a Dear Year"
 kehillah_crisis_race.0300.desc:0 "The harvest was poor and the lord's taxes were not. Half the town owes money to someone in the quarter, and [kehillah_crisis_agitator_scope.GetFirstName], who owes more than most, has started saying that a debt to a Jew is no debt at all.\n\nAt York they burned the bonds, and the people who held them."
 kehillah_crisis_race.0300.a:0 "We must see to this before it spreads."
 kehillah_crisis_race.0310.t:0 "Holy Week"
 kehillah_crisis_race.0310.desc:0 "Easter is coming, and with it the sermons of the Passion. This year [kehillah_crisis_agitator_scope.GetFirstName] preaches them in the street, and he does not let the crowd forget who he says is to blame.\n\nIn some towns it is a custom to throw stones at the Jews' doors on Good Friday."
 kehillah_crisis_race.0310.a:0 "We must see the community through the week."

 kehillah_crisis.0030.t:0 "The Vow-Takers"
 kehillah_crisis.0030.desc:0 "A dozen men with crosses sewn to their cloaks drink in the tavern by the bridge. They are waiting for the season to march east, and they are short of money for the road. One of them asks, loud enough for the street to hear, why they should go so far to fight the enemies of Christ when some live here."
 kehillah_crisis.0030.a:0 "Pay for their road east, and let them go."
 kehillah_crisis.0030.b:0 "Ask the bishop to remind them what the Pope has said of the Jews."
 kehillah_crisis.0030.b.success:0 "The bishop speaks, and they listen"
 kehillah_crisis.0030.b.failure:0 "The bishop will not be drawn"
 kehillah_crisis.0030.c:0 "Stay out of their sight until they march."
 kehillah_crisis.0031.t:0 "The Witness Wavers"
 kehillah_crisis.0031.desc:0 "The man who swore to the charge against us has been seen drinking alone, and his story has grown smaller each time he tells it. [kehillah_crisis_agitator_scope.GetFirstName] keeps him close."
 kehillah_crisis.0031.a:0 "Bring him before the lord, and let him say it there."
 kehillah_crisis.0031.a.success:0 "He takes it back before the lord"
 kehillah_crisis.0031.a.failure:0 "He holds to his story"
 kehillah_crisis.0031.b:0 "Leave him be. A man pushed may push back."
 kehillah_crisis.0032.t:0 "The Debtors Meet"
 kehillah_crisis.0032.desc:0 "The men who owe the community money have started meeting in the back room of a tavern. [kehillah_crisis_agitator_scope.GetFirstName] does most of the talking. Someone at the meeting has a cousin in the quarter, and the cousin says they talked about the chest where the bonds are kept."
 kehillah_crisis.0032.a:0 "Ease the terms for the poorest of them."
 kehillah_crisis.0032.b:0 "Lodge the bonds with the lord's officers, where no fire can reach them."
 kehillah_crisis.0032.c:0 "A debt is a debt."
 kehillah_crisis.0033.t:0 "Stones on Good Friday"
 kehillah_crisis.0033.desc:0 "It is said that in some towns the bishop himself opens Holy Week by calling the people to throw stones at the Jews' houses. Here no one has called them yet, but the boys of the parish have been gathering stones all week."
 kehillah_crisis.0033.a:0 "Pay the bishop to forbid it, as Béziers did."
 kehillah_crisis.0033.b:0 "Everyone indoors, shutters closed, until Easter is past."
 kehillah_crisis.0033.c:0 "Our men will stand at the doors."
 kehillah_crisis.0034.t:0 "Verses in the Souk"
 kehillah_crisis.0034.desc:0 "A poem is going around the market. It says that the Jews have grown rich and proud under this ruler, and that a believer should be ashamed to bow to one of them. [kehillah_crisis_agitator_scope.GetFirstName] did not write it, but he recites it well."
 kehillah_crisis.0034.a:0 "Let our people at court step back for a season."
 kehillah_crisis.0034.b:0 "Answer verse with verse."
 kehillah_crisis.0034.b.success:0 "Our answer is the better poem"
 kehillah_crisis.0034.b.failure:0 "Theirs is the one people remember"
 kehillah_crisis.0034.c:0 "Verses are only words."
