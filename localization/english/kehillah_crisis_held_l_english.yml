l_english:
 kehillah_crisis_held_accounting_decision:0 "Take Stock at the Gate"
 kehillah_crisis_held_accounting_decision_desc:0 "The quarter held against an armed host. Before the ruler's answer reaches us, tend the defenders and account for what happened at the edges of the quarter."
 kehillah_crisis_held_accounting_decision_tooltip:0 "Attend to the quarter after it held the gate."
 kehillah_crisis_held_accounting_decision_confirm:0 "Call the watch captains"
 kehillah_crisis_held_accounting_decision_effect_tt:0 "The elders take account of the held quarter."
 kehillah_crisis_held.0001.t:0 "The Gate Held"
 kehillah_crisis_held.0001.desc_damage:0 "The host has broken apart, and the gate has held. But the outer streets tell a harder story: shutters are splintered, goods lie in the mud, and the watch has not slept since the first shouting began. The quarter was not breached; those losses are still ours to reckon with while the ruler decides what the peace will mean."
 kehillah_crisis_held.0001.desc_clear:0 "The host has broken apart, and the gate has held. The watchmen return from the lanes exhausted, while families open their doors cautiously and count who sheltered where. The quarter was not breached, but the ruler's answer will decide how secure this peace can be."
 kehillah_crisis_held.0001.repair:0 "Open a fund to repair the outer streets."
 kehillah_crisis_held.0001.watch:0 "Put the watch on a rotation, so households can rest."
 kehillah_crisis_held.0001.account:0 "Set down the names and losses for the ruler's court."
 kehillah_crisis_held_set:0 "Quarter Held"
 kehillah_crisis_held_set_concept:0 "Quarter Held"
