l_english:
 # 2026-11-10: the situation list's phase line (gui/window_situation_list.gui, vbox_situation_entry).
 # Two changes from vanilla's "Current [situation_phase|E]: [Situation.GetTopCurrentPhase.GetName]":
 # - The phase type's name is a link, so hovering it shows the phase tooltip, as struggles do.
 #   This applies to every situation in the list, not only the Kehillah's.
 # - A Kehillah crisis adds its threat grade. kehillah_crisis_grade_tag is empty for every other
 #   situation.
 SITUATION_LIST_SITUATION_PHASE:0 "Current [situation_phase|E]: [Situation.GetTopCurrentPhase.GetType.GetName] #weak $kehillah_crisis_grade_tag$#!"
