l_english:
 # Faith-level Samaritan names. The faith's own display (faith rows, tooltips, adherent
 # text) reads the vanilla `samaritan*` keys, not the rite's `name`/`desc` fields, so these
 # must live in the replace folder. Keep in sync with kehillah_samaritan_rite_l_english.yml.
 samaritan:0 "Samaritanism"
 samaritan_adj:0 "Samaritan"
 samaritan_adherent:0 "Samaritan"
 samaritan_adherent_plural:0 "Samaritans"
 samaritan_desc:0 "Samaritanism is the religious tradition of the Samaritan communities of Samaria and Mount Gerizim. It centers on the Samaritan Pentateuch and the sanctity of Mount Gerizim rather than Jerusalem. Samaritans maintain their own priestly succession and understand their Torah as the Mosaic original; Rabbinic Judaism contests these claims and does not accept the Samaritan Pentateuch or its rejection of the Prophets and Oral Torah."
